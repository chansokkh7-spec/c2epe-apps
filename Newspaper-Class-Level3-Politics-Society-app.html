                19: { title: "Digital & Multimedia Texts", terms: ["Hypertext", "Multimedia element", "Interactive text", "Digital publishing", "Nonlinear reading", "Embedded media", "Digital annotation", "Reader engagement"], passage: "Digital and multimedia texts use hypertext and embedded media to create a genuinely interactive text. Digital publishing supports nonlinear reading and digital annotation, reshaping reader engagement compared to traditional print.", question: "How does reading a nonlinear, interactive digital text change the reading experience compared to a book?", funfact: "Did you know? Hypertext, the foundation of nearly all digital reading today, was first theorized decades before the internet became widely available." },
                20: { title: "Travel Writing", terms: ["Travel writing", "Journey", "Description", "Culture", "Narrative", "Observation", "Place", "Perspective"], passage: "Travel writing combines narrative with detailed description of place and culture. Careful observation and an honest perspective turn a journey into a meaningful story for readers.", question: "Which place would you most like to write about?", funfact: "Did you know? The 14th-century traveller Ibn Battuta journeyed tens of thousands of kilometres and recorded his travels in a famous book." },
                21: { title: "Science Journalism", terms: ["Science journalism", "Research", "Evidence", "Uncertainty", "Explain", "Expert", "Accuracy", "Public understanding"], passage: "Science journalism helps public understanding by explaining new research. Good reporters check evidence, quote an independent expert and explain uncertainty rather than exaggerating results, protecting accuracy.", question: "Why do science headlines sometimes exaggerate findings?", funfact: "Did you know? A single study rarely proves something — good science reporting explains how a new result fits with earlier research." },
                22: { title: "Book Reviews", terms: ["Review", "Summary", "Evaluation", "Plot", "Style", "Recommendation", "Critic", "Reader"], passage: "A book review gives a brief summary of the plot without spoilers, followed by evaluation of style and ideas. The critic ends with a recommendation to help the reader decide.", question: "What should a good book review include?", funfact: "Did you know? The New York Times Book Review was first published in 1896." },
                23: { title: "Speeches and Oratory", terms: ["Speech", "Oratory", "Audience", "Rhetoric", "Repetition", "Delivery", "Persuasion", "Historic"], passage: "Great oratory moves an audience. A historic speech uses rhetoric such as repetition, strong delivery and a clear message to achieve persuasion.", question: "Which famous speech do you find most powerful?", funfact: "Did you know? Martin Luther King Jr.'s 'I Have a Dream' speech was delivered in Washington, D.C., in 1963." },
                24: { title: "Data Journalism", terms: ["Data journalism", "Dataset", "Chart", "Analysis", "Trend", "Transparency", "Visualisation", "Evidence"], passage: "Data journalism uses a dataset and careful analysis to find each trend. A clear chart or visualisation presents evidence, and transparency about methods builds trust.", question: "How can data make a news story stronger?", funfact: "Did you know? In the 1850s, Florence Nightingale used innovative diagrams to show that many soldiers were dying from preventable disease." },
                25: { title: "Writing an Academic Essay", terms: ["Essay", "Thesis", "Paragraph", "Evidence", "Analysis", "Counterargument", "Conclusion", "Citation"], passage: "An academic essay starts with a clear thesis. Each paragraph presents evidence and analysis, a counterargument shows balance, and a strong conclusion and accurate citation complete the work.", question: "What is the hardest part of writing an essay for you?", funfact: "Did you know? The essay form is often traced to Michel de Montaigne, who published his 'Essais' in 1580." },
            },
        };
        Object.values(curriculum).forEach(g => Object.values(g).forEach(d => { d.vocab = d.terms; d.story = d.passage; }));

        const minWords = () => MIN_WORDS[state.level] || 3;
        function allTermsForLevel(level) {
            let words = [];

            return [...new Set(words)];

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_newspaper_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

        // On phones the lesson sits below the module list, so after choosing a module, a unit
        // or the next lesson, the page scrolls to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');

        function completeActivity() {
            markActivityComplete(state.tab);

            let gotBadge = false;

            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');

            const levelData = curriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % unitNumbers.length;
            state.unit = unitNumbers[nextIdx];
            document.getElementById('unit-select').value = state.unit;
            renderContent();
            scrollToLesson(true);

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }
        const countWords = (s) => (String(s).match(/[A-Za-z\u00C0-\u024F\u1780-\u17FF]+(?:['’-][A-Za-z]+)*/g) || []).length;

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function allVocabForLevel(level) {
            let words = [];
            Object.keys(curriculum[level]).forEach(u => words.push(...curriculum[level][u].vocab));
            return [...new Set(words)];
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }
        // The Video button shows 🆕 when this unit's video is new, and "(soon)" when there is none yet
        function updateVideoTabBadge() {
            const btn = document.querySelector('.tab-btn[data-tab="video"]');

        let ytPlayer = null;

        // Stops the video and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

            const showFallback = (why) => {

            ytFallbackTimer = setTimeout(() => { if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') showFallback('The video is taking long to load.'); }, 10000);

            const wanted = ytCurrentConfig.id;
            loadYouTubeApi().then(() => {
                if (!ytCurrentConfig || ytCurrentConfig.id !== wanted || !document.getElementById('yt-player-el')) return;
                ytPlayer = new YT.Player('yt-player-el', {

                    }
                });
            }).catch(() => showFallback('The video player could not load.'));

        const SUBTITLES = {"OC-NP3-Unit01-Government-Systems": [[0.35, 5.87, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.17, 9.69, "Hi! I'm Visal. Let's learn together!"], [9.99, 16.05, "Unit one: Government Systems. Today you will state governance requirements with the mandative subjunctive."], [16.35, 19.14, "Here is our lesson map. Let's start!"], [20.1, 23.62, "Part one: words. You will learn eight new words."], [24.48, 25.57, "Democracy."], [26.55, 30.67, "Democracy means a system in which citizens choose their leaders by voting."], [31.28, 34.56, "A democracy depends on free and fair elections."], [35.15, 38.08, "Your turn. Say: Democracy."], [40.93, 41.89, "Democracy."], [42.65, 43.92, "Constitution."], [44.92, 49.02, "Constitution means the basic written rules by which a country is governed."], [49.62, 52.75, "The constitution protects every citizen's rights."], [53.35, 56.42, "Your turn. Say: Constitution."], [59.27, 60.43, "Constitution."], [61.18, 62.3, "Legislature."], [63.32, 66.87, "Legislature means the group of people who make the laws of a country."], [67.48, 70.23, "The legislature passed the new education bill."], [70.82, 73.46, "Your turn. Say: Legislature."], [76.3, 77.53, "Legislature."], [78.28, 79.71, "Executive branch."], [80.72, 84.5, "Executive branch means the part of government that carries out the laws."], [85.12, 87.61, "The executive branch is led by the president."], [88.22, 91.45, "Your turn. Say: Executive branch."], [94.3, 95.86, "Executive branch."], [96.62, 97.7, "Judiciary."], [98.68, 101.76, "Judiciary means the courts and judges that interpret the law."], [102.35, 106.13, "An independent judiciary protects citizens from abuse."], [106.72, 109.56, "Your turn. Say: Judiciary."], [112.4, 113.37, "Judiciary."], [114.12, 116.02, "Separation of powers."], [117.02, 121.64, "Separation of powers means the division of government into branches that limit each other."], [122.25, 125.67, "The separation of powers prevents one group from ruling alone."], [126.25, 129.82, "Your turn. Say: Separation of powers."], [132.67, 134.38, "Separation of powers."], [135.12, 136.37, "Federal system."], [137.38, 142.41, "Federal system means a system that shares power between national and regional governments."], [143.02, 146.06, "In a federal system, each state has its own laws."], [146.65, 149.74, "Your turn. Say: Federal system."], [152.6, 153.73, "Federal system."], [154.48, 155.43, "Sovereignty."], [156.42, 159.55, "Sovereignty means the power of a country to govern itself."], [160.15, 162.97, "Citizens believe sovereignty belongs to the people."], [163.58, 166.35, "Your turn. Say: Sovereignty."], [169.2, 170.28, "Sovereignty."], [171.07, 174.64, "Part two: dialogue. Let's listen to a conversation."], [175.48, 183.2, "Visal, a constitution says 'It is essential that the executive branch be accountable to the legislature.' Why is 'be' used and not 'is'?"], [184.28, 197.37, "That is the mandative subjunctive. After words like essential, vital, demand and insist, we use the base verb for all subjects: that the judiciary remain independent."], [198.48, 200.46, "So there is no -s for he or she?"], [201.55, 211.58, "Correct. We say 'The law requires that the president submit a budget', not 'submits'. The negative is 'that the legislature not delay the vote'."], [212.68, 213.81, "Is it formal?"], [214.92, 223.75, "Yes, it is typical of constitutions and policy reports. In a democracy, citizens may insist that sovereignty rest with the people."], [224.9, 226.55, "Part three: grammar."], [227.42, 232.5, "Grammar focus: Mandative subjunctive: It is essential that plus base verb."], [232.8, 233.93, "Look at the pattern."], [234.62, 238.51, "It is essential that the executive branch be accountable to the legislature."], [239.42, 243.77, "The constitution demands that the judiciary remain independent of politicians."], [244.68, 247.51, "Citizens insist that sovereignty rest with the people."], [248.47, 257.19, "After essential, vital, demand, insist or require + that, use the base verb for every subject (he be, she submit). Negative: that he not delay."], [257.95, 261.85, "Be careful! Don't say: I demand that he apologises."], [263.8, 266.35, "Say: I demand that he apologise."], [266.64, 269.61, "After demand + that, use the base verb."], [270.4, 273.48, "Part four: reading. Read and listen."], [274.27, 275.72, "How Power Is Shared."], [276.02, 279.84, "A democracy depends on rules that no ruler can change alone."], [280.83, 289.1, "Most constitutions require that the legislature pass laws, that the executive branch carry them out, and that the judiciary remain independent."], [290.1, 294.65, "This separation of powers means that no single group can control the whole system."], [295.67, 301.47, "In a federal system, it is also vital that authority be divided between national and regional governments."], [302.47, 306.07, "Whatever the structure, sovereignty must ultimately belong to the people."], [307.17, 311.11, "Part five: quiz. Five questions. Are you ready?"], [311.95, 314.41, "It is essential that the president blank the law."], [314.71, 318.37, "A, obeys. B, obey. C, will obeying."], [321.93, 323.9, "The answer is B: obey."], [325.05, 328.12, "The power of a state to govern itself is called blank."], [328.42, 332.57, "A, sovereignty. B, a ballot. C, a treaty."], [336.13, 338.04, "The answer is A: sovereignty."], [339.18, 342.01, "The branch that interprets laws in court is the blank."], [342.31, 346.9, "A, legislature. B, executive branch. C, judiciary."], [350.47, 352.3, "The answer is C: judiciary."], [353.45, 355.06, "Choose the correct sentence."], [355.36, 362.14, "A, I demand that he apologises.. B, I demand that he apologise.. C, I demand that he to apologise.."], [365.7, 368.73, "The answer is B: I demand that he apologise.."], [369.88, 372.75, "According to the reading, no single group should control…"], [373.05, 378.46, "A, the whole system. B, the constitution only. C, every court."], [382.0, 384.83, "The answer is A: the whole system."], [386.03, 389.5, "Part six: speaking. It's your turn to talk."], [390.35, 393.87, "Why is the separation of powers important in a government system?"], [402.68, 404.16, "Now listen to Visal."], [404.46, 430.35, "The separation of powers matters because it stops any one person or group from holding all the power. When the legislature makes laws, the executive branch carries them out and the judiciary checks them, each branch can limit the others. This protects citizens from abuse, keeps officials accountable and makes it harder for a government to ignore the constitution."], [430.65, 432.17, "Excellent answer, Visal!"], [433.08, 439.3, "Great work! Now you can use eight new words and mandative subjunctive: it is essential that plus base verb."], [439.6, 444.99, "Today's value is civic awareness. Know your rights, and use them to build a fairer society."], [445.29, 447.83, "See you in Unit two. Goodbye!"], [448.13, 450.67, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit02-Elections-Voting": [[0.35, 5.9, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.2, 9.42, "Hi! I'm Visal. Let's learn together!"], [9.72, 15.61, "Unit two: Elections & Voting. Today you will emphasise election facts with negative inversion."], [15.91, 18.48, "Here is our lesson map. Let's start!"], [19.43, 22.46, "Part one: words. You will learn eight new words."], [23.32, 24.17, "Ballot."], [25.18, 29.35, "Ballot means a paper or screen on which a person records their vote."], [29.95, 32.69, "Each citizen casts one ballot in secret."], [33.28, 35.67, "Your turn. Say: Ballot."], [38.53, 39.4, "Ballot."], [40.15, 41.05, "Candidate."], [42.05, 45.0, "Candidate means a person who is trying to be elected."], [45.62, 48.6, "The candidate promised to improve public transport."], [49.22, 52.01, "Your turn. Say: Candidate."], [54.87, 55.8, "Candidate."], [56.55, 57.55, "Campaign."], [58.55, 61.98, "Campaign means a series of activities aimed at winning an election."], [62.58, 65.05, "The campaign lasted six exhausting months."], [65.65, 68.13, "Your turn. Say: Campaign."], [70.97, 71.93, "Campaign."], [72.68, 73.95, "Voter turnout."], [74.95, 78.83, "Voter turnout means the percentage of eligible people who actually vote."], [79.42, 82.37, "Voter turnout was highest among older citizens."], [82.98, 85.62, "Your turn. Say: Voter turnout."], [88.47, 89.7, "Voter turnout."], [90.45, 91.83, "Electoral system."], [92.85, 96.58, "Electoral system means the rules that decide how votes become seats."], [97.18, 99.78, "Each electoral system favours different parties."], [100.38, 103.55, "Your turn. Say: Electoral system."], [106.4, 107.95, "Electoral system."], [108.68, 109.93, "Polling station."], [110.92, 113.83, "Polling station means a place where people go to vote."], [114.45, 117.04, "The polling station opened at seven in the morning."], [117.65, 120.48, "Your turn. Say: Polling station."], [123.33, 124.62, "Polling station."], [125.38, 126.43, "Referendum."], [127.42, 131.48, "Referendum means a vote by all citizens on one specific question."], [132.08, 135.02, "The referendum asked whether to change the constitution."], [135.62, 138.04, "Your turn. Say: Referendum."], [140.9, 142.05, "Referendum."], [142.82, 144.0, "Political party."], [145.02, 148.76, "Political party means an organised group that competes in elections."], [149.35, 152.59, "A political party must explain its policies clearly."], [153.18, 156.25, "Your turn. Say: Political party."], [159.1, 160.31, "Political party."], [161.1, 164.94, "Part two: dialogue. Let's listen to a conversation."], [165.78, 171.83, "Visal, a journalist writes 'Rarely has voter turnout been so low.' Why is 'has' before 'turnout'?"], [172.92, 184.1, "That is negative inversion. After a negative adverb such as rarely, never, hardly or not until, the auxiliary comes before the subject, for strong emphasis."], [185.22, 187.08, "Can you give an election example?"], [188.18, 201.57, "Not until the ballots were counted did the candidate admit defeat. Only when turnout rose did the campaign feel successful. Hardly had the polling station opened when queues formed."], [202.65, 204.28, "Is it common in speech?"], [205.38, 213.64, "No, mainly in formal writing and speeches. Rarely does a referendum attract as many voters as a general election."], [214.8, 216.25, "Part three: grammar."], [217.12, 222.58, "Grammar focus: Negative inversion: Not until and Hardly had and Rarely has."], [222.88, 224.1, "Look at the pattern."], [224.78, 228.23, "Not until the ballots were counted did the candidate admit defeat."], [229.15, 232.5, "Only when turnout rose did the campaign feel successful."], [233.38, 236.88, "Hardly had the polling station opened when queues began to form."], [237.83, 246.24, "After rarely, never, hardly, not until or only when, put the auxiliary before the subject: Not until... did he... Use it for emphasis in formal writing."], [246.98, 250.85, "Be careful! Don't say: Hardly he had arrived when it rang."], [252.8, 255.82, "Say: Hardly had he arrived when it rang."], [256.12, 258.48, "Invert the auxiliary after hardly."], [259.27, 261.62, "Part four: reading. Read and listen."], [262.43, 263.92, "Why Every Vote Counts."], [264.22, 267.79, "Elections are the clearest way for citizens to hold power to account."], [268.8, 272.67, "Rarely has a campaign succeeded without a strong political party behind it."], [273.67, 278.05, "Not until voter turnout rises can an electoral system claim real legitimacy."], [279.03, 282.9, "Only when people believe their ballot matters do they walk to the polling station."], [283.9, 289.0, "Even a referendum, which asks one simple question, requires careful public debate."], [290.1, 294.56, "Part five: quiz. Five questions. Are you ready?"], [295.42, 297.56, "Never blank turnout been so high."], [297.86, 300.9, "A, has. B, does. C, is."], [304.47, 306.38, "The answer is A: has."], [307.55, 311.01, "A vote on a single question put to all citizens is a blank."], [311.31, 315.51, "A, campaign. B, candidate. C, referendum."], [319.07, 321.43, "The answer is C: referendum."], [322.58, 324.45, "Choose the correct sentence."], [324.75, 331.51, "A, Hardly he had arrived when it rang.. B, Hardly had he arrived when it rang.. C, Hardly he arrived when it rang.."], [335.07, 338.59, "The answer is B: Hardly had he arrived when it rang.."], [339.75, 342.34, "The place where people cast their votes is a blank."], [342.64, 347.47, "A, polling station. B, political party. C, legislature."], [351.03, 353.32, "The answer is A: polling station."], [354.48, 357.78, "According to the reading, people vote when they believe their ballot…"], [358.08, 361.93, "A, is free. B, matters. C, is secret."], [365.5, 367.45, "The answer is B: matters."], [368.67, 372.12, "Part six: speaking. It's your turn to talk."], [372.98, 375.34, "Why does voter turnout matter in an election?"], [384.15, 385.71, "Now listen to Visal."], [386.01, 410.11, "Voter turnout matters because an election result is only as legitimate as the share of citizens who took part. When turnout is low, the winners may represent a small minority, and many groups may feel ignored. High turnout shows public trust in the system and gives the government a stronger mandate to act on behalf of everyone."], [410.41, 412.26, "Excellent answer, Visal!"], [413.15, 420.05, "Great work! Now you can use eight new words and negative inversion: not until and hardly had and rarely has."], [420.35, 426.36, "Today's value is civic responsibility. Take care of your city, because it is everyone's home."], [426.66, 428.9, "See you in Unit three. Goodbye!"], [429.2, 431.81, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit03-Social-Movements": [[0.35, 5.94, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.24, 9.52, "Hi! I'm Visal. Let's learn together!"], [9.82, 15.74, "Unit three: Social Movements. Today you will report what activists say and do with reporting verbs."], [16.04, 18.61, "Here is our lesson map. Let's start!"], [19.57, 23.07, "Part one: words. You will learn eight new words."], [23.92, 24.86, "Activism."], [25.85, 29.99, "Activism means action taken to bring about political or social change."], [30.58, 33.19, "Student activism helped to change the law."], [33.78, 36.33, "Your turn. Say: Activism."], [39.17, 40.17, "Activism."], [40.92, 41.98, "Protest."], [42.98, 46.39, "Protest means a public event where people show they disagree."], [46.98, 49.68, "The protest remained peaceful throughout the day."], [50.28, 53.16, "Your turn. Say: Protest."], [56.0, 56.91, "Protest."], [57.65, 58.91, "Advocacy group."], [59.92, 64.04, "Advocacy group means an organisation that supports a particular cause."], [64.65, 67.39, "The advocacy group published a report on housing."], [67.98, 71.06, "Your turn. Say: Advocacy group."], [73.9, 75.18, "Advocacy group."], [75.92, 77.08, "Grassroots."], [78.08, 82.31, "Grassroots means started by ordinary people rather than leaders."], [82.92, 85.71, "A grassroots campaign spread across the country."], [86.32, 89.1, "Your turn. Say: Grassroots."], [91.93, 93.22, "Grassroots."], [93.98, 94.91, "Petition."], [95.92, 99.1, "Petition means a formal request signed by many people."], [99.72, 102.39, "The petition gathered fifty thousand signatures."], [102.98, 105.43, "Your turn. Say: Petition."], [108.27, 109.19, "Petition."], [109.95, 111.24, "Civil rights."], [112.25, 115.75, "Civil rights means the rights of citizens to equality and freedom."], [116.35, 118.74, "The movement fought for equal civil rights."], [119.35, 122.3, "Your turn. Say: Civil rights."], [125.17, 126.49, "Civil rights."], [127.25, 128.3, "Solidarity."], [129.28, 132.92, "Solidarity means unity between people who share a goal."], [133.52, 136.42, "Workers showed solidarity by marching together."], [137.02, 139.8, "Your turn. Say: Solidarity."], [142.63, 143.84, "Solidarity."], [144.58, 145.63, "Awareness."], [146.62, 150.35, "Awareness means knowledge that something exists or is important."], [150.95, 153.17, "The march raised awareness of the problem."], [153.78, 156.48, "Your turn. Say: Awareness."], [159.33, 160.46, "Awareness."], [161.27, 165.1, "Part two: dialogue. Let's listen to a conversation."], [165.95, 173.06, "Visal, a headline says 'Activists urged the government to listen.' How do reporting verbs work with a person and an action?"], [174.15, 187.73, "Some take object + to-infinitive: urged, warned, encouraged. Others take a preposition + gerund: accused them of ignoring, blamed him for delaying, apologised for being late."], [188.82, 190.64, "And some take a that-clause?"], [191.75, 204.43, "Yes: insisted that, announced that. But 'suggest' never takes object + to: we say 'suggested starting a petition', not 'suggested us to start'."], [205.55, 206.87, "Why are they useful?"], [207.95, 216.31, "They let a writer report a protest accurately without quoting. Compare 'they said please' with 'they appealed to the council to act'."], [217.47, 219.15, "Part three: grammar."], [220.02, 224.87, "Grammar focus: Reporting verbs: urge plus to and accuse plus of -ing."], [225.17, 226.45, "Look at the pattern."], [227.15, 230.61, "The advocacy group urged the council to protect civil rights."], [231.52, 234.33, "Protesters accused the minister of ignoring the petition."], [235.22, 238.54, "Organisers suggested starting a grassroots campaign."], [239.5, 247.4, "Use urge / warn / encourage + object + to-verb; accuse / blame + object + of / for + -ing; suggest + -ing (never suggest someone to do)."], [248.15, 251.8, "Be careful! Don't say: She suggested me to join."], [253.77, 256.01, "Say: She suggested joining."], [256.31, 258.7, "'Suggest' does not take object + to."], [259.5, 262.08, "Part four: reading. Read and listen."], [262.87, 264.43, "Voices from the Street."], [264.73, 269.28, "Social change often begins with ordinary people who refuse to stay silent."], [270.27, 275.95, "Grassroots activism grows when a small group organises a petition and encourages neighbours to sign it."], [276.93, 283.65, "Protesters may accuse leaders of ignoring public needs, and advocacy groups often urge governments to protect civil rights."], [284.63, 289.88, "Marches build awareness, but solidarity between different communities makes a movement last."], [290.9, 295.2, "History shows that peaceful pressure, repeated for years, can change the law."], [296.3, 300.45, "Part five: quiz. Five questions. Are you ready?"], [301.32, 303.6, "The group urged the mayor blank the park."], [303.89, 307.4, "A, to protect. B, protecting. C, protect."], [310.93, 312.93, "The answer is A: to protect."], [314.08, 316.27, "They accused the minister blank the petition."], [316.57, 320.43, "A, to ignore. B, of ignoring. C, for ignore."], [323.97, 326.19, "The answer is B: of ignoring."], [327.35, 330.56, "A formal request signed by many people is a blank."], [330.86, 334.48, "A, petition. B, protest. C, treaty."], [338.03, 340.1, "The answer is A: petition."], [341.25, 343.04, "Choose the correct sentence."], [343.34, 349.84, "A, She suggested me to join.. B, She suggested me joining.. C, She suggested joining the march.."], [353.4, 356.54, "The answer is C: She suggested joining the march.."], [357.68, 360.66, "According to the reading, what makes a movement last?"], [360.96, 365.18, "A, silence. B, solidarity. C, a single march."], [368.73, 370.7, "The answer is B: solidarity."], [371.9, 375.35, "Part six: speaking. It's your turn to talk."], [376.22, 379.68, "What makes a social movement successful in creating change?"], [388.48, 389.93, "Now listen to Visal."], [390.23, 419.75, "A social movement succeeds when it combines a clear, achievable goal with broad support. Grassroots organisers must keep people motivated over many years, build solidarity across different communities and gain media attention. Successful movements also use peaceful pressure, such as petitions and protests, while offering realistic solutions that policy makers can turn into law."], [420.05, 421.7, "Excellent answer, Visal!"], [422.58, 428.95, "Great work! Now you can use eight new words and reporting verbs: urge plus to and accuse plus of -ing."], [429.25, 433.97, "Today's value is solidarity. Stand together with others who face injustice."], [434.27, 436.65, "See you in Unit four. Goodbye!"], [436.95, 439.78, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit04-Public-Policy": [[0.35, 6.34, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.64, 10.11, "Hi! I'm Visal. Let's learn together!"], [10.4, 16.52, "Unit four: Public Policy. Today you will announce policy plans with the formal passive future."], [16.82, 19.47, "Here is our lesson map. Let's start!"], [20.43, 23.59, "Part one: words. You will learn eight new words."], [24.45, 25.59, "Legislation."], [26.58, 29.29, "Legislation means laws, considered together."], [29.88, 32.68, "New legislation on housing was introduced."], [33.28, 36.81, "Your turn. Say: Legislation."], [39.67, 40.92, "Legislation."], [41.68, 42.91, "Policy maker."], [43.92, 47.67, "Policy maker means a person who helps to decide government plans."], [48.28, 51.4, "Policy makers must balance cost and fairness."], [51.98, 55.0, "Your turn. Say: Policy maker."], [57.83, 59.24, "Policy maker."], [59.98, 61.17, "Stakeholder."], [62.18, 65.38, "Stakeholder means a person or group affected by a decision."], [65.98, 68.32, "Every stakeholder was invited to comment."], [68.92, 71.42, "Your turn. Say: Stakeholder."], [74.27, 75.29, "Stakeholder."], [76.05, 77.36, "Implementation."], [78.35, 81.95, "Implementation means the process of putting a plan into action."], [82.55, 85.19, "Implementation took longer than expected."], [85.78, 88.56, "Your turn. Say: Implementation."], [91.4, 92.81, "Implementation."], [93.55, 95.1, "Public consultation."], [96.08, 100.31, "Public consultation means a process of asking citizens for their views."], [100.92, 103.54, "A public consultation preceded the new law."], [104.15, 107.62, "Your turn. Say: Public consultation."], [110.47, 111.95, "Public consultation."], [112.72, 113.89, "Regulation."], [114.88, 118.09, "Regulation means an official rule made by a government body."], [118.68, 121.41, "A new regulation limits plastic packaging."], [122.02, 125.09, "Your turn. Say: Regulation."], [127.93, 129.34, "Regulation."], [130.08, 131.47, "Impact assessment."], [132.48, 136.78, "Impact assessment means an official study of the likely effects of a plan."], [137.38, 140.23, "The impact assessment predicted higher costs."], [140.82, 143.82, "Your turn. Say: Impact assessment."], [146.67, 148.03, "Impact assessment."], [148.78, 149.56, "Reform."], [150.55, 153.83, "Reform means a change made to improve a system or law."], [154.42, 157.08, "Tax reform was the main election promise."], [157.68, 160.29, "Your turn. Say: Reform."], [163.13, 164.04, "Reform."], [164.83, 168.17, "Part two: dialogue. Let's listen to a conversation."], [169.02, 174.8, "Visal, a news report says 'The bill is to be debated next week.' What does 'is to be debated' mean?"], [175.92, 187.37, "It is a formal way to announce an official plan: is/are to + be + past participle. It means the debate has been arranged, so it is almost certain."], [188.48, 190.39, "Do reports use other forms?"], [191.48, 201.87, "Yes: is due to be, is set to be, is expected to be. 'The reform is to be introduced in March' sounds more official than 'will be introduced'."], [202.98, 204.65, "Can you use it in a negative?"], [205.75, 216.43, "Yes. 'No new regulation is to be adopted until a public consultation has finished.' It often describes orders and rules as well as plans."], [217.57, 219.21, "Part three: grammar."], [220.05, 224.91, "Grammar focus: Formal future: is to be and is due to be plus past participle."], [225.21, 226.38, "Look at the pattern."], [227.08, 230.06, "The bill is to be debated by the legislature next week."], [230.95, 234.38, "A public consultation is due to be held before the reform."], [235.28, 238.03, "The regulation is set to be implemented in March."], [238.97, 247.37, "Use is / are to be + past participle for official plans and orders. Variants: is due to be, is set to be. It sounds formal and fixed."], [248.12, 252.17, "Be careful! Don't say: The bill is to debate next week."], [254.13, 256.61, "Say: The bill is to be debated next week."], [256.91, 260.24, "Use the passive: is to be + past participle."], [261.03, 263.96, "Part four: reading. Read and listen."], [264.77, 266.13, "From Idea to Law."], [266.43, 269.07, "Good legislation rarely appears overnight."], [270.07, 277.18, "First, policy makers identify a problem, and stakeholders such as businesses, unions and families are invited to comment."], [278.17, 285.22, "A public consultation is to be held before any draft is approved, and an impact assessment is to be published afterwards."], [286.2, 291.3, "Only then is the regulation set to be implemented, and the reform is to be reviewed after two years."], [292.3, 296.66, "Each stage allows mistakes to be corrected before they affect millions of people."], [297.77, 301.9, "Part five: quiz. Five questions. Are you ready?"], [302.75, 305.16, "The new law is blank introduced in March."], [305.46, 308.62, "A, to be. B, to. C, being to."], [312.17, 313.7, "The answer is A: to be."], [314.85, 317.82, "A person or group affected by a decision is a blank."], [318.12, 322.15, "A, regulation. B, stakeholder. C, ballot."], [325.7, 328.07, "The answer is B: stakeholder."], [329.22, 332.61, "An official study of likely effects is an impact blank."], [332.91, 336.66, "A, campaign. B, reform. C, assessment."], [340.2, 342.01, "The answer is C: assessment."], [343.15, 344.79, "Choose the correct sentence."], [345.09, 352.06, "A, The bill is to debate next week.. B, The bill is to be debated next week.. C, The bill is to being debated.."], [355.6, 359.07, "The answer is B: The bill is to be debated next week.."], [360.22, 363.68, "According to the reading, each stage allows mistakes to be blank."], [363.98, 367.46, "A, corrected. B, hidden. C, repeated."], [371.0, 372.92, "The answer is A: corrected."], [374.13, 377.44, "Part six: speaking. It's your turn to talk."], [378.28, 382.36, "Why is public consultation important before new legislation is passed?"], [391.15, 392.67, "Now listen to Visal."], [392.97, 421.18, "Public consultation gives the people who will live under a law a chance to share their experience before it is final. Policy makers may miss practical problems that stakeholders can see immediately. Listening early improves the quality of legislation, builds trust and makes citizens more willing to accept and follow the new rules, which makes implementation easier."], [421.48, 423.21, "Excellent answer, Visal!"], [424.12, 431.19, "Great work! Now you can use eight new words and formal future: is to be and is due to be plus past participle."], [431.49, 436.9, "Today's value is civic reasoning. Reason about how power and fairness should work in a society."], [437.2, 439.56, "See you in Unit five. Goodbye!"], [439.86, 443.17, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit05-Human-Rights": [[0.35, 5.63, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [5.93, 9.58, "Hi! I'm Visal. Let's learn together!"], [9.88, 15.6, "Unit five: Human Rights. Today you will use a preposition before which and whom in formal writing."], [15.9, 18.44, "Here is our lesson map. Let's start!"], [19.4, 22.73, "Part one: words. You will learn eight new words."], [23.58, 25.04, "Universal rights."], [26.05, 29.81, "Universal rights means rights that belong to every person everywhere."], [30.42, 33.95, "Universal rights apply whatever a person's nationality."], [34.55, 37.93, "Your turn. Say: Universal rights."], [40.8, 42.38, "Universal rights."], [43.12, 44.29, "Discrimination."], [45.28, 49.24, "Discrimination means unfair treatment of people because of who they are."], [49.85, 52.16, "The law prohibits discrimination at work."], [52.75, 55.31, "Your turn. Say: Discrimination."], [58.17, 59.32, "Discrimination."], [60.08, 61.25, "Equality."], [62.25, 65.61, "Equality means the state of being treated the same way as others."], [66.22, 69.68, "Equality before the law is a basic principle."], [70.28, 72.85, "Your turn. Say: Equality."], [75.7, 76.79, "Equality."], [77.55, 78.76, "Freedom of speech."], [79.75, 83.18, "Freedom of speech means the right to say what you think without punishment."], [83.78, 87.16, "Freedom of speech allows citizens to criticise leaders."], [87.75, 90.6, "Your turn. Say: Freedom of speech."], [93.43, 94.67, "Freedom of speech."], [95.42, 96.65, "Justice system."], [97.65, 101.91, "Justice system means the courts, police and laws that decide guilt and punishment."], [102.52, 105.52, "A fair justice system treats everyone equally."], [106.12, 108.81, "Your turn. Say: Justice system."], [111.67, 113.03, "Justice system."], [113.78, 114.95, "Human dignity."], [115.95, 120.48, "Human dignity means the equal worth and respect every person deserves."], [121.08, 123.21, "Torture violates human dignity."], [123.82, 126.6, "Your turn. Say: Human dignity."], [129.43, 130.61, "Human dignity."], [131.35, 132.73, "International law."], [133.75, 137.84, "International law means the rules that govern relations between countries."], [138.45, 141.65, "International law forbids attacks on civilians."], [142.25, 145.34, "Your turn. Say: International law."], [148.2, 149.61, "International law."], [150.35, 151.4, "Advocacy."], [152.38, 155.64, "Advocacy means public support for a cause or group."], [156.25, 158.37, "Advocacy helped to free the prisoner."], [158.95, 161.59, "Your turn. Say: Advocacy."], [164.43, 165.55, "Advocacy."], [166.37, 169.98, "Part two: dialogue. Let's listen to a conversation."], [170.82, 177.69, "Visal, a charter says 'These are the rights to which every person is entitled.' Why not 'which every person is entitled to'?"], [178.78, 188.75, "Both are correct. Putting the preposition before the relative pronoun is more formal: the rights to which, the system in which, the law under which."], [189.85, 191.3, "Can we do that with 'who'?"], [192.42, 201.77, "Only as 'whom': the people for whom the law was written. We cannot say 'for who' in formal writing, and we cannot use 'that' after a preposition."], [202.88, 205.25, "Give me an example about justice."], [206.35, 217.63, "A justice system in which everyone is treated equally protects human dignity. Discrimination is a practice against which international law offers protection."], [218.77, 220.2, "Part three: grammar."], [221.05, 226.06, "Grammar focus: Preposition plus relative pronoun: to which and for whom."], [226.36, 227.57, "Look at the pattern."], [228.25, 230.92, "These are the rights to which every person is entitled."], [231.82, 235.2, "It is a justice system in which everyone is treated equally."], [236.08, 238.31, "They are the people for whom the law was written."], [239.27, 246.77, "In formal writing, put the preposition before which / whom: the rights to which..., the people for whom... Never use 'that' or 'who' after a preposition."], [247.52, 251.11, "Be careful! Don't say: The people for who it was written."], [253.07, 255.93, "Say: The people for whom it was written."], [256.23, 258.14, "Use 'whom' after a preposition."], [258.93, 261.38, "Part four: reading. Read and listen."], [262.17, 263.92, "Rights That Belong to Everyone."], [264.22, 269.6, "Human rights are not gifts from governments; they are the standards to which every state should be held."], [270.6, 278.25, "Universal rights, such as freedom of speech and equality before the law, apply to everyone, whatever their nationality."], [279.27, 285.42, "Discrimination is a practice against which international law offers protection, yet enforcement remains uneven."], [286.43, 291.8, "A fair justice system is one in which a person's dignity is respected at every stage."], [292.8, 297.5, "Advocacy groups are the organisations through which ordinary people can make these promises real."], [298.6, 302.56, "Part five: quiz. Five questions. Are you ready?"], [303.42, 306.18, "These are the rights to blank everyone is entitled."], [306.48, 309.51, "A, that. B, which. C, what."], [313.07, 314.92, "The answer is B: which."], [316.05, 319.09, "Treating people unfairly because of who they are is blank."], [319.39, 323.66, "A, discrimination. B, advocacy. C, sovereignty."], [327.2, 329.51, "The answer is A: discrimination."], [330.65, 332.37, "Choose the correct sentence."], [332.67, 338.83, "A, The people for who it was written.. B, The people for whom it was written.. C, The people for that it was written.."], [342.37, 345.28, "The answer is B: The people for whom it was written.."], [346.45, 349.01, "Rules between countries are called blank law."], [349.31, 353.24, "A, local. B, personal. C, international."], [356.8, 358.76, "The answer is C: international."], [359.92, 364.21, "According to the reading, advocacy groups help people make promises…"], [364.51, 367.96, "A, real. B, secret. C, shorter."], [371.5, 373.16, "The answer is A: real."], [374.37, 377.4, "Part six: speaking. It's your turn to talk."], [378.25, 382.01, "Why are human rights considered universal, regardless of country?"], [390.82, 392.29, "Now listen to Visal."], [392.59, 417.3, "Human rights are called universal because they come from the equal dignity of every person, not from a government's decision. A person does not lose these rights by crossing a border or living under a different system. International law reflects this idea, which is why states are expected to protect rights such as equality and freedom of speech for everyone."], [417.6, 419.28, "Excellent answer, Visal!"], [420.18, 426.71, "Great work! Now you can use eight new words and preposition plus relative pronoun: to which and for whom."], [427.01, 432.0, "Today's value is human dignity. Every person deserves respect wherever they are."], [432.3, 434.8, "See you in Unit six. Goodbye!"], [435.1, 437.8, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit06-International-Relations-Basics": [[0.35, 5.87, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.17, 9.2, "Hi! I'm Visal. Let's learn together!"], [9.5, 16.45, "Unit six: International Relations Basics. Today you will speculate about past events with modal perfects."], [16.75, 19.56, "Here is our lesson map. Let's start!"], [20.5, 23.63, "Part one: words. You will learn eight new words."], [24.48, 25.54, "Diplomacy."], [26.55, 30.23, "Diplomacy means the skill of managing relations between countries."], [30.82, 33.02, "Quiet diplomacy ended the crisis."], [33.62, 36.71, "Your turn. Say: Diplomacy."], [39.57, 40.75, "Diplomacy."], [41.52, 42.33, "Treaty."], [43.32, 46.43, "Treaty means a formal written agreement between countries."], [47.02, 49.02, "The two nations signed a peace treaty."], [49.62, 51.86, "Your turn. Say: Treaty."], [54.7, 55.38, "Treaty."], [56.12, 57.34, "Alliance."], [58.35, 61.86, "Alliance means a group of countries that agree to support each other."], [62.45, 64.83, "The alliance promised mutual defence."], [65.42, 68.01, "Your turn. Say: Alliance."], [70.87, 71.91, "Alliance."], [72.65, 73.89, "Foreign policy."], [74.88, 78.73, "Foreign policy means a country's plan for dealing with other countries."], [79.32, 82.31, "Its foreign policy favours trade over conflict."], [82.92, 85.66, "Your turn. Say: Foreign policy."], [88.5, 89.75, "Foreign policy."], [90.48, 91.7, "Sanctions."], [92.72, 96.78, "Sanctions means official penalties used to pressure a country to change."], [97.38, 100.02, "Sanctions limited the country's oil sales."], [100.62, 103.33, "Your turn. Say: Sanctions."], [106.17, 107.24, "Sanctions."], [107.98, 108.96, "Embassy."], [109.95, 114.31, "Embassy means the offices of a country's representatives in a foreign capital."], [114.92, 117.16, "The embassy helped stranded citizens."], [117.75, 120.47, "Your turn. Say: Embassy."], [123.33, 124.38, "Embassy."], [125.12, 126.35, "Negotiation."], [127.35, 130.79, "Negotiation means formal discussion to reach an agreement."], [131.38, 133.79, "The negotiation lasted three weeks."], [134.38, 137.14, "Your turn. Say: Negotiation."], [140.0, 141.25, "Negotiation."], [141.98, 143.1, "Sovereignty."], [144.12, 147.35, "Sovereignty means the power of a country to govern itself."], [147.95, 150.66, "The treaty respected each nation's sovereignty."], [151.25, 153.83, "Your turn. Say: Sovereignty."], [156.67, 157.74, "Sovereignty."], [158.53, 162.17, "Part two: dialogue. Let's listen to a conversation."], [163.02, 168.35, "Visal, an analyst writes 'Talks could have prevented the conflict.' What does 'could have prevented' tell us?"], [169.45, 182.78, "It speculates about the past: something was possible, but did not happen. We use modal + have + past participle: could have, might have, should have, must have, can't have."], [183.88, 185.4, "How do the meanings differ?"], [186.48, 199.65, "Should have criticises: the embassy should have warned us. Might have is weak possibility: sanctions might have worked. Must have is a strong conclusion: the treaty must have failed because of mistrust."], [200.75, 201.9, "Is there a negative?"], [203.02, 211.45, "Yes. The alliance needn't have collapsed means it was unnecessary. They can't have agreed means we are sure they did not."], [212.6, 213.98, "Part three: grammar."], [214.85, 219.28, "Grammar focus: Modal perfects: could have and should have and must have."], [219.58, 220.74, "Look at the pattern."], [221.45, 224.26, "Early diplomacy could have prevented the conflict."], [225.15, 227.64, "The embassy should have warned its citizens sooner."], [228.55, 231.05, "The treaty must have failed because of mistrust."], [232.0, 239.74, "Modal + have + past participle talks about the past: could / might have (possible), should have (criticism), must have (sure), can't have (sure not)."], [240.48, 243.81, "Be careful! Don't say: He must have forgot."], [245.77, 248.01, "Say: He must have forgotten."], [248.31, 250.7, "Use the past participle after have."], [251.5, 254.09, "Part four: reading. Read and listen."], [254.9, 256.59, "When Diplomacy Fails."], [256.89, 260.2, "Historians often ask what leaders could have done differently."], [261.2, 266.6, "Skilful negotiation might have saved the treaty, and a stronger alliance should have discouraged the attack."], [267.6, 273.69, "Sanctions may have hurt the economy, but they cannot have changed a foreign policy that leaders refused to discuss."], [274.7, 277.97, "The embassy must have sent warnings, yet no one acted in time."], [278.97, 282.78, "Looking back reminds us that patient diplomacy is cheaper than war."], [283.87, 288.02, "Part five: quiz. Five questions. Are you ready?"], [288.88, 291.67, "Early talks blank the war, but nobody tried."], [291.97, 296.03, "A, could have prevented. B, could prevent. C, can have prevent."], [299.57, 302.09, "The answer is A: could have prevented."], [303.25, 306.23, "Criticism about a past duty uses blank have."], [306.52, 309.49, "A, might. B, should. C, can."], [313.03, 314.71, "The answer is B: should."], [315.85, 318.59, "A formal agreement between countries is a blank."], [318.89, 322.42, "A, sanction. B, embassy. C, treaty."], [325.97, 328.33, "The answer is C: treaty."], [329.48, 331.23, "Choose the correct sentence."], [331.53, 337.33, "A, He must have forgot.. B, He must have forgotten.. C, He must forgot.."], [340.87, 343.28, "The answer is B: He must have forgotten.."], [344.45, 347.91, "According to the reading, patient diplomacy is cheaper than blank."], [348.21, 351.52, "A, war. B, trade. C, talks."], [355.07, 356.56, "The answer is A: war."], [357.77, 361.28, "Part six: speaking. It's your turn to talk."], [362.12, 366.38, "Why is diplomacy important for resolving conflicts between countries?"], [375.18, 376.67, "Now listen to Visal."], [376.97, 405.58, "Diplomacy gives countries a way to solve disagreements through talks instead of force. Through negotiation, embassies and treaties, governments can understand each other's concerns, find compromises and avoid costly wars. It also builds trust over time, so that future crises are easier to manage. Even when relations are tense, open channels reduce the risk of dangerous misunderstandings."], [405.88, 407.51, "Excellent answer, Visal!"], [408.42, 414.61, "Great work! Now you can use eight new words and modal perfects: could have and should have and must have."], [414.91, 421.01, "Today's value is diplomacy. Disagree respectfully, and look for solutions everyone can accept."], [421.31, 424.04, "See you in Unit seven. Goodbye!"], [424.34, 427.58, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit07-Media-Politics": [[0.35, 6.02, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.32, 9.72, "Hi! I'm Visal. Let's learn together!"], [10.02, 16.7, "Unit seven: Media & Politics. Today you will distance yourself from unproven claims with hedging verbs."], [17.0, 19.64, "Here is our lesson map. Let's start!"], [20.6, 23.96, "Part one: words. You will learn eight new words."], [24.82, 26.2, "Political coverage."], [27.22, 31.04, "Political coverage means news reports about government and politicians."], [31.65, 34.74, "Political coverage intensifies before every election."], [35.35, 38.54, "Your turn. Say: Political coverage."], [41.4, 42.78, "Political coverage."], [43.55, 44.61, "Press freedom."], [45.62, 50.19, "Press freedom means the right of journalists to publish without government control."], [50.78, 53.24, "Press freedom is a sign of a healthy democracy."], [53.85, 56.85, "Your turn. Say: Press freedom."], [59.7, 60.7, "Press freedom."], [61.45, 62.68, "Media bias."], [63.68, 67.66, "Media bias means unfair preference for one side in news reporting."], [68.25, 70.86, "Media bias can shape how voters think."], [71.45, 74.23, "Your turn. Say: Media bias."], [77.07, 78.29, "Media bias."], [79.05, 80.19, "Political spin."], [81.18, 85.03, "Political spin means presenting facts in a way that favours one side."], [85.62, 88.73, "The press office used political spin to hide the loss."], [89.32, 92.05, "Your turn. Say: Political spin."], [94.9, 96.35, "Political spin."], [97.12, 99.01, "Fact-based reporting."], [100.02, 104.9, "Fact-based reporting means news that relies on checked evidence, not opinion."], [105.48, 108.15, "Fact-based reporting builds public trust."], [108.75, 111.63, "Your turn. Say: Fact-based reporting."], [114.5, 116.73, "Fact-based reporting."], [117.48, 118.67, "Public opinion."], [119.68, 123.4, "Public opinion means the views held by most people about an issue."], [124.02, 126.76, "Public opinion changed after the investigation."], [127.35, 130.3, "Your turn. Say: Public opinion."], [133.17, 134.38, "Public opinion."], [135.12, 136.25, "News cycle."], [137.25, 141.15, "News cycle means the way stories rise and fade as news is reported."], [141.75, 144.56, "A fast news cycle rewards quick headlines."], [145.15, 147.74, "Your turn. Say: News cycle."], [150.6, 152.24, "News cycle."], [152.98, 154.7, "Journalistic ethics."], [155.72, 159.13, "Journalistic ethics means the moral rules that guide reporters."], [159.72, 163.03, "Journalistic ethics require reporters to check sources."], [163.62, 166.58, "Your turn. Say: Journalistic ethics."], [169.43, 171.03, "Journalistic ethics."], [171.83, 175.41, "Part two: dialogue. Let's listen to a conversation."], [176.25, 182.4, "Visal, a report says 'The minister appears to have misled the public.' Why 'appears to have', not 'misled'?"], [183.48, 198.66, "It is distancing. The writer does not state it as fact. We use seems to, appears to, is alleged to, is reported to, so-called or supposedly, so the claim is attributed, not owned."], [199.75, 202.11, "Is that part of journalistic ethics?"], [203.22, 214.84, "Yes. Fact-based reporting separates what is known from what is claimed. Compare 'The policy failed' with 'The policy appears to have failed, according to early figures.'"], [215.95, 217.97, "How does it help me spot spin?"], [219.08, 229.21, "Notice who is speaking. A so-called independent poll, an alleged leak or a supposedly neutral article should make you ask for the evidence."], [230.37, 232.0, "Part three: grammar."], [232.85, 237.44, "Grammar focus: Hedging: appears to and is alleged to and so-called."], [237.74, 239.05, "Look at the pattern."], [239.75, 242.21, "The minister appears to have misled the public."], [243.12, 246.44, "The company is alleged to have paid for favourable coverage."], [247.35, 250.66, "The so-called independent poll seems to favour one party."], [251.6, 259.62, "Use appears to / seems to / is alleged to / is reported to + verb (have + past participle for earlier events) to show you are not claiming it as certain fact."], [260.38, 264.07, "Be careful! Don't say: The firm alleges to have lied."], [266.03, 268.51, "Say: The firm is alleged to have lied."], [268.81, 271.38, "Use the passive: is alleged to."], [272.17, 274.81, "Part four: reading. Read and listen."], [275.6, 277.17, "Reading Between the Lines."], [277.47, 281.44, "Political coverage rarely presents the whole picture in a single story."], [282.43, 288.95, "Reporters following good journalistic ethics use phrases such as 'is alleged to' or 'appears to' when a claim is unproven."], [289.93, 296.23, "Media bias, by contrast, often hides inside words, so a so-called expert may be only a supporter."], [297.23, 303.1, "Political spin tries to shape public opinion during a fast news cycle, when few people check the facts."], [304.1, 308.83, "Press freedom and fact-based reporting therefore protect readers as much as writers."], [309.93, 313.8, "Part five: quiz. Five questions. Are you ready?"], [314.65, 316.92, "The minister blank to have misled the public."], [317.22, 321.02, "A, appears. B, looks like. C, is appearing."], [324.57, 326.5, "The answer is A: appears."], [327.65, 331.16, "Careful reporting that separates fact from claim is blank reporting."], [331.46, 335.34, "A, spin. B, fact-based. C, cycle."], [338.9, 341.33, "The answer is B: fact-based."], [342.48, 344.82, "A claim made but not yet proved is blank."], [345.12, 348.31, "A, certain. B, admitted. C, alleged."], [351.87, 353.61, "The answer is C: alleged."], [354.75, 356.44, "Choose the correct sentence."], [356.74, 363.4, "A, The firm is alleged to have lied.. B, The firm alleges to have lied.. C, The firm is alleged have lied.."], [366.93, 369.81, "The answer is A: The firm is alleged to have lied.."], [370.95, 374.24, "According to the reading, spin tries to shape public blank."], [374.54, 377.96, "A, opinion. B, freedom. C, ethics."], [381.5, 383.7, "The answer is A: opinion."], [384.9, 388.38, "Part six: speaking. It's your turn to talk."], [389.22, 392.76, "How can a citizen recognize political spin when reading the news?"], [401.55, 403.14, "Now listen to Visal."], [403.44, 430.3, "A citizen can spot spin by checking who is speaking and what they gain. Look for emotional words, selective facts and claims with no source. Compare several outlets, especially those with different viewpoints, and check the original figures where possible. Reports that separate fact from opinion and admit uncertainty are usually more reliable than confident, one-sided stories."], [430.6, 432.36, "Excellent answer, Visal!"], [433.25, 439.23, "Great work! Now you can use eight new words and hedging: appears to and is alleged to and so-called."], [439.53, 444.35, "Today's value is media literacy. Ask who made the message, and why, before you believe it."], [444.65, 447.35, "See you in Unit eight. Goodbye!"], [447.64, 450.24, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit08-Judicial-System": [[0.35, 6.07, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.37, 9.62, "Hi! I'm Visal. Let's learn together!"], [9.92, 15.88, "Unit eight: Judicial System. Today you will write formal conditions by inverting had, should and were."], [16.18, 18.81, "Here is our lesson map. Let's start!"], [19.77, 23.28, "Part one: words. You will learn eight new words."], [24.12, 25.37, "Supreme court."], [26.38, 29.25, "Supreme court means the highest court in a country."], [29.85, 32.67, "The supreme court has the final word on the law."], [33.28, 36.67, "Your turn. Say: Supreme court."], [39.53, 40.89, "Supreme court."], [41.65, 42.88, "Due process."], [43.88, 47.62, "Due process means fair legal procedures that the state must follow."], [48.22, 51.41, "Due process protects people from unfair punishment."], [52.02, 54.94, "Your turn. Say: Due process."], [57.8, 58.82, "Due process."], [59.58, 60.85, "Legal precedent."], [61.85, 65.73, "Legal precedent means an earlier court decision that guides later ones."], [66.32, 70.16, "The judge followed a legal precedent from 1990."], [70.75, 73.75, "Your turn. Say: Legal precedent."], [76.6, 78.01, "Legal precedent."], [78.75, 80.03, "Trial by jury."], [81.02, 85.86, "Trial by jury means a trial in which citizens decide whether the accused is guilty."], [86.45, 89.95, "Trial by jury gives ordinary people a role in justice."], [90.55, 93.24, "Your turn. Say: Trial by jury."], [96.1, 97.63, "Trial by jury."], [98.38, 99.6, "Judicial review."], [100.62, 104.37, "Judicial review means the power of courts to check whether laws are lawful."], [104.98, 107.61, "Judicial review struck down the unfair law."], [108.22, 110.82, "Your turn. Say: Judicial review."], [113.67, 115.17, "Judicial review."], [115.92, 116.91, "Appeal."], [117.92, 121.4, "Appeal means a request to a higher court to change a decision."], [122.02, 124.47, "The lawyer filed an appeal the next morning."], [125.08, 127.6, "Your turn. Say: Appeal."], [130.43, 131.41, "Appeal."], [132.15, 133.24, "Rule of law."], [134.25, 138.61, "Rule of law means the principle that everyone must obey the same laws."], [139.22, 141.53, "The rule of law applies to presidents too."], [142.12, 144.98, "Your turn. Say: Rule of law."], [147.83, 149.55, "Rule of law."], [150.32, 151.33, "Sentencing."], [152.32, 155.74, "Sentencing means the stage when a court decides the punishment."], [156.35, 159.37, "Sentencing guidelines aim to ensure consistency."], [159.98, 162.3, "Your turn. Say: Sentencing."], [165.13, 166.28, "Sentencing."], [167.1, 170.77, "Part two: dialogue. Let's listen to a conversation."], [171.62, 177.06, "Visal, a judge writes 'Had the police followed due process, the case would not have collapsed.' Where is 'if'?"], [178.15, 189.36, "It is omitted. In formal writing, we can invert had, should or were instead of using if: Had they followed = If they had followed. The meaning is identical."], [190.45, 192.07, "What about the other forms?"], [193.15, 204.73, "Should the appeal fail, the sentence will stand. Were the supreme court to change the precedent, many cases would be reopened. Each is more formal than a normal if-clause."], [205.82, 207.28, "Does the negative change?"], [208.38, 219.79, "Yes: Had the jury not heard the evidence... or Were it not for judicial review, ... Note that we do not contract: we say 'Had they not', not 'Hadn't they'."], [220.93, 222.61, "Part three: grammar."], [223.45, 227.68, "Grammar focus: Conditional inversion: Had and Should and Were."], [227.98, 229.24, "Look at the pattern."], [229.95, 233.34, "Had the police followed due process, the case would not have collapsed."], [234.25, 236.66, "Should the appeal fail, the sentence will stand."], [237.55, 241.37, "Were the court to ignore legal precedent, many cases would be reopened."], [242.33, 252.74, "Drop 'if' and invert: Had + subject + past participle (third), Should + subject + base (possible), Were + subject + to-verb (unreal). Formal use only."], [253.48, 257.18, "Be careful! Don't say: If had they known, it would end."], [259.13, 261.47, "Say: Had they known, it would have ended."], [261.77, 263.48, "Drop 'if' when you invert 'had'."], [264.27, 267.06, "Part four: reading. Read and listen."], [267.87, 269.47, "Fairness Before the Law."], [269.77, 272.89, "A fair court protects both the accused and the community."], [273.9, 277.78, "Had due process been ignored, a verdict could be overturned on appeal."], [278.77, 284.23, "Should a decision seem unfair, the supreme court may order judicial review of the law itself."], [285.23, 289.87, "Were judges free to disregard legal precedent, the rule of law would soon weaken."], [290.87, 295.76, "A trial by jury and a transparent sentencing process also help citizens trust the courts."], [296.87, 300.89, "Part five: quiz. Five questions. Are you ready?"], [301.75, 304.99, "blank the police followed due process, the case would have stood."], [305.29, 308.46, "A, Had. B, If had. C, Have."], [312.0, 313.52, "The answer is A: Had."], [314.68, 317.97, "A request to a higher court to change a decision is an blank."], [318.27, 321.46, "A, precedent. B, appeal. C, jury."], [325.0, 326.8, "The answer is B: appeal."], [327.95, 330.4, "Should the appeal fail, the sentence blank."], [330.7, 334.34, "A, would stand. B, will stand. C, stood."], [337.9, 340.03, "The answer is B: will stand."], [341.18, 343.07, "Choose the correct sentence."], [343.37, 350.92, "A, Were it not for the jury, he would lose.. B, Was it not for the jury, he would lose.. C, Be it not for the jury, he would lose.."], [354.47, 357.84, "The answer is A: Were it not for the jury, he would lose.."], [358.98, 363.0, "According to the reading, a fair court protects the accused and the blank."], [363.3, 367.03, "A, press. B, community. C, police."], [370.57, 372.68, "The answer is B: community."], [373.87, 377.18, "Part six: speaking. It's your turn to talk."], [378.02, 381.61, "Why is 'due process' considered essential to a fair judicial system?"], [390.42, 391.92, "Now listen to Visal."], [392.22, 416.19, "Due process means that the state must follow fair, known procedures before it punishes anyone. It guarantees the right to be informed of charges, to defend oneself and to have the evidence tested in court. Without it, the powerful could imprison opponents without proof. Due process therefore protects the innocent and makes verdicts more trustworthy."], [416.49, 418.19, "Excellent answer, Visal!"], [419.08, 424.84, "Great work! Now you can use eight new words and conditional inversion: had and should and were."], [425.14, 429.15, "Today's value is justice. Stand up for what is fair for everyone."], [429.45, 431.95, "See you in Unit nine. Goodbye!"], [432.25, 435.42, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit09-Local-Government": [[0.35, 5.72, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.02, 9.59, "Hi! I'm Visal. Let's learn together!"], [9.89, 16.24, "Unit nine: Local Government. Today you will write formal notices with will be + -ing and is scheduled to."], [16.54, 19.23, "Here is our lesson map. Let's start!"], [20.17, 23.55, "Part one: words. You will learn eight new words."], [24.42, 25.64, "City council."], [26.65, 29.8, "City council means the elected group that governs a city."], [30.38, 32.67, "The city council approved the new park."], [33.28, 36.06, "Your turn. Say: City council."], [38.9, 40.32, "City council."], [41.08, 42.44, "Municipal budget."], [43.45, 47.21, "Municipal budget means a city's yearly plan for income and spending."], [47.82, 50.63, "The municipal budget includes funds for roads."], [51.22, 54.19, "Your turn. Say: Municipal budget."], [57.03, 58.59, "Municipal budget."], [59.35, 60.84, "Public services."], [61.85, 66.3, "Public services means services such as transport, water and waste collection."], [66.88, 69.05, "Public services need steady funding."], [69.65, 72.86, "Your turn. Say: Public services."], [75.7, 77.15, "Public services."], [77.92, 79.0, "Zoning law."], [79.98, 83.81, "Zoning law means a rule about how land and buildings may be used."], [84.42, 86.89, "A zoning law banned factories near homes."], [87.48, 89.97, "Your turn. Say: Zoning law."], [92.83, 93.9, "Zoning law."], [94.65, 95.9, "Local election."], [96.88, 100.94, "Local election means a vote to choose a town or city's representatives."], [101.55, 104.0, "A local election often has low turnout."], [104.62, 107.55, "Your turn. Say: Local election."], [110.4, 111.66, "Local election."], [112.42, 113.74, "Civic engagement."], [114.75, 118.56, "Civic engagement means taking part in community and political life."], [119.15, 121.6, "Civic engagement strengthens neighbourhoods."], [122.22, 125.19, "Your turn. Say: Civic engagement."], [128.03, 129.51, "Civic engagement."], [130.25, 131.6, "Community project."], [132.58, 136.95, "Community project means a local plan carried out for the benefit of residents."], [137.55, 139.99, "The community project rebuilt the playground."], [140.58, 144.41, "Your turn. Say: Community project."], [147.27, 148.62, "Community project."], [149.35, 150.44, "Public hearing."], [151.45, 155.33, "Public hearing means an official meeting where citizens can speak about a plan."], [155.92, 158.08, "Residents spoke at the public hearing."], [158.68, 161.82, "Your turn. Say: Public hearing."], [164.67, 166.06, "Public hearing."], [166.87, 170.28, "Part two: dialogue. Let's listen to a conversation."], [171.15, 176.8, "Visal, a notice says 'The council will be holding a public hearing on Monday.' Why not just 'will hold'?"], [177.88, 193.88, "The future continuous sounds more polite and describes a planned, ordinary event. It is common in notices: will be holding, will be reviewing, will be publishing. It does not sound like a sudden decision."], [194.98, 196.77, "What other forms appear?"], [197.88, 209.2, "Is scheduled to, is due to, and is to: 'The city council is scheduled to vote on the municipal budget.' These show the plan is official and the date is fixed."], [210.28, 211.92, "Can citizens use them too?"], [213.02, 223.59, "Yes, in letters to the council. 'We will be attending the hearing' is clear and respectful, and good civic engagement starts with polite, precise messages."], [224.73, 226.25, "Part three: grammar."], [227.08, 232.44, "Grammar focus: Formal notices: will be plus -ing and is scheduled to."], [232.74, 234.05, "Look at the pattern."], [234.75, 237.88, "The city council will be holding a public hearing on Monday."], [238.78, 241.91, "The council is scheduled to vote on the municipal budget."], [242.82, 245.73, "Residents will be reviewing the zoning law proposals."], [246.7, 253.54, "Use will be + -ing for planned events in polite notices, and is scheduled to / is due to + verb for fixed official dates."], [254.28, 258.25, "Be careful! Don't say: The council will be hold a hearing."], [260.2, 263.22, "Say: The council will be holding a hearing."], [263.52, 265.08, "Use -ing after will be."], [265.87, 268.42, "Part four: reading. Read and listen."], [269.2, 270.76, "Notice from the Town Hall."], [271.06, 275.66, "Local government shapes daily life more directly than national politics."], [276.67, 284.11, "The city council will be discussing the municipal budget, and public services such as buses and waste collection are scheduled to be reviewed."], [285.1, 290.58, "A public hearing is due to take place before any zoning law changes, and residents will be sharing their views."], [291.57, 296.93, "Civic engagement matters most in a local election, when a few hundred votes can decide a result."], [297.93, 302.06, "A community project often begins with a single neighbour who attends the meeting."], [303.17, 307.34, "Part five: quiz. Five questions. Are you ready?"], [308.18, 310.42, "The council blank a hearing on Monday."], [310.71, 314.64, "A, will be holding. B, is hold. C, will being held."], [318.2, 320.2, "The answer is A: will be holding."], [321.35, 324.39, "Rules about how land can be used are a blank law."], [324.69, 327.86, "A, hearing. B, zoning. C, budget."], [331.4, 333.56, "The answer is B: zoning."], [334.72, 337.18, "The council is scheduled blank on the budget."], [337.48, 340.36, "A, vote. B, voting. C, to vote."], [343.9, 345.6, "The answer is C: to vote."], [346.75, 348.55, "Choose the most formal notice."], [348.85, 354.38, "A, We'll meet Monday.. B, The council will be meeting on Monday.. C, Council meet Monday.."], [357.93, 360.95, "The answer is B: The council will be meeting on Monday.."], [362.12, 366.32, "According to the reading, civic engagement matters most in a blank election."], [366.62, 370.04, "A, local. B, foreign. C, school."], [373.6, 375.46, "The answer is A: local."], [376.67, 379.75, "Part six: speaking. It's your turn to talk."], [380.58, 384.17, "What local government decision has directly affected your daily life?"], [392.98, 394.44, "Now listen to Visal."], [394.74, 420.96, "One local decision that affects daily life is where the council places bus routes or repairs roads. A new route can shorten a journey to school or work, while poor repairs make travel slower and less safe. Decisions about markets, parks and waste collection also shape how clean and convenient a neighbourhood is, so local government matters a great deal."], [421.26, 423.1, "Excellent answer, Visal!"], [423.98, 430.21, "Great work! Now you can use eight new words and formal notices: will be plus -ing and is scheduled to."], [430.51, 436.81, "Today's value is community awareness. Notice how changes affect every neighbour, not only the winners."], [437.11, 439.71, "See you in Unit ten. Goodbye!"], [440.01, 442.96, "Thank you,
