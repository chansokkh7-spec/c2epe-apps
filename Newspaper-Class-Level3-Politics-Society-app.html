8.6, "Rights."], [59.35, 60.76, "Accessibility."], [61.75, 65.85, "Accessibility means the quality of being easy to reach, enter or use."], [66.45, 70.27, "Accessibility includes ramps, lifts and clear signs."], [70.88, 74.24, "Your turn. Say: Accessibility."], [77.1, 78.43, "Accessibility."], [79.18, 80.28, "Inclusion."], [81.28, 84.25, "Inclusion means making sure everyone can take part."], [84.85, 87.77, "Inclusion in schools benefits all students."], [88.38, 90.99, "Your turn. Say: Inclusion."], [93.83, 94.87, "Inclusion."], [95.62, 97.0, "Discrimination."], [98.02, 101.65, "Discrimination means unfair treatment because of who a person is."], [102.25, 104.9, "Discrimination in hiring is against the law."], [105.48, 108.43, "Your turn. Say: Discrimination."], [111.27, 112.57, "Discrimination."], [113.32, 114.05, "Law."], [115.05, 118.45, "Law means a rule made by a government that everyone must follow."], [119.05, 121.89, "The law requires new buildings to be accessible."], [122.48, 124.76, "Your turn. Say: Law."], [127.6, 128.5, "Law."], [129.25, 130.45, "Advocacy."], [131.45, 134.41, "Advocacy means public support for a cause or group."], [135.02, 137.5, "Advocacy brought about the new transport rules."], [138.12, 140.94, "Your turn. Say: Advocacy."], [143.8, 144.89, "Advocacy."], [145.65, 147.22, "Equal opportunity."], [148.22, 151.91, "Equal opportunity means the same chance for everyone to succeed."], [152.52, 155.64, "Equal opportunity means a fair chance at every job."], [156.25, 159.68, "Your turn. Say: Equal opportunity."], [162.53, 164.16, "Equal opportunity."], [164.97, 168.8, "Part two: dialogue. Let's listen to a conversation."], [169.65, 177.61, "Visal, a report says 'Public transport should serve the elderly and people with disabilities.' Why 'the elderly' but 'people with disabilities'?"], [178.72, 193.28, "Some adjectives work as plural nouns with 'the': the elderly, the young, the rich, with a plural verb. Many people prefer person-first language, such as 'people with disabilities', which names the person first."], [194.38, 196.44, "Does language matter for rights?"], [197.55, 209.8, "Yes. Respectful terms support inclusion and reduce discrimination. We avoid 'the disabled' as a label in much modern guidance, and we never say 'a disabled' as a noun."], [210.88, 212.87, "Which structure should I use in law?"], [213.98, 225.22, "Use 'people who have a disability' or 'persons with disabilities', as in many laws. 'The elderly are protected' is acceptable, but 'an elderly' is wrong."], [226.37, 228.09, "Part three: grammar."], [228.95, 233.54, "Grammar focus: The plus adjective for groups; person-first language."], [233.84, 235.08, "Look at the pattern."], [235.78, 239.48, "Public transport should serve the elderly and people with disabilities."], [240.38, 243.91, "The law protects people with a disability from discrimination."], [244.82, 247.99, "Accessibility helps the young and the old equally."], [248.93, 258.97, "the + adjective = a group, with a plural verb (the elderly are). Never use it for one person (not an elderly). Prefer person-first phrases: people with disabilities."], [259.72, 262.97, "Be careful! Don't say: An elderly needs a ramp."], [264.93, 267.47, "Say: The elderly need a ramp."], [267.77, 270.78, "'The elderly' is plural: use the + adjective."], [271.57, 274.24, "Part four: reading. Read and listen."], [275.03, 276.56, "Access for Everyone."], [276.86, 282.07, "Disability rights began as a demand for equal opportunity, not for special treatment."], [283.07, 288.83, "The law now protects people with disabilities from discrimination in education, work and public life."], [289.83, 295.98, "Accessibility, such as ramps, clear signs and digital tools, helps the elderly and the young as well."], [296.97, 302.1, "Inclusion means designing places so that no one needs to ask for permission to enter."], [303.1, 308.14, "Advocacy groups remind governments that the rights of the vulnerable are everyone's responsibility."], [309.23, 313.13, "Part five: quiz. Five questions. Are you ready?"], [313.98, 316.29, "The elderly blank protected by this law."], [316.58, 319.97, "A, is. B, are. C, has."], [323.53, 325.13, "The answer is B: are."], [326.28, 328.82, "Which phrase uses person-first language?"], [329.12, 333.57, "A, the disabled. B, a disabled. C, people with disabilities."], [337.13, 340.61, "The answer is C: people with disabilities."], [341.75, 343.54, "Choose the correct sentence."], [343.84, 349.4, "A, An elderly needs a ramp.. B, The elderly need a ramp.. C, The elderlies need a ramp.."], [352.93, 355.72, "The answer is B: The elderly need a ramp.."], [356.88, 360.18, "Designing places so that everyone can use them is blank."], [360.48, 364.45, "A, inclusion. B, advocacy. C, discrimination."], [368.0, 370.24, "The answer is A: inclusion."], [371.38, 375.81, "According to the reading, disability rights began as a demand for equal blank."], [376.11, 379.8, "A, opportunity. B, salary. C, speed."], [383.33, 385.5, "The answer is A: opportunity."], [386.7, 389.69, "Part six: speaking. It's your turn to talk."], [390.55, 393.41, "How accessible are public places in your city?"], [402.22, 403.64, "Now listen to Visal."], [403.94, 435.37, "In many cities, public places are only partly accessible. New buildings often include ramps and lifts, but older streets may have high kerbs, uneven pavements and no tactile paving. Public transport may lack space for wheelchairs, and signs are rarely available in simple or braille formats. Better design and strong accessibility laws would help everyone move around safely and independently."], [435.67, 437.27, "Excellent answer, Visal!"], [438.18, 444.45, "Great work! Now you can use eight new words and the plus adjective for groups; person-first language."], [444.75, 450.15, "Today's value is respect for differences. Everyone is different, and everyone is special."], [450.45, 453.16, "See you in Unit twenty-two. Goodbye!"], [453.46, 456.09, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit22-Environmental-Policy": [[0.35, 6.19, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.49, 9.57, "Hi! I'm Visal. Let's learn together!"], [9.87, 16.93, "Unit twenty-two: Environmental Policy. Today you will compare ideas with not so much ... as and as much as."], [17.23, 19.96, "Here is our lesson map. Let's start!"], [20.9, 24.34, "Part one: words. You will learn eight new words."], [25.18, 27.11, "Environmental policy."], [28.12, 32.34, "Environmental policy means government plans for protecting nature."], [32.95, 36.59, "Environmental policy now includes climate targets."], [37.18, 40.96, "Your turn. Say: Environmental policy."], [43.8, 46.61, "Environmental policy."], [47.35, 48.52, "Regulation."], [49.52, 53.03, "Regulation means an official rule made by a government body."], [53.62, 56.31, "A new regulation limits factory emissions."], [56.92, 59.6, "Your turn. Say: Regulation."], [62.47, 63.75, "Regulation."], [64.48, 65.4, "Pollution."], [66.42, 70.39, "Pollution means harmful substances in the air, water or soil."], [70.98, 73.02, "Pollution in the river killed the fish."], [73.62, 76.29, "Your turn. Say: Pollution."], [79.13, 80.09, "Pollution."], [80.85, 82.39, "Impact assessment."], [83.38, 87.81, "Impact assessment means an official study of the likely effects of a plan."], [88.42, 91.39, "An impact assessment is required before building."], [91.98, 95.42, "Your turn. Say: Impact assessment."], [98.27, 99.92, "Impact assessment."], [100.68, 101.97, "Protected area."], [102.98, 106.57, "Protected area means land or sea where nature is legally protected."], [107.18, 109.82, "The protected area shelters rare birds."], [110.42, 113.09, "Your turn. Say: Protected area."], [115.93, 117.57, "Protected area."], [118.32, 119.43, "Enforcement."], [120.45, 123.44, "Enforcement means making sure that people obey a law."], [124.05, 127.05, "Enforcement improved after inspectors were hired."], [127.65, 130.19, "Your turn. Say: Enforcement."], [133.03, 134.25, "Enforcement."], [135.02, 136.6, "Public consultation."], [137.58, 141.77, "Public consultation means a process of asking citizens for their views."], [142.35, 144.84, "Public consultation changed the route of the road."], [145.45, 148.89, "Your turn. Say: Public consultation."], [151.73, 153.21, "Public consultation."], [153.95, 155.31, "Sustainability."], [156.32, 160.28, "Sustainability means meeting present needs without harming the future."], [160.88, 164.46, "Sustainability guides the city's long-term plan."], [165.05, 167.68, "Your turn. Say: Sustainability."], [170.53, 172.06, "Sustainability."], [172.87, 176.24, "Part two: dialogue. Let's listen to a conversation."], [177.08, 183.53, "Visal, an expert says 'The problem is not so much the law as its enforcement.' What does 'not so much... as' mean?"], [184.62, 197.08, "It corrects an idea: the real issue is enforcement rather than the law itself. The structure is not so much A as B, where A is the weaker point and B is the more important one."], [198.18, 200.22, "Are there other comparison patterns?"], [201.32, 215.23, "Yes: as much as shows equality (Enforcement matters as much as regulation). Not as/so ... as shows a difference. The more... the more shows a link, and twice as ... as gives a multiple."], [216.32, 218.16, "How do I use them for pollution?"], [219.25, 229.5, "Pollution is not so much a technical problem as a political one. A protected area is only worth as much as the rangers who defend it."], [230.63, 232.16, "Part three: grammar."], [233.02, 238.22, "Grammar focus: Comparison: not so much A as B and as much as."], [238.52, 239.81, "Look at the pattern."], [240.52, 243.6, "The problem is not so much the law as its enforcement."], [244.48, 247.48, "Enforcement matters as much as the regulation itself."], [248.38, 251.73, "Pollution is not so much a technical issue as a political one."], [252.67, 263.71, "Not so much A as B = B is the real point. As much as = equal importance. Not as / so + adjective + as = a lower degree. Use them to compare ideas clearly."], [264.45, 268.1, "Be careful! Don't say: Not so much a slogan than a habit."], [270.07, 272.62, "Say: Not so much a slogan as a habit."], [272.92, 274.77, "Use 'as' after 'not so much'."], [275.57, 278.54, "Part four: reading. Read and listen."], [279.33, 281.8, "Laws on Paper, Laws in Practice."], [282.1, 287.79, "Environmental policy often fails not so much because laws are weak as because enforcement is weak."], [288.8, 293.61, "A regulation on pollution is worth as much as the inspectors who check factories."], [294.6, 299.67, "An impact assessment is not as useful as it could be when public consultation is ignored."], [300.67, 304.83, "A protected area needs money and rangers as much as it needs a map."], [305.83, 311.12, "Sustainability, in the end, is not so much a slogan as a daily habit of government."], [312.23, 316.24, "Part five: quiz. Five questions. Are you ready?"], [317.08, 319.83, "It is not so much the law blank its enforcement."], [320.13, 323.05, "A, than. B, as. C, but."], [326.6, 328.68, "The answer is B: as."], [329.82, 332.17, "Enforcement matters blank the regulation."], [332.47, 336.45, "A, as much as. B, so much as. C, much than."], [340.0, 342.03, "The answer is A: as much as."], [343.18, 346.37, "A place where nature is legally protected is a blank area."], [346.67, 350.2, "A, polluted. B, enforced. C, protected."], [353.77, 356.01, "The answer is C: protected."], [357.15, 358.85, "Choose the correct sentence."], [359.15, 366.35, "A, Not so much a slogan than a habit.. B, Not so much a slogan as a habit.. C, Not much a slogan as a habit.."], [369.9, 373.47, "The answer is B: Not so much a slogan as a habit.."], [374.62, 380.27, "According to the reading, an impact assessment is less useful when public consultation is…"], [380.57, 383.84, "A, ignored. B, complete. C, early."], [387.4, 389.16, "The answer is A: ignored."], [390.37, 393.72, "Part six: speaking. It's your turn to talk."], [394.55, 397.49, "Why is enforcement as important as the law itself?"], [406.28, 407.71, "Now listen to Visal."], [408.01, 432.99, "A law that is not enforced has no practical effect. If factories can pollute without fines, they will treat the rule as optional, and honest companies are punished by unfair competition. Enforcement means inspectors, clear penalties and honest courts. It shows citizens that the law is serious, which builds trust and encourages voluntary compliance."], [433.29, 434.81, "Excellent answer, Visal!"], [435.72, 442.32, "Great work! Now you can use eight new words and comparison: not so much a as b and as much as."], [442.62, 448.58, "Today's value is environmental stewardship. Care for nature as a trust for future generations."], [448.88, 451.99, "See you in Unit twenty-three. Goodbye!"], [452.29, 456.05, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit23-Public-Opinion-and-Polls": [[0.35, 6.14, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.44, 9.62, "Hi! I'm Visal. Let's learn together!"], [9.92, 17.53, "Unit twenty-three: Public Opinion and Polls. Today you will report poll results with proportion phrases."], [17.83, 20.47, "Here is our lesson map. Let's start!"], [21.43, 24.43, "Part one: words. You will learn eight new words."], [25.28, 26.41, "Opinion poll."], [27.42, 30.67, "Opinion poll means a survey that measures what people think."], [31.28, 33.62, "The opinion poll showed a tight race."], [34.22, 37.57, "Your turn. Say: Opinion poll."], [40.4, 41.83, "Opinion poll."], [42.58, 43.48, "Survey."], [44.48, 48.12, "Survey means a set of questions asked to find out people's views."], [48.72, 50.99, "The survey reached two thousand households."], [51.58, 53.95, "Your turn. Say: Survey."], [56.8, 57.74, "Survey."], [58.48, 59.36, "Sample."], [60.35, 64.33, "Sample means a small group chosen to represent a larger one."], [64.95, 67.55, "The sample included people of every age."], [68.15, 70.29, "Your turn. Say: Sample."], [73.13, 74.13, "Sample."], [74.88, 76.12, "Margin of error."], [77.12, 80.56, "Margin of error means the range by which a poll result may be wrong."], [81.15, 83.71, "A margin of error of three points is common."], [84.32, 87.05, "Your turn. Say: Margin of error."], [89.9, 91.1, "Margin of error."], [91.85, 92.98, "Public opinion."], [93.98, 97.57, "Public opinion means the views held by most people about an issue."], [98.18, 100.86, "Public opinion moved quickly after the speech."], [101.45, 104.27, "Your turn. Say: Public opinion."], [107.1, 108.41, "Public opinion."], [109.15, 109.95, "Trend."], [110.95, 114.19, "Trend means a general direction in which something is changing."], [114.78, 117.22, "The trend shows growing support for reform."], [117.82, 120.18, "Your turn. Say: Trend."], [123.03, 123.72, "Trend."], [124.48, 125.7, "Question wording."], [126.72, 130.31, "Question wording means the exact words used to ask a survey question."], [130.92, 132.82, "Question wording can hide bias."], [133.42, 135.88, "Your turn. Say: Question wording."], [138.73, 140.16, "Question wording."], [140.92, 142.03, "Accuracy."], [143.05, 146.26, "Accuracy means the quality of being correct and exact."], [146.85, 149.18, "Accuracy depends on a fair sample."], [149.78, 152.59, "Your turn. Say: Accuracy."], [155.43, 156.57, "Accuracy."], [157.37, 160.61, "Part two: dialogue. Let's listen to a conversation."], [161.45, 169.93, "Visal, a poll report says 'A narrow majority of respondents support the plan, while a significant minority oppose it.' How do I write statistics like this?"], [171.02, 186.45, "Use proportion phrases: the vast majority, a narrow majority, a significant minority, roughly half, two-thirds of, one in five. They are more natural than lists of numbers."], [187.55, 189.42, "Is there a rule for the verb?"], [190.52, 205.14, "A majority of respondents takes a plural verb: A majority of respondents support it. Percentages follow the noun: 40 percent of voters are undecided, because the noun after 'of' decides the verb."], [206.25, 207.99, "How can this show accuracy?"], [209.08, 219.72, "Add the margin of error: 52 percent, plus or minus three points, means the majority is not certain. Good reporting gives both the figure and its limits."], [220.87, 222.55, "Part three: grammar."], [223.42, 228.68, "Grammar focus: Proportion phrases: a narrow majority and a significant minority."], [228.98, 230.21, "Look at the pattern."], [230.92, 233.76, "A narrow majority of respondents support the plan."], [234.65, 237.94, "A significant minority oppose it, roughly one in four."], [238.85, 241.75, "Forty percent of voters are still undecided."], [242.7, 252.19, "Use the vast / a narrow majority, a significant minority, two-thirds / one in five + of + plural noun + plural verb. Add the margin of error to show accuracy."], [252.95, 256.81, "Be careful! Don't say: Forty percent of voters is undecided."], [258.77, 262.11, "Say: Forty percent of voters are undecided."], [262.41, 264.78, "The plural noun takes a plural verb."], [265.6, 268.49, "Part four: reading. Read and listen."], [269.3, 270.58, "Reading the Polls."], [270.88, 275.34, "An opinion poll tries to measure public opinion by asking a sample of people."], [276.33, 281.68, "A narrow majority of respondents may support a plan, while a significant minority oppose it."], [282.67, 287.17, "If the margin of error is three points, a lead of two points does not prove a trend."], [288.17, 293.16, "Question wording matters too, because a leading question can push respondents towards one answer."], [294.17, 298.96, "Accuracy depends on a fair sample; a sample that leaves out one group can mislead."], [300.07, 304.08, "Part five: quiz. Five questions. Are you ready?"], [304.92, 307.74, "A narrow majority of respondents blank the plan."], [308.04, 311.76, "A, supports. B, support. C, is supporting."], [315.3, 317.67, "The answer is B: support."], [318.82, 321.58, "The possible error in a poll's result is the blank."], [321.88, 325.7, "A, margin of error. B, sample. C, trend."], [329.23, 331.3, "The answer is A: margin of error."], [332.45, 335.72, "A small group asked to represent everyone is a blank."], [336.01, 339.64, "A, survey. B, trend. C, sample."], [343.2, 345.36, "The answer is C: sample."], [346.52, 348.16, "Choose the correct sentence."], [348.46, 356.38, "A, Forty percent of voters is undecided.. B, Forty percent of voters are undecided.. C, Forty percents of voters are undecided.."], [359.93, 363.67, "The answer is B: Forty percent of voters are undecided.."], [364.82, 369.03, "According to the reading, a leading question pushes respondents toward one…"], [369.33, 373.19, "A, answer. B, region. C, page."], [376.73, 378.49, "The answer is A: answer."], [379.7, 383.34, "Part six: speaking. It's your turn to talk."], [384.18, 387.26, "How can the wording of a poll question change the results?"], [396.05, 397.62, "Now listen to Visal."], [397.92, 423.92, "The wording of a question can change results because words carry feelings and hints. A leading question such as 'Do you agree that this wasteful tax should end?' pushes people to say yes. Order, choices and even a single adjective can change answers. Careful pollsters use neutral language, test questions in advance and publish the exact wording so that readers can judge the result."], [424.22, 426.05, "Excellent answer, Visal!"], [426.95, 433.48, "Great work! Now you can use eight new words and proportion phrases: a narrow majority and a significant minority."], [433.78, 438.73, "Today's value is evidence-based judgment. Let good evidence guide what you decide."], [439.03, 441.81, "See you in Unit twenty-four. Goodbye!"], [442.11, 445.75, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit24-The-Rule-of-Law": [[0.35, 5.61, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [5.91, 9.31, "Hi! I'm Visal. Let's learn together!"], [9.62, 16.8, "Unit twenty-four: The Rule of Law. Today you will draw logical conclusions with must be, can't be and may well be."], [17.09, 19.75, "Here is our lesson map. Let's start!"], [20.7, 23.97, "Part one: words. You will learn eight new words."], [24.82, 25.91, "Rule of law."], [26.92, 30.76, "Rule of law means the principle that everyone must obey the same laws."], [31.35, 34.66, "The rule of law protects citizens from abuse of power."], [35.25, 38.68, "Your turn. Say: Rule of law."], [41.53, 42.99, "Rule of law."], [43.75, 44.79, "Justice."], [45.78, 48.76, "Justice means fair treatment according to the law."], [49.35, 51.83, "Justice requires an honest and open trial."], [52.42, 55.22, "Your turn. Say: Justice."], [58.07, 59.07, "Justice."], [59.82, 60.71, "Courts."], [61.72, 64.94, "Courts means places where judges decide legal cases."], [65.55, 67.94, "The courts rejected the government's argument."], [68.55, 70.99, "Your turn. Say: Courts."], [73.83, 74.78, "Courts."], [75.52, 76.52, "Equality."], [77.52, 80.89, "Equality means the state of being treated the same way as others."], [81.48, 84.46, "Equality before the law is a basic principle."], [85.05, 87.52, "Your turn. Say: Equality."], [90.37, 91.44, "Equality."], [92.18, 93.66, "Accountability."], [94.65, 98.7, "Accountability means being responsible for your actions and ready to explain them."], [99.32, 102.65, "Accountability means leaders must answer to the public."], [103.25, 106.15, "Your turn. Say: Accountability."], [109.0, 110.16, "Accountability."], [110.92, 112.12, "Constitution."], [113.12, 116.78, "Constitution means the basic written rules by which a country is governed."], [117.38, 120.0, "The constitution limits the power of the president."], [120.58, 123.69, "Your turn. Say: Constitution."], [126.53, 127.72, "Constitution."], [128.48, 129.89, "Independence."], [130.88, 133.84, "Independence means freedom from control by others."], [134.45, 137.17, "Judicial independence protects fair trials."], [137.78, 140.77, "Your turn. Say: Independence."], [143.63, 144.87, "Independence."], [145.62, 146.58, "Rights."], [147.58, 151.44, "Rights means freedoms and protections that every person is entitled to."], [152.05, 154.05, "Courts defend the rights of citizens."], [154.65, 157.71, "Your turn. Say: Rights."], [160.57, 161.43, "Rights."], [162.23, 166.05, "Part two: dialogue. Let's listen to a conversation."], [166.88, 173.92, "Visal, a commentator says 'If no one is above the law, the president must be subject to the courts.' What does 'must be' mean here?"], [175.02, 187.74, "It is a logical deduction, not an order: the conclusion follows from the facts. We use must (very sure), may well or could (possible), and can't or couldn't (sure it is not)."], [188.85, 190.51, "Can you show contrast?"], [191.62, 203.0, "If judges are paid by the government, they can't be fully independent. The verdict may well be fair, but we must be sure. Deduction modals judge evidence, not duties."], [204.12, 205.84, "Which verb forms follow?"], [206.95, 219.62, "Base verb for a state, be + -ing for an action now, and have + past participle for the past: The accused must have known, the court can't have ignored it."], [220.77, 222.06, "Part three: grammar."], [222.92, 228.11, "Grammar focus: Modals of deduction: must be and can't be and may well be."], [228.41, 229.76, "Look at the pattern."], [230.45, 234.5, "If no one is above the law, the president must be subject to the courts."], [235.42, 238.69, "Judges paid by the government can't be fully independent."], [239.58, 242.98, "The verdict may well be fair, but we need evidence."], [243.93, 251.67, "Deduction: must be (very sure), may well be / could be (possible), can't be (sure not). For the past use must / can't have + past participle."], [252.42, 255.53, "Be careful! Don't say: It must been a mistake."], [257.5, 259.35, "Say: It must be a mistake."], [259.65, 261.68, "Use the base verb after must."], [262.47, 265.54, "Part four: reading. Read and listen."], [266.33, 267.71, "No One Above the Law."], [268.01, 272.84, "The rule of law means that everyone, including rulers, must obey the same rules."], [273.83, 278.28, "If courts are truly free, a powerful minister can't be treated differently from a citizen."], [279.27, 284.09, "Where judges depend on politicians for their jobs, their independence must be weak."], [285.1, 291.42, "Equality before the law may well be the oldest idea of justice, and accountability is how it is kept alive."], [292.43, 296.56, "A constitution that protects rights can only work if courts are respected."], [297.67, 301.85, "Part five: quiz. Five questions. Are you ready?"], [302.72, 305.67, "If he is above the law, the system blank be fair."], [305.97, 309.36, "A, must. B, can't. C, should."], [312.9, 314.56, "The answer is B: can't."], [315.72, 317.79, "Judges free from pressure show blank."], [318.09, 322.03, "A, independence. B, bias. C, debt."], [325.57, 327.9, "The answer is A: independence."], [329.05, 332.12, "The accused blank known the law, since he studied it."], [332.42, 335.87, "A, can have. B, must be. C, must have."], [339.43, 341.84, "The answer is C: must have."], [342.98, 344.68, "Choose the correct sentence."], [344.98, 350.1, "A, It must been a mistake.. B, It must be a mistake.. C, It must being a mistake.."], [353.63, 356.19, "The answer is B: It must be a mistake.."], [357.35, 361.01, "According to the reading, accountability keeps the idea of equality…"], [361.31, 364.92, "A, alive. B, secret. C, small."], [368.47, 370.63, "The answer is A: alive."], [371.83, 375.18, "Part six: speaking. It's your turn to talk."], [376.02, 378.28, "Why is judicial independence important?"], [387.08, 388.69, "Now listen to Visal."], [388.99, 416.61, "Judicial independence means judges can decide cases based on law and evidence, without pressure from politicians, businesses or the public. If judges feared losing their jobs for unpopular decisions, they could not protect minorities or limit government power. Independent courts therefore guard the rule of law, treat everyone equally and give citizens confidence that justice cannot be bought."], [416.9, 418.72, "Excellent answer, Visal!"], [419.62, 425.82, "Great work! Now you can use eight new words and modals of deduction: must be and can't be and may well be."], [426.12, 431.27, "Today's value is impartiality. Treat every side fairly, without taking sides."], [431.57, 434.33, "See you in Unit twenty-five. Goodbye!"], [434.63, 438.66, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit25-Digital-Rights-and-Privacy": [[0.35, 5.71, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.01, 9.35, "Hi! I'm Visal. Let's learn together!"], [9.65, 16.98, "Unit twenty-five: Digital Rights and Privacy. Today you will shorten relative clauses with -ing and -ed participles."], [17.28, 19.93, "Here is our lesson map. Let's start!"], [20.9, 24.26, "Part one: words. You will learn eight new words."], [25.12, 26.39, "Digital rights."], [27.38, 31.64, "Digital rights means the rights people have when they use the internet and digital devices."], [32.25, 35.62, "Digital rights include privacy and free expression online."], [36.22, 38.91, "Your turn. Say: Digital rights."], [41.77, 43.07, "Digital rights."], [43.82, 44.74, "Privacy."], [45.75, 49.19, "Privacy means the right to keep personal information to yourself."], [49.78, 51.95, "Privacy is a basic human right."], [52.55, 55.14, "Your turn. Say: Privacy."], [58.0, 59.06, "Privacy."], [59.82, 61.06, "Data protection."], [62.05, 66.06, "Data protection means laws and methods that keep personal information safe."], [66.65, 70.17, "Data protection law requires companies to store data securely."], [70.78, 74.05, "Your turn. Say: Data protection."], [76.9, 78.05, "Data protection."], [78.82, 79.97, "Surveillance."], [80.98, 84.52, "Surveillance means close watching of people, often in secret."], [85.12, 87.51, "Mass surveillance raised public concern."], [88.12, 90.68, "Your turn. Say: Surveillance."], [93.53, 94.67, "Surveillance."], [95.42, 96.41, "Consent."], [97.42, 100.55, "Consent means permission that a person freely gives."], [101.15, 104.03, "Apps must ask for consent before collecting data."], [104.62, 107.07, "Your turn. Say: Consent."], [109.93, 110.87, "Consent."], [111.62, 112.95, "Online speech."], [113.95, 117.47, "Online speech means what people say and publish on the internet."], [118.08, 121.21, "Online speech should be free but responsible."], [121.82, 124.5, "Your turn. Say: Online speech."], [127.37, 128.84, "Online speech."], [129.58, 130.72, "Regulation."], [131.72, 134.95, "Regulation means an official rule made by a government body."], [135.55, 138.51, "A new regulation limits how data may be sold."], [139.12, 141.87, "Your turn. Say: Regulation."], [144.73, 145.98, "Regulation."], [146.72, 147.9, "Platforms."], [148.92, 153.24, "Platforms means websites or apps where people share content and services."], [153.85, 156.27, "Platforms gather huge amounts of user data."], [156.88, 159.47, "Your turn. Say: Platforms."], [162.3, 163.21, "Platforms."], [164.0, 167.64, "Part two: dialogue. Let's listen to a conversation."], [168.48, 174.56, "Visal, a report says 'Data collected by platforms is often sold.' Where is 'which is'?"], [175.65, 190.09, "It is omitted. A reduced relative clause uses a participle: data (which is) collected by platforms. We use -ed for passive meaning and -ing for active meaning: users sharing personal details."], [191.18, 192.94, "When can we reduce a clause?"], [194.05, 204.94, "When the relative pronoun is the subject. We say 'laws protecting privacy' for 'laws which protect privacy', and 'consent given online' for 'consent which is given online'."], [206.05, 208.21, "Why is it popular in legal writing?"], [209.32, 218.68, "It is concise. 'Regulation governing online speech' and 'surveillance conducted without a warrant' save words and keep sentences clear."], [219.83, 221.17, "Part three: grammar."], [222.02, 226.47, "Grammar focus: Reduced relative clauses: -ing and -ed."], [226.77, 227.98, "Look at the pattern."], [228.68, 232.38, "Data collected by platforms is often sold to advertisers."], [233.28, 235.96, "Laws protecting privacy are being updated."], [236.85, 241.04, "Surveillance conducted without consent violates digital rights."], [242.0, 252.04, "Reduce a relative clause with -ing (active) or -ed (passive): data (which is) collected..., laws (which) protect → laws protecting. Only when the pronoun is the subject."], [252.78, 257.17, "Be careful! Don't say: Users shared data should be careful."], [259.1, 261.61, "Say: Users sharing data should be careful."], [261.91, 263.74, "Use -ing for an active meaning."], [264.53, 266.87, "Part four: reading. Read and listen."], [267.67, 268.98, "Your Data, Your Rights."], [269.28, 273.16, "Digital rights are the basic freedoms people expect when using the internet."], [274.17, 278.87, "Personal data collected by platforms can reveal habits, opinions and locations."], [279.87, 285.2, "Regulation requiring clear consent, and laws protecting privacy, give users some control."], [286.2, 291.77, "Surveillance conducted in secret, even for security reasons, risks harming online speech."], [292.77, 297.61, "People wanting safe services should read what they agree to, and governments should keep rules simple."], [298.7, 302.77, "Part five: quiz. Five questions. Are you ready?"], [303.62, 306.12, "Data blank by platforms is often sold."], [306.42, 310.31, "A, collecting. B, collected. C, collect."], [313.87, 316.18, "The answer is B: collected."], [317.32, 319.71, "Laws blank privacy are being updated."], [320.01, 323.75, "A, protecting. B, protected. C, protect."], [327.3, 329.53, "The answer is A: protecting."], [330.68, 333.15, "Permission that a user freely gives is blank."], [333.45, 337.46, "A, surveillance. B, regulation. C, consent."], [341.0, 342.76, "The answer is C: consent."], [343.92, 345.64, "Choose the correct sentence."], [345.94, 352.95, "A, Users shared data should be careful.. B, Users sharing data should be careful.. C, Users share data should be careful.."], [356.5, 359.94, "The answer is B: Users sharing data should be careful.."], [361.08, 364.94, "According to the reading, secret surveillance risks harming online…"], [365.24, 368.71, "A, games. B, prices. C, speech."], [372.27, 374.29, "The answer is C: speech."], [375.5, 378.34, "Part six: speaking. It's your turn to talk."], [379.18, 382.24, "How much personal data should apps be allowed to collect?"], [391.05, 392.51, "Now listen to Visal."], [392.81, 420.13, "Apps should collect only the data they need to provide their service, and they should explain clearly what they take and why. Users should give real consent, not hidden in long terms, and be able to delete their data. Sensitive information, such as location or health records, needs extra protection. Strong data protection rules keep convenience from becoming surveillance."], [420.43, 422.28, "Excellent answer, Visal!"], [423.18, 428.6, "Great work! Now you can use eight new words and reduced relative clauses: -ing and -ed."], [428.9, 434.16, "Today's value is digital responsibility. Use technology in ways that protect others."], [434.46, 441.8, "Congratulations! You have finished Online Newspaper Class, level three. See you in Online Newspaper Class, level four!"], [442.1, 444.66, "Thank you, Ms. Emma! Bye, everyone!"]]};
        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        function renderContent() {
            let contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            stopVideo();                 // never leave a video playing in the background
            stopTalkTimer();             // ...or a Let's Talk timer running
            updateVideoTabBadge();
            // Always shows the real level and unit (it used to say "A1" on every level)
            document.getElementById('platform-info').textContent = `C2-EPE Newspaper Class - ${gradeName(state.level)} (Unit ${state.unit}: ${unitData.title})`;
            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'learn') renderLearn(contentDiv, unitData);
            else if (state.tab === 'terms') renderTerms(contentDiv, unitData);
            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'think') renderThink(contentDiv, unitData);
            else if (state.tab === 'funfact') renderFunFact(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);

            else if (state.tab === 'headline') renderHeadlineWriting(contentDiv, unitData);
            else if (state.tab === 'factopinion') renderFactOpinion(contentDiv, unitData);

            else if (state.tab === 'dictation') renderDictation(contentDiv, unitData);
            else if (state.tab === 'review') renderReview(contentDiv, unitData);
            else if (state.tab === 'pronunciation') renderPronunciationDrill(contentDiv, unitData);
            else if (state.tab === 'exam') renderExamPractice(contentDiv, unitData);
            else if (state.tab === 'challenge') renderGoal(contentDiv, unitData);
            else if (state.tab === 'codelab') renderCodeLab(contentDiv, unitData);
        }

        // ===== MY PROGRESS =====
        const ALL_TABS = ['video','learn','terms','quiz','think','funfact','vocabgame','spelling','sentence','summary','headline','factopinion','debate','discussion','dictation','review','pronunciation','exam','challenge'];
        function markActivityComplete(tab) {
            progress.completed = progress.completed || {};
            const key = state.level + '_' + state.unit + '_' + tab;
            if (!progress.completed[key]) { progress.completed[key] = true; saveProgress(); }
        }
        function showMyProgress() {
            const lines = LEVELS_ORDER.map(lvl => {
                let data = null;
                if (lvl === state.level) data = progress;
                else { try { data = JSON.parse(localStorage.getItem(PROGRESS_PREFIX + lvl) || 'null'); } catch (e) {} }
                const done = data && data.completed ? Object.keys(data.completed).filter(k => k.startsWith(lvl + '_')).length : 0;
                const total = Object.keys(curriculum[lvl]).length * ALL_TABS.length;
                return `${gradeName(lvl)}: ${done} / ${total} activities (${Math.round(done / total * 100)}%)${lvl === state.level ? ' ← current' : ''}`;
            }).join('\n');
            const unitDone = ALL_TABS.filter(t => progress.completed && progress.completed[state.level + '_' + state.unit + '_' + t]).length;
            alert(`📊 My Progress\n\n⭐ Stars: ${state.stars}\n🏆 Badges: ${state.badges}\n\nThis unit (Unit ${state.unit}): ${unitDone} / ${ALL_TABS.length} modules done\n\n${lines}\n\n(Saved on this device/browser only. Inside the Hub, progress lasts until the page is closed.)`);
        }

        // ===== 1. LEARN =====
        function renderLearn(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">📖 Learn: ${unitData.title}</h2>

                    <div class="flex gap-3 flex-wrap items-center">
                        <button onclick="readPassageAloud()" class="bg-slate-600 hover:bg-slate-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Read Aloud</button>
                        <button onclick="finishReading()" class="bg-white border border-slate-300 text-slate-800 font-bold px-5 py-2 rounded-full shadow cursor-pointer">✅ I read it</button>
                    </div>
                    <p id="learn-msg" class="text-sm mt-3 font-semibold text-green-600 min-h-[1.25rem]"></p>
                </div>`;
        }
        // Reading counts as done after listening OR tapping "I read it" (listening used to be the
        // only way, and speech doesn't work in every browser)
        function finishReading() {
            markActivityComplete('learn');
            document.getElementById('learn-msg').textContent = '✅ Well done!' + (award(unitKey('learn'), 2) ? ' (+2 ⭐)' : '');

        function readPassageAloud() {
