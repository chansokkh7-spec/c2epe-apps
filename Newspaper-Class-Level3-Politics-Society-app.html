 Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit10-Immigration-Policy": [[0.35, 5.91, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.21, 10.06, "Hi! I'm Visal. Let's learn together!"], [10.36, 17.04, "Unit ten: Immigration Policy. Today you will discuss open immigration questions with noun clauses."], [17.34, 19.84, "Here is our lesson map. Let's start!"], [20.8, 24.23, "Part one: words. You will learn eight new words."], [25.08, 26.12, "Visa system."], [27.12, 31.22, "Visa system means the rules that decide who may enter or stay in a country."], [31.82, 35.12, "The visa system was changed to attract skilled workers."], [35.72, 38.9, "Your turn. Say: Visa system."], [41.77, 43.12, "Visa system."], [43.85, 45.02, "Border control."], [46.02, 49.77, "Border control means the checking of people and goods crossing a border."], [50.38, 52.98, "Border control was tightened after the announcement."], [53.58, 56.32, "Your turn. Say: Border control."], [59.17, 60.69, "Border control."], [61.45, 62.97, "Pathway to citizenship."], [63.98, 68.51, "Pathway to citizenship means a legal route by which residents can become citizens."], [69.12, 72.37, "The bill offered a pathway to citizenship after ten years."], [72.98, 76.51, "Your turn. Say: Pathway to citizenship."], [79.37, 81.2, "Pathway to citizenship."], [81.95, 83.43, "Asylum process."], [84.42, 89.35, "Asylum process means the legal steps for people seeking protection from danger."], [89.95, 92.51, "The asylum process can take several years."], [93.12, 96.33, "Your turn. Say: Asylum process."], [99.17, 100.72, "Asylum process."], [101.48, 103.11, "Immigration reform."], [104.12, 107.77, "Immigration reform means changes made to the laws on migration."], [108.35, 110.86, "Immigration reform divided the parliament."], [111.45, 114.73, "Your turn. Say: Immigration reform."], [117.57, 119.17, "Immigration reform."], [119.92, 121.3, "Labor migration."], [122.32, 126.12, "Labor migration means the movement of people to another country to work."], [126.72, 130.26, "Labor migration fills shortages in farming and care work."], [130.85, 134.2, "Your turn. Say: Labor migration."], [137.03, 138.57, "Labor migration."], [139.32, 140.97, "Integration policy."], [141.98, 146.46, "Integration policy means plans to help newcomers take part fully in society."], [147.05, 150.27, "Integration policy includes language classes."], [150.88, 154.36, "Your turn. Say: Integration policy."], [157.2, 158.9, "Integration policy."], [159.65, 161.32, "Undocumented status."], [162.32, 167.59, "Undocumented status means the situation of living in a country without legal papers."], [168.18, 171.45, "Undocumented status makes it hard to find safe work."], [172.05, 175.64, "Your turn. Say: Undocumented status."], [178.5, 180.29, "Undocumented status."], [181.1, 184.8, "Part two: dialogue. Let's listen to a conversation."], [185.65, 192.71, "Visal, an editorial says 'Whether applicants qualify depends on the visa system.' What is 'whether applicants qualify'?"], [193.82, 209.18, "It is a noun clause acting as the subject. Noun clauses begin with whether, if, what, how, why or that, and they keep statement word order: whether applicants qualify, not whether do applicants qualify."], [210.28, 212.47, "Can they follow verbs and prepositions?"], [213.58, 224.31, "Yes. 'Nobody knows how many people will arrive.' 'The debate is about what a fair pathway to citizenship should look like.' Notice there is no question inversion."], [225.42, 227.79, "Why is this useful in policy writing?"], [228.88, 239.44, "It lets us discuss open questions formally: why border control is tightened, whether immigration reform will pass, and who should decide."], [240.6, 242.17, "Part three: grammar."], [243.02, 247.77, "Grammar focus: Noun clauses: whether and how and what plus clause."], [248.07, 249.25, "Look at the pattern."], [249.95, 253.12, "Whether applicants qualify depends on the visa system."], [254.02, 257.05, "Nobody knows how many people will seek asylum this year."], [257.95, 261.54, "The debate is about what a fair pathway to citizenship should look like."], [262.5, 271.2, "A noun clause (whether / how / what / why + subject + verb) keeps statement word order: 'what it costs', not 'what does it cost'. Use 'whether' after prepositions."], [271.95, 275.57, "Be careful! Don't say: I wonder what does it cost."], [277.5, 279.85, "Say: I wonder what it costs."], [280.15, 282.52, "A noun clause keeps statement word order."], [283.33, 285.94, "Part four: reading. Read and listen."], [286.73, 288.13, "The Immigration Debate."], [288.43, 291.6, "Few issues divide voters as sharply as immigration."], [292.6, 297.25, "What a country needs from newcomers, and how many it can welcome, remain open questions."], [298.23, 306.05, "Supporters of immigration reform argue that labor migration fills shortages, while critics worry about how border control can work fairly."], [307.03, 313.48, "Whether a person with undocumented status deserves a pathway to citizenship is one of the hardest questions of all."], [314.47, 319.45, "Good integration policy begins by asking what newcomers and communities each need."], [320.53, 324.38, "Part five: quiz. Five questions. Are you ready?"], [325.25, 327.94, "Nobody knows blank many people will arrive."], [328.24, 331.71, "A, how. B, what do. C, that."], [335.27, 336.87, "The answer is A: how."], [338.02, 341.34, "A route that lets residents become full citizens is a blank."], [341.64, 346.34, "A, border control. B, pathway to citizenship. C, visa system."], [349.9, 353.42, "The answer is B: pathway to citizenship."], [354.58, 356.24, "Choose the correct sentence."], [356.53, 362.73, "A, I wonder what does it cost.. B, I wonder what costs it.. C, I wonder what it costs.."], [366.27, 369.32, "The answer is C: I wonder what it costs.."], [370.48, 373.12, "The movement of workers between countries is blank."], [373.42, 378.62, "A, asylum process. B, labor migration. C, immigration reform."], [382.17, 384.65, "The answer is B: labor migration."], [385.82, 392.0, "According to the reading, good integration begins by asking what newcomers and communities each blank."], [392.3, 395.53, "A, need. B, owe. C, fear."], [399.07, 401.0, "The answer is A: need."], [402.2, 405.31, "Part six: speaking. It's your turn to talk."], [406.15, 411.01, "What makes immigration policy such a difficult and debated topic in many countries?"], [419.82, 421.48, "Now listen to Visal."], [421.78, 453.33, "Immigration policy is difficult because it touches many values at once: economic needs, security, humanitarian duty and national identity. Businesses may want workers, while some citizens worry about wages, housing or culture. Governments must also respect international law on asylum. Because each group sees different costs and benefits, finding a policy that most people accept is very hard."], [453.63, 455.3, "Excellent answer, Visal!"], [456.18, 462.44, "Great work! Now you can use eight new words and noun clauses: whether and how and what plus clause."], [462.74, 467.86, "Today's value is open-mindedness. Listen to new ideas before you judge them."], [468.16, 470.56, "See you in Unit eleven. Goodbye!"], [470.86, 474.15, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit11-Education-Policy": [[0.35, 6.15, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.45, 9.96, "Hi! I'm Visal. Let's learn together!"], [10.27, 16.52, "Unit eleven: Education Policy. Today you will emphasise key points with what-clauses."], [16.82, 19.38, "Here is our lesson map. Let's start!"], [20.33, 23.75, "Part one: words. You will learn eight new words."], [24.62, 26.13, "Public school funding."], [27.12, 31.31, "Public school funding means government money used to run state schools."], [31.92, 34.66, "Public school funding rose by five percent."], [35.25, 38.27, "Your turn. Say: Public school funding."], [41.13, 42.72, "Public school funding."], [43.45, 44.88, "Standardized testing."], [45.88, 50.1, "Standardized testing means using the same exam to measure all students."], [50.72, 53.91, "Standardized testing allows schools to be compared."], [54.52, 57.91, "Your turn. Say: Standardized testing."], [60.77, 62.36, "Standardized testing."], [63.12, 64.42, "Curriculum reform."], [65.42, 68.95, "Curriculum reform means changes to what and how schools teach."], [69.55, 72.75, "Curriculum reform added digital skills lessons."], [73.35, 76.19, "Your turn. Say: Curriculum reform."], [79.03, 80.72, "Curriculum reform."], [81.48, 82.62, "Teacher shortage."], [83.62, 88.04, "Teacher shortage means a situation in which there are too few qualified teachers."], [88.65, 91.61, "The teacher shortage forced schools to merge classes."], [92.22, 94.89, "Your turn. Say: Teacher shortage."], [97.73, 98.85, "Teacher shortage."], [99.62, 100.99, "School choice."], [101.98, 106.64, "School choice means the freedom of families to pick which school a child attends."], [107.25, 109.5, "School choice has supporters and critics."], [110.12, 112.84, "Your turn. Say: School choice."], [115.7, 117.14, "School choice."], [117.88, 119.79, "Higher education access."], [120.78, 125.75, "Higher education access means the chance for people to enter university or college."], [126.35, 129.2, "Scholarships improve higher education access."], [129.78, 133.2, "Your turn. Say: Higher education access."], [136.07, 137.97, "Higher education access."], [138.72, 140.28, "Education equity."], [141.28, 145.65, "Education equity means fair opportunities in learning for every student."], [146.25, 149.54, "Education equity means extra help where it is needed."], [150.15, 153.41, "Your turn. Say: Education equity."], [156.27, 158.32, "Education equity."], [159.08, 160.17, "Dropout rate."], [161.15, 165.11, "Dropout rate means the percentage of students who leave school early."], [165.72, 168.62, "The dropout rate fell after the new support programme."], [169.22, 171.97, "Your turn. Say: Dropout rate."], [174.83, 176.11, "Dropout rate."], [176.9, 180.26, "Part two: dialogue. Let's listen to a conversation."], [181.12, 188.0, "Visal, a minister says 'What schools need is more qualified teachers.' Why not simply 'Schools need more qualified teachers'?"], [189.08, 203.74, "The pseudo-cleft, with what, puts the key information at the end for emphasis. What + subject + verb + is/was + focus: What worries parents is the dropout rate."], [204.85, 206.73, "Can the focus be a clause?"], [207.85, 220.94, "Yes: What the reform did was to reduce standardized testing. Note that 'do' is used when the focus is an action: What the government must do is increase public school funding."], [222.05, 223.75, "Is it only for formal writing?"], [224.85, 236.28, "No, it is strong in debates and speeches. All that students want is fair access to higher education, and the thing that matters is education equity."], [237.43, 239.06, "Part three: grammar."], [239.92, 243.69, "Grammar focus: Emphasis: What schools need is."], [243.99, 245.21, "Look at the pattern."], [245.92, 248.61, "What schools need is more qualified teachers."], [249.52, 252.36, "What worries parents is the rising dropout rate."], [253.25, 256.5, "What the government must do is increase public school funding."], [257.47, 267.98, "Pseudo-cleft: What + clause + is / was + focus. If the focus is an action, use do: What we must do is invest. It adds emphasis to the end of the sentence."], [268.72, 272.66, "Be careful! Don't say: What worries me it is the cost."], [274.6, 276.77, "Say: What worries me is the cost."], [277.07, 279.11, "Do not add 'it' after the what-clause."], [279.9, 282.34, "Part four: reading. Read and listen."], [283.13, 284.78, "Rethinking Our Schools."], [285.08, 289.8, "Education policy affects every family, yet experts disagree about what works."], [290.8, 297.66, "What many teachers report is a serious teacher shortage, and what critics question is the heavy use of standardized testing."], [298.67, 305.61, "What supporters of school choice want is freedom for parents, whereas others insist that public school funding must come first."], [306.6, 311.08, "What curriculum reform must do is prepare students for work and citizenship."], [312.1, 318.41, "Ultimately, what every system should guarantee is higher education access for talented students from poor families."], [319.5, 323.93, "Part five: quiz. Five questions. Are you ready?"], [324.78, 327.41, "What schools need blank more qualified teachers."], [327.71, 330.58, "A, are. B, is. C, have."], [334.13, 335.99, "The answer is B: is."], [337.15, 340.18, "A lack of enough qualified teachers is a teacher blank."], [340.48, 344.29, "A, choice. B, reform. C, shortage."], [347.83, 350.05, "The answer is C: shortage."], [351.22, 353.84, "What the government must do blank increase funding."], [354.14, 357.4, "A, is to. B, does. C, has."], [360.97, 362.77, "The answer is A: is to."], [363.92, 365.61, "Choose the correct sentence."], [365.91, 372.54, "A, What worries me it is the cost.. B, What worries me is the cost.. C, What worries me are the cost.."], [376.1, 379.3, "The answer is B: What worries me is the cost.."], [380.45, 384.33, "According to the reading, a system should guarantee higher education blank."], [384.63, 388.17, "A, debt. B, access. C, tests."], [391.73, 394.25, "The answer is B: access."], [395.47, 398.51, "Part six: speaking. It's your turn to talk."], [399.35, 403.89, "Should standardized testing play a large role in evaluating students and schools?"], [412.68, 414.13, "Now listen to Visal."], [414.43, 442.77, "Standardized testing can give a fair, comparable measure of what students have learned, and it can show which schools need help. However, relying on it too heavily may narrow the curriculum, increase stress and ignore creativity or teamwork. A balanced system would use tests as one source of evidence, together with teacher assessment, projects and each student's progress over time."], [443.07, 444.78, "Excellent answer, Visal!"], [445.68, 450.99, "Great work! Now you can use eight new words and emphasis: what schools need is."], [451.29, 456.76, "Today's value is educational equity. Every learner deserves a fair chance to succeed."], [457.06, 459.81, "See you in Unit twelve. Goodbye!"], [460.11, 462.67, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit12-Healthcare-Policy": [[0.35, 5.91, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.21, 9.63, "Hi! I'm Visal. Let's learn together!"], [9.93, 15.88, "Unit twelve: Healthcare Policy. Today you will choose the right verb after a number of and the number of."], [16.18, 18.82, "Here is our lesson map. Let's start!"], [19.77, 23.24, "Part one: words. You will learn eight new words."], [24.08, 26.11, "Universal healthcare."], [27.12, 32.0, "Universal healthcare means a system that provides medical care for all citizens."], [32.58, 35.45, "Universal healthcare is funded through taxes."], [36.05, 39.61, "Your turn. Say: Universal healthcare."], [42.47, 45.36, "Universal healthcare."], [46.12, 47.5, "Health insurance."], [48.52, 53.12, "Health insurance means an arrangement in which payments cover the cost of medical care."], [53.72, 56.41, "Health insurance covers most hospital bills."], [57.02, 60.2, "Your turn. Say: Health insurance."], [63.07, 64.81, "Health insurance."], [65.55, 66.97, "Public health system."], [67.98, 71.81, "Public health system means hospitals and services run by the government."], [72.42, 75.54, "The public health system treated millions of patients."], [76.15, 79.53, "Your turn. Say: Public health system."], [82.4, 83.94, "Public health system."], [84.68, 85.95, "Medical cost."], [86.95, 89.92, "Medical cost means the money needed to pay for treatment."], [90.52, 93.75, "A single operation can raise the medical cost sharply."], [94.35, 97.14, "Your turn. Say: Medical cost."], [100.0, 101.33, "Medical cost."], [102.08, 103.69, "Healthcare access."], [104.68, 108.91, "Healthcare access means the ability to reach and use medical services."], [109.52, 112.81, "Healthcare access is limited in remote villages."], [113.42, 116.56, "Your turn. Say: Healthcare access."], [119.4, 121.04, "Healthcare access."], [121.78, 122.99, "Preventive care."], [123.98, 128.01, "Preventive care means medical care that stops illness before it starts."], [128.62, 131.5, "Preventive care includes vaccination and screening."], [132.08, 135.01, "Your turn. Say: Preventive care."], [137.87, 138.97, "Preventive care."], [139.72, 141.2, "Health disparity."], [142.22, 146.09, "Health disparity means an unfair difference in health between groups."], [146.68, 150.17, "A health disparity separates rich and poor districts."], [150.78, 154.26, "Your turn. Say: Health disparity."], [157.1, 158.38, "Health disparity."], [159.12, 160.86, "Pharmaceutical regulation."], [161.85, 166.98, "Pharmaceutical regulation means official rules controlling how medicines are made and sold."], [167.58, 171.29, "Pharmaceutical regulation protects patients from unsafe drugs."], [171.88, 175.55, "Your turn. Say: Pharmaceutical regulation."], [178.4, 180.12, "Pharmaceutical regulation."], [180.93, 184.62, "Part two: dialogue. Let's listen to a conversation."], [185.48, 191.87, "Visal, a report says 'A number of patients are waiting' but 'The number of patients is rising.' Why do the verbs differ?"], [192.98, 204.67, "A number of means 'several' and takes a plural verb. The number of is a single figure, so it takes a singular verb. A small change in the article changes the agreement."], [205.78, 207.61, "What about uncountable nouns?"], [208.72, 221.97, "We say a great deal of medical cost, a large amount of funding, and little preventive care. Use many and a number of with countable nouns, and much, a great deal of with uncountable nouns."], [223.08, 225.63, "Can you show a healthcare example?"], [226.72, 237.13, "A great deal of evidence suggests that universal healthcare lowers health disparity, but the amount of money required remains a matter of debate."], [238.3, 239.78, "Part three: grammar."], [240.62, 244.56, "Grammar focus: Quantifiers: a number of and the number of."], [244.85, 246.06, "Look at the pattern."], [246.75, 249.14, "A number of patients are waiting for treatment."], [250.05, 252.57, "The number of patients is rising every year."], [253.48, 257.05, "A great deal of evidence suggests that preventive care saves money."], [258.0, 267.83, "A number of + plural verb; the number of + singular verb. Use a great deal of / a large amount of with uncountable nouns, and a large number of with countable ones."], [268.58, 272.4, "Be careful! Don't say: A number of doctor is needed."], [274.33, 277.16, "Say: A number of doctors are needed."], [277.46, 279.85, "A number of takes a plural noun and verb."], [280.67, 283.44, "Part four: reading. Read and listen."], [284.23, 285.7, "Who Pays for Health?."], [286.0, 289.87, "Healthcare is one of the largest expenses in any national budget."], [290.87, 299.05, "A number of countries offer universal healthcare through a public health system, while the number of people with private health insurance remains high elsewhere."], [300.07, 304.7, "A great deal of research shows that preventive care reduces long-term medical cost."], [305.7, 312.34, "Even so, a large amount of money is still needed, and a health disparity often remains between rich and poor areas."], [313.33, 318.26, "Pharmaceutical regulation, meanwhile, aims to keep medicines both safe and affordable."], [319.37, 323.38, "Part five: quiz. Five questions. Are you ready?"], [324.22, 326.27, "A number of patients blank waiting."], [326.57, 329.85, "A, is. B, are. C, was being."], [333.4, 335.33, "The answer is B: are."], [336.48, 338.63, "The number of patients blank rising."], [338.93, 342.1, "A, are. B, were. C, is."], [345.63, 347.77, "The answer is C: is."], [348.92, 351.76, "blank evidence suggests that prevention saves money."], [352.06, 355.98, "A, A great deal of. B, Many. C, A number of."], [359.53, 362.01, "The answer is A: A great deal of."], [363.15, 364.93, "Choose the correct sentence."], [365.23, 371.76, "A, A number of doctor is needed.. B, The number of doctors are growing.. C, A number of doctors are needed.."], [375.3, 378.55, "The answer is C: A number of doctors are needed.."], [379.72, 385.04, "According to the reading, pharmaceutical regulation aims to keep medicines safe and blank."], [385.34, 389.04, "A, affordable. B, secret. C, rare."], [392.6, 394.36, "The answer is A: affordable."], [395.57, 399.03, "Part six: speaking. It's your turn to talk."], [399.88, 404.62, "What are the tradeoffs between a universal healthcare system and a private insurance system?"], [413.42, 414.95, "Now listen to Visal."], [415.25, 445.25, "A universal system guarantees access for everyone and can control costs by negotiating prices, but it may need high taxes and can create waiting lists. A private insurance system often offers choice and faster treatment for those who can pay, yet it can leave poorer people uncovered and make costs rise. Each model trades equality against flexibility, so societies must decide their priorities."], [445.55, 447.42, "Excellent answer, Visal!"], [448.32, 453.38, "Great work! Now you can use eight new words and quantifiers: a number of and the number of."], [453.68, 458.53, "Today's value is equity. Make room for the voices that are often left unheard."], [458.83, 461.61, "See you in Unit thirteen. Goodbye!"], [461.91, 464.78, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit13-Gender-Equality": [[0.35, 6.36, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.66, 10.22, "Hi! I'm Visal. Let's learn together!"], [10.52, 17.33, "Unit thirteen: Gender Equality. Today you will contrast ideas with whereas, nevertheless and even so."], [17.63, 20.25, "Here is our lesson map. Let's start!"], [21.2, 24.3, "Part one: words. You will learn eight new words."], [25.15, 26.38, "Gender pay gap."], [27.38, 31.47, "Gender pay gap means the average difference in pay between women and men."], [32.08, 34.65, "The gender pay gap narrowed slightly this year."], [35.25, 38.08, "Your turn. Say: Gender pay gap."], [40.93, 42.31, "Gender pay gap."], [43.05, 44.63, "Workplace equality."], [45.62, 49.51, "Workplace equality means equal treatment of all employees at work."], [50.12, 53.28, "Workplace equality requires fair hiring and promotion."], [53.88, 56.98, "Your turn. Say: Workplace equality."], [59.83, 61.61, "Workplace equality."], [62.35, 63.59, "Representation."], [64.58, 68.66, "Representation means the presence of a group among those who make decisions."], [69.25, 72.34, "Women's representation in parliament reached a record high."], [72.95, 75.97, "Your turn. Say: Representation."], [78.83, 80.46, "Representation."], [81.22, 82.93, "Gender-based discrimination."], [83.92, 88.19, "Gender-based discrimination means unfair treatment because of a person's gender."], [88.78, 91.94, "Gender-based discrimination is illegal in the workplace."], [92.55, 95.81, "Your turn. Say: Gender-based discrimination."], [98.67, 100.45, "Gender-based discrimination."], [101.18, 102.61, "Equal opportunity."], [103.62, 107.33, "Equal opportunity means the same chance for everyone to succeed."], [107.95, 111.23, "Equal opportunity policies protect job applicants."], [111.82, 114.86, "Your turn. Say: Equal opportunity."], [117.7, 119.04, "Equal opportunity."], [119.78, 121.05, "Women's rights."], [122.05, 125.99, "Women's rights means the legal and social rights of women and girls."], [126.58, 129.15, "Women's rights campaigners won the right to vote."], [129.75, 132.77, "Your turn. Say: Women's rights."], [135.63, 137.06, "Women's rights."], [137.82, 139.06, "Glass ceiling."], [140.05, 144.77, "Glass ceiling means an invisible barrier that stops people reaching top jobs."], [145.35, 148.53, "She broke the glass ceiling and became chief executive."], [149.15, 152.12, "Your turn. Say: Glass ceiling."], [154.97, 156.25, "Glass ceiling."], [156.98, 158.36, "Policy reform."], [159.35, 163.0, "Policy reform means an official change to rules to make them fairer."], [163.58, 166.93, "Policy reform introduced paid leave for both parents."], [167.52, 170.61, "Your turn. Say: Policy reform."], [173.47, 174.79, "Policy reform."], [175.6, 179.11, "Part two: dialogue. Let's listen to a conversation."], [179.95, 187.97, "Visal, a report says 'Women have gained representation in parliament; nevertheless, a glass ceiling remains.' What does 'nevertheless' do?"], [189.05, 200.14, "It shows contrast with the previous statement. Nevertheless, nonetheless and even so are used at the start of a new sentence or after a semicolon, with a comma."], [201.25, 202.82, "How is 'whereas' different?"], [203.92, 219.65, "Whereas and whilst join two clauses in one sentence to compare: Women in some sectors earn more, whereas the gender pay gap is wider in others. They are formal and common in reports."], [220.75, 222.94, "Which punctuation should I remember?"], [224.05, 235.2, "Use a comma before whereas, a semicolon before nevertheless, and a comma after it. Equal opportunity laws exist; nonetheless, gender-based discrimination persists."], [236.37, 238.02, "Part three: grammar."], [238.88, 243.15, "Grammar focus: Contrast: whereas and nevertheless and even so."], [243.45, 244.8, "Look at the pattern."], [245.48, 250.5, "Equal opportunity laws exist; nevertheless, gender-based discrimination persists."], [251.42, 254.74, "The gap is narrow in teaching, whereas it is wide in finance."], [255.65, 259.36, "Progress has been slow; even so, women's rights have advanced."], [260.3, 268.05, "Use whereas / whilst inside a sentence with a comma; use nevertheless / nonetheless / even so after a semicolon or full stop, followed by a comma."], [268.78, 274.51, "Be careful! Don't say: Laws exist, nevertheless discrimination persists."], [276.47, 281.17, "Say: Laws exist; nevertheless, discrimination persists."], [281.47, 284.1, "Use a semicolon before and a comma after."], [284.9, 287.58, "Part four: reading. Read and listen."], [288.37, 290.19, "The Distance Still to Travel."], [290.49, 293.66, "Many countries have introduced laws for workplace equality."], [294.67, 300.42, "Representation in politics has improved; nevertheless, women remain a minority in most parliaments."], [301.4, 305.55, "The gender pay gap is small in some professions, whereas it is wide in others."], [306.53, 314.16, "A glass ceiling still blocks talented women from top jobs; even so, women's rights movements keep pushing for equal opportunity."], [315.17, 318.76, "Policy reform therefore remains necessary, not optional."], [319.87, 323.74, "Part five: quiz. Five questions. Are you ready?"], [324.58, 327.5, "The gap is small here, blank it is large elsewhere."], [327.8, 331.55, "A, whereas. B, nevertheless. C, therefore."], [335.1, 337.22, "The answer is A: whereas."], [338.35, 340.49, "Choose the correct punctuation."], [340.79, 351.56, "A, Laws exist, nevertheless discrimination persists.. B, Laws exist; nevertheless, discrimination persists.. C, Laws exist nevertheless; discrimination persists.."], [355.1, 359.83, "The answer is B: Laws exist; nevertheless, discrimination persists.."], [360.98, 363.99, "An invisible barrier to promotion is a glass blank."], [364.29, 367.26, "A, ceiling. B, door. C, wall."], [370.8, 372.66, "The answer is A: ceiling."], [373.82, 375.76, "Which linker shows contrast?"], [376.06, 380.15, "A, as a result. B, consequently. C, even so."], [383.7, 385.99, "The answer is C: even so."], [387.15, 389.97, "According to the reading, policy reform remains…"], [390.27, 394.09, "A, optional. B, necessary. C, finished."], [397.63, 399.78, "The answer is B: necessary."], [401.0, 404.31, "Part six: speaking. It's your turn to talk."], [405.15, 409.1, "What is one concrete policy that could help close the gender pay gap?"], [417.92, 419.35, "Now listen to Visal."], [419.65, 448.3, "One effective policy is mandatory pay transparency, which requires companies to publish salary ranges and report pay differences between women and men. When employers must explain gaps, unfair patterns become visible and easier to correct. This can be combined with affordable childcare and equal parental leave, so that women are not forced to leave work more often than men."], [448.6, 450.3, "Excellent answer, Visal!"], [451.18, 456.52, "Great work! Now you can use eight new words and contrast: whereas and nevertheless and even so."], [456.82, 462.57, "Today's value is equality. Treat everyone fairly. We all deserve the same chances."], [462.87, 465.34, "See you in Unit fourteen. Goodbye!"], [465.64, 468.7, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit14-Youth-Political-Engagement": [[0.35, 5.8, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.1, 9.69, "Hi! I'm Visal. Let's learn together!"], [9.99, 17.02, "Unit fourteen: Youth Political Engagement. Today you will express wishes and regrets with wish and if only."], [17.32, 19.96, "Here is our lesson map. Let's start!"], [20.9, 24.17, "Part one: words. You will learn eight new words."], [25.02, 26.12, "Youth vote."], [27.12, 30.49, "Youth vote means the votes cast by young people in an election."], [31.08, 33.3, "The youth vote decided the close result."], [33.92, 36.44, "Your turn. Say: Youth vote."], [39.3, 40.17, "Youth vote."], [40.92, 42.29, "Political apathy."], [43.28, 46.61, "Political apathy means a lack of interest in politics."], [47.22, 50.51, "Political apathy is common among first-time voters."], [51.12, 53.71, "Your turn. Say: Political apathy."], [56.57, 57.92, "Political apathy."], [58.65, 60.13, "Student activism."], [61.12, 65.19, "Student activism means political action organised by students."], [65.78, 69.16, "Student activism brought climate issues to the debate."], [69.75, 72.97, "Your turn. Say: Student activism."], [75.83, 77.14, "Student activism."], [77.88, 78.97, "Voting age."], [79.95, 83.46, "Voting age means the minimum age at which a person may vote."], [84.05, 86.79, "Some countries have lowered the voting age to sixteen."], [87.38, 89.85, "Your turn. Say: Voting age."], [92.7, 93.89, "Voting age."], [94.65, 96.08, "Civic education."], [97.08, 101.52, "Civic education means teaching about rights, duties and how government works."], [102.12, 104.8, "Civic education explains how laws are made."], [105.42, 108.17, "Your turn. Say: Civic education."], [111.03, 112.59, "Civic education."], [113.35, 114.5, "Youth-led movement."], [115.52, 119.87, "Youth-led movement means a campaign organised mainly by young people."], [120.48, 122.88, "A youth-led movement demanded cleaner air."], [123.48, 126.54, "Your turn. Say: Youth-led movement."], [129.4, 130.96, "Youth-led movement."], [131.72, 133.24, "Political awareness."], [134.25, 138.71, "Political awareness means knowing what is happening in politics and why it matters."], [139.32, 142.59, "Political awareness grows when news is easy to understand."], [143.18, 146.58, "Your turn. Say: Political awareness."], [149.43, 150.98, "Political awareness."], [151.72, 153.03, "First-time voter."], [154.02, 157.25, "First-time voter means a person who votes for the first time."], [157.85, 161.08, "Every first-time voter received a guide to registration."], [161.68, 164.72, "Your turn. Say: First-time voter."], [167.57, 168.97, "First-time voter."], [169.77, 173.29, "Part two: dialogue. Let's listen to a conversation."], [174.15, 179.45, "Visal, a young voter says 'If only more of my friends had voted.' What does 'if only' express?"], [180.55, 193.85, "It expresses a strong wish or regret. For the past we use if only / I wish + past perfect: I wish I had registered. For the present, past simple: I wish the voting age were lower."], [194.95, 196.3, "And for annoying behaviour?"], [197.38, 206.39, "We use would: I wish politicians would listen to the youth vote. We cannot use would with the same subject: not 'I wish I would vote'."], [207.48, 209.11, "Can I use it in an article?"], [210.22, 222.11, "Yes, to express regret or hope: If only civic education had started earlier, political apathy might be lower. It adds emotion, so use it carefully."], [223.27, 224.8, "Part three: grammar."], [225.65, 230.24, "Grammar focus: Wishes and regrets: I wish and If only."], [230.54, 231.76, "Look at the pattern."], [232.45, 235.37, "If only more students had voted in the last election."], [236.28, 239.03, "Many young people wish the voting age were lower."], [239.92, 243.36, "First-time voters wish politicians would listen to them."], [244.3, 255.18, "Past regret: wish / if only + past perfect. Present wish: wish + past simple (were for all subjects). Annoyance about others: wish + would. Never I wish I would."], [255.92, 259.99, "Be careful! Don't say: I wish I would vote last year."], [261.93, 264.57, "Say: I wish I had voted last year."], [264.87, 267.76, "Use wish + past perfect for a past regret."], [268.57, 270.93, "Part four: reading. Read and listen."], [271.73, 273.21, "Where Are the Young Voters?."], [273.51, 278.1, "Young people care about politics, yet their youth vote is often the lowest."], [279.1, 283.55, "Many first-time voters say they wish they had learned more through civic education."], [284.53, 289.44, "If only schools had taught how elections work, political apathy might have been smaller."], [290.43, 297.12, "Student activism and youth-led movements show that awareness is high, and some campaigners wish the voting age were lower."], [298.13, 301.63, "What they need most is trust that taking part will change something."], [302.73, 306.42, "Part five: quiz. Five questions. Are you ready?"], [307.28, 309.65, "If only I blank registered earlier!"], [309.95, 313.19, "A, have. B, had. C, would have."], [316.73, 318.49, "The answer is B: had."], [319.65, 321.72, "I wish the voting age blank lower."], [322.02, 325.24, "A, were. B, would be. C, had been."], [328.8, 330.39, "The answer is A: were."], [331.55, 334.76, "A lack of interest in politics is political blank."], [335.06, 338.86, "A, awareness. B, education. C, apathy."], [342.4, 344.84, "The answer is C: apathy."], [345.98, 347.7, "Choose the correct sentence."], [348.0, 355.27, "A, I wish I would vote last year.. B, I wish I had voted last year.. C, I wish I voted last year.."], [358.83, 362.05, "The answer is B: I wish I had voted last year.."], [363.22, 367.51, "According to the reading, young people need trust that taking part will change…"], [367.81, 371.34, "A, nothing. B, something. C, everything."], [374.9, 376.78, "The answer is B: something."], [378.0, 381.58, "Part six: speaking. It's your turn to talk."], [382.42, 386.31, "What could encourage more young people to vote and stay politically engaged?"], [395.12, 396.58, "Now listen to Visal."], [396.88, 424.62, "More young people would vote if politics felt relevant to their lives. Schools can teach civic education with real examples, and governments can make registration simple, even online. Candidates should talk about issues such as jobs, housing and climate in language young people understand. When youth see that their votes lead to visible change, they are more likely to keep participating."], [424.92, 426.71, "Excellent answer, Visal!"], [427.62, 433.76, "Great work! Now you can use eight new words and wishes and regrets: i wish and if only."], [434.06, 439.15, "Today's value is public engagement. Share knowledge so that everyone can learn from it."], [439.45, 442.11, "See you in Unit fifteen. Goodbye!"], [442.41, 445.71, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit15-Corruption-Accountability": [[0.35, 6.12, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.42, 9.87, "Hi! I'm Visal. Let's learn together!"], [10.17, 17.5, "Unit fifteen: Corruption & Accountability. Today you will use the fact that and the claim that to discuss wrongdoing."], [17.8, 20.63, "Here is our lesson map. Let's start!"], [21.57, 24.94, "Part one: words. You will learn eight new words."], [25.78, 26.66, "Bribery."], [27.65, 31.0, "Bribery means giving or taking money to influence a decision."], [31.58, 34.09, "Bribery destroyed the company's reputation."], [34.68, 37.32, "Your turn. Say: Bribery."], [40.17, 41.04, "Bribery."], [41.78, 43.12, "Conflict of interest."], [44.12, 48.73, "Conflict of interest means a situation in which personal gain affects official duty."], [49.32, 52.36, "The judge declared a conflict of interest and stepped down."], [52.95, 56.12, "Your turn. Say: Conflict of interest."], [58.97, 60.81, "Conflict of interest."], [61.55, 62.88, "Transparency."], [63.88, 67.82, "Transparency means openness that lets the public see how decisions are made."], [68.42, 71.29, "Transparency in contracts reduces corruption."], [71.88, 74.86, "Your turn. Say: Transparency."], [77.7, 78.94, "Transparency."], [79.68, 81.29, "Anti-corruption law."], [82.28, 86.4, "Anti-corruption law means a law designed to prevent and punish corruption."], [86.98, 90.47, "The anti-corruption law created an independent agency."], [91.08, 93.94, "Your turn. Say: Anti-corruption law."], [96.8, 98.34, "Anti-corruption law."], [99.08, 100.7, "Whistleblower protection."], [101.68, 106.03, "Whistleblower protection means legal safety for people who report wrongdoing."], [106.62, 109.85, "Whistleblower protection shielded the engineer from dismissal."], [110.45, 113.91, "Your turn. Say: Whistleblower protection."], [116.77, 118.44, "Whistleblower protection."], [119.18, 120.35, "Public trust."], [121.35, 125.01, "Public trust means the confidence citizens have in institutions."], [125.62, 127.67, "Public trust fell after the scandal."], [128.28, 130.91, "Your turn. Say: Public trust."], [133.77, 135.08, "Public trust."], [135.82, 136.66, "Audit."], [137.65, 140.97, "Audit means an official check of accounts or activities."], [141.58, 143.71, "An audit found missing funds."], [144.32, 146.56, "Your turn. Say: Audit."], [149.4, 150.16, "Audit."], [150.92, 152.6, "Accountability mechanism."], [153.62, 158.28, "Accountability mechanism means a system that makes officials answer for their actions."], [158.88, 162.31, "A parliamentary committee is an accountability mechanism."], [162.92, 166.73, "Your turn. Say: Accountability mechanism."], [169.57, 171.65, "Accountability mechanism."], [172.43, 175.88, "Part two: dialogue. Let's listen to a conversation."], [176.72, 182.79, "Visal, an editorial says 'The fact that officials accepted bribes shocked the public.' Why add 'the fact'?"], [183.88, 198.49, "Because a that-clause can be the subject but sounds heavy. 'The fact that', 'the idea that' and 'the claim that' make the clause a noun phrase, so it is easier to use after prepositions: despite the fact that."], [199.58, 201.64, "Which nouns allow that-clauses?"], [202.75, 217.78, "Nouns of belief and information: fact, idea, claim, belief, evidence, report. In 'the report that the audit was hidden', the clause explains the noun and tells us what the report said."], [218.88, 221.15, "Give me a transparency example."], [222.25, 234.27, "The fact that contracts are public improves public trust. Despite the fact that anti-corruption laws exist, a weak accountability mechanism lets conflict of interest continue."], [235.43, 236.97, "Part three: grammar."], [237.82, 242.51, "Grammar focus: Noun plus that-clause: the fact and claim that."], [242.81, 244.06, "Look at the pattern."], [244.75, 247.94, "The fact that officials accepted bribes shocked the public."], [248.85, 251.8, "The claim that the audit was hidden damaged public trust."], [252.72, 256.78, "Despite the fact that anti-corruption laws exist, abuse continues."], [257.73, 266.81, "Noun + that-clause: the fact / idea / claim / evidence that + subject + verb. After despite or in view of, use 'the fact that' with a full clause."], [267.55, 271.89, "Be careful! Don't say: Despite that the law exists, it fails."], [273.83, 277.87, "Say: Despite the fact that the law exists, it fails."], [278.17, 280.25, "Use 'the fact that' after despite."], [281.03, 283.71, "Part four: reading. Read and listen."], [284.5, 286.15, "Trust and Accountability."], [286.45, 290.05, "Corruption harms a country far more than the money that disappears."], [291.07, 297.94, "The fact that a minister took a bribe damages public trust, and the evidence that a conflict of interest was hidden makes it worse."], [298.93, 304.58, "Transparency, such as publishing contracts, helps citizens check whether officials are honest."], [305.57, 311.26, "An independent audit and a clear accountability mechanism show that rules apply to powerful people too."], [312.27, 317.82, "Whistleblower protection matters because those who report wrongdoing are often the first to suffer."], [318.93, 322.76, "Part five: quiz. Five questions. Are you ready?"], [323.62, 326.6, "blank officials took bribes shocked everyone."], [326.9, 330.7, "A, The fact that. B, The fact. C, That fact of."], [334.23, 336.49, "The answer is A: The fact that."], [337.65, 340.47, "Taking money to influence a decision is blank."], [340.77, 344.64, "A, an audit. B, bribery. C, transparency."], [348.2, 350.08, "The answer is B: bribery."], [351.25, 353.73, "An official check of accounts is an blank."], [354.03, 357.32, "A, appeal. B, apathy. C, audit."], [360.87, 362.97, "The answer is C: audit."], [364.12, 365.87, "Choose the correct sentence."], [366.17, 377.15, "A, Despite the fact the law exists, abuse continues.. B, Despite the fact that the law exists, abuse continues.. C, Despite that the law exists, abuse continues.."], [380.7, 385.45, "The answer is B: Despite the fact that the law exists, abuse continues.."], [386.62, 389.94, "According to the reading, whistleblowers are often the first to blank."], [390.24, 393.63, "A, suffer. B, retire. C, vote."], [397.17, 399.22, "The answer is A: suffer."], [400.43, 403.54, "Part six: speaking. It's your turn to talk."], [404.38, 408.32, "Why is whistleblower protection important for exposing government corruption?"], [417.12, 418.72, "Now listen to Visal."], [419.02, 447.62, "Whistleblowers often work inside an organisation, so they see wrongdoing that outsiders cannot. Without legal protection, they risk losing their jobs, facing threats or even prison. Strong whistleblower protection encourages people to report corruption safely, which helps journalists and investigators uncover abuse earlier. It therefore supports accountability and public trust in government."], [447.92, 449.52, "Excellent answer, Visal!"], [450.42, 456.01, "Great work! Now you can use eight new words and noun plus that-clause: the fact and claim that."], [456.31, 461.31, "Today's value is integrity. Do the right thing, even when no one is watching."], [461.62, 464.41, "See you in Unit sixteen. Goodbye!"], [464.71, 467.36, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit16-Political-Ideologies": [[0.35, 5.52, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [5.82, 9.55, "Hi! I'm Visal. Let's learn together!"], [9.85, 16.97, "Unit sixteen: Political Ideologies. Today you will recognise belief, person and adjective forms with suffixes."], [17.27, 19.92, "Here is our lesson map. Let's start!"], [20.87, 24.23, "Part one: words. You will learn eight new words."], [25.08, 26.25, "Conservatism."], [27.25, 30.72, "Conservatism means a belief in tradition and gradual change."], [31.32, 35.59, "Conservatism values stability and established institutions."], [36.18, 38.81, "Your turn. Say: Conservatism."], [41.67, 42.97, "Conservatism."], [43.72, 44.86, "Liberalism."], [45.85, 49.56, "Liberalism means a belief in individual freedom and equal rights."], [50.15, 52.46, "Liberalism protects freedom of speech."], [53.05, 55.67, "Your turn. Say: Liberalism."], [58.53, 59.5, "Liberalism."], [60.25, 61.51, "Socialism."], [62.52, 66.7, "Socialism means a belief in shared ownership and greater equality."], [67.28, 70.26, "Socialism supports strong public services."], [70.85, 73.29, "Your turn. Say: Socialism."], [76.13, 77.17, "Socialism."], [77.92, 79.29, "Political spectrum."], [80.28, 84.2, "Political spectrum means the range of political beliefs from left to right."], [84.78, 87.68, "The party sits near the centre of the political spectrum."], [88.28, 91.54, "Your turn. Say: Political spectrum."], [94.4, 95.91, "Political spectrum."], [96.65, 97.8, "Ideology."], [98.82, 102.48, "Ideology means a set of beliefs about how society should work."], [103.08, 105.91, "An ideology can guide a party's decisions."], [106.52, 109.04, "Your turn. Say: Ideology."], [111.9, 112.98, "Ideology."], [113.72, 115.03, "Political values."], [116.02, 120.28, "Political values means the principles that shape a person's political opinions."], [120.88, 123.36, "Her political values emphasise fairness."], [123.95, 127.02, "Your turn. Say: Political values."], [129.87, 131.16, "Political values."], [131.92, 133.16, "Party platform."], [134.15, 138.1, "Party platform means a party's official list of goals and policies."], [138.72, 141.17, "The party platform promised lower taxes."], [141.78, 144.54, "Your turn. Say: Party platform."], [147.4, 148.67, "Party platform."], [149.42, 150.85, "Policy position."], [151.85, 155.91, "Policy position means a stated view on a specific political issue."], [156.52, 159.63, "His policy position on housing surprised supporters."], [160.22, 162.97, "Your turn. Say: Policy position."], [165.83, 167.22, "Policy position."], [168.03, 171.57, "Part two: dialogue. Let's listen to a conversation."], [172.42, 177.84, "Visal, we say 'conservatism', 'conservative' and 'a conservative'. How can I tell the forms apart?"], [178.95, 197.79, "Suffixes show the word class. -ism makes an abstract noun for a belief: liberalism, socialism. -ist or -ian names the person: a socialist, a politician. -ive and -al make adjectives: conservative, liberal."], [198.88, 200.38, "Do spellings change?"], [201.48, 217.85, "Often. Stress shifts too: LIB-er-al, LIB-er-al-ism, but con-SERV-a-tive. And 'ideology' becomes 'ideological', not 'ideologic'. Check each word in a dictionary."], [218.95, 221.03, "Why does this matter in politics?"], [222.12, 235.15, "A careful writer separates the belief, the person and the description: a socialist party defends socialism with socialist policies. Mixing them confuses readers."], [236.3, 238.14, "Part three: grammar."], [238.98, 243.93, "Grammar focus: Word formation: -ism and -ist and -ive and -al."], [244.23, 245.55, "Look at the pattern."], [246.25, 251.12, "Liberal + -ism = liberalism, a belief in individual freedom."], [252.02, 255.91, "A socialist party defends socialism through socialist policies."], [256.82, 260.53, "The party's platform is conservative on tax and liberal on rights."], [261.5, 271.71, "-ism = belief (noun), -ist / -ian = follower (noun), -al / -ive / -ic = adjective. Learn the whole family: conserve, conservatism, conservative, conservationist."], [272.45, 276.27, "Be careful! Don't say: He is a strong liberalism."], [278.23, 280.57, "Say: He is a strong liberal."], [280.87, 283.95, "-ism names the belief; use -al for the person."], [284.73, 287.73, "Part four: reading. Read and listen."], [288.53, 290.85, "Left, Right and Everything Between."], [291.15, 295.34, "An ideology is a set of ideas about how society should be organised."], [296.33, 304.45, "Conservatism values tradition, liberalism stresses individual freedom, and socialism emphasises shared ownership and equality."], [305.47, 312.05, "The political spectrum places these beliefs from left to right, but real citizens rarely sit at a single point."], [313.07, 320.39, "A party platform may be conservative on taxes and liberal on rights, so each policy position needs separate study."], [321.4, 324.99, "Political values, not labels, should guide an informed voter."], [326.1, 330.1, "Part five: quiz. Five questions. Are you ready?"], [330.95, 333.7, "Someone who follows socialism is a blank."], [334.0, 337.89, "A, socialist. B, socialism. C, socially."], [341.43, 343.9, "The answer is A: socialist."], [345.05, 348.07, "The abstract noun for a belief in freedom is blank."], [348.37, 352.06, "A, liberal. B, liberalism. C, liberate."], [355.6, 358.12, "The answer is B: liberalism."], [359.28, 362.31, "The adjective form of 'conserve' in politics is blank."], [362.61, 366.88, "A, conservatism. B, conservationist. C, conservative."], [370.43, 372.91, "The answer is C: conservative."], [374.05, 375.83, "Choose the correct sentence."], [376.13, 382.39, "A, He is a strong liberalism.. B, He is a strong liberal.. C, He is a strong liberally.."], [385.93, 388.76, "The answer is B: He is a strong liberal.."], [389.92, 393.8, "According to the reading, an informed voter should follow political…"], [394.1, 397.99, "A, values. B, labels. C, slogans."], [401.53, 403.67, "The answer is A: values."], [404.87, 407.88, "Part six: speaking. It's your turn to talk."], [408.72, 412.83, "Do you think most people fit neatly into a single political ideology?"], [421.62, 423.08, "Now listen to Visal."], [423.38, 451.11, "I do not think most people fit neatly into one ideology. People often hold mixed views, such as supporting free markets but also strong public healthcare. Their opinions are shaped by family, experience, religion and local problems, not only by party labels. The political spectrum is a helpful simplification, but real values are usually more complex and can change over time."], [451.41, 453.09, "Excellent answer, Visal!"], [453.98, 460.11, "Great work! Now you can use eight new words and word formation: -ism and -ist and -ive and -al."], [460.41, 465.22, "Today's value is respectful disagreement. Disagree politely and listen to others."], [465.52, 468.23, "See you in Unit seventeen. Goodbye!"], [468.53, 471.33, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit17-Civic-Duty": [[0.35, 5.58, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [5.88, 9.36, "Hi! I'm Visal. Let's learn together!"], [9.66, 15.95, "Unit seventeen: Civic Duty. Today you will use gerunds as subjects and after it is no use."], [16.25, 18.9, "Here is our lesson map. Let's start!"], [19.87, 22.9, "Part one: words. You will learn eight new words."], [23.75, 24.83, "Jury duty."], [25.82, 28.72, "Jury duty means the legal duty to serve on a jury."], [29.32, 32.28, "Jury duty brings ordinary citizens into the courtroom."], [32.88, 35.4, "Your turn. Say: Jury duty."], [38.23, 39.32, "Jury duty."], [40.05, 41.64, "Voting responsibility."], [42.65, 46.5, "Voting responsibility means the duty of citizens to use their vote."], [47.08, 50.49, "Voting responsibility includes learning about the candidates."], [51.08, 54.15, "Your turn. Say: Voting responsibility."], [57.0, 58.5, "Voting responsibility."], [59.25, 60.82, "Community service."], [61.82, 65.64, "Community service means unpaid work done to help a community."], [66.25, 68.9, "Community service was part of the school programme."], [69.48, 72.69, "Your turn. Say: Community service."], [75.53, 77.19, "Community service."], [77.95, 79.56, "Civic participation."], [80.55, 85.01, "Civic participation means taking part in the life of your community or country."], [85.62, 89.16, "Civic participation includes attending public meetings."], [89.75, 93.23, "Your turn. Say: Civic participation."], [96.07, 97.8, "Civic participation."], [98.55, 99.83, "Public engagement."], [100.82, 104.7, "Public engagement means involving citizens in public decisions."], [105.28, 108.64, "Public engagement improved after the town meetings began."], [109.25, 112.51, "Your turn. Say: Public engagement."], [115.37, 116.59, "Public engagement."], [117.35, 118.61, "Volunteer work."], [119.62, 123.43, "Volunteer work means work done freely, without being paid."], [124.02, 126.7, "Volunteer work at the shelter taught her patience."], [127.32, 130.46, "Your turn. Say: Volunteer work."], [133.3, 134.87, "Volunteer work."], [135.62, 137.12, "Active citizenship."], [138.12, 142.14, "Active citizenship means taking responsibility for improving society."], [142.75, 145.53, "Active citizenship begins at the local level."], [146.12, 149.33, "Your turn. Say: Active citizenship."], [152.17, 153.7, "Active citizenship."], [154.45, 155.87, "Social contract."], [156.88, 161.38, "Social contract means the unwritten agreement between citizens and their society."], [161.98, 164.68, "The social contract links rights with duties."], [165.28, 168.64, "Your turn. Say: Social contract."], [171.5, 172.92, "Social contract."], [173.73, 177.29, "Part two: dialogue. Let's listen to a conversation."], [178.15, 183.29, "Visal, a teacher says 'Voting is a responsibility.' Why is 'voting' used as the subject?"], [184.38, 199.66, "A gerund works as a noun. It names an activity as a general idea: Serving on a jury is a duty. Volunteering builds active citizenship. It is more natural than 'To vote is a responsibility'."], [200.75, 202.78, "Are there fixed expressions with -ing?"], [203.88, 218.23, "Yes: it is worth taking part, it is no use complaining, there is no point in staying silent, and it is not worth ignoring jury duty. After these expressions, the verb is always -ing."], [219.32, 220.68, "How do I make a negative?"], [221.78, 234.62, "Put not before the gerund: Not voting is also a choice. Not attending community meetings weakens public engagement, because the social contract depends on participation."], [235.77, 237.5, "Part three: grammar."], [238.35, 243.74, "Grammar focus: Gerunds as subjects: Voting is and It is no use -ing."], [244.04, 245.28, "Look at the pattern."], [245.98, 248.3, "Serving on a jury is a civic duty."], [249.18, 251.68, "It is no use complaining if you never vote."], [252.58, 254.92, "Not voting weakens the social contract."], [255.87, 263.88, "A gerund (-ing) can be a subject: Voting is a duty. Use it after it is worth / no use / no point in. Negative: Not + -ing."], [264.65, 268.13, "Be careful! Don't say: It is no use to complain."], [270.07, 272.32, "Say: It is no use complaining."], [272.62, 274.89, "Use -ing after 'it is no use'."], [275.7, 278.36, "Part four: reading. Read and listen."], [279.17, 280.56, "What We Owe Each Other."], [280.86, 285.21, "A healthy society depends on more than laws; it depends on habits."], [286.2, 292.38, "Serving on a jury and paying taxes are duties, while volunteering is a choice that builds active citizenship."], [293.37, 298.87, "It is worth taking part in civic participation, because complaining alone changes nothing."], [299.87, 306.83, "Not engaging with public life weakens the social contract, the unwritten agreement that citizens help to sustain their community."], [307.83, 313.15, "Community service and volunteer work show that rights and responsibilities travel together."], [314.27, 318.35, "Part five: quiz. Five questions. Are you ready?"], [319.18, 321.35, "blank on a jury is a civic duty."], [321.64, 325.29, "A, Serving. B, To serving. C, Serve."], [328.83, 330.7, "The answer is A: Serving."], [331.85, 334.31, "It is no use blank if you do not vote."], [334.61, 338.16, "A, complain. B, complaining. C, to complaining."], [341.7, 343.58, "The answer is B: complaining."], [344.75, 348.89, "The unwritten agreement between citizens and society is the social blank."], [349.19, 353.11, "A, duty. B, vote. C, contract."], [356.67, 358.6, "The answer is C: contract."], [359.75, 361.48, "Choose the correct sentence."], [361.78, 368.37, "A, Not voting is a choice.. B, Not to voting is a choice.. C, No voting is a choice.."], [371.93, 374.44, "The answer is A: Not voting is a choice.."], [375.58, 379.13, "According to the reading, rights and responsibilities travel…"], [379.43, 382.86, "A, apart. B, together. C, slowly."], [386.4, 388.2, "The answer is B: together."], [389.4, 392.31, "Part six: speaking. It's your turn to talk."], [393.15, 396.81, "What civic duty do you think is most important for a healthy society?"], [405.62, 407.09, "Now listen to Visal."], [407.39, 435.08, "I think voting is the most important civic duty because it lets citizens choose leaders and hold them accountable. Without participation, governments may ignore ordinary people. However, voting works best together with other duties, such as obeying the law, paying taxes and helping neighbours. A healthy society needs both informed voters and active, caring citizens."], [435.38, 437.23, "Excellent answer, Visal!"], [438.12, 444.84, "Great work! Now you can use eight new words and gerunds as subjects: voting is and it is no use -ing."], [445.14, 449.67, "Today's value is dedication. Practise a little every day, and you will get better."], [449.97, 452.61, "See you in Unit eighteen. Goodbye!"], [452.91, 456.1, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit18-Social-Welfare-Systems": [[0.35, 5.99, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [6.29, 10.08, "Hi! I'm Visal. Let's learn together!"], [10.38, 17.83, "Unit eighteen: Social Welfare Systems. Today you will concede points with however, whatever and no matter how."], [18.13, 20.65, "Here is our lesson map. Let's start!"], [21.6, 24.91, "Part one: words. You will learn eight new words."], [25.75, 27.31, "Social safety net."], [28.32, 33.42, "Social safety net means government support that protects people from falling into poverty."], [34.02, 37.35, "A social safety net helps people who lose their jobs."], [37.95, 40.88, "Your turn. Say: Social safety net."], [43.73, 45.35, "Social safety net."], [46.08, 47.73, "Unemployment benefit."], [48.75, 52.82, "Unemployment benefit means money paid to people who have lost their jobs."], [53.42, 56.26, "Unemployment benefit lasted for six months."], [56.85, 59.79, "Your turn. Say: Unemployment benefit."], [62.63, 64.22, "Unemployment benefit."], [64.95, 66.33, "Public assistance."], [67.35, 70.84, "Public assistance means government help for people with low income."], [71.45, 74.54, "Public assistance covers food and housing costs."], [75.15, 78.08, "Your turn. Say: Public assistance."], [80.93, 82.43, "Public assistance."], [83.18, 84.44, "Welfare reform."], [85.45, 89.1, "Welfare reform means changes to the rules of the benefit system."], [89.68, 92.72, "Welfare reform aimed to help people return to work."], [93.32, 96.68, "Your turn. Say: Welfare reform."], [99.53, 100.95, "Welfare reform."], [101.72, 103.18, "Poverty reduction."], [104.18, 109.06, "Poverty reduction means actions that lower the number of people living in poverty."], [109.65, 112.82, "Poverty reduction requires jobs as well as benefits."], [113.42, 116.44, "Your turn. Say: Poverty reduction."], [119.3, 120.63, "Poverty reduction."], [121.38, 123.21, "Universal basic income."], [124.22, 128.32, "Universal basic income means a regular payment made to every citizen."], [128.92, 132.37, "Universal basic income was tested in several cities."], [132.98, 136.34, "Your turn. Say: Universal basic income."], [139.2, 141.07, "Universal basic income."], [141.82, 143.1, "Means testing."], [144.08, 147.97, "Means testing means checking a person's income before giving benefits."], [148.58, 151.34, "Means testing ensures help reaches those in need."], [151.95, 154.58, "Your turn. Say: Means testing."], [157.43, 158.76, "Means testing."], [159.52, 160.9, "Social security."], [161.92, 166.56, "Social security means a state system that pays money to people in need or retired."], [167.15, 170.7, "Social security provides a pension for older citizens."], [171.32, 174.32, "Your turn. Say: Social security."], [177.17, 178.62, "Social security."], [179.43, 182.86, "Part two: dialogue. Let's listen to a conversation."], [183.72, 190.9, "Visal, a columnist writes 'However generous the benefit is, some families still fall into poverty.' What does 'however generous' mean?"], [191.98, 205.96, "It means 'no matter how generous'. Structure: however + adjective/adverb + subject + verb. Similar forms are whatever, whoever, wherever and whichever, followed by a clause."], [207.05, 208.78, "Is the word order special?"], [209.88, 223.36, "Yes: the adjective comes directly after however, before the subject. We say 'However poor a family is', not 'However a family is poor'. The clause usually comes first, and a comma follows."], [224.45, 226.16, "Show me a welfare example."], [227.25, 239.64, "Whatever form welfare reform takes, a social safety net must protect the poorest. However costly universal basic income seems, supporters say poverty reduction saves money."], [240.8, 242.64, "Part three: grammar."], [243.48, 247.74, "Grammar focus: Concession: however plus adjective and whatever."], [248.03, 249.22, "Look at the pattern."], [249.92, 254.38, "However generous the benefit is, some families still fall into poverty."], [255.28, 259.44, "Whatever form welfare reform takes, a safety net must remain."], [260.35, 263.84, "No matter how costly the scheme seems, supporters defend it."], [264.8, 274.36, "However / no matter how + adjective + subject + verb. Whatever / whoever / wherever + clause. Keep the adjective right after however and put a comma after the clause."], [275.12, 279.5, "Be careful! Don't say: However a family is poor, it needs help."], [281.43, 284.13, "Say: However poor a family is, it needs help."], [284.43, 286.49, "Put the adjective right after 'however'."], [287.3, 290.32, "Part four: reading. Read and listen."], [291.13, 292.89, "Safety Nets Under Debate."], [293.19, 297.35, "A social safety net exists to catch people when life becomes difficult."], [298.33, 304.92, "However well designed a system is, it will cost money, and however careful officials are, some people will be missed."], [305.93, 311.89, "Unemployment benefit and public assistance help families through a crisis, whatever its cause."], [312.9, 321.33, "Supporters of means testing say it focuses help on those in need, whereas supporters of universal basic income prefer simplicity."], [322.33, 327.06, "No matter how welfare reform is organised, poverty reduction should remain the main goal."], [328.17, 332.31, "Part five: quiz. Five questions. Are you ready?"], [333.15, 336.15, "blank generous the benefit is, some families struggle."], [336.45, 340.19, "A, However. B, Whatever. C, Whoever."], [343.73, 345.62, "The answer is A: However."], [346.78, 349.32, "Checking income before giving benefits is blank."], [349.62, 354.79, "A, social security. B, means testing. C, public assistance."], [358.33, 360.83, "The answer is B: means testing."], [361.98, 363.73, "Choose the correct sentence."], [364.03, 372.35, "A, However a family is poor, it needs help.. B, However poor is a family, it needs help.. C, However poor a family is, it needs help.."], [375.9, 379.86, "The answer is C: However poor a family is, it needs help.."], [381.02, 384.11, "blank form the reform takes, the safety net remains."], [384.41, 387.75, "A, Whatever. B, However. C, Wherever."], [391.3, 392.94, "The answer is A: Whatever."], [394.08, 398.59, "According to the reading, the main goal of welfare reform should be poverty blank."], [398.89, 402.79, "A, reduction. B, tests. C, taxes."], [406.33, 408.27, "The answer is A: reduction."], [409.47, 412.47, "Part six: speaking. It's your turn to talk."], [413.32, 418.52, "Should welfare programs use means testing, or should benefits be universal for everyone?"], [427.32, 428.82, "Now listen to Visal."], [429.12, 455.89, "Means testing directs limited money to the people who need it most, which can make a system cheaper and fairer. However, it can be complicated, stigmatising and may leave out families just above the line. Universal benefits are simpler and avoid shame, but they cost more. A good compromise is a universal basic level with extra support for those in greatest need."], [456.19, 457.89, "Excellent answer, Visal!"], [458.78, 464.72, "Great work! Now you can use eight new words and concession: however plus adjective and whatever."], [465.02, 470.3, "Today's value is social justice. Work for a world where everyone is treated fairly."], [470.6, 473.44, "See you in Unit nineteen. Goodbye!"], [473.74, 476.58, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit19-Freedom-of-the-Press": [[0.35, 5.65, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [5.95, 9.28, "Hi! I'm Visal. Let's learn together!"], [9.58, 16.55, "Unit nineteen: Freedom of the Press. Today you will link past causes to present results with mixed conditionals."], [16.85, 19.47, "Here is our lesson map. Let's start!"], [20.43, 23.82, "Part one: words. You will learn eight new words."], [24.68, 25.98, "Press censorship."], [26.98, 31.19, "Press censorship means government control over what newspapers may publish."], [31.78, 34.26, "Press censorship hid the scandal for years."], [34.85, 37.98, "Your turn. Say: Press censorship."], [40.83, 42.14, "Press censorship."], [42.88, 44.53, "Investigative freedom."], [45.55, 50.59, "Investigative freedom means the freedom of reporters to research powerful people."], [51.18, 53.79, "Investigative freedom exposed the fraud."], [54.38, 57.28, "Your turn. Say: Investigative freedom."], [60.13, 61.97, "Investigative freedom."], [62.72, 64.45, "Government transparency."], [65.45, 69.09, "Government transparency means openness about what the government does."], [69.68, 73.52, "Government transparency lets journalists check official claims."], [74.12, 77.67, "Your turn. Say: Government transparency."], [80.53, 82.46, "Government transparency."], [83.22, 84.48, "Journalist safety."], [85.48, 89.34, "Journalist safety means protection of reporters from harm and threats."], [89.95, 93.01, "Journalist safety is a growing concern worldwide."], [93.62, 96.72, "Your turn. Say: Journalist safety."], [99.57, 100.93, "Journalist safety."], [101.68, 103.32, "Media independence."], [104.32, 108.59, "Media independence means freedom of news organisations from outside control."], [109.18, 111.75, "Media independence depends on fair funding."], [112.35, 115.26, "Your turn. Say: Media independence."], [118.1, 119.69, "Media independence."], [120.45, 121.8, "Public's right to know."], [122.78, 127.64, "Public's right to know means the idea that citizens deserve access to important information."], [128.25, 131.5, "The public's right to know justified publishing the report."], [132.12, 135.11, "Your turn. Say: Public's right to know."], [137.97, 139.36, "Public's right to know."], [140.12, 141.47, "Press regulation."], [142.45, 147.29, "Press regulation means rules that govern how newspapers and broadcasters behave."], [147.88, 151.41, "Press regulation should punish lies, not criticism."], [152.02, 154.98, "Your turn. Say: Press regulation."], [157.83, 159.14, "Press regulation."], [159.88, 161.09, "Free expression."], [162.08, 165.77, "Free expression means the right to share ideas and opinions openly."], [166.35, 168.93, "Free expression is essential in a democracy."], [169.52, 172.31, "Your turn. Say: Free expression."], [175.17, 176.37, "Free expression."], [177.17, 180.85, "Part two: dialogue. Let's listen to a conversation."], [181.72, 189.33, "Visal, an editor says 'If the government had not censored the story, the public would be better informed today.' Which conditional is that?"], [190.42, 201.08, "It is a mixed conditional. The if-clause refers to the past (had not censored), but the result refers to the present (would be informed today). The two times are different."], [202.18, 203.93, "Is there another mixed type?"], [205.02, 217.68, "Yes, present condition and past result: If journalists were not afraid, they would have published the report last year. Here a permanent situation explains a past event."], [218.78, 220.02, "How do I choose?"], [221.12, 237.15, "Ask when each part happens. Past cause, present result: had + would. Present state, past result: past simple + would have. It makes arguments about press regulation and media independence sharper."], [238.3, 239.7, "Part three: grammar."], [240.55, 245.08, "Grammar focus: Mixed conditionals: past cause, present result."], [245.38, 246.6, "Look at the pattern."], [247.32, 251.57, "If the government had not censored the story, the public would be better informed today."], [252.48, 256.49, "If journalists were not afraid, they would have published the report last year."], [257.38, 261.18, "If the law had protected reporters, press freedom would be stronger now."], [262.13, 273.21, "Mixed conditional: if + past perfect (past cause) + would + base (present result); or if + past simple (present state) + would have + past participle (past result)."], [273.95, 278.43, "Be careful! Don't say: If he studied law, he would be judge now."], [280.37, 283.43, "Say: If he had studied law, he would be a judge now."], [283.73, 287.25, "Past cause: use had + past participle."], [288.07, 290.87, "Part four: reading. Read and listen."], [291.67, 293.65, "Why Journalists Need Protection."], [293.95, 296.87, "A free press is the public's right to know in action."], [297.87, 303.04, "If press censorship had never been introduced, many scandals would be common knowledge now."], [304.03, 309.42, "If journalist safety were guaranteed, more reporters would have investigated powerful people years ago."], [310.43, 317.97, "Government transparency and media independence allow investigative freedom to work, while sensible press regulation prevents abuse."], [318.97, 322.68, "Free expression, once lost, is very hard to restore."], [323.8, 327.67, "Part five: quiz. Five questions. Are you ready?"], [328.52, 331.78, "If the story had not been censored, we blank informed today."], [332.08, 335.33, "A, will be. B, would have been. C, would be."], [338.87, 340.92, "The answer is C: would be."], [342.08, 345.45, "If reporters were safe, they blank the story last year."], [345.75, 350.24, "A, would publish. B, would have published. C, had published."], [353.8, 356.14, "The answer is B: would have published."], [357.28, 360.43, "Government control over what may be published is press blank."], [360.73, 365.09, "A, censorship. B, regulation. C, transparency."], [368.63, 370.61, "The answer is A: censorship."], [371.75, 373.75, "Choose the correct mixed conditional."], [374.05, 383.79, "A, If he studied law, he would be a judge now.. B, If he had studied law, he would be a judge now.. C, If he had studied law, he will be a judge now.."], [387.33, 391.47, "The answer is B: If he had studied law, he would be a judge now.."], [392.62, 396.67, "According to the reading, free expression is hard to blank once lost."], [396.97, 400.66, "A, ignore. B, measure. C, restore."], [404.2, 406.57, "The answer is C: restore."], [407.77, 410.92, "Part six: speaking. It's your turn to talk."], [411.78, 416.19, "Why is journalist safety considered essential to a healthy, functioning democracy?"], [424.98, 426.68, "Now listen to Visal."], [426.98, 452.79, "Journalists inform citizens about what powerful people do. If reporters fear violence, arrest or lawsuits, they may avoid important stories, and corruption can stay hidden. Safe journalists can investigate honestly, which helps voters make informed choices and officials stay accountable. Protecting them is therefore protecting the public's right to know."], [453.09, 454.74, "Excellent answer, Visal!"], [455.65, 461.6, "Great work! Now you can use eight new words and mixed conditionals: past cause, present result."], [461.9, 466.38, "Today's value is moral courage. Do what is right even when it is difficult."], [466.68, 469.27, "See you in Unit twenty. Goodbye!"], [469.57, 472.8, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit20-Urbanisation-and-Housing": [[0.35, 5.69, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [5.99, 9.11, "Hi! I'm Visal. Let's learn together!"], [9.41, 16.61, "Unit twenty: Urbanisation and Housing. Today you will pack detail into noun phrases with several modifiers."], [16.91, 19.79, "Here is our lesson map. Let's start!"], [20.73, 24.07, "Part one: words. You will learn eight new words."], [24.92, 26.15, "Urbanisation."], [27.15, 31.32, "Urbanisation means the growth of towns and cities as people move into them."], [31.92, 34.68, "Urbanisation has accelerated across Asia."], [35.28, 38.02, "Your turn. Say: Urbanisation."], [40.87, 42.27, "Urbanisation."], [43.02, 43.7, "City."], [44.72, 47.13, "City means a large and important town."], [47.75, 50.6, "The city grew rapidly after the new factory opened."], [51.18, 53.52, "Your turn. Say: City."], [56.37, 57.12, "City."], [57.88, 58.63, "Housing."], [59.62, 62.06, "Housing means buildings in which people live."], [62.65, 65.74, "Housing has become the biggest expense for many families."], [66.35, 69.12, "Your turn. Say: Housing."], [71.97, 72.82, "Housing."], [73.58, 74.35, "Rent."], [75.35, 79.38, "Rent means money paid regularly to use a home that belongs to someone else."], [79.98, 82.35, "Rent rose by ten percent last year."], [82.95, 85.69, "Your turn. Say: Rent."], [88.53, 89.55, "Rent."], [90.28, 91.42, "Infrastructure."], [92.42, 96.8, "Infrastructure means basic systems such as roads, water and power."], [97.38, 99.79, "Poor infrastructure slowed the city's growth."], [100.38, 103.22, "Your turn. Say: Infrastructure."], [106.07, 107.32, "Infrastructure."], [108.08, 108.92, "Planning."], [109.92, 113.81, "Planning means official decisions about how land and buildings are used."], [114.42, 116.81, "Careful planning reduced traffic jams."], [117.42, 119.93, "Your turn. Say: Planning."], [122.77, 123.55, "Planning."], [124.28, 125.2, "Migration."], [126.22, 129.62, "Migration means the movement of people from one place to another."], [130.22, 133.03, "Rural migration doubled the city's population."], [133.62, 135.98, "Your turn. Say: Migration."], [138.83, 139.87, "Migration."], [140.62, 141.49, "Affordable."], [142.48, 145.72, "Affordable means cheap enough for ordinary people to pay."], [146.32, 148.55, "Affordable homes are in short supply."], [149.15, 151.6, "Your turn. Say: Affordable."], [154.47, 155.36, "Affordable."], [156.17, 160.05, "Part two: dialogue. Let's listen to a conversation."], [160.88, 167.72, "Visal, a report describes 'a rapidly growing, densely populated coastal city'. Why are there so many words before 'city'?"], [168.82, 183.86, "That is premodification. Several modifiers come before a noun and pack information into one phrase. The usual order is opinion, size, age, shape, colour, origin, material, then purpose."], [184.95, 187.76, "Is there a pattern for compound adjectives?"], [188.85, 205.01, "Yes. Use a hyphen for modifiers made of two words: a fast-growing city, a low-income neighbourhood, a government-funded planning scheme. The noun stays singular: a ten-year plan."], [206.12, 208.13, "Why is it useful in urban news?"], [209.22, 220.62, "It makes headlines and reports shorter and more precise: 'an affordable, well-connected housing development' says in one phrase what takes a whole sentence otherwise."], [221.77, 223.34, "Part three: grammar."], [224.18, 229.38, "Grammar focus: Complex noun phrases: several modifiers plus noun."], [229.68, 230.93, "Look at the pattern."], [231.62, 236.87, "A rapidly growing, densely populated coastal city needs better infrastructure."], [237.78, 242.38, "A government-funded ten-year planning scheme will build affordable homes."], [243.28, 246.77, "The low-income inner-city neighbourhood faces rising rent."], [247.73, 257.78, "Put several modifiers before a noun, with commas between same-type adjectives. Hyphenate compound modifiers (low-income, ten-year) and keep the noun in the singular."], [258.52, 261.88, "Be careful! Don't say: a ten-years plan"], [263.83, 266.03, "Say: a ten-year plan"], [266.33, 268.57, "Hyphenated modifiers stay singular."], [269.37, 271.98, "Part four: reading. Read and listen."], [272.8, 273.92, "Cities on the Move."], [274.22, 277.33, "Urbanisation is changing the shape of the modern world."], [278.33, 285.74, "Every year, internal migration brings thousands of job-seeking families into a fast-growing, densely populated city."], [286.73, 292.96, "Rising rent and a shortage of affordable housing push low-income residents into overcrowded outer districts."], [293.97, 300.12, "Careful planning and a long-term, government-funded infrastructure programme can keep a growing city liveable."], [301.13, 306.87, "Without them, even a prosperous, well-known capital becomes unfair and tiring to live in."], [307.97, 312.0, "Part five: quiz. Five questions. Are you ready?"], [312.85, 315.92, "A city that is growing fast is a blank city."], [316.22, 321.18, "A, fast-growing. B, fast growings. C, fast-grown."], [324.73, 326.8, "The answer is A: fast-growing."], [327.95, 330.63, "A plan that lasts ten years is a blank plan."], [330.94, 334.54, "A, ten-years. B, ten year. C, ten-year."], [338.1, 339.76, "The answer is C: ten-year."], [340.92, 344.09, "Roads, water and power systems are called blank."], [344.39, 348.2, "A, migration. B, rent. C, infrastructure."], [351.77, 354.45, "The answer is C: infrastructure."], [355.62, 357.31, "Choose the correct phrase."], [357.61, 364.03, "A, a low-incomes family. B, a low-income family. C, a low incomes family."], [367.57, 369.83, "The answer is B: a low-income family."], [370.98, 376.54, "According to the reading, rising rent and a shortage of affordable housing push residents into…"], [376.84, 382.13, "A, overcrowded outer districts. B, new capitals. C, empty cities."], [385.67, 388.57, "The answer is A: overcrowded outer districts."], [389.77, 392.97, "Part six: speaking. It's your turn to talk."], [393.82, 396.4, "What challenges does fast city growth create?"], [405.18, 406.71, "Now listen to Visal."], [407.01, 435.74, "Fast city growth creates pressure on housing, transport, water and schools. Rents rise, traffic becomes heavy and poorer families may live in informal settlements without safe services. Pollution and noise can increase, and local governments often struggle to collect enough tax to build new infrastructure. Careful planning and affordable housing are needed so that growth benefits everyone, not only wealthy residents."], [436.04, 437.76, "Excellent answer, Visal!"], [438.65, 445.11, "Great work! Now you can use eight new words and complex noun phrases: several modifiers plus noun."], [445.41, 450.12, "Today's value is community resilience. Stronger communities recover together."], [450.42, 452.84, "See you in Unit twenty-one. Goodbye!"], [453.14, 456.68, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP3-Unit21-Disability-Rights": [[0.35, 5.37, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level three."], [5.67, 8.97, "Hi! I'm Visal. Let's learn together!"], [9.27, 16.62, "Unit twenty-one: Disability Rights. Today you will refer to groups respectfully with the + adjective and person-first language."], [16.92, 19.41, "Here is our lesson map. Let's start!"], [20.37, 23.7, "Part one: words. You will learn eight new words."], [24.55, 25.61, "Disability."], [26.62, 30.78, "Disability means a condition that makes some activities more difficult."], [31.38, 34.35, "A disability should never limit a person's rights."], [34.95, 37.66, "Your turn. Say: Disability."], [40.5, 41.71, "Disability."], [42.45, 43.35, "Rights."], [44.35, 48.23, "Rights means freedoms and protections that every person is entitled to."], [48.82, 51.87, "The convention sets out the rights of every person."], [52.48, 54.75, "Your turn. Say: Rights."], [57.6, 5
