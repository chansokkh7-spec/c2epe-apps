ta collection."], [62.28, 63.76, "Analytical framework."], [64.75, 69.15, "Analytical framework means a set of ideas used to organise and interpret the evidence."], [69.75, 72.61, "The analytical framework came from economics."], [73.22, 76.43, "Your turn. Say: Analytical framework."], [79.27, 80.72, "Analytical framework."], [81.48, 82.78, "Findings summary."], [83.78, 87.01, "Findings summary means a short statement of the main results."], [87.62, 90.02, "The findings summary fits on one page."], [90.62, 93.77, "Your turn. Say: Findings summary."], [96.63, 97.92, "Findings summary."], [98.68, 100.0, "Recommendation."], [100.98, 104.79, "Recommendation means a suggestion about what should be done next."], [105.38, 108.02, "The final recommendation was to train staff."], [108.62, 111.38, "Your turn. Say: Recommendation."], [114.23, 115.62, "Recommendation."], [116.38, 118.21, "Real-world application."], [119.22, 123.33, "Real-world application means the use of an idea in actual practice."], [123.92, 126.69, "A real-world application makes the case useful."], [127.28, 130.5, "Your turn. Say: Real-world application."], [133.37, 135.6, "Real-world application."], [136.35, 138.12, "Stakeholder analysis."], [139.12, 144.2, "Stakeholder analysis means the study of everyone affected by or involved in a decision."], [144.82, 148.75, "Stakeholder analysis listed workers, owners and customers."], [149.35, 152.83, "Your turn. Say: Stakeholder analysis."], [155.67, 157.38, "Stakeholder analysis."], [158.12, 159.56, "Limitations section."], [160.55, 165.07, "Limitations section means the part of a report that admits what the study could not do."], [165.68, 168.58, "The limitations section noted the small sample."], [169.18, 172.57, "Your turn. Say: Limitations section."], [175.43, 177.06, "Limitations section."], [177.87, 181.45, "Part two: dialogue. Let's listen to a conversation."], [182.28, 192.19, "Visal, a report says 'The company, a family firm founded in 1990, faced rising costs.' What is 'a family firm founded in 1990'?"], [193.28, 203.98, "An appositive. A noun phrase placed beside a noun to identify it. Commas mark the extra information, and it saves a whole sentence of background."], [205.08, 209.07, "What about 'The data collected in 2023 show a decline'?"], [210.18, 223.72, "That is a reduced relative clause. 'Which were collected' becomes 'collected'. Use a past participle for passive meaning and an -ing form for active meaning: workers earning low wages."], [224.82, 225.82, "Any warning?"], [226.92, 239.36, "Appositives need commas only when they add extra detail. Reduced clauses must still be clear: the data collected show a decline, with plural verb agreement for data."], [240.5, 241.88, "Part three: grammar."], [242.75, 246.89, "Grammar focus: Appositives and reduced relative clauses."], [247.19, 248.34, "Look at the pattern."], [249.05, 254.39, "The company, a family firm founded in 1990, faced rising costs."], [255.28, 259.11, "The data collected in 2023 show a clear decline."], [260.02, 263.22, "The factory employing three hundred workers closed last year."], [264.17, 274.44, "An appositive identifies a noun with extra detail between commas. A reduced relative clause drops who / which + be: collected (passive) or employing (active)."], [275.18, 280.6, "Be careful! Don't say: The company, founded 1990, grew fast."], [282.53, 287.34, "Say: The company, founded in 1990, grew fast."], [287.64, 289.13, "Use in before the year."], [289.93, 292.64, "Part four: reading. Read and listen."], [293.43, 294.61, "Setting the Scene."], [294.91, 300.6, "A case study report begins with the case background, a short account of why the situation matters."], [301.6, 306.33, "The data collected through interviews and records were organised using an analytical framework."], [307.33, 313.47, "The stakeholder analysis, a list of everyone affected by the decision, helped the team judge the risks."], [314.47, 320.2, "A findings summary leading to a clear recommendation gives the report a real-world application."], [321.2, 326.49, "The limitations section, written honestly, tells readers how far the results can be trusted."], [327.6, 331.28, "Part five: quiz. Five questions. Are you ready?"], [332.12, 334.89, "The report blank last year was very clear."], [335.19, 339.12, "A, published. B, publish. C, was publishing it."], [342.67, 344.96, "The answer is A: published."], [346.12, 350.15, "The part of a report that admits what a study could not do is the blank section."], [350.45, 354.59, "A, limitations. B, findings. C, stakeholder."], [358.13, 360.35, "The answer is A: limitations."], [361.52, 364.25, "Which sentence uses an appositive correctly?"], [364.55, 373.02, "A, Mr Sok, a local teacher, led the study.. B, Mr Sok a local teacher led, the study.. C, Mr Sok, a local teacher led, the study.."], [376.57, 380.7, "The answer is A: Mr Sok, a local teacher, led the study.."], [381.85, 384.79, "A suggestion about what should be done next is a blank."], [385.09, 389.0, "A, limitation. B, recommendation. C, framework."], [392.53, 394.71, "The answer is B: recommendation."], [395.85, 400.33, "According to the reading, what gives a report a real-world application?"], [400.63, 406.16, "A, a clear recommendation. B, a long title. C, a hidden appendix."], [409.7, 412.3, "The answer is A: a clear recommendation."], [413.5, 416.65, "Part six: speaking. It's your turn to talk."], [417.52, 421.71, "Why is it important for a case study report to include its own limitations?"], [430.52, 432.11, "Now listen to Visal."], [432.41, 458.0, "A case study report should include its limitations because no study is perfect. Readers need to know if the sample was small, if the data collection was short, or if the results may not apply elsewhere. Being honest about limitations builds trust and prevents readers from over-using the recommendation. It also shows other researchers where future work is needed."], [458.3, 460.08, "Excellent answer, Visal!"], [460.98, 466.19, "Great work! Now you can use eight new words and appositives and reduced relative clauses."], [466.49, 471.32, "Today's value is analytical rigor. Test the numbers before you believe the story."], [471.62, 474.17, "See you in Unit eleven. Goodbye!"], [474.47, 476.92, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit11-Literature-Reviews": [[0.35, 5.83, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.13, 9.55, "Hi! I'm Visal. Let's learn together!"], [9.85, 17.31, "Unit eleven: Literature Reviews. Today you will review earlier research with the present perfect and reporting verbs."], [17.61, 20.14, "Here is our lesson map. Let's start!"], [21.1, 24.08, "Part one: words. You will learn eight new words."], [24.92, 26.09, "Research gap."], [27.08, 31.5, "Research gap means a topic or question that earlier studies have not answered."], [32.08, 34.8, "The research gap concerns rural schools."], [35.42, 38.52, "Your turn. Say: Research gap."], [41.37, 42.39, "Research gap."], [43.15, 44.73, "Thematic organization."], [45.72, 50.32, "Thematic organization means arranging a review by ideas rather than by date."], [50.92, 53.96, "Thematic organization grouped the studies by topic."], [54.55, 57.84, "Your turn. Say: Thematic organization."], [60.7, 62.28, "Thematic organization."], [63.02, 64.66, "Synthesis of sources."], [65.65, 70.54, "Synthesis of sources means combining ideas from many sources into one clear picture."], [71.15, 74.24, "Synthesis of sources shows the overall pattern."], [74.85, 78.14, "Your turn. Say: Synthesis of sources."], [81.0, 82.85, "Synthesis of sources."], [83.58, 84.9, "Scope statement."], [85.88, 89.98, "Scope statement means a sentence that says what a review will and will not cover."], [90.58, 93.88, "The scope statement excludes studies before 2000."], [94.48, 97.0, "Your turn. Say: Scope statement."], [99.83, 101.16, "Scope statement."], [101.92, 103.39, "Chronological review."], [104.38, 108.83, "Chronological review means a review that follows research in order of time."], [109.42, 112.48, "A chronological review shows how ideas developed."], [113.08, 116.23, "Your turn. Say: Chronological review."], [119.1, 120.8, "Chronological review."], [121.55, 123.14, "Critical evaluation."], [124.15, 127.96, "Critical evaluation means judging the strengths and weaknesses of research."], [128.55, 131.36, "Critical evaluation exposed a weak sample."], [131.95, 135.33, "Your turn. Say: Critical evaluation."], [138.2, 139.78, "Critical evaluation."], [140.52, 142.07, "Existing scholarship."], [143.08, 147.82, "Existing scholarship means the research and writing that already exist on a topic."], [148.42, 151.37, "Existing scholarship agrees on the main cause."], [151.98, 155.4, "Your turn. Say: Existing scholarship."], [158.27, 160.15, "Existing scholarship."], [160.92, 162.3, "Research question."], [163.32, 167.23, "Research question means the question that a new study will try to answer."], [167.82, 169.99, "The research question grew from the gap."], [170.58, 173.87, "Your turn. Say: Research question."], [176.73, 178.11, "Research question."], [178.9, 182.52, "Part two: dialogue. Let's listen to a conversation."], [183.35, 190.26, "Visal, a review says 'Several studies have examined sleep, but few have explored memory.' Why the present perfect?"], [191.35, 202.51, "Because the research connects to the present. It tells us what exists now. Use have / has + past participle for earlier research whose results still matter."], [203.62, 205.12, "And when we name a writer?"], [206.22, 221.05, "Use a reporting verb: Smith (2020) argues that… or Lee and Tan have shown that… Choose the verb carefully: shows is strong, suggests is cautious, claims may signal doubt."], [222.15, 223.97, "When is the past simple used?"], [225.08, 238.17, "For a finished event: Smith conducted the survey in 2019. Use the present perfect for the research record, the past simple for the specific study, and present tense for the ideas."], [239.33, 241.08, "Part three: grammar."], [241.92, 247.63, "Grammar focus: Reviewing research: have plus past participle and reporting verbs."], [247.93, 249.14, "Look at the pattern."], [249.85, 253.21, "Several studies have examined the effect of sleep on memory."], [254.12, 256.85, "Few researchers have explored rural classrooms."], [257.75, 260.71, "Lee and Tan have shown that reading aloud helps learners."], [261.67, 271.48, "Use have / has + past participle for earlier research that still matters, a reporting verb (shows, suggests, argues) for a named source, and past simple for one finished study."], [272.22, 276.85, "Be careful! Don't say: Researchers have studied it in 2020."], [278.8, 282.32, "Say: Researchers studied it in 2020."], [282.62, 285.01, "Use the past simple with a finished time."], [285.8, 288.21, "Part four: reading. Read and listen."], [289.0, 290.35, "Mapping the Field."], [290.65, 295.03, "A literature review begins with a scope statement that says what it will and will not cover."], [296.03, 302.08, "Existing scholarship has examined the topic widely, but few researchers have studied rural classrooms."], [303.1, 310.19, "Some reviews use thematic organization, while others prefer a chronological review that follows ideas through time."], [311.2, 316.95, "Synthesis of sources means that the writer has combined many studies into one picture, not just listed them."], [317.93, 323.44, "Critical evaluation then exposes the research gap, and the gap leads to a new research question."], [324.53, 329.01, "Part five: quiz. Five questions. Are you ready?"], [329.85, 332.3, "Researchers blank the topic for many years."], [332.6, 336.32, "A, have studied. B, are study. C, has study."], [339.87, 341.81, "The answer is A: have studied."], [342.95, 346.66, "A topic that earlier studies have not answered is a research blank."], [346.96, 350.09, "A, scope. B, gap. C, theme."], [353.63, 355.18, "The answer is B: gap."], [356.32, 357.98, "Which sentence is correct?"], [358.28, 366.24, "A, Few scholars has explored this area.. B, Few scholars have explored this area.. C, Few scholars have explore this area.."], [369.8, 373.47, "The answer is B: Few scholars have explored this area.."], [374.62, 377.79, "A review that follows research in order of time is blank."], [378.09, 382.01, "A, thematic. B, critical. C, chronological."], [385.57, 387.89, "The answer is C: chronological."], [389.05, 392.59, "According to the reading, what leads to a new research question?"], [392.89, 397.55, "A, the research gap. B, the title page. C, the scope only."], [401.1, 403.97, "The answer is A: the research gap."], [405.17, 408.31, "Part six: speaking. It's your turn to talk."], [409.15, 414.53, "Why is identifying a 'gap' in existing research so important before starting a new study?"], [423.32, 424.84, "Now listen to Visal."], [425.14, 450.53, "Identifying a gap is important because it shows that the new study is needed. Without it, researchers may repeat work that has already been done. A clear gap also guides the research question and helps readers see the value of the project. Existing scholarship has already answered many questions, so a new study must add something that is truly missing."], [450.83, 452.69, "Excellent answer, Visal!"], [453.58, 460.42, "Great work! Now you can use eight new words and reviewing research: have plus past participle and reporting verbs."], [460.72, 466.76, "Today's value is intellectual curiosity. Ask deep questions, and keep exploring ideas."], [467.06, 469.57, "See you in Unit twelve. Goodbye!"], [469.87, 473.08, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit12-Ethnographic-Writing": [[0.35, 5.76, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.06, 9.49, "Hi! I'm Visal. Let's learn together!"], [9.79, 15.48, "Unit twelve: Ethnographic Writing. Today you will describe habits in the past with used to and would."], [15.78, 18.57, "Here is our lesson map. Let's start!"], [19.53, 22.85, "Part one: words. You will learn eight new words."], [23.68, 24.74, "Field notes."], [25.75, 29.89, "Field notes means written observations made while studying people in their own setting."], [30.48, 33.09, "Her field notes recorded every conversation."], [33.68, 36.63, "Your turn. Say: Field notes."], [39.47, 40.75, "Field notes."], [41.48, 43.24, "Participant observation."], [44.25, 48.43, "Participant observation means joining a group's daily life in order to study it."], [49.02, 51.66, "Participant observation lasted a full year."], [52.25, 55.76, "Your turn. Say: Participant observation."], [58.6, 60.47, "Participant observation."], [61.22, 62.57, "Cultural insider."], [63.55, 67.26, "Cultural insider means a person who belongs to the culture being studied."], [67.85, 71.07, "A cultural insider may notice what outsiders miss."], [71.68, 74.93, "Your turn. Say: Cultural insider."], [77.77, 79.28, "Cultural insider."], [80.02, 81.33, "Thick description."], [82.32, 87.13, "Thick description means a detailed account that explains the meaning of behaviour in context."], [87.72, 90.48, "Thick description explains why the gesture matters."], [91.08, 93.79, "Your turn. Say: Thick description."], [96.63, 97.9, "Thick description."], [98.65, 99.64, "Fieldwork."], [100.65, 104.88, "Fieldwork means research carried out in real settings, not in a library."], [105.48, 107.97, "Fieldwork took the team to remote villages."], [108.58, 111.55, "Your turn. Say: Fieldwork."], [114.4, 115.33, "Fieldwork."], [116.08, 117.32, "Ethnographer."], [118.32, 122.65, "Ethnographer means a researcher who studies cultures by living among people."], [123.25, 125.68, "The ethnographer learned the local language."], [126.28, 129.07, "Your turn. Say: Ethnographer."], [131.93, 133.1, "Ethnographer."], [133.85, 135.56, "Cultural interpretation."], [136.55, 141.42, "Cultural interpretation means an explanation of what customs and actions mean to people."], [142.02, 144.49, "Cultural interpretation requires humility."], [145.08, 148.39, "Your turn. Say: Cultural interpretation."], [151.23, 152.83, "Cultural interpretation."], [153.58, 154.84, "Reflexivity."], [155.85, 160.32, "Reflexivity means a writer's awareness of how their own position shapes the research."], [160.92, 163.67, "Reflexivity makes the author's bias visible."], [164.28, 167.1, "Your turn. Say: Reflexivity."], [169.93, 171.27, "Reflexivity."], [172.07, 175.82, "Part two: dialogue. Let's listen to a conversation."], [176.68, 184.95, "Visal, an ethnographer writes 'Every evening the elders would gather and tell stories. They used to sit under the same tree.' What is the difference?"], [186.05, 200.85, "Both describe past habits. Would + base verb needs a time context already set, and it is for repeated actions. Used to also describes past states: The village used to be quiet."], [201.95, 203.78, "Can I use would for a state?"], [204.88, 215.38, "No. Not 'The village would be quiet'. Would is only for repeated actions, not states such as be, have or know. Use used to for states and for actions."], [216.48, 218.96, "Why is this useful in ethnography?"], [220.05, 231.88, "Field notes often describe routines that no longer exist. Used to and would make that memory vivid without a long list of dates. Do not use either for a single event."], [233.03, 235.0, "Part three: grammar."], [235.85, 240.78, "Grammar focus: Past habits: used to and would plus base verb."], [241.07, 242.2, "Look at the pattern."], [242.92, 245.87, "Every evening, the elders would gather and tell stories."], [246.78, 248.7, "They used to sit under the same tree."], [249.62, 251.85, "The village used to be very quiet."], [252.8, 263.52, "Used to + base verb = past habit or state. Would + base verb = repeated past action only, after a time is set. Never use would for states or single events."], [264.28, 267.78, "Be careful! Don't say: The river would be wide once."], [269.73, 272.41, "Say: The river used to be wide."], [272.71, 275.3, "Use used to for past states, not would."], [276.1, 278.76, "Part four: reading. Read and listen."], [279.57, 281.0, "Notes from the Village."], [281.3, 285.44, "An ethnographer spends months in fieldwork, writing field notes each night."], [286.43, 290.88, "Through participant observation, she learned that the elders would meet at dawn and share news."], [291.87, 295.68, "A cultural insider told her that the market used to be much larger."], [296.67, 301.34, "Thick description records not only what people do but also what their actions mean to them."], [302.33, 307.1, "Reflexivity reminds her that her own background shapes every cultural interpretation."], [308.2, 312.48, "Part five: quiz. Five questions. Are you ready?"], [313.32, 315.4, "The elders blank meet every morning."], [315.7, 318.54, "A, would. B, were. C, have."], [322.1, 323.79, "The answer is A: would."], [324.95, 328.46, "Joining a group's daily life to study it is participant blank."], [328.76, 333.35, "A, observation. B, notes. C, reflexivity."], [336.9, 339.1, "The answer is A: observation."], [340.25, 341.83, "Which sentence is correct?"], [342.13, 348.33, "A, The river would be wider once.. B, The river used to be wider.. C, The river use to be wider.."], [351.87, 354.93, "The answer is B: The river used to be wider.."], [356.08, 360.02, "A detailed account that explains the meaning of behaviour is thick blank."], [360.32, 364.11, "A, data. B, fieldwork. C, description."], [367.67, 370.01, "The answer is C: description."], [371.15, 374.86, "According to the reading, what does reflexivity remind the writer about?"], [375.16, 379.11, "A, her own background. B, the weather. C, the budget."], [382.67, 385.05, "The answer is A: her own background."], [386.23, 389.54, "Part six: speaking. It's your turn to talk."], [390.38, 395.36, "Why might an ethnographer need to reflect on their own biases while writing about another culture?"], [404.15, 405.47, "Now listen to Visal."], [405.76, 431.36, "An ethnographer is always a person with a background, language and beliefs, and these can shape what is noticed and how it is explained. If the writer does not reflect, they may present their own assumptions as facts about another culture. Reflexivity makes these influences visible, so the reader can judge the account fairly and the community is described with respect."], [431.66, 433.48, "Excellent answer, Visal!"], [434.38, 440.69, "Great work! Now you can use eight new words and past habits: used to and would plus base verb."], [440.99, 446.36, "Today's value is reflective awareness. Notice your own experience with care and honesty."], [446.66, 449.5, "See you in Unit thirteen. Goodbye!"], [449.8, 452.94, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit13-Legal-Writing": [[0.35, 6.29, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.59, 10.12, "Hi! I'm Visal. Let's learn together!"], [10.42, 15.61, "Unit thirteen: Legal Writing. Today you will state requirements with the mandative subjunctive."], [15.91, 18.45, "Here is our lesson map. Let's start!"], [19.4, 22.6, "Part one: words. You will learn eight new words."], [23.45, 24.67, "Legal brief."], [25.68, 29.76, "Legal brief means a written argument given to a court to support one side."], [30.35, 32.84, "The lawyer filed a legal brief on Monday."], [33.45, 36.28, "Your turn. Say: Legal brief."], [39.13, 40.25, "Legal brief."], [41.02, 42.38, "Case citation."], [43.38, 47.38, "Case citation means a reference that identifies a court decision."], [47.98, 50.6, "Each case citation gives the year and court."], [51.18, 54.2, "Your turn. Say: Case citation."], [57.03, 58.43, "Case citation."], [59.18, 60.95, "Statutory interpretation."], [61.95, 65.66, "Statutory interpretation means deciding what the words of a law mean."], [66.25, 69.57, "Statutory interpretation depends on exact wording."], [70.18, 73.81, "Your turn. Say: Statutory interpretation."], [76.67, 78.62, "Statutory interpretation."], [79.38, 80.67, "Legal argument."], [81.68, 85.68, "Legal argument means reasoning that applies law to the facts of a case."], [86.28, 89.19, "A strong legal argument cites clear authority."], [89.78, 92.77, "Your turn. Say: Legal argument."], [95.63, 97.02, "Legal argument."], [97.78, 99.5, "Precedent analysis."], [100.52, 105.23, "Precedent analysis means studying earlier court decisions to guide a new case."], [105.82, 109.53, "Precedent analysis showed the court had ruled the same way before."], [110.15, 113.46, "Your turn. Say: Precedent analysis."], [116.3, 117.89, "Precedent analysis."], [118.65, 119.9, "Plain language."], [120.88, 124.71, "Plain language means clear wording that ordinary readers can understand."], [125.32, 127.7, "Plain language makes contracts fairer."], [128.28, 131.56, "Your turn. Say: Plain language."], [134.4, 135.7, "Plain language."], [136.45, 137.91, "Legal memorandum."], [138.92, 143.3, "Legal memorandum means an internal document that explains the law on an issue."], [143.88, 146.65, "The legal memorandum summarised three cases."], [147.25, 150.33, "Your turn. Say: Legal memorandum."], [153.17, 154.69, "Legal memorandum."], [155.45, 156.68, "Persuasive brief."], [157.68, 162.12, "Persuasive brief means a brief written to convince a court to rule in one party's favour."], [162.72, 165.3, "A persuasive brief must still be accurate."], [165.88, 168.64, "Your turn. Say: Persuasive brief."], [171.5, 172.94, "Persuasive brief."], [173.73, 177.7, "Part two: dialogue. Let's listen to a conversation."], [178.55, 185.06, "Visal, a rule says 'The court requires that each party submit a written statement.' Why 'submit' and not 'submits'?"], [186.15, 198.94, "It is the mandative subjunctive. After verbs of demand, such as require, insist, recommend or propose, use the base verb for all subjects. No -s, no tense."], [200.05, 201.6, "What about the verb be?"], [202.68, 214.84, "It is essential that every claim be supported by a citation. The base form be also appears in the negative: It is vital that the document not be altered. Use not before the verb."], [215.95, 217.84, "Is there a simpler option?"], [218.95, 232.02, "Yes. Many writers use should: The court requires that each party should submit… Plain language often prefers this, but the base form is more formal and common in legal drafting."], [233.17, 234.93, "Part three: grammar."], [235.78, 241.36, "Grammar focus: Mandative subjunctive: require and insist that plus base verb."], [241.66, 242.9, "Look at the pattern."], [243.62, 247.53, "The court requires that each party submit a written statement."], [248.42, 251.66, "It is essential that every claim be supported by a citation."], [252.55, 255.36, "The judge insisted that the document not be altered."], [256.3, 264.86, "After require, insist, recommend, propose or it is essential / vital that, use the base verb for every subject. Use not before the verb for the negative."], [265.62, 269.07, "Be careful! Don't say: She demanded that he leaves."], [271.03, 273.21, "Say: She demanded that he leave."], [273.51, 275.95, "Use the base verb after demand that."], [276.73, 279.37, "Part four: reading. Read and listen."], [280.17, 281.53, "Writing for the Court."], [281.83, 286.96, "A legal brief is a written argument that asks a court to rule in one party's favour."], [287.97, 293.93, "The court requires that every case citation be accurate and that each statute be quoted exactly."], [294.93, 300.79, "A lawyer recommends that the legal memorandum explain statutory interpretation in simple terms."], [301.8, 307.0, "Precedent analysis is vital, because judges insist that similar cases be treated alike."], [308.0, 314.89, "It is also desirable that plain language replace unnecessary jargon, so that ordinary readers can follow the argument."], [316.0, 320.04, "Part five: quiz. Five questions. Are you ready?"], [320.88, 322.92, "The judge asked that he blank the form."], [323.22, 326.85, "A, sign. B, signs. C, signed."], [330.4, 332.68, "The answer is A: sign."], [333.82, 337.19, "Deciding what the words of a law mean is statutory blank."], [337.49, 341.59, "A, interpretation. B, citation. C, memorandum."], [345.13, 347.61, "The answer is A: interpretation."], [348.75, 350.44, "Which sentence is correct?"], [350.74, 357.83, "A, It is vital that she is present.. B, It is vital that she be present.. C, It is vital that she being present.."], [361.37, 364.32, "The answer is B: It is vital that she be present.."], [365.48, 369.64, "Studying earlier court decisions to guide a new case is blank analysis."], [369.94, 373.64, "A, plain. B, precedent. C, persuasive."], [377.2, 379.29, "The answer is B: precedent."], [380.45, 383.94, "According to the reading, what should replace unnecessary jargon?"], [384.24, 388.83, "A, plain language. B, longer citations. C, case notes."], [392.37, 394.98, "The answer is A: plain language."], [396.17, 399.26, "Part six: speaking. It's your turn to talk."], [400.12, 404.76, "Why might plain language be more effective than complex legal jargon in some legal writing?"], [413.55, 414.98, "Now listen to Visal."], [415.28, 440.85, "Plain language is often more effective because the readers of legal documents are not always lawyers. If a contract or notice is written in clear words, people can understand their rights and duties and make fair decisions. Complex jargon can hide meaning, cause mistakes and even keep people from using the law. Clear writing is also easier for judges to check."], [441.14, 442.84, "Excellent answer, Visal!"], [443.75, 450.27, "Great work! Now you can use eight new words and mandative subjunctive: require and insist that plus base verb."], [450.57, 456.02, "Today's value is precision of language. Choose your words carefully so others understand you."], [456.32, 459.14, "See you in Unit fourteen. Goodbye!"], [459.44, 462.2, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit14-Technical-Reports": [[0.35, 5.97, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.27, 9.74, "Hi! I'm Visal. Let's learn together!"], [10.04, 17.88, "Unit fourteen: Technical Reports. Today you will specify processes and methods with preposition + which relative clauses."], [18.18, 20.85, "Here is our lesson map. Let's start!"], [21.8, 24.75, "Part one: words. You will learn eight new words."], [25.62, 27.11, "Executive summary."], [28.12, 32.72, "Executive summary means a short overview of a report for busy decision makers."], [33.32, 36.0, "The executive summary appears on page one."], [36.62, 39.44, "Your turn. Say: Executive summary."], [42.3, 43.86, "Executive summary."], [44.62, 46.28, "Methodology section."], [47.28, 51.77, "Methodology section means the part of a report that explains how the work was done."], [52.38, 55.21, "The methodology section lists each test."], [55.82, 58.98, "Your turn. Say: Methodology section."], [61.83, 63.44, "Methodology section."], [64.18, 65.73, "Data visualization."], [66.72, 70.86, "Data visualization means turning numbers into charts, maps or diagrams."], [71.45, 74.05, "Data visualization made the trend obvious."], [74.65, 77.79, "Your turn. Say: Data visualization."], [80.63, 82.16, "Data visualization."], [82.92, 84.73, "Technical specification."], [85.72, 89.99, "Technical specification means a precise description of what a product must do."], [90.58, 93.69, "The technical specification sets the maximum weight."], [94.28, 98.11, "Your turn. Say: Technical specification."], [100.97, 102.79, "Technical specification."], [103.55, 104.76, "Results section."], [105.75, 109.51, "Results section means the part of a report that presents what was found."], [110.12, 112.65, "The results section includes three tables."], [113.25, 116.12, "Your turn. Say: Results section."], [118.97, 120.63, "Results section."], [121.38, 122.56, "Appendix."], [123.55, 127.16, "Appendix means extra material placed at the end of a report."], [127.75, 130.0, "The raw data appears in the appendix."], [130.62, 133.41, "Your turn. Say: Appendix."], [136.27, 137.34, "Appendix."], [138.08, 139.78, "Audience adaptation."], [140.78, 145.13, "Audience adaptation means changing the style and detail to suit the readers."], [145.72, 148.52, "Audience adaptation helps non-experts follow."], [149.12, 152.16, "Your turn. Say: Audience adaptation."], [155.0, 156.62, "Audience adaptation."], [157.35, 158.84, "Clarity and precision."], [159.85, 163.86, "Clarity and precision means writing that is easy to understand and exact."], [164.45, 167.12, "Clarity and precision prevent costly errors."], [167.72, 171.22, "Your turn. Say: Clarity and precision."], [174.07, 176.03, "Clarity and precision."], [176.83, 180.76, "Part two: dialogue. Let's listen to a conversation."], [181.62, 188.06, "Visal, a report says 'The method by which the samples were tested is described below.' Why 'by which'?"], [189.15, 200.49, "A preposition can come before which or whom in formal writing. The method by which… the process in which… the team with whom we worked. It sounds precise and impersonal."], [201.58, 203.39, "What is the informal version?"], [204.48, 216.67, "The method which the samples were tested by. This is correct but less formal. With a preposition first, use which for things and whom for people, never that or who."], [217.78, 219.85, "Why use it in technical reports?"], [220.95, 232.9, "It specifies exactly how, where or under what conditions something happens: the conditions under which the device fails. Do not stack too many; it can make a sentence heavy."], [234.07, 235.61, "Part three: grammar."], [236.45, 241.4, "Grammar focus: Formal relative clauses: preposition plus which and whom."], [241.7, 242.86, "Look at the pattern."], [243.55, 247.04, "The method by which the samples were tested is described below."], [247.95, 251.57, "The conditions under which the device fails are listed in the appendix."], [252.48, 255.44, "The engineers with whom we worked approved the design."], [256.4, 265.79, "In formal writing, put the preposition before which (things) or whom (people): the method by which, the engineers with whom. Never use that or who after a preposition."], [266.55, 270.1, "Be careful! Don't say: The method which by it works is new."], [272.03, 274.8, "Say: The method by which it works is new."], [275.1, 277.17, "Put the preposition before which."], [277.97, 280.61, "Part four: reading. Read and listen."], [281.4, 282.7, "Writing with Precision."], [283.0, 288.47, "A technical report opens with an executive summary, a short overview for busy readers."], [289.47, 293.49, "The methodology section describes the process by which the data were gathered."], [294.5, 300.02, "The results section uses data visualization, through which complex numbers become clear patterns."], [301.03, 306.28, "The appendix contains the technical specification to which the report often refers."], [307.3, 311.85, "Audience adaptation matters most when the readers are people for whom the subject is new."], [312.97, 316.86, "Part five: quiz. Five questions. Are you ready?"], [317.72, 320.12, "This is the process blank the parts are joined."], [320.42, 324.03, "A, by which. B, which by. C, what by."], [327.57, 329.68, "The answer is A: by which."], [330.82, 334.23, "Extra material placed at the end of a report is an blank."], [334.53, 338.59, "A, appendix. B, abstract. C, executive."], [342.13, 344.26, "The answer is A: appendix."], [345.42, 346.98, "Which sentence is correct?"], [347.27, 354.09, "A, The team with whom we worked agreed.. B, The team with who we worked agreed.. C, The team who with we worked agreed.."], [357.63, 361.05, "The answer is A: The team with whom we worked agreed.."], [362.18, 364.81, "Turning numbers into charts is data blank."], [365.11, 369.97, "A, adaptation. B, visualization. C, specification."], [373.53, 376.01, "The answer is B: visualization."], [377.15, 380.74, "According to the reading, who needs audience adaptation most?"], [381.04, 385.67, "A, readers new to the subject. B, the printer. C, the author only."], [389.23, 392.15, "The answer is A: readers new to the subject."], [393.37, 396.61, "Part six: speaking. It's your turn to talk."], [397.45, 402.4, "Why is clarity often more important than technical detail when writing for a general audience?"], [411.18, 412.71, "Now listen to Visal."], [413.01, 439.83, "Clarity is often more important because general readers cannot use detail that they do not understand. If the report is too technical, the main message is lost and people may make poor decisions. A clear executive summary and good audience adaptation explain the key points first, and the exact technical specification can still be placed in the appendix for experts."], [440.13, 441.84, "Excellent answer, Visal!"], [442.75, 449.72, "Great work! Now you can use eight new words and formal relative clauses: preposition plus which and whom."], [450.02, 453.89, "Today's value is precision. Choose your words and numbers with care."], [454.19, 456.87, "See you in Unit fifteen. Goodbye!"], [457.17, 459.94, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit15-Biography-Memoir": [[0.35, 5.59, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [5.89, 9.78, "Hi! I'm Visal. Let's learn together!"], [10.08, 16.68, "Unit fifteen: Biography & Memoir. Today you will express regret and wishes with wish and if only."], [16.98, 19.55, "Here is our lesson map. Let's start!"], [20.5, 23.68, "Part one: words. You will learn eight new words."], [24.52, 25.91, "Life narrative."], [26.92, 30.9, "Life narrative means the story of a person's life told as a connected account."], [31.52, 34.07, "The life narrative begins in a small village."], [34.68, 37.59, "Your turn. Say: Life narrative."], [40.43, 41.61, "Life narrative."], [42.35, 43.79, "Personal reflection."], [44.78, 48.87, "Personal reflection means thoughtful consideration of your own experience."], [49.48, 51.85, "Personal reflection gives a memoir depth."], [52.45, 55.51, "Your turn. Say: Personal reflection."], [58.37, 59.77, "Personal reflection."], [60.52, 62.34, "Chronological structure."], [63.35, 67.62, "Chronological structure means arranging events in the order in which they happened."], [68.22, 70.53, "The book has a chronological structure."], [71.12, 74.72, "Your turn. Say: Chronological structure."], [77.57, 79.17, "Chronological structure."], [79.92, 81.55, "Formative experience."], [82.55, 86.69, "Formative experience means an event that strongly shaped a person's character."], [87.28, 89.42, "A flood was her formative experience."], [90.02, 93.26, "Your turn. Say: Formative experience."], [96.1, 97.8, "Formative experience."], [98.55, 100.04, "Voice and perspective."], [101.05, 105.53, "Voice and perspective means the writer's personal style and way of seeing events."], [106.15, 108.68, "Voice and perspective make each memoir unique."], [109.28, 113.2, "Your turn. Say: Voice and perspective."], [116.07, 117.58, "Voice and perspective."], [118.32, 119.99, "Historical context."], [120.98, 125.54, "Historical context means the events and conditions of the time in which a life was lived."], [126.15, 128.89, "Historical context explains his choices."], [129.48, 132.66, "Your turn. Say: Historical context."], [135.5, 137.48, "Historical context."], [138.22, 139.43, "Memoir writing."], [140.42, 143.57, "Memoir writing means writing about memories from your own life."], [144.15, 146.63, "Memoir writing needs honesty and detail."], [147.22, 149.93, "Your turn. Say: Memoir writing."], [152.77, 154.05, "Memoir writing."], [154.78, 155.96, "Authenticity."], [156.95, 160.59, "Authenticity means being true to real experience and feeling."], [161.18, 163.57, "Authenticity is what readers value most."], [164.15, 167.29, "Your turn. Say: Authenticity."], [170.13, 171.34, "Authenticity."], [172.13, 175.98, "Part two: dialogue. Let's listen to a conversation."], [176.82, 181.91, "Visal, a memoirist writes 'I wish I had listened to my grandmother.' What does wish do here?"], [183.02, 195.73, "It expresses regret about the past. Wish + past perfect: I wish I had listened. If only is stronger: If only I had asked her more questions. Both refer to things that did not happen."], [196.82, 198.13, "And for the present?"], [199.22, 211.38, "Wish + past simple for a present situation: I wish I knew her recipe. And wish + would for annoyance or hope about someone else: I wish people would listen."], [212.48, 213.81, "A common mistake?"], [214.92, 228.75, "Using would have after wish: not 'I wish I would have gone'. Say 'I wish I had gone'. Wish and if only both move one tense back from the reality they describe."], [229.9, 231.63, "Part three: grammar."], [232.48, 237.63, "Grammar focus: Regrets and wishes: wish and if only plus past perfect."], [237.93, 239.12, "Look at the pattern."], [239.82, 241.86, "I wish I had listened to my grandmother."], [242.75, 245.26, "If only she had told me her story earlier."], [246.15, 248.0, "I wish I knew her recipe."], [248.93, 260.23, "Wish / if only + past perfect = regret about the past. Wish + past simple = present wish. Wish + would = wish for change in someone else. Never use would have after wish."], [260.98, 264.25, "Be careful! Don't say: I wish I would have gone."], [266.2, 268.33, "Say: I wish I had gone."], [268.63, 271.1, "Use past perfect after wish for the past."], [271.9, 274.48, "Part four: reading. Read and listen."], [275.27, 276.34, "Looking Back."], [276.64, 281.49, "A memoir is a life narrative written from the writer's own voice and perspective."], [282.5, 287.91, "Personal reflection often begins with a formative experience that the writer still remembers clearly."], [288.9, 294.1, "Many memoirists admit that they wish they had understood the historical context of their parents' lives."], [295.1, 302.12, "A chronological structure helps readers follow the story, although honest writers know that memory is not always orderly."], [303.1, 307.42, "Authenticity matters most, so a writer should tell the truth even if it is uncomfortable."], [308.53, 312.46, "Part five: quiz. Five questions. Are you ready?"], [313.32, 315.54, "I wish I blank harder at school."], [315.84, 318.99, "A, had worked. B, would work. C, have worked."], [322.53, 324.63, "The answer is A: had worked."], [325.78, 329.63, "The writer's personal style and way of seeing events is voice and blank."], [329.93, 333.88, "A, perspective. B, structure. C, citation."], [337.43, 339.5, "The answer is A: perspective."], [340.65, 342.41, "Which sentence is correct?"], [342.71, 348.41, "A, If only I would have asked her.. B, If only I had asked her.. C, If only I have asked her.."], [351.97, 354.93, "The answer is B: If only I had asked her.."], [356.08, 360.18, "An event that strongly shaped a person's character is a blank experience."], [360.48, 364.51, "A, chronological. B, formative. C, personal."], [368.07, 370.63, "The answer is B: formative."], [371.78, 374.49, "According to the reading, why should a writer tell the truth?"], [374.79, 380.26, "A, authenticity matters most. B, to make the book longer. C, to avoid dates."], [383.8, 386.76, "The answer is A: authenticity matters most."], [387.97, 391.44, "Part six: speaking. It's your turn to talk."], [392.28, 397.13, "What makes a memoir feel 'authentic' to readers, even though it is one person's perspective?"], [405.92, 407.49, "Now listen to Visal."], [407.79, 431.72, "A memoir feels authentic when the writer is honest about feelings, mistakes and uncertainty. Specific details, a natural voice and personal reflection show that the experience is real. Readers know it is one perspective, but they trust a writer who does not pretend to be perfect and who admits what they wish they had done differently."], [432.02, 433.79, "Excellent answer, Visal!"], [434.68, 441.27, "Great work! Now you can use eight new words and regrets and wishes: wish and if only plus past perfect."], [441.57, 446.75, "Today's value is authenticity. Lead as your true self, guided by your real values."], [447.06, 449.97, "See you in Unit sixteen. Goodbye!"], [450.27, 454.17, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit16-Satirical-Writing": [[0.35, 5.77, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.07, 9.94, "Hi! I'm Visal. Let's learn together!"], [10.24, 16.63, "Unit sixteen: Satirical Writing. Today you will use understatement and litotes such as not unlike and hardly."], [16.93, 19.64, "Here is our lesson map. Let's start!"], [20.6, 23.82, "Part one: words. You will learn eight new words."], [24.68, 25.84, "Satire."], [26.85, 31.04, "Satire means writing that uses humour to criticise people or society."], [31.65, 33.86, "The satire mocked the greedy minister."], [34.45, 36.96, "Your turn. Say: Satire."], [39.8, 41.0, "Satire."], [41.75, 42.5, "Irony."], [43.48, 48.95, "Irony means saying the opposite of what you mean, or a surprising difference between expectation and result."], [49.55, 52.26, "The irony was that the fire station burned down."], [52.85, 55.26, "Your turn. Say: Irony."], [58.1, 59.1, "Irony."], [59.85, 61.34, "Exaggeration."], [62.35, 66.39, "Exaggeration means making something seem bigger or worse than it is."], [66.98, 70.26, "Exaggeration made the politician's promises look silly."], [70.85, 73.72, "Your turn. Say: Exaggeration."], [76.57, 77.8, "Exaggeration."], [78.55, 80.12, "Social commentary."], [81.12, 85.23, "Social commentary means writing that comments on problems in society."], [85.82, 88.28, "The cartoon is sharp social commentary."], [88.88, 91.94, "Your turn. Say: Social commentary."], [94.8, 96.44, "Social commentary."], [97.18, 98.14, "Parody."], [99.15, 102.98, "Parody means an imitation of a work or style made to be funny."], [103.58, 106.2, "The parody copied the news style perfectly."], [106.78, 109.25, "Your turn. Say: Parody."], [112.1, 112.95, "Parody."], [113.72, 114.38, "Wit."], [115.38, 117.34, "Wit means clever, quick humour."], [117.95, 120.1, "Her wit made the audience laugh and think."], [120.72, 123.28, "Your turn. Say: Wit."], [126.13, 126.89, "Wit."], [127.65, 129.14, "Target of satire."], [130.15, 135.6, "Target of satire means the person, idea or institution that a satire criticises."], [136.18, 138.68, "The target of the satire was bureaucracy."], [139.28, 142.54, "Your turn. Say: Target of satire."], [145.4, 147.03, "Target of satire."], [147.78, 149.0, "Critical humor."], [150.02, 154.15, "Critical humor means funny writing that also judges or exposes something."], [154.75, 156.72, "Critical humor can change opinions."], [157.32, 160.21, "Your turn. Say: Critical humor."], [163.07, 164.19, "Critical humor."], [165.0, 168.78, "Part two: dialogue. Let's listen to a conversation."], [169.62, 175.89, "Visal, a satirist writes 'The mayor's speech was not unlike a lullaby.' What is the effect of 'not unlike'?"], [176.98, 190.9, "It is litotes: a positive idea expressed by negating its opposite. Not unlike means similar. Not without charm means with some charm. It is polite on the surface but sharp."], [192.02, 193.11, "And hardly?"], [194.22, 207.91, "Hardly, scarcely and barely are almost negative. 'The plan was hardly a success' means it was a failure. They add understatement, and with ever they can create irony: hardly ever honest."], [209.02, 210.33, "Any grammar warning?"], [211.42, 221.34, "Do not add another negative: not 'It was hardly not funny'. After hardly at the start of a sentence, invert: Hardly had he spoken when the crowd laughed."], [222.5, 224.12, "Part three: grammar."], [224.95, 229.78, "Grammar focus: Understatement: not unlike and not without and hardly."], [230.08, 231.33, "Look at the pattern."], [232.02, 234.35, "The mayor's speech was not unlike a lullaby."], [235.25, 237.25, "The plan was hardly a success."], [238.15, 241.06, "His defence was not without a certain comic effect."], [242.0, 250.68, "Litotes expresses a positive with a negative: not unlike = similar. Hardly, scarcely and barely are near-negatives, so do not add another negative."], [251.42, 254.84, "Be careful! Don't say: It was hardly not funny."], [256.8, 258.65, "Say: It was hardly funny."], [258.95, 261.24, "Do not add a second negative after hardly."], [262.03, 264.41, "Part four: reading. Read and listen."], [265.2, 266.78, "The Art of Saying Less."], [267.08, 274.01, "Satire uses wit and exaggeration to expose the target of satire in a way that can make readers smile and think."], [275.0, 280.11, "A parody that copies a news report may be not unlike the original, which makes the joke work."], [281.1, 286.2, "Irony is often quiet, as when a writer calls an empty promise hardly a surprise."], [287.2, 292.36, "Good social commentary is not without risk, because powerful people dislike being laughed at."], [293.37, 297.46, "Critical humor works best when the target is clear and the facts are accurate."], [298.57, 302.62, "Part five: quiz. Five questions. Are you ready?"], [303.45, 305.52, "The plan was blank a success."], [305.82, 309.68, "A, hardly. B, not hardly. C, never hardly."], [313.23, 315.26, "The answer is A: hardly."], [316.42, 319.69, "Humour that criticises people or society is blank."], [319.99, 323.95, "A, satire. B, appendix. C, syntax."], [327.5, 329.39, "The answer is A: satire."], [330.55, 332.82, "Which sentence uses litotes correctly?"], [333.12, 339.65, "A, The joke was not unfunny.. B, The joke was hardly not funny.. C, The joke not was unfunny.."], [343.2, 345.86, "The answer is A: The joke was not unfunny.."], [347.02, 350.15, "An imitation of a style made to be funny is a blank."], [350.45, 354.08, "A, canon. B, premise. C, parody."], [357.63, 359.9, "The answer is C: parody."], [361.05, 364.86, "According to the reading, what must be clear for critical humor to work?"], [365.16, 370.08, "A, the target and the facts. B, the title only. C, the length."], [373.63, 376.47, "The answer is A: the target and the facts."], [377.67, 381.04, "Part six: speaking. It's your turn to talk."], [381.88, 386.68, "Why might satire be an effective way to criticize powerful people or institutions?"], [395.48, 397.03, "Now listen to Visal."], [397.33, 421.83, "Satire can be effective because humour lowers people's defences. A joke can say something that a direct complaint cannot, and exaggeration or irony makes a problem easy to see and remember. It is also not without safety, since the writer can hide behind wit. However, satire works only when the facts behind the joke are accurate and fair."], [422.13, 424.04, "Excellent answer, Visal!"], [424.95, 431.53, "Great work! Now you can use eight new words and understatement: not unlike and not without and hardly."], [431.83, 436.9, "Today's value is media literacy. Ask who made the message, and why, before you believe it."], [437.2, 439.86, "See you in Unit seventeen. Goodbye!"], [440.16, 444.11, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit17-Academic-Conference-Papers": [[0.35, 6.08, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.38, 9.81, "Hi! I'm Visal. Let's learn together!"], [10.11, 18.87, "Unit seventeen: Academic Conference Papers. Today you will talk about plans and arrangements with will be doing, be due to and be about to."], [19.17, 21.88, "Here is our lesson map. Let's start!"], [22.83, 26.08, "Part one: words. You will learn eight new words."], [26.92, 28.43, "Conference proposal."], [29.42, 34.04, "Conference proposal means a document that offers a paper or talk for a conference."], [34.65, 37.35, "The conference proposal was accepted in March."], [37.95, 41.3, "Your turn. Say: Conference proposal."], [44.13, 45.87, "Conference proposal."], [46.62, 48.08, "Abstract submission."], [49.08, 53.25, "Abstract submission means sending a short summary of a study for approval."], [53.85, 56.55, "Abstract submission closes on Friday."], [57.15, 60.37, "Your turn. Say: Abstract submission."], [63.23, 64.77, "Abstract submission."], [65.52, 66.61, "Peer feedback."], [67.62, 71.0, "Peer feedback means comments from other researchers on your work."], [71.58, 73.59, "Peer feedback improved the argument."], [74.18, 76.78, "Your turn. Say: Peer feedback."], [79.63, 80.74, "Peer feedback."], [81.48, 83.06, "Presentation slide."], [84.05, 88.58, "Presentation slide means a single page shown to an audience during a talk."], [89.18, 92.0, "Each presentation slide carries one idea."], [92.58, 95.99, "Your turn. Say: Presentation slide."], [98.83, 100.55, "Presentation slide."], [101.32, 102.54, "Q&A session."], [103.55, 107.47, "Q&A session means a time when the audience asks the speaker questions."], [108.05, 110.59, "The Q and A session lasted twenty minutes."], [111.18, 114.35, "Your turn. Say: Q&A session."], [117.2, 118.42, "Q&A session."], [119.18, 120.67, "Academic networking."], [121.68, 126.96, "Academic networking means meeting other scholars to share ideas and make contacts."], [127.55, 130.28, "Academic networking led to a new project."], [130.88, 134.06, "Your turn. Say: Academic networking."], [136.9, 138.7, "Academic networking."], [139.45, 140.78, "Conference panel."], [141.78, 146.3, "Conference panel means a group of experts who discuss a topic together."], [146.92, 149.62, "The conference panel debated open access."], [150.22, 153.47, "Your turn. Say: Conference panel."], [156.33, 157.67, "Conference panel."], [158.42, 160.03, "Research dissemination."], [161.02, 165.22, "Research dissemination means sharing research results widely with others."], [165.82, 169.19, "Research dissemination includes talks and articles."], [169.78, 172.89, "Your turn. Say: Research dissemination."], [175.73, 177.6, "Research dissemination."], [178.4, 181.91, "Part two: dialogue. Let's listen to a conversation."], [182.75, 190.37, "Visal, a programme says 'Dr Lee will be presenting at ten, and the panel is due to start at noon.' Why different forms?"], [191.48, 204.89, "They are future forms. Will be + -ing means action in progress at that time. Be due to means scheduled by an official plan. Be about to means very soon: The session is about to begin."], [205.98, 207.54, "What about arrangements?"], [208.65, 220.5, "Use the present continuous for a fixed arrangement: I am presenting on Friday. Be to is formal and for official plans: The delegates are to register by nine."], [221.58, 223.29, "Why use them in academic writing?"], [224.38, 236.62, "They make timing clear. Will be + -ing sounds polite and avoids saying you decided it: We will be discussing the results. Be about to sounds immediate, so avoid it for distant events."], [237.77, 239.59, "Part three: grammar."], [240.45, 246.14, "Grammar focus: Future plans: will be plus -ing and be due to and be about to."], [246.44, 247.57, "Look at the pattern."], [248.28, 250.79, "Dr Lee will be presenting at ten tomorrow."], [251.68, 253.65, "The panel is due to start at noon."], [254.55, 256.26, "The session is about to begin."], [257.2, 267.12, "Will be + -ing = in progress at a future time. Be due to = official schedule. Be about to = very soon. Present continuous = fixed arrangement."], [267.88, 271.71, "Be careful! Don't say: The talk is about start now."], [273.67, 276.04, "Say: The talk is about to start now."], [276.34, 278.34, "Say be about to + base verb."], [279.13, 281.72, "Part four: reading. Read and listen."], [282.5, 283.78, "Before the Conference."], [284.08, 288.74, "A conference proposal must be accepted before the abstract submission can begin."], [289.73, 293.83, "By next week, many researchers will be preparing their presentation slides."], [294.83, 299.98, "The conference panel is due to start at noon, and the Q&A session is about to follow."], [300.97, 305.93, "Peer feedback received at the event will often be used to improve the final paper."], [306.93, 312.6, "Academic networking and research dissemination are why scholars will be travelling from many countries."], [313.7, 318.01, "Part five: quiz. Five questions. Are you ready?"], [318.85, 321.37, "This time tomorrow, I blank my paper."], [321.67, 325.55, "A, will be presenting. B, present. C, am presented."], [329.1, 331.18, "The answer is A: will be presenting."], [332.32, 336.15, "A time when the audience asks the speaker questions is a blank session."], [336.45, 340.0, "A, Q&A. B, panel. C, slide."], [343.53, 346.09, "The answer is A: Q&A."], [347.25, 348.92, "Which sentence is correct?"], [349.22, 354.9, "A, The talk is about start.. B, The talk is about to start.. C, The talk about is to start.."], [358.43, 361.28, "The answer is B: The talk is about to start.."], [362.42, 365.4, "Sharing research results widely is research blank."], [365.7, 369.42, "A, proposal. B, networking. C, dissemination."], [372.97, 375.16, "The answer is C: dissemination."], [376.32, 380.55, "According to the reading, why will scholars travel from many countries?"], [380.85, 386.2, "A, networking and dissemination. B, slide design. C, ticket prices."], [389.77, 392.57, "The answer is A: networking and dissemination."], [393.77, 397.16, "Part six: speaking. It's your turn to talk."], [398.02, 403.58, "Why is presenting research at an academic conference valuable, beyond just publishing a paper?"], [412.38, 413.85, "Now listen to Visal."], [414.15, 441.14, "Presenting at a conference is valuable because it allows direct conversation. In a Q&A session, experts will be asking questions that may reveal weaknesses or new ideas, and peer feedback can improve the paper before publication. It also builds academic networking, which may lead to cooperation, and it spreads the research to people who might not read the journal."], [441.44, 443.21, "Excellent answer, Visal!"], [444.12, 450.7, "Great work! Now you can use eight new words and future plans: will be plus -ing and be due to and be about to."], [451.0, 456.07, "Today's value is public engagement. Share knowledge so that everyone can learn from it."], [456.37, 458.83, "See you in Unit eighteen. Goodbye!"], [459.13, 462.09, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit18-Grant-Proposals": [[0.35, 6.22, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.52, 9.96, "Hi! I'm Visal. Let's learn together!"], [10.27, 16.16, "Unit eighteen: Grant Proposals. Today you will set formal conditions with Should… and Were… to."], [16.46, 18.93, "Here is our lesson map. Let's start!"], [19.9, 23.07, "Part one: words. You will learn eight new words."], [23.92, 25.23, "Funding request."], [26.22, 30.57, "Funding request means the amount of money that a proposal asks a funder to give."], [31.18, 33.9, "The funding request totals fifty thousand dollars."], [34.52, 37.62, "Your turn. Say: Funding request."], [40.47, 41.82, "Funding request."], [42.55, 43.88, "Project narrative."], [44.88, 48.96, "Project narrative means the main text that explains a project's aims and plan."], [49.55, 51.9, "The project narrative runs to ten pages."], [52.48, 55.95, "Your turn. Say: Project narrative."], [58.8, 60.12, "Project narrative."], [60.85, 62.45, "Budget justification."], [63.45, 67.61, "Budget justification means an explanation of why each cost is needed."], [68.22, 71.19, "The budget justification explains every salary."], [71.78, 75.16, "Your turn. Say: Budget justification."], [78.0, 79.55, "Budget justification."], [80.28, 81.48, "Grant reviewer."], [82.48, 86.7, "Grant reviewer means an expert who judges proposals and recommends funding."], [87.32, 89.87, "The grant reviewer praised the clear timeline."], [90.48, 93.41, "Your turn. Say: Grant reviewer."], [96.27, 97.38, "Grant reviewer."], [98.15, 99.44, "Impact statement."], [100.45, 104.76, "Impact statement means a section that explains the benefits the project will bring."], [105.35, 107.79, "The impact statement promised cleaner water."], [108.38, 111.48, "Your turn. Say: Impact statement."], [114.33, 116.15, "Impact statement."], [116.88, 117.94, "Feasibility."], [118.95, 122.7, "Feasibility means how realistic it is that the plan can be carried out."], [123.32, 126.08, "Feasibility depends on the team and the schedule."], [126.68, 129.59, "Your turn. Say: Feasibility."], [132.43, 133.57, "Feasibility."], [134.32, 135.67, "Proposal deadline."], [136.65, 140.52, "Proposal deadline means the last date on which a proposal may be sent."], [141.12, 143.53, "The proposal deadline is the first of May."], [144.15, 146.98, "Your turn. Say: Proposal deadline."], [149.83, 151.45, "Proposal deadline."], [152.18, 153.95, "Successful application."], [154.95, 159.13, "Successful application means a request that is approved and receives funding."], [159.72, 162.31, "A successful application needs a clear aim."], [162.92, 166.25, "Your turn. Say: Successful application."], [169.1, 171.23, "Successful application."], [172.03, 176.04, "Part two: dialogue. Let's listen to a conversation."], [176.88, 182.93, "Visal, a proposal says 'Should the funding be approved, we will begin in June.' Why not 'If the funding is approved'?"], [184.02, 198.22, "Should + subject + base verb is a formal, slightly less likely condition. It replaces if… should. It sounds professional and polite, and it is common in business and academic writing."], [199.32, 201.26, "And 'Were the project to succeed'?"], [202.35, 214.72, "Were + subject + to + base verb imagines a possible future more formally: Were the project to succeed, it could be repeated elsewhere. It can replace if… were to."], [215.82, 217.74, "How is the result clause formed?"], [218.85, 231.55, "Use will, would, could or can: Should you need more detail, please contact us. Do not use a present verb after Should in the result unless it is a request or command."], [232.7, 234.32, "Part three: grammar."], [235.15, 239.37, "Grammar focus: Formal conditionals: Should… and Were… to."], [239.67, 240.95, "Look at the pattern."], [241.65, 244.62, "Should the funding be approved, we will begin work in June."], [245.52, 249.51, "Were the project to succeed, it could be repeated in other provinces."], [250.42, 253.5, "Should you need more detail, please contact the team."], [254.43, 265.03, "Should + subject + base verb = formal if… should. Were + subject + to + base verb = formal if… were to. The result clause uses will, would, could or an imperative."], [265.78, 269.94, "Be careful! Don't say: Should the plan fails, we will stop."], [271.9, 274.53, "Say: Should the plan fail, we will stop."], [274.83, 277.39, "Use the base verb after Should + subject."], [278.2, 280.81, "Part four: reading. Read and listen."], [281.6, 283.01, "Asking for Funding."], [283.31, 288.03, "A grant proposal explains a project in a clear narrative and ends with a funding request."], [289.03, 292.81, "Should the reviewer have questions, the budget justification must answer them."], [293.8, 298.02, "Were the project to succeed, the impact statement would show who benefits and how."], [299.03, 305.83, "Feasibility is judged carefully, because reviewers will reject a plan that cannot be completed before the proposal deadline."], [306.83, 311.54, "A successful application is clear, realistic and honest about its risks."], [312.63, 316.47, "Part five: quiz. Five questions. Are you ready?"], [317.32, 319.78, "blank the plan fail, we will try again."], [320.08, 323.24, "A, Should. B, If should. C, Would."], [326.8, 328.64, "The answer is A: Should."], [329.78, 334.09, "A section that explains the benefits a project will bring is the blank statement."], [334.39, 337.72, "A, budget. B, impact. C, funding."], [341.27, 343.06, "The answer is B: impact."], [344.22, 345.86, "Which sentence is correct?"], [346.16, 353.28, "A, Were the team to win, they would celebrate.. B, Were the team win, they would celebrate.. C, Was the team to win, they would celebrate.."], [356.83, 360.07, "The answer is A: Were the team to win, they would celebrate.."], [361.22, 364.75, "How realistic it is that a plan can be carried out is its blank."], [365.05, 369.42, "A, narrative. B, justification. C, feasibility."], [372.97, 375.26, "The answer is C: feasibility."], [376.42, 379.12, "According to the reading, what will reviewers reject?"], [379.42, 384.83, "A, a plan that cannot be completed. B, a short title. C, a polite tone."], [388.37, 391.63, "The answer is A: a plan that cannot be completed."], [392.83, 395.9, "Part six: speaking. It's your turn to talk."], [396.75, 400.64, "What makes a grant proposal's 'impact statement' convincing to a reviewer?"], [409.45, 410.95, "Now listen to Visal."], [411.25, 437.67, "An impact statement is convincing when it is specific, realistic and linked to evidence. A reviewer wants to know who will benefit, how many people will be reached and how success will be measured. Were the claims too broad, the reviewer would doubt them, so clear numbers, a believable plan and honest limits make the statement stronger."], [437.97, 439.76, "Excellent answer, Visal!"], [440.65, 446.25, "Great work! Now you can use eight new words and formal conditionals: should… and were… to."], [446.55, 452.16, "Today's value is strategic vision. See the bigger picture, and plan for where you want to be."], [452.46, 455.15, "See you in Unit nineteen. Goodbye!"], [455.45, 458.97, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit19-Digital-Multimedia-Texts": [[0.35, 5.85, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.15, 9.34, "Hi! I'm Visal. Let's learn together!"], [9.64, 16.8, "Unit nineteen: Digital & Multimedia Texts. Today you will describe digital features with compound adjectives."], [17.09, 19.89, "Here is our lesson map. Let's start!"], [20.83, 23.86, "Part one: words. You will learn eight new words."], [24.72, 25.97, "Hypertext."], [26.98, 31.28, "Hypertext means text containing links that lead readers to other texts."], [31.88, 34.59, "Hypertext lets readers jump between ideas."], [35.18, 37.69, "Your turn. Say: Hypertext."], [40.53, 41.6, "Hypertext."], [42.35, 43.87, "Multimedia element."], [44.88, 49.39, "Multimedia element means a picture, sound or video that is part of a text."], [49.98, 52.46, "Each multimedia element supports the story."], [53.05, 56.13, "Your turn. Say: Multimedia element."], [58.97, 60.58, "Multimedia element."], [61.32, 62.78, "Interactive text."], [63.78, 68.51, "Interactive text means writing that readers can click, change or respond to."], [69.12, 71.57, "An interactive text can change its ending."], [72.18, 74.99, "Your turn. Say: Interactive text."], [77.83, 79.3, "Interactive text."], [80.05, 81.42, "Digital publishing."], [82.42, 86.63, "Digital publishing means producing and sharing content through online platforms."], [87.25, 89.68, "Digital publishing reaches readers instantly."], [90.28, 92.95, "Your turn. Say: Digital publishing."], [95.8, 97.12, "Digital publishing."], [97.85, 99.15, "Nonlinear reading."], [100.15, 105.25, "Nonlinear reading means reading in an order chosen by the reader, not from start to end."], [105.85, 108.96, "Nonlinear reading suits reference websites."], [109.55, 112.24, "Your turn. Say: Nonlinear reading."], [115.1, 116.5, "Nonlinear reading."], [117.25, 118.58, "Embedded media."], [119.58, 123.92, "Embedded media means audio or video placed directly inside a page."], [124.52, 127.16, "Embedded media makes the report more vivid."], [127.75, 130.89, "Your turn. Say: Embedded media."], [133.73, 135.25, "Embedded media."], [135.98, 137.39, "Digital annotation."], [138.38, 142.53, "Digital annotation means adding notes or highlights to an online text."], [143.12, 146.1, "Digital annotation helps students share ideas."], [146.72, 150.18, "Your turn. Say: Digital annotation."], [153.03, 154.48, "Digital annotation."], [155.22, 156.65, "Reader engagement."], [157.65, 162.31, "Reader engagement means how actively readers take part in or respond to a text."], [162.92, 165.47, "Reader engagement rose after the quiz was added."], [166.08, 168.89, "Your turn. Say: Reader engagement."], [171.73, 173.16, "Reader engagement."], [173.97, 177.5, "Part two: dialogue. Let's listen to a conversation."], [178.35, 184.88, "Visal, a review praises 'a user-friendly interface' and 'a ten-minute video'. What kind of adjectives are these?"], [185.98, 201.04, "Compound adjectives. Two or more words joined by a hyphen before a noun act as one adjective: user-friendly, well-designed, long-term. They make descriptions compact."], [202.15, 203.42, "What about numbers?"], [204.52, 221.44, "A number inside a compound adjective stays singular: a ten-minute video, not a ten-minutes video. Compare: The video is ten minutes long. After the noun, we usually do not use a hyphen."], [222.55, 224.26, "Do we always need a hyphen?"], [225.35, 237.33, "Before a noun, yes, if it avoids confusion: a well-known author. But the author is well known. Adverbs ending in -ly do not take a hyphen: a highly rated app."], [238.47, 240.08, "Part three: grammar."], [240.92, 247.14, "Grammar focus: Compound adjectives: noun and adverb plus participle plus hyphen."], [247.44, 248.7, "Look at the pattern."], [249.38, 251.88, "The site has a user-friendly interface."], [252.78, 256.4, "Readers enjoy a ten-minute video essay."], [257.28, 259.64, "It is a well-designed interactive text."], [260.6, 270.56, "Before a noun, join the words of a compound adjective with a hyphen. A number inside stays singular (a ten-minute video). No hyphen after -ly adverbs."], [271.32, 275.21, "Be careful! Don't say: It is a ten-minutes video."], [277.17, 279.67, "Say: It is a ten-minute video."], [279.97, 282.88, "Keep the number singular in a compound adjective."], [283.67, 286.23, "Part four: reading. Read and listen."], [287.03, 288.39, "Reading on Screen."], [288.69, 293.57, "Hypertext turns a page into a network of links that readers can follow in any order."], [294.57, 299.92, "A well-designed interactive text uses embedded media to explain difficult ideas."], [300.93, 307.87, "Nonlinear reading can be exciting, but a ten-minute video may still hold attention better than a long block of text."], [308.87, 315.08, "Digital publishing has made research widely available, and digital annotation helps readers share thoughts."], [316.07, 321.31, "Strong reader engagement depends on a user-friendly design and a meaningful multimedia element."], [322.4, 326.31, "Part five: quiz. Five questions. Are you ready?"], [327.15, 328.63, "It is a blank video."], [328.93, 333.68, "A, five-minute. B, five-minutes. C, five minute."], [337.23, 339.98, "The answer is A: five-minute."], [341.12, 343.84, "Text that contains links to other texts is blank."], [344.14, 348.03, "A, hypertext. B, appendix. C, stanza."], [351.57, 353.8, "The answer is A: hypertext."], [354.95, 356.53, "Which sentence is correct?"], [356.83, 363.39, "A, She wrote a highly-rated review.. B, She wrote a highly rated review.. C, She wrote a high rated-review.."], [366.93, 369.8, "The answer is B: She wrote a highly rated review.."], [370.95, 373.9, "Reading in an order chosen by the reader is blank reading."], [374.2, 377.9, "A, linear. B, nonlinear. C, formal."], [381.47, 383.83, "The answer is B: nonlinear."], [384.98, 388.38, "According to the reading, what helps readers share thoughts?"], [388.68, 393.56, "A, digital annotation. B, a longer title. C, printed footnotes."], [397.1, 399.75, "The answer is A: digital annotation."], [400.93, 403.98, "Part six: speaking. It's your turn to talk."], [404.82, 410.38, "How does reading a nonlinear, interactive digital text change the reading experience compared to a book?"], [419.18, 420.59, "Now listen to Visal."], [420.89, 447.01, "Reading a nonlinear, interactive text gives the reader more control. Instead of following one fixed order, I can click links, watch embedded media and choose which ideas to explore first. This can increase reader engagement, but it may also make it harder to follow one clear argument, whereas a book guides me from the first page to the last."], [447.31, 449.01, "Excellent answer, Visal!"], [449.92, 457.54, "Great work! Now you can use eight new words and compound adjectives: noun and adverb plus participle plus hyphen."], [457.84, 462.49, "Today's value is future readiness. Build the skills that tomorrow will ask of you."], [462.79, 465.15, "See you in Unit twenty. Goodbye!"], [465.45, 469.05, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit20-Travel-Writing": [[0.35, 5.93, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.23, 9.77, "Hi! I'm Visal. Let's learn together!"], [10.07, 16.2, "Unit twenty: Travel Writing. Today you will order several adjectives correctly in vivid descriptions."], [16.5, 19.12, "Here is our lesson map. Let's start!"], [20.07, 23.3, "Part one: words. You will learn eight new words."], [24.15, 25.22, "Travel writing."], [26.22, 30.98, "Travel writing means writing that describes journeys, places and experiences."], [31.58, 34.24, "Travel writing can be both factual and personal."], [34.85, 37.33, "Your turn. Say: Travel writing."], [40.17, 41.47, "Travel writing."], [42.22, 42.92, "Journey."], [43.92, 46.36, "Journey means a trip from one place to another."], [46.95, 49.09, "The journey took three days by boat."], [49.68, 51.72, "Your turn. Say: Journey."], [54.57, 55.29, "Journey."], [56.05, 57.13, "Description."], [58.12, 61.61, "Description means words that tell what someone or something is like."], [62.22, 64.58, "The description made me feel I was there."], [65.18, 68.11, "Your turn. Say: Description."], [70.97, 72.14, "Description."], [72.88, 73.8, "Culture."], [74.82, 78.22, "Culture means the customs, beliefs and art of a group of people."], [78.82, 81.07, "She wrote about Khmer culture with respect."], [81.68, 84.02, "Your turn. Say: Culture."], [86.87, 87.74, "Culture."], [88.48, 89.44, "Narrative."], [90.45, 93.19, "Narrative means an account of events told as a story."], [93.78, 96.24, "The narrative follows one traveller's year."], [96.85, 99.0, "Your turn. Say: Narrative."], [101.87, 102.94, "Narrative."], [103.68, 104.84, "Observation."], [105.85, 109.73, "Observation means careful noticing of what is seen, heard or felt."], [110.32, 113.08, "A sharp observation can bring a street to life."], [113.68, 116.84, "Your turn. Say: Observation."], [119.7, 120.92, "Observation."], [121.68, 122.51, "Place."], [123.52, 127.25, "Place means a particular town, region or location."], [127.85, 129.78, "Every place has its own rhythm."], [130.38, 132.88, "Your turn. Say: Place."], [135.73, 136.51, "Place."], [137.25, 138.31, "Perspective."], [139.32, 142.41, "Perspective means the point of view from which something is seen."], [143.02, 145.63, "A local perspective adds depth to the story."], [146.22, 148.9, "Your turn. Say: Perspective."], [151.77, 152.91, "Perspective."], [153.7, 157.49, "Part two: dialogue. Let's listen to a conversation."], [158.35, 164.52, "Visal, a writer describes 'a small old wooden fishing boat'. Why not 'a wooden old small fishing boat'?"], [165.62, 180.38, "English uses a usual adjective order: opinion, size, age, shape, colour, origin, material, purpose, then the noun. So: a lovely small old round red Thai wooden fishing boat."], [181.48, 182.98, "That is very long!"], [184.08, 198.45, "Yes, so writers normally use two or three. Use commas between adjectives of the same type, like 'a warm, friendly welcome', but not between different types: a small wooden boat."], [199.55, 201.1, "Does order affect meaning?"], [202.18, 214.63, "It affects naturalness. Wrong order sounds strange to native readers. Opinion words come first because they show the writer's feelings: a charming narrow cobbled lane."], [215.77, 217.66, "Part three: grammar."], [218.52, 225.03, "Grammar focus: Adjective order: opinion – size – age – colour – material plus noun."], [225.33, 226.49, "Look at the pattern."], [227.18, 229.87, "We sailed in a small old wooden fishing boat."], [230.78, 233.27, "She walked down a charming narrow cobbled lane."], [234.18, 236.84, "He wore a beautiful long red silk scarf."], [237.8, 248.19, "Order adjectives: opinion, size, age, shape, colour, origin, material, purpose, then the noun. Use two or three at most. Commas go between adjectives of the same type."], [248.95, 253.01, "Be careful! Don't say: She wore a silk red beautiful scarf."], [254.97, 258.05, "Say: She wore a beautiful red silk scarf."], [258.35, 260.51, "Use opinion, colour, material order."], [261.3, 263.95, "Part four: reading. Read and listen."], [264.77, 266.44, "Writing About Places."], [266.74, 270.71, "Good travel writing begins with careful observation of a place and its people."], [271.7, 276.87, "A vivid description might mention a narrow old wooden bridge over a wide brown river."], [277.87, 282.44, "The journey becomes a narrative when the writer shows how each place changed their perspective."], [283.43, 288.35, "A writer who respects local culture avoids stereotypes and listens before judging."], [289.33, 293.06, "A lovely, quiet morning market can teach more than a long guidebook."], [294.17, 298.26, "Part five: quiz. Five questions. Are you ready?"], [299.12, 300.68, "She bought a blank scarf."], [300.98, 305.69, "A, beautiful silk. B, silk beautiful. C, silk and beautiful."], [309.23, 311.55, "The answer is A: beautiful silk."], [312.68, 316.17, "Careful noticing of what is seen, heard or felt is blank."], [316.47, 320.71, "A, perspective. B, observation. C, narrative."], [324.27, 326.45, "The answer is B: observation."], [327.62, 329.71, "Which phrase has the usual order?"], [330.01, 335.16, "A, a wooden old table. B, an old wooden table. C, a wooden table old."], [338.7, 340.92, "The answer is B: an old wooden table."], [342.08, 344.63, "A trip from one place to another is a blank."], [344.93, 347.78, "A, culture. B, journey. C, lane."], [351.33, 353.2, "The answer is B: journey."], [354.35, 357.5, "According to the reading, what should a writer do before judging?"], [357.8, 362.82, "A, listen to local people. B, buy souvenirs. C, write a guidebook."], [366.37, 369.41, "The answer is A: listen to local people."], [370.6, 373.81, "Part six: speaking. It's your turn to talk."], [374.65, 376.89, "Which place would you most like to write about?"], [385.68, 387.29, "Now listen to Visal."], [387.59, 405.97, "I would most like to write about the old town in my own province. It has narrow, quiet streets, small wooden houses and a busy morning market. I want to describe the smells, the sounds and the kind people. My local perspective could show readers a place that guidebooks often forget."], [406.27, 408.09, "Excellent answer, Visal!"], [408.98, 416.85, "Great work! Now you can use eight new words and adjective order: opinion – size – age – colour – material plus noun."], [417.15, 422.53, "Today's value is global awareness. Remember that every story is connected to the wider world."], [422.83, 425.75, "See you in Unit twenty-one. Goodbye!"], [426.05, 428.58, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit21-Science-Journalism": [[0.35, 6.15, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.45, 10.07, "Hi! I'm Visal. Let's learn together!"], [10.37, 17.55, "Unit twenty-one: Science Journalism. Today you will state likelihood with be likely to, bound to and unlikely to."], [17.85, 20.26, "Here is our lesson map. Let's start!"], [21.2, 24.44, "Part one: words. You will learn eight new words."], [25.28, 26.7, "Science journalism."], [27.72, 32.27, "Science journalism means reporting on scientific research for the general public."], [32.88, 36.47, "Science journalism turns difficult papers into clear stories."], [37.08, 40.29, "Your turn. Say: Science journalism."], [43.13, 45.12, "Science journalism."], [45.88, 46.86, "Research."], [47.85, 51.17, "Research means careful study to discover new facts."], [51.78, 53.69, "The research took five years."], [54.28, 57.48, "Your turn. Say: Research."], [60.33, 61.2, "Research."], [61.95, 62.95, "Evidence."], [63.95, 67.26, "Evidence means facts or signs that show something is true."], [67.85, 69.93, "The evidence supports the new theory."], [70.52, 73.15, "Your turn. Say: Evidence."], [76.0, 77.07, "Evidence."], [77.82, 78.99, "Uncertainty."], [79.98, 83.61, "Uncertainty means a state in which something is not known for sure."], [84.22, 86.82, "Honest reports explain the uncertainty."], [87.42, 90.19, "Your turn. Say: Uncertainty."], [93.03, 94.36, "Uncertainty."], [95.12, 96.15, "Explain."], [97.15, 100.66, "Explain means to make an idea clear and easy to understand."], [101.25, 104.02, "Journalists explain complex results simply."], [104.62, 107.43, "Your turn. Say: Explain."], [110.27, 111.38, "Explain."], [112.15, 113.05, "Expert."], [114.05, 117.01, "Expert means a person with deep knowledge of a subject."], [117.62, 119.88, "An expert checked the claims."], [120.48, 123.0, "Your turn. Say: Expert."], [125.83, 126.8, "Expert."], [127.55, 128.76, "Accuracy."], [129.75, 132.62, "Accuracy means being correct in every detail."], [133.22, 135.37, "Accuracy builds readers' trust."], [135.98, 138.53, "Your turn. Say: Accuracy."], [141.37, 142.46, "Accuracy."], [143.22, 144.6, "Public understanding."], [145.62, 149.47, "Public understanding means how well ordinary people grasp a topic."], [150.08, 152.98, "Public understanding of vaccines has improved."], [153.58, 156.74, "Your turn. Say: Public understanding."], [159.6, 161.04, "Public understanding."], [161.83, 165.47, "Part two: dialogue. Let's listen to a conversation."], [166.32, 173.56, "Visal, a news story says 'The treatment is likely to help most patients' a
