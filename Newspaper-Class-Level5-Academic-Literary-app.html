                18: { title: "Grant Proposals", terms: ["Funding request", "Project narrative", "Budget justification", "Grant reviewer", "Impact statement", "Feasibility", "Proposal deadline", "Successful application"], passage: "A grant proposal opens with a clear funding request and compelling project narrative. Careful budget justification and a strong impact statement convince a grant reviewer of a project's feasibility before the proposal deadline.", question: "What makes a grant proposal's 'impact statement' convincing to a reviewer?", funfact: "Did you know? Many major research grants receive far more applications than can be funded, making a strong proposal essential." },
                19: { title: "Digital & Multimedia Texts", terms: ["Hypertext", "Multimedia element", "Interactive text", "Digital publishing", "Nonlinear reading", "Embedded media", "Digital annotation", "Reader engagement"], passage: "Digital and multimedia texts use hypertext and embedded media to create a genuinely interactive text. Digital publishing supports nonlinear reading and digital annotation, reshaping reader engagement compared to traditional print.", question: "How does reading a nonlinear, interactive digital text change the reading experience compared to a book?", funfact: "Did you know? Hypertext, the foundation of nearly all digital reading today, was first theorized decades before the internet became widely available." },
                20: { title: "Travel Writing", terms: ["Travel writing", "Journey", "Description", "Culture", "Narrative", "Observation", "Place", "Perspective"], passage: "Travel writing combines narrative with detailed description of place and culture. Careful observation and an honest perspective turn a journey into a meaningful story for readers.", question: "Which place would you most like to write about?", funfact: "Did you know? The 14th-century traveller Ibn Battuta journeyed tens of thousands of kilometres and recorded his travels in a famous book." },
                21: { title: "Science Journalism", terms: ["Science journalism", "Research", "Evidence", "Uncertainty", "Explain", "Expert", "Accuracy", "Public understanding"], passage: "Science journalism helps public understanding by explaining new research. Good reporters check evidence, quote an independent expert and explain uncertainty rather than exaggerating results, protecting accuracy.", question: "Why do science headlines sometimes exaggerate findings?", funfact: "Did you know? A single study rarely proves something — good science reporting explains how a new result fits with earlier research." },
                22: { title: "Book Reviews", terms: ["Review", "Summary", "Evaluation", "Plot", "Style", "Recommendation", "Critic", "Reader"], passage: "A book review gives a brief summary of the plot without spoilers, followed by evaluation of style and ideas. The critic ends with a recommendation to help the reader decide.", question: "What should a good book review include?", funfact: "Did you know? The New York Times Book Review was first published in 1896." },
                23: { title: "Speeches and Oratory", terms: ["Speech", "Oratory", "Audience", "Rhetoric", "Repetition", "Delivery", "Persuasion", "Historic"], passage: "Great oratory moves an audience. A historic speech uses rhetoric such as repetition, strong delivery and a clear message to achieve persuasion.", question: "Which famous speech do you find most powerful?", funfact: "Did you know? Martin Luther King Jr.'s 'I Have a Dream' speech was delivered in Washington, D.C., in 1963." },
                24: { title: "Data Journalism", terms: ["Data journalism", "Dataset", "Chart", "Analysis", "Trend", "Transparency", "Visualisation", "Evidence"], passage: "Data journalism uses a dataset and careful analysis to find each trend. A clear chart or visualisation presents evidence, and transparency about methods builds trust.", question: "How can data make a news story stronger?", funfact: "Did you know? In the 1850s, Florence Nightingale used innovative diagrams to show that many soldiers were dying from preventable disease." },
                25: { title: "Writing an Academic Essay", terms: ["Essay", "Thesis", "Paragraph", "Evidence", "Analysis", "Counterargument", "Conclusion", "Citation"], passage: "An academic essay starts with a clear thesis. Each paragraph presents evidence and analysis, a counterargument shows balance, and a strong conclusion and accurate citation complete the work.", question: "What is the hardest part of writing an essay for you?", funfact: "Did you know? The essay form is often traced to Michel de Montaigne, who published his 'Essais' in 1580." },
            },
        };
        Object.values(curriculum).forEach(g => Object.values(g).forEach(d => { d.vocab = d.terms; d.story = d.passage; }));

        const minWords = () => MIN_WORDS[state.level] || 3;
        function allTermsForLevel(level) {
            let words = [];

            return [...new Set(words)];

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_newspaper_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

        // On phones the lesson sits below the module list, so after choosing a module, a unit
        // or the next lesson, the page scrolls to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');

        function completeActivity() {
            markActivityComplete(state.tab);

            let gotBadge = false;

            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');

            const levelData = curriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % unitNumbers.length;
            state.unit = unitNumbers[nextIdx];
            document.getElementById('unit-select').value = state.unit;
            renderContent();
            scrollToLesson(true);

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }
        const countWords = (s) => (String(s).match(/[A-Za-z\u00C0-\u024F\u1780-\u17FF]+(?:['’-][A-Za-z]+)*/g) || []).length;

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function allVocabForLevel(level) {
            let words = [];
            Object.keys(curriculum[level]).forEach(u => words.push(...curriculum[level][u].vocab));
            return [...new Set(words)];
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';

        const SUBTITLES = {"OC-NP5-Unit01-Reading-Literary-Criticism": [[0.35, 6.29, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.59, 9.76, "Hi! I'm Visal. Let's learn together!"], [10.06, 18.01, "Unit one: Reading Literary Criticism. Today you will avoid overstatement with hedges such as may well, seems to and tends to."], [18.31, 21.04, "Here is our lesson map. Let's start!"], [22.0, 25.12, "Part one: words. You will learn eight new words."], [25.98, 27.4, "Literary criticism."], [28.42, 32.66, "Literary criticism means the study and judgement of books, poems and plays."], [33.25, 36.71, "Literary criticism asks what a text really means."], [37.32, 40.8, "Your turn. Say: Literary criticism."], [43.67, 45.32, "Literary criticism."], [46.08, 47.48, "Critical lens."], [48.48, 53.41, "Critical lens means a particular way of looking at a text, such as feminist or historical."], [54.02, 57.26, "A historical critical lens reveals hidden politics."], [57.85, 60.86, "Your turn. Say: Critical lens."], [63.7, 65.1, "Critical lens."], [65.85, 67.48, "Thematic analysis."], [68.48, 72.84, "Thematic analysis means the study of the main ideas that run through a work."], [73.45, 76.6, "Thematic analysis showed that loss unites the poems."], [77.18, 80.46, "Your turn. Say: Thematic analysis."], [83.3, 84.88, "Thematic analysis."], [85.62, 86.66, "Symbolism."], [87.65, 91.86, "Symbolism means the use of objects or images to stand for ideas."], [92.45, 94.9, "The storm is full of symbolism in the novel."], [95.52, 98.02, "Your turn. Say: Symbolism."], [100.87, 101.94, "Symbolism."], [102.68, 103.96, "Narrative technique."], [104.95, 108.58, "Narrative technique means the method an author uses to tell a story."], [109.18, 112.22, "A shifting narrative technique keeps readers uncertain."], [112.82, 115.71, "Your turn. Say: Narrative technique."], [118.57, 120.18, "Narrative technique."], [120.92, 122.11, "Subtext."], [123.12, 126.94, "Subtext means the meaning beneath the words that characters actually say."], [127.55, 129.81, "The subtext of the dinner scene is fear."], [130.42, 132.95, "Your turn. Say: Subtext."], [135.8, 136.86, "Subtext."], [137.62, 138.93, "Interpretation."], [139.92, 143.8, "Interpretation means a reasoned explanation of what a text means."], [144.38, 146.91, "Her interpretation challenged the usual reading."], [147.52, 150.09, "Your turn. Say: Interpretation."], [152.93, 154.38, "Interpretation."], [155.12, 155.84, "Canon."], [156.85, 160.71, "Canon means the set of works widely accepted as the most important."], [161.32, 163.78, "The canon has slowly become more diverse."], [164.38, 166.66, "Your turn. Say: Canon."], [169.5, 170.21, "Canon."], [171.0, 174.91, "Part two: dialogue. Let's listen to a conversation."], [175.75, 181.58, "Visal, a critic writes 'The novel may well be read as a warning.' Why 'may well' and not simply 'is'?"], [182.68, 193.18, "It is hedging. Critics rarely prove an interpretation, so they use may well, seems to, tends to or arguably. The claim stays reasoned but open to challenge."], [194.28, 195.74, "Where do the hedges go?"], [196.85, 209.22, "Modals sit before the base verb: may well suggest. Seems to and tends to take an infinitive. Arguably usually opens the clause: Arguably, the sea symbolises freedom."], [210.32, 212.1, "Can a writer hedge too much?"], [213.18, 223.2, "Yes. One hedge per claim is enough. 'It might perhaps possibly seem' sounds weak. Choose the hedge that matches the strength of your evidence."], [224.37, 226.34, "Part three: grammar."], [227.18, 232.24, "Grammar focus: Hedging: may well and seems to and tends to and arguably."], [232.54, 233.72, "Look at the pattern."], [234.42, 236.66, "The novel may well be read as a warning."], [237.55, 240.56, "The poet seems to use the sea as a symbol of freedom."], [241.45, 244.16, "Modern critics tend to read the ending as ironic."], [245.1, 253.19, "Hedge a claim with may well, seems to, tends to or arguably. It shows careful reasoning, not weakness. Use one hedge per claim."], [253.95, 257.81, "Be careful! Don't say: The poem is may well be a protest."], [259.77, 262.65, "Say: The poem may well be a protest."], [262.95, 265.26, "Do not add is before a modal verb."], [266.07, 268.52, "Part four: reading. Read and listen."], [269.33, 270.71, "Careful Claims."], [271.01, 276.35, "Literary criticism rarely offers proof, so careful critics hedge their claims."], [277.33, 281.9, "A feminist critical lens may well reveal power that a first reading misses."], [282.9, 289.74, "Thematic analysis tends to show that one image, such as the storm, carries several meanings through its symbolism."], [290.73, 297.42, "The narrator seems to hide the truth, and the subtext of each conversation is arguably more important than its words."], [298.43, 302.94, "Over time, a convincing interpretation can change which books are admitted to the canon."], [304.03, 308.31, "Part five: quiz. Five questions. Are you ready?"], [309.15, 311.27, "The poem blank be read as a protest."], [311.57, 314.94, "A, may well. B, is being. C, have to."], [318.5, 320.57, "The answer is A: may well."], [321.72, 324.82, "The meaning beneath what characters actually say is the blank."], [325.12, 328.71, "A, canon. B, subtext. C, stanza."], [332.27, 334.25, "The answer is B: subtext."], [335.42, 337.37, "Which sentence hedges correctly?"], [337.67, 344.7, "A, The ending seems to be ironic.. B, The ending seems being ironic.. C, The ending seem to ironic.."], [348.27, 351.32, "The answer is A: The ending seems to be ironic.."], [352.48, 356.39, "The set of works widely seen as most important is the blank."], [356.69, 360.08, "A, abstract. B, lens. C, canon."], [363.63, 365.92, "The answer is C: canon."], [367.08, 370.11, "According to the reading, what may a feminist lens reveal?"], [370.4, 376.3, "A, power a first reading misses. B, the author's address. C, the printing date."], [379.83, 382.99, "The answer is A: power a first reading misses."], [384.2, 387.28, "Part six: speaking. It's your turn to talk."], [388.12, 391.31, "How does a critical lens change the way we understand a story?"], [400.12, 401.73, "Now listen to Visal."], [402.03, 430.21, "A critical lens makes us ask new questions. A historical lens may show how a story reflects its time, while a feminist lens may reveal who has power and who is silent. The same events can seem quite different from each angle. A good critic tends to combine several lenses, so that the interpretation is richer and less one-sided than a single first impression."], [430.51, 432.18, "Excellent answer, Visal!"], [433.08, 439.33, "Great work! Now you can use eight new words and hedging: may well and seems to and tends to and arguably."], [439.63, 444.31, "Today's value is interpretive depth. Read slowly and look for more than one meaning."], [444.61, 447.04, "See you in Unit two. Goodbye!"], [447.34, 450.7, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit02-Academic-Journal-Reading": [[0.35, 5.82, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.12, 9.55, "Hi! I'm Visal. Let's learn together!"], [9.85, 16.7, "Unit two: Academic Journal Reading. Today you will report claims precisely with passive reporting structures."], [17.0, 19.64, "Here is our lesson map. Let's start!"], [20.6, 23.93, "Part one: words. You will learn eight new words."], [24.78, 25.81, "Peer review."], [26.82, 31.35, "Peer review means the checking of research by independent experts before publication."], [31.95, 34.08, "Peer review caught an error in the data."], [34.68, 37.66, "Your turn. Say: Peer review."], [40.5, 41.58, "Peer review."], [42.32, 43.33, "Abstract."], [44.32, 48.57, "Abstract means a short summary placed at the start of a research article."], [49.18, 53.02, "The abstract states the main finding in 150 words."], [53.62, 56.07, "Your turn. Say: Abstract."], [58.93, 59.97, "Abstract."], [60.72, 61.94, "Methodology."], [62.95, 66.85, "Methodology means the methods and reasoning used to carry out a study."], [67.45, 70.59, "The methodology explains how the sample was chosen."], [71.18, 74.05, "Your turn. Say: Methodology."], [76.9, 78.18, "Methodology."], [78.92, 80.03, "Citation."], [81.05, 84.95, "Citation means a reference showing the source of an idea or fact."], [85.55, 87.9, "Each citation must be accurate."], [88.48, 91.0, "Your turn. Say: Citation."], [93.83, 95.08, "Citation."], [95.82, 97.13, "Literature review."], [98.12, 101.77, "Literature review means a survey of earlier research on a topic."], [102.35, 105.12, "The literature review shows what is already known."], [105.72, 108.74, "Your turn. Say: Literature review."], [111.6, 112.9, "Literature review."], [113.65, 114.93, "Hypothesis."], [115.92, 120.25, "Hypothesis means a testable explanation proposed before a study begins."], [120.85, 123.45, "The hypothesis predicted a small difference."], [124.05, 127.04, "Your turn. Say: Hypothesis."], [129.9, 131.3, "Hypothesis."], [132.05, 133.67, "Empirical evidence."], [134.65, 138.98, "Empirical evidence means information gained by observation or experiment."], [139.58, 142.06, "Empirical evidence supports the theory."], [142.65, 145.7, "Your turn. Say: Empirical evidence."], [148.53, 150.17, "Empirical evidence."], [150.92, 152.35, "Scholarly source."], [153.35, 158.12, "Scholarly source means a reliable publication written by experts for other experts."], [158.72, 161.74, "A scholarly source usually lists its references."], [162.35, 165.72, "Your turn. Say: Scholarly source."], [168.57, 170.08, "Scholarly source."], [170.87, 174.53, "Part two: dialogue. Let's listen to a conversation."], [175.38, 182.26, "Visal, an article states 'The drug is said to reduce stress' and 'It is believed that stress affects memory'. What is this structure?"], [183.35, 194.48, "Passive reporting. It lets a writer present an idea without naming who holds it. Use subject + is said / thought / known to + infinitive, or It is believed that + clause."], [195.58, 197.12, "Why use it in journals?"], [198.22, 211.32, "It sounds objective and keeps the focus on the finding. For earlier events, use the perfect infinitive: The method is thought to have been invented in 1950."], [212.42, 213.52, "Any warning?"], [214.62, 222.86, "Do not hide weak evidence behind it. 'It is widely believed' needs a citation. A reader must be able to check who believes it and why."], [224.0, 225.67, "Part three: grammar."], [226.52, 231.87, "Grammar focus: Passive reporting: is said and thought and known to plus infinitive."], [232.17, 233.28, "Look at the pattern."], [233.98, 236.78, "The drug is said to reduce stress in patients."], [237.68, 241.33, "The method is thought to have been invented in 1950."], [242.22, 245.11, "These results are known to depend on sample size."], [246.07, 256.66, "Use subject + is said / thought / known to + infinitive, or It is believed that + clause. Add have + past participle for an earlier time. Support every report with a citation."], [257.42, 261.54, "Be careful! Don't say: It said that the drug helps sleep."], [263.5, 266.43, "Say: It is said that the drug helps sleep."], [266.73, 268.8, "Passive reporting needs the verb be."], [269.6, 272.46, "Part four: reading. Read and listen."], [273.27, 274.95, "How to Read a Journal Article."], [275.25, 280.25, "A journal article begins with an abstract, which summarises the question and the main finding."], [281.23, 286.09, "The literature review is said to show the gap that the new hypothesis tries to fill."], [287.1, 293.53, "The methodology is thought to be the most important section, because empirical evidence is only as good as the way it was gathered."], [294.53, 299.67, "Peer review is known to catch many mistakes before publication, although it is not perfect."], [300.67, 305.04, "Careful readers check each citation and prefer a scholarly source to a blog."], [306.13, 310.44, "Part five: quiz. Five questions. Are you ready?"], [311.28, 314.11, "The method is said blank in 1950."], [314.41, 318.69, "A, to have been developed. B, to developing. C, that developed."], [322.23, 324.72, "The answer is A: to have been developed."], [325.88, 328.92, "A short summary at the start of an article is an blank."], [329.22, 332.88, "A, appendix. B, abstract. C, citation."], [336.43, 338.56, "The answer is B: abstract."], [339.72, 342.41, "Which sentence uses passive reporting correctly?"], [342.71, 349.93, "A, It is thought that sleep helps memory.. B, It thought that sleep helps memory.. C, Is thought that sleep helps memory.."], [353.47, 356.73, "The answer is A: It is thought that sleep helps memory.."], [357.88, 361.62, "Information gained by observation or experiment is blank evidence."], [361.92, 366.2, "A, empirical. B, scholarly. C, chronological."], [369.77, 372.35, "The answer is A: empirical."], [373.48, 376.69, "According to the reading, what is known to catch many mistakes?"], [376.99, 381.12, "A, a blog. B, peer review. C, an abstract."], [384.67, 387.22, "The answer is B: peer review."], [388.43, 391.15, "Part six: speaking. It's your turn to talk."], [392.02, 394.91, "Why is peer review important for academic research?"], [403.72, 405.27, "Now listen to Visal."], [405.57, 432.22, "Peer review is important because independent experts check the research before it is published. They look at the methodology, the empirical evidence and the conclusions, and they may find errors that the authors missed. This process is thought to improve quality and protect readers from weak or misleading claims. It is not perfect, but it gives scholarship a shared standard of trust."], [432.52, 434.19, "Excellent answer, Visal!"], [435.08, 441.29, "Great work! Now you can use eight new words and passive reporting: is said and thought and known to plus infinitive."], [441.59, 446.89, "Today's value is intellectual rigor. Hold your ideas to the highest standard of evidence."], [447.19, 449.62, "See you in Unit three. Goodbye!"], [449.92, 452.6, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit03-Philosophical-Essays": [[0.35, 6.07, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.37, 9.72, "Hi! I'm Visal. Let's learn together!"], [10.02, 17.6, "Unit three: Philosophical Essays. Today you will concede a point while keeping your position with although, albeit and whereas."], [17.9, 20.51, "Here is our lesson map. Let's start!"], [21.47, 24.93, "Part one: words. You will learn eight new words."], [25.78, 26.66, "Argument."], [27.65, 31.23, "Argument means a series of reasons that support a conclusion."], [31.82, 33.98, "Her argument moves step by step."], [34.58, 36.81, "Your turn. Say: Argument."], [39.67, 40.69, "Argument."], [41.45, 42.38, "Premise."], [43.38, 46.42, "Premise means a statement that an argument takes as true."], [47.02, 50.2, "If the premise is false, the argument fails."], [50.82, 53.35, "Your turn. Say: Premise."], [56.2, 57.09, "Premise."], [57.85, 59.36, "Logical fallacy."], [60.35, 64.56, "Logical fallacy means an error in reasoning that makes an argument invalid."], [65.15, 67.89, "Attacking the speaker is a logical fallacy."], [68.48, 71.76, "Your turn. Say: Logical fallacy."], [74.6, 76.09, "Logical fallacy."], [76.85, 77.99, "Counterargument."], [78.98, 81.8, "Counterargument means a reason that opposes a position."], [82.38, 85.09, "A fair essay answers the strongest counterargument."], [85.68, 88.94, "Your turn. Say: Counterargument."], [91.8, 92.95, "Counterargument."], [93.72, 94.98, "Thought experiment."], [95.98, 99.6, "Thought experiment means an imagined situation used to test an idea."], [100.18, 103.06, "The thought experiment imagined a city without laws."], [103.65, 106.45, "Your turn. Say: Thought experiment."], [109.3, 110.56, "Thought experiment."], [111.32, 112.84, "Abstract concept."], [113.85, 118.46, "Abstract concept means an idea such as justice that cannot be touched or seen."], [119.05, 121.23, "Freedom is an abstract concept."], [121.85, 124.82, "Your turn. Say: Abstract concept."], [127.67, 129.56, "Abstract concept."], [130.32, 131.26, "Reasoning."], [132.25, 136.24, "Reasoning means the process of thinking logically to reach a conclusion."], [136.85, 139.44, "Clear reasoning convinces careful readers."], [140.05, 142.34, "Your turn. Say: Reasoning."], [145.2, 146.28, "Reasoning."], [147.02, 148.04, "Conclusion."], [149.05, 152.31, "Conclusion means the final point that follows from the argument."], [152.92, 155.52, "The conclusion follows from both premises."], [156.12, 158.71, "Your turn. Say: Conclusion."], [161.57, 162.63, "Conclusion."], [163.43, 166.99, "Part two: dialogue. Let's listen to a conversation."], [167.85, 173.97, "Visal, a philosopher writes 'Although the argument is clever, it rests on a weak premise.' What does although do?"], [175.08, 184.75, "It concedes a point. Although introduces the part that is true, and the main clause gives your real position. The reader sees you were fair before you disagreed."], [185.85, 187.64, "Are there more formal choices?"], [188.75, 204.18, "Yes. Albeit means although it is: 'a brilliant, albeit flawed, argument'. Whereas contrasts two facts: 'Plato trusted reason, whereas Hume trusted experience.'"], [205.28, 206.84, "What about punctuation?"], [207.95, 218.94, "A comma separates a leading although-clause from the main clause. Albeit is not followed by a full clause, only a short phrase. Do not use but together with although."], [220.1, 221.74, "Part three: grammar."], [222.58, 226.12, "Grammar focus: Concession: although and albeit and whereas."], [226.41, 227.56, "Look at the pattern."], [228.25, 231.4, "Although the argument is clever, it rests on a weak premise."], [232.28, 235.56, "Her case is persuasive, albeit slightly incomplete."], [236.45, 240.27, "Plato trusted reason, whereas Hume trusted experience."], [241.23, 250.21, "Although + clause concedes a point; albeit + short phrase means although it is; whereas contrasts two facts. Never use although and but together."], [250.95, 255.02, "Be careful! Don't say: Although it was late, but we kept reading."], [256.97, 259.63, "Say: Although it was late, we kept reading."], [259.93, 261.97, "Do not use although and but together."], [262.77, 265.66, "Part four: reading. Read and listen."], [266.47, 267.98, "Fair to the Other Side."], [268.28, 272.93, "A philosophical essay presents an argument and tests it against the strongest counterargument."], [273.93, 278.81, "Although a premise may seem obvious, careful reasoning asks whether it is really true."], [279.8, 284.92, "A logical fallacy, albeit a tempting one, can make a weak conclusion look strong."], [285.93, 291.64, "Some thinkers use a thought experiment, whereas others prefer to examine an abstract concept directly."], [292.63, 296.82, "Whichever method is used, the conclusion must follow from the premises."], [297.9, 301.84, "Part five: quiz. Five questions. Are you ready?"], [302.68, 305.19, "blank the idea is old, it still matters."], [305.49, 308.95, "A, Although. B, Despite. C, However."], [312.5, 314.09, "The answer is A: Although."], [315.25, 319.34, "An imagined situation used to test an idea is a thought blank."], [319.64, 323.29, "A, premise. B, experiment. C, fallacy."], [326.83, 328.97, "The answer is B: experiment."], [330.12, 331.66, "Which sentence is correct?"], [331.96, 338.26, "A, Although it rained, but we left.. B, Although it rained, we left.. C, Although it rained we but left.."], [341.8, 344.66, "The answer is B: Although it rained, we left.."], [345.82, 348.62, "A statement that an argument takes as true is a blank."], [348.92, 353.16, "A, conclusion. B, counterargument. C, premise."], [356.7, 358.92, "The answer is C: premise."], [360.08, 363.81, "According to the reading, what must follow from the premises?"], [364.11, 368.79, "A, the conclusion. B, the abstract. C, the thought experiment."], [372.33, 374.83, "The answer is A: the conclusion."], [376.03, 379.38, "Part six: speaking. It's your turn to talk."], [380.22, 384.12, "Why might a philosopher use a thought experiment to explain an idea?"], [392.92, 394.49, "Now listen to Visal."], [394.79, 423.04, "A thought experiment lets a philosopher test an idea in a situation that cannot be created in real life. By imagining an extreme or simple case, the reader can see the premise clearly and judge whether the reasoning really works. Although it is not scientific proof, it makes an abstract concept concrete and can reveal hidden problems in an argument before we accept the conclusion."], [423.34, 425.09, "Excellent answer, Visal!"], [425.98, 431.79, "Great work! Now you can use eight new words and concession: although and albeit and whereas."], [432.09, 437.11, "Today's value is logical rigor. Follow your reasoning wherever it honestly leads."], [437.41, 440.01, "See you in Unit four. Goodbye!"], [440.31, 442.98, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit04-Historical-Analysis-Texts": [[0.35, 6.09, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.39, 9.85, "Hi! I'm Visal. Let's learn together!"], [10.15, 18.47, "Unit four: Historical Analysis Texts. Today you will discuss unreal pasts with inverted conditionals such as Had it not been for."], [18.77, 21.51, "Here is our lesson map. Let's start!"], [22.47, 25.71, "Part one: words. You will learn eight new words."], [26.55, 28.04, "Primary source."], [29.05, 33.29, "Primary source means an original document or object from the time being studied."], [33.88, 36.87, "A diary is a valuable primary source."], [37.48, 40.59, "Your turn. Say: Primary source."], [43.43, 44.88, "Primary source."], [45.62, 46.9, "Historiography."], [47.88, 52.12, "Historiography means the study of how history has been written and interpreted."], [52.72, 55.95, "Historiography shows how views of the war changed."], [56.55, 59.91, "Your turn. Say: Historiography."], [62.77, 64.28, "Historiography."], [65.02, 66.66, "Historical context."], [67.65, 72.12, "Historical context means the conditions and events surrounding something in the past."], [72.72, 75.77, "Historical context explains why the law was passed."], [76.38, 79.86, "Your turn. Say: Historical context."], [82.7, 84.51, "Historical context."], [85.25, 86.3, "Causation."], [87.28, 90.85, "Causation means the relationship between a cause and its effect."], [91.45, 94.15, "Historians debate the causation of the revolution."], [94.75, 97.61, "Your turn. Say: Causation."], [100.47, 101.51, "Causation."], [102.25, 103.23, "Bias."], [104.22, 107.15, "Bias means an unfair leaning towards one side."], [107.75, 110.05, "The chronicler's bias favoured the king."], [110.65, 113.19, "Your turn. Say: Bias."], [116.03, 116.92, "Bias."], [117.68, 118.99, "Interpretation."], [119.98, 124.15, "Interpretation means a reasoned explanation of what evidence means."], [124.75, 127.71, "Each interpretation depends on the evidence chosen."], [128.32, 130.98, "Your turn. Say: Interpretation."], [133.83, 135.1, "Interpretation."], [135.85, 137.42, "Archival research."], [138.42, 142.02, "Archival research means the study of documents kept in an archive."], [142.62, 145.57, "Archival research uncovered letters nobody had read."], [146.18, 149.61, "Your turn. Say: Archival research."], [152.47, 154.01, "Archival research."], [154.75, 156.05, "Periodization."], [157.05, 160.91, "Periodization means dividing the past into named periods for study."], [161.52, 163.99, "Periodization can hide gradual change."], [164.58, 167.65, "Your turn. Say: Periodization."], [170.5, 171.64, "Periodization."], [172.43, 175.79, "Part two: dialogue. Let's listen to a conversation."], [176.65, 182.72, "Visal, a historian writes 'Had the harvest not failed, the revolt might never have begun.' What is unusual here?"], [183.82, 196.22, "It is an inverted conditional. Had + subject + past participle replaces If + past perfect. It is formal and common when historians imagine a different past."], [197.32, 199.19, "What is the result clause?"], [200.28, 209.67, "Usually would / might / could + have + past participle. Had the treaty held, war would have been avoided. It describes an unreal result in the past."], [210.78, 212.19, "Can we make it negative?"], [213.28, 224.93, "Put not after the subject: Had the king not died. The phrase 'Had it not been for' also works with a noun: Had it not been for the diaries, we would know little."], [226.1, 227.77, "Part three: grammar."], [228.62, 234.04, "Grammar focus: Inverted conditional: Had plus subject plus past participle."], [234.34, 235.5, "Look at the pattern."], [236.22, 239.9, "Had the harvest not failed, the revolt might never have begun."], [240.78, 243.25, "Had the treaty held, war would have been avoided."], [244.15, 247.43, "Had it not been for the diaries, we would know little about the siege."], [248.37, 258.42, "Had + subject + past participle = If + past perfect. Use would / might / could have + past participle for the unreal result. Add not after the subject for a negative."], [259.18, 262.82, "Be careful! Don't say: If had we known, we would have acted."], [264.77, 267.2, "Say: Had we known, we would have acted."], [267.5, 269.4, "Drop if when you invert with had."], [270.2, 272.4, "Part four: reading. Read and listen."], [273.2, 273.93, "What If?."], [274.23, 278.71, "Historians study causation, but they cannot run experiments on the past."], [279.7, 283.51, "Had a primary source been lost, a whole period might have stayed unknown."], [284.5, 290.04, "Archival research often shows that historical context was more complex than later writers claimed."], [291.03, 296.35, "Had the chronicler been neutral, his bias would not have shaped later historiography so strongly."], [297.37, 302.56, "Periodization is useful, although dividing the past into periods can hide gradual change."], [303.67, 307.53, "Part five: quiz. Five questions. Are you ready?"], [308.38, 310.9, "blank the letter arrived, he would have stayed."], [311.2, 314.92, "A, Had. B, If had. C, Has."], [318.47, 320.02, "The answer is A: Had."], [321.18, 324.53, "An original document from the time studied is a blank source."], [324.83, 328.48, "A, primary. B, secondary. C, digital."], [332.03, 333.87, "The answer is A: primary."], [335.02, 336.64, "Which sentence is correct?"], [336.94, 343.34, "A, Had we known, we would help.. B, Had we known, we would have helped.. C, Have we known, we would have helped.."], [346.9, 350.04, "The answer is B: Had we known, we would have helped.."], [351.18, 353.97, "An unfair leaning towards one side is blank."], [354.27, 358.16, "A, periodization. B, causation. C, bias."], [361.7, 363.71, "The answer is C: bias."], [364.85, 368.46, "According to the reading, what is useful but may hide gradual change?"], [368.76, 373.21, "A, periodization. B, an archive. C, a diary."], [376.77, 379.29, "The answer is A: periodization."], [380.5, 384.06, "Part six: speaking. It's your turn to talk."], [384.92, 388.87, "Why might two historians interpret the same primary source differently?"], [397.68, 399.78, "Now listen to Visal."], [400.08, 429.16, "Two historians may read the same primary source differently because they bring different questions, knowledge and assumptions. One may focus on the author's bias, while another stresses the historical context. Had they asked the same question, their conclusions might have matched. Different interpretations are healthy when each is supported by evidence and openly explained, because they push scholars to test their ideas."], [429.46, 431.12, "Excellent answer, Visal!"], [432.02, 438.37, "Great work! Now you can use eight new words and inverted conditional: had plus subject plus past participle."], [438.67, 443.67, "Today's value is historical awareness. Know the past so you can understand the present."], [443.97, 446.61, "See you in Unit five. Goodbye!"], [446.91, 450.23, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit05-Scientific-Papers": [[0.35, 6.17, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.47, 9.48, "Hi! I'm Visal. Let's learn together!"], [9.78, 17.1, "Unit five: Scientific Papers. Today you will describe methods and results formally with passive modals."], [17.4, 20.27, "Here is our lesson map. Let's start!"], [21.23, 24.45, "Part one: words. You will learn eight new words."], [25.32, 26.65, "Research question."], [27.65, 31.79, "Research question means the specific question a study sets out to answer."], [32.38, 34.74, "The research question was clear and narrow."], [35.35, 38.99, "Your turn. Say: Research question."], [41.83, 43.19, "Research question."], [43.95, 45.57, "Data analysis."], [46.55, 50.7, "Data analysis means the process of examining results to find patterns."], [51.28, 53.97, "Data analysis revealed a clear trend."], [54.58, 57.93, "Your turn. Say: Data analysis."], [60.77, 62.7, "Data analysis."], [63.45, 64.59, "Control group."], [65.58, 69.44, "Control group means the group that does not receive the treatment being tested."], [70.05, 72.43, "The control group received no medicine."], [73.02, 75.58, "Your turn. Say: Control group."], [78.43, 79.67, "Control group."], [80.42, 82.23, "Statistical significance."], [83.22, 88.04, "Statistical significance means a sign that a result is unlikely to be due to chance."], [88.65, 91.76, "Statistical significance does not prove importance."], [92.35, 95.61, "Your turn. Say: Statistical significance."], [98.47, 100.25, "Statistical significance."], [100.98, 101.94, "Peer-reviewed."], [102.95, 107.03, "Peer-reviewed means checked by independent experts before being published."], [107.62, 110.08, "Only peer-reviewed studies were included."], [110.68, 113.16, "Your turn. Say: Peer-reviewed."], [116.0, 116.85, "Peer-reviewed."], [117.62, 118.7, "Replication."], [119.68, 123.63, "Replication means repeating a study to see whether the results are the same."], [124.25, 127.11, "Replication builds confidence in a finding."], [127.72, 130.44, "Your turn. Say: Replication."], [133.3, 134.56, "Replication."], [135.32, 136.34, "Findings."], [137.35, 140.99, "Findings means the results and discoveries reported by a study."], [141.58, 143.42, "The findings surprised the team."], [144.02, 146.45, "Your turn. Say: Findings."], [149.3, 150.22, "Findings."], [150.98, 152.08, "Conclusion."], [153.08, 156.34, "Conclusion means the final judgement based on the evidence."], [156.95, 159.15, "The conclusion was limited to adults."], [159.75, 162.54, "Your turn. Say: Conclusion."], [165.4, 166.45, "Conclusion."], [167.23, 171.1, "Part two: dialogue. Let's listen to a conversation."], [171.95, 178.99, "Visal, a paper says 'Samples must be stored at minus twenty' and 'The results could have been affected.' What are these structures?"], [180.08, 192.18, "Passive modals. Modal + be + past participle describes duties or possibilities without naming the person. Samples must be stored. Errors can be avoided."], [193.28, 194.46, "And for the past?"], [195.55, 207.71, "Use modal + have been + past participle: The results may have been affected by heat. The test should have been repeated. It reports what was possible or necessary earlier."], [208.82, 210.86, "Why is it popular in science?"], [211.95, 224.18, "It keeps attention on the procedure, not on the researcher. Still, avoid vague agents: say 'were recorded by two observers' if who did it affects trust."], [225.33, 226.87, "Part three: grammar."], [227.72, 232.79, "Grammar focus: Passive modals: must be and may have been plus past participle."], [233.09, 234.43, "Look at the pattern."], [235.12, 238.09, "Samples must be stored at minus twenty degrees."], [238.98, 241.28, "The results may have been affected by heat."], [242.18, 244.8, "The test should have been repeated with a larger sample."], [245.73, 255.79, "Use modal + be + past participle for duties and possibilities, and modal + have been + past participle for the past. Name the agent when it affects trust."], [256.55, 260.38, "Be careful! Don't say: The data should been checked twice."], [262.33, 264.81, "Say: The data should have been checked twice."], [265.11, 267.1, "Add have before been after a modal."], [267.9, 270.62, "Part four: reading. Read and listen."], [271.43, 272.82, "Inside a Study."], [273.12, 277.14, "Every scientific paper begins with a research question that can be tested."], [278.13, 283.28, "The control group must be treated in exactly the same way, except for the factor being studied."], [284.27, 291.49, "After data analysis, results can be described as statistically significant only if chance is unlikely to explain them."], [292.5, 298.39, "A peer-reviewed paper should have been checked, but replication gives even stronger confidence in the findings."], [299.4, 302.99, "A fair conclusion must be limited to what the evidence can support."], [304.1, 308.1, "Part five: quiz. Five questions. Are you ready?"], [308.95, 311.17, "The samples blank stored in the cold."], [311.47, 315.03, "A, must be. B, must. C, must have."], [318.57, 320.49, "The answer is A: must be."], [321.65, 324.67, "The group that does not receive the treatment is the blank group."], [324.97, 328.6, "A, control. B, findings. C, peer."], [332.17, 333.91, "The answer is A: control."], [335.05, 336.7, "Which sentence is correct?"], [337.0, 343.31, "A, The test should have repeated.. B, The test should have been repeated.. C, The test should be have repeated.."], [346.87, 350.02, "The answer is B: The test should have been repeated.."], [351.15, 353.69, "Repeating a study to check the results is blank."], [354.0, 358.1, "A, analysis. B, abstraction. C, replication."], [361.67, 363.94, "The answer is C: replication."], [365.08, 368.96, "According to the reading, a fair conclusion must be limited to…"], [369.26, 374.43, "A, the author's opinion. B, what the evidence can support. C, the title."], [377.97, 380.81, "The answer is B: what the evidence can support."], [382.0, 385.34, "Part six: speaking. It's your turn to talk."], [386.18, 389.84, "Why is replication important for trusting scientific findings?"], [398.65, 400.09, "Now listen to Visal."], [400.39, 425.76, "Replication is important because one study can be affected by chance, error or bias. If other researchers repeat the method and obtain the same results, the findings become far more reliable. If they cannot, the original result may have been a mistake. Replication therefore protects science from weak claims and helps knowledge grow on a solid base."], [426.06, 427.71, "Excellent answer, Visal!"], [428.62, 435.33, "Great work! Now you can use eight new words and passive modals: must be and may have been plus past participle."], [435.63, 441.56, "Today's value is scientific literacy. Understand how evidence and testing build knowledge."], [441.86, 444.32, "See you in Unit six. Goodbye!"], [444.62, 448.44, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit06-Opinion-Editorials": [[0.35, 5.77, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.07, 9.66, "Hi! I'm Visal. Let's learn together!"], [9.96, 15.94, "Unit six: Opinion Editorials. Today you will stress what matters with what-clauses and emphatic do."], [16.24, 18.82, "Here is our lesson map. Let's start!"], [19.77, 23.05, "Part one: words. You will learn eight new words."], [23.88, 24.79, "Op-ed."], [25.78, 31.2, "Op-ed means an article that gives a named writer's opinion, printed opposite the editorial page."], [31.78, 34.29, "The op-ed argued for longer school days."], [34.88, 37.09, "Your turn. Say: Op-ed."], [39.93, 40.75, "Op-ed."], [41.48, 42.77, "Persuasive writing."], [43.78, 47.8, "Persuasive writing means writing meant to change what readers think or do."], [48.42, 50.79, "Persuasive writing needs a clear claim."], [51.38, 54.05, "Your turn. Say: Persuasive writing."], [56.9, 58.32, "Persuasive writing."], [59.08, 60.04, "Bias."], [61.05, 63.83, "Bias means an unfair leaning towards one side."], [64.42, 66.52, "The writer admits a personal bias."], [67.12, 69.5, "Your turn. Say: Bias."], [72.37, 73.26, "Bias."], [74.02, 75.46, "Rhetorical device."], [76.45, 80.57, "Rhetorical device means a technique that makes language more persuasive."], [81.18, 84.02, "Repetition is a powerful rhetorical device."], [84.62, 87.51, "Your turn. Say: Rhetorical device."], [90.37, 91.82, "Rhetorical device."], [92.58, 93.65, "Counterpoint."], [94.65, 98.14, "Counterpoint means an opposing idea that is answered in the text."], [98.75, 101.25, "A fair op-ed includes one counterpoint."], [101.85, 104.44, "Your turn. Say: Counterpoint."], [107.3, 108.44, "Counterpoint."], [109.18, 110.45, "Call to action."], [111.45, 115.13, "Call to action means a closing request that tells readers what to do."], [115.72, 117.91, "The call to action asked readers to vote."], [118.52, 121.39, "Your turn. Say: Call to action."], [124.23, 125.47, "Call to action."], [126.22, 127.26, "Perspective."], [128.25, 131.4, "Perspective means a particular way of viewing a subject."], [131.98, 134.34, "The op-ed offered a farmer's perspective."], [134.95, 138.09, "Your turn. Say: Perspective."], [140.93, 142.12, "Perspective."], [142.88, 144.58, "Evidence-based argument."], [145.58, 149.36, "Evidence-based argument means a claim supported by facts and data."], [149.95, 152.89, "An evidence-based argument persuades sceptics."], [153.48, 157.33, "Your turn. Say: Evidence-based argument."], [160.17, 161.99, "Evidence-based argument."], [162.8, 166.76, "Part two: dialogue. Let's listen to a conversation."], [167.62, 173.51, "Visal, an op-ed says 'What we need is a better debate' and 'We do need a better debate.' Why the extra words?"], [174.62, 185.46, "They add emphasis. A what-clause puts the key idea at the end: What we need is a better debate. Emphatic do stresses the verb: We do need a better debate."], [186.55, 188.1, "When should a writer use them?"], [189.18, 202.18, "At a turning point or to answer an objection: 'Critics say the plan is costly. It does cost money, but what matters is the long-term result.' Use them sparingly."], [203.28, 204.73, "Any grammar rule?"], [205.82, 218.42, "After emphatic do, use the base verb: does want, did say. In a what-clause the verb after is agrees with the focus: What matters is the evidence; What matter are the figures."], [219.57, 220.99, "Part three: grammar."], [221.85, 226.57, "Grammar focus: Emphasis: What plus clause plus is… and do plus base verb."], [226.87, 227.96, "Look at the pattern."], [228.65, 230.95, "What we need is a better public debate."], [231.85, 233.93, "What matters is the long-term result."], [234.82, 237.52, "The plan does cost money, but it saves more."], [238.47, 247.54, "A what-clause puts the key idea last: What we need is… Emphatic do / does / did + base verb stresses a verb. Use both sparingly for effect."], [248.28, 252.41, "Be careful! Don't say: What we need are a calm debate."], [254.37, 257.07, "Say: What we need is a calm debate."], [257.37, 260.61, "The verb must agree with the focus: a debate."], [261.4, 264.01, "Part four: reading. Read and listen."], [264.8, 266.23, "Writing to Persuade."], [266.53, 270.49, "An op-ed is persuasive writing that gives one named person's perspective."], [271.5, 277.33, "What readers remember is usually the central claim, so an evidence-based argument must state it clearly."], [278.33, 282.49, "A skilled writer does admit bias and answers one counterpoint before the end."], [283.5, 288.74, "Repetition and contrast are rhetorical devices that make an argument easier to remember."], [289.73, 294.3, "What the final paragraph needs is a call to action that tells readers what to do next."], [295.4, 299.5, "Part five: quiz. Five questions. Are you ready?"], [300.35, 302.22, "blank we need is more evidence."], [302.52, 305.54, "A, What. B, That. C, Which."], [309.1, 310.77, "The answer is A: What."], [311.92, 315.52, "A closing request that tells readers what to do is a call to blank."], [315.82, 319.24, "A, bias. B, action. C, device."], [322.8, 324.93, "The answer is B: action."], [326.08, 328.66, "Which sentence uses emphatic do correctly?"], [328.96, 334.14, "A, She does wants change.. B, She does want change.. C, She do want change.."], [337.7, 340.3, "The answer is B: She does want change.."], [341.45, 344.58, "An opposing idea that is answered in the text is a blank."], [344.88, 348.69, "A, counterpoint. B, perspective. C, headline."], [352.23, 354.48, "The answer is A: counterpoint."], [355.62, 359.08, "According to the reading, what should the final paragraph include?"], [359.38, 364.5, "A, a counterpoint only. B, a call to action. C, a hidden bias."], [368.03, 370.4, "The answer is B: a call to action."], [371.6, 374.89, "Part six: speaking. It's your turn to talk."], [375.75, 379.26, "How is an opinion editorial different from a regular news article?"], [388.05, 389.62, "Now listen to Visal."], [389.92, 416.54, "A news article tries to report facts neutrally, while an opinion editorial openly presents one writer's view. The op-ed uses persuasive writing, rhetorical devices and a call to action to change minds. Good op-eds still rely on an evidence-based argument and fair treatment of a counterpoint, but their purpose is to convince, not just to inform."], [416.84, 418.63, "Excellent answer, Visal!"], [419.52, 426.39, "Great work! Now you can use eight new words and emphasis: what plus clause plus is… and do plus base verb."], [426.69, 431.34, "Today's value is critical reasoning. Test every argument before you accept it."], [431.64, 433.98, "See you in Unit seven. Goodbye!"], [434.28, 436.99, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit07-Comparative-Literature": [[0.35, 6.2, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.5, 10.15, "Hi! I'm Visal. Let's learn together!"], [10.45, 17.7, "Unit seven: Comparative Literature. Today you will compare and contrast with whereas, much as and the more… the more."], [18.0, 20.58, "Here is our lesson map. Let's start!"], [21.53, 25.15, "Part one: words. You will learn eight new words."], [25.98, 27.84, "Cross-cultural analysis."], [28.85, 33.47, "Cross-cultural analysis means the study of how ideas appear in different cultures."], [34.08, 37.52, "Cross-cultural analysis compared two creation myths."], [38.12, 42.0, "Your turn. Say: Cross-cultural analysis."], [44.83, 46.68, "Cross-cultural analysis."], [47.42, 48.86, "Translated text."], [49.85, 54.89, "Translated text means a work rewritten in a language other than its original one."], [55.48, 58.53, "A translated text always involves choices."], [59.12, 62.17, "Your turn. Say: Translated text."], [65.03, 66.46, "Translated text."], [67.22, 68.61, "Literary tradition."], [69.62, 74.8, "Literary tradition means a long-running set of styles and forms in a culture's writing."], [75.38, 78.09, "The epic belongs to an ancient literary tradition."], [78.68, 82.02, "Your turn. Say: Literary tradition."], [84.87, 86.11, "Literary tradition."], [86.85, 88.21, "Comparative method."], [89.22, 93.61, "Comparative method means a way of learning by placing two things side by side."], [94.22, 96.66, "The comparative method reveals patterns."], [97.25, 100.42, "Your turn. Say: Comparative method."], [103.27, 104.81, "Comparative method."], [105.55, 106.88, "World literature."], [107.88, 112.02, "World literature means writing from many cultures that is read across borders."], [112.62, 115.05, "World literature reaches readers everywhere."], [115.65, 118.43, "Your turn. Say: World literature."], [121.27, 122.7, "World literature."], [123.45, 124.94, "Textual comparison."], [125.95, 130.03, "Textual comparison means close study of the words of two texts together."], [130.62, 133.49, "Textual comparison showed similar images."], [134.08, 137.11, "Your turn. Say: Textual comparison."], [139.97, 141.7, "Textual comparison."], [142.45, 144.01, "Cultural context."], [145.02, 148.66, "Cultural context means the beliefs and customs that surround a work."], [149.25, 152.02, "Cultural context explains the hero's duty."], [152.62, 155.81, "Your turn. Say: Cultural context."], [158.67, 160.32, "Cultural context."], [161.08, 162.44, "Universal theme."], [163.45, 167.34, "Universal theme means an idea found in the literature of all cultures."], [167.95, 170.37, "Love and loss are universal themes."], [170.98, 174.18, "Your turn. Say: Universal theme."], [177.03, 178.34, "Universal theme."], [179.13, 182.88, "Part two: dialogue. Let's listen to a conversation."], [183.72, 189.69, "Visal, a critic writes 'The more we compare the epics, the more we notice shared fears.' What is the pattern?"], [190.78, 201.88, "The double comparative: the more… the more. It shows two changes that grow together. The more translations we read, the less we trust a single version."], [202.98, 204.89, "How do we contrast two works?"], [205.98, 219.91, "Use whereas or while: 'The Greek epic stresses glory, whereas the Khmer tale stresses duty.' Much as means in the same way as, but with a small difference: Much as I admire it, I disagree."], [221.02, 222.81, "Is there a common mistake?"], [223.92, 236.23, "Learners forget the in the double comparative. Say the more, the less, not more… more. And keep each part in comparative form: the longer the poem, the harder the translation."], [237.37, 239.22, "Part three: grammar."], [240.05, 244.38, "Grammar focus: Comparing: the more… the more and whereas and much as."], [244.68, 245.92, "Look at the pattern."], [246.62, 250.33, "The more we compare the epics, the more shared fears we notice."], [251.25, 255.54, "The Greek epic stresses glory, whereas the Khmer tale stresses duty."], [256.45, 259.53, "The longer the poem, the harder the translation becomes."], [260.47, 267.84, "The + comparative, the + comparative shows linked change. Use whereas / while to contrast two facts and much as for a partly shared view."], [268.58, 272.14, "Be careful! Don't say: More you read, more you learn."], [274.1, 276.58, "Say: The more you read, the more you learn."], [276.88, 278.83, "Both parts of the pattern need the."], [279.63, 282.33, "Part four: reading. Read and listen."], [283.13, 284.89, "Reading Across Cultures."], [285.19, 289.98, "Cross-cultural analysis places works from different literary traditions side by side."], [290.97, 297.4, "The more carefully critics read a translated text, the more they realise how many choices a translator makes."], [298.4, 303.62, "One tradition may value personal glory, whereas another values duty to the community."], [304.6, 310.18, "Textual comparison depends on cultural context, and the wider the context, the clearer the meaning."], [311.17, 317.08, "World literature endures because each universal theme, such as love or loss, speaks to every reader."], [318.17, 322.09, "Part five: quiz. Five questions. Are you ready?"], [322.95, 325.04, "The blank you read, the more you learn."], [325.34, 328.4, "A, more. B, most. C, much."], [331.97, 333.47, "The answer is A: more."], [334.62, 337.66, "A work rewritten in another language is a blank text."], [337.96, 342.0, "A, comparative. B, translated. C, universal."], [345.53, 347.8, "The answer is B: translated."], [348.95, 351.03, "Which sentence contrasts correctly?"], [351.33, 360.42, "A, The first rhymes, whereas the second does not.. B, The first rhymes, whereas not rhymes the second.. C, The first whereas rhymes, the second not.."], [363.97, 367.83, "The answer is A: The first rhymes, whereas the second does not.."], [368.98, 372.54, "An idea found in literature of all cultures is a blank theme."], [372.84, 376.07, "A, local. B, formal. C, universal."], [379.63, 382.11, "The answer is C: universal."], [383.25, 386.86, "According to the reading, what endures because of universal themes?"], [387.16, 391.93, "A, world literature. B, one translation. C, a single epic."], [395.47, 397.91, "The answer is A: world literature."], [399.1, 402.4, "Part six: speaking. It's your turn to talk."], [403.25, 407.37, "What can comparing literature from two different cultures teach us about both?"], [416.18, 417.67, "Now listen to Visal."], [417.97, 442.58, "Comparing two literatures shows what is shared and what is special. We may see a universal theme, such as grief, treated in very different ways, and we learn that each culture has its own values and habits of storytelling. The more we compare, the better we understand our own tradition as well, because differences make familiar ideas visible."], [442.88, 444.87, "Excellent answer, Visal!"], [445.78, 451.96, "Great work! Now you can use eight new words and comparing: the more… the more and whereas and much as."], [452.26, 457.83, "Today's value is cultural openness. Read beyond your own tradition to see the world more fully."], [458.13, 460.56, "See you in Unit eight. Goodbye!"], [460.86, 463.28, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit08-Poetry-Analysis": [[0.35, 5.75, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.04, 9.62, "Hi! I'm Visal. Let's learn together!"], [9.92, 16.89, "Unit eight: Poetry Analysis. Today you will paint a scene with absolute constructions such as With the sun setting."], [17.19, 19.76, "Here is our lesson map. Let's start!"], [20.7, 23.97, "Part one: words. You will learn eight new words."], [24.82, 25.6, "Meter."], [26.58, 30.86, "Meter means the pattern of stressed and unstressed syllables in a line."], [31.45, 33.89, "The meter gives the poem a steady pulse."], [34.48, 36.66, "Your turn. Say: Meter."], [39.5, 40.29, "Meter."], [41.05, 42.02, "Imagery."], [43.02, 47.42, "Imagery means words that create pictures or sensations in the reader's mind."], [48.02, 50.1, "The imagery of winter fills the poem."], [50.68, 53.1, "Your turn. Say: Imagery."], [55.97, 56.92, "Imagery."], [57.68, 58.7, "Metaphor."], [59.68, 63.19, "Metaphor means a comparison that says one thing is another."], [63.78, 66.1, "Calling time a river is a metaphor."], [66.68, 69.16, "Your turn. Say: Metaphor."], [72.0, 72.97, "Metaphor."], [73.72, 75.09, "Stanza structure."], [76.08, 79.97, "Stanza structure means the way a poem is divided into groups of lines."], [80.58, 83.59, "The stanza structure changes in the final verse."], [84.18, 87.42, "Your turn. Say: Stanza structure."], [90.27, 91.87, "Stanza structure."], [92.62, 93.66, "Poetic form."], [94.65, 98.84, "Poetic form means the established pattern of a poem, such as a sonnet."], [99.45, 101.66, "A sonnet is a strict poetic form."], [102.25, 105.13, "Your turn. Say: Poetic form."], [108.0, 109.04, "Poetic form."], [109.78, 110.46, "Tone."], [111.45, 114.52, "Tone means the writer's attitude shown through word choice."], [115.12, 117.37, "The tone moves from joy to regret."], [117.98, 120.33, "Your turn. Say: Tone."], [123.2, 124.02, "Tone."], [124.75, 126.1, "Figurative language."], [127.08, 131.92, "Figurative language means words used for imaginative effect rather than their literal meaning."], [132.52, 134.85, "Figurative language makes ideas vivid."], [135.45, 138.65, "Your turn. Say: Figurative language."], [141.5, 143.06, "Figurative language."], [143.82, 144.83, "Close reading."], [145.82, 150.2, "Close reading means slow, careful study of the exact words of a text."], [150.78, 153.44, "Close reading revealed a hidden pattern of sounds."], [154.05, 156.31, "Your turn. Say: Close reading."], [159.17, 160.4, "Close reading."], [161.2, 164.68, "Part two: dialogue. Let's listen to a conversation."], [165.52, 172.27, "Visal, a critic describes a poem: 'With the sun setting, the poet turns to memory.' What is 'With the sun setting'?"], [173.38, 185.45, "An absolute construction. With + noun + participle or adjective adds a scene or reason without a full clause: With the village asleep, the speaker is free to remember."], [186.55, 188.75, "Why is it useful in analysis?"], [189.85, 202.28, "It describes imagery briefly and links it to a meaning: The poem ends with the lamp burning low, suggesting fading hope. Its own subject is separate from the main subject."], [203.38, 204.69, "Any other forms?"], [205.78, 216.79, "Without the with: 'The sun setting, the poet turns to memory.' Both are formal. Do not mix subjects carelessly: the absolute phrase has its own noun."], [217.93, 219.42, "Part three: grammar."], [220.28, 225.92, "Grammar focus: Absolute constructions: With plus noun plus participle and adjective."], [226.22, 227.46, "Look at the pattern."], [228.15, 230.75, "With the sun setting, the poet turns to memory."], [231.65, 234.6, "With the village asleep, the speaker is free to remember."], [235.52, 238.81, "The final stanza ending in silence, the tone becomes sad."], [239.77, 248.34, "With + noun + participle / adjective adds a scene or reason. The noun is its own subject, so the clause stays separate from the main subject."], [249.08, 252.88, "Be careful! Don't say: With the lamp burn low, he wrote."], [254.83, 257.27, "Say: With the lamp burning low, he wrote."], [257.57, 259.47, "Use the -ing form after the noun."], [260.27, 262.79, "Part four: reading. Read and listen."], [263.6, 265.13, "Reading a Poem Closely."], [265.44, 269.1, "Close reading begins with the exact words and the pattern of the meter."], [270.1, 273.78, "With the imagery growing darker, the tone shifts from hope to regret."], [274.77, 280.09, "The poem uses a metaphor of the sea, its figurative language suggesting both danger and freedom."], [281.1, 286.12, "With the stanza structure breaking in the final verse, the reader senses a loss of control."], [287.13, 292.71, "A strict poetic form, such as the sonnet, makes every small change in meter easier to notice."], [293.8, 297.71, "Part five: quiz. Five questions. Are you ready?"], [298.55, 300.93, "With the lights blank, the poem ends."], [301.23, 304.76, "A, fading. B, fade. C, to fade."], [308.3, 310.46, "The answer is A: fading."], [311.62, 314.73, "A comparison that says one thing is another is a blank."], [315.03, 318.34, "A, meter. B, tone. C, metaphor."], [321.9, 324.27, "The answer is C: metaphor."], [325.42, 327.03, "Which sentence is correct?"], [327.33, 335.51, "A, With the stanza ending, the mood changes.. B, With the stanza end, the mood changes.. C, With the stanza to ends, the mood changes.."], [339.07, 342.68, "The answer is A: With the stanza ending, the mood changes.."], [343.82, 346.61, "The writer's attitude shown through word choice is blank."], [346.91, 350.78, "A, tone. B, stanza. C, form."], [354.33, 356.04, "The answer is A: tone."], [357.18, 360.15, "According to the reading, close reading begins with…"], [360.45, 365.49, "A, the author's life. B, the exact words. C, the ending only."], [369.03, 371.66, "The answer is B: the exact words."], [372.87, 376.1, "Part six: speaking. It's your turn to talk."], [376.95, 381.3, "How does close reading a poem change your understanding of it compared to a first read?"], [390.08, 391.74, "Now listen to Visal."], [392.03, 416.63, "A first read gives a general feeling, while close reading shows how that feeling is made. By studying the imagery, meter and tone line by line, I notice patterns that I missed at first, such as a repeated sound or an unexpected metaphor. With each rereading, the meaning grows deeper and I understand why the poet chose each word."], [416.93, 418.71, "Excellent answer, Visal!"], [419.62, 426.48, "Great work! Now you can use eight new words and absolute constructions: with plus noun plus participle and adjective."], [426.78, 431.72, "Today's value is appreciation of beauty. Learn to notice and value the beauty around you."], [432.02, 434.48, "See you in Unit nine. Goodbye!"], [434.78, 437.99, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit09-Rhetorical-Analysis": [[0.35, 5.82, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.12, 9.87, "Hi! I'm Visal. Let's learn together!"], [10.17, 16.54, "Unit nine: Rhetorical Analysis. Today you will link ideas with not only… but also, both… and, and whether… or."], [16.84, 19.42, "Here is our lesson map. Let's start!"], [20.37, 23.76, "Part one: words. You will learn eight new words."], [24.62, 26.07, "Rhetorical strategy."], [27.08, 31.13, "Rhetorical strategy means a planned way of using language to persuade."], [31.72, 34.52, "Storytelling is a common rhetorical strategy."], [35.12, 38.31, "Your turn. Say: Rhetorical strategy."], [41.17, 42.99, "Rhetorical strategy."], [43.75, 45.25, "Audience awareness."], [46.25, 50.62, "Audience awareness means understanding who is reading or listening and what they need."], [51.22, 54.32, "Audience awareness shapes every word choice."], [54.92, 57.94, "Your turn. Say: Audience awareness."], [60.8, 62.32, "Audience awareness."], [63.08, 64.49, "Persuasive appeal."], [65.48, 70.16, "Persuasive appeal means a way of winning agreement through character, emotion or logic."], [70.75, 73.23, "Each persuasive appeal works differently."], [73.82, 76.93, "Your turn. Say: Persuasive appeal."], [79.8, 81.3, "Persuasive appeal."], [82.05, 83.04, "Ethos."], [84.05, 87.79, "Ethos means an appeal based on the speaker's character and trustworthiness."], [88.38, 91.0, "A doctor's ethos makes advice credible."], [91.58, 94.21, "Your turn. Say: Ethos."], [97.07, 98.0, "Ethos."], [98.75, 99.87, "Pathos."], [100.88, 104.36, "Pathos means an appeal that stirs the audience's emotions."], [104.95, 107.13, "The photograph relied on pathos."], [107.75, 110.29, "Your turn. Say: Pathos."], [113.13, 114.23, "Pathos."], [114.98, 115.97, "Logos."], [116.98, 120.49, "Logos means an appeal based on logic, facts and reasoning."], [121.08, 123.87, "Logos uses statistics and clear steps."], [124.48, 127.15, "Your turn. Say: Logos."], [130.0, 131.15, "Logos."], [131.92, 133.41, "Rhetorical situation."], [134.42, 138.91, "Rhetorical situation means the context of speaker, audience, purpose and occasion."], [139.52, 142.12, "The rhetorical situation determines the tone."], [142.72, 145.67, "Your turn. Say: Rhetorical situation."], [148.53, 150.5, "Rhetorical situation."], [151.25, 152.59, "Argument structure."], [153.58, 157.66, "Argument structure means the order in which claims and evidence are arranged."], [158.25, 160.59, "A clear argument structure guides the reader."], [161.18, 164.2, "Your turn. Say: Argument structure."], [167.03, 168.45, "Argument structure."], [169.27, 172.72, "Part two: dialogue. Let's listen to a conversation."], [173.58, 179.81, "Visal, an analysis says 'The speech appeals not only to logic but also to emotion.' What does the pair do?"], [180.92, 193.52, "Correlative conjunctions join two parallel parts: not only… but also, both… and, whether… or. They show balance and add emphasis. Parallel parts must have the same grammar."], [194.62, 196.3, "What does 'same grammar' mean?"], [197.42, 213.35, "If the first part is a noun phrase, so is the second: both ethos and pathos. Not 'both ethos and appealing to emotion'. Whether she informs or entertains, she wins attention."], [214.45, 215.75, "And with inversion?"], [216.85, 229.3, "If not only begins the sentence, invert: Not only does the speech use logos, but it also builds trust. This is formal and gives strong emphasis."], [230.47, 231.76, "Part three: grammar."], [232.62, 238.05, "Grammar focus: Correlatives: not only… but also and both… and and whether… or."], [238.35, 239.53, "Look at the pattern."], [240.22, 243.59, "The speech appeals not only to logic but also to emotion."], [244.48, 246.73, "She uses both ethos and pathos."], [247.62, 251.54, "Not only does the speaker use logos, but she also builds trust."], [252.5, 262.5, "Join equal parts with not only… but also, both… and, whether… or. Keep the grammar parallel. After Not only at the start of a sentence, invert the subject and auxiliary."], [263.25, 267.46, "Be careful! Don't say: Not only she wrote, but she also taught."], [269.4, 273.19, "Say: Not only did she write, but she also taught."], [273.49, 275.71, "Invert the subject after Not only."], [276.5, 279.21, "Part four: reading. Read and listen."], [280.0, 281.77, "Three Ways to Persuade."], [282.07, 285.92, "Rhetorical analysis asks how a text persuades its audience."], [286.93, 291.7, "A strong speaker uses both ethos and logos, and the best also add pathos."], [292.7, 298.68, "Not only does audience awareness shape the tone, but it also decides which persuasive appeal comes first."], [299.67, 305.67, "Whether the rhetorical situation is a courtroom or a rally, the speaker must choose a clear argument structure."], [306.67, 312.13, "A rhetorical strategy is effective not only when it is logical but also when it fits the audience."], [313.23, 317.21, "Part five: quiz. Five questions. Are you ready?"], [318.05, 320.62, "She uses blank logos and pathos."], [320.92, 324.12, "A, both. B, either. C, neither."], [327.67, 329.25, "The answer is A: both."], [330.38, 332.62, "An appeal based on emotion is blank."], [332.92, 336.8, "A, ethos. B, pathos. C, logos."], [340.37, 342.4, "The answer is B: pathos."], [343.55, 345.18, "Which sentence is correct?"], [345.48, 354.01, "A, Not only she is clear, but she is kind.. B, Not only is she clear, but she is also kind.. C, Not only she clear is, but also kind.."], [357.57, 361.3, "The answer is B: Not only is she clear, but she is also kind.."], [362.45, 365.26, "An appeal based on logic and facts is blank."], [365.56, 369.2, "A, ethos. B, pathos. C, logos."], [372.77, 374.8, "The answer is C: logos."], [375.95, 379.3, "According to the reading, what must a speaker choose?"], [379.6, 384.89, "A, a clear argument structure. B, a longer title. C, a quiet room."], [388.43, 391.55, "The answer is A: a clear argument structure."], [392.73, 395.94, "Part six: speaking. It's your turn to talk."], [396.78, 402.44, "Which persuasive appeal — ethos, pathos, or logos — do you find most convincing, and why?"], [411.25, 412.66, "Now listen to Visal."], [412.96, 434.81, "I find logos the most convincing, because facts and clear reasoning can be checked. However, I think the best arguments use all three. Ethos makes me trust the speaker, pathos makes me care, and logos shows that the claim is sound. Not only does a balanced argument persuade, but it also respects the audience."], [435.11, 436.91, "Excellent answer, Visal!"], [437.82, 444.25, "Great work! Now you can use eight new words and correlatives: not only… but also and both… and and whether… or."], [444.55, 449.13, "Today's value is reasoned judgment. Weigh the evidence before you decide what to believe."], [449.43, 451.71, "See you in Unit ten. Goodbye!"], [452.01, 455.27, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit10-Case-Study-Reports": [[0.35, 6.35, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.65, 10.28, "Hi! I'm Visal. Let's learn together!"], [10.58, 17.92, "Unit ten: Case Study Reports. Today you will add background compactly with appositives and reduced relative clauses."], [18.22, 20.83, "Here is our lesson map. Let's start!"], [21.77, 25.02, "Part one: words. You will learn eight new words."], [25.88, 27.08, "Case background."], [28.08, 32.13, "Case background means the setting and history that explain why a case matters."], [32.72, 35.69, "The case background describes the firm's early years."], [36.28, 39.01, "Your turn. Say: Case background."], [41.87, 43.17, "Case background."], [43.92, 45.28, "Data collection."], [46.28, 51.0, "Data collection means the gathering of information through interviews, surveys or records."], [51.58, 53.79, "Data collection lasted six months."], [54.38, 57.24, "Your turn. Say: Data collection."], [60.1, 61.52, "Da
