nd 'The drug is unlikely to cause harm.' What is the structure?"], [174.65, 185.65, "Be likely / unlikely / bound / certain / sure to + base verb. It states probability. Likely is probable; bound means almost certain; unlikely means improbable."], [186.75, 188.99, "Why is it important in science news?"], [190.08, 201.61, "Because researchers rarely know for sure. A careful journalist chooses the right level: 'may' is weak, 'is likely to' is stronger, 'is certain to' should be rare."], [202.72, 204.23, "Any other options?"], [205.32, 218.7, "It is likely that… or There is a good chance that… Never write 'will definitely' about a single study. Use the perfect infinitive for the past: The study is likely to have been affected by sampling."], [219.83, 221.25, "Part three: grammar."], [222.12, 228.18, "Grammar focus: Probability: be likely and unlikely and bound and certain to plus verb."], [228.48, 229.69, "Look at the pattern."], [230.38, 232.82, "The treatment is likely to help most patients."], [233.72, 236.25, "The drug is unlikely to cause serious harm."], [237.15, 240.52, "The study is likely to have been affected by the small sample."], [241.47, 248.76, "Use be likely / unlikely / bound / certain to + base verb for probability. Choose the strength of the word to match the strength of the evidence."], [249.52, 253.42, "Be careful! Don't say: The drug is unlikely cause harm."], [255.37, 258.09, "Say: The drug is unlikely to cause harm."], [258.39, 261.14, "Use to + base verb after unlikely."], [261.93, 264.57, "Part four: reading. Read and listen."], [265.37, 266.7, "Reporting with Care."], [267.0, 271.3, "Science journalism explains new research to readers who are not experts."], [272.3, 276.3, "A careful writer is unlikely to promise a cure after one small study."], [277.3, 281.62, "An expert will often say that the evidence is likely to change as more data arrive."], [282.63, 288.87, "Accuracy means describing uncertainty honestly, because readers are bound to trust a clear and fair report."], [289.87, 295.57, "Public understanding improves when journalists explain the limits of the research as well as the results."], [296.67, 300.69, "Part five: quiz. Five questions. Are you ready?"], [301.55, 303.81, "The results blank change with more data."], [304.11, 307.77, "A, are likely to. B, likely. C, are likely."], [311.33, 313.38, "The answer is A: are likely to."], [314.52, 317.51, "Facts or signs that show something is true are blank."], [317.81, 321.97, "A, uncertainty. B, evidence. C, headlines."], [325.53, 327.86, "The answer is B: evidence."], [329.02, 330.63, "Which sentence is correct?"], [330.93, 337.89, "A, The drug is unlikely cause harm.. B, The drug is unlikely to cause harm.. C, The drug unlikely is to cause harm.."], [341.43, 344.91, "The answer is B: The drug is unlikely to cause harm.."], [346.05, 348.55, "Being correct in every detail is blank."], [348.85, 352.6, "A, accuracy. B, opinion. C, debate."], [356.13, 358.03, "The answer is A: accuracy."], [359.18, 363.2, "According to the reading, what does one small study rarely justify?"], [363.5, 368.34, "A, promising a cure. B, writing a title. C, asking an expert."], [371.9, 374.41, "The answer is A: promising a cure."], [375.6, 378.83, "Part six: speaking. It's your turn to talk."], [379.68, 383.34, "Why do science headlines sometimes exaggerate findings?"], [392.15, 393.71, "Now listen to Visal."], [394.01, 419.48, "Science headlines sometimes exaggerate because editors want attention, and strong words attract clicks. A careful study may say a result is likely, while a headline says it is proven. Uncertainty is harder to put in a few words. Readers should therefore look at the full article and the evidence, and journalists should choose accuracy over excitement."], [419.78, 421.49, "Excellent answer, Visal!"], [422.38, 429.9, "Great work! Now you can use eight new words and probability: be likely and unlikely and bound and certain to plus verb."], [430.2, 435.6, "Today's value is intellectual honesty. Follow the evidence, even when it is inconvenient."], [435.9, 438.58, "See you in Unit twenty-two. Goodbye!"], [438.88, 441.33, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit22-Book-Reviews": [[0.35, 5.82, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.12, 9.66, "Hi! I'm Visal. Let's learn together!"], [9.96, 17.2, "Unit twenty-two: Book Reviews. Today you will judge with gradable and non-gradable adjectives and the right intensifiers."], [17.5, 20.03, "Here is our lesson map. Let's start!"], [20.97, 24.12, "Part one: words. You will learn eight new words."], [24.98, 25.98, "Review."], [26.98, 30.83, "Review means a written opinion about a book, film or other work."], [31.42, 33.73, "The review gave the novel four stars."], [34.32, 36.41, "Your turn. Say: Review."], [39.27, 40.08, "Review."], [40.82, 41.74, "Summary."], [42.75, 45.45, "Summary means a short account of the main points."], [46.05, 48.3, "A summary should not give away the ending."], [48.92, 51.21, "Your turn. Say: Summary."], [54.07, 55.09, "Summary."], [55.85, 57.2, "Evaluation."], [58.18, 62.2, "Evaluation means a judgement about how good or effective something is."], [62.82, 65.03, "Her evaluation was fair and detailed."], [65.62, 68.37, "Your turn. Say: Evaluation."], [71.23, 72.49, "Evaluation."], [73.25, 74.05, "Plot."], [75.05, 78.03, "Plot means the series of events that make up a story."], [78.62, 80.87, "The plot kept me guessing until the end."], [81.48, 83.76, "Your turn. Say: Plot."], [86.6, 87.36, "Plot."], [88.12, 89.09, "Style."], [90.08, 93.45, "Style means the particular way in which a writer uses language."], [94.05, 96.04, "The style is simple but powerful."], [96.65, 99.12, "Your turn. Say: Style."], [101.97, 102.85, "Style."], [103.62, 104.79, "Recommendation."], [105.78, 109.42, "Recommendation means advice that something is worth reading or doing."], [110.02, 112.31, "My recommendation is to read it slowly."], [112.92, 115.77, "Your turn. Say: Recommendation."], [118.6, 119.9, "Recommendation."], [120.65, 121.41, "Critic."], [122.42, 125.51, "Critic means a person who judges books or art for a living."], [126.12, 128.34, "The critic praised the opening chapter."], [128.95, 131.44, "Your turn. Say: Critic."], [134.3, 135.01, "Critic."], [135.75, 136.54, "Reader."], [137.55, 140.34, "Reader means a person who reads a book or text."], [140.95, 143.12, "Every reader will notice something different."], [143.72, 146.18, "Your turn. Say: Reader."], [149.03, 149.8, "Reader."], [150.6, 154.09, "Part two: dialogue. Let's listen to a conversation."], [154.95, 161.41, "Visal, a critic writes 'The ending is absolutely brilliant' but 'The pace is very slow.' Why not 'very brilliant'?"], [162.52, 176.62, "Gradable adjectives, such as slow, good or tired, can be more or less: very slow, rather slow. Non-gradable ones, such as brilliant, perfect or impossible, are already extreme."], [177.72, 179.69, "What intensifiers do we use?"], [180.78, 196.6, "With non-gradable adjectives, use absolutely, utterly, completely or totally: absolutely brilliant. With gradable ones, use very, rather, fairly, extremely: extremely slow."], [197.72, 199.09, "Any exception?"], [200.18, 213.15, "Really works with both. Quite is tricky: quite good means fairly good, but quite perfect means completely perfect. Do not say very perfect or absolutely good in a review."], [214.3, 215.86, "Part three: grammar."], [216.72, 223.09, "Grammar focus: Intensifiers: very plus gradable and absolutely plus non-gradable."], [223.39, 224.62, "Look at the pattern."], [225.32, 227.36, "The ending is absolutely brilliant."], [228.25, 229.88, "The pace is very slow."], [230.78, 233.33, "The final chapter is utterly unforgettable."], [234.27, 243.71, "Use very, rather, extremely with gradable adjectives (slow, good). Use absolutely, utterly, completely with extreme adjectives (brilliant, perfect, impossible)."], [244.45, 248.11, "Be careful! Don't say: The ending is very brilliant."], [250.07, 252.65, "Say: The ending is absolutely brilliant."], [252.95, 255.63, "Use absolutely with an extreme adjective."], [256.43, 259.21, "Part four: reading. Read and listen."], [260.0, 261.14, "Judging a Book."], [261.44, 265.31, "A good review begins with a short summary of the plot without revealing the ending."], [266.3, 271.21, "The critic's evaluation then explains why the style is extremely effective or rather dull."], [272.2, 276.64, "A book that is absolutely brilliant for one reader may be very difficult for another."], [277.63, 281.42, "A clear recommendation tells the reader whether the book is worth the time."], [282.43, 286.66, "The best reviews are fair, specific and honest about the critic's own taste."], [287.77, 291.73, "Part five: quiz. Five questions. Are you ready?"], [292.58, 294.24, "The plot is blank amazing."], [294.53, 298.36, "A, absolutely. B, very. C, a bit."], [301.9, 304.1, "The answer is A: absolutely."], [305.25, 307.61, "A short account of the main points is a blank."], [307.91, 311.42, "A, summary. B, style. C, plot."], [314.97, 316.91, "The answer is A: summary."], [318.05, 319.75, "Which sentence is correct?"], [320.05, 329.47, "A, The novel is very impossible to put down.. B, The novel is absolutely impossible to put down.. C, The novel is absolutely good to put down.."], [333.03, 337.12, "The answer is B: The novel is absolutely impossible to put down.."], [338.28, 340.88, "Advice that a book is worth reading is a blank."], [341.18, 344.81, "A, plot. B, recommendation. C, critic."], [348.37, 350.8, "The answer is B: recommendation."], [351.95, 354.77, "According to the reading, what should good reviews be?"], [355.07, 360.24, "A, fair, specific and honest. B, long and angry. C, very short."], [363.8, 366.94, "The answer is A: fair, specific and honest."], [368.13, 371.25, "Part six: speaking. It's your turn to talk."], [372.12, 374.29, "What should a good book review include?"], [383.08, 384.55, "Now listen to Visal."], [384.85, 405.73, "A good book review should include a brief summary of the plot, an honest evaluation of the style and characters, and a clear recommendation. The critic should give examples from the text, avoid spoiling the ending and say who would enjoy the book. A fair review is specific and helps the reader decide."], [406.03, 408.03, "Excellent answer, Visal!"], [408.92, 416.13, "Great work! Now you can use eight new words and intensifiers: very plus gradable and absolutely plus non-gradable."], [416.43, 422.02, "Today's value is critical awareness. Use technology wisely, and always think for yourself."], [422.32, 425.5, "See you in Unit twenty-three. Goodbye!"], [425.8, 428.17, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit23-Speeches-and-Oratory": [[0.35, 5.91, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.21, 9.98, "Hi! I'm Visal. Let's learn together!"], [10.28, 18.07, "Unit twenty-three: Speeches and Oratory. Today you will rally an audience with let us, we shall and repeated patterns."], [18.37, 21.02, "Here is our lesson map. Let's start!"], [21.97, 25.21, "Part one: words. You will learn eight new words."], [26.05, 27.0, "Speech."], [28.02, 30.99, "Speech means a formal talk given to an audience."], [31.58, 33.59, "The speech lasted ten minutes."], [34.18, 36.72, "Your turn. Say: Speech."], [39.57, 40.66, "Speech."], [41.42, 42.53, "Oratory."], [43.55, 46.87, "Oratory means the art of speaking skilfully in public."], [47.48, 49.52, "Great oratory can move a nation."], [50.12, 52.77, "Your turn. Say: Oratory."], [55.63, 56.8, "Oratory."], [57.55, 58.52, "Audience."], [59.52, 63.2, "Audience means the people who listen to or watch a performance or talk."], [63.78, 65.66, "The audience stood and applauded."], [66.25, 69.03, "Your turn. Say: Audience."], [71.87, 73.06, "Audience."], [73.82, 74.7, "Rhetoric."], [75.72, 78.67, "Rhetoric means the art of using language to persuade."], [79.28, 82.01, "Skilled rhetoric uses rhythm and contrast."], [82.62, 85.54, "Your turn. Say: Rhetoric."], [88.4, 89.31, "Rhetoric."], [90.05, 91.24, "Repetition."], [92.25, 96.19, "Repetition means using the same word or pattern again for effect."], [96.78, 99.24, "Repetition makes the key idea memorable."], [99.85, 102.56, "Your turn. Say: Repetition."], [105.4, 106.46, "Repetition."], [107.22, 108.11, "Delivery."], [109.12, 112.98, "Delivery means the way a speaker uses voice, pace and gesture."], [113.58, 116.06, "Her calm delivery made the message stronger."], [116.65, 119.28, "Your turn. Say: Delivery."], [122.13, 123.26, "Delivery."], [124.02, 125.02, "Persuasion."], [126.02, 129.0, "Persuasion means the act of making people agree or act."], [129.62, 131.55, "Persuasion depends on trust."], [132.15, 134.64, "Your turn. Say: Persuasion."], [137.5, 138.56, "Persuasion."], [139.32, 140.41, "Historic."], [141.42, 145.13, "Historic means important in history and likely to be remembered."], [145.75, 147.47, "It was a historic speech."], [148.08, 150.54, "Your turn. Say: Historic."], [153.4, 154.35, "Historic."], [155.17, 158.62, "Part two: dialogue. Let's listen to a conversation."], [159.48, 165.69, "Visal, a speaker says 'Let us work together' and 'We shall not rest, we shall not tire.' What makes this powerful?"], [166.78, 181.25, "Two things: inclusive structures and repetition. Let us + base verb invites everyone to act. We shall is formal and firm. Repeating the pattern creates a rhythm that audiences remember."], [182.35, 184.12, "What is the grammar of 'let us'?"], [185.22, 197.83, "Let us + base verb, with the full form in formal speech: Let us begin. The contraction let's is informal. For negatives, say Let us not forget, or Let's not forget."], [198.92, 200.78, "How many repeats should I use?"], [201.88, 213.66, "Three is classic. A triad feels complete: We shall not rest, we shall not tire, we shall not fail. Keep each part parallel, short and rising in strength."], [214.8, 216.58, "Part three: grammar."], [217.42, 223.06, "Grammar focus: Rallying language: Let us and We shall plus parallel repetition."], [223.36, 224.56, "Look at the pattern."], [225.25, 227.82, "Let us work together for a fairer future."], [228.72, 231.26, "We shall not rest until every child can read."], [232.15, 234.61, "Let us not forget those who came before us."], [235.57, 245.31, "Let us + base verb invites; Let us not warns. We shall + base verb is formal and firm. Repeat the pattern three times, with parallel grammar, for rhythm."], [246.05, 249.89, "Be careful! Don't say: Let's us begin the meeting now."], [251.83, 254.31, "Say: Let us begin the meeting now."], [254.61, 256.61, "Use let us or let's, not both."], [257.4, 260.09, "Part four: reading. Read and listen."], [260.9, 262.42, "The Power of Words."], [262.72, 267.27, "Oratory is the art of persuading an audience through voice, structure and rhetoric."], [268.27, 273.89, "A historic speech often uses repetition: we shall learn, we shall build, we shall succeed."], [274.9, 278.43, "Let us not forget that delivery matters as much as the words themselves."], [279.43, 284.4, "A calm pace and well-placed pauses help persuasion, because listeners need time to think."], [285.4, 289.51, "When the speech ends, let us ask which lines the audience will remember tomorrow."], [290.6, 294.86, "Part five: quiz. Five questions. Are you ready?"], [295.72, 297.93, "blank begin with a moment of silence."], [298.23, 302.05, "A, Let us. B, Let we. C, Let our."], [305.6, 307.54, "The answer is A: Let us."], [308.68, 311.56, "Using the same pattern again for effect is blank."], [311.87, 315.72, "A, delivery. B, repetition. C, oratory."], [319.27, 321.51, "The answer is B: repetition."], [322.65, 324.22, "Which sentence is correct?"], [324.52, 330.26, "A, Let us to hope for peace.. B, Let us hope for peace.. C, Let us hoping for peace.."], [333.8, 336.54, "The answer is B: Let us hope for peace.."], [337.68, 341.02, "The way a speaker uses voice, pace and gesture is blank."], [341.32, 345.24, "A, rhetoric. B, delivery. C, persuasion."], [348.8, 350.65, "The answer is B: delivery."], [351.78, 354.21, "According to the reading, what do listeners need?"], [354.51, 359.0, "A, time to think. B, a longer speech. C, a printed copy."], [362.57, 364.87, "The answer is A: time to think."], [366.07, 369.37, "Part six: speaking. It's your turn to talk."], [370.22, 373.11, "Which famous speech do you find most powerful?"], [381.92, 383.39, "Now listen to Visal."], [383.69, 405.45, "I find the speeches about freedom and equality the most powerful, because they use clear words, repetition and hope. The speaker does not only inform; he or she invites us to act. The delivery is calm but passionate, and the audience feels part of the message. Let us remember that good words can change history."], [405.75, 407.46, "Excellent answer, Visal!"], [408.35, 414.79, "Great work! Now you can use eight new words and rallying language: let us and we shall plus parallel repetition."], [415.09, 420.07, "Today's value is eloquence. Choose your words with care, and speak to persuade honestly."], [420.37, 423.21, "See you in Unit twenty-four. Goodbye!"], [423.51, 426.82, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit24-Data-Journalism": [[0.35, 6.11, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [6.41, 9.86, "Hi! I'm Visal. Let's learn together!"], [10.16, 17.91, "Unit twenty-four: Data Journalism. Today you will report proportions precisely with twice as… as and three times as many as."], [18.21, 20.78, "Here is our lesson map. Let's start!"], [21.73, 25.34, "Part one: words. You will learn eight new words."], [26.18, 27.49, "Data journalism."], [28.48, 32.84, "Data journalism means reporting that uses numbers and datasets to tell a story."], [33.45, 36.83, "Data journalism revealed the real cost of the project."], [37.42, 40.02, "Your turn. Say: Data journalism."], [42.87, 44.17, "Data journalism."], [44.92, 45.8, "Dataset."], [46.82, 49.35, "Dataset means a collection of related data."], [49.95, 52.09, "The dataset covers ten years."], [52.68, 55.82, "Your turn. Say: Dataset."], [58.67, 59.68, "Dataset."], [60.42, 61.15, "Chart."], [62.15, 65.4, "Chart means a picture that shows information in a clear way."], [66.02, 68.14, "The chart compares two cities."], [68.75, 70.75, "Your turn. Say: Chart."], [73.6, 74.5, "Chart."], [75.25, 76.51, "Analysis."], [77.52, 81.11, "Analysis means careful examination to understand something."], [81.72, 83.69, "The analysis took three weeks."], [84.28, 86.89, "Your turn. Say: Analysis."], [89.73, 91.09, "Analysis."], [91.85, 92.64, "Trend."], [93.65, 96.97, "Trend means a general direction in which something is changing."], [97.58, 99.58, "The trend is clearly upward."], [100.18, 102.53, "Your turn. Say: Trend."], [105.4, 106.17, "Trend."], [106.92, 108.21, "Transparency."], [109.22, 112.5, "Transparency means being open about sources and methods."], [113.12, 116.02, "Transparency lets readers check the numbers."], [116.62, 119.47, "Your turn. Say: Transparency."], [122.3, 123.56, "Transparency."], [124.32, 125.57, "Visualisation."], [126.58, 130.54, "Visualisation means turning data into pictures such as maps and graphs."], [131.15, 133.75, "The visualisation made the problem obvious."], [134.35, 137.36, "Your turn. Say: Visualisation."], [140.2, 141.43, "Visualisation."], [142.18, 143.21, "Evidence."], [144.22, 147.67, "Evidence means facts or information that show something is true."], [148.28, 150.16, "The numbers are strong evidence."], [150.75, 153.24, "Your turn. Say: Evidence."], [156.1, 157.11, "Evidence."], [157.9, 162.04, "Part two: dialogue. Let's listen to a conversation."], [162.88, 168.98, "Visal, a story says 'Rents are twice as high as they were in 2010.' How is that comparison built?"], [170.08, 183.9, "Multiplier + as + adjective / adverb + as. Twice as high as; three times as fast as; half as expensive as. The first as is an adverb, the second introduces the comparison."], [184.98, 186.29, "And with nouns?"], [187.38, 200.65, "Use as many as with countable nouns and as much as with uncountable ones: The city has three times as many cyclists as in 2015. Spending is half as much as the average."], [201.75, 203.24, "What is the common error?"], [204.35, 216.14, "Using than: not 'twice higher than'. Say 'twice as high as' or 'twice the height of'. Check that the comparison is fair: compare rents with rents, not rents with incomes."], [217.3, 218.95, "Part three: grammar."], [219.82, 224.5, "Grammar focus: Proportions: twice and three times and half as… as."], [224.8, 225.95, "Look at the pattern."], [226.65, 229.86, "Rents are twice as high as they were in 2010."], [230.75, 235.08, "The city has three times as many cyclists as it had in 2015."], [235.98, 238.73, "Spending is half as much as the national average."], [239.67, 249.65, "Multiplier + as + adjective + as: twice as high as. With nouns: as many as (countable), as much as (uncountable). Never use than with an as… as pattern."], [250.38, 254.2, "Be careful! Don't say: Rents are twice higher than before."], [256.13, 259.18, "Say: Rents are twice as high as before."], [259.48, 262.19, "Use twice as + adjective + as."], [263.0, 265.79, "Part four: reading. Read and listen."], [266.6, 267.87, "Numbers with Meaning."], [268.17, 272.69, "Data journalism starts with a dataset and a clear question that the numbers might answer."], [273.7, 278.76, "A good analysis finds a trend, such as rents rising twice as fast as wages."], [279.77, 283.73, "A chart can show that one district has three times as many schools as another."], [284.73, 289.75, "Transparency means publishing the sources and methods so that readers can check the evidence."], [290.77, 295.82, "Careful visualisation avoids tricks, because a misleading chart is worse than no chart."], [296.93, 300.87, "Part five: quiz. Five questions. Are you ready?"], [301.72, 304.39, "The new bridge is twice as long blank the old one."], [304.69, 307.87, "A, as. B, than. C, like."], [311.43, 313.06, "The answer is A: as."], [314.22, 317.61, "A general direction in which something is changing is a blank."], [317.91, 321.26, "A, trend. B, chart. C, dataset."], [324.8, 326.58, "The answer is A: trend."], [327.72, 329.3, "Which sentence is correct?"], [329.6, 337.4, "A, She has three times as many books as me.. B, She has three times as many books as I do.. C, She has three times many as books.."], [340.93, 344.93, "The answer is B: She has three times as many books as I do.."], [346.08, 348.76, "Being open about sources and methods is blank."], [349.06, 353.85, "A, analysis. B, transparency. C, visualisation."], [357.4, 359.77, "The answer is B: transparency."], [360.92, 363.97, "According to the reading, what is worse than no chart?"], [364.27, 369.46, "A, a misleading chart. B, a long chart. C, a colourful chart."], [373.0, 375.75, "The answer is A: a misleading chart."], [376.97, 380.01, "Part six: speaking. It's your turn to talk."], [380.85, 383.15, "How can data make a news story stronger?"], [391.95, 393.44, "Now listen to Visal."], [393.74, 418.29, "Data can make a news story stronger by giving clear evidence instead of opinion. A chart or map can show a trend that words alone cannot, and exact numbers let readers compare, for example, one region that has twice as many cases as another. When the writer is transparent about the dataset and the method, readers trust the story more."], [418.59, 420.31, "Excellent answer, Visal!"], [421.22, 427.22, "Great work! Now you can use eight new words and proportions: twice and three times and half as… as."], [427.52, 432.02, "Today's value is analytical thinking. Look for the pattern underneath the surface."], [432.32, 435.3, "See you in Unit twenty-five. Goodbye!"], [435.6, 439.13, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP5-Unit25-Writing-an-Academic-Essay": [[0.35, 5.66, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level five."], [5.96, 9.44, "Hi! I'm Visal. Let's learn together!"], [9.74, 17.04, "Unit twenty-five: Writing an Academic Essay. Today you will link ideas across sentences with however, moreover and consequently."], [17.34, 19.74, "Here is our lesson map. Let's start!"], [20.7, 24.05, "Part one: words. You will learn eight new words."], [24.88, 25.82, "Essay."], [26.82, 30.5, "Essay means a piece of writing that develops an argument on one topic."], [31.08, 33.59, "The essay argued for stronger libraries."], [34.18, 36.29, "Your turn. Say: Essay."], [39.13, 39.86, "Essay."], [40.62, 41.58, "Thesis."], [42.58, 45.5, "Thesis means the central claim that an essay defends."], [46.12, 48.69, "The thesis appears at the end of the introduction."], [49.28, 51.85, "Your turn. Say: Thesis."], [54.7, 55.47, "Thesis."], [56.22, 57.17, "Paragraph."], [58.18, 61.41, "Paragraph means a group of sentences about one main idea."], [62.02, 64.58, "Each paragraph begins with a topic sentence."], [65.18, 68.0, "Your turn. Say: Paragraph."], [70.83, 71.85, "Paragraph."], [72.58, 73.47, "Evidence."], [74.48, 78.2, "Evidence means facts, examples or quotations that support a claim."], [78.82, 81.11, "Strong evidence makes the argument credible."], [81.72, 84.5, "Your turn. Say: Evidence."], [87.33, 88.18, "Evidence."], [88.95, 90.21, "Analysis."], [91.22, 95.06, "Analysis means explaining what the evidence shows and why it matters."], [95.65, 98.37, "Analysis separates a good essay from a summary."], [98.98, 102.16, "Your turn. Say: Analysis."], [105.0, 106.22, "Analysis."], [106.98, 108.11, "Counterargument."], [109.12, 113.65, "Counterargument means a reason that opposes the thesis and is answered in the essay."], [114.25, 117.02, "The counterargument is answered in the fourth paragraph."], [117.62, 120.15, "Your turn. Say: Counterargument."], [123.0, 124.23, "Counterargument."], [124.98, 126.0, "Conclusion."], [126.98, 130.28, "Conclusion means the final section that sums up the argument."], [130.88, 133.7, "The conclusion restates the thesis in new words."], [134.28, 136.97, "Your turn. Say: Conclusion."], [139.83, 140.95, "Conclusion."], [141.72, 142.9, "Citation."], [143.92, 148.1, "Citation means a reference that credits the source of an idea or quotation."], [148.68, 151.15, "Every quotation needs a citation."], [151.75, 154.55, "Your turn. Say: Citation."], [157.4, 158.45, "Citation."], [159.23, 162.64, "Part two: dialogue. Let's listen to a conversation."], [163.48, 169.16, "Visal, an essay says 'The data are limited. However, the trend is clear.' What does 'However' do?"], [170.25, 183.37, "It is a discourse marker. It shows how two ideas relate. However contrasts, moreover adds, consequently shows result, similarly compares. Markers guide the reader through the argument."], [184.48, 185.91, "How do we punctuate them?"], [187.02, 203.35, "Start a new sentence with a capital letter and put a comma after the marker: However, the trend is clear. Within a sentence, use a semicolon before it: The data are limited; however, the trend is clear."], [204.45, 205.87, "Can I use too many?"], [206.98, 223.38, "Yes. Do not begin every sentence with a marker. Use them where the logic needs signposting. Choose the right one: moreover adds a similar point; consequently gives a result, not a contrast."], [224.53, 226.0, "Part three: grammar."], [226.85, 231.53, "Grammar focus: Linking: However, and Moreover, and Consequently,."], [231.83, 233.13, "Look at the pattern."], [233.85, 237.08, "The data are limited. However, the trend is clear."], [237.98, 241.38, "The method is reliable. Moreover, it is inexpensive."], [242.28, 246.28, "Funding was cut. Consequently, the project ended early."], [247.23, 256.1, "However contrasts, moreover adds, consequently shows result. Put a comma after the marker at the start of a sentence; use a semicolon before it inside a sentence."], [256.85, 260.86, "Be careful! Don't say: Data is small, however it is clear."], [262.8, 265.98, "Say: Data is small; however, it is clear."], [266.28, 269.05, "Use a semicolon before and a comma after however."], [269.83, 272.44, "Part four: reading. Read and listen."], [273.23, 274.59, "Building an Argument."], [274.89, 278.47, "A strong essay begins with a thesis that makes one clear claim."], [279.47, 286.35, "Each paragraph develops one idea with evidence and analysis; moreover, each citation shows where the support comes from."], [287.37, 292.62, "A good writer includes a counterargument. However, the essay must answer it fairly."], [293.63, 300.11, "Consequently, the argument becomes more convincing, because the reader sees that the writer has considered other views."], [301.1, 304.86, "The conclusion restates the thesis and shows why the argument matters."], [305.97, 309.67, "Part five: quiz. Five questions. Are you ready?"], [310.52, 313.44, "The idea is simple; blank, it is powerful."], [313.75, 317.49, "A, however. B, because. C, although."], [321.03, 323.1, "The answer is A: however."], [324.25, 327.0, "The central claim that an essay defends is the blank."], [327.3, 331.04, "A, citation. B, thesis. C, paragraph."], [334.6, 336.45, "The answer is B: thesis."], [337.58, 339.9, "Which sentence is punctuated correctly?"], [340.2, 346.79, "A, Moreover the result is clear.. B, Moreover, the result is clear.. C, Moreover; the result is clear.."], [350.33, 353.3, "The answer is B: Moreover, the result is clear.."], [354.45, 357.6, "A reference that credits the source of an idea is a blank."], [357.9, 362.05, "A, citation. B, conclusion. C, counterargument."], [365.6, 367.59, "The answer is A: citation."], [368.75, 372.13, "According to the reading, what must an essay do with a counterargument?"], [372.43, 376.44, "A, answer it fairly. B, ignore it. C, hide it."], [380.0, 382.34, "The answer is A: answer it fairly."], [383.53, 386.48, "Part six: speaking. It's your turn to talk."], [387.32, 389.97, "What is the hardest part of writing an essay for you?"], [398.75, 400.3, "Now listen to Visal."], [400.6, 420.31, "For me, the hardest part is organising my ideas before I start. I often have many thoughts, but I need a clear thesis and a logical order. Moreover, choosing the right evidence takes time. When I make a plan first, my paragraphs connect better and the essay is much easier to write."], [420.61, 422.34, "Excellent answer, Visal!"], [423.25, 428.75, "Great work! Now you can use eight new words and linking: however, and moreover, and consequently,."], [429.05, 433.14, "Today's value is lifelong learning. Keep learning for as long as you live."], [433.44, 441.75, "Congratulations! You have finished Online Newspaper Class, level five. See you in Online Newspaper Class, with many more new topics!"], [442.05, 444.92, "Thank you, Ms. Emma! Bye, everyone!"]]};
        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {

                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');

            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;

            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];

            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}

        function answerVideoCheckpoint(idx, chosenIndex) {

        function renderContent() {

        // ===== MY PROGRESS =====
        const ALL_TABS = ['video','learn','terms','quiz','think','funfact','vocabgame','spelling','sentence','summary','headline','factopinion','debate','discussion','dictation','review','pronunciation','exam','challenge'];
        function markActivityComplete(tab) {

        function showMyProgress() {
            const lines = LEVELS_ORDER.map(lvl => {
                let data = null;
                if (lvl === state.level) data = progress;
                else { try { data = JSON.parse(localStorage.getItem(PROGRESS_PREFIX + lvl) || 'null'); } catch (e) {} }
                const done = data && data.completed ? Object.keys(data.completed).filter(k => k.startsWith(lvl + '_')).length : 0;
                const total = Object.keys(curriculum[lvl]).length * ALL_TABS.length;
                return `${gradeName(lvl)}: ${done} / ${total} activities (${Math.round(done / total * 100)}%)${lvl === state.level ? ' ← current' : ''}`;
            }).join('\n');
            const unitDone = ALL_TABS.filter(t => progress.completed && progress.completed[state.level + '_' + state.unit + '_' + t]).length;
            alert(`📊 My Progress\n\n⭐ Stars: ${state.stars}\n🏆 Badges: ${state.badges}\n\nThis unit (Unit ${state.unit}): ${unitDone} / ${ALL_TABS.length} modules done\n\n${lines}\n\n(Saved on this device/browser only. Inside the Hub, progress lasts until the page is closed.)`);
        }

        // ===== 1. LEARN =====
        function renderLearn(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">📖 Learn: ${unitData.title}</h2>

        // ===== 2. KEY TERMS (flip-cards) =====
        let termsHeard = new Set();

            termsHeard = new Set(unitData.terms.map((_, i) => i).filter(i => wasAwarded(unitKey('term-' + i))));
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">🗂️ Key Terms: ${unitData.title}</h2>

                            <div class="flip-card" id="tw-${i}" role="button" tabindex="0" onclick="playTerm('${escapeJsStr(w)}', ${i})">

                                    </div>

        function playTerm(word, i) {
            speak(word);
            const card = document.getElementById('tw-' + i);
            card.classList.toggle('flipped');
            if (award(unitKey('term-' + i), 1)) card.querySelector('.flip-card-front').classList.add('ring-4', 'ring-green-400');

        // ===== 3. QUIZ (listen and choose) =====
        // Answers lock after the first tap, and stars are given only for beating your best score
        let quizState = { qIndex: 0, score: 0, order: [], currentAnswer: '', locked: false };
        function renderQuiz(contentDiv, unitData) {
            quizState = { qIndex: 0, score: 0, order: shuffle([...new Set(unitData.terms)]), currentAnswer: '', locked: false };
            showQuizQuestion();
        }
        function showQuizQuestion() {
            const contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            quizState.locked = false;
            if (quizState.qIndex >= quizState.order.length) {
                const total = quizState.order.length;
                const pct = Math.round((quizState.score / total) * 100); try { window.C2REPORT && C2REPORT('Vocabulary Quiz', quizState.score, total, state); } catch (e) {}
                const bestKey = state.level + '|' + unitKey('quiz');
                const best = progress.best[bestKey] || 0;
                const earned = Math.max(0, quizState.score - best) * 2;
                if (quizState.score > best) progress.best[bestKey] = quizState.score;
                markActivityComplete('quiz');
                if (earned > 0) addStars(earned); else saveProgress();
                if (pct === 100) triggerConfetti();
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-slate-900 mb-2">🧩 Quiz Complete!</h2>
                    <div class="bg-purple-50 p-8 rounded-2xl border border-purple-200 text-center">
                        <div class="text-5xl mb-3">${pct === 100 ? '🏆' : pct >= 50 ? '🎉' : '💪'}</div>
                        <p class="font-bold text-purple-900 text-2xl mb-2">${quizState.score} / ${total} Correct</p>
                        <p class="text-gray-600 mb-4">${earned > 0 ? `You earned ${earned} ⭐` : (best >= total ? 'Perfect score already! 🌟' : `Your best is ${Math.max(best, quizState.score)} / ${total} — beat it to earn more ⭐`)}</p>
                        <button onclick="renderQuiz(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="bg-purple-700 hover:bg-purple-800 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer">🔁 Try Again</button>
                    </div>`;
                return;
            }
            const term = quizState.order[quizState.qIndex];
            const distractors = shuffle(allTermsForLevel(state.level).filter(w => w !== term)).slice(0, 3);
            const options = shuffle([term, ...distractors]);
            quizState.currentAnswer = term;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">🧩 Quiz</h2>
                <p class="text-sm text-gray-500 mb-3">Question ${quizState.qIndex + 1} of ${quizState.order.length}</p>
                <div class="bg-purple-50 p-6 rounded-2xl border border-purple-200">
                    <p class="font-bold text-purple-900 mb-2">🔊 Listen and choose the word you heard:</p>
                    <button onclick="speak(quizState.currentAnswer)" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-5 py-2 rounded-full shadow mb-4 cursor-pointer">🔊 Play Word</button>
                    <div class="flex flex-col gap-2" id="quiz-options">
                        ${options.map((o, i) => `<button onclick="answerQuiz('${escapeJsStr(o)}')" class="bg-white p-3 rounded-xl shadow hover:bg-purple-100 text-left font-medium cursor-pointer">${String.fromCharCode(65 + i)}) ${o}</button>`).join('')}
                    </div>
                    <p id="quiz-ans" class="mt-4 font-bold text-lg min-h-[1.5rem]"></p>
                </div>`;
            speak(term);
        }
        function answerQuiz(chosen) {
            if (quizState.locked) return;
            quizState.locked = true;
            document.querySelectorAll('#quiz-options button').forEach(b => b.disabled = true);
            let el = document.getElementById('quiz-ans');
            if (chosen === quizState.currentAnswer) {
                el.innerHTML = "🎉 Correct! Well done!";
                el.className = "mt-4 font-bold text-lg text-green-600";
                quizState.score++;
            } else {
                el.innerHTML = `❌ Not quite - it was "${escapeHtml(quizState.currentAnswer)}"`;
                el.className = "mt-4 font-bold text-lg text-red-500";
            }
            quizState.qIndex++;
            setTimeout(showQuizQuestion, 1100);
        }

        // ===== 4. THINK ABOUT IT =====
        function renderThink(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">💭 Think About It</h2>
                <div class="bg-sky-50 p-6 rounded-2xl border border-sky-200">
                    <p class="font-bold text-sky-900 text-lg mb-3">${unitData.question}</p>
                    <textarea id="think-answer" rows="3" placeholder="Type your answer here..." class="w-full p-3 border border-gray-300 rounded-lg text-sm"></textarea>
                    <button onclick="checkThinkAnswer()" class="mt-3 bg-sky-600 hover:bg-sky-700 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer text-sm">Save My Answer</button>
                    <p id="think-msg" class="text-sm mt-2 font-semibold min-h-[1.25rem]"></p>
                </div>`;
        }
        function checkThinkAnswer() {
            const val = document.getElementById('think-answer').value;
            const msg = document.getElementById('think-msg');
            const need = minWords();
            const n = countWords(val);
            if (n < need) {
                msg.className = "text-sm mt-2 font-semibold text-red-500";
                msg.textContent = n === 0 ? "✏️ Write your answer first!" : `✏️ Write a little more — at least ${need} words (you have ${n}).`;
                return;
            }
            msg.className = "text-sm mt-2 font-semibold text-green-600";
            msg.textContent = "🌟 Great thinking!" + starNote(award(unitKey('think'), 3), 3);
            markActivityComplete('think');
        }

        // ===== 5. DID YOU KNOW =====
        function renderFunFact(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">📌 Did You Know?</h2>
                <div class="bg-amber-50 p-8 rounded-2xl border border-amber-200 text-center">
                    <div class="text-5xl mb-4">💡</div>
                    <p class="text-lg text-amber-900 font-semibold bg-white p-5 rounded-xl shadow-inner">${unitData.funfact}</p>
                    <div class="flex gap-3 flex-wrap justify-center mt-4">
                        <button onclick="readFunFactAloud()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Read Aloud</button>
                        <button onclick="finishFunFact()" class="bg-white border border-amber-300 text-amber-800 font-bold px-5 py-2 rounded-full shadow cursor-pointer">✅ Got it</button>
                    </div>
                    <p id="fact-msg" class="text-sm mt-3 font-semibold text-green-600 min-h-[1.25rem]"></p>
                </div>`;
        }
        function finishFunFact() {
            markActivityComplete('funfact');
            document.getElementById('fact-msg').textContent = '✅ Nice!' + (award(unitKey('funfact'), 1) ? ' (+1 ⭐)' : '');
        }
        function readFunFactAloud() {
            speak(curriculum[state.level][state.unit].funfact, (ok) => { if (ok && document.getElementById('fact-msg')) finishFunFact(); });
        }
        function textCheck(msg, text, need, okText, key, amount) {
            const n = countWords(text);
            if (n < need) {
                msg.className = "text-sm mt-2 font-semibold text-red-500";
                msg.textContent = n === 0 ? "✏️ Write something first!" : `✏️ Write a little more — at least ${need} words (you have ${n}).`;
                return false;
            }
            msg.className = "text-sm mt-2 font-semibold text-green-600";
            msg.textContent = okText + starNote(award(key, amount), amount);
            return true;
        }
        function usedUnitWords(text, unitData) {
            const t = ' ' + String(text).toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
            return unitData.vocab.filter(w => {
                const base = w.toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').trim();
                if (!base) return false;
                // whole word, allowing simple endings: s, es, ed, ing
                const re = new RegExp('[ ]' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[ ]') + '(s|es|ed|d|ing)?[ ]');
                return re.test(t);
            });
        }
        function renderWriting(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">✍️ Write a Health Tip</h2>
                <p class="text-gray-600 mb-4">Write a short health tip or poster message (2-4 sentences) for your friends, using at least 3 of this unit's words.</p>
                <div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-6">
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${unitData.vocab.map(w => `<span class="bg-white px-3 py-1 rounded-full text-sm font-semibold text-slate-800 border border-slate-200">${w}</span>`).join('')}
                    </div>
                    <textarea id="writing-answer" rows="5" placeholder="Write your paragraph here..." class="w-full p-3 border border-gray-300 rounded-lg text-sm"></textarea>
                    <button onclick="checkWritingAnswer()" class="mt-3 bg-slate-600 hover:bg-slate-700 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer text-sm">Check My Writing</button>
                    <p id="writing-msg" class="text-sm mt-2 font-semibold min-h-[1.25rem]"></p>
                </div>`;
        }
        function checkWritingAnswer() {
            const unitData = curriculum[state.level][state.unit];
            const val = document.getElementById('writing-answer').value.trim();
            const msg = document.getElementById('writing-msg');
            if (!val) { msg.className = "text-sm mt-2 font-semibold text-red-500"; msg.textContent = "✏️ Write your paragraph first!"; return; }
            const used = usedUnitWords(val, unitData);
            const need = Math.max(minWords() * 2, 10);
            if (used.length < 3) {
                msg.className = "text-sm mt-2 font-semibold text-amber-600";

            msg.className = "text-sm mt-2 font-semibold text-green-600";

            markActivityComplete('writing');

        // ===== 7. VOCABULARY GAME (picture -> word) =====
        // Wrong choices never share the picture of the right answer, so exactly one choice fits
        let vocabGameState = { qIndex: 0, score: 0, questions: [], locked: false };
        function buildVocabGameQuestions(unitData) {
            return shuffle([...new Set(unitData.vocab)]).map(correct => ({
                correct, options: shuffle([correct, ...pictureDistractors(correct, unitData.vocab, unitData, 3)])
            }));
        }
        function renderVocabGame(contentDiv, unitData) {
            vocabGameState = { qIndex: 0, score: 0, questions: buildVocabGameQuestions(unitData), locked: false };
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">🎮 Vocabulary Game</h2>
                <p class="text-gray-600 mb-4">Look at the picture, then tap the matching word!</p>
                <div id="vocabgame-area"></div>`;
            showVocabGameQuestion();

        function showVocabGameQuestion() {
            const area = document.getElementById('vocabgame-area');
