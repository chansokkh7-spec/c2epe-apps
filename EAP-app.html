    <title>C2-EPE Digital Academy - EAP / Bridge to University</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Key Terms: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-5xl bg-slate-800 text-white rounded-2xl p-6 shadow-lg mb-6 flex justify-between items-center flex-wrap gap-3">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">🏛️ C2-EPE EAP / Bridge to University</h1>
            <p class="text-sm text-slate-300">EAP / Bridge to University - Online Class</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap justify-end">
            <div class="bg-amber-400 text-slate-900 px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                ⭐ <span id="star-count">0</span>
            </div>
            <div class="bg-pink-500 text-white px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                🏆 <span id="badge-count">0</span> Badges

            <button onclick="showMyProgress()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-sm font-bold border border-white/20 cursor-pointer">📊 My Progress</button>
            <div class="bg-slate-700 px-3 py-2 rounded-xl text-sm font-bold border border-red-500">

            </div>
        </div>

    <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-4 gap-6">

        <aside id="module-sidebar" class="bg-white rounded-2xl p-4 shadow-md md:col-span-1 flex flex-col gap-3" style="scroll-margin-top:12px;">
            <div id="level-picker-wrap">
                <h2 class="font-bold text-gray-700 border-b pb-2">Grade</h2>
                <div class="flex flex-col gap-3 mt-3">
                    <button onclick="selectLevel('A1')" id="btn-A1" class="level-btn text-left p-3 rounded-xl bg-slate-700 text-white font-semibold transition shadow cursor-pointer">🌱 A1 Grammar</button>
                    <button onclick="selectLevel('A2')" id="btn-A2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📗 A2 Grammar</button>
                    <button onclick="selectLevel('B1')" id="btn-B1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📘 B1 Grammar</button>
                    <button onclick="selectLevel('B2')" id="btn-B2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📙 B2 Grammar</button>
                    <button onclick="selectLevel('C1')" id="btn-C1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🎓 C1 Grammar</button>
                    <button onclick="selectLevel('C2')" id="btn-C2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">👑 C2 Grammar</button>
                </div>
            </div>
            <div id="locked-level-banner" class="hidden bg-slate-50 border border-red-200 rounded-xl p-3 text-center">
                <p class="text-xs text-red-600 font-semibold">TOPIC</p>
                <p id="locked-level-text" class="text-xl font-bold text-slate-900"></p>
            </div>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700" id="unit-select-label">Select Unit (1 to 25)</h2>
            <select id="unit-select" onchange="updateUnit()" class="p-2 rounded-xl border border-gray-300 bg-gray-50 font-semibold text-slate-900">
                <option value="1">Loading...</option>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700">Learning Modules</h2>
            <button onclick="switchTab('video')" data-tab="video" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📹 0. Video Lesson</button>

        const curriculum = {"A1": {"1": {"title": "Studying in English at University", "terms": ["Lecture", "Seminar", "Assignment", "Deadline", "Tutor", "Module", "Independent", "Academic"], "passage": "Dara starts university in September. He attends two lectures and one seminar each day. His tutor gives him a long reading list. Dara must manage his own time carefully. He writes every deadline in his planner.", "question": "What is different about university study?", "funfact": "Did you know? Use the present simple for routines and general facts. Add s to the verb after he, she, it and singular nouns."}, "2": {"title": "Academic Vocabulary", "terms": ["Analyse", "Evidence", "Significant", "Approach", "Factor", "Issue", "Indicate", "Consequence"], "passage": "Sreyna keeps a notebook of academic words. For each word she writes the noun, verb and adjective. She also notes common partners such as strong evidence. Every weekend she uses five words in a short paragraph. After a month her reading is much faster.", "question": "How do you learn academic words?", "funfact": "Did you know? Learn word families: analyse is a verb, analysis is a noun and analytical is an adjective. Learn common word partners too."}, "3": {"title": "Skimming and Scanning", "terms": ["Skim", "Scan", "Heading", "Keyword", "Overview", "Locate", "Predict", "Purpose"], "passage": "Vuthy has twenty minutes to read a long article. He skims the title and headings first. Then he underlines the keywords in each question. He scans the text for each keyword or its synonym. He finishes with five minutes to check his answers.", "question": "How do you read a long text quickly?", "funfact": "Did you know? Use the base verb for instructions, such as Skim the text or Underline the keyword. Add do not for a warning."}, "4": {"title": "Main Ideas and Supporting Details", "terms": ["Main idea", "Detail", "Topic sentence", "Example", "Support", "Claim", "Conclude", "Imply"], "passage": "Bopha reads a paragraph about healthy habits. The first sentence says that exercise improves health. The next sentences give examples such as a stronger heart. She sees that these details support the main idea. She writes the main idea in her own words.", "question": "How do you find the main idea?", "funfact": "Did you know? Use for example and for instance to give an example. Use in addition and moreover to add another point."}, "5": {"title": "Note-Taking from Lectures", "terms": ["Abbreviation", "Symbol", "Outline", "Signpost", "Highlight", "Review", "Summarise", "Gap"], "passage": "Chantha listens to a lecture on climate change. She writes only key words and uses arrows and abbreviations. She listens for signposts such as firstly and in conclusion. That evening she fills the gaps in her notes. Then she writes a short summary in three sentences.", "question": "How do you take notes in a lecture?", "funfact": "Did you know? Use common abbreviations such as e.g., i.e., etc. and approx. Make sure you can read your own short forms later."}, "6": {"title": "Understanding Lectures", "terms": ["Introduce", "Digression", "Emphasise", "Recap", "Transition", "Illustrate", "Clarify", "Reference"], "passage": "Professor Sok introduces the topic of urban growth. She says that she will cover three main points. After the first point she moves on with a clear transition. She emphasises that planning is the key factor. At the end she gives a short recap.", "question": "How do you follow a lecture?", "funfact": "Did you know? Lecturers use signposts to show structure: let me begin with, moving on to, to illustrate this and to sum up."}, "7": {"title": "Paragraph Writing", "terms": ["Paragraph", "Unity", "Coherence", "Concluding", "Relevant", "Elaborate", "Sequence", "Cohesive"], "passage": "Rina writes a paragraph about reading. Her topic sentence says that reading improves vocabulary. She adds an example about meeting new words in context. She links her ideas with first and as a result. Her last sentence advises students to read every day.", "question": "What makes a good paragraph?", "funfact": "Did you know? Start with a topic sentence, support it with examples and finish with a concluding sentence that repeats the idea in new words."}, "8": {"title": "Essay Structure", "terms": ["Essay", "Introduction", "Thesis", "Body", "Conclusion", "Outline", "Background", "Revise"], "passage": "Visal receives an essay question about online study. He analyses the question and writes an outline. His introduction gives background and a clear thesis. Each body paragraph develops one reason. His conclusion restates the thesis in new words.", "question": "How do you structure an essay?", "funfact": "Did you know? A thesis statement makes a clear argument. Use because to give a reason and although to show a contrast."}, "9": {"title": "Describing Graphs and Data", "terms": ["Trend", "Increase", "Decrease", "Fluctuate", "Proportion", "Peak", "Steady", "Approximately"], "passage": "The chart shows monthly sales in a small shop. Sales rose sharply in March and reached a peak. They fell slightly in April and then stayed steady. Approximately forty percent of buyers were students. Overall, the trend over the year was upward.", "question": "How do you describe a graph?", "funfact": "Did you know? Use a verb for the direction and an adverb for the speed: rose sharply, fell gradually. Use in or from and to for time and numbers."}, "10": {"title": "Paraphrasing and Summarising", "terms": ["Paraphrase", "Summary", "Synonym", "Original", "Structure", "Condense", "Accurate", "Essential"], "passage": "Sokha reads a paragraph about renewable energy. She closes the book and writes the main idea from memory. She uses synonyms and changes the sentence structure. She checks that the meaning is still accurate. Finally she adds the name of the source.", "question": "How do you paraphrase?", "funfact": "Did you know? Change the structure to paraphrase: the active sentence Scientists published the report becomes The report was published by scientists."}, "11": {"title": "Avoiding Plagiarism", "terms": ["Plagiarism", "Citation", "Quotation", "Source", "Author", "Bibliography", "Credit", "Original"], "passage": "Thida writes an essay using three articles. She paraphrases the ideas and names each author. She puts one exact sentence in quotation marks. At the end she adds a bibliography of all sources. She submits her original work with confidence.", "question": "How do you avoid plagiarism?", "funfact": "Did you know? Use reporting verbs such as argues, states, suggests and claims followed by that. You can also use According to plus the author."}, "12": {"title": "Formal Academic Style", "terms": ["Formal", "Objective", "Tone", "Contraction", "Colloquial", "Hedge", "Passive", "Concise"], "passage": "Makara reads her first draft again. It has contractions and informal words such as kids and stuff. She changes them to children and materials. She uses the passive and a hedge such as may. Her tutor says the style is now suitable.", "question": "What makes writing formal?", "funfact": "Did you know? Replace informal words with formal ones: a lot of becomes many or a large number of, get becomes obtain and kids becomes children."}, "13": {"title": "Cause and Effect", "terms": ["Cause", "Effect", "Result in", "Due to", "Therefore", "Contribute", "Lead to", "Consequence"], "passage": "Sambath studies a report on air pollution. Heavy traffic is one major cause of the problem. It leads to health problems such as asthma. As a result, the city introduces cycle lanes. The consequence is cleaner air in the centre.", "question": "How do you explain cause and effect?", "funfact": "Did you know? Use because of, due to and as a result of plus a noun phrase. Use because, so and therefore with a clause."}, "14": {"title": "Compare and Contrast", "terms": ["Compare", "Contrast", "Similar", "Whereas", "Both", "Unlike", "Difference", "Similarly"], "passage": "Rithy compares buses and trains for his essay. Both are public transport and both reduce traffic. Trains are fast, whereas buses are cheaper. Unlike trains, buses can reach small villages. He concludes that each suits a different journey.", "question": "How do you compare two things?", "funfact": "Did you know? Use both and similarly for similarities. Use whereas, while and unlike for differences. Put a comma after however."}, "15": {"title": "Argument and Opinion", "terms": ["Argument", "Counterargument", "Persuade", "Valid", "Bias", "Justify", "Convincing", "Rebut"], "passage": "Piseth must argue for or against homework. He states his position in the thesis. He gives two reasons and supports them with evidence. Then he mentions the opposite view fairly. He rebuts it and writes a firm conclusion.", "question": "How do you argue in an essay?", "funfact": "Did you know? Use phrases such as it can be argued that and the evidence suggests that. Add words such as may, tends to and often to avoid absolute claims."}, "16": {"title": "Giving Presentations", "terms": ["Presentation", "Audience", "Slide", "Eye contact", "Pace", "Rehearse", "Visual", "Handout"], "passage": "Nary gives a five-minute presentation on recycling. She greets the audience and gives a clear outline. Her slides have short headings and one visual each. She speaks slowly and makes eye contact. At the end she summarises and invites questions.", "question": "How do you give a good presentation?", "funfact": "Did you know? Outline a talk with I will, I am going to or I would like to, followed by a base verb: I will begin with the causes."}, "17": {"title": "Seminar Discussion Skills", "terms": ["Contribute", "Interrupt", "Agree", "Disagree", "Clarify", "Turn-taking", "Challenge", "Consensus"], "passage": "The class discusses whether homework is useful. Lina prepares two points before the seminar. She builds on a classmate's idea politely. When she disagrees, she gives a clear reason. The group reaches consensus on a short homework plan.", "question": "How do you join a seminar discussion?", "funfact": "Did you know? Use polite openers such as I see your point, but and I would like to add that. Always give a reason when you disagree."}, "18": {"title": "Research Skills and Sources", "terms": ["Source", "Reliable", "Journal", "Database", "Keyword", "Evaluate", "Current", "Bias"], "passage": "Sovann researches the topic of online learning. She searches a database with specific keywords. She checks the author, the date and the evidence. She rejects a website that seems biased. She keeps a list of her reliable sources.", "question": "How do you choose reliable sources?", "funfact": "Did you know? Use who, why, when and what to question a source: Who wrote it? Why was it written? When was it published?"}, "19": {"title": "Writing a Short Report", "terms": ["Report", "Abstract", "Method", "Findings", "Recommendation", "Survey", "Respondent", "Appendix"], "passage": "Ratana writes a report on study habits. She surveyed fifty students about online lessons. Sixty percent of respondents preferred online classes. She presents the findings in a clear table. She recommends more flexible lessons for students.", "question": "What is in a short report?", "funfact": "Did you know? Describe the method and findings in the past simple. Use the present simple for recommendations, such as The school should offer more online lessons."}, "20": {"title": "Exam Strategies and Study Planning", "terms": ["Revision", "Timetable", "Priority", "Mock exam", "Stress", "Break", "Feedback", "Goal"], "passage": "Samnang makes a timetable for the exam month. He studies in short sessions and takes breaks. He takes a mock exam and reads the feedback. He sleeps well and arrives early on exam day. He plans his time and checks his answers at the end.", "question": "How do you prepare for exams?", "funfact": "Did you know? Use should for advice and must for strong rules: You should start early. You must read every question carefully."}}};
        Object.values(curriculum).forEach(g => Object.values(g).forEach(d => { d.vocab = d.terms; d.story = d.passage; }));

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_grammar_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;

        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }

        function completeActivity() {

            const badgeKey = state.level + '|' + unitKey('badge');

            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');

        }

        function nextLesson() {
            const levelData = curriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % unitNumbers.length;

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }
        // The Video button shows 🆕 when this unit's video is new, and "(soon)" when there is none yet
        function updateVideoTabBadge() {
            const btn = document.querySelector('.tab-btn[data-tab="video"]');
            if (!btn) return;
            const v = videoFor(state.level, state.unit);
            btn.textContent = (v && isRecentlyAdded(v.dateAdded) ? '🆕 ' : '') + '📹 0. Video Lesson' + (v ? '' : ' (soon)');
        }

        let ytPlayer = null;
        let ytPollInterval = null;
        let ytAnsweredCheckpoints = new Set();
        let ytApiLoadPromise = null;
        let ytFallbackTimer = null;
        let ytCurrentConfig = null;

        // Stops the video and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

        function renderVideoLesson(contentDiv) {
            stopVideo();
            ytAnsweredCheckpoints = new Set();
            const unitData = curriculum[state.level][state.unit];
            ytCurrentConfig = videoFor(state.level, state.unit);

            if (!ytCurrentConfig) {
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                    <div class="bg-indigo-50 border-2 border-dashed border-indigo-200 rounded-2xl p-10 text-center">
                        <div class="text-5xl mb-4">🎬</div>
                        <p class="text-xl font-bold text-indigo-900 mb-2">Video Coming Soon!</p>
                        <p class="text-gray-600 mb-4">Your teacher is preparing this unit's video. For now, try the other learning modules!</p>
                        <button onclick="switchTab('listening')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Start with Listening</button>
                    </div>`;
                return;
            }

            if (ytCurrentConfig.mp4) { renderMp4Lesson(contentDiv, unitData); return; }
            const watchUrl = 'https://www.youtube.com/watch?v=' + ytCurrentConfig.id;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch the video, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">

                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">Loading video player…</p>
                <p class="text-center mt-1"><a href="${watchUrl}" target="_blank" rel="noopener" class="text-sm text-indigo-600 underline">If the video does not play here, tap to open it in YouTube ↗</a></p>`;

            const showFallback = (why) => {
                const msg = document.getElementById('video-msg');
                if (msg) msg.innerHTML = `⚠️ ${why} <a href="${watchUrl}" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">Open the video in YouTube ↗</a>`;
            };
            ytFallbackTimer = setTimeout(() => { if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') showFallback('The video is taking long to load.'); }, 10000);

            const wanted = ytCurrentConfig.id;
            loadYouTubeApi().then(() => {
                if (!ytCurrentConfig || ytCurrentConfig.id !== wanted || !document.getElementById('yt-player-el')) return;
                ytPlayer = new YT.Player('yt-player-el', {
                    videoId: wanted,
                    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
                    events: {

                        onStateChange: onYtStateChange,
                        onError: () => showFallback('This video cannot play inside the lesson.')
                    }
                });
            }).catch(() => showFallback('The video player could not load.'));
        }

imming means reading for the main idea."], [208.26, 209.97, "Use -ing after means."], [210.77, 213.4, "Part four: reading. Read and listen."], [214.2, 215.49, "A Reading Test."], [215.79, 218.45, "Vuthy has twenty minutes to read a long article."], [219.47, 221.75, "He skims the title and headings first."], [222.73, 225.38, "Then he underlines the keywords in each question."], [226.37, 229.35, "He scans the text for each keyword or its synonym."], [230.37, 233.27, "He finishes with five minutes to check his answers."], [234.37, 238.19, "Part five: quiz. Five questions. Are you ready?"], [239.05, 241.66, "To skim is to read for the blank idea."], [241.97, 245.49, "A, main. B, smallest. C, last."], [249.03, 250.56, "The answer is A: main."], [251.72, 253.73, "To scan is to look for one blank."], [254.03, 257.46, "A, song. B, detail. C, joke."], [261.0, 263.12, "The answer is B: detail."], [264.25, 265.99, "You skim the headings blank."], [266.29, 269.7, "A, never. B, last. C, first."], [273.27, 275.13, "The answer is C: first."], [276.28, 278.1, "A keyword is an blank word."], [278.4, 282.17, "A, important. B, empty. C, silent."], [285.7, 288.06, "The answer is A: important."], [289.22, 291.34, "How much time did Vuthy have left?"], [291.64, 295.89, "A, an hour. B, five minutes. C, none."], [299.43, 302.13, "The answer is B: five minutes."], [303.33, 306.36, "Part six: speaking. It's your turn to talk."], [307.22, 309.3, "How do you read a long text quickly?"], [318.08, 319.58, "Now listen to Visal."], [319.88, 330.86, "First I skim the title and headings to get the main idea. Then I underline the keywords in the questions and scan the text for them. I read closely only around the answer."], [331.16, 332.73, "Excellent answer, Visal!"], [333.62, 338.53, "Great work! Now you can use eight new words and imperatives for study instructions."], [338.83, 343.01, "Today's value is time management. Plan your day and use your time well."], [343.31, 345.85, "See you in Unit four. Goodbye!"], [346.15, 349.29, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XEA-Unit04-Main-Ideas-and-Supporting-Details": [[0.35, 5.94, "Hello, everyone! I'm Ms. Emma. Welcome to Online English for Academic Purposes."], [6.24, 9.66, "Hi! I'm Visal. Let's learn together!"], [9.96, 17.2, "Unit four: Main Ideas and Supporting Details. Today you will separate main ideas from examples and evidence."], [17.5, 20.11, "Here is our lesson map. Let's start!"], [21.07, 24.07, "Part one: words. You will learn eight new words."], [24.92, 26.03, "Main idea."], [27.05, 29.66, "Main idea means the key point of a text."], [30.25, 31.65, "State the main idea."], [32.25, 35.33, "Your turn. Say: Main idea."], [38.17, 39.61, "Main idea."], [40.35, 41.39, "Detail."], [42.38, 44.96, "Detail means a small piece of information."], [45.55, 47.27, "Add a supporting detail."], [47.88, 50.41, "Your turn. Say: Detail."], [53.27, 54.31, "Detail."], [55.05, 56.3, "Topic sentence."], [57.28, 61.0, "Topic sentence means a sentence that states the paragraph idea."], [61.62, 63.64, "Begin with a topic sentence."], [64.25, 66.9, "Your turn. Say: Topic sentence."], [69.77, 71.05, "Topic sentence."], [71.78, 72.88, "Example."], [73.88, 76.64, "Example means a case that shows an idea."], [77.25, 78.39, "Give an example."], [78.98, 81.53, "Your turn. Say: Example."], [84.37, 85.38, "Example."], [86.12, 86.9, "Support."], [87.88, 90.42, "Support means to give reasons for an idea."], [91.02, 92.65, "Evidence supports the claim."], [93.25, 96.03, "Your turn. Say: Support."], [98.87, 99.83, "Support."], [100.58, 101.33, "Claim."], [102.32, 104.85, "Claim means a statement that something is true."], [105.45, 106.94, "The writer makes a claim."], [107.55, 109.82, "Your turn. Say: Claim."], [112.67, 113.55, "Claim."], [114.32, 115.31, "Conclude."], [116.32, 118.51, "Conclude means to decide after thinking."], [119.12, 120.78, "We conclude that it works."], [121.38, 123.84, "Your turn. Say: Conclude."], [126.7, 127.69, "Conclude."], [128.45, 129.44, "Imply."], [130.45, 133.32, "Imply means to suggest without saying directly."], [133.92, 135.65, "The text implies a problem."], [136.25, 138.63, "Your turn. Say: Imply."], [141.5, 142.51, "Imply."], [143.3, 146.79, "Part two: dialogue. Let's listen to a conversation."], [147.65, 149.96, "Visal, how do I find the main idea?"], [151.05, 161.15, "Look at the topic sentence, usually the first sentence of the paragraph. It tells you the point. The other sentences give details."], [162.25, 163.53, "What are details?"], [164.62, 173.62, "Details are examples, facts, numbers and reasons. They support the claim. If you remove a detail, the main idea stays the same."], [174.72, 176.8, "What if the idea is not stated?"], [177.88, 187.57, "Then the writer implies it. Read all the details and ask yourself what point they show together. That point is the main idea."], [188.73, 190.21, "Part three: grammar."], [191.05, 195.0, "Grammar focus: Linking words for adding and exemplifying."], [195.3, 196.56, "Look at the pattern."], [197.25, 201.06, "Exercise improves health. For example, it protects the heart."], [201.95, 205.28, "Sleep matters. In addition, it helps memory."], [206.23, 212.08, "Use for example and for instance to give an example. Use in addition and moreover to add another point."], [212.82, 217.09, "Be careful! Don't say: For example, is not needed."], [219.03, 222.19, "Say: For example, it protects the heart."], [222.49, 223.96, "Add a full example."], [224.77, 227.43, "Part four: reading. Read and listen."], [228.23, 229.61, "Reading a Paragraph."], [229.91, 232.74, "Bopha reads a paragraph about healthy habits."], [233.73, 236.57, "The first sentence says that exercise improves health."], [237.57, 240.94, "The next sentences give examples such as a stronger heart."], [241.93, 244.54, "She sees that these details support the main idea."], [245.53, 248.06, "She writes the main idea in her own words."], [249.17, 252.97, "Part f  learn eight new words."], [24.28, 25.45, "Abbreviation."], [26.45, 29.1, "Abbreviation means a shortened form of a word."], [29.68, 31.21, "Use an abbreviation."], [31.82, 34.43, "Your turn. Say: Abbreviation."], [37.3, 38.64, "Abbreviation."], [39.38, 40.11, "Symbol."], [41.12, 43.37, "Symbol means a sign that means something."], [43.98, 45.95, "Use a symbol for because."], [46.55, 48.88, "Your turn. Say: Symbol."], [51.73, 52.58, "Symbol."], [53.35, 54.16, "Outline."], [55.15, 57.81, "Outline means a plan with main points."], [58.42, 59.7, "Write an outline."], [60.28, 62.54, "Your turn. Say: Outline."], [65.4, 66.37, "Outline."], [67.12, 68.26, "Signpost."], [69.25, 71.92, "Signpost means a phrase that shows structure."], [72.52, 74.3, "Listen for signposts."], [74.88, 77.85, "Your turn. Say: Signpost."], [80.7, 81.82, "Signpost."], [82.58, 83.54, "Highlight."], [84.55, 86.81, "Highlight means to mark important points."], [87.42, 88.91, "Highlight key terms."], [89.52, 92.04, "Your turn. Say: Highlight."], [94.9, 95.9, "Highlight."], [96.65, 97.47, "Review."], [98.45, 100.16, "Review means to look at again."], [100.75, 102.27, "Review notes tonight."], [102.88, 105.28, "Your turn. Say: Review."], [108.13, 109.06, "Review."], [109.82, 110.84, "Summarise."], [111.85, 114.29, "Summarise means to give the main points shortly."], [114.88, 116.33, "Summarise the lecture."], [116.92, 119.63, "Your turn. Say: Summarise."], [122.47, 123.67, "Summarise."], [124.42, 125.1, "Gap."], [126.12, 127.79, "Gap means a missing part."], [128.38, 129.8, "Fill the gaps later."], [130.42, 132.87, "Your turn. Say: Gap."], [135.73, 136.49, "Gap."], [137.3, 140.81, "Part two: dialogue. Let's listen to a conversation."], [141.65, 144.67, "Visal, I cannot write everything the lecturer says."], [145.78, 155.82, "You should not. Write only key words and numbers. Use abbreviations and symbols, such as w for with and an arrow for leads to."], [156.92, 158.59, "How do I follow the structure?"], [159.68, 170.5, "Listen for signposts such as firstly, another point is and in conclusion. Put each main point on a new line and indent the details under it."], [171.58, 173.22, "What do I do afterwards?"], [174.32, 182.36, "Review your notes the same day, fill the gaps and write a three-sentence summary. This helps you remember the lecture."], [183.5, 184.98, "Part three: grammar."], [185.82, 189.44, "Grammar focus: Reduced forms and abbreviations."], [189.74, 191.02, "Look at the pattern."], [191.72, 194.44, "for example e.g. shows an example."], [195.35, 197.51, "approximately approx. means about."], [198.47, 205.43, "Use common abbreviations such as e.g., i.e., etc. and approx. Make sure you can read your own short forms later."], [206.18, 209.66, "Be careful! Don't say: I write all what he says."], [211.6, 213.96, "Say: I write only key words."], [214.26, 215.71, "Choose key words only."], [216.5, 219.29, "Part four: reading. Read and listen."], [220.1, 221.33, "After the Lecture."], [221.63, 224.34, "Chantha listens to a lecture on climate change."], [225.33, 228.83, "She writes only key words and uses arrows and abbreviations."], [229.83, 233.25, "She listens for signposts such as firstly and in conclusion."], [234.23, 236.75, "That evening she fills the gaps in her notes."], [237.77, 240.95, "Then she writes a short summary in three sentences."], [242.07, 245.99, "Part five: quiz. Five questions. Are you ready?"], [246.85, 249.0, "Good notes contain mostly key blank."], [249.3, 252.88, "A, stories. B, songs. C, words."], [256.43, 258.71, "The answer is C: words."], [259.85, 261.22, "Firstly is a blank."], [261.52, 265.25, "A, signpost. B, gap. C, symbol."], [268.8, 271.24, "The answer is A: signpost."], [272.38, 274.27, "e.g. means for blank."], [274.57, 278.09, "A, energy. B, example. C, evening."], [281.63, 283.97, "The answer is B: example."], [285.12, 287.24, "You should review notes the blank day."], [287.54, 290.73, "A, next year. B, last. C, same."], e three main factors."], [199.8, 206.41, "Lecturers use signposts to show structure: let me begin with, moving on to, to illustrate this and to sum up."], [207.15, 211.31, "Be careful! Don't say: The lecturer emphasise the point."], [213.27, 216.0, "Say: The lecturer emphasises the point."], [216.3, 218.09, "Add es after she or he."], [218.9, 221.48, "Part four: reading. Read and listen."], [222.27, 223.72, "A Clear Lecture."], [224.02, 227.13, "Professor Sok introduces the topic of urban growth."], [228.13, 230.74, "She says that she will cover three main points."], [231.73, 234.91, "After the first point she moves on with a clear transition."], [235.9, 238.74, "She emphasises that planning is the key factor."], [239.73, 241.71, "At the end she gives a short recap."], [242.8, 247.31, "Part five: quiz. Five questions. Are you ready?"], [248.15, 250.75, "An introduction says what the talk will blank."], [251.05, 254.18, "A, cover. B, hide. C, delete."], [257.73, 259.64, "The answer is A: cover."], [260.78, 262.4, "Moving on to is a blank."], [262.7, 266.32, "A, gap. B, transition. C, title."], [269.87, 272.11, "The answer is B: transition."], [273.25, 275.09, "A recap is a short blank."], [275.39, 278.51, "A, joke. B, map. C, repeat."], [282.07, 284.15, "The answer is C: repeat."], [285.28, 287.31, "To clarify means to make blank."], [287.61, 290.59, "A, clear. B, loud. C, late."], [294.13, 295.63, "The answer is A: clear."], [296.78, 299.01, "What does Professor Sok emphasise?"], [299.31, 302.68, "A, sport. B, planning. C, weather."], [306.23, 308.18, "The answer is B: planning."], [309.37, 312.61, "Part six: speaking. It's your turn to talk."], [313.45, 315.04, "How do you follow a lecture?"], [323.85, 325.28, "Now listen to Visal."], [325.58, 337.66, "I listen for the introduction and the transitions. I notice phrases that emphasise the key points. If I do not understand, I mark my notes and ask a question afterwards."], [337.96, 339.81, "Excellent answer, Visal!" roduction gives background and a thesis statement. The body has paragraphs that each develop one point. The conclusion restates the thesis."], [157.42, 158.97, "What is a thesis statement?"], [160.08, 169.78, "It is one or two sentences that state your main argument, for example Online learning is effective because it is flexible and affordable."], [170.88, 172.49, "What should I do before writing?"], [173.58, 184.69, "Analyse the question, brainstorm ideas and write an outline. After writing, revise your essay and check grammar, spelling and linkers."], [185.83, 187.62, "Part three: grammar."], [188.48, 192.36, "Grammar focus: Thesis statements with because and although."], [192.66, 193.82, "Look at the pattern."], [194.52, 197.42, "Online study is effective because it is flexible."], [198.32, 201.33, "Although it has risks, technology improves learning."], [202.27, 208.2, "A thesis statement makes a clear argument. Use because to give a reason and although to show a contrast."], [208.95, 212.26, "Be careful! Don't say: The thesis are in the end."], [214.2, 216.84, "Say: The thesis is in the introduction."], [217.14, 218.71, "Thesis is singular."], [219.5, 222.2, "Part four: reading. Read and listen."], [223.0, 224.08, "Planning an Essay."], [224.38, 227.18, "Visal receives an essay question about online study."], [228.17, 231.29, "He analyses the question and writes an outline."], [232.3, 235.44, "His introduction gives background and a clear thesis."], [236.43, 238.95, "Each body paragraph develops one reason."], [239.97, 242.94, "His conclusion restates the thesis in new words."], [244.03, 248.13, "Part five: quiz. Five questions. Are you ready?"], [248.98, 250.76, "The thesis is the main blank."], [251.06, 254.51, "A, title. B, page. C, argument."], [258.07, 260.33, "The answer is C: argument."], [261.48, 263.23, "The body has several blank."], [263.53, 268.45, "A, paragraphs. B, covers. C, maps."], [272.0, 274.06, "The answer is A: paragraphs."], [275.22, 277. rammar focus: Verbs and adverbs of change."], [191.07, 192.31, "Look at the pattern."], [193.02, 195.17, "Sales rose sharply in March."], [196.08, 198.09, "The price fell slightly after that."], [199.03, 207.18, "Use a verb for the direction and an adverb for the speed: rose sharply, fell gradually. Use in or from and to for time and numbers."], [207.92, 211.27, "Be careful! Don't say: Sales rose sharp in March."], [213.2, 215.92, "Say: Sales rose sharply in March."], [216.22, 218.16, "Use an adverb after rose."], [218.97, 221.35, "Part four: reading. Read and listen."], [222.17, 223.45, "A Sales Chart."], [223.75, 226.2, "The chart shows monthly sales in a small shop."], [227.2, 230.05, "Sales rose sharply in March and reached a peak."], [231.03, 234.19, "They fell slightly in April and then stayed steady."], [235.2, 238.34, "Approximately forty percent of buyers were students."], [239.33, 241.85, "Overall, the trend over the year was upward."], [242.97, 246.9, "Part five: quiz. Five questions. Are you ready?"], [247.75, 249.47, "Increase means to go blank."], [249.77, 252.75, "A, up. B, down. C, away."], [256.3, 257.75, "The answer is A: up."], [258.92, 260.7, "Fluctuate means up and blank."], [261.0, 264.03, "A, over. B, down. C, left."], [267.6, 269.22, "The answer is B: down."], [270.35, 272.2, "A peak is the blank point."], [272.5, 275.84, "A, lowest. B, middle. C, highest."], [279.4, 281.47, "The answer is C: highest."], [282.62, 284.34, "Approximately means blank."], [284.64, 288.2, "A, about. B, never. C, exactly."], [291.73, 293.43, "The answer is A: about."], [294.58, 296.35, "What was the overall trend?"], [296.65, 300.25, "A, unknown. B, upward. C, downward."], [303.8, 305.56, "The answer is B: upward."], [306.77, 310.15, "Part six: speaking. It's your turn to talk."], [311.02, 312.63, "How do you describe a graph?"], [321.42, 322.82, "Now listen to Visal."], [323.12, 336.1, "I start with a general statement about the graph. Then I describe the main trends with verbs such as rose and fell and adverbs such as sharply. I give key figures and compare the highest and lowest points."], [336.4, 338.16, "Excellent answer, Visal!"], [339.05, 343.75, "Great work! Now you can use eight new words and verbs and adverbs of change."], [344.05, 348.01, "Today's value is precision. Choose your words and numbers with care."], [348.31, 350.67, "See you in Unit ten. Goodbye!"], [350.97, 353.59, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XEA-Unit10-Paraphrasing-and-Summarising": [[0.35, 5.9, "Hello, everyone! I'm Ms. Emma. Welcome to Online English for Academic Purposes."], [6.2, 9.55, "Hi! I'm Visal. Let's learn together!"], [9.85, 16.73, "Unit ten: Paraphrasing and Summarising. Today you will restate ideas in your own words without copying."], [17.03, 19.56, "Here is our lesson map. Let's start!"], [20.5, 23.83, "Part one: words. You will learn eight new words."], [24.68, 25.82, "Paraphrase."], [26.82, 29.49, "Paraphrase means to say again in different words."], [30.08, 31.72, "Paraphrase the sentence."], [32.32, 35.28, "Your turn. Say: Paraphrase."], [38.13, 39.33, "Paraphrase."], [40.08, 41.04, "Summary."], [42.05, 44.68, "Summary means a short version of main points."], [45.28, 46.45, "Write a summary."], [47.05, 49.84, "Your turn. Say: Summary."], [52.7, 53.54, "Summary."], [54.28, 55.13, "Synonym."], [56.15, 58.45, "Synonym means a word with the same meaning."], [59.05, 60.28, "Use a synonym."], [60.88, 63.33, "Your turn. Say: Synonym."], [66.17, 67.05, "Synonym."], [67.82, 68.8, "Original."], [69.78, 71.61, "Original means from the source."], [72.22, 73.7, "Keep the original meaning."], [74.32, 76.96, "Your turn. Say: Original."], [79.8, 80.75, "Original."], [81.52, 82.45, "Structure."], [83.45, 85.65, "Structure means the way a sentence is built."], [86.25, 88.05, "Change the sentence structure."], [88.65, 91.19, "Your turn. Say: Structure."], [94.03, 95.14, "Structure."], [95.88, 96.94, "Condense."], [97.95, 99.82, "Condense means to make shorter."], [100.42, 101.79, "Condense the text."], [102.38, 104.57, "Your turn. Say: Condense."], [107.43, 108.52, "Condense."], [109.25, 110.13, "Accurate."], [111.15, 113.64, "Accurate means correct in every detail."], [114.25, 115.51, "Keep it accurate."], [116.12, 118.26, "Your turn. Say: Accurate."], [121.1, 122.17, "Accurate."], [122.92, 123.94, "Essential."], [124.95, 126.98, "Essential means very important."], [127.58, 130.06, "Include only essential points."], [130.65, 133.78, "Your turn. Say: Essential."], [136.63, 137.59, "Essential."], [138.4, 142.26, "Part two: dialogue. Let's listen to a conversation."], [143.12, 145.84, "Visal, how do I paraphrase a sentence?"], [146.95, 158.02, "Read it, close the book and write the idea from memory in your own words. Change the vocabulary with synonyms and change the sentence structure, but keep the meaning."], [159.12, 160.99, "What is the difference from a summary?"], [162.08, 170.84, "A paraphrase has about the same length as the original. A summary is much shorter and includes only the essential points."], [171.95, 173.28, "What should I avoid?"], [174.38, 183.61, "Avoid copying phrases and changing only one or two words. Do not add your own opinion. Always name the source of the idea."], [184.77, 186.09, "Part three: grammar."], [186.95, 191.13, "Grammar focus: Changing structure: active and passive."], [191.43, 192.71, "Look at the pattern."], [193.42, 195.43, "Scientists published the report."], [196.32, 198.78, "The report was published by scientists."], [199.73, 206.71, "Change the structure to paraphrase: the active sentence Scientists published the report becomes The report was published by scientists."], [207.45, 211.07, "Be careful! Don't say: I copy but change one word."], [213.0, 215.92, "Say: I rewrite the idea in my own words."], [216.22, 217.46, "Do not copy."], [218.27, 220.88, "Part four: reading. Read and listen."], [221.7, 223.12, "In My Own Words."], [223.42, 226.22, "Sokha  Emma. Welcome to Online English for Academic Purposes."], [6.45, 9.72, "Hi! I'm Visal. Let's learn together!"], [10.02, 16.13, "Unit eleven: Avoiding Plagiarism. Today you will use sources honestly and reference them correctly."], [16.43, 19.16, "Here is our lesson map. Let's start!"], [20.1, 23.52, "Part one: words. You will learn eight new words."], [24.38, 25.42, "Plagiarism."], [26.42, 29.08, "Plagiarism means using someone's work as your own."], [29.68, 31.24, "Plagiarism is serious."], [31.85, 34.39, "Your turn. Say: Plagiarism."], [37.23, 38.14, "Plagiarism."], [38.88, 39.97, "Citation."], [40.95, 43.62, "Citation means a note naming a source."], [44.22, 45.48, "Add a citation."], [46.08, 48.97, "Your turn. Say: Citation."], [51.83, 52.87, "Citation."], [53.62, 54.63, "Quotation."], [55.62, 58.39, "Quotation means exact words from a source."], [58.98, 60.74, "Use quotation marks."], [61.35, 64.22, "Your turn. Say: Quotation."], [67.07, 68.08, "Quotation."], [68.82, 69.76, "Source."], [70.75, 73.08, "Source means where information comes from."], [73.68, 75.01, "Name your source."], [75.62, 77.87, "Your turn. Say: Source."], [80.73, 81.89, "Source."], [82.65, 83.44, "Author."], [84.45, 86.59, "Author means the writer of a text."], [87.18, 88.51, "The author is Smith."], [89.12, 91.31, "Your turn. Say: Author."], [94.17, 95.05, "Author."], [95.82, 97.07, "Bibliography."], [98.08, 100.72, "Bibliography means a list of sources."], [101.32, 102.85, "Write a bibliography."], [103.45, 106.08, "Your turn. Say: Bibliography."], [108.93, 110.27, "Bibliography."], [111.02, 111.81, "Credit."], [112.82, 114.66, "Credit means to give recognition."], [115.25, 116.39, "Credit the author."], [116.98, 119.36, "Your turn. Say: Credit."], [122.2, 123.12, "Credit."], [123.88, 124.84, "Original."], [125.85, 128.12, "Original means new and not copied."], [128.72, 130.52, "Submit original work."], [131.12, 133.36, "Your turn. Say: Original."], [136.2, 137.13, "Original."], [137.93, 141.74, "Part two: dialogue. Let's listen to a conversation."], [142.58, 144.66, "Visal, what counts as plagiarism?"], [145.75, 155.4, "Copying text without quotation marks, using someone's idea without naming them and submitting another student's work are all plagiarism."], [156.52, 157.68, "How do I avoid it?"], [158.78, 168.94, "Paraphrase in your own words and cite the source. If you copy exact words, put them in quotation marks and add the author and year."], [170.05, 171.94, "What happens if I plagiarise?"], [173.05, 181.66, "Universities treat it seriously. You can lose marks or even fail the course. Honest work and good references protect you."], [182.8, 184.14, "Part three: grammar."], [184.98, 188.16, "Grammar focus: Reporting verbs with sources."], [188.46, 189.63, "Look at the pattern."], [190.32, 193.87, "Smith (2020) argues that sleep improves memory."], [194.78, 197.86, "According to Lee, students need regular breaks."], [198.8, 206.19, "Use reporting verbs such as argues, states, suggests and claims followed by that. You can also use According to plus the author."], [206.95, 210.76, "Be careful! Don't say: Smith argue that sleep helps."], [212.7, 215.35, "Say: Smith argues that sleep helps."], [215.65, 217.22, "Add s for one author."], [218.03, 221.05, "Part four: reading. Read and listen."], [221.83, 223.26, "An Honest Essay."], [223.56, 226.1, "Thida writes an essay using three articles."], [227.1, 229.83, "She paraphrases the ideas and names each author."], [230.83, 233.77, "She puts one exact sentence in quotation marks."], [234.77, 238.02, "At the end she adds a bibliography of all sources."], [239.03, 241.74, "She submits her original work with confidence."], [242.83, 246.59, "Part five: quiz. Five questions. Are you ready?"], [247.45, 250.26, "Plagiarism means using others' work as blank."], [250.56, 254.03, "A, a gift. B, a map. C, your own."], [257.57, 259.19, "The answer is C: your own."], [260.35, 262.71, "Exact words need quotation blank."], [263.01, 266.43, "A, marks. B, books. C, rooms."], [269.97, 271.79, "The answer is A: marks."], [272.95, 275.13, "A bibliography is a list of blank."], [275.44, 279.04, "A, grades. B, sources. C, friends."], [282.6, 284.74, "The answer is B: sources."], [285.88, 287.56, "To credit means to give blank."], [287.86, 291.72, "A, a test. B, a prize. C, recognition."], [295.27, 297.87, "The answer is C: recognition."], [299.02, 300.7, "Thida submits blank work."], [301.0, 304.23, "A, original. B, copied. C, late."], [307.77, 309.71, "The answer is A: original."], [310.9, 314.18, "Part six: speaking. It's your turn to talk."], [315.02, 316.9, "How do you avoid plagiarism?"], [325.72, 327.46, "Now listen to Visal."], [327.76, 342.6, "I paraphrase ideas in my own words and cite every source. If I use exact words I put them in quotation marks. At the end I write a bibliography of all my sources."], [342.89, 344.6, "Excellent answer, Visal!"], [345.52, 350.1, "Great work! Now you can use eight new words and reporting verbs with sources."], [350.4, 355.15, "Today's value is integrity. Do the right thing, even when no one is watching."], [355.45, 358.14, "See you in Unit twelve. Goodbye!"], [358.44, 361.35, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XEA-Unit12-Formal-Academic-Style": [[0.35, 5.83, "Hello, everyone! I'm Ms. Emma. Welcome to Online English for Academic Purposes."], [6.13, 9.5, "Hi! I'm Visal. Let's learn together!"], [9.8, 16.24, "Unit twelve: Formal Academic Style. Today you will write in a formal, objective academic tone."], [16.54, 19.17, "Here is our lesson map. Let's start!"], [20.13, 23.42, "Part one: words. You will learn eight new words."], [24.28, 25.07, "Formal."], [26.08, 28.72, "Formal means serious and correct in style."], [29.32, 30.86, "Use formal language."], [31.45, 34.29, "Your turn. Say: Formal."], [37.13, 37.99, "Formal."], [38.75, 39.7, "Objective."], [40.72, 43.8, "Objective means based on facts, not feelings."], [44.38, 45.72, "Stay objective."], [46.32, 49.24, "Your turn. Say: Objective."], [52.1, 53.22, "Objective."], [53.98, 54.68, "Tone."], [55.68, 57.61, "Tone means the attitude in writing."], [58.22, 59.66, "Keep a neutral tone."], [60.25, 62.72, "Your turn. Say: Tone."], [65.57, 66.34, "Tone."], [67.08, 68.19, "Contraction."], [69.18, 71.53, "Contraction means a short form like don't."], [72.12, 73.79, "Avoid contractions."], [74.38, 77.11, "Your turn. Say: Contraction."], [79.97, 81.01, "Contraction."], [81.75, 82.84, "Colloquial."], [83.85, 86.38, "Colloquial means used in casual speech."], [86.98, 88.84, "Avoid colloquial words."], [89.45, 92.06, "Your turn. Say: Colloquial."], [94.9, 96.06, "Colloquial."], [96.82, 97.53, "Hedge."], [98.52, 100.72, "Hedge means to make a claim less strong."], [101.32, 102.61, "Hedge your claim."], [103.22, 105.75, "Your turn. Say: Hedge."], [108.6, 109.46, "Hedge."], [110.22, 111.21, "Passive."], [112.22, 114.52, "Passive means focusing on the action."], [115.12, 116.85, "The passive sounds formal."], [117.45, 120.0, "Your turn. Say: Passive."], [122.83, 123.66, "Passive."], [124.42, 125.56, "Concise."], [126.55, 128.51, "Concise means short and clear."], [129.12, 130.36, "Be concise."], [130.95, 133.42, "Your turn. Say: Concise."], [136.27, 137.41, "Concise."], [138.2, 142.19, "Part two: dialogue. Let's listen to a conversation."], [143.05, 145.05, "Visal, what makes writing formal?"], [146.15, 157.08, "Avoid contractions, slang and personal phrases such as I think. Use precise vocabulary and full forms, such as do not instead of don't."], [158.18, 159.72, "Why is the passive used?"], [160.82, 171.44, "The passive focuses on the action, not the person, so it sounds objective. For example, the experiment was repeated three times."], [172.55, 173.56, "What is hedging?"], [174.65, 184.15, "Hedging makes a claim careful, using words such as may, might, seems and tends to. It shows that you are not claiming absolute truth."], [185.3, 186.89, "Part three: grammar."], [187.75, 190.61, "Grammar focus: Formal alternatives."], [190.91, 192.05, "Look at the pattern."], [192.75, 194.92, "a lot of becomes a large number of."], [195.82, 197.77, "get becomes obtain or receive."], [198.73, 205.83, "Replace informal words with formal ones: a lot of becomes many or a large number of, get becomes obtain and kids becomes children."], [206.58, 210.29, "Be careful! Don't say: Kids is very important."], [212.23, 214.62, "Say: Children are very important."], [214.92, 216.59, "Use a plural verb."], [217.4, 220.15, "Part four: reading. Read and listen."], [220.93, 222.09, "Making It Formal."], [222.38, 224.84, "Makara reads her first draft again."], [225.83, 229.39, "It has contractions and informal words such as kids and stuff."], [230.4, 232.99, "She changes them to children and materials."], [234.0, 236.84, "She uses the passive and a hedge such as may."], [237.83, 240.3, "Her tutor says the style is now suitable."], [241.4, 245.69, "Part five: quiz. Five questions. Are you ready?"], [246.55, 248.33, "Formal writing avoids blank."], [248.63, 252.9, "A, contractions. B, nouns. C, full stops."], [256.43, 259.12, "The answer is A: contractions."], [260.28, 262.39, "Objective means based on blank."], [262.69, 266.04, "A, luck. B, facts. C, moods."], [269.6, 271.56, "The answer is B: facts."], [272.72, 274.1, "May is a blank word."], [274.4, 277.38, "A, rude. B, funny. C, hedging."], [280.93, 282.76, "The answer is C: hedging."], [283.92, 285.78, "Concise means short and blank."], [286.08, 289.88, "A, clear. B, wrong. C, loud."], [293.43, 295.47, "The answer is A: clear."], [296.62, 298.66, "What does Makara change kids to?"], [298.96, 302.34, "A, friends. B, children. C, kiddos."], [305.9, 308.19, "The answer is B: children."], [309.4, 312.9, "Part six: speaking. It's your turn to talk."], [313.75, 315.25, "What makes writing formal?"], [324.05, 325.48, "Now listen to Visal."], [325.78, 340.0, "Formal writing avoids contractions, slang and personal phrases. It uses precise vocabulary, the passive voice and careful words such as may or tends to. It stays objective and concise."], [340.3, 341.96, "Excellent answer, Visal!"], [342.85, 347.13, "Great work! Now you can use eight new words and formal alternatives."], [347.43, 352.81, "Today's value is professionalism. Be prepared, polite and reliable in everything you do."], [353.11, 355.94, "See you in Unit thirteen. Goodbye!"], [356.24, 358.94, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XEA-Unit13-Cause-and-Effect": [[0.35, 5.8, "Hello, everyone! I'm Ms. Emma. Welcome to Online English for Academic Purposes."], [6.1, 9.4, "Hi! I'm Visal. Let's learn together!"], [9.7, 15.32, "Unit thirteen: Cause and Effect. Today you will explain causes and results with clear language."], [15.62, 18.21, "Here is our lesson map. Let's start!"], [19.17, 22.49, "Part one: words. You will learn eight new words."], [23.35, 24.21, "Cause."], [25.22, 27.55, "Cause means the reason something happens."], [28.15, 29.78, "Pollution is a cause."], [30.38, 33.01, "Your turn. Say: Cause."], [35.87, 36.94, "Cause."], [37.68, 38.64, "Effect."], [39.65, 41.36, "Effect means a result."], [41.95, 43.62, "The effect was serious."], [44.22, 46.88, "Your turn. Say: Effect."], [49.73, 50.69, "Effect."], [51.45, 52.46, "Result in."], [53.45, 55.4, "Result in means to lead to."], [56.02, 57.98, "Smoking results in illness."], [58.58, 61.87, "Your turn. Say: Result in."], [64.73, 65.97, "Result in."], [66.72, 67.51, "Due to."], [68.52, 69.99, "Due to means because of."], [70.58, 72.2, "Due to rain, we stayed."], [72.78, 74.98, "Your turn. Say: Due to."], [77.83, 78.67, "Due to."], [79.42, 80.33, "Therefore."], [81.32, 83.23, "Therefore means as a result."], [83.85, 85.69, "Therefore, prices rose."], [86.28, 88.59, "Your turn. Say: Therefore."], [91.43, 92.39, "Therefore."], [93.15, 94.14, "Contribute."], [95.15, 97.14, "Contribute means to help cause."], [97.75, 99.55, "Cars contribute to smog fic is one major cause of the problem."], [229.27, 231.73, "It leads to health problems such as asthma."], [232.73, 235.73, "As a result, the city introduces cycle lanes."], [236.73, 239.29, "The consequence is cleaner air in the centre."], [240.4, 244.13, "Part five: quiz. Five questions. Are you ready?"], [244.98, 246.34, "A cause is a blank."], [246.64, 250.24, "A, title. B, reason. C, picture."], [253.8, 255.5, "The answer is B: reason."], [256.65, 258.42, "Therefore means as a blank."], [258.72, 261.82, "A, rule. B, rest. C, result."], [265.37, 267.26, "The answer is C: result."], [268.42, 269.93, "Leads to means blank."], [270.23, 274.09, "A, causes. B, avoids. C, ends."], [277.63, 279.6, "The answer is A: causes."], [280.75, 282.75, "Due to is followed by a blank."], [283.05, 286.68, "A, number only. B, noun phrase. C, question."], [290.23, 292.42, "The answer is B: noun phrase."], [293.58, 295.45, "What did the city introduce?"], [295.75, 299.99, "A, a tax. B, a stadium. C, cycle lanes."], [303.53, 305.61, "The answer is C: cycle lanes."], [306.8, 310.0, "Part six: speaking. It's your turn to talk."], [310.85, 313.01, "How do you explain cause and effect?"], [321.82, 323.36, "Now listen to Visal."], [323.66, 334.63, "I use phrases such as because of, leads to and results in. I also use linking words such as therefore and as a result. I remember that a problem often has several causes."], [334.93, 336.69, "Excellent answer, Visal!"], [337.58, 342.08, "Great work! Now you can use eight new words and linking cause and result."], [342.38, 346.87, "Today's value is critical reasoning. Test every argument before you accept it."], [347.17, 350.09, "See you in Unit fourteen. Goodbye!"], [350.39, 353.37, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XEA-Unit14-Compare-and-Contrast": [[0.35, 5.93, "Hello, everyone! I'm Ms. Emma. Welcome to Online English for Academic Purposes."], [6.23, 9.85, "Hi! I'm Visal. Let's learn together!"], [10.15, 16.57, "Unit fourteen: Compare and Contrast. Today you will write about similarities and differences clearly."], [16.88, 19.69, "Here is our lesson map. Let's start!"], [20.63, 23.83, "Part one: words. You will learn eight new words."], [24.68, 25.65, "Compare."], [26.65, 28.82, "Compare means to show similarities."], [29.42, 31.06, "Compare the two systems."], [31.65, 34.35, "Your turn. Say: Compare."], [37.2, 38.13, "Compare."], [38.88, 39.8, "Contrast."], [40.82, 42.96, "Contrast means to show differences."], [43.55, 45.28, "Contrast the two plans."], [45.88, 48.57, "Your turn. Say: Contrast."], [51.43, 52.54, "Contrast."], [53.28, 54.24, "Similar."], [55.25, 57.28, "Similar means almost the same."], [57.88, 59.3, "The two are similar."], [59.92, 62.27, "Your turn. Say: Similar."], [65.13, 66.05, "Similar."], [66.82, 67.72, "Whereas."], [68.72, 71.05, "Whereas means used to show a difference."], [71.65, 73.57, "One is old, whereas one is new."], [74.18, 76.87, "Your turn. Say: Whereas."], [79.73, 80.84, "Whereas."], [81.58, 82.32, "Both."], [83.32, 85.05, "Both means the two together."], [85.65, 86.89, "Both have strengths."], [87.48, 89.58, "Your turn. Say: Both."], [92.43, 93.12, "Both."], [93.88, 94.81, "Unlike."], [95.82, 97.39, "Unlike means not like."], [97.98, 99.82, "Unlike cars, bikes are cheap."], [100.42, 103.23, "Your turn. Say: Unlike."], [106.07, 107.09, "Unlike."], [107.85, 108.78, "Difference."], [109.78, 112.21, "Difference means a way things are not the same."], [112.82, 114.2, "Name one difference."], [114.82, 117.27, "Your turn. Say: Difference."], [120.13, 121.13, "Difference."], [121.88, 122.99, "Similarly."], [123.98, 126.11, "Similarly means in the same way."], [126.72, 128.6, "Similarly, both are cheap."], [129.22, 131.68, "Your turn. Say: Similarly."], [134.53, 135.64, "Similarly."], [136.43, 140.15, "Part two: dialogue. Let's listen to a conversation."], [141.02, 143.59, "Visal, how do I compare two things?"], [144.68, 156.09, "List similarities and differences first. Then use words such as both, similarly and in the same way for similarities and whereas, unlike and however for differences."], [157.18, 158.97, "How do I organise the essay?"], [160.08, 171.99, "You can write by block, describing one topic fully and then the other, or point by point, comparing both on one feature at a time."], [173.08, 174.2, "Which is better?"], [175.32, 186.93, "Point by point is clearer for longer texts because the reader sees each comparison directly. Finish with a conclusion that states which is stronger and why."], [188.07, 189.45, "Part three: grammar."], [190.32, 192.81, "Grammar focus: Comparison linkers."], [193.12, 194.35, "Look at the pattern."], [195.05, 197.69, "Both buses and trains are public transport."], [198.58, 201.57, "Trains are fast, whereas buses are cheaper."], [202.53, 209.8, "Use both and similarly for similarities. Use whereas, while and unlike for differences. Put a comma after however."], [210.55, 214.21, "Be careful! Don't say: Both is public transport."], [216.17, 218.49, "Say: Both are public transport."], [218.79, 219.98, "Both takes are."], [220.77, 223.63, "Part four: reading. Read and listen."], [224.43, 225.89, "Two Ways to Travel."], [226.19, 228.93, "Rithy compares buses and trains for his essay."], [229.93, 232.85, "Both are public transport and both reduce traffic."], [233.87, 236.44, "Trains are fast, whereas buses are cheaper."], [237.43, 240.59, "Unlike trains, buses can reach small villages."], [241.6, 243.96, "He concludes that each suits a different journey."], [245.07, 249.12, "Part five: quiz. Five questions. Are you ready?"], [249.95, 251.46, "Compare shows blank."], [251.76, 255.81, "A, only prices. B, nothing. C, similarities."], [259.37, 261.92, "The answer is C: similarities."], [263.08, 264.54, "Whereas shows a blank."], [264.84, 267.89, "A, difference. B, date. C, name."], [271.43, 273.36, "The answer is A: difference."], [274.52, 276.19, "Both means the blank together."], [276.49, 279.27, "A, none. B, two. C, ten."], [282.83, 284.43, "The answer is B: two."], [285.58, 287.59, "Similarly means in the same blank."], [287.89, 290.85, "A, room. B, year. C, way."], [294.4, 296.28, "The answer is C: way."], [297.45, 298.69, "What is cheaper?"], [299.0, 302.38, "A, buses. B, trains. C, planes."], [305.93, 308.17, "The answer is A: buses."], [309.37, 312.79, "Part six: speaking. It's your turn to talk."], [313.65, 315.49, "How do you compare two things?"], [324.28, 325.8, "Now listen to Visal."], [326.1, 339.34, "I list the similarities and differences first. I use both and similarly for similarities and whereas and unlike for differences. I organise the essay point by point and end with a conclusion."], [339.64, 341.32, "Excellent answer, Visal!"], [342.22, 346.37, "Great work! Now you can use eight new words and comparison linkers."], [346.67, 351.62, "Today's value is balance. Enjoy screens a little, then play and read too."], [351.92, 354.69, "See you in Unit fifteen. Goodbye!"], [354.99, 357.73, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XEA-Unit15-Argument-and-Opinion": [[0.35, 6.22, "Hello, everyone! I'm Ms. Emma. Welcome to Online English for Academic Purposes."], [6.52, 9.84, "Hi! I'm Visal. Let's learn together!"], [10.14, 16.11, "Unit fifteen: Argument and Opinion. Today you will argue a view with reasons and careful language."], [16.41, 19.02, "Here is our lesson map. Let's start!"], [19.97, 23.13, "Part one: words. You will learn eight new words."], [23.98, 24.82, "Argument."], [25.82, 28.2, "Argument means a set of reasons for a view."], [28.78, 30.43, "Build a strong argument."], [31.05, 33.55, "Your turn. Say: Argument."], [36.4, 37.12, "Argument."], [37.88, 39.08, "Counterargument."], [40.08, 42.54, "Counterargument means a view that disagrees."], [43.15, 44.77, "Answer the counterargument."], [45.35, 48.44, "Your turn. Say: Counterargument."], [51.3, 52.49, "Counterargument."], [53.25, 54.24, "Persuade."], [55.25, 57.46, "Persuade means to make someone agree."], [58.05, 59.32, "Persuade the reader."], [59.92, 62.55, "Your turn. Say: Persuade."], [65.4, 66.36, "Persuade."], [67.12, 67.97, "Valid."], [68.98, 71.1, "Valid means reasonable and sound."], [71.68, 73.14, "That is a valid point."], [73.75, 76.43, "Your turn. Say: Valid."], [79.27, 80.06, "Valid."], [80.82, 81.7, "Bias."], [82.72, 84.84, "Bias means unfair preference."], [85.45, 86.95, "Avoid bias."], [87.55, 90.49, "Your turn. Say: Bias."], [93.33, 94.4, "Bias."], [95.15, 96.33, "Justify."], [97.32, 99.51, "Justify means to give reasons for."], [100.12, 101.69, "Justify your opinion."], [102.28, 104.69, "Your turn. Say: Justify."], [107.53, 108.66, "Justify."], [109.42, 110.42, "Convincing."], [111.42, 113.54, "Convincing means able to persuade."], [114.15, 115.4, "A convincing reason."], [115.98, 118.54, "Your turn. Say: Convincing."], [121.4, 122.37, "Convincing."], [123.12, 124.06, "Rebut."], [125.05, 127.17, "Rebut means to argue against."], [127.75, 128.9, "Rebut the claim."], [129.52, 132.55, "Your turn. Say: Rebut."], [135.4, 136.42, "Rebut."], [137.23, 140.91, "Part two: dialogue. Let's listen to a conversation."], [141.75, 144.12, "Visal, how do I argue in an essay?"], [145.22, 156.37, "State your position in the thesis, give two or three strong reasons with evidence and then consider the opposite view. Finally explain why your view is stronger."], [157.48, 159.03, "Can I write I think?"], [160.12, 170.66, "In academic writing it is better to use impersonal phrases, such as it can be argued that or the evidence suggests that, with careful hedging."], [171.75, 173.24, "What is a counterargument?"], [174.35, 182.28, "It is a reason against your view. Mention it fairly, for example Some people argue that, and then rebut it with better evidence."], [183.43, 184.79, "Part three: grammar."], [185.65, 188.97, "Grammar focus: Hedging and impersonal phrases."], [189.27, 190.6, "Look at the pattern."], [191.28, 194.32, "It can be argued that online study is more flexible."], [195.22, 198.34, "The evidence suggests that sleep improves results."], [199.3, 207.66, "Use phrases such as it can be argued that and the evidence suggests that. Add words such as may, tends to and often to avoid absolute claims."], [208.42, 211.7, "Be careful! Don't say: I thinks it is true."], [213.63, 215.99, "Say: It can be argued that it is true."], [216.29, 218.14, "Use an impersonal phrase."], [218.93, 221.32, "Part four: reading. Read and listen."], [222.13, 223.39, "Taking a Position."], [223.69, 226.32, "Piseth must argue for or against homework."], [227.3, 229.57, "He states his position in the thesis."], [230.57, 233.58, "He gives two reasons and supports them with evidence."], [234.57, 236.93, "Then he mentions the opposite view fairly."], [237.93, 240.25, "He rebuts it and writes a firm conclusion."], [241.33, 245.67, "Part five: quiz. Five questions. Are you ready?"], [246.52, 248.76, "A counterargument is the blank view."], [249.06, 252.4, "A, opposite. B, same. C, empty."], [255.93, 257.75, "The answer is A: opposite."], [258.88, 260.3, "Valid means blank."], [260.6, 263.79, "A, loud. B, reasonable. C, funny."], [267.33, 269.53, "The answer is B: reasonable."], [270.68, 272.67, "Bias is an blank preference."], [272.97, 276.73, "A, equal. B, exact. C, unfair."], [280.27, 282.34, "The answer is C: unfair."], [283.48, 285.27, "To rebut is to argue blank."], [285.57, 288.81, "A, against. B, with. C, late."], [292.37, 294.47, "The answer is A: against."], [295.62, 297.77, "Piseth supports reasons with blank."], [298.07, 301.26, "A, luck. B, evidence. C, jokes."], [304.8, 307.21, "The answer is B: evidence."], [308.4, 311.74, "Part six: speaking. It's your turn to talk."], [312.58, 314.22, "How do you argue in an essay?"], [323.02, 324.44, "Now listen to Visal."], [324.74, 335.7, "I state my position in the thesis and give strong reasons with evidence. I mention the opposite view fairly and rebut it. I use careful phrases such as it can be argued that."], [336.0, 337.62, "Excellent answer, Visal!"], [338.52, 343.39, "Great work! Now you can use eight new words and hedging and impersonal phrases."], [343.69, 348.59, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [348.89, 351.43, "See you in Unit sixteen. Goodbye!"], [351.73, 354.33, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XEA-Unit16-Giving-Presentations": [[0.35, 6.36, "Hello, everyone! I'm Ms. Emma. Welcome to Online English for Academic Purposes."], [6.66, 9.99, "Hi! I'm Visal. Let's learn together!"], [10.29, 16.92, "Unit sixteen: Giving Presentations. Today you will plan and deliver a short academic presentation."], [17.22, 19.92, "Here is our lesson map. Let's start!"], [20.87, 24.11, "Part one: words. You will learn eight new words."], [24.95, 26.14, "Presentation."], [27.15, 29.73, "Presentation means a talk to an audience."], [30.32, 31.99, "Give a short presentation."], [32.58, 35.39, "Your turn. Say: Presentation."], [38.23, 39.43, "Presentation."], [40.18, 41.15, "Audience."], [42.15, 44.32, "Audience means the people who listen."], [44.92, 46.24, "Look at the audience."], [46.85, 49.65, "Your turn. Say: Audience."], [52.5, 53.45, "Audience."], [54.22, 55.12, "Slide."], [56.12, 58.13, "Slide means one page of a talk."], [58.72, 60.4, "Keep each slide simple."], [61.02, 63.51, "Your turn. Say: Slide."], [66.37, 67.4, "Slide."], [68.15, 69.3, "Eye contact."], [70.32, 72.51, "Eye contact means looking at listeners."], [73.12, 74.41, "Make eye contact."], [75.02, 77.75, "Your turn. Say: Eye contact."], [80.6, 81.71, "Eye contact."], [82.45, 83.31, "Pace."], [84.32, 86.44, "Pace means speed of speaking."], [87.05, 88.45, "Control your pace."], [89.05, 91.35, "Your turn. Say: Pace."], [94.2, 94.95, "Pace."], [95.68, 96.77, "Rehearse."], [97.75, 99.89, "Rehearse means to practise before."], [100.48, 101.84, "Rehearse the talk."], [102.45, 105.48, "Your turn. Say: Rehearse."],         function textCheck(msg, text, need, okText, key, amount) {
            const n = countWords(text);
            if (n < need) {
                msg.className = "text-sm mt-2 font-semibold text-red-500";
                msg.textContent = n === 0 ? "✏️ Write something first!" : `✏️ Write a little more — at least ${need} words (you have ${n}).`;

        function usedUnitWords(text, unitData) {
            const t = ' ' + String(text).toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
            return unitData.vocab.filter(w => {
                const base = w.toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').trim();
                if (!base) return false;
                // whole word, allowing simple endings: s, es, ed, ing
                const re = new RegExp('[ ]' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[ ]') + '(s|es|ed|d|ing)?[ ]');
                return re.test(t);
            });

        // ===== 7. VOCABULARY GAME (picture -> word) =====

        function buildVocabGameQuestions(unitData) {

                fb.textContent = `❌ It was "${q.correct}"`;

        // ===== 8. SPELLING PRACTICE (tap scrambled letters in order) =====
        let spellState = { word: '', picked: [], letters: [], wIndex: 0, words: [], done: false };
        function renderSpelling(contentDiv, unitData) {
            spellState.words = shuffle([...new Set(unitData.vocab)].filter(w => /^[A-Za-z ]+$/.test(w)));
            spellState.wIndex = 0;

        // ===== 9. SENTENCE BUILDING (reorder scrambled words from the story) =====

        function storySentences(unitData, minWordCount) {

        function renderSentenceBuilding(contentDiv, unitData) {

        let dictationTarget = '';

        function renderDictation(contentDiv, unitData) {
            const sentences = storySentences(unitData, 3);
            let pick = sentences[Math.floor(Math.random() * sentences.length)];
            if (sentences.length > 1) while (pick === dictationTarget) pick = sentences[Math.floor(Math.random() * sentences.length)];

            dictationDone = false;
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">✍️ Dictation</h2>
