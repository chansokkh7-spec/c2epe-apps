develop vaccines together and distribute them fairly. Without global health equity, new variants can appear in poorly protected regions and return. Working together is therefore both the ethical and the practical choice."], [451.57, 453.23, "Excellent answer, Visal!"], [454.12, 460.56, "Great work! Now you can use eight new words and fronting plus inversion: adjective plus be plus subject."], [460.87, 465.22, "Today's value is preparedness. Get ready before an emergency happens."], [465.52, 467.86, "See you in Unit ten. Goodbye!"], [468.16, 471.15, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit10-Cultural-Diplomacy": [[0.35, 6.01, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.31, 9.56, "Hi! I'm Visal. Let's learn together!"], [9.86, 16.91, "Unit ten: Cultural Diplomacy. Today you will use verbs that change meaning with -ing or to-infinitive."], [17.21, 19.75, "Here is our lesson map. Let's start!"], [20.7, 24.04, "Part one: words. You will learn eight new words."], [24.88, 26.05, "Soft power."], [27.05, 32.08, "Soft power means the ability to win support through attraction rather than force."], [32.68, 35.23, "Music and film give a country soft power."], [35.82, 39.25, "Your turn. Say: Soft power."], [42.1, 43.32, "Soft power."], [44.08, 45.93, "Cultural exchange program."], [46.92, 52.1, "Cultural exchange program means a scheme that sends students or artists to live and learn abroad."], [52.68, 55.85, "A cultural exchange program sent dancers to Japan."], [56.45, 60.01, "Your turn. Say: Cultural exchange program."], [62.87, 65.19, "Cultural exchange program."], [65.95, 67.44, "Public diplomacy."], [68.45, 73.43, "Public diplomacy means a government's efforts to explain its views to foreign citizens."], [74.02, 77.54, "Public diplomacy includes interviews and festivals."], [78.15, 81.27, "Your turn. Say: Public diplomacy."], [84.13, 85.62, "Public diplomacy."], [86.38, 87.74, "National image."], [88.75, 92.85, "National image means the picture of a country that people around the world hold."], [93.45, 95.73, "Tourism improved the national image."], [96.32, 99.22, "Your turn. Say: National image."], [102.07, 103.66, "National image."], [104.42, 105.73, "Cultural export."], [106.72, 111.57, "Cultural export means a film, song or tradition that a country shares with the world."], [112.18, 115.35, "Traditional dance became a popular cultural export."], [115.95, 118.89, "Your turn. Say: Cultural export."], [121.73, 123.28, "Cultural export."], [124.02, 125.81, "People-to-people ties."], [126.82, 131.73, "People-to-people ties means friendly links between ordinary citizens of different countries."], [132.32, 135.49, "People-to-people ties survive political disagreements."], [136.08, 139.77, "Your turn. Say: People-to-people ties."], [142.63, 144.41, "People-to-people ties."], [145.15, 146.63, "International goodwill."], [147.62, 151.46, "International goodwill means friendly feelings between nations."], [152.05, 154.57, "The concert created international goodwill."], [155.18, 158.16, "Your turn. Say: International goodwill."], [161.0, 162.91, "International goodwill."], [163.65, 165.02, "Cultural influence."], [166.02, 171.08, "Cultural influence means the ability of a culture to shape the tastes of other societies."], [171.68, 174.69, "Korean television has great cultural influence."], [175.28, 178.64, "Your turn. Say: Cultural influence."], [181.5, 183.06, "Cultural influence."], [183.87, 187.45, "Part two: dialogue. Let's listen to a conversation."], [188.28, 194.59, "Visal, a diplomat says 'I remember attending the festival' and 'Remember to attend the festival'. Why are the forms different?"], [195.68, 210.79, "Some verbs change meaning. Remember + -ing is a memory of a past event. Remember + to-infinitive is a duty not to forget. Forget, regret, stop and try work the same way."], [211.88, 213.62, "Can you show more examples?"], [214.72, 226.08, "'The ministry regrets to announce a delay' is news now. 'The ministry regrets announcing the ban' is sorrow about the past. 'She stopped to watch' differs from 'She stopped watching'."], [227.18, 229.06, "Why does it matter in diplomacy?"], [230.15, 241.35, "Precision avoids misunderstanding. 'Try offering exchange programmes' suggests an experiment, while 'try to offer' means make an effort. Diplomats choose their words carefully."], [242.5, 244.05, "Part three: grammar."], [244.88, 249.7, "Grammar focus: Verb plus -ing or to-infinitive (meaning changes)."], [250.0, 251.25, "Look at the pattern."], [251.95, 255.47, "The envoy remembers attending the first cultural exchange program."], [256.38, 259.36, "The ministry regrets to announce that the tour is cancelled."], [260.25, 263.36, "Officials tried offering free concerts to win goodwill."], [264.3, 273.01, "Remember / forget / regret / stop / try change meaning: + -ing looks back or experiments; + to-infinitive is a duty, a purpose or current news."], [273.75, 277.94, "Be careful! Don't say: I remember to visit it as a child."], [279.9, 282.33, "Say: I remember visiting it as a child."], [282.63, 285.34, "Use remember + -ing for a past memory."], [286.13, 288.53, "Part four: reading. Read and listen."], [289.33, 290.89, "The Power of Culture."], [291.19, 295.4, "Soft power means winning friends through attraction rather than force."], [296.4, 301.52, "Many people remember watching a film or hearing a song that changed how they saw another country."], [302.53, 309.1, "A cultural export such as music or cuisine improves a national image, and public diplomacy tries to build on it."], [310.1, 316.73, "A cultural exchange program lets students live abroad, and people-to-people ties create lasting international goodwill."], [317.73, 323.63, "Governments should not forget to support artists, because their cultural influence travels farther than speeches."], [324.73, 328.99, "Part five: quiz. Five questions. Are you ready?"], [329.85, 331.93, "Don't forget blank the visa form."], [332.23, 335.54, "A, signing. B, to sign. C, sign."], [339.1, 341.23, "The answer is B: to sign."], [342.38, 344.89, "I remember blank the exhibition last year."], [345.19, 348.72, "A, to visit. B, visiting. C, visit."], [352.27, 354.38, "The answer is B: visiting."], [355.52, 359.85, "Sharing a country's music, films and food abroad is a cultural blank."], [360.15, 363.78, "A, export. B, dispute. C, debris."], [367.33, 369.23, "The answer is A: export."], [370.38, 372.22, "Which sentence gives news now?"], [372.52, 379.87, "A, We regret to inform you of the delay.. B, We regret informing you of the delay.. C, We regret inform you of the delay.."], [383.4, 386.85, "The answer is A: We regret to inform you of the delay.."], [388.02, 390.97, "According to the reading, soft power wins friends through…"], [391.27, 394.55, "A, force. B, attraction. C, tariffs."], [398.1, 400.48, "The answer is B: attraction."], [401.67, 404.52, "Part six: speaking. It's your turn to talk."], [405.35, 409.87, "Can you think of an example of cultural diplomacy, like music, film, or sports?"], [418.68, 420.02, "Now listen to Visal."], [420.32, 444.43, "One example is a national football team playing a friendly match in another country. Fans celebrate together, players meet ordinary people and the visit improves the national image of both sides. Concerts, films and food festivals work in the same way: they build goodwill and soft power without the pressure of political negotiation."], [444.73, 446.37, "Excellent answer, Visal!"], [447.28, 453.27, "Great work! Now you can use eight new words and verb plus -ing or to-infinitive (meaning changes)."], [453.57, 459.32, "Today's value is cultural appreciation. Enjoy and respect the music and art of every culture."], [459.62, 462.56, "See you in Unit eleven. Goodbye!"], [462.86, 465.71, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit11-Foreign-Aid-Development": [[0.35, 5.76, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.06, 9.19, "Hi! I'm Visal. Let's learn together!"], [9.49, 15.91, "Unit eleven: Foreign Aid & Development. Today you will say that something holds regardless with -ever clauses."], [16.21, 18.88, "Here is our lesson map. Let's start!"], [19.83, 22.94, "Part one: words. You will learn eight new words."], [23.78, 25.47, "Development assistance."], [26.48, 31.35, "Development assistance means money or help given to improve a poorer country's economy."], [31.95, 34.49, "Development assistance paid for new roads."], [35.08, 38.41, "Your turn. Say: Development assistance."], [41.27, 42.88, "Development assistance."], [43.62, 45.27, "Humanitarian aid."], [46.28, 52.01, "Humanitarian aid means emergency food, medicine and shelter sent to people in crisis."], [52.62, 55.38, "Humanitarian aid reached the village within a day."], [55.98, 59.15, "Your turn. Say: Humanitarian aid."], [62.0, 63.7, "Humanitarian aid."], [64.45, 65.8, "Aid dependency."], [66.78, 71.22, "Aid dependency means relying on outside help instead of building local strength."], [71.82, 74.14, "Aid dependency weakened local farming."], [74.75, 77.33, "Your turn. Say: Aid dependency."], [80.17, 81.74, "Aid dependency."], [82.48, 84.41, "Sustainable development goal."], [85.42, 90.53, "Sustainable development goal means one of the targets set by the United Nations for a better world."], [91.12, 94.41, "Each sustainable development goal has measurable targets."], [95.02, 98.75, "Your turn. Say: Sustainable development goal."], [101.6, 103.72, "Sustainable development goal."], [104.45, 105.57, "Donor country."], [106.58, 109.64, "Donor country means a country that gives aid to others."], [110.25, 112.84, "A donor country pledged ten million dollars."], [113.45, 116.17, "Your turn. Say: Donor country."], [119.03, 120.28, "Donor country."], [121.02, 122.45, "Capacity building."], [123.45, 128.32, "Capacity building means helping people and institutions gain the skills to manage alone."], [128.92, 131.65, "Capacity building trained local engineers."], [132.25, 134.95, "Your turn. Say: Capacity building."], [137.8, 139.34, "Capacity building."], [140.08, 141.61, "Poverty alleviation."], [142.62, 146.78, "Poverty alleviation means reducing the number of people who live in poverty."], [147.38, 150.36, "Poverty alleviation requires jobs as well as aid."], [150.95, 154.0, "Your turn. Say: Poverty alleviation."], [156.83, 158.52, "Poverty alleviation."], [159.28, 160.73, "Aid effectiveness."], [161.72, 165.21, "Aid effectiveness means how well aid achieves lasting results."], [165.82, 168.91, "Aid effectiveness improved when locals led the project."], [169.52, 172.83, "Your turn. Say: Aid effectiveness."], [175.67, 177.04, "Aid effectiveness."], [177.83, 181.19, "Part two: dialogue. Let's listen to a conversation."], [182.05, 187.44, "Visal, a minister says 'Whatever aid we receive must be spent wisely.' What does 'whatever' mean here?"], [188.55, 200.48, "It means 'any aid at all, without limit'. Words with -ever (whatever, whoever, whichever, wherever, whenever, however) introduce clauses that show it makes no difference."], [201.58, 203.5, "How is it different from 'no matter what'?"], [204.62, 216.01, "'No matter what aid arrives, it must be spent wisely' has the same meaning. 'No matter' is more spoken, while -ever clauses can also act as a subject or an object."], [217.12, 219.12, "Can you show a subject use?"], [220.22, 231.03, "'Whoever signs the agreement accepts the conditions.' Here 'whoever signs' is the subject. 'Give the grant to whichever district needs it most' shows an object use."], [232.2, 233.77, "Part three: grammar."], [234.62, 239.23, "Grammar focus: -ever clauses: whatever and whoever and whichever."], [239.53, 240.72, "Look at the pattern."], [241.42, 244.54, "Whatever aid a donor country gives must be spent wisely."], [245.45, 248.27, "Whoever signs the agreement accepts the conditions."], [249.18, 253.04, "No matter how generous the grant is, capacity building takes years."], [254.0, 262.72, "Use whatever, whoever, whichever, wherever, whenever or no matter + wh-word for 'it makes no difference': Whatever aid arrives, spend it wisely."], [263.48, 267.32, "Be careful! Don't say: Whatever you decide it, we agree."], [269.27, 272.54, "Say: Whatever you decide, we agree."], [272.84, 275.11, "Do not repeat the object after whatever."], [275.9, 278.72, "Part four: reading. Read and listen."], [279.5, 280.98, "Helping Without Harming."], [281.28, 284.66, "Development assistance should help countries stand on their own feet."], [285.67, 290.17, "Whatever form it takes, aid is most effective when local people lead the project."], [291.17, 296.97, "Whichever sustainable development goal a donor country supports, capacity building must come with the money."], [297.97, 303.95, "No matter how generous humanitarian aid is, aid dependency can grow if there is no plan to leave."], [304.93, 309.58, "Whoever designs a programme should measure poverty alleviation, not just spending."], [310.67, 315.13, "Part five: quiz. Five questions. Are you ready?"], [315.98, 319.07, "blank wins the election must listen to all citizens."], [319.37, 323.25, "A, Whoever. B, Whichever. C, Whenever."], [326.8, 328.82, "The answer is A: Whoever."], [329.98, 333.6, "Helping people gain skills to manage for themselves is blank building."], [333.9, 337.88, "A, capacity. B, donor. C, border."], [341.43, 343.5, "The answer is A: capacity."], [344.65, 346.52, "Choose the correct sentence."], [346.82, 355.06, "A, Whatever you decide, we will support you.. B, Whatever you will decide it, we support you.. C, What you decide ever, we support you.."], [358.6, 362.06, "The answer is A: Whatever you decide, we will support you.."], [363.22, 366.25, "A country that gives aid to others is a blank country."], [366.55, 369.53, "A, host. B, donor. C, member."], [373.07, 374.79, "The answer is B: donor."], [375.95, 379.4, "According to the reading, aid works best when who leads the project?"], [379.7, 384.35, "A, foreign experts. B, local people. C, a superpower."], [387.9, 389.98, "The answer is B: local people."], [391.17, 394.18, "Part six: speaking. It's your turn to talk."], [395.02, 400.0, "Can foreign aid sometimes create dependency instead of long-term self-sufficiency?"], [408.78, 410.25, "Now listen to Visal."], [410.55, 438.31, "Yes, foreign aid can create dependency if it replaces local effort instead of supporting it. When a country relies on donor grants for basic services, its own institutions may stay weak. Aid works best when it includes capacity building, trains local workers and has a clear plan to reduce support over time so that the country can stand on its own."], [438.61, 440.35, "Excellent answer, Visal!"], [441.25, 447.08, "Great work! Now you can use eight new words and -ever clauses: whatever and whoever and whichever."], [447.38, 453.1, "Today's value is social impact. Use your skills and ideas to improve other people's lives."], [453.4, 455.98, "See you in Unit twelve. Goodbye!"], [456.28, 458.84, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit12-Regional-Trade-Blocs": [[0.35, 5.87, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.17, 9.59, "Hi! I'm Visal. Let's learn together!"], [9.89, 16.24, "Unit twelve: Regional Trade Blocs. Today you will use fixed prepositions after verbs, nouns and adjectives."], [16.54, 19.12, "Here is our lesson map. Let's start!"], [20.07, 23.9, "Part one: words. You will learn eight new words."], [24.75, 25.86, "Free trade zone."], [26.85, 31.33, "Free trade zone means an area where goods move between members without tariffs."], [31.95, 34.48, "The free trade zone boosted border towns."], [35.08, 37.74, "Your turn. Say: Free trade zone."], [40.6, 41.97, "Free trade zone."], [42.72, 43.86, "Common market."], [44.85, 48.99, "Common market means a bloc in which goods, workers and money move freely."], [49.58, 53.05, "A common market lets citizens work in any member country."], [53.65, 56.34, "Your turn. Say: Common market."], [59.2, 60.29, "Common market."], [61.05, 62.47, "Regional integration."], [63.48, 68.35, "Regional integration means the process of neighbouring countries becoming economically closer."], [68.95, 71.53, "Regional integration took thirty years."], [72.12, 75.23, "Your turn. Say: Regional integration."], [78.1, 79.72, "Regional integration."], [80.45, 81.62, "Customs union."], [82.62, 87.51, "Customs union means a bloc whose members share the same tariffs on outside goods."], [88.12, 91.11, "The customs union set one tariff for all imports."], [91.72, 94.75, "Your turn. Say: Customs union."], [97.6, 98.79, "Customs union."], [99.55, 101.07, "Trade bloc membership."], [102.08, 106.75, "Trade bloc membership means the status of belonging to a group of trading partners."], [107.35, 110.63, "Trade bloc membership requires accepting common rules."], [111.22, 114.75, "Your turn. Say: Trade bloc membership."], [117.6, 119.2, "Trade bloc membership."], [119.95, 121.39, "Economic community."], [122.38, 127.52, "Economic community means a group of countries cooperating closely on economic policy."], [128.12, 131.42, "The economic community agreed on a joint budget."], [132.02, 134.87, "Your turn. Say: Economic community."], [137.7, 139.34, "Economic community."], [140.08, 141.53, "Cross-border trade."], [142.52, 147.09, "Cross-border trade means buying and selling goods across national frontiers."], [147.68, 150.39, "Cross-border trade doubled in five years."], [150.98, 154.48, "Your turn. Say: Cross-border trade."], [157.33, 159.15, "Cross-border trade."], [159.88, 161.55, "Regional cooperation."], [162.55, 166.92, "Regional cooperation means neighbouring countries working together on shared goals."], [167.52, 170.57, "Regional cooperation improved port security."], [171.18, 174.51, "Your turn. Say: Regional cooperation."], [177.37, 179.16, "Regional cooperation."], [179.97, 184.1, "Part two: dialogue. Let's listen to a conversation."], [184.95, 191.89, "Visal, a report says 'Smaller economies often depend on access to larger markets.' Why 'depend on' and 'access to'?"], [192.98, 205.13, "Many verbs, nouns and adjectives need a fixed preposition: depend on, access to, benefit from, dependence on, member of, committed to. Learn these collocations together."], [206.22, 207.5, "Is there a pattern?"], [208.58, 223.39, "Partly. Nouns often keep the preposition of their verb: depend on → dependence on, contribute to → contribution to. But 'access to' has no verb, so you must memorise it."], [224.48, 226.73, "What if a verb follows the preposition?"], [227.82, 239.16, "Then use -ing: 'committed to reducing tariffs', 'benefit from trading freely', 'interested in joining the bloc'. Never use an infinitive after a preposition."], [240.3, 241.89, "Part three: grammar."], [242.75, 246.1, "Grammar focus: Dependent prepositions plus noun and -ing."], [246.4, 247.59, "Look at the pattern."], [248.28, 251.63, "Small economies depend on access to larger markets."], [252.52, 255.35, "Members are committed to reducing internal tariffs."], [256.25, 259.27, "Farmers benefit from trading freely across borders."], [260.23, 268.49, "Learn fixed prepositions: depend on, access to, benefit from, committed to. After a preposition use a noun or -ing, never to + verb."], [269.25, 273.38, "Be careful! Don't say: She is interested to join the bloc."], [275.33, 278.19, "Say: She is interested in joining the bloc."], [278.49, 280.78, "Use in + -ing after interested."], [281.57, 284.06, "Part four: reading. Read and listen."], [284.87, 286.23, "Stronger Together."], [286.53, 290.59, "A regional trade bloc connects neighbouring countries through shared rules."], [291.6, 300.15, "A free trade zone removes tariffs on cross-border trade, while a customs union also adopts one set of tariffs against outsiders."], [301.13, 308.6, "A common market goes further by allowing workers and capital to move freely, and an economic community may share even more policies."], [309.6, 313.57, "Members are often committed to deepening regional integration step by step."], [314.57, 321.08, "Smaller countries benefit from joining because they gain access to larger markets and a stronger voice in regional cooperation."], [322.17, 326.14, "Part five: quiz. Five questions. Are you ready?"], [326.98, 330.23, "Smaller states benefit blank regional cooperation."], [330.52, 333.39, "A, of. B, from. C, to."], [336.93, 338.63, "The answer is B: from."], [339.78, 344.93, "A group that removes tariffs among members and sets common outside tariffs is a customs blank."], [345.23, 348.56, "A, union. B, dispute. C, embargo."], [352.1, 353.84, "The answer is A: union."], [354.98, 356.7, "Choose the correct sentence."], [357.0, 364.72, "A, They are committed to reduce tariffs.. B, They are committed to reducing tariffs.. C, They are committed for reducing tariffs.."], [368.27, 371.81, "The answer is B: They are committed to reducing tariffs.."], [372.95, 376.2, "Trade across a border between two countries is blank trade."], [376.5, 380.01, "A, cross-border. B, domestic. C, local."], [383.57, 385.85, "The answer is A: cross-border."], [386.98, 390.49, "According to the reading, what do smaller countries gain access to?"], [390.79, 395.4, "A, larger markets. B, new borders. C, fewer rules."], [398.93, 401.79, "The answer is A: larger markets."], [403.0, 406.16, "Part six: speaking. It's your turn to talk."], [407.02, 411.26, "What are the benefits of joining a regional trade bloc for a smaller country?"], [420.05, 421.51, "Now listen to Visal."], [421.81, 444.3, "A smaller country gains access to larger markets without paying high tariffs, which helps its exporters grow. It can also attract investment, share costs with neighbours and speak with a stronger voice in negotiations. However, it must accept common rules, so membership works best when the bloc treats all members fairly."], [444.6, 446.48, "Excellent answer, Visal!"], [447.38, 452.59, "Great work! Now you can use eight new words and dependent prepositions plus noun and -ing."], [452.89, 458.6, "Today's value is collaboration. Work together, and share both the effort and the success."], [458.9, 461.95, "See you in Unit thirteen. Goodbye!"], [462.25, 464.82, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit13-Cyber-Diplomacy": [[0.35, 5.92, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.22, 9.69, "Hi! I'm Visal. Let's learn together!"], [9.99, 16.53, "Unit thirteen: Cyber Diplomacy. Today you will make verbs agree with neither…nor, either…or and both…and."], [16.83, 19.57, "Here is our lesson map. Let's start!"], [20.53, 23.92, "Part one: words. You will learn eight new words."], [24.78, 25.99, "Cyberattack."], [26.98, 31.44, "Cyberattack means a deliberate attempt to damage or enter computer systems."], [32.05, 34.66, "A cyberattack shut down the airport screens."], [35.25, 37.87, "Your turn. Say: Cyberattack."], [40.73, 41.95, "Cyberattack."], [42.72, 44.08, "Digital sovereignty."], [45.08, 49.48, "Digital sovereignty means a country's right to control its own data and networks."], [50.08, 52.78, "Digital sovereignty is a growing political demand."], [53.38, 56.58, "Your turn. Say: Digital sovereignty."], [59.43, 60.77, "Digital sovereignty."], [61.52, 63.42, "International cyber norm."], [64.42, 69.59, "International cyber norm means an agreed standard of behaviour for states in cyberspace."], [70.18, 74.03, "An international cyber norm forbids attacks on hospitals."], [74.62, 78.15, "Your turn. Say: International cyber norm."], [81.0, 83.79, "International cyber norm."], [84.55, 86.34, "State-sponsored hacking."], [87.35, 92.02, "State-sponsored hacking means computer break-ins carried out or paid for by a government."], [92.62, 95.91, "State-sponsored hacking targeted election systems."], [96.52, 100.1, "Your turn. Say: State-sponsored hacking."], [102.93, 104.88, "State-sponsored hacking."], [105.62, 107.63, "Cybersecurity cooperation."], [108.62, 113.88, "Cybersecurity cooperation means countries sharing warnings and methods to defend networks."], [114.48, 117.77, "Cybersecurity cooperation stopped the virus quickly."], [118.38, 122.11, "Your turn. Say: Cybersecurity cooperation."], [124.97, 127.2, "Cybersecurity cooperation."], [127.95, 129.71, "Critical infrastructure."], [130.72, 136.41, "Critical infrastructure means the systems a society needs to function, such as power and water."], [137.02, 140.26, "Critical infrastructure must be protected first."], [140.85, 144.34, "Your turn. Say: Critical infrastructure."], [147.2, 148.83, "Critical infrastructure."], [149.58, 151.12, "Digital espionage."], [152.12, 156.9, "Digital espionage means spying by stealing secret information from computer networks."], [157.52, 160.5, "Digital espionage cost the firm its designs."], [161.12, 164.77, "Your turn. Say: Digital espionage."], [167.63, 169.12, "Digital espionage."], [169.88, 171.08, "Cyber treaty."], [172.08, 176.43, "Cyber treaty means a formal agreement between states on rules in cyberspace."], [177.02, 180.17, "A cyber treaty would define unacceptable attacks."], [180.75, 183.63, "Your turn. Say: Cyber treaty."], [186.5, 187.85, "Cyber treaty."], [188.63, 192.11, "Part two: dialogue. Let's listen to a conversation."], [192.95, 199.1, "Visal, a report says 'Neither the treaty nor the existing norms are enough.' Why is the verb 'are' and not 'is'?"], [200.18, 212.94, "With neither…nor and either…or, the verb agrees with the noun closest to it. Here 'norms' is plural, so we use 'are'. If reversed: 'Neither the norms nor the treaty is enough.'"], [214.05, 215.84, "Is it different with both…and?"], [216.95, 226.88, "Yes. 'Both…and' always takes a plural verb: 'Both governments and companies are targets.' Keep the two parts parallel in form and length."], [227.98, 229.77, "What about parallel structure?"], [230.88, 243.81, "Match the grammar: 'either to negotiate or to retaliate', not 'either to negotiate or retaliating'. Parallel parts keep formal writing clear and balanced."], [244.97, 246.9, "Part three: grammar."], [247.75, 252.5, "Grammar focus: Correlatives: neither…nor and either…or and both…and."], [252.8, 254.01, "Look at the pattern."], [254.72, 258.99, "Neither the treaty nor the existing norms are enough to stop state-sponsored hacking."], [259.88, 263.09, "Either the minister or the generals were told about the cyberattack."], [263.98, 267.86, "Both hospitals and power stations count as critical infrastructure."], [268.8, 275.77, "With neither…nor / either…or, the verb agrees with the nearer noun. Both…and takes a plural verb. Keep the two parts parallel."], [276.52, 280.24, "Be careful! Don't say: Neither she nor the guards was told."], [282.2, 284.47, "Say: Neither she nor the guards were told."], [284.77, 286.72, "The verb agrees with the nearer noun."], [287.53, 290.09, "Part four: reading. Read and listen."], [290.9, 292.91, "Rules for the Digital Battlefield."], [293.21, 297.68, "A cyberattack can paralyse a country without a single soldier crossing a border."], [298.7, 303.92, "Both banks and hospitals are examples of critical infrastructure that hackers may target."], [304.9, 311.26, "Neither state-sponsored hacking nor digital espionage is easy to prove, because attackers hide their identity."], [312.27, 317.6, "Either a cyber treaty or stronger international cyber norms are needed to set clear limits."], [318.6, 324.5, "Cybersecurity cooperation protects digital sovereignty only if both governments and companies share warnings."], [325.6, 329.62, "Part five: quiz. Five questions. Are you ready?"], [330.48, 333.1, "Neither the leaders nor the minister blank informed."], [333.4, 336.54, "A, were. B, was. C, are."], [340.1, 342.08, "The answer is B: was."], [343.22, 345.96, "Both Cambodia and Vietnam blank members."], [346.26, 349.06, "A, is. B, are. C, was."], [352.6, 354.56, "The answer is B: are."], [355.72, 357.48, "Choose the correct sentence."], [357.78, 366.01, "A, Either the treaty or the norms is weak.. B, Either the treaty or the norms are weak.. C, Either the treaty or the norms am weak.."], [369.57, 372.99, "The answer is B: Either the treaty or the norms are weak.."], [374.15, 377.81, "A country's right to control its own digital space is digital blank."], [378.11, 381.55, "A, sovereignty. B, espionage. C, trade."], [385.1, 386.87, "The answer is A: sovereignty."], [388.02, 392.36, "According to the reading, a cyberattack can paralyse a country without…"], [392.66, 397.93, "A, a single soldier crossing a border. B, any computers. C, a treaty."], [401.47, 404.8, "The answer is A: a single soldier crossing a border."], [406.0, 408.99, "Part six: speaking. It's your turn to talk."], [409.85, 414.79, "Should there be an international treaty specifically governing cyberattacks between nations?"], [423.58, 425.18, "Now listen to Visal."], [425.48, 453.38, "I believe a specific treaty is needed, because cyberattacks can damage critical infrastructure as seriously as physical attacks. A treaty would define unacceptable behaviour, protect hospitals and power stations, and create ways to investigate state-sponsored hacking. It would be difficult to enforce, but clear rules and shared norms still reduce misunderstandings and the risk of escalation."], [453.68, 455.49, "Excellent answer, Visal!"], [456.38, 462.77, "Great work! Now you can use eight new words and correlatives: neither…nor and either…or and both…and."], [463.07, 467.35, "Today's value is digital trust. Protect the trust that others place in you."], [467.65, 470.38, "See you in Unit fourteen. Goodbye!"], [470.69, 474.28, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit14-Ocean-Maritime-Law": [[0.35, 5.76, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.06, 9.47, "Hi! I'm Visal. Let's learn together!"], [9.77, 17.02, "Unit fourteen: Ocean & Maritime Law. Today you will read and write binding duties with shall, shall not and may."], [17.32, 19.75, "Here is our lesson map. Let's start!"], [20.7, 24.03, "Part one: words. You will learn eight new words."], [24.88, 26.35, "Territorial waters."], [27.35, 31.54, "Territorial waters means the sea close to a coast that belongs to that country."], [32.15, 35.64, "Foreign ships need permission to fish in territorial waters."], [36.25, 39.83, "Your turn. Say: Territorial waters."], [42.67, 44.81, "Territorial waters."], [45.55, 47.42, "Exclusive economic zone."], [48.42, 53.71, "Exclusive economic zone means the sea area where a coastal state controls fishing and energy."], [54.32, 58.09, "The exclusive economic zone extends two hundred nautical miles."], [58.68, 62.46, "Your turn. Say: Exclusive economic zone."], [65.3, 67.22, "Exclusive economic zone."], [67.98, 69.45, "Maritime boundary."], [70.45, 75.17, "Maritime boundary means the line that separates the sea areas of two countries."], [75.75, 78.68, "The maritime boundary was drawn after long talks."], [79.28, 82.48, "Your turn. Say: Maritime boundary."], [85.33, 86.81, "Maritime boundary."], [87.55, 89.03, "Freedom of navigation."], [90.02, 94.48, "Freedom of navigation means the right of ships to sail through international waters."], [95.08, 98.48, "Freedom of navigation keeps global trade moving."], [99.08, 102.47, "Your turn. Say: Freedom of navigation."], [105.33, 107.04, "Freedom of navigation."], [107.78, 109.47, "Deep sea resources."], [110.48, 115.64, "Deep sea resources means minerals, oil and life found far below the ocean surface."], [116.25, 119.26, "Deep sea resources may power future batteries."], [119.85, 123.21, "Your turn. Say: Deep sea resources."], [126.07, 127.64, "Deep sea resources."], [128.38, 129.64, "Fishing rights."], [130.65, 134.65, "Fishing rights means the legal permission to catch fish in a particular area."], [135.25, 138.14, "Fishing rights caused arguments between neighbours."], [138.75, 141.67, "Your turn. Say: Fishing rights."], [144.53, 145.82, "Fishing rights."], [146.58, 147.72, "Law of the sea."], [148.72, 152.88, "Law of the sea means the international rules that govern the use of the oceans."], [153.48, 156.3, "The law of the sea divides the ocean into zones."], [156.88, 160.34, "Your turn. Say: Law of the sea."], [163.2, 164.78, "Law of the sea."], [165.52, 166.97, "Maritime dispute."], [167.98, 172.75, "Maritime dispute means a disagreement between countries about sea areas or rights."], [173.35, 176.8, "A maritime dispute was sent to an international tribunal."], [177.42, 180.68, "Your turn. Say: Maritime dispute."], [183.53, 184.94, "Maritime dispute."], [185.73, 189.64, "Part two: dialogue. Let's listen to a conversation."], [190.48, 196.35, "Visal, a treaty says 'Every state shall respect the freedom of navigation.' Why 'shall' and not 'must'?"], [197.45, 210.43, "In treaties and laws, 'shall' creates a binding duty. It sounds formal and is common with third person subjects. 'May' gives permission, and 'shall not' forbids: 'No state shall claim the high seas.'"], [211.52, 213.56, "Is 'shall' used in everyday speech?"], [214.65, 224.98, "Not for obligation. Today we use it mostly for offers and suggestions, like 'Shall I help?'. In legal English it keeps its strong sense of duty."], [226.08, 227.89, "How do I read a legal sentence?"], [228.98, 240.26, "Find the subject, the modal and the action. 'Coastal states may use resources in their zone' means permission; 'shall protect' means obligation. Be careful with shall not."], [241.4, 242.78, "Part three: grammar."], [243.65, 247.76, "Grammar focus: Legal modals: shall and shall not and may."], [248.06, 249.33, "Look at the pattern."], [250.02, 253.03, "Every state shall respect the freedom of navigation."], [253.92, 256.85, "No state shall claim sovereignty over the high seas."], [257.75, 261.72, "Coastal states may manage fishing rights in their exclusive economic zone."], [262.67, 272.35, "In laws and treaties, shall = a binding duty, shall not = a ban, may = permission. In everyday English, shall is mainly for offers (Shall I help?)."], [273.08, 276.98, "Be careful! Don't say: No state shall not block the sea."], [278.93, 281.4, "Say: No state shall block the sea."], [281.7, 283.3, "Do not use a double negative."], [284.1, 286.72, "Part four: reading. Read and listen."], [287.53, 288.85, "Who Owns the Ocean?."], [289.15, 293.09, "The law of the sea divides the oceans into zones with different rights."], [294.1, 301.8, "A coastal state has full control of its territorial waters, and it may use its exclusive economic zone for fishing and energy."], [302.8, 309.7, "All ships shall enjoy freedom of navigation beyond territorial waters, and no state shall block international shipping routes."], [310.7, 317.51, "A maritime boundary is often unclear, so a maritime dispute may arise over fishing rights or deep sea resources."], [318.5, 324.12, "Parties shall settle such disputes peacefully, usually through negotiation or an international tribunal."], [325.23, 329.17, "Part five: quiz. Five questions. Are you ready?"], [330.02, 332.71, "In a treaty, 'shall' usually creates a blank."], [333.01, 336.19, "A, duty. B, joke. C, question."], [339.73, 341.54, "The answer is A: duty."], [342.68, 344.59, "Which sentence shows permission?"], [344.89, 350.73, "A, States shall pay a fee.. B, States may fish in their zone.. C, States shall not enter.."], [354.27, 356.99, "The answer is B: States may fish in their zone.."], [358.15, 362.05, "The right of ships to sail freely at sea is called blank of navigation."], [362.35, 365.73, "A, debris. B, freedom. C, closure."], [369.27, 370.86, "The answer is B: freedom."], [372.02, 375.7, "A disagreement over where a sea border lies is a maritime blank."], [376.0, 379.62, "A, dispute. B, summit. C, alliance."], [383.17, 384.86, "The answer is A: dispute."], [386.02, 389.15, "According to the reading, parties shall settle disputes…"], [389.45, 393.43, "A, by force. B, peacefully. C, secretly."], [396.97, 399.26, "The answer is B: peacefully."], [400.47, 403.4, "Part six: speaking. It's your turn to talk."], [404.25, 407.9, "Why might countries disagree over rights to deep sea resources?"], [416.68, 418.06, "Now listen to Visal."], [418.36, 446.63, "Countries disagree over deep sea resources because the minerals and fish lie far from any coast, so no state clearly owns them. Rich nations have the technology to extract them first, while poorer countries argue that the seabed belongs to all humanity. Different readings of the law of the sea, together with unclear maritime boundaries, can turn these arguments into serious disputes."], [446.93, 448.75, "Excellent answer, Visal!"], [449.65, 455.23, "Great work! Now you can use eight new words and legal modals: shall and shall not and may."], [455.53, 461.63, "Today's value is global legal awareness. Respect that other societies organise justice differently."], [461.93, 464.5, "See you in Unit fifteen. Goodbye!"], [464.8, 468.3, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit15-Global-Food-Security": [[0.35, 5.44, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [5.74, 8.78, "Hi! I'm Visal. Let's learn together!"], [9.08, 16.06, "Unit fifteen: Global Food Security. Today you will describe past expectations with the future in the past."], [16.36, 19.09, "Here is our lesson map. Let's start!"], [20.03, 23.41, "Part one: words. You will learn eight new words."], [24.25, 25.6, "Food insecurity."], [26.58, 31.51, "Food insecurity means not having reliable access to enough safe and nutritious food."], [32.12, 34.96, "Food insecurity rises when prices jump."], [35.55, 39.02, "Your turn. Say: Food insecurity."], [41.87, 43.3, "Food insecurity."], [44.05, 45.6, "Agricultural trade."], [46.58, 51.27, "Agricultural trade means the buying and selling of farm products between countries."], [51.85, 54.76, "Agricultural trade carries rice across the world."], [55.35, 58.38, "Your turn. Say: Agricultural trade."], [61.23, 63.01, "Agricultural trade."], [63.75, 64.68, "Crop yield."], [65.68, 69.49, "Crop yield means the amount of food grown on a given area of land."], [70.08, 72.16, "Better seeds raised the crop yield."], [72.75, 75.2, "Your turn. Say: Crop yield."], [78.07, 78.94, "Crop yield."], [79.68, 80.77, "Famine relief."], [81.75, 86.26, "Famine relief means emergency food and help sent to people facing mass hunger."], [86.85, 89.33, "Famine relief reached the region too late."], [89.92, 93.08, "Your turn. Say: Famine relief."], [95.93, 97.19, "Famine relief."], [97.95, 99.81, "Sustainable agriculture."], [100.82, 106.31, "Sustainable agriculture means farming that protects soil, water and future harvests."], [106.92, 109.94, "Sustainable agriculture keeps the soil healthy."], [110.55, 114.11, "Your turn. Say: Sustainable agriculture."], [116.97, 118.85, "Sustainable agriculture."], [119.62, 120.93, "Food supply chain."], [121.92, 126.47, "Food supply chain means all the steps that bring food from farms to tables."], [127.08, 130.08, "A broken food supply chain empties the shops."], [130.68, 134.33, "Your turn. Say: Food supply chain."], [137.2, 138.9, "Food supply chain."], [139.65, 140.91, "Global hunger."], [141.92, 145.58, "Global hunger means the widespread lack of enough food around the world."], [146.18, 148.8, "Global hunger increased after the wars."], [149.38, 152.49, "Your turn. Say: Global hunger."], [155.33, 156.62, "Global hunger."], [157.38, 158.88, "Climate resilience."], [159.88, 164.48, "Climate resilience means the ability to recover from the shocks of changing weather."], [165.08, 168.21, "Climate resilience protects small farms from floods."], [168.82, 172.07, "Your turn. Say: Climate resilience."], [174.93, 176.34, "Climate resilience."], [177.13, 181.21, "Part two: dialogue. Let's listen to a conversation."], [182.05, 188.8, "Visal, an article says 'Farmers thought the rains would return, but the drought was to last three years.' What is 'was to last'?"], [189.92, 200.7, "It is the future in the past: a past view of what came later. We use would, was going to or was to. 'Was to' often shows events we now know happened afterwards."], [201.78, 204.34, "What is the difference between would and was going to?"], [205.45, 216.87, "'Was going to' shows an earlier plan or sign: 'Aid was going to arrive, but the roads flooded.' 'Would' shows a past prediction: 'Experts warned prices would rise.'"], [217.98, 219.77, "Why is it useful in reporting?"], [220.88, 232.09, "It lets journalists describe what people expected at a past moment, often followed by 'but'. 'Harvests were due to improve, but the crop yield fell.'"], [233.23, 234.71, "Part three: grammar."], [235.55, 240.0, "Grammar focus: Future in the past: would and was going to and was to."], [240.3, 241.52, "Look at the pattern."], [242.22, 246.09, "Experts warned that food prices would rise after the harvest failed."], [246.98, 249.7, "Aid was going to arrive, but the roads flooded."], [250.62, 252.99, "The drought was to last for three more years."], [253.93, 262.83, "Use would, was going to, was due to or was to for the future seen from a past moment: Experts said prices would rise. Often followed by but."], [263.58, 267.08, "Be careful! Don't say: He said he will arrive late."], [269.03, 271.67, "Say: He said he would arrive late."], [271.97, 274.26, "Use would for the future in the past."], [275.07, 277.73, "Part four: reading. Read and listen."], [278.53, 279.91, "Feeding a Growing World."], [280.21, 285.47, "Food insecurity affects hundreds of millions of people, and global hunger remains stubborn."], [286.47, 291.57, "Farmers hoped the next crop yield would be larger, but a long drought was to destroy the harvest."], [292.57, 297.75, "Aid agencies said famine relief was going to arrive by sea, but conflict closed the ports."], [298.73, 304.79, "Sustainable agriculture and a stronger food supply chain give communities climate resilience."], [305.8, 312.1, "Fairer agricultural trade, supported by good policies, would make food more available when harvests fail."], [313.2, 317.07, "Part five: quiz. Five questions. Are you ready?"], [317.92, 321.6, "In 2019 analysts said that prices blank rise."], [321.9, 325.09, "A, will. B, would. C, are."], [328.63, 330.48, "The answer is B: would."], [331.62, 334.66, "The amount of food produced from a field is the crop blank."], [334.96, 338.02, "A, yield. B, debt. C, treaty."], [341.57, 343.43, "The answer is A: yield."], [344.58, 347.7, "Choose the sentence that expresses the future in the past."], [348.0, 355.12, "A, Prices will rise next year.. B, They said prices would rise the next year.. C, Prices rise next year.."], [358.67, 361.98, "The answer is B: They said prices would rise the next year.."], [363.12, 366.85, "The ability of farms to recover from climate shocks is climate blank."], [367.15, 370.87, "A, resilience. B, relief. C, trade."], [374.43, 376.48, "The answer is A: resilience."], [377.62, 381.67, "According to the reading, why did aid fail to arrive by sea?"], [381.97, 387.69, "A, conflict closed the ports. B, the harvest was large. C, prices fell."], [391.23, 394.22, "The answer is A: conflict closed the ports."], [395.43, 398.54, "Part six: speaking. It's your turn to talk."], [399.38, 403.59, "How might climate change threaten global food security in the coming decades?"], [412.38, 413.8, "Now listen to Visal."], [414.1, 440.97, "Climate change may threaten food security through longer droughts, floods and heat waves that reduce crop yield. Rising temperatures can also spread pests and damage fisheries. As harvests fail, prices rise and the poorest households suffer first. Sustainable agriculture, stronger food supply chains and fair agricultural trade can build climate resilience."], [441.27, 443.0, "Excellent answer, Visal!"], [443.88, 450.16, "Great work! Now you can use eight new words and future in the past: would and was going to and was to."], [450.46, 455.26, "Today's value is food responsibility. Value food and the people who produce it."], [455.56, 458.36, "See you in Unit sixteen. Goodbye!"], [458.66, 461.63, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit16-Energy-Diplomacy": [[0.35, 5.76, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.06, 9.62, "Hi! I'm Visal. Let's learn together!"], [9.92, 16.61, "Unit sixteen: Energy Diplomacy. Today you will link causes and results with owing to, thereby and thus."], [16.91, 19.59, "Here is our lesson map. Let's start!"], [20.53, 23.66, "Part one: words. You will learn eight new words."], [24.52, 26.04, "Energy security."], [27.05, 31.16, "Energy security means having reliable and affordable supplies of power."], [31.75, 34.59, "Energy security shapes foreign policy."], [35.18, 38.25, "Your turn. Say: Energy security."], [41.1, 42.52, "Energy security."], [43.28, 44.8, "Oil dependency."], [45.78, 50.21, "Oil dependency means relying heavily on oil for a country's energy needs."], [50.82, 54.35, "Oil dependency leaves economies exposed to price shocks."], [54.95, 57.87, "Your turn. Say: Oil dependency."], [60.73, 62.22, "Oil dependency."], [62.98, 64.82, "Renewable energy transition."], [65.82, 72.47, "Renewable energy transition means the shift from fossil fuels to sun, wind and other clean sources."], [73.08, 76.57, "The renewable energy transition is changing trade routes."], [77.18, 81.14, "Your turn. Say: Renewable energy transition."], [84.0, 86.46, "Renewable energy transition."], [87.22, 88.54, "Energy exporter."], [89.55, 94.12, "Energy exporter means a country that sells oil, gas or electricity abroad."], [94.72, 97.34, "The energy exporter signed a long contract."], [97.95, 100.68, "Your turn. Say: Energy exporter."], [103.53, 105.12, "Energy exporter."], [105.85, 107.63, "Pipeline politics."], [108.62, 113.29, "Pipeline politics means the use of energy pipelines as tools of political power."], [113.88, 116.75, "Pipeline politics divided the neighbouring states."], [117.35, 120.84, "Your turn. Say: Pipeline politics."], [123.7, 125.64, "Pipeline politics."], [126.38, 127.85, "Energy crisis."], [128.85, 133.89, "Energy crisis means a serious shortage or price shock in energy supplies."], [134.48, 137.44, "An energy crisis forced factories to close."], [138.05, 141.36, "Your turn. Say: Energy crisis."], [144.2, 145.82, "Energy crisis."], [146.55, 148.1, "Strategic reserve."], [149.08, 153.37, "Strategic reserve means a stock of fuel that a government keeps for emergencies."], [153.98, 156.88, "The strategic reserve covered three months of demand."], [157.48, 160.56, "Your turn. Say: Strategic reserve."], [163.4, 165.07, "Strategic reserve."], [165.82, 167.78, "Clean energy cooperation."], [168.78, 174.38, "Clean energy cooperation means countries working together on solar, wind and other clean power."], [174.98, 178.35, "Clean energy cooperation lowered the cost of batteries."], [178.95, 182.55, "Your turn. Say: Clean energy cooperation."], [185.4, 187.67, "Clean energy cooperation."], [188.47, 191.97, "Part two: dialogue. Let's listen to a conversation."], [192.82, 200.88, "Visal, an analyst writes 'Owing to the crisis, prices rose, thereby increasing pressure on governments.' What do 'owing to' and 'thereby' do?"], [201.98, 216.27, "'Owing to' and 'as a result of' are followed by a noun and show the cause. 'Thereby' + -ing shows the result of the action before it, with the same subject: prices rose, thereby increasing pressure."], [217.38, 218.88, "Can I use 'because' there?"], [219.98, 230.07, "'Because' needs a clause: 'because the crisis began'. 'Because of', 'due to' and 'owing to' need a noun phrase. Choose by what follows."], [231.18, 232.44, "What about 'thus'?"], [233.55, 244.22, "'Thus' and 'hence' are formal linkers for results: 'Supplies fell; thus, prices rose.' Put a semicolon or full stop before thus and a comma after it."], [245.37, 246.89, "Part three: grammar."], [247.75, 253.15, "Grammar focus: Cause and result: owing to and thereby plus -ing and thus."], [253.45, 254.65, "Look at the pattern."], [255.35, 260.87, "Owing to the energy crisis, prices rose sharply, thereby increasing pressure on governments."], [261.78, 266.85, "As a result of pipeline politics, supplies were cut, and several cities lost heat."], [267.75, 271.5, "Exporters raised output; thus, prices fell the following year."], [272.47, 281.01, "Use owing to / due to / as a result of + noun for causes, thereby + -ing for a result with the same subject, and thus / hence + comma as formal linkers."], [281.75, 285.25, "Be careful! Don't say: Owing to it rained, we stayed."], [287.2, 289.59, "Say: Owing to the rain, we stayed."], [289.89, 292.15, "After 'owing to', use a noun phrase."], [292.93, 295.74, "Part four: reading. Read and listen."], [296.53, 298.63, "Power, Pipelines and Politics."], [298.93, 304.69, "Energy security means having reliable and affordable power, and oil dependency can weaken it."], [305.7, 311.94, "Owing to pipeline politics, some countries have cut supplies, thereby gaining leverage over their customers."], [312.93, 319.94, "An energy exporter earns enormous income, and a strategic reserve gives importers time to react during an energy crisis."], [320.93, 327.67, "As a result of the renewable energy transition, new partnerships are emerging, thus changing old alliances."], [328.67, 334.01, "Clean energy cooperation spreads technology and lowers costs for everyone."], [335.1, 339.17, "Part five: quiz. Five questions. Are you ready?"], [340.02, 342.5, "blank the storm, the pipeline was closed."], [342.8, 346.18, "A, Because. B, Owing to. C, Although."], [349.73, 351.52, "The answer is B: Owing to."], [352.68, 355.63, "Which linker needs a noun phrase, not a clause?"], [355.94, 359.56, "A, because of. B, because. C, although."], [363.1, 365.17, "The answer is A: because of."], [366.32, 368.05, "Choose the correct sentence."], [368.35, 377.16, "A, Prices rose, thereby increase pressure.. B, Prices rose, thereby increasing pressure.. C, Prices rose, thereby increased pressure.."], [380.7, 384.5, "The answer is B: Prices rose, thereby increasing pressure.."], [385.65, 390.29, "A stock of oil that a government keeps for emergencies is a strategic blank."], [390.58, 394.03, "A, reserve. B, treaty. C, debris."], [397.57, 399.36, "The answer is A: reserve."], [400.52, 404.68, "According to the reading, what does a strategic reserve give importers?"], [404.98, 409.63, "A, time to react. B, extra tariffs. C, new borders."], [413.17, 415.25, "The answer is A: time to react."], [416.43, 419.76, "Part six: speaking. It's your turn to talk."], [420.62, 424.65, "How might a shift to renewable energy change global energy diplomacy?"], [433.45, 434.92, "Now listen to Visal."], [435.21, 465.76, "A shift to renewable energy could reduce the power of oil and gas exporters, because every country can generate some electricity from sun and wind. Energy security would depend more on technology, minerals and electricity networks than on pipeline politics. New partnerships may appear around clean energy cooperation, but countries rich in critical minerals could gain influence."], [466.06, 467.93, "Excellent answer, Visal!"], [468.82, 475.6, "Great work! Now you can use eight new words and cause and result: owing to and thereby plus -ing and thus."], [475.9, 480.97, "Today's value is strategic thinking. Think ahead, and choose your path with purpose."], [481.27, 484.2, "See you in Unit seventeen. Goodbye!"], [484.5, 487.49, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit17-Human-Trafficking": [[0.35, 5.92, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.22, 9.88, "Hi! I'm Visal. Let's learn together!"], [10.18, 17.02, "Unit seventeen: Human Trafficking. Today you will focus on victims with passive force, make and allow."], [17.32, 19.9, "Here is our lesson map. Let's start!"], [20.83, 23.8, "Part one: words. You will learn eight new words."], [24.65, 25.73, "Forced labor."], [26.72, 31.14, "Forced labor means work that a person is made to do under threat and without fair pay."], [31.75, 34.26, "Forced labor was found on the fishing boats."], [34.85, 37.73, "Your turn. Say: Forced labor."], [40.6, 41.71, "Forced labor."], [42.45, 43.71, "Trafficking victim."], [44.72, 49.33, "Trafficking victim means a person who is recruited or moved in order to be exploited."], [49.92, 52.32, "The trafficking victim received medical care."], [52.92, 56.12, "Your turn. Say: Trafficking victim."], [58.97, 60.39, "Trafficking victim."], [61.15, 62.26, "Exploitation."], [63.25, 67.42, "Exploitation means treating people unfairly to gain profit from their work."], [68.02, 71.12, "Exploitation often begins with false promises."], [71.72, 74.5, "Your turn. Say: Exploitation."], [77.33, 78.5, "Exploitation."], [79.25, 81.01, "Anti-trafficking law."], [82.02, 86.71, "Anti-trafficking law means a law that punishes traffickers and protects victims."], [87.32, 90.81, "The anti-trafficking law raised prison sentences."], [91.42, 94.87, "Your turn. Say: Anti-trafficking law."], [97.73, 99.33, "Anti-trafficking law."], [100.08, 101.46, "Modern slavery."], [102.45, 106.91, "Modern slavery means hidden forms of forced work and control that exist today."], [107.52, 110.14, "Modern slavery affects millions worldwide."], [110.75, 114.23, "Your turn. Say: Modern slavery."], [117.07, 118.59, "Modern slavery."], [119.35, 120.76, "Trafficking network."], [121.75, 126.16, "Trafficking network means an organised group that moves people for exploitation."], [126.75, 128.94, "Police broke up a trafficking network."], [129.55, 132.78, "Your turn. Say: Trafficking network."], [135.63, 137.78, "Trafficking network."], [138.55, 139.75, "Victim support."], [140.75, 146.31, "Victim support means help such as shelter, counselling and legal advice for survivors."], [146.92, 149.32, "Victim support helped her rebuild her life."], [149.92, 153.0, "Your turn. Say: Victim support."], [155.83, 157.26, "Victim support."], [158.02, 159.94, "International cooperation."], [160.95, 165.3, "International cooperation means countries working together to reach a shared goal."], [165.88, 168.92, "International cooperation led to the arrests."], [169.52, 172.99, "Your turn. Say: International cooperation."], [175.83, 178.16, "International cooperation."], [178.97, 182.88, "Part two: dialogue. Let's listen to a conversation."], [183.75, 188.94, "Visal, a report says 'Victims are forced to work without pay.' What structure is this?"], [190.05, 203.94, "It is the passive of force + object + to-infinitive. Active: 'Traffickers force victims to work.' The object becomes the subject, and the agent can be omitted: Victims are forced to work."], [205.05, 207.06, "Does 'make' follow the same pattern?"], [208.15, 219.84, "Almost. Active 'make' has no 'to': 'They made her work.' But the passive needs 'to': 'She was made to work.' 'Let' has no normal passive, so we say 'was allowed to'."], [220.95, 222.95, "Why is this structure useful?"], [224.05, 236.53, "It focuses on the victim and the harm, not on the trafficker. It is common in legal and news reports: 'Many are forced, deceived or pressured into leaving home.'"], [237.67, 239.38, "Part three: grammar."], [240.22, 244.74, "Grammar focus: Passive with force and make and allow plus to-infinitive."], [245.04, 246.26, "Look at the pattern."], [246.95, 249.26, "Victims are forced to work without pay."], [250.15, 252.46, "She was made to hand over her passport."], [253.35, 256.3, "Survivors should be allowed to stay and receive support."], [257.27, 266.99, "Active: make + object + base verb (They made her work). Passive: be made + to-infinitive (She was made to work). Use be allowed to, not be let to."], [267.75, 271.19, "Be careful! Don't say: She was made work all night."], [273.13, 275.69, "Say: She was made to work all night."], [275.99, 278.33, "The passive of make needs to + verb."], [279.13, 281.73, "Part four: reading. Read and listen."], [282.53, 283.92, "Behind the Hidden Crime."], [284.22, 288.18, "Modern slavery hides in farms, factories and homes in every region."], [289.17, 295.66, "A trafficking victim is often forced to work long hours for no pay, and exploitation is kept secret through threats."], [296.67, 301.74, "Trafficking networks cross borders, so police in different countries must share information."], [302.73, 307.87, "Anti-trafficking law should ensure that survivors are allowed to stay and receive victim support."], [308.87, 312.61, "Forced labor ends only when governments and communities work together."], [313.7, 317.82, "Part five: quiz. Five questions. Are you ready?"], [318.68, 320.95, "The workers blank to sign the contract."], [321.25, 324.73, "A, were made. B, were made sign. C, made."], [328.27, 330.1, "The answer is A: were made."], [331.25, 332.92, "Which sentence is correct?"], [333.22, 338.43, "A, She was let to leave.. B, She was allowed to leave.. C, She was allowed leave.."], [342.0, 344.25, "The answer is B: She was allowed to leave.."], [345.42, 348.97, "Work done under threat and without fair pay is blank labor."], [349.27, 352.53, "A, forced. B, skilled. C, paid."], [356.07, 357.75, "The answer is A: forced."], [358.92, 362.96, "An organised group that moves victims across borders is a trafficking blank."], [363.26, 366.86, "A, network. B, reserve. C, bloc."], [370.4, 372.32, "The answer is A: network."], [373.48, 377.05, "According to the reading, how is exploitation kept secret?"], [377.35, 381.84, "A, through threats. B, through advertising. C, through tariffs."], [385.4, 387.45, "The answer is A: through threats."], [388.63, 391.79, "Part six: speaking. It's your turn to talk."], [392.65, 397.37, "Why does fighting human trafficking require cooperation across many different countries?"], [406.15, 407.6, "Now listen to Visal."], [407.9, 434.97, "Human trafficking requires cooperation because victims are often recruited in one country, moved through another and exploited in a third. Traffickers use these borders to avoid arrest. Countries must share intelligence, harmonise anti-trafficking laws and protect victims wherever they are found. Without international cooperation, criminals simply move to the weakest place."], [435.27, 436.89, "Excellent answer, Visal!"], [437.78, 443.55, "Great work! Now you can use eight new words and passive with force and make and allow plus to-infinitive."], [443.85, 449.15, "Today's value is human dignity. Every person deserves respect wherever they are."], [449.45, 452.28, "See you in Unit eighteen. Goodbye!"], [452.58, 455.58, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit18-Global-Public-Health": [[0.35, 6.27, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.57, 10.24, "Hi! I'm Visal. Let's learn together!"], [10.54, 16.19, "Unit eighteen: Global Public Health. Today you will describe data and trends precisely."], [16.49, 19.05, "Here is our lesson map. Let's start!"], [20.0, 23.2, "Part one: words. You will learn eight new words."], [24.05, 25.55, "Disease eradication."], [26.55, 30.4, "Disease eradication means the complete removal of a disease from the world."], [30.98, 33.68, "Disease eradication ended smallpox."], [34.28, 37.57, "Your turn. Say: Disease eradication."], [40.43, 41.95, "Disease eradication."], [42.68, 44.38, "Vaccination campaign."], [45.38, 50.6, "Vaccination campaign means an organised effort to vaccinate large numbers of people."], [51.18, 54.2, "A vaccination campaign reached remote villages."], [54.82, 58.28, "Your turn. Say: Vaccination campaign."], [61.13, 62.84, "Vaccination campaign."], [63.58, 65.35, "Healthcare infrastructure."], [66.35, 72.17, "Healthcare infrastructure means the clinics, hospitals, roads and equipment that support health services."], [72.78, 75.99, "Healthcare infrastructure improved in rural areas."], [76.58, 79.92, "Your turn. Say: Healthcare infrastructure."], [82.77, 84.65, "Healthcare infrastructure."], [85.42, 86.78, "Epidemiology."], [87.78, 91.84, "Epidemiology means the study of how diseases spread in populations."], [92.45, 95.16, "Epidemiology showed where the outbreak began."], [95.75, 98.41, "Your turn. Say: Epidemiology."], [101.27, 102.65, "Epidemiology."], [103.42, 104.87, "Global health fund."], [105.88, 110.23, "Global health fund means an international pool of money used to fight disease."], [110.82, 113.35, "A global health fund paid for the medicines."], [113.95, 117.17, "Your turn. Say: Global health fund."], [120.03, 121.88, "Global health fund."], [122.62, 124.14, "Health workforce."], [125.15, 130.02, "Health workforce means all the doctors, nurses and community workers in a health system."], [130.62, 132.8, "The health workforce needs more training."], [133.42, 136.71, "Your turn. Say: Health workforce."], [139.57, 141.09, "Health workforce."], [141.85, 143.33, "Preventable disease."], [144.32, 149.09, "Preventable disease means an illness that can be stopped by vaccines or basic care."], [149.68, 151.72, "Measles is a preventable disease."], [152.32, 155.2, "Your turn. Say: Preventable disease."], [158.07, 159.45, "Preventable disease."], [160.22, 161.96, "Health system strengthening."], [162.95, 167.18, "Health system strengthening means improving the structures that deliver health care."], [167.78, 170.93, "Health system strengthening saves lives for decades."], [171.52, 174.83, "Your turn. Say: Health system strengthening."], [177.67, 179.79, "Health system strengthening."], [180.6, 184.03, "Part two: dialogue. Let's listen to a conversation."], [184.88, 192.95, "Visal, a report says 'Child deaths fell by two thirds, accounting for millions of saved lives.' How do I describe statistics like this?"], [194.05, 205.53, "Use precise verbs and fractions: fell by two thirds, doubled, rose sharply, accounted for 40 percent. A threefold increase means three times as much."], [206.62, 208.78, "What is the difference between by and to?"], [209.88, 222.22, "'Cases fell by half' shows the size of the change. 'Cases fell to 5,000' shows the new level. 'From 10,000 to 5,000' shows both. The meanings are not the same."], [223.32, 225.05, "Any tips for comparison?"], [226.15, 237.51, "Use 'twice as many', 'three times higher than', 'a fraction of' and 'the vast majority of'. Add a source, such as 'according to the data', to sound reliable."], [238.67, 240.17, "Part three: grammar."], [241.02, 246.45, "Grammar focus: Describing data: fell by and rose to and accounted for."], [246.75, 248.04, "Look at the pattern."], [248.75, 251.6, "Child deaths fell by two thirds in thirty years."], [252.48, 255.75, "Vaccination coverage rose to ninety percent of children."], [256.65, 259.96, "Preventable disease accounted for nearly half of all deaths."], [260.9, 269.98, "By shows the size of a change (fell by half); to shows the new level (fell to 5,000); accounted for shows a share. Add a source to sound credible."], [270.75, 275.1, "Be careful! Don't say: Deaths accounted by half of cases."], [277.03, 279.97, "Say: Deaths accounted for half of cases."], [280.27, 282.37, "Use 'accounted for' to show a share."], [283.17, 285.92, "Part four: reading. Read and listen."], [286.73, 288.06, "Reading the Numbers."], [288.36, 292.84, "Epidemiology uses data to show how disease spreads and how it can be stopped."], [293.83, 301.88, "A vaccination campaign can raise coverage from half of children to nearly all, and cases of a preventable disease may fall by ninety percent."], [302.87, 307.79, "Disease eradication is rare, but smallpox was removed after cases fell to zero."], [308.8, 316.44, "A global health fund, together with a strong health workforce and better healthcare infrastructure, accounts for much of this progress."], [317.43, 323.01, "Health system strengthening matters because gains can disappear if funding falls by even a small amount."], [324.1, 327.97, "Part five: quiz. Five questions. Are you ready?"], [328.82, 332.2, "Cases fell blank half, from 800 to 400."], [332.5, 335.4, "A, by. B, to. C, at."], [338.93, 340.51, "The answer is A: by."], [341.65, 344.66, "Cases fell blank 400, from 800."], [344.96, 347.89, "A, by. B, to. C, for."], [351.43, 353.14, "The answer is B: to."], [354.28, 356.9, "A threefold increase means the number became blank."], [357.2, 361.42, "A, three times as large. B, one third. C, three more."], [364.97, 368.23, "The answer is A: three times as large."], [369.38, 372.64, "The study of how diseases spread in populations is blank."], [372.94, 377.79, "A, epidemiology. B, diplomacy. C, irrigation."], [381.33, 383.58, "The answer is A: epidemiology."], [384.72, 388.76, "According to the reading, what made smallpox eradication possible?"], [389.06, 394.22, "A, cases fell to zero. B, tariffs rose. C, a new oil treaty."], [397.77, 400.76, "The answer is A: cases fell to zero."], [401.97, 404.97, "Part six: speaking. It's your turn to talk."], [405.82, 410.1, "What has been one of the greatest successes in the history of global public health?"], [418.92, 420.32, "Now listen to Visal."], [420.62, 448.47, "One of the greatest successes is the eradication of smallpox, which was declared over in 1980. A worldwide vaccination campaign, careful disease surveillance and cooperation between countries cut the cases to zero. It killed millions of people in earlier centuries, so its end shows what a global health fund, trained health workers and shared data can achieve."], [448.77, 450.54, "Excellent answer, Visal!"], [451.45, 458.47, "Great work! Now you can use eight new words and describing data: fell by and rose to and accounted for."], [458.77, 463.63, "Today's value is evidence-based judgment. Let good evidence guide what you decide."], [463.93, 466.66, "See you in Unit nineteen. Goodbye!"], [466.96, 469.54, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit19-Future-of-Global-Governance": [[0.35, 5.58, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [5.88, 9.52, "Hi! I'm Visal. Let's learn together!"], [9.82, 16.18, "Unit nineteen: Future of Global Governance. Today you will evaluate reforms with the extent / degree to which."], [16.48, 19.0, "Here is our lesson map. Let's start!"], [19.97, 23.2, "Part one: words. You will learn eight new words."], [24.05, 25.91, "International institution."], [26.92, 33.1, "International institution means a permanent organisation created by several countries to work together."], [33.68, 36.88, "Each international institution has its own rules."], [37.48, 40.96, "Your turn. Say: International institution."], [43.8, 45.68, "International institution."], [46.45, 47.83, "Multilateralism."], [48.85, 53.71, "Multilateralism means the practice of countries solving problems together through shared rules."], [54.32, 57.23, "Multilateralism helped to end the crisis."], [57.85, 61.12, "Your turn. Say: Multilateralism."], [63.97, 65.48, "Multilateralism."], [66.22, 67.81, "Global cooperation."], [68.82, 73.37, "Global cooperation means nations working together to deal with worldwide problems."], [73.98, 76.97, "Global cooperation reduced the spread of disease."], [77.58, 80.68, "Your turn. Say: Global cooperation."], [83.53, 85.22, "Global cooperation."], [85.98, 87.34, "Reform proposal."], [88.35, 92.96, "Reform proposal means a suggested plan to change how an organisation works."], [93.55, 96.44, "The reform proposal would enlarge the council."], [97.05, 100.14, "Your turn. Say: Reform proposal."], [103.0, 104.53, "Reform proposal."], [105.28, 106.5, "Emerging power."], [107.52, 112.37, "Emerging power means a country whose economic and political influence is growing fast."], [112.98, 115.83, "Every emerging power wants a stronger voice."], [116.42, 119.47, "Your turn. Say: Emerging power."], [122.33, 123.67, "Emerging power."], [124.42, 125.71, "Global challenge."], [126.72, 131.04, "Global challenge means a serious problem that affects many countries at once."], [131.65, 133.85, "Climate change is a global challenge."], [134.45, 137.29, "Your turn. Say: Global challenge."], [140.13, 141.56, "Global challenge."], [142.32, 144.15, "Institutional legitimacy."], [145.15, 150.66, "Institutional legitimacy means the public belief that an institution has the right to make decisions."], [151.25, 154.6, "Institutional legitimacy depends on fair procedures."], [155.18, 159.0, "Your turn. Say: Institutional legitimacy."], [161.83, 163.72, "Institutional legitimacy."], [164.48, 165.72, "Collective action."], [166.72, 170.91, "Collective action means people or states acting together to reach a shared goal."], [171.52, 173.87, "Collective action protected the ozone layer."], [174.45, 177.5, "Your turn. Say: Collective action."], [180.33, 181.79, "Collective action."], [182.6, 186.39, "Part two: dialogue. Let's listen to a conversation."], [187.25, 193.63, "Visal, a scholar writes 'The extent to which institutions reflect today's world is debatable.' What is 'the extent to which'?"], [194.72, 206.89, "It is a formal noun phrase meaning 'how far'. 'The extent to which' and 'the degree to which' introduce a clause that is the subject: The degree to which power is shared affects legitimacy."], [207.98, 209.55, "Why is 'to' before 'which'?"], [210.65, 223.16, "The clause comes from 'institutions reflect the world to some extent'. In formal English the preposition moves in front of 'which': the extent to which, the way in which, the reason for which."], [224.25, 225.98, "Can I use it in questions?"], [227.08, 238.41, "Yes, in essays: 'To what extent should emerging powers have more influence?' It invites balanced evaluation, which is useful for discussing reform proposals."], [239.57, 241.19, "Part three: grammar."], [242.05, 245.99, "Grammar focus: The extent and degree to which plus clause."], [246.29, 247.51, "Look at the pattern."], [248.22, 252.17, "The extent to which institutions reflect today's world is widely debated."], [253.08, 257.5, "The degree to which emerging powers are heard affects institutional legitimacy."], [258.38, 261.74, "The way in which decisions are made determines public trust."], [262.7, 271.44, "Use the extent / degree to which + clause as a formal subject meaning 'how far'. The preposition comes before which: the way in which, the reason for which."], [272.18, 275.83, "Be careful! Don't say: The extent which to it works varies."], [277.8, 280.94, "Say: The extent to which it works varies."], [281.24, 283.23, "Put the preposition before 'which'."], [284.03, 286.8, "Part four: reading. Read and listen."], [287.6, 289.63, "Rebuilding Global Institutions."], [289.93, 296.82, "Most international institutions were designed after 1945, when the world looked very different."], [297.83, 302.63, "The extent to which they reflect today's emerging powers is one of the biggest reform questions."], [303.63, 308.5, "The degree to which a reform proposal can win support depends on institutional legitimacy."], [309.5, 314.86, "Multilateralism works only if the way in which decisions are made seems fair to everyone."], [315.87, 322.57, "Facing a global challenge such as climate change, collective action and global cooperation are no longer optional."], [323.67, 327.55, "Part five: quiz. Five questions. Are you ready?"], [328.42, 331.75, "The extent blank institutions are fair is debated."], [332.05, 335.4, "A, to which. B, which. C, of that."], [338.97, 340.81, "The answer is A: to which."], [341.95, 344.76, "The way blank decisions are made affects trust."], [345.06, 348.4, "A, which in. B, in which. C, that in."], [351.97, 353.76, "The answer is B: in which."], [354.92, 356.61, "Choose the correct sentence."], [356.91, 365.41, "A, The degree to which power is shared matters.. B, The degree which to power is shared matters.. C, The degree to that power is shared matters.."], [368.97, 372.56, "The answer is A: The degree to which power is shared matters.."], [373.72, 378.0, "A state that is gaining economic and political influence is an blank power."], [378.3, 381.54, "A, fading. B, emerging. C, neutral."], [385.1, 387.33, "The answer is B: emerging."], [388.48, 391.71, "According to the reading, when were most institutions designed?"], [392.01, 398.98, "A, after 1945. B, after 2000. C, before 1900."], [402.53, 405.72, "The answer is A: after 1945."], [406.93, 410.24, "Part six: speaking. It's your turn to talk."], [411.08, 415.71, "What is one reform you would make to how international institutions operate today?"], [424.52, 425.85, "Now listen to Visal."], [426.15, 455.56, "One reform I would make is to give emerging powers and smaller regions a fairer voice in key decisions, for example by reforming the Security Council. Institutions gain legitimacy when their structure reflects the present world rather than 1945. A fairer system would improve trust, make collective action easier and encourage countries to follow the rules they helped to write."], [455.86, 457.71, "Excellent answer, Visal!"], [458.62, 463.92, "Great work! Now you can use eight new words and the extent and degree to which plus clause."], [464.22, 469.67, "Today's value is strategic vision. See the bigger picture, and plan for where you want to be."], [469.97, 472.55, "See you in Unit twenty. Goodbye!"], [472.85, 475.99, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit20-ASEAN-and-Southeast-Asia": [[0.35, 5.7, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.0, 9.38, "Hi! I'm Visal. Let's learn together!"], [9.69, 17.42, "Unit twenty: ASEAN and Southeast Asia. Today you will add information about places, times and reasons with where, when and why."], [17.72, 20.59, "Here is our lesson map. Let's start!"], [21.53, 24.87, "Part one: words. You will learn eight new words."], [25.72, 26.62, "ASEAN."], [27.62, 32.07, "ASEAN means the Association of Southeast Asian Nations, a regional group."], [32.65, 35.6, "ASEAN was founded in 1967."], [36.22, 38.8, "Your turn. Say: ASEAN."], [41.63, 42.32, "ASEAN."], [43.08, 44.22, "Member states."], [45.22, 48.67, "Member states means the countries that belong to an organisation."], [49.28, 51.13, "The member states meet every year."], [51.72, 54.87, "Your turn. Say: Member states."], [57.73, 59.09, "Member states."], [59.85, 61.08, "Cooperation."], [62.08, 65.35, "Cooperation means working together to achieve a shared goal."], [65.95, 68.19, "Cooperation made the project possible."], [68.78, 71.9, "Your turn. Say: Cooperation."], [74.77, 75.89, "Cooperation."], [76.65, 77.45, "Summit."], [78.45, 81.03, "Summit means a high-level meeting of leaders."], [81.62, 83.71, "The summit ended with a joint statement."], [84.32, 86.81, "Your turn. Say: Summit."], [89.67, 90.68, "Summit."], [91.42, 92.13, "Trade."], [93.12, 96.42, "Trade means the buying and selling of goods and services."], [97.02, 98.87, "Trade between neighbours has grown."], [99.45, 101.91, "Your turn. Say: Trade."], [104.77, 105.5, "Trade."], [106.25, 107.03, "Region."], [108.02, 112.15, "Region means a large area of the world with shared geography or culture."], [112.75, 115.02, "The region includes ten countries."], [115.62, 118.06, "Your turn. Say: Region."], [120.9, 121.75, "Region."], [122.52, 123.77, "Consensus."], [124.78, 127.92, "Consensus means general agreement among all members."], [128.52, 130.61, "Decisions are made by consensus."], [131.22, 134.02, "Your turn. Say: Consensus."], [136.87, 138.06, "Consensus."], [138.82, 140.0, "Integration."], [141.02, 145.55, "Integration means joining separate economies or societies more closely together."], [146.15, 148.68, "Economic integration lowered costs."], [149.28, 151.89, "Your turn. Say: Integration."], [154.73, 155.87, "Integration."], [156.67, 160.77, "Part two: dialogue. Let's listen to a conversation."], [161.62, 167.78, "Visal, a textbook says 'A summit is a meeting where leaders make decisions.' Why 'where' and not 'which'?"], [168.88, 181.58, "'Where' is a relative adverb. It replaces 'in which' for places: the city where leaders meet. 'When' replaces 'in which' for times: the year when ASEAN began. 'Why' follows 'reason'."], [182.68, 184.07, "Can I leave the word out?"], [185.18, 197.76, "Often yes for when and why: 'the reason (why) members agree', 'the day (when) they signed'. But 'where' is usually kept after a place noun. Say 'the country where', not 'the country which in'."], [198.85, 200.59, "Can you give an ASEAN example?"], [201.68, 211.32, "'Phnom Penh is the city where the summit took place.' 'Consensus is the reason why decisions take time.' 'It was a time when members wanted peace.'"], [212.47, 214.63, "Part three: grammar."], [215.48, 219.72, "Grammar focus: Relative adverbs: where and when and why."], [220.02, 221.19, "Look at the pattern."], [221.88, 225.06, "A summit is a meeting where leaders make decisions together."], [225.95, 229.5, "1967 was the year when ASEAN was founded."], [230.42, 233.79, "Consensus is the reason why decisions sometimes take time."], [234.73, 241.96, "Use where after a place noun, when after a time noun and why after reason. They replace in which / at which and make the sentence shorter."], [242.72, 246.22, "Be careful! Don't say: The city which I was born is big."], [248.17, 250.48, "Say: The city where I was born is big."], [250.78, 252.8, "Use 'where' after a place noun."], [253.6, 256.29, "Part four: reading. Read and listen."], [257.1, 259.03, "ASEAN in Southeast Asia."], [259.33, 264.44, "ASEAN is a group of member states in Southeast Asia that cooperate on trade and security."], [265.43, 271.38, "1967 was the year when five countries founded it, and Cambodia later joined the family."], [272.37, 276.35, "A summit is a meeting where leaders discuss integration and sign agreements."], [277.37, 283.42, "Consensus is the reason why decisions can be slow, but it also protects the interests of smaller members."], [284.43, 288.89, "Cooperation in a region where millions of people trade every day brings peace and growth."], [290.0, 294.13, "Part five: quiz. Five questions. Are you ready?"], [294.98, 297.8, "Siem Reap is a city blank many tourists stay."], [298.1, 301.29, "A, where. B, when. C, why."], [304.83, 306.61, "The answer is A: where."], [307.75, 311.43, "2025 was the year blank the summit took place."], [311.73, 314.49, "A, where. B, when. C, why."], [318.03, 319.8, "The answer is B: when."], [320.95, 322.62, "Choose the correct sentence."], [322.92, 330.54, "A, This is the reason why we agreed.. B, This is the reason where we agreed.. C, This is the reason when we agreed.."], [334.1, 337.54, "The answer is A: This is the reason why we agreed.."], [338.68, 342.39, "A decision that everyone accepts without a vote is made by blank."], [342.69, 346.61, "A, tariff. B, consensus. C, debris."], [350.17, 352.62, "The answer is B: consensus."], [353.78, 357.2, "According to the reading, in which year did five countries found ASEAN?"], [357.5, 364.67, "A, 1967. B, 1999. C, 2015."], [368.23, 371.73, "The answer is A: 1967."], [372.93, 375.93, "Part six: speaking. It's your turn to talk."], [376.78, 379.48, "How does ASEAN membership benefit Cambodia?"], [388.28, 389.74, "Now listen to Visal."], [390.04, 414.93, "ASEAN membership gives Cambodia access to a large regional market through trade agreements, which helps exports and investment. It also provides a place where Cambodia can speak at summits as an equal member state and work with neighbours on security, tourism and development. Regional integration builds peace and shares skills, which supports long-term growth."], [415.23, 417.0, "Excellent answer, Visal!"], [417.9
