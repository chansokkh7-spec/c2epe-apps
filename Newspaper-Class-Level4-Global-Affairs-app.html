                19: { title: "Digital & Multimedia Texts", terms: ["Hypertext", "Multimedia element", "Interactive text", "Digital publishing", "Nonlinear reading", "Embedded media", "Digital annotation", "Reader engagement"], passage: "Digital and multimedia texts use hypertext and embedded media to create a genuinely interactive text. Digital publishing supports nonlinear reading and digital annotation, reshaping reader engagement compared to traditional print.", question: "How does reading a nonlinear, interactive digital text change the reading experience compared to a book?", funfact: "Did you know? Hypertext, the foundation of nearly all digital reading today, was first theorized decades before the internet became widely available." },
                20: { title: "Travel Writing", terms: ["Travel writing", "Journey", "Description", "Culture", "Narrative", "Observation", "Place", "Perspective"], passage: "Travel writing combines narrative with detailed description of place and culture. Careful observation and an honest perspective turn a journey into a meaningful story for readers.", question: "Which place would you most like to write about?", funfact: "Did you know? The 14th-century traveller Ibn Battuta journeyed tens of thousands of kilometres and recorded his travels in a famous book." },
                21: { title: "Science Journalism", terms: ["Science journalism", "Research", "Evidence", "Uncertainty", "Explain", "Expert", "Accuracy", "Public understanding"], passage: "Science journalism helps public understanding by explaining new research. Good reporters check evidence, quote an independent expert and explain uncertainty rather than exaggerating results, protecting accuracy.", question: "Why do science headlines sometimes exaggerate findings?", funfact: "Did you know? A single study rarely proves something — good science reporting explains how a new result fits with earlier research." },
                22: { title: "Book Reviews", terms: ["Review", "Summary", "Evaluation", "Plot", "Style", "Recommendation", "Critic", "Reader"], passage: "A book review gives a brief summary of the plot without spoilers, followed by evaluation of style and ideas. The critic ends with a recommendation to help the reader decide.", question: "What should a good book review include?", funfact: "Did you know? The New York Times Book Review was first published in 1896." },
                23: { title: "Speeches and Oratory", terms: ["Speech", "Oratory", "Audience", "Rhetoric", "Repetition", "Delivery", "Persuasion", "Historic"], passage: "Great oratory moves an audience. A historic speech uses rhetoric such as repetition, strong delivery and a clear message to achieve persuasion.", question: "Which famous speech do you find most powerful?", funfact: "Did you know? Martin Luther King Jr.'s 'I Have a Dream' speech was delivered in Washington, D.C., in 1963." },
                24: { title: "Data Journalism", terms: ["Data journalism", "Dataset", "Chart", "Analysis", "Trend", "Transparency", "Visualisation", "Evidence"], passage: "Data journalism uses a dataset and careful analysis to find each trend. A clear chart or visualisation presents evidence, and transparency about methods builds trust.", question: "How can data make a news story stronger?", funfact: "Did you know? In the 1850s, Florence Nightingale used innovative diagrams to show that many soldiers were dying from preventable disease." },
                25: { title: "Writing an Academic Essay", terms: ["Essay", "Thesis", "Paragraph", "Evidence", "Analysis", "Counterargument", "Conclusion", "Citation"], passage: "An academic essay starts with a clear thesis. Each paragraph presents evidence and analysis, a counterargument shows balance, and a strong conclusion and accurate citation complete the work.", question: "What is the hardest part of writing an essay for you?", funfact: "Did you know? The essay form is often traced to Michel de Montaigne, who published his 'Essais' in 1580." },
            },
        };
        Object.values(curriculum).forEach(g => Object.values(g).forEach(d => { d.vocab = d.terms; d.story = d.passage; }));

        const minWords = () => MIN_WORDS[state.level] || 3;
        function allTermsForLevel(level) {
            let words = [];

            return [...new Set(words)];

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_newspaper_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

        // On phones the lesson sits below the module list, so after choosing a module, a unit
        // or the next lesson, the page scrolls to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');

        function completeActivity() {
            markActivityComplete(state.tab);

            let gotBadge = false;

            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');

            const levelData = curriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % unitNumbers.length;
            state.unit = unitNumbers[nextIdx];
            document.getElementById('unit-select').value = state.unit;
            renderContent();
            scrollToLesson(true);

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }
        const countWords = (s) => (String(s).match(/[A-Za-z\u00C0-\u024F\u1780-\u17FF]+(?:['’-][A-Za-z]+)*/g) || []).length;

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function allVocabForLevel(level) {
            let words = [];
            Object.keys(curriculum[level]).forEach(u => words.push(...curriculum[level][u].vocab));
            return [...new Set(words)];
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }

        // Stops the video and its timers whenever the student leaves the Video tab or changes unit

            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;

        const SUBTITLES = {"OC-NP4-Unit01-Geopolitics": [[0.35, 5.88, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.18, 9.61, "Hi! I'm Visal. Let's learn together!"], [9.9, 15.81, "Unit one: Geopolitics. Today you will highlight key causes and actors with it-cleft sentences."], [16.11, 18.63, "Here is our lesson map. Let's start!"], [19.57, 22.8, "Part one: words. You will learn eight new words."], [23.65, 24.78, "Geopolitical."], [25.78, 31.18, "Geopolitical means relating to how geography and politics affect power between countries."], [31.78, 34.57, "Geopolitical rivalry shaped the whole century."], [35.18, 37.72, "Your turn. Say: Geopolitical."], [40.57, 41.86, "Geopolitical."], [42.62, 44.1, "Sphere of influence."], [45.12, 49.65, "Sphere of influence means an area where one country has strong political control."], [50.25, 52.84, "The empire protected its sphere of influence."], [53.45, 56.8, "Your turn. Say: Sphere of influence."], [59.63, 61.82, "Sphere of influence."], [62.58, 64.25, "Strategic interest."], [65.25, 69.66, "Strategic interest means something a country must protect to stay safe or powerful."], [70.25, 72.91, "Secure trade routes are a strategic interest."], [73.52, 77.13, "Your turn. Say: Strategic interest."], [79.97, 81.7, "Strategic interest."], [82.45, 83.6, "Border dispute."], [84.62, 88.91, "Border dispute means a disagreement between countries about where a frontier lies."], [89.52, 92.11, "A border dispute closed the mountain crossing."], [92.72, 96.1, "Your turn. Say: Border dispute."], [98.97, 100.27, "Border dispute."], [101.02, 102.24, "Power balance."], [103.25, 107.78, "Power balance means a situation in which no country is strong enough to dominate."], [108.38, 110.71, "The power balance kept the peace for decades."], [111.32, 114.22, "Your turn. Say: Power balance."], [117.07, 118.37, "Power balance."], [119.12, 120.41, "Regional stability."], [121.42, 126.24, "Regional stability means a calm situation in which a whole area stays peaceful."], [126.85, 129.75, "Regional stability attracts foreign investment."], [130.35, 133.37, "Your turn. Say: Regional stability."], [136.23, 137.77, "Regional stability."], [138.52, 139.68, "Superpower."], [140.68, 145.13, "Superpower means a country with enormous military and economic strength."], [145.72, 148.38, "Each superpower tried to win new allies."], [148.98, 151.57, "Your turn. Say: Superpower."], [154.4, 155.37, "Superpower."], [156.12, 157.16, "Alliance."], [158.15, 161.62, "Alliance means an agreement between countries to support each other."], [162.22, 164.68, "The alliance promised to defend every member."], [165.28, 167.91, "Your turn. Say: Alliance."], [170.77, 171.97, "Alliance."], [172.77, 176.57, "Part two: dialogue. Let's listen to a conversation."], [177.42, 185.42, "Visal, an analyst writes 'It is the balance of power that keeps the region stable.' Why not simply say 'The balance of power keeps the region stable'?"], [186.52, 199.35, "The it-cleft puts focus on one part. It is + focused element + that/who + the rest. It shows exactly what matters: it is the alliance that deters attack."], [200.45, 202.8, "Can we focus on time or place too?"], [203.88, 219.35, "Yes: 'It was in 1991 that the superpower collapsed' or 'It is in border areas that disputes begin'. For people we can use who: It was the leaders who refused."], [220.45, 222.07, "When do journalists use it?"], [223.15, 234.24, "To correct a belief or stress a cause: 'It is not the army but the alliance that protects them.' It adds emphasis without changing the facts."], [235.4, 237.04, "Part three: grammar."], [237.88, 242.36, "Grammar focus: It-cleft: It is plus focus plus that and who."], [242.66, 243.96, "Look at the pattern."], [244.65, 247.61, "It is the balance of power that keeps the region stable."], [248.52, 252.4, "It was in 1991 that the superpower collapsed."], [253.28, 255.78, "It was the leaders who refused to compromise."], [256.73, 264.1, "To stress one part, use It is / was + the focused part + that (who for people). It adds emphasis only, not new information."], [264.85, 269.53, "Be careful! Don't say: It was in 1991 what the state fell."], [271.5, 274.92, "Say: It was in 1991 that the state fell."], [275.22, 277.47, "In a cleft, use 'that' (or 'who' for people)."], [278.27, 280.79, "Part four: reading. Read and listen."], [281.6, 282.92, "Why Borders Matter."], [283.22, 286.7, "Geopolitical analysts study how geography shapes power."], [287.7, 291.96, "It is often a border dispute that turns a quiet rivalry into a crisis."], [292.97, 298.76, "A superpower defends its sphere of influence because its strategic interest depends on friendly neighbours."], [299.77, 304.43, "It is the power balance, rather than goodwill, that usually preserves regional stability."], [305.43, 310.61, "Alliances matter for the same reason: it is collective strength that discourages aggression."], [311.7, 315.6, "Part five: quiz. Five questions. Are you ready?"], [316.45, 318.72, "It was the leaders blank refused to talk."], [319.02, 322.37, "A, who. B, which. C, what."], [325.93, 327.77, "The answer is A: who."], [328.92, 332.45, "A group of countries that agree to defend each other is an blank."], [332.75, 337.11, "A, border dispute. B, alliance. C, superpower."], [340.67, 342.77, "The answer is B: alliance."], [343.92, 347.97, "The area where a powerful country has most control is its sphere of blank."], [348.27, 352.18, "A, stability. B, interest. C, influence."], [355.73, 358.23, "The answer is C: influence."], [359.38, 361.52, "Choose the correct cleft sentence."], [361.82, 368.73, "A, It the treaty that ended the war.. B, It was the treaty that ended the war.. C, Was it the treaty ended the war.."], [372.27, 375.51, "The answer is B: It was the treaty that ended the war.."], [376.65, 380.35, "According to the reading, what usually preserves regional stability?"], [380.64, 385.0, "A, goodwill. B, the power balance. C, a border dispute."], [388.53, 391.23, "The answer is B: the power balance."], [392.43, 395.48, "Part six: speaking. It's your turn to talk."], [396.32, 399.77, "How can a border dispute affect an entire region's stability?"], [408.58, 409.98, "Now listen to Visal."], [410.28, 435.72, "A border dispute can weaken regional stability because neighbouring countries often take sides. Trade routes may close, armies may gather and refugees may cross the frontier. Other powers, such as a superpower or an alliance, may become involved, which raises the risk of a wider conflict. Clear diplomacy and agreements on the border can calm the situation before it spreads."], [436.02, 437.77, "Excellent answer, Visal!"], [438.68, 444.92, "Great work! Now you can use eight new words and it-cleft: it is plus focus plus that and who."], [445.22, 450.32, "Today's value is global perspective. Local stories can carry universal truths."], [450.62, 453.23, "See you in Unit two. Goodbye!"], [453.53, 456.47, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit02-International-Organizations": [[0.35, 5.83, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.13, 9.69, "Hi! I'm Visal. Let's learn together!"], [9.99, 16.85, "Unit two: International Organizations. Today you will combine ideas efficiently with participle clauses."], [17.15, 19.83, "Here is our lesson map. Let's start!"], [20.77, 24.16, "Part one: words. You will learn eight new words."], [25.02, 26.41, "United Nations."], [27.42, 32.39, "United Nations means the world organisation of countries that works for peace and cooperation."], [32.98, 36.84, "The United Nations was founded in 1945."], [37.45, 40.22, "Your turn. Say: United Nations."], [43.07, 44.51, "United Nations."], [45.25, 46.45, "Multilateral."], [47.45, 50.45, "Multilateral means involving three or more countries."], [51.05, 53.76, "A multilateral agreement needs many signatures."], [54.35, 57.14, "Your turn. Say: Multilateral."], [60.0, 61.27, "Multilateral."], [62.02, 63.22, "Member state."], [64.22, 68.44, "Member state means a country that belongs to an international organisation."], [69.05, 70.92, "Every member state has one vote."], [71.52, 74.31, "Your turn. Say: Member state."], [77.17, 78.39, "Member state."], [79.15, 80.17, "Peacekeeping."], [81.18, 85.41, "Peacekeeping means the use of international forces to keep fighting from restarting."], [86.02, 88.47, "Peacekeeping reduced violence in the region."], [89.08, 91.78, "Your turn. Say: Peacekeeping."], [94.63, 95.68, "Peacekeeping."], [96.42, 98.35, "International cooperation."], [99.35, 104.03, "International cooperation means countries working together to reach shared goals."], [104.62, 107.67, "International cooperation ended the epidemic."], [108.28, 112.03, "Your turn. Say: International cooperation."], [114.87, 116.94, "International cooperation."], [117.68, 118.74, "Resolution."], [119.75, 123.76, "Resolution means a formal decision made by a group after a vote."], [124.35, 126.97, "The resolution passed by a large majority."], [127.55, 130.54, "Your turn. Say: Resolution."], [133.4, 134.56, "Resolution."], [135.32, 136.88, "Humanitarian aid."], [137.88, 142.66, "Humanitarian aid means food, medicine and help sent to people in crisis."], [143.25, 145.9, "Humanitarian aid reached the flooded towns."], [146.48, 149.62, "Your turn. Say: Humanitarian aid."], [152.47, 154.16, "Humanitarian aid."], [154.92, 156.31, "Global governance."], [157.32, 161.71, "Global governance means the ways countries manage problems that affect the whole world."], [162.32, 165.34, "Global governance needs fair and effective rules."], [165.95, 168.93, "Your turn. Say: Global governance."], [171.77, 173.15, "Global governance."], [173.97, 177.4, "Part two: dialogue. Let's listen to a conversation."], [178.25, 184.41, "Visal, a report says 'Having signed the charter, member states must follow its rules.' What is 'Having signed'?"], [185.52, 197.46, "A perfect participle clause. It shows one action finished before another, and both share one subject: Having signed the charter, the states must follow it."], [198.55, 199.87, "And without 'having'?"], [200.95, 216.38, "The present participle shows simultaneous actions: 'Working together, nations deliver aid faster.' The past participle is passive: 'Adopted in 1948, the declaration remains influential.'"], [217.48, 218.79, "Is there any warning?"], [219.88, 232.71, "Yes, the subject must match. Not 'Having voted, the resolution passed', because a resolution cannot vote. Say 'Having voted, the members passed the resolution.'"], [233.87, 236.01, "Part three: grammar."], [236.85, 242.89, "Grammar focus: Participle clauses: Having plus past participle and -ing and -ed."], [243.19, 244.42, "Look at the pattern."], [245.12, 248.73, "Having signed the charter, member states must follow its rules."], [249.62, 253.56, "Working together, nations deliver humanitarian aid faster."], [254.45, 259.64, "Adopted in 1948, the declaration remains influential today."], [260.6, 270.36, "A participle clause shares the subject of the main clause. Use Having + past participle for an earlier action, -ing for a simultaneous one, -ed for a passive one."], [271.12, 275.55, "Be careful! Don't say: Having voted, the resolution passed."], [277.5, 280.69, "Say: Having voted, the members passed it."], [281.0, 283.55, "Both clauses must share the same subject."], [284.37, 287.09, "Part four: reading. Read and listen."], [287.9, 289.91, "Working Through the United Nations."], [290.21, 295.4, "The United Nations brings countries together to solve problems that no single nation can manage."], [296.4, 301.98, "Having joined, each member state agrees to respect the charter and to support international cooperation."], [302.97, 307.65, "Acting through a resolution, the Security Council can authorise peacekeeping missions."], [308.63, 313.01, "Funded by member states, humanitarian aid reaches millions of people every year."], [314.0, 319.87, "Critics argue that global governance would work better if every multilateral decision were taken more quickly."], [320.97, 324.86, "Part five: quiz. Five questions. Are you ready?"], [325.72, 328.57, "blank the report, the delegates left the hall."], [328.88, 333.3, "A, Having read. B, Have read. C, To having read."], [336.83, 338.98, "The answer is A: Having read."], [340.15, 343.44, "An agreement involving many countries is described as blank."], [343.74, 347.8, "A, bilateral. B, multilateral. C, private."], [351.33, 353.89, "The answer is B: multilateral."], [355.05, 357.78, "Which sentence has a correct participle clause?"], [358.08, 366.23, "A, Signing the treaty, the vote was held.. B, Having signed the treaty, the leaders went home.. C, Signed the treaty, the leaders went home.."], [369.77, 373.5, "The answer is B: Having signed the treaty, the leaders went home.."], [374.65, 378.67, "Food, medicine and help sent to people in crisis is humanitarian blank."], [378.97, 381.72, "A, aid. B, debt. C, trade."], [385.27, 387.29, "The answer is A: aid."], [388.45, 392.06, "According to the reading, what can the Security Council authorise?"], [392.36, 397.42, "A, tariffs. B, peacekeeping missions. C, elections."], [400.97, 403.93, "The answer is B: peacekeeping missions."], [405.13, 408.1, "Part six: speaking. It's your turn to talk."], [408.95, 412.67, "Why might countries choose to work through international organizations?"], [421.48, 422.86, "Now listen to Visal."], [423.16, 448.25, "Countries choose international organizations because many problems, such as pandemics, climate change and conflict, cross borders. Working through a multilateral body lets states share costs, set common rules and speak with greater authority. It also gives smaller countries a voice and offers a neutral place to settle disputes peacefully."], [448.55, 450.36, "Excellent answer, Visal!"], [451.25, 458.13, "Great work! Now you can use eight new words and participle clauses: having plus past participle and -ing and -ed."], [458.43, 463.27, "Today's value is global cooperation. Shared problems need shared solutions."], [463.57, 466.19, "See you in Unit three. Goodbye!"], [466.49, 469.35, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit03-Global-Security": [[0.35, 6.13, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.43, 9.81, "Hi! I'm Visal. Let's learn together!"], [10.11, 15.54, "Unit three: Global Security. Today you will write formally with nominalisation."], [15.84, 18.51, "Here is our lesson map. Let's start!"], [19.47, 22.91, "Part one: words. You will learn eight new words."], [23.75, 25.27, "National security."], [26.28, 30.88, "National security means the protection of a country and its people from threats."], [31.48, 34.47, "National security depends on more than armies."], [35.08, 38.04, "Your turn. Say: National security."], [40.9, 42.49, "National security."], [43.25, 44.99, "Cybersecurity threat."], [45.98, 50.79, "Cybersecurity threat means a danger to computer systems and the data they hold."], [51.38, 54.58, "A cybersecurity threat closed the hospital network."], [55.18, 58.54, "Your turn. Say: Cybersecurity threat."], [61.4, 63.07, "Cybersecurity threat."], [63.82, 64.84, "Terrorism."], [65.85, 70.82, "Terrorism means the use of violence against civilians to spread fear for a political aim."], [71.42, 75.26, "Terrorism requires cooperation between intelligence services."], [75.85, 78.26, "Your turn. Say: Terrorism."], [81.1, 82.1, "Terrorism."], [82.85, 84.11, "Arms control."], [85.12, 89.17, "Arms control means agreements that limit how many weapons countries may have."], [89.78, 92.66, "Arms control reduced the risk of accidental war."], [93.25, 95.84, "Your turn. Say: Arms control."], [98.7, 100.32, "Arms control."], [101.05, 102.79, "Intelligence agency."], [103.78, 108.64, "Intelligence agency means an official organisation that collects secret information."], [109.25, 111.77, "The intelligence agency warned of the plot."], [112.38, 115.78, "Your turn. Say: Intelligence agency."], [118.63, 120.85, "Intelligence agency."], [121.62, 123.21, "Conflict resolution."], [124.22, 128.04, "Conflict resolution means the process of ending a dispute peacefully."], [128.65, 131.51, "Conflict resolution requires patient dialogue."], [132.12, 135.69, "Your turn. Say: Conflict resolution."], [138.53, 140.12, "Conflict resolution."], [140.85, 141.9, "Deterrence."], [142.88, 146.69, "Deterrence means preventing an attack by threatening a strong response."], [147.28, 150.16, "Deterrence only works if the threat is believable."], [150.75, 153.15, "Your turn. Say: Deterrence."], [156.0, 157.04, "Deterrence."], [157.78, 159.23, "Crisis management."], [160.22, 165.15, "Crisis management means the skills and plans used to control a dangerous emergency."], [165.75, 168.17, "Good crisis management prevented panic."], [168.78, 171.77, "Your turn. Say: Crisis management."], [174.63, 175.93, "Crisis management."], [176.73, 180.52, "Part two: dialogue. Let's listen to a conversation."], [181.38, 188.69, "Visal, a policy paper says 'The escalation of the conflict led to a rapid deterioration in security.' What is unusual about it?"], [189.78, 204.8, "It uses nominalisation: verbs become nouns. 'The conflict escalated, so security deteriorated rapidly' becomes 'The escalation of the conflict led to a rapid deterioration in security.'"], [205.92, 207.38, "Why do writers do that?"], [208.48, 224.49, "Nouns pack more information into one phrase and sound formal and objective. Examples: decide → decision, detect → detection, resolve → resolution, deter → deterrence."], [225.58, 226.92, "Is there any risk?"], [228.02, 237.93, "Too many nouns can make writing heavy and unclear. Use nominalisation for reports, but keep a simple verb when you need a clear, direct message."], [239.07, 240.81, "Part three: grammar."], [241.65, 246.06, "Grammar focus: Nominalisation: verb to noun phrase."], [246.36, 247.5, "Look at the pattern."], [248.22, 252.19, "The expansion of intelligence agencies raised concerns about privacy."], [253.08, 256.81, "The failure of arms control talks increased the risk of conflict."], [257.72, 261.31, "Effective deterrence depends on clear and credible warnings."], [262.27, 271.42, "Turn a verb into a noun (decide → decision) to make writing compact and formal: The escalation of the conflict led to… not The conflict escalated, so…"], [272.18, 275.95, "Be careful! Don't say: The decide was taken quickly."], [277.9, 280.51, "Say: The decision was taken quickly."], [280.81, 282.62, "Use the noun 'decision' after 'the'."], [283.43, 286.14, "Part four: reading. Read and listen."], [286.93, 288.78, "Security in a Digital Age."], [289.08, 292.66, "National security once meant protecting borders from armies."], [293.67, 298.62, "Today, the growth of cybersecurity threats and the spread of terrorism demand new thinking."], [299.6, 306.7, "Intelligence agencies depend on the sharing of information, while arms control relies on trust and verification."], [307.7, 311.96, "Successful deterrence requires the clear communication of consequences."], [312.97, 319.71, "Careful crisis management and the early use of conflict resolution can prevent a small incident from becoming a war."], [320.8, 324.91, "Part five: quiz. Five questions. Are you ready?"], [325.75, 328.17, "The noun form of the verb 'decide' is blank."], [328.47, 332.48, "A, decider. B, decisive. C, decision."], [336.03, 337.93, "The answer is C: decision."], [339.08, 341.38, "Which sentence uses nominalisation?"], [341.69, 348.4, "A, Leaders failed to agree.. B, The failure of leaders to agree worsened the crisis.. C, Leaders agree fast.."], [351.97, 356.38, "The answer is B: The failure of leaders to agree worsened the crisis.."], [357.52, 361.08, "Preventing an attack by showing a strong response is called blank."], [361.38, 365.34, "A, deterrence. B, terrorism. C, integration."], [368.9, 371.04, "The answer is A: deterrence."], [372.18, 374.42, "The noun form of 'escalate' is blank."], [374.71, 379.26, "A, escalation. B, escalator. C, escalated."], [382.8, 385.09, "The answer is A: escalation."], [386.25, 389.85, "According to the reading, what once defined national security?"], [390.15, 395.92, "A, protecting borders from armies. B, cyber systems. C, global trade."], [399.47, 402.41, "The answer is A: protecting borders from armies."], [403.6, 406.67, "Part six: speaking. It's your turn to talk."], [407.52, 411.07, "How has the definition of 'security' changed with new technology?"], [419.88, 421.29, "Now listen to Visal."], [421.59, 450.48, "Security used to mean defending territory from armies. New technology has widened the definition to include cybersecurity threats, attacks on power grids and the spread of false information online. Because these dangers cross borders instantly, governments must now share intelligence, protect critical systems and cooperate with other countries as well as strengthening their military."], [450.78, 452.46, "Excellent answer, Visal!"], [453.35, 458.96, "Great work! Now you can use eight new words and nominalisation: verb to noun phrase."], [459.26, 465.6, "Today's value is global security awareness. Understand that peace depends on many kinds of safety."], [465.9, 468.51, "See you in Unit four. Goodbye!"], [468.81, 471.84, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit04-Climate-Diplomacy": [[0.35, 5.82, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.12, 9.49, "Hi! I'm Visal. Let's learn together!"], [9.79, 15.81, "Unit four: Climate Diplomacy. Today you will set future targets with the future perfect."], [16.11, 18.68, "Here is our lesson map. Let's start!"], [19.63, 22.88, "Part one: words. You will learn eight new words."], [23.72, 25.05, "Climate accord."], [26.05, 30.12, "Climate accord means an international agreement to fight climate change."], [30.72, 33.01, "The climate accord set a limit on warming."], [33.62, 36.87, "Your turn. Say: Climate accord."], [39.73, 41.15, "Climate accord."], [41.92, 43.37, "Carbon emissions."], [44.38, 49.24, "Carbon emissions means the carbon gases released into the air by human activity."], [49.85, 52.81, "Carbon emissions fell after the factory reforms."], [53.42, 56.3, "Your turn. Say: Carbon emissions."], [59.17, 60.5, "Carbon emissions."], [61.25, 62.9, "Sustainable development."], [63.92, 68.46, "Sustainable development means growth that meets today's needs without harming the future."], [69.05, 72.14, "Sustainable development protects forests and jobs."], [72.75, 75.94, "Your turn. Say: Sustainable development."], [78.8, 80.54, "Sustainable development."], [81.28, 82.33, "Global warming."], [83.32, 87.03, "Global warming means the gradual rise in Earth's average temperature."], [87.65, 89.97, "Global warming is melting glaciers."], [90.58, 93.31, "Your turn. Say: Global warming."], [96.17, 97.66, "Global warming."], [98.42, 99.89, "Renewable transition."], [100.88, 105.62, "Renewable transition means the move from fossil fuels to clean energy sources."], [106.22, 109.18, "The renewable transition created new industries."], [109.78, 113.0, "Your turn. Say: Renewable transition."], [115.87, 117.46, "Renewable transition."], [118.22, 120.16, "Environmental treaty."], [121.15, 125.45, "Environmental treaty means a legal agreement between countries to protect nature."], [126.05, 129.48, "The environmental treaty bans harmful chemicals."], [130.08, 133.66, "Your turn. Say: Environmental treaty."], [136.5, 138.92, "Environmental treaty."], [139.68, 141.06, "Climate justice."], [142.05, 146.77, "Climate justice means the idea that those who caused least harm should be protected most."], [147.35, 149.98, "Climate justice supports the poorest nations."], [150.58, 153.77, "Your turn. Say: Climate justice."], [156.63, 158.13, "Climate justice."], [158.88, 160.62, "Adaptation strategy."], [161.62, 166.12, "Adaptation strategy means a plan for coping with the effects of climate change."], [166.72, 169.9, "An adaptation strategy includes new sea walls."], [170.52, 174.12, "Your turn. Say: Adaptation strategy."], [176.97, 178.66, "Adaptation strategy."], [179.47, 183.19, "Part two: dialogue. Let's listen to a conversation."], [184.05, 190.72, "Visal, a minister says 'By 2050, we will have cut carbon emissions by half.' What tense is 'will have cut'?"], [191.82, 202.99, "The future perfect: will have + past participle. It describes an action completed before a future time, shown by 'by 2050' or 'by the end of the decade'."], [204.08, 206.04, "Is there a continuous form?"], [207.15, 219.01, "Yes, will have been + -ing stresses duration: 'By 2030, countries will have been negotiating for forty years.' We use it for long processes."], [220.12, 221.88, "How is it different from will cut?"], [222.98, 231.29, "'Will cut' is a plan or prediction without a deadline. 'Will have cut' promises the result by a deadline, so it sounds like a firm target."], [232.43, 233.83, "Part three: grammar."], [234.68, 238.98, "Grammar focus: Future perfect: will have plus past participle."], [239.28, 240.48, "Look at the pattern."], [241.18, 244.97, "Nations will have cut carbon emissions by half by 2050."], [245.88, 250.22, "The renewable transition will have replaced most coal plants by the end of the decade."], [251.12, 255.17, "Diplomats will have been negotiating for forty years by 2030."], [256.13, 265.52, "Use will have + past participle for something completed before a future deadline (by 2050). Use will have been + -ing to show how long something has continued."], [266.28, 270.27, "Be careful! Don't say: By 2050 we will have reduce it."], [272.23, 275.14, "Say: By 2050 we will have reduced it."], [275.44, 277.81, "Use the past participle after will have."], [278.6, 281.74, "Part four: reading. Read and listen."], [282.53, 283.99, "Targets and Deadlines."], [284.29, 288.75, "Every climate accord rests on promises about what will happen by a certain date."], [289.73, 296.9, "By 2030, many countries will have reduced carbon emissions, and some will have completed their renewable transition."], [297.9, 303.92, "By then, negotiators will have been meeting for decades to turn an environmental treaty into real change."], [304.9, 311.14, "Climate justice means that rich countries, which have emitted most, should have funded adaptation strategies long before."], [312.13, 318.7, "Sustainable development will only succeed if promises become results before global warming passes dangerous limits."], [319.8, 323.8, "Part five: quiz. Five questions. Are you ready?"], [324.65, 327.62, "By 2040, scientists blank the project."], [327.93, 332.36, "A, will complete. B, will have completed. C, are completing."], [335.9, 338.65, "The answer is B: will have completed."], [339.82, 342.06, "Which form stresses a long duration?"], [342.36, 347.63, "A, will have been negotiating. B, will negotiate. C, will have negotiated."], [351.17, 354.2, "The answer is A: will have been negotiating."], [355.35, 359.18, "A plan to cope with the effects of climate change is an blank strategy."], [359.48, 363.17, "A, adaptation. B, emission. C, election."], [366.73, 368.71, "The answer is A: adaptation."], [369.85, 371.65, "Choose the correct sentence."], [371.95, 381.39, "A, By 2030 we will have reduce emissions.. B, By 2030 we will have reduced emissions.. C, By 2030 we have will reduced emissions.."], [384.93, 389.42, "The answer is B: By 2030 we will have reduced emissions.."], [390.58, 393.57, "According to the reading, what must promises become?"], [393.87, 397.6, "A, results. B, slogans. C, debates."], [401.17, 403.28, "The answer is A: results."], [404.47, 408.04, "Part six: speaking. It's your turn to talk."], [408.88, 413.15, "Why is international cooperation especially important for climate issues?"], [421.95, 423.33, "Now listen to Visal."], [423.63, 450.26, "Climate change is a shared problem because carbon emissions mix in the atmosphere and affect every country, whoever produced them. One nation acting alone cannot stop global warming. Through a climate accord, countries can agree fair targets, share clean technology and fund adaptation strategies for those most at risk, which supports climate justice."], [450.56, 452.32, "Excellent answer, Visal!"], [453.22, 458.96, "Great work! Now you can use eight new words and future perfect: will have plus past participle."], [459.26, 464.42, "Today's value is sustainability. Choose ways of living that protect the planet for the future."], [464.72, 467.49, "See you in Unit five. Goodbye!"], [467.79, 470.74, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit05-Migration-Refugees": [[0.35, 6.24, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.54, 10.05, "Hi! I'm Visal. Let's learn together!"], [10.35, 17.23, "Unit five: Migration & Refugees. Today you will stress how severe a situation was with So / Such inversion."], [17.52, 20.4, "Here is our lesson map. Let's start!"], [21.33, 24.57, "Part one: words. You will learn eight new words."], [25.42, 26.49, "Migration."], [27.48, 31.32, "Migration means the movement of people from one place to live in another."], [31.92, 34.1, "Migration has shaped every continent."], [34.72, 37.58, "Your turn. Say: Migration."], [40.43, 41.54, "Migration."], [42.28, 43.38, "Refugee."], [44.38, 48.36, "Refugee means a person forced to leave their country to escape danger."], [48.95, 51.12, "The refugee crossed the river at night."], [51.72, 54.8, "Your turn. Say: Refugee."], [57.63, 58.67, "Refugee."], [59.42, 60.8, "Asylum seeker."], [61.82, 65.77, "Asylum seeker means a person who asks another country for protection."], [66.38, 68.77, "The asylum seeker waited for her interview."], [69.35, 72.72, "Your turn. Say: Asylum seeker."], [75.57, 76.86, "Asylum seeker."], [77.62, 78.69, "Displacement."], [79.68, 84.19, "Displacement means being forced to leave your home, usually by war or disaster."], [84.78, 87.79, "Displacement affected millions after the floods."], [88.38, 91.29, "Your turn. Say: Displacement."], [94.13, 95.2, "Displacement."], [95.95, 97.73, "Humanitarian crisis."], [98.72, 103.8, "Humanitarian crisis means a serious emergency in which many people lack basic needs."], [104.42, 107.32, "A humanitarian crisis followed the earthquake."], [107.92, 111.63, "Your turn. Say: Humanitarian crisis."], [114.47, 116.3, "Humanitarian crisis."], [117.05, 118.19, "Resettlement."], [119.18, 123.58, "Resettlement means moving refugees to a safe country where they can build a new life."], [124.18, 126.66, "Resettlement gave the family a fresh start."], [127.25, 130.02, "Your turn. Say: Resettlement."], [132.87, 133.96, "Resettlement."], [134.72, 136.05, "Border policy."], [137.05, 140.79, "Border policy means the rules about who may cross into a country."], [141.38, 144.06, "A strict border policy slowed arrivals."], [144.65, 147.81, "Your turn. Say: Border policy."], [150.67, 152.17, "Border policy."], [152.92, 154.01, "Integration."], [155.02, 159.49, "Integration means helping newcomers to become full members of a society."], [160.08, 162.77, "Integration requires language classes and work."], [163.38, 166.29, "Your turn. Say: Integration."], [169.13, 170.53, "Integration."], [171.33, 174.91, "Part two: dialogue. Let's listen to a conversation."], [175.75, 182.76, "Visal, a reporter writes 'So severe was the humanitarian crisis that thousands fled.' Why is 'was' before 'the crisis'?"], [183.85, 196.95, "After So + adjective at the start, we invert the verb and subject. The normal order is 'The crisis was so severe that thousands fled.' The inverted form sounds dramatic and formal."], [198.05, 199.34, "Does 'such' work too?"], [200.45, 211.82, "Yes: 'Such was the scale of displacement that camps overflowed.' With such + be, the verb comes first. We use it to show the result of an extreme situation."], [212.92, 214.5, "Can we use it in speech?"], [215.58, 224.32, "Rarely. It belongs to formal writing and speeches, where a writer wants to stress how serious the situation was."], [225.47, 227.0, "Part three: grammar."], [227.85, 233.36, "Grammar focus: Inversion: So plus adjective plus be plus subject plus that."], [233.66, 235.03, "Look at the pattern."], [235.72, 239.13, "So severe was the crisis that thousands fled their homes."], [240.02, 243.38, "Such was the scale of displacement that camps overflowed."], [244.28, 247.93, "So strict is the border policy that few asylum seekers can enter."], [248.87, 256.87, "Begin with So + adjective or Such, then put the verb before the subject: So severe was the crisis that… It is formal and dramatic."], [257.62, 261.5, "Be careful! Don't say: So big the crisis was that all fled."], [263.43, 266.21, "Say: So big was the crisis that all fled."], [266.51, 268.38, "Put the verb before the subject."], [269.17, 272.04, "Part four: reading. Read and listen."], [272.83, 273.94, "People on the Move."], [274.24, 279.57, "Migration has always shaped the world, but forced displacement creates special urgency."], [280.57, 284.66, "So serious was the conflict that millions became refugees within a year."], [285.67, 290.86, "Such is the pressure on border policy that governments struggle to balance security and compassion."], [291.87, 297.34, "An asylum seeker may wait years for a decision, and resettlement offers only a few a new start."], [298.33, 303.92, "Successful integration, however, benefits both newcomers and the communities that welcome them."], [305.03, 309.06, "Part five: quiz. Five questions. Are you ready?"], [309.92, 313.12, "So rapid blank the displacement that aid could not keep up."], [313.42, 316.76, "A, was. B, it was. C, did."], [320.3, 322.32, "The answer is A: was."], [323.48, 326.71, "A person who asks a country for protection is an blank."], [327.01, 331.27, "A, asylum seeker. B, investor. C, ambassador."], [334.83, 337.15, "The answer is A: asylum seeker."], [338.28, 340.09, "Choose the correct sentence."], [340.39, 347.52, "A, So large the camp was that it flooded.. B, So large was the camp that it flooded.. C, So large was that the camp flooded.."], [351.07, 354.69, "The answer is B: So large was the camp that it flooded.."], [355.85, 359.22, "Helping newcomers become part of society is called blank."], [359.52, 363.82, "A, deterrence. B, integration. C, inflation."], [367.37, 369.27, "The answer is B: integration."], [370.42, 373.67, "According to the reading, who benefits from integration?"], [373.97, 379.76, "A, only newcomers. B, newcomers and host communities. C, only governments."], [383.3, 387.08, "The answer is B: newcomers and host communities."], [388.27, 391.71, "Part six: speaking. It's your turn to talk."], [392.55, 396.36, "What challenges might a refugee face when resettling in a new country?"], [405.15, 406.59, "Now listen to Visal."], [406.89, 434.54, "A refugee may face language barriers, difficulty finding work and trouble having qualifications recognised. Many also carry trauma from displacement and feel lonely far from family. Prejudice and complicated paperwork can make daily life harder. Good integration programmes, language classes and community support help newcomers rebuild their lives with dignity."], [434.83, 436.49, "Excellent answer, Visal!"], [437.38, 444.51, "Great work! Now you can use eight new words and inversion: so plus adjective plus be plus subject plus that."], [444.81, 448.94, "Today's value is compassion. Care about the suffering of others and help."], [449.24, 451.9, "See you in Unit six. Goodbye!"], [452.2, 455.94, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit06-Global-Trade-Agreements": [[0.35, 5.98, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.28, 9.64, "Hi! I'm Visal. Let's learn together!"], [9.94, 15.89, "Unit six: Global Trade Agreements. Today you will comment on a whole clause with sentence relatives."], [16.19, 18.76, "Here is our lesson map. Let's start!"], [19.7, 23.03, "Part one: words. You will learn eight new words."], [23.88, 25.08, "Free trade agreement."], [26.08, 31.4, "Free trade agreement means a deal that removes taxes and barriers on goods between countries."], [32.02, 34.78, "The free trade agreement covered twelve countries."], [35.38, 38.49, "Your turn. Say: Free trade agreement."], [41.33, 42.78, "Free trade agreement."], [43.52, 44.54, "Trade bloc."], [45.55, 49.88, "Trade bloc means a group of countries with special trading rules among themselves."], [50.48, 52.98, "The trade bloc welcomed three new members."], [53.58, 56.24, "Your turn. Say: Trade bloc."], [59.1, 60.15, "Trade bloc."], [60.88, 62.09, "Tariff reduction."], [63.08, 67.08, "Tariff reduction means lowering the tax charged on imported goods."], [67.68, 69.97, "Tariff reduction made cars cheaper."], [70.58, 73.72, "Your turn. Say: Tariff reduction."], [76.57, 77.63, "Tariff reduction."], [78.38, 80.1, "Economic partnership."], [81.12, 86.03, "Economic partnership means a close agreement on trade and investment between countries."], [86.62, 89.93, "The economic partnership created thousands of jobs."], [90.52, 93.95, "Your turn. Say: Economic partnership."], [96.8, 98.54, "Economic partnership."], [99.28, 100.67, "Market access."], [101.68, 106.09, "Market access means the ability of a firm to sell its goods in another country."], [106.68, 109.6, "Market access allowed farmers to export fruit."], [110.22, 113.54, "Your turn. Say: Market access."], [116.4, 117.87, "Market access."], [118.62, 119.84, "Trade dispute."], [120.85, 125.38, "Trade dispute means a disagreement between countries about trade rules or taxes."], [125.98, 128.82, "The trade dispute reached an international court."], [129.42, 132.6, "Your turn. Say: Trade dispute."], [135.47, 136.59, "Trade dispute."], [137.35, 138.79, "Global supply chain."], [139.78, 144.34, "Global supply chain means the worldwide network that produces and delivers goods."], [144.95, 148.35, "The global supply chain links factories on every continent."], [148.95, 152.82, "Your turn. Say: Global supply chain."], [155.67, 157.4, "Global supply chain."], [158.15, 159.2, "Protectionism."], [160.18, 164.88, "Protectionism means the policy of shielding home industries from foreign competition."], [165.48, 168.32, "Protectionism can raise prices for shoppers."], [168.92, 171.72, "Your turn. Say: Protectionism."], [174.57, 175.74, "Protectionism."], [176.53, 180.37, "Part two: dialogue. Let's listen to a conversation."], [181.22, 187.42, "Visal, an article says 'The tariffs were removed, which boosted exports.' What does 'which' refer to?"], [188.52, 198.02, "It refers to the whole clause before it, not one noun. It is a sentence relative clause. 'Which' means 'and this fact'. It always follows a comma."], [199.12, 200.55, "Can I use 'that' instead?"], [201.65, 210.35, "No. Never use 'that' after a comma. Say 'The agreement collapsed, which surprised investors', not '..., that surprised investors'."], [211.45, 213.22, "Which verbs usually follow?"], [214.32, 227.06, "Often result or opinion verbs: which caused, which meant, which is why. 'Tariff reduction widened market access, which meant cheaper goods for consumers.'"], [228.2, 230.08, "Part three: grammar."], [230.95, 234.8, "Grammar focus: Sentence relative: , which plus comment."], [235.1, 236.29, "Look at the pattern."], [236.98, 240.71, "The tariffs were removed, which boosted exports across the bloc."], [241.62, 245.71, "The trade dispute dragged on for years, which damaged the global supply chain."], [246.62, 250.81, "Tariff reduction widened market access, which meant cheaper goods for consumers."], [251.77, 259.83, "After a comma, which can refer to a whole clause: The tariffs were removed, which boosted exports. Never use that in this position."], [260.58, 265.12, "Be careful! Don't say: He left early, that surprised us."], [267.07, 270.06, "Say: He left early, which surprised us."], [270.37, 272.51, "After a comma, use 'which', not 'that'."], [273.3, 276.03, "Part four: reading. Read and listen."], [276.83, 278.94, "Winners and Losers of Free Trade."], [279.24, 284.91, "A free trade agreement removes barriers between countries, which encourages firms to sell abroad."], [285.9, 290.78, "Tariff reduction gives better market access, which usually lowers prices for shoppers."], [291.77, 296.95, "Within a trade bloc, partners enjoy an economic partnership, which can deepen political ties."], [297.93, 303.09, "Yet protectionism may return after a trade dispute, which slows the global supply chain."], [304.1, 309.0, "Governments must therefore weigh cheaper goods against jobs in industries that lose protection."], [310.1, 314.01, "Part five: quiz. Five questions. Are you ready?"], [314.85, 318.23, "The factory closed, blank left many workers jobless."], [318.53, 321.55, "A, that. B, which. C, what."], [325.1, 326.76, "The answer is B: which."], [327.92, 330.31, "Taxes on imported goods are called blank."], [330.61, 334.5, "A, tariffs. B, summits. C, visas."], [338.03, 340.17, "The answer is A: tariffs."], [341.32, 342.79, "Which sentence is correct?"], [343.09, 349.93, "A, He resigned, that surprised us.. B, He resigned, which surprised us.. C, He resigned which, surprised us.."], [353.47, 356.47, "The answer is B: He resigned, which surprised us.."], [357.62, 361.74, "A policy of shielding home industry from foreign competition is blank."], [362.04, 365.95, "A, protectionism. B, integration. C, diplomacy."], [369.5, 371.79, "The answer is A: protectionism."], [372.95, 376.69, "According to the reading, what does tariff reduction usually lower?"], [376.99, 380.69, "A, prices. B, wages. C, borders."], [384.23, 386.49, "The answer is A: prices."], [387.7, 390.86, "Part six: speaking. It's your turn to talk."], [391.72, 395.23, "What are the advantages and disadvantages of free trade agreements?"], [404.02, 405.5, "Now listen to Visal."], [405.81, 430.45, "Free trade agreements lower prices, widen market access and help exporters grow, which creates jobs in competitive industries. However, cheaper imports can hurt local industries that cannot compete, and a trade dispute can damage relations between partners. Governments need to support workers who lose out so that the benefits of trade are shared fairly."], [430.75, 432.63, "Excellent answer, Visal!"], [433.52, 438.92, "Great work! Now you can use eight new words and sentence relative: , which plus comment."], [439.22, 444.81, "Today's value is global economic literacy. Understand how money and trade connect the world."], [445.11, 447.4, "See you in Unit seven. Goodbye!"], [447.7, 450.16, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit07-Nuclear-Non-Proliferation": [[0.35, 6.02, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.32, 10.23, "Hi! I'm Visal. Let's learn together!"], [10.53, 17.85, "Unit seven: Nuclear Non-Proliferation. Today you will urge overdue action with It is high time + past simple."], [18.15, 20.78, "Here is our lesson map. Let's start!"], [21.73, 24.98, "Part one: words. You will learn eight new words."], [25.82, 27.04, "Nuclear weapon."], [28.05, 32.34, "Nuclear weapon means a bomb that releases huge destructive power from atoms."], [32.95, 35.6, "A single nuclear weapon could destroy a city."], [36.18, 39.07, "Your turn. Say: Nuclear weapon."], [41.93, 43.33, "Nuclear weapon."], [44.08, 45.66, "Non-proliferation treaty."], [46.65, 52.07, "Non-proliferation treaty means an agreement to stop nuclear weapons spreading to more countries."], [52.68, 55.99, "The non-proliferation treaty has nearly universal support."], [56.58, 60.23, "Your turn. Say: Non-proliferation treaty."], [63.1, 65.08, "Non-proliferation treaty."], [65.82, 67.04, "Arms control."], [68.05, 72.01, "Arms control means agreements that limit the number or type of weapons."], [72.62, 74.94, "Arms control talks resumed in spring."], [75.55, 78.62, "Your turn. Say: Arms control."], [81.47, 82.94, "Arms control."], [83.68, 85.21, "Nuclear deterrence."], [86.22, 90.94, "Nuclear deterrence means the idea that fear of a nuclear reply prevents an attack."], [91.55, 94.76, "Nuclear deterrence has divided strategists for decades."], [95.35, 98.56, "Your turn. Say: Nuclear deterrence."], [101.4, 102.97, "Nuclear deterrence."], [103.72, 104.75, "Disarmament."], [105.75, 109.21, "Disarmament means the process of reducing or removing weapons."], [109.82, 112.25, "Disarmament began with the oldest missiles."], [112.85, 115.65, "Your turn. Say: Disarmament."], [118.5, 119.59, "Disarmament."], [120.35, 121.83, "Uranium enrichment."], [122.82, 127.87, "Uranium enrichment means the process that makes uranium strong enough for reactors or bombs."], [128.48, 130.97, "Uranium enrichment is closely monitored."], [131.58, 134.26, "Your turn. Say: Uranium enrichment."], [137.1, 138.68, "Uranium enrichment."], [139.42, 141.16, "International inspection."], [142.15, 148.55, "International inspection means checks carried out by outside experts to confirm a country keeps its promises."], [149.15, 152.47, "International inspection confirmed the closure of the plant."], [153.08, 156.22, "Your turn. Say: International inspection."], [159.07, 160.78, "International inspection."], [161.52, 162.84, "Nuclear power."], [163.85, 167.75, "Nuclear power means electricity produced using the energy of atoms."], [168.35, 171.51, "Nuclear power supplies a third of the country's electricity."], [172.12, 175.28, "Your turn. Say: Nuclear power."], [178.13, 179.62, "Nuclear power."], [180.43, 183.98, "Part two: dialogue. Let's listen to a conversation."], [184.82, 190.93, "Visal, a diplomat says 'It is high time states agreed to disarm.' Why is 'agreed' in the past tense?"], [192.02, 201.87, "After 'It is (about/high) time', we use the past simple for a present or future need. It is an unreal past: the action should already be happening."], [202.98, 204.82, "Are there similar structures?"], [205.92, 217.4, "Yes: 'I would rather inspectors visited the site' and 'Suppose a state refused'. All use the past simple to talk about a present or future preference or possibility."], [218.52, 219.91, "Can I use 'would' after it?"], [221.02, 231.24, "Not in this pattern. We say 'It's time they ended the programme', not 'they would end'. The simple form 'It's time to end it' is also correct."], [232.4, 233.99, "Part three: grammar."], [234.85, 239.38, "Grammar focus: Unreal past: It is high time plus past simple."], [239.68, 240.8, "Look at the pattern."], [241.48, 245.13, "It is high time states agreed to a full disarmament plan."], [246.02, 248.99, "I would rather inspectors visited every enrichment site."], [249.88, 253.22, "It's about time the superpowers reduced their nuclear weapons."], [254.17, 262.96, "Use It is (high) time + subject + past simple for something that should already be happening. Also: would rather + subject + past simple."], [263.72, 267.67, "Be careful! Don't say: It is time we will act now."], [269.63, 271.69, "Say: It is time we acted now."], [271.99, 274.4, "Use the past simple after 'It is time'."], [275.2, 277.85, "Part four: reading. Read and listen."], [278.67, 280.79, "Controlling the Most Dangerous Weapons."], [281.09, 286.54, "A single nuclear weapon can destroy a city, so non-proliferation is a global priority."], [287.53, 293.76, "The non-proliferation treaty asks states to avoid building weapons while keeping nuclear power for peaceful use."], [294.77, 299.13, "Many experts say it is high time the great powers moved towards real disarmament."], [300.13, 305.74, "Because uranium enrichment can serve peace or war, international inspection is essential."], [306.73, 311.59, "Arms control builds trust, and trust makes nuclear deterrence less dangerous."], [312.7, 316.71, "Part five: quiz. Five questions. Are you ready?"], [317.55, 320.03, "It is high time the government blank action."], [320.33, 323.87, "A, takes. B, took. C, will take."], [327.43, 329.08, "The answer is B: took."], [330.25, 333.25, "The process of reducing or removing weapons is blank."], [333.55, 337.65, "A, disarmament. B, enrichment. C, inspection."], [341.2, 343.29, "The answer is A: disarmament."], [344.45, 346.16, "Choose the correct sentence."], [346.46, 353.36, "A, It's time they end the programme.. B, It's time they ended the programme.. C, It's time they will end the programme.."], [356.9, 360.04, "The answer is B: It's time they ended the programme.."], [361.18, 364.86, "Checks carried out by outside experts are international blank."], [365.15, 369.38, "A, inspections. B, campaigns. C, elections."], [372.93, 374.96, "The answer is A: inspections."], [376.12, 379.68, "According to the reading, what can a single nuclear weapon do?"], [379.98, 384.76, "A, destroy a city. B, fund a treaty. C, enrich uranium."], [388.3, 390.71, "The answer is A: destroy a city."], [391.9, 395.1, "Part six: speaking. It's your turn to talk."], [395.95, 399.96, "Why do countries agree to international inspections of their nuclear programs?"], [408.75, 410.34, "Now listen to Visal."], [410.64, 437.89, "Countries accept international inspections because they build trust. When independent experts confirm that uranium enrichment serves only peaceful nuclear power, neighbours feel safer and fewer states are tempted to build their own weapons. Inspections can also help to end sanctions and show that a government keeps its promises under the non-proliferation treaty."], [438.19, 439.9, "Excellent answer, Visal!"], [440.78, 447.04, "Great work! Now you can use eight new words and unreal past: it is high time plus past simple."], [447.33, 452.91, "Today's value is global responsibility. Act as someone who belongs to the whole world."], [453.21, 455.73, "See you in Unit eight. Goodbye!"], [456.03, 458.93, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit08-Space-Policy": [[0.35, 5.79, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.09, 9.44, "Hi! I'm Visal. Let's learn together!"], [9.74, 16.61, "Unit eight: Space Policy. Today you will state purpose and prevent danger with in order that / lest / so as not to."], [16.91, 19.63, "Here is our lesson map. Let's start!"], [20.57, 24.17, "Part one: words. You will learn eight new words."], [25.02, 26.74, "Space exploration."], [27.75, 33.0, "Space exploration means the scientific study of space using crewed and robotic missions."], [33.62, 37.06, "Space exploration inspired a generation of scientists."], [37.65, 41.23, "Your turn. Say: Space exploration."], [44.07, 45.76, "Space exploration."], [46.52, 48.27, "Satellite technology."], [49.28, 54.0, "Satellite technology means machines in orbit that send signals and images to Earth."], [54.58, 57.47, "Satellite technology guides ships and aircraft."], [58.05, 61.84, "Your turn. Say: Satellite technology."], [64.7, 66.48, "Satellite technology."], [67.22, 68.53, "Orbital debris."], [69.52, 74.09, "Orbital debris means broken pieces of old spacecraft that circle the Earth."], [74.68, 77.19, "Orbital debris threatens working satellites."], [77.78, 80.69, "Your turn. Say: Orbital debris."], [83.53, 84.88, "Orbital debris."], [85.62, 86.75, "Space race."], [87.75, 92.36, "Space race means the rivalry between countries to achieve firsts in space."], [92.95, 95.38, "The space race began during the Cold War."], [95.98, 98.8, "Your turn. Say: Space race."], [101.63, 102.77, "Space race."], [103.52, 105.35, "International space law."], [106.35, 110.74, "International space law means the rules that govern how countries may use space."], [111.35, 114.25, "International space law forbids claiming the Moon."], [114.85, 118.41, "Your turn. Say: International space law."], [121.27, 123.17, "International space law."], [123.92, 125.47, "Space agency."], [126.48, 130.06, "Space agency means a government body that runs space programmes."], [130.65, 133.46, "Each space agency shared its data openly."], [134.05, 136.57, "Your turn. Say: Space agency."], [139.43, 140.84, "Space agency."], [141.58, 143.01, "Commercial spaceflight."], [144.02, 148.48, "Commercial spaceflight means space travel and launches run by private companies."], [149.08, 151.86, "Commercial spaceflight has lowered launch costs."], [152.45, 155.83, "Your turn. Say: Commercial spaceflight."], [158.7, 160.41, "Commercial spaceflight."], [161.15, 162.75, "Space militarization."], [163.75, 167.97, "Space militarization means the use of space for military purposes."], [168.58, 171.43, "Space militarization worries many diplomats."], [172.02, 174.84, "Your turn. Say: Space militarization."], [177.7, 179.65, "Space militarization."], [180.47, 184.79, "Part two: dialogue. Let's listen to a conversation."], [185.65, 191.34, "Visal, a policy paper says 'Rules are needed in order that space remain safe.' What does this show?"], [192.45, 202.9, "It shows purpose. 'In order that' + clause often takes the present subjunctive or should: in order that space remain safe. 'So that' is more common in speech."], [203.98, 205.47, "And what about 'lest'?"], [206.58, 218.14, "'Lest' means 'in case something bad happens'. It is formal: 'Agencies track debris lest satellites collide.' It takes a base verb or should, with no negative."], [219.25, 221.12, "What about so as not to?"], [222.22, 233.65, "Use 'so as not to' + verb for a negative purpose with the same subject: 'Agencies share data so as not to cause collisions.' Do not write 'lest not'."], [234.8, 236.26, "Part three: grammar."], [237.12, 241.71, "Grammar focus: Purpose: in order that and lest and so as not to."], [242.0, 243.17, "Look at the pattern."], [243.88, 247.11, "Rules are needed in order that space remain safe for everyone."], [248.02, 251.49, "Agencies track debris lest satellites collide in orbit."], [252.38, 256.45, "Agencies share data so as not to cause dangerous collisions."], [257.4, 265.24, "Express purpose with in order that + clause, lest + base verb (a feared danger) or so as not to + verb. Never write lest not."], [265.98, 269.89, "Be careful! Don't say: He hurried lest not he be late."], [271.83, 274.44, "Say: He hurried lest he be late."], [274.74, 276.63, "Do not add a negative after lest."], [277.43, 279.99, "Part four: reading. Read and listen."], [280.8, 282.69, "Rules for the Final Frontier."], [283.0, 289.55, "Space exploration began as a race between rivals, but satellite technology now serves billions of ordinary people."], [290.53, 294.83, "Agencies track orbital debris lest a collision destroy a vital satellite."], [295.83, 301.37, "International space law exists in order that no single nation claim the Moon or other worlds."], [302.37, 308.19, "Commercial spaceflight is growing fast, so rules must be updated so as not to leave dangerous gaps."], [309.2, 315.04, "Many experts also warn against space militarization, lest a new race lead to conflict."], [316.13, 320.17, "Part five: quiz. Five questions. Are you ready?"], [321.02, 324.05, "Agencies track debris blank satellites collide."], [324.35, 327.76, "A, lest. B, unless. C, whereas."], [331.3, 333.78, "The answer is A: lest."], [334.92, 338.29, "Pieces of broken equipment circling Earth are orbital blank."], [338.59, 341.98, "A, debris. B, law. C, tourism."], [345.53, 347.27, "The answer is A: debris."], [348.42, 350.26, "Choose the correct sentence."], [350.56, 358.89, "A, He left early lest not he miss the train.. B, He left early lest he miss the train.. C, He left early lest he misses the train.."], [362.43, 365.86, "The answer is B: He left early lest he miss the train.."], [367.02, 370.63, "A government body that runs space programmes is a space blank."], [370.93, 374.26, "A, bloc. B, agency. C, treaty."], [377.8, 380.23, "The answer is B: agency."], [381.38, 384.65, "According to the reading, satellite technology now serves…"], [384.95, 389.81, "A, only soldiers. B, billions of ordinary people. C, no one yet."], [393.37, 396.69, "The answer is B: billions of ordinary people."], [397.9, 401.1, "Part six: speaking. It's your turn to talk."], [401.95, 405.84, "Should there be stronger international laws governing activity in space?"], [414.65, 416.16, "Now listen to Visal."], [416.46, 442.56, "I think there should be stronger international laws, because more countries and private companies now launch satellites. Orbital debris is increasing, and a single collision could disrupt communication for millions. Clear rules on traffic, debris and military use would protect everyone's access to space and prevent conflict. However, the rules must stay flexible enough to allow innovation."], [442.86, 444.58, "Excellent answer, Visal!"], [445.48, 451.44, "Great work! Now you can use eight new words and purpose: in order that and lest and so as not to."], [451.75, 456.45, "Today's value is scientific curiosity. Ask why, and then go and find out."], [456.75, 459.17, "See you in Unit nine. Goodbye!"], [459.47, 462.74, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit09-Global-Health-Diplomacy": [[0.35, 5.94, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.24, 9.81, "Hi! I'm Visal. Let's learn together!"], [10.11, 17.04, "Unit nine: Global Health Diplomacy. Today you will add emphasis by fronting adjectives and phrases with inversion."], [17.34, 19.92, "Here is our lesson map. Let's start!"], [20.87, 24.27, "Part one: words. You will learn eight new words."], [25.12, 26.54, "Pandemic response."], [27.55, 32.68, "Pandemic response means the actions governments take to control a disease that spreads worldwide."], [33.28, 35.84, "A fast pandemic response saved many lives."], [36.45, 39.61, "Your turn. Say: Pandemic response."], [42.47, 44.06, "Pandemic response."], [44.82, 46.42, "Vaccine distribution."], [47.42, 52.44, "Vaccine distribution means the process of delivering vaccines to people in different places."], [53.05, 56.07, "Fair vaccine distribution reaches rural clinics."], [56.68, 60.01, "Your turn. Say: Vaccine distribution."], [62.87, 64.82, "Vaccine distribution."], [65.58, 67.41, "World Health Organization."], [68.42, 73.74, "World Health Organization means the United Nations agency that leads international health work."], [74.35, 77.71, "The World Health Organization issued new guidelines."], [78.32, 81.71, "Your turn. Say: World Health Organization."], [84.57, 86.4, "World Health Organization."], [87.15, 88.48, "Health emergency."], [89.48, 93.69, "Health emergency means a sudden, serious danger to the health of many people."], [94.28, 96.57, "The government declared a health emergency."], [97.18, 100.24, "Your turn. Say: Health emergency."], [103.1, 104.91, "Health emergency."], [105.65, 107.19, "Cross-border outbreak."], [108.18, 112.78, "Cross-border outbreak means a sudden spread of disease from one country into others."], [113.38, 116.59, "A cross-border outbreak closed several airports."], [117.18, 120.3, "Your turn. Say: Cross-border outbreak."], [123.17, 125.44, "Cross-border outbreak."], [126.18, 127.69, "Global health equity."], [128.68, 133.46, "Global health equity means fair access to health care for people in every country."], [134.05, 137.14, "Global health equity remains an unfinished goal."], [137.75, 141.48, "Your turn. Say: Global health equity."], [144.33, 146.0, "Global health equity."], [146.75, 148.28, "Disease surveillance."], [149.28, 154.07, "Disease surveillance means the careful tracking of illnesses to spot outbreaks early."], [154.68, 157.69, "Disease surveillance detected the virus within days."], [158.28, 161.68, "Your turn. Say: Disease surveillance."], [164.53, 166.23, "Disease surveillance."], [166.98, 168.46, "International aid."], [169.45, 173.5, "International aid means money and help given by countries to others in need."], [174.12, 176.69, "International aid paid for new clinics."], [177.28, 180.09, "Your turn. Say: International aid."], [182.93, 184.36, "International aid."], [185.17, 188.92, "Part two: dialogue. Let's listen to a conversation."], [189.78, 196.28, "Visal, a report says 'Particularly worrying is the gap in vaccine distribution.' Why is 'is' before 'the gap'?"], [197.38, 209.98, "That is fronting with inversion. The adjective or phrase moves to the start for emphasis, then the verb comes before its subject. Normal order: The gap is particularly worrying."], [211.08, 213.18, "Is it only with adjectives?"], [214.28, 227.54, "No. 'Of greatest concern are cross-border outbreaks' and 'Among the main tasks is disease surveillance' also work. The structure suits formal reports and speeches."], [228.65, 230.46, "How do I choose the verb form?"], [231.55, 241.1, "The verb agrees with the real subject after it: 'Most urgent is the need' but 'Most urgent are the needs of poor countries'."], [242.23, 243.69, "Part three: grammar."], [244.55, 250.0, "Grammar focus: Fronting plus inversion: Adjective plus be plus subject."], [250.3, 251.52, "Look at the pattern."], [252.22, 255.46, "Particularly worrying is the gap in vaccine distribution."], [256.35, 260.43, "Of greatest concern are cross-border outbreaks of new diseases."], [261.32, 264.37, "Among the main tasks is reliable disease surveillance."], [265.33, 274.07, "Move an adjective or phrase to the start for emphasis, then put be before the subject. Make be agree with the real subject: …is the gap / …are the needs."], [274.82, 278.69, "Be careful! Don't say: Particularly worrying the gap is."], [280.63, 283.32, "Say: Particularly worrying is the gap."], [283.62, 285.28, "Put the verb before the subject."], [286.07, 288.55, "Part four: reading. Read and listen."], [289.33, 291.26, "When Disease Crosses Borders."], [291.56, 295.47, "A health emergency in one country can quickly become a global concern."], [296.47, 302.15, "Central to any pandemic response is disease surveillance, which spots a cross-border outbreak early."], [303.13, 308.89, "Equally important is fair vaccine distribution, because global health equity protects everyone."], [309.9, 315.14, "Leading the coordination is the World Health Organization, which advises governments and shares data."], [316.13, 320.51, "Vital, too, is international aid for countries whose health systems are weak."], [321.6, 325.87, "Part five: quiz. Five questions. Are you ready?"], [326.72, 329.82, "Particularly serious blank the shortage of vaccines."], [330.12, 332.93, "A, is. B, are. C, does."], [336.47, 337.91, "The answer is A: is."], [339.05, 342.85, "The organisation that leads global health cooperation is the blank."], [343.15, 347.79, "A, Summit. B, World Health Organization. C, Trade Bloc."], [351.33, 354.56, "The answer is B: World Health Organization."], [355.72, 357.39, "Choose the correct sentence."], [357.69, 364.93, "A, Most urgent is the need for aid.. B, Most urgent the need is for aid.. C, Most urgent need is the for aid.."], [368.47, 371.43, "The answer is A: Most urgent is the need for aid.."], [372.58, 376.29, "Fair access to health care for all countries is global health blank."], [376.59, 380.41, "A, debt. B, equity. C, militarization."], [383.97, 386.0, "The answer is B: equity."], [387.15, 390.33, "According to the reading, what spots an outbreak early?"], [390.63, 395.2, "A, border policy. B, tariffs. C, disease surveillance."], [398.77, 401.26, "The answer is C: disease surveillance."], [402.47, 405.78, "Part six: speaking. It's your turn to talk."], [406.62, 411.48, "Why is international cooperation especially important during a global pandemic?"], [420.28, 421.64, "Now listen to Visal."], [421.94, 451.27, "A pandemic crosses borders faster than any government can stop it, so one country's failure can threaten everyone. Cooperation lets nations share data on disease surveillance,
