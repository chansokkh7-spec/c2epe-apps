2, 423.73, "Great work! Now you can use eight new words and relative adverbs: where and when and why."], [424.03, 428.91, "Today's value is peaceful cooperation. Share resources through patience and dialogue."], [429.21, 431.92, "See you in Unit twenty-one. Goodbye!"], [432.22, 434.93, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit21-The-Mekong-Region": [[0.35, 5.76, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.06, 9.34, "Hi! I'm Visal. Let's learn together!"], [9.64, 16.14, "Unit twenty-one: The Mekong Region. Today you will set conditions with unless, provided that and as long as."], [16.45, 18.89, "Here is our lesson map. Let's start!"], [19.83, 23.04, "Part one: words. You will learn eight new words."], [23.88, 24.84, "Mekong."], [25.85, 30.09, "Mekong means the great river that flows through six Southeast Asian countries."], [30.68, 32.78, "The Mekong feeds millions of people."], [33.38, 35.79, "Your turn. Say: Mekong."], [38.63, 39.76, "Mekong."], [40.52, 41.35, "River."], [42.35, 45.81, "River means a large natural stream of water flowing to the sea."], [46.42, 48.79, "The river floods every rainy season."], [49.38, 52.26, "Your turn. Say: River."], [55.1, 55.89, "River."], [56.65, 57.44, "Dam."], [58.45, 61.74, "Dam means a wall built across a river to hold back water."], [62.35, 64.41, "The dam produces electricity."], [65.02, 67.26, "Your turn. Say: Dam."], [70.1, 70.89, "Dam."], [71.65, 72.67, "Fisheries."], [73.68, 77.42, "Fisheries means places or industries where fish are caught and sold."], [78.02, 80.4, "Fisheries provide protein for the region."], [80.98, 83.65, "Your turn. Say: Fisheries."], [86.5, 87.47, "Fisheries."], [88.22, 89.23, "Upstream."], [90.22, 93.88, "Upstream means towards the source of a river, against the flow."], [94.48, 96.26, "The dam was built upstream."], [96.85, 99.78, "Your turn. Say: Upstream."], [102.63, 103.59, "Upstream."], [104.35, 105.28, "Downstream."], [106.28, 109.76, "Downstream means in the direction the river flows, towards its mouth."], [110.35, 112.4, "Farmers downstream lost water."], [112.98, 115.3, "Your turn. Say: Downstream."], [118.13, 119.38, "Downstream."], [120.12, 121.33, "Cooperation."], [122.32, 126.07, "Cooperation means countries working together to reach a shared aim."], [126.68, 129.04, "Cooperation protects shared water."], [129.65, 132.42, "Your turn. Say: Cooperation."], [135.27, 136.48, "Cooperation."], [137.22, 138.43, "Livelihoods."], [139.42, 143.38, "Livelihoods means the ways in which people earn money and food to live."], [143.98, 146.27, "Livelihoods depend on a healthy river."], [146.88, 149.73, "Your turn. Say: Livelihoods."], [152.57, 153.94, "Livelihoods."], [154.73, 158.12, "Part two: dialogue. Let's listen to a conversation."], [158.98, 165.71, "Visal, an engineer says 'Fish stocks will survive provided that the dam releases enough water.' What does 'provided that' mean?"], [166.82, 179.28, "It means 'only if'. Provided that, providing, as long as and on condition that all set a condition. They use the present tense for the future: provided that the dam releases water."], [180.38, 181.88, "What about 'unless'?"], [182.98, 193.68, "'Unless' means 'if not'. 'Fisheries will collapse unless the flow is protected' equals 'if the flow is not protected'. Do not add a second negative after unless."], [194.78, 196.19, "Why is it useful?"], [197.28, 211.75, "It states clear conditions in agreements and reports: 'Upstream countries may build dams as long as they inform downstream neighbours.' It makes cooperation rules precise."], [212.9, 214.52, "Part three: grammar."], [215.35, 219.73, "Grammar focus: Conditions: unless and provided that and as long as."], [220.03, 221.34, "Look at the pattern."], [222.05, 225.14, "Fisheries will collapse unless the river flow is protected."], [226.05, 229.55, "Fish stocks will survive provided that the dam releases enough water."], [230.45, 234.27, "Upstream countries may build dams as long as they inform their neighbours."], [235.23, 243.63, "Unless = if not (never add another not). Provided that / as long as / on condition that = only if. Use the present tense, not will, in the condition."], [244.38, 248.38, "Be careful! Don't say: We will go unless it will rain."], [250.33, 252.72, "Say: We will go unless it rains."], [253.02, 255.16, "Use the present tense after unless."], [255.97, 258.72, "Part four: reading. Read and listen."], [259.53, 261.24, "Sharing the Mighty Mekong."], [261.54, 266.77, "The Mekong River flows through six countries and supports the livelihoods of tens of millions of people."], [267.77, 272.88, "A dam upstream can produce electricity, but it may reduce fish for communities downstream."], [273.87, 277.91, "Fisheries will decline unless water and sediment continue to flow naturally."], [278.9, 284.19, "Cooperation is possible provided that countries share data and warn each other about water releases."], [285.2, 290.22, "Agreements can work as long as every country accepts that the river belongs to the whole region."], [291.33, 295.44, "Part five: quiz. Five questions. Are you ready?"], [296.28, 298.5, "The crops will die blank it rains soon."], [298.8, 302.47, "A, unless. B, if. C, provided that."], [306.03, 308.01, "The answer is A: unless."], [309.15, 311.63, "We will sign blank they accept the conditions."], [311.93, 315.51, "A, unless. B, provided that. C, although."], [319.07, 321.27, "The answer is B: provided that."], [322.42, 324.13, "Choose the correct sentence."], [324.43, 333.48, "A, Unless the dam doesn't open, fish will die.. B, Unless the dam opens, fish will die.. C, Unless the dam will open, fish die.."], [337.03, 340.46, "The answer is B: Unless the dam opens, fish will die.."], [341.62, 344.06, "The direction towards the river's mouth is blank."], [344.36, 347.96, "A, upstream. B, downstream. C, inland."], [351.5, 353.51, "The answer is B: downstream."], [354.65, 358.46, "According to the reading, how many countries does the Mekong flow through?"], [358.76, 361.75, "A, three. B, six. C, nine."], [365.3, 367.29, "The answer is B: six."], [368.5, 371.61, "Part six: speaking. It's your turn to talk."], [372.45, 375.12, "Why does a dam in one country matter to another?"], [383.92, 385.3, "Now listen to Visal."], [385.6, 409.26, "A dam changes the flow, timing and quality of water for everyone downstream. Upstream dams can trap sediment and block fish, which reduces fisheries and farmland in other countries. Because the Mekong crosses many borders, countries need to share information and agree on rules. Cooperation protects livelihoods and prevents disputes over water."], [409.56, 411.41, "Excellent answer, Visal!"], [412.32, 418.19, "Great work! Now you can use eight new words and conditions: unless and provided that and as long as."], [418.49, 424.86, "Today's value is environmental responsibility. Small green actions at home help the whole planet."], [425.16, 427.79, "See you in Unit twenty-two. Goodbye!"], [428.09, 431.42, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit22-UN-Peacekeeping": [[0.35, 6.56, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.86, 10.31, "Hi! I'm Visal. Let's learn together!"], [10.61, 17.26, "Unit twenty-two: UN Peacekeeping. Today you will report actions formally with the passive and no agent."], [17.56, 20.22, "Here is our lesson map. Let's start!"], [21.17, 24.42, "Part one: words. You will learn eight new words."], [25.28, 26.35, "Peacekeeping."], [27.35, 31.45, "Peacekeeping means the use of international forces to help keep a peace agreement."], [32.05, 34.4, "Peacekeeping reduced fighting in the region."], [34.98, 37.79, "Your turn. Say: Peacekeeping."], [40.63, 41.7, "Peacekeeping."], [42.45, 43.82, "Blue helmets."], [44.82, 48.94, "Blue helmets means the nickname for United Nations peacekeeping soldiers."], [49.55, 51.67, "The blue helmets patrolled the border."], [52.25, 55.66, "Your turn. Say: Blue helmets."], [58.5, 59.8, "Blue helmets."], [60.55, 61.76, "Ceasefire."], [62.75, 66.13, "Ceasefire means an agreement to stop fighting for a period."], [66.72, 68.76, "The ceasefire lasted only a week."], [69.35, 72.23, "Your turn. Say: Ceasefire."], [75.1, 76.14, "Ceasefire."], [76.88, 77.71, "Mandate."], [78.72, 83.09, "Mandate means the official instructions that define a mission's tasks."], [83.68, 86.39, "The mandate allowed troops to protect civilians."], [86.98, 89.47, "Your turn. Say: Mandate."], [92.33, 93.24, "Mandate."], [93.98, 94.86, "Troops."], [95.85, 98.72, "Troops means soldiers who serve together as a group."], [99.32, 101.7, "Troops from many countries joined the mission."], [102.28, 105.33, "Your turn. Say: Troops."], [108.17, 109.06, "Troops."], [109.82, 110.99, "Civilians."], [111.98, 115.91, "Civilians means people who are not members of the armed forces."], [116.52, 119.12, "Civilians were moved to safe areas."], [119.72, 122.35, "Your turn. Say: Civilians."], [125.2, 126.44, "Civilians."], [127.18, 128.14, "Conflict."], [129.15, 132.22, "Conflict means a serious fight or war between groups."], [132.82, 135.09, "The conflict lasted ten years."], [135.68, 138.12, "Your turn. Say: Conflict."], [140.97, 141.9, "Conflict."], [142.65, 144.25, "Security Council."], [145.25, 150.58, "Security Council means the United Nations body responsible for international peace."], [151.18, 153.53, "The Security Council voted on the mission."], [154.12, 156.98, "Your turn. Say: Security Council."], [159.83, 161.36, "Security Council."], [162.17, 165.84, "Part two: dialogue. Let's listen to a conversation."], [166.68, 172.3, "Visal, a UN report says 'Troops were deployed and civilians were evacuated.' Who did these actions?"], [173.38, 184.91, "The report does not say. The formal passive hides the agent because it is obvious or unimportant. The focus stays on the action and on the people affected."], [186.02, 187.71, "When should we mention the agent?"], [188.82, 201.24, "When it matters: 'The ceasefire was broken by armed groups.' Use by + agent to show responsibility. Without it, the passive can sound neutral and sometimes hides blame."], [202.35, 203.95, "Which tenses are common?"], [205.05, 216.58, "Past passive for events (was deployed), present perfect for results (has been extended) and modal passive for rules (must be protected). Check the auxiliary agrees with the subject."], [217.73, 219.22, "Part three: grammar."], [220.08, 223.35, "Grammar focus: Formal passive (agent omitted)."], [223.65, 224.81, "Look at the pattern."], [225.52, 227.98, "Troops were deployed along the ceasefire line."], [228.88, 231.74, "The mandate has been extended by the Security Council."], [232.65, 235.81, "Civilians must be protected from violence at all times."], [236.77, 245.78, "Use be + past participle to focus on the action. Add by + agent only when it matters; omitting it can sound neutral but may hide responsibility."], [246.52, 250.24, "Be careful! Don't say: Troops was deployed to the border."], [252.2, 255.34, "Say: Troops were deployed to the border."], [255.64, 258.02, "The auxiliary must agree with the subject."], [258.83, 261.46, "Part four: reading. Read and listen."], [262.27, 263.56, "Keeping the Peace."], [263.86, 268.49, "After a conflict ends, a ceasefire must be monitored so that fighting does not restart."], [269.5, 275.87, "Blue helmets are sent by the Security Council under a clear mandate, and troops are deployed to protect civilians."], [276.87, 282.25, "Mandates are sometimes written too broadly, so missions are asked to do more than their resources allow."], [283.23, 289.34, "Peacekeeping succeeds when local communities are consulted and when agreements are respected by all parties."], [290.33, 295.0, "It fails when civilians are left unprotected or when the mission is not supported."], [296.1, 300.23, "Part five: quiz. Five questions. Are you ready?"], [301.08, 304.04, "The ceasefire blank by both sides yesterday."], [304.33, 307.59, "A, was signed. B, signed. C, were signed."], [311.13, 312.94, "The answer is A: was signed."], [314.08, 315.78, "Which sentence is passive?"], [316.08, 322.25, "A, Troops protected the town.. B, The town was protected by troops.. C, Troops are protect the town.."], [325.8, 329.22, "The answer is B: The town was protected by troops.."], [330.35, 334.05, "The official instructions that define a mission's tasks are its blank."], [334.35, 337.35, "A, mandate. B, tariff. C, aid."], [340.9, 342.97, "The answer is A: mandate."], [344.12, 346.07, "People who are not soldiers are blank."], [346.37, 350.28, "A, civilians. B, troops. C, delegates."], [353.83, 356.2, "The answer is A: civilians."], [357.35, 360.59, "According to the reading, which body sends the blue helmets?"], [360.89, 365.61, "A, The Security Council. B, A trade bloc. C, A local bank."], [369.17, 372.0, "The answer is A: The Security Council."], [373.2, 376.26, "Part six: speaking. It's your turn to talk."], [377.12, 380.09, "What makes peacekeeping missions succeed or fail?"], [388.88, 390.29, "Now listen to Visal."], [390.59, 417.86, "Peacekeeping succeeds when the mission has a clear mandate, enough troops and equipment, and the consent of the conflicting parties. Local trust is important, so civilians should be consulted and protected. Missions fail when mandates are unrealistic, funding is cut or the peace agreement is not respected. Political support from the Security Council matters as much as military strength."], [418.16, 420.06, "Excellent answer, Visal!"], [420.95, 425.55, "Great work! Now you can use eight new words and formal passive (agent omitted)."], [425.85, 429.31, "Today's value is courage. Try new things and be brave."], [429.61, 433.35, "See you in Unit twenty-three. Goodbye!"], [433.65, 436.37, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit23-Pandemic-Preparedness": [[0.35, 5.95, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.25, 9.85, "Hi! I'm Visal. Let's learn together!"], [10.15, 17.55, "Unit twenty-three: Pandemic Preparedness. Today you will explain earlier events with the past perfect continuous."], [17.85, 20.53, "Here is our lesson map. Let's start!"], [21.47, 24.98, "Part one: words. You will learn eight new words."], [25.82, 26.77, "Pandemic."], [27.78, 31.64, "Pandemic means a disease outbreak that spreads across many countries."], [32.25, 34.91, "The pandemic closed schools worldwide."], [35.52, 37.91, "Your turn. Say: Pandemic."], [40.77, 41.73, "Pandemic."], [42.48, 43.53, "Preparedness."], [44.52, 48.03, "Preparedness means being ready in advance to deal with a crisis."], [48.62, 50.64, "Preparedness saves lives and money."], [51.25, 53.66, "Your turn. Say: Preparedness."], [56.5, 57.55, "Preparedness."], [58.28, 59.49, "Surveillance."], [60.48, 64.91, "Surveillance means the careful tracking of illness to detect outbreaks early."], [65.52, 68.02, "Surveillance found the first cases quickly."], [68.62, 71.63, "Your turn. Say: Surveillance."], [74.47, 75.8, "Surveillance."], [76.55, 77.5, "Vaccine."], [78.52, 82.01, "Vaccine means a medicine that trains the body to fight a disease."], [82.62, 85.71, "The vaccine was tested on thousands of volunteers."], [86.32, 88.82, "Your turn. Say: Vaccine."], [91.67, 93.1, "Vaccine."], [93.85, 95.16, "Supply chain."], [96.15, 100.42, "Supply chain means the network that makes and delivers goods such as medicines."], [101.02, 103.54, "A damaged supply chain delayed the masks."], [104.15, 107.05, "Your turn. Say: Supply chain."], [109.9, 111.11, "Supply chain."], [111.85, 113.04, "Cooperation."], [114.05, 117.55, "Cooperation means countries and scientists working together."], [118.15, 120.68, "Cooperation sped up vaccine research."], [121.28, 123.84, "Your turn. Say: Cooperation."], [126.7, 127.97, "Cooperation."], [128.72, 129.81, "Outbreak."], [130.82, 134.75, "Outbreak means a sudden rise in cases of a disease in one area."], [135.35, 137.59, "The outbreak began in a busy market."], [138.18, 140.69, "Your turn. Say: Outbreak."], [143.53, 144.56, "Outbreak."], [145.32, 146.32, "Early warning."], [147.32, 151.71, "Early warning means a signal that danger is coming, given in time to act."], [152.32, 155.14, "An early warning system alerted hospitals."], [155.75, 158.36, "Your turn. Say: Early warning."], [161.2, 162.33, "Early warning."], [163.13, 166.66, "Part two: dialogue. Let's listen to a conversation."], [167.52, 175.22, "Visal, a historian writes 'By the time the alarm was raised, the virus had been spreading for weeks.' What is 'had been spreading'?"], [176.32, 187.62, "The past perfect continuous: had been + -ing. It shows an action that was in progress for some time before another past moment. Here the spreading started before the alarm."], [188.72, 190.82, "How is it different from the past perfect?"], [191.92, 206.18, "Past perfect states completion: 'Scientists had identified the virus.' The continuous stresses duration or an unfinished process: 'Scientists had been tracking it for weeks.'"], [207.28, 209.27, "Can you give an example with a cause?"], [210.38, 220.97, "'Hospitals were exhausted because staff had been working without rest.' The continuous action explains the situation. Use for or since to show how long."], [222.13, 223.53, "Part three: grammar."], [224.38, 228.95, "Grammar focus: Past perfect continuous: had been plus -ing."], [229.25, 230.53, "Look at the pattern."], [231.22, 235.55, "By the time the alarm sounded, the virus had been spreading for several weeks."], [236.45, 240.57, "Hospitals were exhausted because staff had been working without rest since March."], [241.48, 244.68, "Scientists realised they had been tracking the wrong variant."], [245.63, 253.43, "Use had been + -ing for an action that continued up to a past moment and explains it: The virus had been spreading for weeks before the alarm."], [254.18, 257.42, "Be careful! Don't say: She had been wait for an hour."], [259.37, 261.89, "Say: She had been waiting for an hour."], [262.19, 263.84, "Use -ing after had been."], [264.63, 267.32, "Part four: reading. Read and listen."], [268.13, 269.82, "Lessons from a Pandemic."], [270.12, 275.06, "When the pandemic reached the news, the virus had already been spreading quietly for weeks."], [276.07, 280.85, "Weak surveillance meant that early warning signals had been ignored, and the outbreak grew."], [281.87, 288.02, "Hospitals struggled because staff had been working for months without rest, and the supply chain had been breaking down."], [289.03, 294.25, "A vaccine arrived faster than anyone had been expecting, thanks to scientific cooperation."], [295.23, 302.05, "The main lesson is preparedness: detect early, share data, protect supplies and trust expert advice."], [303.17, 307.06, "Part five: quiz. Five questions. Are you ready?"], [307.92, 311.38, "By 2020, the virus blank for weeks."], [311.68, 315.56, "A, had been spreading. B, was spread. C, spreads."], [319.1, 321.44, "The answer is A: had been spreading."], [322.58, 324.45, "Which sentence stresses duration?"], [324.75, 329.78, "A, They had left.. B, They had been waiting for hours.. C, They left.."], [333.33, 336.3, "The answer is B: They had been waiting for hours.."], [337.45, 341.54, "A signal that gives time to act before danger arrives is an early blank."], [341.84, 344.98, "A, warning. B, treaty. C, tariff."], [348.53, 350.39, "The answer is A: warning."], [351.55, 354.91, "The sudden spread of a disease in one area is an blank."], [355.21, 359.29, "A, outbreak. B, alliance. C, exchange."], [362.83, 365.04, "The answer is A: outbreak."], [366.18, 368.85, "According to the reading, what is the main lesson?"], [369.14, 372.91, "A, preparedness. B, secrecy. C, delay."], [376.47, 378.48, "The answer is A: preparedness."], [379.67, 382.69, "Part six: speaking. It's your turn to talk."], [383.55, 386.48, "What lessons did the world learn from COVID-19?"], [395.28, 396.66, "Now listen to Visal."], [396.96, 420.86, "The world learned that early warning, honest data sharing and strong health systems save lives. Countries that had invested in surveillance and supply chains responded faster. Vaccines were developed quickly through cooperation, but unequal access showed why fair distribution matters. The key lesson is to prepare before the next outbreak begins."], [421.16, 422.73, "Excellent answer, Visal!"], [423.62, 429.47, "Great work! Now you can use eight new words and past perfect continuous: had been plus -ing."], [429.77, 434.93, "Today's value is resilience. Prepare for setbacks, and recover from them with strength."], [435.23, 438.56, "See you in Unit twenty-four. Goodbye!"], [438.86, 441.77, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit24-Global-Education-Goals": [[0.35, 5.56, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [5.86, 9.33, "Hi! I'm Visal. Let's learn together!"], [9.63, 16.92, "Unit twenty-four: Global Education Goals. Today you will strengthen comparisons with far, much and by far."], [17.22, 19.77, "Here is our lesson map. Let's start!"], [20.73, 24.04, "Part one: words. You will learn eight new words."], [24.88, 26.13, "Education."], [27.12, 30.36, "Education means the process of learning knowledge and skills."], [30.95, 33.54, "Education opens doors to better jobs."], [34.15, 36.67, "Your turn. Say: Education."], [39.53, 40.64, "Education."], [41.38, 42.66, "SDG 4."], [43.65, 48.3, "SDG 4 means the United Nations goal for inclusive and quality education."], [48.88, 52.61, "SDG 4 promises learning for all by 2030."], [53.22, 55.88, "Your turn. Say: SDG 4."], [58.73, 60.6, "SDG 4."], [61.35, 62.29, "Access."], [63.28, 66.41, "Access means the ability to reach or use something."], [67.02, 70.0, "Access to school is limited in remote villages."], [70.62, 73.47, "Your turn. Say: Access."], [76.3, 77.38, "Access."], [78.12, 79.03, "Quality."], [80.02, 82.86, "Quality means how good or effective something is."], [83.45, 85.7, "Quality matters as much as quantity."], [86.32, 89.0, "Your turn. Say: Quality."], [91.87, 92.7, "Quality."], [93.45, 94.54, "Literacy."], [95.55, 98.18, "Literacy means the ability to read and write."], [98.78, 101.1, "Literacy rose after the new programme."], [101.68, 104.23, "Your turn. Say: Literacy."], [107.07, 108.06, "Literacy."], [108.82, 110.31, "Girls' education."], [111.32, 115.33, "Girls' education means schooling opportunities for girls and young women."], [115.92, 118.6, "Girls' education improves family health."], [119.22, 122.42, "Your turn. Say: Girls' education."], [125.27, 126.67, "Girls' education."], [127.42, 128.38, "Teachers."], [129.38, 132.85, "Teachers means the people whose job is to educate students."], [133.45, 135.74, "Teachers shape every child's future."], [136.35, 139.19, "Your turn. Say: Teachers."], [142.03, 143.14, "Teachers."], [143.88, 144.65, "Funding."], [145.65, 148.75, "Funding means money provided for a particular purpose."], [149.35, 151.22, "Funding for schools was increased."], [151.82, 154.19, "Your turn. Say: Funding."], [157.03, 157.94, "Funding."], [158.73, 162.1, "Part two: dialogue. Let's listen to a conversation."], [162.95, 169.24, "Visal, a UN report says 'Funding for teachers is by far the most important factor.' What does 'by far' do?"], [170.35, 183.35, "It strengthens a superlative: by far the most important. For comparatives we use far, much or considerably: 'Girls' education brings far greater benefits than expected.'"], [184.45, 186.07, "Can we weaken a comparison?"], [187.15, 200.51, "Yes: slightly better, a little more access, not quite as high. 'Quality is nearly as important as access' shows two things almost equal. 'Twice as many' gives a precise ratio."], [201.62, 203.48, "Which mistakes should I avoid?"], [204.58, 216.48, "Do not use 'very' before a comparative: not 'very better'. Say 'much better'. Avoid double comparatives such as 'more higher'. Use either -er or more, never both."], [217.63, 219.24, "Part three: grammar."], [220.08, 224.15, "Grammar focus: Modified comparatives and superlatives."], [224.45, 225.68, "Look at the pattern."], [226.38, 230.74, "Funding for teachers is by far the most important factor in raising quality."], [231.65, 235.58, "Girls' education brings far greater benefits than most people expect."], [236.48, 240.5, "Access is nearly as important as quality in SDG 4."], [241.47, 249.49, "Use much / far / considerably before comparatives (far greater) and by far before superlatives (by far the most). Never say very better or more higher."], [250.25, 253.99, "Be careful! Don't say: This is very better than before."], [255.93, 258.61, "Say: This is much better than before."], [258.91, 261.68, "Use much, not very, before a comparative."], [262.5, 265.07, "Part four: reading. Read and listen."], [265.87, 267.32, "Learning for Everyone."], [267.62, 274.32, "SDG 4 aims to give every child access to quality education, but progress has been far slower than hoped."], [275.33, 283.32, "Literacy rates are considerably higher in countries that invest in teachers, and girls' education brings by far the greatest long-term benefit."], [284.33, 289.53, "Funding matters, yet in many regions classrooms are still much more crowded than the standards recommend."], [290.53, 296.02, "Access is nearly as important as quality, because a school that children cannot reach teaches no one."], [297.0, 301.51, "Where teachers are better trained and better supported, results improve far more quickly."], [302.6, 306.71, "Part five: quiz. Five questions. Are you ready?"], [307.55, 309.69, "This is blank the best school in the region."], [309.99, 313.67, "A, very. B, by far. C, more."], [317.2, 319.13, "The answer is B: by far."], [320.28, 322.69, "The new method is blank better than the old one."], [322.99, 326.36, "A, very. B, much. C, most."], [329.9, 331.77, "The answer is B: much."], [332.92, 334.65, "Choose the correct sentence."], [334.95, 343.91, "A, Girls' education is very more important.. B, Girls' education is far more important.. C, Girls' education is more important far.."], [347.47, 351.16, "The answer is B: Girls' education is far more important.."], [352.32, 354.64, "The ability to read and write is blank."], [354.94, 358.35, "A, literacy. B, funding. C, quality."], [361.9, 363.76, "The answer is A: literacy."], [364.92, 368.53, "According to the reading, what does a school that children cannot reach do?"], [368.83, 374.09, "A, teaches no one. B, improves quality. C, reduces funding."], [377.63, 379.74, "The answer is A: teaches no one."], [380.93, 384.42, "Part six: speaking. It's your turn to talk."], [385.28, 387.96, "What would most improve education worldwide?"], [396.75, 398.28, "Now listen to Visal."], [398.58, 420.21, "I believe investing in well-trained, well-paid teachers would improve education the most. Good teachers raise literacy and make schools worth attending. Funding must also reach girls and rural communities so that access is fair. Quality and access together matter far more than expensive buildings or technology alone."], [420.51, 422.22, "Excellent answer, Visal!"], [423.12, 428.38, "Great work! Now you can use eight new words and modified comparatives and superlatives."], [428.68, 434.43, "Today's value is educational equity. Every learner deserves a fair chance to succeed."], [434.73, 437.43, "See you in Unit twenty-five. Goodbye!"], [437.73, 440.74, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-NP4-Unit25-AI-and-Global-Rules": [[0.35, 5.87, "Hello, everyone! I'm Ms. Emma. Welcome to Online Newspaper Class, level four."], [6.17, 9.62, "Hi! I'm Visal. Let's learn together!"], [9.92, 16.29, "Unit twenty-five: AI and Global Rules. Today you will express duties and freedoms in regulation."], [16.59, 19.12, "Here is our lesson map. Let's start!"], [20.07, 23.51, "Part one: words. You will learn eight new words."], [24.35, 26.07, "Artificial intelligence."], [27.08, 32.87, "Artificial intelligence means computer systems that perform tasks normally needing human thinking."], [33.48, 37.14, "Artificial intelligence now translates languages instantly."], [37.75, 41.28, "Your turn. Say: Artificial intelligence."], [44.13, 46.06, "Artificial intelligence."], [46.82, 48.03, "Regulation."], [49.02, 53.38, "Regulation means an official rule or the process of controlling something by rules."], [53.98, 56.38, "Regulation protects users from harm."], [56.98, 59.33, "Your turn. Say: Regulation."], [62.2, 63.36, "Regulation."], [64.12, 65.19, "Ethics."], [66.18, 69.3, "Ethics means moral principles about what is right and wrong."], [69.88, 72.17, "Ethics guides how data should be used."], [72.78, 75.32, "Your turn. Say: Ethics."], [78.17, 79.14, "Ethics."], [79.88, 80.67, "Risk."], [81.68, 85.05, "Risk means the possibility that something harmful will happen."], [85.65, 87.94, "The risk of bias must be tested."], [88.55, 91.41, "Your turn. Say: Risk."], [94.27, 95.21, "Risk."], [95.95, 97.23, "Transparency."], [98.22, 102.09, "Transparency means being open about how decisions and systems work."], [102.68, 104.98, "Transparency builds public trust."], [105.58, 108.73, "Your turn. Say: Transparency."], [111.6, 113.09, "Transparency."], [113.85, 115.64, "International cooperation."], [116.65, 120.9, "International cooperation means countries working together on a common problem."], [121.52, 124.75, "International cooperation can set common standards."], [125.35, 128.94, "Your turn. Say: International cooperation."], [131.8, 133.74, "International cooperation."], [134.48, 135.57, "Innovation."], [136.55, 139.98, "Innovation means a new idea, method or product."], [140.58, 142.63, "Innovation drives economic growth."], [143.22, 145.82, "Your turn. Say: Innovation."], [148.67, 149.67, "Innovation."], [150.42, 151.67, "Accountability."], [152.68, 156.67, "Accountability means being responsible for your actions and decisions."], [157.28, 160.33, "Accountability means someone answers for mistakes."], [160.92, 164.02, "Your turn. Say: Accountability."], [166.87, 168.09, "Accountability."], [168.9, 172.92, "Part two: dialogue. Let's listen to a conversation."], [173.78, 179.95, "Visal, a draft law says 'Developers are required to publish their testing results.' How is that different from 'must'?"], [181.05, 193.93, "'Are required to' and 'are obliged to' describe a duty that comes from a rule, so they suit regulation. 'Must' can come from the speaker. 'Should' and 'ought to' give advice, not a legal duty."], [195.05, 197.05, "What about prohibition and permission?"], [198.15, 208.15, "'Must not' and 'are prohibited from + -ing' ban things. 'Are not required to' means no duty, which is different from 'must not'. 'Are permitted to' or 'may' gives permission."], [209.25, 210.85, "Why is the difference important?"], [211.95, 224.02, "In regulation, a small difference changes legal responsibility. 'Need not' means optional, but 'must not' means forbidden. Writers must choose carefully to avoid loopholes."], [225.17, 226.68, "Part three: grammar."], [227.52, 233.13, "Grammar focus: Obligation in rules: required to and must not and need not."], [233.43, 234.62, "Look at the pattern."], [235.32, 238.42, "Developers are required to publish their testing results."], [239.32, 242.04, "Companies must not use AI to mislead the public."], [242.95, 245.93, "Small firms need not appoint an ethics officer."], [246.87, 256.3, "Be required to / be obliged to = a duty from a rule; must not = forbidden; need not / are not required to = optional. Should / ought to = advice."], [257.05, 261.44, "Be careful! Don't say: Firms must not to share the data."], [263.4, 265.68, "Say: Firms must not share the data."], [265.98, 268.21, "Use the base verb after must not."], [269.0, 271.64, "Part four: reading. Read and listen."], [272.43, 274.15, "Writing Rules for Machines."], [274.45, 279.9, "Artificial intelligence brings enormous innovation, but it also creates new risk."], [280.9, 287.99, "A proposed regulation says that developers are required to explain how their systems work, and companies must not hide errors."], [289.0, 293.41, "Transparency means that users are obliged to be told when they are speaking to a machine."], [294.4, 300.78, "Ethics boards ought to include voices from many countries, and small firms need not meet the same costs as giants."], [301.77, 308.07, "International cooperation is essential, because accountability fails if each nation writes different rules."], [309.17, 313.18, "Part five: quiz. Five questions. Are you ready?"], [314.02, 317.05, "Companies blank publish their data; it is the law."], [317.35, 320.92, "A, are required to. B, need not. C, ought."], [324.47, 326.95, "The answer is A: are required to."], [328.12, 330.57, "Which expression means the action is optional?"], [330.87, 334.63, "A, must not. B, need not. C, are required to."], [338.17, 340.42, "The answer is B: need not."], [341.58, 343.43, "Choose the correct sentence."], [343.73, 351.62, "A, Firms must not to share private data.. B, Firms must not share private data.. C, Firms must not sharing private data.."], [355.17, 359.19, "The answer is B: Firms must not share private data.."], [360.35, 363.41, "Being open about how a system works is called blank."], [363.71, 367.57, "A, transparency. B, tariff. C, debris."], [371.13, 373.5, "The answer is A: transparency."], [374.65, 377.82, "According to the reading, accountability fails if…"], [378.12, 383.33, "A, rules differ in each nation. B, machines are slow. C, users read terms."], [386.87, 389.92, "The answer is A: rules differ in each nation."], [391.13, 394.24, "Part six: speaking. It's your turn to talk."], [395.08, 398.43, "Should there be global rules for artificial intelligence?"], [407.22, 408.77, "Now listen to Visal."], [409.07, 434.32, "I think there should be at least basic global rules, because artificial intelligence crosses borders and its risks affect everyone. Common standards on transparency, safety testing and accountability would stop companies from choosing the weakest country. At the same time, the rules should remain flexible so that innovation can continue and local values can be respected."], [434.62, 436.45, "Excellent answer, Visal!"], [437.35, 443.58, "Great work! Now you can use eight new words and obligation in rules: required to and must not and need not."], [443.88, 449.03, "Today's value is ethical responsibility. Take ownership of the effects of what you create."], [449.33, 456.67, "Congratulations! You have finished Online Newspaper Class, level four. See you in Online Newspaper Class, level five!"], [456.97, 460.17, "Thank you, Ms. Emma! Bye, everyone!"]]};
        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>

                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        function renderContent() {
            let contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            stopVideo();                 // never leave a video playing in the background
            stopTalkTimer();             // ...or a Let's Talk timer running
            updateVideoTabBadge();
            // Always shows the real level and unit (it used to say "A1" on every level)
            document.getElementById('platform-info').textContent = `C2-EPE Newspaper Class - ${gradeName(state.level)} (Unit ${state.unit}: ${unitData.title})`;
            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'learn') renderLearn(contentDiv, unitData);
            else if (state.tab === 'terms') renderTerms(contentDiv, unitData);
            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'think') renderThink(contentDiv, unitData);
            else if (state.tab === 'funfact') renderFunFact(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);
            else if (state.tab === 'spelling') renderSpelling(contentDiv, unitData);
            else if (state.tab === 'sentence') renderSentenceBuilding(contentDiv, unitData);
            else if (state.tab === 'summary') renderSummaryWriting(contentDiv, unitData);
            else if (state.tab === 'headline') renderHeadlineWriting(contentDiv, unitData);
            else if (state.tab === 'factopinion') renderFactOpinion(contentDiv, unitData);
            else if (state.tab === 'debate') renderDebateCorner(contentDiv, unitData);
            else if (state.tab === 'discussion') renderDiscussion(contentDiv, unitData);
            else if (state.tab === 'dictation') renderDictation(contentDiv, unitData);
            else if (state.tab === 'review') renderReview(contentDiv, unitData);
            else if (state.tab === 'pronunciation') renderPronunciationDrill(contentDiv, unitData);
            else if (state.tab === 'exam') renderExamPractice(contentDiv, unitData);
            else if (state.tab === 'challenge') renderGoal(contentDiv, unitData);
            else if (state.tab === 'codelab') renderCodeLab(contentDiv, unitData);
        }

        // ===== MY PROGRESS =====
        const ALL_TABS = ['video','learn','terms','quiz','think','funfact','vocabgame','spelling','sentence','summary','headline','factopinion','debate','discussion','dictation','review','pronunciation','exam','challenge'];
        function markActivityComplete(tab) {
            progress.completed = progress.completed || {};
            const key = state.level + '_' + state.unit + '_' + tab;
            if (!progress.completed[key]) { progress.completed[key] = true; saveProgress(); }
        }
        function showMyProgress() {
            const lines = LEVELS_ORDER.map(lvl => {
                let data = null;
                if (lvl === state.level) data = progress;
                else { try { data = JSON.parse(localStorage.getItem(PROGRESS_PREFIX + lvl) || 'null'); } catch (e) {} }
                const done = data && data.completed ? Object.keys(data.completed).filter(k => k.startsWith(lvl + '_')).length : 0;
                const total = Object.keys(curriculum[lvl]).length * ALL_TABS.length;
                return `${gradeName(lvl)}: ${done} / ${total} activities (${Math.round(done / total * 100)}%)${lvl === state.level ? ' ← current' : ''}`;
            }).join('\n');
            const unitDone = ALL_TABS.filter(t => progress.completed && progress.completed[state.level + '_' + state.unit + '_' + t]).length;
            alert(`📊 My Progress\n\n⭐ Stars: ${state.stars}\n🏆 Badges: ${state.badges}\n\nThis unit (Unit ${state.unit}): ${unitDone} / ${ALL_TABS.length} modules done\n\n${lines}\n\n(Saved on this device/browser only. Inside the Hub, progress lasts until the page is closed.)`);
        }

        // ===== 1. LEARN =====
        function renderLearn(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">📖 Learn: ${unitData.title}</h2>
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200">
                    <p class="text-gray-800 leading-relaxed bg-white p-5 rounded-xl shadow-inner text-lg mb-3">${unitData.passage}</p>
                    <div class="flex gap-3 flex-wrap items-center">
                        <button onclick="readPassageAloud()" class="bg-slate-600 hover:bg-slate-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Read Aloud</button>
                        <button onclick="finishReading()" class="bg-white border border-slate-300 text-slate-800 font-bold px-5 py-2 rounded-full shadow cursor-pointer">✅ I read it</button>
                    </div>
                    <p id="learn-msg" class="text-sm mt-3 font-semibold text-green-600 min-h-[1.25rem]"></p>
                </div>`;
        }
        // Reading counts as done after listening OR tapping "I read it" (listening used to be the
        // only way, and speech doesn't work in every browser)
        function finishReading() {
            markActivityComplete('learn');
            document.getElementById('learn-msg').textContent = '✅ Well done!' + (award(unitKey('learn'), 2) ? ' (+2 ⭐)' : '');
        }
        function readPassageAloud() {
            speak(curriculum[state.level][state.unit].passage, (ok) => { if (ok && document.getElementById('learn-msg')) finishReading(); });
        }

        // ===== 2. KEY TERMS (flip-cards) =====
        let termsHeard = new Set();
        function renderTerms(contentDiv, unitData) {
            termsHeard = new Set(unitData.terms.map((_, i) => i).filter(i => wasAwarded(unitKey('term-' + i))));
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">🗂️ Key Terms: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">Tap each card to hear it and flip to the picture!</p>
                <div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-6">
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
                        ${unitData.terms.map((w, i) => `
                            <div class="flip-card" id="tw-${i}" role="button" tabindex="0" onclick="playTerm('${escapeJsStr(w)}', ${i})">
                                <div class="flip-card-inner">
                                    <div class="flip-card-front bg-white shadow font-bold text-slate-800 text-sm ${termsHeard.has(i) ? 'ring-4 ring-green-400' : ''}">
                                        🔊 <span>${w}</span>
                                    </div>
                                    <div class="flip-card-back bg-slate-600 shadow text-white">
                                        <span class="text-3xl">${emojiFor(w, unitData)}</span>
                                        <span class="text-xs font-bold mt-1">${w}</span>
                                    </div>
                                </div>
                            </div>`).join('')}
                    </div>
                    <p id="terms-progress" class="text-center text-sm font-semibold text-slate-700">Heard ${termsHeard.size} / ${unitData.terms.length} terms</p>
                </div>`;
        }
        function playTerm(word, i) {
            speak(word);
            const card = document.getElementById('tw-' + i);
            card.classList.toggle('flipped');
            if (award(unitKey('term-' + i), 1)) card.querySelector('.flip-card-front').classList.add('ring-4', 'ring-green-400');
            if (!termsHeard.has(i)) {
                termsHeard.add(i);
                const total = curriculum[state.level][state.unit].terms.length;
                document.getElementById('terms-progress').textContent = `Heard ${termsHeard.size} / ${total} terms`;
                if (termsHeard.size === total) { markActivityComplete('terms'); triggerConfetti(); }
            }
        }

        // ===== 3. QUIZ (listen and choose) =====
        // Answers lock after the first tap, and stars are given only for beating your best score
        let quizState = { qIndex: 0, score: 0, order: [], currentAnswer: '', locked: false };
        function renderQuiz(contentDiv, unitData) {
            quizState = { qIndex: 0, score: 0, order: shuffle([...new Set(unitData.terms)]), currentAnswer: '', locked: false };
            showQuizQuestion();
        }
        function showQuizQuestion() {
            const contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            quizState.locked = false;
            if (quizState.qIndex >= quizState.order.length) {
                const total = quizState.order.length;
                const pct = Math.round((quizState.score / total) * 100); try { window.C2REPORT && C2REPORT('Vocabulary Quiz', quizState.score, total, state); } catch (e) {}
                const bestKey = state.level + '|' + unitKey('quiz');
                const best = progress.best[bestKey] || 0;
                const earned = Math.max(0, quizState.score - best) * 2;
                if (quizState.score > best) progress.best[bestKey] = quizState.score;
                markActivityComplete('quiz');
                if (earned > 0) addStars(earned); else saveProgress();
                if (pct === 100) triggerConfetti();
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-slate-900 mb-2">🧩 Quiz Complete!</h2>
                    <div class="bg-purple-50 p-8 rounded-2xl border border-purple-200 text-center">
                        <div class="text-5xl mb-3">${pct === 100 ? '🏆' : pct >= 50 ? '🎉' : '💪'}</div>
                        <p class="font-bold text-purple-900 text-2xl mb-2">${quizState.score} / ${total} Correct</p>
                        <p class="text-gray-600 mb-4">${earned > 0 ? `You earned ${earned} ⭐` : (best >= total ? 'Perfect score already! 🌟' : `Your best is ${Math.max(best, quizState.score)} / ${total} — beat it to earn more ⭐`)}</p>
                        <button onclick="renderQuiz(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="bg-purple-700 hover:bg-purple-800 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer">🔁 Try Again</button>
                    </div>`;
                return;
            }
            const term = quizState.order[quizState.qIndex];
            const distractors = shuffle(allTermsForLevel(state.level).filter(w => w !== term)).slice(0, 3);
            const options = shuffle([term, ...distractors]);
            quizState.currentAnswer = term;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">🧩 Quiz</h2>
                <p class="text-sm text-gray-500 mb-3">Question ${quizState.qIndex + 1} of ${quizState.order.length}</p>
                <div class="bg-purple-50 p-6 rounded-2xl border border-purple-200">
                    <p class="font-bold text-purple-900 mb-2">🔊 Listen and choose the word you heard:</p>
                    <button onclick="speak(quizState.currentAnswer)" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-5 py-2 rounded-full shadow mb-4 cursor-pointer">🔊 Play Word</button>
                    <div class="flex flex-col gap-2" id="quiz-options">
                        ${options.map((o, i) => `<button onclick="answerQuiz('${escapeJsStr(o)}')" class="bg-white p-3 rounded-xl shadow hover:bg-purple-100 text-left font-medium cursor-pointer">${String.fromCharCode(65 + i)}) ${o}</button>`).join('')}
                    </div>
                    <p id="quiz-ans" class="mt-4 font-bold text-lg min-h-[1.5rem]"></p>
                </div>`;
            speak(term);
        }
        function answerQuiz(chosen) {
            if (quizState.locked) return;
            quizState.locked = true;
            document.querySelectorAll('#quiz-options button').forEach(b => b.disabled = true);
            let el = document.getElementById('quiz-ans');
            if (chosen === quizState.currentAnswer) {
                el.innerHTML = "🎉 Correct! Well done!";
                el.className = "mt-4 font-bold text-lg text-green-600";
                quizState.score++;
            } else {
                el.innerHTML = `❌ Not quite - it was "${escapeHtml(quizState.currentAnswer)}"`;
                el.className = "mt-4 font-bold text-lg text-red-500";
            }
            quizState.qIndex++;
            setTimeout(showQuizQuestion, 1100);
        }

        // ===== 4. THINK ABOUT IT =====
        function renderThink(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">💭 Think About It</h2>
                <div class="bg-sky-50 p-6 rounded-2xl border border-sky-200">
                    <p class="font-bold text-sky-900 text-lg mb-3">${unitData.question}</p>
                    <textarea id="think-answer" rows="3" placeholder="Type your answer here..." class="w-full p-3 border border-gray-300 rounded-lg text-sm"></textarea>
                    <button onclick="checkThinkAnswer()" class="mt-3 bg-sky-600 hover:bg-sky-700 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer text-sm">Save My Answer</button>
                    <p id="think-msg" class="text-sm mt-2 font-semibold min-h-[1.25rem]"></p>
                </div>`;
        }
        function checkThinkAnswer() {
            const val = document.getElementById('think-answer').value;
            const msg = document.getElementById('think-msg');
            const need = minWords();
            const n = countWords(val);
            if (n < need) {
                msg.className = "text-sm mt-2 font-semibold text-red-500";
                msg.textContent = n === 0 ? "✏️ Write your answer first!" : `✏️ Write a little more — at least ${need} words (you have ${n}).`;
                return;
            }
            msg.className = "text-sm mt-2 font-semibold text-green-600";
            msg.textContent = "🌟 Great thinking!" + starNote(award(unitKey('think'), 3), 3);
            markActivityComplete('think');
        }

        // ===== 5. DID YOU KNOW =====
        function renderFunFact(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">📌 Did You Know?</h2>
                <div class="bg-amber-50 p-8 rounded-2xl border border-amber-200 text-center">
                    <div class="text-5xl mb-4">💡</div>
                    <p class="text-lg text-amber-900 font-semibold bg-white p-5 rounded-xl shadow-inner">${unitData.funfact}</p>
                    <div class="flex gap-3 flex-wrap justify-center mt-4">
                        <button onclick="readFunFactAloud()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Read Aloud</button>
                        <button onclick="finishFunFact()" class="bg-white border border-amber-300 text-amber-800 font-bold px-5 py-2 rounded-full shadow cursor-pointer">✅ Got it</button>
                    </div>
                    <p id="fact-msg" class="text-sm mt-3 font-semibold text-green-600 min-h-[1.25rem]"></p>
                </div>`;
        }
        function finishFunFact() {
            markActivityComplete('funfact');
            document.getElementById('fact-msg').textContent = '✅ Nice!' + (award(unitKey('funfact'), 1) ? ' (+1 ⭐)' : '');
        }
        function readFunFactAloud() {
            speak(curriculum[state.level][state.unit].funfact, (ok) => { if (ok && document.getElementById('fact-msg')) finishFunFact(); });
        }
        function textCheck(msg, text, need, okText, key, amount) {
            const n = countWords(text);
            if (n < need) {
                msg.className = "text-sm mt-2 font-semibold text-red-500";
                msg.textContent = n === 0 ? "✏️ Write something first!" : `✏️ Write a little more — at least ${need} words (you have ${n}).`;
                return false;
            }
            msg.className = "text-sm mt-2 font-semibold text-green-600";
            msg.textContent = okText + starNote(award(key, amount), amount);
            return true;
        }
        function usedUnitWords(text, unitData) {
            const t = ' ' + String(text).toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
            return unitData.vocab.filter(w => {
                const base = w.toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').trim();
                if (!base) return false;
                // whole word, allowing simple endings: s, es, ed, ing
                const re = new RegExp('[ ]' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[ ]') + '(s|es|ed|d|ing)?[ ]');
                return re.test(t);
            });
        }
        function renderWriting(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">✍️ Write a Health Tip</h2>
                <p class="text-gray-600 mb-4">Write a short health tip or poster message (2-4 sentences) for your friends, using at least 3 of this unit's words.</p>
                <div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-6">
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${unitData.vocab.map(w => `<span class="bg-white px-3 py-1 rounded-full text-sm font-semibold text-slate-800 border border-slate-200">${w}</span>`).join('')}
                    </div>
                    <textarea id="writing-answer" rows="5" placeholder="Write your paragraph here..." class="w-full p-3 border border-gray-300 rounded-lg text-sm"></textarea>
                    <button onclick="checkWritingAnswer()" class="mt-3 bg-slate-600 hover:bg-slate-700 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer text-sm">Check My Writing</button>
                    <p id="writing-msg" class="text-sm mt-2 font-semibold min-h-[1.25rem]"></p>
                </div>`;
        }
        function checkWritingAnswer() {
            const unitData = curriculum[state.level][state.unit];
            const val = document.getElementById('writing-answer').value.trim();
            const msg = document.getElementById('writing-msg');
            if (!val) { msg.className = "text-sm mt-2 font-semibold text-red-500"; msg.textContent = "✏️ Write your paragraph first!"; return; }
            const used = usedUnitWords(val, unitData);
            const need = Math.max(minWords() * 2, 10);
            if (used.length < 3) {
                msg.className = "text-sm mt-2 font-semibold text-amber-600";
                msg.textContent = `✏️ Good try! Use a few more unit words (found ${used.length} of 3: ${used.join(', ') || 'none yet'}).`;
                return;
            }
            if (countWords(val) < need) {
                msg.className = "text-sm mt-2 font-semibold text-amber-600";
                msg.textContent = `✏️ Great words! Now write a little more — at least ${need} words.`;
                return;
            }
            msg.className = "text-sm mt-2 font-semibold text-green-600";
            msg.textContent = `🎉 Excellent health tip! You used ${used.length} unit words.` + starNote(award(unitKey('writing'), 4), 4);
            markActivityComplete('writing');
        }

        // ===== 7. VOCABULARY GAME (picture -> word) =====
        // Wrong choices never share the picture of the right answer, so exactly one choice fits
        let vocabGameState = { qIndex: 0, score: 0, questions: [], locked: false };
        function buildVocabGameQuestions(unitData) {
            return shuffle([...new Set(unitData.vocab)]).map(correct => ({
                correct, options: shuffle([correct, ...pictureDistractors(correct, unitData.vocab, unitData, 3)])
            }));
        }
        function renderVocabGame(contentDiv, unitData) {
            vocabGameState = { qIndex: 0, score: 0, questions: buildVocabGameQuestions(unitData), locked: false };
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">🎮 Vocabulary Game</h2>
                <p class="text-gray-600 mb-4">Look at the picture, then tap the matching word!</p>
                <div id="vocabgame-area"></div>`;
            showVocabGameQuestion();
        }
        function showVocabGameQuestion() {
            const area = document.getElementById('vocabgame-area');
            if (!area) return;
            vocabGameState.locked = false;
            if (vocabGameState.qIndex >= vocabGameState.questions.length) { try { window.C2REPORT && C2REPORT('Vocabulary Game', vocabGameState.score, vocabGameState.questions.length, state); } catch (e) {}
                markActivityComplete('vocabgame');
                area.innerHTML = `<div class="bg-green-50 border-2 border-green-300 rounded-2xl p-8 text-center">
                    <p class="text-2xl font-bold text-green-700 mb-2">🎉 Great Job!</p>
                    <p class="text-lg text-gray-700">You scored ${vocabGameState.score} / ${vocabGameState.questions.length}</p>
                    <button onclick="renderVocabGame(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">🔁 Play Again</button>
                </div>`;
                return;
            }
            const q = vocabGameState.questions[vocabGameState.qIndex];
            area.innerHTML = `
                <div class="bg-blue-50 border-2 border-dashed border-blue-300 rounded-2xl p-8 text-center">
                    <p class="text-sm text-gray-500 mb-2">Question ${vocabGameState.qIndex + 1} of ${vocabGameState.questions.length}</p>
                    <div class="text-7xl mb-5">${emojiFor(q.correct)}</div>
                    <div class="grid grid-cols-2 gap-3" id="vocabgame-options">
                        ${q.options.map(o => `<button onclick="answerVocabGame('${escapeJsStr(o)}')" class="bg-white hover:bg-blue-100 p-4 rounded-xl shadow font-bold text-blue-800 cursor-pointer">${o}</button>`).join('')}
                    </div>
                    <p id="vocabgame-fb" class="mt-4 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function answerVocabGame(chosen) {
            if (vocabGameState.locked) return;
            vocabGameState.locked = true;
            document.querySelectorAll('#vocabgame-options button').forEach(b => b.disabled = true);
            const q = vocabGameState.questions[vocabGameState.qIndex];
            const fb = document.getElementById('vocabgame-fb');
            if (chosen === q.correct) {
                fb.className = 'mt-4 font-bold min-h-[1.5rem] text-green-600';
                fb.textContent = '🎉 Correct!' + (award(unitKey('vocab-' + q.correct), 2) ? ' (+2 ⭐)' : '');
                vocabGameState.score++;
            } else {
                fb.className = 'mt-4 font-bold min-h-[1.5rem] text-red-500';
                fb.textContent = `❌ It was "${q.correct}"`;
            }
            vocabGameState.qIndex++;
            setTimeout(showVocabGameQuestion, 900);
        }

        // ===== 8. SPELLING PRACTICE (tap scrambled letters in order) =====
        let spellState = { word: '', picked: [], letters: [], wIndex: 0, words: [], done: false };
        function renderSpelling(contentDiv, unitData) {
            spellState.words = shuffle([...new Set(unitData.vocab)].filter(w => /^[A-Za-z ]+$/.test(w)));
            spellState.wIndex = 0;
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">✏️ Spelling Practice</h2>
                <p class="text-gray-600 mb-4">Look at the picture, then tap the letters in the right order to spell the word!</p>
                <div id="spelling-area"></div>`;
            showSpellingWord();
        }
        function showSpellingWord() {
            const area = document.getElementById('spelling-area');
            if (!area) return;
            if (spellState.wIndex >= spellState.words.length) {
                markActivityComplete('spelling');
                area.innerHTML = `<div class="bg-green-50 border-2 border-green-300 rounded-2xl p-8 text-center">
                    <p class="text-2xl font-bold text-green-700">🎉 All words spelled! Great work!</p>
                </div>`;
                return;
            }
            const word = spellState.words[spellState.wIndex].toUpperCase();
            spellState.word = word;
            spellState.picked = [];
            spellState.done = false;
            spellState.letters = shuffle(word.replace(/ /g, '').split(''));
            renderSpellingUI();
        }
        function renderSpellingUI() {
            const area = document.getElementById('spelling-area');
            const targetLen = spellState.word.replace(/ /g, '').length;
            spellState.picked = [];
            area.innerHTML = `
                <div class="bg-amber-50 border-2 border-dashed border-amber-300 rounded-2xl p-8 text-center">
                    <p class="text-sm text-gray-500 mb-2">Word ${spellState.wIndex + 1} of ${spellState.words.length}</p>
                    <div class="text-6xl mb-3">${emojiFor(spellState.words[spellState.wIndex])}</div>
                    <button onclick="speak('${escapeJsStr(spellState.words[spellState.wIndex])}')" class="text-sm text-blue-600 underline mb-3 cursor-pointer">🔊 Hear the word</button>
                    <div class="flex justify-center gap-2 mb-5 flex-wrap" id="spell-slots">
                        ${Array.from({length: targetLen}).map(() => `<div class="spell-slot w-10 h-12 border-b-4 border-blue-400 flex items-center justify-center text-xl font-bold text-blue-800"></div>`).join('')}
                    </div>
                    <div class="flex justify-center gap-2 flex-wrap mb-4">
                        ${spellState.letters.map((l,i) => `<button onclick="pickLetter(${i})" id="letter-${i}" class="w-10 h-10 bg-white shadow rounded-lg font-bold text-lg hover:bg-blue-100 cursor-pointer">${l}</button>`).join('')}
                    </div>
                    <button onclick="resetSpelling()" class="text-sm text-gray-500 underline cursor-pointer">🔁 Reset</button>
                    <p id="spelling-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function pickLetter(i) {
            if (spellState.done) return;
            const btn = document.getElementById('letter-' + i);
            if (!btn || btn.disabled) return;
            btn.disabled = true;
            btn.classList.add('opacity-30');
            spellState.picked.push(spellState.letters[i]);
            const fb = document.getElementById('spelling-fb');
            const target = spellState.word.replace(/ /g, '');
            document.querySelectorAll('#spell-slots .spell-slot').forEach((cell, idx) => {
                cell.textContent = spellState.picked[idx] || '';
            });
            if (spellState.picked.length === target.length) {
                if (spellState.picked.join('') === target) {
                    spellState.done = true;
                    fb.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                    fb.textContent = `🎉 Correct! "${spellState.word}"` + (award(unitKey('spell-' + spellState.word), 3) ? ' (+3 ⭐)' : '');
                    spellState.wIndex++;
                    setTimeout(showSpellingWord, 1200);
                } else {
                    fb.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                    fb.textContent = '❌ Not quite — tap Reset and try again!';
                }
            }
        }
        function resetSpelling() { renderSpellingUI(); }
        // ===== 9. SENTENCE BUILDING (reorder scrambled words from the story) =====
        let sentenceState = { correctOrder: [], current: [], picked: [], target: '', done: false };
        function storySentences(unitData, minWordCount) {
            const all = splitSentences(unitData.story);
            const long = all.filter(s => s.split(/\s+/).length >= (minWordCount || 3));
            return long.length ? long : all;
        }
        function renderSentenceBuilding(contentDiv, unitData) {
            const sentences = storySentences(unitData, 3);
            // pick a different sentence from last time when the story has more than one
            let target = sentences[Math.floor(Math.random() * sentences.length)];
            if (sentences.length > 1) while (target.replace(/[.!?]+$/, '') === sentenceState.target) target = sentences[Math.floor(Math.random() * sentences.length)];
            target = target.replace(/[.!?]+["')]*$/, '').trim();
            sentenceState = { target, correctOrder: target.split(/\s+/), picked: [], current: [], done: false };
            sentenceState.current = shuffle(sentenceState.correctOrder);
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">💬 Sentence Building</h2>
                <p class="text-gray-600 mb-4">Tap the words in the correct order to build the sentence from the story.</p>
                <div id="sentence-area"></div>`;
            renderSentenceUI();
        }
        function renderSentenceUI() {
            const area = document.getElementById('sentence-area');
            sentenceState.picked = [];
            area.innerHTML = `
                <div class="bg-purple-50 border-2 border-dashed border-purple-300 rounded-2xl p-8 text-center">
                    <div id="sentence-built" class="min-h-[3rem] mb-5 p-3 bg-white rounded-xl border-2 border-purple-200 flex flex-wrap gap-2 justify-center items-center">
                        <span class="text-gray-400">Tap words below...</span>
                    </div>
                    <div class="flex flex-wrap gap-2 justify-center mb-4">
                        ${sentenceState.current.map((w,i) => `<button onclick="pickSentenceWord(${i})" id="sw-${i}" class="bg-white shadow px-3 py-2 rounded-lg font-semibold hover:bg-purple-100 cursor-pointer">${w}</button>`).join('')}
                    </div>
                    <div class="flex justify-center gap-4">
                        <button onclick="renderSentenceUI()" class="text-sm text-gray-500 underline cursor-pointer">↩️ Try again</button>
                        <button onclick="renderSentenceBuilding(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="text-sm text-gray-500 underline cursor-pointer">🔁 New Sentence</button>
                    </div>
                    <p id="sentence-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function pickSentenceWord(i) {
            if (sentenceState.done) return;
            const btn = document.getElementById('sw-' + i);
            if (!btn || btn.disabled) return;
            btn.disabled = true;
            btn.classList.add('opacity-30');
            sentenceState.picked.push(sentenceState.current[i]);
            document.getElementById('sentence-built').innerHTML =
                sentenceState.picked.map(w => `<span class="bg-purple-100 px-3 py-1 rounded-lg font-semibold">${w}</span>`).join('');
            const fb = document.getElementById('sentence-fb');
            if (sentenceState.picked.length === sentenceState.correctOrder.length) {
                if (sentenceState.picked.join(' ') === sentenceState.correctOrder.join(' ')) {
                    sentenceState.done = true;
                    fb.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                    markActivityComplete('sentence');
                    fb.textContent = '🎉 Perfect sentence!' + (award(unitKey('sentence-' + sentenceState.target), 3) ? ' (+3 ⭐)' : '');
                    speak(sentenceState.target);
                } else {
                    fb.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                    fb.textContent = '❌ Not quite the right order — tap "Try again"!';
                }
            }
        }

        // ===== 10. ROLE-PLAY / DIALOGUE =====
        // The 🔊 buttons used to be broken (the sentence's quote marks cut the button's code
        // short), so no line could be heard. Lines are now played by their number.
        let rolePlayLines = [];
        let rolePlayHeard = new Set();
        function renderRolePlay(contentDiv, unitData) {
            const sentences = splitSentences(unitData.story);
            rolePlayLines = sentences.map((text, i) => ({ speaker: i % 2 === 0 ? 'A' : 'B', text }));
            rolePlayHeard = new Set();
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">🎤 Role-Play</h2>
                <p class="text-gray-600 mb-4">Practice this with a friend! One person reads 🧑 A, the other reads 👧 B. Tap a line to hear it.</p>
                <div class="bg-pink-50 border-2 border-dashed border-pink-300 rounded-2xl p-6 space-y-3" id="roleplay-lines">
                    ${rolePlayLines.map((l, i) => `
                        <button onclick="playRoleLine(${i})" id="rl-${i}" class="w-full text-left flex items-start gap-3 bg-white p-3 rounded-xl shadow hover:bg-pink-100 cursor-pointer">
                            <span class="text-2xl">${l.speaker === 'A' ? '🧑' : '👧'}</span>
                            <span class="font-semibold text-gray-800">${l.text}</span>
                            <span class="ml-auto text-sm text-blue-500">🔊</span>
                        </button>`).join('')}
                </div>
                <p class="text-center mt-4"><button onclick="finishRolePlay()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">✅ We practiced it!</button></p>
                <p id="roleplay-fb" class="text-center mt-2 font-bold min-h-[1.5rem]"></p>`;
        }
        function playRoleLine(i) {
            speak(rolePlayLines[i].text);
            rolePlayHeard.add(i);
            document.getElementById('rl-' + i).classList.add('ring-2', 'ring-green-400');
        }
        function finishRolePlay() {
            const fb = document.getElementById('roleplay-fb');
            if (rolePlayHeard.size < rolePlayLines.length) {
                fb.className = 'text-center mt-2 font-bold min-h-[1.5rem] text-amber-600';
                fb.textContent = `🔊 Listen to every line first (${rolePlayHeard.size} of ${rolePlayLines.length}), then practice it together!`;
                return;
            }
            fb.className = 'text-center mt-2 font-bold min-h-[1.5rem] text-green-600';
            markActivityComplete('roleplay');
            fb.textContent = '🎉 Great role-play practice!' + starNote(award(unitKey('roleplay'), 2), 2);
        }

        // ===== 11. DICTATION (listen and type) =====
        // The Play button used to be broken, so no sentence could be heard. Fixed, plus a
        // slower replay and a "Next sentence" button.
        let dictationTarget = '';
        let dictationDone = false;
        function renderDictation(contentDiv, unitData) {
            const sentences = storySentences(unitData, 3);
            let pick = sentences[Math.floor(Math.random() * sentences.length)];
            if (sentences.length > 1) while (pick === dictationTarget) pick = sentences[Math.floor(Math.random() * sentences.length)];
            dictationTarget = pick;
            dictationDone = false;
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">✍️ Dictation</h2>
                <p class="text-gray-600 mb-4">Listen carefully, then type exactly what you hear.</p>
                <div class="bg-blue-50 border-2 border-dashed border-blue-300 rounded-2xl p-8 text-center">
                    <div class="flex justify-center gap-3 flex-wrap mb-5">
                        <button onclick="playDictation(false)" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-full shadow-lg cursor-pointer">🔊 Play Sentence</button>
                        <button onclick="playDictation(true)" class="bg-white border border-blue-300 text-blue-700 font-bold px-5 py-3 rounded-full shadow cursor-pointer">🐢 Slowly</button>
                    </div>
                    <div>
                        <textarea id="dictation-input" rows="2" placeholder="Type what you hear..." class="w-full max-w-md p-3 rounded-xl border-2 border-blue-300 text-center font-semibold"></textarea>
                    </div>
                    <div class="flex justify-center gap-3 flex-wrap mt-4">
                        <button onclick="checkDictation()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">✅ Check</button>
                        <button onclick="renderDictation(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="bg-white border border-gray-300 text-gray-600 font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔁 Next sentence</button>
                    </div>
