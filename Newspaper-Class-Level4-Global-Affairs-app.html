    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Key Terms: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>
</head>

    <!-- Phones only: jump back up to the list of learning modules -->

        class="md:hidden fixed bottom-4 right-4 z-50 bg-sky-800 text-white font-bold px-4 py-3 rounded-full shadow-lg cursor-pointer"
        style="display:none;" aria-label="Back to learning modules">📚 Modules</button>

    <script>
        let state = {
            level: 'GlobalAffairs',
            unit: 1,
            tab: 'learn',
            stars: 0,
            badges: 0
        };

        const curriculum = {
            'CurrentEvents': {
                1: { title: "Reading Local News", terms: ["Headline", "Reporter", "Byline", "Source", "Breaking news", "Update", "Local", "Community"], passage: "A good local newspaper reports on stories that matter to the community. A reporter writes the article, often starting with a strong headline, and credits a reliable source before an editor publishes an update.", question: "What makes a local news story important to a community?", funfact: "Did you know? A newspaper headline is written to fit a limited space while still capturing the reader's attention in just a few words." },
                2: { title: "Weather & Environment News", terms: ["Forecast", "Climate", "Natural disaster", "Drought", "Flood", "Conservation", "Temperature", "Warning"], passage: "A weather forecast predicts temperature and rain, but severe climate events like a flood or drought can turn into a natural disaster. News reports often issue a warning and discuss conservation efforts afterward.", question: "Why is accurate weather reporting important for public safety?", funfact: "Did you know? Modern weather forecasts use satellite data and computer models to predict conditions days in advance." },
                3: { title: "Sports News", terms: ["Match", "Score", "Championship", "Athlete", "Tournament", "Victory", "Defeat", "Commentary"], passage: "A sports reporter covers every match, tracking the score until a championship is decided. An athlete's victory or defeat in a tournament is often followed by expert commentary explaining what happened.", question: "What makes sports news exciting for readers to follow?", funfact: "Did you know? Live sports commentary developed alongside early radio broadcasts, decades before television existed." },
                4: { title: "Technology News", terms: ["Innovation", "Launch", "Startup", "Device", "Software update", "Breakthrough", "Industry", "Consumer"], passage: "A tech news article often covers a major innovation or the launch of a new device. A small startup with a real breakthrough can quickly change an entire industry and affect every consumer.", question: "What recent piece of technology news have you heard about?", funfact: "Did you know? Many major tech companies were once small startups working out of a garage or a small office." },
                5: { title: "Health News", terms: ["Outbreak", "Vaccine", "Public health", "Research study", "Treatment", "Hospital", "Awareness campaign", "Guideline"], passage: "Health news often reports on a disease outbreak, a new vaccine, or a research study. Public health guidelines from a hospital or health organization help guide treatment and support an awareness campaign.", question: "Why is it important to get health information from a reliable source?", funfact: "Did you know? Public health awareness campaigns have helped dramatically reduce the spread of several serious diseases worldwide." },
                6: { title: "Education News", terms: ["Curriculum", "Enrollment", "Scholarship", "Graduation", "Policy reform", "Literacy rate", "Funding", "Access"], passage: "Education news covers changes to the curriculum, rising enrollment, and new scholarship opportunities. A policy reform can affect funding, access, and even a country's overall literacy rate.", question: "What education news story would you like to read more about?", funfact: "Did you know? Countries that invest more in early childhood education often see long-term improvements in national literacy rates." },
                7: { title: "Crime & Safety News", terms: ["Investigation", "Suspect", "Arrest", "Verdict", "Law enforcement", "Evidence", "Public safety", "Court case"], passage: "Crime reporting follows an investigation from the first arrest to a final verdict. Law enforcement gathers evidence for a court case, while accurate reporting supports public safety without sensationalizing a suspect's guilt.", question: "Why must crime reporters be careful about how they describe a suspect before a trial?", funfact: "Did you know? Many news organizations follow a strict policy of saying 'suspect' or 'alleged' until a court delivers a verdict." },
                8: { title: "Business News Basics", terms: ["Earnings report", "Quarterly results", "Shareholder", "Merger", "Profit margin", "Revenue", "CEO statement", "Market reaction"], passage: "A company's quarterly results reveal whether profit margin and revenue met shareholder expectations. A merger announcement or a CEO statement can trigger a strong market reaction within hours of an earnings report.", question: "What kind of business news would affect your decision to buy a company's stock?", funfact: "Did you know? Many company earnings reports are released before the stock market opens to give investors time to react." },
                9: { title: "Entertainment News", terms: ["Box office", "Premiere", "Celebrity", "Award season", "Critic review", "Streaming release", "Fan reaction", "Publicity"], passage: "Entertainment news tracks box office numbers after a film's premiere, alongside critic reviews and fan reaction. Award season and a celebrity's publicity choices often shape coverage as much as a new streaming release.", question: "How much should a critic's review influence whether you watch a new film?", funfact: "Did you know? A film's opening weekend box office is often seen as the strongest early predictor of its total earnings." },
                10: { title: "Science News", terms: ["Discovery", "Peer-reviewed study", "Research team", "Breakthrough", "Clinical trial", "Data set", "Scientific consensus", "Publication"], passage: "Science journalism translates a peer-reviewed study into language the public can understand, without overstating a single discovery. A research team's breakthrough only becomes scientific consensus after further study and publication.", question: "Why should a single new study be reported carefully rather than as final proof?", funfact: "Did you know? A single scientific study is rarely enough to change consensus — scientists look for the same result repeated across many studies." },
                11: { title: "Travel & Tourism News", terms: ["Destination", "Travel advisory", "Tourism industry", "Visa requirement", "Peak season", "Local economy", "Sustainable tourism", "Cultural heritage"], passage: "Travel news covers a popular destination's peak season, along with any travel advisory affecting visa requirements. Tourism supports the local economy, while sustainable tourism aims to protect cultural heritage for future visitors.", question: "What responsibility do tourists have when visiting a place with fragile cultural heritage?", funfact: "Did you know? Tourism is one of the largest industries in the world, supporting jobs in nearly every country." },
                12: { title: "Consumer & Product News", terms: ["Product recall", "Consumer protection", "Warranty", "Safety standard", "Market launch", "Price increase", "Customer complaint", "Regulatory agency"], passage: "A product recall protects consumers when a safety standard is not met, often prompted by a customer complaint. A regulatory agency investigates before a company responds with a warranty extension or price adjustment.", question: "What should a consumer do first after hearing about a product recall?", funfact: "Did you know? A regulatory agency can force a company-wide product recall even if only a small number of complaints are reported." },
                13: { title: "Investigative Journalism", terms: ["Whistleblower", "Confidential source", "Document leak", "Fact-checking", "Public interest", "Accountability", "Exposé", "Follow-up story"], passage: "Investigative journalism often begins with a whistleblower or a confidential source revealing a document leak. Careful fact-checking supports the public interest, turning a single exposé into accountability and further follow-up stories.", question: "Why do journalists sometimes protect the identity of a confidential source?", funfact: "Did you know? Some countries have 'shield laws' that legally protect journalists from being forced to reveal a confidential source." },
                14: { title: "Photojournalism", terms: ["Photo caption", "Photojournalist", "Visual storytelling", "Ethical guideline", "Image manipulation", "Iconic photo", "Press pass", "Frontline coverage"], passage: "A photojournalist practices visual storytelling under strict ethical guidelines that forbid image manipulation. An iconic photo, often taken with frontline coverage and a press pass, can define public memory of an entire event.", question: "Why is it important that a news photo is never digitally altered to change its meaning?", funfact: "Did you know? Some of history's most iconic photographs won major awards decades after they were first published." },
                15: { title: "Breaking News Coverage", terms: ["Live update", "Developing story", "Unverified report", "Wire service", "Correction", "News alert", "Rolling coverage", "Confirmed detail"], passage: "Breaking news coverage delivers a live update on a developing story, sometimes based on an early unverified report from a wire service. Rolling coverage adds each confirmed detail, issuing a correction whenever needed.", question: "Why might early breaking news reports sometimes turn out to be wrong?", funfact: "Did you know? Major news organizations often issue a public correction when an early breaking news detail turns out to be inaccurate." },
                16: { title: "Fact-Checking News", terms: ["Fact-checker", "Claim verification", "Misinformation", "Primary source", "Rating system", "Context", "Debunk", "Accuracy"], passage: "A fact-checker verifies a public claim against a primary source, watching closely for misinformation. Many outlets use a rating system to debunk false claims and restore missing context for accuracy.", question: "What steps could you take yourself to fact-check a claim you see online?", funfact: "Did you know? Professional fact-checking organizations often trace a viral claim back through several sources before publishing a rating." },
                17: { title: "Citizen Journalism", terms: ["Eyewitness account", "Social media post", "User-generated content", "Verification process", "First responder", "Local reporting", "Smartphone footage", "Community voice"], passage: "Citizen journalism relies on an eyewitness account, often shared first as a social media post or smartphone footage. A careful verification process turns user-generated content into trustworthy local reporting and a genuine community voice.", question: "What are the benefits and risks of relying on citizen journalism during a fast-moving event?", funfact: "Did you know? Many major breaking news stories are first reported by ordinary citizens on social media, before professional journalists arrive." },
                18: { title: "Media Literacy", terms: ["Bias", "Source credibility", "Media ownership", "Sponsored content", "Algorithm", "Echo chamber", "Critical reading", "Diverse sources"], passage: "Media literacy means evaluating source credibility and recognizing bias shaped by media ownership. Understanding how an algorithm can create an echo chamber encourages critical reading and a habit of checking diverse sources.", question: "How can reading news from diverse sources help you avoid an echo chamber?", funfact: "Did you know? Media literacy is now taught as a formal school subject in a growing number of countries around the world." },
                19: { title: "Year in Review", terms: ["Retrospective", "Top story", "Timeline", "Turning point", "Public reaction", "Long-term impact", "Historic moment", "Lessons learned"], passage: "A year-in-review retrospective ranks the year's top story alongside a timeline of major turning points. Looking back at public reaction helps identify a historic moment's long-term impact and the year's most important lessons learned.", question: "What do you think will be remembered as this year's most important news story?", funfact: "Did you know? Many news organizations publish an annual 'year in review' feature that becomes a lasting historical record." },
                20: { title: "Human-Interest Stories", terms: ["Human interest", "Profile", "Interview", "Emotion", "Community", "Feature", "Quote", "Story"], passage: "A human-interest story is a feature that focuses on one person or community. The reporter uses an interview and a strong quote to show emotion, helping readers connect with a bigger issue through a personal profile.", question: "Why do readers connect with stories about individual people?", funfact: "Did you know? Human-interest stories often explain a big issue — like migration or health — through one person's experience." },
                21: { title: "Transport and Road Safety News", terms: ["Traffic", "Road safety", "Helmet", "Accident", "Infrastructure", "Commuter", "Statistics", "Campaign"], passage: "Transport news covers traffic, infrastructure and the daily life of every commuter. Reports on road safety often use accident statistics and describe a helmet or seatbelt campaign.", question: "What transport issue most affects your city?", funfact: "Did you know? The WHO estimates that road traffic crashes kill about 1.19 million people worldwide every year." },
                22: { title: "Agriculture and Rural News", terms: ["Agriculture", "Farmer", "Harvest", "Rice", "Drought", "Irrigation", "Market price", "Rural"], passage: "Agriculture news follows the harvest, market price changes and weather such as drought. Rural reporters explain how irrigation and new techniques affect each farmer and the rice supply.", question: "How does agriculture news affect people in cities?", funfact: "Did you know? Rice is a staple food for more than half of the world's population." },
                23: { title: "Arts and Culture News", terms: ["Arts", "Exhibition", "Review", "Performance", "Festival", "Heritage", "Critic", "Audience"], passage: "Arts and culture news covers every exhibition, performance and festival. A critic writes a review to guide the audience, and reporters also cover efforts to protect heritage.", question: "What cultural event would you like to review?", funfact: "Did you know? Many newspapers publish weekend culture sections with reviews of books, films and exhibitions." },
                24: { title: "Letters to the Editor", terms: ["Letter", "Editor", "Opinion", "Reader", "Respond", "Concise", "Argument", "Publish"], passage: "A letter to the editor lets a reader respond to an article. A concise letter with a clear argument and opinion is more likely to be chosen and published by the editor.", question: "What issue would you write a letter to the editor about?", funfact: "Did you know? Many newspapers ask letter writers to give their real name and contact details before publishing." },
                25: { title: "Comparing News Sources", terms: ["Source", "Outlet", "Bias", "Perspective", "Coverage", "Compare", "Framing", "Reliable"], passage: "Different outlets may give very different coverage of the same event. By comparing each source, readers can notice bias and framing, see several perspectives and decide which report is most reliable.", question: "Why is it useful to read the same story in two different outlets?", funfact: "Did you know? Reading one story in two or more outlets is one of the simplest ways to notice bias." },
            },
            'EconomicsBusiness': {
                1: { title: "Stock Market Basics", terms: ["Stock", "Share", "Investor", "Market index", "Bull market", "Bear market", "Dividend", "Portfolio"], passage: "An investor buys a share of stock hoping its value will grow over time. A market index tracks overall performance, rising in a bull market and falling in a bear market, while a dividend rewards long-term investors in a portfolio.", question: "Why might someone choose to invest in the stock market?", funfact: "Did you know? A popular explanation for the term 'bull market' is that a bull attacks by thrusting its horns upward — though the true origin of the phrase is uncertain." },
                2: { title: "Trade & Global Economy", terms: ["Import", "Export", "Tariff", "Trade deficit", "Supply chain", "Currency exchange", "Trade agreement", "Globalization"], passage: "A country's economy depends on both import and export activity, often shaped by a tariff or trade agreement. A trade deficit and disruptions to the supply chain, along with currency exchange rates, all reflect deeper globalization.", question: "How does globalization affect prices for everyday products?", funfact: "Did you know? A single smartphone can contain parts from a dozen different countries before final assembly." },
                3: { title: "Entrepreneurship", terms: ["Startup", "Venture capital", "Business plan", "Risk-taking", "Innovation", "Market gap", "Funding round", "Scale"], passage: "An entrepreneur launches a startup by writing a solid business plan and often seeking venture capital. Real innovation means finding a market gap, taking a calculated risk, and securing a funding round to help the business scale.", question: "What qualities do you think a successful entrepreneur needs?", funfact: "Did you know? Many entrepreneurs experience several failed startups before building one that eventually succeeds." },
                4: { title: "Banking & Finance", terms: ["Interest rate", "Loan", "Credit", "Savings account", "Inflation", "Central bank", "Deposit", "Financial literacy"], passage: "A bank offers a loan at a certain interest rate and lets customers keep a savings account. A central bank manages inflation and interest rates nationwide, while financial literacy helps people understand credit and every deposit.", question: "Why is financial literacy important for making good money decisions?", funfact: "Did you know? A central bank can raise or lower interest rates to help control how fast prices rise across an entire economy." },
                5: { title: "Labor Market", terms: ["Unemployment rate", "Job market", "Minimum wage", "Workforce", "Labor union", "Skill gap", "Employment contract", "Remote work"], passage: "The unemployment rate reflects how healthy the job market is for the workforce. A minimum wage and a labor union both help protect workers, while a skill gap and the rise of remote work continue to reshape every employment contract.", question: "How has remote work changed the modern labor market?", funfact: "Did you know? The concept of a minimum wage first became national law in some countries less than a hundred years ago." },
                6: { title: "Economic Policy", terms: ["Fiscal policy", "Monetary policy", "Subsidy", "Tax reform", "Budget deficit", "Economic growth", "Regulation", "Public spending"], passage: "A government uses fiscal policy, like tax reform and public spending, alongside monetary policy to support economic growth. A subsidy and careful regulation can help control a budget deficit while protecting key industries.", question: "What is the difference between fiscal policy and monetary policy?", funfact: "Did you know? Fiscal policy is controlled by a government, while monetary policy is usually controlled by a separate central bank." },
                7: { title: "Corporate Strategy", terms: ["Competitive advantage", "Market positioning", "Growth strategy", "Diversification", "Core business", "Strategic plan", "Business model", "Long-term vision"], passage: "Corporate strategy aims to build a lasting competitive advantage through clear market positioning. A growth strategy might involve diversification beyond the core business, guided by a strategic plan and long-term vision.", question: "What makes a company's business model successful over the long term?", funfact: "Did you know? Some of the world's largest companies began with a business model that failed several times before finally succeeding." },
                8: { title: "Marketing & Advertising", terms: ["Target audience", "Brand awareness", "Advertising campaign", "Consumer insight", "Market segmentation", "Call to action", "Return on investment", "Brand loyalty"], passage: "Marketing starts with a clear target audience, building brand awareness through a focused advertising campaign. Consumer insight and market segmentation shape a strong call to action, ultimately measured by return on investment and brand loyalty.", question: "What is an advertisement that made a strong impression on you, and why?", funfact: "Did you know? The return on investment of a marketing campaign is now tracked in real time using detailed digital analytics." },
                9: { title: "E-commerce Trends", terms: ["Online marketplace", "Checkout process", "Digital payment", "Shipping logistics", "Customer review", "Mobile shopping", "Conversion rate", "Cart abandonment"], passage: "E-commerce success depends on a smooth checkout process and reliable digital payment options across an online marketplace. Shipping logistics and customer reviews affect conversion rate, while mobile shopping has reshaped every retailer's approach to cart abandonment.", question: "Why might a customer abandon their shopping cart before completing an online purchase?", funfact: "Did you know? A large share of all online shopping carts are abandoned before checkout, making cart-recovery emails a major business tool." },
                10: { title: "Real Estate Market", terms: ["Property value", "Mortgage rate", "Housing supply", "Real estate agent", "Down payment", "Rental market", "Property tax", "Housing bubble"], passage: "Real estate markets rise and fall with mortgage rates and housing supply. A real estate agent helps buyers understand property value, down payment requirements, property tax, and the risk of a housing bubble.", question: "How do rising mortgage rates affect whether people can afford to buy a home?", funfact: "Did you know? A 'housing bubble' happens when property values rise faster than incomes can reasonably support, often followed by a sharp correction." },
                11: { title: "Cryptocurrency Basics", terms: ["Blockchain", "Digital currency", "Volatility", "Crypto wallet", "Decentralized", "Mining", "Exchange platform", "Regulation"], passage: "Cryptocurrency is a digital currency built on blockchain technology, stored in a personal crypto wallet. Its decentralized structure and high volatility make regulation and exchange platform oversight an ongoing global debate.", question: "What risks come with investing in a highly volatile digital currency?", funfact: "Did you know? The first cryptocurrency, Bitcoin, was created by a person or group using the pseudonym Satoshi Nakamoto." },
                12: { title: "Supply Chain Management", terms: ["Logistics network", "Inventory control", "Supplier relationship", "Just-in-time delivery", "Distribution center", "Bottleneck", "Freight cost", "Supply disruption"], passage: "Supply chain management coordinates a logistics network and inventory control across many supplier relationships. Just-in-time delivery from a distribution center reduces freight cost, though a single bottleneck can trigger widespread supply disruption.", question: "How can a supply disruption in one country affect stores in another country?", funfact: "Did you know? A blockage at a single major shipping route can delay goods for companies located on the opposite side of the world." },
                13: { title: "Mergers & Acquisitions", terms: ["Acquisition target", "Due diligence", "Hostile takeover", "Synergy", "Deal valuation", "Regulatory approval", "Shareholder vote", "Integration process"], passage: "A merger begins by identifying an acquisition target and completing thorough due diligence. Deal valuation and a shareholder vote precede regulatory approval, while the real challenge often lies in the integration process afterward.", question: "Why might two companies claim a merger will create 'synergy,' and is that always true?", funfact: "Did you know? Studies suggest that a large share of corporate mergers actually fail to create the value that was originally promised." },
                14: { title: "Consumer Behavior", terms: ["Purchase decision", "Brand perception", "Impulse buying", "Price sensitivity", "Loyalty program", "Social proof", "Psychology of pricing", "Buying journey"], passage: "Consumer behavior studies how brand perception and price sensitivity shape a purchase decision. Impulse buying is often influenced by social proof and the psychology of pricing along a customer's overall buying journey.", question: "What influences your own purchase decisions the most — price, brand, or reviews?", funfact: "Did you know? Retailers often use 'social proof,' like showing how many people bought an item, to encourage impulse buying." },
                15: { title: "Insurance Industry", terms: ["Policy premium", "Risk assessment", "Claim process", "Underwriting", "Deductible", "Coverage limit", "Actuary", "Insurance fraud"], passage: "The insurance industry relies on risk assessment and underwriting to set a fair policy premium. An actuary calculates coverage limits and deductibles, while a careful claim process helps detect insurance fraud.", question: "Why do insurance companies employ actuaries to study statistics and risk?", funfact: "Did you know? An actuary's job is considered one of the oldest data-driven professions, combining mathematics with real-world risk prediction." },
                16: { title: "Small Business Growth", terms: ["Local entrepreneur", "Business loan", "Customer base", "Cash flow", "Marketing budget", "Hiring decision", "Scaling up", "Community support"], passage: "A local entrepreneur often relies on a small business loan to manage cash flow while growing a loyal customer base. Careful hiring decisions and a realistic marketing budget guide the process of scaling up, supported by the local community.", question: "How can a community help a small local business succeed?", funfact: "Did you know? Small businesses collectively create the majority of new jobs in many national economies each year." },
                17: { title: "Economic Indicators", terms: ["Gross domestic product", "Inflation rate", "Consumer price index", "Unemployment figure", "Interest rate decision", "Economic forecast", "Leading indicator", "Recession signal"], passage: "Economists track gross domestic product, the inflation rate, and the consumer price index as key economic indicators. An unemployment figure or interest rate decision can serve as a leading indicator or even a recession signal.", question: "Which economic indicator do you think matters most to an average family?", funfact: "Did you know? Gross domestic product measures the total value of everything a country produces in a single year." },
                18: { title: "Sustainable Business", terms: ["Corporate responsibility", "Carbon footprint", "Ethical sourcing", "Green initiative", "Sustainable supply chain", "Environmental impact", "Stakeholder value", "Long-term sustainability"], passage: "Sustainable business focuses on corporate responsibility, reducing a company's carbon footprint through ethical sourcing. A green initiative and sustainable supply chain lower environmental impact while protecting long-term stakeholder value.", question: "Should companies be required by law to reduce their environmental impact?", funfact: "Did you know? A growing number of major companies now publish an annual sustainability report alongside their financial results." },
                19: { title: "Global Trade Disputes", terms: ["Trade war", "Retaliatory tariff", "World Trade Organization", "Import restriction", "Trade negotiation", "Export ban", "Economic sanction", "Bilateral agreement"], passage: "A trade war can begin with a retaliatory tariff, prompting an import restriction or export ban between nations. The World Trade Organization often mediates trade negotiation, while an economic sanction or bilateral agreement can resolve or escalate a dispute.", question: "How might a trade war between two large countries affect prices in a third country?", funfact: "Did you know? The World Trade Organization has a formal dispute settlement process, but resolving a major trade dispute can still take years." },
                20: { title: "Inflation and Prices", terms: ["Inflation", "Prices", "Consumer Price Index", "Interest rate", "Purchasing power", "Wages", "Central bank", "Cost of living"], passage: "Inflation means prices rise over time, reducing purchasing power. Economists measure it with the Consumer Price Index. When wages do not keep up, the cost of living rises, and a central bank may raise the interest rate.", question: "How does inflation affect families?", funfact: "Did you know? The Consumer Price Index tracks the prices of a 'basket' of everyday goods and services." },
                21: { title: "The Tourism Economy", terms: ["Tourism", "Visitors", "Hotel", "Jobs", "Revenue", "Season", "Heritage site", "Economy"], passage: "Tourism brings revenue and jobs to the economy. Visitors fill each hotel during the high season, and a famous heritage site can attract travellers from around the world.", question: "How does tourism help or harm local communities?", funfact: "Did you know? Before the COVID-19 pandemic, travel and tourism made up about 10% of global economic activity." },
                22: { title: "Microfinance", terms: ["Microfinance", "Loan", "Borrower", "Interest", "Repayment", "Small business", "Debt", "Regulation"], passage: "Microfinance offers a small loan to a borrower who cannot use a traditional bank, often to start a small business. Fair interest and repayment terms matter, and regulation helps prevent harmful debt.", question: "What are the benefits and risks of microfinance?", funfact: "Did you know? Muhammad Yunus and the Grameen Bank won the Nobel Peace Prize in 2006 for their work on microcredit." },
                23: { title: "Digital Payments", terms: ["Digital payment", "QR code", "Mobile wallet", "Bank", "Cash", "Security", "Fees", "Transaction"], passage: "Digital payment is growing fast. Customers scan a QR code with a mobile wallet instead of using cash. Each transaction is quick, but security and fees are important for users and each bank.", question: "Do you prefer cash or digital payments? Why?", funfact: "Did you know? Cambodia's Bakong payment system was launched by the National Bank of Cambodia in 2020." },
                24: { title: "Manufacturing and Garments", terms: ["Manufacturing", "Garment", "Factory", "Export", "Workers", "Supply chain", "Wages", "Standards"], passage: "Manufacturing, especially the garment industry, is an important export sector in several Asian economies. News reports cover each factory, workers' wages and labour standards across the supply chain.", question: "Why are labour standards important in manufacturing?", funfact: "Did you know? Garments and footwear are among Cambodia's largest exports." },
                25: { title: "Personal Finance News", terms: ["Budget", "Savings", "Compound interest", "Debt", "Investment", "Emergency fund", "Financial literacy", "Goal"], passage: "Personal finance news helps readers manage money. It explains how to set a budget, build savings and an emergency fund, avoid bad debt and understand compound interest and investment.", question: "What is your most important financial goal?", funfact: "Did you know? With compound interest, you earn interest not only on your savings but also on the interest they have already earned." },
            },
            'PoliticsSociety': {
                1: { title: "Government Systems", terms: ["Democracy", "Constitution", "Legislature", "Executive branch", "Judiciary", "Separation of powers", "Federal system", "Sovereignty"], passage: "A democracy is often guided by a constitution that defines the legislature, executive branch, and judiciary. The separation of powers, sometimes within a federal system, helps protect a nation's sovereignty and prevent abuse of power.", question: "Why is the separation of powers important in a government system?", funfact: "Did you know? The French thinker Montesquieu made the idea of separating government into three branches famous in 1748, although ancient writers had already discussed mixing different kinds of government." },
                2: { title: "Elections & Voting", terms: ["Ballot", "Candidate", "Campaign", "Voter turnout", "Electoral system", "Polling station", "Referendum", "Political party"], passage: "During an election, a candidate runs a campaign hoping for strong voter turnout at every polling station. The electoral system, sometimes involving a referendum, determines how each ballot is counted and how a political party gains power.", question: "Why does voter turnout matter in an election?", funfact: "Did you know? Some countries have compulsory voting laws, meaning citizens can be fined for not voting in an election." },
                3: { title: "Social Movements", terms: ["Activism", "Protest", "Advocacy group", "Grassroots", "Petition", "Civil rights", "Solidarity", "Awareness"], passage: "Activism often begins at the grassroots level, growing into organized protest and advocacy group efforts. A petition and public solidarity can raise awareness and drive real change, as seen throughout the history of civil rights movements.", question: "What makes a social movement successful in creating change?", funfact: "Did you know? Many major civil rights advances throughout history began as small, local grassroots movements." },
                4: { title: "Public Policy", terms: ["Legislation", "Policy maker", "Stakeholder", "Implementation", "Public consultation", "Regulation", "Impact assessment", "Reform"], passage: "A policy maker drafts legislation after listening to every relevant stakeholder, sometimes through public consultation. Successful implementation requires careful regulation, an honest impact assessment, and openness to future reform.", question: "Why is public consultation important before new legislation is passed?", funfact: "Did you know? Many governments now require an official impact assessment before passing major new legislation." },
                5: { title: "Human Rights", terms: ["Universal rights", "Discrimination", "Equality", "Freedom of speech", "Justice system", "Human dignity", "International law", "Advocacy"], passage: "Universal rights protect human dignity and promote equality, including freedom of speech, for every person. A fair justice system, supported by international law and strong advocacy, works to prevent discrimination.", question: "Why are human rights considered universal, regardless of country?", funfact: "Did you know? The Universal Declaration of Human Rights was adopted by the United Nations in 1948, following the Second World War." },
                6: { title: "International Relations Basics", terms: ["Diplomacy", "Treaty", "Alliance", "Foreign policy", "Sanctions", "Embassy", "Negotiation", "Sovereignty"], passage: "Diplomacy often relies on a treaty or a formal alliance to guide a country's foreign policy. An embassy supports ongoing negotiation between nations, while sanctions are sometimes used to respond to a violation of another country's sovereignty.", question: "Why is diplomacy important for resolving conflicts between countries?", funfact: "Did you know? Contrary to a popular myth, an embassy is not the home country's territory — but under the 1961 Vienna Convention, the host country may not enter it without permission." },
                7: { title: "Media & Politics", terms: ["Political coverage", "Press freedom", "Media bias", "Political spin", "Fact-based reporting", "Public opinion", "News cycle", "Journalistic ethics"], passage: "Political coverage depends on press freedom and journalistic ethics to counter political spin. Fact-based reporting shapes public opinion across the news cycle, even as critics debate claims of media bias.", question: "How can a citizen recognize political spin when reading the news?", funfact: "Did you know? Press freedom is protected by law in many constitutions, though the level of real protection varies widely between countries." },
                8: { title: "Judicial System", terms: ["Supreme court", "Due process", "Legal precedent", "Trial by jury", "Judicial review", "Appeal", "Rule of law", "Sentencing"], passage: "A judicial system relies on due process and a fair trial by jury to protect the rule of law. A supreme court can set legal precedent through judicial review, while a convicted person retains the right to appeal a sentencing decision.", question: "Why is 'due process' considered essential to a fair judicial system?", funfact: "Did you know? A single supreme court ruling can set a legal precedent that shapes how laws are interpreted for generations." },
                9: { title: "Local Government", terms: ["City council", "Municipal budget", "Public services", "Zoning law", "Local election", "Civic engagement", "Community project", "Public hearing"], passage: "Local government, led by a city council, manages a municipal budget to fund public services. A zoning law often follows a public hearing, while a local election depends on genuine civic engagement in every community project.", question: "What local government decision has directly affected your daily life?", funfact: "Did you know? Voter turnout in local elections is often much lower than in national elections, even though local decisions affect daily life directly." },
                10: { title: "Immigration Policy", terms: ["Visa system", "Border control", "Pathway to citizenship", "Asylum process", "Immigration reform", "Labor migration", "Integration policy", "Undocumented status"], passage: "Immigration policy covers the visa system, border control, and a country's pathway to citizenship. Immigration reform often addresses the asylum process, labor migration, integration policy, and the challenges of undocumented status.", question: "What makes immigration policy such a difficult and debated topic in many countries?", funfact: "Did you know? Immigration policy differs enormously between countries, from strict visa systems to relatively open labor migration programs." },
                11: { title: "Education Policy", terms: ["Public school funding", "Standardized testing", "Curriculum reform", "Teacher shortage", "School choice", "Higher education access", "Education equity", "Dropout rate"], passage: "Education policy debates public school funding, standardized testing, and needed curriculum reform. A teacher shortage and unequal school choice options raise concerns about education equity, higher education access, and the dropout rate.", question: "Should standardized testing play a large role in evaluating students and schools?", funfact: "Did you know? Education policy debates about standardized testing have continued for decades, with strong arguments on both sides." },
                12: { title: "Healthcare Policy", terms: ["Universal healthcare", "Health insurance", "Public health system", "Medical cost", "Healthcare access", "Preventive care", "Health disparity", "Pharmaceutical regulation"], passage: "Healthcare policy weighs universal healthcare against private health insurance to control rising medical cost. Debates over healthcare access, preventive care, and health disparity often center on pharmaceutical regulation within a public health system.", question: "What are the tradeoffs between a universal healthcare system and a private insurance system?", funfact: "Did you know? Healthcare systems vary enormously worldwide, from fully public universal healthcare to mostly private, employer-based insurance." },
                13: { title: "Gender Equality", terms: ["Gender pay gap", "Workplace equality", "Representation", "Gender-based discrimination", "Equal opportunity", "Women's rights", "Glass ceiling", "Policy reform"], passage: "Gender equality efforts target the gender pay gap and workplace equality through stronger representation. Policy reform aims to end gender-based discrimination and break the glass ceiling, expanding equal opportunity and women's rights.", question: "What is one concrete policy that could help close the gender pay gap?", funfact: "Did you know? The term 'glass ceiling' was first popularized in the 1980s to describe an invisible barrier to advancement." },
                14: { title: "Youth Political Engagement", terms: ["Youth vote", "Political apathy", "Student activism", "Voting age", "Civic education", "Youth-led movement", "Political awareness", "First-time voter"], passage: "Youth political engagement depends on overcoming political apathy through civic education and student activism. Debates over the voting age reflect growing youth-led movements and rising political awareness among a new generation of first-time voters.", question: "What could encourage more young people to vote and stay politically engaged?", funfact: "Did you know? Some countries have lowered their voting age to sixteen, arguing it increases lifelong civic engagement." },
                15: { title: "Corruption & Accountability", terms: ["Bribery", "Conflict of interest", "Transparency", "Anti-corruption law", "Whistleblower protection", "Public trust", "Audit", "Accountability mechanism"], passage: "Fighting corruption requires transparency and strong anti-corruption law to prevent bribery and conflict of interest. Whistleblower protection, regular audits, and clear accountability mechanisms help preserve public trust in government.", question: "Why is whistleblower protection important for exposing government corruption?", funfact: "Did you know? International organizations publish an annual index ranking countries by their perceived level of public corruption." },
                16: { title: "Political Ideologies", terms: ["Conservatism", "Liberalism", "Socialism", "Political spectrum", "Ideology", "Political values", "Party platform", "Policy position"], passage: "Political ideologies like conservatism, liberalism, and socialism sit at different points on the political spectrum. A party platform reflects core political values, shaping each candidate's specific policy position.", question: "Do you think most people fit neatly into a single political ideology?", funfact: "Did you know? The terms 'left' and 'right' in politics originated from where representatives physically sat in the French Revolutionary assembly." },
                17: { title: "Civic Duty", terms: ["Jury duty", "Voting responsibility", "Community service", "Civic participation", "Public engagement", "Volunteer work", "Active citizenship", "Social contract"], passage: "Civic duty includes jury duty, voting responsibility, and regular community service. Active citizenship depends on civic participation and volunteer work, reflecting each person's role in the broader social contract.", question: "What civic duty do you think is most important for a healthy society?", funfact: "Did you know? Jury duty is considered a civic duty in many countries, and some make it legally mandatory to serve if selected." },
                18: { title: "Social Welfare Systems", terms: ["Social safety net", "Unemployment benefit", "Public assistance", "Welfare reform", "Poverty reduction", "Universal basic income", "Means testing", "Social security"], passage: "A social safety net provides an unemployment benefit and public assistance to reduce poverty. Welfare reform debates often include universal basic income, means testing, and the long-term future of social security.", question: "Should welfare programs use means testing, or should benefits be universal for everyone?", funfact: "Did you know? The idea of a universal basic income has been tested in small pilot programs in several countries around the world." },
                19: { title: "Freedom of the Press", terms: ["Press censorship", "Investigative freedom", "Government transparency", "Journalist safety", "Media independence", "Public's right to know", "Press regulation", "Free expression"], passage: "Freedom of the press protects investigative freedom and the public's right to know, resisting press censorship. Journalist safety and media independence depend on government transparency and strong protection for free expression.", question: "Why is journalist safety considered essential to a healthy, functioning democracy?", funfact: "Did you know? Press freedom organizations track journalist safety worldwide, publishing an annual report on threats to reporters." },
                20: { title: "Urbanisation and Housing", terms: ["Urbanisation", "City", "Housing", "Rent", "Infrastructure", "Planning", "Migration", "Affordable"], passage: "Urbanisation brings rapid growth to each city as people migrate for work. Rising rent makes affordable housing scarce, so good planning and infrastructure are key policy issues.", question: "What challenges does fast city growth create?", funfact: "Did you know? Since around 2007, more than half of the world's population has lived in towns and cities." },
                21: { title: "Disability Rights", terms: ["Disability", "Rights", "Accessibility", "Inclusion", "Discrimination", "Law", "Advocacy", "Equal opportunity"], passage: "Disability rights campaigns fight discrimination and call for accessibility and inclusion. Advocacy has led to law that promotes equal opportunity in education, work and public life.", question: "How accessible are public places in your city?", funfact: "Did you know? The UN Convention on the Rights of Persons with Disabilities was adopted in 2006." },
                22: { title: "Environmental Policy", terms: ["Environmental policy", "Regulation", "Pollution", "Impact assessment", "Protected area", "Enforcement", "Public consultation", "Sustainability"], passage: "Environmental policy uses regulation to limit pollution and protect each protected area. An impact assessment and public consultation are often required for big projects, but enforcement decides how well sustainability goals are met.", question: "Why is enforcement as important as the law itself?", funfact: "Did you know? Many countries require an environmental impact assessment before large construction projects can go ahead." },
                23: { title: "Public Opinion and Polls", terms: ["Opinion poll", "Survey", "Sample", "Margin of error", "Public opinion", "Trend", "Question wording", "Accuracy"], passage: "An opinion poll uses a survey of a sample to measure public opinion. Question wording and the margin of error affect accuracy, so journalists should report each trend carefully.", question: "How can the wording of a poll question change the results?", funfact: "Did you know? A small difference between two results in a poll may be smaller than the margin of error — and mean very little." },
                24: { title: "The Rule of Law", terms: ["Rule of law", "Justice", "Courts", "Equality", "Accountability", "Constitution", "Independence", "Rights"], passage: "The rule of law means everyone, including leaders, is subject to the same laws. Independent courts, a constitution that protects rights, equality before the law and accountability support justice.", question: "Why is judicial independence important?", funfact: "Did you know? The Magna Carta of 1215 is often cited as an early step toward the idea that even rulers must obey the law." },
                25: { title: "Digital Rights and Privacy", terms: ["Digital rights", "Privacy", "Data protection", "Surveillance", "Consent", "Online speech", "Regulation", "Platforms"], passage: "Digital rights include privacy, data protection and freedom of online speech. Debates focus on surveillance, consent and how regulation should apply to technology platforms.", question: "How much personal data should apps be allowed to collect?", funfact: "Did you know? The European Union's General Data Protection Regulation (GDPR) came into effect in 2018." },
            },
            'GlobalAffairs': {
                1: { title: "Geopolitics", terms: ["Geopolitical", "Sphere of influence", "Strategic interest", "Border dispute", "Power balance", "Regional stability", "Superpower", "Alliance"], passage: "Geopolitical analysis studies how a sphere of influence and strategic interest shape global power balance. A border dispute can threaten regional stability, especially when a superpower or a major alliance becomes involved.", question: "How can a border dispute affect an entire region's stability?", funfact: "Did you know? Geopolitics as a formal academic field only emerged as a serious discipline in the late nineteenth century." },
                2: { title: "International Organizations", terms: ["United Nations", "Multilateral", "Member state", "Peacekeeping", "International cooperation", "Resolution", "Humanitarian aid", "Global governance"], passage: "The United Nations brings together many a member state for multilateral cooperation, including peacekeeping missions and humanitarian aid. A resolution passed through international cooperation reflects the challenges of global governance.", question: "Why might countries choose to work through international organizations?", funfact: "Did you know? The United Nations was founded in 1945 by 51 countries and has since grown to include nearly 200 member states." },
                3: { title: "Global Security", terms: ["National security", "Cybersecurity threat", "Terrorism", "Arms control", "Intelligence agency", "Conflict resolution", "Deterrence", "Crisis management"], passage: "National security today includes traditional defense as well as a growing cybersecurity threat. Arms control agreements and an intelligence agency support both deterrence and effective conflict resolution during a major crisis management situation.", question: "How has the definition of 'security' changed with new technology?", funfact: "Did you know? Cybersecurity is now considered a core part of national security policy in most modern countries." },
                4: { title: "Climate Diplomacy", terms: ["Climate accord", "Carbon emissions", "Sustainable development", "Global warming", "Renewable transition", "Environmental treaty", "Climate justice", "Adaptation strategy"], passage: "A global climate accord aims to reduce carbon emissions and support sustainable development worldwide. Every environmental treaty on global warming must balance a renewable transition, climate justice, and a realistic adaptation strategy.", question: "Why is international cooperation especially important for climate issues?", funfact: "Did you know? Climate change does not respect national borders, which is part of why global climate diplomacy is so essential." },
                5: { title: "Migration & Refugees", terms: ["Migration", "Refugee", "Asylum seeker", "Displacement", "Humanitarian crisis", "Resettlement", "Border policy", "Integration"], passage: "Global migration often includes a refugee or an asylum seeker fleeing conflict, leading to widespread displacement. A humanitarian crisis may require resettlement support, thoughtful border policy, and long-term integration programs.", question: "What challenges might a refugee face when resettling in a new country?", funfact: "Did you know? Millions of people worldwide are currently displaced due to conflict, disaster, or persecution, according to global humanitarian organizations." },
                6: { title: "Global Trade Agreements", terms: ["Free trade agreement", "Trade bloc", "Tariff reduction", "Economic partnership", "Market access", "Trade dispute", "Global supply chain", "Protectionism"], passage: "A free trade agreement often creates a larger trade bloc, supporting tariff reduction and a new economic partnership. Better market access can still lead to a trade dispute, especially when protectionism disrupts the global supply chain.", question: "What are the advantages and disadvantages of free trade agreements?", funfact: "Did you know? Some regional trade blocs include dozens of countries and represent a large share of total global trade." },
                7: { title: "Nuclear Non-Proliferation", terms: ["Nuclear weapon", "Non-proliferation treaty", "Arms control", "Nuclear deterrence", "Disarmament", "Uranium enrichment", "International inspection", "Nuclear power"], passage: "Nuclear non-proliferation efforts rely on a non-proliferation treaty to limit the spread of any nuclear weapon. Arms control and disarmament talks address nuclear deterrence, uranium enrichment, and international inspection of nuclear power programs.", question: "Why do countries agree to international inspections of their nuclear programs?", funfact: "Did you know? The Non-Proliferation Treaty, signed in 1968, remains one of the most widely joined international agreements in history." },
                8: { title: "Space Policy", terms: ["Space exploration", "Satellite technology", "Orbital debris", "Space race", "International space law", "Space agency", "Commercial spaceflight", "Space militarization"], passage: "Space policy covers space exploration, satellite technology, and the growing problem of orbital debris. A modern space race now includes commercial spaceflight alongside government space agencies, raising new questions about space militarization and international space law.", question: "Should there be stronger international laws governing activity in space?", funfact: "Did you know? There is more human-made debris currently orbiting Earth than most people realize, creating real risks for satellites and spacecraft." },
                9: { title: "Global Health Diplomacy", terms: ["Pandemic response", "Vaccine distribution", "World Health Organization", "Health emergency", "Cross-border outbreak", "Global health equity", "Disease surveillance", "International aid"], passage: "Global health diplomacy coordinates pandemic response and vaccine distribution through the World Health Organization. A cross-border outbreak requires disease surveillance and international aid to protect global health equity during any health emergency.", question: "Why is international cooperation especially important during a global pandemic?", funfact: "Did you know? The World Health Organization can officially declare a 'Public Health Emergency of International Concern' to mobilize global response." },
                10: { title: "Cultural Diplomacy", terms: ["Soft power", "Cultural exchange program", "Public diplomacy", "National image", "Cultural export", "People-to-people ties", "International goodwill", "Cultural influence"], passage: "Cultural diplomacy uses soft power through a cultural exchange program to build international goodwill. A strong cultural export and public diplomacy strategy shape a nation's global image through genuine people-to-people ties.", question: "Can you think of an example of cultural diplomacy, like music, film, or sports?", funfact: "Did you know? Many countries fund official cultural exchange programs specifically to build long-term international goodwill and understanding." },
                11: { title: "Foreign Aid & Development", terms: ["Development assistance", "Humanitarian aid", "Aid dependency", "Sustainable development goal", "Donor country", "Capacity building", "Poverty alleviation", "Aid effectiveness"], passage: "Foreign aid includes development assistance and humanitarian aid aimed at poverty alleviation. Debates over aid dependency and aid effectiveness shape how a donor country supports capacity building toward a sustainable development goal.", question: "Can foreign aid sometimes create dependency instead of long-term self-sufficiency?", funfact: "Did you know? The United Nations Sustainable Development Goals set specific global targets for reducing poverty and inequality by 2030." },
                12: { title: "Regional Trade Blocs", terms: ["Free trade zone", "Common market", "Regional integration", "Customs union", "Trade bloc membership", "Economic community", "Cross-border trade", "Regional cooperation"], passage: "A regional trade bloc creates a free trade zone or common market through deeper regional integration. A customs union and formal trade bloc membership support an economic community built on cross-border trade and regional cooperation.", question: "What are the benefits of joining a regional trade bloc for a smaller country?", funfact: "Did you know? Some regional trade blocs allow citizens to work and live freely in any member country, not just trade goods." },
                13: { title: "Cyber Diplomacy", terms: ["Cyberattack", "Digital sovereignty", "International cyber norm", "State-sponsored hacking", "Cybersecurity cooperation", "Critical infrastructure", "Digital espionage", "Cyber treaty"], passage: "Cyber diplomacy addresses the growing threat of a cyberattack against critical infrastructure. International cyber norms and cybersecurity cooperation aim to prevent state-sponsored hacking, digital espionage, and to protect each nation's digital sovereignty.", question: "Should there be an international treaty specifically governing cyberattacks between nations?", funfact: "Did you know? Unlike traditional warfare, there is still no single, widely accepted international treaty specifically governing cyberattacks." },
                14: { title: "Ocean & Maritime Law", terms: ["Territorial waters", "Exclusive economic zone", "Maritime boundary", "Freedom of navigation", "Deep sea resources", "Fishing rights", "Law of the sea", "Maritime dispute"], passage: "Maritime law defines territorial waters and an exclusive economic zone along every maritime boundary. The Law of the Sea protects freedom of navigation and fishing rights, while deep sea resources often fuel a maritime dispute.", question: "Why might countries disagree over rights to deep sea resources?", funfact: "Did you know? Under international law, a country's exclusive economic zone can extend up to 200 nautical miles from its coastline." },
                15: { title: "Global Food Security", terms: ["Food insecurity", "Agricultural trade", "Crop yield", "Famine relief", "Sustainable agriculture", "Food supply chain", "Global hunger", "Climate resilience"], passage: "Global food security depends on stable agricultural trade and rising crop yield despite growing food insecurity. Famine relief and sustainable agriculture strengthen the global food supply chain, building climate resilience against global hunger.", question: "How might climate change threaten global food security in the coming decades?", funfact: "Did you know? Enough food is currently produced worldwide to feed everyone, yet global food insecurity remains a major crisis due to distribution problems." },
                16: { title: "Energy Diplomacy", terms: ["Energy security", "Oil dependency", "Renewable energy transition", "Energy exporter", "Pipeline politics", "Energy crisis", "Strategic reserve", "Clean energy cooperation"], passage: "Energy diplomacy manages energy security and reduces oil dependency through a renewable energy transition. Pipeline politics between an energy exporter and importer can trigger an energy crisis, while a strategic reserve supports clean energy cooperation.", question: "How might a shift to renewable energy change global energy diplomacy?", funfact: "Did you know? Some countries maintain a strategic oil reserve specifically to protect against a sudden global energy crisis." },
                17: { title: "Human Trafficking", terms: ["Forced labor", "Trafficking victim", "Exploitation", "Anti-trafficking law", "Modern slavery", "Trafficking network", "Victim support", "International cooperation"], passage: "Human trafficking involves forced labor and exploitation, making every trafficking victim a survivor of modern slavery. Anti-trafficking law and international cooperation work to dismantle a trafficking network while expanding victim support.", question: "Why does fighting human trafficking require cooperation across many different countries?", funfact: "Did you know? Human trafficking is considered a form of modern slavery and remains a serious crime in nearly every country in the world." },
                18: { title: "Global Public Health", terms: ["Disease eradication", "Vaccination campaign", "Healthcare infrastructure", "Epidemiology", "Global health fund", "Health workforce", "Preventable disease", "Health system strengthening"], passage: "Global public health efforts pursue disease eradication through a coordinated vaccination campaign and stronger healthcare infrastructure. Epidemiology guides a global health fund toward health system strengthening, expanding the health workforce to fight preventable disease.", question: "What has been one of the greatest successes in the history of global public health?", funfact: "Did you know? Global vaccination campaigns have successfully eradicated smallpox, the only human disease ever completely eliminated worldwide." },
                19: { title: "Future of Global Governance", terms: ["International institution", "Multilateralism", "Global cooperation", "Reform proposal", "Emerging power", "Global challenge", "Institutional legitimacy", "Collective action"], passage: "The future of global governance depends on reforming an aging international institution to reflect true multilateralism. An emerging power often pushes a reform proposal, questioning institutional legitimacy while urging stronger collective action on every global challenge.", question: "What is one reform you would make to how international institutions operate today?", funfact: "Did you know? Many major international institutions still reflect a balance of global power that was set shortly after the Second World War." },
                20: { title: "ASEAN and Southeast Asia", terms: ["ASEAN", "Member states", "Cooperation", "Summit", "Trade", "Region", "Consensus", "Integration"], passage: "ASEAN brings its member states together for cooperation on trade, security and culture. Leaders meet at a summit and usually make decisions by consensus, supporting regional integration.", question: "How does ASEAN membership benefit Cambodia?", funfact: "Did you know? ASEAN was founded in 1967, and Cambodia joined in 1999." },
                21: { title: "The Mekong Region", terms: ["Mekong", "River", "Dam", "Fisheries", "Upstream", "Downstream", "Cooperation", "Livelihoods"], passage: "The Mekong River supports the livelihoods of millions. Each dam built upstream can affect fisheries and farmers downstream, making cooperation between countries essential.", question: "Why does a dam in one country matter to another?", funfact: "Did you know? The Mekong flows through six countries: China, Myanmar, Laos, Thailand, Cambodia and Vietnam." },
                22: { title: "UN Peacekeeping", terms: ["Peacekeeping", "Blue helmets", "Ceasefire", "Mandate", "Troops", "Civilians", "Conflict", "Security Council"], passage: "UN peacekeeping missions work under a mandate from the Security Council. Troops known as blue helmets help maintain a ceasefire and protect civilians after conflict.", question: "What makes peacekeeping missions succeed or fail?", funfact: "Did you know? The first UN peacekeeping mission was established in 1948 in the Middle East." },
                23: { title: "Pandemic Preparedness", terms: ["Pandemic", "Preparedness", "Surveillance", "Vaccine", "Supply chain", "Cooperation", "Outbreak", "Early warning"], passage: "Pandemic preparedness depends on surveillance, early warning systems and fast vaccine development. Global cooperation and strong supply chains help stop an outbreak spreading.", question: "What lessons did the world learn from COVID-19?", funfact: "Did you know? Under the International Health Regulations, countries must report certain disease outbreaks to the World Health Organization." },
                24: { title: "Global Education Goals", terms: ["Education", "SDG 4", "Access", "Quality", "Literacy", "Girls' education", "Teachers", "Funding"], passage: "SDG 4 aims to ensure access to quality education for all. Improving literacy, supporting girls' education, training teachers and increasing funding are global priorities.", question: "What would most improve education worldwide?", funfact: "Did you know? Sustainable Development Goal 4 aims for inclusive and quality education for all by 2030." },
                25: { title: "AI and Global Rules", terms: ["Artificial intelligence", "Regulation", "Ethics", "Risk", "Transparency", "International cooperation", "Innovation", "Accountability"], passage: "Artificial intelligence raises questions of ethics, risk and accountability. Governments are developing regulation that balances innovation with transparency, and international cooperation is growing.", question: "Should there be global rules for artificial intelligence?", funfact: "Did you know? In 2024, the European Union adopted the AI Act, one of the first comprehensive laws regulating artificial intelligence." },
            },
            'AcademicLiterary': {
                1: { title: "Reading Literary Criticism", terms: ["Literary criticism", "Critical lens", "Thematic analysis", "Symbolism", "Narrative technique", "Subtext", "Interpretation", "Canon"], passage: "Literary criticism applies a critical lens to a text through thematic analysis, symbolism, and narrative technique. Understanding subtext leads to deeper interpretation, shaping which works eventually join the literary canon.", question: "How does a critical lens change the way we understand a story?", funfact: "Did you know? The literary canon — the set of works considered most important — has changed significantly over the past century." },
                2: { title: "Academic Journal Reading", terms: ["Peer review", "Abstract", "Methodology", "Citation", "Literature review", "Hypothesis", "Empirical evidence", "Scholarly source"], passage: "An academic journal article begins with an abstract summarizing the methodology and key findings. Peer review ensures quality, while a literature review, proper citation, and empirical evidence all support a strong scholarly source.", question: "Why is peer review important for academic research?", funfact: "Did you know? Peer review can take many months, as multiple expert reviewers evaluate a single academic article before publication." },
                3: { title: "Philosophical Essays", terms: ["Argument", "Premise", "Logical fallacy", "Counterargument", "Thought experiment", "Abstract concept", "Reasoning", "Conclusion"], passage: "A philosophical essay builds an argument from a clear premise, avoiding any logical fallacy along the way. Engaging with a counterargument or a thought experiment strengthens the reasoning behind even the most abstract concept and final conclusion.", question: "Why might a philosopher use a thought experiment to explain an idea?", funfact: "Did you know? Some famous thought experiments, like the 'trolley problem', are still actively debated by philosophers today." },
                4: { title: "Historical Analysis Texts", terms: ["Primary source", "Historiography", "Historical context", "Causation", "Bias", "Interpretation", "Archival research", "Periodization"], passage: "Historical analysis relies on a primary source examined within its historical context, while historiography studies how interpretation changes over time. Understanding causation and recognizing bias are essential parts of careful archival research and periodization.", question: "Why might two historians interpret the same primary source differently?", funfact: "Did you know? Historiography is sometimes called 'the history of history,' since it studies how historical writing itself has changed." },
                5: { title: "Scientific Papers", terms: ["Research question", "Data analysis", "Control group", "Statistical significance", "Peer-reviewed", "Replication", "Findings", "Conclusion"], passage: "A scientific paper begins with a clear research question, followed by data analysis comparing results to a control group. Statistical significance, published in a peer-reviewed journal, only becomes convincing after successful replication of the original findings.", question: "Why is replication important for trusting scientific findings?", funfact: "Did you know? A scientific result is generally not considered fully reliable until other researchers have replicated it independently." },
                6: { title: "Opinion Editorials", terms: ["Op-ed", "Persuasive writing", "Bias", "Rhetorical device", "Counterpoint", "Call to action", "Perspective", "Evidence-based argument"], passage: "An op-ed uses persuasive writing to share a personal perspective, often built on an evidence-based argument. A skilled writer uses a rhetorical device, addresses a counterpoint, and closes with a clear call to action, while readers should watch for bias.", question: "How is an opinion editorial different from a regular news article?", funfact: "Did you know? The term 'op-ed' originally meant 'opposite the editorial page,' referring to where these articles were printed in a newspaper." },
                7: { title: "Comparative Literature", terms: ["Cross-cultural analysis", "Translated text", "Literary tradition", "Comparative method", "World literature", "Textual comparison", "Cultural context", "Universal theme"], passage: "Comparative literature uses cross-cultural analysis to study a translated text alongside its original literary tradition. The comparative method reveals a universal theme across world literature, always grounded in careful cultural context.", question: "What can comparing literature from two different cultures teach us about both?", funfact: "Did you know? Comparative literature as a formal academic field grew rapidly after more literary works became widely available in translation." },
                8: { title: "Poetry Analysis", terms: ["Meter", "Imagery", "Metaphor", "Stanza structure", "Poetic form", "Tone", "Figurative language", "Close reading"], passage: "Poetry analysis examines meter, imagery, and metaphor within a poem's stanza structure. Close reading of poetic form and tone reveals how figurative language shapes a reader's deeper understanding.", question: "How does close reading a poem change your understanding of it compared to a first read?", funfact: "Did you know? Some poetic forms, like the sonnet, have followed the same strict structural rules for over five hundred years." },
                9: { title: "Rhetorical Analysis", terms: ["Rhetorical strategy", "Audience awareness", "Persuasive appeal", "Ethos", "Pathos", "Logos", "Rhetorical situation", "Argument structure"], passage: "Rhetorical analysis examines a text's rhetorical strategy and audience awareness, identifying each persuasive appeal. Understanding ethos, pathos, and logos within a rhetorical situation reveals the deeper structure of an argument.", question: "Which persuasive appeal — ethos, pathos, or logos — do you find most convincing, and why?", funfact: "Did you know? Ethos, pathos, and logos were first formally described by the ancient philosopher Aristotle over two thousand years ago." },
                10: { title: "Case Study Reports", terms: ["Case background", "Data collection", "Analytical framework", "Findings summary", "Recommendation", "Real-world application", "Stakeholder analysis", "Limitations section"], passage: "A case study report begins with case background and careful data collection guided by an analytical framework. A findings summary leads to a practical recommendation, always including a limitations section and stakeholder analysis.", question: "Why is it important for a case study report to include its own limitations?", funfact: "Did you know? Case study reports are widely used in business schools to teach real-world decision-making through detailed analysis." },
                11: { title: "Literature Reviews", terms: ["Research gap", "Thematic organization", "Synthesis of sources", "Scope statement", "Chronological review", "Critical evaluation", "Existing scholarship", "Research question"], passage: "A literature review identifies a research gap through careful synthesis of sources and thematic organization. A clear scope statement and critical evaluation of existing scholarship help sharpen the final research question.", question: "Why is identifying a 'gap' in existing research so important before starting a new study?", funfact: "Did you know? A strong literature review can sometimes take longer to write than the actual research project that follows it." },
                12: { title: "Ethnographic Writing", terms: ["Field notes", "Participant observation", "Cultural insider", "Thick description", "Fieldwork", "Ethnographer", "Cultural interpretation", "Reflexivity"], passage: "Ethnographic writing draws on detailed field notes gathered through participant observation and long-term fieldwork. An ethnographer's thick description depends on cultural interpretation and honest reflexivity about their own position as an outsider or insider.", question: "Why might an ethnographer need to reflect on their own biases while writing about another culture?", funfact: "Did you know? The term 'thick description' in ethnography refers to explaining not just what happened, but the full cultural context behind it." },
                13: { title: "Legal Writing", terms: ["Legal brief", "Case citation", "Statutory interpretation", "Legal argument", "Precedent analysis", "Plain language", "Legal memorandum", "Persuasive brief"], passage: "Legal writing produces a legal brief built on careful case citation and precedent analysis. A strong legal argument relies on statutory interpretation, while a legal memorandum often favors plain language over complex jargon.", question: "Why might plain language be more effective than complex legal jargon in some legal writing?", funfact: "Did you know? A growing 'plain language' movement encourages lawyers to write legal documents that ordinary citizens can actually understand." },
                14: { title: "Technical Reports", terms: ["Executive summary", "Methodology section", "Data visualization", "Technical specification", "Results section", "Appendix", "Audience adaptation", "Clarity and precision"], passage: "A technical report opens with an executive summary before a detailed methodology section and results section. Data visualization and a clear appendix support technical specifications, all shaped by audience adaptation, clarity, and precision.", question: "Why is clarity often more important than technical detail when writing for a general audience?", funfact: "Did you know? Many technical reports include an executive summary specifically so busy readers can understand key findings in under a minute." },
                15: { title: "Biography & Memoir", terms: ["Life narrative", "Personal reflection", "Chronological structure", "Formative experience", "Voice and perspective", "Historical context", "Memoir writing", "Authenticity"], passage: "Biography and memoir share a life narrative shaped by personal reflection and a distinct voice and perspective. A chronological structure often highlights a formative experience, grounded in historical context and genuine authenticity.", question: "What makes a memoir feel 'authentic' to readers, even though it is one person's perspective?", funfact: "Did you know? A biography is written by someone else about a person's life, while a memoir is written by the subject themselves." },
                16: { title: "Satirical Writing", terms: ["Satire", "Irony", "Exaggeration", "Social commentary", "Parody", "Wit", "Target of satire", "Critical humor"], passage: "Satirical writing uses irony, exaggeration, and parody to deliver sharp social commentary. Skilled wit turns a clear target of satire into critical humor that challenges readers to think differently.", question: "Why might satire be an effective way to criticize powerful people or institutions?", funfact: "Did you know? Satirical writing has a long history, with some of the earliest known examples dating back over two thousand years." },
                17: { title: "Academic Conference Papers", terms: ["Conference proposal", "Abstract submission", "Peer feedback", "Presentation slide", "Q&A session", "Academic networking", "Conference panel", "Research dissemination"], passage: "An academic conference paper begins with a conference proposal and careful abstract submission. Peer feedback shapes the final presentation slides, while a conference panel and Q&A session support academic networking and research dissemination.", question: "Why is presenting research at an academic conference valuable, beyond just publishing a paper?", funfact: "Did you know? Academic conferences often accept only a small percentage of submitted proposals, making acceptance a competitive achievement." },
                18: { title: "Grant Proposals", terms: ["Funding request", "Project narrative", "Budget justification", "Grant reviewer", "Impact statement", "Feasibility", "Proposal deadline", "Successful application"], passage: "A grant proposal opens with a clear funding request and compelling project narrative. Careful budget justification and a strong impact statement convince a grant reviewer of a project's feasibility before the proposal deadline.", question: "What makes a grant proposal's 'impact statement' convincing to a reviewer?", funfact: "Did you know? Many major research grants receive far more applications than can be funded, making a strong proposal essential." },
