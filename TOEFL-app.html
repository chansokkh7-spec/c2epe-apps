ired. For inference, use the clues the speaker gives."], [210.65, 214.21, "Be careful! Don't say: I ignore times and numbers."], [216.17, 218.89, "Say: I note times and numbers."], [219.19, 220.37, "Note numbers."], [221.17, 223.76, "Part four: reading. Read and listen."], [224.57, 226.08, "A Change of Plan."], [226.38, 229.6, "A speaker announces that tomorrow's lecture is rescheduled."], [230.6, 233.47, "It will now take place in Hall B at three o'clock."], [234.47, 236.98, "The reason is that the usual room is being repaired."], [237.97, 240.74, "Students are reminded to bring their ID cards."], [241.73, 245.86, "Only first-year students are eligible for the library tour afterwards."], [246.97, 250.86, "Part five: quiz. Five questions. Are you ready?"], [251.72, 253.37, "The lecture is now in blank."], [253.67, 257.16, "A, Room 1. B, the library. C, Hall B."], [260.7, 262.6, "The answer is C: Hall B."], [263.75, 265.27, "Why was the room changed?"], [265.57, 270.55, "A, it is being repaired. B, it is too big. C, it is closed for a party."], [274.1, 276.74, "The answer is A: it is being repaired."], [277.88, 279.53, "Students should bring blank."], [279.83, 283.93, "A, money only. B, ID cards. C, tickets."], [287.47, 290.07, "The answer is B: ID cards."], [291.22, 292.76, "Rescheduled means blank."], [293.06, 297.36, "A, cancelled. B, finished. C, changed the time."], [300.9, 303.06, "The answer is C: changed the time."], [304.22, 306.41, "Who is eligible for the library tour?"], [306.71, 311.25, "A, first-year students. B, all staff. C, no one."], [314.8, 317.57, "The answer is A: first-year students."], [318.77, 321.92, "Part six: speaking. It's your turn to talk."], [322.78, 324.46, "How do you follow an announcement?"], [333.25, 335.11, "Now listen to Visal."], [335.41, 347.2, "I listen for what is happening, when and where it will take place, and who is affected. I write short notes with numbers and times. Then I listen for the action that listeners must take."], [347.5, 349.17, "Excellent answer, Visal!"], [350.05, 355.13, "Great work! Now you can use eight new words and strategy: what, when, where, who, action."], [355.43, 359.99, "Today's value is preparedness. Get ready before an emergency happens."], [360.29, 362.67, "See you in Unit nine. Goodbye!"], [362.97, 365.9, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit09-Listening-Academic-Talks": [[0.35, 5.11, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.41, 8.76, "Hi! I'm Visal. Let's learn together!"], [9.06, 15.86, "Unit nine: Listening: Academic Talks. Today you will follow a short lecture and understand its structure."], [16.16, 18.62, "Here is our lesson map. Let's start!"], [19.57, 22.65, "Part one: words. You will learn eight new words."], [23.48, 24.25, "Lecture."], [25.25, 27.68, "Lecture means a formal talk to students."], [28.28, 29.82, "Take notes in the lecture."], [30.42, 32.55, "Your turn. Say: Lecture."], [35.4, 36.46, "Lecture."], [37.22, 38.03, "Topic."], [39.02, 40.99, "Topic means the subject of a talk."], [41.58, 43.47, "The topic is climate change."], [44.08, 46.74, "Your turn. Say: Topic."], [49.6, 50.47, "Topic."], [51.22, 52.23, "Signpost."], [53.22, 56.16, "Signpost means a phrase that shows structure."], [56.75, 58.37, "Firstly is a signpost."], [58.95, 61.71, "Your turn. Say: Signpost."], [64.57, 65.73, "Signpost."], [66.48, 67.53, "Illustrate."], [68.52, 71.14, "Illustrate means to explain with an example."], [71.75, 73.87, "The professor illustrates the point."], [74.45, 76.92, "Your turn. Say: Illustrate."], [79.77, 80.77, "Illustrate."], [81.52, 82.34, "Theory."], [83.35, 86.06, "Theory means an idea that explains something."], [86.65, 88.44, "Darwin's theory of evolution."], [89.05, 92.35, "Your turn. Say: Theory."], [95.2, 95.96, "Theory."], [96.72, 97.69, "Evidence."], [98.68, 101.38, "Evidence means facts that support an idea."], [101.98, 103.59, "She presents evidence."], [104.18, 106.52, "Your turn. Say: Evidence."], [109.37, 110.39, "Evidence."], [111.15, 112.36, "Counterargument."], [113.35, 115.9, "Counterargument means a point against an idea."], [116.48, 118.42, "He mentions a counterargument."], [119.02, 121.75, "Your turn. Say: Counterargument."], [124.6, 125.88, "Counterargument."], [126.62, 127.58, "Summary."], [128.58, 131.25, "Summary means a short version of the main points."], [131.85, 133.55, "The lecture ends with a summary."], [134.15, 136.74, "Your turn. Say: Summary."], [139.6, 140.53, "Summary."], [141.33, 145.45, "Part two: dialogue. Let's listen to a conversation."], [146.28, 148.5, "Visal, what is an academic talk?"], [149.62, 163.73, "It is a short lecture, or a talk by a professor, about a topic such as biology, history or art. Questions ask about the main idea, details and how the talk is organised."], [164.82, 166.69, "How do I follow the structure?"], [167.78, 178.55, "Listen for signposts like first, for example, however and in summary. They show when the speaker adds an example, changes direction or concludes."], [179.65, 181.19, "How should I take notes?"], [182.28, 190.62, "Write the topic, then main points and examples in short words. Do not write full sentences, because you will miss the next point."], [191.77, 193.19, "Part three: grammar."], [194.05, 198.07, "Grammar focus: Strategy: topic, points, examples."], [198.37, 199.49, "Look at the pattern."], [200.18, 202.91, "However signals a change of direction in the talk."], [203.82, 206.54, "For example introduces evidence for the point."], [207.5, 214.17, "Identify the topic, follow the signposts, and note the main points and examples. Do not write full sentences."], [214.92, 218.27, "Be careful! Don't say: I miss however in a talk."], [220.2, 222.83, "Say: I catch however as a signpost."], [223.13, 224.51, "Signposts matter."], [225.3, 227.96, "Part four: reading. Read and listen."], [228.77, 230.84, "A Lecture on Coral Reefs."], [231.14, 234.44, "The professor introduces coral reefs as a rich habitat."], [235.43, 238.3, "Firstly, she explains how corals build reefs."], [239.3, 241.5, "However, warm water causes bleaching."], [242.5, 246.16, "For example, a large reef lost half its coral in one summer."], [247.17, 250.38, "She summarises that protection requires global action."], [251.5, 255.59, "Part five: quiz. Five questions. Are you ready?"], [256.45, 258.07, "Signposts show blank."], [258.37, 261.81, "A, structure. B, spelling. C, maps."], [265.37, 267.42, "The answer is A: structure."], [268.58, 270.63, "However usually signals blank."], [270.93, 275.95, "A, a name. B, a change of direction. C, a conclusion only."], [279.5, 281.99, "The answer is B: a change of direction."], [283.15, 285.61, "The professor illustrates a point with blank."], [285.91, 289.86, "A, a poem. B, a song. C, an example."], [293.4, 295.64, "The answer is C: an example."], [296.78, 298.23, "What causes bleaching?"], [298.53, 303.01, "A, warm water. B, cold rain. C, new roads."], [306.57, 308.8, "The answer is A: warm water."], [309.95, 311.58, "Notes should use blank."], [311.88, 316.37, "A, no words. B, short words. C, full sentences."], [319.93, 322.33, "The answer is B: short words."], [323.53, 326.73, "Part six: speaking. It's your turn to talk."], [327.58, 330.07, "How do you take notes in an academic talk?"], [338.88, 340.27, "Now listen to Visal."], [340.57, 353.59, "I write the topic at the top and then note the main points and examples in short words. I listen for signposts like however and for example to follow the structure. At the end I write the summary point."], [353.89, 355.56, "Excellent answer, Visal!"], [356.45, 362.21, "Great work! Now you can use eight new words and strategy: topic, points, examples."], [362.51, 366.49, "Today's value is lifelong learning. Keep learning for as long as you live."], [366.79, 369.28, "See you in Unit ten. Goodbye!"], [369.58, 372.24, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit10-Listening-Note-taking-and-Inference": [[0.35, 4.98, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.28, 8.77, "Hi! I'm Visal. Let's learn together!"], [9.07, 16.53, "Unit ten: Listening: Note-taking and Inference. Today you will take efficient notes and infer meaning from tone and attitude."], [16.83, 19.4, "Here is our lesson map. Let's start!"], [20.33, 23.52, "Part one: words. You will learn eight new words."], [24.38, 25.61, "Abbreviation."], [26.62, 29.32, "Abbreviation means a short form of a word."], [29.92, 32.07, "Use an abbreviation like govt."], [32.68, 35.56, "Your turn. Say: Abbreviation."], [38.4, 39.66, "Abbreviation."], [40.42, 41.16, "Symbol."], [42.15, 44.65, "Symbol means a sign that stands for a word."], [45.25, 47.03, "Use an arrow as a symbol."], [47.62, 50.43, "Your turn. Say: Symbol."], [53.27, 54.16, "Symbol."], [54.92, 55.9, "Outline."], [56.88, 59.66, "Outline means a simple plan of main points."], [60.25, 61.9, "Make an outline of the talk."], [62.52, 65.03, "Your turn. Say: Outline."], [67.87, 68.89, "Outline."], [69.65, 70.58, "Attitude."], [71.58, 73.95, "Attitude means how a speaker feels."], [74.55, 76.93, "The speaker's attitude is positive."], [77.52, 80.3, "Your turn. Say: Attitude."], [83.13, 84.17, "Attitude."], [84.92, 86.21, "Sarcasm."], [87.22, 90.75, "Sarcasm means saying the opposite to be funny or critical."], [91.35, 93.15, "She spoke with sarcasm."], [93.75, 96.41, "Your turn. Say: Sarcasm."], [99.27, 100.41, "Sarcasm."], [101.15, 102.15, "Hesitate."], [103.15, 105.5, "Hesitate means to pause because of doubt."], [106.08, 108.04, "He hesitated before answering."], [108.65, 111.29, "Your turn. Say: Hesitate."], [114.13, 115.01, "Hesitate."], [115.75, 116.89, "Emphasis."], [117.88, 120.67, "Emphasis means extra stress on a word."], [121.28, 123.36, "The speaker puts emphasis on 'never'."], [123.95, 126.6, "Your turn. Say: Emphasis."], [129.47, 130.64, "Emphasis."], [131.38, 132.37, "Implied."], [133.38, 135.88, "Implied means suggested but not stated."], [136.48, 138.53, "The implied meaning is a criticism."], [139.12, 141.62, "Your turn. Say: Implied."], [144.47, 145.48, "Implied."], [146.27, 149.99, "Part two: dialogue. Let's listen to a conversation."], [150.85, 153.34, "Visal, how can I take notes faster?"], [154.45, 167.4, "Use abbreviations and symbols. For example, write govt for government and an arrow for causes. Notes should be short enough to read in a few seconds."], [168.52, 169.92, "Why does tone matter?"], [171.02, 182.68, "Some questions ask about the speaker's attitude or what the speaker really means. A pause, a rising voice or an emphasised word can show doubt, surprise or sarcasm."], [183.78, 185.79, "What should I do with an inference question?"], [186.88, 197.42, "Combine your notes with the tone you heard. Choose the option that matches both the words and the feeling, and avoid answers that need extra information."], [198.57, 200.07, "Part three: grammar."], [200.92, 205.09, "Grammar focus: Strategy: short notes, careful tone."], [205.39, 206.61, "Look at the pattern."], [207.32, 211.05, "I write 'govt → tax' for the government causes a tax change."], [211.95, 215.17, "She hesitated, so she probably doubts the idea."], [216.13, 221.63, "Use abbreviations and symbols in notes. For inference, combine what is said with how it is said."], [222.38, 225.75, "Be careful! Don't say: I ignore the speaker's tone."], [227.7, 230.4, "Say: I listen to the tone as well."], [230.7, 231.98, "Tone shows meaning."], [232.77, 235.34, "Part four: reading. Read and listen."], [236.13, 237.77, "Understanding Attitude."], [238.07, 241.47, "A professor says, Well, that plan is certainly ambitious."], [242.47, 244.72, "She pauses before the word ambitious."], [245.73, 248.42, "The class understands that she may doubt the plan."], [249.43, 252.7, "A student writes govt, plan, doubt in her notes."], [253.7, 256.58, "She chooses the answer that matches the professor's tone."], [257.67, 261.87, "Part five: quiz. Five questions. Are you ready?"], [262.72, 264.81, "Abbreviations make notes blank."], [265.11, 268.72, "A, harder to read. B, faster. C, longer."], [272.27, 274.13, "The answer is B: faster."], [275.28, 277.62, "A pause before a word can show blank."], [277.92, 281.28, "A, a date. B, a place. C, doubt."], [284.83, 286.93, "The answer is C: doubt."], [288.08, 289.95, "An implied meaning is blank."], [290.25, 295.41, "A, suggested, not stated. B, spelled out. C, a number."], [298.97, 301.91, "The answer is A: suggested, not stated."], [303.05, 305.32, "What does the professor think of the plan?"], [305.62, 309.71, "A, she ignores it. B, she doubts it. C, she loves it."], [313.27, 315.57, "The answer is B: she doubts it."], [316.72, 318.41, "Which symbol means 'causes'?"], [318.71, 322.6, "A, a circle. B, a star. C, an arrow."], [326.13, 327.92, "The answer is C: an arrow."], [329.13, 332.3, "Part six: speaking. It's your turn to talk."], [333.15, 335.54, "How do you take notes and understand attitude?"], [344.35, 345.86, "Now listen to Visal."], [346.16, 361.47, "I use abbreviations and symbols to write short notes. I listen for pauses and stressed words because they show how the speaker feels. For an inference question, I choose the option that matches both the words and the tone."], [361.77, 363.56, "Excellent answer, Visal!"], [364.45, 369.84, "Great work! Now you can use eight new words and strategy: short notes, careful tone."], [370.14, 374.4, "Today's value is reflection. Think about what you learned and how you grew."], [374.7, 377.23, "See you in Unit eleven. Goodbye!"], [377.53, 380.23, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit11-Writing-Build-a-Sentence": [[0.35, 5.33, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.63, 8.82, "Hi! I'm Visal. Let's learn together!"], [9.12, 16.67, "Unit eleven: Writing: Build a Sentence. Today you will arrange scrambled words into a correct, natural ], [150.62, 152.94, "Visal, what is Build a Sentence?"], [154.05, 163.27, "You see a short question or comment from a conversation and a set of scrambled words. You put the words in order to make a correct reply."], [164.38, 165.97, "What is the best strategy?"], [167.05, 178.6, "Look for the subject and verb first. Then add the object, time and place words. In questions, remember the order: question word, auxiliary, subject, main verb."], [179.68, 181.25, "What mistakes are common?"], [182.35, 192.05, "Students forget articles and capital letters, or use the wrong word order in embedded questions, such as I don't know where she is, not where is she."], [193.2, 194.82, "Part three: grammar."], [195.65, 200.51, "Grammar focus: Strategy: subject, verb, object, extra details."], [200.81, 202.02, "Look at the pattern."], [202.72, 204.65, "She asked where the library was."], [205.55, 207.26, "Where did you put the keys?"], [208.2, 215.49, "Find the subject and the verb, then build the rest in the usual English order. In questions, use the auxiliary before the subject."], [216.25, 220.31, "Be careful! Don't say: I put the verb before the subject."], [222.27, 224.62, "Say: I put the subject before the verb."], [224.91, 226.52, "Subject, then verb."], [227.33, 230.0, "Part four: reading. Read and listen."], [230.8, 232.22, "Putting Words in Order."], [232.52, 235.13, "The prompt asks: Did you finish the report?"], [236.13, 239.07, "The scrambled words are finished, I, it, yesterday."], [240.07, 242.03, "Kanha puts I first as the subject."], [243.03, 246.32, "Then she adds finished it, and yesterday goes last."], [247.33, 249.54, "The answer is I finished it yesterday."], [250.63, 254.81, "Part five: quiz. Five questions. Are you ready?"], [255.65, 257.19, "The usual order is blank."], [257.49, 263.46, "A, object, subject, verb. B, verb, subject, object. C, subject, verb, object."], [267.0, 269.67, "The answer is C: subject, verb, object."], [270.82, 273.43, "In a question, the auxiliary comes blank."], [273.73, 278.35, "A, before the subject. B, after the object. C, at the end."], [281.9, 284.36, "The answer is A: before the subject."], [285.52, 286.67, "Which is correct?"], [286.97, 292.29, "A, I don't where she is know.. B, I don't know where she is.. C, I don't know where is she.."], [295.83, 298.46, "The answer is B: I don't know where she is.."], [299.62, 301.28, "What is Kanha's answer?"], [301.58, 307.46, "A, Finished I yesterday it.. B, Yesterday it I finished.. C, I finished it yesterday.."], [311.0, 313.81, "The answer is C: I finished it yesterday.."], [314.95, 316.76, "Which marks should you not forget?"], [317.06, 321.04, "A, capital letters. B, emoji. C, drawings."], [324.6, 326.91, "The answer is A: capital letters."], [328.1, 331.51, "Part six: speaking. It's your turn to talk."], [332.35, 334.88, "How do you build a sentence from scrambled words?"], [343.68, 345.21, "Now listen to Visal."], [345.51, 361.43, "I find the subject and the verb first, because they form the core of the sentence. Then I add the object and the details of time and place. I check word order, especially in questions, and I add the correct punctuation."], [361.73, 363.36, "Excellent answer, Visal!"], [364.25, 370.63, "Great work! Now you can use eight new words and strategy: subject, verb, object, extra details."], [370.93, 375.78, "Today's value is logical rigor. Follow your reasoning wherever it honestly leads."], [376.08, 378.65, "See you in Unit twelve. Goodbye!"], [378.95, 382.23, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit12-Writing-Write-an-Email": [[0.35, 4.97, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.27, 8.77, "Hi! I'm Visal. Let's learn together!"], [9.07, 16.64, "Unit twelve: Writing: Write an Email. Today you will write a clear, appropriate email that completes the task."], [16.95, 19.73, "Here is our lesson map. Let's start!"], [20.67, 23.71, "Part one: words. You will learn eight new words."], [24.55, 25.84, "Subject line."], [26.85, 29.7, "Subject line means the short title of an email."], [30.28, 32.07, "Write a clear subject line."], [32.68, 35.48, "Your turn. Say: Subject line."], [38.33, 39.73, "Subject line."], [40.48, 41.3, "Greeting."], [42.28, 44.71, "Greeting means the opening words of an email."], [45.32, 47.2, "Dear Professor Lee is a greeting."], [47.82, 50.2, "Your turn. Say: Greeting."], [53.07, 53.93, "Greeting."], [54.68, 55.59, "Request."], [56.58, 58.73, "Request means asking for something."], [59.35, 60.92, "Make a polite request."], [61.52, 64.4, "Your turn. Say: Request."], [67.27, 68.34, "Request."], [69.08, 70.12, "Explain."], [71.12, 73.63, "Explain means to give reasons or details."], [74.22, 75.65, "Explain your problem."], [76.25, 78.87, "Your turn. Say: Explain."], [81.73, 82.94, "Explain."], [83.68, 84.45, "Closing."], [85.45, 87.91, "Closing means the polite ending of an email."], [88.52, 90.17, "Best regards is a closing."], [90.78, 93.39, "Your turn. Say: Closing."], [96.23, 97.07, "Closing."], [97.82, 98.93, "Appreciate."], [99.95, 102.36, "Appreciate means to be thankful for."], [102.95, 104.75, "I would appreciate your help."], [105.35, 107.89, "Your turn. Say: Appreciate."], [110.73, 111.84, "Appreciate."], [112.58, 113.75, "Apologise."], [114.75, 117.12, "Apologise means to say you are sorry."], [117.72, 119.76, "I apologise for the delay."], [120.35, 123.54, "Your turn. Say: Apologise."], [126.4, 127.63, "Apologise."], [128.38, 129.15, "Task."], [130.15, 132.64, "Task means what the prompt asks you to do."], [133.25, 135.32, "Complete every part of the task."], [135.92, 138.47, "Your turn. Say: Task."], [141.3, 142.24, "Task."], [143.03, 146.86, "Part two: dialogue. Let's listen to a conversation."], [147.72, 150.44, "Visal, what do you write in the Email task?"], [151.55, 161.6, "You read a situation and write an email in about seven minutes. The prompt tells you who to write to, what happened and what you need .18, 282.68, "Which phrase is polite?"], [282.98, 287.96, "A, Give me the notes.. B, Send it now.. C, I would appreciate your help.."], [291.5, 294.49, "The answer is C: I would appreciate your help.."], [295.65, 297.73, "Why did the student miss class?"], [298.03, 302.15, "A, he was ill. B, he was late. C, he had a party."], [305.7, 308.01, "The answer is A: he was ill."], [309.15, 310.58, "You should cover blank."], [310.88, 315.57, "A, no points. B, every point in the prompt. C, only one point."], [319.13, 322.01, "The answer is B: every point in the prompt."], [323.2, 326.68, "Part six: speaking. It's your turn to talk."], [327.52, 329.62, "How do you write a good email in the test?"], [338.42, 339.85, "Now listen to Visal."], [340.15, 354.1, "I read the prompt and underline everything I must include. I start with a greeting and my reason for writing, then give the details and make a polite request. I finish with a closing and check my grammar before the time ends."], [354.4, 356.12, "Excellent answer, Visal!"], [357.02, 362.44, "Great work! Now you can use eight new words and strategy: greeting, purpose, details, closing."], [362.74, 367.07, "Today's value is communication. Speak clearly and listen carefully."], [367.37, 370.19, "See you in Unit thirteen. Goodbye!"], [370.49, 373.86, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit13-Writing-Email-Register-and-Common-Fixes": [[0.35, 5.11, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.41, 9.27, "Hi! I'm Visal. Let's learn together!"], [9.57, 17.5, "Unit thirteen: Writing: Email Register and Common Fixes. Today you will choose formal or informal language and correct frequent errors."], [17.8, 20.46, "Here is our lesson map. Let's start!"], [21.4, 24.66, "Part one: words. You will learn eight new words."], [25.52, 26.37, "Register."], [27.38, 30.02, "Register means the level of formality in language."], [30.62, 32.15, "Choose the right register."], [32.75, 35.23, "Your turn. Say: if you could help is polite and soft, and thank you in advance is a clear closing."], [176.92, 178.95, "What errors should I fix at the end?"], [180.05, 189.81, "Check subject-verb agreement, tense, articles and spelling. Cut repeated words, and make sure each sentence is concise and clear."], [190.97, 192.64, "Part three: grammar."], [193.48, 198.04, "Grammar focus: Strategy: match the register, then proofread."], [198.34, 199.49, "Look at the pattern."], [200.18, 202.61, "Could you please send me the notes from last week?"], [203.52, 205.75, "I was wondering if you could give me more time."], [206.7, 212.7, "Choose the register for the reader, use polite modals in requests, and proofread for agreement, tense and spelling."], [213.45, 217.3, "Be careful! Don't say: I write 'Send me the notes now.'"], [219.27, 221.62, "Say: I write 'Could you send the notes?'"], [221.92, 223.37, "Use polite modals."], [224.17, 226.75, "Part four: reading. Read and listen."], [227.53, 228.86, "Fixing an Email."], [229.16, 232.75, "Sreyneang writes to her manager, Send me the schedule now."], [233.73, 236.1, "Her teacher says the tone is too direct."], [237.1, 240.71, "She changes it to, Could you please send me the schedule?"], [241.7, 245.02, "She also removes contractions and checks the verb tense."], [246.03, 248.91, "Her second draft is polite, concise and clear."], [250.0, 254.16, "Part five: quiz. Five questions. Are you ready?"], [255.02, 257.03, "A formal email avoids blank."], [257.33, 261.54, "A, closings. B, contractions. C, greetings."], [265.1, 267.25, "The answer is B: contractions."], [268.42, 269.79, "Which is more polite?"], [270.09, 274.75, "A, Help me now.. B, I need help.. C, Could you please help me?."], [278.3, 280.92, "The answer is C: Could you please help me?."], [282.05, 283.69, "To proofread is to blank."], [283.99, 288.43, "A, check for mistakes. B, write longer. C, translate."], [291.97, 294.48, "The answer is A: check for mistakes."], [295.62, 297.79, "Why did the teacher change the sentence?"], [298.09, 302.71, "A, it had no verb. B, it was too direct. C, it was too long."], [306.27, 308.89, "The answer is B: it was too direct."], [310.05, 311.48, "A good email is blank."], [311.78, 315.93, "A, very long. B, angry. C, concise and clear."], [319.47, 322.55, "The answer is C: concise and clear."], [323.73, 327.12, "Part six: speaking. It's your turn to talk."], [327.98, 330.12, "How do you make an email polite and correct?"], [338.92, 340.39, "Now listen to Visal."], [340.69, 356.29, "I choose the register for my reader, so I use formal language for a professor or manager. I use polite modals like could and would in my requests. Before I finish, I proofread for grammar, spelling and unnecessary words."], [356.59, 358.38, "Excellent answer, Visal!"], [359.28, 365.06, "Great work! Now you can use eight new words and strategy: match the register, then proofread."], [365.36, 369.97, "Today's value is good manners. Say please and thank you, and be polite to everyone."], [370.27, 373.01, "See you in Unit fourteen. Goodbye!"], [373.31, 376.2, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit14-Writing-Academic-Discussion-Post": [[0.35, 5.27, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.57, 9.04, "Hi! I'm Visal. Let's learn together!"], [9.34, 17.74, "Unit fourteen: Writing: Academic Discussion Post. Today you will contribute a clear, supported opinion to an online class discussion."], [18.04, 20.72, "Here is our lesson map. Let's start!"], [21.67, 24.73, "Part one: words. You will learn eight new words."], [25.58, 26.96, "Discussion board."], [27.95, 31.39, "Discussion board means an online space for class comments."], [31.98, 33.72, "Post on the discussion board."], [34.32, 37.9, "Your turn. Say: Discussion board."], [40.73, 42.15, "Discussion board."], [42.92, 43.84, "Contribute."], [44.85, 47.92, "Contribute means to add your ideas to a conversation."], [48.52, 50.23, "Contribute a new rds. Quality matters more than length, so stay on topic and use clear, accurate sentences."], [193.17, 195.06, "Part three: grammar."], [195.92, 199.98, "Grammar focus: Strategy: position, reason, example."], [200.28, 201.5, "Look at the pattern."], [202.22, 206.25, "I agree with Kim that remote classes are useful, because they save time."], [207.15, 210.15, "For example, I can review the recorded lesson at night."], [211.1, 219.37, "Read the question and both replies. State your position, support it with a reason and an example, and connect your idea to what a classmate said."], [220.12, 224.65, "Be careful! Don't say: I only copy a classmate's idea."], [226.6, 229.61, "Say: I give my own reason and example."], [229.91, 231.36, "Support your position."], [232.17, 235.03, "Part four: reading. Read and listen."], [235.83, 237.66, "Online or On Campus."], [237.96, 241.74, "The professor asks if classes should be online or on campus."], [242.73, 245.53, "One student says online classes save time."], [246.53, 249.57, "Another says on-campus classes help friendships."], [250.57, 253.77, "Maly agrees with the first student and adds a new reason."], [254.77, 258.47, "She writes that recorded lessons help her review before exams."], [259.57, 263.8, "Part five: quiz. Five questions. Are you ready?"], [264.65, 267.67, "An Academic Discussion post should start with blank."], [267.97, 271.99, "A, a goodbye. B, a list of numbers. C, your position."], [275.53, 277.9, "The answer is C: your position."], [279.05, 280.1, "You should blank."], [280.4, 285.63, "A, support your idea. B, copy a classmate. C, write nothing."], [289.17, 291.56, "The answer is A: support your idea."], [292.72, 294.5, "About how long is a good post?"], [294.8, 300.7, "A, 1000 words. B, 100 to 120 words. C, 10 words."], [304.27, 308.07, "The answer is B: 100 to 120 words."], [309.22, 311.17, "What new reason does Maly add?"], [311.47, 317.07, "A, classes are free. B, teachers are kind. C, recorded lessons help review."], [320.63, 323.38, "The answer is C: recorded lessons help review."], [324.52, 326.04, "The post must be blank."], [326.34, 330.82, "A, relevant. B, off-topic. C, a poem."], [334.37, 336.23, "The answer is A: relevant."], [337.43, 340.75, "Part six: speaking. It's your turn to talk."], [341.58, 344.11, "How do you write an academic discussion post?"], [352.92, 354.38, "Now listen to Visal."], [354.68, 368.67, "I read the professor's question and the two student replies. Then I state my position and give a reason with an example. I also mention a classmate's idea so that my post joins the discussion."], [368.97, 370.65, "Excellent answer, Visal!"], [371.55, 377.63, "Great work! Now you can use eight new words and strategy: position, reason, example."], [377.93, 382.74, "Today's value is respectful disagreement. Disagree politely and listen to others."], [383.04, 385.84, "See you in Unit fifteen. Goodbye!"], [386.14, 389.39, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit15-Writing-Adding-New-Ideas-and-Linking": [[0.35, 5.2, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.5, 8.9, "Hi! I'm Visal. Let's learn together!"], [9.2, 18.01, "Unit fifteen: Writing: Adding New Ideas and Linking. Today you will add a new idea, link your sentences and avoid repeating classmates."], [18.31, 20.98, "Here is our lesson map. Let's start!"], [21.93, 25.22, "Part one: words. You will learn eight new words."], [26.08, 27.23, "New idea."], [28.25, 31.12, "New idea means a point nobody else has made."], [31.72, 33.1, "Add a new idea."], [33.72, 36.2, "Your turn. Say: New idea."], [39.03, 40.05, "New idea."], [40.78, 41.78, "Build on."], [42.78, 45.47, "Build on means to develop another person's idea."], [46.08, 48.26, "I want to build on Sam's idea."], [48.85, 51.1, "Your turn. Say: Build on."], [53.93, 54.84, "Build on."], [55.58, 56.52, "Disagree."], [57.52, 59.7, "Disagree means to have a different opinion."], [60.32, 62.12, "I disagree with ety."], [200.16, 201.27, "Look at the pattern."], [201.98, 207.09, "I want to build on Sam's idea: furthermore, online study reduces travel costs."], [207.98, 212.47, "In contrast, campus classes give students more social contact."], [213.43, 221.24, "Add a point that is new, link your ideas with a few accurate connectors, and vary your sentences. Avoid copying and off-topic comments."], [221.98, 225.62, "Be careful! Don't say: I repeat the same idea."], [227.57, 229.68, "Say: I add a new idea."], [229.98, 231.02, "Add something new."], [231.83, 234.46, "Part four: reading. Read and listen."], [235.27, 236.71, "A Stronger Reply."], [237.01, 240.29, "Chantha reads the two replies about online classes."], [241.3, 243.96, "She builds on Sam's idea about saving time."], [244.97, 248.27, "Furthermore, she adds that students save money on transport."], [249.27, 253.19, "In contrast, she admits that campus life offers more friendships."], [254.2, 257.12, "Therefore, she concludes that a mix of both is best."], [258.23, 262.29, "Part five: quiz. Five questions. Are you ready?"], [263.15, 265.17, "A new idea is a point blank."], [265.47, 270.04, "A, not yet mentioned. B, already copied. C, off-topic."], [273.6, 275.88, "The answer is A: not yet mentioned."], [277.02, 278.56, "'Furthermore' means blank."], [278.86, 282.3, "A, never. B, in addition. C, however."], [285.83, 287.82, "The answer is B: in addition."], [288.98, 290.31, "Which should you avoid?"], [290.61, 294.93, "A, connectors. B, examples. C, copying classmates."], [298.47, 301.2, "The answer is C: copying classmates."], [302.35, 303.95, "What does Chantha conclude?"], [304.25, 308.86, "A, a mix of both is best. B, online only. C, campus only."], [312.4, 315.39, "The answer is A: a mix of both is best."], [316.55, 318.0, "Good writing shows blank."], [318.3, 323.49, "A, no punctuation. B, sentence variety. C, one repeated sentence."], [327.03, 329.53, "The answer is B: sentence variety."], [330.73, 334.14, "Part  I do not add any words."], [355.69, 357.41, "Excellent answer, Visal!"], [358.32, 363.67, "Great work! Now you can use eight new words and strategy: listen in chunks, repeat in rhythm."], [363.97, 369.0, "Today's value is dedication. Practise a little every day, and you will get better."], [369.3, 372.04, "See you in Unit seventeen. Goodbye!"], [372.34, 375.64, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit17-Speaking-Take-an-Interview": [[0.35, 5.22, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.52, 9.57, "Hi! I'm Visal. Let's learn together!"], [9.87, 17.74, "Unit seventeen: Speaking: Take an Interview. Today you will answer interview questions fluently in about forty-five seconds."], [18.04, 20.51, "Here is our lesson map. Let's start!"], [21.47, 24.99, "Part one: words. You will learn eight new words."], [25.85, 26.85, "Interview."], [27.85, 30.95, "Interview means a set of questions asked by one person."], [31.55, 32.71, "Take the interview."], [33.32, 35.84, "Your turn. Say: Interview."], [38.7, 39.64, "Interview."], [40.38, 41.3, "Familiar."], [42.32, 44.06, "Familiar means well known to you."], [44.65, 46.37, "The questions are familiar."], [46.98, 49.36, "Your turn. Say: Familiar."], [52.2, 53.18, "Familiar."], [53.92, 54.67, "Fluent."], [55.68, 58.4, "Fluent means smooth and natural when speaking."], [59.02, 60.25, "Speak fluently."], [60.85, 63.21, "Your turn. Say: Fluent."], [66.07, 66.96, "Fluent."], [67.72, 68.62, "Develop."], [69.62, 71.94, "Develop means to explain in more detail."], [72.55, 74.64, "Develop your answer with an example."], [75.25, 77.76, "Your turn. Say: Develop."], [80.6, 81.44, "Develop."], [82.18, 83.01, "Reason."], [84.02, 86.38, "Reason means why you think or do something."], [86.98, 88.15, "Give a reason."], [88.75, 91.03, "Your turn. Say: Reason."], [93.87, 94.86, "Reason."], [95.62, 96.64, "Example."], [97.65, 101.25, "Example means a specific case that supports an idea."], [101.85, 103.09, tudy."], [235.0, 237.13, "He answers that he prefers the morning."], [238.13, 240.6, "He says he feels more focused and calm."], [241.6, 244.04, "He gives an example from the previous week."], [245.03, 247.66, "He finishes just before the timer ends."], [248.77, 252.78, "Part five: quiz. Five questions. Are you ready?"], [253.62, 255.88, "You get about blank seconds per answer."], [256.18, 260.38, "A, five. B, three hundred. C, forty-five."], [263.93, 266.33, "The answer is C: forty-five."], [267.48, 269.22, "Do you get preparation time?"], [269.52, 272.84, "A, no. B, ten minutes. C, one hour."], [276.4, 277.97, "The answer is A: no."], [279.12, 281.77, "A good pattern is answer, reason and blank."], [282.07, 286.92, "A, question. B, example. C, apology."], [290.47, 292.36, "The answer is B: example."], [293.52, 295.68, "When does Piseth prefer to study?"], [295.98, 299.47, "A, at night. B, never. C, in the morning."], [303.03, 305.26, "The answer is C: in the morning."], [306.42, 307.8, "What is a real problem?"], [308.1, 313.08, "A, long silence. B, a quick self-correction. C, a short pause."], [316.63, 319.4, "The answer is A: long silence."], [320.6, 323.81, "Part six: speaking. It's your turn to talk."], [324.65, 327.96, "How do you answer an interview question in forty-five seconds?"], [336.75, 338.37, "Now listen to Visal."], [338.67, 352.13, "I answer the question in my first sentence. Then I give a reason and an example, which usually fills about forty-five seconds. If I make a mistake, I correct it quickly and keep speaking."], [352.43, 354.58, "Excellent answer, Visal!"], [355.48, 361.13, "Great work! Now you can use eight new words and strategy: answer, reason, example."], [361.43, 365.37, "Today's value is confidence. Speak up and be proud of who you are."], [365.67, 368.42, "See you in Unit eighteen. Goodbye!"], [368.72, 371.6, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit18-Speaking-Fluency-Pronunciation-and-Development": [[0.35, 5.25, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.55, 8.77, "Hi! I'm Visal. Let's learn together!"], [9.07, 17.7, "Unit eighteen: Speaking: Fluency, Pronunciation and Development. Today you will improve how smoothly, clearly and fully you speak."], [18.0, 20.76, "Here is our lesson map. Let's start!"], [21.7, 24.71, "Part one: words. You will learn eight new words."], [25.55, 26.56, "Fluency."], [27.55, 30.85, "Fluency means speaking smoothly without long pauses."], [31.45, 33.5, "Fluency improves with practice."], [34.08, 36.69, "Your turn. Say: Fluency."], [39.53, 40.51, "Fluency."], [41.25, 42.32, "Pronunciation."], [43.32, 46.3, "Pronunciation means the way you say sounds and words."], [46.92, 48.71, "Practise your pronunciation."], [49.32, 52.12, "Your turn. Say: Pronunciation."], [54.97, 56.42, "Pronunciation."], [57.18, 58.07, "Pace."], [59.08, 61.15, "Pace means the speed of your speech."], [61.75, 63.35, "Use a steady pace."], [63.95, 66.52, "Your turn. Say: Pace."], [69.37, 70.19, "Pace."], [70.95, 71.85, "Linking."], [72.85, 76.03, "Linking means joining words smoothly in speech."], [76.65, 78.44, "Linking makes speech natural."], [79.05, 81.33, "Your turn. Say: Linking."], [84.17, 85.04, "Linking."], [85.78, 86.49, "Vowel."], [87.48, 90.03, "Vowel means a sound like a, e, i, o, u."], [90.62, 92.14, "Practise the long vowel."], [92.75, 95.23, "Your turn. Say: Vowel."], [98.07, 98.92, "Vowel."], [99.68, 100.73, "Self-correct."], [101.72, 104.31, "Self-correct means to fix your own mistake."], [104.92, 106.5, "Self-correct quickly."], [107.08, 109.6, "Your turn. Say: Self-correct."], [112.43, 113.43, "Self-correct."], [114.18, 115.02, "Filler."], [116.02, 118.84, "Filler means a word like um that fills a pause."], [119.45, 121.4, "Avoid too many fillers."], [122.02, 124.36, "Your turn. Say: Filler."], [127.2, 128.13, "Filler."], [128.88, 129.71, "Record."], [130.72, 133.41, "Record means to save your voice to listen later."], [134.02, 135. h."], [289.35, 293.07, "A simple accurate word is better than a blank word used wrongly."], [293.37, 296.83, "A, difficult. B, short. C, common."], [300.4, 302.45, "The answer is A: difficult."], [303.58, 305.05, "'Sufficient' means blank."], [305.35, 308.81, "A, rare. B, enough. C, too much."], [312.37, 314.13, "The answer is B: enough."], [315.28, 316.8, "What does Reaksmey keep?"], [317.1, 320.48, "A, a map. B, a ticket. C, a notebook."], [324.03, 326.51, "The answer is C: a notebook."], [327.7, 330.99, "Part six: speaking. It's your turn to talk."], [331.85, 334.29, "How do you learn academic vocabulary?"], [343.08, 344.62, "Now listen to Visal."], [344.92, 357.7, "I write each word with its meaning, part of speech and an example sentence about my own life. I check collocations so that I use the word naturally. I review my notebook every week."], [358.0, 359.76, "Excellent answer, Visal!"], [360.65, 365.45, "Great work! Now you can use eight new words and strategy: meaning, form, use."], [365.75, 369.7, "Today's value is lifelong learning. Keep learning for as long as you live."], [370.0, 372.64, "See you in Unit twenty. Goodbye!"], [372.94, 375.44, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit20-Test-Day-Strategy-and-Review": [[0.35, 5.07, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.37, 9.19, "Hi! I'm Visal. Let's learn together!"], [9.49, 16.54, "Unit twenty: Test Day Strategy and Review. Today you will manage time, stress and every section on test day."], [16.84, 19.46, "Here is our lesson map. Let's start!"], [20.4, 23.5, "Part one: words. You will learn eight new words."], [24.35, 25.23, "Strategy."], [26.25, 28.76, "Strategy means a plan to reach a goal."], [29.35, 31.27, "Have a strategy for each section."], [31.88, 34.22, "Your turn. Say: Strategy."], [37.07, 38.22, "Strategy."], [38.98, 39.84, "Timing."], [40.85, 42.64, "Timing means how you use time."], [43.25, 44.55, "Practise your timing."], [45.15, 47.33, "Your turn. Say: Timing."], [50.17, 50.97, "Timing."], [51.72, 52.84, "Adaptive."], [53.85, 56.31, "Adaptive means changing to match your level."], [56.92, 58.36, "Reading is adaptive."], [58.95, 62.66, "Your turn. Say: Adaptive."], [65.5, 66.29, "Adaptive."], [67.05, 68.04, "Focus."], [69.05, 71.12, "Focus means to give full attention."], [71.72, 73.6, "Focus on the first questions."], [74.22, 76.8, "Your turn. Say: Focus."], [79.63, 80.6, "Focus."], [81.35, 82.06, "Calm."], [83.05, 85.03, "Calm means relaxed and not worried."], [85.62, 86.58, "Stay calm."], [87.18, 89.46, "Your turn. Say: Calm."], [92.3, 93.12, "Calm."], [93.85, 95.01, "Mock test."], [96.02, 99.03, "Mock test means a practice test like the real one."], [99.62, 101.0, "Take a mock test."], [101.62, 104.2, "Your turn. Say: Mock test."], [107.03, 108.3, "Mock test."], [109.05, 110.28, "Technical check."], [111.28, 113.74, "Technical check means a test of your equipment."], [114.35, 116.36, "Do a technical check first."], [116.95, 119.96, "Your turn. Say: Technical check."], [122.8, 124.06, "Technical check."], [124.82, 125.64, "Review."], [126.65, 128.14, "Review means to look at again."], [128.75, 130.13, "Review your mistakes."], [130.75, 133.48, "Your turn. Say: Review."], [136.33, 137.03, "Review."], [137.83, 141.62, "Part two: dialogue. Let's listen to a conversation."], [142.48, 145.35, "Visal, how should I prepare in the last week?"], [146.45, 157.7, "Take full timed practice tests, review your mistakes and sleep well. Do not learn many new things the night before, because rest helps your performance."], [158.82, 160.86, "What should I remember about each section?"], [161.95, 172.72, "In Reading and Listening be accurate from the start, because the test adapts. In Writing keep to the time limits, and in Speaking answer fully without long pauses."], [173.82, 175.22, "How do I stay calm?"], [176.32, 188.27, "Check your equipment early, breathe slowly and treat each task as a separate chance. If one answer goes badly, forget it and focus on the next task."], [189.43, 190.74, "Part three: grammar."], [191.58, 195.97, "Grammar focus: Strategy: prepare, focus, recover."], [196.28, 197.5, "Look at the pattern."], [198.18, 201.54, "I take a full mock test every week under real timing."], [202.45, 205.98, "If a task goes badly, I move on and focus on the next one."], [206.93, 214.5, "Practise under real timing, check your equipment, and stay calm. Treat each task as a new chance and do not worry about the last one."], [215.25, 218.8, "Be careful! Don't say: I study new topics all night."], [220.73, 222.68, "Say: I rest before the test."], [222.97, 224.06, "Sleep well."], [224.87, 227.55, "Part four: reading. Read and listen."], [228.37, 229.31, "Test Day."], [229.61, 232.53, "Channary does a technical check of her headphones in the morning."], [233.53, 236.45, "She starts the Reading section and answers carefully."], [237.47, 240.6, "One Listening question is difficult, so she moves on."], [241.6, 245.03, "In Speaking she answers every question without long pauses."], [246.03, 248.42, "She finishes the test calm and satisfied."], [249.5, 253.46, "Part five: quiz. Five questions. Are you ready?"], [254.32, 256.32, "Before the test you should do a blank."], [256.62, 260.77, "A, party. B, long trip. C, technical check."], [264.33, 266.75, "The answer is C: technical check."], [267.92, 270.56, "Adaptive sections need blank from the start."], [270.86, 274.86, "A, accuracy. B, guessing. C, silence."], [278.4, 280.37, "The answer is A: accuracy."], [281.52, 284.05, "If a task goes badly, you should blank."], [284.35, 287.89, "A, complain. B, move on. C, stop."], [291.43, 293.67, "The answer is B: move on."], [294.82, 296.96, "What helps performance the night before?"], [297.26, 301.19, "A, new topics. B, no sleep. C, rest."], [304.73, 306.79, "The answer is C: rest."], [307.95, 309.68, "How does Channary finish?"], [309.98, 313.86, "A, calm and satisfied. B, worried. C, angry."], [317.4, 319.93, "The answer is A: calm and satisfied."], [321.13, 324.4, "Part six: speaking. It's your turn to talk."], [325.25, 327.13, "What is your plan for test day?"], [335.95, 337.45, "Now listen to Visal."], [337.75, 350.78, "I will check my equipment early and arrive calm. In each section I will focus on the current task and manage my time. If something goes badly, I will move on and focus on the next question."], [351.08, 352.92, "Excellent answer, Visal!"], [353.82, 359.41, "Great work! Now you can use eight new words and strategy: prepare, focus, recover."], [359.71, 365.07, "Today's value is self-discipline. Control your habits, so your habits do not control you."], [365.38, 371.79, "Congratulations! You have finished Online TOEFL preparation. See you in Online TOEIC preparation!"], [372.09, 374.64, "Thank you, Ms. Emma! Bye, everyone!"]]};
        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        function renderContent() {
            let contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            stopVideo();                 // never leave a video playing in the background
            stopTalkTimer();             // ...or a Let's Talk timer running
            updateVideoTabBadge();
            // Always shows the real level and unit (it used to say "A1" on every level)
            document.getElementById('platform-info').textContent = `C2-EPE - ${gradeName(state.level)} (Unit ${state.unit}: ${unitData.title})`;
            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'learn') renderLearn(contentDiv, unitData);
            else if (state.tab === 'terms') renderTerms(contentDiv, unitData);
            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'think') renderThink(contentDiv, unitData);
            else if (state.tab === 'funfact') renderFunFact(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);
            else if (state.tab === 'spelling') renderSpelling(contentDiv, unitData);
            else if (state.tab === 'sentence') renderSentenceBuilding(contentDiv, unitData);
            else if (state.tab === 'summary') renderSummaryWriting(contentDiv, unitData);
            else if (state.tab === 'headline') renderHeadlineWriting(contentDiv, unitData);
            else if (state.tab === 'factopinion') renderFactOpinion(contentDiv, unitData);
            else if (state.tab === 'debate') renderDebateCorner(contentDiv, unitData);
            else if (state.tab === 'discussion') renderDiscussion(contentDiv, unitData);
            else if (state.tab === 'dictation') renderDictation(contentDiv, unitData);
            else if (state.tab === 'review') renderReview(contentDiv, unitData);
            else if (state.tab === 'pronunciation') renderPronunciationDrill(contentDiv, unitData);
            else if (state.tab === 'exam') renderExamPractice(contentDiv, unitData);
            else if (state.tab === 'challenge') renderGoal(contentDiv, unitData);
            else if (state.tab === 'codelab') renderCodeLab(contentDiv, unitData);
        }

        // ===== MY PROGRESS =====
        const ALL_TABS = ['video','learn','terms','quiz','think','funfact','vocabgame','spelling','sentence','summary','headline','factopinion','debate','discussion','dictation','review','pronunciation','exam','challenge'];
        function markActivityComplete(tab) {
            progress.completed = progress.completed || {};
            const key = state.level + '_' + state.unit + '_' + tab;

        function textCheck(msg, text, need, okText, key, amount) {

        function usedUnitWords(text, unitData) {
            const t = ' ' + String(text).toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').replace(/\s+/g, ' ') + ' ';

                const base = w.toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').trim();
                if (!base) return false;
                // whole word, allowing simple endings: s, es, ed, ing
                const re = new RegExp('[ ]' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[ ]') + '(s|es|ed|d|ing)?[ ]');

        // ===== 9. SENTENCE BUILDING (reorder scrambled words from the story) =====
        let sentenceState = { correctOrder: [], current: [], picked: [], target: '', done: false };

        function renderSentenceBuilding(contentDiv, unitData) {
            const sentences = storySentences(unitData, 3);
