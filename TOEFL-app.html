<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>C2-EPE Digital Academy - TOEFL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Key Terms: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-5xl bg-slate-800 text-white rounded-2xl p-6 shadow-lg mb-6 flex justify-between items-center flex-wrap gap-3">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">🌎 C2-EPE TOEFL</h1>
            <p class="text-sm text-slate-300">TOEFL - Online Class</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap justify-end">
            <div class="bg-amber-400 text-slate-900 px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                ⭐ <span id="star-count">0</span>
            </div>
            <div class="bg-pink-500 text-white px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                🏆 <span id="badge-count">0</span> Badges
            </div>
            <button onclick="showMyProgress()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-sm font-bold border border-white/20 cursor-pointer">📊 My Progress</button>
            <div class="bg-slate-700 px-3 py-2 rounded-xl text-sm font-bold border border-red-500">
                <span id="current-level-display">A1</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-4 gap-6">

        <aside id="module-sidebar" class="bg-white rounded-2xl p-4 shadow-md md:col-span-1 flex flex-col gap-3" style="scroll-margin-top:12px;">
            <div id="level-picker-wrap">
                <h2 class="font-bold text-gray-700 border-b pb-2">Grade</h2>
                <div class="flex flex-col gap-3 mt-3">
                    <button onclick="selectLevel('A1')" id="btn-A1" class="level-btn text-left p-3 rounded-xl bg-slate-700 text-white font-semibold transition shadow cursor-pointer">🌱 A1 Grammar</button>
                    <button onclick="selectLevel('A2')" id="btn-A2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📗 A2 Grammar</button>
                    <button onclick="selectLevel('B1')" id="btn-B1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📘 B1 Grammar</button>
                    <button onclick="selectLevel('B2')" id="btn-B2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📙 B2 Grammar</button>
                    <button onclick="selectLevel('C1')" id="btn-C1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🎓 C1 Grammar</button>
                    <button onclick="selectLevel('C2')" id="btn-C2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">👑 C2 Grammar</button>
                </div>
            </div>
            <div id="locked-level-banner" class="hidden bg-slate-50 border border-red-200 rounded-xl p-3 text-center">
                <p class="text-xs text-red-600 font-semibold">TOPIC</p>
                <p id="locked-level-text" class="text-xl font-bold text-slate-900"></p>
            </div>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700" id="unit-select-label">Select Unit (1 to 25)</h2>
            <select id="unit-select" onchange="updateUnit()" class="p-2 rounded-xl border border-gray-300 bg-gray-50 font-semibold text-slate-900">
                <option value="1">Loading...</option>
            </select>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700">Learning Modules</h2>
            <button onclick="switchTab('video')" data-tab="video" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📹 0. Video Lesson</button>
            <button onclick="switchTab('learn')" data-tab="learn" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📖 1. Learn</button>
            <button onclick="switchTab('terms')" data-tab="terms" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗂️ 2. Key Terms</button>
            <button onclick="switchTab('quiz')" data-tab="quiz" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🧩 3. Quiz</button>
            <button onclick="switchTab('think')" data-tab="think" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💭 4. Think About It</button>

            <button onclick="switchTab('spelling')" data-tab="spelling" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✏️ 7. Spelling</button>

            <button onclick="switchTab('summary')" data-tab="summary" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📝 9. Summary Writing</button>
            <button onclick="switchTab('headline')" data-tab="headline" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📰 10. Headline Writing</button>
            <button onclick="switchTab('factopinion')" data-tab="factopinion" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔍 11. Fact vs Opinion</button>
            <button onclick="switchTab('debate')" data-tab="debate" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗣️ 12. Debate Corner</button>
            <button onclick="switchTab('discussion')" data-tab="discussion" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💭 13. Discussion</button>
            <button onclick="switchTab('dictation')" data-tab="dictation" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎧 14. Dictation</button>

        <section id="content-area" class="bg-white rounded-2xl p-6 shadow-md md:col-span-3 flex flex-col justify-between" style="scroll-margin-top:12px;">

                <div class="flex gap-2">
                    <button onclick="completeActivity()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Finish Activity (+5 ⭐)</button>
                    <button onclick="nextLesson()" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Next Lesson ▶️</button>

        const curriculum = {"A1": {"1": {"title": "TOEFL iBT Overview and Scores", "terms": ["Section", "Adaptive", "Band", "Scale", "Task", "Average", "CEFR", "Requirement"], "passage": "Sophea wants to apply to a university abroad. The university asks for an overall band of 5.0. She learns that Reading and Listening are adaptive. So she practises accuracy from the very first question. She plans time for all four sections each week.", "question": "What score do you need for TOEFL, and why?", "funfact": "Did you know? Check what your university requires, then study every section. Because Reading and Listening are adaptive, accuracy early in each section matters."}, "2": {"title": "Reading: Complete the Words", "terms": ["Context", "Prefix", "Suffix", "Missing", "Spelling", "Part of speech", "Logical", "Skim"], "passage": "The paragraph is about how plants grow in dry areas. Some words have only the first half written. Ravy decides that the first missing word must be a noun. She uses the letters she can see to choose the right word. She checks the spelling of each completed word.", "question": "How do you complete missing letters in a word?", "funfact": "Did you know? Read the whole paragraph first, then use the topic, the grammar and the visible letters to complete each word. Always check spelling."}, "3": {"title": "Reading: Read in Daily Life", "terms": ["Notice", "Email", "Infer", "Purpose", "Deadline", "Detail", "Reply", "Schedule"], "passage": "A notice tells students that the language club will move to Room 12. It says the club meets every Tuesday at four. It asks students to reply by Friday. It also says the old room was too small. Students can infer that the club is popular.", "question": "How do you answer questions about an email or notice?", "funfact": "Did you know? Identify the purpose of the text, scan for details with keywords, and use clues to infer ideas that are not stated directly."}, "4": {"title": "Reading: Academic Passage Main Idea and Details", "terms": ["Main idea", "Supporting detail", "Passage", "Organisation", "Cause and effect", "Contrast", "Sequence", "Not mentioned"], "passage": "The passage explains why honeybees are important to farms. The first paragraph gives the main idea: bees help plants produce fruit. Later paragraphs describe how pollination works and why bee numbers are falling. The last paragraph contrasts small farms with large industrial farms. A question asks for the cause of the falling numbers.", "question": "How do you find the main idea of a passage?", "funfact": "Did you know? Skim for the structure, then read closely only where the question points. Eliminate options that are not mentioned or only partly true."}, "5": {"title": "Reading: Vocabulary in Context and Inference", "terms": ["Context clue", "Synonym", "Antonym", "Imply", "Conclude", "Tone", "Reference", "Evidence"], "passage": "The passage says fresh water is scarce in some regions. The next sentence says it is hard to find and costly to transport. From this, a reader can work out that scarce means rare. The writer implies that local communities need new solutions. The word they in the last sentence refers to the communities.", "question": "How do you work out the meaning of a new word?", "funfact": "Did you know? Use context clues to guess meanings, and replace the word with your answer to test it. For inference, choose the option that the evidence supports."}, "6": {"title": "Listening: Listen and Choose a Response", "terms": ["Response", "Appropriate", "Polite", "Request", "Offer", "Suggestion", "Literal", "Intention"], "passage": "A student hears: Would you mind closing the window? She predicts that a polite answer will agree or explain. One option says: The window is very big. Another option says: Sure, I will close it now. She chooses the reply that matches the request.", "question": "How do you choose the best response?", "funfact": "Did you know? Decide what the speaker wants to do, predict a natural reply, and choose the option that fits. Avoid options that only repeat words."}, "7": {"title": "Listening: Conversations", "terms": ["Conversation", "Advisor", "Registration", "Concern", "Reason", "Attitude", "Solution", "Replay"], "passage": "A student visits her advisor before registration closes. She is worried because one course is already full. The advisor suggests joining the waiting list online. The student feels relieved and thanks her. She promises to fill in the form that afternoon.", "question": "How do you follow a campus conversation?", "funfact": "Did you know? Follow the problem, the solution and the decision in order. Notice the tone of voice, and answer from what you heard."}, "8": {"title": "Listening: Announcements", "terms": ["Announcement", "Cancel", "Reschedule", "Venue", "Reminder", "Eligible", "Attend", "Inference"], "passage": "A speaker announces that tomorrow's lecture is rescheduled. It will now take place in Hall B at three o'clock. The reason is that the usual room is being repaired. Students are reminded to bring their ID cards. Only first-year students are eligible for the library tour afterwards.", "question": "How do you follow an announcement?", "funfact": "Did you know? Take short notes on what, when, where and who, and listen for the action required. For inference, use the clues the speaker gives."}, "9": {"title": "Listening: Academic Talks", "terms": ["Lecture", "Topic", "Signpost", "Illustrate", "Theory", "Evidence", "Counterargument", "Summary"], "passage": "The professor introduces coral reefs as a rich habitat. Firstly, she explains how corals build reefs. However, warm water causes bleaching. For example, a large reef lost half its coral in one summer. She summarises that protection requires global action.", "question": "How do you take notes in an academic talk?", "funfact": "Did you know? Identify the topic, follow the signposts, and note the main points and examples. Do not write full sentences."}, "10": {"title": "Listening: Note-taking and Inference", "terms": ["Abbreviation", "Symbol", "Outline", "Attitude", "Sarcasm", "Hesitate", "Emphasis", "Implied"], "passage": "A professor says, Well, that plan is certainly ambitious. She pauses before the word ambitious. The class understands that she may doubt the plan. A student writes govt, plan, doubt in her notes. She chooses the answer that matches the professor's tone.", "question": "How do you take notes and understand attitude?", "funfact": "Did you know? Use abbreviations and symbols in notes. For inference, combine what is said with how it is said."}, "11": {"title": "Writing: Build a Sentence", "terms": ["Scrambled", "Word order", "Subject", "Verb", "Object", "Auxiliary", "Question form", "Punctuation"], "passage": "The prompt asks: Did you finish the report? The scrambled words are finished, I, it, yesterday. Kanha puts I first as the subject. Then she adds finished it, and yesterday goes last. The answer is I finished it yesterday.", "question": "How do you build a sentence from scrambled words?", "funfact": "Did you know? Find the subject and the verb, then build the rest in the usual English order. In questions, use the auxiliary before the subject."}, "12": {"title": "Writing: Write an Email", "terms": ["Subject line", "Greeting", "Request", "Explain", "Closing", "Appreciate", "Apologise", "Task"], "passage": "The prompt says a student missed a class because he was ill. He must write to his professor and explain the situation. He starts with Dear Professor Lee and states his purpose. He asks politely for the notes and apologises for the absence. He ends with Best regards and his name.", "question": "How do you write a good email in the test?", "funfact": "Did you know? Read the prompt carefully, cover every point, choose the right tone, and finish with a polite closing. Check grammar in the last minute."}, "13": {"title": "Writing: Email Register and Common Fixes", "terms": ["Register", "Formal", "Informal", "Contraction", "Modal", "Proofread", "Concise", "Tone"], "passage": "Sreyneang writes to her manager, Send me the schedule now. Her teacher says the tone is too direct. She changes it to, Could you please send me the schedule? She also removes contractions and checks the verb tense. Her second draft is polite, concise and clear.", "question": "How do you make an email polite and correct?", "funfact": "Did you know? Choose the register for the reader, use polite modals in requests, and proofread for agreement, tense and spelling."}, "14": {"title": "Writing: Academic Discussion Post", "terms": ["Discussion board", "Contribute", "Position", "Support", "Respond", "Add", "Example", "Relevant"], "passage": "The professor asks if classes should be online or on campus. One student says online classes save time. Another says on-campus classes help friendships. Maly agrees with the first student and adds a new reason. She writes that recorded lessons help her review before exams.", "question": "How do you write an academic discussion post?", "funfact": "Did you know? Read the question and both replies. State your position, support it with a reason and an example, and connect your idea to what a classmate said."}, "15": {"title": "Writing: Adding New Ideas and Linking", "terms": ["New idea", "Build on", "Disagree", "Furthermore", "Therefore", "In contrast", "Clear", "Variety"], "passage": "Chantha reads the two replies about online classes. She builds on Sam's idea about saving time. Furthermore, she adds that students save money on transport. In contrast, she admits that campus life offers more friendships. Therefore, she concludes that a mix of both is best.", "question": "How do you add a new idea in a discussion post?", "funfact": "Did you know? Add a point that is new, link your ideas with a few accurate connectors, and vary your sentences. Avoid copying and off-topic comments."}, "16": {"title": "Speaking: Listen and Repeat", "terms": ["Repeat", "Accuracy", "Rhythm", "Stress", "Intonation", "Syllable", "Visual cue", "Memory chunk"], "passage": "A picture shows students in a library. The sentence says: The library opens at nine o'clock. Bopha remembers three chunks: the library, opens, at nine. She repeats them smoothly with a falling voice. Her score improves because she keeps the exact words.", "question": "How do you repeat a long sentence correctly?", "funfact": "Did you know? Listen to the whole sentence, hold it in chunks, and repeat it with natural stress and rhythm. Do not add or change words."}, "17": {"title": "Speaking: Take an Interview", "terms": ["Interview", "Familiar", "Fluent", "Develop", "Reason", "Example", "Pause", "Timer"], "passage": "The interviewer asks when Piseth likes to study. He answers that he prefers the morning. He says he feels more focused and calm. He gives an example from the previous week. He finishes just before the timer ends.", "question": "How do you answer an interview question in forty-five seconds?", "funfact": "Did you know? Answer the question in your first sentence, give a reason, and add an example. Keep speaking naturally until the timer ends."}, "18": {"title": "Speaking: Fluency, Pronunciation and Development", "terms": ["Fluency", "Pronunciation", "Pace", "Linking", "Vowel", "Self-correct", "Filler", "Record"], "passage": "Sovann records one answer every evening. He listens for pauses and unclear words. He repeats the answer with a steadier pace. He adds for instance and as a result to develop his ideas. After a month his speaking sounds smoother.", "question": "How do you improve your speaking fluency?", "funfact": "Did you know? Practise at a steady pace, record yourself, and focus on stress and clear vowels. Develop each answer with a reason and a result."}, "19": {"title": "Academic Vocabulary for TOEFL", "terms": ["Analyse", "Evidence", "Significant", "Interpret", "Consequence", "Contribute", "Factor", "Sufficient"], "passage": "Reaksmey keeps a notebook of academic words. For each word she writes the meaning and the part of speech. She adds an example sentence about her own studies. She checks collocations such as significant increase. Her writing sounds clearer and more natural.", "question": "How do you learn academic vocabulary?", "funfact": "Did you know? Learn each academic word with its part of speech and a natural example. Use only words you can use accurately."}, "20": {"title": "Test Day Strategy and Review", "terms": ["Strategy", "Timing", "Adaptive", "Focus", "Calm", "Mock test", "Technical check", "Review"], "passage": "Channary does a technical check of her headphones in the morning. She starts the Reading section and answers carefully. One Listening question is difficult, so she moves on. In Speaking she answers every question without long pauses. She finishes the test calm and satisfied.", "question": "What is your plan for test day?", "funfact": "Did you know? Practise under real timing, check your equipment, and stay calm. Treat each task as a new chance and do not worry about the last one."}}};
        Object.values(curriculum).forEach(g => Object.values(g).forEach(d => { d.vocab = d.terms; d.story = d.passage; }));

        function allTermsForLevel(level) {
            let words = [];

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_grammar_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }

        // On phones the lesson sits below the module list, so after choosing a module, a unit
        // or the next lesson, the page scrolls to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');
            side.scrollIntoView({ behavior: 'smooth', block: 'start' });

        function completeActivity() {
            markActivityComplete(state.tab);

            let gotBadge = false;
            const badgeKey = state.level + '|' + unitKey('badge');

            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');
            else alert('✅ You already finished this activity. Try another module, or go to the next lesson! ▶️');
        }

        function nextLesson() {
            const levelData = curriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % unitNumbers.length;

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }
        // The Video button shows 🆕 when this unit's video is new, and "(soon)" when there is none yet
        function updateVideoTabBadge() {
            const btn = document.querySelector('.tab-btn[data-tab="video"]');
            if (!btn) return;
            const v = videoFor(state.level, state.unit);
            btn.textContent = (v && isRecentlyAdded(v.dateAdded) ? '🆕 ' : '') + '📹 0. Video Lesson' + (v ? '' : ' (soon)');
        }

        let ytPlayer = null;
        let ytPollInterval = null;
        let ytAnsweredCheckpoints = new Set();
        let ytApiLoadPromise = null;
        let ytFallbackTimer = null;
        let ytCurrentConfig = null;

        // Stops the video and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

        function renderVideoLesson(contentDiv) {
            stopVideo();
            ytAnsweredCheckpoints = new Set();
            const unitData = curriculum[state.level][state.unit];
            ytCurrentConfig = videoFor(state.level, state.unit);

            if (!ytCurrentConfig) {
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                    <div class="bg-indigo-50 border-2 border-dashed border-indigo-200 rounded-2xl p-10 text-center">
                        <div class="text-5xl mb-4">🎬</div>
                        <p class="text-xl font-bold text-indigo-900 mb-2">Video Coming Soon!</p>
                        <p class="text-gray-600 mb-4">Your teacher is preparing this unit's video. For now, try the other learning modules!</p>
                        <button onclick="switchTab('listening')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Start with Listening</button>
                    </div>`;
                return;
            }

            if (ytCurrentConfig.mp4) { renderMp4Lesson(contentDiv, unitData); return; }
            const watchUrl = 'https://www.youtube.com/watch?v=' + ytCurrentConfig.id;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch the video, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <div id="yt-player-el" class="w-full h-full"></div>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">Loading video player…</p>
                <p class="text-center mt-1"><a href="${watchUrl}" target="_blank" rel="noopener" class="text-sm text-indigo-600 underline">If the video does not play here, tap to open it in YouTube ↗</a></p>`;

            const showFallback = (why) => {
                const msg = document.getElementById('video-msg');
                if (msg) msg.innerHTML = `⚠️ ${why} <a href="${watchUrl}" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">Open the video in YouTube ↗</a>`;
            };
            ytFallbackTimer = setTimeout(() => { if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') showFallback('The video is taking long to load.'); }, 10000);

            const wanted = ytCurrentConfig.id;
            loadYouTubeApi().then(() => {
                if (!ytCurrentConfig || ytCurrentConfig.id !== wanted || !document.getElementById('yt-player-el')) return;
                ytPlayer = new YT.Player('yt-player-el', {
                    videoId: wanted,
                    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
                    events: {
                        onReady: () => { if (ytFallbackTimer) clearTimeout(ytFallbackTimer); const m = document.getElementById('video-msg'); if (m) m.textContent = '▶️ Press play to start the lesson!'; },
                        onStateChange: onYtStateChange,
                        onError: () => showFallback('This video cannot play inside the lesson.')
                    }
                });
            }).catch(() => showFallback('The video player could not load.'));
        }

7, 139.63, "Skim."], [140.43, 144.32, "Part two: dialogue. Let's listen to a conversation."], [145.15, 147.57, "Visal, what do you do in Complete the Words?"], [148.68, 159.44, "You read a short academic paragraph where some words have missing letters. You type the missing letters so that every word is correct and the passage makes sense."], [160.55, 162.17, "What is the best first step?"], [163.25, 174.35, "Skim the whole paragraph to understand the topic. Then look at each incomplete word and use the sentence, the part of speech and the letters you already have."], [175.45, 177.06, "What mistakes should I avoid?"], [178.15, 190.59, "Do not guess random letters. Check the spelling, and remember prefixes and suffixes such as un-, re-, -ing and -tion, which often appear at the beginning or end."], [191.73, 193.22, "Part three: grammar."], [194.08, 198.53, "Grammar focus: Strategy: context, part of speech, spelling."], [198.83, 200.05, "Look at the pattern."], [200.75, 204.21, "The word needs a verb, so I look for -ed, -ing or -s."], [205.12, 208.79, "The sentence is about plants, so the missing word is probably growth."], [209.73, 216.79, "Read the whole paragraph first, then use the topic, the grammar and the visible letters to complete each word. Always check spelling."], [217.55, 221.0, "Be careful! Don't say: I guess random letters."], [222.97, 225.82, "Say: I use context and spelling."], [226.12, 227.66, "Use context clues."], [228.47, 231.37, "Part four: reading. Read and listen."], [232.17, 233.61, "A Short Paragraph."], [233.91, 237.22, "The paragraph is about how plants grow in dry areas."], [238.23, 240.58, "Some words have only the first half written."], [241.57, 244.8, "Ravy decides that the first missing word must be a noun."], [245.8, 248.94, "She uses the letters she can see to choose the right word."], [249.93, 252.58, "She checks the spelling of each completed word."], [253.67, 257.8, "Part five: quiz. Five questions. Are you ready?"], [258.65, 260.68, "Complete the Words is a blank task."], [260.98, 264.16, "A, Speaking. B, Listening. C, Reading."], [267.7, 269.75, "The answer is C: Reading."], [270.88, 272.21, "First you should blank."], [272.51, 277.07, "A, skim the paragraph. B, type quickly. C, skip it."], [280.63, 283.04, "The answer is A: skim the paragraph."], [284.18, 286.33, "Prefixes and suffixes are blank."], [286.63, 290.55, "A, numbers. B, word parts. C, maps."], [294.1, 296.46, "The answer is B: word parts."], [297.62, 299.36, "What is the paragraph about?"], [299.66, 304.64, "A, a city map. B, a phone call. C, plants in dry areas."], [308.2, 310.91, "The answer is C: plants in dry areas."], [312.05, 313.75, "What does Ravy check last?"], [314.05, 317.72, "A, spelling. B, the title. C, the time zone."], [321.27, 323.09, "The answer is A: spelling."], [324.3, 327.54, "Part six: speaking. It's your turn to talk."], [328.38, 330.63, "How do you complete missing letters in a word?"], [339.42, 340.95, "Now listen to Visal."], [341.25, 352.97, "I read the whole paragraph to understand the topic. Then I decide the part of speech and use the letters I can see to find the word. At the end I check the spelling of every word."], [353.27, 355.1, "Excellent answer, Visal!"], [355.98, 361.97, "Great work! Now you can use eight new words and strategy: context, part of speech, spelling."], [362.27, 367.66, "Today's value is precision of language. Choose your words carefully so others understand you."], [367.96, 370.3, "See you in Unit three. Goodbye!"], [370.6, 373.72, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit03-Reading-Read-in-Daily-Life": [[0.35, 5.19, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.49, 9.14, "Hi! I'm Visal. Let's learn together!"], [9.44, 17.86, "Unit three: Reading: Read in Daily Life. Today you will find facts and make inferences from emails, notices and online posts."], [18.16, 20.85, "Here is our lesson map. Let's start!"], [21.8, 25.14, "Part one: words. You will learn eight new words."], [25.98, 26.95, "Notice."], [27.95, 30.16, "Notice means a short written announcement."], [30.75, 32.98, "The notice says the library is closed."], [33.58, 36.15, "Your turn. Say: Notice."], [39.0, 39.97, "Notice."], [40.72, 41.54, "Email."], [42.55, 44.73, "Email means a message sent online."], [45.35, 46.99, "Read the email carefully."], [47.58, 50.0, "Your turn. Say: Email."], [52.87, 53.81, "Email."], [54.55, 55.48, "Infer."], [56.48, 59.93, "Infer means to understand something not directly stated."], [60.55, 62.67, "You can infer the writer is unhappy."], [63.25, 65.6, "Your turn. Say: Infer."], [68.47, 69.29, "Infer."], [70.05, 70.95, "Purpose."], [71.95, 74.33, "Purpose means the reason something is written."], [74.92, 76.89, "The purpose is to invite people."], [77.48, 79.81, "Your turn. Say: Purpose."], [82.67, 83.64, "Purpose."], [84.38, 85.3, "Deadline."], [86.32, 88.58, "Deadline means the last date to do something."], [89.18, 90.69, "The deadline is Friday."], [91.28, 93.95, "Your turn. Say: Deadline."], [96.8, 97.72, "Deadline."], [98.48, 99.41, "Detail."], [100.42, 103.55, "Detail means a small piece of specific information."], [104.15, 105.92, "Find the detail about the room."], [106.52, 109.03, "Your turn. Say: Detail."], [111.87, 112.97, "Detail."], [113.72, 114.65, "Reply."], [115.65, 117.68, "Reply means to answer a message."], [118.28, 119.84, "Reply by Monday."], [120.45, 123.33, "Your turn. Say: Reply."], [126.2, 127.25, "Reply."], [127.98, 128.84, "Schedule."], [129.85, 131.94, "Schedule means a plan of times."], [132.55, 133.81, "Check the schedule."], [134.42, 137.0, "Your turn. Say: Schedule."], [139.83, 140.92, "Schedule."], [141.7, 145.58, "Part two: dialogue. Let's listen to a conversation."], [146.42, 149.36, "Visal, what texts appear in Read in Daily Life?"], [150.45, 164.06, "You read everyday texts such as emails, notices, social media posts and short articles. The questions ask for facts, the purpose of the text and what you can infer."], [165.15, 167.05, "How do I find a fact quickly?"], [168.15, 177.58, "Read the question first, then scan the text for keywords like dates, names and places. Read the sentences around the keyword to be sure."], [178.68, 180.28, "What is an inference?"], [181.38, 192.62, "An inference is something that the text suggests but does not say directly. For example, if a notice says the room is full again, you can infer that the event is popular."], [193.77, 195.58, "Part three: grammar."], [196.42, 200.65, "Grammar focus: Strategy: purpose, detail, inference."], [200.94, 202.21, "Look at the pattern."], [202.92, 206.52, "The notice says the deadline is Friday, so I must reply before then."], [207.42, 210.84, "The room is full again, so the event is probably popular."], [211.8, 219.07, "Identify the purpose of the text, scan for details with keywords, and use clues to infer ideas that are not stated directly."], [219.82, 224.16, "Be careful! Don't say: I use my own knowledge for facts."], [226.1, 228.85, "Say: I find the fact in the text."], [229.15, 230.66, "Answer from the text."], [231.47, 234.15, "Part four: reading. Read and listen."], [234.97, 236.32, "A Campus Notice."], [236.62, 240.68, "A notice tells students that the language club will move to Room 12."], [241.67, 244.42, "It says the club meets every Tuesday at four."], [245.43, 247.83, "It asks students to reply by Friday."], [248.83, 251.17, "It also says the old room was too small."], [252.17, 254.83, "Students can infer that the club is popular."], [255.93, 259.66, "Part five: quiz. Five questions. Are you ready?"], [260.52, 262.52, "The purpose of a text is blank."], [262.82, 267.08, "A, why it was written. B, its colour. C, its length only."], [270.63, 273.06, "The answer is A: why it was written."], [274.22, 276.27, "To infer is to understand blank."], [276.57, 281.39, "A, spelling. B, what is not stated directly. C, only numbers."], [284.93, 287.87, "The answer is B: what is not stated directly."], [289.02, 290.49, "What is the deadline?"], [290.79, 294.24, "A, Tuesday. B, Monday. C, Friday."], [297.8, 299.72, "The answer is C: Friday."], [300.88, 303.63, "Why can students infer the club is popular?"], [303.93, 309.13, "A, the old room was too small. B, it is on Tuesday. C, it is free."], [312.7, 315.95, "The answer is A: the old room was too small."], [317.12, 318.62, "Where does the club meet now?"], [318.92, 322.92, "A, the library. B, Room 12. C, Room 2."], [326.47, 328.58, "The answer is B: Room 12."], [329.77, 332.8, "Part six: speaking. It's your turn to talk."], [333.65, 336.69, "How do you answer questions about an email or notice?"], [345.48, 347.46, "Now listen to Visal."], [347.76, 361.65, "I read the question first and then find the purpose of the text. I scan for keywords such as dates and names, and I read the sentences around them. If the answer is not stated, I use clues in the text to make an inference."], [361.95, 363.49, "Excellent answer, Visal!"], [364.38, 370.66, "Great work! Now you can use eight new words and strategy: purpose, detail, inference."], [370.96, 375.77, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [376.07, 378.57, "See you in Unit four. Goodbye!"], [378.87, 382.31, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit04-Reading-Academic-Passage-Main-Idea-and-Details": [[0.35, 5.15, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.45, 8.99, "Hi! I'm Visal. Let's learn together!"], [9.29, 19.68, "Unit four: Reading: Academic Passage Main Idea and Details. Today you will identify the main idea, details and organisation of a university-level text."], [19.98, 22.56, "Here is our lesson map. Let's start!"], [23.5, 26.57, "Part one: words. You will learn eight new words."], [27.42, 28.48, "Main idea."], [29.48, 32.39, "Main idea means the central point of a passage."], [32.98, 34.39, "State the main idea."], [34.98, 37.61, "Your turn. Say: Main idea."], [40.47, 41.64, "Main idea."], [42.38, 43.67, "Supporting detail."], [44.68, 48.81, "Supporting detail means a fact or example that explains the main idea."], [49.42, 51.28, "Find a supporting detail."], [51.88, 54.7, "Your turn. Say: Supporting detail."], [57.53, 59.06, "Supporting detail."], [59.82, 60.83, "Passage."], [61.82, 63.85, "Passage means a section of text."], [64.45, 67.24, "The academic passage has six paragraphs."], [67.85, 70.86, "Your turn. Say: Passage."], [73.7, 74.53, "Passage."], [75.28, 76.52, "Organisation."], [77.52, 80.2, "Organisation means how a text is arranged."], [80.82, 82.46, "Notice the organisation."], [83.05, 85.8, "Your turn. Say: Organisation."], [88.63, 89.9, "Organisation."], [90.65, 91.88, "Cause and effect."], [92.88, 95.64, "Cause and effect means a reason and its result."], [96.25, 98.59, "The passage explains cause and effect."], [99.18, 102.39, "Your turn. Say: Cause and effect."], [105.23, 106.68, "Cause and effect."], [107.42, 108.38, "Contrast."], [109.38, 111.88, "Contrast means a difference between things."], [112.48, 114.54, "The writer shows a contrast."], [115.15, 117.9, "Your turn. Say: Contrast."], [120.73, 121.77, "Contrast."], [122.52, 123.53, "Sequence."], [124.52, 127.11, "Sequence means a series of events in order."], [127.72, 129.12, "Follow the sequence."], [129.72, 132.19, "Your turn. Say: Sequence."], [135.03, 136.1, "Sequence."], [136.85, 138.03, "Not mentioned."], [139.02, 141.24, "Not mentioned means not in the text."], [141.85, 143.78, "The option is not mentioned."], [144.38, 146.98, "Your turn. Say: Not mentioned."], [149.83, 150.97, "Not mentioned."], [151.77, 155.51, "Part two: dialogue. Let's listen to a conversation."], [156.35, 159.89, "Visal, what do questions on an academic passage ask?"], [160.98, 171.55, "They ask about the main idea, details, the purpose of a paragraph and the meaning of words. You must find the answer in the passage, not in your own knowledge."], [172.65, 174.59, "How can I find the main idea?"], [175.68, 185.02, "Read the first and last sentences of each paragraph. Together they usually show the central point and the way the passage is organised."], [186.12, 188.07, "How do I answer a detail question?"], [189.18, 200.14, "Find the keyword in the question, locate it in the passage and read the sentences around it. Wrong options often contain true facts that do not answer the question."], [201.3, 203.24, "Part three: grammar."], [204.08, 209.32, "Grammar focus: Strategy: skim for structure, read closely for details."], [209.62, 210.79, "Look at the pattern."], [211.48, 214.69, "The first sentence often gives the main idea of the paragraph."], [215.58, 219.49, "A wrong option may be true in the passage but not answer the question."], [220.43, 227.99, "Skim for the structure, then read closely only where the question points. Eliminate options that are not mentioned or only partly true."], [228.75, 232.68, "Be careful! Don't say: I choose any option that is true."], [234.63, 237.61, "Say: I choose the option that answers."], [237.91, 239.07, "True is not enough."], [239.87, 242.28, "Part four: reading. Read and listen."], [243.07, 244.59, "Passage on Bees."], [244.89, 248.1, "The passage explains why honeybees are important to farms."], [249.1, 253.76, "The first paragraph gives the main idea: bees help plants produce fruit."], [254.77, 259.26, "Later paragraphs describe how pollination works and why bee numbers are falling."], [260.27, 264.82, "The last paragraph contrasts small farms with large industrial farms."], [265.83, 268.84, "A question asks for the cause of the falling numbers."], [269.93, 274.03, "Part five: quiz. Five questions. Are you ready?"], [274.88, 277.44, "The main idea is often in the blank sentence."], [277.74, 281.82, "A, title only. B, first. C, last page."], [285.37, 287.2, "The answer is B: first."], [288.35, 290.26, "A wrong option may be blank."], [290.56, 294.47, "A, always false. B, a map. C, true but irrelevant."], [298.0, 300.7, "The answer is C: true but irrelevant."], [301.85, 303.92, "What do bees help plants produce?"], [304.22, 307.34, "A, fruit. B, stone. C, oil."], [310.9, 313.12, "The answer is A: fruit."], [314.28, 316.61, "Cause and effect shows a reason and blank."], [316.91, 320.46, "A, a map. B, a result. C, a title."], [324.0, 325.93, "The answer is B: a result."], [327.08, 329.51, "The last paragraph contrasts blank."], [329.81, 334.38, "A, bees and ants. B, day and night. C, small and large farms."], [337.93, 340.62, "The answer is C: small and large farms."], [341.83, 344.78, "Part six: speaking. It's your turn to talk."], [345.62, 347.91, "How do you find the main idea of a passage?"], [356.72, 358.31, "Now listen to Visal."], [358.61, 374.34, "I skim the first and last sentences of each paragraph to understand the structure. Then I think about what the whole passage explains. For details, I find the keyword in the passage and read the sentences around it before I choose an answer."], [374.64, 376.29, "Excellent answer, Visal!"], [377.18, 383.81, "Great work! Now you can use eight new words and strategy: skim for structure, read closely for details."], [384.11, 388.52, "Today's value is analytical thinking. Look for the pattern underneath the surface."], [388.82, 391.19, "See you in Unit five. Goodbye!"], [391.49, 395.37, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit05-Reading-Vocabulary-in-Context-and-Inference": [[0.35, 5.16, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.46, 8.98, "Hi! I'm Visal. Let's learn together!"], [9.28, 17.82, "Unit five: Reading: Vocabulary in Context and Inference. Today you will work out word meanings and unstated ideas from context."], [18.12, 20.61, "Here is our lesson map. Let's start!"], [21.57, 25.08, "Part one: words. You will learn eight new words."], [25.92, 27.23, "Context clue."], [28.22, 30.89, "Context clue means a hint in nearby words."], [31.48, 33.15, "Use a context clue."], [33.75, 36.83, "Your turn. Say: Context clue."], [39.67, 41.25, "Context clue."], [41.98, 42.91, "Synonym."], [43.92, 46.73, "Synonym means a word with a similar meaning."], [47.32, 49.36, "A synonym of big is large."], [49.95, 52.32, "Your turn. Say: Synonym."], [55.17, 56.3, "Synonym."], [57.05, 57.99, "Antonym."], [58.98, 61.63, "Antonym means a word with an opposite meaning."], [62.22, 64.2, "An antonym of hot is cold."], [64.82, 67.39, "Your turn. Say: Antonym."], [70.23, 71.07, "Antonym."], [71.82, 72.76, "Imply."], [73.75, 76.84, "Imply means to suggest without saying directly."], [77.45, 79.55, "The writer implies the plan failed."], [80.15, 82.57, "Your turn. Say: Imply."], [85.43, 86.63, "Imply."], [87.38, 88.38, "Conclude."], [89.38, 91.77, "Conclude means to decide after thinking."], [92.35, 94.3, "We can conclude that it is safe."], [94.92, 97.34, "Your turn. Say: Conclude."], [100.2, 101.16, "Conclude."], [101.92, 102.62, "Tone."], [103.62, 105.52, "Tone means the writer's attitude."], [106.12, 107.51, "The tone is critical."], [108.12, 110.32, "Your turn. Say: Tone."], [113.17, 113.92, "Tone."], [114.68, 115.6, "Reference."], [116.62, 119.58, "Reference means a word that points back to another word."], [120.18, 121.63, "What does 'they' refer to?"], [122.22, 124.82, "Your turn. Say: Reference."], [127.67, 128.61, "Reference."], [129.35, 130.35, "Evidence."], [131.35, 133.93, "Evidence means facts that support an answer."], [134.52, 136.25, "Find evidence in the text."], [136.85, 139.66, "Your turn. Say: Evidence."], [142.5, 143.48, "Evidence."], [144.27, 148.34, "Part two: dialogue. Let's listen to a conversation."], [149.18, 152.03, "Visal, how can I understand a new word in a passage?"], [153.12, 164.85, "Look at the words around it. The sentence may give a definition, an example, a synonym or an opposite, and these context clues help you choose the correct meaning."], [165.95, 168.3, "What about questions with the word imply?"], [169.38, 182.81, "Imply questions ask about an idea the writer suggests without stating it. You must find evidence and choose the option that the text supports, not one that goes too far."], [183.92, 185.63, "What are reference questions?"], [186.72, 197.29, "They ask what a pronoun or phrase refers to. Read the sentence before it, because the answer is usually the noun that comes just earlier."], [198.43, 200.22, "Part three: grammar."], [201.08, 204.71, "Grammar focus: Strategy: clue, evidence, conclusion."], [205.01, 206.1, "Look at the pattern."], [206.82, 210.66, "The word 'scarce' is followed by 'hard to find', so scarce means rare."], [211.55, 214.8, "The text implies that the plan failed, because no one used it."], [215.77, 223.26, "Use context clues to guess meanings, and replace the word with your answer to test it. For inference, choose the option that the evidence supports."], [224.02, 227.95, "Be careful! Don't say: I guess the meaning without checking."], [229.9, 232.27, "Say: I test my guess in the sentence."], [232.57, 233.63, "Test the meaning."], [234.43, 237.18, "Part four: reading. Read and listen."], [237.97, 239.33, "A Rare Resource."], [239.63, 242.96, "The passage says fresh water is scarce in some regions."], [243.97, 247.8, "The next sentence says it is hard to find and costly to transport."], [248.8, 251.69, "From this, a reader can work out that scarce means rare."], [252.7, 256.28, "The writer implies that local communities need new solutions."], [257.27, 260.47, "The word they in the last sentence refers to the communities."], [261.57, 265.58, "Part five: quiz. Five questions. Are you ready?"], [266.42, 268.24, "A context clue is blank."], [268.54, 272.64, "A, a map. B, a number. C, a hint in nearby words."], [276.2, 279.27, "The answer is C: a hint in nearby words."], [280.42, 281.79, "Scarce means blank."], [282.09, 285.43, "A, rare. B, cheap. C, noisy."], [288.97, 290.87, "The answer is A: rare."], [292.02, 293.55, "'Imply' means to blank."], [293.85, 297.63, "A, spell. B, suggest. C, define."], [301.17, 303.15, "The answer is B: suggest."], [304.32, 305.82, "What does 'they' refer to?"], [306.12, 310.7, "A, the regions. B, the solutions. C, the communities."], [314.23, 316.99, "The answer is C: the communities."], [318.15, 320.31, "After guessing a meaning, you should blank."], [320.61, 325.4, "A, test it in the sentence. B, stop reading. C, change the topic."], [328.97, 332.28, "The answer is A: test it in the sentence."], [333.47, 336.7, "Part six: speaking. It's your turn to talk."], [337.55, 339.7, "How do you work out the meaning of a new word?"], [348.52, 350.13, "Now listen to Visal."], [350.43, 363.25, "I look at the words around it for a definition, an example or a synonym. Then I replace the word with my guess to test whether the sentence still makes sense. If it does, I choose that meaning."], [363.55, 365.33, "Excellent answer, Visal!"], [366.22, 371.92, "Great work! Now you can use eight new words and strategy: clue, evidence, conclusion."], [372.22, 376.36, "Today's value is lifelong learning. Keep learning for as long as you live."], [376.66, 379.29, "See you in Unit six. Goodbye!"], [379.59, 382.76, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit06-Listening-Listen-and-Choose-a-Response": [[0.35, 5.2, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.5, 9.33, "Hi! I'm Visal. Let's learn together!"], [9.63, 17.03, "Unit six: Listening: Listen and Choose a Response. Today you will choose the best reply to a short spoken sentence."], [17.33, 19.77, "Here is our lesson map. Let's start!"], [20.73, 23.84, "Part one: words. You will learn eight new words."], [24.68, 25.84, "Response."], [26.85, 29.59, "Response means an answer to what someone says."], [30.18, 31.68, "Choose the best response."], [32.28, 35.17, "Your turn. Say: Response."], [38.03, 39.19, "Response."], [39.95, 41.09, "Appropriate."], [42.08, 44.49, "Appropriate means right for the situation."], [45.08, 47.07, "Choose the appropriate reply."], [47.68, 50.24, "Your turn. Say: Appropriate."], [53.1, 54.21, "Appropriate."], [54.95, 55.82, "Polite."], [56.82, 58.94, "Polite means showing good manners."], [59.55, 61.53, "A polite request is better."], [62.12, 64.47, "Your turn. Say: Polite."], [67.33, 68.17, "Polite."], [68.92, 69.85, "Request."], [70.85, 73.67, "Request means asking someone to do something."], [74.28, 75.92, "He made a request for help."], [76.52, 79.26, "Your turn. Say: Request."], [82.1, 83.11, "Request."], [83.85, 84.7, "Offer."], [85.72, 88.31, "Offer means saying you will give or do something."], [88.92, 90.53, "She made an offer to help."], [91.12, 93.29, "Your turn. Say: Offer."], [96.13, 97.11, "Offer."], [97.85, 98.85, "Suggestion."], [99.85, 102.3, "Suggestion means an idea about what to do."], [102.92, 104.71, "Her suggestion was a good one."], [105.32, 107.81, "Your turn. Say: Suggestion."], [110.67, 111.66, "Suggestion."], [112.42, 113.34, "Literal."], [114.35, 117.0, "Literal means exactly what the words say."], [117.58, 119.41, "Do not choose a literal meaning."], [120.02, 122.27, "Your turn. Say: Literal."], [125.13, 126.04, "Literal."], [126.78, 127.84, "Intention."], [128.85, 131.6, "Intention means what a speaker wants to do or say."], [132.22, 134.25, "Understand the speaker's intention."], [134.85, 137.4, "Your turn. Say: Intention."], [140.23, 141.33, "Intention."], [142.13, 145.91, "Part two: dialogue. Let's listen to a conversation."], [146.75, 148.89, "Visal, what is this Listening task?"], [149.98, 162.7, "You hear one short sentence, such as a question or a request, and choose the best reply from four written options. The audio plays once, so you must listen carefully."], [163.82, 165.6, "What makes an answer correct?"], [166.68, 177.17, "The correct reply fits the speaker's intention and sounds natural. A wrong option may repeat words from the audio but not answer the question."], [178.28, 179.67, "How do I prepare?"], [180.78, 192.99, "Learn common functions such as requests, offers, suggestions and apologies, and practise natural replies. Do not choose an option only because it repeats a word you heard."], [194.13, 195.84, "Part three: grammar."], [196.68, 200.88, "Grammar focus: Strategy: intention first, then the reply."], [201.18, 202.39, "Look at the pattern."], [203.08, 206.93, "Could you lend me a pen? A good reply is 'Sure, here you are.'"], [207.85, 211.53, "An option that repeats 'pen' may be a trap if it does not answer."], [212.47, 219.89, "Decide what the speaker wants to do, predict a natural reply, and choose the option that fits. Avoid options that only repeat words."], [220.65, 224.82, "Be careful! Don't say: I choose the option with the same word."], [226.77, 229.45, "Say: I choose the option that answers."], [229.75, 231.41, "Do not word-match."], [232.2, 234.68, "Part four: reading. Read and listen."], [235.47, 236.94, "Choosing a Reply."], [237.24, 240.02, "A student hears: Would you mind closing the window?"], [241.03, 243.99, "She predicts that a polite answer will agree or explain."], [245.0, 247.82, "One option says: The window is very big."], [248.83, 251.96, "Another option says: Sure, I will close it now."], [252.97, 255.7, "She chooses the reply that matches the request."], [256.8, 260.56, "Part five: quiz. Five questions. Are you ready?"], [261.42, 263.74, "In this task the audio plays blank."], [264.04, 267.85, "A, once. B, five times. C, never."], [271.4, 273.46, "The answer is A: once."], [274.62, 277.1, "The correct reply fits the speaker's blank."], [277.4, 281.12, "A, age. B, intention. C, handwriting."], [284.67, 286.92, "The answer is B: intention."], [288.08, 290.86, "Would you mind closing the window? is a blank."], [291.16, 294.9, "A, offer. B, apology. C, request."], [298.43, 300.29, "The answer is C: request."], [301.45, 304.01, "A word-matching option is often blank."], [304.31, 308.06, "A, a trap. s."], [60.35, 62.37, "Registration closes today."], [62.98, 65.7, "Your turn. Say: Registration."], [68.57, 69.72, "Registration."], [70.48, 71.43, "Concern."], [72.42, 73.93, "Concern means a worry."], [74.52, 76.39, "He has a concern about the fee."], [76.98, 79.75, "Your turn. Say: Concern."], [82.6, 83.6, "Concern."], [84.35, 85.18, "Reason."], [86.18, 88.34, "Reason means why something happens."], [88.95, 90.33, "Listen for the reason."], [90.95, 93.07, "Your turn. Say: Reason."], [95.93, 96.87, "Reason."], [97.62, 98.64, "Attitude."], [99.65, 102.45, "Attitude means how someone feels about something."], [103.05, 104.41, "Notice her attitude."], [105.02, 107.85, "Your turn. Say: Attitude."], [110.7, 111.59, "Attitude."], [112.35, 113.5, "Solution."], [114.52, 116.84, "Solution means a way to solve a problem."], [117.45, 119.06, "They agree on a solution."], [119.65, 122.62, "Your turn. Say: Solution."], [125.47, 126.58, "Solution."], [127.35, 128.29, "Replay."], [129.28, 131.56, "Replay means to hear a short part again."], [132.15, 134.14, "You may hear a replay of one line."], [134.75, 137.17, "Your turn. Say: Replay."], [140.03, 140.92, "Replay."], [141.73, 145.16, "Part two: dialogue. Let's listen to a conversation."], [146.02, 149.06, "Visal, what happens in a conversation task?"], [150.15, 163.03, "You hear a short talk between two people, often a student and a staff member. Questions ask about the problem, the reason, the speaker's feeling and what happens next."], [164.12, 165.66, "How do I follow the story?"], [166.75, 176.26, "Listen for the problem first, then the suggestions, then the final decision. Notes of three or four words help you remember each step."], [177.35, 178.95, "How do I understand tone?"], [180.05, 191.94, "Listen to the voice, not only the words. A rising or falling voice can show surprise, worry or relief, and a replayed line usually has a question about its meaning."], [193.1, 194.97, "Part three: grammar."], [195.82, 199.85, "Grammar focus: Strategy: problem, solution, decision."], [200.15, 201.45, "Look at the pattern."], [202.15, 205.33, "The student is worried about missing the registration deadline."], [206.25, 209.38, "The advisor suggests that she fill in an online form."], [210.33, 216.54, "Follow the problem, the solution and the decision in order. Notice the tone of voice, and answer from what you heard."], [217.28, 220.56, "Be careful! Don't say: I write every word I hear."], [222.5, 224.67, "Say: I write short notes only."], [224.97, 226.0, "Short notes."], [226.8, 229.3, "Part four: reading. Read and listen."], [230.1, 231.83, "At the Advisor's Office."], [232.13, 235.73, "A student visits her advisor before registration closes."], [236.73, 239.4, "She is worried because one course is already full."], [240.4, 243.47, "The advisor suggests joining the waiting list online."], [244.47, 246.73, "The student feels relieved and thanks her."], [247.73, 250.32, "She promises to fill in the form that afternoon."], [251.43, 255.19, "Part five: quiz. Five questions. Are you ready?"], [256.05, 258.88, "In a conversation, listen first for the blank."], [259.19, 262.57, "A, title. B, problem. C, date."], [266.13, 267.98, "The answer is B: problem."], [269.12, 271.01, "The student is worried about blank."], [271.31, 275.48, "A, a lost bag. B, her hair. C, a full course."], [279.03, 281.06, "The answer is C: a full course."], [282.22, 284.22, "The advisor suggests blank."], [284.52, 289.2, "A, joining a waiting list. B, leaving the university. C, paying more."], [292.77, 295.76, "The answer is A: joining a waiting list."], [296.92, 298.97, "How does the student feel at the end?"], [299.27, 302.95, "A, bored. B, relieved. C, angry."], [306.5, 308.37, "The answer is B: relieved."], [309.52, 311.05, "Notes should be blank."], [311.35, 316.08, "A, full sentences. B, in another language only. C, short."], [319.63, 321.39, "The answer is C: short."], [322.6, 325.73, "Part six: speaking. It's your turn to talk."], [326.58, 328.97, "How do you follow a campus conversation?"], [337.75, 339.16, "Now listen to Visal."], [339.46, 352.93, "I listen first for the problem, then for the solutions the speakers suggest. I write short notes, and I pay attention to the tone of voice to understand feelings. At the end I think about what will happen next."], [353.23, 355.17, "Excellent answer, Visal!"], [356.08, 361.29, "Great work! Now you can use eight new words and strategy: problem, solution, decision."], [361.59, 366.36, "Today's value is communication. Speak clearly and listen carefully."], [366.65, 369.09, "See you in Unit eight. Goodbye!"], [369.39, 371.75, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTF-Unit08-Listening-Announcements": [[0.35, 5.28, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEFL preparation."], [5.58, 8.83, "Hi! I'm Visal. Let's learn together!"], [9.13, 15.82, "Unit eight: Listening: Announcements. Today you will understand campus announcements and answer inference questions."], [16.12, 18.93, "Here is our lesson map. Let's start!"], [19.9, 23.14, "Part one: words. You will learn eight new words."], [23.98, 25.03, "Announcement."], [26.02, 28.6, "Announcement means a spoken public message."], [29.18, 30.79, "Listen to the announcement."], [31.38, 33.91, "Your turn. Say: Announcement."], [36.77, 37.71, "Announcement."], [38.45, 39.25, "Cancel."], [40.25, 42.67, "Cancel means to stop an event from happening."], [43.28, 44.76, "The class is cancelled."], [45.35, 47.63, "Your turn. Say: Cancel."], [50.47, 51.35, "Cancel."], [52.12, 53.01, "Reschedule."], [54.02, 56.79, "Reschedule means to change the time of an event."], [57.38, 58.92, "The lecture is rescheduled."], [59.52, 62.06, "Your turn. Say: Reschedule."], [64.9, 65.95, "Reschedule."], [66.68, 67.67, "Venue."], [68.68, 70.61, "Venue means the place of an event."], [71.22, 72.61, "The venue has changed."], [73.22, 75.54, "Your turn. Say: Venue."], [78.4, 79.25, "Venue."], [80.02, 80.91, "
