<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2-EPE Digital Academy - Computer Class</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Key Terms: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-5xl bg-slate-800 text-white rounded-2xl p-6 shadow-lg mb-6 flex justify-between items-center flex-wrap gap-3">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">💻 C2-EPE Computer Class</h1>
            <p class="text-sm text-slate-300">Computer Class - Online Class</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap justify-end">
            <div class="bg-amber-400 text-slate-900 px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                ⭐ <span id="star-count">0</span>
            </div>
            <div class="bg-pink-500 text-white px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                🏆 <span id="badge-count">0</span> Badges
            </div>
            <button onclick="showMyProgress()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-sm font-bold border border-white/20 cursor-pointer">📊 My Progress</button>
            <div class="bg-slate-700 px-3 py-2 rounded-xl text-sm font-bold border border-red-500">
                <span id="current-level-display">A1</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-4 gap-6">

        <aside id="module-sidebar" class="bg-white rounded-2xl p-4 shadow-md md:col-span-1 flex flex-col gap-3" style="scroll-margin-top:12px;">
            <div id="level-picker-wrap">
                <h2 class="font-bold text-gray-700 border-b pb-2">Grade</h2>
                <div class="flex flex-col gap-3 mt-3">
                    <button onclick="selectLevel('A1')" id="btn-A1" class="level-btn text-left p-3 rounded-xl bg-slate-700 text-white font-semibold transition shadow cursor-pointer">🌱 A1 Grammar</button>
                    <button onclick="selectLevel('A2')" id="btn-A2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📗 A2 Grammar</button>
                    <button onclick="selectLevel('B1')" id="btn-B1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📘 B1 Grammar</button>
                    <button onclick="selectLevel('B2')" id="btn-B2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📙 B2 Grammar</button>
                    <button onclick="selectLevel('C1')" id="btn-C1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🎓 C1 Grammar</button>
                    <button onclick="selectLevel('C2')" id="btn-C2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">👑 C2 Grammar</button>
                </div>
            </div>
            <div id="locked-level-banner" class="hidden bg-slate-50 border border-red-200 rounded-xl p-3 text-center">
                <p class="text-xs text-red-600 font-semibold">TOPIC</p>
                <p id="locked-level-text" class="text-xl font-bold text-slate-900"></p>
            </div>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700" id="unit-select-label">Select Unit (1 to 25)</h2>
            <select id="unit-select" onchange="updateUnit()" class="p-2 rounded-xl border border-gray-300 bg-gray-50 font-semibold text-slate-900">
                <option value="1">Loading...</option>
            </select>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700">Learning Modules</h2>
            <button onclick="switchTab('video')" data-tab="video" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📹 0. Video Lesson</button>
            <button onclick="switchTab('learn')" data-tab="learn" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📖 1. Learn</button>
            <button onclick="switchTab('terms')" data-tab="terms" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗂️ 2. Key Terms</button>
            <button onclick="switchTab('quiz')" data-tab="quiz" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🧩 3. Quiz</button>
            <button onclick="switchTab('think')" data-tab="think" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💭 4. Think About It</button>
            <button onclick="switchTab('funfact')" data-tab="funfact" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📌 5. Did You Know</button>
            <button onclick="switchTab('vocabgame')" data-tab="vocabgame" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🖼️ 6. Picture Match</button>
            <button onclick="switchTab('spelling')" data-tab="spelling" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✏️ 7. Spelling</button>
            <button onclick="switchTab('sentence')" data-tab="sentence" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💬 8. Sentence Building</button>
            <button onclick="switchTab('summary')" data-tab="summary" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📝 9. Summary Writing</button>
            <button onclick="switchTab('headline')" data-tab="headline" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📰 10. Headline Writing</button>
            <button onclick="switchTab('factopinion')" data-tab="factopinion" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔍 11. Fact vs Opinion</button>
            <button onclick="switchTab('debate')" data-tab="debate" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗣️ 12. Debate Corner</button>
            <button onclick="switchTab('discussion')" data-tab="discussion" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💭 13. Discussion</button>
            <button onclick="switchTab('dictation')" data-tab="dictation" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎧 14. Dictation</button>

        <section id="content-area" class="bg-white rounded-2xl p-6 shadow-md md:col-span-3 flex flex-col justify-between" style="scroll-margin-top:12px;">

            <div class="mt-8 pt-4 border-t flex justify-between items-center text-sm text-gray-500 gap-2 flex-wrap">

        </section>

    </main>

uts, Ctrl+V pastes."}, "6": {"title": "Use a USB Drive", "terms": ["USB drive", "Port", "Plug in", "Eject", "Storage", "Backup", "Drive letter", "Transfer"], "passage": "Step 1: Plug in. Step 2: Open the drive. Step 3: Copy files. Step 4: Eject safely. Always eject first. This protects your files.", "question": "Why should you eject a USB drive?", "funfact": "Did you know? Always eject first. This protects your files."}, "7": {"title": "Search the Web Like a Pro", "terms": ["Browser", "Search", "Keyword", "Result", "Website", "Link", "Source", "Reliable"], "passage": "Step 1: Open browser. Step 2: Type keywords. Step 3: Read results. Step 4: Check source. Use 2 to 4 keywords. Check the source.", "question": "How do you search the web well?", "funfact": "Did you know? Use 2 to 4 keywords. Check the source."}, "8": {"title": "Write and Send an Email", "terms": ["Email", "Compose", "Subject", "Attach", "Send", "Inbox", "Reply", "Address"], "passage": "Step 1: New email. Step 2: To and Subject. Step 3: Write message. Step 4: Attach and Send. Check the address before you press Send.", "question": "How do you send an email with a file?", "funfact": "Did you know? Check the address before you press Send."}, "9": {"title": "Strong Passwords and Scam Safety", "terms": ["Password", "Strong", "2-step login", "Scam", "Phishing", "Link", "Verify", "Privacy"], "passage": "Step 1: Strong password. Step 2: 2-step login. Step 3: Spot a scam. Step 4: Stay safe. Different password for each important account.", "question": "How can you stay safe online?", "funfact": "Did you know? Different password for each important account."}, "10": {"title": "Change Settings: Wi-Fi, Sound and Wallpaper", "terms": ["Settings", "Wi-Fi", "Network", "Volume", "Wallpaper", "Personalise", "Connect", "Slider"], "passage": "Step 1: Open Settings. Step 2: Wi-Fi. Step 3: Sound. Step 4: Wallpaper. Settings is where you control your computer.", "question": "How do you connect to Wi-Fi?", "funfact": "Did you know? Settings is where you control your computer."}, "11": {"title": "Word: Type and Save a Document", "terms": ["Document", "Blank", "Type", "Save", "File name", "Cursor", "Open", "Close"], "passage": "Step 1: Open Word. Step 2: Type text. Step 3: Save (Ctrl+S). Step 4: Name and save. Save early and often with Ctrl+S.", "question": "How do you save a Word document?", "funfact": "Did you know? Save early and often with Ctrl+S."}, "12": {"title": "Word: Format Your Text", "terms": ["Select", "Bold", "Italic", "Font", "Size", "Align", "Format", "Title"], "passage": "Step 1: Select text. Step 2: Bold and size. Step 3: Align. Step 4: Colour. Select first, then format.", "question": "How do you make a title look clear?", "funfact": "Did you know? Select first, then format."}, "13": {"title": "Word: Insert a Table and a Picture", "terms": ["Insert", "Table", "Row", "Column", "Cell", "Picture", "Resize", "Tab"], "passage": "Step 1: Insert tab. Step 2: Table. Step 3: Type in table. Step 4: Picture. Tab moves to the next cell in a table.", "question": "How do you insert a table in Word?", "funfact": "Did you know? Tab moves to the next cell in a table."}, "14": {"title": "Word: Page Setup and Print", "terms": ["Margin", "Orientation", "Portrait", "Landscape", "Preview", "Print", "Printer", "Copies"], "passage": "Step 1: Margins. Step 2: Orientation. Step 3: Print preview. Step 4: Print. Always check the preview before printing.", "question": "How do you print a document?", "funfact": "Did you know? Always check the preview before printing."}, "15": {"title": "Excel: Add Numbers with SUM", "terms": ["Cell", "Formula", "SUM", "Range", "Column", "Row", "Total", "Enter"], "passage": "Step 1: Type data. Step 2: Click result cell. Step 3: Type =SUM. Step 4: Press Enter. Every formula starts with an equals sign.", "question": "How do you add numbers in Excel?", "funfact": "Did you know? Every formula starts with an equals sign."}, "16": {"title": "Excel: AVERAGE and IF", "terms": ["AVERAGE", "IF", "Rule", "True", "False", "Fill handle", "Argument", "Result"], "passage": "Step 1: Click cell. Step 2: AVERAGE. Step 3: IF formula. Step 4: Copy down. IF(rule, answer if true, answer if false).", "question": "What does the IF formula do?", "funfact": "Did you know? IF(rule, answer if true, answer if false)."}, "17": {"title": "Excel: Make a Chart", "terms": ["Chart", "Column chart", "Pie chart", "Data", "Axis", "Title", "Legend", "Compare"], "passage": "Step 1: Select data. Step 2: Insert chart. Step 3: Choose type. Step 4: Add title. Choose column charts to compare, pie charts for parts.", "question": "Why do we use charts?", "funfact": "Did you know? Choose column charts to compare, pie charts for parts."}, "18": {"title": "PowerPoint: Your First Slides", "terms": ["Slide", "Presentation", "Title", "Bullet point", "Layout", "Theme", "Insert", "Audience"], "passage": "Step 1: New slide. Step 2: Title. Step 3: Bullets. Step 4: Add picture. One idea per slide. Few words, big letters.", "question": "What makes a good slide?", "funfact": "Did you know? One idea per slide. Few words, big letters."}, "19": {"title": "PowerPoint: Animation and Presenting", "terms": ["Animation", "Fade", "Transition", "Slide Show", "Present", "Audience", "Rehearse", "Escape"], "passage": "Step 1: Select object. Step 2: Animation. Step 3: Slide Show. Step 4: Present. Do not look at the screen. Look at your audience.", "question": "How do you present slides?", "funfact": "Did you know? Do not look at the screen. Look at your audience."}, "20": {"title": "Google Drive: Share and Work Together", "terms": ["Drive", "Upload", "Download", "Share", "Editor", "Viewer", "Comment", "Cloud"], "passage": "Step 1: Upload. Step 2: Open in Docs. Step 3: Share. Step 4: Comment. Share only with people you trust. Choose Viewer if unsure.", "question": "Why use Google Drive?", "funfact": "Did you know? Share only with people you trust. Choose Viewer if unsure."}}};

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_grammar_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {

        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }

        function completeActivity() {

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

                20: { videoId: '', checkpoints: [] },
                21: { videoId: '', checkpoints: [] },
                22: { videoId: '', checkpoints: [] },
                23: { videoId: '', checkpoints: [] },
                24: { videoId: '', checkpoints: [] },
                25: { videoId: '', checkpoints: [] },
            },
        };

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }
        // The Video button shows 🆕 when this unit's video is new, and "(soon)" when there is none yet
        function updateVideoTabBadge() {
            const btn = document.querySelector('.tab-btn[data-tab="video"]');
            if (!btn) return;
            const v = videoFor(state.level, state.unit);
            btn.textContent = (v && isRecentlyAdded(v.dateAdded) ? '🆕 ' : '') + '📹 0. Video Lesson' + (v ? '' : ' (soon)');
        }

        let ytPlayer = null;
        let ytPollInterval = null;
        let ytAnsweredCheckpoints = new Set();
        let ytApiLoadPromise = null;
        let ytFallbackTimer = null;
        let ytCurrentConfig = null;

        // Stops the video and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

        function renderVideoLesson(contentDiv) {
            stopVideo();
            ytAnsweredCheckpoints = new Set();
            const unitData = curriculum[state.level][state.unit];
            ytCurrentConfig = videoFor(state.level, state.unit);

            if (!ytCurrentConfig) {
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                    <div class="bg-indigo-50 border-2 border-dashed border-indigo-200 rounded-2xl p-10 text-center">
                        <div class="text-5xl mb-4">🎬</div>
                        <p class="text-xl font-bold text-indigo-900 mb-2">Video Coming Soon!</p>
                        <p class="text-gray-600 mb-4">Your teacher is preparing this unit's video. For now, try the other learning modules!</p>
                        <button onclick="switchTab('listening')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Start with Listening</button>
                    </div>`;
                return;
            }

            if (ytCurrentConfig.mp4) { renderMp4Lesson(contentDiv, unitData); return; }
            const watchUrl = 'https://www.youtube.com/watch?v=' + ytCurrentConfig.id;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch the video, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <div id="yt-player-el" class="w-full h-full"></div>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">Loading video player…</p>
                <p class="text-center mt-1"><a href="${watchUrl}" target="_blank" rel="noopener" class="text-sm text-indigo-600 underline">If the video does not play here, tap to open it in YouTube ↗</a></p>`;

            const showFallback = (why) => {
                const msg = document.getElementById('video-msg');
                if (msg) msg.innerHTML = `⚠️ ${why} <a href="${watchUrl}" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">Open the video in YouTube ↗</a>`;
            };
            ytFallbackTimer = setTimeout(() => { if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') showFallback('The video is taking long to load.'); }, 10000);

            const wanted = ytCurrentConfig.id;
            loadYouTubeApi().then(() => {
                if (!ytCurrentConfig || ytCurrentConfig.id !== wanted || !document.getElementById('yt-player-el')) return;
                ytPlayer = new YT.Player('yt-player-el', {
                    videoId: wanted,
                    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
                    events: {
                        onReady: () => { if (ytFallbackTimer) clearTimeout(ytFallbackTimer); const m = document.getElementById('video-msg'); if (m) m.textContent = '▶️ Press play to start the lesson!'; },
                        onStateChange: onYtStateChange,
                        onError: () => showFallback('This video cannot play inside the lesson.')
                    }
                });
            }).catch(() => showFallback('The video player could not load.'));
        }

        // School MP4 videos play in a normal video player; a small stand-in for the YouTube player lets
        // the pause-and-ask questions, "+5 ⭐ for watching" and stop-on-leave code work for both.
        const SUBTITLES = {"OC-XCC-Unit01-Turn-On-Log-In-and-Shut-Down": [[0.35, 5.81, "Welcome to Computer Class. Today you will learn: Turn On, Log In and Shut Down."], [6.11, 12.24, "Start your computer safely and shut it down correctly. Follow each step on your own computer."], [13.25, 19.68, "Step one. Press the power button once. Do not hold it down. Wait a few seconds for the screen to light up."], [20.68, 27.38, "Step two. Type your password and press Enter. Nobody should see your password, so cover the keyboard."], [28.38, 34.29, "Step three. The desktop appears. Click the Start button at the bottom left of the screen."], [35.28, 42.25, "Step four. Click Power, then choose Shut down. Never press the power button to turn off while Windows is working."], [43.25, 46.87, "Now it is your turn. Try these tasks on your own computer."], [47.17, 49.13, "Turn on your computer and log in."], [49.43, 50.84, "Open the Start menu."], [51.14, 54.09, "Shut down the correct way, not with the power button."], [54.39, 55.46, "Well done!"]], "OC-XCC-Unit02-Mouse-and-Keyboard-Basics": [[0.35, 5.77, "Welcome to Computer Class. Today you will learn: Mouse and Keyboard Basics."], [6.07, 11.27, "Use the mouse and the main keys with confidence. Follow each step on your own computer."], [12.28, 20.62, "Step one. Left click selects an item. Double-click, two quick clicks, opens it. Try opening This PC."], [21.62, 28.95, "Step two. Right-click opens a menu. Right-click on an item to see choices such as Open, Rename and Properties."], [29.95, 33.91, "Step three. Use the wheel on the mouse to scroll a page up and down."], [34.92, 44.57, "Step four. Learn four keys. Enter makes a new line. Space makes a space. Backspace deletes. Hold Shift to type a capital letter."], [45.58, 49.38, "Now it is your turn. Try these tasks on your own computer."], [49.69, 52.55, "Double-click This PC to open it."], [52.85, 55.06, "Right-click a file and read the menu."], [55.36, 57.96, "Scroll a long web page with the wheel."], [58.26, 59.36, "Well done!"]], "OC-XCC-Unit03-Typing-Home-Row-and-Touch-Typing": [[0.35, 6.23, "Welcome to Computer Class. Today you will learn: Typing: Home Row and Touch Typing."], [6.53, 10.88, "Type faster using ten fingers. Follow each step on your own computer."], [11.88, 20.16, "Step one. Find the home row. Put your fingers on A, S, D, F and J, K, L, semicolon. Feel the small bumps on F and J."], [21.15, 28.7, "Step two. Your left hand uses A, S, D and F. The little finger rests on A and the index finger on F."], [29.72, 35.34, "Step three. Your right hand uses J, K, L and semicolon. The index finger rests on J."], [36.35, 46.58, "Step four. Type the words sad, lad, ask, fall, dad. Look at the screen, not at the keys. Accuracy first, speed later."], [47.58, 51.61, "Now it is your turn. Try these tasks on your own computer."], [51.91, 54.14, "Practise the home row for five minutes."], [54.44, 56.97, "Type: ask a sad lad fall."], [57.27, 59.48, "Do this every day to get faster."], [59.78, 60.83, "Well done!"]], "OC-XCC-Unit04-Create-a-Folder": [[0.35, 6.92, "Welcome back to Computer Class. Today you will learn how to create a folder on the desktop of your computer."], [7.21, 13.55, "A folder is like a box. You put related files inside, so you can find them quickly."], [14.55, 21.68, "Step one. Move the mouse to an empty place on the desktop. Then right-click, using the right button of the mouse."], [22.68, 28.98, "Step two. A menu opens. Click New. Another list opens on the side. Click Folder."], [29.98, 37.78, "Step three. A new folder appears, and the name is ready to change. Type a name for your folder. For example, My Class."], [38.78, 44.8, "Step four. Press Enter on the keyboard. Your folder is ready. Double-click it to open it."], [45.1, 50.52, "Tip: choose short names with no special symbols, so they are easy to find."], [51.52, 56.69, "Now it is your turn. Create a folder called Homework, and another called Photos."], [56.99, 61.61, "To change a name later, right-click the folder and choose Rename. Well done!"]], "OC-XCC-Unit05-Copy-Move-and-Delete-Files": [[0.35, 6.46, "Welcome to Computer Class. Today you will learn: Copy, Move and Delete Files."], [6.76, 10.97, "Manage your files with shortcuts. Follow each step on your own computer."], [11.98, 16.14, "Step one. Click a file once to select it. It turns blue."], [17.15, 21.25, "Step two. Press Control and C together to copy the file."], [22.25, 31.19, "Step three. Open the folder where you want the copy. Press Control and V to paste. To move a file instead, use Control and X, then paste."], [32.18, 39.51, "Step four. To delete, select the file and press Delete. The file goes to the Recycle Bin, so you can still get it back."], [40.52, 44.54, "Now it is your turn. Try these tasks on your own computer."], [44.84, 46.65, "Copy a photo to your Desktop."], [46.95, 51.48, "Move a file into your Homework folder with Ctrl+X and Ctrl+V."], [51.78, 54.75, "Delete a test file, then restore it from the Recycle Bin."], [55.05, 55.99, "Well done!"]], "OC-XCC-Unit06-Use-a-USB-Drive": [[0.35, 5.45, "Welcome to Computer Class. Today you will learn: Use a USB Drive."], [5.75, 11.38, "Save files to a USB drive and remove it safely. Follow each step on your own computer."], [12.38, 18.81, "Step one. Plug the USB drive into the port gently. Wait a moment until the computer finds it."], [19.82, 26.89, "Step two. Open This PC and click the USB drive. It usually has a letter such as E."], [27.88, 32.45, "Step three. Copy your files and paste them into the USB drive."], [33.45, 41.75, "Step four. Before you remove the drive, click the USB icon in the taskbar and choose Eject. Wait for the message, then pull it out."], [42.75, 46.78, "Now it is your turn. Try these tasks on your own computer."], [47.08, 49.32, "Copy one file to a USB drive."], [49.62, 52.34, "Open the file from the USB drive."], [52.63, 54.43, "Eject the drive the safe way."], [54.73, 55.75, "Well done!"]], "OC-XCC-Unit07-Search-the-Web-Like-a-Pro": [[0.35, 5.29, "Welcome to Computer Class. Today you will learn: Search the Web Like a Pro."], [5.59, 10.17, "Find useful information quickly and safely. Follow each step on your own computer."], [11.18, 14.52, "Step one. Open your browser and click the search box."], [15.52, 21.6, "Step two. Type keywords, not a long sentence. For example, healthy food students."], [22.58, 28.4, "Step three. Press Enter. Read the title and the web address of each result before you click."], [29.38, 37.03, "Step four. Check the source. School, government and health websites are usually more reliable than unknown pages."], [38.02, 41.81, "Now it is your turn. Try these tasks on your own computer."], [42.11, 44.26, "Search for healthy food students."], [44.56, 48.44, "Search with quotes: \"healthy breakfast\" for exact words."], [48.74, 50.55, "Find who wrote the page and when."], [50.85, 51.93, "Well done!"]], "OC-XCC-Unit08-Write-and-Send-an-Email": [[0.35, 6.14, "Welcome to Computer Class. Today you will learn: Write and Send an Email."], [6.44, 10.61, "Write a clear email and send it. Follow each step on your own computer."], [11.62, 14.35, "Step one. Click Compose or New email."], [15.35, 21.64, "Step two. Type the address in the To box. Then write a short subject that says what the email is about."], [22.65, 29.58, "Step three. Write your message. Start with a greeting, say what you need, say thank you, and write your name."], [30.58, 36.2, "Step four. To send a file, click Attach and choose it. Check the address, then click Send."], [37.18, 41.21, "Now it is your turn. Try these tasks on your own computer."], [41.51, 43.4, "Send an email to yourself."], [43.7, 45.66, "Attach a photo to your email."], [45.97, 49.02, "Reply to an email and use Dear and Best regards."], [49.32, 50.48, "Well done!"]], "OC-XCC-Unit09-Strong-Passwords-and-Scam-Safety": [[0.35, 6.5, "Welcome to Computer Class. Today you will learn: Strong Passwords and Scam Safety."], [6.8, 11.76, "Protect your accounts and avoid online scams. Follow each step on your own computer."], [12.75, 25.05, "Step one. Make a strong password. Use twelve or more characters with words, numbers and symbols. Do not use 12345678."], [26.05, 33.56, "Step two. Turn on two-step login. After your password, a code is sent to your phone. Only you should see that code."], [34.55, 41.08, "Step three. Learn to spot a scam. Scams use urgent words, big prizes and strange links."], [42.08, 49.88, "Step four. Never share your password or your code with anyone. Delete the message, and ask a trusted person if you are not sure."], [50.88, 55.24, "Now it is your turn. Try these tasks on your own computer."], [55.54, 58.28, "Change one weak password to a strong one."], [58.59, 61.22, "Turn on 2-step login on your email."], [61.52, 64.22, "Look at a message you got and find the warning signs."], [64.52, 65.59, "Well done!"]], "OC-XCC-Unit10-Change-Settings-Wi-Fi-Sound-and-Wallpaper": [[0.35, 7.37, "Welcome to Computer Class. Today you will learn: Change Settings: Wi-Fi, Sound and Wallpaper."], [7.67, 12.82, "Connect to Wi-Fi and personalise your computer. Follow each step on your own computer."], [13.82, 16.82, "Step one. Click Start, then Settings, the little gear."], [17.82, 24.28, "Step two. Open Network and internet, then Wi-Fi. Click your network name and type the password."], [25.28, 30.0, "Step three. Open System, then Sound. Move the slider to change the volume."], [31.02, 37.72, "Step four. Open Personalisation, then Background. Choose a picture you like for your wallpaper."], [38.72, 42.51, "Now it is your turn. Try these tasks on your own computer."], [42.81, 44.68, "Connect to a Wi-Fi network."], [44.98, 47.05, "Set the volume to a comfortable level."], [47.35, 48.65, "Change your wallpaper."], [48.95, 50.03, "Well done!"]], "OC-XCC-Unit11-Word-Type-and-Save-a-Document": [[0.35, 6.0, "Welcome to Computer Class. Today you will learn: Word: Type and Save a Document."], [6.3, 10.53, "Write a short letter and save it. Follow each step on your own computer."], [11.52, 14.99, "Step one. Open Word and choose Blank document."], [15.98, 20.29, "Step two. Click on the page and type your letter. Press Enter for a new line."], [21.28, 26.2, "Step three. Press Control and S to save. The Save window opens."], [27.22, 36.04, "Step four. Type a clear file name, choose the Documents folder, and click Save. Press Control S again as you work to keep your changes."], [37.05, 40.74, "Now it is your turn. Try these tasks on your own computer."], [41.04, 43.47, "Write a four-line letter."], [43.77, 45.91, "Save it as My Letter in Documents."], [46.22, 48.41, "Close Word, then open the file again."], [48.71, 49.74, "Well done!"]], "OC-XCC-Unit12-Word-Format-Your-Text": [[0.35, 5.83, "Welcome to Computer Class. Today you will learn: Word: Format Your Text."], [6.13, 10.78, "Make your document clear and attractive. Follow each step on your own computer."], [11.78, 17.05, "Step one. Select the words you want to change. Click at the start and drag to the end."], [18.05, 23.69, "Step two. Click B to make the words bold. Change the font size to make the title bigger."], [24.68, 28.57, "Step three. Click Center to put the title in the middle of the page."], [29.55, 36.27, "Step four. Click Font colour and choose a colour. Do not use too many colours. Keep your document easy to read."], [37.28, 41.11, "Now it is your turn. Try these tasks on your own computer."], [41.41, 44.36, "Make your title bold, size 24 and centred."], [44.66, 47.17, "Change one word to a different colour."], [47.47, 49.96, "Save your work with Ctrl+S."], [50.26, 51.15, "Well done!"]], "OC-XCC-Unit13-Word-Insert-a-Table-and-a-Picture": [[0.35, 6.25, "Welcome to Computer Class. Today you will learn: Word: Insert a Table and a Picture."], [6.55, 11.16, "Add a table and a picture to a document. Follow each step on your own computer."], [12.15, 14.71, "Step one. Click the Insert tab."], [15.72, 21.68, "Step two. Click Table. Move the mouse over the squares and choose two columns and three rows."], [22.68, 27.32, "Step three. Click a cell and type. Press Tab to move to the next cell."], [28.32, 35.63, "Step four. To add a picture, click Pictures, find your photo and click Insert. Drag a corner to make it bigger or smaller."], [36.62, 40.33, "Now it is your turn. Try these tasks on your own computer."], [40.63, 43.6, "Insert a table with 3 columns and 4 rows."], [43.9, 45.82, "Type your class timetable in it."], [46.12, 48.23, "Insert one picture below the table."], [48.53, 49.64, "Well done!"]], "OC-XCC-Unit14-Word-Page-Setup-and-Print": [[0.35, 5.82, "Welcome to Computer Class. Today you will learn: Word: Page Setup and Print."], [6.12, 10.41, "Set up the page and print your document. Follow each step on your own computer."], [11.42, 15.27, "Step one. Click Layout, then Margins, then choose Normal."], [16.25, 22.6, "Step two. Click Orientation. Choose Portrait for a tall page, or Landscape for a wide page."], [23.58, 29.49, "Step three. Press Control and P to open Print. Look at the preview on the right to check your page."], [30.48, 35.58, "Step four. Choose your printer and the number of copies. Then click Print."], [36.58, 40.04, "Now it is your turn. Try these tasks on your own computer."], [40.34, 42.57, "Set Narrow margins on a document."], [42.87, 45.24, "Change the page to Landscape and back."], [45.54, 47.91, "Open Print Preview and check the page."], [48.21, 49.23, "Well done!"]], "OC-XCC-Unit15-Excel-Add-Numbers-with-SUM": [[0.35, 7.18, "Welcome to Computer Class. Today you will learn how to add a list of numbers in Excel using the SUM formula."], [7.48, 13.56, "Open Excel on your own computer and follow each step with me. It takes only five minutes."], [14.55, 20.2, "Why do we use a formula? Excel adds the numbers for you, quickly and without mistakes."], [20.5, 27.13, "If a price changes, the total updates by itself. Shop         // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        function renderContent() {
            let contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            stopVideo();                 // never leave a video playing in the background
            stopTalkTimer();             // ...or a Let's Talk timer running
            updateVideoTabBadge();
            // Always shows the real level and unit (it used to say "A1" on every level)
            document.getElementById('platform-info').textContent = `C2-EPE - ${gradeName(state.level)} (Unit ${state.unit}: ${unitData.title})`;
            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'learn') renderLearn(contentDiv, unitData);
            else if (state.tab === 'terms') renderTerms(contentDiv, unitData);
            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'think') renderThink(contentDiv, unitData);
            else if (state.tab === 'funfact') renderFunFact(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);
            else if (state.tab === 'spelling') renderSpelling(contentDiv, unitData);
            else if (state.tab === 'sentence') renderSentenceBuilding(contentDiv, unitData);
            else if (state.tab === 'summary') renderSummaryWriting(contentDiv, unitData);
            else if (state.tab === 'headline') renderHeadlineWriting(contentDiv, unitData);
            else if (state.tab === 'factopinion') renderFactOpinion(contentDiv, unitData);
            else if (state.tab === 'debate') renderDebateCorner(contentDiv, unitData);
            else if (state.tab === 'discussion') renderDiscussion(contentDiv, unitData);
            else if (state.tab === 'dictation') renderDictation(contentDiv, unitData);
            else if (state.tab === 'review') renderReview(contentDiv, unitData);
            else if (state.tab === 'pronunciation') renderPronunciationDrill(contentDiv, unitData);
            else if (state.tab === 'exam') renderExamPractice(contentDiv, unitData);
            else if (state.tab === 'challenge') renderGoal(contentDiv, unitData);
            else if (state.tab === 'codelab') renderCodeLab(contentDiv, unitData);
        }

        // ===== MY PROGRESS =====
        const ALL_TABS = ['video','learn','terms','quiz','think','funfact','vocabgame','spelling','sentence','summary','headline','factopinion','debate','discussion','dictation','review','pronunciation','exam','challenge'];
        function markActivityComplete(tab) {
            progress.completed = progress.completed || {};
            const key = state.level + '_' + state.unit + '_' + tab;
            if (!progress.completed[key]) { progress.completed[key] = true; saveProgress(); }
        }
        function showMyProgress() {
            const lines = LEVELS_ORDER.map(lvl => {
                let data = null;
                if (lvl === state.level) data = progress;
                else { try { data = JSON.parse(localStorage.getItem(PROGRESS_PREFIX + lvl) || 'null'); } catch (e) {} }
                const done = data && data.completed ? Object.keys(data.completed).filter(k => k.startsWith(lvl + '_')).length : 0;
                const total = Object.keys(curriculum[lvl]).length * ALL_TABS.length;
                return `${gradeName(lvl)}: ${done} / ${total} activities (${Math.round(done / total * 100)}%)${lvl === state.level ? ' ← current' : ''}`;
            }).join('\n');
            const unitDone = ALL_TABS.filter(t => progress.completed && progress.completed[state.level + '_' + state.unit + '_' + t]).length;
            alert(`📊 My Progress\n\n⭐ Stars: ${state.stars}\n🏆 Badges: ${state.badges}\n\nThis unit (Unit ${state.unit}): ${unitDone} / ${ALL_TABS.length} modules done\n\n${lines}\n\n(Saved on this device/browser only. Inside the Hub, progress lasts until the page is closed.)`);
        }

        // ===== 1. LEARN =====
        function renderLearn(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">📖 Learn: ${unitData.title}</h2>
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200">
                    <p class="text-gray-800 leading-relaxed bg-white p-5 rounded-xl shadow-inner text-lg mb-3">${unitData.passage}</p>
                    <div class="flex gap-3 flex-wrap items-center">
                        <button onclick="readPassageAloud()" class="bg-slate-600 hover:bg-slate-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Read Aloud</button>
                        <button onclick="finishReading()" class="bg-white border border-slate-300 text-slate-800 font-bold px-5 py-2 rounded-full shadow cursor-pointer">✅ I read it</button>
                    </div>
                    <p id="learn-msg" class="text-sm mt-3 font-semibold text-green-600 min-h-[1.25rem]"></p>
                </div>`;
        }
        // Reading counts as done after listening OR tapping "I read it" (listening used to be the
        // only way, and speech doesn't work in every browser)
        function finishReading() {
            markActivityComplete('learn');
            document.getElementById('learn-msg').textContent = '✅ Well done!' + (award(unitKey('learn'), 2) ? ' (+2 ⭐)' : '');
        }
        function readPassageAloud() {
            speak(curriculum[state.level][state.unit].passage, (ok) => { if (ok && document.getElementById('learn-msg')) finishReading(); });
        }

        // ===== 2. KEY TERMS (flip-cards) =====
        let termsHeard = new Set();
        function renderTerms(contentDiv, unitData) {
            termsHeard = new Set(unitData.terms.map((_, i) => i).filter(i => wasAwarded(unitKey('term-' + i))));
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">🗂️ Key Terms: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">Tap each card to hear it and flip to the picture!</p>
                <div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-6">
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
                        ${unitData.terms.map((w, i) => `
                            <div class="flip-card" id="tw-${i}" role="button" tabindex="0" onclick="playTerm('${escapeJsStr(w)}', ${i})">
                                <div class="flip-card-inner">
                                    <div class="flip-card-front bg-white shadow font-bold text-slate-800 text-sm ${termsHeard.has(i) ? 'ring-4 ring-green-400' : ''}">
                                        🔊 <span>${w}</span>
                                    </div>
                                    <div class="flip-card-back bg-slate-600 shadow text-white">
                                        <span class="text-3xl">${emojiFor(w, unitData)}</span>
                                        <span class="text-xs font-bold mt-1">${w}</span>
                                    </div>
                                </div>
                            </div>`).join('')}
                    </div>
                    <p id="terms-progress" class="text-center text-sm font-semibold text-slate-700">Heard ${termsHeard.size} / ${unitData.terms.length} terms</p>
                </div>`;
        }
        function playTerm(word, i) {
            speak(word);
            const card = document.getElementById('tw-' + i);
            card.classList.toggle('flipped');
            if (award(unitKey('term-' + i), 1)) card.querySelector('.flip-card-front').classList.add('ring-4', 'ring-green-400');
            if (!termsHeard.has(i)) {
                termsHeard.add(i);
                const total = curriculum[state.level][state.unit].terms.length;
                document.getElementById('terms-progress').textContent = `Heard ${termsHeard.size} / ${total} terms`;
                if (termsHeard.size === total) { markActivityComplete('terms'); triggerConfetti(); }
            }
        }

        // ===== 3. QUIZ (listen and choose) =====
        // Answers lock after the first tap, and stars are given only for beating your best score
        let quizState = { qIndex: 0, score: 0, order: [], currentAnswer: '', locked: false };
        function renderQuiz(contentDiv, unitData) {
            quizState = { qIndex: 0, score: 0, order: shuffle([...new Set(unitData.terms)]), currentAnswer: '', locked: false };
            showQuizQuestion();
        }
        function showQuizQuestion() {
            const contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            quizState.locked = false;
            if (quizState.qIndex >= quizState.order.length) {
                const total = quizState.order.length;
                const pct = Math.round((quizState.score / total) * 100); try { window.C2REPORT && C2REPORT('Vocabulary Quiz', quizState.score, total, state); } catch (e) {}
                const bestKey = state.level + '|' + unitKey('quiz');
                const best = progress.best[bestKey] || 0;
                const earned = Math.max(0, quizState.score - best) * 2;
                if (quizState.score > best) progress.best[bestKey] = quizState.score;
                markActivityComplete('quiz');
                if (earned > 0) addStars(earned); else saveProgress();
                if (pct === 100) triggerConfetti();
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-slate-900 mb-2">🧩 Quiz Complete!</h2>
                    <div class="bg-purple-50 p-8 rounded-2xl border border-purple-200 text-center">
                        <div class="text-5xl mb-3">${pct === 100 ? '🏆' : pct >= 50 ? '🎉' : '💪'}</div>
                        <p class="font-bold text-purple-900 text-2xl mb-2">${quizState.score} / ${total} Correct</p>
                        <p class="text-gray-600 mb-4">${earned > 0 ? `You earned ${earned} ⭐` : (best >= total ? 'Perfect score already! 🌟' : `Your best is ${Math.max(best, quizState.score)} / ${total} — beat it to earn more ⭐`)}</p>
                        <button onclick="renderQuiz(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="bg-purple-700 hover:bg-purple-800 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer">🔁 Try Again</button>
                    </div>`;
                return;
            }
            const term = quizState.order[quizState.qIndex];
            const distractors = shuffle(allTermsForLevel(state.level).filter(w => w !== term)).slice(0, 3);
            const options = shuffle([term, ...distractors]);
            quizState.currentAnswer = term;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">🧩 Quiz</h2>
                <p class="text-sm text-gray-500 mb-3">Question ${quizState.qIndex + 1} of ${quizState.order.length}</p>
                <div class="bg-purple-50 p-6 rounded-2xl border border-purple-200">
                    <p class="font-bold text-purple-900 mb-2">🔊 Listen and choose the word you heard:</p>
                    <button onclick="speak(quizState.currentAnswer)" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-5 py-2 rounded-full shadow mb-4 cursor-pointer">🔊 Play Word</button>
                    <div class="flex flex-col gap-2" id="quiz-options">
                        ${options.map((o, i) => `<button onclick="answerQuiz('${escapeJsStr(o)}')" class="bg-white p-3 rounded-xl shadow hover:bg-purple-100 text-left font-medium cursor-pointer">${String.fromCharCode(65 + i)}) ${o}</button>`).join('')}
                    </div>
                    <p id="quiz-ans" class="mt-4 font-bold text-lg min-h-[1.5rem]"></p>
                </div>`;
            speak(term);
        }
        function answerQuiz(chosen) {
            if (quizState.locked) return;
            quizState.locked = true;
            document.querySelectorAll('#quiz-options button').forEach(b => b.disabled = true);
            let el = document.getElementById('quiz-ans');
            if (chosen === quizState.currentAnswer) {
                el.innerHTML = "🎉 Correct! Well done!";
                el.className = "mt-4 font-bold text-lg text-green-600";
                quizState.score++;
            } else {
                el.innerHTML = `❌ Not quite - it was "${escapeHtml(quizState.currentAnswer)}"`;
                el.className = "mt-4 font-bold text-lg text-red-500";
            }
            quizState.qIndex++;
            setTimeout(showQuizQuestion, 1100);
        }

        // ===== 4. THINK ABOUT IT =====
        function renderThink(contentDiv, unitData) {

        function checkThinkAnswer() {

        // ===== 5. DID YOU KNOW =====
        function renderFunFact(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">📌 Did You Know?</h2>

                        <button onclick="finishFunFact()" class="bg-white border border-amber-300 text-amber-800 font-bold px-5 py-2 rounded-full shadow cursor-pointer">✅ Got it</button>

        function finishFunFact() {

        function readFunFactAloud() {
            speak(curriculum[state.level][state.unit].funfact, (ok) => { if (ok && document.getElementById('fact-msg')) finishFunFact(); });
        }
        function textCheck(msg, text, need, okText, key, amount) {
            const n = countWords(text);
            if (n < need) {
                msg.className = "text-sm mt-2 font-semibold text-red-500";
                msg.textContent = n === 0 ? "✏️ Write something first!" : `✏️ Write a little more — at least ${need} words (you have ${n}).`;
                return false;
            }
            msg.className = "text-sm mt-2 font-semibold text-green-600";
            msg.textContent = okText + starNote(award(key, amount), amount);
            return true;
        }
        function usedUnitWords(text, unitData) {
            const t = ' ' + String(text).toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
            return unitData.vocab.filter(w => {
                const base = w.toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').trim();
                if (!base) return false;
                // whole word, allowing simple endings: s, es, ed, ing
                const re = new RegExp('[ ]' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[ ]') + '(s|es|ed|d|ing)?[ ]');
                return re.test(t);
            });
        }
        function renderWriting(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">✍️ Write a Health Tip</h2>
                <p class="text-gray-600 mb-4">Write a short health tip or poster message (2-4 sentences) for your friends, using at least 3 of this unit's words.</p>
                <div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-6">
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${unitData.vocab.map(w => `<span class="bg-white px-3 py-1 rounded-full text-sm font-semibold text-slate-800 border border-slate-200">${w}</span>`).join('')}
                    </div>
                    <textarea id="writing-answer" rows="5" placeholder="Write your paragraph here..." class="w-full p-3 border border-gray-300 rounded-lg text-sm"></textarea>
                    <button onclick="checkWritingAnswer()" class="mt-3 bg-slate-600 hover:bg-slate-700 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer text-sm">Check My Writing</button>
                    <p id="writing-msg" class="text-sm mt-2 font-semibold min-h-[1.25rem]"></p>
                </div>`;
        }
        function checkWritingAnswer() {
            const unitData = curriculum[state.level][state.unit];
            const val = document.getElementById('writing-answer').value.trim();
            const msg = document.getElementById('writing-msg');
            if (!val) { msg.className = "text-sm mt-2 font-semibold text-red-500"; msg.textContent = "✏️ Write your paragraph first!"; return; }
            const used = usedUnitWords(val, unitData);
            const need = Math.max(minWords() * 2, 10);
            if (used.length < 3) {
                msg.className = "text-sm mt-2 font-semibold text-amber-600";
                msg.textContent = `✏️ Good try! Use a few more unit words (found ${used.length} of 3: ${used.join(', ') || 'none yet'}).`;
                return;
            }
            if (countWords(val) < need) {
                msg.className = "text-sm mt-2 font-semibold text-amber-600";
                msg.textContent = `✏️ Great words! Now write a little more — at least ${need} words.`;
                return;
            }
            msg.className = "text-sm mt-2 font-semibold text-green-600";
            msg.textContent = `🎉 Excellent health tip! You used ${used.length} unit words.` + starNote(award(unitKey('writing'), 4), 4);
