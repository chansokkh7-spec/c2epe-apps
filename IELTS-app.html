<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2-EPE Digital Academy - IELTS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Key Terms: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-5xl bg-slate-800 text-white rounded-2xl p-6 shadow-lg mb-6 flex justify-between items-center flex-wrap gap-3">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">🎯 C2-EPE IELTS</h1>
            <p class="text-sm text-slate-300">IELTS - Online Class</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap justify-end">
            <div class="bg-amber-400 text-slate-900 px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                ⭐ <span id="star-count">0</span>
            </div>
            <div class="bg-pink-500 text-white px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                🏆 <span id="badge-count">0</span> Badges
            </div>
            <button onclick="showMyProgress()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-sm font-bold border border-white/20 cursor-pointer">📊 My Progress</button>
            <div class="bg-slate-700 px-3 py-2 rounded-xl text-sm font-bold border border-red-500">
                <span id="current-level-display">A1</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-4 gap-6">

        <aside id="module-sidebar" class="bg-white rounded-2xl p-4 shadow-md md:col-span-1 flex flex-col gap-3" style="scroll-margin-top:12px;">
            <div id="level-picker-wrap">
                <h2 class="font-bold text-gray-700 border-b pb-2">Grade</h2>
                <div class="flex flex-col gap-3 mt-3">
                    <button onclick="selectLevel('A1')" id="btn-A1" class="level-btn text-left p-3 rounded-xl bg-slate-700 text-white font-semibold transition shadow cursor-pointer">🌱 A1 Grammar</button>
                    <button onclick="selectLevel('A2')" id="btn-A2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📗 A2 Grammar</button>
                    <button onclick="selectLevel('B1')" id="btn-B1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📘 B1 Grammar</button>
                    <button onclick="selectLevel('B2')" id="btn-B2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📙 B2 Grammar</button>
                    <button onclick="selectLevel('C1')" id="btn-C1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🎓 C1 Grammar</button>
                    <button onclick="selectLevel('C2')" id="btn-C2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">👑 C2 Grammar</button>
                </div>
            </div>
            <div id="locked-level-banner" class="hidden bg-slate-50 border border-red-200 rounded-xl p-3 text-center">
                <p class="text-xs text-red-600 font-semibold">TOPIC</p>
                <p id="locked-level-text" class="text-xl font-bold text-slate-900"></p>
            </div>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700" id="unit-select-label">Select Unit (1 to 25)</h2>
            <select id="unit-select" onchange="updateUnit()" class="p-2 rounded-xl border border-gray-300 bg-gray-50 font-semibold text-slate-900">
                <option value="1">Loading...</option>
            </select>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700">Learning Modules</h2>
            <button onclick="switchTab('video')" data-tab="video" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📹 0. Video Lesson</button>
            <button onclick="switchTab('learn')" data-tab="learn" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📖 1. Learn</button>
            <button onclick="switchTab('terms')" data-tab="terms" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗂️ 2. Key Terms</button>
            <button onclick="switchTab('quiz')" data-tab="quiz" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🧩 3. Quiz</button>
            <button onclick="switchTab('think')" data-tab="think" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💭 4. Think About It</button>
            <button onclick="switchTab('funfact')" data-tab="funfact" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📌 5. Did You Know</button>
            <button onclick="switchTab('vocabgame')" data-tab="vocabgame" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🖼️ 6. Picture Match</button>
            <button onclick="switchTab('spelling')" data-tab="spelling" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✏️ 7. Spelling</button>
            <button onclick="switchTab('sentence')" data-tab="sentence" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💬 8. Sentence Building</button>
            <button onclick="switchTab('summary')" data-tab="summary" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📝 9. Summary Writing</button>
            <button onclick="switchTab('headline')" data-tab="headline" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📰 10. Headline Writing</button>
            <button onclick="switchTab('factopinion')" data-tab="factopinion" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔍 11. Fact vs Opinion</button>
            <button onclick="switchTab('debate')" data-tab="debate" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗣️ 12. Debate Corner</button>
            <button onclick="switchTab('discussion')" data-tab="discussion" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💭 13. Discussion</button>
            <button onclick="switchTab('dictation')" data-tab="dictation" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎧 14. Dictation</button>
            <button onclick="switchTab('review')" data-tab="review" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔄 15. Review</button>
            <button onclick="switchTab('pronunciation')" data-tab="pronunciation" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔊 16. Pronunciation</button>
            <button onclick="switchTab('exam')" data-tab="exam" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📝 17. Gap Fill & Word Check</button>
            <button onclick="switchTab('challenge')" data-tab="challenge" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✍️ 18. Practice Challenge</button>
        </aside>

        <section id="content-area" class="bg-white rounded-2xl p-6 shadow-md md:col-span-3 flex flex-col justify-between" style="scroll-margin-top:12px;">
            <div id="module-content"></div>
            <div class="mt-8 pt-4 border-t flex justify-between items-center text-sm text-gray-500 gap-2 flex-wrap">
                <span id="platform-info">C2-EPE - A1 (Unit 1)</span>
                <div class="flex gap-2">
                    <button onclick="completeActivity()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Finish Activity (+5 ⭐)</button>
                    <button onclick="nextLesson()" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Next Lesson ▶️</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Phones only: jump back up to the list of learning modules -->

        class="md:hidden fixed bottom-4 right-4 z-50 bg-sky-800 text-white font-bold px-4 py-3 rounded-full shadow-lg cursor-pointer"

    <script>
        let state = {

        };

        const curriculum = {"A1": {"1": {"title": "IELTS Overview and Band Scores", "terms": ["Band score", "Academic", "General Training", "Module", "Overall score", "Descriptor", "Proficiency", "Candidate"], "passage": "Amara wants to study nursing in Australia. Her university asks for an overall band of 6.5. She also needs at least 6.0 in every module. She checks the band descriptors for Writing and Speaking. Then she makes a weekly plan for all four modules.", "question": "What band score do you need, and why?", "funfact": "Did you know? Know your target band, then study the descriptors for that band in each module. Practise all four modules because each counts the same."}, "2": {"title": "Listening: Form Completion", "terms": ["Form", "Word limit", "Spell out", "Postcode", "Booking", "Enquiry", "Predict", "Correction"], "passage": "A caller phones a language school. She gives her name and spells it slowly. First she says the course starts on the fifth, then she corrects it to the fifteenth. The receptionist asks for her postcode and phone number. The form needs only two words for the job title.", "question": "Describe how you prepare before a Listening section starts.", "funfact": "Did you know? Before the audio starts, read the form, underline the answer type and note the word limit. The first answer you hear may be corrected, so wait for the final one."}, "3": {"title": "Listening: Multiple Choice and Maps", "terms": ["Option", "Distractor", "Paraphrase", "Opposite", "Next to", "Junction", "Label", "Direction"], "passage": "A guide shows new students around campus. She says the library was once planned for the north side, but it is now next to the cafe. To reach the sports hall, turn right at the junction. The hall is opposite the pool, not behind it. Students must choose the sentence that matches the final route.", "question": "How do you avoid distractors in multiple choice questions?", "funfact": "Did you know? For multiple choice, underline the key idea in the question and listen for a paraphrase. For maps, locate the start and follow each direction in order."}, "4": {"title": "Listening: Notes and Summary Completion", "terms": ["Lecture", "Signpost", "Summary", "Keyword", "Sequence", "Research", "Seminar", "Tutor"], "passage": "The lecturer talks about coral reefs. Firstly, she explains how corals grow. However, recent research shows that warm water damages them. In conclusion, protecting reefs needs local action and global agreement. Students complete a summary with no more than two words.", "question": "How do you follow a long lecture in the Listening test?", "funfact": "Did you know? In a lecture, the notes follow the order of the audio. Use the headings as a map, listen for signposts, and answer in the order you hear them."}, "5": {"title": "Listening: Numbers, Spelling and Distractors", "terms": ["Digit", "Double", "Currency", "Percentage", "Capital letter", "Hyphen", "Trap", "Double-check"], "passage": "A guest books a room for the fifteenth of March. The receptionist says the price is thirty pounds a night. The guest asks if it is thirteen pounds, and the receptionist corrects her. The guest spells her name: M, A, double L, O, R, Y. At the end she repeats the phone number digit by digit.", "question": "Which number or spelling mistakes do you want to avoid in the test?", "funfact": "Did you know? Practise number pairs like thirteen and thirty. Learn to spell common IELTS words. In the last minute, double-check spelling, capitals and the word limit."}, "6": {"title": "Reading: Skimming and Scanning", "terms": ["Skim", "Scan", "Heading", "Topic sentence", "Passage", "Main idea", "Detail", "Time limit"], "passage": "Dara reads the first reading passage word by word. After thirty minutes she has finished only one passage. Her teacher tells her to skim the headings and topic sentences first. Next she scans for names, dates and numbers in the questions. In the next test she finishes all three passages.", "question": "Explain the difference between skimming and scanning.", "funfact": "Did you know? Spend two minutes skimming, then read the questions. Scan for keywords, and read closely only around the place where the answer appears."}, "7": {"title": "Reading: True, False and Not Given", "terms": ["Statement", "True", "False", "Not Given", "Contradict", "Assume", "Evidence", "Exaggerate"], "passage": "The text says that most tea drinkers in the town prefer green tea. It does not mention the price of tea. A statement says all tea drinkers prefer green tea. Another statement says tea is cheap in the town. The first statement is False and the second is Not Given.", "question": "How do you decide between False and Not Given?", "funfact": "Did you know? Locate the sentence, compare the meaning, and decide. Never use outside knowledge, and check for extreme words such as all, only and never."}, "8": {"title": "Reading: Matching Headings", "terms": ["Paragraph", "Heading", "Main point", "Extra heading", "Theme", "Overview", "Contrast", "Eliminate"], "passage": "A passage about city life has five paragraphs and eight headings. The first paragraph mentions money, but its main point is about housing. The teacher reminds students to eliminate used headings. Three headings are extra and match no paragraph. The class discusses why one heading is a trap.", "question": "How do you choose the correct heading?", "funfact": "Did you know? Read the headings, then match each paragraph by its main point. Be careful of words repeated from the text, because they may point to a detail rather than the whole idea."}, "9": {"title": "Reading: Sentence and Summary Completion", "terms": ["Gap", "Word bank", "Grammar fit", "Noun phrase", "Verb form", "Synonym", "Exact", "Instruction"], "passage": "A passage describes a study of sleep in teenagers. The summary has a gap that needs a noun phrase. The passage says teenagers need nine hours of rest. Students must write no more than two words for the gap. One student writes three words and loses the mark.", "question": "How do you complete a summary correctly?", "funfact": "Did you know? Predict the word type for each gap, find the matching idea in the text, and copy exactly. Read the finished sentence to check meaning and grammar."}, "10": {"title": "Reading: Multiple Choice and Time Management", "terms": ["Stem", "Trap", "Pace", "Skip", "Review", "Prioritise", "Allocate", "Transfer"], "passage": "Sokha practises three passages in sixty minutes. He spends twenty minutes on each one. When a question is too hard, he skips it and returns later. He remembers that there is no negative marking. At the end he has no blanks, and his score improves.", "question": "How do you manage your time in the Reading test?", "funfact": "Did you know? Plan twenty minutes per passage, skip hard questions and return to them. Write answers directly on the sheet and always guess if you run out of time."}, "11": {"title": "Writing Task 1: Describing Trends", "terms": ["Increase", "Decrease", "Fluctuate", "Remain stable", "Peak", "Sharply", "Gradually", "Period"], "passage": "The graph shows sales of bicycles from 2010 to 2020. Sales rose sharply until 2014 and reached a peak of 80 units. After that, they fluctuated for three years. From 2018, sales decreased gradually and fell to 50 units. Overall, the trend was upward at first and downward later.", "question": "Describe how you write about a line graph.", "funfact": "Did you know? Use a trend verb, an adverb and exact data. Use the past tense for past dates, and never write your opinion in Task 1."}, "12": {"title": "Writing Task 1: Comparing Data and Overview", "terms": ["Compare", "Whereas", "Proportion", "Highest", "Lowest", "Overview", "Approximately", "Double"], "passage": "The bar chart compares the drinks chosen by 200 students. Approximately 80 students chose tea, which was the highest figure. Coffee was chosen by about 60, whereas juice had the lowest figure of 20. Overall, hot drinks were much more popular than cold drinks. The number of tea drinkers was four times the number of juice drinkers.", "question": "Why is an overview important in Task 1?", "funfact": "Did you know? Write an overview that gives the main features, and then support it with key figures. Use comparatives, superlatives and linking words such as whereas and while."}, "13": {"title": "Writing Task 1: Processes and Maps", "terms": ["Process", "Stage", "Firstly", "Subsequently", "Finally", "Passive voice", "Replace", "Extend"], "passage": "The diagram shows how paper is made in six stages. Firstly, trees are cut down and transported to a factory. Subsequently, the wood is cut into small pieces and mixed with water. Then the mixture is pressed and dried. Finally, the paper is rolled and packed for delivery.", "question": "How do you describe a process diagram?", "funfact": "Did you know? For processes, use the present passive and sequence words. For maps, use the past passive and prepositions of place, and always give an overview."}, "14": {"title": "Writing Task 2: Essay Structure and Task Response", "terms": ["Introduction", "Thesis", "Body paragraph", "Conclusion", "Task response", "Argument", "Example", "Relevant"], "passage": "The question asks whether students should wear uniforms. Lina spends five minutes writing a plan. In the introduction she paraphrases the question and states her view. Each body paragraph develops one reason with an example. In the conclusion she summarises her position without new ideas.", "question": "How do you structure a Task 2 essay?", "funfact": "Did you know? Spend five minutes planning. Answer every part of the question, keep to one main idea per paragraph, and leave two minutes to check your work."}, "15": {"title": "Writing Task 2: Opinion and Discussion Essays", "terms": ["Opinion essay", "Discussion essay", "To what extent", "In my opinion", "On the one hand", "On the other hand", "Concede", "Nevertheless"], "passage": "Some people argue that uniforms limit self-expression. On the one hand, I concede that students lose some choice. On the other hand, uniforms save money and reduce pressure. Nevertheless, I believe the benefits are greater. In conclusion, schools should keep uniforms.", "question": "How do you show a clear position in your essay?", "funfact": "Did you know? Identify the essay type, state a clear position in the introduction, and keep it consistent. Use concession to show balance, then explain why your view is stronger."}, "16": {"title": "Writing Task 2: Problems, Solutions and Advantages", "terms": ["Problem", "Solution", "Cause", "Effect", "Advantage", "Disadvantage", "Outweigh", "Implement"], "passage": "Many cities suffer from heavy traffic and air pollution. One effect is that people spend hours in their cars. Governments should implement cheap and reliable public transport. Although this is expensive, the long-term benefits outweigh the costs. In conclusion, cities need better transport to solve this problem.", "question": "How do you write a problem-solution essay?", "funfact": "Did you know? Check how many parts the question has and answer each one in its own paragraph. Explain solutions step by step and give a clear final judgement."}, "17": {"title": "Writing: Coherence, Cohesion and Vocabulary", "terms": ["Coherence", "Cohesion", "Linker", "Referencing", "Collocation", "Paraphrase", "Repetition", "Formal"], "passage": "Mina writes a paragraph with the word important in every sentence. Her teacher shows her how to paraphrase it as essential and significant. She adds the linkers however and therefore only where they are needed. She uses this and they to refer back and avoid repetition. Her next essay sounds clearer and more natural.", "question": "How do you improve cohesion and vocabulary in your writing?", "funfact": "Did you know? Plan the order of ideas, link them with a few accurate linkers, and use referencing to avoid repetition. Learn collocations and paraphrase key words."}, "18": {"title": "Speaking Part 1: Familiar Topics", "terms": ["Hometown", "Routine", "Hobby", "Extend", "Fluency", "Filler", "Pronunciation", "Opinion"], "passage": "The examiner asks Chenda about her hometown. She says she comes from Battambang, a calm and friendly city. She explains that the river and old buildings make it special. She gives an example of a weekend market she enjoys. The examiner moves to the next question.", "question": "Tell me about your hometown, with a reason.", "funfact": "Did you know? Answer in two or three sentences: answer, reason, example. Speak naturally and avoid one-word answers and memorised speeches."}, "19": {"title": "Speaking Part 2: The Long Turn", "terms": ["Cue card", "Preparation time", "Long turn", "Describe", "Prompt", "Anecdote", "Memorable", "Conclude"], "passage": "The cue card says: describe a trip you remember. Vanna notes four keywords: where, who, what, feeling. She talks about a boat ride on the Tonle Sap with her grandfather. She tells a short anecdote about seeing the sunset on the water. She concludes that it was peaceful and unforgettable.", "question": "Describe a memorable trip you took.", "funfact": "Did you know? Use the one minute to note keywords. Follow the prompts in order, add details and feelings, and finish with a short conclusion."}, "20": {"title": "Speaking Part 3 and Full Mock Review", "terms": ["Abstract", "Justify", "Speculate", "Compare", "Trend", "It depends", "Mock test", "Feedback"], "passage": "The examiner asks how travel has changed over time. Rithy says that travel is faster and cheaper than before. He justifies this with the growth of low-cost flights and online booking. He speculates that more people will travel for study in the future. He ends by saying it depends on each country's policies.", "question": "How do you prepare for the whole IELTS test?", "funfact": "Did you know? In Part 3, give your view, explain why, and add an example. Use compare and speculate language, and review all four modules with timed mock tests."}}};
        Object.values(curriculum).forEach(g => Object.values(g).forEach(d => { d.vocab = d.terms; d.story = d.passage; }));

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_grammar_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }

        // On phones the lesson sits below the module list, so after choosing a module, a unit
        // or the next lesson, the page scrolls to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');
            side.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => { if (Math.abs(side.getBoundingClientRect().top) > 40) side.scrollIntoView({ block: 'start' }); }, 700);

        // "Finish Activity" rewards each module of each unit once, plus one badge per unit
        function completeActivity() {
            markActivityComplete(state.tab);
            const gotStars = award(unitKey('finish-' + state.tab), 5);
            let gotBadge = false;
            const badgeKey = state.level + '|' + unitKey('badge');
            if (gotStars && !progress.awarded[badgeKey]) {
                progress.awarded[badgeKey] = true;
                state.badges += 1;
                document.getElementById('badge-count').textContent = state.badges;
                saveProgress();
                gotBadge = true;
            }
            if (gotBadge) alert(`🎉 Great work! You finished this activity, earned 5 Stars ⭐ and unlocked the Unit ${state.unit} Badge! 🏆`);
            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');
            else alert('✅ You already finished this activity. Try another module, or go to the next lesson! ▶️');
        }

        function nextLesson() {
            const levelData = curriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % unitNumbers.length;
            state.unit = unitNumbers[nextIdx];
            document.getElementById('unit-select').value = state.unit;
            renderContent();
            scrollToLesson(true);

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }
        // The Video button shows 🆕 when this unit's video is new, and "(soon)" when there is none yet
        function updateVideoTabBadge() {
            const btn = document.querySelector('.tab-btn[data-tab="video"]');
            if (!btn) return;
            const v = videoFor(state.level, state.unit);
            btn.textContent = (v && isRecentlyAdded(v.dateAdded) ? '🆕 ' : '') + '📹 0. Video Lesson' + (v ? '' : ' (soon)');
        }

        let ytPlayer = null;
        let ytPollInterval = null;
        let ytAnsweredCheckpoints = new Set();
        let ytApiLoadPromise = null;
        let ytFallbackTimer = null;
        let ytCurrentConfig = null;

        // Stops the video and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

        function renderVideoLesson(contentDiv) {
            stopVideo();
            ytAnsweredCheckpoints = new Set();
            const unitData = curriculum[state.level][state.unit];
            ytCurrentConfig = videoFor(state.level, state.unit);

            if (!ytCurrentConfig) {
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                    <div class="bg-indigo-50 border-2 border-dashed border-indigo-200 rounded-2xl p-10 text-center">
                        <div class="text-5xl mb-4">🎬</div>
                        <p class="text-xl font-bold text-indigo-900 mb-2">Video Coming Soon!</p>
                        <p class="text-gray-600 mb-4">Your teacher is preparing this unit's video. For now, try the other learning modules!</p>
                        <button onclick="switchTab('listening')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Start with Listening</button>
                    </div>`;
                return;
            }

            if (ytCurrentConfig.mp4) { renderMp4Lesson(contentDiv, unitData); return; }
            const watchUrl = 'https://www.youtube.com/watch?v=' + ytCurrentConfig.id;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch the video, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <div id="yt-player-el" class="w-full h-full"></div>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">Loading video player…</p>
                <p class="text-center mt-1"><a href="${watchUrl}" target="_blank" rel="noopener" class="text-sm text-indigo-600 underline">If the video does not play here, tap to open it in YouTube ↗</a></p>`;

            const showFallback = (why) => {
                const msg = document.getElementById('video-msg');
                if (msg) msg.innerHTML = `⚠️ ${why} <a href="${watchUrl}" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">Open the video in YouTube ↗</a>`;
            };
            ytFallbackTimer = setTimeout(() => { if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') showFallback('The video is taking long to load.'); }, 10000);

            const wanted = ytCurrentConfig.id;
            loadYouTubeApi().then(() => {
                if (!ytCurrentConfig || ytCurrentConfig.id !== wanted || !document.getElementById('yt-player-el')) return;
                ytPlayer = new YT.Player('yt-player-el', {
                    videoId: wanted,
                    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
                    events: {
                        onReady: () => { if (ytFallbackTimer) clearTimeout(ytFallbackTimer); const m = document.getElementById('video-msg'); if (m) m.textContent = '▶️ Press play to start the lesson!'; },
                        onStateChange: onYtStateChange,
                        onError: () => showFallback('This video cannot play inside the lesson.')
                    }
                });
            }).catch(() => showFallback('The video player could not load.'));
        }

minutes. If you read every word slowly, you will run out of time, so you must read with a purpose."], [165.02, 166.15, "What is skimming?"], [167.25, 178.5, "Skimming means reading the title, the first sentence of each paragraph and the last paragraph to understand the main idea. It takes about two minutes per passage."], [179.62, 180.71, "And scanning?"], [181.82, 190.44, "Scanning means moving your eyes quickly to find a number, a name or a keyword. You do not read the whole sentence until you find it."], [191.6, 193.05, "Part three: grammar."], [193.92, 198.49, "Grammar focus: Strategy: skim first, then scan for answers."], [198.79, 199.9, "Look at the pattern."], [200.58, 203.45, "Skim to find the main idea of each paragraph."], [204.35, 206.91, "Scan to find a name, a number or a keyword."], [207.87, 215.33, "Spend two minutes skimming, then read the questions. Scan for keywords, and read closely only around the place where the answer appears."], [216.08, 220.14, "Be careful! Don't say: I read every word in the passage slowly."], [222.1, 224.84, "Say: I skim first, then scan for answers."], [225.14, 226.61, "Skim, then scan."], [227.4, 230.01, "Part four: reading. Read and listen."], [230.8, 232.0, "The Time Problem."], [232.3, 235.1, "Dara reads the first reading passage word by word."], [236.1, 239.28, "After thirty minutes she has finished only one passage."], [240.3, 244.0, "Her teacher tells her to skim the headings and topic sentences first."], [245.0, 248.24, "Next she scans for names, dates and numbers in the questions."], [249.23, 252.24, "In the next test she finishes all three passages."], [253.33, 257.23, "Part five: quiz. Five questions. Are you ready?"], [258.08, 260.11, "Skimming is for finding blank."], [260.41, 264.96, "A, the main idea. B, a spelling. C, a verb form."], [268.5, 270.77, "The answer is A: the main idea."], [271.92, 273.85, "Scanning is for finding blank."], [274.15, 278.94, "A, a title. B, specific details. C, the writer's feelings."], [282.5, 285.33, "The answer is B: specific details."], [286.48, 288.22, "How long is the Reading test?"], [288.52, 293.78, "A, 30 minutes. B, 90 minutes. C, 60 minutes."], [297.33, 299.56, "The answer is C: 60 minutes."], [300.72, 302.61, "Dara read each passage blank."], [302.91, 307.83, "A, word by word. B, very quickly. C, not at all."], [311.37, 313.45, "The answer is A: word by word."], [314.58, 316.65, "What did the teacher advise first?"], [316.95, 321.59, "A, guess. B, skim headings. C, translate."], [325.13, 327.28, "The answer is B: skim headings."], [328.5, 331.63, "Part six: speaking. It's your turn to talk."], [332.48, 335.3, "Explain the difference between skimming and scanning."], [344.08, 345.48, "Now listen to Visal."], [345.78, 364.67, "Skimming means reading quickly to understand the main idea, for example by reading the title and the first sentence of each paragraph. Scanning means looking for a specific detail such as a name or a number. I skim first and then scan to answer the questions."], [364.96, 366.5, "Excellent answer, Visal!"], [367.42, 373.33, "Great work! Now you can use eight new words and strategy: skim first, then scan for answers."], [373.63, 377.94, "Today's value is time management. Plan your day and use your time well."], [378.24, 380.78, "See you in Unit seven. Goodbye!"], [381.08, 383.85, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XIE-Unit07-Reading-True-False-and-Not-Given": [[0.35, 5.18, "Hello, everyone! I'm Ms. Emma. Welcome to Online IELTS preparation."], [5.48, 9.04, "Hi! I'm Visal. Let's learn together!"], [9.34, 17.03, "Unit seven: Reading: True, False and Not Given. Today you will decide whether the text agrees, disagrees or says nothing."], [17.33, 19.91, "Here is our lesson map. Let's start!"], [20.87, 24.47, "Part one: words. You will learn eight new words."], [25.32, 26.38, "Statement."], [27.38, 30.49, "Statement means a sentence you must check against the text."], [31.08, 32.87, "Read the statement carefully."], [33.48, 35.58, "Your turn. Say: Statement."], [38.43, 39.5, "Statement."], [40.25, 40.8, "True."], [41.78, 44.15, "True means the text agrees with the statement."], [44.75, 46.2, "The answer is True."], [46.82, 49.33, "Your turn. Say: True."], [52.17, 52.8, "True."], [53.55, 54.45, "False."], [55.45, 57.9, "False means the text says the opposite."], [58.52, 59.98, "The answer is False."], [60.58, 62.78, "Your turn. Say: False."], [65.63, 66.61, "False."], [67.35, 68.35, "Not Given."], [69.35, 72.56, "Not Given means the text has no information about it."], [73.15, 75.43, "If it is not mentioned, write Not Given."], [76.02, 79.06, "Your turn. Say: Not Given."], [81.9, 83.06, "Not Given."], [83.82, 84.86, "Contradict."], [85.85, 88.39, "Contradict means to say the opposite of something."], [88.98, 91.09, "The text contradicts the statement."], [91.68, 94.1, "Your turn. Say: Contradict."], [96.97, 98.04, "Contradict."], [98.78, 99.51, "Assume."], [100.52, 102.67, "Assume means to believe without proof."], [103.28, 104.73, "Do not assume anything."], [105.32, 108.14, "Your turn. Say: Assume."], [111.0, 111.8, "Assume."], [112.55, 113.44, "Evidence."], [114.45, 117.04, "Evidence means facts that support an answer."], [117.65, 119.45, "Find evidence in the text."], [120.05, 122.42, "Your turn. Say: Evidence."], [125.27, 126.21, "Evidence."], [126.95, 128.18, "Exaggerate."], [129.18, 132.83, "Exaggerate means to make something seem bigger or more extreme."], [133.42, 135.76, "The statement exaggerates the facts."], [136.35, 139.18, "Your turn. Say: Exaggerate."], [142.03, 143.14, "Exaggerate."], [143.93, 147.89, "Part two: dialogue. Let's listen to a conversation."], [148.75, 152.22, "Visal, what is the hardest part of True, False, Not Given?"], [153.32, 164.85, "Students use their own knowledge. But you must decide only from the text. If the text says nothing, the answer is Not Given, even if the statement seems true in real life."], [165.95, 168.13, "How is False different from Not Given?"], [169.25, 177.43, "False means the text contradicts the statement. Not Given means the text does not contain enough information to agree or disagree."], [178.52, 180.07, "Any warning words?"], [181.18, 194.07, "Watch for words like all, only, never and always. A statement may exaggerate the text. If the text says most, but the statement says all, the answer is usually False."], [195.23, 196.81, "Part three: grammar."], [197.65, 202.6, "Grammar focus: Strategy: find evidence in the text, not in your head."], [202.9, 204.17, "Look at the pattern."], [204.85, 206.72, "If the text agrees, write True."], [207.62, 211.01, "If the text says nothing, write Not Given, not False."], [211.97, 219.96, "Locate the sentence, compare the meaning, and decide. Never use outside knowledge, and check for extreme words such as all, only and never."], [220.72, 225.12, "Be careful! Don't say: If the text says nothing, I write False."], [227.07, 230.02, "Say: If the text says nothing, I write Not Given."], [230.32, 231.95, "Nothing means Not Given."], [232.73, 235.42, "Part four: reading. Read and listen."], [236.23, 237.76, "A Report on Tea."], [238.06, 241.55, "The text says that most tea drinkers in the town prefer green tea."], [242.57, 244.8, "It does not mention the price of tea."], [245.8, 248.83, "A statement says all tea drinkers prefer green tea."], [249.83, 252.48, "Another statement says tea is cheap in the town."], [253.47, 256.49, "The first statement is False and the second is Not Given."], [257.6, 261.74, "Part five: quiz. Five questions. Are you ready?"], [262.58, 265.36, "If the text says the opposite, the answer is blank."], [265.66, 269.13, "A, Not Given. B, False. C, True."], [272.67, 274.72, "The answer is B: False."], [275.88, 278.59, "If the text has no information, write blank."], [278.89, 282.22, "A, True. B, False. C, Not Given."], [285.77, 287.72, "The answer is C: Not Given."], [288.88, 293.36, "The text says most. The statement says all. The answer is usually blank."], [293.66, 297.01, "A, False. B, True. C, Not Given."], [300.57, 302.79, "The answer is A: False."], [303.95, 306.26, "Which word often shows an exaggeration?"], [306.56, 309.6, "A, often. B, always. C, some."], [313.17, 315.19, "The answer is B: always."], [316.35, 318.72, "The price of tea is blank in the text."], [319.02, 323.49, "A, very high. B, very low. C, not mentioned."], [327.03, 329.04, "The answer is C: not mentioned."], [330.23, 333.06, "Part six: speaking. It's your turn to talk."], [333.92, 336.49, "How do you decide between False and Not Given?"], [345.28, 346.68, "Now listen to Visal."], [346.98, 361.29, "I find the sentence in the text that matches the statement. If the text says the opposite, the answer is False. If the text does not give enough information, the answer is Not Given. I never use my own knowledge to answer."], [361.59, 363.22, "Excellent answer, Visal!"], [364.12, 370.45, "Great work! Now you can use eight new words and strategy: find evidence in the text, not in your head."], [370.75, 376.47, "Today's value is intellectual honesty. Follow the evidence, even when it is inconvenient."], [376.77, 379.23, "See you in Unit eight. Goodbye!"], [379.53, 382.72, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XIE-Unit08-Reading-Matching-Headings": [[0.35, 5.34, "Hello, everyone! I'm Ms. Emma. Welcome to Online IELTS preparation."], [5.64, 9.1, "Hi! I'm Visal. Let's learn together!"], [9.39, 16.19, "Unit eight: Reading: Matching Headings. Today you will match each paragraph to the heading that gives its main idea."], [16.49, 19.27, "Here is our lesson map. Let's start!"], [20.23, 23.55, "Part one: words. You will learn eight new words."], [24.38, 25.38, "Paragraph."], [26.38, 29.5, "Paragraph means a section of text about one idea."], [30.08, 31.77, "Read the first paragraph."], [32.38, 35.19, "Your turn. Say: Paragraph."], [38.03, 39.06, "Paragraph."], [39.82, 40.55, "Heading."], [41.55, 44.01, "Heading  learning, so a heading about money would be wrong."], [175.58, 176.92, "What if I am stuck?"], [178.02, 187.08, "Skip it and return later. Eliminate headings you have already used, and remember there are always more headings than paragraphs."], [188.23, 190.21, "Part three: grammar."], [191.05, 195.73, "Grammar focus: Strategy: choose the main point, not a detail."], [196.03, 197.22, "Look at the pattern."], [197.92, 201.63, "The main point is usually in the first or last sentence of the paragraph."], [202.55, 206.64, "A heading with a shared word can be a trap if it matches only a detail."], [207.6, 216.27, "Read the headings, then match each paragraph by its main point. Be careful of words repeated from the text, because they may point to a detail rather than the whole idea."], [217.02, 221.19, "Be careful! Don't say: I match the heading to one detail."], [223.13, 226.11, "Say: I match the heading to the main point."], [226.41, 227.93, "Choose the main point."], [228.73, 231.37, "Part four: reading. Read and listen."], [232.17, 233.64, "A Matching Task."], [233.94, 237.85, "A passage about city life has five paragraphs and eight headings."], [238.83, 242.45, "The first paragraph mentions money, but its main point is about housing."], [243.43, 246.54, "The teacher reminds students to eliminate used headings."], [247.53, 250.26, "Three headings are extra and match no paragraph."], [251.27, 253.82, "The class discusses why one heading is a trap."], [254.93, 259.05, "Part five: quiz. Five questions. Are you ready?"], [259.92, 262.18, "The main point is usually found blank."], [262.48, 267.26, "A, in a number. B, in the title page. C, in a topic sentence."], [270.8, 273.66, "The answer is C: in a topic sentence."], [274.82, 277.2, "There are blank headings than paragraphs."], [277.5, 281.21, "A, more. B, fewer. C, the same number of."], [284.77, 286.3, "The answer is A: more."], [287.45, 290.09, "A heading matching only a detail is blank."], [290.39, 294.64, "A, a title. B, often wrong. C, always right."], [298.2, 300.5, "The answer is B: often wrong."], [301.65, 303.2, "What should you do when stuck?"], [303.5, 308.06, "A, stop the test. B, guess the same letter. C, skip and return."], [311.6, 314.02, "The answer is C: skip and return."], [315.18, 317.62, "What is the first paragraph mainly about?"], [317.92, 321.14, "A, housing. B, food. C, sport."], [324.7, 326.95, "The answer is A: housing."], [328.17, 331.26, "Part six: speaking. It's your turn to talk."], [332.12, 334.13, "How do you choose the correct heading?"], [342.92, 344.32, "Now listen to Visal."], [344.62, 359.53, "I read all the headings first and then read the topic sentence of each paragraph. I choose the heading that gives the main point of the whole paragraph, not only one detail. I eliminate headings I have already used."], [359.83, 361.52, "Excellent answer, Visal!"], [362.42, 368.29, "Great work! Now you can use eight new words and strategy: choose the main point, not a detail."], [368.58, 373.0, "Today's value is analytical thinking. Look for the pattern underneath the surface."], [373.3, 375.64, "See you in Unit nine. Goodbye!"], [375.94, 378.62, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XIE-Unit09-Reading-Sentence-and-Summary-Completion": [[0.35, 5.97, "Hello, everyone! I'm Ms. Emma. Welcome to Online IELTS preparation."], [6.27, 9.92, "Hi! I'm Visal. Let's learn together!"], [10.22, 17.86, "Unit nine: Reading: Sentence and Summary Completion. Today you will complete sentences and summaries with words from the text."], [18.16, 20.85, "Here is our lesson map. Let's start!"], [21.8, 25.09, "Part one: words. You will learn eight new words."], [25.95, 26.66, "Gap."], [27.65, 29.73, "Gap means an empty space to fill."], [30.32, 31.56, "Fill in each gap."], [32.15, 34.5, "Your turn. Say: Gap."], [37.37, 37.97, "Gap."], [38.72, 39.79, "Word bank."], [40.78, 43.53, "Word bank means a list of words to choose from."], [44.12, 45.71, "Choose from the word bank." he past tense for past dates and I do not give my opinion."], [367.15, 368.78, "Excellent answer, Visal!"], [369.68, 375.57, "Great work! Now you can use eight new words and strategy: verb plus adverb plus data."], [375.88, 381.16, "Today's value is precision of language. Choose your words carefully so others understand you."], [381.46, 384.05, "See you in Unit twelve. Goodbye!"], [384.35, 387.51, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XIE-Unit12-Writing-Task-1-Comparing-Data-and-Overview": [[0.35, 5.08, "Hello, everyone! I'm Ms. Emma. Welcome to Online IELTS preparation."], [5.38, 9.14, "Hi! I'm Visal. Let's learn together!"], [9.44, 18.86, "Unit twelve: Writing Task 1: Comparing Data and Overview. Today you will compare figures in bar charts, pie charts and tables, and write a clear overview."], [19.16, 21.77, "Here is our lesson map. Let's start!"], [22.73, 26.14, "Part one: words. You will learn eight new words."], [26.98, 27.91, "Compare."], [28.92, 31.55, "Compare means to show how things are alike or different."], [32.15, 33.73, "Compare the two groups."], [34.32, 36.83, "Your turn. Say: Compare."], [39.67, 40.66, "Compare."], [41.42, 42.29, "Whereas."], [43.28, 45.98, "Whereas means used to contrast two facts."], [46.58, 49.13, "Men spent more, whereas women saved."], [49.72, 52.02, "Your turn. Say: Whereas."], [54.87, 55.93, "Whereas."], [56.68, 57.66, "Proportion."], [58.65, 60.64, "Proportion means a part of a whole."], [61.25, 62.74, "A large proportion walked."], [63.35, 66.51, "Your turn. Say: Proportion."], [69.37, 70.39, "Proportion."], [71.15, 72.16, "Highest."], [73.15, 75.18, "Highest means the greatest in number."], [75.78, 77.53, "Tea had the highest figure."], [78.12, 80.58, "Your turn. Say: Highest."], [83.43, 84.31, "Highest."], [85.05, 85.98, "Lowest."], [86.98, 89.3, "Lowest means the smallest in number."], [89.88, 91.66, "Coffee had the lowest figure."], [92.25, 94.68, "Your turn. Say: Lowest."], [97.53, 98.38, "Lowest."], [99.15, 10 "Select key figures."], [228.73, 231.35, "Part four: reading. Read and listen."], [232.17, 233.76, "A Bar Chart on Drinks."], [234.06, 237.82, "The bar chart compares the drinks chosen by 200 students."], [238.83, 243.19, "Approximately 80 students chose tea, which was the highest figure."], [244.2, 248.63, "Coffee was chosen by about 60, whereas juice had the lowest figure of 20."], [249.63, 253.18, "Overall, hot drinks were much more popular than cold drinks."], [254.17, 258.0, "The number of tea drinkers was four times the number of juice drinkers."], [259.1, 263.07, "Part five: quiz. Five questions. Are you ready?"], [263.92, 265.28, "An overview blank."], [265.58, 271.2, "A, summarises main features. B, lists every number. C, gives opinions."], [274.77, 277.66, "The answer is A: summarises main features."], [278.82, 280.5, "'Whereas' is used to blank."], [280.8, 284.6, "A, give a reason. B, contrast. C, add."], [288.13, 290.07, "The answer is B: contrast."], [291.22, 293.04, "Approximately means blank."], [293.34, 297.11, "A, exactly. B, never. C, about."], [300.67, 302.34, "The answer is C: about."], [303.48, 305.47, "Which drink had the highest figure?"], [305.77, 309.03, "A, tea. B, coffee. C, juice."], [312.57, 314.17, "The answer is A: tea."], [315.32, 318.43, "Without an overview, the writer loses marks for blank."], [318.73, 322.94, "A, handwriting. B, Task Achievement. C, spelling only."], [326.5, 328.99, "The answer is B: Task Achievement."], [330.2, 333.47, "Part six: speaking. It's your turn to talk."], [334.32, 336.65, "Why is an overview important in Task 1?"], [345.45, 346.81, "Now listen to Visal."], [347.11, 364.22, "An overview summarises the main features of the data, so the reader understands the big picture. It shows that I can select the most important information, and it improves my score for Task Achievement. I always write it after the introduction."], [364.52, 366.24, "Excellent answer, Visal!"], [367.15, 372.48, "Great work! Now you can use eight new words and strategy: select, group, compare."], [372.78, 377.65, "Today's value is analytical thinking. Look for the pattern underneath the surface."], [377.95, 380.66, "See you in Unit thirteen. Goodbye!"], [380.96, 383.62, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XIE-Unit13-Writing-Task-1-Processes-and-Maps": [[0.35, 5.3, "Hello, everyone! I'm Ms. Emma. Welcome to Online IELTS preparation."], [5.6, 8.91, "Hi! I'm Visal. Let's learn together!"], [9.21, 17.72, "Unit thirteen: Writing Task 1: Processes and Maps. Today you will describe a process in order and describe changes on maps."], [18.02, 20.73, "Here is our lesson map. Let's start!"], [21.7, 25.14, "Part one: words. You will learn eight new words."], [25.98, 26.93, "Process."], [27.92, 30.75, "Process means a series of steps that make something."], [31.35, 33.74, "Describe the process of making paper."], [34.35, 36.73, "Your turn. Say: Process."], [39.6, 40.54, "Process."], [41.28, 42.13, "Stage."], [43.15, 45.58, "Stage means one step in a process."], [46.18, 47.66, "The first stage is cutting."], [48.25, 50.79, "Your turn. Say: Stage."], [53.63, 54.59, "Stage."], [55.35, 56.22, "Firstly."], [57.22, 59.59, "Firstly means used to start a sequence."], [60.18, 61.93, "Firstly, wood is collected."], [62.52, 64.91, "Your turn. Say: Firstly."], [67.77, 68.64, "Firstly."], [69.38, 70.65, "Subsequently."], [71.65, 73.81, "Subsequently means after that."], [74.42, 76.35, "Subsequently, it is washed."], [76.95, 79.65, "Your turn. Say: Subsequently."], [82.5, 83.83, "Subsequently."], [84.58, 85.36, "Finally."], [86.35, 88.72, "Finally means used for the last step."], [89.32, 90.84, "Finally, it is packed."], [91.45, 93.95, "Your turn. Say: Finally."], [96.8, 97.64, "Finally."], [98.38, 99.69, "Passive voice."], [100.68, 103.05, "Passive voice means a form like 'is made'."], [103.65, 105.59, "The paper is made in a factory."], [106.18, 109.16, "Your turn. Say: Passive voice."], [112.0, 113.28, "Passive voice."], [114.02, 114.96, "Replace."], [115.95, 118.43, "Replace means to take the place of something."], [119.02, 121.17, "The farm was replaced by a park."], [121.78, 124.22, "Your turn. Say: Replace."], [127.07, 127.93, "Replace."], [128.68, 129.71, "Extend."], [130.72, 132.79, "Extend means to make bigger."], [133.38, 134.79, "The road was extended."], [135.38, 137.97, "Your turn. Say: Extend."], [140.8, 141.92, "Extend."], [142.73, 146.09, "Part two: dialogue. Let's listen to a conversation."], [146.95, 150.33, "Visal, what is special about process diagrams?"], [151.42, 163.1, "They show steps in a sequence. We use the present simple passive, for example, the wood is cut, and sequence words such as firstly, then and finally."], [164.22, 165.44, "What about maps?"], [166.55, 179.21, "Maps show a place at two times. We compare the past and the present using the past simple passive, such as the farm was replaced by a park, and prepositions of place."], [180.32, 181.72, "Do I need an overview?"], [182.82, 192.22, "Yes. For a process, say how many stages there are and what the start and end are. For a maps task, summarise the biggest changes."], [193.37, 194.83, "Part three: grammar."], [195.68, 199.63, "Grammar focus: Strategy: sequence words and the passive."], [199.93, 201.12, "Look at the pattern."], [201.82, 204.29, "Firstly, the wood is cut into small pieces."], [205.18, 207.18, "The farm was replaced by a park."], [208.13, 216.76, "For processes, use the present passive and sequence words. For maps, use the past passive and prepositions of place, and always give an overview."], [217.52, 221.16, "Be careful! Don't say: The wood cut into pieces."], [223.1, 225.67, "Say: The wood is cut into pieces."], [225.97, 227.34, "Use the passive."], [228.13, 230.61, "Part four: reading. Read and listen."], [231.4, 232.87, "How Paper Is Made."], [233.16, 236.58, "The diagram shows how paper is made in six stages."], [237.57, 241.06, "Firstly, trees are cut down and transported to a factory."], [242.07, 245.83, "Subsequently, the wood is cut into small pieces and mixed with water."], [246.83, 248.94, "Then the mixture is pressed and dried."], [249.93, 252.98, "Finally, the paper is rolled and packed for delivery."], [254.07, 258.22, "Part five: quiz. Five questions. Are you ready?"], [259.08, 261.14, "Processes usually use the blank."], [261.44, 265.78, "A, imperative only. B, passive. C, future perfect."], [269.33, 271.4, "The answer is B: passive."], [272.55, 274.64, "Which word starts a sequence?"], [274.94, 278.32, "A, however. B, although. C, firstly."], [281.87, 283.89, "The answer is C: firstly."], [285.05, 287.57, "In maps, the farm was blank by a park."], [287.87, 291.73, "A, replaced. B, replacing. C, replace."], [295.3, 297.39, "The answer is A: replaced."], [298.55, 301.07, "How many stages does the diagram show?"], [301.37, 304.6, "A, ten. B, six. C, three."], [308.13, 309.9, "The answer is B: six."], [311.05, 312.42, "What happens last?"], [312.72, 316.13, "A, cutting. B, mixing. C, packing."], [319.67, 321.61, "The answer is C: packing."], [322.8, 326.03, "Part six: speaking. It's your turn to talk."], [326.88, 329.12, "How do you describe a process diagram?"], [337.92, 339.42, "Now listen to Visal."], [339.72, 357.28, "I begin with an introduction and an overview that says how many stages there are. Then I describe each step in order with sequence words like firstly, then and finally. I use the passive voice because the people who do the actions are not important."], [357.58, 359.31, "Excellent answer, Visal!"], [360.22, 365.61, "Great work! Now you can use eight new words and strategy: sequence words and the passive."], [365.91, 370.92, "Today's value is logical rigor. Follow your reasoning wherever it honestly leads."], [371.22, 373.88, "See you in Unit fourteen. Goodbye!"], [374.18, 376.73, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XIE-Unit14-Writing-Task-2-Essay-Structure-and-Task-Response": [[0.35, 5.28, "Hello, everyone! I'm Ms. Emma. Welcome to Online IELTS preparation."], [5.58, 8.96, "Hi! I'm Visal. Let's learn together!"], [9.26, 20.42, "Unit fourteen: Writing Task 2: Essay Structure and Task Response. Today you will plan and structure a 250-word essay that answers the question fully."], [20.72, 23.35, "Here is our lesson map. Let's start!"], [24.3, 27.49, "Part one: words. You will learn eight new words."], [28.35, 29.46, "Introduction."], [30.45, 32.84, "Introduction means the opening paragraph."], [33.45, 35.14, "Write a short introduction."], [35.75, 38.34, "Your turn. Say: Introduction."], [41.2, 42.29, "Introduction."], [43.05, 44.01, "Thesis."], [45.02, 47.71, "Thesis means your clear position on the question."], [48.32, 50.34, "State your thesis in the introduction."], [50.95, 53.41, "Your turn. Say: Thesis."], [56.27, 57.28, "Thesis."], [58.02, 59.35, "Body paragraph."], [60.35, 63.99, "Body paragraph means a paragraph that develops one main idea."], [64.58, 66.4, "Write two body paragraphs."], [66.98, 69.69, "Your turn. Say: Body paragraph."], [72.53, 74.22, "Body paragraph."], [74.98, 75.98, "Conclusion."], [76.98, 79.19, "Conclusion means the final paragraph."], [79.78, 81.48, "Summarise in the conclusion."], [82.08, 85.03, "Your turn. Say: Conclusion."], [87.87, 88.95, "Conclusion."], [89.68, 91.01, "Task response."], [92.02, 95.0, "Task response means how fully you answer the question."], [95.62, 98.03, "Task Response is a marking criterion."], [98.65, 101.21, "Your turn. Say: Task response."], [104.07, 105.38, "Task response."], [106.12, 106.92, "Argument."], [107.92, 110.32, "Argument means a reason supporting a view."], [110.92, 112.45, "Support each argument."], [113.05, 115.8, "Your turn. Say: Argument."], [118.63, 119.62, "Argument."], [120.38, 121.4, "Example."], [122.38, 125.56, "Example means a specific case that supports an idea."], [126.15, 127.63, "Add a clear example."], [128.22, 130.97, "Your turn. Say: Example."], [133.83, 134.8, "Example."], [135.55, 136.46, "Relevant."], [137.45, 139.61, "Relevant means connected to the question."], [140.22, 141.67, "Keep ideas relevant."], [142.28, 144.88, "Your turn. Say: Relevant."], [147.73, 148.7, "Relevant."], [149.5, 152.84, "Part two: dialogue. Let's listen to a conversation."], [153.68, 156.19, "Visal, how long is Writing Task 2?"], [157.28, 166.47, "You write at least 250 words in about forty minutes. Task 2 carries more marks than Task 1, so plan your time carefully."], [167.58, 169.19, "What is a good structure?"], [170.28, 180.7, "Use four paragraphs: introduction, two body paragraphs and a conclusion. In the introduction, paraphrase the question and give your position."], [181.82, 183.69, "What does Task Response mean?"], [184.78, 195.9, "It means you answer every part of the question, give a clear position and support each idea with reasons and examples. Off-topic ideas lose marks."], [197.03, 198.34, "Part three: grammar."], [199.18, 203.02, "Grammar focus: Strategy: plan, write, check."], [203.32, 204.5, "Look at the pattern."], [205.22, 208.5, "The introduction paraphrases the question and gives my position."], [209.42, 213.28, "Each body paragraph has one main idea with a reason and an example."], [214.23, 222.4, "Spend five minutes planning. Answer every part of the question, keep to one main idea per paragraph, and leave two minutes to check your work."], [223.15, 226.81, "Be careful! Don't say: I start writing without a plan."], [228.77, 231.56, "Say: I plan for five minutes first."], [231.86, 233.19, "Plan before writing."], [234.0, 236.76, "Part four: reading. Read and listen."], [237.57, 238.88, "Planning an Essay."], [239.18, 242.46, "The question asks whether students should wear uniforms."], [243.47, 246.14, "Lina spends five minutes writing a plan."], [247.13, 250.92, "In the introduction she paraphrases the question and states her view."], [251.93, 255.28, "Each body paragraph develops one reason with an example."], [256.27, 260.31, "In the conclusion she summarises her position without new ideas."], [261.4, 265.56, "Part five: quiz. Five questions. Are you ready?"], [266.42, 268.93, "How many words are required in Task 2?"], [269.23, 274.25, "A, 150. B, 400. C, 250."], [277.8, 280.39, "The answer is C: 250."], [281.55, 283.22, "The introduction should blank."], [283.52, 288.1, "A, state your position. B, give new examples. C, end the essay."], [291.63, 294.09, "The answer is A: state your position."], [295.25, 297.92, "Each body paragraph has blank main idea."], [298.22, 301.56, "A, no. B, one. C, five."], [305.1, 306.89, "The answer is B: one."], [308.05, 309.99, "Task Response means blank."], [310.29, 315.72, "A, using long words. B, writing fast. C, answering the whole question."], [319.27, 322.18, "The answer is C: answering the whole question."], [323.35, 324.86, "How long does Lina plan?"], [325.16, 329.41, "A, five minutes. B, twenty minutes. C, one minute."], [332.97, 335.3, "The answer is A: five minutes."], [336.5, 340.23, "Part six: speaking. It's your turn to talk."], [341.08, 343.15, "How do you structure a Task 2 essay?"], [351.95, 353.51, "Now listen to Visal."], [353.81, 372.45, "I plan for five minutes and then write four paragraphs. The introduction paraphrases the question and states my position, and each body paragraph develops one idea with a reason and an example. The conclusion summarises my view without adding new ideas."], [372.75, 374.39, "Excellent answer, Visal!"], [375.28, 380.48, "Great work! Now you can use eight new words and strategy: plan, write, check."], [380.78, 385.24, "Today's value is preparedness. Get ready before an emergency happens."], [385.54, 388.24, "See you in Unit fifteen. Goodbye!"], [388.54, 391.91, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XIE-Unit15-Writing-Task-2-Opinion-and-Discussion-Essays": [[0.35, 5.46, "Hello, everyone! I'm Ms. Emma. Welcome to Online IELTS preparation."], [5.75, 9.35, "Hi! I'm Visal. Let's learn together!"], [9.65, 18.33, "Unit fifteen: Writing Task 2: Opinion and Discussion Essays. Today you will write balanced opinion and discussion essays with a clear position."], [18.63, 21.16, "Here is our lesson map. Let's start!"], [22.1, 25.22, "Part one: words. You will learn eight new words."], [26.08, 27.29, "Opinion essay."], [28.28, 31.87, "Opinion essay means an essay that asks if you agree or disagree."], [32.48, 34.05, "Write an opinion essay."], [34.65, 37.56, "Your turn. Say: Opinion essay."], [40.4, 41.75, "Opinion essay."], [42.48, 43.87, "Discussion essay."], [44.88, 48.17, "Discussion essay means an essay that discusses two views."], [48.78, 51.72, "In a discussion essay, discuss both views."], [52.32, 55.0, "Your turn. Say: Discussion essay."], [57.87, 59.47, "Discussion essay."], [60.22, 61.24, "To what extent."], [62.25, 64.4, "To what extent means how much you agree."], [65.02, 66.58, "To what extent do you agree?"], [67.18, 69.77, "Your turn. Say: To what extent."], [72.6, 73.76, "To what extent."], [74.52, 75.84, "In my opinion."], [76.85, 79.42, "In my opinion means a phrase to give your view."], [80.02, 82.66, "In my opinion, uniforms are useful."], [83.25, 85.95, "Your turn. Say: In my opinion."], [88.8, 90.01, "In my opinion."], [90.75, 91.95, "On the one hand."], [92.95, 96.31, "On the one hand means the first of two contrasting points."], [96.92, 98.99, "On the one hand, it saves money."], [99.58, 102.4, "Your turn. Say: On the one hand."], [105.23, 106.51, "On the one hand."], [107.25, 108.53, "On the other hand."], [109.52, 112.47, "On the other hand means the second contrasting point."], [113.08, 115.22, "On the other hand, it limits choice."], [115.82, 118.34, "Your turn. Say: On the other hand."], [121.2, 122.58, "On the other hand."], [123.35, 124.34, "Concede."], [125.35, 128.1, "Concede means to accept part of an opposing view."], [128.72, 130.89, "I concede that some people disagree."], [131.48, 133.84, "Your turn. Say: Concede."], [136.7, 137.72, "Concede."], [138.48, 139.78, "Nevertheless."], [140.78, 143.01, "Nevertheless means in spite of that."], [143.62, 145.55, "Nevertheless, I believe it is right."], [146.15, 149.17, "Your turn. Say: Nevertheless."], [152.03, 153.23, "Nevertheless."], [154.03, 157.87, "Part two: dialogue. Let's listen to a conversation."], [158.72, 163.17, "Visal, what is the difference between an opinion essay and a discussion essay?"], [164.25, 175.55, "An opinion essay asks what you think, for example, to what extent do you agree? A discussion essay asks you to discuss both views and usually to give your own opinion too."], [176.65, 178.51, "How do I show a clear position?"], [179.62, 191.21, "State your position in the introduction and repeat it in the conclusion. Use phrases such as in my opinion or I strongly believe, and keep the same position throughout."], [192.32, 193.89, "How can I show balance?"], [194.98, 205.16, "You can concede a point from the opposite view, for example, although some people claim it is expensive, I believe the benefits are greater."], [206.3, 207.71, "Part three: grammar."], [208.55, 212.95, "Grammar focus: Strategy: one position, supported throughout."], [213.25, 214.39, "Look at the pattern."], [215.08, 219.09, "Although some people disagree, I believe that uniforms are beneficial."], [219.98, 225.2, "On the one hand, uniforms save money; on the other hand, they limit choice."], [226.13, 235.15, "Identify the essay type, state a clear position in the introduction, and keep it consistent. Use concession to show balance, then explain why your view is stronger."], [235.88, 239.94, "Be careful! Don't say: I change my position in each paragraph."], [241.9, 244.17, "Say: I keep one position throughout."], [244.47, 245.63, "Be consistent."], [246.43, 249.34, "Part four: reading. Read and listen."], [250.13, 251.73, "Uniforms in School."], [252.03, 255.27, "Some people argue that uniforms limit self-expression."], [256.27, 259.74, "On the one hand, I concede that students lose some choice."], [260.73, 264.18, "On the other hand, uniforms save money and reduce pressure."], [265.2, 267.79, "Nevertheless, I believe the benefits are greater."], [268.8, 271.59, "In conclusion, schools should keep uniforms."], [272.7, 276.81, "Part five: quiz. Five questions. Are you ready?"], [277.65, 279.78, "An opinion essay asks blank."], [280.08, 283.58, "A, what you think. B, for a story. C, for a graph."], [287.13, 289.33, "The answer is A: what you think."], [290.48, 292.61, "'On the other hand' introduces a blank."], [292.91, 297.67, "A, spelling. B, contrasting point. C, conclusion only."], [301.23, 303.63, "The answer is B: contrasting point."], [304.78, 306.37, "To concede is to blank."], [306.67, 312.58, "A, refuse everything. B, stop writing. C, accept part of another view."], [316.13, 319.53, "The answer is C: accept part of another view."], [320.68, 322.61, "What is the writer's final position?"], [322.91, 327.48, "A, keep uniforms. B, remove uniforms. C, no opinion."], [331.03, 333.62, "The answer is A: keep uniforms."], [334.78, 336.62, "Your position should be blank."], [336.92, 341.14, "A, hidden. B, consistent. C, changed each paragraph."], [344.7, 346.63, "The answer is B: consistent."], [347.83, 350.83, "Part six: speaking. It's your turn to talk."], [351.68, 354.12, "How do you show a clear position in your essay?"], [362.92, 364.46, "Now listen to Visal."], [364.76, 381.65, "I state my position in the introduction and use it to plan my body paragraphs. I support it with reasons and examples, and I may concede a point from the other side to show balance. In the conclusion, I repeat my position in different words."], [381.95, 383.62, "Excellent answer, Visal!"], [384.52, 389.95, "Great work! Now you can use eight new words and strategy: one position, supported throughout."], [390.25, 395.8, "Today's value is intellectual honesty. Follow the evidence, even when it is inconvenient."], [396.1, 399.05, "See you in Unit sixteen. Goodbye!"], [399.35, 401.83, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XIE-Unit16-Writing-Task-2-Problems-Solutions-and-Advantages": [[0.35, 5.13, "Hello, everyone! I'm Ms. Emma. Welcome to Online IELTS preparation."], [5.43, 9.08, "Hi! I'm Visal. Let's learn together!"], [9.38, 18.61, "Unit sixteen: Writing Task 2: Problems, Solutions and Advantages. Today you will write problem-solution and advantages-disadvantages essays."], [18.91, 21.44, "Here is our lesson map. Let's start!"], [22.4, 25.69, "Part one: words. You will learn eight new words."], [26.55, 27.41, "Problem."], [28.42, 31.29, "Problem means something difficult that needs a solution."], [31.88, 33.85, "Traffic is a serious problem."], [34.45, 36.87, "Your turn. Say: Problem."], [39.73, 40.54, "Problem."], [41.28, 42.2, "Solution."], [43.22, 45.78, "Solution means a way to solve a problem."], [46.38, 48.57, "One solution is public transport."], [49.18, 51.63, "Your turn. Say: Solution."], [54.47, 55.35, "Solution."], [56.12, 57.06, "Cause."], [58.05, 60.49, "Cause means the reason something happens."], [61.08, 62.95, "Pollution has many causes."], [63.55, 66.45, "Your turn. Say: Cause."], [69.3, 70.25, "Cause."], [71.02, 71.83, "Effect."], [72.82, 75.11, "Effect means the result of something."], [75.72, 77.5, "One effect is poor health."], [78.08, 80.61, "Your turn. Say: Effect."], [83.47, 84.26, "Effect."], [85.02, 86.02, "Advantage."], [87.02, 88.81, "Advantage means a good point."], [89.42, 91.64, "A major advantage is lower cost."], [92.25, 94.62, "Your turn. Say: Advantage."], [97.47, 98.58, "Advantage."], [99.35, 100.57, "Disadvantage."], [101.58, 103.57, "Disadvantage means a bad point."], [104.18, 105.97, "A disadvantage is noise."], [106.58, 109.15, "Your turn. Say: Disadvantage."], [112.0, 113.21, "Disadvantage."], [113.95, 114.81, "Outweigh."], [115.82, 118.0, "Outweigh means to be more important than."], [118.62, 120.83, "The benefits outweigh the costs."], [121.42, 123.78, "Your t
