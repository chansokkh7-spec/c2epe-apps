anged or what governments should do."], [168.68, 170.52, "How do I give a strong answer?"], [171.62, 183.17, "State your view, justify it with a reason, and give an example. You can also compare the past and the present, or speculate about the future, using phrases like it depends and I would say."], [184.28, 186.41, "How can I prepare for the whole test?"], [187.52, 199.29, "Take full mock tests under timed conditions and review each module. Ask for feedback, correct your mistakes, and repeat your weak areas every week."], [200.43, 202.13, "Part three: grammar."], [202.98, 207.36, "Grammar focus: Strategy: justify, compare, speculate."], [207.66, 208.95, "Look at the pattern."], [209.65, 213.05, "I would say that online study is growing because it is flexible."], [213.95, 217.22, "It depends on the person, but most students enjoy it."], [218.17, 227.51, "In Part 3, give your view, explain why, and add an example. Use compare and speculate language, and review all four modules with timed mock tests."], [228.25, 232.31, "Be careful! Don't say: I only practise my strongest skill."], [234.27, 237.16, "Say: I practise my weakest area weekly."], [237.46, 238.94, "Work on weak areas."], [239.73, 242.27, "Part four: reading. Read and listen."], [243.07, 244.44, "Discussing Change."], [244.74, 247.89, "The examiner asks how travel has changed over time."], [248.9, 252.15, "Rithy says that travel is faster and cheaper than before."], [253.17, 256.93, "He justifies this with the growth of low-cost flights and online booking."], [257.93, 261.57, "He speculates that more people will travel for study in the future."], [262.57, 265.95, "He ends by saying it depends on each country's policies."], [267.03, 271.27, "Part five: quiz. Five questions. Are you ready?"], [272.12, 274.3, "Part 3 questions are usually blank."], [274.6, 279.0, "A, about maps. B, one word. C, abstract."], [282.53, 284.86, "The answer is C: abstract."], [286.02, 287.49, "To justify is to blank."], [287.79, 292.64, "A, give reasons. B, stop speaking. C, spell."], [296.2, 298.63, "The answer is A: give reasons."], [299.78, 301.62, "'It depends' is used when blank."], [301.92, 307.0, "A, you finish. B, the answer is not simple. C, you do not speak."], [310.57, 313.41, "The answer is B: the answer is not simple."], [314.55, 316.84, "How should you prepare for the whole test?"], [317.14, 321.77, "A, only reading. B, skip Speaking. C, timed mock tests."], [325.33, 328.33, "The answer is C: timed mock tests."], [329.48, 331.17, "What does Rithy speculate?"], [331.47, 337.0, "A, more people will travel for study. B, travel will stop. C, flights will disappear."], [340.57, 344.13, "The answer is A: more people will travel for study."], [345.33, 348.22, "Part six: speaking. It's your turn to talk."], [349.08, 351.55, "How do you prepare for the whole IELTS test?"], [360.35, 361.84, "Now listen to Visal."], [362.14, 378.35, "I take timed mock tests for all four modules and review my mistakes with a teacher. I practise Speaking by giving reasons and examples, and I practise Writing with a plan. Every week I repeat my weakest area until it improves."], [378.65, 380.43, "Excellent answer, Visal!"], [381.32, 387.3, "Great work! Now you can use eight new words and strategy: justify, compare, speculate."], [387.6, 392.11, "Today's value is perseverance. Keep trying, even when it is hard."], [392.41, 399.25, "Congratulations! You have finished Online IELTS preparation. See you in Online TOEFL preparation!"], [399.55, 402.14, "Thank you, Ms. Emma! Bye, everyone!"]]};
        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        function renderContent() {
            let contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            stopVideo();                 // never leave a video playing in the background
            stopTalkTimer();             // ...or a Let's Talk timer running
            updateVideoTabBadge();
            // Always shows the real level and unit (it used to say "A1" on every level)
            document.getElementById('platform-info').textContent = `C2-EPE - ${gradeName(state.level)} (Unit ${state.unit}: ${unitData.title})`;
            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'learn') renderLearn(contentDiv, unitData);
            else if (state.tab === 'terms') renderTerms(contentDiv, unitData);
            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'think') renderThink(contentDiv, unitData);
            else if (state.tab === 'funfact') renderFunFact(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);
            else if (state.tab === 'spelling') renderSpelling(contentDiv, unitData);
            else if (state.tab === 'sentence') renderSentenceBuilding(contentDiv, unitData);
            else if (state.tab === 'summary') renderSummaryWriting(contentDiv, unitData);
            else if (state.tab === 'headline') renderHeadlineWriting(contentDiv, unitData);
            else if (state.tab === 'factopinion') renderFactOpinion(contentDiv, unitData);
            else if (state.tab === 'debate') renderDebateCorner(contentDiv, unitData);
            else if (state.tab === 'discussion') renderDiscussion(contentDiv, unitData);
            else if (state.tab === 'dictation') renderDictation(contentDiv, unitData);
            else if (state.tab === 'review') renderReview(contentDiv, unitData);
            else if (state.tab === 'pronunciation') renderPronunciationDrill(contentDiv, unitData);
            else if (state.tab === 'exam') renderExamPractice(contentDiv, unitData);
            else if (state.tab === 'challenge') renderGoal(contentDiv, unitData);
            else if (state.tab === 'codelab') renderCodeLab(contentDiv, unitData);
        }

        // ===== MY PROGRESS =====
        const ALL_TABS = ['video','learn','terms','quiz','think','funfact','vocabgame','spelling','sentence','summary','headline','factopinion','debate','discussion','dictation','review','pronunciation','exam','challenge'];
        function markActivityComplete(tab) {
            progress.completed = progress.completed || {};
            const key = state.level + '_' + state.unit + '_' + tab;
            if (!progress.completed[key]) { progress.completed[key] = true; saveProgress(); }
        }
        function showMyProgress() {
            const lines = LEVELS_ORDER.map(lvl => {
                let data = null;
                if (lvl === state.level) data = progress;
                else { try { data = JSON.parse(localStorage.getItem(PROGRESS_PREFIX + lvl) || 'null'); } catch (e) {} }
                const done = data && data.completed ? Object.keys(data.completed).filter(k => k.startsWith(lvl + '_')).length : 0;
                const total = Object.keys(curriculum[lvl]).length * ALL_TABS.length;
                return `${gradeName(lvl)}: ${done} / ${total} activities (${Math.round(done / total * 100)}%)${lvl === state.level ? ' ← current' : ''}`;
            }).join('\n');
            const unitDone = ALL_TABS.filter(t => progress.completed && progress.completed[state.level + '_' + state.unit + '_' + t]).length;

        function textCheck(msg, text, need, okText, key, amount) {
            const n = countWords(text);

        function usedUnitWords(text, unitData) {
            const t = ' ' + String(text).toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').replace(/\s+/g, ' ') + ' ';

                const base = w.toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').trim();
                if (!base) return false;
                // whole word, allowing simple endings: s, es, ed, ing
                const re = new RegExp('[ ]' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[ ]') + '(s|es|ed|d|ing)?[ ]');
                return re.test(t);

                        <span class="text-gray-400">Tap words below...</span>
                    </div>
                    <div class="flex flex-wrap gap-2 justify-center mb-4">
                        ${sentenceState.current.map((w,i) => `<button onclick="pickSentenceWord(${i})" id="sw-${i}" class="bg-white shadow px-3 py-2 rounded-lg font-semibold hover:bg-purple-100 cursor-pointer">${w}</button>`).join('')}
                    </div>
                    <div class="flex justify-center gap-4">
                        <button onclick="renderSentenceUI()" class="text-sm text-gray-500 underline cursor-pointer">↩️ Try again</button>
                        <button onclick="renderSentenceBuilding(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="text-sm text-gray-500 underline cursor-pointer">🔁 New Sentence</button>
                    </div>
                    <p id="sentence-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function pickSentenceWord(i) {
            if (sentenceState.done) return;
            const btn = document.getElementById('sw-' + i);
            if (!btn || btn.disabled) return;
            btn.disabled = true;
            btn.classList.add('opacity-30');
            sentenceState.picked.push(sentenceState.current[i]);
            document.getElementById('sentence-built').innerHTML =
                sentenceState.picked.map(w => `<span class="bg-purple-100 px-3 py-1 rounded-lg font-semibold">${w}</span>`).join('');
            const fb = document.getElementById('sentence-fb');
            if (sentenceState.picked.length === sentenceState.correctOrder.length) {
                if (sentenceState.picked.join(' ') === sentenceState.correctOrder.join(' ')) {
                    sentenceState.done = true;
                    fb.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                    markActivityComplete('sentence');
                    fb.textContent = '🎉 Perfect sentence!' + (award(unitKey('sentence-' + sentenceState.target), 3) ? ' (+3 ⭐)' : '');
                    speak(sentenceState.target);
                } else {
                    fb.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                    fb.textContent = '❌ Not quite the right order — tap "Try again"!';
                }
            }
        }

        // ===== 10. ROLE-PLAY / DIALOGUE =====
        // The 🔊 buttons used to be broken (the sentence's quote marks cut the button's code
        // short), so no line could be heard. Lines are now played by their number.
        let rolePlayLines = [];
        let rolePlayHeard = new Set();
        function renderRolePlay(contentDiv, unitData) {
            const sentences = splitSentences(unitData.story);
            rolePlayLines = sentences.map((text, i) => ({ speaker: i % 2 === 0 ? 'A' : 'B', text }));
            rolePlayHeard = new Set();
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">🎤 Role-Play</h2>
                <p class="text-gray-600 mb-4">Practice this with a friend! One person reads 🧑 A, the other reads 👧 B. Tap a line to hear it.</p>
                <div class="bg-pink-50 border-2 border-dashed border-pink-300 rounded-2xl p-6 space-y-3" id="roleplay-lines">
                    ${rolePlayLines.map((l, i) => `
                        <button onclick="playRoleLine(${i})" id="rl-${i}" class="w-full text-left flex items-start gap-3 bg-white p-3 rounded-xl shadow hover:bg-pink-100 cursor-pointer">
                            <span class="text-2xl">${l.speaker === 'A' ? '🧑' : '👧'}</span>
                            <span class="font-semibold text-gray-800">${l.text}</span>
                            <span class="ml-auto text-sm text-blue-500">🔊</span>
                        </button>`).join('')}
                </div>
                <p class="text-center mt-4"><button onclick="finishRolePlay()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">✅ We practiced it!</button></p>
                <p id="roleplay-fb" class="text-center mt-2 font-bold min-h-[1.5rem]"></p>`;
        }
        function playRoleLine(i) {
            speak(rolePlayLines[i].text);
            rolePlayHeard.add(i);
            document.getElementById('rl-' + i).classList.add('ring-2', 'ring-green-400');
        }
        function finishRolePlay() {
            const fb = document.getElementById('roleplay-fb');
            if (rolePlayHeard.size < rolePlayLines.length) {
                fb.className = 'text-center mt-2 font-bold min-h-[1.5rem] text-amber-600';
                fb.textContent = `🔊 Listen to every line first (${rolePlayHeard.size} of ${rolePlayLines.length}), then practice it together!`;
                return;
            }
            fb.className = 'text-center mt-2 font-bold min-h-[1.5rem] text-green-600';
            markActivityComplete('roleplay');
            fb.textContent = '🎉 Great role-play practice!' + starNote(award(unitKey('roleplay'), 2), 2);
        }

        // ===== 11. DICTATION (listen and type) =====
        // The Play button used to be broken, so no sentence could be heard. Fixed, plus a
        // slower replay and a "Next sentence" button.
        let dictationTarget = '';
        let dictationDone = false;
        function renderDictation(contentDiv, unitData) {
            const sentences = storySentences(unitData, 3);
            let pick = sentences[Math.floor(Math.random() * sentences.length)];
            if (sentences.length > 1) while (pick === dictationTarget) pick = sentences[Math.floor(Math.random() * sentences.length)];
            dictationTarget = pick;
            dictationDone = false;
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">✍️ Dictation</h2>
                <p class="text-gray-600 mb-4">Listen carefully, then type exactly what you hear.</p>
                <div class="bg-blue-50 border-2 border-dashed border-blue-300 rounded-2xl p-8 text-center">
                    <div class="flex justify-center gap-3 flex-wrap mb-5">
                        <button onclick="playDictation(false)" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-full shadow-lg cursor-pointer">🔊 Play Sentence</button>
                        <button onclick="playDictation(true)" class="bg-white border border-blue-300 text-blue-700 font-bold px-5 py-3 rounded-full shadow cursor-pointer">🐢 Slowly</button>
                    </div>
                    <div>
                        <textarea id="dictation-input" rows="2" placeholder="Type what you hear..." class="w-full max-w-md p-3 rounded-xl border-2 border-blue-300 text-center font-semibold"></textarea>
                    </div>
                    <div class="flex justify-center gap-3 flex-wrap mt-4">
                        <button onclick="checkDictation()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">✅ Check</button>
                        <button onclick="renderDictation(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="bg-white border border-gray-300 text-gray-600 font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔁 Next sentence</button>
                    </div>
                    <p id="dictation-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function playDictation(slow) {
            if (!('speechSynthesis' in window)) return;
            if (!slow) { speak(dictationTarget); return; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(dictationTarget);
            u.lang = 'en-US'; u.rate = 0.6;
            if (enVoice) u.voice = enVoice;
            window.speechSynthesis.speak(u);
        }
        const normalizeDictation = (s) => String(s).toLowerCase().replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[.!?,;:"()—–-]/g, ' ').replace(/\s+/g, ' ').trim();
        function checkDictation() {
            const input = normalizeDictation(document.getElementById('dictation-input').value);
            const target = normalizeDictation(dictationTarget);
            const fb = document.getElementById('dictation-fb');
            if (!input) { fb.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500'; fb.textContent = '✏️ Listen, then type the sentence first!'; return; }
            if (input === target) {
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                fb.textContent = '🎉 Perfect!' + (dictationDone ? '' : starNote(award(unitKey('dictation-' + target), 3), 3));
                dictationDone = true;
                markActivityComplete('dictation');
            } else {
                // show which words were right, so the student can learn from it
                const want = target.split(' '), got = input.split(' ');
                const right = want.filter((w, i) => got[i] === w).length;
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                fb.innerHTML = `❌ ${right} of ${want.length} words in the right place. The sentence was: "${escapeHtml(dictationTarget)}"`;
            }
        }

        // ===== 13. REVIEW (cumulative picture quiz across all units up to the current one) =====
        let reviewState = { qIndex: 0, score: 0, questions: [], locked: false };
        function renderReview(contentDiv, unitData) {
            const levelData = curriculum[state.level];
            let pool = [];
            Object.keys(levelData).forEach(u => {
                if (parseInt(u) <= state.unit) pool = pool.concat(levelData[u].vocab);
            });
            pool = [...new Set(pool)];
            const questionWords = shuffle(pool).slice(0, Math.min(10, pool.length));
            reviewState = {
                qIndex: 0, score: 0, locked: false,
                questions: questionWords.map(correct => {
                    const home = Object.values(levelData).find(d => d.vocab.includes(correct));
                    return { correct, home, options: shuffle([correct, ...pictureDistractors(correct, pool, home, 3)]) };
                })
            };
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">🔄 Review — Units 1 to ${state.unit}</h2>
                <p class="text-gray-600 mb-4">A quick review of everything you've learned so far in ${state.level}!</p>
                <div id="review-area"></div>`;
            showReviewQuestion();
        }
        function showReviewQuestion() {
            const area = document.getElementById('review-area');
            if (!area) return;
            reviewState.locked = false;
            if (reviewState.qIndex >= reviewState.questions.length) { try { window.C2REPORT && C2REPORT('Review', reviewState.score, reviewState.questions.length, state); } catch (e) {}
                markActivityComplete('review');
                area.innerHTML = `<div class="bg-green-50 border-2 border-green-300 rounded-2xl p-8 text-center">
                    <p class="text-2xl font-bold text-green-700 mb-2">🎉 Review Complete!</p>
                    <p class="text-lg text-gray-700 mb-4">You scored ${reviewState.score} / ${reviewState.questions.length}</p>
                    <button onclick="renderReview(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">🔁 New Review</button>
                </div>`;
                return;
            }
            const q = reviewState.questions[reviewState.qIndex];
            area.innerHTML = `
                <div class="bg-indigo-50 border-2 border-dashed border-indigo-300 rounded-2xl p-8 text-center">
                    <p class="text-sm text-gray-500 mb-2">Question ${reviewState.qIndex + 1} of ${reviewState.questions.length}</p>
                    <div class="text-7xl mb-5">${emojiFor(q.correct, q.home)}</div>
                    <div class="grid grid-cols-2 gap-3" id="review-options">
                        ${q.options.map(o => `<button onclick="answerReview('${escapeJsStr(o)}')" class="bg-white hover:bg-indigo-100 p-4 rounded-xl shadow font-bold text-indigo-800 cursor-pointer">${o}</button>`).join('')}
                    </div>
                    <p id="review-fb" class="mt-4 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function answerReview(chosen) {
            if (reviewState.locked) return;
            reviewState.locked = true;
            document.querySelectorAll('#review-options button').forEach(b => b.disabled = true);
            const q = reviewState.questions[reviewState.qIndex];
            const fb = document.getElementById('review-fb');
            if (chosen === q.correct) {
                fb.className = 'mt-4 font-bold min-h-[1.5rem] text-green-600';
                fb.textContent = '🎉 Correct!' + (award('review-' + q.correct, 1) ? ' (+1 ⭐)' : '');
                reviewState.score++;
            } else {
                fb.className = 'mt-4 font-bold min-h-[1.5rem] text-red-500';
                fb.textContent = `❌ It was "${q.correct}"`;
            }
            reviewState.qIndex++;
            setTimeout(showReviewQuestion, 900);
        }

        // ---------- Microphone check (used by Speaking and Pronunciation Drill) ----------
        // Speech recognition often does not work inside the Hub's secure box or on some phones,
        // so an "I said it" button is always there as well.
        const hasRecognition = () => ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
        const normalizeSpeech = (s) => String(s).toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
        function listenFor(target, msg, btn, onSuccess) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { msg.className = "text-sm mt-3 font-semibold text-amber-600"; msg.textContent = "🎙️ This browser can't check speech — say it out loud and tap “I said it”."; return; }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            btn.disabled = true;
            msg.className = "text-sm mt-3 font-semibold text-blue-600";
            msg.textContent = "🎙️ Get ready...";
            setTimeout(() => {
                let recog;
                try { recog = new SR(); } catch (e) { btn.disabled = false; msg.textContent = "⚠️ The microphone is not available here — tap “I said it” instead."; return; }
                recog.lang = 'en-US';
                recog.maxAlternatives = 3;
                msg.className = "text-sm mt-3 font-semibold text-red-600";
                msg.textContent = "🎙️ Listening... speak now!";
                recog.onresult = (e) => {
                    const alts = Array.from(e.results[0]).map(r => normalizeSpeech(r.transcript));
                    const want = normalizeSpeech(target);
                    const ok = alts.some(a => a === want || (' ' + a + ' ').includes(' ' + want + ' '));
                    if (ok) onSuccess(alts[0]);
                    else { msg.className = "text-sm mt-3 font-semibold text-red-600"; msg.textContent = `❌ I heard "${alts[0]}" - try again!`; }
                };
                recog.onerror = () => {
                    msg.className = "text-sm mt-3 font-semibold text-red-600";
                    msg.textContent = "⚠️ Couldn't hear you — this happens on some phones and inside the Hub. Try again, or tap “I said it”.";
                };
                recog.onend = () => { btn.disabled = false; };
                try { recog.start(); } catch (err) { btn.disabled = false; msg.textContent = "⚠️ The microphone is not available here — tap “I said it” instead."; }
            }, 400);
        }

        // ===== 14. PRONUNCIATION DRILL (every word, microphone check or "I said it") =====
        let pronState = { wIndex: 0, words: [] };
        function renderPronunciationDrill(contentDiv, unitData) {
            pronState = { wIndex: 0, words: shuffle([...new Set(unitData.vocab)]) };
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">🔊 Pronunciation Drill</h2>
                <p class="text-gray-600 mb-4">Practice saying every word in this unit clearly, one at a time (in a new order each time).</p>
                <div id="pron-area"></div>`;
            showPronWord();
        }
        function showPronWord() {
            const area = document.getElementById('pron-area');
            if (!area) return;
            if (pronState.wIndex >= pronState.words.length) {
                markActivityComplete('pronunciation');
                area.innerHTML = `<div class="bg-green-50 border-2 border-green-300 rounded-2xl p-8 text-center">
                    <p class="text-2xl font-bold text-green-700">🎉 You practiced every word in this unit!</p>
                </div>`;
                return;
            }
            const word = pronState.words[pronState.wIndex];
            area.innerHTML = `
                <div class="bg-amber-50 border-2 border-dashed border-amber-300 rounded-2xl p-8 text-center">
                    <p class="text-sm text-gray-500 mb-2">Word ${pronState.wIndex + 1} of ${pronState.words.length}</p>
                    <div class="text-6xl mb-3">${emojiFor(word)}</div>
                    <p class="text-2xl font-bold text-gray-800 mb-3">${word}</p>
                    <button onclick="speak('${escapeJsStr(word)}')" class="text-blue-600 underline text-sm mb-4 cursor-pointer">🔊 Hear it</button>
                    <div class="flex gap-3 flex-wrap justify-center">
                        ${hasRecognition() ? `<button onclick="recordPronWord(this)" class="bg-red-500 hover:bg-red-600 text-white font-bold px-6 py-3 rounded-full shadow-lg cursor-pointer">🔴 Record & Check</button>` : ''}
                        <button onclick="sayPronWord(this)" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-3 rounded-full shadow-lg cursor-pointer">✅ I said it — Next word</button>
                    </div>
                    <p id="pron-msg" class="text-sm mt-3 font-semibold min-h-[1.25rem]"></p>
                </div>`;
        }
        function recordPronWord(btn) {
            const word = pronState.words[pronState.wIndex];
            const msg = document.getElementById('pron-msg');
            listenFor(word, msg, btn, (heard) => {
                msg.className = "text-sm mt-3 font-semibold text-green-600";
                msg.textContent = `⭐ Clear! I heard: "${heard}"` + (award(unitKey('pron-mic-' + word), 2) ? ' (+2 ⭐)' : '');
                setTimeout(nextPronWord, 900);
            });
        }
        function sayPronWord(btn) {
            if (btn) { if (btn.disabled) return; btn.disabled = true; }
            const got = award(unitKey('pron-' + pronState.words[pronState.wIndex]), 1);
            const msg = document.getElementById('pron-msg');
            if (msg) { msg.className = "text-sm mt-3 font-semibold text-green-600"; msg.textContent = got ? "⭐ Great! (+1 ⭐)" : "⭐ Great!"; }
            setTimeout(nextPronWord, 600);
        }
        function nextPronWord() {
            pronState.wIndex++;
            showPronWord();
        }

        // ===== 7. LET'S TALK ABOUT (timed speaking practice) =====
        // The timer now stops when the student leaves this tab (it used to keep counting and give
        // stars in the background), and the stars are given once per unit.
        let talkTimerInterval = null;
        function stopTalkTimer() {
            if (talkTimerInterval) { clearInterval(talkTimerInterval); talkTimerInterval = null; }
        }
        function renderLetsTalk(contentDiv, unitData) {
            stopTalkTimer();
            const talkingPoints = shuffle(unitData.vocab).slice(0, 5);
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">💬 Let's Talk About: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">Practice speaking for 60 seconds. No one is listening - this is just for you to build confidence and fluency!</p>
                <div class="bg-violet-50 border-2 border-dashed border-violet-300 rounded-2xl p-6">
                    <div class="bg-white p-5 rounded-xl shadow-inner mb-4">
                        <p class="text-sm text-violet-600 font-semibold mb-1">Discussion question:</p>
                        <p class="text-xl font-bold text-violet-900">${unitData.question}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-violet-100 mb-4">
                        <p class="text-sm text-violet-600 font-semibold mb-2">💡 Try to use these words:</p>
                        <div class="flex flex-wrap gap-2">
                            ${talkingPoints.map(w => `<span class="bg-violet-100 text-violet-800 px-3 py-1 rounded-full text-sm font-semibold">${w}</span>`).join('')}
                        </div>
                    </div>
                    <div class="text-center">
                        <div id="talk-timer-display" class="text-4xl font-bold text-violet-900 mb-3">60</div>
                        <button onclick="startTalkTimer()" id="talk-start-btn" class="bg-violet-600 hover:bg-violet-700 text-white font-bold px-6 py-3 rounded-full shadow-lg transition cursor-pointer">🎙️ Start Speaking (60s)</button>
                        <p id="talk-msg" class="text-sm mt-3 font-semibold text-violet-700 min-h-[1.25rem]"></p>
                    </div>
                </div>`;
        }
        function startTalkTimer() {
            stopTalkTimer();
            let seconds = 60;
            const display = document.getElementById('talk-timer-display');
            const btn = document.getElementById('talk-start-btn');
            const msg = document.getElementById('talk-msg');
            btn.disabled = true;
            btn.classList.add('opacity-50');
            display.textContent = seconds;
            msg.textContent = '🗣️ Speak out loud now about the topic above!';
            talkTimerInterval = setInterval(() => {
                if (!document.getElementById('talk-timer-display')) { stopTalkTimer(); return; }
                seconds--;
                display.textContent = seconds;
                if (seconds <= 0) {
                    stopTalkTimer();
                    msg.textContent = '🎉 Great job speaking for a full minute!' + (award(unitKey('letstalk'), 4) ? ' (+4 ⭐)' : '');
                    markActivityComplete('letstalk');
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                    btn.textContent = '🔁 Talk Again';
                }
            }, 1000);
        }

        // ===== 8. EXAM PRACTICE (Cambridge-style gap fill + word recognition) =====
        let examState = { gapAnswered: false, tfAnswered: false, gapCorrect: '', tfWord: '', tfIsReal: false };
        const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        function renderExamPractice(contentDiv, unitData) {
            // Prefer a unit word that appears in the story as a whole word, so the gap never
            // leaves a give-away ending like "_____s".
            const words = shuffle([...new Set(unitData.vocab)]);
            let textWords = null;   // set when the gap comes from the text instead of the key terms
            let targetWord = words.find(w => new RegExp('(^|[^A-Za-z])' + escRe(w) + '(?![A-Za-z])', 'i').test(unitData.story));
            let blankRe = targetWord ? new RegExp('(^|[^A-Za-z])' + escRe(targetWord) + '(?![A-Za-z])', 'i') : null;
            if (!targetWord) {
                targetWord = words.find(w => unitData.story.toLowerCase().includes(w.toLowerCase()));
                if (targetWord) blankRe = new RegExp('(^|[^A-Za-z])' + escRe(targetWord) + '[A-Za-z]*', 'i');
            }
            if (!targetWord) {
                // none of the key terms appears word-for-word (e.g. grammar patterns like "Be about to"),
                // so gap a longer word from the text itself
                const cands = [...new Set((unitData.story.match(/[A-Za-z]{6,}/g) || []))];
                targetWord = cands[Math.floor(Math.random() * cands.length)] || unitData.vocab[0];
                textWords = cands.filter(w => w.toLowerCase() !== targetWord.toLowerCase());
                blankRe = new RegExp('(^|[^A-Za-z])' + escRe(targetWord) + '(?![A-Za-z])');
            }
            const blankedStory = escapeHtml(unitData.story.replace(blankRe, (m, pre) => (pre || '') + '@@GAP@@')).replace('@@GAP@@', '<b>_____</b>');  // blank first, then escape, so words like 'R&D' work
            const distractors = (textWords && textWords.length >= 3) ? shuffle(textWords).slice(0, 3) : pictureDistractors(targetWord, unitData.vocab, unitData, 3);
            const gapOptions = shuffle([targetWord, ...distractors]);
            const showReal = Math.random() < 0.5;
            const outsideWord = shuffle(allVocabForLevel(state.level).filter(w => !unitData.vocab.includes(w)))[0] || 'Umbrella';
            examState = { gapAnswered: false, tfAnswered: false, gapCorrect: targetWord,
                tfWord: showReal ? unitData.vocab[Math.floor(Math.random() * unitData.vocab.length)] : outsideWord, tfIsReal: showReal };

            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">🎓 Exam Practice: Unit ${state.unit}</h2>
                <p class="text-gray-600 mb-4">Cambridge-style tasks based on this unit's text and vocabulary.</p>
                <div class="bg-rose-50 border-2 border-dashed border-rose-300 rounded-2xl p-6 mb-4">
                    <p class="font-bold text-rose-900 mb-2">Part A — Gap Fill: choose the word that fits the gap.</p>
                    <p class="bg-white p-4 rounded-xl shadow-inner text-gray-800 mb-3">"${blankedStory}"</p>
                    <div class="flex flex-wrap gap-2" id="exam-gap-options">
                        ${gapOptions.map(o => `<button onclick="answerExamGap('${escapeJsStr(o)}')" class="bg-white border border-rose-200 hover:bg-rose-100 px-4 py-2 rounded-lg font-semibold text-sm cursor-pointer">${o}</button>`).join('')}
                    </div>
                    <p id="exam-gap-msg" class="text-sm mt-3 font-semibold min-h-[1.25rem]"></p>
                </div>
                <div class="bg-rose-50 border-2 border-dashed border-rose-300 rounded-2xl p-6">
                    <p class="font-bold text-rose-900 mb-2">Part B — Word Recognition: True or False?</p>
                    <p class="bg-white p-4 rounded-xl shadow-inner text-gray-800 mb-3">"${examState.tfWord}" is one of this unit's vocabulary words.</p>
                    <div class="flex gap-2" id="exam-tf-options">
                        <button onclick="answerExamTF(true)" class="bg-white border border-rose-200 hover:bg-rose-100 px-5 py-2 rounded-lg font-semibold text-sm cursor-pointer">✅ True</button>
                        <button onclick="answerExamTF(false)" class="bg-white border border-rose-200 hover:bg-rose-100 px-5 py-2 rounded-lg font-semibold text-sm cursor-pointer">❌ False</button>
                    </div>
                    <p id="exam-tf-msg" class="text-sm mt-3 font-semibold min-h-[1.25rem]"></p>
                </div>
                <p class="text-center mt-4"><button onclick="renderExamPractice(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="text-sm text-gray-500 underline cursor-pointer">🔁 New questions</button></p>`;
        }
        function checkExamComplete() {
            if (examState.gapAnswered && examState.tfAnswered) markActivityComplete('exam');
        }
        function answerExamGap(chosen) {
            if (examState.gapAnswered) return;
            examState.gapAnswered = true;
            document.querySelectorAll('#exam-gap-options button').forEach(b => b.disabled = true);
            const msg = document.getElementById('exam-gap-msg');
            if (chosen.toLowerCase() === examState.gapCorrect.toLowerCase()) {
                msg.className = "text-sm mt-3 font-semibold text-green-600";
                msg.textContent = "🎉 Correct!" + (award(unitKey('exam-gap-' + examState.gapCorrect), 3) ? ' (+3 ⭐)' : '');
            } else {
                msg.className = "text-sm mt-3 font-semibold text-red-500";
                msg.textContent = `❌ Not quite — the answer was "${examState.gapCorrect}".`;
            }
            checkExamComplete();
        }
        function answerExamTF(chosenTrue) {
            if (examState.tfAnswered) return;
            examState.tfAnswered = true;
            document.querySelectorAll('#exam-tf-options button').forEach(b => b.disabled = true);
            const msg = document.getElementById('exam-tf-msg');
            if (chosenTrue === examState.tfIsReal) {
                msg.className = "text-sm mt-3 font-semibold text-green-600";
                msg.textContent = "🎉 Correct!" + (award(unitKey('exam-tf-' + examState.tfWord), 2) ? ' (+2 ⭐)' : '');
            } else {
                msg.className = "text-sm mt-3 font-semibold text-red-500";
                msg.textContent = `❌ Not quite — that statement was ${examState.tfIsReal ? 'True' : 'False'}.`;
            }
            checkExamComplete();
        }


        // ===== 9. SUMMARY WRITING =====
        function renderSummaryWriting(contentDiv, unitData) {
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-slate-900 mb-2">📝 Summary Writing</h2>
                <p class="text-gray-600 mb-4">Read the article again, then write a short summary in your own words.</p>
                <div class="bg-slate-50 border-2 border-dashed border-sky-300 rounded-2xl p-6">
                    <p class="text-gray-800 leading-relaxed mb-4 italic">"${unitData.passage}"</p>
                    <textarea id="summary-input" rows="5" placeholder="Write your summary here (2-3 sentences)..." class="w-full p-3 rounded-xl border-2 border-sky-300 font-medium"></textarea>
                    <button onclick="checkSummary()" class="mt-4 bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">✅ I wrote my summary</button>
                    <p id="summary-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        // A summary should be in the student's own words, so pasting the article back is not accepted
        function checkSummary() {
            const unitData = curriculum[state.level][state.unit];
            const val = document.getElementById('summary-input').value;
            const fb = document.getElementById('summary-fb');
            const norm = (t) => String(t).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
            if (norm(val).length > 20 && norm(unitData.passage).includes(norm(val))) {
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-amber-600';
                fb.textContent = '✏️ That is copied from the article — try saying it in your own words!';
                return;
            }
            if (textCheck(fb, val, Math.max(8, minWords() * 2), '🎉 Great summary practice!', unitKey('summary'), 3)) markActivityComplete('summary');
        }

        // ===== 10. HEADLINE WRITING =====
        function renderHeadlineWriting(contentDiv, unitData) {
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-slate-900 mb-2">📰 Headline Writing</h2>
                <p class="text-gray-600 mb-4">Read the article, then write your own short, catchy headline for it.</p>
                <div class="bg-slate-50 border-2 border-dashed border-sky-300 rounded-2xl p-6">
                    <p class="text-gray-800 leading-relaxed mb-4 italic">"${unitData.passage}"</p>
                    <input type="text" id="headline-input" placeholder="Write your headline here..." class="w-full p-3 rounded-xl border-2 border-sky-300 font-bold text-lg" />
                    <button onclick="checkHeadline()" class="mt-4 bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">✅ I wrote my headline</button>
                    <p id="headline-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function checkHeadline() {
            const val = document.getElementById('headline-input').value;
            const fb = document.getElementById('headline-fb');
            const n = countWords(val);
            if (n > 15) { fb.className = 'mt-3 font-bold min-h-[1.5rem] text-amber-600'; fb.textContent = `✏️ Headlines are short — try 3 to 12 words (you have ${n}).`; return; }
            if (textCheck(fb, val, 3, '🎉 Nice headline!', unitKey('headline'), 2)) markActivityComplete('headline');
        }

        // ===== 11. FACT VS OPINION =====
        function renderFactOpinion(contentDiv, unitData) {
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-slate-900 mb-2">🔍 Fact vs Opinion</h2>
                <p class="text-gray-600 mb-4">Read the article passage below. Can you find one fact and one opinion someone might have about this topic?</p>
                <div class="bg-slate-50 border-2 border-dashed border-sky-300 rounded-2xl p-6">
                    <p class="text-gray-800 leading-relaxed mb-5 italic">"${unitData.passage}"</p>
                    <p class="text-sm text-gray-600 mb-3">💡 A <b>fact</b> can be checked and proved. An <b>opinion</b> is what someone thinks or feels (words like <i>best, should, I think</i>).</p>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="font-bold text-sky-700 block mb-2" for="fact-input">📌 A fact from this topic:</label>
                            <textarea id="fact-input" rows="3" placeholder="Write a fact..." class="w-full p-3 rounded-xl border-2 border-sky-300"></textarea>
                        </div>
                        <div>
                            <label class="font-bold text-amber-700 block mb-2" for="opinion-input">💭 An opinion someone might have:</label>
                            <textarea id="opinion-input" rows="3" placeholder="Write an opinion..." class="w-full p-3 rounded-xl border-2 border-amber-300"></textarea>
                        </div>
                    </div>
                    <button onclick="checkFactOpinion()" class="mt-4 bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">✅ I wrote both</button>
                    <p id="factopinion-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function checkFactOpinion() {
            const fact = document.getElementById('fact-input').value;
            const opinion = document.getElementById('opinion-input').value;
            const fb = document.getElementById('factopinion-fb');
            const need = Math.max(3, minWords());
            if (countWords(fact) < need || countWords(opinion) < need) {
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-amber-600';
                fb.textContent = `✏️ Please write at least ${need} words in both boxes.`;
                return;
            }
            if (fact.trim().toLowerCase() === opinion.trim().toLowerCase()) {
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-amber-600';
                fb.textContent = '✏️ A fact and an opinion should be different sentences!';
                return;
            }
            fb.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
            fb.textContent = '🎉 Great critical thinking!' + starNote(award(unitKey('factopinion'), 3), 3);
            markActivityComplete('factopinion');
        }

        // ===== 12. DEBATE CORNER =====
        function renderDebateCorner(contentDiv, unitData) {
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-slate-900 mb-2">🗣️ Debate Corner</h2>
                <p class="text-gray-600 mb-4">Based on this unit's topic, write one point FOR and one point AGAINST a related position.</p>
                <div class="bg-slate-50 border-2 border-dashed border-sky-300 rounded-2xl p-6">
                    <p class="font-semibold text-gray-800 mb-4">💭 ${unitData.question}</p>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="font-bold text-green-700 block mb-2" for="debate-for">✅ Point FOR:</label>
                            <textarea id="debate-for" rows="3" placeholder="Write a point in favor..." class="w-full p-3 rounded-xl border-2 border-green-300"></textarea>
                        </div>
                        <div>
                            <label class="font-bold text-red-700 block mb-2" for="debate-against">❌ Point AGAINST:</label>
                            <textarea id="debate-against" rows="3" placeholder="Write a point against..." class="w-full p-3 rounded-xl border-2 border-red-300"></textarea>
                        </div>
                    </div>
                    <button onclick="checkDebate()" class="mt-4 bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">✅ I wrote both sides</button>
                    <p id="debate-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function checkDebate() {
            const forVal = document.getElementById('debate-for').value;
            const againstVal = document.getElementById('debate-against').value;
            const fb = document.getElementById('debate-fb');
            const need = Math.max(3, minWords());
            if (countWords(forVal) < need || countWords(againstVal) < need) {
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-amber-600';
                fb.textContent = `✏️ Please write at least ${need} words for each side.`;
                return;
            }
            fb.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
            fb.textContent = '🎉 Excellent balanced thinking!' + starNote(award(unitKey('debate'), 3), 3);
            markActivityComplete('debate');
        }

        // ===== 13. DISCUSSION =====
        function renderDiscussion(contentDiv, unitData) {
            const starters = ["I think...", "In my opinion...", "One reason is...", "For example...", "This reminds me of..."];
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-slate-900 mb-2">💭 Discussion</h2>
                <div class="bg-slate-50 border-2 border-dashed border-sky-300 rounded-2xl p-6">
                    <p class="font-semibold text-gray-800 mb-4">❓ ${unitData.question}</p>
                    <p class="text-sm text-gray-500 mb-2">Sentence starters you can use:</p>
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${starters.map(s => `<span class="bg-sky-100 text-sky-800 px-3 py-1 rounded-full text-sm font-medium">${s}</span>`).join('')}
                    </div>
                    <textarea id="discussion-input" rows="4" placeholder="Write your answer here..." class="w-full p-3 rounded-xl border-2 border-sky-300"></textarea>
                    <button onclick="checkDiscussion()" class="mt-4 bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">✅ I shared my answer</button>
                    <p id="discussion-fb" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function checkDiscussion() {
            if (textCheck(document.getElementById('discussion-fb'), document.getElementById('discussion-input').value, Math.max(5, minWords()), '🎉 Thanks for sharing your thoughts!', unitKey('discussion'), 2)) markActivityComplete('discussion');
        }
        // ===== 18. TECH CHALLENGE (practise one skill from this unit every day for a week) =====
        const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        function goalData() {
            progress.goals = progress.goals || {};
            const k = state.level + '|' + state.unit;
            if (!progress.goals[k]) progress.goals[k] = { text: '', days: [false, false, false, false, false, false, false] };
            return progress.goals[k];
        }
        function renderGoal(contentDiv, unitData) {
            const g = goalData();
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">✍️ Practice Challenge: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">Use this lesson's grammar every day for a week.</p>
                <div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-6">
                    <label class="block font-semibold text-slate-900 mb-2" for="goal-text">This week I will practise...</label>
                    <textarea id="goal-text" rows="2" placeholder="e.g. write three sentences a day using this grammar point" class="w-full p-3 border border-gray-300 rounded-lg text-sm">${escapeHtml(g.text)}</textarea>
                    <button onclick="saveGoal()" class="mt-2 bg-slate-600 hover:bg-slate-700 text-white font-bold px-5 py-2 rounded-xl shadow cursor-pointer text-sm">Save My Goal</button>
                    <p id="goal-msg" class="text-sm mt-2 font-semibold min-h-[1.25rem]"></p>
                    <p class="font-semibold text-slate-900 mt-4 mb-2">✅ Tick each day you did it:</p>
                    <div class="grid grid-cols-7 gap-2" id="goal-days">
                        ${DAYS.map((d, i) => `<button onclick="toggleGoalDay(${i})" id="gd-${i}" aria-pressed="${g.days[i]}" class="p-2 rounded-lg border text-sm font-bold cursor-pointer ${g.days[i] ? 'bg-slate-600 text-white border-slate-600' : 'bg-white text-slate-800 border-slate-200'}">${d}<br>${g.days[i] ? '✅' : '⬜'}</button>`).join('')}
                    </div>
                    <p id="goal-days-msg" class="text-sm mt-3 font-semibold text-slate-700 min-h-[1.25rem]">${g.days.filter(Boolean).length} / 7 days</p>
                </div>`;
        }
        function saveGoal() {
            const text = document.getElementById('goal-text').value.trim();
            const msg = document.getElementById('goal-msg');
            if (countWords(text) < 3) { msg.className = 'text-sm mt-2 font-semibold text-red-500'; msg.textContent = '✏️ Write your goal in a few words first.'; return; }
            goalData().text = text;
            saveProgress();
            msg.className = 'text-sm mt-2 font-semibold text-green-600';
            msg.textContent = '🛠️ Challenge saved! Now tick the days you practise.' + (award(unitKey('challenge'), 2) ? ' (+2 ⭐)' : '');
        }
        function toggleGoalDay(i) {
            const g = goalData();
            if (!g.text) { const m = document.getElementById('goal-msg'); m.className = 'text-sm mt-2 font-semibold text-amber-600'; m.textContent = '✏️ Save your goal first, then tick the days.'; return; }
            g.days[i] = !g.days[i];
            saveProgress();
            const b = document.getElementById('gd-' + i);
            b.setAttribute('aria-pressed', g.days[i]);
            b.className = 'p-2 rounded-lg border text-sm font-bold cursor-pointer ' + (g.days[i] ? 'bg-slate-600 text-white border-slate-600' : 'bg-white text-slate-800 border-slate-200');
            b.innerHTML = DAYS[i] + '<br>' + (g.days[i] ? '✅' : '⬜');
            const done = g.days.filter(Boolean).length;
            let note = `${done} / 7 days`;
            if (done >= 5) {
                markActivityComplete('challenge');
                note += ' — 🏆 Amazing! You practised most of the week!' + (award(unitKey('challenge-week'), 5) ? ' (+5 ⭐)' : '');
            }
            document.getElementById('goal-days-msg').textContent = note;
        }


        // ===== HUB EMBED VARIANT: hard-locked to A1 =====
        // One copy of this file exists per grade; only the grade differs.
        function lockLevel(requested) {
            state.level = requested;
            document.getElementById('current-level-display').textContent = gradeName(requested);
            document.getElementById('level-picker-wrap').classList.add('hidden');
            const banner = document.getElementById('locked-level-banner');
            banner.classList.remove('hidden');
            document.getElementById('locked-level-text').textContent = gradeName(requested);
        }

        lockLevel('A1');
        loadProgress();
        populateUnitSelect();
        // Open on the video only when this unit has one; otherwise start with Learn
        state.tab = videoFor(state.level, state.unit) ? 'video' : 'learn';
        highlightActiveTab();
        renderContent();
        // Phones: show the "📚 Modules" button once the module list has scrolled out of view
        if ('IntersectionObserver' in window) {
            new IntersectionObserver(entries => {
                const jump = document.getElementById('modules-jump');
                if (jump) jump.style.display = entries[0].isIntersecting ? 'none' : '';
            }).observe(document.querySelector('.tab-btn[data-tab="challenge"]'));
        }
    </script>
<script src="c2-report.js"></script>
</body>
</html>
