<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2-EPE Digital Academy - Cambodia Grade 9 English</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Key Terms: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-5xl bg-slate-800 text-white rounded-2xl p-6 shadow-lg mb-6 flex justify-between items-center flex-wrap gap-3">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">📗 C2-EPE Cambodia Grade 9 English</h1>
            <p class="text-sm text-slate-300">Cambodia Grade 9 English - Online Class</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap justify-end">
            <div class="bg-amber-400 text-slate-900 px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                ⭐ <span id="star-count">0</span>
            </div>
            <div class="bg-pink-500 text-white px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                🏆 <span id="badge-count">0</span> Badges
            </div>
            <button onclick="showMyProgress()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-sm font-bold border border-white/20 cursor-pointer">📊 My Progress</button>
            <div class="bg-slate-700 px-3 py-2 rounded-xl text-sm font-bold border border-red-500">
                <span id="current-level-display">A1</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-4 gap-6">

        <aside id="module-sidebar" class="bg-white rounded-2xl p-4 shadow-md md:col-span-1 flex flex-col gap-3" style="scroll-margin-top:12px;">
            <div id="level-picker-wrap">
                <h2 class="font-bold text-gray-700 border-b pb-2">Grade</h2>
                <div class="flex flex-col gap-3 mt-3">
                    <button onclick="selectLevel('A1')" id="btn-A1" class="level-btn text-left p-3 rounded-xl bg-slate-700 text-white font-semibold transition shadow cursor-pointer">🌱 A1 Grammar</button>
                    <button onclick="selectLevel('A2')" id="btn-A2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📗 A2 Grammar</button>
                    <button onclick="selectLevel('B1')" id="btn-B1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📘 B1 Grammar</button>
                    <button onclick="selectLevel('B2')" id="btn-B2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📙 B2 Grammar</button>
                    <button onclick="selectLevel('C1')" id="btn-C1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🎓 C1 Grammar</button>
                    <button onclick="selectLevel('C2')" id="btn-C2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">👑 C2 Grammar</button>
                </div>
            </div>
            <div id="locked-level-banner" class="hidden bg-slate-50 border border-red-200 rounded-xl p-3 text-center">
                <p class="text-xs text-red-600 font-semibold">TOPIC</p>
                <p id="locked-level-text" class="text-xl font-bold text-slate-900"></p>
            </div>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700" id="unit-select-label">Select Unit (1 to 25)</h2>
            <select id="unit-select" onchange="updateUnit()" class="p-2 rounded-xl border border-gray-300 bg-gray-50 font-semibold text-slate-900">
                <option value="1">Loading...</option>
            </select>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700">Learning Modules</h2>
            <button onclick="switchTab('video')" data-tab="video" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📹 0. Video Lesson</button>
            <button onclick="switchTab('learn')" data-tab="learn" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📖 1. Learn</button>
            <button onclick="switchTab('terms')" data-tab="terms" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗂️ 2. Key Terms</button>
            <button onclick="switchTab('quiz')" data-tab="quiz" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🧩 3. Quiz</button>
            <button onclick="switchTab('think')" data-tab="think" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💭 4. Think About It</button>
            <button onclick="switchTab('funfact')" data-tab="funfact" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📌 5. Did You Know</button>

            <button onclick="switchTab('summary')" data-tab="summary" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📝 9. Summary Writing</button>
            <button onclick="switchTab('headline')" data-tab="headline" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📰 10. Headline Writing</button>
            <button onclick="switchTab('factopinion')" data-tab="factopinion" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔍 11. Fact vs Opinion</button>
            <button onclick="switchTab('debate')" data-tab="debate" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗣️ 12. Debate Corner</button>
            <button onclick="switchTab('discussion')" data-tab="discussion" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💭 13. Discussion</button>
            <button onclick="switchTab('dictation')" data-tab="dictation" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎧 14. Dictation</button>

    </main>

    <script>
        let state = {

        };

        const curriculum = {"A1": {"1": {"title": "Present Simple and Present Continuous", "terms": ["Habit", "Routine", "Always", "Usually", "Now", "At the moment", "Fact", "Third person"], "passage": "Sokha usually gets up at six o'clock every day. He eats rice and fish for breakfast. At the moment he is walking to school with his friend. His friend is carrying a big bag. They always arrive before the bell.", "question": "Tell me about your daily routine and what you are doing now.", "funfact": "Did you know? Habits and facts use the present simple. Actions now use am, is or are plus verb-ing. Look at the time words to choose."}, "2": {"title": "Past Simple and Past Continuous", "terms": ["Yesterday", "Last week", "Ago", "Regular verb", "Irregular verb", "While", "When", "Interrupt"], "passage": "Last night Dara was doing his homework. Suddenly the lights went out. His mother brought a candle while he was looking for his book. They talked quietly until the electricity came back. Then he finished his work and went to bed.", "question": "Tell me what you did last weekend.", "funfact": "Did you know? Finished past events use the past simple. Actions in progress use was or were plus verb-ing. A short action can interrupt a long one."}, "3": {"title": "Present Perfect", "terms": ["Already", "Yet", "Just", "Ever", "Never", "For", "Since", "Past participle"], "passage": "Rithy and Vanna have been friends since primary school. They have known each other for eight years. They have never argued about anything serious. Vanna has just joined the school football team. Rithy hasn't joined yet, but he has already bought his uniform.", "question": "What have you done this week?", "funfact": "Did you know? Use have or has plus the past participle for experience and for situations that continue to now. For means a period, since means a starting point."}, "4": {"title": "Future Forms: Will and Going To", "terms": ["Plan", "Prediction", "Promise", "Tomorrow", "Next week", "Probably", "Decide", "Offer"], "passage": "Maly is going to visit her grandmother next week. She has already bought the bus ticket. Her brother says he will carry her bag to the station. The sky looks dark, so it is going to rain. Maly promises she will send a message when she arrives.", "question": "What are you going to do after the exam?", "funfact": "Did you know? Use going to for plans and evidence. Use will for quick decisions, offers, promises and general predictions."}, "5": {"title": "Modal Verbs: Can, Must, Should and Have To", "terms": ["Ability", "Permission", "Advice", "Obligation", "Prohibition", "Necessary", "Rule", "Helmet"], "passage": "Students must arrive before seven o'clock. They have to wear a uniform every day. They must not use phones in class. A teacher says students should ask questions when they do not understand. Everyone can use the library after lessons.", "question": "What are some rules at your school?", "funfact": "Did you know? Modal verbs are followed by the base verb. Use should for advice, must or have to for obligation and must not for prohibition."}, "6": {"title": "Comparatives and Superlatives", "terms": ["Compare", "Taller", "The tallest", "More expensive", "The most beautiful", "As ... as", "Than", "Irregular"], "passage": "Dara is taller than his brother. He is also the tallest player in the football team. His new bag is more expensive than mine. Rithy is as fast as Dara, but Sokha is the fastest. Everyone agrees that the match was the best of the season.", "question": "Compare two places you know.", "funfact": "Did you know? Use -er and than to compare two things, and the -est or the most for three or more. Learn the irregular forms good, better, best."}, "7": {"title": "Countable and Uncountable Nouns", "terms": ["Countable", "Uncountable", "Quantity", "Many", "Much", "A few", "A little", "Piece of"], "passage": "Maly buys some rice, a few eggs and a little salt. She does not need much sugar. The seller asks how many mangoes she wants. She says a few, because she doesn't have much money. She carries a lot of bags home.", "question": "What food do you have at home?", "funfact": "Did you know? Use many and a few with countable nouns, much and a little with uncountable nouns, and a lot of with both."}, "8": {"title": "Articles and Prepositions", "terms": ["Article", "Preposition", "In", "On", "At", "Between", "Next to", "Opposite"], "passage": "The school is on a quiet street in Siem Reap. It is opposite the market and next to a small bank. Classes start at seven o'clock in the morning. On Saturday there is a football match at the stadium. Visitors can park between the bank and the library.", "question": "Describe where your school is.", "funfact": "Did you know? Use a before consonants, an before vowels and the for known things. Learn in, on and at for time and place."}, "9": {"title": "First and Second Conditional", "terms": ["Condition", "Result", "If", "Unless", "Probably", "Imaginary", "Were", "Would"], "passage": "If it rains tomorrow, the match will be cancelled. Sophea will pass the exam if she studies every day. If she won a prize, she would give some money to her village. If I were her, I would also buy new books. Unless she studies hard, she will not get a high score.", "question": "What would you do if you won a prize?", "funfact": "Did you know? Use if plus the present simple with will for likely futures, and if plus the past simple with would for imaginary situations."}, "10": {"title": "Passive Voice", "terms": ["Passive", "Active", "Past participle", "Agent", "Make", "Build", "Invent", "Discover"], "passage": "The new bridge was built in 2010. It was designed by a team of engineers. Hundreds of workers were employed during the project. Today the bridge is used by thousands of people every day. It is repaired every year to keep it safe.", "question": "Describe something that is made in your country.", "funfact": "Did you know? Use be plus the past participle when the action is more important than the doer. Add by only when the doer is important."}, "11": {"title": "Reported Speech", "terms": ["Reported speech", "Direct speech", "Say", "Tell", "Ask", "Backshift", "Yesterday", "The next day"], "passage": "The teacher said that the exam was on Friday. She told us to bring two pens. She asked whether we had finished the revision. Sokha said he had studied the night before. The teacher said she would give us more time the next day.", "question": "Tell me something your teacher said today.", "funfact": "Did you know? Move the tense back, change pronouns and time words, and use normal word order in reported questions."}, "12": {"title": "Relative Clauses", "terms": ["Relative pronoun", "Who", "Which", "That", "Whose", "Where", "Defining", "Non-defining"], "passage": "The teacher who teaches us English is very kind. The book that she lent me is interesting. The village where I was born is near a river. My neighbour, whose house is next to ours, is a farmer. Angkor Wat, which is in Siem Reap, is a famous temple.", "question": "Describe a person you admire using a relative clause.", "funfact": "Did you know? Use who for people, which for things, whose for belonging and where for places. Use commas for extra information."}, "13": {"title": "Question Forms and Question Tags", "terms": ["Question word", "Auxiliary", "Subject question", "Tag question", "Negative", "Positive", "Confirm", "Intonation"], "passage": "A teacher asks, Who called you last night? Dara answers that it was his cousin. She asks, Where does your cousin live? He lives in Battambang, doesn't he? The teacher says, You don't like fish, do you?", "question": "Ask me two questions about my school.", "funfact": "Did you know? Use an auxiliary before the subject in questions. In tags, use a negative tag after a positive sentence and a positive tag after a negative one."}, "14": {"title": "Word Formation: Prefixes and Suffixes", "terms": ["Prefix", "Suffix", "Opposite", "Noun", "Adjective", "Adverb", "Base word", "Family of words"], "passage": "Sophea reads a sentence with a gap before the word help. The gap needs an adjective that means 'giving help'. She adds -ful to make helpful. In another sentence she needs an adverb from careful. She writes carefully and checks the spelling.", "question": "How do you use prefixes and suffixes in an exam?", "funfact": "Did you know? Decide if the gap needs a noun, adjective or adverb, then add the right suffix or prefix. Check the spelling of the new word."}, "15": {"title": "Common Phrasal Verbs", "terms": ["Phrasal verb", "Give up", "Look for", "Turn on", "Turn off", "Take off", "Get up", "Find out"], "passage": "Sovann gets up at six every morning. He turns on the light and looks for his school bag. He finds out that he has forgotten his homework. He doesn't give up, and he finishes it quickly. Before he leaves, he turns off the fan.", "question": "Tell me about your morning using phrasal verbs.", "funfact": "Did you know? Learn phrasal verbs as whole phrases in sentences. With pronouns, put the pronoun between the verb and the particle."}, "16": {"title": "Reading Comprehension: Multiple Choice and True/False", "terms": ["Comprehension", "Skim", "Scan", "True", "False", "Evidence", "Detail", "Main idea"], "passage": "Rathana reads a passage about the Tonle Sap Lake. It says the lake grows much larger in the rainy season. Many families catch fish there and live on boats. A statement says the lake is the same size all year. That statement is false because the text says the opposite.", "question": "How do you answer reading questions?", "funfact": "Did you know? Skim first, then scan for each answer. Choose true or false only from the text and check the evidence before you decide."}, "17": {"title": "Cloze Test Strategies", "terms": ["Cloze", "Gap", "Context", "Grammar", "Collocation", "Preposition", "Conjunction", "Option"], "passage": "Sophy reads a cloze text about a school festival. The first gap comes after the word interested. She knows that the missing word is the preposition in. The second gap needs a conjunction to join two ideas. She reads the finished text again to check it.", "question": "How do you do a cloze test?", "funfact": "Did you know? Read the whole text first, predict the type of word for each gap and read each sentence back to check."}, "18": {"title": "Sentence Transformation", "terms": ["Transform", "Same meaning", "Passive", "Reported", "Conditional", "Not as ... as", "Although", "Too ... to"], "passage": "Dara reads: The test was so difficult that nobody finished it. He sees that the structure is so ... that. He rewrites it as: The test was too difficult to finish. He checks that the meaning is the same. He also checks the tense and the spelling.", "question": "How do you rewrite a sentence with the same meaning?", "funfact": "Did you know? Identify the structure in the first sentence, then use a matching structure. Always check that the meaning and the grammar are correct."}, "19": {"title": "Writing: Paragraphs, Letters and Emails", "terms": ["Paragraph", "Topic sentence", "Supporting sentence", "Conclusion", "Greeting", "Closing", "Linking word", "Proofread"], "passage": "Vanna writes an email to her friend Anna. She begins with Dear Anna and thanks her for the invitation. She says she can come on Saturday at four o'clock. She asks Anna what she should bring. She ends with Best wishes and her name.", "question": "Write two sentences about your favourite season.", "funfact": "Did you know? Start with a topic sentence, add supporting sentences and end with a conclusion. In letters and emails, answer every point and use a polite closing."}, "20": {"title": "Exam Day: Review and Time Management", "terms": ["Exam", "Revision", "Time limit", "Plan", "Check", "Calm", "Instruction", "Priority"], "passage": "Rina arrives at the exam hall early and stays calm. She reads all the instructions carefully. She answers the easy questions first. She moves on when a question is too hard. In the last five minutes she checks her answers.", "question": "What is your plan for the exam day?", "funfact": "Did you know? Read the instructions, answer easy questions first, never leave a blank and check your work at the end."}}};
        Object.values(curriculum).forEach(g => Object.values(g).forEach(d => { d.vocab = d.terms; d.story = d.passage; }));

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_grammar_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;

        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }

            const side = document.getElementById('module-sidebar');

        function completeActivity() {
            markActivityComplete(state.tab);

            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');

        }

        function nextLesson() {
            const levelData = curriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }
        // The Video button shows 🆕 when this unit's video is new, and "(soon)" when there is none yet
        function updateVideoTabBadge() {
            const btn = document.querySelector('.tab-btn[data-tab="video"]');
            if (!btn) return;
            const v = videoFor(state.level, state.unit);
            btn.textContent = (v && isRecentlyAdded(v.dateAdded) ? '🆕 ' : '') + '📹 0. Video Lesson' + (v ? '' : ' (soon)');
        }

        let ytPlayer = null;
        let ytPollInterval = null;
        let ytAnsweredCheckpoints = new Set();
        let ytApiLoadPromise = null;
        let ytFallbackTimer = null;
        let ytCurrentConfig = null;

        // Stops the video and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

        function renderVideoLesson(contentDiv) {
            stopVideo();
            ytAnsweredCheckpoints = new Set();
            const unitData = curriculum[state.level][state.unit];
            ytCurrentConfig = videoFor(state.level, state.unit);

            if (!ytCurrentConfig) {
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                    <div class="bg-indigo-50 border-2 border-dashed border-indigo-200 rounded-2xl p-10 text-center">
                        <div class="text-5xl mb-4">🎬</div>
                        <p class="text-xl font-bold text-indigo-900 mb-2">Video Coming Soon!</p>
                        <p class="text-gray-600 mb-4">Your teacher is preparing this unit's video. For now, try the other learning modules!</p>
                        <button onclick="switchTab('listening')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Start with Listening</button>
                    </div>`;
                return;
            }

            if (ytCurrentConfig.mp4) { renderMp4Lesson(contentDiv, unitData); return; }
            const watchUrl = 'https://www.youtube.com/watch?v=' + ytCurrentConfig.id;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch the video, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <div id="yt-player-el" class="w-full h-full"></div>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">Loading video player…</p>
                <p class="text-center mt-1"><a href="${watchUrl}" target="_blank" rel="noopener" class="text-sm text-indigo-600 underline">If the video does not play here, tap to open it in YouTube ↗</a></p>`;

            const showFallback = (why) => {
                const msg = document.getElementById('video-msg');
                if (msg) msg.innerHTML = `⚠️ ${why} <a href="${watchUrl}" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">Open the video in YouTube ↗</a>`;
            };
            ytFallbackTimer = setTimeout(() => { if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') showFallback('The video is taking long to load.'); }, 10000);

            const wanted = ytCurrentConfig.id;
            loadYouTubeApi().then(() => {
                if (!ytCurrentConfig || ytCurrentConfig.id !== wanted || !document.getElementById('yt-player-el')) return;
                ytPlayer = new YT.Player('yt-player-el', {
                    videoId: wanted,
                    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
                    events: {
                        onReady: () => { if (ytFallbackTimer) clearTimeout(ytFallbackTimer); const m = document.getElementById('video-msg'); if (m) m.textContent = '▶️ Press play to start the lesson!'; },
                        onStateChange: onYtStateChange,
                        onError: () => showFallback('This video cannot play inside the lesson.')
                    }
                });
            }).catch(() => showFallback('The video player could not load.'));
        }

        const SUBTITLES = {"OC-X09-Unit01-Present-Simple-and-Present-Continuous": [[0.35, 5.97, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [6.27, 9.42, "Hi! I'm Visal. Let's learn together!"], [9.72, 16.9, "Unit one: Present Simple and Present Continuous. Today you will talk about habits, facts and actions happening now."], [17.2, 20.0, "Here is our lesson map. Let's start!"], [20.97, 24.29, "Part one: words. You will learn eight new words."], [25.15, 26.11, "Habit."], [27.12, 29.32, "Habit means something you do regularly."], [29.92, 31.37, "Reading is my habit."], [31.98, 34.26, "Your turn. Say: Habit."], [37.1, 38.04, "Habit."], [38.78, 39.61, "Routine."], [40.62, 43.22, "Routine means your usual daily activities."], [43.82, 45.93, "My routine starts at six."], [46.52, 48.84, "Your turn. Say: Routine."], [51.7, 52.62, "Routine."], [53.38, 54.44, "Always."], [55.45, 57.25, "Always means every time."], [57.85, 59.69, "She always walks to school."], [60.28, 63.15, "Your turn. Say: Always."], [66.0, 67.13, "Always."], [67.88, 68.92, "Usually."], [69.92, 71.87, "Usually means most of the time."], [72.48, 73.97, "We usually eat rice."], [74.58, 77.03, "Your turn. Say: Usually."], [79.87, 80.79, "Usually."], [81.55, 82.31, "Now."], [83.32, 84.85, "Now means at this moment."], [85.45, 86.73, "He is studying now."], [87.32, 89.68, "Your turn. Say: Now."], [92.53, 93.4, "Now."], [94.15, 95.21, "At the moment."], [96.22, 97.84, "At the moment means right now."], [98.45, 100.11, "I am cooking at the moment."], [100.72, 103.25, "Your turn. Say: At the moment."], [106.1, 107.1, "At the moment."], [107.85, 108.61, "Fact."], [109.62, 111.52, "Fact means something that is true."], [112.12, 114.64, "Water boils at 100 degrees."], [115.25, 117.79, "Your turn. Say: Fact."], [120.63, 121.48, "Fact."], [122.25, 123.26, "Third person."], [124.25, 126.33, "Third person means he, she or it."], [126.92, 128.73, "The third person takes -s."], [129.32, 131.55, "Your turn. Say: Third person."], [134.4, 135.54, "Third person."], [136.33, 140.02, "Part two: dialogue. Let's listen to a conversation."], [140.88, 143.23, "Visal, when do we use the present simple?"], [144.32, 156.38, "We use it for habits, routines and facts. For example, I go to school every day, and the sun rises in the east. With he, she or it we add -s to the verb."], [157.48, 159.19, "And the present continuous?"], [160.28, 173.06, "We use am, is or are plus the -ing form for actions happening now, such as I am writing, or for temporary situations such as She is staying with her aunt this week."], [174.15, 175.85, "Which words help me choose?"], [176.95, 186.46, "Words like always, usually and every day go with the present simple. Words like now, at the moment and look! go with the present continuous."], [187.6, 189.26, "Part three: grammar."], [190.12, 197.36, "Grammar focus: Present simple: V and Vs; present continuous: am and is and are plus V-ing."], [197.66, 198.87, "Look at the pattern."], [199.58, 201.57, "She goes to school every day."], [202.48, 204.46, "She is studying in the library now."], [205.4, 212.65, "Habits and facts use the present simple. Actions now use am, is or are plus verb-ing. Look at the time words to choose."], [213.42, 217.32, "Be careful! Don't say: She go to school every day."], [219.27, 221.66, "Say: She goes to school every day."], [221.96, 223.67, "Add -s with he, she, it."], [224.47, 227.27, "Part four: reading. Read and listen."], [228.07, 229.3, "Sokha's Morning."], [229.6, 232.98, "Sokha usually gets up at six o'clock every day."], [233.97, 236.18, "He eats rice and fish for breakfast."], [237.17, 239.79, "At the moment he is walking to school with his friend."], [240.8, 242.8, "His friend is carrying a big bag."], [243.8, 245.81, "They always arrive before the bell."], [246.9, 250.98, "Part five: quiz. Five questions. Are you ready?"], [251.82, 253.86, "She blank to school every day."], [254.16, 257.75, "A, go. B, goes. C, is going."], [261.3, 263.03, "The answer is B: goes."], [264.18, 266.69, "Look! The children blank in the yard."], [266.99, 270.49, "A, are playing. B, plays. C, play."], [274.03, 275.99, "The answer is A: are playing."], [277.15, 279.4, "Water blank at 100 degrees."], [279.7, 283.1, "A, boils. B, is boiling. C, boil."], [286.67, 288.7, "The answer is A: boils."], [289.85, 292.57, "Which word goes with the present continuous?"], [292.87, 296.36, "A, every day. B, now. C, always."], [299.9, 301.55, "The answer is B: now."], [302.72, 304.75, "What is Sokha doing at the moment?"], [305.05, 309.1, "A, eating rice. B, sleeping. C, walking to school."], [312.63, 314.92, "The answer is C: walking to school."], [316.13, 319.34, "Part six: speaking. It's your turn to talk."], [320.18, 324.16, "Tell me about your daily routine and what you are doing now."], [332.95, 334.38, "Now listen to Visal."], [334.68, 344.86, "I usually get up at six o'clock and eat breakfast with my family. Then I go to school by bicycle. At the moment I am answering a question in English class."], [345.16, 347.0, "Excellent answer, Visal!"], [347.88, 356.7, "Great work! Now you can use eight new words and present simple: v and vs; present continuous: am and is and are plus v-ing."], [357.0, 362.21, "Today's value is self-discipline. Control your habits, so your habits do not control you."], [362.51, 365.02, "See you in Unit two. Goodbye!"], [365.32, 367.86, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit02-Past-Simple-and-Past-Continuous": [[0.35, 5.82, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [6.12, 10.08, "Hi! I'm Visal. Let's learn together!"], [10.38, 17.83, "Unit two: Past Simple and Past Continuous. Today you will talk about finished events and actions in progress in the past."], [18.13, 20.69, "Here is our lesson map. Let's start!"], [21.63, 25.03, "Part one: words. You will learn eight new words."], [25.88, 26.97, "Yesterday."], [27. at is the past continuous?"], [168.62, 178.48, "It is was or were plus the -ing form. We use it for an action in progress at a past time, such as At eight o'clock I was studying."], [179.58, 181.09, "How do we use them together?"], [182.18, 192.02, "We use the past continuous for a longer action and the past simple for a shorter action that interrupted it: I was cooking when the lights went out."], [193.17, 194.86, "Part three: grammar."], [195.72, 201.63, "Grammar focus: Past simple: V-ed; past continuous: was and were plus V-ing."], [201.93, 203.14, "Look at the pattern."], [203.85, 206.14, "I visited my aunt yesterday."], [207.05, 208.96, "I was cooking when the lights went out."], [209.9, 218.1, "Finished past events use the past simple. Actions in progress use was or were plus verb-ing. A short action can interrupt a long one."], [218.85, 222.56, "Be careful! Don't say: I go to the market yesterday."], [224.5, 226.69, "Say: I went to the market yesterday."], [226.99, 228.45, "Use the past form."], [229.27, 231.81, "Part four: reading. Read and listen."], [232.6, 233.94, "A Rainy Evening."], [234.24, 236.5, "Last night Dara was doing his homework."], [237.5, 239.24, "Suddenly the lights went out."], [240.23, 243.02, "His mother brought a candle while he was looking for his book."], [244.03, 246.9, "They talked quietly until the electricity came back."], [247.9, 250.25, "Then he finished his work and went to bed."], [251.33, 255.46, "Part five: quiz. Five questions. Are you ready?"], [256.32, 258.22, "I blank to the market yesterday."], [258.52, 261.71, "A, go. B, was going. C, went."], [265.27, 266.89, "The answer is C: went."], [268.05, 269.92, "She was reading when the phone blank."], [270.22, 273.77, "A, rang. B, was ringing. C, rings."], [277.33, 278.97, "The answer is A: rang."], [280.12, 281.71, "Which is an irregular verb?"], [282.01, 284.93, "A, play. B, see. C, walk."], [288.47, 290.19, "The answer is B: see."], [291.35, 293.68, "What was Dara doing when the lights went out?"], [293.98, 297.59, "A, cooking. B, sleeping. C, his homework."], [301.13, 303.0, "The answer is C: his homework."], [304.15, 306.29, "Which word means 'during the time that'?"], [306.59, 309.86, "A, while. B, ago. C, last."], [313.4, 315.06, "The answer is A: while."], [316.27, 319.44, "Part six: speaking. It's your turn to talk."], [320.28, 322.13, "Tell me what you did last weekend."], [330.92, 332.38, "Now listen to Visal."], [332.68, 343.44, "Last weekend I visited my grandmother in the village. We cooked fish soup together, and I was helping her when my cousin arrived. In the evening we played games until it was dark."], [343.74, 345.81, "Excellent answer, Visal!"], [346.72, 354.33, "Great work! Now you can use eight new words and past simple: v-ed; past continuous: was and were plus v-ing."], [354.63, 358.58, "Today's value is gratitude. Say thank you for your home and family."], [358.88, 361.28, "See you in Unit three. Goodbye!"], [361.58, 364.79, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit03-Present-Perfect": [[0.35, 5.95, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [6.25, 9.71, "Hi! I'm Visal. Let's learn together!"], [10.01, 15.8, "Unit three: Present Perfect. Today you will connect the past with the present using have and has."], [16.1, 18.86, "Here is our lesson map. Let's start!"], [19.8, 23.45, "Part one: words. You will learn eight new words."], [24.32, 25.19, "Already."], [26.18, 28.03, "Already means before now."], [28.62, 30.06, "I have already eaten."], [30.65, 33.01, "Your turn. Say: Already."], [35.87, 36.87, "Already."], [37.62, 38.39, "Yet."], [39.38, 41.87, "Yet means until now (in questions and negatives)."], [42.48, 43.8, "Have you finished yet?"], [44.38, 46.63, "Your turn. Say: Yet."], [49.47, 50.21, "Yet."], [50.95, 51.81, "Just."], [52.82, 55.0, "Just means a very short time ago."], [55.62, 56.9, "She has just left."], [57.48, 59.68, "Your turn. Say: Just."], [62.53, 63.47, "Just."], [64.22, 65.0, "Ever."], [65.98, 68.04, "Ever means at any time in your life."], [68.65, 70.2, "Have you ever been to Siem Reap?"], [70.78, 73.02, "Your turn. Say: Ever."], [75.87, 76.67, "Ever."], [77.42, 78.22, "Never."], [79.22, 81.02, "Never means not at any time."], [81.62, 83.35, "I have never seen snow."], [83.95, 86.41, "Your turn. Say: Never."], [89.27, 90.04, "Never."], [90.78, 91.45, "For."], [92.45, 94.31, "For means a period of time."], [94.92, 96.74, "I have lived here for five years."], [97.35, 99.58, "Your turn. Say: For."], [102.43, 103.19, "For."], [103.95, 104.81, "Since."], [105.82, 107.76, "Since means from a point in time."], [108.35, 111.25, "I have studied English since 2022."], [111.85, 114.23, "Your turn. Say: Since."], [117.1, 118.07, "Since."], [118.82, 120.15, "Past participle."], [121.15, 124.08, "Past participle means the third form of the verb."], [124.68, 127.09, "Eaten is the past participle of eat."], [127.68, 130.47, "Your turn. Say: Past participle."], [133.33, 135.34, "Past participle."], [136.13, 139.91, "Part two: dialogue. Let's listen to a conversation."], [140.75, 143.18, "Visal, when do we use the present perfect?"], [144.28, 156.46, "We use have or has plus the past participle to talk about experiences, recent actions and situations that continue to now. For example, I have visited Angkor Wat."], [157.55, 159.16, "How do for and since differ?"], [160.25, 173.14, "We use for with a period of time, such as for three years, and since with a starting point, such as since 2021. Both are used with the present perfect."], [174.25, 176.15, "What about already, yet and just?"], [177.25, 187.16, "Already and just go before the past participle. Yet goes at the end of questions and negatives: Have you finished yet? I haven't finished yet."], [188.3, 189.85, "Part three: grammar."], [190.68, 195.1, "Grammar focus: Present perfect: have and has plus past participle."], [195.4, 196.63, "Look at the pattern."], [197.32, 199.37, "I have lived here for five years."], [200.28, 202.22, "She has just finished her homework."], [203.17, 212.06, "Use have or has plus the past participle for experience and for situations that continue to now. For means a period, since means a starting point."], [212.82, 216.76, "Be careful! Don't say: I live here since 2020."], [218.7, 222.16, "Say: I have lived here since 2020."], [222.46, 224.54, "Use present perfect with since."], [225.33, 228.14, "Part four: reading. Read and listen."], [228.93, 230.29, "A Long Friendship."], [230.59, 233.59, "Rithy and Vanna have been friends since primary school."], [234.6, 236.6, "They have known each other for eight years."], [237.6, 240.18, "They have never argued about anything serious."], [241.17, 243.82, "Vanna has just joined the school football team."], [244.8, 248.35, "Rithy hasn't joined yet, but he has already bought his uniform."], [249.47, 253.33, "Part five: quiz. Five questions. Are you ready?"], [254.18, 256.37, "I blank in Phnom Penh for ten years."], [256.67, 260.26, "A, have lived. B, lived. C, am living."], [263.8, 265.76, "The answer is A: have lived."], [266.92, 269.95, "She has studied English blank 2022."], [270.25, 273.31, "A, during. B, since. C, for."], [276.87, 279.07, "The answer is B: since."], [280.22, 281.59, "Have you finished blank?"], [281.89, 284.86, "A, already. B, just. C, yet."], [288.4, 290.18, "The answer is C: yet."], [291.32, 293.48, "How long have the friends known each other?"], [293.78, 297.68, "A, eight years. B, two years. C, a week."], [301.23, 303.2, "The answer is A: eight years."], [304.35, 306.47, "The past participle of 'eat' is blank."], [306.77, 309.83, "A, eating. B, eaten. C, ate."], [313.37, 315.09, "The answer is B: eaten."], [316.3, 319.19, "Part six: speaking. It's your turn to talk."], [320.05, 321.65, "What have you done this week?"], [330.45, 331.88, "Now listen to Visal."], [332.18, 344.24, "This week I have finished two projects and I have studied for my English test. I have also helped my mother at home. I haven't visited my friends yet, but I plan to see them on Sunday."], [344.54, 346.21, "Excellent answer, Visal!"], [347.12, 353.21, "Great work! Now you can use eight new words and present perfect: have and has plus past participle."], [353.51, 357.49, "Today's value is reflection. Think about what you learned and how you grew."], [357.79, 360.15, "See you in Unit four. Goodbye!"], [360.45, 363.01, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit04-Future-Forms-Will-and-Going-To": [[0.35, 5.58, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [5.88, 9.3, "Hi! I'm Visal. Let's learn together!"], [9.6, 16.18, "Unit four: Future Forms: Will and Going To. Today you will talk about plans, predictions and promises."], [16.48, 19.17, "Here is our lesson map. Let's start!"], [20.13, 23.32, "Part one: words. You will learn eight new words."], [24.18, 24.89, "Plan."], [25.88, 28.3, "Plan means something you have decided to do."], [28.92, 30.45, "I have a plan for Sunday."], [31.05, 33.37, "Your turn. Say: Plan."], [36.2, 37.0, "Plan."], [37.75, 38.66, "Prediction."], [39.65, 42.04, "Prediction means a statement about the future."], [42.65, 44.31, "It is a weather prediction."], [44.92, 47.29, "Your turn. Say: Prediction."], [50.13, 51.12, "Prediction."], [51.88, 52.76, "Promise."], [53.75, 56.48, "Promise means a statement that you will do something."], [57.08, 58.4, "I promise to help."], [58.98, 61.38, "Your turn. Say: Promise."], [64.23, 65.23, "Promise."], [65.98, 66.88, "Tomorrow."], [67.88, 69.99, "Tomorrow means the day after today."], [70.58, 72.37, "I will call you tomorrow."], [72.98, 75.25, "Your turn. Say: Tomorrow."], [78.1, 79.18, "Tomorrow."], [79.92, 80.98, "Next week."], [81.98, 84.12, "Next week means the week after this one."], [84.72, 86.56, "We are going to travel next week."], [87.15, 89.78, "Your turn. Say: Next week."], [92.63, 93.75, "Next week."], [94.52, 95.44, "Probably."], [96.45, 98.29, "Probably means very likely."], [98.88, 100.49, "It will probably rain."], [101.08, 103.56, "Your turn. Say: Probably."], [106.4, 107.31, "Probably."], [108.05, 109.0, "Decide."], [110.02, 112.07, "Decide means to make a choice."], [112.68, 114.65, "I have decided to study law."], [115.25, 118.05, "Your turn. Say: Decide."], [120.9, 121.94, "Decide."], [122.68, 123.51, "Offer."], [124.52, 127.17, "Offer means to say you will do something for someone."], [127.75, 128.9, "I'll carry your bag."], [129.52, 131.8, "Your turn. Say: Offer."], [134.63, 135.59, "Offer."], [136.4, 139.98, "Part two: dialogue. Let's listen to a conversation."], [140.82, 143.84, "Visal, what is the difference between will and going to?"], [144.95, 157.73, "We use going to for plans and for predictions with evidence, for example, Look at those clouds! It is going to rain. We use will for quick decisions, offers, promises and general predictions."], [158.82, 160.39, "Can you give examples?"], [161.48, 170.03, "I am going to study medicine, because I have decided. The phone is ringing, so I'll answer it. I promise I will help you tomorrow."], [171.12, 172.63, "How do we make negatives?"], [173.72, 185.51, "We say will not or won't, and am not, is not or are not going to. In questions we put will before the subject, and we put am, is or are before the subject with going to."], [186.67, 188.17, "Part three: grammar."], [189.02, 194.03, "Grammar focus: Will plus base verb; be going to plus base verb."], [194.34, 195.62, "Look at the pattern."], [196.32, 199.08, "I am going to study medicine because I have decided."], [199.98, 202.12, "The phone is ringing, so I'll answer it."], [203.07, 209.71, "Use going to for plans and evidence. Use will for quick decisions, offers, promises and general predictions."], [210.45, 214.66, "Be careful! Don't say: It will rain! Look at the clouds."], [216.6, 219.79, "Say: It is going to rain! Look at the clouds."], [220.09, 221.82, "Evidence needs going to."], [222.63, 225.06, "Part four: reading. Read and listen."], [225.87, 227.41, "Plans for the Holiday."], [227.71, 230.55, "Maly is going to visit her grandmother next week."], [231.53, 233.43, "She has already bought the bus ticket."], [234.43, 237.19, "Her brother says he will carry her bag to the station."], [238.2, 240.49, "The sky looks dark, so it is going to rain."], [241.5, 244.76, "Maly promises she will send a message when she arrives."], [245.87, 249.98, "Part five: quiz. Five questions. Are you ready?"], [250.85, 253.61, "Look at those clouds! It blank rain."], [253.91, 257.62, "A, goes to. B, is going to. C, will not."], [261.17, 263.58, "The answer is B: is going to."], [264.75, 267.2, "The phone is ringing. I blank answer it."], [267.5, 271.44, "A, am going to. B, go to. C, will."], [275.0, 276.82, "The answer is C: will."], [277.98, 279.23, "Plans use blank."], [279.53, 283.25, "A, going to. B, will only. C, past simple."], [286.8, 288.53, "The answer is A: going to."], [289.68, 291.71, "What is Maly going to do next week?"], [292.01, 297.09, "A, study abroad. B, visit her grandmother. C, buy a house."], [300.63, 303.27, "The answer is B: visit her grandmother."], [304.42, 306.02, "A promise uses blank."], [306.32, 309.45, "A, did. B, has. C, will."], [313.0, 314.94, "The answer is C: will."], [316.13, 319.21, "Part six: speaking. It's your turn to talk."], [320.05, 321.84, "What are you going to do after the exam?"], [330.65, 332.15, "Now listen to Visal."], [332.45, 343.21, "I am going to rest for a few days and then visit my relatives in the province. I will also help my parents at home. I promise that I will keep studying English every day."], [343.51, 345.17, "Excellent answer, Visal!"], [346.08, 352.78, "Great work! Now you can use eight new words and will plus base verb; be going to plus base verb."], [353.08, 357.09, "Today's value is foresight. Prepare today for the world of tomorrow."], [357.39, 359.89, "See you in Unit five. Goodbye!"], [360.19, 363.25, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit05-Modal-Verbs-Can-Must-Should-and-Have-To": [[0.35, 5.56, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [5.86, 9.27, "Hi! I'm Visal. Let's learn together!"], [9.57, 18.04, "Unit five: Modal Verbs: Can, Must, Should and Have To. Today you will talk about ability, rules, advice and obligation."], [18.34, 20.91, "Here is our lesson map. Let's start!"], [21.87, 24.95, "Part one: words. You will learn eight new words."], [25.78, 26.63, "Ability."], [27.65, 30.08, "Ability means being able to do something."], [30.68, 32.25, "Swimming is an ability."], [32.85, 35.36, "Your turn. Say: Ability."], [38.2, 39.22, "Ability."], [39.98, 40.88, "Permission."], [41.88, 44.49, "Permission means allowing someone to do something."], [45.08, 46.56, "Ask for permission."], [47.15, 49.8, "Your turn. Say: Permission."], [52.67, 53.55, "Permission."], [54.32, 55.18, "Advice."], [56.18, 59.05, "Advice means an idea about what someone should do."], [59.65, 61.16, "Give her some advice."], [61.75, 64.52, "Your turn. Say: Advice."], [67.37, 68.56, "Advice."], [69.32, 70.47, "Obligation."], [71.48, 73.9, "Obligation means something you must do."], [74.52, 76.2, "Homework is an obligation."], [76.82, 79.5, "Your turn. Say: Obligation."], [82.37, 83.5, "Obligation."], [84.25, 85.27, "Prohibition."], [86.28, 88.82, "Prohibition means a rule that says you must not."], [89.42, 90.95, "Smoking is a prohibition."], [91.55, 94.2, "Your turn. Say: Prohibition."], [97.07, 98.06, "Prohibition."], [98.82, 99.91, "Necessary."], [100.92, 102.6, "Necessary means needed."], [103.22, 105.34, "It is necessary to wear a helmet."], [105.95, 109.09, "Your turn. Say: Necessary."], [111.93, 113.14, "Necessary."], [113.88, 114.77, "Rule."], [115.78, 118.39, "Rule means something you must follow."], [118.98, 120.61, "Follow the school rules."], [121.22, 123.47, "Your turn. Say: Rule."], [126.33, 127.17, "Rule."], [127.92, 128.77, "Helmet."], [129.78, 132.09, "Helmet means a hard hat for safety."], [132.68, 133.8, "Wear a helmet."], [134.42, 136.76, "Your turn. Say: Helmet."], [139.6, 140.49, "Helmet."], [141.3, 145.21, "Part two: dialogue. Let's listen to a conversation."], [146.05, 148.26, "Visal, what do modal verbs do?"], [149.35, 165.47, "Modal verbs such as can, must and should come before the base verb. They show ability, rules, advice and obligation. They have no -s in the third person, so we say she can swim, not she cans swim."], [166.58, 169.26, "What is the difference between must and have to?"], [170.35, 185.67, "Must is often a strong personal feeling, for example, I must study harder. Have to is for rules and outside obligation, such as Students have to wear uniforms. Must not means it is forbidden."], [186.78, 188.29, "How do we give advice?"], [189.38, 194.57, "We use should and shouldn't: You should drink more water. You shouldn't stay up late."], [195.7, 197.18, "Part three: grammar."], [198.02, 200.88, "Grammar focus: Modal plus base verb."], [201.18, 202.34, "Look at the pattern."], [203.05, 204.66, "She can swim very well."], [205.55, 208.18, "Students must not use phones in class."], [209.13, 216.22, "Modal verbs are followed by the base verb. Use should for advice, must or have to for obligation and must not for prohibition."], [216.98, 220.48, "Be careful! Don't say: She cans swim very well."], [222.43, 224.75, "Say: She can swim very well."], [225.05, 226.63, "No -s after a modal."], [227.43, 230.11, "Part four: reading. Read and listen."], [230.9, 232.1, "School Rules."], [232.4, 234.97, "Students must arrive before seven o'clock."], [235.97, 238.19, "They have to wear a uniform every day."], [239.2, 241.47, "They must not use phones in class."], [242.47, 246.3, "A teacher says students should ask questions when they do not understand."], [247.3, 250.08, "Everyone can use the library after lessons."], [251.17, 254.97, "Part five: quiz. Five questions. Are you ready?"], [255.82, 257.53, "She blank swim very well."], [257.83, 261.44, "A, cans. B, is can. C, can."], [265.0, 266.74, "The answer is C: can."], [267.88, 270.84, "You blank drink more water. It is good advice."], [271.14, 274.62, "A, should. B, must not. C, can."], [278.17, 279.91, "The answer is A: should."], [281.05, 284.6, "Students blank use phones in class. It is forbidden."], [284.9, 288.56, "A, can. B, must not. C, should."], [292.1, 294.67, "The answer is B: must not."], [295.82, 296.91, "Which is correct?"], [297.21, 301.34, "A, She cans sing.. B, She can to sing.. C, She can sing.."], [304.9, 307.18, "The answer is C: She can sing.."], [308.32, 310.14, "Students have to wear blank."], [310.44, 315.16, "A, a uniform. B, pyjamas. C, a helmet only."], [318.7, 320.7, "The answer is A: a uniform."], [321.9, 324.81, "Part six: speaking. It's your turn to talk."], [325.65, 327.43, "What are some rules at your school?"], [336.22, 337.79, "Now listen to Visal."], [338.09, 351.14, "At my school we must arrive before seven o'clock and we have to wear a uniform. We must not use phones in class. We should respect our teachers, and we can use the library after lessons."], [351.44, 353.11, "Excellent answer, Visal!"], [354.02, 358.46, "Great work! Now you can use eight new words and modal plus base verb."], [358.76, 362.27, "Today's value is respect. Thank the people who help us."], [362.57, 364.94, "See you in Unit six. Goodbye!"], [365.24, 368.09, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit06-Comparatives-and-Superlatives": [[0.35, 6.02, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [6.32, 9.77, "Hi! I'm Visal. Let's learn together!"], [10.07, 17.25, "Unit six: Comparatives and Superlatives. Today you will compare two or more people, places and things."], [17.55, 20.14, "Here is our lesson map. Let's start!"], [21.1, 24.26, "Part one: words. You will learn eight new words."], [25.12, 25.99, "Compare."], [26.98, 29.86, "Compare means to show how things are alike or different."], [30.45, 32.05, "Compare the two cities."], [32.65, 35.41, "Your turn. Say: Compare."], [38.27, 39.14, "Compare."], [39.88, 40.69, "Taller."], [41.68, 43.15, "Taller means more tall."], [43.75, 45.34, "Dara is taller than Rith."], [45.95, 48.58, "Your turn. Say: Taller."], [51.43, 52.23, "Taller."], [52.98, 54.07, "The tallest."], [55.05, 57.55, "The tallest means more tall than all others."], [58.15, 59.93, "He is the tallest in class."], [60.52, 63.81, "Your turn. Say: The tallest."], [66.67, 67.75, "The tallest."], [68.48, 69.7, "More expensive."], [70.72, 73.41, "More expensive means costing more than another."], [74.02, 75.82, "This bag is more expensive."], [76.42, 79.17, "Your turn. Say: More expensive."], [82.03, 83.3, "More expensive."], [84.05, 85.36, "The most beautiful."], [86.35, 89.28, "The most beautiful means more beautiful than all others."], [89.88, 91.79, "Angkor Wat is the most beautiful."], [92.38, 95.42, "Your turn. Say: The most beautiful."], [98.27, 100.15, "The most beautiful."], [100.92, 101.86, "As ... as."], [102.85, 104.81, "As ... as means equal in some way."], [105.42, 107.17, "He is as tall as his father."], [107.78, 110.18, "Your turn. Say: As ... as."], [113.03, 114.2, "As ... as."], [114.95, 115.6, "Than."], [116.62, 118.79, "Than means used to compare two things."], [119.38, 120.63, "She is older than me."], [121.22, 123.03, "Your turn. Say: Than."], [125.87, 126.53, "Than."], [127.28, 128.45, "Irregular."], [129.45, 132.1, "Irregular means not following the usual rule."], [132.68, 133.91, "Good becomes better."], [134.52, 137.13, "Your turn. Say: Irregular."], [140.0, 141.29, "Irregular."], [142.1, 145.45, "Part two: dialogue. Let's listen to a conversation."], [146.28, 148.79, "Visal, how do we make comparatives?"], [149.88, 160.64, "For short adjectives we add -er, such as taller and faster. For long adjectives we use more, such as more expensive. We use than to compare two things."], [161.75, 163.2, "And superlatives?"], [164.32, 176.49, "We use the plus -est for short adjectives, such as the tallest, and the most for long ones, such as the most beautiful. We use a superlative to compare three or more things."], [177.58, 179.3, "Are there irregular forms?"], [180.42, 190.44, "Yes. Good becomes better and the best, and bad becomes worse and the worst. We also say as tall as to show that two things are equal."], [191.6, 193.26, "Part three: grammar."], [194.12, 200.28, "Grammar focus: Comparative: -er and more plus than; superlative: the -est and the most."], [200.58, 201.91, "Look at the pattern."], [202.62, 204.48, "Dara is taller than his brother."], [205.38, 208.37, "Angkor Wat is the most beautiful temple in Cambodia."], [209.33, 216.16, "Use -er and than to compare two things, and the -est or the most for three or more. Learn the irregular forms good, better, best."], [216.92, 220.24, "Be careful! Don't say: He is more tall than me."], [222.2, 224.12, "Say: He is taller than me."], [224.42, 226.02, "Short adjectives take -er."], [226.83, 229.46, "Part four: reading. Read and listen."], [230.27, 231.78, "Comparing Friends."], [232.08, 233.76, "Dara is taller than his brother."], [234.77, 237.46, "He is also the tallest player in the football team."], [238.47, 240.83, "His new bag is more expensive than mine."], [241.83, 245.55, "Rithy is as fast as Dara, but Sokha is the fastest."], [246.57, 249.39, "Everyone agrees that the match was the best of the season."], [250.5, 254.37, "Part five: quiz. Five questions. Are you ready?"], [255.22, 257.03, "Dara is blank than his brother."], [257.33, 260.76, "A, taller. B, tallest. C, more tall."], [264.3, 266.02, "The answer is A: taller."], [267.18, 269.26, "This is blank film I have ever seen."], [269.56, 272.99, "A, best. B, the best. C, the better."], [276.53, 278.48, "The answer is B: the best."], [279.62, 281.22, "Beautiful becomes blank."], [281.52,
