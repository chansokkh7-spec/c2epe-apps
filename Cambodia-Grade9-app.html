e."], [52.25, 53.2, "Quantity."], [54.22, 56.52, "Quantity means an amount of something."], [57.12, 58.95, "A large quantity of rice."], [59.55, 62.23, "Your turn. Say: Quantity."], [65.07, 65.95, "Quantity."], [66.72, 67.54, "Many."], [68.55, 70.69, "Many means a large number of (countable)."], [71.28, 72.42, "How many books?"], [73.02, 75.09, "Your turn. Say: Many."], [77.93, 78.75, "Many."], [79.48, 80.48, "Much."], [81.48, 83.89, "Much means a large amount of (uncountable)."], [84.48, 85.61, "How much water?"], [86.22, 88.44, "Your turn. Say: Much."], [91.3, 91.96, "Much."], [92.72, 93.66, "A few."], [94.65, 96.92, "A few means a small number (countable)."], [97.52, 99.15, "I have a few friends."], [99.75, 102.23, "Your turn. Say: A few."], [105.07, 106.06, "A few."], [106.82, 107.48, "A little."], [108.48, 110.92, "A little means a small amount (uncountable)."], [111.52, 112.94, "I need a little time."], [113.55, 115.78, "Your turn. Say: A little."], [118.63, 119.51, "A little."], [120.25, 121.02, "Piece of."], [122.02, 124.6, "Piece of means a unit for uncountable nouns."], [125.18, 126.67, "A piece of advice."], [127.28, 129.61, "Your turn. Say: Piece of."], [132.47, 133.25, "Piece of."], [134.03, 137.76, "Part two: dialogue. Let's listen to a conversation."], [138.62, 142.24, "Visal, what is the difference between countable and uncountable nouns?"], [143.35, 154.04, "Countable nouns have a plural, for example one book and two books. Uncountable nouns have no plural, such as water, rice, advice and information."], [155.15, 156.97, "Which quantifiers do we use?"], [158.08, 167.24, "With countable nouns we use many and a few. With uncountable nouns we use much and a little. We use a lot of with both, and some and any with both."], [168.35, 169.83, "What about some and any?"], [170.92, 180.29, "We use some in positive sentences and any in negatives and questions: I have some rice. I don't have any money. Do you have any questions?"], [181.43, 183.33, "Part three: grammar."], [184.18, 189.35, "Grammar focus: Countable: many, a few; uncountable: much, a little."], [189.65, 190.9, "Look at the pattern."], [191.58, 193.46, "How many books do you have?"], [194.35, 196.47, "How much water do you drink every day?"], [197.4, 203.46, "Use many and a few with countable nouns, much and a little with uncountable nouns, and a lot of with both."], [204.22, 207.23, "Be careful! Don't say: I don't have many water."], [209.17, 211.28, "Say: I don't have much water."], [211.58, 213.25, "Water is uncountable."], [214.03, 216.93, "Part four: reading. Read and listen."], [217.73, 218.84, "At the Market."], [219.14, 222.17, "Maly buys some rice, a few eggs and a little salt."], [223.17, 224.81, "She does not need much sugar."], [225.8, 228.66, "The seller asks how many mangoes she wants."], [229.67, 232.44, "She says a few, because she doesn't have much money."], [233.43, 235.32, "She carries a lot of bags home."], [236.43, 240.38, "Part five: quiz. Five questions. Are you ready?"], [241.22, 242.97, "How blank eggs do you need?"], [243.27, 246.45, "A, a little. B, many. C, much."], [250.0, 252.09, "The answer is B: many."], [253.25, 254.73, "I don't have blank money."], [255.03, 258.26, "A, many. B, a few. C, much."], [261.8, 263.53, "The answer is C: much."], [264.68, 266.39, "Which noun is uncountable?"], [266.69, 269.46, "A, rice. B, egg. C, book."], [273.0, 275.5, "The answer is A: rice."], [276.65, 278.31, "Maly buys a blank salt."], [278.61, 281.77, "A, many. B, little. C, few."], [285.33, 287.05, "The answer is B: little."], [288.22, 289.67, "'Any' is used in blank."], [289.97, 295.09, "A, only positives. B, only numbers. C, negatives and questions."], [298.63, 301.19, "The answer is C: negatives and questions."], [302.4, 305.77, "Part six: speaking. It's your turn to talk."], [306.62, 308.4, "What food do you have at home?"], [317.18, 318.79, "Now listen to Visal."], [319.09, 329.19, "At home we have a lot of rice and a few eggs. We have some vegetables, but we don't have much fruit today. My mother needs a little sugar for the soup."], [329.49, 331.17, "Excellent answer, Visal!"], [332.08, 339.31, "Great work! Now you can use eight new words and countable: many, a few; uncountable: much, a little."], [339.61, 343.44, "Today's value is gratitude. Say thank you for your home and family."], [343.74, 346.04, "See you in Unit eight. Goodbye!"], [346.34, 348.67, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit08-Articles-and-Prepositions": [[0.35, 5.83, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [6.13, 9.64, "Hi! I'm Visal. Let's learn together!"], [9.94, 17.04, "Unit eight: Articles and Prepositions. Today you will use a, an, the and prepositions of time and place correctly."], [17.34, 19.96, "Here is our lesson map. Let's start!"], [20.9, 24.03, "Part one: words. You will learn eight new words."], [24.88, 25.82, "Article."], [26.82, 28.57, "Article means a, an or the."], [29.18, 30.34, "A is an article."], [30.95, 33.48, "Your turn. Say: Article."], [36.33, 37.06, "Article."], [37.82, 38.91, "Preposition."], [39.92, 42.77, "Preposition means a word like in, on or at."], [43.38, 44.85, "At is a preposition."], [45.45, 48.14, "Your turn. Say: Preposition."], [51.0, 51.92, "Preposition."], [52.68, 53.41, "In."], [54.42, 57.0, "In means inside a place or a long period."], [57.58, 58.89, "In May, in the room."], [59.48, 61.66, "Your turn. Say: In."], [64.5, 65.28, "In."], [66.02, 66.74, "On."], [67.75, 69.87, "On means a day or a surface."], [70.45, 72.1, "On Monday, on the table."], [72.72, 74.81, "Your turn. Say: On."], [77.67, 78.28, "On."], [79.05, 79.78, "At."], [80.78, 82.52, "At means a time or a point."], [83.12, 84.86, "At six, at the station."], [85.45, 87.84, "Your turn. Say: At."], [90.7, 91.3, "At."], [92.05, 92.95, "Between."], [93.95, 96.02, "Between means in the middle of two things."], [96.62, 98.23, "Between the bank and the shop."], [98.82, 100.96, "Your turn. Say: Between."], [103.8, 104.87, "Between."], [105.62, 106.59, "Next to."], [107.58, 109.15, "Next to means beside."], [109.75, 111.19, "Next to the school."], [111.78, 114.04, "Your turn. Say: Next to."], [116.9, 117.91, "Next to."], [118.65, 119.59, "Opposite."], [120.58, 122.18, "Opposite means facing."], [122.78, 124.14, "Opposite the market."], [124.75, 127.25, "Your turn. Say: Opposite."], [130.1, 130.96, "Opposite."], [131.77, 135.43, "Part two: dialogue. Let's listen to a conversation."], [136.28, 138.42, "Visal, when do we use a, an and the?"], [139.52, 151.93, "We use a before a consonant sound and an before a vowel sound, such as a book and an apple. We use the when the person or thing is known or unique, for example the sun."], [153.02, 155.6, "How do we use in, on and at for time?"], [156.68, 167.9, "We use in for months, years and seasons, such as in May. We use on for days and dates, such as on Monday, and at for clock times, such as at six o'clock."], [169.02, 170.2, "And for place?"], [171.32, 185.97, "We use in for areas, on for surfaces, and at for points: in Cambodia, on the table, at the bus stop. We also use next to, between and opposite to describe positions."], [187.13, 188.6, "Part three: grammar."], [189.45, 192.91, "Grammar focus: Time and place: in and on and at."], [193.21, 194.28, "Look at the pattern."], [194.98, 197.41, "The class starts at seven o'clock on Monday."], [198.32, 200.8, "The bank is between the school and the market."], [201.77, 208.16, "Use a before consonants, an before vowels and the for known things. Learn in, on and at for time and place."], [208.92, 212.93, "Be careful! Don't say: The class starts in seven o'clock."], [214.87, 217.6, "Say: The class starts at seven o'clock."], [217.9, 219.61, "Use at with clock times."], [220.4, 223.15, "Part four: reading. Read and listen."], [223.93, 224.99, "Finding the Way."], [225.29, 227.97, "The school is on a quiet street in Siem Reap."], [228.97, 231.8, "It is opposite the market and next to a small bank."], [232.8, 235.1, "Classes start at seven o'clock in the morning."], [236.1, 238.83, "On Saturday there is a football match at the stadium."], [239.83, 242.63, "Visitors can park between the bank and the library."], [243.73, 247.49, "Part five: quiz. Five questions. Are you ready?"], [248.35, 249.72, "I have blank umbrella."], [250.02, 252.42, "A, a. B, the. C, an."], [255.97, 257.8, "The answer is C: an."], [258.95, 261.18, "The class starts blank seven o'clock."], [261.48, 264.44, "A, at. B, in. C, on."], [268.0, 269.56, "The answer is A: at."], [270.72, 272.46, "My birthday is blank May."], [272.76, 275.36, "A, at. B, in. C, on."], [278.9, 280.44, "The answer is B: in."], [281.58, 283.83, "The bank is blank the school and the market."], [284.13, 286.81, "A, at. B, on. C, between."], [290.37, 292.64, "The answer is C: between."], [293.78, 295.09, "Where is the school?"], [295.39, 299.45, "A, opposite the market. B, on a mountain. C, at sea."], [303.0, 305.5, "The answer is A: opposite the market."], [306.7, 309.7, "Part six: speaking. It's your turn to talk."], [310.55, 312.43, "Describe where your school is."], [321.25, 322.74, "Now listen to Visal."], [323.04, 333.62, "My school is in a small town in Cambodia. It is next to a bank and opposite the market. Classes start at seven o'clock, and we have an English lesson on Monday."], [333.92, 335.69, "Excellent answer, Visal!"], [336.58, 341.85, "Great work! Now you can use eight new words and time and place: in and on and at."], [342.15, 345.87, "Today's value is attention. Look carefully and listen well."], [346.17, 348.43, "See you in Unit nine. Goodbye!"], [348.73, 351.36, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit09-First-and-Second-Conditional": [[0.35, 5.98, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [6.28, 9.77, "Hi! I'm Visal. Let's learn together!"], [10.07, 16.5, "Unit nine: First and Second Conditional. Today you will talk about real and imaginary situations."], [16.8, 19.27, "Here is our lesson map. Let's start!"], [20.23, 23.29, "Part one: words. You will learn eight new words."], [24.15, 25.14, "Condition."], [26.15, 29.03, "Condition means a situation that must happen first."], [29.62, 31.15, "The condition is rain."], [31.75, 33.98, "Your turn. Say: Condition."], [36.83, 37.78, "Condition."], [38.52, 39.39, "Result."], [40.38, 43.02, "Result means what happens because of something."], [43.62, 45.15, "The result is a wet road."], [45.75, 48.09, "Your turn. Say: Result."], [50.93, 51.89, "Result."], [52.65, 53.3, "If."], [54.32, 56.13, "If means used for a condition."], [56.72, 58.66, "If it rains, we will stay."], [59.25, 61.3, "Your turn. Say: If."], [64.13, 64.74, "If."], [65.48, 66.55, "Unless."], [67.55, 69.09, "Unless means if not."], [69.68, 71.82, "Unless you study, you will fail."], [72.42, 74.74, "Your turn. Say: Unless."], [77.6, 78.69, "Unless."], [79.45, 80.43, "Probably."], [81.42, 83.31, "Probably means very likely."], [83.92, 85.53, "I will probably pass."], [86.12, 88.55, "Your turn. Say: Probably."], [91.4, 92.31, "Probably."], [93.05, 94.21, "Imaginary."], [95.22, 97.16, "Imaginary means not real."], [97.75, 99.56, "An imaginary situation."], [100.15, 102.6, "Your turn. Say: Imaginary."], [105.47, 106.62, "Imaginary."], [107.38, 108.01, "Were."], [109.02, 111.79, "Were means the past of be in imaginary ifs."], [112.38, 114.35, "If I were you, I would study."], [114.95, 116.94, "Your turn. Say: Were."], [119.8, 120.66, "Were."], [121.42, 121.98, "Would."], [122.98, 125.4, "Would means used for imaginary results."], [126.02, 127.7, "I would travel the world."], [128.32, 130.67, "Your turn. Say: Would."], [133.53, 134.36, "Would."], [135.17, 138.74, "Part two: dialogue. Let's listen to a conversation."], [139.58, 141.94, "Visal, what is the first conditional?"], [143.05, 154.0, "It is if plus the present simple, then will plus a base verb. We use it for real or likely future situations, such as If it rains, we will stay at home."], [155.12, 156.55, "And the second conditional?"], [157.65, 170.62, "It is if plus the past simple, then would plus a base verb. We use it for imaginary or unlikely situations, such as If I won a million dollars, I would buy a house."], [171.72, 173.76, "Is there anything special about were?"], [174.85, 183.6, "In the if-clause of a second conditional we can say if I were you for all persons. Never use will or would in the if-clause."], [184.73, 186.27, "Part three: grammar."], [187.12, 192.41, "Grammar focus: 1st: If plus present, will; 2nd: If plus past, would."], [192.71, 193.96, "Look at the pattern."], [194.65, 196.51, "If it rains, we will stay at home."], [197.42, 200.25, "If I won a million dollars, I would buy a house."], [201.2, 208.17, "Use if plus the present simple with will for likely futures, and if plus the past simple with would for imaginary situations."], [208.92, 212.59, "Be careful! Don't say: If I will win, I will travel."], [214.53, 216.95, "Say: If I win, I will travel."], [217.25, 218.83, "No will in the if-clause."], [219.63, 222.33, "Part four: reading. Read and listen."], [223.13, 224.37, "What Would You Do?."], [224.67, 227.4, "If it rains tomorrow, the match will be cancelled."], [228.4, 231.28, "Sophea will pass the exam if she studies every day."], [232.27, 235.31, "If she won a prize, she would give some money to her village."], [236.3, 238.84, "If I were her, I would also buy new books."], [239.83, 243.23, "Unless she studies hard, she will not get a high score."], [244.33, 248.6, "Part five: quiz. Five questions. Are you ready?"], [249.45, 251.44, "If it rains, we blank at home."], [251.74, 255.51, "A, will stay. B, would stay. C, stayed."], [259.07, 261.09, "The answer is A: will stay."], [262.25, 264.13, "If I blank rich, I would travel."], [264.43, 267.29, "A, will be. B, were. C, am."], [270.83, 272.51, "The answer is B: were."], [273.65, 275.39, "Which is a second conditional?"], [275.69, 281.65, "A, If it rains, we stay.. B, If you heat ice, it melts.. C, If I had wings, I would fly.."], [285.2, 288.52, "The answer is C: If I had wings, I would fly.."], [289.68, 291.31, "'Unless' means blank."], [291.61, 295.01, "A, if not. B, because. C, although."], [298.57, 300.82, "The answer is A: if not."], [301.98, 304.27, "What would Sophea do if she won a prize?"], [304.57, 308.89, "A, sleep. B, give money to her village. C, buy a car."], [312.43, 315.64, "The answer is B: give money to her village."], [316.83, 319.94, "Part six: speaking. It's your turn to talk."], [320.78, 323.11, "What would you do if you won a prize?"], [331.92, 333.37, "Now listen to Visal."], [333.67, 345.21, "If I won a prize, I would share some money with my family. I would also buy books and a laptop for school. If I studied harder every day, I could win a scholarship."], [345.51, 347.29, "Excellent answer, Visal!"], [348.18, 355.71, "Great work! Now you can use eight new words and 1st: if plus present, will; 2nd: if plus past, would."], [356.01, 359.85, "Today's value is foresight. Prepare today for the world of tomorrow."], [360.15, 362.59, "See you in Unit ten. Goodbye!"], [362.89, 365.38, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit10-Passive-Voice": [[0.35, 5.46, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [5.75, 9.28, "Hi! I'm Visal. Let's learn together!"], [9.58, 15.34, "Unit ten: Passive Voice. Today you will describe actions when the doer is not important."], [15.64, 18.3, "Here is our lesson map. Let's start!"], [19.23, 22.78, "Part one: words. You will learn eight new words."], [23.62, 24.43, "Passive."], [25.42, 28.5, "Passive means a form where the subject receives the action."], [29.08, 30.33, "The report is written."], [30.92, 33.58, "Your turn. Say: Passive."], [36.43, 37.33, "Passive."], [38.08, 39.0, "Active."], [40.02, 42.88, "Active means a form where the subject does e change an active sentence?"], [182.68, 190.66, "The object of the active sentence becomes the subject of the passive. Dara wrote the report becomes The report was written by Dara."], [191.8, 193.32, "Part three: grammar."], [194.18, 197.47, "Grammar focus: Passive: be plus past participle."], [197.77, 198.9, "Look at the pattern."], [199.62, 201.56, "Rice is grown in Cambodia."], [202.45, 204.93, "The bridge was built in 2010."], [205.87, 212.22, "Use be plus the past participle when the action is more important than the doer. Add by only when the doer is important."], [212.98, 217.04, "Be careful! Don't say: The bridge built in 2010."], [219.0, 222.09, "Say: The bridge was built in 2010."], [222.39, 224.18, "Use be + participle."], [224.97, 227.6, "Part four: reading. Read and listen."], [228.4, 229.6, "A New Bridge."], [229.9, 232.45, "The new bridge was built in 2010."], [233.47, 235.84, "It was designed by a team of engineers."], [236.83, 239.37, "Hundreds of workers were employed during the project."], [240.37, 243.53, "Today the bridge is used by thousands of people every day."], [244.53, 247.19, "It is repaired every year to keep it safe."], [248.3, 252.66, "Part five: quiz. Five questions. Are you ready?"], [253.52, 255.47, "Rice blank in Cambodia."], [255.77, 259.12, "A, are grown. B, is grown. C, grows."], [262.67, 264.58, "The answer is B: is grown."], [265.75, 267.82, "The window blank broken last night."], [268.12, 270.82, "A, were. B, is. C, was."], [274.37, 276.28, "The answer is C: was."], [277.45, 282.54, "Active: Dara wrote the report. Passive: The report blank by Dara."], [282.84, 286.28, "A, was written. B, wrote. C, is write."], [289.83, 292.04, "The answer is A: was written."], [293.18, 294.78, "When was the bridge built?"], [295.08, 299.91, "A, last week. B, in 2010. C, in 1990."], [303.47, 306.11, "The answer is B: in 2010."], [307.25, 308.96, "The passive uses blank."], [309.26, 314.75, "A, have + -ing. B, do + base. C, be + past participle."], [318.3, 321.62, "The answer is C: be + past participle."], [322.83, 326.24, "Part six: speaking. It's your turn to talk."], [327.08, 329.66, "Describe something that is made in your country."], [338.45, 339.95, "Now listen to Visal."], [340.25, 354.13, "Rice is grown in many parts of Cambodia. It is harvested by farmers and then it is sold in markets. In my family, it is cooked every day and it is eaten with fish and vegetables."], [354.43, 356.26, "Excellent answer, Visal!"], [357.15, 362.59, "Great work! Now you can use eight new words and passive: be plus past participle."], [362.89, 368.0, "Today's value is appreciation of beauty. Learn to notice and value the beauty around you."], [368.3, 370.86, "See you in Unit eleven. Goodbye!"], [371.16, 374.48, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit11-Reported-Speech": [[0.35, 6.24, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [6.54, 10.42, "Hi! I'm Visal. Let's learn together!"], [10.72, 17.32, "Unit eleven: Reported Speech. Today you will report what someone said without using their exact words."], [17.62, 20.3, "Here is our lesson map. Let's start!"], [21.27, 24.15, "Part one: words. You will learn eight new words."], [25.02, 26.37, "Reported speech."], [27.35, 30.24, "Reported speech means telling what someone said."], [30.85, 33.08, "Reported speech changes the tense."], [33.68, 37.1, "Your turn. Say: Reported speech."], [39.97, 41.25, "Reported speech."], [41.98, 43.17, "Direct speech."], [44.18, 47.24, "Direct speech means the exact words someone says."], [47.85, 50.36, "Direct speech uses quotation marks."], [50.95, 54.36, "Your turn. Say: Direct speech."], [57.2, 58.52, "Direct speech."], [59.25, 60.05, "Say."], [61.05, 62.89, "Say means to speak words."], [63.48, 65.15, "She said she was tired."], [65.75, 67.98, "Your turn. Say: Say."], [70.83, 71.73, "Say."], [72.48, 73.15, "Tell."], [74.15, 76.11, "Tell means to say something to someone."], [76.72, 78.14, "He told me a story."], [78.75, 81.53, "Your turn. Say: Tell."], [84.37, 85.03, "Tell."], [85.78, 86.76, "Ask."], [87.75, 89.75, "Ask means to request an answer."], [90.35, 91.78, "She asked where I lived."], [92.38, 95.13, "Your turn. Say: Ask."], [97.97, 98.81, "Ask."], [99.55, 100.64, "Backshift."], [101.65, 104.44, "Backshift means moving the tense one step back."], [105.05, 107.08, "Present becomes past in backshift."], [107.68, 110.2, "Your turn. Say: Backshift."], [113.03, 114.01, "Backshift."], [114.75, 115.8, "Yesterday."], [116.78, 118.9, "Yesterday means the day before today."], [119.48, 121.64, "He said he had come yesterday."], [122.25, 124.37, "Your turn. Say: Yesterday."], [127.23, 128.28, "Yesterday."], [129.02, 130.06, "The next day."], [131.05, 133.1, "The next day means the day after."], [133.68, 135.57, "She said she would come the next day."], [136.18, 139.08, "Your turn. Say: The next day."], [141.93, 143.16, "The next day."], [143.97, 147.47, "Part two: dialogue. Let's listen to a conversation."], [148.32, 152.22, "Visal, how do we change direct speech into reported speech?"], [153.32, 164.49, "We usually move the tense one step back. 'I am tired' becomes She said she was tired. We also change pronouns and time words, for example now becomes then."], [165.58, 167.08, "What about questions?"], [168.18, 180.83, "In reported questions we use normal word order and no question mark. 'Where do you live?' becomes She asked me where I lived, and for yes-no questions we use if or whether."], [181.95, 183.52, "What do we do with commands?"], [184.62, 194.38, "We use told plus an object plus to plus the base verb: 'Close the door' becomes He told me to close the door."], [195.53, 197.0, "Part three: grammar."], [197.85, 202.14, "Grammar focus: Reported speech: backshift the tense."], [202.44, 203.77, "Look at the pattern."], [204.48, 207.63, "'I am tired,' she said → She said she was tired."], [208.52, 211.82, "'Where do you live?' → She asked me where I lived."], [212.77, 218.54, "Move the tense back, change pronouns and time words, and use normal word order in reported questions."], [219.28, 222.93, "Be careful! Don't say: She said me she was tired."], [224.9, 227.51, "Say: She told me she was tired."], [227.81, 229.21, "Tell needs an object."], [230.0, 232.5, "Part four: reading. Read and listen."], [233.3, 234.64, "What the Teacher Said."], [234.94, 237.45, "The teacher said that the exam was on Friday."], [238.43, 240.32, "She told us to bring two pens."], [241.33, 243.6, "She asked whether we had finished the revision."], [244.6, 247.09, "Sokha said he had studied the night before."], [248.1, 251.16, "The teacher said she would give us more time the next day."], [252.27, 256.09, "Part five: quiz. Five questions. Are you ready?"], [256.95, 261.1, "'I am tired,' she said. → She said she blank tired."], [261.4, 264.51, "A, is. B, has been. C, was."], [268.07, 270.42, "The answer is C: was."], [271.55, 274.88, "'Where do you live?' → She asked me where I blank."], [275.18, 278.27, "A, lived. B, do live. C, live you."], [281.83, 283.6, "The answer is A: lived."], [284.75, 287.89, "'Close the door.' → He told me blank the door."], [288.19, 291.53, "A, close. B, to close. C, closing."], [295.07, 297.12, "The answer is B: to close."], [298.28, 300.46, "What did the teacher tell the class to bring?"], [300.76, 304.54, "A, a calculator. B, lunch. C, two pens."], [308.1, 310.32, "The answer is C: two pens."], [311.48, 313.9, "Now becomes blank in reported speech."], [314.2, 317.47, "A, then. B, today. C, yesterday."], [321.03, 322.94, "The answer is A: then."], [324.13, 327.25, "Part six: speaking. It's your turn to talk."], [328.12, 330.13, "Tell me something your teacher said today."], [338.92, 340.36, "Now listen to Visal."], [340.66, 351.95, "My teacher said that we would have a test next week. She told us to review the units and asked whether we had any questions. She also said that we should practise every day."], [352.25, 354.02, "Excellent answer, Visal!"], [354.92, 360.16, "Great work! Now you can use eight new words and reported speech: backshift the tense."], [360.46, 364.48, "Today's value is communication. Speak clearly and listen carefully."], [364.78, 367.27, "See you in Unit twelve. Goodbye!"], [367.57, 370.83, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit12-Relative-Clauses": [[0.35, 6.17, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [6.47, 9.91, "Hi! I'm Visal. Let's learn together!"], [10.21, 16.33, "Unit twelve: Relative Clauses. Today you will add information using who, which, that and whose."], [16.63, 19.19, "Here is our lesson map. Let's start!"], [20.13, 23.49, "Part one: words. You will learn eight new words."], [24.35, 25.65, "Relative pronoun."], [26.65, 29.66, "Relative pronoun means a word like who or which."], [30.25, 31.94, "Who is a relative pronoun."], [32.55, 35.62, "Your turn. Say: Relative pronoun."], [38.47, 40.02, "Relative pronoun."], [40.78, 41.35, "Who."], [42.35, 43.85, "Who means used for people."], [44.45, 46.62, "The girl who sings is my sister."], [47.22, 49.49, "Your turn. Say: Who."], [52.33, 53.01, "Who."], [53.75, 54.59, "Which."], [55.58, 57.2, "Which means used for things."], [57.78, 59.46, "The book which I bought is new."], [60.05, 62.34, "Your turn. Say: Which."], [65.2, 66.0, "Which."], [66.75, 67.54, "That."], [68.55, 70.85, "That means used for people or things."], [71.45, 73.06, "The car that I like is red."], [73.65, 75.95, "Your turn. Say: That."], [78.8, 79.46, "That."], [80.22, 81.0, "Whose."], [81.98, 83.94, "Whose means used to show belonging."], [84.55, 86.86, "The boy whose bag is lost is crying."], [87.45, 89.97, "Your turn. Say: Whose."], [92.83, 93.65, "Whose."], [94.38, 95.26, "Where."], [96.25, 98.17, "Where means used for places."], [98.78, 100.39, "The town where I live is small."], [100.98, 103.68, "Your turn. Say: Where."], [106.53, 108.2, "Where."], [108.95, 110.01, "Defining."], [111.02, 113.64, "Defining means giving necessary information."], [114.25, 116.56, "A defining clause has no commas."], [117.15, 119.53, "Your turn. Say: Defining."], [122.4, 123.4, "Defining."], [124.15, 125.3, "Non-defining."], [126.32, 129.11, "Non-defining means giving extra information."], [129.72, 131.96, "A non-defining clause uses commas."], [132.55, 135.48, "Your turn. Say: Non-defining."], [138.33, 139.52, "Non-defining."], [140.33, 143.97, "Part two: dialogue. Let's listen to a conversation."], [144.82, 146.84, "Visal, what are relative clauses?"], [147.95, 158.02, "They give more information about a noun. We use who for people, which for things, that for both, whose for belonging and where for places."], [159.12, 160.88, "What is a defining clause?"], [161.98, 171.17, "It gives necessary information and has no commas: The student who sits next to me is Dara. Without it, we do not know which student."], [172.28, 174.17, "And a non-defining clause?"], [175.28, 184.31, "It gives extra information with commas: Angkor Wat, which is in Siem Reap, is famous. We cannot use that in a non-defining clause."], [185.47, 186.87, "Part three: grammar."], [187.72, 192.47, "Grammar focus: Relative clause: noun plus who and which and that plus verb."], [192.77, 193.92, "Look at the pattern."], [194.62, 196.55, "The girl who sings is my sister."], [197.45, 200.52, "Angkor Wat, which is in Siem Reap, is famous."], [201.47, 208.32, "Use who for people, which for things, whose for belonging and where for places. Use commas for extra information."], [209.08, 212.61, "Be careful! Don't say: The girl which sings is my sister."], [214.57, 216.96, "Say: The girl who sings is my sister."], [217.26, 218.75, "Use who for people."], [219.53, 222.48, "Part four: reading. Read and listen."], [223.27, 225.24, "Describing People and Places."], [225.54, 228.33, "The teacher who teaches us English is very kind."], [229.33, 231.26, "The book that she lent me is interesting."], [232.27, 234.68, "The village where I was born is near a river."], [235.7, 238.53, "My neighbour, whose house is next to ours, is a farmer."], [239.53, 242.62, "Angkor Wat, which is in Siem Reap, is a famous temple."], [243.73, 248.11, "Part five: quiz. Five questions. Are you ready?"], [248.95, 251.16, "The girl blank sings is my sister."], [251.46, 254.65, "A, who. B, which. C, where."], [258.2, 260.06, "The answer is A: who."], [261.22, 262.86, "The book blank I bought is new."], [263.16, 266.3, "A, whose. B, which. C, who."], [269.83, 271.94, "The answer is B: which."], [273.08, 274.94, "The town blank I live is small."], [275.24, 278.75, "A, who. B, which. C, where."], [282.3, 284.12, "The answer is C: where."], [285.28, 287.86, "Extra information is put between blank."], [288.16, 292.0, "A, commas. B, brackets only. C, nothing."], [295.57, 297.45, "The answer is A: commas."], [298.62, 299.97, "Whose shows blank."], [300.27, 303.99, "A, time. B, belonging. C, place."], [307.53, 309.61, "The answer is B: belonging."], [310.8, 313.98, "Part six: speaking. It's your turn to talk."], [314.82, 318.13, "Describe a person you admire using a relative clause."], [326.92, 328.34, "Now listen to Visal."], [328.64, 337.56, "I admire my teacher who helps students after class. She is a person who never gives up. The school where she works is lucky to have her."], [337.86, 339.6, "Excellent answer, Visal!"], [340.52, 347.34, "Great work! Now you can use eight new words and relative clause: noun plus who and which and that plus verb."], [347.64, 352.88, "Today's value is appreciation of beauty. Learn to notice and value the beauty around you."], [353.18, 356.19, "See you in Unit thirteen. Goodbye!"], [356.49, 359.22, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit13-Question-Forms-and-Question-Tags": [[0.35, 6.41, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [6.71, 10.2, "Hi! I'm Visal. Let's learn together!"], [10.5, 18.03, 63, 148.41, "Part two: dialogue. Let's listen to a conversation."], [149.25, 151.69, "Visal, how do we form questions?"], [152.78, 165.49, "We put the auxiliary before the subject: Do you like music? Where does she live? In the past simple we use did, and with be we put the verb first, for example Is she tired?"], [166.58, 168.43, "What about subject questions?"], [169.52, 179.78, "When the question word is the subject, we do not use do or did: Who called you? What happened? We keep the same word order as a positive sentence."], [180.88, 182.56, "How do question tags work?"], [183.65, 194.39, "A positive sentence takes a negative tag and a negative sentence takes a positive tag: You are tired, aren't you? She doesn't like fish, does she?"], [195.53, 196.96, "Part three: grammar."], [197.82, 203.4, "Grammar focus: Question: question word plus auxiliary plus subject plus verb."], [203.7, 204.89, "Look at the pattern."], [205.58, 207.04, "Where does she live?"], [207.95, 209.53, "She is tired, isn't she?"], [210.47, 219.1, "Use an auxiliary before the subject in questions. In tags, use a negative tag after a positive sentence and a positive tag after a negative one."], [219.85, 222.76, "Be careful! Don't say: Where she lives?"], [224.7, 226.07, "Say: Where does she live?"], [226.37, 227.88, "Use an auxiliary."], [228.7, 231.25, "Part four: reading. Read and listen."], [232.03, 233.5, "Asking Questions."], [233.8, 236.63, "A teacher asks, Who called you last night?"], [237.63, 239.67, "Dara answers that it was his cousin."], [240.67, 243.12, "She asks, Where does your cousin live?"], [244.13, 246.14, "He lives in Battambang, doesn't he?"], [247.13, 249.45, "The teacher says, You don't like fish, do you?"], [250.53, 254.49, "Part five: quiz. Five questions. Are you ready?"], [255.35, 256.73, "Where blank she live?"], [257.03, 259.76, "A, is. B, does. C, do."], [263.3, 265.67, "The answer is B: does."], [266.82, 268.11, "She is tired, blank?"], [268.41, 272.26, "A, is she. B, doesn't she. C, isn't she."], [275.8, 277.87, "The answer is C: isn't she."], [279.02, 281.19, "Who called you? uses blank."], [281.49, 285.01, "A, no do or did. B, do. C, did."], [288.57, 291.24, "The answer is A: no do or did."], [292.38, 294.08, "He doesn't like fish, blank?"], [294.38, 298.15, "A, isn't he. B, does he. C, doesn't he."], [301.7, 303.44, "The answer is B: does he."], [304.58, 306.25, "Where does Dara's cousin live?"], [306.55, 310.14, "A, Phnom Penh. B, Siem Reap. C, Battambang."], [313.7, 315.49, "The answer is C: Battambang."], [316.7, 320.12, "Part six: speaking. It's your turn to talk."], [320.98, 323.3, "Ask me two questions about my school."], [332.08, 333.49, "Now listen to Visal."], [333.79, 342.0, "What time does your school start in the morning? You study English every day, don't you? I would also like to ask what your favourite subject is."], [342.3, 343.87, "Excellent answer, Visal!"], [344.75, 351.74, "Great work! Now you can use eight new words and question: question word plus auxiliary plus subject plus verb."], [352.04, 355.94, "Today's value is curiosity. Ask questions and find out."], [356.24, 359.15, "See you in Unit fourteen. Goodbye!"], [359.45, 361.82, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit14-Word-Formation-Prefixes-and-Suffixes": [[0.35, 5.58, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [5.88, 9.4, "Hi! I'm Visal. Let's learn together!"], [9.7, 16.53, "Unit fourteen: Word Formation: Prefixes and Suffixes. Today you will build new words from base words."], [16.83, 19.64, "Here is our lesson map. Let's start!"], [20.6, 23.97, "Part one: words. You will learn eight new words."], [24.82, 25.78, "Prefix."], [26.78, 29.68, "Prefix means letters added to the front of a word."], [30.28, 31.57, "Un- is a prefix."], [32.18, 35.1, "Your turn. Say: Prefix."], [37.97, 38.98, "Prefix."], [39.72, 40.62, "Suffix."], [41.62, 44.29, "Suffix means letters added to the end of a word."], [44.88, 46.35, "-ness is a suffix."], [46.95, 49.63, "Your turn. Say: Suffix."], [52.47, 53.62, "Suffix."], [54.38, 55.26, "Opposite."], [56.25, 58.76, "Opposite means a word with the reverse meaning."], [59.35, 61.6, "Happy and unhappy are opposites."], [62.22, 64.44, "Your turn. Say: Opposite."], [67.3, 68.13, "Opposite."], [68.88, 69.61, "Noun."], [70.62, 73.65, "Noun means a word for a person, place or thing."], [74.25, 75.68, "Happiness is a noun."], [76.28, 78.73, "Your turn. Say: Noun."], [81.57, 82.43, "Noun."], [83.18, 84.28, "Adjective."], [85.28, 87.74, "Adjective means a word that describes."], [88.35, 89.86, "Happy is an adjective."], [90.45, 93.3, "Your turn. Say: Adjective."], [96.13, 97.11, "Adjective."], [97.85, 98.81, "Adverb."], [99.82, 102.41, "Adverb means a word that describes a verb."], [103.02, 104.74, "Happily is an adverb."], [105.35, 108.2, "Your turn. Say: Adverb."], [111.03, 112.01, "Adverb."], [112.75, 113.69, "Base word."], [114.68, 117.73, "Base word means the main word before adding parts."], [118.32, 119.9, "Happy is the base word."], [120.48, 123.02, "Your turn. Say: Base word."], [125.87, 126.87, "Base word."], [127.62, 129.13, "Family of words."], [130.12, 132.56, "Family of words means words from the same root."], [133.15, 135.02, "Care, careful and careless."], [135.62, 138.38, "Your turn. Say: Family of words."], [141.23, 142.5, "Family of words."], [143.3, 146.95, "Part two: dialogue. Let's listen to a conversation."], [147.82, 151.13, "Visal, how do prefixes and suffixes change words?"], [152.22, 165.13, "A prefix changes the meaning, for example un-, in-, dis- and im- make opposites: unhappy, incorrect, dislike and impossible. A suffix changes the word class."], [166.22, 167.8, "Which suffixes should I know?"], [168.88, 183.8, "For nouns: -ness, -tion, -ment and -er, such as kindness and teacher. For adjectives: -ful, -less and -able. For adverbs: -ly, such as quickly."], [184.88, 186.56, "How do I use them in a test?"], [187.65, 198.8, "Look at the gap. Decide if it needs a noun, adjective or adverb. Then choose the form of the base word that fits, and check whether it should be negative."], [199.97, 201.83, "Part three: grammar."], [202.68, 207.21, "Grammar focus: Base word plus prefix and suffix."], [207.51, 208.72, "Look at the pattern."], [209.42, 211.78, "She is unhappy because she lost her bag."], [212.68, 214.65, "He answered quickly and correctly."], [215.6, 223.36, "Decide if the gap needs a noun, adjective or adverb, then add the right suffix or prefix. Check the spelling of the new word."], [224.12, 227.66, "Be careful! Don't say: He is unhelpfully."], [229.6, 231.81, "Say: He is unhelpful."], [232.11, 233.71, "Check the word class."], [234.5, 237.42, "Part four: reading. Read and listen."], [238.23, 239.58, "Changing Words."], [239.88, 243.11, "Sophea reads a sentence with a gap before the word help."], [244.1, 246.76, "The gap needs an adjective that means 'giving help'."], [247.77, 249.6, "She adds -ful to make helpful."], [250.6, 253.76, "In another sentence she needs an adverb from careful."], [254.77, 257.08, "She writes carefully and checks the spelling."], [258.17, 262.13, "Part five: quiz. Five questions. Are you ready?"], [262.98, 264.88, "The opposite of happy is blank."], [265.18, 268.76, "A, inhappy. B, dishappy. C, unhappy."], [272.3, 274.23, "The answer is C: unhappy."], [275.38, 277.0, "The noun from kind is blank."], [277.3, 280.99, "A, kindness. B, kindly. C, kinder."], [284.53, 286.38, "The answer is A: kindness."], [287.52, 289.41, "An adverb from quick is blank."], [289.71, 293.13, "A, quicker. B, quickly. C, quickness."], [296.67, 298.31, "The answer is B: quickly."], [299.45, 301.29, "The suffix -ful makes blank."], [301.59, 305.18, "A, verbs. B, numbers. C, adjectives."], [308.73, 311.14, "The answer is C: adjectives."], [312.28, 313.88, "What does Sophea make from help?"], [314.18, 318.83, "A, helpful. B, helpness. C, helpless only."], [322.37, 324.13, "The answer is A: helpful."], [325.33, 328.42, "Part six: speaking. It's your turn to talk."], [329.25, 332.28, "How do you use prefixes and suffixes in an exam?"], [341.08, 342.58, "Now listen to Visal."], [342.88, 355.96, "I look at the gap and decide which word class it needs. Then I add a prefix or suffix to the base word, and I check the spelling. If the meaning is negative, I choose a prefix like un- or im-."], [356.26, 358.08, "Excellent answer, Visal!"], [358.98, 364.48, "Great work! Now you can use eight new words and base word plus prefix and suffix."], [364.78, 370.0, "Today's value is precision of language. Choose your words carefully so others understand you."], [370.3, 373.17, "See you in Unit fifteen. Goodbye!"], [373.47, 377.41, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit15-Common-Phrasal-Verbs": [[0.35, 5.7, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [6.0, 9.4, "Hi! I'm Visal. Let's learn together!"], [9.7, 16.75, "Unit fifteen: Common Phrasal Verbs. Today you will understand and use phrasal verbs from daily life and school."], [17.05, 19.86, "Here is our lesson map. Let's start!"], [20.8, 24.15, "Part one: words. You will learn eight new words."], [24.98, 26.14, "Phrasal verb."], [27.15, 30.44, "Phrasal verb means a verb with a small word like up or off."], [31.05, 32.83, "Give up is a phrasal verb."], [33.42, 36.53, "Your turn. Say: Phrasal verb."], [39.4, 40.8, "Phrasal verb."], [41.55, 42.4, "Give up."], [43.42, 45.15, "Give up means to stop trying."], [45.75, 46.95, "Never give up."], [47.55, 50.06, "Your turn. Say: Give up."], [52.9, 53.65, "Give up."], [54.38, 55.41, "Look for."], [56.42, 58.27, "Look for means to search for."], [58.85, 60.48, "I am looking for my book."], [61.08, 63.6, "Your turn. Say: Look for."], [66.43, 67.35, "Look for."], [68.12, 68.95, "Turn on."], [69.95, 72.04, "Turn on means to start a machine."], [72.65, 73.7, "Turn on the light."], [74.28, 76.48, "Your turn. Say: Turn on."], [79.33, 80.12, "Turn on."], [80.88, 81.8, "Turn off."], [82.82, 84.73, "Turn off means to stop a machine."], [85.35, 86.68, "Turn off the fan."], [87.28, 89.46, "Your turn. Say: Turn off."], [92.3, 93.08, "Turn off."], [93.82, 94.75, "Take off."], [95.75, 98.45, "Take off means to remove clothes or leave the ground."], [99.05, 100.5, "Take off your shoes."], [101.12, 103.8, "Your turn. Say: Take off."], [106.67, 107.61, "Take off."], [108.35, 109.14, "Get up."], [110.15, 112.01, "Get up means to leave your bed."], [112.62, 113.99, "I get up at six."], [114.58, 116.48, "Your turn. Say: Get up."], [119.33, 120.04, "Get up."], [120.78, 121.77, "Find out."], [122.78, 125.04, "Find out means to discover information."], [125.65, 127.34, "I want to find out the answer."], [127.95, 130.58, "Your turn. Say: Find out."], [133.43, 134.39, "Find out."], [135.2, 138.79, "Part two: dialogue. Let's listen to a conversation."], [139.65, 141.79, "Visal, what are phrasal verbs?"], [142.88, 154.88, "They are verbs with small words such as up, off, on or out, and the meaning is often different from the verb alone. For example, give up means stop trying."], [155.98, 157.2, "How do I learn them?"], [158.32, 171.7, "Learn them in sentences and by topic. Daily life: get up, turn on and turn off. Study: look up, find out and hand in. Feelings: cheer up and calm down."], [172.82, 174.55, "Can the words be separated?"], [175.65, 186.37, "Some can: Turn the light on, or Turn on the light. But when we use a pronoun, we must separate it: Turn it on, not Turn on it."], [187.53, 189.01, "Part three: grammar."], [189.85, 193.67, "Grammar focus: Phrasal verb: verb plus particle."], [193.97, 195.22, "Look at the pattern."], [195.92, 197.73, "I get up at six every morning."], [198.62, 200.57, "Please turn it off before you leave."], [201.53, 207.88, "Learn phrasal verbs as whole phrases in sentences. With pronouns, put the pronoun between the verb and the particle."], [208.62, 211.4, "Be careful! Don't say: Turn off it."], [213.33, 214.97, "Say: Turn it off."], [215.27, 216.66, "Pronoun goes in the middle."], [217.47, 219.91, "Part four: reading. Read and listen."], [220.7, 221.88, "A Busy Morning."], [222.18, 224.64, "Sovann gets up at six every morning."], [225.63, 228.34, "He turns on the light and looks for his school bag."], [229.33, 231.83, "He finds out that he has forgotten his homework."], [232.83, 235.23, "He doesn't give up, and he finishes it quickly."], [236.23, 238.5, "Before he leaves, he turns off the fan."], [239.6, 243.69, "Part five: quiz. Five questions. Are you ready?"], [244.55, 245.85, "Give up means blank."], [246.15, 249.83, "A, stop trying. B, start. C, sleep."], [253.37, 255.3, "The answer is A: stop trying."], [256.45, 259.26, "Turn blank the light, please. (start it)"], [259.56, 262.46, "A, over. B, on. C, off."], [266.0, 268.21, "The answer is B: on."], [269.35, 270.57, "Which is correct?"], [270.87, 274.7, "A, Turn off it.. B, Off turn it.. C, Turn it off.."], [278.23, 280.71, "The answer is C: Turn it off.."], [281.85, 283.51, "What does Sovann look for?"], [283.81, 287.97, "A, his school bag. B, a taxi. C, a book shop."], [291.5, 293.71, "The answer is A: his school bag."], [294.85, 296.25, "Find out means blank."], [296.55, 300.77, "A, forget. B, discover information. C, hide."], [304.33, 306.86, "The answer is B: discover information."], [308.07, 311.11, "Part six: speaking. It's your turn to talk."], [311.95, 314.59, "Tell me about your morning using phrasal verbs."], [323.38, 324.76, "Now listen to Visal."], [325.06, 334.78, "I get up at six and turn on the light. Then I look for my school uniform and take off my pyjamas. Before I leave, I turn off the fan."], [335.08, 337.05, "Excellent answer, Visal!"], [337.95, 343.46, "Great work! Now you can use eight new words and phrasal verb: verb plus particle."], [343.76, 347.93, "Today's value is perseverance. Keep trying, even when it is hard."], [348.23, 350.87, "See you in Unit sixteen. Goodbye!"], [351.17, 353.71, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X09-Unit16-Reading-Comprehension-Multiple-Choice-and-True-False": [[0.35, 5.44, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade nine English."], [5.74, 9.12, "Hi! I'm Visal. Let's learn together!"], [9.42, 17.45, "Unit sixteen: Reading Comprehension: Multiple Choice and True/False. Today you will read a text and answer questions accurately."], [17.75, 20.3, "Here is our lesson map. Let's start!"], [21.27, 24.87, "Part one: words. You will learn eight new words."], [25.72, 26.88, "Comprehension."], [27.88, 30.6, "Comprehension means understanding what you read."], [31.22, 33.11, "Reading comprehension is important."], [33.72, 36.3, "Your turn. Say: Comprehension."], [39.13, 40.12, "Comprehension."], [40.88, 41.65, "Skim."], [42.65, 45.62, "Skim means to read quickly for the general idea."], [46.22, 47.8, "Skim the text first."], [48.38, 50.66, "Your turn. Say: Skim."], [53.5, 54.57, "Skim."], [55.32, 56.14, "Scan."], [57.15, 59.65, "Scan means to look for a specific detail."], [60.25, 61.95, "Scan for a name or number."], [62.55, 65.42, "Your turn. Say: Scan."], [68.27, 69.15, "Scan."], [69.92, 70.44, "True."], [71.45, 73.26, "True means agreeing with the text."], [73.85, 75.22, "The statement is true."], [75.82, 78.16, "Your turn. Say: True."], [81.0, 81.77, "True."], [82.52, 83.42, "False."], [84.42, 86.71, "False means the opposite of the text."], [87.32, 88.79, "The statement is false."], [89.38, 91.81, "Your turn. Say: False."], [94.67, 95.42, "False."], [96.18, 97.18, "Evidence."], [98.18, 100.9, "Evidence means facts that prove an answer."], [101.52, 103.37, "Find evidence in the text."], [103.95, 106.78, "Your turn. Say: Evidence."], [109.63, 110.73, "Evidence."], [111.48, 112.34, "Detail."], [113.35, 116.02, "Detail means a small piece of information."], [116.62, 117.77, "Find the detail."], [118.38, 120.53, "Your turn. Say: Detail."], [123.37,         // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        function renderContent() {
            let contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];

            document.getElementById('platform-info').textContent = `C2-EPE - ${gradeName(state.level)} (Unit ${state.unit}: ${unitData.title})`;
            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'learn') renderLearn(contentDiv, unitData);
            else if (state.tab === 'terms') renderTerms(contentDiv, unitData);
            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'think') renderThink(contentDiv, unitData);
            else if (state.tab === 'funfact') renderFunFact(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);
            else if (state.tab === 'spelling') renderSpelling(contentDiv, unitData);
            else if (state.tab === 'sentence') renderSentenceBuilding(contentDiv, unitData);
            else if (state.tab === 'summary') renderSummaryWriting(contentDiv, unitData);
            else if (state.tab === 'headline') renderHeadlineWriting(contentDiv, unitData);
            else if (state.tab === 'factopinion') renderFactOpinion(contentDiv, unitData);
            else if (state.tab === 'debate') renderDebateCorner(contentDiv, unitData);
            else if (state.tab === 'discussion') renderDiscussion(contentDiv, unitData);
            else if (state.tab === 'dictation') renderDictation(contentDiv, unitData);
            else if (state.tab === 'review') renderReview(contentDiv, unitData);
            else if (state.tab === 'pronunciation') renderPronunciationDrill(contentDiv, unitData);
            else if (state.tab === 'exam') renderExamPractice(contentDiv, unitData);
            else if (state.tab === 'challenge') renderGoal(contentDiv, unitData);
            else if (state.tab === 'codelab') renderCodeLab(contentDiv, unitData);
        }

        // ===== MY PROGRESS =====
        const ALL_TABS = ['video','learn','terms','quiz','think','funfact','vocabgame','spelling','sentence','summary','headline','factopinion','debate','discussion','dictation','review','pronunciation','exam','challenge'];
        function markActivityComplete(tab) {
            progress.completed = progress.completed || {};
            const key = state.level + '_' + state.unit + '_' + tab;
            if (!progress.completed[key]) { progress.completed[key] = true; saveProgress(); }
        }
        function showMyProgress() {
            const lines = LEVELS_ORDER.map(lvl => {
                let data = null;
                if (lvl === state.level) data = progress;
                else { try { data = JSON.parse(localStorage.getItem(PROGRESS_PREFIX + lvl) || 'null'); } catch (e) {} }
                const done = data && data.completed ? Object.keys(data.completed).filter(k => k.startsWith(lvl + '_')).length : 0;
                const total = Object.keys(curriculum[lvl]).length * ALL_TABS.length;
                return `${gradeName(lvl)}: ${done} / ${total} activities (${Math.round(done / total * 100)}%)${lvl === state.level ? ' ← current' : ''}`;
            }).join('\n');
            const unitDone = ALL_TABS.filter(t => progress.completed && progress.completed[state.level + '_' + state.unit + '_' + t]).length;
            alert(`📊 My Progress\n\n⭐ Stars: ${state.stars}\n🏆 Badges: ${state.badges}\n\nThis unit (Unit ${state.unit}): ${unitDone} / ${ALL_TABS.length} modules done\n\n${lines}\n\n(Saved on this device/browser only. Inside the Hub, progress lasts until the page is closed.)`);
        }

        function textCheck(msg, text, need, okText, key, amount) {
            const n = countWords(text);
            if (n < need) {

        function usedUnitWords(text, unitData) {
            const t = ' ' + String(text).toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').replace(/\s+/g, ' ') + ' ';

                const base = w.toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').trim();
                if (!base) return false;
                // whole word, allowing simple endings: s, es, ed, ing
                const re = new RegExp('[ ]' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[ ]') + '(s|es|ed|d|ing)?[ ]');
