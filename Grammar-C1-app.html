i! I'm Visal. Let's learn together!"], [9.55, 15.39, "Unit twelve: Concessive Clauses. Today you will acknowledge a point before presenting a contrast."], [15.69, 18.3, "Here is our lesson map. Let's start!"], [19.23, 22.55, "Part one: words. You will learn eight new words."], [23.38, 24.32, "Even though."], [25.32, 28.72, "Even though means a conjunction showing surprising contrast."], [29.32, 31.04, "Even though it rained, we went."], [31.65, 34.01, "Your turn. Say: Even though."], [36.87, 38.08, "Even though."], [38.82, 39.86, "Much as."], [40.85, 43.71, "Much as means a formal concession about feelings."], [44.32, 46.36, "Much as I like him, I disagree."], [46.95, 49.73, "Your turn. Say: Much as."], [52.57, 53.3, "Much as."], [54.05, 54.87, "While."], [55.85, 58.4, "While means a conjunction showing contrast."], [58.98, 60.91, "While he is rich, he is unhappy."], [61.52, 63.52, "Your turn. Say: While."], [66.37, 67.51, "While."], [68.25, 69.5, "Granted that."], [70.48, 73.17, "Granted that means a formal way to accept a point."], [73.78, 75.97, "Granted that it is costly, it works."], [76.58, 79.25, "Your turn. Say: Granted that."], [82.1, 83.24, "Granted that."], [83.98, 85.0, "Concession."], [85.98, 88.88, "Concession means accepting part of an opposing view."], [89.48, 90.81, "A fair concession."], [91.42, 93.83, "Your turn. Say: Concession."], [96.67, 97.6, "Concession."], [98.35, 99.87, "Acknowledging a point."], [100.88, 104.23, "Acknowledging a point means admitting that someone is partly right."], [104.82, 106.91, "Acknowledging a point builds trust."], [107.52, 111.14, "Your turn. Say: Acknowledging a point."], [114.0, 115.34, "Acknowledging a point."], [116.08, 118.04, "Contrast despite agreement."], [119.05, 122.81, "Contrast despite agreement means disagreeing after agreeing partly."], [123.42, 125.09, "Contrast despite agreement."], [125.68, 128.73, "Your turn. Say: Contrast despite agreement."], [131.57, 133.31, "Contrast despite agreement."], [134.05, 135.46, "Formal concession."], [136.45, 139.89, "Formal concession means a polite admission in a formal text."], [140.48, 141.86, "A formal concession."], [142.45, 145.62, "Your turn. Say: Formal concession."], [148.47, 149.74, "Formal concession."], [150.53, 154.2, "Part two: dialogue. Let's listen to a conversation."], [155.05, 159.7, "Visal, how can I disagree politely after admitting that my opponent has a point?"], [160.78, 171.39, "Use a concessive clause: Much as I admire her, I cannot support the plan. It first accepts the opposing feeling, then states your contrary view."], [172.48, 174.1, "Which conjunctions work?"], [175.18, 185.69, "Although, even though, while, whereas, and much as. Granted that and admittedly are more formal. Note that even though is stronger than although."], [186.78, 188.38, "Any structural traps?"], [189.48, 201.03, "Do not use but with although: Although it rained, but we went is wrong. Also, much as is followed by a verb of feeling, and the clause can come first or second."], [202.17, 203.76, "Part three: grammar."], [204.62, 209.79, "Grammar focus: Concession: concessive conjunction plus clause, main clause."], [210.09, 211.31, "Look at the pattern."], [212.02, 215.12, "Much as I admire her, I cannot support the plan."], [216.02, 218.48, "Even though it rained, we played outside."], [219.38, 222.11, "Granted that it is costly, the policy works."], [223.07, 228.95, "Use although, even though, while, much as or granted that to concede a point. Never add but in the main clause."], [229.68, 233.37, "Be careful! Don't say: Although tired, but I went."], [235.33, 238.22, "Say: Although I was tired, I went."], [238.51, 240.04, "Do not use although and but."], [240.83, 243.57, "Part four: reading. Read and listen."], [244.37, 245.51, "Fair but Firm."], [245.81, 248.94, "Much as I admire her work, I cannot support the plan."], [249.93, 252.97, "Even though the cost is high, the benefits are clear."], [253.97, 257.53, "Granted that the method is slow, it is also reliable."], [258.53, 261.39, "While some people disagree, most accept the result."], [262.4, 265.54, "Concession shows that a writer has considered other views."], [266.63, 270.46, "Part five: quiz. Five questions. Are you ready?"], [271.32, 273.55, "blank it rained, we played outside."], [273.85, 277.62, "A, Even though. B, Because. C, So."], [281.17, 283.04, "The answer is A: Even though."], [284.18, 286.61, "Much blank I admire her, I disagree."], [286.91, 289.97, "A, as. B, so. C, than."], [293.53, 295.07, "The answer is A: as."], [296.22, 297.38, "Which is correct?"], [297.68, 304.41, "A, Although tired, but I went.. B, Although I was tired, I went.. C, Although I was tired, but I went.."], [307.97, 310.79, "The answer is B: Although I was tired, I went.."], [311.95, 314.24, "A concession blank part of another view."], [314.54, 318.16, "A, accepts. B, ignores. C, hides."], [321.7, 323.91, "The answer is A: accepts."], [325.05, 327.5, "According to the reading, what is reliable?"], [327.8, 331.75, "A, the method. B, the weather. C, the price."], [335.3, 337.22, "The answer is A: the method."], [338.43, 341.64, "Part six: speaking. It's your turn to talk."], [342.48, 345.06, "Write a sentence using 'much as' to concede a point."], [353.85, 355.34, "Now listen to Visal."], [355.64, 367.74, "Much as I enjoy social media, I think it wastes a lot of time. I accept that it connects people, but I still disagree with spending hours on it. Much as shows a polite concession."], [368.04, 369.82, "Excellent answer, Visal!"], [370.72, 376.92, "Great work! Now you can use eight new words and concession: concessive conjunction plus clause, main clause."], [377.22, 382.5, "Today's value is open-mindedness. Be open to new places, people and ideas."], [382.8, 385.49, "See you in Unit thirteen. Goodbye!"], [385.79, 389.13, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit13-Emphatic-Structures": [[0.35, 5.05, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.35, 8.93, "Hi! I'm Visal. Let's learn together!"], [9.23, 14.97, "Unit thirteen: Emphatic Structures. Today you will intensify meaning with so...that and such...that."], [15.27, 18.09, "Here is our lesson map. Let's start!"], [19.03, 22.14, "Part one: words. You will learn eight new words."], [22.98, 23.9, "So...that."], [24.92, 28.32, "So...that means a pattern for a result after an adjective."], [28.92, 30.84, "It was so cold that we stayed in."], [31.45, 33.88, "Your turn. Say: So...that."], [36.73, 37.65, "So...that."], [38.42, 39.53, "Such...that."], [40.55, 43.69, "Such...that means a pattern for a result after a noun."], [44.28, 46.43, "It was such a cold day that we stayed in."], [47.05, 49.61, "Your turn. Say: Such...that."], [52.47, 53.62, "Such...that."], [54.38, 55.27, "What a."], [56.28, 58.49, "What a means an exclamation about a noun."], [59.08, 60.04, "What a view!"], [60.65, 63.31, "Your turn. Say: What a."], [66.17, 66.97, "What a."], [67.72, 69.41, "Emphatic exclamation."], [70.42, 73.9, "Emphatic exclamation means a strong outcry."], [74.52, 76.35, "An emphatic exclamation."], [76.95, 80.47, "Your turn. Say: Emphatic exclamation."], [83.33, 85.14, "Emphatic exclamation."], [85.88, 87.2, "Intensifier."], [88.18, 90.84, "Intensifier means a word that adds strength."], [91.45, 93.62, "Extremely is an intensifier."], [94.22, 96.91, "Your turn. Say: Intensifier."], [99.77, 101.2, "Intensifier."], [101.95, 103.28, "Degree emphasis."], [104.28, 106.76, "Degree emphasis means stressing how much."], [107.35, 108.63, "Degree emphasis."], [109.22, 112.4, "Your turn. Say: Degree emphasis."], [115.27, 116.63, "Degree emphasis."], [117.38, 118.74, "Strong reaction."], [119.75, 122.4, "Strong reaction means a powerful feeling."], [122.98, 124.43, "A strong reaction."], [125.02, 128.56, "Your turn. Say: Strong reaction."], [131.4, 132.82, "Strong reaction."], [133.58, 134.75, "Heightened effect."], [135.75, 138.41, "Heightened effect means an effect made stronger."], [139.02, 140.33, "A heightened effect."], [140.92, 143.82, "Your turn. Say: Heightened effect."], [146.67, 148.5, "Heightened effect."], [149.3, 153.07, "Part two: dialogue. Let's listen to a conversation."], [153.92, 158.28, "Visal, how can we show that something was extremely cold and made us stay in?"], [159.38, 173.24, "It was so cold that we stayed in. So + adjective + that expresses a degree that causes a result. With a noun phrase, use such: It was such a cold day that we stayed in."], [174.35, 176.02, "What about exclamations?"], [177.12, 185.96, "What a cold day! uses what with a noun, and How cold it was! uses how with an adjective. They show strong reactions."], [187.05, 188.38, "Can we invert them?"], [189.48, 202.38, "Yes, for stronger emphasis in formal style: So cold was the night that we stayed in. Such was her talent that everyone listened. The inversion creates a heightened effect."], [203.53, 205.08, "Part three: grammar."], [205.92, 213.27, "Grammar focus: Emphatic result: so plus adjective plus that-clause; such plus a plus noun plus that-clause."], [213.57, 214.75, "Look at the pattern."], [215.45, 217.46, "It was so cold that we stayed in."], [218.35, 220.74, "It was such a cold day that we stayed in."], [221.65, 224.01, "Such was her talent that everyone listened."], [224.97, 232.62, "So + adjective and such + a + noun both lead to a that-clause. Fronting so or such adds formal, dramatic emphasis."], [233.38, 237.43, "Be careful! Don't say: It was so a cold day that I slept."], [239.37, 242.2, "Say: It was such a cold day that I slept."], [242.5, 244.11, "Use such before a noun."], [244.9, 247.54, "Part four: reading. Read and listen."], [248.33, 250.08, "A Remarkable Performance."], [250.38, 253.55, "It was such a moving performance that nobody left early."], [254.53, 257.97, "The music was so beautiful that many people cried."], [258.97, 260.95, "What a talented young pianist she is!"], [261.97, 264.46, "So great was her skill that the crowd stood up."], [265.47, 268.13, "These structures show the strength of an impression."], [269.23, 273.03, "Part five: quiz. Five questions. Are you ready?"], [273.88, 276.08, "It was blank cold that we stayed in."], [276.38, 279.57, "A, so. B, such. C, too."], [283.13, 284.75, "The answer is A: so."], [285.88, 288.09, "It was blank a long day that I slept."], [288.39, 291.57, "A, so. B, such. C, very."], [295.13, 296.76, "The answer is B: such."], [297.92, 299.85, "Which exclamation is correct?"], [300.15, 304.33, "A, What a view!. B, How a view!. C, What view a!."], [307.9, 310.06, "The answer is A: What a view!."], [311.22, 314.01, "So great was her skill is an blank structure."], [314.31, 318.07, "A, inverted. B, negative. C, passive."], [321.63, 323.54, "The answer is A: inverted."], [324.68, 327.77, "According to the reading, what did the crowd do?"], [328.07, 331.27, "A, stood up. B, left. C, slept."], [334.83, 336.47, "The answer is A: stood up."], [337.67, 340.47, "Part six: speaking. It's your turn to talk."], [341.32, 344.93, "Write a sentence using 'so...that' to show a strong effect."], [353.72, 355.02, "Now listen to Visal."], [355.32, 366.55, "The film was so exciting that I forgot to eat my popcorn. It was such a moving story that many people cried. I use so and such to show how strong the effect was."], [366.85, 368.49, "Excellent answer, Visal!"], [369.38, 377.96, "Great work! Now you can use eight new words and emphatic result: so plus adjective plus that-clause; such plus a plus noun plus that-clause."], [378.26, 383.3, "Today's value is appreciation of beauty. Learn to notice and value the beauty around you."], [383.6, 386.54, "See you in Unit fourteen. Goodbye!"], [386.84, 389.83, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit14-Advanced-Participle-Clauses": [[0.35, 5.54, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.84, 9.27, "Hi! I'm Visal. Let's learn together!"], [9.57, 16.57, "Unit fourteen: Advanced Participle Clauses. Today you will combine clauses with perfect and passive participles."], [16.88, 19.78, "Here is our lesson map. Let's start!"], [20.73, 23.92, "Part one: words. You will learn eight new words."], [24.78, 25.89, "Having done."], [26.88, 30.25, "Having done means a perfect participle for an earlier action."], [30.85, 32.92, "Having done his best, he rested."], [33.52, 35.8, "Your turn. Say: Having done."], [38.63, 39.77, "Having done."], [40.52, 42.51, "Being + past participle."], [43.52, 47.26, "Being + past participle means a passive participle clause."], [47.85, 49.65, "Being told to wait, he sat."], [50.25, 53.69, "Your turn. Say: Being + past participle."], [56.53, 58.51, "Being + past participle."], [59.25, 60.68, "Perfect participle."], [61.68, 64.86, "Perfect participle means having + past participle."], [65.45, 67.02, "A perfect participle."], [67.62, 70.55, "Your turn. Say: Perfect participle."], [73.4, 75.11, "Perfect participle."], [75.85, 77.61, "Passive participle clause."], [78.62, 82.74, "Passive participle clause means a clause with a passive meaning."], [83.35, 85.48, "A passive participle clause."], [86.08, 89.9, "Your turn. Say: Passive participle clause."], [92.73, 94.74, "Passive participle clause."], [95.48, 96.94, "Reduced clause."], [97.95, 101.61, "Reduced clause means a clause shortened with a participle."], [102.22, 103.76, "A reduced clause."], [104.35, 107.16, "Your turn. Say: Reduced clause."], [110.0, 111.55, "Reduced clause."], [112.28, 113.62, "Formal economy."], [114.62, 118.42, "Formal economy means saving words in formal style."], [119.02, 120.24, "Formal economy."], [120.85, 124.12, "Your turn. Say: Formal economy."], [126.97, 128.99, "Formal economy."], [129.75, 131.15, "Concise structure."], [132.15, 135.45, "Concise structure means a short, clear structure."], [136.05, 137.69, "A concise structure."], [138.28, 141.27, "Your turn. Say: Concise structure."], [144.13, 145.55, "Concise structure."], [146.32, 147.81, "Academic style."], [148.82, 152.23, "Academic style means the style of research papers."], [152.82, 154.49, "An academic style."], [155.08, 158.4, "Your turn. Say: Academic style."], [161.23, 162.79, "Academic style."], [163.6, 167.2, "Part two: dialogue. Let's listen to a conversation."], [168.05, 172.05, "Visal, how do we shorten Because she had been warned, she left early?"], [173.15, 184.84, "Having been warned, she left early. We combine the perfect and the passive: having been + past participle. It explains the reason and the earlier time."], [185.95, 187.54, "Can we use being alone?"], [188.65, 199.64, "Yes. Being tired, he went to bed means Because he was tired. Being asked to wait, he sat down uses the passive to show he received the request."], [200.75, 202.01, "What are the rules?"], [203.12, 215.54, "The subject of both clauses must be the same. A negative goes first: Not having studied, he failed. Without a common subject, the clause dangles and confuses the reader."], [216.7, 218.07, "Part three: grammar."], [218.92, 225.84, "Grammar focus: Advanced participle clause: having plus participle and being plus participle, main clause."], [226.14, 227.28, "Look at the pattern."], [227.98, 230.26, "Having been warned, she left early."], [231.15, 232.82, "Being tired, he went to bed."], [233.72, 236.15, "Not having studied, he failed the test."], [237.1, 245.14, "Use having + participle for an earlier action and being + participle for a passive reason. Keep the same subject in both clauses."], [245.88, 249.69, "Be careful! Don't say: Having been tired, he slept."], [251.63, 253.98, "Say: Being tired, he slept."], [254.28, 255.91, "Use being for a state."], [256.7, 259.56, "Part four: reading. Read and listen."], [260.37, 261.47, "Reading the Warning."], [261.77, 265.34, "Having been warned about the storm, the sailors returned to port."], [266.33, 268.79, "Being experienced, the captain stayed calm."], [269.8, 272.52, "Not having prepared, the crew had little time."], [273.53, 276.24, "Such clauses are typical of academic style."], [277.23, 280.19, "They save words and show the logic between ideas."], [281.3, 285.31, "Part five: quiz. Five questions. Are you ready?"], [286.15, 287.7, "blank warned, she left."], [288.0, 291.65, "A, Having been. B, Been having. C, Having."], [295.2, 297.17, "The answer is A: Having been."], [298.32, 300.27, "Which means 'Because he was tired'?"], [300.57, 304.51, "A, To tire. B, Being tired. C, Having tired."], [308.07, 310.5, "The answer is B: Being tired."], [311.65, 314.38, "A negative participle clause begins with blank."], [314.68, 317.8, "A, not. B, never. C, no."], [321.37, 323.12, "The answer is A: not."], [324.28, 326.78, "The subject of both clauses must be blank."], [327.08, 330.84, "A, plural. B, the same. C, different."], [334.4, 336.4, "The answer is B: the same."], [337.55, 339.88, "According to the reading, who stayed calm?"], [340.18, 344.15, "A, the captain. B, the crew. C, the sailors."], [347.7, 349.65, "The answer is A: the captain."], [350.87, 354.05, "Part six: speaking. It's your turn to talk."], [354.92, 359.84, "Rewrite a two-clause sentence using an advanced participle clause."], [368.65, 370.21, "Now listen to Visal."], [370.51, 381.51, "Because he had finished the report, he went home. Having finished the report, he went home. The participle clause is shorter, and it keeps the same subject, he."], [381.81, 383.57, "Excellent answer, Visal!"], [384.45, 392.95, "Great work! Now you can use eight new words and advanced participle clause: having plus participle and being plus participle, main clause."], [393.25, 398.94, "Today's value is precision of language. Choose your words carefully so others understand you."], [399.24, 401.98, "See you in Unit fifteen. Goodbye!"], [402.28, 405.51, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit15-Nominal-Relative-Clauses": [[0.35, 5.67, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.97, 9.62, "Hi! I'm Visal. Let's learn together!"], [9.92, 17.27, "Unit fifteen: Nominal Relative Clauses. Today you will use clauses that act as nouns without an antecedent."], [17.57, 20.07, "Here is our lesson map. Let's start!"], [21.03, 24.34, "Part one: words. You will learn eight new words."], [25.18, 25.91, "What."], [26.92, 28.59, "What means the thing that."], [29.18, 30.82, "What she said surprised me."], [31.42, 33.53, "Your turn. Say: What."], [36.4, 36.99, "What."], [37.75, 38.73, "Whoever."], [39.72, 41.61, "Whoever means any person who."], [42.22, 44.1, "Whoever calls, take a message."], [44.72, 47.29, "Your turn. Say: Whoever."], [50.13, 50.99, "Whoever."], [51.75, 52.68, "Whatever."], [53.68, 55.51, "Whatever means anything that."], [56.12, 57.48, "Take whatever you need."], [58.08, 60.12, "Your turn. Say: Whatever."], [62.97, 63.9, "Whatever."], [64.65, 65.71, "Whichever."], [66.72, 68.87, "Whichever means any one from a choice."], [69.48, 71.19, "Choose whichever you prefer."], [71.78, 74.09, "Your turn. Say: Whichever."], [76.93, 77.83, "Whichever."], [78.58, 80.12, "Free relative clause."], [81.12, 84.69, "Free relative clause means a relative clause with no antecedent."], [85.28, 87.1, "A free relative clause."], [87.68, 90.74, "Your turn. Say: Free relative clause."], [93.6, 95.41, "Free relative clause."], [96.15, 97.72, "No antecedent."], [98.72, 101.44, "No antecedent means no noun before the pronoun."], [102.05, 103.99, "No antecedent is needed."], [104.58, 107.47, "Your turn. Say: No antecedent."], [110.33, 111.8, "No antecedent."], [112.55, 113.8, "Embedded meaning."], [114.78, 118.62, "Embedded meaning means a meaning inside a larger sentence."], [119.22, 120.55, "Embedded meaning."], [121.15, 124.22, "Your turn. Say: Embedded meaning."], [127.07, 128.29, "Embedded meaning."], [129.05, 130.49, "Flexible reference."], [131.48, 134.81, "Flexible reference means a pronoun that can point to anything."], [135.42, 136.81, "Flexible reference."], [137.42, 140.32, "Your turn. Say: Flexible reference."], [143.17, 144.76, "Flexible reference."], [145.57, 149.57, "Part two: dialogue. Let's listen to a conversation."], [150.42, 153.88, "Visal, what is the grammar of What she said surprised me?"], [154.98, 165.03, "What she said is a nominal relative clause. It acts like a noun phrase, meaning the thing that she said, and it is the subject of surprised."], [166.12, 167.54, "Which words begin them?"], [168.65, 178.13, "What, whoever, whatever, whichever, whenever, wherever. Whoever wins gets a prize. Take whatever you need. Choose whichever suits you."], [179.25, 181.56, "How do they differ from ordinary relatives?"], [182.65, 199.07, "An ordinary relative follows a noun: the book that I read. A nominal relative contains its own antecedent, so we say What I read, not The what I read. Also, -ever adds the idea of any or no matter which."], [200.23, 201.94, "Part three: grammar."], [202.78, 209.04, "Grammar focus: Nominal relative clause: what and whoever and whatever plus clause = noun phrase."], [209.34, 210.39, "Look at the pattern."], [211.08, 212.76, "What she said surprised me."], [213.65, 215.5, "Whoever wins gets the prize."], [216.38, 217.77, "Take whatever you need."], [218.73, 224.5, "Nominal relative clauses start with what or -ever words and act as nouns. They need no antecedent."], [225.25, 228.08, "Be careful! Don't say: Take what ever you need."], [230.03, 232.0, "Say: Take whatever you need."], [232.3, 233.94, "Whatever is one word."], [234.73, 237.32, "Part four: reading. Read and listen."], [238.1, 239.46, "Take Whatever You Need."], [239.76, 242.59, "What the teacher explained made everything clear."], [243.6, 246.17, "Whoever finishes first may leave early."], [247.17, 249.04, "Take whichever book you prefer."], [250.03, 252.72, "Whatever you decide, I will support you."], [253.73, 256.41, "These clauses act like nouns inside the sentence."], [257.5, 261.66, "Part five: quiz. Five questions. Are you ready?"], [262.52, 264.27, "blank she said surprised me."], [264.57, 267.68, "A, What. B, That. C, Which."], [271.23, 273.05, "The answer is A: What."], [274.18, 275.99, "blank wins gets the prize."], [276.29, 279.83, "A, Whatever. B, Whoever. C, Whichever."], [283.4, 285.49, "The answer is B: Whoever."], [286.65, 289.74, "Choose blank you prefer, the red one or the blue one."], [290.04, 293.43, "A, whichever. B, whoever. C, whenever."], [296.97, 298.83, "The answer is A: whichever."], [299.98, 302.44, "A nominal relative clause has no blank."], [302.74, 306.68, "A, verb. B, antecedent. C, subject."], [310.23, 312.49, "The answer is B: antecedent."], [313.65, 316.94, "According to the reading, what may the early finisher do?"], [317.24, 320.49, "A, leave early. B, sing. C, sleep."], [324.03, 326.49, "The answer is A: leave early."], [327.7, 330.98, "Part six: speaking. It's your turn to talk."], [331.82, 335.31, "Write a sentence using 'whatever' as a nominal relative clause."], [344.12, 345.65, "Now listen to Visal."], [345.95, 359.17, "I will accept whatever you decide. Whatever happens tomorrow, we will face it together. The clause whatever you decide acts as the object of accept, so it works like a noun."], [359.47, 361.18, "Excellent answer, Visal!"], [362.08, 369.95, "Great work! Now you can use eight new words and nominal relative clause: what and whoever and whatever plus clause = noun phrase."], [370.25, 375.91, "Today's value is open-mindedness. Be open to new places, people and ideas."], [376.21, 379.02, "See you in Unit sixteen. Goodbye!"], [379.32, 382.13, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit16-Advanced-Conditional-Inversion": [[0.35, 5.21, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.51, 8.99, "Hi! I'm Visal. Let's learn together!"], [9.29, 15.07, "Unit sixteen: Advanced Conditional Inversion. Today you will write formal conditionals without 'if'."], [15.37, 18.1, "Here is our lesson map. Let's start!"], [19.03, 22.39, "Part one: words. You will learn eight new words."], [23.25, 23.98, "Should you."], [24.98, 27.77, "Should you means a formal replacement for if you should."], [28.38, 30.42, "Should you need help, call me."], [31.02, 33.72, "Your turn. Say: Should you."], [36.57, 37.64, "Should you."], [38.38, 39.51, "Were you to."], [40.52, 43.29, "Were you to means a formal replacement for if you were to."], [43.88, 45.55, "Were you to leave, I would miss you."], [46.15, 48.63, "Your turn. Say: Were you to."], [51.47, 52.49, "Were you to."], [53.25, 54.63, "Had it not been."], [55.65, 59.25, "Had it not been means a formal replacement for if it had not been."], [59.85, 62.02, "Had it not been for you, I would have failed."], [62.62, 65.36, "Your turn. Say: Had it not been."], [68.2, 69.41, "Had it not been."], [70.15, 71.36, "Formal inversion."], [72.35, 75.75, "Formal inversion means reversing words in a formal text."], [76.35, 77.92, "A formal inversion."], [78.52, 81.4, "Your turn. Say: Formal inversion."], [84.27, 85.55, "Formal inversion."], [86.28, 87.7, "Conditional without if."], [88.72, 91.75, "Conditional without if means a conditional that omits if."], [92.35, 93.9, "A conditional without if."], [94.48, 97.68, "Your turn. Say: Conditional without if."], [100.53, 101.94, "Conditional without if."], [102.68, 104.11, "Subjunctive inversion."], [105.12, 107.84, "Subjunctive inversion means an inversion with were."], [108.45, 109.98, "Subjunctive inversion."], [110.58, 113.42, "Your turn. Say: Subjunctive inversion."], [116.27, 118.16, "Subjunctive inversion."], [118.92, 120.13, "Elevated tone."], [121.12, 123.94, "Elevated tone means a serious, high style."], [124.55, 126.04, "An elevated tone."], [126.65, 129.64, "Your turn. Say: Elevated tone."], [132.5, 133.83, "Elevated tone."], [134.58, 135.98, "Literary conditional."], [136.98, 140.19, "Literary conditional means an elegant conditional in writing."], [140.78, 142.46, "A literary conditional."], [143.05, 146.06, "Your turn. Say: Literary conditional."], [148.9, 150.54, "Literary conditional."], [151.33, 154.91, "Part two: dialogue. Let's listen to a conversation."], [155.75, 160.21, "Visal, how does a formal notice say If you should need help, please call?"], [161.32, 173.42, "Should you need help, please call. We drop if and put should before the subject. It sounds polite and professional, so it is common in emails and instructions."], [174.52, 176.47, "And for imaginary situations?"], [177.58, 187.02, "Were you to accept the offer, you would earn more. That means If you were to accept. Were it not for the rain... means If it were not for the rain."], [188.12, 189.9, "Is the past form different?"], [190.98, 203.53, "Yes. Had it not been for your help, I would have failed uses had for the past. Remember the three: should for possible, were for unreal present, had for unreal past."], [204.67, 206.35, "Part three: grammar."], [207.22, 212.42, "Grammar focus: Conditional inversion: Should and Were and Had plus subject, main clause."], [212.72, 213.98, "Look at the pattern."], [214.68, 216.6, "Should you need help, please call me."], [217.52, 219.8, "Were you to accept, you would earn more."], [220.68, 222.93, "Had it not been for you, I would have failed."], [223.87, 232.42, "Should = possible. Were you to = unreal present or future. Had it not been = unreal past. Never use if after inversion."], [233.18, 236.91, "Be careful! Don't say: Should you to need help, call."], [238.87, 240.88, "Say: Should you need help, call."], [241.18, 242.7, "No to after should."], [243.5, 246.29, "Part four: reading. Read and listen."], [247.1, 248.26, "Dear Customer."], [248.56, 251.72, "Should you require assistance, please contact our office."], [252.73, 255.06, "Were you to cancel now, a fee would apply."], [256.07, 258.8, "Had we known about the problem, we would have acted sooner."], [259.8, 262.29, "Should the delay continue pendent."], [149.73, 151.35, "Context-dependent."], [152.13, 155.8, "Part two: dialogue. Let's listen to a conversation."], [156.65, 161.92, "Visal, why do we say I can't swim, but she can instead of but she can swim?"], [163.02, 173.95, "That is ellipsis. We omit words the listener already understands. The auxiliary can stands for can swim, which keeps speech natural and fast."], [175.05, 176.68, "What are common patterns?"], [177.78, 192.28, "So + auxiliary + subject: I like tea, and so does she. Neither does he. Substitution with so: I think so, I hope not. Also, to-infinitive without the verb: I'd love to."], [193.38, 194.55, "What is the risk?"], [195.65, 207.52, "Ambiguity. Ellipsis works only if the omitted words are recoverable from context. In formal writing, check that the reader can easily restore them."], [208.67, 210.19, "Part three: grammar."], [211.05, 216.25, "Grammar focus: Ellipsis: auxiliary and so and to stands for the omitted words."], [216.55, 217.78, "Look at the pattern."], [218.48, 220.69, "I like tea, and so does she."], [221.58, 223.59, "I can't swim, but she can."], [224.48, 226.58, "Are they coming? I think so."], [227.53, 234.82, "Omit words that context makes clear. Use auxiliaries, so / neither + auxiliary, and to-infinitives without the verb."], [235.58, 239.66, "Be careful! Don't say: I like tea, and so she does."], [241.6, 243.99, "Say: I like tea, and so does she."], [244.29, 245.68, "Invert after so."], [246.47, 249.61, "Part four: reading. Read and listen."], [250.4, 251.66, "Saying It Short."], [251.96, 254.25, "I haven't finished, but my brother has."], [255.23, 257.31, "She likes jazz, and so do I."], [258.3, 260.52, "Will it rain? I hope not."], [261.53, 263.8, "Would you like to come? I'd love to."], [264.8, 268.41, "Ellipsis keeps speech natural and avoids repeating words."], [269.5, 273.37, "Part five: quiz. Five questions. Are you ready?"], [274.22, 276.23, "I like tea, and so blank she."], [276.53, 279.45, "A, does. B,  museum opens at nine is fine if it is still true. Backshift is optional when the fact is general or the report is made soon after."], [172.48, 174.11, "When is backshift required?"], [175.22, 187.71, "When the situation has changed or the report is distant: He said he was leaving, and he did. Modals shift too: will becomes would, can becomes could, may becomes might."], [188.82, 190.87, "How does the reporting verb help?"], [191.98, 207.19, "It carries tone: insisted, claimed, admitted, warned. Choose the verb for the meaning, not only said. A warned that a storm was coming is clearer than said, because it also shows purpose."], [208.33, 209.81, "Part three: grammar."], [210.65, 217.49, "Grammar focus: Reported speech: reporting verb plus (backshifted) clause; no backshift for permanent facts."], [217.79, 219.08, "Look at the pattern."], [219.78, 221.96, "She said that the museum opens at nine."], [222.85, 224.5, "He said that he was leaving."], [225.42, 227.21, "They warned that a storm would arrive."], [228.17, 235.02, "Backshift when the situation has changed, but not for facts that are still true. Pick reporting verbs for tone and purpose."], [235.78, 238.9, "Be careful! Don't say: He said that he is leaving."], [240.87, 242.84, "Say: He said that he was leaving."], [243.14, 244.56, "Backshift the tense."], [245.37, 247.96, "Part four: reading. Read and listen."], [248.77, 250.46, "To Shift or Not to Shift."], [250.76, 253.58, "She said that the museum opens at nine every day."], [254.57, 257.76, "He said that he was leaving, and he left the next morning."], [258.77, 261.13, "They warned that a storm would arrive by evening."], [262.13, 264.77, "The guide insisted that visitors keep together."], [265.77, 268.97, "The reporting verb tells us how to understand the words."], [270.07, 274.17, "Part five: quiz. Five questions. Are you ready?"], [275.02, 277.62, "He said he blank leaving. (backshifted)"], [277.92, 280.96, "A, was. B, is. C, will be."], [284.5, 286.37 "Visal, why would a storyteller write Down came the rain instead of The rain came down?"], [162.68, 172.95, "It is stylistic fronting. The adverb Down moves to the front, then the verb, then the noun subject. It paints a quick, vivid picture and builds suspense."], [174.05, 175.18, "Are there rules?"], [176.28, 191.81, "The subject must be a noun for the inversion: Away ran the thief. With a pronoun, the order does not invert: Away he ran. Intransitive verbs of movement or position work best."], [192.92, 194.39, "Where is it used?"], [195.48, 207.32, "In stories, speeches and descriptions. In everyday talk it is rare, so use it deliberately, one or two times in a passage, to mark a turning point."], [208.47, 210.5, "Part three: grammar."], [211.35, 218.86, "Grammar focus: Stylistic fronting: adverbial plus verb plus noun subject (or adverbial plus pronoun plus verb)."], [219.16, 220.49, "Look at the pattern."], [221.18, 222.57, "Down came the rain."], [223.48, 224.87, "Away ran the thief."], [225.78, 227.47, "Away she ran into the night."], [228.43, 235.38, "Front an adverb of place or direction. A noun subject comes after the verb; a pronoun subject stays before it."], [236.12, 239.57, "Be careful! Don't say: Away ran she."], [241.53, 243.22, "Say: Away she ran."], [243.52, 245.34, "Pronouns do not invert."], [246.13, 248.82, "Part four: reading. Read and listen."], [249.63, 250.94, "The Storm Breaks."], [251.24, 254.36, "Dark clouds filled the sky, and then down came the rain."], [255.37, 257.46, "Out of the shadows stepped a stranger."], [258.47, 261.04, "Away ran the children, laughing and shouting."], [262.03, 264.37, "Up the hill she climbed without looking back."], [265.37, 268.03, "The fronted adverbials make the story feel alive."], [269.13, 273.06, "Part five: quiz. Five questions. Are you ready?"], [273.92, 275.15, "Down blank the rain."], [275.45, 278.38, "A, came. B, come. C, coming."], [281.93, 283.92, "The answer is A: came."], [285.08, 286.57, "Away What about something happening right now?"], [164.25, 174.83, "Be about to means very soon: The film is about to start. Be on the verge of means almost at the point of: The company is on the verge of collapse."], [175.92, 177.6, "What about timetables?"], [178.72, 192.82, "Be due to shows an expected time: The train is due to arrive at six. It is an expectation, not a promise, so delays are possible. Compare be bound to, which is certain."], [193.97, 195.43, "Part three: grammar."], [196.28, 201.99, "Grammar focus: Advanced future: be about to and due to and set to and to plus infinitive."], [202.29, 203.56, "Look at the pattern."], [204.25, 205.73, "The film is about to start."], [206.62, 208.84, "The train is due to arrive at six."], [209.75, 212.48, "The president is set to visit Japan next week."], [213.43, 221.03, "Use be about to for the immediate future, be due to for expected times, be set to / be to for official plans, and be on the verge of for the brink of change."], [221.78, 225.41, "Be careful! Don't say: The film is going start now."], [227.37, 229.55, "Say: The film is about to start."], [229.85, 231.31, "Use be about to."], [232.1, 234.71, "Part four: reading. Read and listen."], [235.5, 236.79, "Breaking News."], [237.09, 239.96, "The prime minister is set to announce a new policy."], [240.97, 243.27, "The new bridge is due to open in March."], [244.27, 246.95, "Talks are about to begin between the two leaders."], [247.97, 250.27, "The company is on the verge of collapse."], [251.27, 254.03, "These future forms suit the language of news."], [255.13, 258.97, "Part five: quiz. Five questions. Are you ready?"], [259.82, 262.19, "The train is blank to arrive at six."], [262.49, 266.04, "A, due. B, about. C, verge."], [269.6, 271.32, "The answer is A: due."], [272.48, 274.39, "Be blank to means very soon."], [274.69, 277.8, "A, bound. B, about. C, due."], [281.33, 283.11, "The answer is B: about."], [284.25, 287.58, "The president is blank visit Japan. (official plan)"], [287.88, 290.84, "A, to. B, for. C, at."], [294.4, 296.02, "The answer is A: to."], [297.15, 299.56, "Which phrase means 'almost at the point of'?"], [299.86, 304.08, "A, set for. B, on the verge of. C, due to."], [307.63, 309.52, "The answer is B: on the verge of."], [310.68, 313.37, "According to the reading, when is the bridge due to open?"], [313.67, 317.48, "A, in March. B, in June. C, next year."], [321.03, 322.88, "The answer is A: in March."], [324.07, 327.03, "Part six: speaking. It's your turn to talk."], [327.88, 331.18, "Write a news-style sentence using 'be set to' or 'be to'."], [339.98, 341.65, "Now listen to Visal."], [341.95, 353.26, "The new airport is set to open next spring. The mayor is to cut the ribbon at the ceremony. These future forms sound official and suit a news report."], [353.56, 355.28, "Excellent answer, Visal!"], [356.18, 363.31, "Great work! Now you can use eight new words and advanced future: be about to and due to and set to and to plus infinitive."], [363.61, 367.71, "Today's value is foresight. Prepare today for the world of tomorrow."], [368.01, 370.69, "See you in Unit twenty-one. Goodbye!"], [370.99, 373.68, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit21-Modal-Nuances-of-Probability": [[0.35, 5.61, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.91, 9.13, "Hi! I'm Visal. Let's learn together!"], [9.43, 16.29, "Unit twenty-one: Modal Nuances of Probability. Today you will grade predictions from uncertain to certain."], [16.59, 19.23, "Here is our lesson map. Let's start!"], [20.17, 23.2, "Part one: words. You will learn eight new words."], [24.05, 25.0, "Be bound to."], [26.02, 28.41, "Be bound to means almost certain to happen."], [29.02, 30.26, "He is bound to win."], [30.85, 33.78, "Your turn. Say: Be bound to."], [36.63, 37.94, "Be bound to."], [38.68, 39.93, "Be likely to."], [40.92, 42.85, "Be likely to means probable."], [43.45, 44.81, "It is likely to rain."], [ ly to, may well, could well, might, be unlikely to. Choose the one that matches your confidence, especially in forecasts and academic hedging."], [194.73, 196.47, "Part three: grammar."], [197.32, 205.4, "Grammar focus: Probability: subject plus be bound and likely and sure and unlikely to plus verb; modal plus well."], [205.7, 206.86, "Look at the pattern."], [207.55, 209.32, "He is bound to win the race."], [210.22, 212.1, "It may well rain this afternoon."], [213.02, 215.21, "She is unlikely to arrive early."], [216.17, 224.25, "Bound to and sure to are nearly certain. Likely to is probable. May well and could well are quite possible. Unlikely to is improbable."], [224.98, 228.17, "Be careful! Don't say: He is bound win."], [230.13, 232.0, "Say: He is bound to win."], [232.31, 233.67, "Use to after bound."], [234.47, 236.89, "Part four: reading. Read and listen."], [237.7, 239.32, "Forecasting the Future."], [239.62, 242.57, "The team is bound to win after such a strong season."], [243.57, 245.43, "It is likely to rain by evening."], [246.43, 248.55, "The weather could well change tomorrow."], [249.53, 252.22, "The coach is unlikely to make any changes."], [253.23, 255.75, "Each phrase gives a different level of certainty."], [256.87, 261.02, "Part five: quiz. Five questions. Are you ready?"], [261.88, 264.4, "He blank to win. (almost certain)"], [264.7, 268.36, "A, is bound. B, may well. C, is unlikely."], [271.9, 274.1, "The answer is A: is bound."], [275.25, 276.96, "It blank well rain tonight."], [277.26, 280.74, "A, may. B, is. C, has."], [284.3, 286.22, "The answer is A: may."], [287.38, 289.23, "Which is the weakest probability?"], [289.53, 293.88, "A, is bound to. B, is likely to. C, is unlikely to."], [297.43, 300.11, "The answer is C: is unlikely to."], [301.25, 303.17, "Be sure to expresses blank."], [303.47, 307.84, "A, near certainty. B, impossibility. C, a request."], [311.4, 314.03, "The answer is A: near certainty."], [315.18, 318.38, "According to the reading, who is unlikely to make changes?"], [318.68, 322.51, "A, the coach. B, the player. C, the referee."], [326.07, 328.18, "The answer is A: the coach."], [329.37, 332.43, "Part six: speaking. It's your turn to talk."], [333.28, 336.33, "Make three predictions with different levels of certainty."], [345.12, 346.69, "Now listen to Visal."], [346.99, 356.16, "The sun is bound to rise tomorrow. It is likely to be hot this afternoon. It could well rain in the evening. I use different phrases to show how sure I am."], [356.46, 358.19, "Excellent answer, Visal!"], [359.08, 368.3, "Great work! Now you can use eight new words and probability: subject plus be bound and likely and sure and unlikely to plus verb; modal plus well."], [368.6, 373.52, "Today's value is rational reflection. Pause to think carefully before you decide."], [373.82, 376.58, "See you in Unit twenty-two. Goodbye!"], [376.88, 379.68, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit22-Advanced-Determiners": [[0.35, 5.44, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.74, 9.2, "Hi! I'm Visal. Let's learn together!"], [9.5, 18.03, "Unit twenty-two: Advanced Determiners. Today you will use either, neither, each, every, whole, all, both and none precisely."], [18.33, 20.91, "Here is our lesson map. Let's start!"], [21.87, 25.27, "Part one: words. You will learn eight new words."], [26.12, 26.9, "Either."], [27.88, 29.86, "Either means one or the other of two."], [30.45, 31.96, "Either road is fine."], [32.55, 34.91, "Your turn. Say: Either."], [37.77, 38.48, "Either."], [39.22, 40.09, "Neither."], [41.08, 43.15, "Neither means not one and not the other."], [43.75, 45.68, "Neither answer is correct."], [46.28, 48.89, "Your turn. Say: Neither."], [51.73, 52.39, "Neither."], [53.15, 53.83, "Each."], [54.82, 57.86, "Each means every one, taken individually."], [58.45, 59.95, "Each student has a book."], [60.55, 62.77, "Your turn. Say: Each."], [65.63, 66.48, "Each."] ttern."], [201.18, 203.18, "Each student received a certificate."], [204.08, 205.76, "Neither answer is correct."], [206.65, 208.17, "The whole class laughed."], [209.13, 218.56, "Either, neither and both = two. Each = individuals. Every = the whole group. Whole follows the article. None = not any."], [219.32, 222.75, "Be careful! Don't say: Every of the students came."], [224.7, 227.12, "Say: Every one of the students came."], [227.42, 228.78, "Use every one of."], [229.57, 232.25, "Part four: reading. Read and listen."], [233.07, 234.58, "Counting Everyone In."], [234.88, 237.66, "Each student received a certificate for their effort."], [238.67, 241.04, "Every student in the school took part."], [242.03, 244.59, "Neither of the two teams scored in the first half."], [245.6, 247.62, "The whole stadium cheered at the end."], [248.63, 251.27, "None of the visitors left before the final whistle."], [252.37, 256.29, "Part five: quiz. Five questions. Are you ready?"], [257.15, 259.39, "blank of the two answers is correct."], [259.69, 262.77, "A, Neither. B, Every. C, None."], [266.3, 268.1, "The answer is A: Neither."], [269.25, 272.44, "blank student has a locker. (individuals)"], [272.74, 275.65, "A, Whole. B, Each. C, Both."], [279.2, 281.29, "The answer is B: Each."], [282.45, 283.96, "The blank class laughed."], [284.26, 287.29, "A, whole. B, each. C, either."], [290.83, 292.42, "The answer is A: whole."], [293.55, 295.44, "Both refers to blank things."], [295.75, 298.76, "A, many. B, two. C, three."], [302.3, 304.09, "The answer is B: two."], [305.25, 307.82, "According to the reading, who cheered at the end?"], [308.12, 312.26, "A, the whole stadium. B, one team. C, the referee."], [315.8, 318.12, "The answer is A: the whole stadium."], [319.33, 322.68, "Part six: speaking. It's your turn to talk."], [323.52, 326.41, "Explain the difference between 'each' and 'every'."], [335.22, 336.6, "Now listen to Visal."], [336.9, 351.18, "Each looks at individuals one by on .12, "Your turn. Say: Bare infinitive."], [104.97, 106.23, "Bare infinitive."], [106.98, 107.89, "Permission."], [108.88, 110.81, "Permission means allowing something."], [111.42, 112.73, "They gave permission."], [113.32, 115.8, "Your turn. Say: Permission."], [118.63, 119.55, "Permission."], [120.32, 121.19, "Force."], [122.18, 124.46, "Force means pressure that makes someone act."], [125.05, 126.2, "She used force."], [126.82, 129.27, "Your turn. Say: Force."], [132.13, 133.03, "Force."], [133.83, 137.69, "Part two: dialogue. Let's listen to a conversation."], [138.55, 141.59, "Visal, what did your parents make or let you do as a child?"], [142.68, 153.12, "My parents made me do homework before play, and they let me stay up late on weekends. Make means force, and let means allow. Both take a bare infinitive."], [154.22, 155.72, "What about have and get?"], [156.82, 168.26, "Have someone do something is to arrange it: I had the mechanic check the car. Get someone to do something is to persuade: I got my brother to help. Get takes a to-infinitive."], [169.35, 170.41, "And help?"], [171.52, 185.04, "Help takes either: She helped me study or helped me to study. But the passive of make requires to: He was made to apologise. Also note the causative with objects: have the car repaired."], [186.2, 187.72, "Part three: grammar."], [188.58, 196.04, "Grammar focus: Causatives: make and let and have plus object plus base verb; get plus object plus to-infinitive."], [196.34, 197.53, "Look at the pattern."], [198.22, 200.24, "My parents made me do my homework."], [201.15, 202.67, "They let me stay up late."], [203.58, 205.33, "I got my brother to help me."], [206.27, 214.8, "Make, let and have take object + bare infinitive. Get takes object + to-infinitive. Help takes either. Passive make takes to."], [215.55, 218.28, "Be careful! Don't say: She made me to leave."], [220.23, 222.51, "Say: She made me leave."], [222.81, 224.47, "Use the bare infinitive."], [225.27, 227.94, "Part four: reading. Read and listen."], [228.73, 229.92, "Rules at Home."], [230.22, 232.56, "My parents made me do my homework first."], [233.57, 235.95, "They let me watch television on weekends."], [236.93, 239.55, "Sometimes I got my brother to help with chores."], [240.53, 242.92, "My mother had the neighbour repair the fence."], [243.9, 246.46, "These patterns show who controls the action."], [247.57, 251.5, "Part five: quiz. Five questions. Are you ready?"], [252.35, 254.3, "The teacher made us blank quietly."], [254.6, 257.91, "A, work. B, to work. C, working."], [261.47, 263.12, "The answer is A: work."], [264.28, 265.82, "She let me blank early."], [266.12, 269.25, "A, leave. B, to leave. C, leaving."], [272.8, 274.76, "The answer is A: leave."], [275.92, 277.25, "I got him blank me."], [277.55, 280.81, "A, help. B, to help. C, helping."], [284.37, 286.39, "The answer is B: to help."], [287.55, 289.77, "Which means 'arrange for someone to do it'?"], [290.07, 293.22, "A, have. B, make. C, let."], [296.77, 298.75, "The answer is A: have."], [299.92, 302.93, "According to the reading, what did the neighbour repair?"], [303.23, 306.82, "A, the fence. B, the roof. C, the car."], [310.37, 312.59, "The answer is A: the fence."], [313.8, 317.01, "Part six: speaking. It's your turn to talk."], [317.85, 320.37, "What did your parents make or let you do as a child?"], [329.18, 330.74, "Now listen to Visal."], [331.04, 342.48, "My parents made me tidy my room every day. They let me play outside until dark. I also got my brother to help me with homework. These patterns show who had power."], [342.78, 344.58, "Excellent answer, Visal!"], [345.48, 354.69, "Great work! Now you can use eight new words and causatives: make and let and have plus object plus base verb; get plus object plus to-infinitive."], [355.0, 358.93, "Today's value is gratitude. Say thank you for your home and family."], [359.23, 362.3, "See you in Unit twenty-five. Goodbye!"], [362.6, 365.25, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit25-Future-Perfect-Continuous": [[0.35, 5.38, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.68, 8.91, "Hi! I'm Visal. Let's learn together!"], [9.21, 16.35, "Unit twenty-five: Future Perfect Continuous. Today you will show how long an activity will have lasted by a future point."], [16.65, 19.33, "Here is our lesson map. Let's start!"], [20.27, 23.74, "Part one: words. You will learn eight new words."], [24.58, 25.58, "Will have been."], [26.58, 30.38, "Will have been means the auxiliary in the future perfect continuous."], [30.98, 32.3, "I will have been working."], [32.88, 35.65, "Your turn. Say: Will have been."], [38.5, 39.55, "Will have been."], [40.28, 41.19, "Duration."], [42.18, 44.81, "Duration means how long something lasts."], [45.42, 47.18, "The duration is two hours."], [47.78, 50.74, "Your turn. Say: Duration."], [53.6, 54.52, "Duration."], [55.28, 56.13, "By then."], [57.15, 59.54, "By then means before or at that future time."], [60.15, 61.93, "By then I will have been waiting."], [62.52, 64.9, "Your turn. Say: By then."], [67.77, 68.87, "By then."], [69.62, 70.58, "By the time."], [71.58, 73.95, "By the time means before a future event."], [74.55, 77.16, "By the time you arrive, I will have been cooking."], [77.75, 80.24, "Your turn. Say: By the time."], [83.1, 84.53, "By the time."], [85.28, 86.25, "Ongoing."], [87.25, 89.44, "Ongoing means still continuing."], [90.05, 91.71, "An ongoing process."], [92.32, 95.07, "Your turn. Say: Ongoing."], [97.93, 99.05, "Ongoing."], [99.82, 101.03, "Accumulated."], [102.02, 104.38, "Accumulated means built up over time."], [104.98, 106.84, "Accumulated experience."], [107.45, 110.31, "Your turn. Say: Accumulated."], [113.17, 114.31, "Accumulated."], [115.05, 116.1, "Milestone."], [117.08, 119.49, "Milestone means an important stage."], [120.08, 121.59, "A career milestone."], [122.18, 124.81, "Your turn. Say: Milestone."], [127.67, 128.6, " re."], [250.42, 253.96, "By next June, I will have been learning English for ten years."], [254.97, 259.06, "By the time the course ends, we will have been studying together for a year."], [260.07, 263.83, "The company will have been operating for a century by 2040."], [264.83, 267.8, "Our teacher will have been teaching for thirty years by then."], [268.8, 271.8, "This tense measures duration from a future point of view."], [272.9, 276.91, "Part five: quiz. Five questions. Are you ready?"], [277.75, 280.4, "By June she blank teaching for 20 years."], [280.7, 284.05, "A, will have been. B, will be. C, has."], [287.6, 290.02, "The answer is A: will have been."], [291.18, 293.96, "The future perfect continuous stresses blank."], [294.26, 298.05, "A, duration. B, completion. C, a habit."], [301.6, 303.66, "The answer is A: duration."], [304.82, 307.68, "By the time you arrive, I blank cooking for two hours."], [307.98, 311.5, "A, will have been. B, am. C, will be."], [315.07, 317.33, "The answer is A: will have been."], [318.48, 320.64, "Which verb needs the simple form?"], [320.94, 324.06, "A, work. B, know. C, study."], [327.6, 329.46, "The answer is B: know."], [330.62, 334.17, "According to the reading, how long will the teacher have been teaching?"], [334.47, 338.68, "A, thirty years. B, ten years. C, a year."], [342.23, 343.99, "The answer is A: thirty years."], [345.2, 348.41, "Part six: speaking. It's your turn to talk."], [349.25, 353.18, "Write a sentence about how long you will have been studying English by next year."], [361.98, 363.32, "Now listen to Visal."], [363.62, 374.98, "By next year, I will have been studying English for six years. By then I will have been attending this school for three years. This tense shows how long the activity has lasted."], [375.28, 377.47, "Excellent answer, Visal!"], [378.38, 384.96, "Great work! Now you can use eight new words and future perfect continuous: will have been plus verb-ing plus duration."], [385.26, 389.53, " .28, 119.64, "Can't help doing means cannot stop yourself."], [120.25, 121.77, "I can't help laughing."], [122.38, 125.38, "Your turn. Say: Can't help doing."], [128.23, 129.64, "Can't help doing."], [130.38, 131.47, "Meaning change."], [132.45, 135.51, "Meaning change means a different sense with another form."], [136.12, 137.42, "A meaning change."], [138.02, 140.98, "Your turn. Say: Meaning change."], [143.83, 144.96, "Meaning change."], [145.77, 149.5, "Part two: dialogue. Let's listen to a conversation."], [150.35, 155.08, "Visal, what is the difference between I remember to post it and I remember posting it?"], [156.18, 167.03, "Remember to post is an action you do not forget. Remember posting is a memory of a past action. The same pattern applies to forget, stop and try."], [168.15, 169.58, "Which others are tricky?"], [170.68, 186.18, "Go on doing means continue, while go on to do means do the next thing. Mean to do is to intend, and mean doing is to involve. Regret to say is formal news, but regret saying is sorrow about the past."], [187.28, 188.4, "And can't help?"], [189.52, 202.21, "Can't help + gerund means cannot stop oneself: I can't help laughing. Learn these pairs one at a time, with your own examples, because the meaning depends entirely on the form."], [203.37, 205.19, "Part three: grammar."], [206.05, 213.17, "Grammar focus: Verb plus gerund (past, continuing) vs verb plus to-infinitive (next, intended)."], [213.47, 214.61, "Look at the pattern."], [215.32, 217.37, "I remember meeting her years ago."], [218.28, 219.84, "He went on to win the final."], [220.75, 222.84, "I can't help laughing at his jokes."], [223.8, 232.97, "Some verbs change meaning: remember, regret, go on, mean, stop, try. Gerund = past / continuing. To-infinitive = next / intended."], [233.72, 237.45, "Be careful! Don't say: I remember to meet her once."], [239.4, 241.47, "Say: I remember meeting her once."], [241.77, 243.51, "Use the gerund for memory."], [244.3, 247.38, "Part four: reading. Read and listen."], [248.17, 249.95, "Same Verb, Different Meaning."], [250.25, 253.44, "I remember meeting my best friend on the first day of school."], [254.43, 256.67, "I must remember to send her a card."], [257.67, 259.47, "She went on talking for an hour."], [260.47, 262.83, "He went on to become a famous scientist."], [263.83, 266.66, "I can't help smiling when I see old photos."], [267.77, 271.93, "Part five: quiz. Five questions. Are you ready?"], [272.78, 274.6, "I remember blank him last year."], [274.9, 277.95, "A, meeting. B, to meet. C, meet."], [281.5, 283.35, "The answer is A: meeting."], [284.48, 287.26, "Remember blank the door! (do not forget)"], [287.56, 290.72, "A, locking. B, to lock. C, lock."], [294.27, 295.95, "The answer is B: to lock."], [297.12, 299.76, "She went on blank a doctor. (next step)"], [300.06, 303.56, "A, becoming. B, to become. C, become."], [307.1, 309.02, "The answer is B: to become."], [310.18, 311.51, "I can't help blank."], [311.81, 315.15, "A, laugh. B, laughing. C, to laugh."], [318.7, 320.86, "The answer is B: laughing."], [322.02, 325.07, "According to the reading, what must the writer remember to send?"], [325.37, 328.97, "A, a card. B, a letter. C, a gift."], [332.53, 334.36, "The answer is A: a card."], [335.57, 338.88, "Part six: speaking. It's your turn to talk."], [339.72, 343.7, "Write two sentences that show the difference between 'go on doing' and 'go on to do'."], [352.52, 353.96, "Now listen to Visal."], [354.26, 365.64, "He went on talking for two hours, so we were tired. He went on to become a famous writer after he finished school. The first means continue, and the second means the next step."], [365.94, 367.78, "Excellent answer, Visal!"], [368.68, 377.52, "Great work! Now you can use eight new words and verb plus gerund (past, continuing) vs verb plus to-infinitive (next, intended)."], [377.82, 382.77, "Today's value is precision of language. Choose your words carefully so others understand you."], [383.07, 386.55, "See you in Unit twenty-seven. Goodbye!"], [386.85, 389.78, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit27-Passive-Gerunds-and-Infinitives": [[0.35, 5.65, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.95, 9.41, "Hi! I'm Visal. Let's learn together!"], [9.71, 17.74, "Unit twenty-seven: Passive Gerunds and Infinitives. Today you will use passive forms after verbs of feeling and necessity."], [18.04, 20.59, "Here is our lesson map. Let's start!"], [21.53, 24.63, "Part one: words. You will learn eight new words."], [25.48, 26.44, "Being done."], [27.45, 29.52, "Being done means a passive gerund."], [30.12, 31.9, "I hate being told what to do."], [32.48, 35.2, "Your turn. Say: Being done."], [38.07, 39.67, "Being done."], [40.42, 41.42, "To be done."], [42.42, 44.77, "To be done means a passive infinitive."], [45.35, 46.91, "The work needs to be done."], [47.52, 50.47, "Your turn. Say: To be done."], [53.33, 54.32, "To be done."], [55.08, 56.28, "Having been done."], [57.28, 59.91, "Having been done means a perfect passive gerund."], [60.52, 62.18, "He denied having been warned."], [62.78, 66.03, "Your turn. Say: Having been done."], [68.87, 70.2, "Having been done."], [70.95, 72.28, "To have been done."], [73.28, 76.76, "To have been done means a perfect passive infinitive."], [77.35, 78.92, "It seems to have been forgotten."], [79.52, 82.33, "Your turn. Say: To have been done."], [85.17, 86.3, "To have been done."], [87.05, 88.32, "Passive gerund."], [89.32, 92.38, "Passive gerund means being + past participle."], [92.98, 94.4, "A passive gerund."], [95.02, 97.97, "Your turn. Say: Passive gerund."], [100.83, 102.15, "Passive gerund."], [102.88, 104.26, "Passive infinitive."], [105.25, 108.59, "Passive infinitive means to be + past participle."], [109.18, 110.92, "A passive infinitive."], [111.52, 115.11, "Your turn. Say: Passive infinitive."], [117.97, 119.75, "Passive infinitive."], [120.48, 121.89, "Perfect passive."], [122.88, 126.24, "Perfect passive means having been / to have been + participle."], [126.85, 128.37, "A perfect passive."], [128.98, 131.73, "Your turn. Say: Perfect passive."], [134.57, 135.81, "Perfect passive."], [136.55, 137.33, "Agent."], [138.32, 140.75, "Agent means the person who does the action."], [141.35, 143.01, "The agent is not mentioned."], [143.62, 145.84, "Your turn. Say: Agent."], [148.7, 149.5, "Agent."], [150.3, 154.24, "Part two: dialogue. Let's listen to a conversation."], [155.08, 160.88, "Visal, which sounds better: I hate people telling me what to do, or I hate being told what to do?"], [161.98, 175.13, "The second is more natural when we focus on the receiver. Being told is a passive gerund, formed by being + past participle after verbs like hate, enjoy, avoid and deny."], [176.22, 177.65, "And with infinitives?"], [178.75, 191.59, "To be + participle follows verbs of need and expectation: The report needs to be finished. She expects to be promoted. The agent is often unknown or unimportant."], [192.68, 194.39, "What about an earlier action?"], [195.48, 206.76, "Use having been or to have been: He denied having been warned. The vase seems to have been broken. These perfect passives refer to a time before the main verb."], [207.9, 209.2, "Part three: grammar."], [210.05, 216.84, "Grammar focus: Passive forms: being and having been plus participle; to be and to have been plus participle."], [217.14, 218.28, "Look at the pattern."], [218.98, 220.74, "I hate being told what to do."], [221.65, 223.68, "The work needs to be finished today."], [224.58, 226.22, "He denied having been warned."], [227.17, 235.79, "After verbs of feeling use being + participle. After need or expect use to be + participle. Use having been / to have been for earlier actions."], [236.55, 240.39, "Be careful! Don't say: I hate to be told what to do."], [242.33, 244.61, "Say: I hate being told what to do."], [244.91, 246.44, "Use a passive gerund.  value is reflective awareness. Notice your own experience with care and honesty."], [388.58, 391.29, "See you in Unit twenty-eight. Goodbye!"], [391.59, 394.62, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit28-Quantifying-Expressions": [[0.35, 5.88, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [6.18, 9.66, "Hi! I'm Visal. Let's learn together!"], [9.96, 15.77, "Unit twenty-eight: Quantifying Expressions. Today you will state amounts precisely and formally."], [16.07, 18.54, "Here is our lesson map. Let's start!"], [19.5, 22.76, "Part one: words. You will learn eight new words."], [23.62, 24.84, "A great deal of."], [25.85, 29.16, "A great deal of means a large amount of something uncountable."], [29.75, 31.21, "A great deal of money."], [31.82, 34.9, "Your turn. Say: A great deal of."], [37.73, 39.05, "A great deal of."], [39.78, 41.16, "A handful of."], [42.15, 44.65, "A handful of means a very small number."], [45.25, 47.11, "A handful of students came."], [47.72, 50.4, "Your turn. Say: A handful of."], [53.27, 54.56, "A handful of."], [55.32, 56.7, "The vast majority of."], [57.72, 60.04, "The vast majority of means almost all."], [60.65, 62.81, "The vast majority of people agree."], [63.42, 66.8, "Your turn. Say: The vast majority of."], [69.67, 71.4, "The vast majority of."], [72.15, 73.52, "A fair amount of."], [74.52, 77.39, "A fair amount of means a reasonable quantity."], [77.98, 79.51, "A fair amount of work."], [80.12, 82.77, "Your turn. Say: A fair amount of."], [85.63, 86.86, "A fair amount of."], [87.62, 88.86, "Scarcely any."], [89.85, 91.85, "Scarcely any means almost none."], [92.45, 94.11, "There was scarcely any time."], [94.72, 97.52, "Your turn. Say: Scarcely any."], [100.37, 101.66, "Scarcely any."], [102.42, 103.5, "A wealth of."], [104.48, 107.4, "A wealth of means a large amount of valuable things."], [108.02, 109.66, "A wealth of information."], [110.25, 113.06, "Your turn. Say: A wealth of."], [115.9,  "As."], [110.18, 111.71, "Unreal comparison."], [112.72, 116.26, "Unreal comparison means comparing with an imagined situation."], [116.85, 118.61, "An unreal comparison."], [119.22, 122.25, "Your turn. Say: Unreal comparison."], [125.1, 126.74, "Unreal comparison."], [127.48, 128.98, "Subjunctive past."], [129.98, 133.63, "Subjunctive past means past form for unreal situations."], [134.22, 135.9, "He acts as if he were king."], [136.52, 139.69, "Your turn. Say: Subjunctive past."], [142.53, 144.13, "Subjunctive past."], [144.93, 148.51, "Part two: dialogue. Let's listen to a conversation."], [149.35, 152.31, "Visal, complete the sentence: He behaves as if..."], [153.42, 166.53, "He behaves as if he owned the place. As if is followed by a past tense for an unreal present, even though the meaning is about now. Were is used for all persons: as if he were king."], [167.62, 169.49, "What if the comparison is real?"], [170.58, 185.14, "If the situation is likely, use the present: It looks as if it is going to rain. After as if, past perfect shows an unreal past: He spoke as if he had seen the accident."], [186.25, 187.84, "How do like and as differ?"], [188.95, 205.05, "Like is a preposition followed by a noun: He runs like a deer. As is a conjunction followed by a clause: Do as I say. In informal speech, like is often used before clauses, but formal English avoids it."], [206.2, 207.86, "Part three: grammar."], [208.72, 215.38, "Grammar focus: Manner and comparison: as if and as though plus past (unreal) or present (real)."], [215.68, 216.79, "Look at the pattern."], [217.48, 219.49, "He behaves as if he owned the place."], [220.38, 222.29, "It looks as though it is going to rain."], [223.18, 225.62, "She spoke as if she had seen the accident."], [226.57, 235.88, "As if / as though + past for an unreal present, past perfect for an unreal past, and present for a likely situation. Use like + noun, as + clause."], [236.62, 240.55, "Be careful! Don't say: He behaves as if uppose."], [111.67, 112.77, "Suppose."], [113.52, 114.81, "Wish + would."], [115.82, 118.85, "Wish + would means annoyance about someone's behaviour."], [119.45, 120.87, "I wish he would stop."], [121.48, 124.52, "Your turn. Say: Wish + would."], [127.37, 128.75, "Wish + would."], [129.52, 130.74, "Hypothetical."], [131.75, 133.97, "Hypothetical means imagined, not real."], [134.58, 136.3, "A hypothetical case."], [136.92, 139.5, "Your turn. Say: Hypothetical."], [142.33, 143.3, "Hypothetical."], [144.1, 147.81, "Part two: dialogue. Let's listen to a conversation."], [148.65, 152.79, "Visal, what is the difference between I'd rather you stayed and I'd rather stay?"], [153.88, 164.67, "When the subject is the same, I'd rather stay uses the bare infinitive. When the subjects differ, use the past: I'd rather you stayed, which is an unreal present preference."], [165.78, 167.35, "What about it's about time?"], [168.45, 180.59, "It's about time we left uses the past simple, even though we mean now. Both it's time and it's high time work this way, and they express that something should have happened already."], [181.68, 183.07, "And wishes with would?"], [184.18, 200.0, "I wish you would listen expresses annoyance about behaviour. If only is stronger: If only he would listen. Supposing and suppose introduce hypothetical situations: Suppose you had a choice, what would you do?"], [201.17, 202.74, "Part three: grammar."], [203.58, 211.46, "Grammar focus: Preferences: would rather plus base (same subject) and plus past (different subject); it's time plus past."], [211.76, 212.92, "Look at the pattern."], [213.62, 215.48, "I would rather you stayed at home."], [216.38, 217.88, "It's about time we left."], [218.78, 220.2, "I wish he would listen."], [221.17, 230.01, "Would rather + different subject takes the past. It's about time + past. Wish + would shows annoyance. If only is stronger than wish."], [230.75, 233.88, "Be careful! Don't say: I'd rather you to go."], [235.83, 2 ject) and plus past (different subject); it's time plus past."], [373.68, 377.73, "Today's value is reflection. Think about what you learned and how you grew."], [378.03, 380.75, "See you in Unit thirty-one. Goodbye!"], [381.05, 383.97, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit31-Sentential-and-Non-finite-Relative-Clauses": [[0.35, 5.54, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.84, 9.27, "Hi! I'm Visal. Let's learn together!"], [9.57, 17.4, "Unit thirty-one: Sentential and Non-finite Relative Clauses. Today you will comment on a whole clause and reduce relative clauses."], [17.7, 20.23, "Here is our lesson map. Let's start!"], [21.2, 24.55, "Part one: words. You will learn eight new words."], [25.38, 26.23, "Which."], [27.25, 30.36, "Which means refers back to a whole clause, after a comma."], [30.95, 33.24, "The train was late, which annoyed us."], [33.85, 36.28, "Your turn. Say: Which."], [39.13, 39.88, "Which."], [40.62, 41.48, "Whereby."], [42.48, 44.34, "Whereby means by means of which."], [44.95, 47.45, "A system whereby people share cars."], [48.05, 50.54, "Your turn. Say: Whereby."], [53.4, 54.47, "Whereby."], [55.22, 56.0, "Whence."], [56.98, 59.85, "Whence means from which place, in formal writing."], [60.45, 61.97, "The village whence he came."], [62.58, 64.89, "Your turn. Say: Whence."], [67.73, 68.68, "Whence."], [69.42, 70.97, "Sentential relative."], [71.98, 75.43, "Sentential relative means a which-clause about a whole clause."], [76.05, 77.56, "A sentential relative."], [78.15, 81.24, "Your turn. Say: Sentential relative."], [84.1, 85.87, "Sentential relative."], [86.62, 87.98, "Non-finite."], [88.98, 91.63, "Non-finite means without tense or subject."], [92.22, 93.98, "A non-finite clause."], [94.58, 97.58, "Your turn. Say: Non-finite."], [100.43, 101.61, "Non-finite."], [102.35, 103.41, "Reduced."], [104.42, 105.94, "Reduced means shortened."], [106.55, 107.99, "A reduced clause."], [108.58, 110.7,
