        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Key Terms: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>

        const curriculum = {"C1": {"1": {"title": "Advanced Passive Constructions", "terms": ["Is said to be", "Is believed to be", "It is thought that", "Reporting verb", "Impersonal", "Academic tone", "Objectivity", "Distance"], "passage": "Advanced passive constructions create distance and objectivity. It is believed that the theory is correct. The results are said to be significant. This structure is common in academic and journalistic writing.", "question": "Rewrite this using an advanced passive construction: 'People think the plan will work.'", "funfact": "Did you know? Constructions like 'it is thought that' let a writer report a claim without directly stating who holds that belief."}, "2": {"title": "Inversion for Emphasis", "terms": ["Never have I", "Rarely does", "Not only", "Seldom", "Emphatic", "Formal register", "Fronting", "Literary style"], "passage": "Inversion reverses normal word order for emphasis, often in formal writing. Never have I seen such dedication. Rarely does she complain. Not only did he finish first, but he also broke the record.", "question": "Try rewriting a sentence using inversion, starting with 'Never have I...'", "funfact": "Did you know? Inversion for emphasis is more common in formal writing and literature than in everyday spoken English."}, "3": {"title": "Cleft Sentences", "terms": ["It was... that", "What... is", "Cleft structure", "Focus", "Highlight", "Emphasis", "Information structure", "Rhetorical"], "passage": "A cleft sentence splits information to highlight one part. It was John who broke the vase. What I need is more time. This structure lets a speaker emphasize exactly the right piece of information.", "question": "Rewrite this as a cleft sentence: 'Sarah won the competition.'", "funfact": "Did you know? Cleft sentences are a powerful tool in persuasive writing because they let the writer control exactly what the reader focuses on."}, "4": {"title": "Subjunctive Mood", "terms": ["I suggest that", "It is essential that", "Were", "Hypothetical wish", "Formal demand", "Recommendation", "Base form", "Unreal"], "passage": "The subjunctive mood expresses a wish, suggestion, or formal demand. I suggest that he arrive early. It is essential that she be informed. If I were you, I would reconsider.", "question": "Write a sentence using the subjunctive after 'I recommend that...'", "funfact": "Did you know? The subjunctive mood is fading from everyday English but still survives strongly in formal and legal writing."}, "5": {"title": "Advanced Reported Speech", "terms": ["Claimed", "Insisted", "Denied", "Reporting verb", "Nuance", "Implication", "Indirect meaning", "Tone"], "passage": "Advanced reported speech uses a specific reporting verb to add nuance. He claimed he was innocent. She insisted on paying. They denied any involvement. Each verb implies a slightly different tone.", "question": "Report a statement using 'insisted' instead of 'said'.", "funfact": "Did you know? Choosing the right reporting verb, like 'admitted' versus 'claimed', can subtly change how trustworthy a statement sounds."}, "6": {"title": "Participle Clauses", "terms": ["Having finished", "Walking down the street", "Present participle", "Past participle", "Reduce a clause", "Concise", "Formal writing", "Connect ideas"], "passage": "A participle clause makes writing more concise by reducing a full clause. Having finished his homework, he watched TV. Walking down the street, she saw an old friend. This structure connects two ideas smoothly.", "question": "Combine two sentences into one using a participle clause.", "funfact": "Did you know? Participle clauses are especially common in written English, where they help avoid repeating the subject twice."}, "7": {"title": "Fronting for Emphasis", "terms": ["Fronting", "Never have I", "Rarely does", "Inversion", "Emphatic word order", "Front position", "Stylistic effect", "Literary style"], "passage": "Fronting moves an element to the front of a sentence for emphasis. Never have I seen such dedication. Rarely does she complain about anything.", "question": "Write a sentence using fronting to add emphasis.", "funfact": "Did you know? Fronting with negative adverbs like 'never' or 'rarely' requires subject-verb inversion, just like in a question."}, "8": {"title": "Advanced Cleft Structures", "terms": ["It was...that", "What...is", "All...is", "Cleft sentence", "Focus structure", "Highlighting information", "Split sentence", "Emphasis structure"], "passage": "A cleft sentence splits information to highlight a specific part. It was John who called. What I need is more time. All she wants is peace.", "question": "Rewrite a simple sentence as a cleft sentence to add emphasis.", "funfact": "Did you know? Cleft sentences are extremely common in spoken English, even though many speakers don't consciously know the grammar term."}, "9": {"title": "Hypothetical Past (advanced)", "terms": ["Had I known", "Were it not for", "Inverted conditional", "Formal hypothetical", "Without 'if'", "Literary conditional", "Elevated register", "Formal writing"], "passage": "Advanced hypothetical structures can omit 'if' using inversion. Had I known, I would have come earlier. Were it not for her help, we would have failed.", "question": "Rewrite a conditional sentence using inversion instead of 'if'.", "funfact": "Did you know? This inverted conditional structure, without 'if', is considered quite formal and appears often in academic and literary writing."}, "10": {"title": "Complex Passive Voice", "terms": ["Is thought to have been", "Is rumored to be", "Multi-layered passive", "Passive with perfect infinitive", "Reported belief", "Layered structure", "Formal register", "Objective claim"], "passage": "Complex passive structures combine multiple layers of grammar. The bridge is thought to have been built in the 1800s. He is rumored to be leaving the company.", "question": "Write a complex passive sentence about a historical fact or rumor.", "funfact": "Did you know? These layered passive structures allow writers to express uncertainty or attribute a claim without naming a source."}, "11": {"title": "Advanced Modal Perfect", "terms": ["Can't have", "Needn't have", "Would have", "Modal + perfect infinitive", "Past certainty", "Unnecessary past action", "Hypothetical past result", "Speculation"], "passage": "Advanced modal perfects express nuanced past meaning. She can't have finished already. You needn't have worried. I would have helped if you had asked.", "question": "Write a sentence using 'needn't have' about an unnecessary past action.", "funfact": "Did you know? 'Needn't have' specifically means an action was done but turned out to be unnecessary, unlike 'didn't need to'."}, "12": {"title": "Concessive Clauses", "terms": ["Even though", "Much as", "While", "Granted that", "Concession", "Acknowledging a point", "Contrast despite agreement", "Formal concession"], "passage": "A concessive clause acknowledges a point before making a contrasting one. Much as I admire her work, I disagree with this decision. Granted that it's difficult, it's still possible.", "question": "Write a sentence using 'much as' to concede a point.", "funfact": "Did you know? Concessive clauses are a sophisticated way to sound balanced and fair while still making a strong argument."}, "13": {"title": "Emphatic Structures", "terms": ["So...that", "Such...that", "What a", "Emphatic exclamation", "Intensifier", "Degree emphasis", "Strong reaction", "Heightened effect"], "passage": "Emphatic structures intensify meaning. It was so cold that the lake froze. She has such patience that nothing bothers her. What a remarkable achievement!", "question": "Write a sentence using 'so...that' to show a strong effect.", "funfact": "Did you know? 'So' is used before an adjective alone, while 'such' is used before an adjective plus a noun."}, "14": {"title": "Advanced Participle Clauses", "terms": ["Having done", "Being + past participle", "Perfect participle", "Passive participle clause", "Reduced clause", "Formal economy", "Concise structure", "Academic style"], "passage": "Advanced participle clauses create concise, formal sentences. Having finished the report, she left the office. Being asked to leave, he apologized and complied.", "question": "Rewrite a two-clause sentence using an advanced participle clause.", "funfact": "Did you know? Participle clauses are prized in formal writing because they express complex ideas in fewer words."}, "15": {"title": "Nominal Relative Clauses", "terms": ["What", "Whoever", "Whatever", "Whichever", "Free relative clause", "No antecedent", "Embedded meaning", "Flexible reference"], "passage": "A nominal relative clause has no separate antecedent — the pronoun itself carries the meaning. Whatever you decide is fine with me. Whoever arrives first can choose.", "question": "Write a sentence using 'whatever' as a nominal relative clause.", "funfact": "Did you know? These clauses are called 'nominal' because the whole clause functions exactly like a single noun."}, "16": {"title": "Advanced Conditional Inversion", "terms": ["Should you", "Were you to", "Had it not been", "Formal inversion", "Conditional without if", "Subjunctive inversion", "Elevated tone", "Literary conditional"], "passage": "Advanced conditional inversion drops 'if' for a formal tone. Should you need help, call me. Were you to ask, I would agree. Had it not been for her, we'd have failed.", "question": "Write a formal conditional sentence using inversion instead of 'if'.", "funfact": "Did you know? This structure is especially common in legal, academic, and diplomatic English."}, "17": {"title": "Elliptical Constructions", "terms": ["Ellipsis", "Omission", "Implied meaning", "So does she", "I think so", "Reduced clause", "Economy of language", "Context-dependent"], "passage": "Ellipsis omits words that are understood from context. I can swim, and so can she. Do you want to come? I think so. Both examples avoid repeating information.", "question": "Write a sentence that uses ellipsis to avoid repetition.", "funfact": "Did you know? Ellipsis makes English sound more natural — repeating full sentences without it can sound stiff and unnatural."}, "18": {"title": "Advanced Reported Speech Nuances", "terms": ["Backshift", "No backshift", "Reporting verb choice", "Insist", "Claim", "Modality shift", "Nuanced meaning", "Tone of reporting"], "passage": "Advanced reported speech considers backshift and reporting verb choice carefully. She insisted that he apologize. He claimed to have finished the work.", "question": "Report a statement using a nuanced reporting verb like 'insist' or 'claim'.", "funfact": "Did you know? Choosing 'claim' instead of 'say' can subtly suggest the speaker doubts whether the statement is true."}, "19": {"title": "Stylistic Fronting", "terms": ["Down came the rain", "Away she ran", "Adverbial fronting", "Literary inversion", "Descriptive emphasis", "Narrative style", "Dramatic effect", "Creative writing"], "passage": "Stylistic fronting creates dramatic effect in narrative writing. Down came the rain. Away she ran into the night. Such inversions are common in literary style.", "question": "Write a short, dramatic sentence using stylistic fronting.", "funfact": "Did you know? Stylistic fronting is more common in written literature and storytelling than in everyday conversation."}, "20": {"title": "Advanced Future Forms", "terms": ["Be about to", "Be due to", "Be on the verge of", "Be set to", "Be to", "Imminent", "Scheduled", "Formal"], "passage": "The train is about to leave. The report is due to be published next week, and the company is set to announce new jobs. Scientists are on the verge of a breakthrough. The minister is to visit Phnom Penh.", "question": "Write a news-style sentence using 'be set to' or 'be to'.", "funfact": "Did you know? 'Be to + infinitive' is common in news: 'The president is to visit Japan' means it is officially planned."}, "21": {"title": "Modal Nuances of Probability", "terms": ["Be bound to", "Be likely to", "Be sure to", "Be unlikely to", "May well", "Could well", "Probability", "Certainty"], "passage": "Prices are bound to rise if costs increase. The team is likely to win, but the match may well be close. The storm could well delay flights, although it is unlikely to cause serious damage.", "question": "Make three predictions with different levels of certainty.", "funfact": "Did you know? 'May well' and 'could well' suggest a stronger possibility than just 'may' or 'could'."}, "22": {"title": "Advanced Determiners", "terms": ["Either", "Neither", "Each", "Every", "Whole", "All", "Both", "None"], "passage": "Neither option was perfect, but each had advantages. Both proposals were read by every member of the committee. None of the data was lost, and the whole team agreed. Either plan could work.", "question": "Explain the difference between 'each' and 'every'.", "funfact": "Did you know? 'Each' focuses on individuals one by one, while 'every' sees them as a group."}, "23": {"title": "Grammar and Collocation", "terms": ["Collocation", "Make a decision", "Do research", "Take responsibility", "Pay attention", "Heavy rain", "Strong coffee", "Natural"], "passage": "Native speakers use collocations that sound natural. We make a decision, do research, take responsibility and pay attention. We say 'heavy rain' and 'strong coffee', not 'strong rain' or 'heavy coffee'.", "question": "Which English collocations do you find surprising?", "funfact": "Did you know? Learning words in collocations helps you sound natural much faster than learning single words."}, "24": {"title": "Causative Verb Patterns", "terms": ["Make", "Let", "Have", "Get", "Help", "Bare infinitive", "Permission", "Force"], "passage": "My teacher made us rewrite the essay. Our parents let us choose our subjects. The manager had the staff attend training, and she got her colleague to check the report. 'Make', 'let' and 'have' take a bare infinitive.", "question": "What did your parents make or let you do as a child?", "funfact": "Did you know? In the passive, 'make' needs 'to': 'We were made to wait' — but active 'They made us wait'."}, "25": {"title": "Future Perfect Continuous", "terms": ["Will have been", "Duration", "By then", "By the time", "Ongoing", "Accumulated", "Milestone", "Projection"], "passage": "The future perfect continuous looks back from a future point to show how long an activity will have been in progress. By next June, I will have been teaching for twenty years. By the time she arrives, we will have been waiting for two hours. It emphasises duration and accumulated effort.", "question": "Write a sentence about how long you will have been studying English by next year.", "funfact": "Did you know? Unlike the future perfect, this form stresses the duration of the activity, not its completion."}, "26": {"title": "Gerund and Infinitive: Advanced Patterns", "terms": ["Remember doing", "Regret to say", "Go on doing", "Go on to do", "Mean doing", "Mean to do", "Can't help doing", "Meaning change"], "passage": "Some verbs change meaning with a gerund or an infinitive. She went on talking means she continued, but she went on to become a doctor means a new stage followed. I regret to inform you is formal news, while I regret telling him is a past regret. Learners must memorise these contrasts.", "question": "Write two sentences that show the difference between 'go on doing' and 'go on to do'.", "funfact": "Did you know? 'Can't help doing' means you cannot stop yourself, as in 'I can't help laughing'."}, "27": {"title": "Passive Gerunds and Infinitives", "terms": ["Being done", "To be done", "Having been done", "To have been done", "Passive gerund", "Passive infinitive", "Perfect passive", "Agent"], "passage": "We can use the passive after prepositions and verbs. She hates being interrupted. He expected to be promoted. The document is believed to have been written in 1800. Having been warned, they left early. These forms keep the focus on the receiver of the action.", "question": "Write a sentence using 'being' + past participle after a verb of feeling.", "funfact": "Did you know? Verbs like enjoy, avoid and risk take the passive gerund: 'He avoided being seen'."}, "28": {"title": "Quantifying Expressions", "terms": ["A great deal of", "A handful of", "The vast majority of", "A fair amount of", "Scarcely any", "A wealth of", "A host of", "Approximately"], "passage": "Advanced writers vary quantifiers. A great deal of research supports this view. Only a handful of students attended. The vast majority of people agree. There is a wealth of evidence, but scarcely any of it is recent. These expressions give precision and style.", "question": "Rewrite 'Many people agree' using a more precise quantifying expression.", "funfact": "Did you know? 'A great deal of' is used with uncountable nouns, while 'a large number of' is used with countable nouns."}, "29": {"title": "Clauses of Manner and Comparison", "terms": ["As if", "As though", "Just as", "The way", "Like", "As", "Unreal comparison", "Subjunctive past"], "passage": "As if and as though introduce an unreal comparison. He talks as if he owned the place. She looked as though she had seen a ghost. Just as the sun rises, hope returns. We use a past tense to show the comparison is not real, and we use the way in informal speech.", "question": "Complete the sentence: 'He behaves as if…'.", "funfact": "Did you know? Formal writing often uses 'were' after 'as if': 'as if he were the manager'."}, "30": {"title": "Wishes, Regrets and Preferences (advanced)", "terms": ["I'd sooner", "It's about time", "If only", "Would rather", "Supposing", "Suppose", "Wish + would", "Hypothetical"], "passage": "Advanced preferences and wishes use unreal tenses. I would rather you left now. It's about time we changed the system. If only she would listen! Supposing you lost your job, what would you do? The past tense signals an unreal present or future situation.", "question": "Write two sentences expressing a preference using 'would rather' and 'it's about time'.", "funfact": "Did you know? 'I'd sooner' means the same as 'I'd rather': 'I'd sooner walk than wait'."}, "31": {"title": "Sentential and Non-finite Relative Clauses", "terms": ["Which", "Whereby", "Whence", "Sentential relative", "Non-finite", "Reduced", "Comment clause", "Extra information"], "passage": "A sentential relative clause refers to a whole idea. He passed the exam, which surprised everyone. Whereby introduces a method: a system whereby tickets are sold online. Non-finite clauses are reduced: the woman sitting there. These forms add comment without a new sentence.", "question": "Add a sentential 'which' clause to this sentence: 'The train was late.'", "funfact": "Did you know? A sentential 'which' always follows a comma and refers to the whole preceding clause."}, "32": {"title": "Complex Noun Phrases", "terms": ["Premodifier", "Postmodifier", "Head noun", "Noun cluster", "Prepositional postmodifier", "Relative postmodifier", "Information density", "Academic style"], "passage": "A complex noun phrase has a head noun with modifiers before and after it. The recent government decision to raise taxes on imported goods caused debate. Premodifiers are adjectives and nouns, and postmodifiers are phrases or clauses. This structure packs information.", "question": "Expand 'a report' into a complex noun phrase with a premodifier and a postmodifier.", "funfact": "Did you know? Academic writing contains more nouns than spoken English, which makes noun phrases dense."}, "33": {"title": "Advanced Linking: Lest, With a View to", "terms": ["Lest", "With a view to", "In the hope that", "So as not to", "Provided", "Supposing", "Purpose", "Precaution"], "passage": "Formal English has special linking words. She spoke quietly lest she wake the baby. We wrote early with a view to securing a place. Lest is followed by a subjunctive or should. These patterns are used in literary and legal writing.", "question": "Write a formal sentence using 'lest' or 'with a view to'.", "funfact": "Did you know? 'Lest' has a negative meaning in itself, so do not add another negative word."}, "34": {"title": "Stance Adverbials", "terms": ["Admittedly", "Arguably", "Evidently", "Undoubtedly", "Presumably", "Regrettably", "Strictly speaking", "Hedge"], "passage": "Stance adverbials show the writer's attitude. Admittedly, the cost is high. Arguably, this is the best solution. Evidently, the data support the claim. Presumably, he knew the risk. They guide the reader and show how certain the writer is.", "question": "Rewrite 'The plan is good' adding a stance adverbial.", "funfact": "Did you know? 'Arguably' means that a case can be made, so it is a hedge, not a statement of fact."}, "35": {"title": "Contrastive Structures", "terms": ["Whereas", "While", "By contrast", "Conversely", "On the one hand", "On the other hand", "Unlike", "In contrast to"], "passage": "Contrast can be shown in many ways. Whereas urban areas grow, rural areas shrink. By contrast, coastal regions are stable. On the one hand, the plan is cheap; on the other hand, it is slow. Unlike his brother, he is shy.", "question": "Write two sentences that contrast two cities using different structures.", "funfact": "Did you know? 'Conversely' reverses the idea just mentioned, while 'by contrast' simply compares."}, "36": {"title": "Adjective and Noun + Preposition", "terms": ["Aware of", "Capable of", "Reliant on", "Reluctance to", "Tendency towards", "Insight into", "Impact on", "Emphasis on"], "passage": "Many adjectives and nouns take fixed prepositions. She is aware of the risks. There is a tendency towards early retirement. The study offers insight into poverty. Reluctance to change slows progress. Learners must remember the pairs as chunks.", "question": "Write two sentences with a noun + preposition combination.", "funfact": "Did you know? 'Impact on' is correct; 'impact to' is common but criticised in formal writing."}, "37": {"title": "Discourse Markers in Speech", "terms": ["Well", "I mean", "Anyway", "You know", "Actually", "As a matter of fact", "To be honest", "By the way"], "passage": "Discourse markers organise spoken English. Well, I think we should wait. I mean, it isn't easy. Anyway, let's move on. To be honest, I prefer the first plan. By the way, have you met her? They manage turns and show attitude.", "question": "Write a short dialogue using three discourse markers.", "funfact": "Did you know? 'Actually' in English often introduces a correction, not 'now' as in some languages."}, "38": {"title": "Tense and Aspect in Reporting Texts", "terms": ["Present perfect", "Past simple", "Reporting verb", "Backshift", "Time reference", "Still true", "News report", "Headline"], "passage": "Reports mix tenses with care. News stories use the past simple for events but the present perfect for recent updates. A reported fact that is still true may keep the present tense: She said that Paris is the capital. Headlines use the present for past events.", "question": "Rewrite this headline-style sentence as full past simple: 'Minister resigns'.", "funfact": "Did you know? Headlines often use the present simple for past events to sound immediate."}, "39": {"title": "Review: C1 Grammar", "terms": ["Inversion", "Cleft sentences", "Subjunctive", "Participle clauses", "Fronting", "Ellipsis", "Modal perfect", "Emphasis"], "passage": "C1 grammar gives writers control over emphasis and style: inversion, cleft sentences, the subjunctive, participle clauses, fronting, ellipsis and modal perfects. Used well, they make writing precise and elegant.", "question": "Which C1 structure will you use in your next essay?", "funfact": "Did you know? At C1, the goal is not only correct grammar but choosing the structure that best fits your purpose."}}};

        const LEVELS_ORDER = ['C1'];
        const gradeName = (lvl) => ({"A1": "A1", "A2": "A2", "B1": "B1", "B2": "B2", "C1": "C1", "C2": "C2"})[lvl] || lvl;
        const MIN_WORDS = {"A1": 3, "A2": 4, "B1": 6, "B2": 7, "C1": 8, "C2": 8};
        const minWords = () => MIN_WORDS[state.level] || 3;
        function allTermsForLevel(level) {
            let words = [];
            Object.keys(curriculum[level]).forEach(u => words.push(...curriculum[level][u].terms));
            return [...new Set(words)];
        }

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_grammar_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

        function selectLevel(lvl) {
            state.level = lvl;
            document.querySelectorAll('.level-btn').forEach(b => {
                b.classList.remove('bg-slate-700', 'text-white', 'shadow');
                b.classList.add('bg-gray-100');
            });
            const btn = document.getElementById('btn-' + lvl);
            if (btn) { btn.classList.remove('bg-gray-100'); btn.classList.add('bg-slate-700', 'text-white', 'shadow'); }
            document.getElementById('current-level-display').textContent = lvl;
            loadProgress();
            populateUnitSelect();
            renderContent();
        }

        // On phones the lesson sits below the module list, so after choosing a module, a unit
        // or the next lesson, the page scrolls to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');
            side.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => { if (Math.abs(side.getBoundingClientRect().top) > 40) side.scrollIntoView({ block: 'start' }); }, 700);
        }

        function updateUnit() {
            state.unit = parseInt(document.getElementById('unit-select').value);
            renderContent();
            scrollToLesson();
        }

                activeBtn.classList.remove('hover:bg-gray-100');

        // "Finish Activity" rewards each module of each unit once, plus one badge per unit
        function completeActivity() {
            markActivityComplete(state.tab);
            const gotStars = award(unitKey('finish-' + state.tab), 5);
            let gotBadge = false;
            const badgeKey = state.level + '|' + unitKey('badge');
            if (gotStars && !progress.awarded[badgeKey]) {
                progress.awarded[badgeKey] = true;
                state.badges += 1;
                document.getElementById('badge-count').textContent = state.badges;
                saveProgress();
                gotBadge = true;
            }
            if (gotBadge) alert(`🎉 Great work! You finished this activity, earned 5 Stars ⭐ and unlocked the Unit ${state.unit} Badge! 🏆`);
            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');
            else alert('✅ You already finished this activity. Try another module, or go to the next lesson! ▶️');
        }

        function nextLesson() {
            const levelData = curriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % unitNumbers.length;
            state.unit = unitNumbers[nextIdx];
            document.getElementById('unit-select').value = state.unit;
            renderContent();
            scrollToLesson(true);
        }

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }
        const countWords = (s) => (String(s).match(/[A-Za-z\u00C0-\u024F\u1780-\u17FF]+(?:['’-][A-Za-z]+)*/g) || []).length;

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function allVocabForLevel(level) {
            let words = [];
            Object.keys(curriculum[level]).forEach(u => words.push(...curriculum[level][u].vocab));
            return [...new Set(words)];
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();

            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }

            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

unreal situation."], [141.22, 143.58, "Your turn. Say: Unreal."], [146.43, 147.54, "Unreal."], [148.33, 152.19, "Part two: dialogue. Let's listen to a conversation."], [153.05, 157.92, "Visal, why do formal reports say I recommend that he be present, not that he is present?"], [159.02, 172.44, "That is the subjunctive. After verbs of demand and recommendation, and after adjectives like essential, the verb takes its base form with no -s and no tense."], [173.55, 175.12, "Which verbs trigger it?"], [176.22, 189.2, "Suggest, recommend, insist, demand, propose, require, and adjectives such as vital or important. Example: The committee demanded that the report be revised."], [190.32, 191.98, "And the other subjunctive?"], [193.08, 202.85, "Were, as in If I were you, or I wish it were Friday. Were is used for every person in formal English to mark an unreal situation."], [204.0, 205.53, "Part three: grammar."], [206.38, 211.85, "Grammar focus: Subjunctive: verb of demand plus that plus subject plus base form."], [212.15, 213.36, "Look at the pattern."], [214.05, 216.0, "I recommend that he attend the meeting."], [216.92, 218.89, "It is essential that she be present."], [219.78, 221.69, "If I were you, I would wait."], [222.63, 230.99, "After suggest, recommend, demand or essential, use that + subject + base form. Use were for unreal situations with every person."], [231.75, 234.96, "Be careful! Don't say: I suggest that he goes."], [236.9, 239.04, "Say: I suggest that he go."], [239.34, 240.79, "Use the base form."], [241.6, 244.37, "Part four: reading. Read and listen."], [245.17, 246.53, "The Committee's Demand."], [246.83, 249.77, "The committee demanded that the report be revised."], [250.77, 253.37, "It is essential that every member attend the meeting."], [254.37, 256.67, "I suggest that she consult an expert."], [257.67, 260.41, "If the budget were larger, the project would grow."], [261.4, 264.44, "The subjunctive keeps official language precise and formal."], [26 "], [272.85, 274.57, "She denied blank the money."], [274.87, 278.13, "A, to take. B, taking. C, take."], [281.67, 283.33, "The answer is B: taking."], [284.48, 287.4, "Which verb suggests the speaker has not proved it?"], [287.7, 291.38, "A, claimed. B, said. C, asked."], [294.93, 296.77, "The answer is A: claimed."], [297.92, 299.48, "They promised blank help."], [299.77, 302.99, "A, to. B, helping. C, that."], [306.53, 308.2, "The answer is A: to."], [309.35, 312.23, "According to the reading, what did the workers insist?"], [312.53, 316.86, "A, they had not been told. B, they were paid. C, they were late."], [320.4, 323.22, "The answer is A: they had not been told."], [324.43, 327.42, "Part six: speaking. It's your turn to talk."], [328.28, 331.36, "Report a statement using 'insisted' instead of 'said'."], [340.15, 341.66, "Now listen to Visal."], [341.96, 354.72, "He said, 'I paid yesterday.' This becomes: He insisted that he had paid the day before. I chose insisted because it shows he was firm and did not want to change his answer."], [355.02, 356.73, "Excellent answer, Visal!"], [357.62, 365.38, "Great work! Now you can use eight new words and reported speech: subject plus reporting verb plus that-clause and gerund and infinitive."], [365.68, 369.79, "Today's value is truthfulness. Tell the truth and check the facts."], [370.09, 372.68, "See you in Unit six. Goodbye!"], [372.98, 375.75, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit06-Participle-Clauses": [[0.35, 5.4, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.7, 9.16, "Hi! I'm Visal. Let's learn together!"], [9.46, 16.34, "Unit six: Participle Clauses. Today you will join ideas concisely with present and past participles."], [16.64, 19.1, "Here is our lesson map. Let's start!"], [20.03, 23.42, "Part one: words. You will learn eight new words."], [24.28, 25.45, "Having finished."], [26.45, 30.33, "Having finished means a perfect participle that shows an earlier action."], [30.92, 32.87, "Having finished, she left."], [33.48, 36.58, "Your turn. Say: Having finished."], [39.43, 40.59, "Having finished."], [41.35, 42.76, "Walking down the street."], [43.75, 48.25, "Walking down the street means a present participle showing a simultaneous action."], [48.85, 50.83, "Walking down the street, I saw him."], [51.42, 54.45, "Your turn. Say: Walking down the street."], [57.3, 58.93, "Walking down the street."], [59.68, 61.02, "Present participle."], [62.02, 65.1, "Present participle means the -ing form used in a clause."], [65.68, 67.86, "Smiling is a present participle."], [68.45, 71.45, "Your turn. Say: Present participle."], [74.3, 75.66, "Present participle."], [76.42, 77.8, "Past participle."], [78.82, 82.55, "Past participle means the -ed form with a passive meaning."], [83.15, 85.42, "Built in 1900, it is old."], [86.02, 88.84, "Your turn. Say: Past participle."], [91.7, 93.15, "Past participle."], [93.92, 95.38, "Reduce a clause."], [96.38, 99.59, "Reduce a clause means to shorten a clause with a participle."], [100.18, 102.26, "Reduce the clause to save words."], [102.85, 106.09, "Your turn. Say: Reduce a clause."], [108.93, 110.39, "Reduce a clause."], [111.15, 112.2, "Concise."], [113.18, 115.08, "Concise means short but clear."], [115.68, 117.3, "A concise sentence."], [117.88, 120.47, "Your turn. Say: Concise."], [123.3, 124.38, "Concise."], [125.12, 126.25, "Formal writing."], [127.25, 130.41, "Formal writing means a serious style used in essays."], [131.02, 133.83, "Participle clauses suit formal writing."], [134.42, 137.57, "Your turn. Say: Formal writing."], [140.43, 141.55, "Formal writing."], [142.32, 143.83, "Connect ideas."], [144.82, 147.65, "Connect ideas means to join thoughts logically."], [148.25, 149.95, "Connect ideas smoothly."], [150.55, 153.17, "Your turn. Say: Connect ideas."], [156.03, 157.44, "Connect ideas."], [158.23, 162.13, "Part two: dialogue. Let's listen to a conversation."], [162.98, 167.27, "Visal, how can I combine: She finished her work. She went home?"], [168.38, 180.77, "Having finished her work, she went home. The perfect participle shows that the first action was complete before the second. Both clauses must share the same subject."], [181.88, 184.17, "What about simultaneous actions?"], [185.28, 200.07, "Use the present participle: Walking down the street, I met an old friend. It means While I was walking. Past participles are passive: Built in 1900, the school is still in use."], [201.18, 202.49, "What is the danger?"], [203.58, 215.61, "The dangling participle. Walking down the street, the rain started is wrong, because the rain did not walk. The subject of the main clause must perform the participle action."], [216.77, 218.06, "Part three: grammar."], [218.92, 226.0, "Grammar focus: Participle clause: participle plus object and adverbial, plus main clause (same subject)."], [226.3, 227.41, "Look at the pattern."], [228.12, 230.3, "Having finished her work, she went home."], [231.22, 234.13, "Walking down the street, I met an old friend."], [235.05, 238.34, "Built in 1900, the school is still in use."], [239.3, 247.46, "Use -ing for active simultaneous actions, having + participle for an earlier action, and -ed for passive meaning. Keep the same subject."], [248.22, 252.08, "Be careful! Don't say: Walking home, the rain started."], [254.03, 256.37, "Say: Walking home, I got wet."], [256.67, 258.56, "Avoid a dangling participle."], [259.37, 262.3, "Part four: reading. Read and listen."], [263.1, 264.67, "Saying More with Less."], [264.97, 267.99, "Having finished the exam, the students left the hall."], [269.0, 271.78, "Walking down the street, I met an old friend."], [272.77, 276.11, "Built in 1900, the school is still in use."], [277.1, 280.14, "Participle clauses make writing shorter and more elegant."], [281.13, 284.12, "But the subject of both clauses must be the same."], [285.23, 289.24, "Part five: quiz. Five questions. Are you ready?"], [290 le."], [141.25, 144.17, "Your turn. Say: Literary style."], [147.03, 148.59, "Literary style."], [149.4, 153.34, "Part two: dialogue. Let's listen to a conversation."], [154.18, 157.96, "Visal, why would a writer begin with Into the room walked the king?"], [159.05, 168.73, "This is fronting. The adverbial Into the room moves to the front for emphasis, and the subject comes after the verb. It creates drama and sets a scene."], [169.82, 171.68, "Is inversion always needed?"], [172.78, 187.57, "After a fronted negative, yes: Not a word did he say. After a fronted adverbial of place, usually with be or motion verbs: Here comes the bus. With pronoun subjects, no inversion: Here he comes."], [188.68, 190.08, "What are the dangers?"], [191.18, 201.4, "Overuse. One fronted structure can lift a paragraph, but ten will sound artificial. Choose the moment that deserves the extra emphasis."], [202.53, 204.21, "Part three: grammar."], [205.05, 210.47, "Grammar focus: Fronting: fronted element plus verb and auxiliary plus subject."], [210.77, 212.0, "Look at the pattern."], [212.68, 214.37, "Into the room walked the king."], [215.28, 216.87, "Not a word did he say."], [217.75, 219.24, "Here comes the bus."], [220.2, 226.8, "Front a word for emphasis. After a negative or place adverbial, the verb often comes before a noun subject."], [227.55, 230.56, "Be careful! Don't say: Not a word he said."], [232.5, 234.86, "Say: Not a word did he say."], [235.16, 237.06, "Invert after a fronted negative."], [237.87, 240.52, "Part four: reading. Read and listen."], [241.33, 242.83, "A Dramatic Entrance."], [243.13, 245.23, "Into the hall walked the new director."], [246.23, 248.29, "Not a single word did she say."], [249.3, 252.03, "Rarely does a speech hold so much attention."], [253.03, 255.28, "On the table lay a mysterious letter."], [256.27, 259.45, "Fronting gives each sentence a dramatic, literary feeling."], [260.57, 264.6, "Part five: quiz. Five questions. Are you ready?"], [265.45,  called, which cleft structures do advanced writers use?"], [159.78, 173.4, "We have wh-clefts: What we need is more time. Reversed wh-clefts: More time is what we need. And All I want is peace, which means the only thing I want."], [174.48, 176.04, "What can be focused?"], [177.15, 191.26, "Nearly any element: a subject, an object, an adverbial, even a whole action: What she did was resign. The focus always lands at the end or just after be."], [192.35, 193.5, "Any limits?"], [194.62, 208.44, "Use clefts where the contrast is real. If every sentence is a cleft, nothing stands out. Also check agreement: What we need are facts takes a plural verb in formal usage."], [209.6, 211.04, "Part three: grammar."], [211.88, 221.92, "Grammar focus: Clefts: It plus be plus focus plus that-clause; What plus clause plus be plus focus; All plus clause plus be plus focus."], [222.22, 223.35, "Look at the pattern."], [224.05, 225.96, "It was in May that we first met."], [226.85, 228.49, "What matters is honesty."], [229.38, 231.27, "All I want is peace and quiet."], [232.23, 238.61, "Use it-clefts, wh-clefts and all-clefts to place the key information in focus. Do not overuse them."], [239.35, 242.28, "Be careful! Don't say: What I want are peace."], [244.23, 246.23, "Say: What I want is peace."], [246.53, 248.06, "Use is after the cleft."], [248.87, 251.63, "Part four: reading. Read and listen."], [252.43, 253.85, "What Really Matters."], [254.15, 256.07, "What matters most is honesty."], [257.07, 259.68, "It was in May that the project finally began."], [260.67, 262.82, "All they wanted was a fair chance."], [263.83, 267.05, "What she did was resign, and that surprised everyone."], [268.07, 271.19, "Different clefts focus on different parts of a message."], [272.3, 276.38, "Part five: quiz. Five questions. Are you ready?"], [277.22, 279.05, "blank matters is honesty."], [279.35, 282.1, "A, What. B, That. C, Who."], [285.67, 287.65, "The answer is A: What."], [288.82, 290.4, "All I 73.1, "They say Had I known, I would have called. We drop if and invert the auxiliary and the subject. The meaning stays the same, but the register is higher."], [174.18, 176.01, "What other forms exist?"], [177.12, 186.63, "Were it not for the rain, we would have gone, which means If it were not for the rain. And Had it not been for your help, I would have failed, for the past."], [187.72, 189.05, "How do negatives work?"], [190.15, 200.85, "Add not after the subject: Had she not left, she would have missed it. We never contract in this form: Hadn't she left is wrong in formal writing."], [202.0, 203.67, "Part three: grammar."], [204.52, 210.75, "Grammar focus: Inverted conditional: Had plus subject plus participle, would have plus participle."], [211.05, 212.28, "Look at the pattern."], [212.98, 214.66, "Had I known, I would have called."], [215.55, 218.08, "Were it not for your help, I would have failed."], [218.98, 221.26, "Had she not left, she would have missed it."], [222.2, 228.28, "Drop if and invert: Had I known... Were it not for... Had it not been for... Put not after the subject, and do not contract."], [229.02, 232.28, "Be careful! Don't say: Hadn't I known, I'd have called."], [234.23, 236.96, "Say: Had I not known, I would have called."], [237.26, 238.85, "Put not after the subject."], [239.63, 242.12, "Part four: reading. Read and listen."], [242.93, 244.4, "If Only I Had Known."], [244.7, 247.36, "Had I known about the delay, I would have left earlier."], [248.37, 251.32, "Were it not for the volunteers, the event would have collapsed."], [252.33, 255.1, "Had it not been for her advice, I would have failed."], [256.1, 258.4, "These inverted forms avoid the word if."], [259.4, 262.2, "They give writing an elevated, formal tone."], [263.3, 267.59, "Part five: quiz. Five questions. Are you ready?"], [268.45, 270.58, "blank I known, I would have called."], [270.88, 273.86, "A, If. B, Had. C, Have."], [277.4, 279.17, "The answer is B: Had."], [280.32, 2  162.62, "Part two: dialogue. Let's listen to a conversation."], [163.48, 168.76, "Visal, how do historians say people believe the castle was built in 1200?"], [169.85, 184.95, "The castle is believed to have been built in 1200. This is a complex passive: passive reporting verb plus a perfect passive infinitive, to have been built."], [186.05, 188.5, "What changes for ongoing actions?"], [189.62, 199.8, "We use to be + -ing: The company is reported to be developing a new engine. The present infinitive shows the action is simultaneous with the report."], [200.92, 202.66, "How do we avoid confusion?"], [203.75, 216.02, "Separate the layers: reporting verb in the passive, then the time reference. Is thought to be refers to now. Is thought to have been refers to earlier. Check which time you mean."], [217.17, 218.74, "Part three: grammar."], [219.58, 226.81, "Grammar focus: Complex passive: subject plus is thought and rumoured plus to have been plus participle."], [227.11, 228.33, "Look at the pattern."], [229.02, 232.55, "The castle is believed to have been built in 1200."], [233.45, 236.26, "The company is reported to be developing a new engine."], [237.15, 239.43, "The treasure is rumoured to have been hidden here."], [240.37, 247.05, "Use to be for now, to have been for before, and to be + -ing for ongoing actions. The reporting verb stays in the passive."], [247.78, 252.33, "Be careful! Don't say: It is thought to build in 1200."], [254.27, 258.77, "Say: It is thought to have been built in 1200."], [259.07, 260.73, "Use the perfect passive."], [261.53, 264.34, "Part four: reading. Read and listen."], [265.13, 266.92, "A Castle of Secrets."], [267.22, 271.02, "The castle is believed to have been built in 1200."], [272.03, 274.87, "The treasure is rumoured to have been hidden in its walls."], [275.87, 278.13, "The owner is said to be selling the estate."], [279.13, 282.53, "Each structure reports a belief without naming the believers."], [283.53, 286.16, "A historian "], [141.07, 142.9, "Hypothetical past result."], [143.65, 144.95, "Speculation."], [145.95, 149.1, "Speculation means guessing about unknown facts."], [149.68, 151.8, "Speculation about the cause."], [152.38, 155.69, "Your turn. Say: Speculation."], [158.53, 159.82, "Speculation."], [160.63, 164.17, "Part two: dialogue. Let's listen to a conversation."], [165.02, 168.31, "Visal, the lights were off, so can you say they were not at home?"], [169.42, 179.01, "They can't have been at home, or They must have gone out. Must have shows strong certainty and can't have shows strong certainty that something did not happen."], [180.12, 181.73, "What about weaker guesses?"], [182.82, 193.36, "May have, might have and could have show possibility: He might have missed the bus. Should have and ought to have criticise a past failure: You should have called."], [194.45, 195.8, "And needn't have?"], [196.88, 206.76, "Needn't have means the action happened but was not necessary: I needn't have taken an umbrella. Compare didn't need to, where we do not know whether it happened."], [207.9, 209.39, "Part three: grammar."], [210.25, 214.85, "Grammar focus: Modal perfect: modal plus have plus past participle."], [215.15, 216.44, "Look at the pattern."], [217.15, 218.69, "She can't have left already."], [219.58, 221.4, "I needn't have taken an umbrella."], [222.28, 223.85, "He might have missed the bus."], [224.8, 233.68, "Must / can't have = past deduction. May / might / could have = possibility. Needn't have = unnecessary action. Should have = past criticism."], [234.42, 237.92, "Be careful! Don't say: She must left already."], [239.87, 242.23, "Say: She must have left already."], [242.53, 244.89, "Use modal + have + participle."], [245.7, 248.28, "Part four: reading. Read and listen."], [249.07, 250.34, "The Missing Keys."], [250.63, 252.77, "The lights were off, so they must have gone out."], [253.77, 256.32, "She can't have taken the keys, because she was abroad."], [257.33, 259.07,
