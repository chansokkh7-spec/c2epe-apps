nnoyed us."], [244.97, 248.12, "Say: The train was late, which annoyed us."], [248.42, 249.6, "Use which here."], [250.4, 252.89, "Part four: reading. Read and listen."], [253.7, 254.86, "Adding a Comment."], [255.16, 257.79, "The flight was cancelled, which annoyed everyone."], [258.8, 261.58, "The students attending the lecture were very tired."], [262.57, 265.05, "The first person to arrive was the director."], [266.07, 270.41, "The council introduced a system whereby residents report problems online."], [271.4, 274.58, "Such clauses add comments and compress information."], [275.7, 279.67, "Part five: quiz. Five questions. Are you ready?"], [280.52, 282.7, "The train was late, blank annoyed us."], [283.0, 286.25, "A, which. B, that. C, what."], [289.8, 291.6, "The answer is A: which."], [292.75, 294.88, "The people blank the class are tired."], [295.18, 299.04, "A, attended. B, attending. C, attend."], [302.6, 304.45, "The answer is B: attending."], [305.58, 307.81, "The first person blank arrive was Tom."], [308.12, 311.12, "A, to. B, for. C, at."], [314.67, 316.69, "The answer is A: to."], [317.85, 319.35, "Whereby means blank."], [319.65, 323.4, "A, at which. B, by which. C, from where."], [326.93, 328.82, "The answer is B: by which."], [329.98, 333.33, "According to the reading, what can residents report online?"], [333.63, 337.2, "A, problems. B, taxes. C, weather."], [340.77, 342.79, "The answer is A: problems."], [344.0, 347.27, "Part six: speaking. It's your turn to talk."], [348.12, 352.03, "Add a sentential 'which' clause to this sentence: 'The train was late.'"], [360.85, 362.58, "Now listen to Visal."], [362.88, 372.97, "The train was late, which made me miss my first class. The train was late, which was frustrating for everyone. The word which refers to the whole situation."], [373.27, 375.11, "Excellent answer, Visal!"], [376.02, 385.79, "Great work! Now you can use eight new words and sentential relative: main clause, which plus comment; non-finite: noun plus participle and infinitive."], [386.09, 391.41, "Today's value is precision of language. Choose your words carefully so others understand you."], [391.71, 394.66, "See you in Unit thirty-two. Goodbye!"], [394.96, 398.56, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit32-Complex-Noun-Phrases": [[0.35, 5.26, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.56, 8.98, "Hi! I'm Visal. Let's learn together!"], [9.28, 16.21, "Unit thirty-two: Complex Noun Phrases. Today you will pack information into noun phrases for academic writing."], [16.52, 19.12, "Here is our lesson map. Let's start!"], [20.07, 23.62, "Part one: words. You will learn eight new words."], [24.48, 25.58, "Premodifier."], [26.58, 29.26, "Premodifier means a word before the head noun."], [29.85, 31.14, "A new report."], [31.75, 34.33, "Your turn. Say: Premodifier."], [37.17, 38.23, "Premodifier."], [38.98, 40.26, "Postmodifier."], [41.25, 44.5, "Postmodifier means a word or phrase after the head noun."], [45.12, 46.74, "A report on climate."], [47.35, 50.29, "Your turn. Say: Postmodifier."], [53.13, 54.34, "Postmodifier."], [55.08, 55.97, "Head noun."], [56.98, 59.68, "Head noun means the main noun in a noun phrase."], [60.28, 61.98, "Report is the head noun."], [62.58, 65.32, "Your turn. Say: Head noun."], [68.17, 69.12, "Head noun."], [69.88, 71.24, "Noun cluster."], [72.25, 74.8, "Noun cluster means a group of nouns together."], [75.38, 77.05, "A climate change report."], [77.65, 80.85, "Your turn. Say: Noun cluster."], [83.7, 84.82, "Noun cluster."], [85.58, 87.53, "Prepositional postmodifier."], [88.52, 92.49, "Prepositional postmodifier means a phrase with a preposition after the noun."], [93.08, 94.69, "A report on climate."], [95.28, 99.1, "Your turn. Say: Prepositional postmodifier."], [101.93, 103.85, "Prepositional postmodifier."], [104.62, 106.47, "Relative postmodifier."], [107.45, 110.84, "Relative postmodifier means a relative clause after the noun."], [111.45, 113.19, "A report that was published."], [113.78, 117.42, "Your turn. Say: Relative postmodifier."], [120.27, 122.36, "Relative postmodifier."], [123.12, 124.71, "Information density."], [125.72, 129.26, "Information density means a lot of information in few words."], [129.85, 131.69, "High information density."], [132.28, 135.68, "Your turn. Say: Information density."], [138.53, 140.39, "Information density."], [141.15, 142.62, "Academic style."], [143.62, 146.75, "Academic style means the style of research writing."], [147.35, 149.07, "An academic style."], [149.68, 152.75, "Your turn. Say: Academic style."], [155.6, 157.02, "Academic style."], [157.83, 161.79, "Part two: dialogue. Let's listen to a conversation."], [162.65, 166.83, "Visal, how can I expand a report into a complex noun phrase?"], [167.92, 181.13, "A comprehensive new report on climate change published last year. Report is the head noun, comprehensive new is the premodifier, and the rest is postmodifier."], [182.25, 184.5, "What kinds of postmodifier are there?"], [185.62, 199.72, "Prepositional phrases: a report on climate. Relative clauses: a report that I read. Participles: a report published last year. To-infinitives: a plan to reduce waste."], [200.82, 201.97, "Why use them?"], [203.08, 216.09, "They increase information density, which suits academic style. Spoken English uses short clauses, while writing packs the same information into noun phrases. Do not overload them."], [217.23, 218.86, "Part three: grammar."], [219.72, 225.59, "Grammar focus: Noun phrase: premodifier plus head noun plus postmodifier."], [225.89, 227.14, "Look at the pattern."], [227.85, 230.74, "A comprehensive new report on climate change."], [231.65, 233.88, "The recent proposal to reduce waste."], [234.78, 237.31, "An influential study published last year."], [238.27, 245.54, "Build noun phrases with premodifiers before the head noun and postmodifiers (prepositional, relative, participial) after it."], [246.28, 249.71, "Be careful! Don't say: A report new on climate."], [251.67, 254.14, "Say: A new report on climate."], [254.44, 256.27, "Put the premodifier first."], [257.07, 259.5, "Part four: reading. Read and listen."], [260.3, 261.87, "Packing In Information."], [262.17, 265.9, "A comprehensive new report on climate change was published last week."], [266.9, 270.51, "The proposal to reduce plastic waste received wide support."], [271.5, 274.8, "Researchers analysed data collected over twenty years."], [275.8, 278.58, "These noun phrases carry a lot of information."], [279.57, 283.63, "Academic texts rely on them for a dense, precise style."], [284.73, 288.78, "Part five: quiz. Five questions. Are you ready?"], [289.62, 292.8, "In 'a new report on climate', the head noun is blank."], [293.1, 296.49, "A, new. B, report. C, climate."], [300.03, 301.86, "The answer is B: report."], [303.02, 305.94, "'On climate change' is a blank postmodifier."], [306.25, 309.96, "A, prepositional. B, relative. C, negative."], [313.5, 316.14, "The answer is A: prepositional."], [317.28, 320.13, "'Published last year' is a blank postmodifier."], [320.43, 324.94, "A, participial. B, finite. C, negative."], [328.5, 330.74, "The answer is A: participial."], [331.88, 334.22, "Complex noun phrases increase blank."], [334.52, 338.4, "A, information density. B, spelling. C, volume."], [341.97, 344.78, "The answer is A: information density."], [345.92, 349.39, "According to the reading, how long was the data collected?"], [349.69, 354.23, "A, twenty years. B, two years. C, ten days."], [357.77, 359.66, "The answer is A: twenty years."], [360.87, 364.37, "Part six: speaking. It's your turn to talk."], [365.22, 370.32, "Expand 'a report' into a complex noun phrase with a premodifier and a postmodifier."], [379.12, 380.63, "Now listen to Visal."], [380.93, 394.93, "A detailed annual report on the school's progress was published today. Detailed annual is the premodifier, and on the school's progress is the postmodifier. Report is the head noun."], [395.23, 396.89, "Excellent answer, Visal!"], [397.78, 405.05, "Great work! Now you can use eight new words and noun phrase: premodifier plus head noun plus postmodifier."], [405.35, 410.35, "Today's value is logical rigor. Follow your reasoning wherever it honestly leads."], [410.65, 414.04, "See you in Unit thirty-three. Goodbye!"], [414.34, 417.55, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit33-Advanced-Linking-Lest-With-a-View-to": [[0.35, 5.34, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.64, 9.25, "Hi! I'm Visal. Let's learn together!"], [9.55, 17.03, "Unit thirty-three: Advanced Linking: Lest, With a View to. Today you will express purpose and precaution formally."], [17.33, 19.68, "Here is our lesson map. Let's start!"], [20.63, 23.79, "Part one: words. You will learn eight new words."], [24.65, 25.49, "Lest."], [26.48, 28.8, "Lest means in order to prevent something."], [29.38, 31.2, "He ran lest he miss the train."], [31.78, 34.2, "Your turn. Say: Lest."], [37.07, 37.94, "Lest."], [38.68, 39.68, "With a view to."], [40.68, 42.66, "With a view to means with the aim of."], [43.25, 44.92, "With a view to saving money."], [45.52, 47.87, "Your turn. Say: With a view to."], [50.73, 52.0, "With a view to."], [52.75, 53.88, "In the hope that."], [54.88, 57.95, "In the hope that means wishing that something will happen."], [58.55, 60.03, "In the hope that you agree."], [60.62, 63.34, "Your turn. Say: In the hope that."], [66.2, 67.49, "In the hope that."], [68.25, 69.45, "So as not to."], [70.45, 73.09, "So as not to means to avoid doing something."], [73.68, 75.81, "Speak quietly so as not to wake him."], [76.42, 79.3, "Your turn. Say: So as not to."], [82.17, 83.61, "So as not to."], [84.35, 85.2, "Provided."], [86.22, 88.38, "Provided means on condition that."], [88.98, 90.91, "Provided you pay, you may enter."], [91.52, 93.94, "Your turn. Say: Provided."], [96.8, 97.7, "Provided."], [98.45, 99.46, "Supposing."], [100.45, 103.01, "Supposing means if, in a hypothetical way."], [103.62, 104.99, "Supposing it fails?"], [105.58, 107.82, "Your turn. Say: Supposing."], [110.67, 111.55, "Supposing."], [112.32, 113.22, "Purpose."], [114.22, 116.67, "Purpose means the reason for doing something."], [117.28, 118.76, "The purpose of the meeting."], [119.35, 122.09, "Your turn. Say: Purpose."], [124.93, 125.91, "Purpose."], [126.65, 127.65, "Precaution."], [128.65, 131.34, "Precaution means an action taken in advance."], [131.95, 133.61, "A safety precaution."], [134.22, 136.62, "Your turn. Say: Precaution."], [139.47, 140.42, "Precaution."], [141.23, 144.87, "Part two: dialogue. Let's listen to a conversation."], [145.72, 150.35, "Visal, how do formal writers say He locked the door so that nobody could enter?"], [151.45, 164.91, "He locked the door lest anyone enter. Lest means for fear that or to prevent, and it takes the subjunctive base form or should: lest he forget, lest he should forget."], [166.02, 167.26, "What about aims?"], [168.35, 182.44, "With a view to is followed by a gerund: The company reduced prices with a view to attracting customers. In the hope that is followed by a clause: She waited in the hope that he would call."], [183.55, 184.69, "And conditions?"], [185.78, 196.05, "Provided means on condition that: You may borrow it provided you return it. So as not to is a negative purpose: He tiptoed so as not to wake the baby."], [197.2, 199.26, "Part three: grammar."], [200.12, 206.37, "Grammar focus: Purpose and precaution: lest plus base verb and should; with a view to plus gerund."], [206.66, 207.84, "Look at the pattern."], [208.55, 210.42, "He ran lest he miss the train."], [211.32, 214.37, "They cut prices with a view to attracting customers."], [215.28, 217.84, "She whispered so as not to wake the baby."], [218.8, 224.93, "Lest takes the base form or should. With a view to takes a gerund. Provided means on condition that."], [225.68, 229.22, "Be careful! Don't say: He ran lest he missed the train."], [231.17, 233.75, "Say: He ran lest he miss the train."], [234.05, 235.5, "Use the base form."], [236.3, 239.35, "Part four: reading. Read and listen."], [240.13, 241.3, "For Fear That."], [241.6, 244.08, "He wrote everything down lest he should forget."], [245.1, 248.72, "The firm cut its prices with a view to attracting more customers."], [249.73, 251.88, "She waited in the hope that he would call."], [252.9, 255.5, "They crept past so as not to wake the baby."], [256.5, 258.72, "You may enter provided you show your ticket."], [259.83, 263.59, "Part five: quiz. Five questions. Are you ready?"], [264.45, 266.43, "He ran lest he blank the train."], [266.73, 269.71, "A, misses. B, miss. C, missed."], [273.27, 275.13, "The answer is B: miss."], [276.28, 278.6, "With a view to blank money, she saved."], [278.9, 282.55, "A, save. B, saving. C, saved."], [286.1, 287.81, "The answer is B: saving."], [288.95, 290.51, "Provided means blank."], [290.81, 295.05, "A, on condition that. B, in spite of. C, because of."], [298.6, 300.87, "The answer is A: on condition that."], [302.02, 304.07, "So as not to expresses blank."], [304.37, 309.03, "A, a negative purpose. B, a result. C, a habit."], [312.57, 315.26, "The answer is A: a negative purpose."], [316.42, 319.86, "According to the reading, why did the firm cut its prices?"], [320.16, 325.4, "A, to attract customers. B, to close. C, to hide errors."], [328.93, 331.71, "The answer is A: to attract customers."], [332.9, 336.26, "Part six: speaking. It's your turn to talk."], [337.12, 340.36, "Write a formal sentence using 'lest' or 'with a view to'."], [349.15, 350.66, "Now listen to Visal."], [350.96, 363.56, "She studied every night lest she should fail the exam. The school extended its library hours with a view to helping students prepare. Both structures express purpose in a formal way."], [363.86, 365.56, "Excellent answer, Visal!"], [366.45, 374.44, "Great work! Now you can use eight new words and purpose and precaution: lest plus base verb and should; with a view to plus gerund."], [374.74, 378.53, "Today's value is foresight. Prepare today for the world of tomorrow."], [378.83, 381.68, "See you in Unit thirty-four. Goodbye!"], [381.98, 385.06, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit34-Stance-Adverbials": [[0.35, 5.55, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.85, 9.28, "Hi! I'm Visal. Let's learn together!"], [9.58, 14.97, "Unit thirty-four: Stance Adverbials. Today you will show your attitude to a statement."], [15.27, 17.95, "Here is our lesson map. Let's start!"], [18.9, 22.16, "Part one: words. You will learn eight new words."], [23.02, 24.13, "Admittedly."], [25.15, 27.37, "Admittedly means I accept this point."], [27.98, 30.1, "Admittedly, it is expensive."], [30.68, 33.63, "Your turn. Say: Admittedly."], [36.47, 37.48, "Admittedly."], [38.22, 39.28, "Arguably."], [40.28, 42.41, "Arguably means a case can be made."], [43.02, 44.59, "Arguably the best film."], [45.18, 47.91, "Your turn. Say: Arguably."], [50.77, 51.78, "Arguably."], [52.52, 53.55, "Evidently."], [54.55, 57.63, "Evidently means clearly, as the evidence shows."], [58.22, 59.86, "Evidently, he was wrong."], [60.45, 63.01, "Your turn. Say: Evidently."], [65.87, 66.91, "Evidently."], [67.65, 68.91, "Undoubtedly."], [69.92, 72.12, "Undoubtedly means without any doubt."], [72.72, 74.88, "Undoubtedly, she is talented."], [75.48, 78.3, "Your turn. Say: Undoubtedly."], [81.13, 82.3, "Undoubtedly."], [83.05, 83.99, "Presumably."], [84.98, 86.55, "Presumably means I assume."], [87.15, 88.71, "Presumably he is late."], [89.32, 91.88, "Your turn. Say: Presumably."], [94.73, 95.77, "Presumably."], [96.52, 97.65, "Regrettably."], [98.65, 100.8, "Regrettably means unfortunately."], [101.42, 103.47, "Regrettably, we must cancel."], [104.08, 106.85, "Your turn. Say: Regrettably."], [109.7, 110.78, "Regrettably."], [111.52, 112.75, "Strictly speaking."], [113.75, 116.38, "Strictly speaking means in the exact sense."], [116.98, 119.19, "Strictly speaking, it is not true."], [119.78, 123.02, "Your turn. Say: Strictly speaking."], [125.87, 127.23, "Strictly speaking."], [127.98, 128.82, "Hedge."], [129.82, 132.23, "Hedge means a word that softens a claim."], [132.85, 134.26, "Arguably is a hedge."], [134.85, 136.71, "Your turn. Say: Hedge."], [139.57, 140.39, "Hedge."], [141.2, 145.28, "Part two: dialogue. Let's listen to a conversation."], [146.12, 149.72, "Visal, how can I make The plan is good sound more careful?"], [150.82, 161.32, "Add a stance adverbial: Arguably, the plan is good, or Admittedly, the plan is good, though costly. The adverbial shows your attitude to the statement."], [162.42, 163.85, "What kinds are there?"], [164.95, 178.93, "Certainty: undoubtedly, evidently. Doubt or assumption: presumably, arguably. Attitude: regrettably, fortunately. Limitation: strictly speaking, broadly speaking."], [180.02, 181.09, "Where do they go?"], [182.18, 195.25, "Usually at the start with a comma, but also before the verb or at the end. In academic writing, hedges like arguably protect you from overclaiming. But too many hedges make a text weak."], [196.4, 197.77, "Part three: grammar."], [198.62, 203.34, "Grammar focus: Stance adverbial: adverbial plus comma plus clause."], [203.65, 204.89, "Look at the pattern."], [205.58, 208.01, "Arguably, the plan is the best option."], [208.92, 211.08, "Regrettably, we must cancel the trip."], [211.98, 214.11, "Presumably, he is still on his way."], [215.07, 222.11, "Stance adverbials show certainty, doubt or attitude. Use hedges such as arguably or presumably to avoid overclaiming."], [222.85, 226.87, "Be careful! Don't say: Arguably, the plan are good."], [228.83, 230.98, "Say: Arguably, the plan is good."], [231.28, 233.09, "Keep subject-verb agreement."], [233.9, 236.85, "Part four: reading. Read and listen."], [237.67, 239.17, "Showing Where You Stand."], [239.47, 242.41, "Undoubtedly, the festival was a great success."], [243.4, 246.66, "Admittedly, tickets were expensive for some families."], [247.67, 250.47, "Presumably, next year's event will be even bigger."], [251.47, 254.17, "Regrettably, the weather spoiled the final evening."], [255.17, 258.48, "Strictly speaking, the festival is not yet finished."], [259.57, 263.75, "Part five: quiz. Five questions. Are you ready?"], [264.62, 268.2, "blank, the plan is the best option. (a case can be made)"], [268.5, 272.51, "A, Arguably. B, Regrettably. C, Strictly."], [276.07, 278.03, "The answer is A: Arguably."], [279.18, 281.08, "Which shows you assume something?"], [281.38, 285.28, "A, Undoubtedly. B, Presumably. C, Evidently."], [288.83, 291.12, "The answer is B: Presumably."], [292.28, 293.98, "Which shows sadness?"], [294.28, 298.03, "A, Regrettably. B, Admittedly. C, Arguably."], [301.57, 303.54, "The answer is A: Regrettably."], [304.68, 306.21, "A hedge blank a claim."], [306.51, 310.46, "A, hides. B, softens. C, strengthens."], [314.0, 316.06, "The answer is B: softens."], [317.22, 320.1, "According to the reading, what spoiled the final evening?"], [320.4, 324.16, "A, the weather. B, the music. C, the prices."], [327.7, 329.56, "The answer is A: the weather."], [330.77, 333.78, "Part six: speaking. It's your turn to talk."], [334.62, 337.42, "Rewrite 'The plan is good' adding a stance adverbial."], [346.22, 347.81, "Now listen to Visal."], [348.11, 358.16, "Arguably, the plan is good. Admittedly, the plan is good, although it is expensive. The adverbial shows my attitude and makes my claim more careful."], [358.46, 360.68, "Excellent answer, Visal!"], [361.58, 368.18, "Great work! Now you can use eight new words and stance adverbial: adverbial plus comma plus clause."], [368.48, 374.07, "Today's value is intellectual humility. Admit what you do not know, and stay ready to learn."], [374.37, 377.27, "See you in Unit thirty-five. Goodbye!"], [377.57, 380.3, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit35-Contrastive-Structures": [[0.35, 5.72, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [6.02, 9.66, "Hi! I'm Visal. Let's learn together!"], [9.96, 17.26, "Unit thirty-five: Contrastive Structures. Today you will contrast ideas with a range of formal structures."], [17.56, 20.46, "Here is our lesson map. Let's start!"], [21.4, 24.56, "Part one: words. You will learn eight new words."], [25.42, 26.52, "Whereas."], [27.52, 29.95, "Whereas means used to contrast two facts."], [30.55, 32.76, "Whereas he is quiet, she is loud."], [33.35, 35.58, "Your turn. Say: Whereas."], [38.43, 39.52, "Whereas."], [40.25, 41.12, "While."], [42.12, 44.43, "While means used to contrast two facts."], [45.02, 47.14, "While he is rich, she is poor."], [47.75, 50.32, "Your turn. Say: While."], [53.17, 54.21, "While."], [54.95, 56.21, "By contrast."], [57.22, 60.08, "By contrast means a linking phrase for difference."], [60.68, 62.76, "By contrast, prices fell."], [63.35, 66.18, "Your turn. Say: By contrast."], [69.03, 70.35, "By contrast."], [71.08, 72.11, "Conversely."], [73.12, 75.42, "Conversely means in the opposite way."], [76.02, 77.99, "Conversely, others disagree."], [78.58, 80.92, "Your turn. Say: Conversely."], [83.77, 84.81, "Conversely."], [85.55, 86.69, "On the one hand."], [87.68, 90.65, "On the one hand means the first side of an argument."], [91.25, 93.09, "On the one hand, it is cheap."], [93.68, 96.35, "Your turn. Say: On the one hand."], [99.2, 100.62, "On the one hand."], [101.38, 102.45, "On the other hand."], [103.45, 106.26, "On the other hand means the second side of an argument."], [106.85, 108.64, "On the other hand, it is slow."], [109.25, 112.48, "Your turn. Say: On the other hand."], [115.33, 116.58, "On the other hand."], [117.32, 118.28, "Unlike."], [119.28, 121.06, "Unlike means different from."], [121.65, 124.17, "Unlike Phnom Penh, Siem Reap is calm."], [124.78, 126.9, "Your turn. Say: Unlike."], [129.77, 130.75, "Unlike."], [131.48, 132.9, "In contrast to."], [133.92, 136.72, "In contrast to means compared with something different."], [137.32, 140.16, "In contrast to the city, the village is quiet."], [140.75, 143.62, "Your turn. Say: In contrast to."], [146.47, 148.0, "In contrast to."], [148.8, 152.6, "Part two: dialogue. Let's listen to a conversation."], [153.45, 157.67, "Visal, how can I contrast two cities using different structures?"], [158.78, 169.74, "Whereas Phnom Penh is busy and modern, Siem Reap is calm and historic. Whereas and while join two contrasting clauses and can come first or in the middle."], [170.85, 172.91, "What about separate sentences?"], [174.02, 187.93, "Use linkers: By contrast, Siem Reap is calm. Conversely, many visitors prefer the quiet. On the one hand, the city offers jobs; on the other hand, it is crowded."], [189.02, 190.56, "And prepositions?"], [191.65, 207.16, "Unlike and in contrast to are followed by a noun phrase: Unlike Phnom Penh, Siem Reap is calm. Remember that both items must be comparable, so avoid comparing a city with a person."], [208.3, 210.03, "Part three: grammar."], [210.88, 220.38, "Grammar focus: Contrast: whereas and while plus clause; unlike and in contrast to plus noun phrase; by contrast, plus clause."], [220.68, 221.92, "Look at the pattern."], [222.62, 225.22, "Whereas Phnom Penh is busy, Siem Reap is calm."], [226.12, 228.64, "Unlike Phnom Penh, Siem Reap is quiet."], [229.55, 232.27, "By contrast, Siem Reap is calm and historic."], [233.23, 240.09, "Use whereas / while with clauses, unlike / in contrast to with nouns, and by contrast / conversely as linkers between sentences."], [240.85, 245.27, "Be careful! Don't say: Whereas he is quiet, but she is loud."], [247.23, 249.92, "Say: Whereas he is quiet, she is loud."], [250.22, 251.44, "Do not add but."], [252.23, 255.06, "Part four: reading. Read and listen."], [255.87, 257.59, "A Tale of Two Cities."], [257.89, 261.62, "Whereas Phnom Penh is a busy capital, Siem Reap is a calm town."], [262.63, 266.31, "Unlike the capital, the town is built around its temples."], [267.3, 270.34, "On the one hand, the capital offers many jobs."], [271.33, 274.64, "On the other hand, the town offers peace and space."], [275.63, 278.69, "By contrast, both cities welcome visitors warmly."], [279.8, 283.74, "Part five: quiz. Five questions. Are you ready?"], [284.58, 287.33, "blank Phnom Penh is busy, Siem Reap is calm."], [287.63, 291.5, "A, Whereas. B, Unless. C, Because."], [295.03, 297.08, "The answer is A: Whereas."], [298.22, 300.59, "blank the city, the village is quiet."], [300.89, 304.7, "A, Conversely. B, Unlike. C, Whereas."], [308.27, 310.21, "The answer is B: Unlike."], [311.35, 313.44, "On the one hand pairs with blank."], [313.74, 317.98, "A, on the other hand. B, by contrast. C, unlike."], [321.53, 324.07, "The answer is A: on the other hand."], [325.22, 327.27, "Which is followed by a noun phrase?"], [327.57, 331.09, "A, while. B, unlike. C, whereas."], [334.63, 336.47, "The answer is B: unlike."], [337.62, 340.85, "According to the reading, what is the town built around?"], [341.15, 345.59, "A, its temples. B, its factories. C, its port."], [349.13, 351.13, "The answer is A: its temples."], [352.33, 355.76, "Part six: speaking. It's your turn to talk."], [356.62, 360.35, "Write two sentences that contrast two cities using different structures."], [369.15, 370.58, "Now listen to Visal."], [370.88, 382.6, "Whereas Battambang is quiet and relaxed, Phnom Penh is busy and loud. Unlike Phnom Penh, Battambang has little traffic. I used two different structures to show the contrast."], [382.9, 384.58, "Excellent answer, Visal!"], [385.48, 396.1, "Great work! Now you can use eight new words and contrast: whereas and while plus clause; unlike and in contrast to plus noun phrase; by contrast, plus clause."], [396.4, 401.37, "Today's value is open-mindedness. Be open to new places, people and ideas."], [401.67, 404.43, "See you in Unit thirty-six. Goodbye!"], [404.73, 408.27, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit36-Adjective-and-Noun-Preposition": [[0.35, 5.42, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.72, 9.07, "Hi! I'm Visal. Let's learn together!"], [9.37, 17.28, "Unit thirty-six: Adjective and Noun + Preposition. Today you will use fixed prepositions after adjectives and nouns."], [17.58, 20.34, "Here is our lesson map. Let's start!"], [21.3, 24.8, "Part one: words. You will learn eight new words."], [25.65, 26.64, "Aware of."], [27.65, 29.37, "Aware of means knowing about."], [29.98, 31.62, "She is aware of the risk."], [32.22, 35.05, "Your turn. Say: Aware of."], [37.9, 38.97, "Aware of."], [39.72, 40.83, "Capable of."], [41.85, 43.61, "Capable of means able to do."], [44.22, 45.86, "He is capable of more."], [46.45, 48.87, "Your turn. Say: Capable of."], [51.73, 52.8, "Capable of."], [53.55, 54.75, "Reliant on."], [55.75, 58.01, "Reliant on means depending on."], [58.62, 60.42, "We are reliant on tourism."], [61.02, 63.69, "Your turn. Say: Reliant on."], [66.53, 67.63, "Reliant on."], [68.38, 69.65, "Reluctance to."], [70.65, 73.25, "Reluctance to means unwillingness to do."], [73.85, 75.55, "A reluctance to speak."], [76.15, 79.3, "Your turn. Say: Reluctance to."], [82.17, 83.5, "Reluctance to."], [84.25, 85.62, "Tendency towards."], [86.62, 89.64, "Tendency towards means a habit of moving in a direction."], [90.25, 92.1, "A tendency towards delay."], [92.68, 95.66, "Your turn. Say: Tendency towards."], [98.5, 99.98, "Tendency towards."], [100.72, 101.86, "Insight into."], [102.85, 105.34, "Insight into means deep understanding of."], [105.95, 107.6, "An insight into culture."], [108.22, 111.21, "Your turn. Say: Insight into."], [114.07, 115.45, "Insight into."], [116.22, 117.47, "Impact on."], [118.48, 120.33, "Impact on means effect on."], [120.92, 122.72, "The impact on schools."], [123.32, 126.16, "Your turn. Say: Impact on."], [129.0, 130.13, "Impact on."], [130.88, 132.09, "Emphasis on."], [133.08, 136.06, "Emphasis on means special importance given to."], [136.65, 138.25, "An emphasis on reading."], [138.85, 141.47, "Your turn. Say: Emphasis on."], [144.33, 145.44, "Emphasis on."], [146.23, 149.69, "Part two: dialogue. Let's listen to a conversation."], [150.55, 155.01, "Visal, which preposition follows impact, insight and emphasis?"], [156.12, 166.13, "Impact on, insight into, emphasis on. Prepositions after nouns and adjectives are fixed, so they must be learned together with the word."], [167.22, 168.4, "Can you give a group?"], [169.52, 185.57, "Adjectives: aware of, capable of, reliant on, dependent on, sensitive to, responsible for. Nouns: reluctance to, tendency towards, demand for, solution to, reason for, concern about."], [186.68, 188.53, "What follows the preposition?"], [189.62, 201.39, "A noun or a gerund: She is capable of leading the team. Take care with to: it is a preposition in committed to improving, but an infinitive marker in a reluctance to speak."], [202.53, 204.31, "Part three: grammar."], [205.15, 210.13, "Grammar focus: Adjective and noun plus fixed preposition plus noun or gerund."], [210.43, 211.59, "Look at the pattern."], [212.28, 213.97, "She is aware of the risks."], [214.88, 217.52, "The report had a major impact on education."], [218.42, 220.54, "He is capable of leading the team."], [221.5, 230.06, "Learn prepositions with the word: aware of, capable of, reliant on, impact on, insight into, emphasis on, reluctance to, tendency towards."], [230.82, 234.53, "Be careful! Don't say: She is aware about the risk."], [236.47, 238.76, "Say: She is aware of the risk."], [239.06, 240.14, "Use aware of."], [240.93, 243.53, "Part four: reading. Read and listen."], [244.33, 245.81, "Words and Their Partners."], [246.11, 248.57, "The government is aware of the risks involved."], [249.57, 252.37, "The report had a major impact on education."], [253.37, 256.13, "The school places great emphasis on reading."], [257.13, 259.73, "There is a tendency towards shorter holidays."], [260.73, 263.35, "Such combinations must be learned as a unit."], [264.43, 268.84, "Part five: quiz. Five questions. Are you ready?"], [269.68, 271.5, "She is aware blank the risks."], [271.8, 274.72, "A, of. B, to. C, with."], [278.27, 279.96, "The answer is A: of."], [281.12, 283.38, "The impact blank schools was large."], [283.68, 286.29, "A, at. B, on. C, of."], [289.83, 291.49, "The answer is B: on."], [292.65, 294.36, "He is capable blank leading."], [294.66, 298.06, "A, of. B, for. C, to."], [301.6, 303.13, "The answer is A: of."], [304.28, 306.05, "An insight blank culture."], [306.35, 309.92, "A, for. B, into. C, about."], [313.47, 315.04, "The answer is B: into."], [316.18, 319.0, "According to the reading, what does the school emphasise?"], [319.3, 322.83, "A, reading. B, sport. C, music."], [326.37, 328.03, "The answer is A: reading."], [329.23, 332.61, "Part six: speaking. It's your turn to talk."], [333.45, 336.95, "Write two sentences with a noun + preposition combination."], [345.75, 347.26, "Now listen to Visal."], [347.56, 360.13, "The new law had a strong impact on small businesses. There is a growing emphasis on environmental education. Both sentences use a fixed noun and preposition combination."], [360.43, 362.14, "Excellent answer, Visal!"], [363.05, 369.34, "Great work! Now you can use eight new words and adjective and noun plus fixed preposition plus noun or gerund."], [369.64, 373.74, "Today's value is lifelong learning. Keep learning for as long as you live."], [374.04, 377.75, "See you in Unit thirty-seven. Goodbye!"], [378.05, 381.07, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit37-Discourse-Markers-in-Speech": [[0.35, 5.47, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.77, 9.23, "Hi! I'm Visal. Let's learn together!"], [9.53, 16.39, "Unit thirty-seven: Discourse Markers in Speech. Today you will manage conversation with natural fillers and signals."], [16.69, 19.27, "Here is our lesson map. Let's start!"], [20.23, 23.34, "Part one: words. You will learn eight new words."], [24.18, 24.68, "Well."], [25.68, 28.59, "Well means introduces a response or hesitation."], [29.18, 30.73, "Well, I am not sure."], [31.32, 33.35, "Your turn. Say: Well."], [36.2, 37.13, "Well."], [37.88, 38.77, "I mean."], [39.78, 42.18, "I mean means clarifies or corrects."], [42.78, 44.82, "I mean, it is not bad."], [45.42, 47.73, "Your turn. Say: I mean."], [50.57, 51.52, "I mean."], [52.28, 53.27, "Anyway."], [54.28, 56.77, "Anyway means returns to the main topic."], [57.38, 59.12, "Anyway, back to the plan."], [59.72, 62.37, "Your turn. Say: Anyway."], [65.23, 66.03, "Anyway."], [66.78, 67.64, "You know."], [68.65, 70.72, "You know means checks shared knowledge."], [71.32, 73.07, "It was, you know, difficult."], [73.68, 75.69, "Your turn. Say: You know."], [78.53, 79.44, "You know."], [80.18, 81.17, "Actually."], [82.18, 85.15, "Actually means introduces a surprising fact."], [85.75, 87.27, "Actually, I disagree."], [87.88, 90.61, "Your turn. Say: Actually."], [93.47, 94.5, "Actually."], [95.25, 96.65, "As a matter of fact."], [97.65, 101.73, "As a matter of fact means adds a true, often surprising point."], [102.32, 104.4, "As a matter of fact, I live there."], [104.98, 108.09, "Your turn. Say: As a matter of fact."], [110.93, 112.47, "As a matter of fact."], [113.22, 114.34, "To be honest."], [115.35, 118.0, "To be honest means introduces a frank opinion."], [118.58, 120.27, "To be honest, I was bored."], [120.88, 123.93, "Your turn. Say: To be honest."], [126.77, 127.88, "To be honest."], [128.65, 129.8, "By the way."], [130.82, 133.54, "By the way means introduces a new, side topic."], [134.15, 135.95, "By the way, did you call her?"], [136.55, 138.89, "Your turn. Say: By the way."], [141.73, 142.78, "By the way."], [143.57, 147.48, "Part two: dialogue. Let's listen to a conversation."], [148.35, 152.66, "Visal, why do native speakers say Well, I mean, you know so often?"], [153.75, 166.18, "They are discourse markers. They do not add meaning to the facts, but they organise the conversation, show hesitation, soften opinions and keep the other person involved."], [167.28, 168.33, "What do they do?"], [169.42, 184.22, "Well introduces a cautious answer. I mean clarifies. Anyway returns to the main topic. By the way adds a side topic. To be honest and actually introduce frank or surprising points."], [185.32, 186.89, "Are they all acceptable?"], [187.98, 204.12, "In speech yes, but overuse of you know sounds careless. In formal writing, avoid most of them. Choose a marker that fits the situation, and place it at the start or end of an utterance with a short pause."], [205.27, 206.7, "Part three: grammar."], [207.55, 213.42, "Grammar focus: Discourse markers: marker plus comma plus clause (speech)."], [213.72, 214.87, "Look at the pattern."], [215.58, 217.79, "Well, I am not sure about that."], [218.68, 221.05, "To be honest, I found it a little boring."], [221.95, 224.11, "By the way, did you call her yesterday?"], [225.07, 233.36, "Discourse markers organise speech: well (hesitation), I mean (clarify), anyway (return), by the way (side topic), actually (surprise)."], [234.12, 238.21, "Be careful! Don't say: Actually, it is a good idea, you know, anyway."], [240.17, 242.85, "Say: Actually, it is a good idea."], [243.15, 244.71, "Do not overuse markers."], [245.5, 248.21, "Part four: reading. Read and listen."], [249.0, 250.09, "Just Talking."], [250.39, 253.02, "Well, I am not sure that is a good idea."], [254.03, 256.88, "I mean, it could work if we planned carefully."], [257.87, 260.45, "Anyway, let's go back to the schedule."], [261.43, 264.07, "Actually, I think the first plan was better."], [265.07, 267.32, "By the way, did you send the invitation?"], [268.43, 272.33, "Part five: quiz. Five questions. Are you ready?"], [273.18, 276.46, "blank, I am not sure about that. (hesitation)"], [276.76, 280.16, "A, Well. B, Anyway. C, Actually."], [283.7, 285.57, "The answer is A: Well."], [286.72, 288.83, "Which returns to the main topic?"], [289.13, 292.61, "A, well. B, anyway. C, by the way."], [296.17, 298.31, "The answer is B: anyway."], [299.45, 301.59, "Which introduces a side topic?"], [301.89, 305.79, "A, by the way. B, anyway. C, to be honest."], [309.33, 311.27, "The answer is A: by the way."], [312.42, 315.01, "Discourse markers are mostly used in blank."], [315.31, 319.52, "A, dictionaries. B, speech. C, legal contracts."], [323.07, 324.97, "The answer is B: speech."], [326.12, 328.48, "According to the reading, what should be sent?"], [328.78, 332.93, "A, the invitation. B, the schedule. C, the report."], [336.47, 338.61, "The answer is A: the invitation."], [339.8, 342.95, "Part six: speaking. It's your turn to talk."], [343.82, 347.19, "Write a short dialogue using three discourse markers."], [355.98, 357.52, "Now listen to Visal."], [357.82, 374.31, "A: Well, what did you think of the film? B: To be honest, I found it slow. A: Actually, I loved it! B: Anyway, shall we get dinner? The markers make the dialogue sound natural."], [374.61, 376.08, "Excellent answer, Visal!"], [376.98, 383.58, "Great work! Now you can use eight new words and discourse markers: marker plus comma plus clause (speech)."], [383.88, 388.22, "Today's value is authentic living. Live by choices that are truly your own."], [388.52, 391.25, "See you in Unit thirty-eight. Goodbye!"], [391.55, 394.96, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GC1-Unit38-Tense-and-Aspect-in-Reporting-Texts": [[0.35, 5.35, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level C one."], [5.65, 9.85, "Hi! I'm Visal. Let's learn together!"], [10.15, 17.16, "Unit thirty-eight: Tense and Aspect in Reporting Texts. Today you will choose tenses in headlines and news reports."], [17.45, 20.21, "Here is our lesson map. Let's start!"], [21.17, 24.36, "Part one: words. You will learn eight new words."], [25.22, 26.37, "Present perfect."], [27.38, 30.37, "Present perfect means a tense linking the past to now."], [30.98, 32.59, "The minister has resigned."], [33.18, 36.09, "Your turn. Say: Present perfect."], [38.93, 40.11, "Present perfect."], [40.85, 41.92, "Past simple."], [42.92, 46.05, "Past simple means a tense for finished past events."], [46.65, 48.57, "The minister resigned on Monday."], [49.18, 52.02, "Your turn. Say: Past simple."], [54.87, 56.39, "Past simple."], [57.15, 58.33, "Reporting verb."], [59.32, 62.78, "Reporting verb means a verb that introduces reported speech."], [63.38, 64.7, "He said, he added."], [65.28, 68.13, "Your turn. Say: Reporting verb."], [70.97, 72.42, "Reporting verb."], [73.18, 74.16, "Backshift."], [75.15, 77.96, "Backshift means moving a tense one step back."], [78.55, 80.13, "Backshift in reports."], [80.72, 83.69, "Your turn. Say: Backshift."], [86.53, 87.48, "Backshift."], [88.22, 89.38, "Time reference."], [90.38, 92.69, "Time reference means words that show when."], [93.28, 95.26, "Last week is a time reference."], [95.85, 98.46, "Your turn. Say: Time reference."], [101.3, 102.55, "Time reference."], [103.28, 104.17, "Still true."], [105.18, 107.83, "Still true means a fact that remains correct."], [108.42, 110.0, "A still true statement."], [110.58, 113.56, "Your turn. Say: Still true."], [116.4, 117.78, "Still true."], [118.55, 119.76, "News report."], [120.75, 123.4, "News report means a factual account of events."], [123.98, 125.29, "A news report."], [125.88, 128.55, "Your turn. Say: News report."], [131.4, 132.6, "News report."], [133.35, 134.24, "Headline."], [135.25, 137.66, "Headline means the title of a news story."], [138.25, 140.22, "A headline in the present tense."], [140.82, 143.11, "Your turn. Say: Headline."], [145.97, 146.98, "Headline."], [147.77, 151.82, "Part two: dialogue. Let's listen to a conversation."], [152.68, 158.13, "Visal, why do headlines say Minister resigns, but the story says The minister resigned?"], [159.22, 168.75, "Headlines use the present simple to make events feel immediate and short. The report then switches to the past simple or present perfect for the full account."], [169.85, 171.71, "How do tenses work in the report?"], [172.82, 183.24, "The first sentence often uses the present perfect to link the news to now: The minister has resigned. Details follow in the past simple: She announced it on Monday."], [184.35, 186.12, "And for reported speech?"], [187.22, 201.46, "Reporting verbs are usually in the past, so we backshift: She said the economy was growing. But if the fact is still true, the present is acceptable. Time references like yesterday keep the story clear."], [202.6, 204.3, "Part three: grammar."], [205.15, 210.87, "Grammar focus: News tenses: headline present, lead present perfect, details past simple."], [211.16, 212.56, "Look at the pattern."], [213.25, 216.25, "The minister has resigned, officials confirmed today."], [217.15, 219.16, "She announced her decision on Monday."], [220.05, 222.42, "She said the economy was growing slowly."], [223.37, 231.98, "Headlines use the present simple. The lead often uses the present perfect. Details use the past simple, and reported speech usually backshifts."], [232.72, 236.39, "Be careful! Don't say: Yesterday the minister has resigned."], [238.33, 240.61, "Say: Yesterday the minister resigned."], [240.91, 242.41, "Use the past simple."], [243.2, 246.04, "Part four: reading. Read and listen."], [246.83, 248.15, "Reading the News."], [248.45, 251.42, "The headline reads: Minister resigns."], [252.43, 254.82, "The first line says the minister has resigned."], [255.8, 258.9, "She announced her decision at a press conference on Monday."], [259.9, 262.41, "She said that the economy was growing slowly."], [263.4, 266.86, "The tense changes as         // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        function renderContent() {
            let contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            stopVideo();                 // never leave a video playing in the background
            stopTalkTimer();             // ...or a Let's Talk timer running
            updateVideoTabBadge();
            // Always shows the real level and unit (it used to say "A1" on every level)
            document.getElementById('platform-info').textContent = `C2-EPE Grammar - ${gradeName(state.level)} (Unit ${state.unit}: ${unitData.title})`;
            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'learn') renderLearn(contentDiv, unitData);
            else if (state.tab === 'terms') renderTerms(contentDiv, unitData);
            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'think') renderThink(contentDiv, unitData);
            else if (state.tab === 'funfact') renderFunFact(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);
            else if (state.tab === 'spelling') renderSpelling(contentDiv, unitData);
            else if (state.tab === 'sentence') renderSentenceBuilding(contentDiv, unitData);
            else if (state.tab === 'summary') renderSummaryWriting(contentDiv, unitData);
            else if (state.tab === 'headline') renderHeadlineWriting(contentDiv, unitData);
            else if (state.tab === 'factopinion') renderFactOpinion(contentDiv, unitData);
            else if (state.tab === 'debate') renderDebateCorner(contentDiv, unitData);
            else if (state.tab === 'discussion') renderDiscussion(contentDiv, unitData);
            else if (state.tab === 'dictation') renderDictation(contentDiv, unitData);
            else if (state.tab === 'review') renderReview(contentDiv, unitData);
            else if (state.tab === 'pronunciation') renderPronunciationDrill(contentDiv, unitData);
            else if (state.tab === 'exam') renderExamPractice(contentDiv, unitData);
            else if (state.tab === 'challenge') renderGoal(contentDiv, unitData);
            else if (state.tab === 'codelab') renderCodeLab(contentDiv, unitData);
        }

        // ===== MY PROGRESS =====
        const ALL_TABS = ['video','learn','terms','quiz','think','funfact','vocabgame','spelling','sentence','summary','headline','factopinion','debate','discussion','dictation','review','pronunciation','exam','challenge'];
        function markActivityComplete(tab) {
            progress.completed = progress.completed || {};
            const key = state.level + '_' + state.unit + '_' + tab;
            if (!progress.completed[key]) { progress.completed[key] = true; saveProgress(); }
        }
        function showMyProgress() {
            const lines = LEVELS_ORDER.map(lvl => {
                let data = null;
                if (lvl === state.level) data = progress;
                else { try { data = JSON.parse(localStorage.getItem(PROGRESS_PREFIX + lvl) || 'null'); } catch (e) {} }
                const done = data && data.completed ? Object.keys(data.completed).filter(k => k.startsWith(lvl + '_')).length : 0;
                const total = Object.keys(curriculum[lvl]).length * ALL_TABS.length;
                return `${gradeName(lvl)}: ${done} / ${total} activities (${Math.round(done / total * 100)}%)${lvl === state.level ? ' ← current' : ''}`;
            }).join('\n');
            const unitDone = ALL_TABS.filter(t => progress.completed && progress.completed[state.level + '_' + state.unit + '_' + t]).length;
            alert(`📊 My Progress\n\n⭐ Stars: ${state.stars}\n🏆 Badges: ${state.badges}\n\nThis unit (Unit ${state.unit}): ${unitDone} / ${ALL_TABS.length} modules done\n\n${lines}\n\n(Saved on this device/browser only. Inside the Hub, progress lasts until the page is closed.)`);
