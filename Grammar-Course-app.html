 and written English to stress new or surprising information.", "question": "Rewrite 'I need a rest' as a cleft sentence beginning 'What I need…'.", "funfact": "Did you know? 'Cleft' means split: one sentence is split into two parts to emphasise one idea."}, "27": {"title": "Participle Clauses", "terms": ["Walking", "Having finished", "Built in", "Based on", "Reduce", "Same subject", "Active", "Passive"], "passage": "Participle clauses make sentences shorter. Walking home, I met an old friend. Having finished the report, she went home. Built in 1900, the bridge is still strong. The subject of the participle clause must be the same as the main clause.", "question": "Combine: 'I opened the door. I saw a letter.' using a participle clause.", "funfact": "Did you know? A famous mistake is the 'dangling participle', where the subject does not match the main clause."}, "28": {"title": "The Subjunctive", "terms": ["Suggest that", "Insist that", "It is vital that", "Were I", "Base form", "Formal", "Demand", "Recommend"], "passage": "The subjunctive appears in formal English after verbs of suggestion and demand. I suggest that he be present. It is vital that she arrive on time. The committee recommended that the plan be approved. The verb stays in its base form for every subject.", "question": "Complete: 'The manager insisted that every employee…'.", "funfact": "Did you know? In American English the subjunctive is common, while British English often uses 'should' instead."}, "29": {"title": "Ellipsis and Substitution", "terms": ["So", "Do so", "One", "Ones", "Not", "Omit", "Avoid repetition", "Cohesion"], "passage": "Ellipsis and substitution avoid repetition. 'Are you coming?' 'I hope so.' I like the red car, but she prefers the blue one. He asked me to wait, and I did so. We leave out words when the meaning is clear: I can swim, and so can she.", "question": "Rewrite to avoid repetition: 'I like green tea and she likes green tea too.'", "funfact": "Did you know? Good writers use ellipsis to sound natural; repeating every word can make a text heavy."}, "30": {"title": "Future in the Past", "terms": ["Was going to", "Would", "Was about to", "Was to", "Plan", "Prediction", "Unfulfilled", "Narrative"], "passage": "We use future in the past to describe what was planned or expected from a past point of view. I was going to call you, but I forgot. She knew she would win. They were about to leave when the phone rang. The structure appears often in stories.", "question": "Write a sentence about something you were going to do yesterday but did not do.", "funfact": "Did you know? 'Was going to' often implies that the plan did not happen."}, "31": {"title": "Result and Purpose Clauses", "terms": ["In order to", "So as to", "So that", "In order that", "Purpose", "Result", "So", "Therefore"], "passage": "Purpose clauses explain why we do something. She studies hard in order to pass. We left early so as not to miss the train. I wrote it down so that I wouldn't forget. A result clause shows the effect: It was late, so we took a taxi.", "question": "Join with 'so that': 'I set an alarm. I want to wake up early.'", "funfact": "Did you know? 'So that' can express both purpose (so that I can) and result (so that it was impossible)."}, "32": {"title": "Whatever, However, No Matter", "terms": ["Whatever", "Whenever", "Wherever", "However", "Whoever", "No matter", "Anything", "Regardless"], "passage": "These words mean 'it does not matter which, when, where or how'. Whatever you decide, I will support you. Wherever he goes, he makes friends. However hard I try, I cannot win. No matter what happens, stay calm. Whoever called left no message.", "question": "Complete the sentence: 'Whatever happens tomorrow, I…'.", "funfact": "Did you know? 'No matter' is followed by a question word, such as no matter what, no matter how or no matter who."}, "33": {"title": "Past Habits (would / used to)", "terms": ["Used to", "Would", "Past state", "Past action", "Regularly", "Contrast", "Nostalgia", "No longer"], "passage": "We use used to and would for past habits. When I was a child, I used to live in a village. Every summer we would visit our grandparents. We cannot use would for past states: I used to be shy, not I would be shy.", "question": "Write two sentences about what you used to do and would do as a child.", "funfact": "Did you know? 'Would' for habits needs a past context that is already clear."}, "34": {"title": "Formal Prepositional Phrases", "terms": ["In terms of", "With regard to", "On behalf of", "In accordance with", "As a result of", "In spite of", "By means of", "Due to"], "passage": "Formal writing uses prepositional phrases. With regard to your request, we will reply soon. In terms of cost, this plan is cheaper. On behalf of the team, I thank you. As a result of the storm, the road is closed.", "question": "Write a formal sentence starting with 'With regard to…'.", "funfact": "Did you know? 'Due to' is followed by a noun, and 'because' is followed by a clause."}, "35": {"title": "Nominalisation", "terms": ["Decide → decision", "Fail → failure", "Develop → development", "Noun form", "Formal style", "Abstract", "Information density", "Academic"], "passage": "Nominalisation turns verbs and adjectives into nouns. The government decided quickly becomes The government's quick decision. This is common in academic writing because it packs more information into fewer words. The development of technology has changed our lives.", "question": "Rewrite 'People are moving to cities quickly' using a noun phrase.", "funfact": "Did you know? Overusing nominalisation can make writing heavy, so balance it with simple verbs."}, "36": {"title": "Ability in the Past", "terms": ["Could", "Was able to", "Managed to", "Succeeded in", "Couldn't", "General ability", "Specific occasion", "Achievement"], "passage": "For general ability in the past we use could: I could swim when I was five. For one specific success we use was able to, managed to or succeeded in: I was able to finish the test. We use couldn't for both general and specific cases.", "question": "Write one sentence with 'could' and one with 'managed to'.", "funfact": "Did you know? 'Managed to' suggests that something was difficult."}, "37": {"title": "Determiners: Each, Every, Whole", "terms": ["Each", "Every", "Whole", "Half", "All", "Most", "Either", "Enough"], "passage": "Each and every are followed by a singular noun. Each student has a book. Every day brings something new. Whole means complete: I read the whole book. Half the class was absent. Most of the students passed, and all of them were happy.", "question": "Write two sentences, one with 'each' and one with 'whole'.", "funfact": "Did you know? 'All the day' is wrong; we say 'the whole day' or 'all day'."}, "38": {"title": "Relative Clauses with Prepositions and Quantifiers", "terms": ["In which", "To whom", "Some of which", "None of whom", "Many of whom", "The way in which", "Whose", "Formal"], "passage": "In formal English a preposition can come before the relative pronoun. The house in which I was born is old. The person to whom I spoke was kind. We can also use quantifiers: She has three sisters, two of whom are doctors. The books, some of which are rare, are valuable.", "question": "Combine: 'He has ten cousins. Six of them live abroad.' using 'of whom'.", "funfact": "Did you know? After a preposition we must use 'whom' for people and 'which' for things, never 'that'."}, "39": {"title": "Review: B2 Grammar", "terms": ["Conditionals", "Passive", "Deduction", "Gerunds", "Infinitives", "Relative clauses", "Future perfect", "Connectors"], "passage": "B2 grammar covers all conditionals, advanced passives, modals of deduction, gerunds and infinitives, relative clauses, the future perfect and discourse connectors. Together they allow fluent, precise communication.", "question": "Which B2 structure do you use most confidently?", "funfact": "Did you know? At B2, accuracy with complex grammar matters as much as vocabulary for exams like Cambridge B2 First."}}, "C1": {"1": {"title": "Advanced Passive Constructions", "terms": ["Is said to be", "Is believed to be", "It is thought that", "Reporting verb", "Impersonal", "Academic tone", "Objectivity", "Distance"], "passage": "Advanced passive constructions create distance and objectivity. It is believed that the theory is correct. The results are said to be significant. This structure is common in academic and journalistic writing.", "question": "Rewrite this using an advanced passive construction: 'People think the plan will work.'", "funfact": "Did you know? Constructions like 'it is thought that' let a writer report a claim without directly stating who holds that belief."}, "2": {"title": "Inversion for Emphasis", "terms": ["Never have I", "Rarely does", "Not only", "Seldom", "Emphatic", "Formal register", "Fronting", "Literary style"], "passage": "Inversion reverses normal word order for emphasis, often in formal writing. Never have I seen such dedication. Rarely does she complain. Not only did he finish first, but he also broke the record.", "question": "Try rewriting a sentence using inversion, starting with 'Never have I...'", "funfact": "Did you know? Inversion for emphasis is more common in formal writing and literature than in everyday spoken English."}, "3": {"title": "Cleft Sentences", "terms": ["It was... that", "What... is", "Cleft structure", "Focus", "Highlight", "Emphasis", "Information structure", "Rhetorical"], "passage": "A cleft sentence splits information to highlight one part. It was John who broke the vase. What I need is more time. This structure lets a speaker emphasize exactly the right piece of information.", "question": "Rewrite this as a cleft sentence: 'Sarah won the competition.'", "funfact": "Did you know? Cleft sentences are a powerful tool in persuasive writing because they let the writer control exactly what the reader focuses on."}, "4": {"title": "Subjunctive Mood", "terms": ["I suggest that", "It is essential that", "Were", "Hypothetical wish", "Formal demand", "Recommendation", "Base form", "Unreal"], "passage": "The subjunctive mood expresses a wish, suggestion, or formal demand. I suggest that he arrive early. It is essential that she be informed. If I were you, I would reconsider.", "question": "Write a sentence using the subjunctive after 'I recommend that...'", "funfact": "Did you know? The subjunctive mood is fading from everyday English but still survives strongly in formal and legal writing."}, "5": {"title": "Advanced Reported Speech", "terms": ["Claimed", "Insisted", "Denied", "Reporting verb", "Nuance", "Implication", "Indirect meaning", "Tone"], "passage": "Advanced reported speech uses a specific reporting verb to add nuance. He claimed he was innocent. She insisted on paying. They denied any involvement. Each verb implies a slightly different tone.", "question": "Report a statement using 'insisted' instead of 'said'.", "funfact": "Did you know? Choosing the right reporting verb, like 'admitted' versus 'claimed', can subtly change how trustworthy a statement sounds."}, "6": {"title": "Participle Clauses", "terms": ["Having finished", "Walking down the street", "Present participle", "Past participle", "Reduce a clause", "Concise", "Formal writing", "Connect ideas"], "passage": "A participle clause makes writing more concise by reducing a full clause. Having finished his homework, he watched TV. Walking down the street, she saw an old friend. This structure connects two ideas smoothly.", "question": "Combine two sentences into one using a participle clause.", "funfact": "Did you know? Participle clauses are especially common in written English, where they help avoid repeating the subject twice."}, "7": {"title": "Fronting for Emphasis", "terms": ["Fronting", "Never have I", "Rarely does", "Inversion", "Emphatic word order", "Front position", "Stylistic effect", "Literary style"], "passage": "Fronting moves an element to the front of a sentence for emphasis. Never have I seen such dedication. Rarely does she complain about anything.", "question": "Write a sentence using fronting to add emphasis.", "funfact": "Did you know? Fronting with negative adverbs like 'never' or 'rarely' requires subject-verb inversion, just like in a question."}, "8": {"title": "Advanced Cleft Structures", "terms": ["It was...that", "What...is", "All...is", "Cleft sentence", "Focus structure", "Highlighting information", "Split sentence", "Emphasis structure"], "passage": "A cleft sentence splits information to highlight a specific part. It was John who called. What I need is more time. All she wants is peace.", "question": "Rewrite a simple sentence as a cleft sentence to add emphasis.", "funfact": "Did you know? Cleft sentences are extremely common in spoken English, even though many speakers don't consciously know the grammar term."}, "9": {"title": "Hypothetical Past (advanced)", "terms": ["Had I known", "Were it not for", "Inverted conditional", "Formal hypothetical", "Without 'if'", "Literary conditional", "Elevated register", "Formal writing"], "passage": "Advanced hypothetical structures can omit 'if' using inversion. Had I known, I would have come earlier. Were it not for her help, we would have failed.", "question": "Rewrite a conditional sentence using inversion instead of 'if'.", "funfact": "Did you know? This inverted conditional structure, without 'if', is considered quite formal and appears often in academic and literary writing."}, "10": {"title": "Complex Passive Voice", "terms": ["Is thought to have been", "Is rumored to be", "Multi-layered passive", "Passive with perfect infinitive", "Reported belief", "Layered structure", "Formal register", "Objective claim"], "passage": "Complex passive structures combine multiple layers of grammar. The bridge is thought to have been built in the 1800s. He is rumored to be leaving the company.", "question": "Write a complex passive sentence about a historical fact or rumor.", "funfact": "Did you know? These layered passive structures allow writers to express uncertainty or attribute a claim without naming a source."}, "11": {"title": "Advanced Modal Perfect", "terms": ["Can't have", "Needn't have", "Would have", "Modal + perfect infinitive", "Past certainty", "Unnecessary past action", "Hypothetical past result", "Speculation"], "passage": "Advanced modal perfects express nuanced past meaning. She can't have finished already. You needn't have worried. I would have helped if you had asked.", "question": "Write a sentence using 'needn't have' about an unnecessary past action.", "funfact": "Did you know? 'Needn't have' specifically means an action was done but turned out to be unnecessary, unlike 'didn't need to'."}, "12": {"title": "Concessive Clauses", "terms": ["Even though", "Much as", "While", "Granted that", "Concession", "Acknowledging a point", "Contrast despite agreement", "Formal concession"], "passage": "A concessive clause acknowledges a point before making a contrasting one. Much as I admire her work, I disagree with this decision. Granted that it's difficult, it's still possible.", "question": "Write a sentence using 'much as' to concede a point.", "funfact": "Did you know? Concessive clauses are a sophisticated way to sound balanced and fair while still making a strong argument."}, "13": {"title": "Emphatic Structures", "terms": ["So...that", "Such...that", "What a", "Emphatic exclamation", "Intensifier", "Degree emphasis", "Strong reaction", "Heightened effect"], "passage": "Emphatic structures intensify meaning. It was so cold that the lake froze. She has such patience that nothing bothers her. What a remarkable achievement!", "question": "Write a sentence using 'so...that' to show a strong effect.", "funfact": "Did you know? 'So' is used before an adjective alone, while 'such' is used before an adjective plus a noun."}, "14": {"title": "Advanced Participle Clauses", "terms": ["Having done", "Being + past participle", "Perfect participle", "Passive participle clause", "Reduced clause", "Formal economy", "Concise structure", "Academic style"], "passage": "Advanced participle clauses create concise, formal sentences. Having finished the report, she left the office. Being asked to leave, he apologized and complied.", "question": "Rewrite a two-clause sentence using an advanced participle clause.", "funfact": "Did you know? Participle clauses are prized in formal writing because they express complex ideas in fewer words."}, "15": {"title": "Nominal Relative Clauses", "terms": ["What", "Whoever", "Whatever", "Whichever", "Free relative clause", "No antecedent", "Embedded meaning", "Flexible reference"], "passage": "A nominal relative clause has no separate antecedent — the pronoun itself carries the meaning. Whatever you decide is fine with me. Whoever arrives first can choose.", "question": "Write a sentence using 'whatever' as a nominal relative clause.", "funfact": "Did you know? These clauses are called 'nominal' because the whole clause functions exactly like a single noun."}, "16": {"title": "Advanced Conditional Inversion", "terms": ["Should you", "Were you to", "Had it not been", "Formal inversion", "Conditional without if", "Subjunctive inversion", "Elevated tone", "Literary conditional"], "passage": "Advanced conditional inversion drops 'if' for a formal tone. Should you need help, call me. Were you to ask, I would agree. Had it not been for her, we'd have failed.", "question": "Write a formal conditional sentence using inversion instead of 'if'.", "funfact": "Did you know? This structure is especially common in legal, academic, and diplomatic English."}, "17": {"title": "Elliptical Constructions", "terms": ["Ellipsis", "Omission", "Implied meaning", "So does she", "I think so", "Reduced clause", "Economy of language", "Context-dependent"], "passage": "Ellipsis omits words that are understood from context. I can swim, and so can she. Do you want to come? I think so. Both examples avoid repeating information.", "question": "Write a sentence that uses ellipsis to avoid repetition.", "funfact": "Did you know? Ellipsis makes English sound more natural — repeating full sentences without it can sound stiff and unnatural."}, "18": {"title": "Advanced Reported Speech Nuances", "terms": ["Backshift", "No backshift", "Reporting verb choice", "Insist", "Claim", "Modality shift", "Nuanced meaning", "Tone of reporting"], "passage": "Advanced reported speech considers backshift and reporting verb choice carefully. She insisted that he apologize. He claimed to have finished the work.", "question": "Report a statement using a nuanced reporting verb like 'insist' or 'claim'.", "funfact": "Did you know? Choosing 'claim' instead of 'say' can subtly suggest the speaker doubts whether the statement is true."}, "19": {"title": "Stylistic Fronting", "terms": ["Down came the rain", "Away she ran", "Adverbial fronting", "Literary inversion", "Descriptive emphasis", "Narrative style", "Dramatic effect", "Creative writing"], "passage": "Stylistic fronting creates dramatic effect in narrative writing. Down came the rain. Away she ran into the night. Such inversions are common in literary style.", "question": "Write a short, dramatic sentence using stylistic fronting.", "funfact": "Did you know? Stylistic fronting is more common in written literature and storytelling than in everyday conversation."}, "20": {"title": "Advanced Future Forms", "terms": ["Be about to", "Be due to", "Be on the verge of", "Be set to", "Be to", "Imminent", "Scheduled", "Formal"], "passage": "The train is about to leave. The report is due to be published next week, and the company is set to announce new jobs. Scientists are on the verge of a breakthrough. The minister is to visit Phnom Penh.", "question": "Write a news-style sentence using 'be set to' or 'be to'.", "funfact": "Did you know? 'Be to + infinitive' is common in news: 'The president is to visit Japan' means it is officially planned."}, "21": {"title": "Modal Nuances of Probability", "terms": ["Be bound to", "Be likely to", "Be sure to", "Be unlikely to", "May well", "Could well", "Probability", "Certainty"], "passage": "Prices are bound to rise if costs increase. The team is likely to win, but the match may well be close. The storm could well delay flights, although it is unlikely to cause serious damage.", "question": "Make three predictions with different levels of certainty.", "funfact": "Did you know? 'May well' and 'could well' suggest a stronger possibility than just 'may' or 'could'."}, "22": {"title": "Advanced Determiners", "terms": ["Either", "Neither", "Each", "Every", "Whole", "All", "Both", "None"], "passage": "Neither option was perfect, but each had advantages. Both proposals were read by every member of the committee. None of the data was lost, and the whole team agreed. Either plan could work.", "question": "Explain the difference between 'each' and 'every'.", "funfact": "Did you know? 'Each' focuses on individuals one by one, while 'every' sees them as a group."}, "23": {"title": "Grammar and Collocation", "terms": ["Collocation", "Make a decision", "Do research", "Take responsibility", "Pay attention", "Heavy rain", "Strong coffee", "Natural"], "passage": "Native speakers use collocations that sound natural. We make a decision, do research, take responsibility and pay attention. We say 'heavy rain' and 'strong coffee', not 'strong rain' or 'heavy coffee'.", "question": "Which English collocations do you find surprising?", "funfact": "Did you know? Learning words in collocations helps you sound natural much faster than learning single words."}, "24": {"title": "Causative Verb Patterns", "terms": ["Make", "Let", "Have", "Get", "Help", "Bare infinitive", "Permission", "Force"], "passage": "My teacher made us rewrite the essay. Our parents let us choose our subjects. The manager had the staff attend training, and she got her colleague to check the report. 'Make', 'let' and 'have' take a bare infinitive.", "question": "What did your parents make or let you do as a child?", "funfact": "Did you know? In the passive, 'make' needs 'to': 'We were made to wait' — but active 'They made us wait'."}, "25": {"title": "Future Perfect Continuous", "terms": ["Will have been", "Duration", "By then", "By the time", "Ongoing", "Accumulated", "Milestone", "Projection"], "passage": "The future perfect continuous looks back from a future point to show how long an activity will have been in progress. By next June, I will have been teaching for twenty years. By the time she arrives, we will have been waiting for two hours. It emphasises duration and accumulated effort.", "question": "Write a sentence about how long you will have been studying English by next year.", "funfact": "Did you know? Unlike the future perfect, this form stresses the duration of the activity, not its completion."}, "26": {"title": "Gerund and Infinitive: Advanced Patterns", "terms": ["Remember doing", "Regret to say", "Go on doing", "Go on to do", "Mean doing", "Mean to do", "Can't help doing", "Meaning change"], "passage": "Some verbs change meaning with a gerund or an infinitive. She went on talking means she continued, but she went on to become a doctor means a new stage followed. I regret to inform you is formal news, while I regret telling him is a past regret. Learners must memorise these contrasts.", "question": "Write two sentences that show the difference between 'go on doing' and 'go on to do'.", "funfact": "Did you know? 'Can't help doing' means you cannot stop yourself, as in 'I can't help laughing'."}, "27": {"title": "Passive Gerunds and Infinitives", "terms": ["Being done", "To be done", "Having been done", "To have been done", "Passive gerund", "Passive infinitive", "Perfect passive", "Agent"], "passage": "We can use the passive after prepositions and verbs. She hates being interrupted. He expected to be promoted. The document is believed to have been written in 1800. Having been warned, they left early. These forms keep the focus on the receiver of the action.", "question": "Write a sentence using 'being' + past participle after a verb of feeling.", "funfact": "Did you know? Verbs like enjoy, avoid and risk take the passive gerund: 'He avoided being seen'."}, "28": {"title": "Quantifying Expressions", "terms": ["A great deal of", "A handful of", "The vast majority of", "A fair amount of", "Scarcely any", "A wealth of", "A host of", "Approximately"], "passage": "Advanced writers vary quantifiers. A great deal of research supports this view. Only a handful of students attended. The vast majority of people agree. There is a wealth of evidence, but scarcely any of it is recent. These expressions give precision and style.", "question": "Rewrite 'Many people agree' using a more precise quantifying expression.", "funfact": "Did you know? 'A great deal of' is used with uncountable nouns, while 'a large number of' is used with countable nouns."}, "29": {"title": "Clauses of Manner and Comparison", "terms": ["As if", "As though", "Just as", "The way", "Like", "As", "Unreal comparison", "Subjunctive past"], "passage": "As if and as though introduce an unreal comparison. He talks as if he owned the place. She looked as though she had seen a ghost. Just as the sun rises, hope returns. We use a past tense to show the comparison is not real, and we use the way in informal speech.", "question": "Complete the sentence: 'He behaves as if…'.", "funfact": "Did you know? Formal writing often uses 'were' after 'as if': 'as if he were the manager'."}, "30": {"title": "Wishes, Regrets and Preferences (advanced)", "terms": ["I'd sooner", "It's about time", "If only", "Would rather", "Supposing", "Suppose", "Wish + would", "Hypothetical"], "passage": "Advanced preferences and wishes use unreal tenses. I would rather you left now. It's about time we changed the system. If only she would listen! Supposing you lost your job, what would you do? The past tense signals an unreal present or future situation.", "question": "Write two sentences expressing a preference using 'would rather' and 'it's about time'.", "funfact": "Did you know? 'I'd sooner' means the same as 'I'd rather': 'I'd sooner walk than wait'."}, "31": {"title": "Sentential and Non-finite Relative Clauses", "terms": ["Which", "Whereby", "Whence", "Sentential relative", "Non-finite", "Reduced", "Comment clause", "Extra information"], "passage": "A sentential relative clause refers to a whole idea. He passed the exam, which surprised everyone. Whereby introduces a method: a system whereby tickets are sold online. Non-finite clauses are reduced: the woman sitting there. These forms add comment without a new sentence.", "question": "Add a sentential 'which' clause to this sentence: 'The train was late.'", "funfact": "Did you know? A sentential 'which' always follows a comma and refers to the whole preceding clause."}, "32": {"title": "Complex Noun Phrases", "terms": ["Premodifier", "Postmodifier", "Head noun", "Noun cluster", "Prepositional postmodifier", "Relative postmodifier", "Information density", "Academic style"], "passage": "A complex noun phrase has a head noun with modifiers before and after it. The recent government decision to raise taxes on imported goods caused debate. Premodifiers are adjectives and nouns, and postmodifiers are phrases or clauses. This structure packs information.", "question": "Expand 'a report' into a complex noun phrase with a premodifier and a postmodifier.", "funfact": "Did you know? Academic writing contains more nouns than spoken English, which makes noun phrases dense."}, "33": {"title": "Advanced Linking: Lest, With a View to", "terms": ["Lest", "With a view to", "In the hope that", "So as not to", "Provided", "Supposing", "Purpose", "Precaution"], "passage": "Formal English has special linking words. She spoke quietly lest she wake the baby. We wrote early with a view to securing a place. Lest is followed by a subjunctive or should. These patterns are used in literary and legal writing.", "question": "Write a formal sentence using 'lest' or 'with a view to'.", "funfact": "Did you know? 'Lest' has a negative meaning in itself, so do not add another negative word."}, "34": {"title": "Stance Adverbials", "terms": ["Admittedly", "Arguably", "Evidently", "Undoubtedly", "Presumably", "Regrettably", "Strictly speaking", "Hedge"], "passage": "Stance adverbials show the writer's attitude. Admittedly, the cost is high. Arguably, this is the best solution. Evidently, the data support the claim. Presumably, he knew the risk. They guide the reader and show how certain the writer is.", "question": "Rewrite 'The plan is good' adding a stance adverbial.", "funfact": "Did you know? 'Arguably' means that a case can be made, so it is a hedge, not a statement of fact."}, "35": {"title": "Contrastive Structures", "terms": ["Whereas", "While", "By contrast", "Conversely", "On the one hand", "On the other hand", "Unlike", "In contrast to"], "passage": "Contrast can be shown in many ways. Whereas urban areas grow, rural areas shrink. By contrast, coastal regions are stable. On the one hand, the plan is cheap; on the other hand, it is slow. Unlike his brother, he is shy.", "question": "Write two sentences that contrast two cities using different structures.", "funfact": "Did you know? 'Conversely' reverses the idea just mentioned, while 'by contrast' simply compares."}, "36": {"title": "Adjective and Noun + Preposition", "terms": ["Aware of", "Capable of", "Reliant on", "Reluctance to", "Tendency towards", "Insight into", "Impact on", "Emphasis on"], "passage": "Many adjectives and nouns take fixed prepositions. She is aware of the risks. There is a tendency towards early retirement. The study offers insight into poverty. Reluctance to change slows progress. Learners must remember the pairs as chunks.", "question": "Write two sentences with a noun + preposition combination.", "funfact": "Did you know? 'Impact on' is correct; 'impact to' is common but criticised in formal writing."}, "37": {"title": "Discourse Markers in Speech", "terms": ["Well", "I mean", "Anyway", "You know", "Actually", "As a matter of fact", "To be honest", "By the way"], "passage": "Discourse markers organise spoken English. Well, I think we should wait. I mean, it isn't easy. Anyway, let's move on. To be honest, I prefer the first plan. By the way, have you met her? They manage turns and show attitude.", "question": "Write a short dialogue using three discourse markers.", "funfact": "Did you know? 'Actually' in English often introduces a correction, not 'now' as in some languages."}, "38": {"title": "Tense and Aspect in Reporting Texts", "terms": ["Present perfect", "Past simple", "Reporting verb", "Backshift", "Time reference", "Still true", "News report", "Headline"], "passage": "Reports mix tenses with care. News stories use the past simple for events but the present perfect for recent updates. A reported fact that is still true may keep the present tense: She said that Paris is the capital. Headlines use the present for past events.", "question": "Rewrite this headline-style sentence as full past simple: 'Minister resigns'.", "funfact": "Did you know? Headlines often use the present simple for past events to sound immediate."}, "39": {"title": "Review: C1 Grammar", "terms": ["Inversion", "Cleft sentences", "Subjunctive", "Participle clauses", "Fronting", "Ellipsis", "Modal perfect", "Emphasis"], "passage": "C1 grammar gives writers control over emphasis and style: inversion, cleft sentences, the subjunctive, participle clauses, fronting, ellipsis and modal perfects. Used well, they make writing precise and elegant.", "question": "Which C1 structure will you use in your next essay?", "funfact": "Did you know? At C1, the goal is not only correct grammar but choosing the structure that best fits your purpose."}}, "C2": {"1": {"title": "Nominalization", "terms": ["Decide → decision", "Analyze → analysis", "Nominalization", "Abstract noun", "Formal register", "Academic writing", "Density", "Precision"], "passage": "Nominalization turns a verb or adjective into a noun, common in academic writing. 'They decided quickly' becomes 'Their decision was quick.' This creates a denser, more formal, and more precise style.", "question": "Turn this into a nominalized sentence: 'The scientists analyzed the data carefully.'", "funfact": "Did you know? Overusing nominalization can make writing feel distant or hard to read, so skilled writers balance it with active verbs."}, "2": {"title": "Complex Sentence Structures", "terms": ["Subordinate clause", "Coordinating conjunction", "Multiple clauses", "Layered meaning", "Syntax", "Cohesion", "Sentence variety", "Sophistication"], "passage": "A complex sentence structure layers multiple clauses to express sophisticated, connected ideas. Although the results were promising, further research, which had been delayed by funding issues, was still required before any firm conclusion could be drawn.", "question": "Write one complex sentence with at least two subordinate clauses.", "funfact": "Did you know? Highly complex sentence structures are more common in written academic English than in natural spoken conversation."}, "3": {"title": "Ellipsis & Substitution", "terms": ["Ellipsis", "Substitution", "Omit", "Implied", "Cohesive device", "So", "One", "Do so"], "passage": "Ellipsis omits words that are understood from context, while substitution replaces them with a word like 'one' or 'so'. 'Are you coming?' 'I think so.' 'I need a pen. Do you have one?' Both devices avoid repetition.", "question": "Give an example sentence using ellipsis or substitution.", "funfact": "Did you know? Ellipsis and substitution are considered advanced cohesive devices that make writing sound more natural and less repetitive."}, "4": {"title": "Advanced Discourse Markers", "terms": ["Nevertheless", "Notwithstanding", "In light of", "Consequently", "Discourse marker", "Coherence", "Transition", "Register"], "passage": "Advanced discourse markers guide the reader through complex, formal arguments. Nevertheless, the plan proceeded. Notwithstanding the risks, they continued. In light of new evidence, the theory was revised, and consequently, the policy changed.", "question": "Write a sentence using 'notwithstanding' or 'in light of'.", "funfact": "Did you know? Discourse markers like 'notwithstanding' are almost exclusively used in formal or legal English, rarely in casual speech."}, "5": {"title": "Rhetorical Grammar Structures", "terms": ["Parallelism", "Anaphora", "Rhetorical question", "Antithesis", "Persuasive structure", "Balance", "Repetition", "Impact"], "passage": "Rhetorical grammar structures shape persuasive writing. Parallelism creates balance: 'We came, we saw, we conquered.' Anaphora repeats a phrase for impact, and a rhetorical question makes the reader think without expecting an answer.", "question": "Write a short sentence using parallelism (a balanced repeated structure).", "funfact": "Did you know? Many famous historical speeches rely heavily on rhetorical grammar structures like anaphora and parallelism to move an audience."}, "6": {"title": "Register & Style Variation", "terms": ["Formal register", "Informal register", "Colloquial", "Academic tone", "Style shift", "Audience awareness", "Appropriate", "Nuance"], "passage": "Skilled writers shift register depending on their audience. An academic tone avoids contractions and slang, while an informal register uses colloquial expressions freely. Choosing the right style shows real audience awareness.", "question": "Rewrite a formal sentence in an informal, colloquial style.", "funfact": "Did you know? Truly advanced English proficiency includes knowing not just grammar rules, but when to deliberately break them for style."}, "7": {"title": "Advanced Nominalization", "terms": ["Nominalization", "Process to noun", "Abstract noun", "Academic density", "Verb-to-noun shift", "Formal tone", "Compact meaning", "Dense writing"], "passage": "Advanced nominalization turns verbs and adjectives into abstract nouns for a dense, formal tone. 'The implementation of the policy' rather than 'implementing the policy'.", "question": "Rewrite a simple verb phrase as a nominalized noun phrase.", "funfact": "Did you know? Heavy nominalization is a hallmark of academic writing, though overusing it can make writing harder to read."}, "8": {"title": "Syntactic Complexity", "terms": ["Embedding", "Subordination layers", "Complex sentence", "Multiple clauses", "Sentence architecture", "Hierarchical structure", "Nested clause", "Sophisticated syntax"], "passage": "Syntactic complexity involves embedding multiple clauses within a single sentence. The report, which was compiled by a team that had studied the issue for years, concluded that reform was necessary.", "question": "Write a syntactically complex sentence with at least two embedded clauses.", "funfact": "Did you know? Highly complex sentences can sound impressive, but clear writers still balance complexity with readability."}, "9": {"title": "Advanced Ellipsis", "terms": ["Gapping", "Stripping", "Sluicing", "Complex omission", "Coordinate ellipsis", "Syntactic gap", "Economy principle", "Structural omission"], "passage": "Advanced ellipsis includes gapping and sluicing in complex sentences. She studies law, and her brother, medicine. I know someone went, but I don't know who.", "question": "Write a sentence that uses advanced ellipsis (gapping) between two clauses.", "funfact": "Did you know? 'Sluicing' — reducing a full clause to just a question word, like 'I don't know who' — is a term linguists specifically study."}, "10": {"title": "Cohesive Devices (advanced)", "terms": ["Anaphora", "Cataphora", "Lexical cohesion", "Reference chain", "Textual unity", "Cohesive tie", "Discourse cohesion", "Coherent text"], "passage": "Advanced cohesive devices, like anaphora and lexical cohesion, unify a text. A pronoun referring back to an earlier noun creates a reference chain across paragraphs.", "question": "Identify one cohesive device in a paragraph you have recently read or written.", "funfact": "Did you know? 'Anaphora' refers back to something already mentioned, while 'cataphora' refers forward to something mentioned later."}, "11": {"title": "Advanced Register Shifts", "terms": ["Formal register", "Informal register", "Code-switching", "Audience adaptation", "Tone control", "Register mismatch", "Stylistic awareness", "Contextual appropriateness"], "passage": "Advanced writers shift register deliberately for audience and purpose. A legal document uses a formal register; a text message uses a casual one — mixing them can sound jarring.", "question": "Rewrite one formal sentence in an informal register, and vice versa.", "funfact": "Did you know? Skilled writers and speakers often shift register mid-conversation, matching their tone to their listener without even noticing."}, "12": {"title": "Rhetorical Questions in Writing", "terms": ["Rhetorical question", "No answer expected", "Persuasive device", "Reader engagement", "Implied answer", "Stylistic question", "Argumentative tool", "Emphasis device"], "passage": "A rhetorical question is asked for effect, not a literal answer. Isn't it obvious that change is needed? Who wouldn't want a better future?", "question": "Write a rhetorical question you might use to open a persuasive essay.", "funfact": "Did you know? Rhetorical questions are a persuasive technique used since ancient Greek and Roman oratory."}, "13": {"title": "Advanced Hedging Language", "terms": ["It could be argued", "To some extent", "Arguably", "Tentative claim", "Academic caution", "Qualifying statement", "Softened claim", "Epistemic modality"], "passage": "Advanced hedging softens a claim's certainty. It could be argued that the policy failed. The results are, to some extent, inconclusive. Arguably, more research is needed.", "question": "Write a hedged academic claim using 'arguably' or 'to some extent'.", "funfact": "Did you know? Hedging language is essential in academic writing, since it shows appropriate caution rather than overconfidence."}, "14": {"title": "Advanced Subordination", "terms": ["Multiple subordinate clauses", "Layered subordination", "Complex-compound sentence", "Nested subordination", "Hierarchical clause structure", "Dependent clause stacking", "Syntactic depth", "Sentence layering"], "passage": "Advanced subordination stacks multiple dependent clauses within one sentence. Although the plan, which had taken months to develop, seemed promising, it ultimately failed because funding was withdrawn.", "question": "Write a sentence with at least three layers of subordination.", "funfact": "Did you know? Sentences with too many layers of subordination can become difficult to parse, even for native speakers."}, "15": {"title": "Periodic vs Loose Sentences", "terms": ["Periodic sentence", "Loose sentence", "Main clause position", "Suspended meaning", "Climactic structure", "Front-loaded clause", "Delayed conclusion", "Sentence rhythm"], "passage": "A periodic sentence delays the main clause until the end for effect. A loose sentence states the main idea first, then adds details. Both create different rhythms in writing.", "question": "Write one periodic sentence and one loose sentence on the same topic.", "funfact": "Did you know? Periodic sentences build suspense and are often used for dramatic or persuasive effect in writing."}, "16": {"title": "Advanced Discourse Cohesion", "terms": ["Thematic progression", "Given-new structure", "Information flow", "Paragraph unity", "Topic continuity", "Textual flow", "Macro-cohesion", "Reader guidance"], "passage": "Advanced discourse cohesion manages how information flows across a whole text, not just within one sentence. Thematic progression guides the reader smoothly from known to new information.", "question": "Analyze how one paragraph you've read moves from known to new information.", "funfact": "Did you know? 'Given-new' structure — starting with familiar information before adding new details — is a key principle in clear academic writing."}, "17": {"title": "Syntactic Variation for Style", "terms": ["Sentence variety", "Rhythm", "Short vs long sentences", "Stylistic choice", "Prose rhythm", "Varied structure", "Reader engagement", "Stylistic control"], "passage": "Skilled writers vary sentence length and structure deliberately for rhythm and effect. A short sentence after several long ones can create emphasis and impact.", "question": "Write a short paragraph that deliberately varies sentence length for effect.", "funfact": "Did you know? Professional editors often specifically look for repetitive sentence structure as a sign that writing needs revision."}, "18": {"title": "Advanced Academic Grammar", "terms": ["Impersonal constructions", "Passive for objectivity", "Hedged claims", "Formal register consistency", "Academic conventions", "Third-person distance", "Evidentiality", "Scholarly tone"], "passage": "Advanced academic grammar combines impersonal constructions, hedged claims, and consistent formal register. It has been observed that, rather than I noticed that, maintains scholarly distance.", "question": "Rewrite a personal observation using formal, impersonal academic grammar.", "funfact": "Did you know? Academic writing conventions vary somewhat by field and even by country, though core principles remain similar."}, "19": {"title": "Grammar for Persuasive Writing", "terms": ["Parallelism", "Tricolon", "Antithesis", "Persuasive structure", "Rhetorical pattern", "Balanced clause", "Climactic list", "Rhetorical grammar"], "passage": "Persuasive writing uses grammatical patterns like parallelism, the tricolon (a list of three), and antithesis for impact. We came, we saw, we conquered is a classic tricolon.", "question": "Write a short persuasive sentence using a tricolon (a list of three parallel items).", "funfact": "Did you know? The 'rule of three' in persuasive writing is one of the oldest and most effective rhetorical techniques in any language."}, "20": {"title": "Information Structure", "terms": ["End-focus", "End-weight", "Given information", "New information", "Theme", "Rheme", "Emphasis", "Flow"], "passage": "Good writers control information structure. Given information comes first (the theme), and new information comes later (the rheme). End-focus puts key ideas at the end, and end-weight moves long phrases there too, improving flow and emphasis.", "question": "Why do long subjects often sound awkward at the start of a sentence?", "funfact": "Did you know? English readers naturally expect the most important new information near the end of a sentence."}, "21": {"title": "Modality in Argument", "terms": ["Epistemic modality", "Deontic modality", "Certainty", "Obligation", "Stance", "Commitment", "Argument", "Nuance"], "passage": "Modality shapes an argument. Epistemic modality shows certainty ('this must be true'), while deontic modality shows obligation ('governments must act'). Careful choices reveal a writer's stance and level of commitment with nuance.", "question": "How does the choice of modal verb change a writer's stance?", "funfact": "Did you know? The same modal, like 'must', can express either certainty or obligation depending on context."}, "22": {"title": "Grammatical Metaphor", "terms": ["Grammatical metaphor", "Process", "Thing", "Congruent", "Abstraction", "Scientific writing", "Density", "Meaning"], "passage": "Grammatical metaphor expresses a process as a thing: 'the rapid expansion of cities' instead of 'cities expanded rapidly'. This abstraction increases density in scientific writing, but congruent forms are often clearer for general readers.", "question": "Rewrite 'Prices rose quickly, so people protested' as a nominalized sentence.", "funfact": "Did you know? The linguist M. A. K. Halliday developed the idea of 'grammatical metaphor'."}, "23": {"title": "Tense for Narrative Effect", "terms": ["Historic present", "Past perfect", "Flashback", "Immediacy", "Narrative", "Tense shift", "Suspense", "Storytelling"], "passage": "Storytellers use tense for effect. The historic present creates immediacy: 'So I walk in, and everyone turns around.' The past perfect signals a flashback, and a sudden tense shift can build suspense.", "question": "Why might a writer tell a past story in the present tense?", "funfact": "Did you know? Many jokes and informal stories are told in the historic present to sound more vivid."}, "24": {"title": "Grammar Across Genres", "terms": ["Genre", "Academic", "Journalistic", "Legal", "Conversational", "Conventions", "Passive", "Audience"], "passage": "Every genre has grammatical conventions. Academic writing favours the passive and nominalization; journalistic writing uses short, active sentences; legal texts use precise, complex clauses; conversational English uses ellipsis. Skilled writers adapt to their audience.", "question": "How would you change a text to move it from academic to conversational style?", "funfact": "Did you know? Legal English often avoids pronouns and repeats full names to prevent any ambiguity."}, "25": {"title": "Anticipatory It and Extraposition", "terms": ["Anticipatory it", "Extraposition", "It is clear that", "It is worth noting", "Heavy subject", "Late-placed clause", "Empty subject", "Information flow"], "passage": "Anticipatory it moves a long subject to the end. Instead of That the plan failed is obvious, we write It is obvious that the plan failed. Extraposition improves information flow and avoids heavy subjects. It is worth noting that results varied.", "question": "Rewrite 'That prices will rise is likely' using anticipatory it.", "funfact": "Did you know? The 'it' here has no meaning of its own; it only fills the subject position."}, "26": {"title": "Appositives and Parentheticals", "terms": ["Apposition", "Parenthetical", "Non-restrictive", "Dash", "Brackets", "Comma pair", "Interruption", "Elaboration"], "passage": "An appositive renames a noun beside it. Dr Lee, my former tutor, wrote the report. Parenthetical elements add comment, often between commas, dashes or brackets. These structures add information without a new clause, and they shape rhythm.", "question": "Add an appositive to this sentence: 'Phnom Penh is crowded.'", "funfact": "Did you know? Dashes make an interruption stronger than commas, and brackets make it quieter."}, "27": {"title": "Noun Phrase Modification", "terms": ["Premodifier", "Postmodifier", "Head noun", "Stacked adjectives", "Relative postmodifier", "Prepositional phrase", "Nominal density", "Compression"], "passage": "Noun phrases can be built by stacking modifiers before and after the head noun. A long-awaited, widely discussed reform of the national curriculum finally passed. Compression lets writers pack a clause into a phrase. Too many layers reduce clarity.", "question": "Expand 'a reform' into a noun phrase with two premodifiers and a postmodifier.", "funfact": "Did you know? Scientific writing relies on noun phrases more than on verbs."}, "28": {"title": "Sentential Relative Clauses", "terms": ["Which", "Comment clause", "Whole-clause reference", "Non-restrictive", "Evaluation", "Antecedent", "Comma", "Cohesion"], "passage": "A sentential which refers to a whole clause rather than to a noun. The company cut jobs, which angered the workers. Such clauses add evaluation and link ideas smoothly. They are always set off by a comma.", "question": "Add a sentential which-clause to: 'The experiment failed.'", "funfact": "Did you know? Some style guides prefer 'a fact that' instead of 'which' when the link is unclear."}, "29": {"title": "Absolute Constructions", "terms": ["Absolute clause", "Nominative absolute", "With + noun + participle", "Weather permitting", "All things considered", "Independent subject", "Non-finite", "Compact style"], "passage": "An absolute construction has its own subject and no finite verb. The meeting finished, we went home. Weather permitting, we will leave at dawn. With the lights off, the room was dark. They give background in compact form.", "question": "Write a sentence with an absolute construction beginning 'The work completed,…'.", "funfact": "Did you know? Phrases like 'all things considered' are fixed absolutes."}, "30": {"title": "Tense and Aspect in Discourse", "terms": ["Perfect aspect", "Progressive aspect", "Background", "Foreground", "Narrative tense", "Time reference", "Continuity", "Relevance"], "passage": "Tense and aspect organise a text. Past simple moves a story forward, while past continuous sets the scene. The present perfect links the past to now. Choice of aspect can show relevance, duration or completion.", "question": "Write two sentences: one that sets the scene and one that moves the story forward.", "funfact": "Did you know? Foreground events are usually in the simple past, background in the continuous."}, "31": {"title": "Negation and Scope", "terms": ["Not only", "Hardly", "Negative raising", "Scope", "Double negative", "Litotes", "Not unlike", "Implication"], "passage": "Negation can affect different parts of a sentence. I don't think he will come actually denies the coming. Not unlike means similar, a figure called litotes. Double negatives in standard English cancel each other. Scope decides what is negated.", "question": "Rewrite 'It is good' using litotes.", "funfact": "Did you know? Litotes, saying 'not bad' for 'good', is a common feature of understatement."}, "32": {"title": "Concession and Contrast in Argument", "terms": ["Granted", "Admittedly", "Notwithstanding", "Albeit", "Be that as it may", "Even so", "Concession", "Counterargument"], "passage": "Strong arguments acknowledge opposing points. Granted, the cost is high, but the benefits are greater. A solution, albeit imperfect, exists. Be that as it may, we must act. Concession builds credibility.", "question": "Write an argument sentence beginning 'Granted…'.", "funfact": "Did you know? 'Albeit' is followed by an adjective or phrase, not by a full clause."}, "33": {"title": "Echo and Tag Questions in Dialogue", "terms": ["Echo question", "Tag question", "Rising tone", "Checking", "Confirmation", "Surprise", "Attitude", "Intonation"], "passage": "Echo questions repeat words to show surprise: 'He resigned.' 'He resigned?' Tag questions seek agreement or give an attitude. Intonation changes meaning, a rising tag asks a question and a falling tag expects agreement.", "question": "Write a short dialogue with an echo question and a tag question.", "funfact": "Did you know? A tag with 'isn't it' can sound sarcastic when the tone falls sharply."}, "34": {"title": "Lexical Bundles and Collocational Grammar", "terms": ["Lexical bundle", "Collocation", "As a result of", "On the basis of", "In the case of", "Fixed frame", "Phraseology", "Fluency"], "passage": "Fluent writers use recurring multi-word units. On the basis of this evidence, we conclude… In the case of Cambodia, the effect was small. These bundles carry grammatical frames and help readers predict structure.", "question": "Write a sentence using 'on the basis of' or 'in the case of'.", "funfact": "Did you know? Corpus studies show that a large share of academic text consists of recurring bundles."}, "35": {"title": "Epistemic Stance Markers", "terms": ["Epistemic", "Certainty", "Likelihood", "Evidential", "Reportedly", "Apparently", "It seems", "Commitment"], "passage": "Epistemic markers show how sure a writer is. Apparently, the results were wrong. Reportedly, the minister resigned. It seems that the trend is changing. Writers choose among them to calibrate commitment.", "question": "Rewrite 'The policy failed' with an epistemic marker that shows low certainty.", "funfact": "Did you know? Evidentials like 'reportedly' show the source of knowledge, not only the certainty."}, "36": {"title": "Punctuation as Grammar", "terms": ["Colon", "Semicolon", "Dash", "Comma splice", "Restrictive", "Non-restrictive", "Parentheses", "Run-on"], "passage": "Punctuation signals grammar. A semicolon joins related independent clauses; a colon introduces an explanation. A comma splice joins two sentences incorrectly. Commas around a clause show that it is non-restrictive.", "question": "Join these ideas with a semicolon: 'It was late. We left.'", "funfact": "Did you know? A comma splice is one of the most common errors in advanced writing."}, "37": {"title": "Varieties of English", "terms": ["British English", "American English", "Global Englishes", "Regional variation", "Standard", "Dialect", "Spelling variation", "Mutual intelligibility"], "passage": "English grammar varies by region. British speakers say I've got, Americans say I have gotten. Collective nouns take plural verbs in British English more often. Global Englishes show new grammar patterns that remain mutually intelligible.", "question": "Name two grammar differences between British and American English.", "funfact": "Did you know? 'Do you have…?' is more typical in American English, 'Have you got…?' in British English."}, "38": {"title": "Editing for Grammatical Precision", "terms": ["Proofreading", "Revise", "Redundancy", "Dangling modifier", "Agreement", "Parallelism", "Concision", "Clarity"], "passage": "Editing improves precision. Check subject-verb agreement, fix dangling modifiers, and remove redundancy. Walking home, the rain started is a dangling modifier. Read your text aloud and revise for concision and clarity.", "question": "Correct this sentence: 'Walking home, the rain started.'", "funfact": "Did you know? Reading aloud helps writers hear errors that their eyes miss."}, "39": {"title": "Review: Mastering English Grammar", "terms": ["Accuracy", "Range", "Flexibility", "Style", "Register", "Precision", "Cohesion", "Mastery"], "passage": "At C2, grammar mastery means accuracy, range and flexibility. Writers choose structures for style and register, achieve precision and cohesion, and know when a simple sentence is the most powerful choice.", "question": "What does 'mastery' of grammar mean to you?", "funfact": "Did you know? Even at the highest level, many great writers deliberately choose short, simple sentences for impact."}}};

        const MIN_WORDS = {"A1": 3, "A2": 4, "B1": 6, "B2": 7, "C1": 8, "C2": 8};
        const minWords = () => MIN_WORDS[state.level] || 3;
        function allTermsForLevel(level) {
            let words = [];
            Object.keys(curriculum[level]).forEach(u => words.push(...curriculum[level][u].terms));
            return [...new Set(words)];

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_grammar_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;
            } else {
                state.unit = parseInt(sel.value);
            }
        }

            state.level = lvl;

                b.classList.remove('bg-slate-700', 'text-white', 'shadow');

            if (btn) { btn.classList.remove('bg-gray-100'); btn.classList.add('bg-slate-700', 'text-white', 'shadow'); }
            document.getElementById('current-level-display').textContent = lvl;
            loadProgress();
            populateUnitSelect();
            renderContent();

        // On phones the lesson sits below the module list, so after choosing a module, a unit
        // or the next lesson, the page scrolls to the lesson by itself.
        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }
        function jumpToModules() {
            const side = document.getElementById('module-sidebar');
            side.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => { if (Math.abs(side.getBoundingClientRect().top) > 40) side.scrollIntoView({ block: 'start' }); }, 700);
        }

        // "Finish Activity" rewards each module of each unit once, plus one badge per unit
        function completeActivity() {
            markActivityComplete(state.tab);
            const gotStars = award(unitKey('finish-' + state.tab), 5);
            let gotBadge = false;
            const badgeKey = state.level + '|' + unitKey('badge');
            if (gotStars && !progress.awarded[badgeKey]) {
                progress.awarded[badgeKey] = true;
                state.badges += 1;
                document.getElementById('badge-count').textContent = state.badges;
                saveProgress();
                gotBadge = true;
            }
            if (gotBadge) alert(`🎉 Great work! You finished this activity, earned 5 Stars ⭐ and unlocked the Unit ${state.unit} Badge! 🏆`);
            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');
            else alert('✅ You already finished this activity. Try another module, or go to the next lesson! ▶️');
        }

        function nextLesson() {
            const levelData = curriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);
            const idx = unitNumbers.indexOf(state.unit);
            const nextIdx = (idx === -1 ? 0 : idx + 1) % unitNumbers.length;
            state.unit = unitNumbers[nextIdx];
            document.getElementById('unit-select').value = state.unit;
            renderContent();
            scrollToLesson(true);

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }
        // The Video button shows 🆕 when this unit's video is new, and "(soon)" when there is none yet
        function updateVideoTabBadge() {
            const btn = document.querySelector('.tab-btn[data-tab="video"]');
            if (!btn) return;
            const v = videoFor(state.level, state.unit);
            btn.textContent = (v && isRecentlyAdded(v.dateAdded) ? '🆕 ' : '') + '📹 0. Video Lesson' + (v ? '' : ' (soon)');
        }

        let ytPlayer = null;
        let ytPollInterval = null;
        let ytAnsweredCheckpoints = new Set();
        let ytApiLoadPromise = null;
        let ytFallbackTimer = null;
        let ytCurrentConfig = null;

        // Stops the video and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

        function renderVideoLesson(contentDiv) {
            stopVideo();
            ytAnsweredCheckpoints = new Set();
            const unitData = curriculum[state.level][state.unit];
            ytCurrentConfig = videoFor(state.level, state.unit);

            if (!ytCurrentConfig) {
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                    <div class="bg-indigo-50 border-2 border-dashed border-indigo-200 rounded-2xl p-10 text-center">
                        <div class="text-5xl mb-4">🎬</div>
                        <p class="text-xl font-bold text-indigo-900 mb-2">Video Coming Soon!</p>
                        <p class="text-gray-600 mb-4">Your teacher is preparing this unit's video. For now, try the other learning modules!</p>
                        <button onclick="switchTab('listening')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Start with Listening</button>
                    </div>`;
                return;
            }

            if (ytCurrentConfig.mp4) { renderMp4Lesson(contentDiv, unitData); return; }
            const watchUrl = 'https://www.youtube.com/watch?v=' + ytCurrentConfig.id;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch the video, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <div id="yt-player-el" class="w-full h-full"></div>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">Loading video player…</p>
                <p class="text-center mt-1"><a href="${watchUrl}" target="_blank" rel="noopener" class="text-sm text-indigo-600 underline">If the video does not play here, tap to open it in YouTube ↗</a></p>`;

            const showFallback = (why) => {
                const msg = document.getElementById('video-msg');
                if (msg) msg.innerHTML = `⚠️ ${why} <a href="${watchUrl}" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">Open the video in YouTube ↗</a>`;
            };
            ytFallbackTimer = setTimeout(() => { if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') showFallback('The video is taking long to load.'); }, 10000);

            const wanted = ytCurrentConfig.id;
            loadYouTubeApi().then(() => {
                if (!ytCurrentConfig || ytCurrentConfig.id !== wanted || !document.getElementById('yt-player-el')) return;
                ytPlayer = new YT.Player('yt-player-el', {
                    videoId: wanted,
                    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
                    events: {
                        onReady: () => { if (ytFallbackTimer) clearTimeout(ytFallbackTimer); const m = document.getElementById('video-msg'); if (m) m.textContent = '▶️ Press play to start the lesson!'; },
                        onStateChange: onYtStateChange,
                        onError: () => showFallback('This video cannot play inside the lesson.')
                    }
                });
            }).catch(() => showFallback('The video player could not load.'));
        }

y: They are."], [132.03, 132.85, "They are."], [133.63, 137.2, "Part two: dialogue. Let's listen to a conversation."], [138.05, 143.01, "Visal, how do we say who we are? We say 'I am Visal.' Why do we use 'am'?"], [144.12, 153.75, "Because the verb be changes with the subject. We use am with I, is with he, she and it, and are with you, we and they."], [154.85, 156.69, "Can you give me more examples?"], [157.78, 168.25, "Yes! He is a teacher. She is happy. They are students. You are my friend. When we speak, we often say I'm, he's and they're."], [169.35, 171.58, "What about questions and negatives?"], [172.68, 181.07, "For a question, put the verb first: Are you ready? For a negative, add not: I am not tired. She is not at home."], [182.23, 184.13, "Part three: grammar."], [184.98, 187.89, "Grammar focus: To be: am and is and are."], [188.19, 189.44, "Look at the pattern."], [190.15, 191.42, "I am a student."], [192.32, 193.61, "She is happy today."], [194.52, 195.88, "They are at school."], [196.83, 203.39, "Use am with I, is with he, she and it, and are with you, we and they. In questions, put the verb first."], [204.15, 207.35, "Be careful! Don't say: I is a student."], [209.3, 211.22, "Say: I am a student."], [211.52, 212.9, "Use am with I."], [213.7, 216.39, "Part four: reading. Read and listen."], [217.2, 218.13, "Who Is Who?."], [218.43, 221.67, "I am a student at C2 E P E Digital Academy."], [222.67, 225.27, "My teacher is kind, and she is very funny."], [226.27, 228.34, "My friends are in the same class."], [229.33, 231.7, "You are my friend too, and we are a good team."], [232.7, 235.25, "He is my brother, and they are my parents."], [236.33, 240.57, "Part five: quiz. Five questions. Are you ready?"], [241.42, 242.94, "I blank ten years old."], [243.24, 246.25, "A, am. B, is. C, are."], [249.8, 251.44, "The answer is A: am."], [252.58, 254.19, "She blank my teacher."], [254.49, 257.33, "A, are. B, am. C, is."], [260.87, 262.73, "The answer is C: is."], [26 "], [54.02, 55.92, "Usually means most of the time."], [56.52, 58.25, "We usually eat at six."], [58.85, 61.35, "Your turn. Say: Usually."], [64.2, 65.17, "Usually."], [65.92, 66.64, "Play."], [67.65, 69.65, "Play means to do something for fun."], [70.25, 71.56, "They play football."], [72.15, 74.36, "Your turn. Say: Play."], [77.2, 77.9, "Play."], [78.65, 79.43, "Work."], [80.42, 82.94, "Work means to do a job or a task."], [83.55, 85.28, "My father works in a shop."], [85.88, 87.89, "Your turn. Say: Work."], [90.73, 91.46, "Work."], [92.22, 93.1, "Study."], [94.12, 96.92, "Study means to learn something from books or lessons."], [97.52, 98.84, "I study English."], [99.45, 102.16, "Your turn. Say: Study."], [105.0, 105.87, "Study."], [106.62, 107.34, "Sleep."], [108.35, 111.19, "Sleep means to rest with your eyes closed at night."], [111.78, 113.4, "Babies sleep a lot."], [113.98, 116.91, "Your turn. Say: Sleep."], [119.77, 120.73, "Sleep."], [121.48, 122.24, "Habit."], [123.25, 125.61, "Habit means something you do again and again."], [126.22, 127.68, "Reading is a good habit."], [128.28, 130.53, "Your turn. Say: Habit."], [133.37, 134.11, "Habit."], [134.9, 138.95, "Part two: dialogue. Let's listen to a conversation."], [139.78, 143.05, "Visal, what do you do every day? Tell me one thing."], [144.15, 149.81, "I study English every day. I play football after school, and I sleep at ten o'clock."], [150.92, 154.03, "Good! What is the grammar in those sentences?"], [155.15, 161.59, "It is the present simple. We use it for habits and routines. I play, you play, we play, they play."], [162.68, 163.96, "And with he or she?"], [165.05, 174.4, "We add s: she plays, he works, it sleeps. After study we change y to ies: she studies. This is the most important rule."], [175.57, 176.8, "Part three: grammar."], [177.65, 181.53, "Grammar focus: Present simple: verb (+ s)."], [181.83, 183.11, "Look at the pattern."], [183.82, 185.63, "I play football every day."], [186.52, 187.83, "She works in the morning."], [188.72, 190.5, "They always study before dinner."], [191.43, 199.43, "Use the present simple for habits and routines. Add s with he, she and it. Time words like every day, always and usually go with it."], [200.18, 203.62, "Be careful! Don't say: She play football every day."], [205.57, 208.4, "Say: She plays football every day."], [208.7, 210.33, "Add s with he, she and it."], [211.13, 213.72, "Part four: reading. Read and listen."], [214.5, 216.07, "My Daily Habits."], [216.37, 218.62, "Every day, I wake up at six o'clock."], [219.63, 221.76, "I usually eat rice for breakfast."], [222.77, 226.16, "My mother works in a hospital, and my father works in a shop."], [227.17, 229.47, "We always study together after school."], [230.47, 233.62, "At ten o'clock, I sleep, because sleep is a good habit."], [234.7, 238.61, "Part five: quiz. Five questions. Are you ready?"], [239.45, 241.36, "She blank English every day."], [241.66, 245.21, "A, study. B, studies. C, studying."], [248.77, 250.74, "The answer is B: studies."], [251.88, 253.72, "They blank football on Sunday."], [254.02, 257.78, "A, plays. B, play. C, playing."], [261.33, 263.12, "The answer is B: play."], [264.28, 265.91, "'Every day' means blank."], [266.21, 270.02, "A, each day. B, never. C, one time."], [273.57, 275.74, "The answer is A: each day."], [276.88, 278.5, "Which sentence is correct?"], [278.8, 283.81, "A, He work in a bank.. B, He works in a bank.. C, He working in a bank.."], [287.37, 290.19, "The answer is B: He works in a bank.."], [291.35, 294.44, "According to the reading, what do they always do after school?"], [294.74, 298.72, "A, sleep. B, study together. C, play football."], [302.27, 304.43, "The answer is B: study together."], [305.63, 309.05, "Part six: speaking. It's your turn to talk."], [309.92, 312.15, "What is one thing you always do every day?"], [320.95, 322.42, "Now listen to Visal."], [322.71, 337.45, "I always brush my teeth every day. I do it i
