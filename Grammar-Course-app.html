w you can use eight new words and be going to plus base verb."], [348.46, 353.48, "Today's value is planning ahead. Make a plan and take small steps every day."], [353.78, 356.31, "See you in Unit thirty-four. Goodbye!"], [356.61, 360.0, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit34-Want-Need-and-Would-Like": [[0.35, 5.46, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.75, 9.07, "Hi! I'm Visal. Let's learn together!"], [9.37, 15.12, "Unit thirty-four: Want, Need and Would Like. Today you will ask for things and make offers politely."], [15.42, 18.0, "Here is our lesson map. Let's start!"], [18.93, 22.25, "Part one: words. You will learn eight new words."], [23.08, 23.83, "Want."], [24.82, 26.98, "Want means to wish to have or do something."], [27.58, 28.76, "I want a drink."], [29.35, 31.68, "Your turn. Say: Want."], [34.53, 35.44, "Want."], [36.18, 36.88, "Need."], [37.88, 40.05, "Need means to have to have something."], [40.65, 42.0, "I need some sleep."], [42.58, 45.22, "Your turn. Say: Need."], [48.07, 48.86, "Need."], [49.62, 50.48, "Would like."], [51.48, 53.82, "Would like means a polite way to say want."], [54.42, 55.85, "I would like some water."], [56.45, 59.02, "Your turn. Say: Would like."], [61.87, 62.87, "Would like."], [63.62, 64.63, "I'd like."], [65.62, 67.38, "I'd like means I would like."], [67.98, 69.26, "I'd like some tea."], [69.85, 72.2, "Your turn. Say: I'd like."], [75.07, 76.07, "I'd like."], [76.82, 77.59, "Please."], [78.58, 81.07, "Please means a polite word for requests."], [81.68, 82.74, "Water, please."], [83.35, 85.82, "Your turn. Say: Please."], [88.67, 89.47, "Please."], [90.22, 90.92, "Offer."], [91.92, 94.87, "Offer means something that you say you will give or do."], [95.48, 96.95, "Thank you for your offer."], [97.55, 100.16, "Your turn. Say: Offer."], [103.0, 103.85, "Offer."], [104.62, 105.57, "Request."], [106.58, 109.66, "Request means a polite way of asking for something."], [110.25, 111.99, "That is a polite request."], [112.58, 115.28, "Your turn. Say: Request."], [118.13, 119.22, "Request."], [119.95, 120.92, "Polite."], [121.92, 124.08, "Polite means showing good manners."], [124.68, 126.09, "He is very polite."], [126.68, 129.47, "Your turn. Say: Polite."], [132.33, 133.18, "Polite."], [134.0, 137.92, "Part two: dialogue. Let's listen to a conversation."], [138.78, 142.18, "Visal, what do you want to drink? Be polite!"], [143.28, 152.73, "I would like some water, please. Would like is more polite than want. In a shop or a restaurant, we say I'd like… It sounds kind and respectful."], [153.82, 154.99, "What about need?"], [156.08, 168.52, "Need means we must have something. I need some water. You need to rest. After need and want, we can use a noun or to + verb: I want a drink. I want to drink."], [169.62, 171.08, "How do we make an offer?"], [172.18, 181.11, "Would you like some tea? Yes, please. No, thank you. We use would you like for a polite offer, and we always answer with please or thank you."], [182.27, 183.65, "Part three: grammar."], [184.52, 187.6, "Grammar focus: Want and need and would like."], [187.9, 189.26, "Look at the pattern."], [189.95, 191.08, "I want a drink."], [191.98, 193.31, "You need to rest."], [194.22, 196.25, "I would like some water, please."], [197.2, 204.87, "Use want and need with a noun or to + verb. Would like is more polite than want. Make an offer with Would you like…? Answer with please or thank you."], [205.62, 208.9, "Be careful! Don't say: I want a drink, give me."], [210.83, 212.91, "Say: I'd like a drink, please."], [213.21, 214.94, "Use would like to be polite."], [215.73, 218.12, "Part four: reading. Read and listen."], [218.93, 220.1, "In a Café."], [220.4, 222.88, "Good morning. I'd like some tea, please."], [223.87, 226.55, "Would you like some sugar? No, thank you."], [227.57, 229.78, "I need a glass of water because I am hot."], [230.77, 232.6, "My friend wants to eat noodles."], [233.6, 2 bs?"], [150.88, 163.68, "Add -ly to an adjective: slow, slowly; careful, carefully; quiet, quietly. If the adjective ends in y, change it to i: happy, happily."], [164.78, 166.96, "Are there any irregular adverbs?"], [168.05, 180.44, "Yes! Good becomes well: She sings well. Fast and hard keep the same form: He runs fast. She works hard. Adverbs usually come after the verb or the object."], [181.6, 183.02, "Part three: grammar."], [183.88, 187.72, "Grammar focus: Adverbs of manner: verb plus adverb."], [188.02, 189.28, "Look at the pattern."], [189.98, 191.29, "She runs quickly."], [192.18, 193.85, "He speaks English well."], [194.75, 196.35, "Please speak quietly."], [197.3, 205.98, "Add -ly to an adjective to make an adverb of manner. Good becomes well; fast and hard stay the same. The adverb usually comes after the verb."], [206.72, 210.38, "Be careful! Don't say: He drives careful."], [212.33, 214.28, "Say: He drives carefully."], [214.57, 216.85, "Use the adverb carefully after a verb."], [217.67, 220.16, "Part four: reading. Read and listen."], [220.97, 222.09, "How Do You Do It?."], [222.4, 225.57, "My sister runs quickly, but my brother walks slowly."], [226.57, 228.66, "Please carry the glass carefully."], [229.67, 232.55, "He speaks English well, and she sings beautifully."], [233.53, 235.59, "In the library, we speak quietly."], [236.6, 238.8, "At the stadium, people shout loudly."], [239.9, 243.79, "Part five: quiz. Five questions. Are you ready?"], [244.65, 246.72, "She sings blank. (good)"], [247.02, 249.91, "A, good. B, well. C, goodly."], [253.47, 255.03, "The answer is B: well."], [256.18, 258.33, "He walks blank because he is tired."], [258.63, 262.07, "A, slow. B, slowly. C, slowy."], [265.6, 267.6, "The answer is B: slowly."], [268.75, 270.76, "Please speak blank in the library."], [271.06, 274.45, "A, quietly. B, quiet. C, loud."], [278.0, 279.85, "The answer is A: quietly."], [280.98, 282.94, "Which sentence is correct?"], [283.24, 288.98, "A, He drives carefully.. B, He drives careful.. C, He carefully drives a car in.."], [292.53, 295.4, "The answer is A: He drives carefully.."], [296.55, 299.13, "According to the reading, who walks slowly?"], [299.43, 303.75, "A, my brother. B, my sister. C, my mother."], [307.3, 309.37, "The answer is A: my brother."], [310.57, 313.61, "Part six: speaking. It's your turn to talk."], [314.45, 317.05, "Write one sentence about how you walk or speak."], [325.85, 327.36, "Now listen to Visal."], [327.66, 340.53, "I walk quickly to school because the road is short, and I speak quietly in the library. I use quickly and quietly because they are adverbs of manner. They tell my teacher how I do things."], [340.83, 342.57, "Excellent answer, Visal!"], [343.45, 348.85, "Great work! Now you can use eight new words and adverbs of manner: verb plus adverb."], [349.15, 353.69, "Today's value is self-awareness. Know your strengths and keep growing."], [353.99, 357.02, "See you in Unit thirty-six. Goodbye!"], [357.32, 360.44, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit36-Prepositions-of-Movement": [[0.35, 5.46, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.75, 9.01, "Hi! I'm Visal. Let's learn together!"], [9.31, 16.67, "Unit thirty-six: Prepositions of Movement. Today you will describe how people and things move from place to place."], [16.97, 19.59, "Here is our lesson map. Let's start!"], [20.53, 23.64, "Part one: words. You will learn eight new words."], [24.48, 25.37, "To."], [26.38, 27.94, "To means toward a place."], [28.55, 29.78, "I go to school."], [30.38, 32.52, "Your turn. Say: To."], [35.37, 36.17, "To."], [36.92, 37.57, "From."], [38.58, 40.55, "From means starting at a place."], [41.15, 42.59, "She comes from Siem Reap."], [43.18, 45.7, "Your turn. Say: From."], [48.53, 49.24, "From."], [49.98, 50.83, "Into."], [51.85, 53.8, "Into means moving inside."], [54.42, 55.91, "He walked into the room."], [56.52, 58.84, "Your turn. Say:  the room."], [192.02, 193.59, "We walk across the bridge."], [194.53, 201.33, "Use to, from, into, out of, across, through, up and down with movement verbs. In shows a place, but into shows movement."], [202.08, 204.91, "Be careful! Don't say: He walked in the room."], [206.87, 208.82, "Say: He walked into the room."], [209.12, 211.12, "Use into for movement inside."], [211.93, 214.38, "Part four: reading. Read and listen."], [215.17, 216.26, "My Journey."], [216.56, 219.15, "I walk from my house to school every morning."], [220.17, 223.27, "First I go across the bridge, and then I walk through the park."], [224.27, 226.75, "I go up the stairs and into my classroom."], [227.77, 230.49, "After school I walk out of the gate and down the road."], [231.5, 233.69, "The way to my school is short and safe."], [234.8, 239.16, "Part five: quiz. Five questions. Are you ready?"], [240.02, 242.96, "She walked blank the room. (movement inside)"], [243.26, 246.51, "A, in. B, into. C, at."], [250.07, 252.06, "The answer is B: into."], [253.22, 256.4, "We walk blank the bridge. (one side to the other)"], [256.7, 259.87, "A, across. B, up. C, from."], [263.43, 265.64, "The answer is A: across."], [266.78, 269.99, "He ran blank the house. (inside to outside)"], [270.29, 273.68, "A, into. B, out of. C, through."], [277.23, 279.26, "The answer is B: out of."], [280.42, 282.0, "Which sentence is correct?"], [282.3, 289.42, "A, He goes in the school every day.. B, He goes to school every day.. C, He goes at school every day.."], [292.97, 296.03, "The answer is B: He goes to school every day.."], [297.18, 300.3, "According to the reading, where does the writer walk through?"], [300.6, 304.27, "A, the park. B, the bridge. C, the stairs."], [307.83, 309.38, "The answer is A: the park."], [310.57, 313.54, "Part six: speaking. It's your turn to talk."], [314.38, 317.66, "Describe your journey to school using two prepositions of movement."], [326.45, 328.0, "Now listen to Visal."], [328.3, 34 ine."], [97.42, 98.34, "Yours."], [99.35, 101.0, "Yours means belonging to you."], [101.62, 102.92, "Is this book yours?"], [103.52, 106.19, "Your turn. Say: Yours."], [109.03, 110.15, "Yours."], [110.92, 111.72, "Owner."], [112.72, 114.88, "Owner means the person who has something."], [115.48, 117.15, "Who is the owner of this bag?"], [117.75, 119.88, "Your turn. Say: Owner."], [122.73, 123.44, "Owner."], [124.18, 125.27, "Belongs to."], [126.25, 128.22, "Belongs to means is owned by."], [128.82, 130.56, "This pen belongs to Ana."], [131.15, 133.83, "Your turn. Say: Belongs to."], [136.67, 137.89, "Belongs to."], [138.7, 142.41, "Part two: dialogue. Let's listen to a conversation."], [143.25, 146.05, "Visal, I found a pen. Whose pen is it?"], [147.15, 157.92, "It is Tom's pen. We use 's after a name to show ownership: Tom's pen, the teacher's book, my sister's bag. Whose asks about the owner."], [159.02, 160.62, "What about plural owners?"], [161.72, 174.48, "If the noun already ends in s, we add only an apostrophe: the students' books. For irregular plurals we add 's: the children's toys. Be careful with the apostrophe."], [175.58, 177.24, "How do we answer without the noun?"], [178.35, 190.83, "We use mine, yours, his, hers, ours, theirs: Whose bag is this? It's mine. This pen belongs to me. They replace possessive word plus noun."], [191.97, 193.33, "Part three: grammar."], [194.18, 197.69, "Grammar focus: Whose and possessive 's and mine, yours."], [197.99, 199.17, "Look at the pattern."], [199.88, 201.63, "Tom's pen is on the desk."], [202.52, 204.05, "Whose bag is this?"], [204.95, 207.1, "The bag is mine (it belongs to me)."], [208.07, 218.77, "Add 's to a singular owner: Tom's pen. Add only an apostrophe to plural nouns ending in s: the students' books. Whose asks about the owner; mine and yours answer."], [219.52, 223.27, "Be careful! Don't say: The students book is here."], [225.23, 227.93, "Say: The students' book is here."], [228.23, 230.6, "Add an apos         // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });

            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');

                if (ytPollInterval) clearInterval(ytPollInterval);

                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }

                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
