n I call your name."], [234.1, 236.17, "Stop writing when the time is over."], [237.17, 239.83, "Good instructions are clear, short and polite."], [240.93, 244.66, "Part five: quiz. Five questions. Are you ready?"], [245.52, 247.09, "blank your books, please."], [247.39, 250.69, "A, Open. B, Opens. C, You open."], [254.23, 256.28, "The answer is A: Open."], [257.42, 259.13, "blank run in the classroom."], [259.43, 262.37, "A, Don't. B, Doesn't. C, Not."], [265.93, 267.49, "The answer is A: Don't."], [268.65, 270.48, "Which sentence is a command?"], [270.77, 276.22, "A, She sits down.. B, Sit down, please.. C, I am sitting.."], [279.77, 282.71, "The answer is B: Sit down, please.."], [283.85, 286.34, "The word that makes a command polite is blank."], [286.64, 289.7, "A, please. B, stop. C, now."], [293.23, 295.12, "The answer is A: please."], [296.28, 299.62, "According to the reading, what should you do when the time is over?"], [299.92, 304.38, "A, stop writing. B, go home. C, talk loudly."], [307.93, 310.49, "The answer is A: stop writing."], [311.7, 314.85, "Part six: speaking. It's your turn to talk."], [315.72, 319.19, "Write three classroom instructions using the imperative form."], [327.98, 329.55, "Now listen to Visal."], [329.85, 343.39, "Open your book. Listen to the teacher. Don't talk loudly. These are classroom instructions. I use the base verb at the start. For a polite command I add please, and for a warning I use don't."], [343.69, 345.4, "Excellent answer, Visal!"], [346.32, 352.83, "Great work! Now you can use eight new words and imperatives: base verb and don't plus base verb."], [353.13, 356.62, "Today's value is respect. Thank the people who help us."], [356.92, 359.75, "See you in Unit nineteen. Goodbye!"], [360.05, 363.2, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit19-Basic-Conjunctions-and-but-or": [[0.35, 5.32, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.62, 8.61, "Hi! I'm Visal. Let's learn together!"], [8.91, 14.73, "Unit nineteen: Basic Conjunctions (and/but/or). Today you will join ideas with and, but and or."], [15.03, 17.7, "Here is our lesson map. Let's start!"], [18.67, 21.64, "Part one: words. You will learn eight new words."], [22.48, 23.18, "And."], [24.18, 26.64, "And means a word that adds one idea to another."], [27.25, 29.04, "I like tea and coffee."], [29.65, 31.64, "Your turn. Say: And."], [34.5, 35.27, "And."], [36.02, 36.62, "But."], [37.62, 40.13, "But means a word that shows a different idea."], [40.72, 42.65, "I am tired, but I am happy."], [43.25, 45.34, "Your turn. Say: But."], [48.2, 48.9, "But."], [49.65, 50.5, "Or."], [51.52, 53.71, "Or means a word that gives a choice."], [54.32, 55.9, "Do you want tea or coffee?"], [56.48, 59.58, "Your turn. Say: Or."], [62.43, 63.04, "Or."], [63.78, 64.6, "Connect."], [65.58, 68.12, "Connect means to join two things together."], [68.72, 70.59, "Connect the two sentences."], [71.18, 73.44, "Your turn. Say: Connect."], [76.3, 77.2, "Connect."], [77.95, 78.78, "Join."], [79.78, 81.97, "Join means to put things together."], [82.58, 84.07, "Join the two ideas."], [84.68, 87.1, "Your turn. Say: Join."], [89.97, 90.77, "Join."], [91.52, 92.33, "Choice."], [93.32, 95.9, "Choice means the act of choosing between things."], [96.48, 97.73, "You have a choice."], [98.32, 100.83, "Your turn. Say: Choice."], [103.67, 104.61, "Choice."], [105.35, 106.4, "Contrast."], [107.38, 110.6, "Contrast means a clear difference between two things."], [111.22, 113.63, "There is a contrast between hot and cold."], [114.25, 117.17, "Your turn. Say: Contrast."], [120.03, 121.06, "Contrast."], [121.82, 122.77, "Addition."], [123.78, 125.96, "Addition means something that is added."], [126.55, 127.95, "And shows addition."], [128.55, 130.94, "Your turn. Say: Addition."], [133.8, 134.72, "Addition."], [135.53, 139.06, "Part two: dialogue. Let's listen to a conversation."], [139.92, 143.12, "Visal, how can we join 'I like tea' and 'I like coffee'?"], [144.22, 155.0, "We use and: I like tea and coffee. And adds one idea to another. We can also join two sentences: I play football and my sister dances."], [156.08, 157.2, "What about 'but'?"], [158.32, 168.46, "But shows a contrast. I like tea, but I don't like coffee. It is small, but it is strong. Use a comma before but when it joins two sentences."], [169.55, 170.42, "And 'or'?"], [171.52, 182.04, "Or gives a choice: Do you want tea or coffee? We can go by bus or by bike. We use and, but and or very often, so they are important words."], [183.2, 184.74, "Part three: grammar."], [185.58, 189.16, "Grammar focus: Conjunctions: and and but and or."], [189.46, 190.69, "Look at the pattern."], [191.38, 193.37, "I like tea and I like coffee."], [194.28, 196.28, "I am tired, but I am happy."], [197.18, 198.71, "Do you want tea or coffee?"], [199.67, 206.71, "Use and to add, but to show a contrast and or to give a choice. Put a comma before but when it joins two sentences."], [207.45, 210.76, "Be careful! Don't say: I am tired, or I am happy."], [212.7, 215.5, "Say: I am tired, but I am happy."], [215.8, 217.5, "Use but for a contrast."], [218.3, 220.79, "Part four: reading. Read and listen."], [221.6, 223.04, "Joining Ideas."], [223.34, 225.23, "I like rice and fish for lunch."], [226.23, 228.59, "I am tired, but I want to study."], [229.6, 231.69, "Do you want to walk or ride a bike?"], [232.7, 235.6, "We use and for addition and but for contrast."], [236.6, 239.34, "Or is for a choice, and it helps us decide."], [240.43, 244.39, "Part five: quiz. Five questions. Are you ready?"], [245.25, 247.39, "I like tea blank I don't like coffee."], [247.69, 250.52, "A, and. B, but. C, or."], [254.07, 255.64, "The answer is B: but."], [256.78, 258.67, "Do you want rice blank noodles?"], [258.97, 261.88, "A, and. B, but. C, or."], [265.43, 266.93, "The answer is C: or."], [268.08, 269.75, "She is smart blank kind."], [270.05, 272.88, "A, and. B, but. C, or."], 0.13, "Look at the pattern."], [190.82, 191.94, "I have a brother."], [192.85, 194.26, "She has a pet cat."], [195.15, 196.62, "He doesn't have a bike."], [197.57, 204.55, "Use have with I, you, we and they, and has with he, she and it. In questions and negatives with do or does, use have."], [205.28, 208.17, "Be careful! Don't say: She have a pet."], [210.13, 211.8, "Say: She has a pet."], [212.1, 213.94, "Use has with he, she and it."], [214.73, 217.42, "Part four: reading. Read and listen."], [218.23, 219.87, "My Family and Things."], [220.17, 222.28, "I have one brother and two sisters."], [223.27, 226.16, "My brother has a bike, but my sister doesn't have a bike."], [227.17, 229.94, "We have a pet cat, and it has a long tail."], [230.93, 232.33, "Do you have a pet at home?"], [233.33, 236.33, "Some people don't have pets, but they love animals."], [237.43, 241.45, "Part five: quiz. Five questions. Are you ready?"], [242.28, 243.75, "She blank a new bike."], [244.05, 247.24, "A, have. B, has. C, haves."], [250.8, 252.65, "The answer is B: has."], [253.78, 255.37, "They blank two cats."], [255.66, 258.75, "A, has. B, have. C, having."], [262.3, 264.15, "The answer is B: have."], [265.28, 266.85, "He doesn't blank a car."], [267.15, 270.14, "A, has. B, have. C, had."], [273.7, 275.76, "The answer is B: have."], [276.92, 278.6, "Which sentence is correct?"], [278.9, 283.08, "A, I has a pen.. B, I have a pen.. C, I haves a pen.."], [286.63, 288.88, "The answer is B: I have a pen.."], [290.02, 292.23, "According to the reading, who has a bike?"], [292.52, 296.0, "A, my brother. B, my sister. C, my cat."], [299.57, 301.82, "The answer is A: my brother."], [303.03, 306.14, "Part six: speaking. It's your turn to talk."], [306.98, 308.9, "What do you have in your school bag?"], [317.72, 319.17, "Now listen to Visal."], [319.47, 333.9, "I have a notebook, two pens and a water bottle in my school bag. I don't have a laptop. My friend has a ruler and a small calculator. I use have with I and has with he or she."], [334.2, 336.05, "Excellent answer, Visal!"], [336.95, 341.09, "Great work! Now you can use eight new words and have and has."], [341.39, 345.57, "Today's value is responsibility. Help at home and do your jobs."], [345.87, 348.76, "See you in Unit twenty-one. Goodbye!"], [349.06, 351.4, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit21-Likes-and-Dislikes-like-ing": [[0.35, 5.51, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.81, 9.12, "Hi! I'm Visal. Let's learn together!"], [9.42, 15.83, "Unit twenty-one: Likes and Dislikes (like + -ing). Today you will talk about what you like and dislike doing."], [16.13, 18.61, "Here is our lesson map. Let's start!"], [19.57, 22.6, "Part one: words. You will learn eight new words."], [23.45, 24.36, "Like."], [25.35, 27.16, "Like means to enjoy something."], [27.75, 28.9, "I like music."], [29.52, 31.55, "Your turn. Say: Like."], [34.4, 35.15, "Like."], [35.88, 36.71, "Love."], [37.72, 40.12, "Love means to like something very much."], [40.72, 42.02, "I love dancing."], [42.62, 45.01, "Your turn. Say: Love."], [47.87, 48.64, "Love."], [49.38, 50.06, "Hate."], [51.05, 53.51, "Hate means to dislike something very much."], [54.12, 55.33, "I hate waiting."], [55.92, 57.95, "Your turn. Say: Hate."], [60.8, 61.6, "Hate."], [62.35, 63.37, "Don't like."], [64.38, 66.58, "Don't like means not to enjoy something."], [67.18, 68.77, "I don't like spiders."], [69.35, 71.81, "Your turn. Say: Don't like."], [74.67, 75.7, "Don't like."], [76.45, 77.37, "Swimming."], [78.38, 80.81, "Swimming means moving through water for fun."], [81.42, 82.64, "Swimming is fun."], [83.25, 85.65, "Your turn. Say: Swimming."], [88.5, 89.4, "Swimming."], [90.15, 90.97, "Reading."], [91.95, 94.59, "Reading means looking at words and understanding them."], [95.18, 96.71, "Reading is relaxing."], [97.32, 99.77, "Your turn. Say: Reading."], [102.63, 103.45, "Reading."], [104.18, 105.0, "Dancing."], [105.98, 107.94, "Dancing means moving to music."], [108.55, 110.12, "Dancing makes me happy."], [110.72, 112.94, "Your turn. Say: Dancing."], [115.8, 116.62, "Dancing."], [117.35, 118.15, "Playing."], [119.15, 121.29, "Playing means doing something for fun."], [121.88, 123.51, "Playing football is fun."], [124.12, 126.44, "Your turn. Say: Playing."], [129.3, 130.03, "Playing."], [130.83, 134.72, "Part two: dialogue. Let's listen to a conversation."], [135.55, 138.32, "Visal, what do you like doing at the weekend?"], [139.42, 151.0, "I like swimming and reading. After like, love and hate, we can use a verb with -ing: I like swimming. She loves dancing. He hates waiting."], [152.12, 154.3, "How do we say we do not enjoy something?"], [155.42, 165.57, "We say don't like or doesn't like: I don't like cooking. She doesn't like running. We can also say hate for a very strong feeling."], [166.68, 168.38, "Is there a quick scale?"], [169.48, 178.72, "Yes: love, like, don't like, hate. From very positive to very negative. After each one use the -ing form to talk about activities."], [179.87, 181.45, "Part three: grammar."], [182.28, 186.22, "Grammar focus: Like and love and hate plus verb-ing."], [186.52, 187.7, "Look at the pattern."], [188.38, 189.68, "I like swimming."], [190.58, 191.98, "She loves dancing."], [192.88, 194.33, "He doesn't like cooking."], [195.27, 203.27, "After like, love, hate and don't like, use the -ing form of the verb to talk about activities. Add s to like and love with he, she and it."], [204.02, 207.09, "Be careful! Don't say: I like swim."], [209.03, 210.67, "Say: I like swimming."], [210.97, 213.01, "Use verb + -ing after like."], [213.8, 216.7, "Part four: reading. Read and listen."], [217.5, 218.83, "What I Like Doing."], [219.13, 221.52, "I love dancing and I like playing football."], [222.53, 225.67, "My sister likes reading, but she doesn't like cooking."], [226.67, 228.76, "My brother hates waking up early."], [229.77, 231.7, "We both like swimming in the river."], [232.7, 235.01, "Everyone has different likes and dislikes."], [236.1, 240.65, "Part five: quiz. Five questions. Are you ready?"], [241.48, 243.12, "She loves blank music."], [243.42, 247.3, "A, listen to. B, listening to. C, listens to."], [250.83, 253.01, "The answer is B: listening to."], [254.15, 255.8, "I don't like blank early."], [256.1, 259.69, "A, get up. B, getting up. C, gets up."], [263.23, 264.91, "The answer is B: getting up."], [266.05, 267.78, "He blank playing games."], [268.08, 271.25, "A, like. B, likes. C, liking."], [274.8, 276.58, "The answer is B: likes."], [277.72, 279.24, "Which sentence is correct?"], [279.54, 284.02, "A, I like swim.. B, I like swimming.. C, I like to swimming.."], [287.57, 289.98, "The answer is B: I like swimming.."], [291.15, 294.23, "According to the reading, who hates waking up early?"], [294.53, 298.12, "A, my brother. B, my sister. C, the writer."], [301.67, 303.45, "The answer is A: my brother."], [304.63, 307.75, "Part six: speaking. It's your turn to talk."], [308.62, 310.46, "What do you like doing at the weekend?"], [319.25, 320.77, "Now listen to Visal."], [321.07, 335.39, "At the weekend I like reading books and playing football with my friends. I also love swimming when the weather is hot. I don't like cleaning, but I do it. After like I use the -ing form of the verb."], [335.69, 337.26, "Excellent answer, Visal!"], [338.15, 343.12, "Great work! Now you can use eight new words and like and love and hate plus verb-ing."], [343.42, 347.18, "Today's value is passion. Find what you love and practise it."], [347.48, 350.19, "See you in Unit twenty-two. Goodbye!"], [350.49, 353.07, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit22-Ordinal-Numbers-and-Dates": [[0.35, 5.3, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.6, 9.14, "Hi! I'm Visal. Let's learn together!"], [9.44, 15.95, "Unit twenty-two: Ordinal Numbers and Dates. Today you will say the order of things and talk about dates."], [16.25, 19.04, "Here is our lesson map. Let's start!"], [20.0, 23.26, "Part one: words. You will learn eight new words."], [24.12, 24.84, "First."], [25.85, 27.71, "First means number one in order."], [28.32, 29.9, "Today is the first day."], [30.48, 32.61, "Your turn. Say: First."], [35.47, 36.41, "First."], [37.15, 38.02, "Second."], [39.02, 41.13, "Second means number two in order."], [41.72, 43.22, "He is the second student."], [43.82, 46.18, "Your turn. Say: Second."], [49.03, 49.84, "Second."], [50.58, 51.32, "Third."], [52.32, 54.36, "Third means number three in order."], [54.95, 56.38, "She is third in line."], [56.98, 59.95, "Your turn. Say: Third."], [62.8, 63.56, "Third."], [64.32, 65.02, "Tenth."], [66.02, 68.12, "Tenth means number ten in order."], [68.72, 70.34, "My birthday is on the tenth."], [70.95, 73.42, "Your turn. Say: Tenth."], [76.27, 76.99, "Tenth."], [77.75, 78.61, "Twentieth."], [79.62, 81.97, "Twentieth means number twenty in order."], [82.55, 84.32, "It is the twentieth of May."], [84.92, 87.84, "Your turn. Say: Twentieth."], [90.7, 91.56, "Twentieth."], [92.32, 93.06, "Date."], [94.05, 96.0, "Date means the day, month and year."], [96.62, 97.94, "What is the date today?"], [98.55, 100.89, "Your turn. Say: Date."], [103.73, 104.48, "Date."], [105.22, 106.04, "Birthday."], [107.05, 109.51, "Birthday means the day of the year when you were born."], [110.12, 111.75, "My birthday is in May."], [112.35, 115.15, "Your turn. Say: Birthday."], [118.0, 119.0, "Birthday."], [119.75, 120.45, "Month."], [121.45, 123.91, "Month means one of twelve parts of the year."], [124.52, 125.85, "May is the fifth month."], [126.45, 128.63, "Your turn. Say: Month."], [131.47, 132.28, "Month."], [133.07, 137.03, "Part two: dialogue. Let's listen to a conversation."], [137.88, 141.06, "Visal, when is your birthday? Please say the date."], [142.15, 153.26, "It is on the tenth of May. We use ordinal numbers for dates and order: first, second, third, tenth, twentieth. Most ordinals end in th."], [154.35, 155.92, "Which ordinals are special?"], [157.02, 171.64, "First, second and third are irregular. Then four becomes fourth, five becomes fifth, twelve becomes twelfth. For numbers like twenty, we change y to ie: twentieth."], [172.75, 174.13, "How do we write dates?"], [175.25, 186.21, "In writing we use 5th May or May 5th. In speaking we say the fifth of May. We use on before a date: My birthday is on the tenth of May."], [187.37, 189.44, "Part three: grammar."], [190.28, 193.24, "Grammar focus: Ordinal numbers and dates."], [193.53, 194.71, "Look at the pattern."], [195.42, 196.89, "the first of January"], [197.78, 199.06, "the tenth of May"], [199.95, 201.6, "the twentieth of October"], [202.57, 210.5, "Use ordinal numbers for order and dates: first, second, third, then add th. Say the fifth of May. Use on before a date."], [211.25, 215.42, "Be careful! Don't say: My birthday is the five of May."], [217.37, 220.03, "Say: My birthday is on the fifth of May."], [220.33, 222.34, "Use an ordinal number with on."], [223.13, 225.69, "Part four: reading. Read and listen."], [226.5, 227.76, "Important Dates."], [228.06, 230.24, "Today is the first day of the month."], [231.23, 233.63, "My birthday is on the tenth of May."], [234.63, 236.87, "The second month of the year is February."], [237.87, 240.66, "I am third in my class, and my friend is second."], [241.67, 243.77, "The twentieth of the month is a holiday."], [244.87, 248.65, "Part five: quiz. Five questions. Are you ready?"], [249.48, 251.72, "The blank month of the year is January."], [252.01, 254.9, "A, one. B, first. C, oneth."], [258.47, 260.57, "The answer is B: first."], [261.72, 264.38, "She is the blank student in line. (3)"], [264.68, 267.73, "A, three. B, third. C, threeth."], [271.27, 272.95, "The answer is B: third."], [274.12, 275.8, "We say 5th as the blank."], [276.1, 279.22, "A, five. B, fiveth. C, fifth."], [282.77, 284.77, "The answer is C: fifth."], [285.92, 287.5, "Which sentence is correct?"], [287.8, 294.78, "A, My birthday is in the tenth of May.. B, My birthday is on the tenth of May.. C, My birthday is at the tenth of May.."], [298.33, 301.49, "The answer is B: My birthday is on the tenth of May.."], [302.65, 305.6, "According to the reading, which month is second?"], [305.9, 309.56, "A, February. B, January. C, March."], [313.1, 315.37, "The answer is A: February."], [316.57, 319.49, "Part six: speaking. It's your turn to talk."], [320.35, 321.83, "When is your birthday?"], [330.62, 332.13, "Now listen to Visal."], [332.43, 346.89, "My birthday is on the fifteenth of August. It is in the eighth month of the year. I use an ordinal number to say the date, and I say on before it. I like my birthday because I eat cake with my family."], [347.19, 348.86, "Excellent answer, Visal!"], [349.75, 354.18, "Great work! Now you can use eight new words and ordinal numbers and dates."], [354.48, 358.44, "Today's value is gratitude. Say thank you for your home and family."], [358.74, 362.23, "See you in Unit twenty-three. Goodbye!"], [362.53, 364.89, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit23-Prepositions-of-Place": [[0.35, 4.85, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.15, 9.22, "Hi! I'm Visal. Let's learn together!"], [9.52, 15.46, "Unit twenty-three: Prepositions of Place. Today you will say exactly where things are."], [15.76, 18.13, "Here is our lesson map. Let's start!"], [19.1, 22.37, "Part one: words. You will learn eight new words."], [23.22, 24.23, "Next to."], [25.22, 27.47, "Next to means at the side of something."], [28.08, 29.79, "The bank is next to the shop."], [30.38, 33.27, "Your turn. Say: Next to."], [36.13, 37.27, "Next to."], [38.02, 38.76, "Between."], [39.75, 41.83, "Between means in the middle of two things."], [42.42, 44.25, "The cat is between the chairs."], [44.85, 47.25, "Your turn. Say: Between."], [50.1, 50.71, "Between."], [51.45, 52.27, "Behind."], [53.25, 55.24, "Behind means at the back of something."], [55.85, 57.45, "The ball is behind the door."], [58.05, 60.44, "Your turn. Say: Behind."], [63.3, 64.29, "Behind."], [65.05, 66.07, "In front of."], [67.08, 69.26, "In front of means at the front of something."], [69.85, 71.58, "The bus is in front of the school."], [72.18, 74.75, "Your turn. Say: In front of."], [77.6, 78.51, "In front of."], [79.25, 80.02, "Under."], [81.02, 82.84, "Under means below something."], [83.45, 84.97, "The cat is under the table."], [85.58, 87.97, "Your turn. Say: Under."], [90.83, 91.68, "Under."], [92.45, 93.37, "Opposite."], [94.38, 97.15, "Opposite means on the other side facing something."], [97.75, 99.72, "The school is opposite the park."], [100.32, 103.25, "Your turn. Say: Opposite."], [106.1, 107.06, "Opposite."], [107.82, 108.6, "Near."], [109.58, 111.37, "Near means close to something."], [111.98, 113.48, "I live near the market."], [114.08, 116.35, "Your turn. Say: Near."], [119.2, 120.27, "Near."], [121.02, 121.88, "Above."], [122.88, 125.0, "Above means higher than something."], [125.58, 127.23, "The clock is above the door."], [127.85, 129.99, "Your turn. Say: Above."], [132.83, 133.69, "Above."], [134.5, 138.32, "Part two: dialogue. Let's listen to a conversation."], [139.18, 142.96, "Visal, where is your school? Can you describe it with a place word?"], [144.05, 153.03, "My school is next to a park and opposite a market. These words are prepositions of place. They tell us exactly where something is."], [154.12, 155.85, "Can you give more examples?"], [156.95, 167.0, "The cat is under the table. The clock is above the door. The bank is between the shop and the school. The bus is in front of the gate and the dog is behind it."], [168.12, 169.84, "Where do we put the preposition?"], [170.95, 179.67, "After the verb be and before the noun: The book is under the chair. We can also use there is: There is a tree behind the house."], [180.83, 182.53, "Part three: grammar."], [183.38, 186.39, "Grammar focus: Prepositions of place."], [186.69, 187.83, "Look at the pattern."], [188.55, 190.24, "The cat is under the table."], [191.15, 193.35, "The bank is between the shop and the school."], [194.25, 195.94, "The clock is above the door."], [196.9, 203.0, "Use next to, between, behind, in front of, under, opposite, near and above after be to say exactly where something is."], [203.75, 207.18, "Be careful! Don't say: The bank is in front the school."], [209.13, 212.09, "Say: The bank is in front of the school."], [212.38, 213.86, "Say in front of."], [214.67, 217.38, "Part four: reading. Read and listen."], [218.17, 219.41, "Finding Places."], [219.71, 222.55, "My school is next to a park and opposite a market."], [223.53, 226.65, "The bank is between the shop and the post office."], [227.63, 230.72, "There is a bus in front of the gate, and a tree behind the building."], [231.73, 234.94, "The clock is above the door, and my bag is under my desk."], [235.93, 237.94, "I live near the school, so I walk."], [239.03, 243.26, "Part five: quiz. Five questions. Are you ready?"], [244.12, 246.47, "The cat is blank the table. (below)"], [246.77, 250.7, "A, under. B, above. C, between."], [254.23, 256.11, "The answer is A: under."], [257.25, 259.69, "The clock is blank the door. (higher)"], [259.99, 263.33, "A, under. B, behind. C, above."], [266.87, 268.95, "The answer is C: above."], [270.08, 273.22, "The shop is blank the bank and the school. (in the middle)"], [273.52, 276.79, "A, between. B, opposite. C, near."], [280.33, 282.81, "The answer is A: between."], [283.95, 285.52, "Which sentence is correct?"], [285.82, 292.11, "A, The park is in front the school.. B, The park is in front of the school.. C, The park is front of the school.."], [295.67, 298.85, "The answer is B: The park is in front of the school.."], [300.02, 302.4, "According to the reading, where is the bank?"], [302.7, 308.66, "A, between the shop and the post office. B, under the table. C, near the clock."], [312.2, 315.67, "The answer is A: between the shop and the post office."], [316.87, 320.01, "Part six: speaking. It's your turn to talk."], [320.85, 323.74, "Where is your school? Use two prepositions."], [332.55, 334.12, "Now listen to Visal."], [334.42, 348.03, "My school is next to a small park and opposite a big market. It is near my house, so I walk there every day. I use next to, opposite and near to say exactly where my school is."], [348.33, 349.97, "Excellent answer, Visal!"], [350.88, 354.98, "Great work! Now you can use eight new words and prepositions of place."], [355.27, 358.94, "Today's value is attention. Look carefully and listen well."], [359.24, 361.97, "See you in Unit twenty-four. Goodbye!"], [362.27, 364.96, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit24-Let-s-suggestions": [[0.35, 5.2, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.5, 9.04, "Hi! I'm Visal. Let's learn together!"], [9.34, 14.71, "Unit twenty-four: Let's (suggestions). Today you will make suggestions and agree with ideas."], [15.01, 17.61, "Here is our lesson map. Let's start!"], [18.57, 21.71, "Part one: words. You will learn eight new words."], [22.55, 23.38, "Let's."], [24.38, 27.68, "Let's means short for let us, used to make a suggestion."], [28.28, 29.7, "Let's play football."], [30.32, 32.99, "Your turn. Say: Let's."], [35.83, 36.67, "Let's."], [37.42, 38.57, "Suggestion."], [39.58, 42.53, "Suggestion means an idea that you offer to someone."], [43.15, 44.77, "That is a good suggestion."], [45.35, 48.11, "Your turn. Say: Suggestion."], [50.97, 52.14, "Suggestion."], [52.88, 53.66, "Go."], [54.65, 56.77, "Go means to move to another place."], [57.35, 58.64, "Let's go to the park."], [59.25, 61.41, "Your turn. Say: Go."], [64.27, 65.05, "Go."], [65.78, 66.56, "Play."], [67.55, 69.58, "Play means to do something for fun."], [70.18, 71.63, "Let's play a game."], [72.22, 74.25, "Your turn. Say: Play."], [77.1, 77.72, "Play."], [78.48, 79.1, "Eat."], [80.12, 82.19, "Eat means to put food in your mouth."], [82.78, 83.96, "Let's eat lunch."], [84.55, 86.6, "Your turn. Say: Eat."], [89.43, 90.18, "Eat."], [90.92, 91.74, "Watch."], [92.75, 95.17, "Watch means to look at something for a time."], [95.78, 97.04, "Let's watch a film."], [97.65, 99.97, "Your turn. Say: Watch."], [102.8, 103.62, "Watch."], [104.35, 105.53, "Good idea."], [106.52, 109.35, "Good idea means a reply to agree with a suggestion."], [109.95, 112.27, "Good idea! Let's do it."], [112.85, 115.43, "Your turn. Say: Good idea."], [118.27, 119.2, "Good idea."], [119.95, 120.92, "Why not."], [121.92, 124.66, "Why not means a reply to say yes to a suggestion."], [125.25, 127.54, "Why not? It sounds fun."], [128.15, 130.69, "Your turn. Say: Why not."], [133.53, 134.55, "Why not."], [135.33, 138.89, "Part two: dialogue. Let's listen to a conversation."], [139.75, 144.33, "Visal, it is Saturday. What do you want to do? Make a suggestion."], [145.42, 155.2, "Let's go to the park! We use let's and the base verb to suggest an activity: Let's play football. Let's watch a film. Let's eat together."], [156.32, 158.25, "How can the other person reply?"], [159.35, 171.79, "To agree, we can say: Good idea! Why not? Okay. To say no politely: Sorry, I can't. Maybe another time. Let's is friendly and invites us."], [172.88, 174.81, "How do we make a negative suggestion?"], [175.92, 186.62, "We say Let's not: Let's not be late. It is a gentle way to say we should not do something. A question is also possible: Why don't we go?"], [187.77, 189.2, "Part three: grammar."], [190.05, 193.72, "Grammar focus: Suggestions: Let's plus base verb."], [194.02, 195.21, "Look at the pattern."], [195.92, 197.36, "Let's go to the park."], [198.25, 200.04, "Let's watch a film tonight."], [200.95, 202.95, "Let's not be late for class."], [203.9, 211.97, "Use Let's + base verb to suggest an activity and Let's not + base verb for a negative suggestion. Reply with Good idea or Why not."], [212.72, 215.59, "Be careful! Don't say: Let's to go home."], [217.53, 219.08, "Say: Let's go home."], [219.38, 221.3, "Use the base verb after let's."], [222.1, 225.19, "Part four: reading. Read and listen."], [226.0, 227.43, "Making Plans."], [227.73, 230.09, "It is Saturday, so let's go to the park."], [231.1, 233.82, "Let's play football and then eat lunch together."], [234.83, 237.78, "Good idea! Why not invite our friends too?"], [238.77, 240.57, "Let's watch a film in the evening."], [241.57, 244.67, "Let's not be late, because the bus leaves at nine."], [245.77, 249.94, "Part five: quiz. Five questions. Are you ready?"], [250.78, 252.11, "blank play football!"], [252.41, 255.68, "A, Lets. B, Let's. C, Let."], [259.23, 261.18, "The answer is B: Let's."], [262.32, 263.75, "Let's blank to the market."], [264.05, 267.53, "A, go. B, going. C, goes."], [271.07, 273.32, "The answer is A: go."], [274.48, 276.92, "A good reply to a suggestion is blank."], [277.22, 281.61, "A, Good idea!. B, Good bye!. C, Good night!."], [285.17, 287.27, "The answer is A: Good idea!."], [288.42, 289.98, "Which sentence is correct?"], [290.27, 294.88, "A, Let's to play now.. B, Let's play now.. C, Let's playing now.."], [298.43, 300.7, "The answer is B: Let's play now.."], [301.85, 304.79, "According to the reading, why should we not be late?"], [305.09, 310.06, "A, the bus leaves at nine. B, it is Saturday. C, the film is long."], [313.6, 316.42, "The answer is A: the bus leaves at nine."], [317.63, 320.81, "Part six: speaking. It's your turn to talk."], [321.65, 324.54, "Make a suggestion for this weekend using 'Let's'."], [333.35, 334.97, "Now listen to Visal."], [335.27, 347.78, "Let's go to the river on Sunday morning and have a picnic. We can eat rice and fruit and play games. I use let's and the base verb to make the suggestion. My friends can answer, Good idea!"], [348.08, 349.69, "Excellent answer, Visal!"], [350.58, 355.81, "Great work! Now you can use eight new words and suggestions: let's plus base verb."], [356.11, 359.96, "Today's value is teamwork. We can do more when we work together."], [360.26, 363.29, "See you in Unit twenty-five. Goodbye!"], [363.58, 365.98, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit25-Present-Continuous-am-is-are-ing": [[0.35, 5.56, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.86, 9.31, "Hi! I'm Visal. Let's learn together!"], [9.62, 16.24, "Unit twenty-five: Present Continuous (am/is/are + -ing). Today you will talk about actions that are happening now."], [16.54, 19.02, "Here is our lesson map. Let's start!"], [19.97, 23.16, "Part one: words. You will learn eight new words."], [24.02, 24.72, "Now."], [25.72, 27.39, "Now means at this moment."], [27.98, 29.47, "I am studying now."], [30.08, 32.33, "Your turn. Say: Now."], [35.17, 36.13, "Now."], [36.88, 37.91, "At the moment."], [38.92, 40.65, "At the moment means right now."], [41.25, 42.89, "She is cooking at the moment."], [43.48, 46.08, "Your turn. Say: At the moment."], [48.93, 49.82, "At the moment."], [50.58, 51.64, "Am reading."], [52.65, 55.37, "Am reading means I am doing the action of reading now."], [55.98, 57.6, "I am reading a story."], [58.18, 60.93, "Your turn. Say: Am reading."], [63.77, 64.86, "Am reading."], [65.62, 66.63, "Is running."], [67.62, 70.81, "Is running means he or she is doing the action of running now."], [71.42, 72.82, "He is running in the park."], [73.42, 75.62, "Your turn. Say: Is running."], [78.47, 79.39, "Is running."], [80.15, 81.17, "Are playing."], [82.18, 85.0, "Are playing means they are doing the action of playing now."], [85.58, 86.99, "They are playing football."], [87.58, 90.18, "Your turn. Say: Are playing."], [93.03, 94.12, "Are playing."], [94.85, 95.58, "Look!."], [96.58, 99.87, "Look! means a word we use to show something happening."], [100.48, 102.11, "Look! It is raining."], [102.72, 105.19, "Your turn. Say: Look!."], [108.03, 108.71, "Look!."], [109.45, 110.44, "Listen!."], [111.45, 114.84, "Listen! means a word we use to hear something happening."], [115.45, 117.43, "Listen! A bird is singing."], [118.02, 120.48, "Your turn. Say: Listen!."], [123.33, 124.22, "Listen!."], [124.98, 125.71, "-ing."], [126.72, 130.21, "-ing means the ending that we add to a verb in the present continuous."], [130.82, 132.27, "Reading, playing, running."], [132.88, 135.15, "Your turn. Say: -ing."], [138.0, 138.71, "-ing."], [139.5, 143.1, "Part two: dialogue. Let's listen to a conversation."], [143.95, 146.16, "Visal, what are you doing right now?"], [147.25, 157.31, "I am talking to you. We use am, is or are with verb + -ing to describe an action that is happening now. I am reading. She is running. They are playing."], [158.42, 160.02, "How do we spell the -ing form?"], [161.12, 175.1, "Most verbs just add -ing: read, reading. If a verb ends in e, drop the e: make, making. If it has one short vowel and one consonant, double the consonant: run, running."], [176.22, 178.06, "And questions and negatives?"], [179.15, 189.33, "Questions: Are you listening? Is he running? Negatives: I am not sleeping. She is not working. Look and listen are good clues for now."], [190.5, 192.48, "Part three: grammar."], [193.32, 198.08, "Grammar focus: Present continuous: am and is and are plus verb-ing."], [198.38, 199.64, "Look at the pattern."], [200.35, 201.83, "I am reading a book now."], [202.72, 204.22, "She is running in the park."], [205.12, 206.38, "They are playing football."], [207.33, 214.61, "Use am / is / are + verb-ing for actions happening now. Spelling: drop e (make, making) and double a final consonant (run, running)."], [215.35, 218.42, "Be careful! Don't say: I reading a book now."], [220.37, 222.41, "Say: I am reading a book now."], [222.71, 225.24, "Add am, is or are before verb + -ing."], [226.03, 228.92, "Part four: reading. Read and listen."], [229.73, 230.71, "Right Now."], [231.01, 233.25, "Look! It is raining outside."], [234.23, 237.5, "I am sitting in the classroom, and the teacher is talking."], [238.5, 240.86, "My friends are playing football at the moment."], [241.87, 244.46, "Listen! A bird is singing in the tree."], [245.47, 247.97, "My mother is cooking dinner, and I am reading."], [249.07, 252.93, "Part five: quiz. Five questions. Are you ready?"], [253.78, 255.12, "She blank a book now."], [255.42, 258.73, "A, reads. B, is reading. C, read."], [262.27, 264.15, "The answer is B: is reading."], [265.32, 267.08, "They blank football at the moment."], [267.38, 271.03, "A, are playing. B, is playing. C, plays."], [274.57, 276.37, "The answer is A: are playing."], [277.52, 279.33, "The -ing form of 'run' is blank."], [279.63, 282.47, "A, runing. B, running. C, runming."], [286.03, 287.74, "The answer is B: running."], [288.88, 290.69, "Which sentence is correct?"], [290.99, 295.37, "A, I am read now.. B, I reading now.. C, I am reading now.."], [298.93, 301.56, "The answer is C: I am reading now.."], [302.72, 305.04, "According to the reading, who is cooking dinner?"], [305.34, 308.9, "A, my mother. B, my friends. C, the teacher."], [312.47, 314.3, "The answer is A: my mother."], [315.5, 318.55, "Part six: speaking. It's your turn to talk."], [319.38, 320.88, "What are you doing right now?"], [329.68, 331.08, "Now listen to Visal."], [331.38, 343.45, "I am sitting at my desk and I am answering your question. My teacher is listening, and my friends are writing. I use am, is or are with a verb ending in -ing to talk about what is happening now."], [343.75, 345.72, "Excellent answer, Visal!"], [346.62, 352.56, "Great work! Now you can use eight new words and present continuous: am and is and are plus verb-ing."], [352.86, 356.39, "Today's value is attention. Look carefully and listen well."], [356.69, 360.24, "See you in Unit twenty-six. Goodbye!"], [360.54, 363.58, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit26-Was-Were-past-of-to-be": [[0.35, 5.12, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.42, 8.96, "Hi! I'm Visal. Let's learn together!"], [9.26, 15.37, "Unit twenty-six: Was / Were (past of to be). Today you will talk about where people and things were in the past."], [15.67, 18.32, "Here is our lesson map. Let's start!"], [19.27, 22.79, "Part one: words. You will learn eight new words."], [23.65, 24.5, "Was."], [25.52, 27.69, "Was means the past of am and is."], [28.28, 29.75, "I was at home yesterday."], [30.35, 32.34, "Your turn. Say: Was."], [35.2, 36.13, "Was."], [36.88, 37.44, "Were."], [38.45, 40.08, "Were means the past of are."], [40.68, 41.77, "They were at school."], [42.35, 44.64, "Your turn. Say: Were."], [47.5, 48.44, "Were."], [49.18, 50.21, "Yesterday."], [51.22, 53.36, "Yesterday means the day before today."], [53.95, 55.57, "I was tired yesterday."], [56.15, 58.64, "Your turn. Say: Yesterday."], [61.5, 62.62, "Yesterday."], [63.38, 64.48, "Last week."], [65.48, 67.73, "Last week means the week before this one."], [68.32, 70.03, "We were on holiday last week."], [70.62, 73.25, "Your turn. Say: Last week."], [76.1, 77.37, "Last week."], [78.12, 79.15, "I was."], [80.15, 82.69, "I was means I used to be in a place or state."], [83.28, 84.41, "I was happy."], [85.02, 87.36, "Your turn. Say: I was."], [90.2, 91.17, "I was."], [91.92, 92.84, "They were."], [93.85, 96.5, "They were means more than one person used to be there."], [97.08, 98.22, "They were friends."], [98.82, 101.37, "Your turn. Say: They were."], [104.2, 105.16, "They were."], [105.92, 106.74, "Wasn't."], [107.75, 109.04, "Wasn't means was not."], [109.65, 110.85, "She wasn't at home."], [111.45, 113.84, "Your turn. Say: Wasn't."], [116.7, 117.54, "Wasn't."], [118.28, 119.06, "Weren't."], [120.05, 121.47, "Weren't means were not."], [122.08, 123.11, "We weren't late."], [123.72, 125.95, "Your turn. Say: Weren't."], [128.8, 129.7, "Weren't."], [130.5, 134.29, "Part two: dialogue. Let's listen to a conversation."], [135.15, 137.0, "Visal, where were you yesterday?"], [138.08, 149.16, "I was at home. Was is the past of am and is. Were is the past of are. We use was with I, he, she and it. We use were with you, we and they."], [150.25, 151.74, "How do we make negatives?"], [152.85, 162.26, "Add not: I was not at school. They were not late. In speaking we say wasn't and weren't. She wasn't happy. We weren't there."], [163.35, 164.55, "And questions?"], [165.65, 177.77, "Put was or were first: Were you at school? Was she tired? We answer: Yes, I was. No, she wasn't. Time words like yesterday and last week tell us it is the past."], [178.93, 180.85, "Part three: grammar."], [181.72, 185.34, "Grammar focus: Past of be: was and were."], [185.64, 186.84, "Look at the pattern."], [187.55, 189.14, "I was at home yesterday."], [190.05, 191.78, "They were at school last week."], [192.68, 194.09, "She wasn't at the party."], [195.03, 203.28, "Use was with I, he, she and it, and were with you, we and they. Negatives: wasn't and weren't. Questions: Was she…? Were you…?"], [204.05, 207.44, "Be careful! Don't say: We was late yesterday."], [209.4, 211.21, "Say: We were late yesterday."], [211.51, 212.85, "Use were with we."], [213.67, 216.31, "Part four: reading. Read and listen."], [217.1, 218.75, "Yesterday and Last Week."], [219.05, 221.88, "Yesterday I was at home, and my brother was at school."], [222.87, 225.92, "My parents were at work, and my sister was with a friend."], [226.93, 228.85, "Last week we were in Siem Reap."], [229.87, 232.98, "The weather wasn't hot, and the hotel wasn't expensive."], [233.97, 236.18, "Were you on holiday last week too?"], [237.27, 241.56, "Part five: quiz. Five questions. Are you ready?"], [242.42, 244.39, "I blank at school yesterday."], [244.69, 247.54, "A, were. B, was. C, am."], [251.1, 253.1, "The answer is B: was."], [254.25, 256.34, "They blank in Phnom Penh last week."], [256.64, 259.54, "A, was. B, is. C, were."], [263.1, 264.81, "The answer is C: were."], [265.95, 268.2, "She blank happy. (negative)"], [268.5, 271.88, "A, wasn't. B, weren't. C, isn't was."], [275.43, 277.38, "The answer is A: wasn't."], [278.52, 280.25, "Which sentence is correct?"], [280.55, 284.55, "A, We was late.. B, We were late.. C, We be late.."], [288.1, 290.26, "The answer is B: We were late.."], [291.42, 294.23, "According to the reading, where were the family last week?"], [294.53, 298.26, "A, in Siem Reap. B, at school. C, at work."], [301.8, 303.82, "The answer is A: in Siem Reap."], [305.03, 308.06, "Part six: speaking. It's your turn to talk."], [308.92, 310.45, "Where were you yesterday?"], [319.25, 320.71, "Now listen to Visal."], [321.01, 335.56, "Yesterday I was at home in the morning, and I was at school in the afternoon. My friends were at school too. We were tired, but we were happy. I use was with I and were with we or they."], [335.86, 337.86, "Excellent answer, Visal!"], [338.75, 342.83, "Great work! Now you can use eight new words and past of be: was and were."], [343.13, 347.13, "Today's value is reflection. Think about what you learned and how you grew."], [347.43, 350.39, "See you in Unit twenty-seven. Goodbye!"], [350.69, 353.75, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit27-Past-Simple-regular-verbs": [[0.35, 5.52, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.82, 9.16, "Hi! I'm Visal. Let's learn together!"], [9.46, 16.25, "Unit twenty-seven: Past Simple (regular verbs). Today you will talk about finished actions in the past."], [16.55, 19.31, "Here is our lesson map. Let's start!"], [20.27, 23.23, "Part one: words. You will learn eight new words."], [24.08, 25.11, "Yesterday."], [26.12, 28.49, "Yesterday means the day before today."], [29.08, 30.73, "I played football yesterday."], [31.35, 34.19, "Your turn. Say: Yesterday."], [37.03, 38.08, "Yesterday."], [38.82, 39.61, "Walked."], [40.62, 42.43, "Walked means the past of walk."], [43.02, 44.35, "She walked to school."], [44.95, 47.14, "Your turn. Say: Walked."], [50.0, 50.9, "Walked."], [51.65, 52.38, "Played."], [53.38, 55.16, "Played means the past of play."], [55.75, 57.45, "They played all afternoon."], [58.05, 60.54, "Your turn. Say: Played."], [63.4, 64.17, "Played."], [64.92, 65.77, "Watched."], [66.78, 68.67, "Watched means the past of watch."], [69.28, 70.6, "We watched a film."], [71.18, 73.38, "Your turn. Say: Watched."], [76.23, 77.18, "Watched."], [77.92, 78.75, "Studied."], [79.75, 81.7, "Studied means the past of study."], [82.32, 83.79, "He studied English."], [84.38, 86.58, "Your turn. Say: Studied."], [89.43, 90.4, "Studied."], [91.15, 92.29, "Last night."], [93.28, 96.18, "Last night means the evening or night before today."], [96.78, 98.7, "I slept early last night."], [99.32, 102.61, "Your turn. Say: Last night."], [105.47, 106.64, "Last night."], [107.38, 108.2, "Ago."], [109.18, 111.59, "Ago means back in the past from now."], [112.18, 113.71, "I met her two years ago."], [114.32, 116.74, "Your turn. Say: Ago."], [119.6, 120.56, "Ago."], [121.32, 122.13, "Finished."], [123.12, 125.2, "Finished means the past of finish."], [125.78, 127.23, "I finished my homework."], [127.82, 130.1, "Your turn. Say: Finished."], [132.93, 133.72, "Finished."], [134.53, 138.09, "Part two: dialogue. Let's listen to a conversation."], [138.95, 140.95, "Visal, what did you do yesterday?"], [142.05, 155.63, "I played football and I studied English. We use the past simple for finished actions. For regular verbs, we add -ed: play, played; walk, walked; watch, watched."], [156.72, 158.41, "Are there any spelling rules?"], [159.52, 174.22, "If a verb ends in e, we add d: like, liked. If it ends in consonant + y, change y to ied: study, studied. Short verbs often double the last letter: stop, stopped."], [175.32, 177.71, "Does the past form change with he or she?"], [178.82, 188.89, "No! It is the same for every subject: I played, she played, they played. Time words like yesterday, last night and two days ago help us."], [190.03, 191.51, "Part three: grammar."], [192.35, 196.51, "Grammar focus: Past simple: verb plus -ed."], [196.81, 198.03, "Look at the pattern."], [198.72, 200.66, "I played football yesterday."], [201.55, 203.36, "She walked to school last week."], [204.25, 206.03, "We watched a film last night."], [206.97, 215.52, "For finished actions in the past, add -ed to regular verbs. The form is the same for every subject. Spelling: e + d, y becomes ied."], [216.28, 219.67, "Be careful! Don't say: I playd football yesterday."], [221.63, 223.98, "Say: I played football yesterday."], [224.28, 226.0, "Add -ed to the base verb."], [226.8, 229.38, "Part four: reading. Read and listen."], [230.17, 231.57, "A Busy Yesterday."], [231.87, 234.3, "Yesterday I walked to school with my friends."], [235.3, 237.19, "We played football at lunch time."], [238.2, 240.87, "Last night I studied English for one hour."], [241.87, 244.7, "I watched a film with my family two hours ago."], [245.7, 247.92, "I finished my homework before I slept."], [249.03, 253.09, "Part five: quiz. Five questions. Are you ready?"], [253.95, 255.75, "I blank football yesterday."], [256.05, 259.28, "A, play. B, played. C, playing."], [262.83, 264.61, "The answer is B: played."], [265.75, 267.66, "She blank English last night."], [267.96, 271.25, "A, studied. B, studyed. C, studys."], [274.8, 276.44, "The answer is A: studied."], [277.58, 279.79, "'Two days ago' is a blank time word."], [280.09, 283.49, "A, past. B, future. C, present."], [287.03, 288.99, "The answer is A: past."], [290.15, 291.85, "Which sentence is correct?"], [292.15, 297.88, "A, He walkd to school.. B, He walked to school.. C, He walks to school yesterday.."], [301.43, 303.84, "The answer is B: He walked to school.."], [304.98, 308.11, "According to the reading, what did the writer do last night?"], [308.41, 313.07, "A, studied English. B, played football. C, walked to school."], [316.63, 319.02, "The answer is A: studied English."], [320.2, 323.2, "Part six: speaking. It's your turn to talk."], [324.05, 325.65, "What did you do yesterday?"], [334.45, 336.18, "Now listen to Visal."], [336.48, 353.42, "Yesterday I walked to school and studied English. After lunch I played football with my friends. In the evening I watched TV with my family. All of these verbs end in -ed because they are regular verbs in the past simple."], [353.72, 355.71, "Excellent answer, Visal!"], [356.62, 361.81, "Great work! Now you can use eight new words and past simple: verb plus -ed."], [362.11, 366.1, "Today's value is reflection. Think about what you learned and how you grew."], [366.4, 369.47, "See you in Unit twenty-eight. Goodbye!"], [369.77, 372.61, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit28-Past-Simple-irregular-verbs": [[0.35, 5.67, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.97, 9.41, "Hi! I'm Visal. Let's learn together!"], [9.71, 16.69, "Unit twenty-eight: Past Simple (irregular verbs). Today you will use common irregular verbs for the past."], [16.99, 19.52, "Here is our lesson map. Let's start!"], [20.47, 23.72, "Part one: words. You will learn eight new words."], [24.58, 25.35, "Went."], [26.35, 28.2, "Went means the past of go."], [28.78, 30.1, "I went to the market."], [30.68, 32.73, "Your turn. Say: Went."], [35.57, 36.37, "Went."], [37.12, 37.93, "Saw."], [38.92, 40.81, "Saw means the past of see."], [41.42, 42.79, "She saw a big bird."], [43.38, 45.32, "Your turn. Say: Saw."], [48.17, 49.24, "Saw."], [49.98, 50.71, "Ate."], [51.72, 53.37, "Ate means the past of eat."], [53.98, 55.6, "We ate rice for lunch."], [56.18, 58.44, "Your turn. Say: Ate."], [61.3, 62.01, "Ate."], [62.75, 63.5, "Had."], [64.48, 66.24, "Had means the past of have."], [66.85, 68.27, "I had a great weekend."], [68.88, 71.48, "Your turn. Say: Had."], [74.33, 75.04, "Had."], [75.78, 76.46, "Took."], [77.45, 79.17, "Took means the past of take."], [79.78, 81.05, "He took the bus."], [81.65, 83.77, "Your turn. Say: Took."], [86.63, 87.2, "Took."], [87.95, 88.65, "Came."], [89.65, 91.3, "Came means the past of come."], [91.92, 93.23, "She came home late."], [93.82, 96.22, "Your turn. Say: Came."], [99.07, 99.94, "Came."], [100.68, 101.71, "Irregular."], [102.72, 105.39, "Irregular means not following the normal rule."], [105.98, 107.63, "Go is an irregular verb."], [108.25, 110.78, "Your turn. Say: Irregular."], [113.63, 114.67, "Irregular."], [115.42, 116.56, "Past form."], [117.55, 120.93, "Past form means the version of a verb that talks about the past."], [121.52, 123.41, "Went is the past form of go."], [124.02, 126.72, "Your turn. Say: Past form."], [129.57, 130.8, "Past form."], [131.6, 135.3, "Part two: dialogue. Let's listen to a conversation."], [136.15, 139.81, "Visal, did you say 'I goed to the market' or 'I went to the market'?"], [140.92, 149.87, "I went to the market. Go is an irregular verb. Its past form is went, not goed. Many common verbs are irregular, so we must learn them."], [150.98, 152.9, "Can you give me some other examples?"], [154.02, 164.97, "See becomes saw. Eat becomes ate. Have becomes had. Take becomes took. Come becomes came. There is no rule, so practise the most common ones."], [166.08, 167.35, "How can we learn them?"], [168.45, 178.28, "Make lists and use them in sentences. I went to the market and saw my friend. We ate rice and had tea. The past form is the same for all subjects."], [179.43, 180.89, "Part three: grammar."], [181.75, 185.24, "Grammar focus: Irregular past simple verbs."], [185.54, 186.8, "Look at the pattern."], [187.52, 188.88, "I went to the market."], [189.78, 191.13, "She saw a big bird."], [192.02, 193.45, "We ate rice for lunch."], [194.4, 203.21, "Irregular verbs have their own past forms: go, went; see, saw; eat, ate; have, had; take, took; come, came. Do not add -ed."], [203.95, 207.57, "Be careful! Don't say: I goed to the market."], [209.5, 211.27, "Say: I went to the market."], [211.57, 213.68, "Go is irregular: went."], [214.47, 217.13, "Part four: reading. Read and listen."], [217.93, 219.04, "Last Weekend."], [219.34, 222.37, "Last Saturday I went to the market with my mother."], [223.37, 225.91, "We saw many fruits and ate some mangoes."], [226.9, 228.83, "At home we had tea and took a rest."], [229.83, 232.19, "My cousin came to visit us in the afternoon."], [233.2, 235.65, "We learned that many common verbs are irregular."], [236.77, 240.65, "Part five: quiz. Five questions. Are you ready?"], [241.52, 243.34, "I blank to the park yesterday."], [243.64, 246.52, "A, goed. B, went. C, go."], [250.07, 251.96, "The answer is B: went."], [253.12, 254.69, "She blank a big bird."], [254.99, 258.21, "A, saw. B, seed. C, sees."], [261.77, 263.7, "The answer is A: saw."], [264.85, 266.69, "They blank rice for lunch."], [266.99, 269.98, "A, eated. B, eat. C, ate."], [273.53, 275.93, "The answer is C: ate."], [277.08, 278.68, "Which sentence is correct?"], [278.98, 283.71, "A, He taked a bus.. B, He took a bus.. C, He take a bus.."], [287.27, 290.0, "The answer is B: He took a bus.."], [291.15, 294.1, "According to the reading, who came in the afternoon?"], [294.4, 298.43, "A, my cousin. B, my mother. C, my friend."], [301.97, 304.23, "The answer is A: my cousin."], [305.43, 308.36, "Part six: speaking. It's your turn to talk."], [309.22, 313.19, "Write two sentences about last weekend using irregular past verbs."], [321.98, 323.37, "Now listen to Visal."], [323.67, 337.76, "Last weekend I went to the beach and I saw many boats. We ate fish and had fresh coconut. These sentences use irregular verbs: go became went, see became saw, eat became ate and have became had."], [338.06, 339.94, "Excellent answer, Visal!"], [340.85, 345.62, "Great work! Now you can use eight new words and irregular past simple verbs."], [345.92, 350.46, "Today's value is perseverance. Keep trying, even when it is hard."], [350.76, 353.7, "See you in Unit twenty-nine. Goodbye!"], [354.0, 356.47, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit29-Past-Simple-Questions-and-Negatives": [[0.35, 5.14, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.44, 9.68, "Hi! I'm Visal. Let's learn together!"], [9.97, 18.04, "Unit twenty-nine: Past Simple Questions and Negatives. Today you will ask and answer questions about the past with did and didn't."], [18.34, 20.94, "Here is our lesson map. Let's start!"], [21.9, 25.39, "Part one: words. You will learn eight new words."], [26.25, 26.87, "Did."], [27.88, 30.55, "Did means the helping verb for past questions."], [31.15, 32.5, "Did you eat breakfast?"], [33.08, 35.62, "Your turn. Say: Did."], [38.47, 39.19, "Did."], [39.95, 40.64, "Didn't."], [41.65, 43.1, "Didn't means did not."], [43.72, 45.12, "I didn't go to school."], [45.72, 48.43, "Your turn. Say: Didn't."], [51.27, 52.13, "Didn't."], [52.88, 53.61, "Did you...?."], [54.62, 57.26, "Did you...? means a question about the past."], [57.85, 59.27, "Did you watch TV?"], [59.88, 62.0, "Your turn. Say: Did you...?."], [64.87, 65.66, "Did you...?."], [66.42, 67.65, "Yes, I did."], [68.65, 71.07, "Yes, I did means a short positive answer."], [71.68, 73.93, "Did you call him? Yes, I did."], [74.52, 77.33, "Your turn. Say: Yes, I did."], [80.17, 81.68, "Yes, I did."], [82.42, 83.71, "No, I didn't."], [84.72, 87.03, "No, I didn't means a short negative answer."], [87.62, 89.89, "Did you see her? No, I didn't."], [90.48, 93.24, "Your turn. Say: No, I didn't."], [96.1, 97.3, "No, I didn't."], [98.05, 99.13, "Base verb."], [100.12, 103.15, "Base verb means the simple form of a verb."], [103.75, 105.45, "Eat is the base verb."], [106.05, 108.78, "Your turn. Say: Base verb."], [111.63, 112.87, "Base verb."], [113.62, 114.72, "Yesterday."], [115.72, 117.94, "Yesterday means the day before today."], [118.55, 120.26, "Did you study yesterday?"], [120.85, 123.28, "Your turn. Say: Yesterday."], [126.13, 127.24, "Yesterday."], [127.98, 128.83, "Ago."], [129.85, 131.98, "Ago means back in the past from now."], [132.58, 134.19, "She left an hour ago."], [134.78, 136.96, "Your turn. Say: Ago."], [139.8, 140.64, "Ago."], [141.43, 144.98, "Part two: dialogue. Let's listen to a conversation."], [145.82, 148.23, "Visal, did you watch TV last night?"], [149.35, 161.7, "Yes, I did. We make past questions with did + subject + base verb: Did you watch TV? Did she go to school? The verb goes back to its base form."], [162.82, 164.53, "And negative sentences?"], [165.62, 174.34, "We use didn't + base verb: I didn't eat breakfast. She didn't go to school. Not 'She didn't went', because did already shows the past."], [175.45, 176.54, "How do we answer?"], [177.65, 190.64, "Use short answers: Yes, I did. No, I didn't. Did he come? Yes, he did. No, he didn't. With question words: What did you eat? Where did she go?"], [191.8, 193.34, "Part three: grammar."], [194.18, 199.6, "Grammar focus: Past questions and negatives: did and didn't plus base verb."], [199.9, 201.14, "Look at the pattern."], [201.85, 203.95, "Did you watch TV last night?"], [204.85, 206.7, "I didn't eat breakfast this morning."], [207.58, 209.2, "Where did she go yesterday?"], [210.13, 219.11, "Use did + subject + base verb for questions and didn't + base verb for negatives. After did and didn't, never add -ed or use the past form."], [219.85, 223.12, "Be careful! Don't say: She didn't went home."], [225.07, 227.21, "Say: She didn't go home."], [227.51, 229.33, "Use the base verb after didn't."], [230.13, 232.87, "Part four: reading. Read and listen."], [233.67, 234.48, "Did You…?."], [234.78, 237.71, "Did you watch TV last night? No, I didn't."], [238.7, 240.94, "I didn't watch TV, because I studied."], [241.93, 244.5, "Did your brother help you? Yes, he did."], [245.5, 247.56, "What did you eat for dinner yesterday?"], [248.57, 251.95, "She didn't go to school, because she was ill two days ago."], [253.03, 256.95, "Part five: quiz. Five questions. Are you ready?"], [257.82, 259.39, "blank you eat breakfast?"], [259.69, 262.84, "A, Do. B, Did. C, Does."], [266.4, 268.0, "The answer is B: Did."], [269.15, 271.29, "I blank go to school yesterday."], [271.59, 274.91, "A, didn't. B, don't. C, wasn't."], [278.47, 280.48, "The answer is A: didn't."], [281.62, 283.46, "Did she go? blank"], [283.76, 288.4, "A, Yes, she did.. B, Yes, she went.. C, Yes, she does.."], [291.93, 293.82, "The answer is A: Yes, she did.."], [294.98, 296.62, "Which sentence is correct?"], [296.92, 301.7, "A, She didn't went home.. B, She didn't go home.. C, She not go home.."], [305.27, 307.82, "The answer is B: She didn't go home.."], [308.98, 312.2, "According to the reading, why didn't the writer watch TV?"], [312.5, 316.63, "A, I studied. B, I was ill. C, I slept."], [320.17, 322.03, "The answer is A: I studied."], [323.23, 326.47, "Part six: speaking. It's your turn to talk."], [327.32, 330.13, "Ask a friend one question with 'did' about yesterday."], [338.92, 340.5, "Now listen to Visal."], [340.8, 353.16, "Did you play football yesterday? My friend can answer: Yes, I did, or No, I didn't. I use did with the base verb play, not played. This is the correct way to make a question in the past simple."], [353.46, 355.28, "Excellent answer, Visal!"], [356.18, 362.73, "Great work! Now you can use eight new words and past questions and negatives: did and didn't plus base verb."], [363.02, 366.95, "Today's value is curiosity. Ask questions and find out."], [367.25, 369.47, "See you in Unit thirty. Goodbye!"], [369.77, 373.05, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit30-Countable-and-Uncountable-Nouns": [[0.35, 5.4, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.7, 9.19, "Hi! I'm Visal. Let's learn together!"], [9.49, 14.98, "Unit thirty: Countable and Uncountable Nouns. Today you will decide when to use many and much."], [15.28, 18.15, "Here is our lesson map. Let's start!"], [19.1, 22.4, "Part one: words. You will learn eight new words."], [23.25, 24.24, "Countable."], [25.25, 28.27, "Countable means something that we can count one by one."], [28.88, 30.29, "Apples are countable."], [30.88, 33.31, "Your turn. Say: Countable."], [36.17, 37.15, "Countable."], [37.88, 38.99, "Uncountable."], [39.98, 43.2, "Uncountable means something that we cannot count one by one."], [43.82, 45.27, "Water is uncountable."], [45.88, 48.5, "Your turn. Say: Uncountable."], [51.37, 52.51, "Uncountable."], [53.25, 54.0, "Many."], [54.98, 57.76, "Many means a large number of countable things."], [58.35, 59.73, "There are many books."], [60.35, 63.12, "Your turn. Say: Many."], [65.97, 66.82, "Many."], [67.58, 68.41, "Much."], [69.42, 72.07, "Much means a large amount of uncountable things."], [72.65, 74.09, "I don't have much time."], [74.68, 77.47, "Your turn. Say: Much."], [80.33, 81.14, "Much."], [81.88, 82.79, "Water."], [83.78, 86.25, "Water means the clear liquid that we drink."], [86.85, 88.11, "Drink a lot of water."], [88.72, 90.68, "Your turn. Say: Water."], [93.53, 94.31, "Water."], [95.05, 95.91, "Rice."], [96.92, 99.86, "Rice means small white grains that we cook and eat."], [100.45, 101.78, "We eat rice every day."], [102.38, 104.53, "Your turn. Say: Rice."], [107.37, 108.3, "Rice."], [109.05, 110.0, "Apples."], [111.02, 113.68, "Apples means round fruits that grow on trees."], [114.28, 115.91, "I bought five apples."], [116.52, 119.15, "Your turn. Say: Apples."], [122.0, 123.01, "Apples."], [123.75, 124.62, "A lot of."], [125.62, 128.89, "A lot of means a large number or amount of something."], [129.48, 130.98, "She has a lot of friends."], [131.58, 134.53, "Your turn. Say: A lot of."], [137.37, 138.34, "A lot of."], [139.13, 143.09, "Part two: dialogue. Let's listen to a conversation."], [143.95, 147.16, "Visal, can you count apples? Can you count water?"], [148.25, 157.74, "We can count apples: one apple, two apples. We cannot count water in the same way. So apples are countable and water is uncountable."], [158.85, 160.43, "How do many and much work?"], [161.52, 175.31, "Many is for countable nouns: many apples. Much is for uncountable nouns: much water. We use them mostly in questions and negatives: How many apples? I don't have much time."], [176.42, 178.37, "What about positive sentences?"], [179.48, 189.88, "In a positive sentence, we usually use a lot of with both: There are a lot of apples. I drink a lot of water. Uncountable nouns have no plural."], [191.03, 192.53, "Part three: grammar."], [193.38, 196.3, "Grammar focus: Many and much and a lot of."], [196.6, 197.82, "Look at the pattern."], [198.52, 200.07, "many apples (countable)"], [200.98, 202.77, "much water (uncountable)"], [203.68, 205.64, "a lot of rice (both types)"], [206.6, 214.84, "Use many with countable nouns and much with uncountable nouns, mostly in questions and negatives. Use a lot of in positive sentences with both."], [215.58, 218.91, "Be careful! Don't say: There are much books here."], [220.87, 222.99, "Say: There are many books here."], [223.29, 225.35, "Use many with countable nouns."], [226.17, 228.54, "Part four: reading. Read and listen."], [229.33, 230.54, "Counting Things."], [230.84, 233.61, "I have many friends, but I don't have much free time."], [234.6, 236.46, "How many apples are in the basket?"], [237.47, 240.02, "There is a lot of rice, but there isn't much water."], [241.03, 243.64, "We can count apples, but we cannot count water."], [244.63, 248.05, "Rice and water are uncountable, so they have no plural."], [249.13, 253.34, "Part five: quiz. Five questions. Are you ready?"], [254.18, 255.81, "How blank apples do you have?"], [256.11, 259.2, "A, much. B, many. C, a lot."], [262.73, 265.01, "The answer is B: many."], [266.15, 267.63, "I don't have blank time."], [267.93, 270.75, "A, much. B, many. C, few."], [274.3, 276.11, "The answer is A: much."], [277.25, 278.89, "Which noun is uncountable?"], [279.19, 282.27, "A, apple. B, book. C, rice."], [285.83, 287.87, "The answer is C: rice."], [289.02, 290.62, "Which sentence is correct?"], [290.92, 295.86, "A, There are much books.. B, There are many books.. C, There is many books.."], [299.4, 302.06, "The answer is B: There are many books.."], [303.22, 305.74, "According to the reading, what has no plural?"], [306.04, 309.84, "A, uncountable nouns. B, friends. C, apples."], [313.4, 315.78, "The answer is A: uncountable nouns."], [316.97, 320.17, "Part six: speaking. It's your turn to talk."], [321.02, 323.55, "Write one sentence with 'many' and one with 'much'."], [332.35, 333.85, "Now listen to Visal."], [334.15, 344.94, "I have many books in my room. I don't have much money in my bag. I use many with books because I can count them. I use much with money because it is uncountable in this sentence."], [345.24, 346.97, "Excellent answer, Visal!"], [347.88, 352.2, "Great work! Now you can use eight new words and many and much and a lot of."], [352.5, 356.51, "Today's value is precision. Choose your words and numbers with care."], [356.81, 359.74, "See you in Unit thirty-one. Goodbye!"], [360.04, 363.63, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit31-Comparatives-bigger-more-beautiful": [[0.35, 5.12, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.42, 8.96, "Hi! I'm Visal. Let's learn together!"], [9.26, 15.13, "Unit thirty-one: Comparatives (bigger / more beautiful). Today you will compare two people or things."], [15.44, 18.24, "Here is our lesson map. Let's start!"], [19.2, 22.48, "Part one: words. You will learn eight new words."], [23.32, 24.02, "Bigger."], [25.02, 27.17, "Bigger means larger than something else."], [27.78, 29.79, "An elephant is bigger than a horse."], [30.38, 32.66, "Your turn. Say: Bigger."], [35.5, 36.41, "Bigger."], [37.15, 37.95, "Taller."], [38.95, 41.18, "Taller means higher than something else."], [41.78, 43.13, "He is taller than me."], [43.72, 46.14, "Your turn. Say: Taller."], [49.0, 49.8, "Taller."], [50.55, 51.53, "Faster."], [52.52, 55.0, "Faster means quicker than something else."], [55.62, 57.51, "A car is faster than a bike."], [58.12, 60.88, "Your turn. Say: Faster."], [63.73, 64.59, "Faster."], [65.35, 66.51, "More beautiful."], [67.52, 70.61, "More beautiful means nicer to look at than something else."], [71.22, 73.05, "This park is more beautiful."], [73.65, 76.24, "Your turn. Say: More beautiful."], [79.1, 80.48, "More beautiful."], [81.25, 81.8, "Than."], [82.78, 85.29, "Than means a word used to compare two things."], [85.88, 87.14, "She is older than me."], [87.75, 89.87, "Your turn. Say: Than."], [92.73, 93.65, "Than."], [94.42, 95.2, "Better."], [96.18, 98.45, "Better means more good than something else."], [99.05, 100.91, "Today is better than yesterday."], [101.52, 104.18, "Your turn. Say: Better."], [107.03, 107.74, "Better."], [108.48, 109.43, "Worse."], [110.42, 112.9, "Worse means more bad than something else."], [113.52, 115.25, "The weather is worse today."], [115.85, 118.38, "Your turn. Say: Worse."], [121.23, 122.11, "Worse."], [122.85, 123.62, "Compare."], [124.62, 127.63, "Compare means to look at how two things are alike or different."], [128.22, 130.0, "Compare the two pictures."], [130.58, 133.56, "Your turn. Say: Compare."], [136.4, 137.31, "Compare."], [138.1, 141.74, "Part two: dialogue. Let's listen to a conversation."], [142.58, 145.06, "Visal, who is taller, you or your brother?"], [146.15, 155.7, "My brother is taller than me. We use comparatives to compare two things. A short adjective adds -er and than: tall, taller than."], [156.82, 158.54, "What about longer adjectives?"], [159.65, 170.77, "We use more before a long adjective: beautiful, more beautiful than. We do not say 'beautifuler'. Careful with the spelling: big, bigger; happy, happier."], [171.88, 173.56, "Are there special forms?"], [174.65, 185.0, "Yes. Good becomes better, and bad becomes worse. They are irregular, so remember them. We never say 'more better'. Than introduces the second thing."], [186.13, 187.59, "Part three: grammar."], [188.45, 193.58, "Grammar focus: Comparatives: adjective plus -er and more plus adjective plus than."], [193.88, 195.01, "Look at the pattern."], [195.72, 197.56, "My brother is taller than me."], [198.45, 200.95, "This park is more beautiful than that park."], [201.85, 203.79, "Today is better than yesterday."], [204.73, 212.26, "Short adjectives take -er, long adjectives take more, and good and bad become better and worse. Always use than to introduce the second thing."], [213.02, 216.84, "Be careful! Don't say: She is more tall than me."], [218.8, 221.12, "Say: She is taller than me."], [221.43, 223.32, "Use -er with short adjectives."], [224.13, 226.85, "Part four: reading. Read and listen."], [227.67, 228.78, "Which Is Bigger?."], [229.08, 231.13, "An elephant is bigger than a horse."], [232.13, 235.53, "A car is faster than a bike, but a bike is healthier."], [236.53, 239.18, "Angkor Wat is more beautiful than any picture of it."], [240.17, 242.33, "Today the weather is better than yesterday."], [243.33, 245.12, "We compare two things with than."], [246.23, 249.9, "Part five: quiz. Five questions. Are you ready?"], [250.75, 252.78, "A giraffe is blank than a dog."], [253.08, 256.42, "A, tall. B, taller. C, tallest."], [259.97, 261.72, "The answer is B: taller."], [262.88, 264.66, "This book is blank than that one."], [264.96, 269.19, "A, more interesting. B, interestinger. C, most interesting."], [272.73, 275.55, "The answer is A: more interesting."], [276.68, 279.25, "Today is blank than yesterday. (good)"], [279.55, 282.69, "A, gooder. B, better. C, more good."], [286.23, 287.94, "The answer is B: better."], [289.08, 290.72, "Which sentence is correct?"], [291.02, 296.52, "A, She is more tall than me.. B, She is taller than me.. C, She is taller that me.."], [300.07, 302.58, "The answer is B: She is taller than me.."], [303.72, 306.78, "According to the reading, what is healthier than a car?"], [307.08, 310.2, "A, a bike. B, a horse. C, a park."], [313.77, 315.42, "The answer is A: a bike."], [316.63, 320.13, "Part six: speaking. It's your turn to talk."], [320.98, 322.86, "Compare two animals using 'than'."], [331.65, 333.09, "Now listen to Visal."], [333.39, 345.86, "An elephant is bigger than a dog. A cheetah is faster than a cow. A dog is friendlier than a cat in my opinion. I use -er for short adjectives and than to compare two animals."], [346.16, 348.01, "Excellent answer, Visal!"], [348.92, 355.62, "Great work! Now you can use eight new words and comparatives: adjective plus -er and more plus adjective plus than."], [355.92, 360.72, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [361.02, 363.73, "See you in Unit thirty-two. Goodbye!"], [364.03, 366.82, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit32-Superlatives-the-biggest": [[0.35, 5.28, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.58, 9.0, "Hi! I'm Visal. Let's learn together!"], [9.3, 15.51, "Unit thirty-two: Superlatives (the biggest). Today you will say which thing is the most or the least."], [15.81, 18.44, "Here is our lesson map. Let's start!"], [19.4, 23.0, "Part one: words. You will learn eight new words."], [23.85, 24.83, "The biggest."], [25.82, 28.16, "The biggest means larger than all the others."], [28.75, 30.26, "It is the biggest city."], [30.85, 33.54, "Your turn. Say: The biggest."], [36.4, 37.48, "The biggest."], [38.22, 39.28, "The tallest."], [40.28, 42.67, "The tallest means higher than all the others."], [43.25, 44.88, "He is the tallest boy."], [45.48, 47.98, "Your turn. Say: The tallest."], [50.83, 51.96, "The tallest."], [52.72, 53.86, "The fastest."], [54.85, 57.35, "The fastest means quicker than all the others."], [57.95, 60.02, "A cheetah is the fastest animal."], [60.62, 63.4, "Your turn. Say: The fastest."], [66.23, 67.43, "The fastest."], [68.18, 69.56, "The most beautiful."], [70.55, 73.78, "The most beautiful means nicer to look at than all the others."], [74.38, 76.35, "It is the most beautiful temple."], [76.95, 79.78, "Your turn. Say: The most beautiful."], [82.63, 83.91, "The most beautiful."], [84.65, 85.59, "The best."], [86.58, 88.95, "The best means better than all the others."], [89.55, 91.05, "She is the best student."], [91.65, 94.69, "Your turn. Say: The best."], [97.53, 98.52, "The best."], [99.28, 100.2, "The worst."], [101.22, 103.44, "The worst means worse than all the others."], [104.05, 105.55, "That was the worst day."], [106.15, 108.66, "Your turn. Say: The worst."], [111.5, 112.34, "The worst."], [113.08, 114.04, "Of all."], [115.05, 117.55, "Of all means among everyone or everything."], [118.15, 119.72, "She is the kindest of all."], [120.32, 122.56, "Your turn. Say: Of all."], [125.4, 126.41, "Of all."], [127.15, 128.31, "Superlative."], [129.32, 133.43, "Superlative means the form that shows the highest or the lowest degree."], [134.02, 136.09, "The tallest is a superlative."], [136.68, 139.44, "Your turn. Say: Superlative."], [142.3, 143.41, "Superlative."], [144.2, 147.77, "Part two: dialogue. Let's listen to a conversation."], [148.62, 151.42, "Visal, who is the tallest person in your family?"], [152.52, 162.22, "My father is the tallest. We use the superlative to compare three or more things. Short adjectives take -est: tall, the tallest."], [163.32, 165.14, "What about long adjectives?"], [166.25, 177.34, "Use the most before a long adjective: the most beautiful, the most expensive. Good becomes the best, and bad becomes the worst. These are irregular."], [178.45, 179.61, "How do we say where?"], [180.72, 193.47, "We use in or of: the tallest in the class, the best of all. We always use the before a superlative. Spelling matters: big, the biggest; happy, the happiest."], [194.63, 196.2, "Part three: grammar."], [197.05, 202.14, "Grammar focus: Superlatives: the plus -est and the most plus adjective."], [202.44, 203.67, "Look at the pattern."], [204.38, 206.67, "My father is the tallest in my family."], [207.58, 209.94, "This is the most beautiful temple in town."], [210.85, 212.21, "She is the best of all."], [213.17, 221.88, "Use the + -est for short adjectives and the most + adjective for long ones. Good is the best and bad is the worst. Use in or of for the group."], [222.62, 226.07, "Be careful! Don't say: It is the most big city."], [228.03, 230.22, "Say: It is the biggest city."], [230.52, 232.98, "Use -est with short adjectives."], [233.77, 236.45, "Part four: reading. Read and listen."], [237.27, 238.74, "The Best and the Biggest."], [239.04, 241.71, "The cheetah is the fastest animal in the world."], [242.7, 245.05, "Phnom Penh is the biggest city in Cambodia."], [246.03, 248.5, "Angkor Wat is the most famous temple."], [249.5, 252.28, "My sister is the best student in her class."], [253.27, 255.1, "That was the worst storm of the year."], [256.2, 260.31, "Part five: quiz. Five questions. Are you ready?"], [261.15, 263.31, "She is the blank girl in the class."], [263.61, 266.63, "A, tall. B, taller. C, tallest."], [270.17, 271.95, "The answer is C: tallest."], [273.08, 275.01, "This is the blank beautiful temple."], [275.31, 278.15, "A, most. B, more. C, much."], [281.7, 283.37, "The answer is A: most."], [284.52, 285.98, "He is blank best player."], [286.28, 289.18, "A, a. B, the. C, an."], [292.73, 294.21, "The answer is B: the."], [295.35, 296.94, "Which sentence is correct?"], [297.24, 303.62, "A, It is the most big city.. B, It is the biggest city.. C, It is the bigest city.."], [307.17, 309.61, "The answer is B: It is the biggest city.."], [310.75, 314.38, "According to the reading, which city is the biggest in Cambodia?"], [314.68, 318.5, "A, Phnom Penh. B, Siem Reap. C, Battambang."], [322.07, 323.86, "The answer is A: Phnom Penh."], [325.07, 328.53, "Part six: speaking. It's your turn to talk."], [329.38, 331.88, "Who is the tallest person in your family?"], [340.68, 342.16, "Now listen to Visal."], [342.46, 356.83, "My uncle is the tallest person in my family. He is taller than my father and taller than all my cousins. I use the tallest because I compare more than two people, and I always use the before a superlative."], [357.13, 359.0, "Excellent answer, Visal!"], [359.92, 365.71, "Great work! Now you can use eight new words and superlatives: the plus -est and the most plus adjective."], [366.01, 369.48, "Today's value is pride in learning. Be proud of what you learned."], [369.78, 372.83, "See you in Unit thirty-three. Goodbye!"], [373.13, 376.67, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit33-Be-Going-To-plans": [[0.35, 5.27, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.57, 9.04, "Hi! I'm Visal. Let's learn together!"], [9.34, 15.45, "Unit thirty-three: Be Going To (plans). Today you will talk about plans for the future."], [15.75, 18.46, "Here is our lesson map. Let's start!"], [19.4, 22.63, "Part one: words. You will learn eight new words."], [23.48, 24.53, "Going to."], [25.52, 27.91, "Going to means used to talk about plans."], [28.52, 29.89, "I am going to study."], [30.48, 33.09, "Your turn. Say: Going to."], [35.93, 36.97, "Going to."], [37.72, 38.62, "Tomorrow."], [39.62, 41.71, "Tomorrow means the day after today."], [42.32, 43.88, "I am going to rest tomorrow."], [44.48, 46.73, "Your turn. Say: Tomorrow."], [49.57, 50.44, "Tomorrow."], [51.18, 52.28, "Next week."], [53.28, 55.56, "Next week means the week after this one."], [56.15, 58.07, "We are going to travel next week."], [58.68, 61.3, "Your turn. Say: Next week."], [64.17, 65.21, "Next week."], [65.95, 66.71, "Plan."], [67.72, 69.88, "Plan means an idea of what you will do."], [70.48, 72.08, "My plan is to study."], [72.68, 74.64, "Your turn. Say: Plan."], [77.5, 78.34, "Plan."], [79.08, 80.2, "I'm going to."], [81.22, 83.12, "I'm going to means I am going to."], [83.72, 85.17, "I'm going to cook dinner."], [85.78, 88.76, "Your turn. Say: I'm going to."], [91.6, 93.08, "I'm going to."], [93.82, 95.07, "She's going to."], [96.08, 98.22, "She's going to means she is going to."], [98.82, 100.47, "She's going to visit us."], [101.08, 104.14, "Your turn. Say: She's going to."], [107.0, 108.15, "She's going to."], [108.92, 110.23, "Not going to."], [111.22, 113.75, "Not going to means the negative of going to."], [114.35, 115.87, "I'm not going to be late."], [116.48, 119.62, "Your turn. Say: Not going to."], [122.47, 123.84, "Not going to."], [124.58, 125.24, "Soon."], [126.25, 128.2, "Soon means in a short time from now."], [128.82, 130.43, "The class begins soon."], [131.02, 133.5, "Your turn. Say: Soon."], [136.33, 137.3, "Soon."], [138.1, 141.97, "Part two: dialogue. Let's listen to a conversation."], [142.82, 144.92, "Visal, what are you going to do tomorrow?"], [146.02, 155.63, "I am going to visit my grandmother. We use am, is or are + going to + base verb for plans. She is going to cook. They are going to travel."], [156.72, 158.86, "How do we make negatives and questions?"], [159.95, 169.87, "Negative: I am not going to be late. Question: Are you going to come? What are you going to do? We answer: Yes, I am. No, I'm not."], [170.95, 172.49, "Which time words go with it?"], [173.58, 183.13, "Tomorrow, next week, soon and this weekend. In speech it sounds like gonna, but we write going to. It shows what we already decided."], [184.3, 185.86, "Part three: grammar."], [186.72, 189.97, "Grammar focus: Be going to plus base verb."], [190.27, 191.4, "Look at the pattern."], [192.08, 194.58, "I am going to visit my grandmother tomorrow."], [195.48, 197.22, "She is going to study next week."], [198.12, 199.78, "They are not going to play today."], [200.73, 208.32, "Use am / is / are + going to + base verb for plans. Negative
