    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Key Terms: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>
</head>

            <button onclick="switchTab('exam')" data-tab="exam" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📝 17. Gap Fill & Word Check</button>
            <button onclick="switchTab('challenge')" data-tab="challenge" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✍️ 18. Grammar Practice Challenge</button>
        </aside>

        <section id="content-area" class="bg-white rounded-2xl p-6 shadow-md md:col-span-3 flex flex-col justify-between" style="scroll-margin-top:12px;">

                <div class="flex gap-2">
                    <button onclick="completeActivity()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Finish Activity (+5 ⭐)</button>
                    <button onclick="nextLesson()" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Next Lesson ▶️</button>
                </div>

    </main>

    <script>
        let state = {
            level: 'A1',
            unit: 1,
            tab: 'learn',
            stars: 0,
            badges: 0
        };

        const curriculum = {"A1": {"1": {"title": "To Be (am/is/are)", "terms": ["Am", "Is", "Are", "I am", "You are", "He is", "She is", "They are"], "passage": "The verb 'to be' changes with the subject: I am happy. You are my friend. He is a student, and she is a teacher. They are at school together.", "question": "Write one sentence using 'am', one using 'is', and one using 'are'.", "funfact": "Did you know? 'To be' is one of the most irregular verbs in English, changing completely between am, is, are, was, and were."}, "2": {"title": "Present Simple", "terms": ["Every day", "Always", "Usually", "Play", "Work", "Study", "Sleep", "Habit"], "passage": "We use the present simple for a habit or routine. I play football every day. She usually works in the morning. They always study before dinner.", "question": "What is one thing you always do every day?", "funfact": "Did you know? In the present simple, we add -s or -es to the verb only with he, she, and it — not with I, you, we, or they."}, "3": {"title": "Articles (a/an/the)", "terms": ["A", "An", "The", "Apple", "Umbrella", "Book", "Specific", "General"], "passage": "We use 'a' before a consonant sound and 'an' before a vowel sound: a book, an apple, an umbrella. We use 'the' for something specific, like 'the book on the table'.", "question": "When do we use 'an' instead of 'a'?", "funfact": "Did you know? We choose 'a' or 'an' based on the sound of the next word, not just its first letter — 'an hour' sounds vowel-like even though 'hour' starts with H."}, "4": {"title": "Plural Nouns", "terms": ["Cat", "Cats", "Box", "Boxes", "Child", "Children", "Regular", "Irregular"], "passage": "Most nouns add -s to become plural, like cat becomes cats. Some add -es, like box becomes boxes. A few are irregular, like child becomes children.", "question": "What is the plural form of 'child'?", "funfact": "Did you know? Some English plurals, like 'sheep' and 'fish', stay exactly the same in singular and plural form."}, "5": {"title": "Possessives (my/your/his/her)", "terms": ["My", "Your", "His", "Her", "Our", "Their", "Belong", "Own"], "passage": "A possessive word shows who something belongs to. This is my book. Is that your pen? His name is Tom, and her name is Ana. Our teacher is kind, and their classroom is big.", "question": "Whose book is it? Try answering with 'my' or 'his'.", "funfact": "Did you know? Unlike many languages, English possessive words like 'his' and 'her' do not change based on the object's gender, only the owner's."}, "6": {"title": "Basic Prepositions (in/on/at)", "terms": ["In", "On", "At", "In the box", "On the table", "At school", "Location", "Place"], "passage": "We use 'in' for an enclosed space, like in the box. We use 'on' for a surface, like on the table. We use 'at' for a specific point, like at school or at home.", "question": "Where is your pen right now? Use 'in', 'on', or 'at'.", "funfact": "Did you know? English speakers say 'at night' but 'in the morning' — small preposition rules like this often need to simply be memorized."}, "7": {"title": "Negative Sentences (don't/doesn't)", "terms": ["Don't", "Doesn't", "Not", "Negative", "I don't", "She doesn't", "Never", "No"], "passage": "We use 'don't' with I, you, we, and they. We use 'doesn't' with he, she, and it. I don't like coffee. She doesn't eat meat.", "question": "Write one negative sentence using 'don't' and one using 'doesn't'.", "funfact": "Did you know? In English, we usually only need one negative word in a sentence, unlike some other languages."}, "8": {"title": "Yes/No Questions", "terms": ["Do you...?", "Does she...?", "Is it...?", "Are they...?", "Question mark", "Answer", "Yes, I do", "No, I don't"], "passage": "A yes/no question starts with 'do', 'does', 'is', or 'are'. Do you like tea? Does she work here? We answer with 'Yes, I do' or 'No, I don't'.", "question": "Ask a partner a yes/no question about their daily routine.", "funfact": "Did you know? In spoken English, we usually raise our voice (rising intonation) at the end of a yes/no question."}, "9": {"title": "WH-Questions (what/where/when)", "terms": ["What", "Where", "When", "Who", "Why", "How", "Question word", "Information"], "passage": "We use a WH-question word to ask for information. What is your name? Where do you live? When is your birthday? Who is your teacher?", "question": "Write three WH-questions to ask a new friend.", "funfact": "Did you know? WH-questions are named this way because most of the question words start with the letters W and H."}, "10": {"title": "This/That/These/Those", "terms": ["This", "That", "These", "Those", "Near", "Far", "Singular", "Plural"], "passage": "We use 'this' and 'these' for things that are near. We use 'that' and 'those' for things that are far. This book is mine. Those shoes are nice.", "question": "Point to something near you and something far away, and describe each one.", "funfact": "Did you know? 'This' and 'that' are for one thing (singular), while 'these' and 'those' are for more than one thing (plural)."}, "11": {"title": "There is / There are", "terms": ["There is", "There are", "A cat", "Some books", "Existence", "Singular noun", "Plural noun", "Location"], "passage": "We use 'there is' with a singular noun and 'there are' with a plural noun. There is a cat in the garden. There are three books on the table.", "question": "Describe your classroom using 'there is' and 'there are'.", "funfact": "Did you know? 'There is' is often shortened to 'there's' in spoken and informal written English."}, "12": {"title": "Adjectives (basic)", "terms": ["Big", "Small", "Happy", "Sad", "Beautiful", "Describe", "Noun", "Quality"], "passage": "An adjective describes a noun. A big house. A happy child. A beautiful flower. Adjectives usually come before the noun in English.", "question": "Describe your best friend using three different adjectives.", "funfact": "Did you know? In English, adjectives don't change form for singular or plural nouns, unlike in many other languages."}, "13": {"title": "Adverbs of Frequency", "terms": ["Always", "Usually", "Sometimes", "Rarely", "Never", "Often", "How often", "Routine"], "passage": "An adverb of frequency tells us how often something happens. I always brush my teeth. She sometimes walks to school. He never eats breakfast.", "question": "Write two sentences about your routine using adverbs of frequency.", "funfact": "Did you know? Adverbs of frequency usually go before the main verb but after the verb 'to be'."}, "14": {"title": "Can / Can't (ability)", "terms": ["Can", "Can't", "Ability", "Swim", "Cook", "Speak", "Possible", "Impossible"], "passage": "We use 'can' to talk about ability. I can swim. She can speak French. We use 'can't' for something we are not able to do. He can't drive yet.", "question": "Write two things you can do and two things you can't do.", "funfact": "Did you know? 'Can' is a modal verb, so it never changes form — we never say 'cans' or 'canning'."}, "15": {"title": "Object Pronouns (me/him/her)", "terms": ["Me", "Him", "Her", "Us", "Them", "It", "Subject", "Object"], "passage": "An object pronoun replaces a noun after a verb. She likes me. I saw him yesterday. We invited her to the party. They helped us.", "question": "Write a sentence using the object pronoun 'them'.", "funfact": "Did you know? English has different pronouns for the subject (I, he, she) and the object (me, him, her) of a sentence."}, "16": {"title": "Numbers & Quantities (some/any)", "terms": ["Some", "Any", "How many", "How much", "A few", "A little", "Quantity", "Countable"], "passage": "We use 'some' in positive sentences and 'any' in negative sentences and questions. I have some apples. I don't have any bananas. Do you have any bread?", "question": "Write one sentence with 'some' and one with 'any'.", "funfact": "Did you know? 'Some' and 'any' can be used with both countable nouns (apples) and uncountable nouns (water)."}, "17": {"title": "Time Expressions (at/on/in)", "terms": ["At", "On", "In", "Time", "Day", "Month", "At 3 o'clock", "On Monday"], "passage": "We use 'at' for exact times, 'on' for days and dates, and 'in' for months, years, and longer periods. I wake up at 7am. We meet on Monday. School starts in September.", "question": "Write three sentences about your schedule using 'at', 'on', and 'in'.", "funfact": "Did you know? English speakers often make small mistakes with these prepositions, even after years of study — they take real practice!"}, "18": {"title": "Imperatives (commands)", "terms": ["Stop", "Go", "Sit down", "Please", "Command", "Instruction", "Don't touch", "Listen"], "passage": "An imperative gives a command or instruction, using the base form of the verb. Sit down, please. Don't touch that. Listen carefully.", "question": "Write three classroom instructions using the imperative form.", "funfact": "Did you know? Imperative sentences usually don't need a subject — we don't say 'You sit down', just 'Sit down'."}, "19": {"title": "Basic Conjunctions (and/but/or)", "terms": ["And", "But", "Or", "Connect", "Join", "Choice", "Contrast", "Addition"], "passage": "We use 'and' to add information, 'but' to show contrast, and 'or' to show a choice. I like tea and coffee. I'm tired but happy. Do you want tea or coffee?", "question": "Write one sentence using 'and', one using 'but', and one using 'or'.", "funfact": "Did you know? 'And', 'but', and 'or' are called coordinating conjunctions because they connect two equal parts of a sentence."}, "20": {"title": "Have / Has (possession)", "terms": ["Have", "Has", "Brother", "Sister", "Pet", "Bike", "Don't have", "Doesn't have"], "passage": "I have a brother and a sister. My brother has a bike, but he doesn't have a pet. I don't have a bike, but I have a pet cat. We use 'has' with he, she and it.", "question": "What do you have in your school bag?", "funfact": "Did you know? In British English, people often say 'have got' — 'I've got a bike' means the same as 'I have a bike'."}, "21": {"title": "Likes and Dislikes (like + -ing)", "terms": ["Like", "Love", "Hate", "Don't like", "Swimming", "Reading", "Dancing", "Playing"], "passage": "I like swimming and I love reading. My sister likes dancing, but she doesn't like playing football. My brother hates getting up early!", "question": "What do you like doing at the weekend?", "funfact": "Did you know? After 'like', 'love' and 'hate', we usually use the -ing form: 'I like reading'."}, "22": {"title": "Ordinal Numbers and Dates", "terms": ["First", "Second", "Third", "Tenth", "Twentieth", "Date", "Birthday", "Month"], "passage": "My birthday is on the third of June. The first day of school is the second of October. Khmer New Year is usually in April — the fourth month of the year.", "question": "When is your birthday?", "funfact": "Did you know? We write dates like '3rd June' but say 'the third of June'."}, "23": {"title": "Prepositions of Place", "terms": ["Next to", "Between", "Behind", "In front of", "Under", "Opposite", "Near", "Above"], "passage": "The bank is next to the market and opposite the school. My house is between a shop and a café. There is a tree in front of my house, and a clock above the door.", "question": "Where is your school? Use two prepositions.", "funfact": "Did you know? 'In front of' and 'behind' are opposites, and 'between' needs two things."}, "24": {"title": "Let's (suggestions)", "terms": ["Let's", "Suggestion", "Go", "Play", "Eat", "Watch", "Good idea", "Why not"], "passage": "It's hot today. Let's go to the pool! Let's eat ice cream after. — Good idea! Let's watch a film tonight too. Why not?", "question": "Make a suggestion for this weekend using 'Let's'.", "funfact": "Did you know? 'Let's' is short for 'let us', and we use it with the base verb: 'Let's play'."}, "25": {"title": "Present Continuous (am/is/are + -ing)", "terms": ["Now", "At the moment", "Am reading", "Is running", "Are playing", "Look!", "Listen!", "-ing"], "passage": "We use the present continuous for actions happening now. I am reading a book. She is running in the park. They are playing football at the moment.", "question": "What are you doing right now?", "funfact": "Did you know? Verbs like 'know' and 'love' are not normally used in the present continuous, even for feelings happening now."}, "26": {"title": "Was / Were (past of to be)", "terms": ["Was", "Were", "Yesterday", "Last week", "I was", "They were", "Wasn't", "Weren't"], "passage": "Was and were are the past of am, is and are. I was at home yesterday. She was tired. They were at school last week. We weren't late.", "question": "Where were you yesterday?", "funfact": "Did you know? 'Be' is the only English verb that has two different past forms: was and were."}, "27": {"title": "Past Simple (regular verbs)", "terms": ["Yesterday", "Walked", "Played", "Watched", "Studied", "Last night", "Ago", "Finished"], "passage": "We add -ed to regular verbs to talk about finished actions in the past. I walked to school yesterday. She played football last night. We studied English two hours ago.", "question": "What did you do yesterday?", "funfact": "Did you know? The ending -ed has three different sounds: /t/ in walked, /d/ in played, and /ɪd/ in wanted."}, "28": {"title": "Past Simple (irregular verbs)", "terms": ["Went", "Saw", "Ate", "Had", "Took", "Came", "Irregular", "Past form"], "passage": "Many common verbs are irregular, so they do not take -ed. Go becomes went, see becomes saw, and eat becomes ate. I went to the market and saw my friend.", "question": "Write two sentences about last weekend using irregular past verbs.", "funfact": "Did you know? Many of the most common English verbs, such as go, have and take, are irregular."}, "29": {"title": "Past Simple Questions and Negatives", "terms": ["Did", "Didn't", "Did you...?", "Yes, I did", "No, I didn't", "Base verb", "Yesterday", "Ago"], "passage": "We use did and didn't with the base verb. Did you watch TV? Yes, I did. I didn't eat breakfast. She didn't go to school yesterday.", "question": "Ask a friend one question with 'did' about yesterday.", "funfact": "Did you know? After did and didn't, the main verb goes back to its base form: 'Did she go?' not 'Did she went?'."}, "30": {"title": "Countable and Uncountable Nouns", "terms": ["Countable", "Uncountable", "Many", "Much", "Water", "Rice", "Apples", "A lot of"], "passage": "We can count some nouns: one apple, two apples. We cannot count others, like water and rice. We say many apples but much water. We can say a lot of with both.", "question": "Write one sentence with 'many' and one with 'much'.", "funfact": "Did you know? Information is uncountable in English, so we say 'some information', not 'an information'."}, "31": {"title": "Comparatives (bigger / more beautiful)", "terms": ["Bigger", "Taller", "Faster", "More beautiful", "Than", "Better", "Worse", "Compare"], "passage": "We use comparatives to compare two things. A short adjective adds -er: Tom is taller than Sam. A long adjective uses more: This park is more beautiful than that one. Good becomes better.", "question": "Compare two animals using 'than'.", "funfact": "Did you know? The adjectives good and bad are irregular: better and worse, not 'gooder' or 'badder'."}, "32": {"title": "Superlatives (the biggest)", "terms": ["The biggest", "The tallest", "The fastest", "The most beautiful", "The best", "The worst", "Of all", "Superlative"], "passage": "We use superlatives to compare three or more things. Add -est to short adjectives: She is the tallest girl. Use most with long adjectives: This is the most beautiful temple.", "question": "Who is the tallest person in your family?", "funfact": "Did you know? We nearly always put 'the' before a superlative: the best, the fastest, the most famous."}, "33": {"title": "Be Going To (plans)", "terms": ["Going to", "Tomorrow", "Next week", "Plan", "I'm going to", "She's going to", "Not going to", "Soon"], "passage": "We use be going to for plans in the future. I am going to visit my grandmother tomorrow. She is going to study next week. They are not going to play football today.", "question": "What are you going to do this weekend?", "funfact": "Did you know? In fast speech, 'going to' often sounds like 'gonna', but we write 'going to'."}, "34": {"title": "Want, Need and Would Like", "terms": ["Want", "Need", "Would like", "I'd like", "Please", "Offer", "Request", "Polite"], "passage": "Want, need and would like are followed by a noun or to + verb. I want a drink. You need to sleep. I would like some water, please. Would you like tea?", "question": "Write a polite sentence with 'would like'.", "funfact": "Did you know? 'Would like' is more polite than 'want', so we use it in shops and restaurants."}, "35": {"title": "Adverbs of Manner", "terms": ["Quickly", "Slowly", "Carefully", "Well", "Badly", "Loudly", "Quietly", "Manner"], "passage": "An adverb of manner tells us how someone does something. Most adverbs add -ly to an adjective. She walks slowly. He speaks quietly. The adjective good becomes the adverb well.", "question": "Write one sentence about how you walk or speak.", "funfact": "Did you know? 'Fast' and 'hard' are special: the adverb has the same form as the adjective."}, "36": {"title": "Prepositions of Movement", "terms": ["To", "From", "Into", "Out of", "Across", "Through", "Up", "Down"], "passage": "Prepositions of movement show direction. I walk to school. She comes from Siem Reap. The boy runs into the room and out of the garden. We walk across the bridge and through the park.", "question": "Describe your journey to school using two prepositions of movement.", "funfact": "Did you know? We say 'go to school' without 'the', but 'go to the market' with 'the'."}, "37": {"title": "Whose and Possessive 's", "terms": ["Whose", "Possessive 's", "Tom's book", "The girl's bag", "Mine", "Yours", "Owner", "Belongs to"], "passage": "We use 's to show who owns something. This is Tom's book. That is the girl's bag. We ask Whose bag is this? and answer It is mine, or It is yours.", "question": "Whose pen is on your desk? Answer with 's or mine.", "funfact": "Did you know? 'Whose' sounds the same as 'who's', but they have different meanings."}, "38": {"title": "Can, Could and May (requests)", "terms": ["Can I...?", "Could you...?", "May I...?", "Please", "Sure", "Sorry, I can't", "Request", "Permission"], "passage": "We ask politely with can, could and may. Can I open the window? Could you help me, please? May I come in? We answer Sure, or Sorry, I can't.", "question": "Ask your teacher a polite question with 'could'.", "funfact": "Did you know? 'May I' is the most polite way to ask for permission, and 'Can I' is the most common."}, "39": {"title": "Review: A1 Grammar", "terms": ["Am / is / are", "Present simple", "Can", "There is", "Question", "Negative", "Plural", "Sentence"], "passage": "In A1 we learned am, is and are, the present simple, can, and there is / there are. We can make a question and a negative, use plural nouns and build a full sentence.", "question": "Which A1 grammar point is easiest for you now?", "funfact": "Did you know? Most everyday English conversations use the A1 grammar you already know!"}}, "A2": {"1": {"title": "Past Simple", "terms": ["Yesterday", "Last week", "Went", "Played", "Watched", "Ago", "Regular verb", "Irregular verb"], "passage": "We use the past simple for a finished action. I played football yesterday. She watched a movie last week. He went to the market two days ago.", "question": "What did you do yesterday? Use the past simple.", "funfact": "Did you know? Regular past simple verbs end in -ed, but irregular verbs like 'go' change completely, becoming 'went'."}, "2": {"title": "Present Continuous", "terms": ["Now", "Right now", "Am doing", "Is doing", "Are doing", "Currently", "Action", "Happening"], "passage": "We use the present continuous for an action happening right now. I am studying now. She is cooking dinner. They are playing outside at this moment.", "question": "What are you doing right now?", "funfact": "Did you know? Some verbs, like 'know' and 'love', are rarely used in the continuous form because they describe a state, not an action."}, "3": {"title": "Comparatives & Superlatives", "terms": ["Bigger", "Biggest", "Faster", "Fastest", "More beautiful", "Most beautiful", "Than", "Compare"], "passage": "We use a comparative to compare two things: This car is faster than that one. We use a superlative for the most extreme: This is the fastest car in the race.", "question": "Compare two things you own using a comparative form.", "funfact": "Did you know? Short adjectives usually add -er/-est, but longer adjectives use 'more' and 'most' instead, like 'more beautiful'."}, "4": {"title": "Countable & Uncountable Nouns", "terms": ["Countable", "Uncountable", "Some", "Any", "Much", "Many", "Water", "Apples"], "passage": "A countable noun, like apples, can be counted: three apples. An uncountable noun, like water, cannot: we say 'some water', not 'three waters'. We use 'many' with countable and 'much' with uncountable nouns.", "question": "Is 'rice' countable or uncountable? Give an example sentence.", "funfact": "Did you know? Some nouns, like 'coffee', can be both countable and uncountable depending on meaning — 'coffee' as a drink, or 'two coffees' as two cups."}, "5": {"title": "Modal Verbs (can/must/should)", "terms": ["Can", "Must", "Should", "Ability", "Obligation", "Advice", "Permission", "Necessary"], "passage": "We use 'can' for ability or permission: I can swim. We use 'must' for a strong obligation: You must wear a seatbelt. We use 'should' for advice: You should sleep early.", "question": "Give one piece of advice using 'should'.", "funfact": "Did you know? 'Must' expresses a stronger obligation than 'should', which is why traffic laws use 'must', not 'should'."}, "6": {"title": "Future with 'going to'", "terms": ["Going to", "Plan", "Intention", "Tomorrow", "Next week", "Decide", "Prepare", "Future"], "passage": "We use 'going to' for a plan or intention already decided. I am going to visit my grandmother tomorrow. She is going to study abroad next year.", "question": "What are you going to do next week?", "funfact": "Did you know? 'Going to' is often used for a planned future, while 'will' is often used for a sudden decision made at the moment of speaking."}, "7": {"title": "Past Continuous (basic)", "terms": ["Was", "Were", "-ing", "Interrupted", "While", "When", "Background action", "Past moment"], "passage": "We use the past continuous for an action in progress at a past moment. I was watching TV when she called. They were playing while it started to rain.", "question": "Write a sentence about what you were doing yesterday at 8pm.", "funfact": "Did you know? The past continuous is often used together with the past simple to show one action interrupting another."}, "8": {"title": "Adverbs of Manner", "terms": ["Quickly", "Slowly", "Carefully", "Well", "Badly", "-ly ending", "How", "Manner"], "passage": "An adverb of manner tells us how an action happens, often ending in -ly. She speaks quickly. He drives carefully. They played well together.", "question": "Write two sentences describing how you do something, using adverbs of manner.", "funfact": "Did you know? The adverb form of 'good' is irregular — it becomes 'well', not 'goodly'."}, "9": {"title": "Comparative Structures (as...as)", "terms": ["As...as", "Equal", "Comparison", "Not as...as", "Same", "Different", "Height", "Speed"], "passage": "We use 'as...as' to compare two things that are equal. She is as tall as her brother. This bag is not as heavy as that one.", "question": "Compare yourself to a friend using 'as...as'.", "funfact": "Did you know? 'As...as' comparisons are considered more neutral than comparative adjectives like 'taller' or 'shorter'."}, "10": {"title": "Question Tags (basic)", "terms": ["Isn't it?", "Don't you?", "Question tag", "Agreement", "Confirmation", "Positive", "Negative", "Checking"], "passage": "A question tag checks information or asks for agreement. It's cold, isn't it? You like pizza, don't you? A positive sentence gets a negative tag.", "question": "Write a sentence with a question tag to check something with a friend.", "funfact": "Did you know? Question tag intonation can change the meaning — rising intonation asks a real question, falling intonation just checks agreement."}, "11": {"title": "Verb + -ing vs Infinitive", "terms": ["Enjoy + -ing", "Want + to", "Gerund", "Infinitive", "Like", "Decide", "Avoid", "Hope"], "passage": "Some verbs are followed by -ing (enjoy swimming), and some by an infinitive with 'to' (want to swim). Learning which pattern to use takes practice.", "question": "Write one sentence with a verb followed by -ing and one with an infinitive.", "funfact": "Did you know? Some verbs, like 'like' and 'start', can be followed by either form with almost no change in meaning."}, "12": {"title": "Prepositions of Movement", "terms": ["Into", "Onto", "Through", "Across", "Along", "Towards", "Movement", "Direction"], "passage": "Prepositions of movement show direction. She walked into the room. He jumped onto the table. They walked through the park and across the bridge.", "question": "Describe a short journey using at least three prepositions of movement.", "funfact": "Did you know? Prepositions of movement are especially important when giving someone directions in a new city."}, "13": {"title": "Present Perfect (introduction)", "terms": ["Have", "Has", "Ever", "Never", "Already", "Yet", "Experience", "Past participle"], "passage": "We use the present perfect for life experience or a recent action. I have visited Japan. She has never eaten sushi. Have you finished yet?", "question": "Write a sentence about something you have never done.", "funfact": "Did you know? The present perfect connects the past to the present — it's used when the exact time isn't the main focus."}, "14": {"title": "Zero Conditional", "terms": ["If", "Always true", "General fact", "Water boils", "Scientific fact", "Cause and effect", "Present simple", "Rule"], "passage": "The zero conditional describes something always true. If you heat water, it boils. If it rains, the ground gets wet. Both clauses use the present simple.", "question": "Write a zero conditional sentence about a scientific fact you know.", "funfact": "Did you know? The zero conditional is used for facts, rules, and things that are always true, not just possibilities."}, "15": {"title": "Too / Enough", "terms": ["Too", "Enough", "Too much", "Too many", "Not enough", "Sufficient", "Excessive", "Adjective + enough"], "passage": "'Too' means more than needed, and 'enough' means a sufficient amount. This coffee is too hot. I don't have enough money. She is old enough to drive.", "question": "Write one sentence with 'too' and one with 'enough'.", "funfact": "Did you know? 'Enough' comes after an adjective (old enough) but before a noun (enough money) — the word order changes!"}, "16": {"title": "Used to (past habits)", "terms": ["Used to", "Past habit", "No longer", "Change", "Habit", "Routine", "Before", "Now"], "passage": "We use 'used to' for past habits that no longer happen. I used to play football every weekend. She used to live in Paris, but now she lives here.", "question": "Write a sentence about something you used to do as a child.", "funfact": "Did you know? 'Used to' is only for the past — to talk about a present habit, we simply use the present simple instead."}, "17": {"title": "Would like / Want", "terms": ["Would like", "Want", "Polite", "Request", "Wish", "I'd like", "Offer", "Preference"], "passage": "'Would like' is a more polite way to say 'want'. I want a coffee sounds direct, while I would like a coffee, please sounds more polite.", "question": "Write a polite request using 'would like' at a restaurant.", "funfact": "Did you know? 'Would like' is often shortened to 'I'd like' in everyday spoken English."}, "18": {"title": "So / Neither", "terms": ["So am I", "Neither do I", "Agreement", "Also", "Me too", "Me neither", "Positive agreement", "Negative agreement"], "passage": "We use 'so' to agree with a positive statement and 'neither' to agree with a negative one. I'm tired. So am I. I don't like coffee. Neither do I.", "question": "Practice agreeing with a partner's sentence using 'so' or 'neither'.", "funfact": "Did you know? After 'so' and 'neither', the subject and auxiliary verb switch places, just like in a question!"}, "19": {"title": "Indefinite Pronouns (someone/anything)", "terms": ["Someone", "Anyone", "Something", "Anything", "Nobody", "Nothing", "Everyone", "Everything"], "passage": "Indefinite pronouns refer to people or things without naming them. Someone called you. Is anyone home? I didn't see anything unusual.", "question": "Write a sentence using 'someone' and a sentence using 'nothing'.", "funfact": "Did you know? We usually use 'some-' words in positive sentences and 'any-' words in negatives and questions, just like some and any."}, "20": {"title": "Past Simple Questions and Negatives", "terms": ["Did", "Didn't", "Go", "Went", "Yesterday", "Question", "Negative", "Answer"], "passage": "Did you go to school yesterday? Yes, I did. I went by bus. My brother didn't go — he was sick. In questions and negatives, we use 'did' or 'didn't' with the base verb.", "question": "What did you do last weekend? What didn't you do?", "funfact": "Did you know? After 'did' and 'didn't' we use the base verb: 'Did you go?' not 'Did you went?'"}, "21": {"title": "Will (predictions, offers, promises)", "terms": ["Will", "Won't", "Predict", "Offer", "Promise", "Future", "Probably", "I'll"], "passage": "I think it will rain tomorrow. That bag looks heavy — I'll help you! I promise I won't be late. People will probably use more electric cars in the future.", "question": "Make one prediction and one promise with 'will'.", "funfact": "Did you know? 'Won't' is the short form of 'will not'."}, "22": {"title": "Possessive Pronouns", "terms": ["Mine", "Yours", "His", "Hers", "Ours", "Theirs", "Whose", "Belong"], "passage": "Whose pen is this? It's mine. Is that bag yours? No, it's hers. The red car is ours, and the blue one is theirs. These things belong to different people.", "question": "Point to three things and say who they belong to.", "funfact": "Did you know? Possessive pronouns replace a noun: 'This book is mine' instead of 'This is my book'."}, "23": {"title": "Should / Shouldn't (advice)", "terms": ["Should", "Shouldn't", "Advice", "Tired", "Sleep", "Exercise", "Doctor", "Healthy"], "passage": "You look tired. You should go to bed early. You shouldn't use your phone late at night. If you feel sick, you should see a doctor. Healthy habits are good advice!", "question": "Give a friend advice about studying for a test.", "funfact": "Did you know? 'Should' is softer than 'must' — it gives advice, not a rule."}, "24": {"title": "Present Perfect with Ever / Never", "terms": ["Ever", "Never", "Have been", "Have tried", "Experience", "Before", "Once", "Twice"], "passage": "Have you ever been to Siem Reap? Yes, I have been there twice. Have you ever tried durian? No, I've never tried it before! We use 'ever' and 'never' to talk about life experience.", "question": "What have you never done but want to try?", "funfact": "Did you know? We don't use a finished time with the present perfect: 'I have been there' — not 'I have been there last year'."}, "25": {"title": "Present Perfect with For / Since", "terms": ["For", "Since", "Have lived", "Has worked", "Period of time", "Starting point", "Still", "So far"], "passage": "We use for with a period of time and since with a starting point. I have lived here for five years. She has worked at the school since 2020. They have studied English for two months, and they still study it.", "question": "How long have you studied English? Use for or since.", "funfact": "Did you know? We say 'for two hours' but 'since two o'clock': for measures the length, and since names the start."}, "26": {"title": "Present Perfect vs Past Simple", "terms": ["Finished time", "Unfinished time", "Yesterday", "Last year", "Just", "Recently", "Result now", "Experience"], "passage": "We use the past simple with a finished time: I visited Siem Reap last year. We use the present perfect when the time is not important or still continues: I have visited Siem Reap twice. I have just finished my homework.", "question": "Write one sentence in the past simple and one in the present perfect.", "funfact": "Did you know? We cannot use 'yesterday' or 'last year' with the present perfect, because they name a finished time."}, "27": {"title": "First Conditional (if + will)", "terms": ["If", "Will", "Won't", "Real possibility", "Present simple", "Future result", "Unless", "Might"], "passage": "We use the first conditional for real possibilities in the future. If it rains tomorrow, we will stay at home. If you study hard, you will pass the test. We won't go out unless the weather is good.", "question": "What will you do if it rains this weekend?", "funfact": "Did you know? After 'if' we use the present simple, not 'will': we say 'If it rains', not 'If it will rain'."}, "28": {"title": "Relative Clauses (who / which / that)", "terms": ["Who", "Which", "That", "Relative pronoun", "Person", "Thing", "Extra information", "Defining clause"], "passage": "We use who for people and which for things. That can be used for both. The man who lives next door is a doctor. The book which I bought is very interesting. This is the bag that I lost.", "question": "Describe a person or thing using who, which or that.", "funfact": "Did you know? In everyday English we can leave out 'that' when it is the object: 'the book I bought'."}, "29": {"title": "Reflexive Pronouns (myself / yourself)", "terms": ["Myself", "Yourself", "Himself", "Herself", "Ourselves", "Themselves", "Reflexive", "By myself"], "passage": "We use a reflexive pronoun when the subject and the object are the same person. I cut myself. She looked at herself in the mirror. They enjoyed themselves. We can also say by myself to mean alone.", "question": "Write a sentence using 'myself' or 'yourself'.", "funfact": "Did you know? 'Yourself' is singular, but 'yourselves' is used when we speak to more than one person."}, "30": {"title": "Have to / Don't have to", "terms": ["Have to", "Has to", "Don't have to", "Doesn't have to", "Obligation", "No obligation", "Rule", "Necessary"], "passage": "We use have to for rules or things that are necessary. I have to wear a uniform. She has to get up early. We use don't have to when something is not necessary. You don't have to pay.", "question": "What do you have to do at school? What don't you have to do?", "funfact": "Did you know? 'Must not' and 'don't have to' are very different: must not means forbidden, but don't have to means optional."}, "31": {"title": "Passive Voice (is made / was built)", "terms": ["Passive", "Is made", "Are made", "Was built", "Were built", "By", "Object", "Agent"], "passage": "We use the passive when the action is more important than the person who did it. Rice is grown in Cambodia. This temple was built a long time ago. These shoes were made in a factory.", "question": "Write one sentence about something that is made or was built.", "funfact": "Did you know? We use 'by' only if the agent is important: 'The book was written by a famous author'."}, "32": {"title": "Reported Speech (introduction)", "terms": ["Said", "Told", "Reported speech", "Direct speech", "Backshift", "That", "Yesterday", "The next day"], "passage": "We use reported speech to say what someone else said. Direct speech: She said, 'I am tired.' Reported speech: She said that she was tired. We often move the tense one step back.", "question": "Tell a friend what your teacher said today.", "funfact": "Did you know? We use 'told' with a person (She told me) but 'said' without one (She said that)."}, "33": {"title": "Adjective + Preposition", "terms": ["Interested in", "Good at", "Afraid of", "Worried about", "Proud of", "Different from", "Excited about", "Angry with"], "passage": "Many adjectives are followed by a fixed preposition. I am interested in music. She is good at maths. He is afraid of dogs. We are proud of our school and excited about the trip.", "question": "Write a sentence with 'interested in' and one with 'good at'.", "funfact": "Did you know? The preposition after 'different' is usually 'from' in formal English, but 'to' is also common in British English."}, "34": {"title": "Phrasal Verbs (basic)", "terms": ["Get up", "Turn on", "Turn off", "Look for", "Put on", "Take off", "Give up", "Come back"], "passage": "A phrasal verb is a verb with a small word like up or off. I get up at six. Please turn on the light. She looks for her keys. Don't give up! Put on your coat when it is cold.", "question": "Write two sentences with phrasal verbs.", "funfact": "Did you know? Many phrasal verbs have a meaning that is different from their separate words, like 'give up' meaning stop trying."}, "35": {"title": "Adverbs of Degree (very / quite / really)", "terms": ["Very", "Quite", "Really", "Extremely", "A bit", "Too", "Enough", "Completely"], "passage": "Adverbs of degree show how strong something is. The film was very good and quite long. I am really tired. The soup is a bit hot. The exam was extremely difficult, but we were not completely lost.", "question": "Describe your day with two adverbs of degree.", "funfact": "Did you know? 'Quite' means 'fairly' in British English, but in American English it can mean 'very'."}, "36": {"title": "Time Clauses (when / while / before / after)", "terms": ["When", "While", "Before", "After", "As soon as", "Until", "Time clause", "Present simple"], "passage": "A time clause tells us when something happens. When I get home, I do my homework. I listen to music while I cook. Before we eat, we wash our hands. After the class finishes, we go home.", "question": "Write two sentences with 'when' or 'before'.", "funfact": "Did you know? In a future time clause we use the present simple: 'When I arrive, I will call you', not 'When I will arrive'."}, "37": {"title": "Be Able To", "terms": ["Be able to", "Was able to", "Will be able to", "Ability", "Manage to", "Can't", "Couldn't", "Future ability"], "passage": "Be able to means the same as can, but it works in more tenses. I am able to swim. She was able to finish the test. We will be able to travel next year. He wasn't able to come.", "question": "What will you be able to do next year?", "funfact": "Did you know? We cannot use 'can' for the future, so we use 'will be able to' instead."}, "38": {"title": "Linking Words (because / so / although)", "terms": ["Because", "So", "Although", "However", "Reason", "Result", "Contrast", "But"], "passage": "Linking words join ideas. Because gives a reason: I stayed at home because I was ill. So gives a result: I was ill, so I stayed at home. Although and however show contrast: Although it was cold, we went out.", "question": "Write one sentence with 'because' and one with 'although'.", "funfact": "Did you know? We never use 'although' and 'but' together in the same sentence."}, "39": {"title": "Review: A2 Grammar", "terms": ["Past simple", "Present continuous", "Going to", "Comparatives", "Present perfect", "Modals", "Conditional", "Review"], "passage": "In A2 we learned the past simple, present continuous, going to, comparatives, the present perfect, modals and the zero conditional. This review helps you use them together.", "question": "Which A2 grammar point do you want to practise more?", "funfact": "Did you know? Mixing tenses correctly in one story is a sign you are ready for B1!"}}, "B1": {"1": {"title": "Present Perfect", "terms": ["Have done", "Has done", "Already", "Yet", "Ever", "Never", "Experience", "Since"], "passage": "We use the present perfect to connect the past to the present. I have already finished my homework. Have you ever visited Japan? She has never eaten sushi before.", "question": "Have you ever traveled to another country? Answer using the present perfect.", "funfact": "Did you know? The present perfect has no exact equivalent in many languages, which is part of why it can feel tricky for English learners to master."}, "2": {"title": "Past Continuous", "terms": ["Was doing", "Were doing", "While", "When", "Interrupted", "In progress", "Background", "Ongoing"], "passage": "We use the past continuous for an action in progress in the past, often interrupted by another event. I was cooking dinner when the phone rang. They were watching TV while it was raining.", "question": "What were you doing yesterday at 8pm?", "funfact": "Did you know? The past continuous is often paired with the past simple to show one longer, ongoing action interrupted by a shorter one."}, "3": {"title": "First Conditional", "terms": ["If", "Will", "Real possibility", "Condition", "Result", "Likely", "Future outcome", "Rule"], "passage": "We use the first conditional for a real, likely future possibility. If it rains, I will stay home. If you study hard, you will pass the exam.", "question": "Complete this sentence: If I have free time this weekend, I will...", "funfact": "Did you know? The first conditional describes situations we genuinely believe could happen, unlike the more hypothetical second conditional."}, "4": {"title": "Relative Clauses", "terms": ["Who", "Which", "That", "Where", "Whose", "Defining clause", "Extra information", "Connect"], "passage": "A relative clause adds information about a noun. The man who called is my uncle. The book that I read was interesting. This is the house where I grew up.", "question": "Describe a person you know using 'who'.", "funfact": "Did you know? We usually use 'who' for people, 'which' for things, and 'that' for either — though style guides sometimes prefer one over another."}, "5": {"title": "Passive Voice (basic)", "terms": ["Is made", "Was built", "By", "Active voice", "Passive voice", "Subject", "Object", "Focus"], "passage": "In the passive voice, the focus shifts to the action, not who does it. The cake was made by my mother. This bridge was built in 1990. Passive sentences use a form of 'be' plus a past participle.", "question": "Change this to passive: 'The chef cooked the meal.'", "funfact": "Did you know? News reports often use passive voice — 'the building was damaged' — when the person responsible is unknown or unimportant to the story."}, "6": {"title": "Reported Speech (basic)", "terms": ["Said", "Told", "That", "Reported", "Direct speech", "Backshift", "Quote", "Paraphrase"], "passage": "Reported speech tells us what someone said without quoting them directly. 'I am tired,' she said becomes She said that she was tired. The verb tense usually shifts back one step.", "question": "Report what a friend recently told you, using reported speech.", "funfact": "Did you know? This tense shift in reported speech is called 'backshift' — present becomes past, and past becomes past perfect."}, "7": {"title": "Second Conditional (introduction)", "terms": ["If I were", "Would", "Hypothetical", "Unreal present", "Imagine", "Wish", "Not real", "Possibility"], "passage": "The second conditional imagines an unreal or unlikely present situation. If I had more time, I would travel more. If I were rich, I would buy a house.", "question": "Write a second conditional sentence about something you wish were different.", "funfact": "Did you know? In formal English, we say 'if I were' (not 'if I was') for every subject in the second conditional."}, "8": {"title": "Present Perfect Continuous", "terms": ["Have been", "Has been", "-ing", "Duration", "Since", "For", "Ongoing action", "Recently"], "passage": "The present perfect continuous shows an action continuing up to now. I have been studying for three hours. She has been working here since 2020.", "question": "Write a sentence about something you have been doing recently.", "funfact": "Did you know? We use 'since' with a starting point in time and 'for' with a length of time, like 'since 2020' versus 'for five years'."}, "9": {"title": "Past Perfect (basic)", "terms": ["Had", "Past participle", "Before", "Earlier action", "Two past actions", "Already", "First", "Then"], "passage": "The past perfect shows which of two past actions happened first. By the time I arrived, the movie had already started. She had left before I called.", "question": "Write a sentence using the past perfect about two things that happened in the past.", "funfact": "Did you know? The past perfect is sometimes called the 'past of the past' because it happens before another past event."}, "10": {"title": "Defining vs Non-defining Relative Clauses", "terms": ["Who", "Which", "That", "Comma", "Essential information", "Extra information", "Defining", "Non-defining"], "passage": "A defining relative clause gives essential information with no comma. A non-defining clause gives extra information, set off by commas. The man who called is my uncle. My uncle, who lives in Paris, called.", "question": "Write one defining and one non-defining relative clause sentence.", "funfact": "Did you know? We can use 'that' in a defining relative clause, but never in a non-defining one."}, "11": {"title": "Causative (have something done)", "terms": ["Have something done", "Get something done", "Service", "Someone else", "Passive causative", "Haircut", "Repair", "Arrange"], "passage": "The causative structure shows that someone else does an action for us. I had my hair cut. We got the car repaired. She had her house painted.", "question": "Write a sentence about a service you have had done recently.", "funfact": "Did you know? The causative 'have something done' uses the past participle, just like the passive voice."}, "12": {"title": "Question Forms (indirect questions)", "terms": ["Could you tell me...", "I wonder...", "Do you know...", "Polite question", "Indirect", "Word order", "Statement order", "Formal"], "passage": "An indirect question is more polite and uses statement word order. Could you tell me where the station is? I wonder what time it starts.", "question": "Rewrite a direct question as a polite indirect question.", "funfact": "Did you know? In an indirect question, we don't invert the subject and verb the way we do in a normal direct question."}, "13": {"title": "Phrasal Verbs (common)", "terms": ["Give up", "Look after", "Turn off", "Put off", "Separable", "Inseparable", "Particle", "Meaning"], "passage": "A phrasal verb combines a verb with a particle to create a new meaning. Give up means to stop trying. Look after means to take care of someone.", "question": "Write two sentences using common phrasal verbs.", "funfact": "Did you know? English has thousands of phrasal verbs, and many of them have several completely different meanings."}, "14": {"title": "Modals of Obligation (must/have to)", "terms": ["Must", "Have to", "Don't have to", "Mustn't", "Obligation", "Necessity", "Rule", "Prohibition"], "passage": "'Must' and 'have to' show obligation. 'Mustn't' shows prohibition, while 'don't have to' shows no obligation. You must wear a seatbelt. You don't have to come if you're busy.", "question": "Write one sentence with 'must' and one with 'don't have to'.", "funfact": "Did you know? 'Mustn't' and 'don't have to' have very different meanings, even though they might look similar at first!"}, "15": {"title": "Modals of Possibility (might/could)", "terms": ["Might", "Could", "May", "Possibility", "Uncertain", "Perhaps", "Guess", "Likely"], "passage": "'Might', 'could', and 'may' show possibility. It might rain later. She could be at home. We may go to the beach this weekend.", "question": "Write a sentence guessing what a friend might be doing right now.", "funfact": "Did you know? 'Might' and 'could' show a similar, moderate level of possibility, weaker than 'will' but stronger than 'impossible'."}, "16": {"title": "Conditional Sentences Review", "terms": ["Zero conditional", "First conditional", "Second conditional", "If clause", "Result clause", "Real", "Unreal", "Type"], "passage": "English has several conditional types: zero (facts), first (real future), and second (unreal present). Choosing the right type depends on how real or likely the situation is.", "question": "Write one example each of a zero, first, and second conditional sentence.", "funfact": "Did you know? Native speakers sometimes mix conditional types informally, even though grammar books present them as strict categories."}, "17": {"title": "Reported Questions", "terms": ["Asked", "Wanted to know", "If/whether", "Reported speech", "Word order change", "Tense shift", "Direct question", "Indirect question"], "passage": "A reported question changes word order and often tense. 'Where do you live?' becomes She asked where I lived. Yes/no questions add 'if' or 'whether'.", "question": "Report a question someone recently asked you.", "funfact": "Did you know? In reported questions, we never use a question mark, since the sentence is now a statement, not a real question."}, "18": {"title": "Linking Words (although/despite)", "terms": ["Although", "Despite", "In spite of", "However", "Contrast", "Concession", "Even though", "But"], "passage": "Linking words like 'although' and 'despite' show contrast. Although it was raining, we went outside. Despite the rain, we went outside.", "question": "Write a sentence using 'although' and a sentence using 'despite'.", "funfact": "Did you know? 'Despite' and 'in spite of' are followed by a noun or -ing form, while 'although' is followed by a full clause."}, "19": {"title": "Future Forms Review (will/going to/present continuous)", "terms": ["Will", "Going to", "Present continuous", "Prediction", "Plan", "Arrangement", "Decision", "Intention"], "passage": "English has several future forms: 'will' for predictions and decisions, 'going to' for plans, and present continuous for fixed arrangements. I'm meeting her at 5pm tomorrow.", "question": "Write three sentences about your future using each of the three forms.", "funfact": "Did you know? The present continuous for future arrangements is often used with a specific time, like 'I'm flying to Paris on Friday.'"}, "20": {"title": "Used to / Be used to / Get used to", "terms": ["Used to", "Be used to", "Get used to", "Habit", "Familiar", "New", "Strange", "Adapt"], "passage": "I used to live in the countryside. Now I live in the city, and at first it felt strange. I'm getting used to the traffic, and now I'm used to the noise. People adapt to new places.", "question": "What have you had to get used to recently?", "funfact": "Did you know? 'Used to + verb' is about past habits, but 'be used to + -ing' means something feels familiar now."}, "21": {"title": "Verb + Object + Infinitive", "terms": ["Want", "Ask", "Tell", "Advise", "Expect", "Allow", "Object", "Infinitive"], "passage": "My teacher asked us to read a chapter. My parents want me to study hard, and they don't allow me to stay out late. The doctor advised my father to exercise.", "question": "What do your parents want you to do?", "funfact": "Did you know? We say 'She wants me to help', not 'She wants that I help'."}, "22": {"title": "Quantifiers", "terms": ["A few", "A little", "Plenty of", "A lot of", "Several", "Hardly any", "Countable", "Uncountable"], "passage": "I have a few friends in my new class and a little free time. There is plenty of food but hardly any water left. Several students were late. 'A few' goes with countable nouns and 'a little' with uncountable ones.", "question": "Describe your weekend using three quantifiers.", "funfact": "Did you know? 'Few' (without 'a') sounds negative — 'few people came' means almost nobody came."}, "23": {"title": "Reflexive Pronouns", "terms": ["Myself", "Yourself", "Himself", "Herself", "Ourselves", "Themselves", "By myself", "Enjoy"], "passage": "I taught myself to play the guitar. My sister made the cake herself. We enjoyed ourselves at the party. Did you hurt yourself? Sometimes I like to travel by myself.", "question": "What have you taught yourself to do?", "funfact": "Did you know? 'By myself' means alone or without help."}, "24": {"title": "Articles in Depth", "terms": ["A", "An", "The", "Zero article", "General", "Specific", "Unique", "Countries"], "passage": "We use 'a' or 'an' for one thing mentioned for the first time, and 'the' for something specific or unique, like the sun. For general ideas, we often use the zero article: 'Books are useful.'", "question": "Why do we say 'the Mekong' but just 'Cambodia'?", "funfact": "Did you know? Rivers and oceans usually take 'the' (the Mekong), but most country names don't (Cambodia)."}, "25": {"title": "Third Conditional (introduction)", "terms": ["If I had", "Would have", "Unreal past", "Past regret", "Different result", "Could have", "Might have", "Hadn't"], "passage": "We use the third conditional to talk about an unreal past. If I had studied harder, I would have passed the exam. If she hadn't missed the bus, she wouldn't have been late. We imagine a different past, and we cannot change it now.", "question": "Write a sentence about a past decision you would change, using the third conditional.", "funfact": "Did you know? The third conditional often expresses regret, because the situation it describes is impossible to change."}, "26": {"title": "Wish and If only", "terms": ["Wish", "If only", "Present regret", "Past regret", "Would", "Were", "Had done", "Impossible"], "passage": "We use wish and if only for things we would like to be different. I wish I had more time. If only I knew the answer. I wish I had studied harder. I wish he would stop talking, because it annoys me.", "question": "Write two sentences about something you wish were different.", "funfact": "Did you know? After 'wish' we usually move one tense back, so 'I wish I was' often becomes the more formal 'I wish I were'."}, "27": {"title": "Past Perfect Continuous", "terms": ["Had been", "Duration", "For", "Since", "Before that", "Result", "Ongoing", "Exhausted"], "passage": "We use the past perfect continuous to show that an action was in progress before another past moment. She had been waiting for an hour when the bus arrived. They were tired because they had been working all day.", "question": "What had you been doing before this lesson started?", "funfact": "Did you know? We use the past perfect continuous to explain a result in the past, such as being tired, wet or dirty."}, "28": {"title": "Stop, Remember and Try (-ing or to)", "terms": ["Stop doing", "Stop to do", "Remember doing", "Remember to do", "Try doing", "Try to do", "Forget", "Meaning change"], "passage": "Some verbs change meaning with -ing or to + verb. I stopped smoking means I quit. I stopped to smoke means I paused in order to smoke. Remember to lock the door is a reminder. I remember locking it is a memory.", "question": "Write two sentences that show the difference between 'stop doing' and 'stop to do'.", "funfact": "Did you know? 'Try doing' means experiment, and 'try to do' means attempt something that may be difficult."}, "29": {"title": "Passive with Modals and Perfect Tenses", "terms": ["Must be done", "Can be seen", "Has been built", "Have been made", "Will be finished", "Should be done", "Agent", "Process"], "passage": "We can use the passive with modal verbs and perfect tenses. The work must be done today. The bridge has been built. These shoes have been made by hand. The report will be finished by Friday.", "question": "Write a sentence with a passive modal about a rule at school.", "funfact": "Did you know? In the passive, the modal comes first, then 'be', then the past participle: 'must be done'."}, "30": {"title": "Modals of Deduction (must / can't)", "terms": ["Must be", "Can't be", "Might be", "Must have been", "Can't have been", "Certain", "Evidence", "Deduction"], "passage": "We use must and can't to make logical deductions when we have evidence. She must be at home, because the light is on. He can't be a doctor, because he is too young. They must have left already.", "question": "Look at a person near you and make a deduction using 'must' or 'can't'.", "funfact": "Did you know? 'Can't' is the opposite of 'must' in deduction: it means we are almost sure something is not true."}, "31": {"title": "So and Such (+ that)", "terms": ["So", "Such", "So that", "Such a", "Result clause", "Degree", "Adjective", "Noun phrase"], "passage": "We use so with an adjective and such with a noun phrase. The film was so long that we fell asleep. It was such a long film that we fell asleep. Both patterns show a result.", "question": "Write one sentence with 'so…that' and one with 'such…that'.", "funfact": "Did you know? 'So' is followed by an adjective alone, but 'such' needs a noun: 'such a good idea'."}, "32": {"title": "Both / Neither / Either / All", "terms": ["Both", "Neither", "Either", "All", "None", "Two things", "More than two", "Negative"], "passage": "Both, neither and either talk about two things. Both books are good. Neither book is boring. You can take either one. All and none talk about more than two: All the students passed, but none of them cheated.", "question": "Use 'both' and 'neither' to compare two things you own.", "funfact": "Did you know? 'Neither' has a negative meaning, so we do not use it with another negative word."}, "33": {"title": "Question Tags (all forms)", "terms": ["Isn't it?", "Don't you?", "Can't she?", "Won't they?", "Shall we?", "Aren't I?", "Let's", "Rising voice"], "passage": "Question tags check information. You are tired, aren't you? She can swim, can't she? Let's go, shall we? We use a rising voice when we are not sure and a falling voice when we expect agreement.", "question": "Write three sentences with different question tags.", "funfact": "Did you know? The tag for 'I am' is 'aren't I?', which is an exception to the usual pattern."}, "34": {"title": "Future Continuous and Future Perfect", "terms": ["Will be doing", "Will have done", "By then", "By the time", "In progress", "Completed", "Next year", "Deadline"], "passage": "Will be doing shows an action in progress in the future: This time tomorrow, I will be flying to Phnom Penh. Will have done shows an action finished before a future time: By Friday, I will have finished the report.", "question": "What will you have achieved by the end of this year?", "funfact": "Did you know? We often use 'by' with the future perfect to show a deadline: 'by next week', 'by the time you arrive'."}, "35": {"title": "Dependent Prepositions", "terms": ["Depend on", "Succeed in", "Believe in", "Apologise for", "Worry about", "Agree with", "Different from", "Result in"], "passage": "Many verbs, nouns and adjectives need a fixed preposition. It depends on the weather. She succeeded in passing the exam. I apologise for being late. We agree with your plan. This will result in better grades.", "question": "Write two sentences with verbs followed by fixed prepositions.", "funfact": "Did you know? Some verbs change meaning with the preposition: 'look at' is to see, but 'look after' means to take care of."}, "36": {"title": "Participle Adjectives (-ing / -ed)", "terms": ["Boring", "Bored", "Interesting", "Interested", "Exciting", "Excited", "Tiring", "Tired"], "passage": "Participle adjectives end in -ing or -ed. The -ing form describes the cause: The lesson is boring. The -ed form describes the feeling: I am bored. The film was exciting, so we were excited.", "question": "Describe a film using one -ing adjective and one -ed adjective.", "funfact": "Did you know? A common mistake is 'I am boring', which means you are a dull person, not that you feel bored."}, "37": {"title": "Comparatives: the more… the more", "terms": ["The more", "The less", "The better", "Much", "Far", "Slightly", "Twice as", "Gradually"], "passage": "We use double comparatives to show that two things change together. The more you practise, the better you become. The older he gets, the wiser he is. We can use much, far or slightly before a comparative.", "question": "Complete this sentence: The more I study, the…", "funfact": "Did you know? In 'the more… the more' both parts start with 'the', and each is a comparative."}, "38": {"title": "Sequencing and Time Linkers", "terms": ["First", "Then", "After that", "Meanwhile", "Eventually", "Finally", "In the end", "Afterwards"], "passage": "Time linkers show the order of events in a story. First, I woke up. Then I had breakfast. After that, I went to school. Meanwhile, my mother cooked dinner. Eventually the day ended, and finally I slept.", "question": "Tell the story of your morning using at least four time linkers.", "funfact": "Did you know? 'Eventually' means after a long time, so it is different from 'finally' or 'at last'."}, "39": {"title": "Review: B1 Grammar", "terms": ["Present perfect", "Conditionals", "Passive", "Reported speech", "Relative clauses", "Modals", "Linking words", "Future forms"], "passage": "B1 grammar includes the present perfect, conditionals, the passive, reported speech, relative clauses, modals, linking words and future forms. Using them accurately helps you express complex ideas.", "question": "Which B1 grammar point helps you most in writing?", "funfact": "Did you know? B1 is often called the 'threshold' level — you can now handle most everyday situations in English."}}, "B2": {"1": {"title": "Second Conditional", "terms": ["If I were", "Would", "Hypothetical", "Unreal present", "Imaginary", "Wish", "Unlikely", "Suppose"], "passage": "We use the second conditional for a hypothetical or unlikely present situation. If I were rich, I would travel the world. If she had more time, she would learn a new language.", "question": "Complete: If I could change one thing about my school, I would...", "funfact": "Did you know? In the second conditional, we traditionally use 'were' for every subject, even 'I' and 'he' — though 'was' is now common in casual speech."}, "2": {"title": "Third Conditional", "terms": ["If I had", "Would have", "Past hypothetical", "Regret", "Unreal past", "Missed opportunity", "Consequence", "Imagine"], "passage": "We use the third conditional to imagine a different past result, often expressing regret. If I had studied harder, I would have passed the exam. If she had left earlier, she would not have missed the bus.", "question": "Describe one thing you would have done differently, using the third conditional.", "funfact": "Did you know? The third conditional is grammatically complex because it imagines an alternate past that never actually happened."}, "3": {"title": "Passive Voice (advanced)", "terms": ["Is being built", "Has been made", "Will be completed", "Modal passive", "Continuous passive", "Perfect passive", "Agent", "Process"], "passage": "Advanced passive forms extend across every tense. The bridge is being built this year. The report has been finished. The project will be completed by June, and it must be reviewed carefully.", "question": "Write a sentence using 'has been' in the passive voice.", "funfact": "Did you know? Academic and scientific writing relies heavily on advanced passive structures to sound objective and formal."}, "4": {"title": "Modal Verbs of Deduction", "terms": ["Must be", "Might be", "Could be", "Can't be", "Certainty", "Possibility", "Deduction", "Evidence"], "passage": "We use a modal verb to guess based on evidence. The lights are off, so they must be asleep. She might be at work. That can't be true — I saw him yesterday.", "question": "Look around you and make a deduction using 'must be' or 'might be'.", "funfact": "Did you know? 'Must be' expresses near certainty, while 'might be' and 'could be' express a weaker, more uncertain possibility."}, "5": {"title": "Gerunds & Infinitives", "terms": ["Doing", "To do", "Enjoy doing", "Want to do", "Gerund", "Infinitive", "Verb pattern", "Depends on verb"], "passage": "Some verbs are followed by a gerund (verb + -ing), like 'enjoy swimming'. Others are followed by an infinitive (to + verb), like 'want to swim'. The correct pattern depends on the main verb.", "question": "Use both a gerund and an infinitive in two separate sentences.", "funfact": "Did you know? A few verbs, like 'stop', change meaning depending on whether they're followed by a gerund or an infinitive."}, "6": {"title": "Mixed Conditionals", "terms": ["Past condition", "Present result", "Present condition", "Past result", "Mixed time", "Combine", "Complex", "Nuance"], "passage": "A mixed conditional combines a past condition with a present result, or the reverse. If I had taken that job, I would be living abroad now. If she were more organized, she would have finished on time.", "question": "Try writing your own mixed conditional sentence.", "funfact": "Did you know? Mixed conditionals are considered an advanced grammar structure because they blend two different time periods within one sentence."}, "7": {"title": "Past Perfect Continuous", "terms": ["Had been", "-ing", "Duration before past", "Continuous action", "Ongoing past", "Before another past event", "Long action", "Cause"], "passage": "The past perfect continuous shows a continuing action before another past event. She had been working for hours before the meeting finally started.", "question": "Write a sentence using the past perfect continuous.", "funfact": "Did you know? This tense is often used to explain the cause of a later past result, like tiredness or frustration."}, "8": {"title": "Future Perfect", "terms": ["Will have", "By the time", "Completed action", "Future deadline", "Already", "By next year", "Future milestone", "Completion"], "passage": "The future perfect shows an action completed before a future point. By next year, I will have graduated. By 6pm, she will have finished her work.", "question": "Write a sentence using the future perfect about a personal goal.", "funfact": "Did you know? The future perfect is often paired with a time expression like 'by' to show exactly when the action will be complete."}, "9": {"title": "Future Continuous", "terms": ["Will be", "-ing", "Ongoing future action", "At a specific time", "Prediction", "In progress", "Future moment", "This time tomorrow"], "passage": "The future continuous describes an action in progress at a future moment. This time tomorrow, I will be flying to London. She will be studying at 9pm.", "question": "Write a sentence about what you will be doing this time next week.", "funfact": "Did you know? The future continuous is often used to politely ask about someone's plans, like 'Will you be using the car later?'"}, "10": {"title": "Modal Verbs in the Past", "terms": ["Must have", "Might have", "Could have", "Should have", "Past deduction", "Regret", "Possibility in the past", "Certainty"], "passage": "Past modals show deduction or regret about the past. She must have left already. He might have forgotten. You should have called me.", "question": "Write a sentence guessing what happened in the past using a modal + have.", "funfact": "Did you know? 'Should have' is often used to express regret about something that didn't happen but was expected or wished for."}, "11": {"title": "Advanced Relative Clauses", "terms": ["Whose", "Where", "When", "Reduced relative clause", "Preposition + which", "Relative pronoun omission", "Complex sentence", "Subordinate clause"], "passage": "Advanced relative clauses use 'whose', 'where', 'when', or a preposition before 'which'. The house in which she lives is old. The company whose CEO resigned is struggling.", "question": "Write a sentence using 'whose' in a relative clause.", "funfact": "Did you know? In very formal English, a preposition can move before 'which', as in 'the reason for which she left', instead of ending with it."}, "12": {"title": "Emphasis with Do/Does/Did", "terms": ["Do", "Does", "Did", "Emphatic", "Stress", "Contradiction", "Affirmation", "I do like it"], "passage": "We use 'do/does/did' for emphasis in a positive sentence. I do like your idea. She does understand the problem. He did finish his homework.", "question": "Write an emphatic sentence using 'do' to contradict someone.", "funfact": "Did you know? This emphatic 'do' is stressed strongly in speech and is often used to correct a misunderstanding."}, "13": {"title": "Wish & If Only", "terms": ["I wish", "If only", "Regret", "Unreal present", "Unreal past", "Wish + past simple", "Wish + past perfect", "Longing"], "passage": "'Wish' and 'if only' express regret or longing. I wish I had more time. If only I had studied harder. She wishes she lived closer to her family.", "question": "Write a sentence expressing a wish about your own life.", "funfact": "Did you know? 'If only' is generally stronger and more emotional than 'I wish', even though the grammar is almost identical."}, "14": {"title": "Advanced Passive Structures", "terms": ["Is said to be", "Is believed to be", "Reported passive", "Passive with modals", "It is thought that", "Formal passive", "Impersonal", "Objective tone"], "passage": "Advanced passive structures create a formal, objective tone. It is believed that the plan will succeed. She is said to be the best candidate.", "question": "Rewrite an opinion as an objective passive statement, like 'It is thought that...'.", "funfact": "Did you know? This kind of advanced passive is very common in academic and journalistic writing to avoid naming a specific source."}, "15": {"title": "Conditional Variations", "terms": ["Unless", "Provided that", "As long as", "In case", "Alternative conditional", "Condition", "Restriction", "Requirement"], "passage": "English has conditional alternatives to 'if'. Unless you hurry, you'll be late. You can go, provided that you finish your homework. Take an umbrella in case it rains.", "question": "Write a sentence using 'unless' and a sentence using 'as long as'.", "funfact": "Did you know? 'Unless' basically means 'if not', so 'unless you hurry' means the same as 'if you don't hurry'."}, "16": {"title": "Adverbial Clauses", "terms": ["Because", "Since", "As", "While", "Whereas", "Reason clause", "Time clause", "Contrast clause"], "passage": "An adverbial clause adds information about time, reason, or contrast. Because it was raining, we stayed inside. While she cooked, he set the table.", "question": "Write a sentence with an adverbial clause of reason.", "funfact": "Did you know? Adverbial clauses can usually move to the beginning or end of a sentence without changing the meaning."}, "17": {"title": "Noun Clauses", "terms": ["That clause", "What he said", "Whether", "Embedded question", "Subject clause", "Object clause", "Complement clause", "Nominal clause"], "passage": "A noun clause functions like a noun within a sentence. What she said surprised me. I don't know whether he's coming. That he lied is obvious.", "question": "Write a sentence that begins with a noun clause as the subject.", "funfact": "Did you know? Noun clauses can act as the subject, object, or complement of a sentence, just like a regular noun."}, "18": {"title": "Advanced Comparatives", "terms": ["The more...the more", "By far", "Increasingly", "Progressive comparison", "Double comparative", "Far more", "A great deal more", "Nuanced comparison"], "passage": "Advanced comparatives express nuanced relationships. The more you practice, the better you get. This option is by far the most efficient.", "question": "Write a sentence using 'the more...the more' structure.", "funfact": "Did you know? The double comparative structure 'the more...the more' is used in many languages to show a proportional relationship."}, "19": {"title": "Discourse Connectors", "terms": ["Furthermore", "Nevertheless", "Consequently", "In addition", "On the other hand", "Moreover", "Cohesion", "Formal writing"], "passage": "Discourse connectors link ideas smoothly in formal writing. Furthermore, the results support the theory. Nevertheless, more research is needed.", "question": "Write two sentences connected with a formal discourse connector.", "funfact": "Did you know? Discourse connectors like 'furthermore' and 'nevertheless' are far more common in academic writing than in everyday speech."}, "20": {"title": "Reporting Verbs", "terms": ["Admit", "Deny", "Suggest", "Warn", "Promise", "Refuse", "Recommend", "Accuse"], "passage": "Instead of 'said', we can use reporting verbs. He admitted breaking the window but denied stealing anything. She suggested going early, warned us about the traffic and promised to call.", "question": "Report something a friend said, using a reporting verb.", "funfact": "Did you know? Reporting verbs follow different patterns: 'deny + -ing', 'promise + to', 'warn + someone + about'."}, "21": {"title": "-ed and -ing Adjectives", "terms": ["Bored", "Boring", "Interested", "Interesting", "Tired", "Tiring", "Excited", "Exciting"], "passage": "The film was boring, so I felt bored. The lecture was interesting, and I was very interested. A long journey is tiring, and afterwards you feel tired. An exciting match makes fans excited.", "question": "Describe an experience using both an -ed and an -ing adjective.", "funfact": "Did you know? -ed adjectives describe how you feel; -ing adjectives describe what causes the feeling."}, "22": {"title": "It's Time / I'd Rather", "terms": ["It's time", "It's high time", "I'd rather", "Would rather", "Prefer", "Past form", "Present meaning", "Preference"], "passage": "It's time we went home. It's high time you started your project! I'd rather stay in tonight. My brother would rather I didn't borrow his phone. These phrases use a past form with present meaning.", "question": "What would you rather do this weekend?", "funfact": "Did you know? 'It's time we left' uses a past form but talks about now — a common B2 surprise!"}, "23": {"title": "Hedging and Softening", "terms": ["Seem", "Appear", "Tend to", "Perhaps", "Likely", "Might", "Slightly", "Cautious"], "passage": "In careful writing, we avoid being too direct. The results seem to show a change, and prices appear to be rising. Students tend to prefer online tools. This is likely to continue, although it might slow slightly.", "question": "Rewrite 'Social media is bad for teenagers' in a more cautious way.", "funfact": "Did you know? Hedging makes writing sound more accurate and polite, especially in essays and reports."}, "24": {"title": "Compound Adjectives", "terms": ["Well-known", "Long-term", "Hard-working", "Part-time", "Five-star", "Old-fashioned", "Hyphen", "Adjective"], "passage": "Compound adjectives join words with a hyphen. She is a well-known, hard-working doctor with a part-time job at a five-star hotel. Long-term plans can seem old-fashioned but are still useful.", "question": "Describe yourself using two compound adjectives.", "funfact": "Did you know? Numbers in compound adjectives stay singular: 'a ten-minute break', not 'a ten-minutes break'."}, "25": {"title": "Inversion after Negative Adverbials", "terms": ["Never", "Rarely", "Not only", "Hardly", "No sooner", "Seldom", "Inversion", "Emphasis"], "passage": "In formal English we put a negative adverb at the start for emphasis and invert the subject and auxiliary. Never have I seen such a view. Rarely does she complain. Not only did he win, but he also broke the record. Hardly had we sat down when the lights went out.", "question": "Rewrite 'I have never seen such a beautiful place' beginning with 'Never'.", "funfact": "Did you know? After 'no sooner' we use 'than', and after 'hardly' we use 'when'."}, "26": {"title": "Cleft Sentences", "terms": ["It was… that", "What I need", "The thing that", "All I want", "Focus", "Emphasis", "Cleft", "Contrast"], "passage": "Cleft sentences put the focus on one part of the message. It was my brother who broke the window. What I need is a long holiday. All I want is some peace and quiet. They are common in spoken
