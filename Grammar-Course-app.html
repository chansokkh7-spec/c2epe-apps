n the morning and at night. This is a good habit because it keeps my teeth strong and healthy. I use the present simple to talk about it: I brush my teeth every day."], [337.75, 339.49, "Excellent answer, Visal!"], [340.38, 345.71, "Great work! Now you can use eight new words and present simple: verb (+ s)."], [346.01, 350.71, "Today's value is discipline. Follow your routine, even when it is hard."], [351.01, 353.65, "See you in Unit three. Goodbye!"], [353.95, 357.52, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit03-Articles-a-an-the": [[0.35, 5.65, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.95, 9.5, "Hi! I'm Visal. Let's learn together!"], [9.8, 14.54, "Unit three: Articles (a/an/the). Today you will choose between a, an and the."], [14.84, 17.43, "Here is our lesson map. Let's start!"], [18.37, 21.43, "Part one: words. You will learn eight new words."], [22.28, 22.97, "A."], [23.98, 27.46, "A means the word we use before a singular consonant sound."], [28.05, 29.27, "I have a pen."], [29.88, 31.9, "Your turn. Say: A."], [34.73, 35.44, "A."], [36.18, 36.85, "An."], [37.85, 40.65, "An means the word we use before a vowel sound."], [41.25, 42.45, "She eats an orange."], [43.05, 44.97, "Your turn. Say: An."], [47.83, 48.61, "An."], [49.35, 49.98, "The."], [50.98, 53.97, "The means the word for a specific thing that we both know."], [54.58, 56.13, "The book is on the table."], [56.72, 59.07, "Your turn. Say: The."], [61.93, 62.71, "The."], [63.45, 64.37, "Apple."], [65.38, 68.14, "Apple means a round fruit that grows on trees."], [68.75, 70.66, "I eat an apple every day."], [71.25, 73.53, "Your turn. Say: Apple."], [76.37, 77.23, "Apple."], [77.98, 78.95, "Umbrella."], [79.95, 83.11, "Umbrella means something you hold above your head when it rains."], [83.72, 85.2, "Take an umbrella today."], [85.82, 88.06, "Your turn. Say: Umbrella."], [90.9, 91.96, "Umbrella."], [92.72, 93.36, "Book."], [94.35, 96.73, "Book means pages with words that you read."], [97.32, 98.53, "This is a good book."], [99.12, 101.35, "Your turn. Say: Book."], [104.2, 105.07, "Book."], [105.82, 106.9, "Specific."], [107.88, 111.57, "Specific means one particular thing, not just any thing."], [112.15, 113.89, "The red pen is specific."], [114.48, 117.04, "Your turn. Say: Specific."], [119.9, 121.16, "Specific."], [121.92, 122.72, "General."], [123.72, 126.76, "General means not one particular thing, but any thing."], [127.35, 128.96, "A pen is a general word."], [129.55, 131.96, "Your turn. Say: General."], [134.8, 135.75, "General."], [136.57, 140.39, "Part two: dialogue. Let's listen to a conversation."], [141.25, 144.31, "Visal, do we say 'a apple' or 'an apple'?"], [145.42, 157.69, "We say 'an apple'. We use an before a vowel sound: an apple, an umbrella. We use a before a consonant sound: a book, a pen."], [158.78, 160.19, "And when do we use 'the'?"], [161.28, 170.87, "We use the for something specific that both people know. Compare: I have a book, then Please open the book on the table."], [171.98, 174.68, "Is the first sound or the first letter important?"], [175.78, 185.47, "The sound is important. We say 'an hour' because hour starts with a vowel sound, and 'a university' because it starts with a y sound."], [186.63, 188.39, "Part three: grammar."], [189.25, 193.12, "Grammar focus: Articles: a and an and the."], [193.42, 194.76, "Look at the pattern."], [195.45, 196.82, "a book (any book)"], [197.72, 199.3, "an apple (vowel sound)"], [200.18, 201.99, "the book (a specific book)"], [202.93, 210.41, "Use a before a consonant sound, an before a vowel sound, and the for a specific thing. The sound matters, not only the letter."], [211.15, 214.37, "Be careful! Don't say: She eats a apple."], [216.33, 218.15, "Say: She eats an apple."], [218.45, 220.48, "Use an before a vowel sound."], [221.27, 223.92, "Part four: reading. Read and listen."], [224.73, 226.07, "A Day at School."], [226.37, 228.8, "I have a book and an umbrella in my bag."], [229.8, 232.29, "Today, an old teacher gave us a test."], [233.3, 236.15, "The test was easy, and the students were happy."], [237.13, 238.75, "I ate an apple at lunch."], [239.73, 241.85, "Then I read the book that my friend gave me."], [242.93, 247.04, "Part five: quiz. Five questions. Are you ready?"], [247.88, 249.36, "She has blank umbrella."], [249.66, 252.18, "A, a. B, an. C, the."], [255.73, 257.06, "The answer is B: an."], [258.22, 259.54, "I need blank pen."], [259.84, 262.61, "A, an. B, a. C, two."], [266.17, 267.78, "The answer is B: a."], [268.92, 271.89, "Please close blank door. (a specific door)"], [272.19, 275.07, "A, a. B, an. C, the."], [278.63, 280.18, "The answer is C: the."], [281.32, 282.86, "Which phrase is correct?"], [283.16, 287.19, "A, an hour. B, a hour. C, an university."], [290.73, 292.8, "The answer is A: an hour."], [293.95, 296.84, "According to the reading, what did the writer eat at lunch?"], [297.14, 300.45, "A, an apple. B, a book. C, an umbrella."], [304.0, 306.12, "The answer is A: an apple."], [307.3, 310.35, "Part six: speaking. It's your turn to talk."], [311.18, 313.12, "When do we use 'an' instead of 'a'?"], [321.92, 323.36, "Now listen to Visal."], [323.66, 338.98, "We use an instead of a when the next word starts with a vowel sound. For example, we say an apple, an umbrella and an hour. We use a when the next word starts with a consonant sound, such as a book or a pen."], [339.28, 340.87, "Excellent answer, Visal!"], [341.78, 346.15, "Great work! Now you can use eight new words and articles: a and an and the."], [346.45, 350.55, "Today's value is precision. Choose your words and numbers with care."], [350.85, 353.37, "See you in Unit four. Goodbye!"], [353.67, 356.61, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit04-Plural-Nouns": [[0.35, 5.36, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.66, 9.14, "Hi! I'm Visal. Let's learn together!"], [9.44, 14.16, "Unit four: Plural Nouns. Today you will talk about more than one thing."], [14.46, 16.96, "Here is our lesson map. Let's start!"], [17.9, 21.04, "Part one: words. You will learn eight new words."], [21.88, 22.62, "Cat."], [23.62, 25.81, "Cat means a small furry pet animal."], [26.42, 27.6, "I have one cat."], [28.22, 30.66, "Your turn. Say: Cat."], [33.5, 34.27, "Cat."], [35.02, 35.89, "Cats."], [36.88, 38.81, "Cats means more than one cat."], [39.42, 40.74, "She has two cats."], [41.35, 44.07, "Your turn. Say: Cats."], [46.93, 48.0, "Cats."], [48.75, 49.63, "Box."], [50.65, 53.1, "Box means a container with four sides."], [53.72, 55.22, "The box is on the table."], [55.82, 58.5, "Your turn. Say: Box."], [61.37, 62.27, "Box."], [63.02, 63.92, "Boxes."], [64.92, 67.02, "Boxes means more than one box."], [67.62, 69.38, "Three boxes are in the room."], [69.98, 72.61, "Your turn. Say: Boxes."], [75.47, 76.58, "Boxes."], [77.35, 78.16, "Child."], [79.15, 81.23, "Child means a young boy or girl."], [81.82, 83.27, "The child is happy."], [83.88, 86.2, "Your turn. Say: Child."], [89.03, 89.86, "Child."], [90.62, 91.45, "Children."], [92.45, 94.52, "Children means more than one child."], [95.12, 96.85, "The children play outside."], [97.45, 99.39, "Your turn. Say: Children."], [102.23, 103.06, "Children."], [103.82, 104.72, "Regular."], [105.72, 108.04, "Regular means following the normal rule."], [108.65, 110.5, "Most plurals are regular."], [111.08, 113.72, "Your turn. Say: Regular."], [116.57, 117.63, "Regular."], [118.38, 119.4, "Irregular."], [120.38, 123.56, "Irregular means not following the normal rule."], [124.15, 125.99, "Child is an irregular noun."], [126.58, 129.13, "Your turn. Say: Irregular."], [131.97, 133.04, "Irregular."], [133.83, 137.9, "Part two: dialogue. Let's listen to a conversation."], [138.75, 141.27, "Visal, how do we say more than one cat?"], [142.38, 150.37, "We say cats. Most nouns are regular. We add s: one cat, two cats; one book, two books."], [151.48, 152.72, "What about box?"], [153.82, 164.99, "After s, x, ch and sh, we add es: one box, two boxes; one watch, two watches. It is easier to say."], [166.08, 167.94, "Are there any special plurals?"], [169.05, 179.5, "Yes. Some are irregular. One child, two children. One man, two men. One foot, two feet. Sheep and fish stay the same."], [180.67, 181.87, "Part three: grammar."], [182.72, 187.18, "Grammar focus: Plural nouns: -s and -es and irregular."], [187.48, 188.71, "Look at the pattern."], [189.42, 191.06, "cat + s cats"], [191.95, 193.79, "box + es boxes"], [194.68, 196.43, "child irregular children"], [197.37, 205.08, "Add s to most nouns. Add es after s, x, ch and sh. Some nouns are irregular: child becomes children."], [205.85, 209.04, "Be careful! Don't say: I have two childs."], [211.0, 212.85, "Say: I have two children."], [213.15, 215.09, "Child is irregular: children."], [215.9, 218.68, "Part four: reading. Read and listen."], [219.47, 220.56, "One and Many."], [220.86, 223.42, "I have one cat, but my friend has three cats."], [224.43, 227.44, "There is one box on the table and two boxes under it."], [228.43, 231.36, "The child is small, and the children are in the garden."], [232.37, 235.07, "Most nouns are regular, so we add s."], [236.07, 239.08, "A few nouns are irregular, so we must remember them."], [240.17, 244.23, "Part five: quiz. Five questions. Are you ready?"], [245.08, 246.84, "One cat, two blank."], [247.14, 250.38, "A, cat. B, cats. C, cates."], [253.93, 255.79, "The answer is B: cats."], [256.95, 258.68, "One box, three blank."], [258.98, 262.93, "A, boxs. B, boxes. C, boxies."], [266.47, 268.3, "The answer is B: boxes."], [269.45, 271.14, "One child, many blank."], [271.44, 275.24, "A, childs. B, childes. C, children."], [278.8, 280.47, "The answer is C: children."], [281.62, 283.26, "Which noun is irregular?"], [283.56, 286.64, "A, dog. B, man. C, pen."], [290.2, 291.77, "The answer is B: man."], [292.92, 296.19, "According to the reading, how many boxes are under the table?"], [296.49, 299.4, "A, one. B, two. C, three."], [302.97, 304.65, "The answer is B: two."], [305.87, 309.59, "Part six: speaking. It's your turn to talk."], [310.45, 312.42, "What is the plural form of 'child'?"], [321.22, 322.66, "Now listen to Visal."], [322.96, 336.36, "The plural form of child is children. It is an irregular plural, so we do not add s. We say one child and two children. I must remember this word because it does not follow the regular rule."], [336.66, 338.28, "Excellent answer, Visal!"], [339.18, 345.47, "Great work! Now you can use eight new words and plural nouns: -s and -es and irregular."], [345.77, 349.35, "Today's value is attention. Look carefully and listen well."], [349.65, 352.2, "See you in Unit five. Goodbye!"], [352.5, 356.44, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit05-Possessives-my-your-his-her": [[0.35, 5.33, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.63, 9.16, "Hi! I'm Visal. Let's learn together!"], [9.46, 14.59, "Unit five: Possessives (my/your/his/her). Today you will show who owns something."], [14.89, 17.46, "Here is our lesson map. Let's start!"], [18.4, 21.49, "Part one: words. You will learn eight new words."], [22.35, 23.29, "My."], [24.28, 25.88, "My means belonging to me."], [26.48, 27.76, "This is my book."], [28.35, 30.82, "Your turn. Say: My."], [33.67, 34.48, "My."], [35.22, 36.01, "Your."], [37.02, 38.59, "Your means belonging to you."], [39.18, 40.36, "Is that your pen?"], [40.95, 43.73, "Your turn. Say: Your."], [46.57, 47.45, "Your."], [48.22, 49.0, "His."], [49.98, 51.6, "His means belonging to him."], [52.18, 53.48, "His name is Tom."], [54.08, 56.26, "Your turn. Say: His."], [59.1, 60.02, "His."], [60.78, 61.51, "Her."], [62.52, 64.27, "Her means belonging to her."], [64.88, 66.21, "Her name is Ana."], [66.82, 69.0, "Your turn. Say: Her."], [71.87, 72.7, "Her."], [73.45, 74.27, "Our."], [75.25, 76.91, "Our means belonging to us."], [77.52, 78.89, "Our teacher is kind."], [79.48, 81.65, "Your turn. Say: Our."], [84.5, 85.21, "Our."], [85.95, 86.61, "Their."], [87.62, 89.23, "Their means belonging to them."], [89.82, 91.33, "Their classroom is big."], [91.92, 94.4, "Your turn. Say: Their."], [97.23, 97.94, "Their."], [98.68, 99.5, "Belong."], [100.48, 102.6, "Belong means to be owned by someone."], [103.18, 104.87, "This bag belongs to me."], [105.48, 107.5, "Your turn. Say: Belong."], [110.33, 111.23, "Belong."], [111.98, 112.76, "Own."], [113.75, 116.18, "Own means to have something that is yours."], [116.78, 118.12, "He owns a bike."], [118.72, 121.25, "Your turn. Say: Own."], [124.1, 124.86, "Own."], [125.67, 129.57, "Part two: dialogue. Let's listen to a conversation."], [130.42, 134.39, "Visal, how do we say that a book is ours? Do we say 'I book'?"], [135.48, 144.38, "No. We use a possessive word: my book. I becomes my, you becomes your, he becomes his, she becomes her."], [145.48, 147.37, "What about more than one person?"], [148.48, 157.56, "We becomes our, and they becomes their. For example: our teacher, their classroom. The possessive word goes before the noun."], [158.65, 161.67, "Do these words change for singular and plural nouns?"], [162.78, 170.73, "No. We say my book and my books, her pen and her pens. Only the owner changes, not the thing."], [171.87, 173.29, "Part three: grammar."], [174.15, 179.87, "Grammar focus: Possessives: my and your and his and her and our and their."], [180.16, 181.39, "Look at the pattern."], [182.08, 183.29, "my book (I own it)"], [184.18, 185.81, "her name (it is a girl's name)"], [186.72, 188.58, "their classroom (it belongs to them)"], [189.53, 195.22, "My, your, his, her, our and their go before a noun and show the owner. They do not change for plural nouns."], [195.95, 199.26, "Be careful! Don't say: She likes he book."], [201.2, 203.34, "Say: She likes her book."], [203.64, 205.91, "Use her, not he, before a noun."], [206.7, 209.63, "Part four: reading. Read and listen."], [210.43, 211.42, "Whose Is It?."], [211.72, 214.05, "This is my book, and that is your pen."], [215.03, 217.32, "His name is Tom, and her name is Ana."], [218.33, 219.82, "Our teacher is kind."], [220.83, 223.96, "Their classroom is big, and it belongs to the whole school."], [224.97, 227.19, "Everyone must take care of what they own."], [228.3, 232.31, "Part five: quiz. Five questions. Are you ready?"], [233.15, 234.77, "She likes blank new bag."], [235.07, 237.84, "A, his. B, her. C, my."], [241.4, 243.02, "The answer is B: her."], [244.15, 245.73, "We love blank school."], [246.03, 248.94, "A, our. B, their. C, your."], [252.5, 254.7, "The answer is A: our."], [255.85, 258.58, "Tom has a bike. It is blank bike."], [258.88, 261.77, "A, her. B, his. C, my."], [265.33, 267.47, "The answer is B: his."], [268.62, 270.23, "Which sentence is correct?"], [270.53, 275.75, "A, They are at their house.. B, They are at they house.. C, They are at them house.."], [279.3, 281.92, "The answer is A: They are at their house.."], [283.05, 285.25, "According to the reading, what is big?"], [285.55, 289.18, "A, the pen. B, their classroom. C, my book."], [292.73, 295.27, "The answer is B: their classroom."], [296.47, 299.49, "Part six: speaking. It's your turn to talk."], [300.35, 303.61, "Whose book is it? Try answering with 'my' or 'his'."], [312.42, 313.94, "Now listen to Visal."], [314.24, 327.31, "It is my book. My name is on the first page. If the book belongs to my friend, I say it is his book or her book. We use my, his and her before a noun to show who owns it."], [327.61, 329.25, "Excellent answer, Visal!"], [330.15, 336.19, "Great work! Now you can use eight new words and possessives: my and your and his and her and our and their."], [336.49, 339.82, "Today's value is respect. Thank the people who help us."], [340.12, 342.75, "See you in Unit six. Goodbye!"], [343.05, 345.29, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit06-Basic-Prepositions-in-on-at": [[0.35, 5.28, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.58, 8.99, "Hi! I'm Visal. Let's learn together!"], [9.29, 15.11, "Unit six: Basic Prepositions (in/on/at). Today you will say where things are with in, on and at."], [15.41, 17.95, "Here is our lesson map. Let's start!"], [18.9, 22.25, "Part one: words. You will learn eight new words."], [23.08, 23.75, "In."], [24.75, 26.49, "In means inside something."], [27.08, 28.55, "The pen is in the bag."], [29.15, 31.59, "Your turn. Say: In."], [34.43, 35.16, "In."], [35.92, 36.56, "On."], [37.55, 39.6, "On means touching the top of something."], [40.18, 41.52, "The book is on the desk."], [42.12, 44.06, "Your turn. Say: On."], [46.9, 47.63, "On."], [48.38, 49.09, "At."], [50.08, 52.35, "At means used for a point or a place."], [52.95, 54.12, "I am at school."], [54.72, 56.79, "Your turn. Say: At."], [59.63, 60.32, "At."], [61.08, 62.19, "In the box."], [63.18, 65.48, "In the box means inside the container."], [66.08, 67.56, "The toy is in the box."], [68.15, 71.0, "Your turn. Say: In the box."], [73.83, 75.01, "In the box."], [75.75, 76.89, "On the table."], [77.88, 80.53, "On the table means touching the top of the table."], [81.12, 82.54, "The cup is on the table."], [83.15, 85.64, "Your turn. Say: On the table."], [88.5, 89.67, "On the table."], [90.42, 91.33, "At school."], [92.32, 94.79, "At school means in the place where you study."], [95.38, 96.79, "She is at school now."], [97.38, 99.85, "Your turn. Say: At school."], [102.7, 103.89, "At school."], [104.65, 105.77, "Location."], [106.78, 109.31, "Location means the place where something is."], [109.92, 111.65, "The location is near the park."], [112.25, 115.06, "Your turn. Say: Location."], [117.9, 118.97, "Location."], [119.72, 120.61, "Place."], [121.62, 124.39, "Place means a particular area or position."], [124.98, 126.77, "This is my favourite place."], [127.38, 129.68, "Your turn. Say: Place."], [132.53, 133.42, "Place."], [134.23, 137.63, "Part two: dialogue. Let's listen to a conversation."], [138.48, 141.61, "Visal, where is your pen? Is it in or on the bag?"], [142.72, 150.7, "It is in the bag. We use in when something is inside. We use on when it touches the top, like on the desk."], [151.82, 152.63, "And at?"], [153.72, 162.32, "We use at for a place or a point. I am at school. She is at the bus stop. He is at home. At is for general places."], [163.42, 164.78, "How can I remember them?"], [165.88, 175.41, "Think: in is inside, on is on top, and at is a point. In the box, on the table, at school. Learn each as a small phrase."], [176.57, 178.19, "Part three: grammar."], [179.05, 183.16, "Grammar focus: Prepositions of place: in and on and at."], [183.46, 184.6, "Look at the pattern."], [185.32, 186.78, "The pen is in the bag."], [187.68, 189.09, "The cup is on the table."], [189.98, 191.15, "She is at school."], [192.1, 200.87, "In = inside, on = on the top, at = a point or a place. Learn fixed phrases: at school, at home, on the table, in the box."], [201.62, 204.59, "Be careful! Don't say: The book is in the table."], [206.53, 208.81, "Say: The book is on the table."], [209.11, 210.91, "Use on for the top of something."], [211.7, 214.19, "Part four: reading. Read and listen."], [215.0, 216.08, "Where Is It?."], [216.38, 219.17, "My book is in my bag, and my bag is on the chair."], [220.17, 221.61, "I am at school now."], [222.6, 224.2, "The teacher is at the board."], [225.2, 228.53, "A map is on the wall, and some toys are in the box."], [229.53, 231.59, "My home is a good place to study."], [232.7, 236.55, "Part five: quiz. Five questions. Are you ready?"], [237.42, 239.09, "The cat is blank the box."], [239.39, 242.07, "A, in. B, on. C, at."], [245.63, 247.74, "The answer is A: in."], [248.88, 250.48, "The book is blank the desk."], [250.78, 253.51, "A, in. B, on. C, at."], [257.07, 258.73, "The answer is B: on."], [259.88, 261.35, "She is blank school."], [261.65, 264.52, "A, in. B, on. C, at."], [268.07, 269.52, "The answer is C: at."], [270.68, 272.33, "Which sentence is correct?"], [272.63, 278.27, "A, The cup is at the table.. B, The cup is on the table.. C, The cup is in the table.."], [281.83, 284.34, "The answer is B: The cup is on the table.."], [285.48, 288.39, "According to the reading, where is the writer's book?"], [288.69, 292.54, "A, on the chair. B, in the bag. C, at the board."], [296.1, 297.98, "The answer is B: in the bag."], [299.2, 302.0, "Part six: speaking. It's your turn to talk."], [302.85, 306.21, "Where is your pen right now? Use 'in', 'on', or 'at'."], [315.02, 316.59, "Now listen to Visal."], [316.89, 330.32, "My pen is in my bag right now. My bag is on the floor next to my chair. I am at home, so my pen is at home too. I use in for inside, on for the top of something, and at for a place."], [330.62, 332.49, "Excellent answer, Visal!"], [333.38, 339.15, "Great work! Now you can use eight new words and prepositions of place: in and on and at."], [339.45, 343.39, "Today's value is tidiness. Put your things back in their place."], [343.69, 345.95, "See you in Unit seven. Goodbye!"], [346.25, 350.28, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit07-Negative-Sentences-don-t-doesn-t": [[0.35, 5.67, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.97, 9.54, "Hi! I'm Visal. Let's learn together!"], [9.84, 15.98, "Unit seven: Negative Sentences (don't/doesn't). Today you will say what is not true with don't and doesn't."], [16.28, 18.84, "Here is our lesson map. Let's start!"], [19.8, 22.92, "Part one: words. You will learn eight new words."], [23.78, 24.49, "Don't."], [25.48, 27.2, "Don't means short for do not."], [27.82, 29.2, "I don't like coffee."], [29.82, 32.2, "Your turn. Say: Don't."], [35.07, 35.77, "Don't."], [36.52, 37.29, "Doesn't."], [38.28, 40.13, "Doesn't means short for does not."], [40.72, 42.1, "She doesn't eat meat."], [42.72, 44.89, "Your turn. Say: Doesn't."], [47.73, 48.51, "Doesn't."], [49.25, 50.03, "Not."], [51.02, 53.55, "Not means a word that makes a sentence negative."], [54.15, 55.41, "He is not here."], [56.02, 58.53, "Your turn. Say: Not."], [61.37, 62.43, "Not."], [63.18, 64.08, "Negative."], [65.08, 68.06, "Negative means saying no or that something is not true."], [68.65, 70.7, "A negative sentence uses not."], [71.28, 73.58, "Your turn. Say: Negative."], [76.43, 77.31, "Negative."], [78.05, 78.94, "I don't."], [79.95, 81.33, "I don't means I do not."], [81.95, 82.84, "I don't know."], [83.45, 85.88, "Your turn. Say: I don't."], [88.73, 89.59, "I don't."], [90.35, 91.42, "She doesn't."], [92.42, 94.21, "She doesn't means she does not."], [94.82, 96.04, "She doesn't play."], [96.65, 99.17, "Your turn. Say: She doesn't."], [102.03, 102.98, "She doesn't."], [103.72, 104.47, "Never."], [105.48, 107.3, "Never means not at any time."], [107.88, 109.12, "I never lie."], [109.72, 113.25, "Your turn. Say: Never."], [116.1, 116.94, "Never."], [117.68, 118.37, "No."], [119.38, 121.3, "No means the opposite of yes."], [121.92, 123.06, "No, thank you."], [123.65, 126.06, "Your turn. Say: No."], [128.9, 129.68, "No."], [130.47, 134.3, "Part two: dialogue. Let's listen to a conversation."], [135.15, 139.78, "Visal, do you like spicy food? You can say 'I don't like spicy food.'"], [140.88, 148.57, "Yes! I don't like spicy food. We use don't with I, you, we and they. We use doesn't with he, she and it."], [149.68, 151.66, "What comes after don't or doesn't?"], [152.75, 160.99, "The base verb, without s. She doesn't play, not 'she doesn't plays'. The s moves to doesn't, so the main verb stays simple."], [162.08, 163.7, "Is there any other way to say no?"], [164.78, 174.43, "Yes. Never means not at any time. I never eat meat. We also use not with be: I am not tired. They are not here."], [175.57, 176.95, "Part three: grammar."], [177.82, 181.99, "Grammar focus: Negatives: don't and doesn't plus base verb."], [182.29, 183.43, "Look at the pattern."], [184.12, 185.49, "I don't like coffee."], [186.38, 187.7, "She doesn't eat meat."], [188.58, 189.74, "They don't live here."], [190.7, 197.15, "Use don't with I, you, we and they, and doesn't with he, she and it. After both, use the base verb without s."], [197.88, 201.25, "Be careful! Don't say: She doesn't likes tea."], [203.2, 205.13, "Say: She doesn't like tea."], [205.43, 207.46, "Use the base verb after doesn't."], [208.27, 211.3, "Part four: reading. Read and listen."], [212.1, 213.33, "Things I Don't Do."], [213.63, 216.03, "I don't drink coffee, but my father does."], [217.03, 219.37, "My sister doesn't like spicy food."], [220.37, 222.31, "We don't go to school on Sunday."], [223.3, 225.21, "My cat never eats vegetables."], [226.2, 228.97, "A negative sentence uses not, don't or doesn't."], [230.07, 234.12, "Part five: quiz. Five questions. Are you ready?"], [234.95, 236.29, "She blank like rain."], [236.59, 239.89, "A, don't. B, doesn't. C, isn't."], [243.43, 245.9, "The answer is B: doesn't."], [247.05, 249.08, "They blank play football on Monday."], [249.38, 252.32, "A, don't. B, doesn't. C, not."], [255.87, 257.45, "The answer is A: don't."], [258.58, 260.19, "I blank know the answer."], [260.49, 263.56, "A, doesn't. B, am not. C, don't."], [267.1, 268.82, "The answer is C: don't."], [269.98, 271.55, "Which sentence is correct?"], [271.85, 276.62, "A, He doesn't plays.. B, He doesn't play.. C, He don't play.."], [280.17, 282.82, "The answer is B: He doesn't play.."], [283.95, 286.91, "According to the reading, who doesn't like spicy food?"], [287.21, 291.12, "A, my father. B, my sister. C, my cat."], [294.67, 296.78, "The answer is B: my sister."], [297.97, 301.04, "Part six: speaking. It's your turn to talk."], [301.88, 305.15, "Write one negative sentence using 'don't' and one using 'doesn't'."], [313.95, 315.61, "Now listen to Visal."], [315.91, 329.35, "I don't eat fish, and my brother doesn't eat eggs. We use don't with I and doesn't with he, she or it. After them we use the base verb. This is how I make a negative sentence in the present simple."], [329.64, 331.35, "Excellent answer, Visal!"], [332.25, 337.62, "Great work! Now you can use eight new words and negatives: don't and doesn't plus base verb."], [337.92, 341.11, "Today's value is honesty. Always tell the truth."], [341.4, 343.78, "See you in Unit eight. Goodbye!"], [344.08, 346.65, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit08-Yes-No-Questions": [[0.35, 5.34, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.64, 9.05, "Hi! I'm Visal. Let's learn together!"], [9.35, 15.22, "Unit eight: Yes/No Questions. Today you will ask questions that have yes or no answers."], [15.52, 18.01, "Here is our lesson map. Let's start!"], [18.97, 22.14, "Part one: words. You will learn eight new words."], [22.98, 23.83, "Do you...?."], [24.85, 27.47, "Do you...? means a question about you."], [28.08, 29.36, "Do you like music?"], [29.95, 32.6, "Your turn. Say: Do you...?."], [35.47, 36.41, "Do you...?."], [37.15, 38.02, "Does she...?."], [39.02, 41.88, "Does she...? means a question about one girl."], [42.48, 44.05, "Does she walk to school?"], [44.65, 47.07, "Your turn. Say: Does she...?."], [49.93, 51.02, "Does she...?."], [51.75, 52.62, "Is it...?."], [53.62, 56.44, "Is it...? means a question about one thing."], [57.05, 58.16, "Is it raining?"], [58.75, 61.31, "Your turn. Say: Is it...?."], [64.17, 65.0, "Is it...?."], [65.75, 66.52, "Are they...?."], [67.52, 70.87, "Are they...? means a question about two or more people."], [71.45, 72.6, "Are they ready?"], [73.22, 75.83, "Your turn. Say: Are they...?."], [78.7, 79.64, "Are they...?."], [80.38, 81.56, "Question mark."], [82.55, 85.85, "Question mark means the sign ? at the end of a question."], [86.45, 88.09, "Put a question mark here."], [88.68, 91.7, "Your turn. Say: Question mark."], [94.53, 95.77, "Question mark."], [96.52, 97.38, "Answer."], [98.38, 100.63, "Answer means a reply to a question."], [101.22, 102.57, "Give a short answer."], [103.15, 105.4, "Your turn. Say: Answer."], [108.23, 109.22, "Answer."], [109.98, 110.94, "Yes, I do."], [111.95, 114.6, "Yes, I do means a short positive answer."], [115.18, 117.5, "Do you like tea? Yes, I do."], [118.08, 121.0, "Your turn. Say: Yes, I do."], [123.87, 124.88, "Yes, I do."], [125.62, 126.77, "No, I don't."], [127.78, 130.17, "No, I don't means a short negative answer."], [130.75, 133.22, "Do you swim? No, I don't."], [133.82, 136.71, "Your turn. Say: No, I don't."], [139.57, 140.58, "No, I don't."], [141.37, 145.13, "Part two: dialogue. Let's listen to a conversation."], [145.98, 149.48, "Visal, do you like music? Please answer in a short way."], [150.58, 159.08, "Yes, I do. We make yes or no questions with do or does at the start: Do you like music? Does she play the guitar?"], [160.18, 161.52, "And with the verb be?"], [162.62, 172.24, "We put am, is or are first: Is it raining? Are they ready? Do not add do. Are you happy? Yes, I am."], [173.35, 174.94, "Which answer is correct?"], [176.05, 187.34, "Use the same helping verb. Do you swim? Yes, I do. No, I don't. Is she here? Yes, she is. No, she isn't. Finish with a question mark."], [188.5, 190.26, "Part three: grammar."], [191.12, 196.13, "Grammar focus: Yes and no questions: Do and Does and Am and Is and Are."], [196.44, 197.53, "Look at the pattern."], [198.22, 199.49, "Do you like music?"], [200.38, 201.87, "Does she walk to school?"], [202.78, 203.85, "Are they ready?"], [204.8, 213.41, "Put do, does, am, is or are before the subject. Answer with the same helping verb: Yes, I do. No, she isn't. Finish with a question mark."], [214.15, 217.79, "Be careful! Don't say: Does she plays tennis?"], [219.73, 222.69, "Say: Does she play tennis?"], [222.99, 224.93, "Use the base verb after does."], [225.73, 228.54, "Part four: reading. Read and listen."], [229.33, 230.79, "Questions and Answers."], [231.09, 233.44, "Do you like music? Yes, I do."], [234.43, 237.71, "Does your teacher speak English? Yes, she does."], [238.7, 241.06, "Is it Monday today? No, it isn't."], [242.07, 244.88, "Are your friends at school? Yes, they are."], [245.87, 248.04, "A question ends with a question mark."], [249.13, 253.12, "Part five: quiz. Five questions. Are you ready?"], [253.98, 255.43, "blank you like pizza?"], [255.73, 258.54, "A, Do. B, Does. C, Is."], [262.1, 263.7, "The answer is A: Do."], [264.85, 266.26, "blank she live here?"], [266.56, 269.41, "A, Do. B, Is. C, Does."], [272.97, 274.98, "The answer is C: Does."], [276.12, 277.91, "Is it hot? blank"], [278.21, 282.26, "A, Yes, it is.. B, Yes, it does.. C, Yes, it do.."], [285.8, 287.86, "The answer is A: Yes, it is.."], [289.02, 290.69, "Which question is correct?"], [290.99, 296.77, "A, Does he plays football?. B, Does he play football?. C, Do he play football?."], [300.33, 303.06, "The answer is B: Does he play football?."], [304.22, 307.34, "According to the reading, how does a question end?"], [307.64, 311.77, "A, with a question mark. B, with a full stop. C, with a comma."], [315.33, 317.72, "The answer is A: with a question mark."], [318.9, 321.94, "Part six: speaking. It's your turn to talk."], [322.78, 326.34, "Ask a partner a yes/no question about their daily routine."], [335.15, 336.6, "Now listen to Visal."], [336.9, 352.97, "I ask my partner: Do you wake up at six o'clock? My partner can answer: Yes, I do, or No, I don't. I start with do and use the base verb. At the end of the question, I write a question mark."], [353.27, 354.96, "Excellent answer, Visal!"], [355.85, 362.37, "Great work! Now you can use eight new words and yes and no questions: do and does and am and is and are."], [362.67, 366.8, "Today's value is curiosity. Ask questions and find out."], [367.1, 369.49, "See you in Unit nine. Goodbye!"], [369.79, 372.48, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit09-WH-Questions-what-where-when": [[0.35, 5.3, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.6, 8.73, "Hi! I'm Visal. Let's learn together!"], [9.04, 14.94, "Unit nine: WH-Questions (what/where/when). Today you will ask for information with question words."], [15.24, 17.91, "Here is our lesson map. Let's start!"], [18.87, 21.87, "Part one: words. You will learn eight new words."], [22.72, 23.35, "What."], [24.35, 26.5, "What means used to ask about a thing."], [27.12, 28.23, "What is your name?"], [28.85, 31.2, "Your turn. Say: What."], [34.07, 34.85, "What."], [35.58, 36.36, "Where."], [37.35, 39.62, "Where means used to ask about a place."], [40.22, 41.37, "Where do you live?"], [41.98, 44.45, "Your turn. Say: Where."], [47.3, 48.14, "Where."], [48.88, 49.58, "When."], [50.58, 52.85, "When means used to ask about a time."], [53.45, 54.88, "When is the class?"], [55.48, 57.95, "Your turn. Say: When."], [60.8, 61.51, "When."], [62.25, 62.82, "Who."], [63.82, 66.01, "Who means used to ask about a person."], [66.62, 67.83, "Who is your teacher?"], [68.42, 70.47, "Your turn. Say: Who."], [73.3, 74.11, "Who."], [74.85, 75.65, "Why."], [76.65, 78.84, "Why means used to ask for a reason."], [79.45, 80.56, "Why are you late?"], [81.15, 83.77, "Your turn. Say: Why."], [86.63, 87.54, "Why."], [88.28, 88.99, "How."], [89.98, 92.45, "How means used to ask about the way or manner."], [93.05, 94.63, "How do you go to school?"], [95.22, 97.43, "Your turn. Say: How."], [100.27, 101.02, "How."], [101.78, 103.0, "Question word."], [104.02, 107.59, "Question word means a word that starts a question for information."], [108.18, 109.79, "What is a question word."], [110.38, 113.19, "Your turn. Say: Question word."], [116.03, 117.2, "Question word."], [117.95, 119.07, "Information."], [120.08, 123.23, "Information means facts about someone or something."], [123.82, 125.35, "I need some information."], [125.95, 128.58, "Your turn. Say: Information."], [131.43, 132.68, "Information."], [133.47, 137.34, "Part two: dialogue. Let's listen to a conversation."], [138.18, 141.57, "Visal, do you know any question words? Name two."], [142.68, 153.09, "Yes! What and where. We also have when, who, why and how. They are called WH-words, and how is the exception."], [154.18, 155.3, "How do we use them?"], [156.42, 164.91, "We put the question word first, then the helping verb and subject: Where do you live? What is your name? When does the class start?"], [166.02, 167.18, "How do we answer?"], [168.28, 179.09, "Not with yes or no. We give information. Where do you live? I live in Phnom Penh. When is the class? At nine o'clock. Who is he? He is my teacher."], [180.23, 181.81, "Part three: grammar."], [182.65, 188.1, "Grammar focus: WH-questions: question word plus helping verb plus subject."], [188.4, 189.55, "Look at the pattern."], [190.25, 191.33, "Where do you live?"], [192.22, 193.4, "What is your name?"], [194.32, 195.92, "When does the class start?"], [196.87, 202.89, "Start with a question word, then a helping verb and the subject. Answer with information, not yes or no."], [203.65, 206.56, "Be careful! Don't say: Where you live?"], [208.5, 209.99, "Say: Where do you live?"], [210.29, 212.16, "Add do after the question word."], [212.97, 215.77, "Part four: reading. Read and listen."], [216.57, 218.03, "Ask and Find Out."], [218.33, 220.68, "What is your name, and where do you live?"], [221.67, 224.37, "Who is your teacher, and when is your class?"], [225.37, 226.83, "Why do you study English?"], [227.83, 229.25, "How do you go to school?"], [230.27, 233.0, "These question words help us to find information."], [234.1, 238.29, "Part five: quiz. Five questions. Are you ready?"], [239.15, 240.6, "blank is your birthday?"], [240.9, 243.71, "A, When. B, Where. C, Who."], [247.27, 248.8, "The answer is A: When."], [249.95, 251.26, "blank do you live?"], [251.56, 254.71, "A, Who. B, Where. C, Why."], [258.27, 260.43, "The answer is B: Where."], [261.58, 263.51, "'Because I like it' answers blank."], [263.81, 266.69, "A, Where. B, When. C, Why."], [270.23, 272.33, "The answer is C: Why."], [273.48, 275.23, "Which question is correct?"], [275.53, 279.7, "A, Where you live?. B, Where do you live?. C, Where live you?."], [283.27, 285.39, "The answer is B: Where do you live?."], [286.55, 290.31, "According to the reading, what do question words help us find?"], [290.61, 293.99, "A, information. B, money. C, homework."], [297.53, 299.6, "The answer is A: information."], [300.8, 303.8, "Part six: speaking. It's your turn to talk."], [304.65, 307.47, "Write three WH-questions to ask a new friend."], [316.28, 317.8, "Now listen to Visal."], [318.1, 330.3, "What is your name? Where do you live? What do you like doing at the weekend? I start each question with a question word. Then I add do and the subject. My new friend can give me information in the answer."], [330.6, 332.28, "Excellent answer, Visal!"], [333.18, 341.07, "Great work! Now you can use eight new words and wh-questions: question word plus helping verb plus subject."], [341.37, 345.19, "Today's value is curiosity. Ask questions and find out."], [345.49, 348.07, "See you in Unit ten. Goodbye!"], [348.37, 350.99, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit10-This-That-These-Those": [[0.35, 5.56, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.86, 9.42, "Hi! I'm Visal. Let's learn together!"], [9.72, 14.75, "Unit ten: This/That/These/Those. Today you will point to things that are near and far."], [15.05, 17.69, "Here is our lesson map. Let's start!"], [18.63, 21.87, "Part one: words. You will learn eight new words."], [22.72, 23.58, "This."], [24.58, 26.55, "This means one thing that is near you."], [27.15, 28.52, "This is my pen."], [29.12, 31.34, "Your turn. Say: This."], [34.2, 35.0, "This."], [35.75, 36.58, "That."], [37.58, 39.8, "That means one thing that is far from you."], [40.42, 41.71, "That is a tall tree."], [42.32, 44.84, "Your turn. Say: That."], [47.7, 48.35, "That."], [49.12, 49.82, "These."], [50.82, 53.15, "These means more than one thing that is near you."], [53.75, 55.09, "These are my books."], [55.68, 58.19, "Your turn. Say: These."], [61.03, 62.01, "These."], [62.75, 63.75, "Those."], [64.75, 67.19, "Those means more than one thing that is far from you."], [67.78, 69.19, "Those are mountains."], [69.78, 72.32, "Your turn. Say: Those."], [75.17, 76.0, "Those."], [76.75, 77.47, "Near."], [78.48, 80.25, "Near means not far away."], [80.85, 82.58, "The school is near my house."], [83.18, 85.38, "Your turn. Say: Near."], [88.23, 89.09, "Near."], [89.85, 90.53, "Far."], [91.52, 93.37, "Far means a long way away."], [93.95, 95.59, "The sea is far from here."], [96.18, 98.43, "Your turn. Say: Far."], [101.27, 102.04, "Far."], [102.78, 103.82, "Singular."], [104.82, 106.72, "Singular means one only."], [107.32, 108.94, "This is a singular noun."], [109.55, 112.09, "Your turn. Say: Singular."], [114.93, 116.02, "Singular."], [116.75, 117.4, "Plural."], [118.42, 120.08, "Plural means more than one."], [120.68, 122.23, "These are plural nouns."], [122.82, 125.06, "Your turn. Say: Plural."], [127.9, 128.65, "Plural."], [129.43, 133.29, "Part two: dialogue. Let's listen to a conversation."], [134.15, 136.99, "Visal, point to your pen. What do you say?"], [138.08, 146.88, "I say This is my pen. We use this for one thing that is near. For one thing that is far, we say that: That is a tall tree."], [147.98, 149.45, "And for many things?"], [150.55, 158.56, "We use these for plural things near us: These are my books. We use those for plural things far away: Those are mountains."], [159.65, 161.15, "Is there a simple rule?"], [162.25, 174.42, "This and these are near. That and those are far. This and that are singular. These and those are plural. Use is with singular and are with plural."], [175.57, 177.26, "Part three: grammar."], [178.12, 181.54, "Grammar focus: This and that and these and those."], [181.84, 183.12, "Look at the pattern."], [183.82, 185.1, "This is my pen."], [185.98, 187.29, "That is a tall tree."], [188.18, 189.42, "These are my books."], [190.37, 197.21, "This and these are for things that are near. That and those are for things that are far. This and that are singular; these and those are plural."], [197.95, 201.28, "Be careful! Don't say: These is my book."], [203.23, 205.55, "Say: This is my book."], [205.85, 207.6, "Use this with one near thing."], [208.4, 211.48, "Part four: reading. Read and listen."], [212.27, 213.64, "Near and Far."], [213.94, 216.51, "This is my desk, and these are my books."], [217.5, 220.39, "That is the teacher's desk, and those are her pencils."], [221.4, 223.76, "The window is far, but the board is near."], [224.77, 226.86, "A singular noun means one thing."], [227.87, 230.26, "A plural noun means more than one thing."], [231.37, 235.12, "Part five: quiz. Five questions. Are you ready?"], [235.98, 238.25, "blank is my bag. (near, one)"], [238.55, 241.8, "A, This. B, These. C, Those."], [245.33, 247.21, "The answer is A: This."], [248.35, 250.92, "blank are my shoes. (near, many)"], [251.22, 254.55, "A, That. B, Those. C, These."], [258.1, 260.49, "The answer is C: These."], [261.65, 263.86, "blank is a mountain. (far, one)"], [264.16, 266.97, "A, That. B, Those. C, These."], [270.53, 272.19, "The answer is A: That."], [273.35, 274.97, "Which sentence is correct?"], [275.27, 280.1, "A, These is my pen.. B, Those are far.. C, This are my books.."], [283.67, 286.21, "The answer is B: Those are far.."], [287.35, 290.37, "According to the reading, what are on the teacher's desk?"], [290.67, 294.92, "A, her pencils. B, my books. C, my bags."], [298.47, 300.71, "The answer is A: her pencils."], [301.9, 304.83, "Part six: speaking. It's your turn to talk."], [305.68, 309.53, "Point to something near you and something far away, and describe each one."], [318.32, 319.86, "Now listen to Visal."], [320.16, 332.14, "This is my pencil, and it is near me. That is a tree outside the window, and it is far from me. I use this and that for one thing. I use these and those for more than one thing."], [332.44, 334.18, "Excellent answer, Visal!"], [335.08, 340.06, "Great work! Now you can use eight new words and this and that and these and those."], [340.36, 344.1, "Today's value is attention. Look carefully and listen well."], [344.4, 346.72, "See you in Unit eleven. Goodbye!"], [347.02, 349.67, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit11-There-is-There-are": [[0.35, 5.47, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.77, 9.28, "Hi! I'm Visal. Let's learn together!"], [9.58, 15.01, "Unit eleven: There is / There are. Today you will say what exists in a place."], [15.31, 17.88, "Here is our lesson map. Let's start!"], [18.83, 22.08, "Part one: words. You will learn eight new words."], [22.92, 23.78, "There is."], [24.78, 27.61, "There is means used to say that one thing exists."], [28.22, 29.68, "There is a cat in the garden."], [30.28, 32.82, "Your turn. Say: There is."], [35.67, 36.77, "There is."], [37.52, 38.47, "There are."], [39.48, 41.97, "There are means used to say that many things exist."], [42.58, 44.34, "There are two books on the table."], [44.95, 48.18, "Your turn. Say: There are."], [51.03, 51.99, "There are."], [52.75, 53.65, "A cat."], [54.65, 56.22, "A cat means one cat."], [56.82, 58.29, "A cat is on the chair."], [58.88, 62.0, "Your turn. Say: A cat."], [64.87, 65.72, "A cat."], [66.48, 67.64, "Some books."], [68.65, 71.24, "Some books means an unknown number of books."], [71.85, 73.18, "Some books are new."], [73.78, 76.48, "Your turn. Say: Some books."], [79.33, 80.47, "Some books."], [81.22, 82.36, "Existence."], [83.35, 87.08, "Existence means the fact that something is real or is there."], [87.68, 90.29, "Existence is the idea behind there is."], [90.88, 93.67, "Your turn. Say: Existence."], [96.53, 97.79, "Existence."], [98.55, 99.75, "Singular noun."], [100.75, 103.4, "Singular noun means a noun that means one thing."], [103.98, 105.7, "Book is a singular noun."], [106.32, 108.91, "Your turn. Say: Singular noun."], [111.77, 113.16, "Singular noun."], [113.92, 114.92, "Plural noun."], [115.92, 118.74, "Plural noun means a noun that means more than one thing."], [119.35, 121.01, "Books is a plural noun."], [121.62, 124.4, "Your turn. Say: Plural noun."], [127.23, 128.53, "Plural noun."], [129.28, 130.31, "Location."], [131.32, 133.7, "Location means the place where something is."], [134.28, 136.22, "The location is the classroom."], [136.82, 139.4, "Your turn. Say: Location."], [142.23, 143.36, "Location."], [144.17, 147.63, "Part two: dialogue. Let's listen to a conversation."], [148.48, 151.94, "Visal, look at the classroom. What can you say about it?"], [153.05, 160.52, "There is a board, and there are many chairs. We use there is with a singular noun and there are with a plural noun."], [161.62, 163.09, "How do we make a negative?"], [164.18, 171.03, "Add not: There is not a clock. There are not any windows. In speaking we say there isn't and there aren't."], [172.12, 173.38, "And questions?"], [174.48, 183.65, "We change the order: Is there a library? Are there any students? We often answer: Yes, there is. No, there aren't."], [184.8, 186.53, "Part three: grammar."], [187.38, 190.11, "Grammar focus: There is and There are."], [190.41, 191.62, "Look at the pattern."], [192.32, 193.89, "There is a cat in the garden."], [194.78, 196.68, "There are three books on the table."], [197.58, 199.21, "There isn't a clock in the room."], [200.17, 208.37, "Use there is with a singular noun and there are with a plural noun. Use there isn't and there aren't for negatives. Questions: Is there…? Are there…?"], [209.12, 212.43, "Be careful! Don't say: There is two pens."], [214.37, 216.39, "Say: There are two pens."], [216.69, 218.6, "Use there are with a plural noun."], [219.4, 222.15, "Part four: reading. Read and listen."], [222.93, 224.1, "My Classroom."], [224.4, 226.47, "There is a big board in my classroom."], [227.47, 230.57, "There are thirty chairs, and there are some posters on the wall."], [231.57, 234.33, "There is a window, but there isn't a clock."], [235.33, 237.29, "Is there a library in your school?"], [238.3, 240.93, "Yes, there is, and there are many books in it."], [242.03, 246.22, "Part five: quiz. Five questions. Are you ready?"], [247.08, 248.7, "blank a cat in the garden."], [249.0, 252.33, "A, There is. B, There are. C, They are."], [255.87, 257.81, "The answer is A: There is."], [258.95, 260.81, "blank five books on the shelf."], [261.11, 264.24, "A, There is. B, There are. C, It is."], [267.8, 269.54, "The answer is B: There are."], [270.68, 272.53, "blank any students in the room?"], [272.83, 276.59, "A, Is there. B, Are there. C, There are."], [280.13, 282.11, "The answer is B: Are there."], [283.25, 285.04, "Which sentence is correct?"], [285.34, 290.63, "A, There is two pens.. B, There are two pens.. C, There be two pens.."], [294.17, 296.82, "The answer is B: There are two pens.."], [297.95, 300.3, "According to the reading, what is there on the wall?"], [300.6, 305.31, "A, a clock. B, some posters. C, a library."], [308.87, 311.16, "The answer is B: some posters."], [312.37, 315.52, "Part six: speaking. It's your turn to talk."], [316.38, 319.1, "Describe your classroom using 'there is' and 'there are'."], [327.92, 329.55, "Now listen to Visal."], [329.85, 342.23, "There is a big board in my classroom, and there are many chairs and tables. There is a map on the wall, and there are some posters too. I use there is for one thing and there are for many things."], [342.53, 344.32, "Excellent answer, Visal!"], [345.22, 349.39, "Great work! Now you can use eight new words and there is and there are."], [349.69, 353.78, "Today's value is gratitude. Say thank you for your home and family."], [354.08, 356.83, "See you in Unit twelve. Goodbye!"], [357.13, 360.14, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit12-Adjectives-basic": [[0.35, 5.21, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.51, 8.68, "Hi! I'm Visal. Let's learn together!"], [8.98, 14.82, "Unit twelve: Adjectives (basic). Today you will describe people and things with adjectives."], [15.12, 18.0, "Here is our lesson map. Let's start!"], [18.93, 22.32, "Part one: words. You will learn eight new words."], [23.18, 24.0, "Big."], [24.98, 26.9, "Big means large in size."], [27.52, 29.18, "I live in a big house."], [29.78, 32.33, "Your turn. Say: Big."], [35.17, 35.87, "Big."], [36.62, 37.55, "Small."], [38.55, 40.46, "Small means little in size."], [41.05, 42.39, "A mouse is small."], [42.98, 45.29, "Your turn. Say: Small."], [48.13, 49.03, "Small."], [49.78, 50.53, "Happy."], [51.52, 53.18, "Happy means feeling good."], [53.78, 55.24, "She is happy today."], [55.85, 58.06, "Your turn. Say: Happy."], [60.9, 61.48, "Happy."], [62.22, 63.12, "Sad."], [64.12, 66.21, "Sad means feeling unhappy."], [66.82, 68.55, "He is sad about the news."], [69.15, 71.48, "Your turn. Say: Sad."], [74.33, 75.23, "Sad."], [75.98, 76.88, "Beautiful."], [77.88, 80.03, "Beautiful means very nice to look at."], [80.65, 82.1, "Angkor Wat is beautiful."], [82.72, 85.32, "Your turn. Say: Beautiful."], [88.17, 89.27, "Beautiful."], [90.02, 91.0, "Describe."], [91.98, 95.07, "Describe means to say what someone or something is like."], [95.68, 97.02, "Describe your friend."], [97.62, 100.36, "Your turn. Say: Describe."], [103.2, 104.26, "Describe."], [105.02, 105.74, "Noun."], [106.75, 109.48, "Noun means a word for a person, place or thing."], [110.08, 111.23, "Book is a noun."], [111.85, 114.33, "Your turn. Say: Noun."], [117.17, 118.12, "Noun."], [118.88, 119.84, "Quality."], [120.85, 123.67, "Quality means a feature that describes something."], [124.28, 125.94, "Kindness is a good quality."], [126.55, 129.12, "Your turn. Say: Quality."], [131.97, 132.83, "Quality."], [133.63, 137.17, "Part two: dialogue. Let's listen to a conversation."], [138.02, 140.82, "Visal, how can you describe your best friend?"], [141.92, 150.02, "She is kind and happy. Kind and happy are adjectives. An adjective describes a noun. It tells us more about a person or thing."], [151.12, 152.91, "Where do adjectives go?"], [154.02, 166.79, "Usually before a noun: a big house, a small cat. After be: The house is big. The cat is small. We do not add s to adjectives."], [167.88, 169.5, "Can we use two adjectives?"], [170.58, 181.39, "Yes! A big, beautiful house. We put a comma between them. Not 'bigs houses'. The adjective stays the same: a big house, big houses."], [182.53, 183.95, "Part three: grammar."], [184.82, 188.98, "Grammar focus: Adjectives: before a noun or after be."], [189.28, 190.44, "Look at the pattern."], [191.15, 192.35, "a big house"], [193.25, 194.55, "She is happy today."], [195.45, 196.76, "a beautiful garden"], [197.7, 203.37, "An adjective describes a noun. Put it before the noun or after be. It never takes an s."], [204.12, 207.68, "Be careful! Don't say: She has a beautifuls dog."], [209.63, 211.63, "Say: She has a beautiful dog."], [211.93, 214.04, "Adjectives never take an s."], [214.83, 217.64, "Part four: reading. Read and listen."], [218.43, 219.61, "My Best Friend."], [219.91, 221.97, "My best friend is kind and happy."], [222.97, 225.26, "She has a small dog and a big smile."], [226.27, 228.89, "Her house is beautiful, and her garden is quiet."], [229.9, 232.44, "When I am sad, she is always near."], [233.43, 237.08, "We describe people with adjectives, and each quality is special."], [238.17, 242.05, "Part five: quiz. Five questions. Are you ready?"], [242.92, 245.43, "She has a blank dog. (not big)"], [245.73, 249.7, "A, small. B, smalls. C, smally."], [253.23, 255.12, "The answer is A: small."], [256.28, 258.64, "I am blank today because it is my birthday."], [258.94, 262.1, "A, sad. B, happy. C, angry."], [265.63, 267.53, "The answer is B: happy."], [268.68, 270.25, "Which sentence is correct?"], [270.55, 275.33, "A, They are happys.. B, They are happy.. C, They happy are.."], [278.87, 280.91, "The answer is B: They are happy.."], [282.05, 283.74, "Angkor Wat is very blank."], [284.04, 287.63, "A, beautiful. B, beautifuls. C, beauty."], [291.17, 293.27, "The answer is A: beautiful."], [294.42, 296.78, "According to the reading, what is beautiful?"], [297.08, 300.68, "A, her house. B, my dog. C, my school."], [304.23, 306.23, "The answer is A: her house."], [307.43, 310.38, "Part six: speaking. It's your turn to talk."], [311.22, 314.55, "Describe your best friend using three different adjectives."], [323.35, 324.85, "Now listen to Visal."], [325.15, 337.91, "My best friend is kind, funny and clever. She is kind because she helps me. She is funny because she makes me laugh. She is clever because she studies hard. These adjectives describe my friend."], [338.21, 339.9, "Excellent answer, Visal!"], [340.78, 346.04, "Great work! Now you can use eight new words and adjectives: before a noun or after be."], [346.34, 349.86, "Today's value is kindness. Be kind to everyone."], [350.16, 352.93, "See you in Unit thirteen. Goodbye!"], [353.23, 355.53, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit13-Adverbs-of-Frequency": [[0.35, 5.99, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [6.29, 10.11, "Hi! I'm Visal. Let's learn together!"], [10.4, 15.63, "Unit thirteen: Adverbs of Frequency. Today you will say how often you do things."], [15.93, 18.47, "Here is our lesson map. Let's start!"], [19.43, 22.43, "Part one: words. You will learn eight new words."], [23.28, 24.24, "Always."], [25.25, 27.59, "Always means one hundred percent of the time."], [28.18, 29.89, "I always brush my teeth."], [30.48, 32.96, "Your turn. Say: Always."], [35.8, 36.71, "Always."], [37.45, 38.39, "Usually."], [39.38, 41.5, "Usually means most of the time."], [42.08, 43.82, "We usually eat at six."], [44.42, 46.73, "Your turn. Say: Usually."], [49.57, 50.39, "Usually."], [51.15, 52.31, "Sometimes."], [53.32, 56.29, "Sometimes means not often, but some of the time."], [56.88, 58.89, "He sometimes walks to school."], [59.48, 62.27, "Your turn. Say: Sometimes."], [65.13, 66.33, "Sometimes."], [67.08, 67.97, "Rarely."], [68.98, 70.69, "Rarely means not often."], [71.28, 73.1, "She rarely watches TV."], [73.68, 75.92, "Your turn. Say: Rarely."], [78.77, 79.76, "Rarely."], [80.52, 81.26, "Never."], [82.25, 84.61, "Never means zero percent of the time."], [85.22, 86.62, "I never eat meat."], [87.22, 89.28, "Your turn. Say: Never."], [92.13, 92.87, "Never."], [93.62, 94.45, "Often."], [95.45, 97.28, "Often means many times."], [97.88, 99.42, "We often play football."], [100.02, 102.58, "Your turn. Say: Often."], [105.43, 106.22, "Often."], [106.98, 108.12, "How often."], [109.12, 111.69, "How often means a question about frequency."], [112.28, 113.84, "How often do you read?"], [114.45, 117.46, "Your turn. Say: How often."], [120.3, 121.58, "How often."], [122.32, 123.16, "Routine."], [124.15, 126.49, "Routine means the things you do regularly."], [127.08, 129.04, "My routine starts at six."], [129.65, 132.4, "Your turn. Say: Routine."], [135.23, 136.21, "Routine."], [137.0, 140.35, "Part two: dialogue. Let's listen to a conversation."], [141.18, 145.79, "Visal, how often do you eat rice? Always, usually or sometimes?"], [146.88, 156.75, "I always eat rice! Adverbs of frequency tell us how often something happens: always, usually, often, sometimes, rarely and never."], [157.85, 159.04, "Where do they go?"], [160.15, 170.34, "Before the main verb: I always brush my teeth. After the verb be: She is never late. They come between the subject and the verb."], [171.45, 173.09, "How do we ask the question?"], [174.18, 183.64, "We ask: How often do you read? We answer: I read every day, or I sometimes read at night. They show a routine."], [184.8, 186.41, "Part three: grammar."], [187.25, 192.36, "Grammar focus: Adverbs of frequency: before the main verb, after be."], [192.66, 193.86, "Look at the pattern."], [194.55, 196.36, "I always brush my teeth."], [197.25, 199.05, "She sometimes walks to school."], [199.95, 201.29, "He is never late."], [202.23, 207.48, "Always, usually, often, sometimes, rarely and never go before the main verb and after be."], [208.25, 211.16, "Be careful! Don't say: He always is late."], [213.1, 215.22, "Say: He is always late."], [215.52, 217.36, "Put the adverb after the verb be."], [218.17, 220.84, "Part four: reading. Read and listen."], [221.63, 222.54, "How Often?."], [222.84, 224.72, "I always get up at six o'clock."], [225.73, 227.81, "I usually eat rice for breakfast."], [228.8, 232.32, "My brother sometimes walks to school, but I often ride a bike."], [233.33, 236.66, "My mother rarely watches TV, and my father never eats late."], [237.67, 241.19, "How often do you read? My routine is to read every night."], [242.3, 246.3, "Part five: quiz. Five questions. Are you ready?"], [247.15, 250.87, "I blank eat breakfast. (100%)"], [251.17, 254.96, "A, never. B, always. C, rarely."], [258.5, 260.71, "The answer is B: always."], [261.85, 264.82, "She blank goes to the cinema. (0%)"], [265.12, 269.26, "A, always. B, often. C, never."], [272.8, 275.11, "The answer is C: never."], [276.25, 277.83, "Which sentence is correct?"], [278.13, 283.29, "A, He always is late.. B, He is always late.. C, Always he is late.."], [286.83, 289.65, "The answer is B: He is always late.."], [290.78, 292.6, "'How often' asks about blank."], [292.9, 296.35, "A, place. B, frequency. C, reason."], [299.9, 302.19, "The answer is B: frequency."], [303.35, 305.95, "According to the reading, who rarely watches TV?"], [306.25, 309.7, "A, my mother. B, my father. C, my brother."], [313.23, 315.37, "The answer is A: my mother."], [316.57, 319.54, "Part six: speaking. It's your turn to talk."], [320.38, 324.21, "Write two sentences about your routine using adverbs of frequency."], [333.02, 334.33, "Now listen to Visal."], [334.63, 348.03, "I always wake up at six o'clock. I sometimes eat noodles for breakfast. These sentences use adverbs of frequency. They tell my teacher about my routine and show how often I do each thing."], [348.33, 349.97, "Excellent answer, Visal!"], [350.88, 357.58, "Great work! Now you can use eight new words and adverbs of frequency: before the main verb, after be."], [357.88, 361.92, "Today's value is time management. Plan your day and use your time well."], [362.22, 365.02, "See you in Unit fourteen. Goodbye!"], [365.32, 368.78, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit14-Can-Can-t-ability": [[0.35, 5.22, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.52, 9.15, "Hi! I'm Visal. Let's learn together!"], [9.45, 14.47, "Unit fourteen: Can / Can't (ability). Today you will say what you can and cannot do."], [14.77, 17.51, "Here is our lesson map. Let's start!"], [18.47, 21.86, "Part one: words. You will learn eight new words."], [22.72, 23.52, "Can."], [24.52, 26.67, "Can means to be able to do something."], [27.28, 28.4, "I can swim."], [29.02, 31.36, "Your turn. Say: Can."], [34.2, 34.88, "Can."], [35.62, 36.47, "Can't."], [37.48, 39.46, "Can't means not able to do something."], [40.05, 41.28, "She can't drive."], [41.88, 44.34, "Your turn. Say: Can't."], [47.2, 47.89, "Can't."], [48.65, 49.67, "Ability."], [50.68, 53.73, "Ability means the power or skill to do something."], [54.32, 55.78, "Swimming is an ability."], [56.38, 58.85, "Your turn. Say: Ability."], [61.7, 62.57, "Ability."], [63.32, 64.13, "Swim."], [65.12, 67.09, "Swim means to move through water."], [67.68, 69.24, "Fish swim in the river."], [69.85, 72.29, "Your turn. Say: Swim."], [75.13, 75.94, "Swim."], [76.68, 77.35, "Cook."], [78.35, 80.44, "Cook means to prepare food with heat."], [81.05, 82.55, "My mother can cook well."], [83.15, 85.48, "Your turn. Say: Cook."], [88.33, 89.06, "Cook."], [89.82, 90.67, "Speak."], [91.68, 93.58, "Speak means to talk with words."], [94.18, 95.75, "I can speak English."], [96.35, 98.39, "Your turn. Say: Speak."], [101.23, 102.16, "Speak."], [102.92, 103.77, "Possible."], [104.78, 107.17, "Possible means able to happen or be done."], [107.75, 109.82, "It is possible to learn quickly."], [110.42, 113.14, "Your turn. Say: Possible."], [116.0, 116.93, "Possible."], [117.68, 118.88, "Impossible."], [119.88, 122.86, "Impossible means not able to happen or be done."], [123.45, 125.25, "Flying alone is impossible."], [125.85, 128.66, "Your turn. Say: Impossible."], [131.5, 132.69, "Impossible."], [133.5, 137.12, "Part two: dialogue. Let's listen to a conversation."], [137.95, 141.28, "Visal, what can you do well? Tell me one thing."], [142.38, 151.92, "I can swim and I can cook. We use can to talk about ability. The verb after can is always the base verb: I can swim, not I can swims."], [153.02, 154.57, "And for things you cannot do?"], [155.68, 165.18, "We say can't or cannot. I can't drive. She can't swim. It means that it is not possible for me. Can't is the short form of cannot."], [166.28, 167.85, "How do we ask a question?"], [168.95, 179.59, "Put can first: Can you speak English? Yes, I can. No, I can't. The word order is can, then the subject, then the base verb."], [180.73, 182.47, "Part three: grammar."], [183.32, 186.23, "Grammar focus: Can and can't plus base verb."], [186.53, 187.75, "Look at the pattern."], [188.45, 190.17, "I can swim very well."], [191.08, 192.66, "She can't drive a car."], [193.55, 194.88, "Can you speak English?"], [195.83, 203.35, "Use can for ability and can't for no ability. After can, use the base verb with no s. Questions: Can you…?"], [204.12, 207.79, "Be careful! Don't say: She can swims very well."], [209.73, 211.94, "Say: She can swim very well."], [212.24, 214.31, "Use the base verb after can."], [215.1, 217.52, "Part four: reading. Read and listen."], [218.33, 219.5, "What Can You Do?."], [219.8, 222.11, "I can swim, and I can cook rice."], [223.1, 225.53, "My sister can speak English and French."], [226.53, 229.23, "She can't drive a car, because she is only twelve."], [230.23, 232.86, "Can you play the guitar? No, I can't."], [233.87, 236.59, "Many things are possible if you practise."], [237.7, 241.7, "Part five: quiz. Five questions. Are you ready?"], [242.55, 244.41, "He blank swim very fast."], [244.71, 248.2, "A, can. B, cans. C, is can."], [251.77, 253.65, "The answer is A: can."], [254.82, 257.43, "I blank drive a car. I am too young."], [257.73, 261.5, "A, can. B, can't. C, cannot to."], [265.07, 266.81, "The answer is B: can't."], [267.95, 269.69, "Which sentence is correct?"], [269.99, 274.4, "A, She can sings.. B, She can sing.. C, She can to sing.."], [277.97, 280.29, "The answer is B: She can sing.."], [281.45, 283.32, "Can you cook? blank"], [283.62, 288.04, "A, Yes, I can.. B, Yes, I do.. C, Yes, I cooks.."], [291.6, 294.12, "The answer is A: Yes, I can.."], [295.28, 298.07, "According to the reading, who speaks English and French?"], [298.37, 302.39, "A, my sister. B, my brother. C, my mother."], [305.93, 307.78, "The answer is A: my sister."], [308.97, 312.2, "Part six: speaking. It's your turn to talk."], [313.05, 315.88, "Write two things you can do and two things you can't do."], [324.68, 326.1, "Now listen to Visal."], [326.4, 339.16, "I can swim and I can cook rice. I can't drive a car and I can't play the piano. I use can for things I am able to do and can't for things I am not able to do. The verb after can stays the same."], [339.46, 341.26, "Excellent answer, Visal!"], [342.15, 346.9, "Great work! Now you can use eight new words and can and can't plus base verb."], [347.2, 351.44, "Today's value is self-awareness. Know your strengths and keep growing."], [351.74, 354.39, "See you in Unit fifteen. Goodbye!"], [354.69, 357.24, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit15-Object-Pronouns-me-him-her": [[0.35, 5.26, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.56, 8.99, "Hi! I'm Visal. Let's learn together!"], [9.29, 16.1, "Unit fifteen: Object Pronouns (me/him/her). Today you will replace nouns after verbs with object pronouns."], [16.4, 19.2, "Here is our lesson map. Let's start!"], [20.17, 23.49, "Part one: words. You will learn eight new words."], [24.35, 25.07, "Me."], [26.08, 28.08, "Me means the object form of I."], [28.68, 29.72, "Please help me."], [30.32, 32.74, "Your turn. Say: Me."], [35.6, 36.55, "Me."], [37.32, 37.99, "Him."], [38.98, 41.05, "Him means the object form of he."], [41.65, 42.7, "I know him."], [43.28, 45.35, "Your turn. Say: Him."], [48.2, 48.78, "Him."], [49.52, 50.32, "Her."], [51.32, 53.42, "Her means the object form of she."], [54.02, 55.09, "I like her."], [55.68, 57.86, "Your turn. Say: Her."], [60.7, 61.27, "Her."], [62.02, 62.87, "Us."], [63.88, 65.77, "Us means the object form of we."], [66.38, 67.63, "She teaches us."], [68.22, 70.17, "Your turn. Say: Us."], [73.03, 73.78, "Us."], [74.52, 75.12, "Them."], [76.12, 78.21, "Them means the object form of they."], [78.82, 79.76, "I see them."], [80.35, 82.35, "Your turn. Say: Them."], [85.2, 85.89, "Them."], [86.65, 87.28, "It."], [88.28, 90.84, "It means the form for a thing or an animal."], [91.45, 92.38, "I love it."], [92.98, 95.14, "Your turn. Say: It."], [98.0, 98.56, "It."], [99.32, 100.17, "Subject."], [101.18, 104.13, "Subject means the person or thing that does the action."], [104.75, 106.44, "In 'I eat', I is the subject."], [107.05, 109.26, "Your turn. Say: Subject."], [112.1, 113.12, "Subject."], [113.88, 114.77, "Object."], [115.78, 118.87, "Object means the person or thing that receives the action."], [119.48, 121.37, "In 'help me', me is the object."], [121.98, 124.37, "Your turn. Say: Object."], [127.23, 128.29, "Object."], [129.1, 132.72, "Part two: dialogue. Let's listen to a conversation."], [133.55, 136.51, "Visal, do we say 'She helps I' or 'She helps me'?"], [137.62, 148.99, "We say 'She helps me'. After a verb, we use an object pronoun. I becomes me, he becomes him, she becomes her, we becomes us, they becomes them."], [150.08, 151.15, "What does 'it' do?"], [152.25, 160.13, "It stays the same: I love it. It is both a subject and an object pronoun. You also stays the same: I see you."], [161.22, 163.36, "Where do the object pronouns go?"], [164.45, 174.51, "After a verb or a preposition: I like him. She talks to us. Look at them. They help us avoid repeating a noun, so the sentence sounds natural."], [175.67, 177.49, "Part three: grammar."], [178.35, 184.35, "Grammar focus: Object pronouns: me and you and him and her and it and us and them."], [184.66, 185.79, "Look at the pattern."], [186.48, 188.03, "She helps me every day."], [188.92, 190.37, "I know him very well."], [191.28, 193.1, "The teacher teaches us English."], [194.03, 202.05, "Use object pronouns after a verb or a preposition: me, you, him, her, it, us, them. Do not use I, he, she, we or they there."], [202.78, 206.31, "Be careful! Don't say: She helps I every day."], [208.27, 210.36, "Say: She helps me every day."], [210.66, 213.31, "Use me, not I, after the verb."], [214.1, 216.65, "Part four: reading. Read and listen."], [217.43, 218.83, "Using Pronouns."], [219.13, 221.66, "I have two friends, and I see them every day."], [222.67, 225.26, "My teacher is kind, so we like her."], [226.27, 228.85, "My brother is funny, and everybody loves him."], [229.83, 231.95, "My mother calls me when dinner is ready."], [232.93, 235.75, "A pronoun saves us from repeating the same noun."], [236.83, 240.89, "Part five: quiz. Five questions. Are you ready?"], [241.75, 244.69, "I like Tom. I see blank every day."], [244.99, 248.02, "A, he. B, him. C, his."], [251.57, 253.49, "The answer is B: him."], [254.65, 256.73, "The teacher helps blank. (we)"], [257.03, 259.91, "A, we. B, our. C, us."], [263.47, 265.42, "The answer is C: us."], [266.58, 268.91, "Look at the girls. Do you know blank?"], [269.21, 272.04, "A, them. B, they. C, their."], [275.6, 277.33, "The answer is A: them."], [278.48, 280.12, "Which sentence is correct?"], [280.42, 284.98, "A, She loves I.. B, She loves me.. C, She loves my.."], [288.53, 290.78, "The answer is B: She loves me.."], [291.92, 295.01, "According to the reading, who calls the writer when dinner is ready?"], [295.31, 298.93, "A, my mother. B, my brother. C, my teacher."], [302.47, 304.71, "The answer is A: my mother."], [305.9, 309.05, "Part six: speaking. It's your turn to talk."], [309.92, 312.32, "Write a sentence using the object pronoun 'them'."], [321.12, 322.56, "Now listen to Visal."], [322.86, 336.64, "I see my grandparents every Sunday, and I help them in the garden. I use them because it replaces my grandparents. Object pronouns like me, him, her, us and them come after the verb."], [336.94, 338.69, "Excellent answer, Visal!"], [339.58, 346.56, "Great work! Now you can use eight new words and object pronouns: me and you and him and her and it and us and them."], [346.86, 350.61, "Today's value is politeness. Say please and thank you."], [350.91, 353.63, "See you in Unit sixteen. Goodbye!"], [353.93, 357.34, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit16-Numbers-Quantities-some-any": [[0.35, 5.14, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.44, 9.18, "Hi! I'm Visal. Let's learn together!"], [9.48, 16.83, "Unit sixteen: Numbers & Quantities (some/any). Today you will talk about amounts with some, any, how many and how much."], [17.13, 19.88, "Here is our lesson map. Let's start!"], [20.83, 24.0, "Part one: words. You will learn eight new words."], [24.85, 25.68, "Some."], [26.68, 29.57, "Some means an amount in positive sentences."], [30.15, 31.6, "I have some apples."], [32.22, 34.14, "Your turn. Say: Some."], [37.0, 37.79, "Some."], [38.55, 39.34, "Any."], [40.35, 43.01, "Any means an amount in questions and negatives."], [43.62, 44.91, "Do you have any water?"], [45.52, 47.46, "Your turn. Say: Any."], [50.3, 50.99, "Any."], [51.75, 52.74, "How many."], [53.75, 56.3, "How many means a question about countable things."], [56.88, 58.65, "How many books do you have?"], [59.25, 61.94, "Your turn. Say: How many."], [64.8, 65.87, "How many."], [66.62, 67.42, "How much."], [68.42, 71.57, "How much means a question about uncountable things or price."], [72.15, 73.49, "How much water do you need?"], [74.08, 76.68, "Your turn. Say: How much."], [79.53, 80.45, "How much."], [81.22, 82.1, "A few."], [83.12, 85.79, "A few means a small number of countable things."], [86.38, 87.85, "I have a few friends."], [88.45, 91.01, "Your turn. Say: A few."], [93.87, 94.93, "A few."], [95.68, 96.5, "A little."], [97.48, 100.3, "A little means a small amount of uncountable things."], [100.88, 102.42, "I need a little water."], [103.02, 105.05, "Your turn. Say: A little."], [107.9, 108.89, "A little."], [109.65, 110.58, "Quantity."], [111.58, 114.13, "Quantity means the amount or number of something."], [114.72, 116.11, "What is the quantity?"], [116.72, 118.95, "Your turn. Say: Quantity."], [121.8, 122.71, "Quantity."], [123.45, 124.31, "Countable."], [125.32, 127.62, "Countable means something you can count."], [128.22, 129.66, "Apples are countable."], [130.25, 132.51, "Your turn. Say: Countable."], [135.37, 136.28, "Countable."], [137.07, 140.58, "Part two: dialogue. Let's listen to a conversation."], [141.42, 145.61, "Visal, in a shop you say 'I want some rice.' Why some?"], [146.72, 158.01, "We use some in positive sentences for an unknown amount: I have some apples. We use any in questions and negatives: Do you have any water? I don't have any money."], [159.12, 160.76, "And how many and how much?"], [161.85, 172.16, "How many is for countable nouns: How many books? How much is for uncountable nouns: How much water? Also how much asks about price."], [173.25, 174.95, "What about small amounts?"], [176.05, 188.06, "Use a few with countable nouns: a few friends. Use a little with uncountable nouns: a little water. They both show a small, but useful, quantity."], [189.2, 190.86, "Part three: grammar."], [191.72, 196.34, "Grammar focus: Quantities: some and any and a few and a little."], [196.64, 197.85, "Look at the pattern."], [198.55, 199.98, "I have some apples."], [200.88, 202.24, "Do you have any water?"], [203.15, 204.62, "I need a little time."], [205.57, 216.84, "Use some in positive sentences and any in questions and negatives. Use how many with countable nouns and how much with uncountable nouns. A few is countable; a little is uncountable."], [217.58, 220.51, "Be careful! Don't say: I don't have some money."], [222.47, 224.42, "Say: I don't have any money."], [224.72, 226.57, "Use any in negatives."], [227.37, 230.36, "Part four: reading. Read and listen."], [231.17, 232.32, "At the Market."], [232.62, 234.62, "I need some rice and some eggs."], [235.63, 238.55, "Do you have any milk? No, I don't have any."], [239.57, 242.57, "How many eggs do you want? A few, please."], [243.57, 246.35, "How much rice do you need? Only a little."], [247.33, 249.98, "Countable things are things we can count, like eggs."], [251.07, 255.16, "Part five: quiz. Five questions. Are you ready?"], [256.02, 258.04, "I have blank friends in this class."], [258.34, 261.3, "A, some. B, any. C, much."], [264.83, 266.47, "The answer is A: some."], [267.62, 269.07, "Do you have blank water?"], [269.37, 272.26, "A, some. B, any. C, a few."], [275.8, 277.3, "The answer is B: any."], [278.45, 280.14, "How blank rice do you want?"], [280.44, 283.43, "A, many. B, much. C, few."], [286.97, 288.86, "The answer is B: much."], [290.02, 291.64, "Which sentence is correct?"], [291.94, 296.62, "A, I don't have some money.. B, I don't have any money.. C, I have any money.."], [300.17, 302.77, "The answer is B: I don't have any money.."], [303.92, 306.47, "According to the reading, what do they need a little of?"], [306.77, 309.92, "A, rice. B, eggs. C, friends."], [313.47, 315.42, "The answer is A: rice."], [316.63, 319.96, "Part six: speaking. It's your turn to talk."], [320.82, 323.41, "Write one sentence with 'some' and one with 'any'."], [332.22, 333.69, "Now listen to Visal."], [333.99, 347.89, "I have some books in my bag. I don't have any pens today. I use some in a positive sentence and any in a negative sentence. In a question, I also use any: Do you have any pens?"], [348.19, 349.82, "Excellent answer, Visal!"], [350.72, 356.33, "Great work! Now you can use eight new words and quantities: some and any and a few and a little."], [356.63, 361.35, "Today's value is planning ahead. Make a plan and take small steps every day."], [361.65, 364.5, "See you in Unit seventeen. Goodbye!"], [364.8, 367.61, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-GA1-Unit17-Time-Expressions-at-on-in": [[0.35, 5.14, "Hello, everyone! I'm Ms. Emma. Welcome to Online Grammar, level A one."], [5.44, 9.1, "Hi! I'm Visal. Let's learn together!"], [9.39, 15.08, "Unit seventeen: Time Expressions (at/on/in). Today you will say when things happen with at, on and in."], [15.38, 18.01, "Here is our lesson map. Let's start!"], [18.97, 22.36, "Part one: words. You will learn eight new words."], [23.22, 23.78, "At."], [24.78, 26.81, "At means used with clock times."], [27.42, 28.96, "I wake up at six."], [29.55, 31.89, "Your turn. Say: At."], [34.73, 35.29, "At."], [36.05, 36.65, "On."], [37.65, 39.85, "On means used with days and dates."], [40.45, 42.08, "We have class on Monday."], [42.68, 44.76, "Your turn. Say: On."], [47.6, 48.64, "On."], [49.38, 50.01, "In."], [51.02, 53.69, "In means used with months, years and seasons."], [54.28, 55.83, "My birthday is in May."], [56.42, 58.36, "Your turn. Say: In."], [61.2, 61.84, "In."], [62.58, 63.24, "Time."], [64.25, 66.52, "Time means the hour and minute of the day."], [67.12, 67.92, "What time is it?"], [68.52, 70.67, "Your turn. Say: Time."], [73.53, 74.27, "Time."], [75.02, 75.68, "Day."], [76.68, 79.29, "Day means twenty-four hours, such as Monday."], [79.88, 81.63, "Sunday is my favourite day."], [82.22, 84.73, "Your turn. Say: Day."], [87.57, 88.24, "Day."], [88.98, 89.72, "Month."], [90.72, 93.1, "Month means one of twelve parts of the year."], [93.68, 94.99, "May is a hot month."], [95.58, 97.57, "Your turn. Say: Month."], [100.43, 101.21, "Month."], [101.95, 103.25, "At 3 o'clock."], [104.25, 107.22, "At 3 o'clock means exactly at three on the clock."], [107.82, 109.26, "We leave at 3 o'clock."], [109.85, 112.54, "Your turn. Say: At 3 o'clock."], [115.4, 117.38, "At 3 o'clock."], [118.12, 119.18, "On Monday."], [120.18, 122.69, "On Monday means during the day called Monday."], [123.28, 124.59, "I swim on Monday."], [125.18, 128.02, "Your turn. Say: On Monday."], [130.87, 132.09, "On Monday."], [132.9, 136.83, "Part two: dialogue. Let's listen to a conversation."], [137.68, 141.97, "Visal, when do you get up? Do you say 'in six o'clock' or 'at six o'clock'?"], [143.08, 153.68, "At six o'clock. We use at for clock times: at 3 o'clock, at noon, at night. We use on for days and dates: on Monday, on 5th May."], [154.78, 155.68, "And in?"], [156.78, 168.42, "We use in for longer times: in May, in 2026, in summer, in the morning. For the morning, afternoon and evening, we use in; but we say at night."], [169.52, 170.76, "How do I remember them?"], [171.85, 183.57, "Think of size. At is a small point of time, on is a day, and in is a longer period. At 3 o'clock, on Monday, in May. Learn these three phrases first."], [184.73, 186.57, "Part three: grammar."], [187.42, 191.05, "Grammar focus: Time prepositions: at and on and in."], [191.35, 192.57, "Look at the pattern."], [193.28, 194.9, "I wake up at six o'clock."], [195.78, 197.53, "We have English on Monday."], [198.42, 200.02, "My birthday is in May."], [200.97, 208.01, "At + clock time, on + day or date, in + month, year, season or part of the day. Say at night, not in the night."], [208.75, 212.11, "Be careful! Don't say: I wake up in six o'clock."], [214.07, 216.21, "Say: I wake up at six o'clock."], [216.51, 218.16, "Use at with clock times."], [218.97, 221.48, "Part four: reading. Read and listen."], [222.27, 223.23, "My Week."], [223.53, 225.94, "I wake up at six o'clock every day."], [226.93, 229.35, "On Monday, I have English class."], [230.37, 232.73, "On Saturday, I visit my grandmother."], [233.73, 236.64, "My birthday is in May, and school starts in October."], [237.63, 240.26, "In the evening I read, and at night I sleep."], [241.37, 245.18, "Part five: quiz. Five questions. Are you ready?"], [246.02, 248.21, "The class starts blank nine o'clock."], [248.51, 251.25, "A, at. B, on. C, in."], [254.8, 256.37, "The answer is A: at."], [257.52, 259.3, "My birthday is blank June."], [259.6, 262.18, "A, at. B, on. C, in."], [265.73, 267.56, "The answer is C: in."], [268.72, 270.53, "We play football blank Sunday."], [270.83, 273.69, "A, in. B, at. C, on."], [277.23, 278.92, "The answer is C: on."], [280.08, 281.85, "Which sentence is correct?"], [282.15, 287.16, "A, I sleep in night.. B, I sleep at night.. C, I sleep on night.."], [290.7, 292.87, "The answer is B: I sleep at night.."], [294.02, 296.42, "According to the reading, when does school start?"], [296.72, 300.47, "A, in October. B, on Monday. C, at night."], [304.03, 305.98, "The answer is A: in October."], [307.17, 310.52, "Part six: speaking. It's your turn to talk."], [311.35, 314.63, "Write three sentences about your schedule using 'at', 'on', and 'in'."], [323.42, 324.84, "Now listen to Visal."], [325.14, 340.07, "I get up at six o'clock. I have English class on Monday. My birthday is in May. I use at for the time on a clock, on for a day, and in for a month. These small words are important in time sentences."]
