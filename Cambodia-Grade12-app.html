<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2-EPE Digital Academy - Cambodia Grade 12 English</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Key Terms: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-5xl bg-slate-800 text-white rounded-2xl p-6 shadow-lg mb-6 flex justify-between items-center flex-wrap gap-3">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">📘 C2-EPE Cambodia Grade 12 English</h1>
            <p class="text-sm text-slate-300">Cambodia Grade 12 English - Online Class</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap justify-end">
            <div class="bg-amber-400 text-slate-900 px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                ⭐ <span id="star-count">0</span>
            </div>
            <div class="bg-pink-500 text-white px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                🏆 <span id="badge-count">0</span> Badges
            </div>
            <button onclick="showMyProgress()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-sm font-bold border border-white/20 cursor-pointer">📊 My Progress</button>
            <div class="bg-slate-700 px-3 py-2 rounded-xl text-sm font-bold border border-red-500">
                <span id="current-level-display">A1</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-4 gap-6">

        <aside id="module-sidebar" class="bg-white rounded-2xl p-4 shadow-md md:col-span-1 flex flex-col gap-3" style="scroll-margin-top:12px;">
            <div id="level-picker-wrap">
                <h2 class="font-bold text-gray-700 border-b pb-2">Grade</h2>
                <div class="flex flex-col gap-3 mt-3">
                    <button onclick="selectLevel('A1')" id="btn-A1" class="level-btn text-left p-3 rounded-xl bg-slate-700 text-white font-semibold transition shadow cursor-pointer">🌱 A1 Grammar</button>
                    <button onclick="selectLevel('A2')" id="btn-A2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📗 A2 Grammar</button>
                    <button onclick="selectLevel('B1')" id="btn-B1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📘 B1 Grammar</button>
                    <button onclick="selectLevel('B2')" id="btn-B2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📙 B2 Grammar</button>
                    <button onclick="selectLevel('C1')" id="btn-C1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🎓 C1 Grammar</button>
                    <button onclick="selectLevel('C2')" id="btn-C2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">👑 C2 Grammar</button>
                </div>
            </div>
            <div id="locked-level-banner" class="hidden bg-slate-50 border border-red-200 rounded-xl p-3 text-center">
                <p class="text-xs text-red-600 font-semibold">TOPIC</p>
                <p id="locked-level-text" class="text-xl font-bold text-slate-900"></p>
            </div>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700" id="unit-select-label">Select Unit (1 to 25)</h2>
            <select id="unit-select" onchange="updateUnit()" class="p-2 rounded-xl border border-gray-300 bg-gray-50 font-semibold text-slate-900">
                <option value="1">Loading...</option>
            </select>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700">Learning Modules</h2>
            <button onclick="switchTab('video')" data-tab="video" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📹 0. Video Lesson</button>
            <button onclick="switchTab('learn')" data-tab="learn" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📖 1. Learn</button>
            <button onclick="switchTab('terms')" data-tab="terms" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗂️ 2. Key Terms</button>
            <button onclick="switchTab('quiz')" data-tab="quiz" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🧩 3. Quiz</button>
            <button onclick="switchTab('think')" data-tab="think" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💭 4. Think About It</button>
            <button onclick="switchTab('funfact')" data-tab="funfact" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📌 5. Did You Know</button>

            <button onclick="switchTab('spelling')" data-tab="spelling" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✏️ 7. Spelling</button>
            <button onclick="switchTab('sentence')" data-tab="sentence" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💬 8. Sentence Building</button>
            <button onclick="switchTab('summary')" data-tab="summary" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📝 9. Summary Writing</button>
            <button onclick="switchTab('headline')" data-tab="headline" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📰 10. Headline Writing</button>
            <button onclick="switchTab('factopinion')" data-tab="factopinion" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔍 11. Fact vs Opinion</button>
            <button onclick="switchTab('debate')" data-tab="debate" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗣️ 12. Debate Corner</button>
            <button onclick="switchTab('discussion')" data-tab="discussion" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💭 13. Discussion</button>
            <button onclick="switchTab('dictation')" data-tab="dictation" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎧 14. Dictation</button>
            <button onclick="switchTab('review')" data-tab="review" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔄 15. Review</button>

            <button onclick="switchTab('challenge')" data-tab="challenge" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✍️ 18. Practice Challenge</button>

        <section id="content-area" class="bg-white rounded-2xl p-6 shadow-md md:col-span-3 flex flex-col justify-between" style="scroll-margin-top:12px;">

            <div class="mt-8 pt-4 border-t flex justify-between items-center text-sm text-gray-500 gap-2 flex-wrap">
                <span id="platform-info">C2-EPE - A1 (Unit 1)</span>
                <div class="flex gap-2">
                    <button onclick="completeActivity()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Finish Activity (+5 ⭐)</button>
                    <button onclick="nextLesson()" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Next Lesson ▶️</button>

        </section>

    </main>

        const curriculum = {"A1": {"1": {"title": "Tenses Review: Present, Past and Future", "terms": ["Habit", "Permanent", "Temporary", "Schedule", "Prediction", "Interrupt", "Sequence", "Contrast"], "passage": "Sophea walks to school every day. Yesterday she was studying when the power went out. Right now she is revising for her exam. Tomorrow she is going to visit her cousin. She thinks it will rain in the evening.", "question": "Which tense do you use for a plan?", "funfact": "Did you know? Match the tense to the time word: every day uses the present simple, yesterday uses the past simple and tomorrow often uses will or going to."}, "2": {"title": "Present Perfect and Duration", "terms": ["Experience", "Already", "Yet", "Since", "For", "Recently", "Ever", "Never"], "passage": "Chenda has lived in Phnom Penh since 2018. She has studied English for four years. She has never travelled abroad. She has already finished her homework. She has not heard the results yet.", "question": "How long have you studied English?", "funfact": "Did you know? Use have or has with the past participle. Use since for a starting point and for for a length of time. Do not use a finished time."}, "3": {"title": "Passive Voice in All Tenses", "terms": ["Passive", "Agent", "Built", "Repaired", "Announce", "Complete", "Produce", "Discover"], "passage": "A new bridge was built near our village in 2005. It is used by farmers every day. Last year the road was repaired. A second bridge will be built next year. The work has been planned by the local council.", "question": "Change to passive: They will announce the results.", "funfact": "Did you know? Use be in the same tense as the active verb, then add the past participle. Add by only when the doer is important."}, "4": {"title": "Reported Speech: Statements, Questions and Commands", "terms": ["Report", "Backshift", "Reporting verb", "Ask", "Tell", "Order", "Whether", "Yesterday"], "passage": "The teacher said that the exam would be on Friday. She asked us whether we had finished the project. She told us to bring a pen. She told us not to be late. Then she asked where the library was.", "question": "Report: She said, 'I will help you.'", "funfact": "Did you know? Move the tense back, change pronouns and time words, and keep statement word order in reported questions. Use tell plus an infinitive for commands."}, "5": {"title": "Conditionals: Zero, First, Second and Third", "terms": ["Condition", "Result", "Unless", "Provided", "Imagine", "Regret", "Probable", "Unreal"], "passage": "If it rains tomorrow, we will stay at home. If I had more money, I would visit Japan. If Dara had studied harder, he would have passed. Unless you hurry, you will miss the bus. If you heat ice, it melts.", "question": "Finish: If I had more free time...", "funfact": "Did you know? Zero uses present + present, first uses present + will, second uses past + would, and third uses past perfect + would have."}, "6": {"title": "Mixed Conditionals, Wish and If Only", "terms": ["Wish", "If only", "Mixed", "Past", "Present", "Opportunity", "Mistake", "Apologise"], "passage": "Vichea missed the bus this morning. He wishes he had left home earlier. If he had caught the bus, he would be at school now. If only he were more organised. Now he promises to set two alarms.", "question": "What do you wish?", "funfact": "Did you know? Use wish plus the past simple for a present regret and the past perfect for a past regret. In unreal sentences use were for all persons."}, "7": {"title": "Relative Clauses: Defining and Non-defining", "terms": ["Relative", "Defining", "Non-defining", "Whose", "Whom", "Omit", "Comma", "Neighbour"], "passage": "The woman who lives next door is a nurse. Her son, who is ten, plays football. The house that they bought is near the river. Their dog, which is very friendly, barks at strangers. They are a family whose kindness I admire.", "question": "Describe a person using who.", "funfact": "Did you know? Use who for people, which for things and whose for possession. Non-defining clauses need commas and cannot use that."}, "8": {"title": "Gerunds and Infinitives", "terms": ["Gerund", "Infinitive", "Enjoy", "Avoid", "Decide", "Manage", "Remember", "Stop"], "passage": "Bopha enjoys reading in the evening. She decided to study medicine. She avoids wasting time on her phone. She managed to finish the book last week. She will remember to bring her notes.", "question": "What do you enjoy doing?", "funfact": "Did you know? Enjoy, avoid and finish take -ing. Want, decide and hope take to + verb. Remember and stop change meaning with the form."}, "9": {"title": "Modals of Deduction and Past Modals", "terms": ["Deduction", "Must", "Might", "Can't", "Should have", "Could have", "Evidence", "Certain"], "passage": "The classroom window is open and the bag is gone. Someone must have taken it. It can't have been the teacher because she was in a meeting. It might have been a student from another class. They should have locked the door.", "question": "What might have happened?", "funfact": "Did you know? Use must for strong certainty, might for possibility and can't for impossibility. For the past, use modal + have + past participle."}, "10": {"title": "Causative and Other Structures: Have, Get and Let", "terms": ["Causative", "Repair", "Haircut", "Allow", "Make", "Let", "Service", "Arrange"], "passage": "Mealea had her phone repaired last week. She also got her hair cut on Saturday. The technician let her watch the repair. He made her sign a form first. Next month she will have her bike serviced.", "question": "What have you had done recently?", "funfact": "Did you know? Use have or get plus an object and a past participle for jobs done by others. Make and let take the base verb without to."}, "11": {"title": "Linking Words and Connectors", "terms": ["However", "Therefore", "Moreover", "Despite", "In spite of", "Because of", "As a result", "Whereas"], "passage": "It rained heavily on Saturday. Despite the rain, the team played football. Although the field was wet, nobody gave up. They won the match; therefore, they reached the final. Moreover, the crowd was very happy.", "question": "Join: It was late. We continued.", "funfact": "Did you know? Use although with a clause and despite with a noun or -ing. Use therefore and as a result to show a result."}, "12": {"title": "Word Formation: Prefixes and Suffixes", "terms": ["Prefix", "Suffix", "Root", "Unhappy", "Careful", "Decision", "Impossible", "Development"], "passage": "Visal is a careful student. He made a wise decision to study every day. It was impossible to finish without help. Her kindness made him feel welcome. The development of his English was clear.", "question": "Make nouns from: kind, decide, move.", "funfact": "Did you know? A prefix changes the meaning and a suffix often changes the word class. Decide which class is needed before you choose."}, "13": {"title": "Phrasal Verbs and Idioms", "terms": ["Phrasal verb", "Idiom", "Give up", "Look after", "Carry on", "Turn down", "Break the ice", "A piece of cake"], "passage": "Sovann nearly gave up learning English. His teacher told him to carry on. He looked after his little sister at home. A joke at the start broke the ice with new friends. Now the exam is a piece of cake.", "question": "Use a phrasal verb in a sentence.", "funfact": "Did you know? Learn phrasal verbs as whole phrases. With a pronoun object, separable verbs put the pronoun in the middle."}, "14": {"title": "Pronunciation, Stress and Intonation", "terms": ["Syllable", "Stress", "Intonation", "Vowel", "Consonant", "Silent", "Rhythm", "Accent"], "passage": "Rotha practises English pronunciation every day. She checks the stress of new words in a dictionary. She uses rising intonation for yes/no questions. She records her voice and listens again. Her speaking is clearer every week.", "question": "How do you practise pronunciation?", "funfact": "Did you know? Stress the right syllable, use falling intonation for statements and wh- questions, and rising intonation for yes/no questions."}, "15": {"title": "Reading Skills: Inference and Vocabulary in Context", "terms": ["Inference", "Imply", "Tone", "Purpose", "Context", "Paraphrase", "Reference", "Conclude"], "passage": "A writer describes a village road after the storm. The road was full of holes and mud. Two drivers refused to travel until it was repaired. The text implies that the road was dangerous. The writer wants readers to demand better roads.", "question": "How do you answer an inference question?", "funfact": "Did you know? Use clues in the text to infer meaning, guess unknown words from context and decide the writer's purpose from tone and content."}, "16": {"title": "Cloze and Error Identification", "terms": ["Error", "Correct", "Agreement", "Article", "Plural", "Countable", "Uncountable", "Word order"], "passage": "Nimol reads a short text full of errors. He finds that goes should replace go in the first sentence. He changes informations to information. He also adds the article the before the library. At the end he reads the corrected text again.", "question": "How do you find errors?", "funfact": "Did you know? Check agreement, tense, articles, prepositions and countable nouns one by one. Information, advice and furniture are uncountable."}, "17": {"title": "Essay Writing: Opinion and Discussion", "terms": ["Essay", "Introduction", "Argument", "Opinion", "Advantage", "Disadvantage", "Example", "Conclusion"], "passage": "Pich writes an essay about social media. She plans two advantages and two disadvantages. Her introduction gives her opinion clearly. Each body paragraph has a reason and an example. She finishes with a short conclusion.", "question": "Give your opinion on social media.", "funfact": "Did you know? Plan first, then write an introduction, body paragraphs with examples and a conclusion. Use linking phrases to connect ideas."}, "18": {"title": "Formal Letters and Emails", "terms": ["Formal", "Application", "Sincerely", "Faithfully", "Enclose", "Opportunity", "Request", "Reply"], "passage": "Kunthea writes a formal email to apply for a library job. She begins with Dear Sir or Madam. She explains her skills and encloses her CV. She thanks them for the opportunity. She ends with Yours faithfully and her name.", "question": "Write a formal opening sentence.", "funfact": "Did you know? Begin with a polite greeting, state the purpose, give clear details and end with a suitable closing. Avoid slang and short forms."}, "19": {"title": "Speaking Test: Interview and Discussion", "terms": ["Interview", "Fluent", "Pause", "Opinion", "Reason", "Agree", "Disagree", "Elaborate"], "passage": "Piseth is in a speaking interview. The examiner asks about his hobbies. He answers directly and gives a reason. He forgets a word, so he describes it. He thanks the examiner politely at the end.", "question": "What is your hobby? Why?", "funfact": "Did you know? Answer directly, give a reason and an example, and keep speaking if you forget a word. Disagree politely with a reason."}, "20": {"title": "Mock Exam Review and Strategy", "terms": ["Mock exam", "Weakness", "Strength", "Timetable", "Review", "Past paper", "Feedback", "Achieve"], "passage": "Sreyleak does a mock exam on Saturday. She marks it and lists her mistakes by topic. She finds that her weakness is reported speech. She makes a timetable and practises it every day. She is ready to achieve her goal.", "question": "What is your study plan?", "funfact": "Did you know? Use mock exams to find weaknesses, make a timetable, practise with past papers and ask for feedback. Stay calm and organised."}}};
        Object.values(curriculum).forEach(g => Object.values(g).forEach(d => { d.vocab = d.terms; d.story = d.passage; }));

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_grammar_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');

        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }
        // The Video button shows 🆕 when this unit's video is new, and "(soon)" when there is none yet
        function updateVideoTabBadge() {
            const btn = document.querySelector('.tab-btn[data-tab="video"]');
            if (!btn) return;
            const v = videoFor(state.level, state.unit);
            btn.textContent = (v && isRecentlyAdded(v.dateAdded) ? '🆕 ' : '') + '📹 0. Video Lesson' + (v ? '' : ' (soon)');
        }

        let ytPlayer = null;
        let ytPollInterval = null;
        let ytAnsweredCheckpoints = new Set();
        let ytApiLoadPromise = null;
        let ytFallbackTimer = null;
        let ytCurrentConfig = null;

        // Stops the video and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

        function renderVideoLesson(contentDiv) {
            stopVideo();
            ytAnsweredCheckpoints = new Set();
            const unitData = curriculum[state.level][state.unit];
            ytCurrentConfig = videoFor(state.level, state.unit);

            if (!ytCurrentConfig) {
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                    <div class="bg-indigo-50 border-2 border-dashed border-indigo-200 rounded-2xl p-10 text-center">
                        <div class="text-5xl mb-4">🎬</div>
                        <p class="text-xl font-bold text-indigo-900 mb-2">Video Coming Soon!</p>
                        <p class="text-gray-600 mb-4">Your teacher is preparing this unit's video. For now, try the other learning modules!</p>
                        <button onclick="switchTab('listening')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Start with Listening</button>
                    </div>`;
                return;
            }

            if (ytCurrentConfig.mp4) { renderMp4Lesson(contentDiv, unitData); return; }
            const watchUrl = 'https://www.youtube.com/watch?v=' + ytCurrentConfig.id;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch the video, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <div id="yt-player-el" class="w-full h-full"></div>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">Loading video player…</p>
                <p class="text-center mt-1"><a href="${watchUrl}" target="_blank" rel="noopener" class="text-sm text-indigo-600 underline">If the video does not play here, tap to open it in YouTube ↗</a></p>`;

            const showFallback = (why) => {
                const msg = document.getElementById('video-msg');
                if (msg) msg.innerHTML = `⚠️ ${why} <a href="${watchUrl}" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">Open the video in YouTube ↗</a>`;
            };
            ytFallbackTimer = setTimeout(() => { if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') showFallback('The video is taking long to load.'); }, 10000);

            const wanted = ytCurrentConfig.id;
            loadYouTubeApi().then(() => {
                if (!ytCurrentConfig || ytCurrentConfig.id !== wanted || !document.getElementById('yt-player-el')) return;
                ytPlayer = new YT.Player('yt-player-el', {
                    videoId: wanted,
                    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
                    events: {
                        onReady: () => { if (ytFallbackTimer) clearTimeout(ytFallbackTimer); const m = document.getElementById('video-msg'); if (m) m.textContent = '▶️ Press play to start the lesson!'; },
                        onStateChange: onYtStateChange,
                        onError: () => showFallback('This video cannot play inside the lesson.')
                    }
                });
            }).catch(() => showFallback('The video player could not load.'));
        }

esterday."], [125.78, 127.91, "Yesterday means the day before today."], [128.52, 130.24, "He said it happened yesterday."], [130.85, 133.32, "Your turn. Say: Yesterday."], [136.17, 137.26, "Yesterday."], [138.07, 141.38, "Part two: dialogue. Let's listen to a conversation."], [142.22, 145.95, "Visal, how do I change direct speech into reported speech?"], [147.05, 157.96, "Move the tense one step back and change pronouns and time words. I am tired becomes She said that she was tired, and tomorrow becomes the next day."], [159.05, 160.51, "What about questions?"], [161.62, 173.47, "Use normal word order, not a question order, and no question mark. Where do you live becomes He asked where I lived. Yes/no questions use if or whether."], [174.58, 175.77, "And commands?"], [176.88, 186.74, "Use tell or ask plus an infinitive. Close the door becomes She told me to close the door. Do not open it becomes He told us not to open it."], [187.9, 189.42, "Part three: grammar."], [190.28, 193.37, "Grammar focus: Reported speech patterns."], [193.67, 194.85, "Look at the pattern."], [195.55, 197.2, "She said that she was tired."], [198.12, 199.76, "He asked me where I lived."], [200.7, 209.61, "Move the tense back, change pronouns and time words, and keep statement word order in reported questions. Use tell plus an infinitive for commands."], [210.35, 213.88, "Be careful! Don't say: He asked me where did I live."], [215.83, 218.33, "Say: He asked me where I lived."], [218.63, 219.83, "Statement order."], [220.63, 223.04, "Part four: reading. Read and listen."], [223.83, 225.25, "What the Teacher Said."], [225.55, 228.17, "The teacher said that the exam would be on Friday."], [229.17, 231.71, "She asked us whether we had finished the project."], [232.7, 234.35, "She told us to bring a pen."], [235.37, 236.95, "She told us not to be late."], [237.93, 240.18, "Then she asked where the library was."], [241.27, 245.13, "Part five: quiz. Five questions. Are you ready?"], [245.98, 248.98, now."], [175.82, 177.15, "What does unless mean?"], [178.25, 188.25, "Unless means if not. Unless you hurry, you will be late means If you do not hurry, you will be late. Do not use a second negative after unless."], [189.4, 191.04, "Part three: grammar."], [191.88, 195.02, "Grammar focus: If plus tense, result clause."], [195.32, 196.58, "Look at the pattern."], [197.28, 199.31, "If I had money, I would travel."], [200.22, 202.9, "If I had studied, I would have passed."], [203.87, 212.15, "Zero uses present + present, first uses present + will, second uses past + would, and third uses past perfect + would have."], [212.88, 216.79, "Be careful! Don't say: If I will study, I pass."], [218.73, 221.05, "Say: If I study, I will pass."], [221.35, 222.66, "No will after if."], [223.47, 226.05, "Part four: reading. Read and listen."], [226.83, 227.75, "If Only."], [228.05, 230.47, "If it rains tomorrow, we will stay at home."], [231.47, 233.94, "If I had more money, I would visit Japan."], [234.93, 238.05, "If Dara had studied harder, he would have passed."], [239.03, 241.21, "Unless you hurry, you will miss the bus."], [242.2, 243.97, "If you heat ice, it melts."], [245.07, 249.04, "Part five: quiz. Five questions. Are you ready?"], [249.88, 253.0, "Second conditional: If I blank rich, I would travel."], [253.3, 256.16, "A, am. B, will be. C, were."], [259.7, 261.36, "The answer is C: were."], [262.52, 265.43, "Third: If I had studied, I blank passed."], [265.73, 268.85, "A, would have. B, will. C, would."], [272.4, 274.16, "The answer is A: would have."], [275.32, 276.83, "Unless means blank."], [277.13, 280.31, "A, when. B, if not. C, because."], [283.87, 285.76, "The answer is B: if not."], [286.92, 289.0, "Zero conditional is for blank."], [289.3, 293.11, "A, regrets. B, dreams. C, facts."], [296.67, 298.63, "The answer is C: facts."], [299.78, 302.18, "First: If it rains, I blank stay."], [302.48, 305.48, "A, will. B, would. C, had."], [309.03, 310.67, "The answer is  Ms. Emma. Welcome to Online Cambodia Grade twelve English."], [6.38, 9.9, "Hi! I'm Visal. Let's learn together!"], [10.2, 17.66, "Unit seven: Relative Clauses: Defining and Non-defining. Today you will add information with who, which, that and whose."], [17.95, 20.56, "Here is our lesson map. Let's start!"], [21.5, 24.96, "Part one: words. You will learn eight new words."], [25.82, 26.82, "Relative."], [27.82, 30.06, "Relative means connecting information."], [30.65, 32.31, "Who is a relative pronoun."], [32.92, 35.49, "Your turn. Say: Relative."], [38.33, 39.37, "Relative."], [40.12, 41.09, "Defining."], [42.08, 44.49, "Defining means necessary to identify."], [45.08, 47.3, "A defining clause is essential."], [47.92, 50.58, "Your turn. Say: Defining."], [53.43, 54.27, "Defining."], [55.02, 56.17, "Non-defining."], [57.18, 59.66, "Non-defining means extra information."], [60.25, 61.84, "It is shown with commas."], [62.45, 65.38, "Your turn. Say: Non-defining."], [68.23, 69.43, "Non-defining."], [70.18, 70.94, "Whose."], [71.95, 73.66, "Whose means showing possession."], [74.25, 75.86, "The girl whose bag is red."], [76.45, 78.63, "Your turn. Say: Whose."], [81.47, 82.2, "Whose."], [82.95, 83.64, "Whom."], [84.65, 86.59, "Whom means object form of who."], [87.18, 88.57, "The man whom I met."], [89.18, 91.72, "Your turn. Say: Whom."], [94.57, 95.19, "Whom."], [95.95, 96.82, "Omit."], [97.82, 99.44, "Omit means to leave out."], [100.05, 101.25, "You can omit that."], [101.85, 104.56, "Your turn. Say: Omit."], [107.4, 108.16, "Omit."], [108.92, 109.63, "Comma."], [110.62, 112.59, "Comma means a punctuation mark."], [113.18, 114.66, "Use a comma here."], [115.25, 117.25, "Your turn. Say: Comma."], [120.1, 121.03, "Comma."], [121.78, 122.7, "Neighbour."], [123.72, 126.03, "Neighbour means a person living nearby."], [126.62, 128.06, "My neighbour is kind."], [128.65, 131.07, "Your turn. Say: Neighbour."], [133.93, 134.88, "Neighbour."], [135.67, 139.41, "Part two: dialogue. Let's listen to a conversation."], [140.25, 143.03, "Visal, what is a defining relative clause?"], [144.12, 156.2, "It gives necessary information that identifies the noun: The student who sits next to me is Sok. We do not use commas, and we can use that instead of who or which."], [157.28, 158.82, "And a non-defining one?"], [159.92, 171.76, "It gives extra information and uses commas: My brother, who lives in Kampot, is a teacher. We cannot use that and we cannot omit the pronoun."], [172.85, 174.69, "When can I leave the pronoun out?"], [175.78, 185.2, "In a defining clause, you can omit who, which or that when it is the object: The book that I read was good, or The book I read was good."], [186.37, 187.96, "Part three: grammar."], [188.82, 192.37, "Grammar focus: who and which and that and whose."], [192.67, 193.89, "Look at the pattern."], [194.58, 196.91, "The student who sits next to me is Sok."], [197.82, 200.76, "My brother, who lives in Kampot, is a teacher."], [201.7, 208.39, "Use who for people, which for things and whose for possession. Non-defining clauses need commas and cannot use that."], [209.15, 213.28, "Be careful! Don't say: My brother, that lives in Kampot, is kind."], [215.23, 218.28, "Say: My brother, who lives in Kampot, is kind."], [218.58, 220.07, "No that after a comma."], [220.87, 223.58, "Part four: reading. Read and listen."], [224.37, 225.48, "My Neighbours."], [225.78, 228.1, "The woman who lives next door is a nurse."], [229.1, 231.55, "Her son, who is ten, plays football."], [232.57, 234.65, "The house that they bought is near the river."], [235.63, 238.72, "Their dog, which is very friendly, barks at strangers."], [239.73, 242.19, "They are a family whose kindness I admire."], [243.3, 247.37, "Part five: quiz. Five questions. Are you ready?"], [248.22, 249.69, "Who is used for blank."], [249.99, 253.54, "A, places. B, people. C, things."], [257.1, 258.91, "The answer is B: people."], [260.05, 261.97, "Non-defining clauses use b 9, "I want to learn."], [44.58, 47.83, "Your turn. Say: Infinitive."], [50.67, 51.71, "Infinitive."], [52.45, 53.36, "Enjoy."], [54.35, 56.01, "Enjoy means to like doing."], [56.62, 57.78, "I enjoy reading."], [58.38, 61.31, "Your turn. Say: Enjoy."], [64.17, 65.08, "Enjoy."], [65.82, 66.78, "Avoid."], [67.78, 69.72, "Avoid means to stay away from."], [70.32, 71.81, "Avoid making noise."], [72.42, 75.29, "Your turn. Say: Avoid."], [78.13, 78.97, "Avoid."], [79.72, 80.6, "Decide."], [81.62, 83.53, "Decide means to make a choice."], [84.15, 85.67, "I decided to study."], [86.28, 89.31, "Your turn. Say: Decide."], [92.17, 93.19, "Decide."], [93.95, 94.94, "Manage."], [95.95, 98.15, "Manage means to succeed in doing."], [98.75, 100.38, "She managed to finish."], [100.98, 103.55, "Your turn. Say: Manage."], [106.4, 107.25, "Manage."], [108.02, 109.01, "Remember."], [110.02, 112.06, "Remember means to keep in mind."], [112.65, 114.07, "Remember to call me."], [114.68, 117.29, "Your turn. Say: Remember."], [120.13, 121.25, "Remember."], [122.02, 122.87, "Stop."], [123.88, 125.79, "Stop means to end an action."], [126.38, 127.66, "He stopped talking."], [128.25, 130.54, "Your turn. Say: Stop."], [133.4, 134.15, "Stop."], [134.93, 138.71, "Part two: dialogue. Let's listen to a conversation."], [139.55, 141.89, "Visal, which verbs take the gerund?"], [142.98, 152.69, "Enjoy, avoid, finish, keep, suggest and mind are followed by -ing, such as I enjoy reading and She suggested going early."], [153.78, 155.68, "Which verbs take the infinitive?"], [156.78, 166.54, "Want, decide, hope, plan, manage and refuse are followed by to + verb, such as I decided to study and We hope to win."], [167.65, 169.1, "Are there verbs with both?"], [170.22, 182.37, "Yes, with different meanings. Remember to lock the door means do it. Remember locking it means recall that you did. Stop to eat means pause to eat, and stop eating means quit."], [183.53, 185.5, "Part three: grammar."], [186.35, 189.86, "Grammar focus: verb plus -ing or to plus verb."], [190.16, 191.4, "Look at the pattern."], [192.12, 193.9, "I enjoy reading in the evening."], [194.78, 196.82, "I decided to study medicine."], [197.77, 205.02, "Enjoy, avoid and finish take -ing. Want, decide and hope take to + verb. Remember and stop change meaning with the form."], [205.78, 208.81, "Be careful! Don't say: I enjoy to read."], [210.77, 212.41, "Say: I enjoy reading."], [212.71, 214.15, "Enjoy + -ing."], [214.93, 217.98, "Part four: reading. Read and listen."], [218.77, 220.03, "Plans for Study."], [220.34, 222.26, "Bopha enjoys reading in the evening."], [223.27, 225.06, "She decided to study medicine."], [226.07, 228.28, "She avoids wasting time on her phone."], [229.27, 231.53, "She managed to finish the book last week."], [232.53, 234.46, "She will remember to bring her notes."], [235.57, 239.99, "Part five: quiz. Five questions. Are you ready?"], [240.85, 242.66, "Enjoy is followed by blank."], [242.96, 246.94, "A, to + verb. B, base verb. C, -ing."], [250.5, 252.17, "The answer is C: -ing."], [253.32, 255.16, "Decide is followed by blank."], [255.47, 258.96, "A, to + verb. B, -ing. C, that only."], [262.5, 264.42, "The answer is A: to + verb."], [265.58, 267.54, "Remember to lock means blank."], [267.84, 271.01, "A, never. B, do it. C, you did it."], [274.57, 276.46, "The answer is B: do it."], [277.62, 279.06, "Avoid blank noise."], [279.36, 282.4, "A, to make. B, make. C, making."], [285.93, 287.88, "The answer is C: making."], [289.02, 290.61, "Stop eating means blank."], [290.91, 294.6, "A, quit eating. B, pause to eat. C, start."], [298.13, 300.12, "The answer is A: quit eating."], [301.33, 304.47, "Part six: speaking. It's your turn to talk."], [305.32, 306.68, "What do you enjoy doing?"], [315.48, 317.11, "Now listen to Visal."], [317.41, 325.75, "I enjoy reading English stories in the evening. I also like listening to songs. I have decided to speak English every day."], [326.06, 327.88, "Excellent answer, Visal!"], [328.78, 333.51, "Great work! Now you can use eight new words and verb plus -ing or to plus verb."], [333.81, 338.4, "Today's value is dedication. Practise a little every day, and you will get better."], [338.7, 341.12, "See you in Unit nine. Goodbye!"], [341.43, 344.35, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X12-Unit09-Modals-of-Deduction-and-Past-Modals": [[0.35, 5.83, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade twelve English."], [6.13, 9.51, "Hi! I'm Visal. Let's learn together!"], [9.81, 17.47, "Unit nine: Modals of Deduction and Past Modals. Today you will guess about the present and past with must, might and can't."], [17.77, 20.44, "Here is our lesson map. Let's start!"], [21.4, 24.71, "Part one: words. You will learn eight new words."], [25.55, 26.6, "Deduction."], [27.58, 30.11, "Deduction means a conclusion from clues."], [30.72, 32.23, "That is a good deduction."], [32.82, 35.61, "Your turn. Say: Deduction."], [38.47, 39.4, "Deduction."], [40.15, 41.08, "Must."], [42.08, 43.78, "Must means almost certain."], [44.38, 45.65, "He must be at home."], [46.25, 48.38, "Your turn. Say: Must."], [51.23, 52.19, "Must."], [52.95, 53.79, "Might."], [54.78, 56.23, "Might means possible."], [56.82, 58.11, "She might be late."], [58.72, 60.71, "Your turn. Say: Might."], [63.57, 64.36, "Might."], [65.12, 65.82, "Can't."], [66.82, 68.38, "Can't means impossible."], [68.98, 70.22, "That can't be true."], [70.82, 72.89, "Your turn. Say: Can't."], [75.73, 76.62, "Can't."], [77.38, 78.31, "Should have."], [79.32, 81.51, "Should have means advice about the past."], [82.12, 83.54, "You should have called."], [84.15, 86.94, "Your turn. Say: Should have."], [89.8, 90.81, "Should have."], [91.55, 92.47, "Could have."], [93.48, 95.59, "Could have means a past possibility."], [96.18, 97.43, "I could have won."], [98.02, 100.58, "Your turn. Say: Could have."], [103.43, 104.43, "Could have."], [105.18, 106.29, "Evidence."], [107.28, 109.74, "Evidence means facts that give support."], [110.35, 111.95, "There is clear evidence."], [112.55, 114.89, "Your turn. Say: Evidence."], [117.73, 118.78, "Evidence."], [119.52, 120.33, "Certain."], [121.32, 122.79, "Certain means sure."], [123.38, 124.55, "I am certain."], [125.15, 127.37, "Your turn. Say: Certain."], [130.23, 131.07, "Certain."], [131.87, 135.37, "Part two: dialogue. Let's listen to a conversation."], [136.22, 138.31, "Visal, how do I make deductions?"], [139.42, 150.23, "Use must when you are almost sure, might or may when it is possible, and can't when it is impossible. The lights are on, so he must be at home."], [151.32, 152.64, "How about the past?"], [153.75, 162.3, "Use modal + have + past participle: She must have left early, He might have forgotten, They can't have arrived yet."], [163.38, 165.36, "What about criticism and advice?"], [166.45, 178.6, "Should have shows a past mistake: You should have studied. Could have shows an unused chance: I could have passed. Needn't have means it was not necessary."], [179.77, 181.31, "Part three: grammar."], [182.15, 186.05, "Grammar focus: modal plus have plus past participle."], [186.35, 187.53, "Look at the pattern."], [188.22, 189.59, "He must be at home."], [190.48, 192.0, "She must have left early."], [192.93, 201.15, "Use must for strong certainty, might for possibility and can't for impossibility. For the past, use modal + have + past participle."], [201.88, 205.19, "Be careful! Don't say: She must left early."], [207.13, 209.12, "Say: She must have left early."], [209.42, 211.63, "modal + have + V3."], [212.43, 214.96, "Part four: reading. Read and listen."], [215.77, 216.88, "Who Took It?."], [217.18, 220.36, "The classroom window is open and the bag is gone."], [221.37, 222.93, "Someone must have taken it."], [223.93, 227.01, "It can't have been the teacher because she was in a meeting."], [228.0, 230.7, "It might have been a student from another class."], [231.7, 233.07, "They should have locked the door."], [234.17, 238.06, "Part five: quiz. Five questions. Are you ready?"], [238.92, 241.22, "Almost certain: He blank be at home."], [241.52, 244.6, "A, must. B, can't. C, needn't."], [248.17, 249.96, "The answer is A: must."], [251.12, 253.56, "Impossible: That blank be true."], [253.86, 256.81, "A, should. B, can't. C, must."], [260.37, 262.53, "The answer is B: can't."], [263.68, 266.41, "Past deduction: She must blank left."], [266.71, 269.76, "A, has. B, had. C, have."], [273.3, 274.93, "The answer is C: have."], [276.08, 279.32, "Advice about the past: You should blank called."], [279.62, 282.42, "A, have. B, be. C, to."], [285.97, 288.13, "The answer is A: have."], [289.28, 290.42, "What was gone?"], [290.72, 294.26, "A, the window. B, the bag. C, the door."], [297.8, 300.0, "The answer is B: the bag."], [301.2, 304.2, "Part six: speaking. It's your turn to talk."], [305.05, 306.45, "What might have happened?"], [315.25, 316.69, "Now listen to Visal."], [316.99, 325.12, "The bus might have broken down. Perhaps there was heavy traffic. He can't have forgotten because he is always on time."], [325.42, 327.52, "Excellent answer, Visal!"], [328.42, 333.81, "Great work! Now you can use eight new words and modal plus have plus past participle."], [334.11, 339.08, "Today's value is analytical thinking. Look for the pattern underneath the surface."], [339.38, 341.72, "See you in Unit ten. Goodbye!"], [342.02, 345.6, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X12-Unit10-Causative-and-Other-Structures-Have-Get-and-Let": [[0.35, 5.87, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade twelve English."], [6.17, 9.57, "Hi! I'm Visal. Let's learn together!"], [9.87, 17.27, "Unit ten: Causative and Other Structures: Have, Get and Let. Today you will say that someone else does something for you."], [17.57, 20.13, "Here is our lesson map. Let's start!"], [21.07, 24.28, "Part one: words. You will learn eight new words."], [25.12, 2 l!"], [334.15, 338.53, "Great work! Now you can use eight new words and verb plus particle."], [338.83, 343.32, "Today's value is perseverance. Keep trying, even when it is hard."], [343.62, 346.35, "See you in Unit fourteen. Goodbye!"], [346.65, 349.82, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X12-Unit14-Pronunciation-Stress-and-Intonation": [[0.35, 5.97, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade twelve English."], [6.27, 9.83, "Hi! I'm Visal. Let's learn together!"], [10.13, 17.74, "Unit fourteen: Pronunciation, Stress and Intonation. Today you will stress the right syllable and use clear intonation."], [18.04, 20.72, "Here is our lesson map. Let's start!"], [21.67, 24.78, "Part one: words. You will learn eight new words."], [25.65, 26.62, "Syllable."], [27.62, 30.0, "Syllable means a unit of sound in a word."], [30.58, 32.36, "Banana has three syllables."], [32.95, 35.49, "Your turn. Say: Syllable."], [38.33, 39.53, "Syllable."], [40.28, 41.25, "Stress."], [42.25, 44.76, "Stress means extra force on a syllable."], [45.35, 46.95, "Stress the first syllable."], [47.55, 50.12, "Your turn. Say: Stress."], [52.97, 54.05, "Stress."], [54.78, 55.87, "Intonation."], [56.85, 59.63, "Intonation means the rise and fall of the voice."], [60.22, 61.94, "Use rising intonation."], [62.55, 65.44, "Your turn. Say: Intonation."], [68.3, 69.28, "Intonation."], [70.02, 70.76, "Vowel."], [71.75, 74.39, "Vowel means a, e, i, o or u sound."], [74.98, 76.11, "A is a vowel."], [76.72, 79.41, "Your turn. Say: Vowel."], [82.27, 83.09, "Vowel."], [83.85, 84.81, "Consonant."], [85.82, 88.04, "Consonant means a letter that is not a vowel."], [88.65, 90.07, "B is a consonant."], [90.68, 92.98, "Your turn. Say: Consonant."], [95.83, 96.8, "Consonant."], [97.55, 98.42, "Silent."], [99.42, 101.23, "Silent means not pronounced."], [101.82, 103.27, "K is silent in knife."], [103.88, 106.25, "Your turn. Say: Silent."], [109.1, 110.07, "Silent."], [110.82, 111.74, "Rhythm."], [112.75, 115.5, "Rhythm means a pattern of strong and weak sounds."], [116.12, 117.77, "English has a clear rhythm."], [118.38, 121.14, "Your turn. Say: Rhythm."], [124.0, 124.72, "Rhythm."], [125.48, 126.48, "Accent."], [127.48, 129.37, "Accent means a way of speaking."], [129.98, 131.52, "She has a clear accent."], [132.12, 134.97, "Your turn. Say: Accent."], [137.8, 138.91, "Accent."], [139.7, 142.91, "Part two: dialogue. Let's listen to a conversation."], [143.75, 146.5, "Visal, how do I find word stress?"], [147.62, 162.31, "Check the dictionary. Many two-syllable nouns are stressed on the first syllable, such as TAble, and many verbs on the second, such as reLAX. Words ending in -tion stress the syllable before it."], [163.42, 164.93, "What about intonation?"], [166.02, 180.88, "Use falling intonation for statements and wh- questions, and rising intonation for yes/no questions. Rising voice also shows that a list is not finished."], [181.98, 183.53, "What about silent letters?"], [184.62, 195.51, "Some letters are not pronounced, such as k in knife, b in doubt and w in write. Learn them in words, and practise with a recording of your own voice."], [196.67, 198.4, "Part three: grammar."], [199.25, 202.17, "Grammar focus: stress, intonation and sounds."], [202.47, 203.56, "Look at the pattern."], [204.25, 206.67, "Do you like tea? ↗"], [207.58, 209.9, "Where do you live? ↘"], [210.83, 218.38, "Stress the right syllable, use falling intonation for statements and wh- questions, and rising intonation for yes/no questions."], [219.12, 222.59, "Be careful! Don't say: I stress the wrong syllable."], [224.53, 227.04, "Say: I check the stress in a dictionary."], [227.34, 228.48, "Check stress."], [229.3, 232.19, "Part four: reading. Read and listen."], [233.0, 234.42, "Speaking Clearly."], [234.72, 237.67, "Rotha practises English pronunciation every day."], [238.67, 241.55, "She checks the stress of new words in a dictionary."], [242.53, 245.67, "She uses rising intonation for yes/no questions."], [246.67, 249.24, "She records her voice and listens again."], [250.23, 252.47, "Her speaking is clearer every week."], [253.57, 257.58, "Part five: quiz. Five questions. Are you ready?"], [258.42, 260.43, "A syllable is a unit of blank."], [260.73, 264.4, "A, spelling. B, number. C, sound."], [267.97, 269.81, "The answer is C: sound."], [270.95, 273.43, "Yes/no questions use blank intonation."], [273.73, 277.08, "A, rising. B, falling. C, no."], [280.63, 282.44, "The answer is A: rising."], [283.58, 285.11, "The k in knife is blank."], [285.41, 288.31, "A, a vowel. B, silent. C, loud."], [291.87, 293.88, "The answer is B: silent."], [295.02, 298.0, "Wh- questions often use blank intonation."], [298.3, 301.72, "A, rising. B, flat. C, falling."], [305.27, 307.2, "The answer is C: falling."], [308.35, 310.29, "How does Rotha check stress?"], [310.59, 314.66, "A, a dictionary. B, a map. C, a calendar."], [318.2, 320.21, "The answer is A: a dictionary."], [321.4, 324.32, "Part six: speaking. It's your turn to talk."], [325.18, 327.18, "How do you practise pronunciation?"], [335.98, 337.53, "Now listen to Visal."], [337.83, 349.48, "I check word stress in a dictionary and I repeat new words aloud. I record my voice and listen to my mistakes. I also copy the intonation of my teacher."], [349.78, 351.56, "Excellent answer, Visal!"], [352.45, 357.52, "Great work! Now you can use eight new words and stress, intonation and sounds."], [357.82, 362.98, "Today's value is self-discipline. Control your habits, so your habits do not control you."], [363.28, 365.87, "See you in Unit fifteen. Goodbye!"], [366.17, 368.98, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X12-Unit15-Reading-Skills-Inference-and-Vocabulary-in-Context": [[0.35, 5.66, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade twelve English."], [5.96, 9.27, "Hi! I'm Visal. Let's learn together!"], [9.57, 18.04, "Unit fifteen: Reading Skills: Inference and Vocabulary in Context. Today you will understand ideas that are not stated directly."], [18.34, 21.09, "Here is our lesson map. Let's start!"], [22.03, 25.01, "Part one: words. You will learn eight new words."], [25.85, 26.9, "Inference."], [27.88, 30.29, "Inference means a conclusion from clues."], [30.88, 32.33, "Make an inference."], [32.92, 35.49, "Your turn. Say: Inference."], [38.33, 39.44, "Inference."], [40.18, 41.3, "Imply."], [42.32, 44.76, "Imply means to suggest without saying."], [45.35, 47.21, "The writer implies a problem."], [47.82, 50.3, "Your turn. Say: Imply."], [53.13, 54.3, "Imply."], [55.05, 55.81, "Tone."], [56.82, 58.83, "Tone means the writer's attitude."], [59.42, 61.0, "The tone is serious."], [61.58, 63.73, "Your turn. Say: Tone."], [66.57, 67.32, "Tone."], [68.08, 68.92, "Purpose."], [69.92, 71.93, "Purpose means the reason for writing."], [72.52, 73.85, "What is the purpose?"], [74.45, 77.06, "Your turn. Say: Purpose."], [79.9, 80.87, "Purpose."], [81.62, 82.63, "Context."], [83.62, 86.09, "Context means words around a word."], [86.68, 88.18, "Use the context."], [88.78, 91.27, "Your turn. Say: Context."], [94.13, 95.31, "Context."], [96.05, 97.16, "Paraphrase."], [98.15, 100.47, "Paraphrase means to say in other words."], [101.08, 102.79, "Paraphrase the sentence."], [103.38, 105.83, "Your turn. Say: Paraphrase."], [108.67, 109.74, "Paraphrase."], [110.48, 111.48, "Reference."], [112.48, 114.84, "Reference means a word that points back."], [115.45, 117.3, "It is a reference to the city."], [117.88, 120.16, "Your turn. Say: Reference."], [123.0, 124.07, "Reference."], [124.82, 125.66, "Conclude."], [126.65, 129.11, "Conclude means to decide from evidence."], [129.72, 131.48, "I conclude that he is right."], [132.08, 134.67, "Your turn. Say: Conclude."], [137.5, 138.56, "Conclude."], [139.37, 143.11, "Part two: dialogue. Let's listen to a conversation."], [143.95, 146.07, "Visal, what is an inference question?"], [147.15, 156.81, "It asks about something the text suggests but does not say directly. You must use clues in the text, such as the writer's words and examples, to decide."], [157.92, 159.78, "How do I guess unknown words?"], [160.88, 172.56, "Look at the words around it. Decide whether it is a noun, verb or adjective, check for a prefix or suffix, and test whether your guess makes sense in the sentence."], [173.65, 175.47, "What about the writer's purpose?"], [176.58, 189.24, "Ask whether the writer wants to inform, persuade or entertain. Strong opinions and commands often show persuasion, and facts and numbers show information."], [190.4, 191.82, "Part three: grammar."], [192.68, 195.07, "Grammar focus: clues to inference."], [195.37, 196.53, "Look at the pattern."], [197.22, 199.89, "The text implies that the road was dangerous."], [200.78, 202.71, "I conclude that he was tired."], [203.67, 210.44, "Use clues in the text to infer meaning, guess unknown words from context and decide the writer's purpose from tone and content."], [211.18, 214.51, "Be careful! Don't say: I use my own opinion."], [216.47, 218.85, "Say: I use clues from the text."], [219.15, 220.42, "Use evidence."], [221.23, 224.06, "Part four: reading. Read and listen."], [224.87, 226.54, "Reading Between the Lines."], [226.84, 229.72, "A writer describes a village road after the storm."], [230.73, 232.88, "The road was full of holes and mud."], [233.9, 236.82, "Two drivers refused to travel until it was repaired."], [237.83, 240.63, "The text implies that the road was dangerous."], [241.63, 244.18, "The writer wants readers to demand better roads."], [245.27, 249.36, "Part five: quiz. Five questions. Are you ready?"], [250.22, 252.33, "An inference is not stated blank."], [252.63, 255.75, "A, directly. B, at all. C, ever."], [259.3, 261.4, "The answer is A: directly."], [262.55, 264.47, "Guess unknown words from the blank."], [264.77, 269.11, "A, author name. B, context. C, title only."], [272.67, 274.74, "The answer is B: context."], [275.88, 277.86, "The writer wants readers to blank."], [278.16, 282.1, "A, buy cars. B, stay home. C, demand better roads."], [285.67, 288.43, "The answer is C: demand better roads."], [289.58, 291.35, "Facts and numbers show blank."], [291.65, 295.54, "A, information. B, entertainment. C, fear."], [299.1, 301.44, "The answer is A: information."], [302.58, 304.58, "Why did two drivers refuse?"], [304.88, 309.29, "A, they were ill. B, the road was bad. C, it was night."], [312.83, 315.55, "The answer is B: the road was bad."], [316.77, 320.13, "Part six: speaking. It's your turn to talk."], [320.98, 323.02, "How do you answer an inference question?"], [331.82, 333.39, "Now listen to Visal."], [333.69, 344.2, "I look for clues in the text and think about what they suggest. I do not use my own opinion. I choose the answer that the evidence supports."], [344.5, 346.13, "Excellent answer, Visal!"], [347.02, 351.02, "Great work! Now you can use eight new words and clues to inference."], [351.32, 356.1, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [356.4, 359.14, "See you in Unit sixteen. Goodbye!"], [359.44, 362.87, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-X12-Unit16-Cloze-and-Error-Identification": [[0.35, 5.85, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambodia Grade twelve English."], [6.15, 9.61, "Hi! I'm Visal. Let's learn together!"], [9.9, 16.81, "Unit sixteen: Cloze and Error Identification. Today you will find and correct grammar mistakes in a text."], [17.11, 19.59, "Here is our lesson map. Let's start!"], [20.53, 23.58, "Part one: words. You will learn eight new words."], [24.42, 25.15, "Error."], [26.15, 27.72, "Error means a mistake."], [28.32, 29.32, "Find the error."], [29.92, 32.23, "Your turn. Say: Error."], [35.07, 35.88, "Error."], [36.62, 37.5, "Correct."], [38.52, 40.21, "Correct means to fix."], [40.82, 42.05, "Correct the sentence."], [42.65, 45.33, "Your turn. Say: Correct."], [48.17, 48.91, "         function textCheck(msg, text, need, okText, key, amount) {
            const n = countWords(text);
            if (n < need) {
                msg.className = "text-sm mt-2 font-semibold text-red-500";
                msg.textContent = n === 0 ? "✏️ Write something first!" : `✏️ Write a little more — at least ${need} words (you have ${n}).`;

        function usedUnitWords(text, unitData) {
            const t = ' ' + String(text).toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
            return unitData.vocab.filter(w => {
                const base = w.toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').trim();
                if (!base) return false;
                // whole word, allowing simple endings: s, es, ed, ing
                const re = new RegExp('[ ]' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[ ]') + '(s|es|ed|d|ing)?[ ]');
                return re.test(t);
            });

        // ===== 7. VOCABULARY GAME (picture -> word) =====

        // ===== 8. SPELLING PRACTICE (tap scrambled letters in order) =====
        let spellState = { word: '', picked: [], letters: [], wIndex: 0, words: [], done: false };
        function renderSpelling(contentDiv, unitData) {

        function resetSpelling() { renderSpellingUI(); }
        // ===== 9. SENTENCE BUILDING (reorder scrambled words from the story) =====

        function pickSentenceWord(i) {

        // ===== 11. DICTATION (listen and type) =====

        let dictationTarget = '';

        function renderDictation(contentDiv, unitData) {
            const sentences = storySentences(unitData, 3);
            let pick = sentences[Math.floor(Math.random() * sentences.length)];
            if (sentences.length > 1) while (pick === dictationTarget) pick = sentences[Math.floor(Math.random() * sentences.length)];

        function playDictation(slow) {
            if (!('speechSynthesis' in window)) return;
            if (!slow) { speak(dictationTarget); return; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(dictationTarget);
            u.lang = 'en-US'; u.rate = 0.6;
            if (enVoice) u.voice = enVoice;
            window.speechSynthesis.speak(u);
        }
        const normalizeDictation = (s) => String(s).toLowerCase().replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[.!?,;:"()—–-]/g, ' ').replace(/\s+/g, ' ').trim();
        function checkDictation() {
            const input = normalizeDictation(document.getElementById('dictation-input').value);
            const target = normalizeDictation(dictationTarget);
            const fb = document.getElementById('dictation-fb');
            if (!input) { fb.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500'; fb.textContent = '✏️ Listen, then type the sentence first!'; return; }
            if (input === target) {
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                fb.textContent = '🎉 Perfect!' + (dictationDone ? '' : starNote(award(unitKey('dictation-' + target), 3), 3));

                markActivityComplete('dictation');
            } else {
                // show which words were right, so the student can learn from it
                const want = target.split(' '), got = input.split(' ');
                const right = want.filter((w, i) => got[i] === w).length;
                fb.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                fb.innerHTML = `❌ ${right} of ${want.length} words in the right place. The sentence was: "${escapeHtml(dictationTarget)}"`;
            }
        }

        // ===== 13. REVIEW (cumulative picture quiz across all units up to the current one) =====
        let reviewState = { qIndex: 0, score: 0, questions: [], locked: false };
        function renderReview(contentDiv, unitData) {
            const levelData = curriculum[state.level];
            let pool = [];
            Object.keys(levelData).forEach(u => {
                if (parseInt(u) <= state.unit) pool = pool.concat(levelData[u].vocab);
            });
            pool = [...new Set(pool)];
            const questionWords = shuffle(pool).slice(0, Math.min(10, pool.length));
            reviewState = {
                qIndex: 0, score: 0, locked: false,
                questions: questionWords.map(correct => {
                    const home = Object.values(levelData).find(d => d.vocab.includes(correct));
                    return { correct, home, options: shuffle([correct, ...pictureDistractors(correct, pool, home, 3)]) };
                })
            };
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">🔄 Review — Units 1 to ${state.unit}</h2>
                <p class="text-gray-600 mb-4">A quick review of everything you've learned so far in ${state.level}!</p>
                <div id="review-area"></div>`;
            showReviewQuestion();
        }
        function showReviewQuestion() {
            const area = document.getElementById('review-area');
            if (!area) return;
            reviewState.locked = false;
            if (reviewState.qIndex >= reviewState.questions.length) { try { window.C2REPORT && C2REPORT('Review', reviewState.score, reviewState.questions.length, state); } catch (e) {}
                markActivityComplete('review');
                area.innerHTML = `<div class="bg-green-50 border-2 border-green-300 rounded-2xl p-8 text-center">
                    <p class="text-2xl font-bold text-green-700 mb-2">🎉 Review Complete!</p>
                    <p class="text-lg text-gray-700 mb-4">You scored ${reviewState.score} / ${reviewState.questions.length}</p>
                    <button onclick="renderReview(document.getElementById('module-content'), curriculum[state.level][state.unit])" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer">🔁 New Review</button>
                </div>`;
                return;
            }
            const q = reviewState.questions[reviewState.qIndex];
            area.innerHTML = `
                <div class="bg-indigo-50 border-2 border-dashed border-indigo-300 rounded-2xl p-8 text-center">
                    <p class="text-sm text-gray-500 mb-2">Question ${reviewState.qIndex + 1} of ${reviewState.questions.length}</p>
                    <div class="text-7xl mb-5">${emojiFor(q.correct, q.home)}</div>
                    <div class="grid grid-cols-2 gap-3" id="review-options">
                        ${q.options.map(o => `<button onclick="answerReview('${escapeJsStr(o)}')" class="bg-white hover:bg-indigo-100 p-4 rounded-xl shadow font-bold text-indigo-800 cursor-pointer">${o}</button>`).join('')}
                    </div>
                    <p id="review-fb" class="mt-4 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }
        function answerReview(chosen) {
            if (reviewState.locked) return;
            reviewState.locked = true;
            document.querySelectorAll('#review-options button').forEach(b => b.disabled = true);
            const q = reviewState.questions[reviewState.qIndex];
            const fb = document.getElementById('review-fb');
            if (chosen === q.correct) {
                fb.className = 'mt-4 font-bold min-h-[1.5rem] text-green-600';
                fb.textContent = '🎉 Correct!' + (award('review-' + q.correct, 1) ? ' (+1 ⭐)' : '');
                reviewState.score++;
            } else {
                fb.className = 'mt-4 font-bold min-h-[1.5rem] text-red-500';
                fb.textContent = `❌ It was "${q.correct}"`;
            }
            reviewState.qIndex++;
            setTimeout(showReviewQuestion, 900);
        }

        // ---------- Microphone check (used by Speaking and Pronunciation Drill) ----------
        // Speech recognition often does not work inside the Hub's secure box or on some phones,
        // so an "I said it" button is always there as well.
        const hasRecognition = () => ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
        const normalizeSpeech = (s) => String(s).toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
        function listenFor(target, msg, btn, onSuccess) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { msg.className = "text-sm mt-3 font-semibold text-amber-600"; msg.textContent = "🎙️ This browser can't check speech — say it out loud and tap “I said it”."; return; }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            btn.disabled = true;
            msg.className = "text-sm mt-3 font-semibold text-blue-600";
            msg.textContent = "🎙️ Get ready...";
            setTimeout(() => {
                let recog;
                try { recog = new SR(); } catch (e) { btn.disabled = false; msg.textContent = "⚠️ The microphone is not available here — tap “I said it” instead."; return; }
                recog.lang = 'en-US';
                recog.maxAlternatives = 3;
                msg.className = "text-sm mt-3 font-semibold text-red-600";
                msg.textContent = "🎙️ Listening... speak now!";
                recog.onresult = (e) => {
                    const alts = Array.from(e.results[0]).map(r => normalizeSpeech(r.transcript));
                    const want = normalizeSpeech(target);
                    const ok = alts.some(a => a === want || (' ' + a + ' ').includes(' ' + want + ' '));
                    if (ok) onSuccess(alts[0]);
                    else { msg.className = "text-sm mt-3 font-semibold text-red-600"; msg.textContent = `❌ I heard "${alts[0]}" - try again!`; }
                };
                recog.onerror = () => {
                    msg.className = "text-sm mt-3 font-semibold text-red-600";
                    msg.textContent = "⚠️ Couldn't hear you — this happens on some phones and inside the Hub. Try again, or tap “I said it”.";
                };
                recog.onend = () => { btn.disabled = false; };
                try { recog.start(); } catch (err) { btn.disabled = false; msg.textContent = "⚠️ The microphone is not available here — tap “I said it” instead."; }
            }, 400);
        }

        // ===== 14. PRONUNCIATION DRILL (every word, microphone check or "I said it") =====
        let pronState = { wIndex: 0, words: [] };
        function renderPronunciationDrill(contentDiv, unitData) {
            pronState = { wIndex: 0, words: shuffle([...new Set(unitData.vocab)]) };
            contentDiv.innerHTML = `<h2 class="text-xl font-bold text-blue-800 mb-2">🔊 Pronunciation Drill</h2>

        function showPronWord() {

                markActivityComplete('pronunciation');
                area.innerHTML = `<div class="bg-green-50 border-2 border-green-300 rounded-2xl p-8 text-center">
                    <p class="text-2xl font-bold text-green-700">🎉 You practiced every word in this unit!</p>
                </div>`;

            }
            const word = pronState.words[pronState.wIndex];
            area.innerHTML = `
                <div class="bg-amber-50 border-2 border-dashed border-amber-300 rounded-2xl p-8 text-center">
                    <p class="text-sm text-gray-500 mb-2">Word ${pronState.wIndex + 1} of ${pronState.words.length}</p>
                    <div class="text-6xl mb-3">${emojiFor(word)}</div>
                    <p class="text-2xl font-bold text-gray-800 mb-3">${word}</p>

                    <div class="flex gap-3 flex-wrap justify-center">
                        ${hasRecognition() ? `<button onclick="recordPronWord(this)" class="bg-red-500 hover:bg-red-600 text-white font-bold px-6 py-3 rounded-full shadow-lg cursor-pointer">🔴 Record & Check</button>` : ''}
                        <button onclick="sayPronWord(this)" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-3 rounded-full shadow-lg cursor-pointer">✅ I said it — Next word</button>
                    </div>
                    <p id="pron-msg" class="text-sm mt-3 font-semibold min-h-[1.25rem]"></p>
                </div>`;
        }
        function recordPronWord(btn) {
            const word = pronState.words[pronState.wIndex];
            const msg = document.getElementById('pron-msg');
            listenFor(word, msg, btn, (heard) => {
                msg.className = "text-sm mt-3 font-semibold text-green-600";
                msg.textContent = `⭐ Clear! I heard: "${heard}"` + (award(unitKey('pron-mic-' + word), 2) ? ' (+2 ⭐)' : '');
                setTimeout(nextPronWord, 900);
            });
        }
        function sayPronWord(btn) {
            if (btn) { if (btn.disabled) return; btn.disabled = true; }
            const got = award(unitKey('pron-' + pronState.words[pronState.wIndex]), 1);
            const msg = document.getElementById('pron-msg');
            if (msg) { msg.className = "text-sm mt-3 font-semibold text-green-600"; msg.textContent = got ? "⭐ Great! (+1 ⭐)" : "⭐ Great!"; }
            setTimeout(nextPronWord, 600);
        }
        function nextPronWord() {
            pronState.wIndex++;
            showPronWord();
        }

        // ===== 7. LET'S TALK ABOUT (timed speaking practice) =====
        // The timer now stops when the student leaves this tab (it used to keep counting and give
        // stars in the background), and the stars are given once per unit.
        let talkTimerInterval = null;
        function stopTalkTimer() {
            if (talkTimerInterval) { clearInterval(talkTimerInterval); talkTimerInterval = null; }
        }
        function renderLetsTalk(contentDiv, unitData) {
            stopTalkTimer();
            const talkingPoints = shuffle(unitData.vocab).slice(0, 5);
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">💬 Let's Talk About: ${unitData.title}</h2>

                    <div class="bg-white p-5 rounded-xl shadow-inner mb-4">

                    </div>
                    <div class="bg-white p-4 rounded-xl border border-violet-100 mb-4">
                        <p class="text-sm text-violet-600 font-semibold mb-2">💡 Try to use these words:</p>

                            ${talkingPoints.map(w => `<span class="bg-violet-100 text-violet-800 px-3 py-1 rounded-full text-sm font-semibold">${w}</span>`).join('')}

                    </div>
                    <div class="text-center">
                        <div id="talk-timer-display" class="text-4xl font-bold text-violet-900 mb-3">60</div>
