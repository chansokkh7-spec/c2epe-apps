    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Key Terms: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-5xl bg-slate-800 text-white rounded-2xl p-6 shadow-lg mb-6 flex justify-between items-center flex-wrap gap-3">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">💼 C2-EPE TOEIC</h1>
            <p class="text-sm text-slate-300">TOEIC - Online Class</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap justify-end">
            <div class="bg-amber-400 text-slate-900 px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                ⭐ <span id="star-count">0</span>
            </div>
            <div class="bg-pink-500 text-white px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                🏆 <span id="badge-count">0</span> Badges

            <button onclick="showMyProgress()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-sm font-bold border border-white/20 cursor-pointer">📊 My Progress</button>
            <div class="bg-slate-700 px-3 py-2 rounded-xl text-sm font-bold border border-red-500">

        </div>

    <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-4 gap-6">

        <aside id="module-sidebar" class="bg-white rounded-2xl p-4 shadow-md md:col-span-1 flex flex-col gap-3" style="scroll-margin-top:12px;">
            <div id="level-picker-wrap">
                <h2 class="font-bold text-gray-700 border-b pb-2">Grade</h2>
                <div class="flex flex-col gap-3 mt-3">
                    <button onclick="selectLevel('A1')" id="btn-A1" class="level-btn text-left p-3 rounded-xl bg-slate-700 text-white font-semibold transition shadow cursor-pointer">🌱 A1 Grammar</button>
                    <button onclick="selectLevel('A2')" id="btn-A2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📗 A2 Grammar</button>
                    <button onclick="selectLevel('B1')" id="btn-B1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📘 B1 Grammar</button>
                    <button onclick="selectLevel('B2')" id="btn-B2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📙 B2 Grammar</button>
                    <button onclick="selectLevel('C1')" id="btn-C1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🎓 C1 Grammar</button>
                    <button onclick="selectLevel('C2')" id="btn-C2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">👑 C2 Grammar</button>
                </div>
            </div>
            <div id="locked-level-banner" class="hidden bg-slate-50 border border-red-200 rounded-xl p-3 text-center">
                <p class="text-xs text-red-600 font-semibold">TOPIC</p>
                <p id="locked-level-text" class="text-xl font-bold text-slate-900"></p>
            </div>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700" id="unit-select-label">Select Unit (1 to 25)</h2>
            <select id="unit-select" onchange="updateUnit()" class="p-2 rounded-xl border border-gray-300 bg-gray-50 font-semibold text-slate-900">
                <option value="1">Loading...</option>
            </select>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700">Learning Modules</h2>
            <button onclick="switchTab('video')" data-tab="video" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📹 0. Video Lesson</button>
            <button onclick="switchTab('learn')" data-tab="learn" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📖 1. Learn</button>

            <button onclick="switchTab('headline')" data-tab="headline" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📰 10. Headline Writing</button>

        const curriculum = {"A1": {"1": {"title": "TOEIC Overview and Scores", "terms": ["Listening", "Reading", "Score", "Workplace", "Part", "Answer sheet", "Certificate", "Section"], "passage": "Nary wants a job at an international hotel. The hotel asks for a TOEIC score of 700. She learns that the test has seven parts. She checks the timing: 45 minutes for Listening and 75 for Reading. She makes a plan for each part.", "question": "What TOEIC score do you want, and why?", "funfact": "Did you know? Learn the seven parts and their timing. Practise Listening and Reading equally because each section carries the same weight in the total score."}, "2": {"title": "Part 1: Photographs of People", "terms": ["Photograph", "Describe", "Present continuous", "Gesture", "Reach for", "Hold", "Distractor", "Gather"], "passage": "The photograph shows an office with three people. One man is holding a cup of coffee. A woman is reaching for a file on a shelf. Two colleagues are gathering around a table. One statement says the man is buying coffee, but he is only holding it.", "question": "How do you answer a Part 1 photograph question?", "funfact": "Did you know? Before the audio, look at the people, the actions and the setting. Choose the statement that describes exactly what is happening."}, "3": {"title": "Part 1: Photographs of Objects and Places", "terms": ["Shelf", "Be stacked", "Be displayed", "Be parked", "Beside", "Above", "Empty", "Pavement"], "passage": "The photograph shows a small shop in the morning. Products are displayed on the shelves. Some boxes are stacked beside the door. A bicycle is parked on the pavement outside. No customers are visible yet.", "question": "How do you describe a photograph with no people?", "funfact": "Did you know? When there are no people, focus on objects, positions and passive forms. Predict a sentence before you listen."}, "4": {"title": "Part 2: Wh- Questions", "terms": ["Question word", "Response", "Appointment", "Deadline", "Supervisor", "Reception", "Confirm", "Similar sound"], "passage": "A visitor asks, Where is the sales department? The correct reply is, On the third floor. Another asks, When is the meeting? A wrong option repeats the word meeting but does not say a time. The best reply is, At ten o'clock.", "question": "How do you answer a Wh- question in Part 2?", "funfact": "Did you know? Listen carefully to the first words and decide what kind of answer is needed. Reject options that only repeat words or answer Yes or No."}, "5": {"title": "Part 2: Yes/No, Choice and Indirect Answers", "terms": ["Yes/no question", "Choice question", "Tag question", "Statement", "Indirect", "Suggestion", "Not sure", "Postpone"], "passage": "Rith asks his colleague, Did you send the invoice? She answers, I'm waiting for the final figures. This means she has not sent it yet. Another colleague asks, Shall we meet at noon? He replies, That works for me, which agrees.", "question": "Why are indirect answers common in TOEIC Part 2?", "funfact": "Did you know? In Part 2 many correct answers are indirect. Think about what the reply means, and choose the one that fits naturally."}, "6": {"title": "Part 3: Workplace Conversations", "terms": ["Conversation", "Colleague", "Client", "Order", "Invoice", "Agenda", "Delay", "Arrange"], "passage": "Two colleagues discuss a client's order. The man says there is a delay at the warehouse. The woman suggests calling the client to explain. They agree to ship half of the order today. The woman will send the new invoice tomorrow.", "question": "How do you answer Part 3 questions?", "funfact": "Did you know? Read the questions first, then listen for each answer in order. Pay special attention to the last lines, because they usually give the next step."}, "7": {"title": "Part 3: Graphics and Speaker Intention", "terms": ["Graphic", "Schedule", "Price list", "Intend", "Imply", "Sarcastic", "Quote", "Match"], "passage": "A manager and an assistant look at a meeting schedule on a screen. The room numbers are printed, but the times are missing. The assistant says the sales meeting starts at ten. The manager says, I wouldn't say that meeting is urgent. The assistant understands that it can wait.", "question": "How do you answer a question that uses a graphic?", "funfact": "Did you know? Look at the graphic before the audio. Listen for the detail that fills the gap, and use the whole conversation to understand a quoted line."}, "8": {"title": "Part 4: Announcements, Voicemail and Ads", "terms": ["Announcement", "Voicemail", "Advertisement", "Discount", "Callback", "Purpose", "Limited", "Reserve"], "passage": "A dentist's assistant leaves a voicemail for a patient. She says the purpose is to remind him about an appointment. The appointment is on Tuesday at nine o'clock. She asks him to call back before five o'clock today. If he does not call, the office will give the time to another patient.", "question": "How do you answer questions about a talk?", "funfact": "Did you know? Preview the questions, listen to the opening for the purpose, and catch the details. Always listen to the final request."}, "9": {"title": "Part 4: Tours, Meetings and Speeches", "terms": ["Tour", "Presentation", "Quarter", "Revenue", "Welcome", "Facility", "Retire", "Applaud"], "passage": "A manager welcomes staff to the quarterly meeting. She says revenue increased by ten percent in the third quarter. She shows a chart with sales in four regions. The northern region had the highest figure. She thanks everyone and introduces the next speaker.", "question": "How do you follow a longer talk in Part 4?", "funfact": "Did you know? Follow signposts, match the speaker's numbers with the graphic, and listen to the last lines for thanks and the next step."}, "10": {"title": "Listening Review: Paraphrase and Distractors", "terms": ["Paraphrase", "Distractor", "Synonym", "Repetition", "Similar sound", "Time reference", "Eliminate", "Review"], "passage": "Thida reviews her wrong answers in a notebook. She sees that she often chooses options with repeated words. Her teacher shows her that the right answer is a paraphrase. She makes a list of synonyms and paraphrases. In her next test she avoids the traps.", "question": "How do you avoid distractors in TOEIC Listening?", "funfact": "Did you know? Expect paraphrase, avoid options that only repeat words, and review mistakes to learn which traps work on you."}, "11": {"title": "Part 5: Parts of Speech", "terms": ["Noun", "Verb", "Adjective", "Adverb", "Suffix", "Word form", "Modify", "Incomplete"], "passage": "The sentence says: The company made a ___ about the new office. The gap comes after the article a and an adjective. So the missing word must be a noun. The options are decide, decision, decisive and decisively. Vuthy chooses decision.", "question": "How do you choose the correct word form in Part 5?", "funfact": "Did you know? Decide what part of speech the gap needs by looking at the words before and after it. Then choose the form with the right suffix."}, "12": {"title": "Part 5: Verb Tenses and Agreement", "terms": ["Tense", "Agreement", "Singular", "Plural", "Present perfect", "Passive", "Time marker", "Conditional"], "passage": "Sokunthea reads: The invoice ___ sent yesterday. Yesterday is a past time marker. The invoice does not send itself, so the passive is needed. The options are is, was, has and will. She chooses was.", "question": "How do you choose the correct tense in Part 5?", "funfact": "Did you know? Find the time marker, identify the true subject, and check whether the sentence needs an active or passive verb."}, "13": {"title": "Part 5: Prepositions and Conjunctions", "terms": ["Preposition", "Conjunction", "Although", "Because of", "Despite", "Unless", "By", "Until"], "passage": "The sentence says: ___ the high price, the team bought the machine. A noun phrase follows the gap, so a preposition is needed. The options are although, despite, because and unless. The meaning is contrast, so Despite fits. Rotha chooses Despite and moves on.", "question": "How do you choose between although and despite?", "funfact": "Did you know? Check whether a clause or a noun follows the gap, then choose a conjunction or a preposition with the right meaning."}, "14": {"title": "Part 5: Business Vocabulary and Collocations", "terms": ["Collocation", "Reduce", "Submit", "Attend", "Reach", "Place an order", "Meet a deadline", "Take responsibility"], "passage": "Piseth keeps a list of business collocations. He writes submit a report and reach an agreement. He also writes place an order and meet a deadline. On the test he sees the gap: reach an ___. He chooses agreement because he remembers the phrase.", "question": "How do you learn business collocations?", "funfact": "Did you know? Learn business collocations as whole phrases. When two options look possible, choose the one that sounds natural with the words nearby."}, "15": {"title": "Part 6: Text Completion", "terms": ["Text completion", "Context", "Linking word", "Insert", "Logical", "Refer to", "Pronoun", "Cohesion"], "passage": "A notice tells staff that the system will be offline on Saturday. One gap needs a linking word before please save your work. The first part gives a problem, so the next part gives an action. Therefore is a logical connector. Dara chooses Therefore and rereads the whole notice.", "question": "How do you answer Part 6 questions?", "funfact": "Did you know? Read the whole text quickly, then choose the answer that fits the grammar and connects the ideas before and after the gap."}, "16": {"title": "Part 7: Emails and Memos", "terms": ["Memo", "Recipient", "Sender", "Attachment", "Request", "Mention", "Not true", "Infer"], "passage": "Ms. Kim writes an email to the sales team. She says the Monday meeting will move to Wednesday. She attaches the new agenda and asks everyone to confirm. She also mentions that lunch will be provided. The email does not say who will lead the meeting.", "question": "How do you read an email in Part 7?", "funfact": "Did you know? Read the first and last sentences for the purpose, use keywords to find details, and check every option for NOT questions."}, "17": {"title": "Part 7: Notices, Ads and Forms", "terms": ["Notice", "Advertisement", "Form", "Eligible", "Expire", "Fee", "Warranty", "Scan"], "passage": "An advertisement offers twenty percent off laptops. The discount is only for members of the store club. The offer expires on June 30. A small delivery fee applies to orders under fifty dollars. Every laptop comes with a two-year warranty.", "question": "How do you find information in an advertisement?", "funfact": "Did you know? Read the question first, scan for keywords, and always check the condition words like only, unless and before."}, "18": {"title": "Part 7: Multiple Passages", "terms": ["Passage", "Link", "Cross-reference", "Confirm", "Contradict", "Reply", "Invoice", "Timetable"], "passage": "A manager emails her team that her flight leaves at noon. A second text is the airport timetable. It shows that the noon flight leaves from Gate B. A question asks where the manager should go. The answer needs information from both texts.", "question": "How do you answer a question that needs two texts?", "funfact": "Did you know? Find the first clue in one text and the matching detail in the other. Check whether the second text confirms or changes the first."}, "19": {"title": "Business Vocabulary: Office, Meetings and Finance", "terms": ["Budget", "Profit", "Expense", "Negotiate", "Proposal", "Quarterly", "Merge", "Recruit"], "passage": "The quarterly report shows that profit rose by eight percent. The main reason was a lower budget for travel expenses. The managers plan to recruit twenty new graduates next year. They also hope to negotiate a better contract with a supplier. Two smaller firms may merge in the future.", "question": "How do you study business vocabulary for TOEIC?", "funfact": "Did you know? Group business vocabulary by topic, study each word in a real sentence, and review often."}, "20": {"title": "TOEIC Test Strategy and Timing", "terms": ["Timing", "Pace", "Guess", "Eliminate", "Skip", "Answer sheet", "Consistent", "Weak point"], "passage": "Mealea takes a full practice test every Sunday. She notes which parts take too much time. She discovers that Part 7 is her weak point. Every day she reads one email and one notice for thirty minutes. After two months her timing and score improve.", "question": "What is your plan for TOEIC test day?", "funfact": "Did you know? Follow a time plan, answer every question, and practise your weak points regularly with timed tests."}}};
        Object.values(curriculum).forEach(g => Object.values(g).forEach(d => { d.vocab = d.terms; d.story = d.passage; }));

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_grammar_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;

        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }

            const side = document.getElementById('module-sidebar');

        function completeActivity() {
            markActivityComplete(state.tab);

            let gotBadge = false;
            const badgeKey = state.level + '|' + unitKey('badge');

            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');

        }

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }
        // The Video button shows 🆕 when this unit's video is new, and "(soon)" when there is none yet
        function updateVideoTabBadge() {
            const btn = document.querySelector('.tab-btn[data-tab="video"]');
            if (!btn) return;
            const v = videoFor(state.level, state.unit);
            btn.textContent = (v && isRecentlyAdded(v.dateAdded) ? '🆕 ' : '') + '📹 0. Video Lesson' + (v ? '' : ' (soon)');
        }

        let ytPlayer = null;
        let ytPollInterval = null;
        let ytAnsweredCheckpoints = new Set();
        let ytApiLoadPromise = null;
        let ytFallbackTimer = null;
        let ytCurrentConfig = null;

        // Stops the video and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

        function renderVideoLesson(contentDiv) {
            stopVideo();
            ytAnsweredCheckpoints = new Set();
            const unitData = curriculum[state.level][state.unit];
            ytCurrentConfig = videoFor(state.level, state.unit);

            if (!ytCurrentConfig) {
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                    <div class="bg-indigo-50 border-2 border-dashed border-indigo-200 rounded-2xl p-10 text-center">
                        <div class="text-5xl mb-4">🎬</div>
                        <p class="text-xl font-bold text-indigo-900 mb-2">Video Coming Soon!</p>
                        <p class="text-gray-600 mb-4">Your teacher is preparing this unit's video. For now, try the other learning modules!</p>
                        <button onclick="switchTab('listening')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Start with Listening</button>
                    </div>`;
                return;
            }

            if (ytCurrentConfig.mp4) { renderMp4Lesson(contentDiv, unitData); return; }
            const watchUrl = 'https://www.youtube.com/watch?v=' + ytCurrentConfig.id;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch the video, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <div id="yt-player-el" class="w-full h-full"></div>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">Loading video player…</p>
                <p class="text-center mt-1"><a href="${watchUrl}" target="_blank" rel="noopener" class="text-sm text-indigo-600 underline">If the video does not play here, tap to open it in YouTube ↗</a></p>`;

            const showFallback = (why) => {
                const msg = document.getElementById('video-msg');
                if (msg) msg.innerHTML = `⚠️ ${why} <a href="${watchUrl}" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">Open the video in YouTube ↗</a>`;
            };
            ytFallbackTimer = setTimeout(() => { if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') showFallback('The video is taking long to load.'); }, 10000);

            const wanted = ytCurrentConfig.id;
            loadYouTubeApi().then(() => {
                if (!ytCurrentConfig || ytCurrentConfig.id !== wanted || !document.getElementById('yt-player-el')) return;
                ytPlayer = new YT.Player('yt-player-el', {
                    videoId: wanted,
                    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
                    events: {
                        onReady: () => { if (ytFallbackTimer) clearTimeout(ytFallbackTimer); const m = document.getElementById('video-msg'); if (m) m.textContent = '▶️ Press play to start the lesson!'; },
                        onStateChange: onYtStateChange,
                        onError: () => showFallback('This video cannot play inside the lesson.')
                    }
                });
            }).catch(() => showFallback('The video player could not load.'));
        }

e picture, and the statements are not printed."], [157.18, 159.4, "What do the correct answers describe?"], [160.52, 170.95, "They describe actions happening now, usually with the present continuous, such as a woman is typing at a computer. Look at the people, their actions and the setting."], [172.05, 173.76, "How do I avoid traps?"], [174.85, 187.49, "Wrong statements may use a word you can see but describe an action that is not happening. For example, they may say the man is buying a cup, when he is only holding it."], [188.63, 190.15, "Part three: grammar."], [190.98, 195.36, "Grammar focus: Strategy: look at people, actions and setting."], [195.66, 196.79, "Look at the pattern."], [197.48, 199.53, "A woman is typing at a computer."], [200.42, 202.75, "Some colleagues are gathering around a table."], [203.7, 210.5, "Before the audio, look at the people, the actions and the setting. Choose the statement that describes exactly what is happening."], [211.25, 215.41, "Be careful! Don't say: I choose a statement with a seen word."], [217.37, 220.13, "Say: I choose the action that matches."], [220.43, 221.69, "Match the action."], [222.5, 225.21, "Part four: reading. Read and listen."], [226.0, 227.78, "A Photograph in the Office."], [228.08, 230.54, "The photograph shows an office with three people."], [231.53, 233.65, "One man is holding a cup of coffee."], [234.63, 237.1, "A woman is reaching for a file on a shelf."], [238.1, 240.41, "Two colleagues are gathering around a table."], [241.4, 245.0, "One statement says the man is buying coffee, but he is only holding it."], [246.1, 249.89, "Part five: quiz. Five questions. Are you ready?"], [250.75, 252.88, "In Part 1 the statements are blank."], [253.18, 257.03, "A, printed. B, in the question. C, not printed."], [260.57, 262.89, "The answer is C: not printed."], [264.05, 266.25, "Correct answers usually use the blank."], [266.55, 271.42, "A, present continuous. B, past perfect. C, future perfect."], [274.97, 277.57, our turn. Say: Shelf."], [39.3, 40.19, "Shelf."], [40.95, 41.86, "Be stacked."], [42.85, 45.72, "Be stacked means to be piled one on top of another."], [46.32, 48.19, "Boxes are stacked by the wall."], [48.78, 51.49, "Your turn. Say: Be stacked."], [54.33, 55.24, "Be stacked."], [55.98, 57.16, "Be displayed."], [58.15, 60.87, "Be displayed means to be shown for people to see."], [61.48, 62.99, "Products are displayed."], [63.58, 66.05, "Your turn. Say: Be displayed."], [68.9, 70.06, "Be displayed."], [70.82, 71.7, "Be parked."], [72.72, 75.52, "Be parked means to be left in a place (vehicles)."], [76.12, 77.83, "Cars are parked outside."], [78.42, 80.76, "Your turn. Say: Be parked."], [83.6, 84.56, "Be parked."], [85.32, 86.42, "Beside."], [87.42, 89.05, "Beside means next to."], [89.65, 91.45, "A lamp is beside the desk."], [92.05, 94.23, "Your turn. Say: Beside."], [97.07, 98.03, "Beside."], [98.78, 99.61, "Above."], [100.62, 102.29, "Above means higher than."], [102.88, 104.59, "A clock is above the door."], [105.18, 107.94, "Your turn. Say: Above."], [110.8, 111.75, "Above."], [112.52, 113.4, "Empty."], [114.42, 116.52, "Empty means with nothing inside."], [117.12, 118.37, "The room is empty."], [118.98, 121.03, "Your turn. Say: Empty."], [123.87, 124.81, "Empty."], [125.55, 126.42, "Pavement."], [127.42, 129.78, "Pavement means the path beside a road."], [130.38, 132.15, "People walk on the pavement."], [132.75, 135.16, "Your turn. Say: Pavement."], [138.0, 138.88, "Pavement."], [139.7, 143.66, "Part two: dialogue. Let's listen to a conversation."], [144.52, 147.14, "Visal, what if the photograph has no people?"], [148.25, 161.4, "Then the correct statement usually describes objects and their position, often with the passive: boxes are stacked against the wall, or chairs have been arranged in rows."], [162.48, 164.03, "What language should I know?"], [165.12, 175.7, "Learn prepositions such as beside, above, behind and along, and passive forms like is displayed, is parked and is being repaired."], [176.78, 178.07, "How can I get ready?"], [179.18, 187.86, "Look at every object and decide where it is. Predict the sentence before the audio, and then compare it with what you hear."], [189.0, 190.56, "Part three: grammar."], [191.42, 196.05, "Grammar focus: Strategy: objects, positions, passive forms."], [196.35, 197.55, "Look at the pattern."], [198.25, 200.2, "Boxes are stacked beside the door."], [201.12, 203.1, "Products are displayed on the shelves."], [204.07, 210.78, "When there are no people, focus on objects, positions and passive forms. Predict a sentence before you listen."], [211.52, 215.27, "Be careful! Don't say: I describe feelings in the photograph."], [217.23, 220.15, "Say: I describe objects and positions."], [220.45, 222.09, "Objects and places."], [222.9, 225.41, "Part four: reading. Read and listen."], [226.2, 227.55, "An Empty Shop."], [227.85, 230.46, "The photograph shows a small shop in the morning."], [231.47, 233.45, "Products are displayed on the shelves."], [234.47, 236.69, "Some boxes are stacked beside the door."], [237.7, 240.52, "A bicycle is parked on the pavement outside."], [241.53, 243.86, "No customers are visible yet."], [244.97, 249.17, "Part five: quiz. Five questions. Are you ready?"], [250.02, 252.93, "When there are no people, statements describe blank."], [253.23, 258.27, "A, objects and positions. B, feelings. C, future plans."], [261.83, 264.41, "The answer is A: objects and positions."], [265.55, 267.48, "Boxes are blank beside the door."], [267.78, 271.54, "A, stacking. B, stacked. C, stack."], [275.1, 276.8, "The answer is B: stacked."], [277.95, 279.42, "Where is the bicycle?"], [279.72, 284.13, "A, inside the shop. B, on the shelf. C, on the pavement."], [287.7, 289.67, "The answer is C: on the pavement."], [290.82, 292.78, "Which preposition means 'higher than'?"], [293.08, 296.4, "A, above. B, beside. C, behind."], [299.93, 301.62, "The answer is A: above."], [302.78, 304.63, "What is displayed on the shelves?"], [304.93, 308.71, "A, cars. B, products. C, people."], [312.27, 314.41, "The answer is B: products."], [315.6, 318.87, "Part six: speaking. It's your turn to talk."], [319.72, 322.21, "How do you describe a photograph with no people?"], [331.02, 332.49, "Now listen to Visal."], [332.79, 345.1, "I look at the objects and decide where each one is. I think of passive forms, such as products are displayed or boxes are stacked. I also use prepositions of place like beside and above."], [345.4, 347.14, "Excellent answer, Visal!"], [348.05, 354.06, "Great work! Now you can use eight new words and strategy: objects, positions, passive forms."], [354.36, 358.07, "Today's value is attention. Look carefully and listen well."], [358.37, 360.69, "See you in Unit four. Goodbye!"], [360.99, 364.59, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTC-Unit04-Part-2-Wh-Questions": [[0.35, 5.48, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEIC preparation."], [5.78, 9.08, "Hi! I'm Visal. Let's learn together!"], [9.38, 17.33, "Unit four: Part 2: Wh- Questions. Today you will answer who, what, when, where, why and how questions quickly."], [17.63, 20.36, "Here is our lesson map. Let's start!"], [21.3, 24.61, "Part one: words. You will learn eight new words."], [25.45, 26.56, "Question word."], [27.55, 29.78, "Question word means a word like who or where."], [30.38, 32.07, "Listen to the first word."], [32.68, 35.24, "Your turn. Say: Question word."], [38.1, 39.3, "Question word."], [40.05, 41.18, "Response."], [42.18, 44.14, "Response means an answer."], [44.75, 46.66, "Choose the best response."], [47.25, 50.27, "Your turn. Say: Response."], [53.13, 54.32, "Response."], [55.08, 55.91, "Appointment."], [56.92, 59.41, "Appointment means an arranged meeting time."], [60.02, 61.71, "I have an appointment at three."], [62.32, 64.55, "Your turn. Say: Appointment."], [67.4, 68.39, "Appointment."], [69.15, 70.06, "Deadline."], [71.05, 73.71, "Deadline means the last time to finish something."], [74.32, 75.85, "The deadline is Friday."], [76.45, 78.93, "Your turn. Say: Deadline."], [81.77, 82.86, "Deadline."], [83.62, 84.76, "Supervisor."], [85.75, 88.54, "Supervisor means a person who manages workers."], [89.15, 90.78, "Ask your supervisor."], [91.38, 94.45, "Your turn. Say: Supervisor."], [97.3, 98.41, "Supervisor."], [99.15, 100.19, "Reception."], [101.18, 103.95, "Reception means the desk where visitors arrive."], [104.55, 105.9, "Go to reception."], [106.48, 109.29, "Your turn. Say: Reception."], [112.13, 113.27, "Reception."], [114.02, 114.94, "Confirm."], [115.95, 118.4, "Confirm means to say that something is certain."], [119.02, 120.5, "I will confirm the booking."], [121.12, 123.57, "Your turn. Say: Confirm."], [126.43, 127.35, "Confirm."], [128.12, 129.28, "Similar sound."], [130.28, 133.69, "Similar sound means words that sound alike but differ in meaning."], [134.28, 136.13, "Beware of similar sounds."], [136.72, 139.14, "Your turn. Say: Similar sound."], [142.0, 143.0, "Similar sound."], [143.8, 147.21, "Part two: dialogue. Let's listen to a conversation."], [148.05, 150.17, "Visal, how does Part 2 work?"], [151.25, 161.37, "You hear a question or statement and three responses, and you choose the best response. Nothing is printed, so you must listen to the first words carefully."], [162.48, 165.07, "What is the key skill with Wh- questions?"], [166.18, 175.72, "Identify the question word. Who needs a person, when needs a time, where needs a place, why needs a reason, and how many needs a number."], [176.82, 178.47, "What are common traps?"], [179.58, 189.16, "A wrong answer may repeat a word from the question with a different meaning, such as a similar sound. Yes and No do not answer Wh- questions."], [190.3, 191.95, "Part three: grammar."], [192.82, 197.85, "Grammar focus: Strategy: hear the question word, predict the answer type."], [198.15, 199.28, "Look at the pattern."], [199.98, 203.22, "Who is in charge of the project? Ms. Park is."], [204.12, 207.06, "When is the deadline? By Friday afternoon."], [208.0, 215.46, "Listen carefully to the first words and decide what kind of answer is needed. Reject options that only repeat words or answer Yes or No."], [216.22, 220.45, "Be careful! Don't say: I answer 'When?' with a place."], [222.4, 224.96, "Say: I answer 'When?' with a time."], [225.26, 226.95, "Match the question word."], [227.73, 230.45, "Part four: reading. Read and listen."], [231.27, 232.84, "Questions at Reception."], [233.14, 236.04, "A visitor asks, Where is the sales department?"], [237.03, 239.44, "The correct reply is, On the third floor."], [240.43, 242.35, "Another asks, When is the meeting?"], [243.37, 246.91, "A wrong option repeats the word meeting but does not say a time."], [247.9, 249.97, "The best reply is, At ten o'clock."], [251.07, 255.2, "Part five: quiz. Five questions. Are you ready?"], [256.05, 257.98, "Part 2 has blank responses."], [258.28, 261.12, "A, two. B, three. C, four."], [264.67, 266.24, "The answer is B: three."], [267.38, 269.31, "'When' needs an answer about blank."], [269.61, 273.16, "A, a person. B, a place. C, time."], [276.7, 278.41, "The answer is C: time."], [279.55, 282.03, "Yes and No blank Wh- questions."], [282.33, 286.97, "A, do not answer. B, always answer. C, are required for."], [290.5, 292.88, "The answer is A: do not answer."], [294.02, 295.66, "Where is the sales department?"], [295.96, 300.64, "A, Ms. Park. B, on the third floor. C, at ten o'clock."], [304.2, 306.58, "The answer is B: on the third floor."], [307.72, 309.73, "A wrong option often blank."], [310.03, 314.66, "A, is very long. B, is a number. C, repeats a word."], [318.2, 320.69, "The answer is C: repeats a word."], [321.9, 324.99, "Part six: speaking. It's your turn to talk."], [325.85, 328.6, "How do you answer a Wh- question in Part 2?"], [337.42, 339.03, "Now listen to Visal."], [339.33, 353.98, "I listen to the first words to find the question word. Then I predict the type of answer, such as a person, a time or a place. I choose the response that matches, and I reject answers that only repeat words."], [354.28, 355.92, "Excellent answer, Visal!"], [356.82, 362.89, "Great work! Now you can use eight new words and strategy: hear the question word, predict the answer type."], [363.19, 367.01, "Today's value is attention. Look carefully and listen well."], [367.31, 369.58, "See you in Unit five. Goodbye!"], [369.88, 372.4, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTC-Unit05-Part-2-Yes-No-Choice-and-Indirect-Answers": [[0.35, 5.43, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEIC preparation."], [5.73, 9.28, "Hi! I'm Visal. Let's learn together!"], [9.58, 19.23, "Unit five: Part 2: Yes/No, Choice and Indirect Answers. Today you will handle yes/no questions, either/or questions, statements and indirect replies."], [19.53, 22.23, "Here is our lesson map. Let's start!"], [23.17, 26.27, "Part one: words. You will learn eight new words."], [27.12, 28.58, "Yes/no question."], [29.58, 33.14, "Yes/no question means a question answered with yes or no."], [33.75, 34.92, "Do you have a minute?"], [35.52, 38.45, "Your turn. Say: Yes/no question."], [41.3, 42.81, "Yes/no question."], [43.55, 44.66, "Choice question."], [45.65, 47.91, "Choice question means a question with 'or'."], [48.52, 49.73, "Tea or coffee?"], [50.32, 53.63, "Your turn. Say: Choice question."], [56.47, 57.77, "Choice question."], [58.52, 59.76, "Tag question."], [60.75, 63.69, "Tag question means a short question after a statement."], [64.28, 65.7, "You are coming, aren't you?"], [66.32, 69.35, "Your turn. Say: Tag question."], [72.2, 73.43, "Tag question."], [74.18, 75.15, "Statement."], [76.15, 78.74, "Statement means a sentence that gives information."], [79.35, 80.77, "I'll send the file."], [81.38, 83.95, "Your turn. Say: Statement."], [86.8, 87.84, "Statement."], [88.58, 89.65, "Indirect."], [90.65, 93.52, "Indirect means not stating the answer directly."], [94.12, 96.16, "An indirect answer is common."], [96.75, 99.23, "Your turn. Say: Indirect."], [102.07, 102.93, "Indirect."], [103.68, 104.72, "Suggestion."], [105.72, 107.94, "Suggestion means an idea about what to do."], [108.55, 109.88, "Why don't we meet at noon?"], [110.48, 113.23, "Your turn. Say: Suggestion."], [116.07, 117.27, "Suggestion."], [118.02, 119.04, "Not sure."], [120.05, 121.82, "Not sure means uncertain."], [122.42, 123.7, "I'm not sure yet."], [124.28, 126.78, "Your turn. Say: Not sure."], [129.63, 130.89, "Not sure."], [131.65, 132.59, "Postpone."], [133.58, 136.27, "Postpone means to move an event to a later time."], [136.88, 138.35, "We postponed the meeting."], [138.95, 141.71, "Your turn. Say: Postpone."], [144.57, 145.63, "Postpone."], [146.43, 149.78, "Part two: dialogue. Let's listen to a conversation."], [150.62, 153.51, "Visal, what makes yes/no questions tricky?"], [154.62, 165.81, "The answer may not start with yes or no. For example, to Did you finish the report? a correct reply may be, I'm still working on it, which means no."], [166.92, 168.93, "How do I answer choice questions?"], [170.02, 181.9, "Do you want tea or coffee? is often answered with one choice, either, or neither. Listen for the exact option, such as, Coffee, please, or, Either is fine."], [183.02, 185.31, "What about suggestions and statements?"], [186.42, 197.38, "To a suggestion, expect agreement, refusal or an alternative. To a statement, expect a natural comment, such as, Thanks, I'll check it now."], [198.53, 200.63, "Part three: grammar."], [201.48, 205.71, "Grammar focus: Strategy: listen for meaning, not for yes or no."], [206.01, 207.25, "Look at the pattern."], [207.95, 211.17, "Did you finish the report? I'm still working on it."], [212.08, 214.69, "Why don't we meet at noon? That works for me."], [215.63, 222.05, "In Part 2 many correct answers are indirect. Think about what the reply means, and choose the one that fits naturally."], [222.78, 226.46, "Be careful! Don't say: I wait only for yes or no."], [228.4, 230.17, "Say: I listen for the meaning."], [230.47, 232.42, "Indirect answers exist."], [233.23, 236.16, "Part four: reading. Read and listen."], [236.97, 238.44, "A Natural Reply."], [238.74, 241.82, "Rith asks his colleague, Did you send the invoice?"], [242.83, 245.35, "She answers, I'm waiting for the final figures."], [246.37, 248.63, "This means she has not sent it yet."], [249.63, 252.31, "Another colleague asks, Shall we meet at noon?"], [253.3, 256.24, "He replies, That works for me, which agrees."], [257.33, 261.11, "Part five: quiz. Five questions. Are you ready?"], [261.95, 264.67, "Which reply means 'no' to 'Did you finish?'"], [264.97, 269.21, "A, Yes, I did.. B, It's at noon.. C, I'm still working on it.."], [272.77, 275.64, "The answer is C: I'm still working on it.."], [276.78, 279.2, "An answer to a choice question can be blank."], [279.5, 283.15, "A, one choice. B, a date. C, a price."], [286.7, 288.72, "The answer is A: one choice."], [289.88, 291.64, "'That works for me' means blank."], [291.94, 296.13, "A, I do not know. B, I agree. C, I refuse."], [299.67, 301.81, "The answer is B: I agree."], [302.95, 304.82, "What is the colleague waiting for?"], [305.12, 309.43, "A, a phone call. B, a meeting. C, final figures."], [312.97, 315.57, "The answer is C: final figures."], [316.72, 318.38, "Indirect answers are blank."], [318.68, 322.08, "A, common. B, rare. C, wrong always."], [325.63, 327.49, "The answer is A: common."], [328.7, 332.2, "Part six: speaking. It's your turn to talk."], [333.05, 335.93, "Why are indirect answers common in TOEIC Part 2?"], [344.72, 346.18, "Now listen to Visal."], [346.48, 361.41, "People often answer by explaining the situation instead of saying yes or no. For example, I'm still working on it means no. I therefore listen for the meaning of the reply rather than for yes or no."], [361.71, 363.35, "Excellent answer, Visal!"], [364.25, 370.63, "Great work! Now you can use eight new words and strategy: listen for meaning, not for yes or no."], [370.93, 375.47, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [375.77, 378.57, "See you in Unit six. Goodbye!"], [378.87, 381.48, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTC-Unit06-Part-3-Workplace-Conversations": [[0.35, 5.23, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEIC preparation."], [5.53, 8.91, "Hi! I'm Visal. Let's learn together!"], [9.21, 17.74, "Unit six: Part 3: Workplace Conversations. Today you will follow short business conversations and answer gist and detail questions."], [18.04, 20.54, "Here is our lesson map. Let's start!"], [21.5, 24.57, "Part one: words. You will learn eight new words."], [25.42, 26.53, "Conversation."], [27.55, 30.49, "Conversation means a talk between two or three people."], [31.08, 32.77, "Listen to the conversation."], [33.38, 35.98, "Your turn. Say: Conversation."], [38.83, 39.94, "Conversation."], [40.68, 41.45, "Colleague."], [42.45, 44.41, "Colleague means a person you work with."], [45.02, 46.45, "She spoke to a colleague."], [47.05, 49.27, "Your turn. Say: Colleague."], [52.13, 53.05, "Colleague."], [53.82, 54.63, "Client."], [55.62, 57.78, "Client means a customer of a business."], [58.38, 60.13, "A client called this morning."], [60.72, 63.23, "Your turn. Say: Client."], [66.07, 67.06, "Client."], [67.82, 68.68, "Order."], [69.68, 71.87, "Order means a request to buy goods."], [72.48, 74.16, "The order arrives on Monday."], [74.75, 76.89, "Your turn. Say: Order."], [79.73, 80.59, "Order."], [81.35, 82.39, "Invoice."], [83.38, 85.96, "Invoice means a bill for goods or services."], [86.55, 88.02, "Send the invoice today."], [88.62, 91.19, "Your turn. Say: Invoice."], [94.03, 95.21, "Invoice."], [95.95, 96.94, "Agenda."], [97.95, 100.65, "Agenda means a list of topics for a meeting."], [101.25, 102.62, "Check the agenda."], [103.22, 1  you, Ms. Emma! Bye, everyone!"]], "OC-XTC-Unit07-Part-3-Graphics-and-Speaker-Intention": [[0.35, 5.09, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEIC preparation."], [5.39, 8.85, "Hi! I'm Visal. Let's learn together!"], [9.15, 17.43, "Unit seven: Part 3: Graphics and Speaker Intention. Today you will combine what you hear with a chart and understand what speakers mean."], [17.73, 20.27, "Here is our lesson map. Let's start!"], [21.23, 24.77, "Part one: words. You will learn eight new words."], [25.62, 26.55, "Graphic."], [27.55, 30.7, "Graphic means a chart, map, table or list."], [31.28, 32.69, "Look at the graphic."], [33.28, 35.94, "Your turn. Say: Graphic."], [38.8, 39.79, "Graphic."], [40.55, 41.45, "Schedule."], [42.45, 44.6, "Schedule means a plan of times."], [45.22, 46.44, "Check the schedule."], [47.05, 49.91, "Your turn. Say: Schedule."], [52.77, 53.85, "Schedule."], [54.58, 55.62, "Price list."], [56.62, 58.78, "Price list means a list of costs."], [59.38, 61.17, "The price list is on the screen."], [61.78, 64.56, "Your turn. Say: Price list."], [67.4, 68.59, "Price list."], [69.35, 70.39, "Intend."], [71.38, 73.19, "Intend means to plan to do."], [73.78, 75.42, "She intends to cancel."], [76.02, 78.66, "Your turn. Say: Intend."], [81.5, 82.44, "Intend."], [83.18, 84.17, "Imply."], [85.18, 87.96, "Imply means to suggest without saying directly."], [88.55, 90.34, "He implies he is too busy."], [90.95, 93.14, "Your turn. Say: Imply."], [96.0, 97.15, "Imply."], [97.92, 99.13, "Sarcastic."], [100.12, 103.68, "Sarcastic means saying the opposite to be funny or critical."], [104.28, 105.85, "That sounds sarcastic."], [106.45, 108.97, "Your turn. Say: Sarcastic."], [111.83, 112.98, "Sarcastic."], [113.75, 114.38, "Quote."], [115.38, 117.29, "Quote means a price for a job."], [117.88, 119.06, "Send me a quote."], [119.65, 122.43, "Your turn. Say: Quote."], [125.27, 125.94, "Quote."], [126.68, 127.56, "Match."], [128.55, 131.28, "Match means to connect two pieces of information."], [131.88, 133.71, "Match the speaker with the room."], [134.32, 136.63, "Your turn. Say: Match."], [139.47, 140.72, "Match."], [141.53, 145.03, "Part two: dialogue. Let's listen to a conversation."], [145.88, 148.97, "Visal, what is different in graphic questions?"], [150.08, 158.7, "One of the three questions uses a table, map or list. You must combine what you hear with the information printed in the graphic."], [159.82, 161.03, "How do I answer them?"], [162.12, 174.58, "Study the graphic first, and notice what is missing, such as a room number. Then listen for the detail that fills the gap, for example a time, a price or a name."], [175.68, 177.83, "What are speaker intention questions?"], [178.95, 189.69, "They quote a line, such as I wouldn't say that, and ask what the speaker means. Listen to the whole context, because the surface words may not give the real meaning."], [190.83, 192.31, "Part three: grammar."], [193.15, 197.04, "Grammar focus: Strategy: graphic plus audio."], [197.34, 198.51, "Look at the pattern."], [199.22, 202.73, "The graphic shows room numbers, and the speaker says the time."], [203.62, 206.56, "I wouldn't say that can mean the speaker disagrees politely."], [207.5, 214.88, "Look at the graphic before the audio. Listen for the detail that fills the gap, and use the whole conversation to understand a quoted line."], [215.62, 218.98, "Be careful! Don't say: I ignore the graphic."], [220.93, 223.69, "Say: I combine the graphic with the audio."], [223.99, 225.27, "Use the graphic."], [226.07, 228.42, "Part four: reading. Read and listen."], [229.23, 230.47, "Using a Schedule."], [230.77, 234.37, "A manager and an assistant look at a meeting schedule on a screen."], [235.37, 238.63, "The room numbers are printed, but the times are missing."], [239.63, 242.46, "The assistant says the sales meeting starts at ten."], [243.47, 246.35, "The manager says, I wouldn't say that meeting is urgent."], [247.33, 249.59, "The a
