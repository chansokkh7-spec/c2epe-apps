 will follow short talks and find the purpose, details and requests."], [17.76, 20.43, "Here is our lesson map. Let's start!"], [21.37, 24.67, "Part one: words. You will learn eight new words."], [25.52, 26.46, "Announcement."], [27.45, 29.66, "Announcement means a public message."], [30.25, 31.74, "Listen to the announcement."], [32.35, 34.91, "Your turn. Say: Announcement."], [37.77, 38.8, "Announcement."], [39.55, 40.52, "Voicemail."], [41.52, 43.9, "Voicemail means a recorded phone message."], [44.48, 45.89, "She left a voicemail."], [46.48, 49.19, "Your turn. Say: Voicemail."], [52.03, 53.26, "Voicemail."], [54.02, 55.17, "Advertisement."], [56.18, 59.05, "Advertisement means a message that promotes a product."], [59.65, 61.88, "The advertisement offers a discount."], [62.48, 65.51, "Your turn. Say: Advertisement."], [68.37, 69.6, "Advertisement."], [70.35, 71.27, "Discount."], [72.28, 74.62, "Discount means a reduction in price."], [75.22, 77.06, "Get a 20 percent discount."], [77.65, 80.26, "Your turn. Say: Discount."], [83.1, 84.04, "Discount."], [84.78, 85.7, "Callback."], [86.72, 89.12, "Callback means a return phone call."], [89.72, 91.33, "Please give me a callback."], [91.92, 94.19, "Your turn. Say: Callback."], [97.03, 98.02, "Callback."], [98.78, 99.76, "Purpose."], [100.75, 103.03, "Purpose means the reason for a message."], [103.62, 105.37, "What is the purpose of the call?"], [105.98, 108.3, "Your turn. Say: Purpose."], [111.13, 112.11, "Purpose."], [112.85, 113.65, "Limited."], [114.65, 116.58, "Limited means not unlimited."], [117.18, 118.52, "The offer is limited."], [119.12, 121.65, "Your turn. Say: Limited."], [124.5, 125.47, "Limited."], [126.22, 127.16, "Reserve."], [128.15, 130.15, "Reserve means to book in advance."], [130.75, 132.26, "Reserve a seat today."], [132.85, 135.8, "Your turn. Say: Reserve."], [138.67, 139.66, "Reserve."], [140.47, 144.27, "Part two: dialogue. Let's listen to a conversation."], [145.12, 147.06, "Visal, what is Part 4?"], [148.15, 157.73, "You hear a short talk by one speaker, such as an announcement, a recorded message or an advertisement, and answer three questions about it."], [158.82, 161.16, "What information is usually included?"], [162.25, 172.74, "The opening gives the purpose and the speaker. The middle gives details such as times, prices or problems. The ending gives a request or a next step."], [173.85, 175.13, "How should I listen?"], [176.22, 186.22, "Preview the questions, listen for the purpose at the start, and catch numbers and names in the middle. The last sentence often tells you what the listener should do."], [187.37, 188.79, "Part three: grammar."], [189.65, 193.28, "Grammar focus: Strategy: purpose, details, request."], [193.57, 194.78, "Look at the pattern."], [195.48, 198.11, "This message is to remind you about your appointment."], [199.02, 201.64, "Please call us back before five o'clock today."], [202.6, 209.24, "Preview the questions, listen to the opening for the purpose, and catch the details. Always listen to the final request."], [209.98, 213.5, "Be careful! Don't say: I miss the request at the end."], [215.43, 217.51, "Say: I listen for the request."], [217.81, 219.33, "Last line matters."], [220.13, 222.61, "Part four: reading. Read and listen."], [223.4, 224.62, "A Voicemail."], [224.92, 227.88, "A dentist's assistant leaves a voicemail for a patient."], [228.9, 231.67, "She says the purpose is to remind him about an appointment."], [232.67, 234.99, "The appointment is on Tuesday at nine o'clock."], [236.0, 239.09, "She asks him to call back before five o'clock today."], [240.1, 243.95, "If he does not call, the office will give the time to another patient."], [245.03, 248.9, "Part five: quiz. Five questions. Are you ready?"], [249.75, 251.62, "Part 4 has blank speaker."], [251.92, 255.09, "A, three. B, five. C, one."], [258.63, 260.55, "The answer is C: one."], [261.72, 263.62, "The purpose is usually in the blank."], [263.92, 268.32, "A, opening. B, last number. C, title page."], [271.87, 273.86, "The answer is A: opening."], [275.02, 276.3, "When is the appointment?"], [276.6, 281.07, "A, Friday at two. B, Tuesday at nine. C, Monday at ten."], [284.63, 287.25, "The answer is B: Tuesday at nine."], [288.38, 289.91, "What should the patient do?"], [290.21, 294.69, "A, come at once. B, write a letter. C, call back before five."], [298.23, 301.01, "The answer is C: call back before five."], [302.15, 304.42, "The last sentence often gives a blank."], [304.72, 308.17, "A, request. B, title. C, joke."], [311.73, 313.72, "The answer is A: request."], [314.93, 318.2, "Part six: speaking. It's your turn to talk."], [319.05, 321.21, "How do you answer questions about a talk?"], [330.02, 331.63, "Now listen to Visal."], [331.93, 344.93, "I preview the three questions first. At the start of the talk I listen for the purpose, and in the middle I catch the numbers and names. At the end I listen for what the listener should do."], [345.23, 346.94, "Excellent answer, Visal!"], [347.85, 352.98, "Great work! Now you can use eight new words and strategy: purpose, details, request."], [353.27, 357.31, "Today's value is time management. Plan your day and use your time well."], [357.61, 360.16, "See you in Unit nine. Goodbye!"], [360.46, 363.28, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTC-Unit09-Part-4-Tours-Meetings-and-Speeches": [[0.35, 5.33, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEIC preparation."], [5.63, 9.2, "Hi! I'm Visal. Let's learn together!"], [9.5, 17.92, "Unit nine: Part 4: Tours, Meetings and Speeches. Today you will follow longer talks, understand structure and use graphics."], [18.22, 20.84, "Here is our lesson map. Let's start!"], [21.8, 25.03, "Part one: words. You will learn eight new words."], [25.88, 26.58, "Tour."], [27.58, 29.21, "Tour means a guided visit."], [29.82, 31.3, "The tour starts at ten."], [31.92, 34.05, "Your turn. Say: Tour."], [36.9, 37.63, "Tour."], [38.38, 39.56, "Presentation."], [40.55, 43.03, "Presentation means a talk with slides."], [43.62, 45.93, "The presentation lasts twenty minutes."], [46.52, 49.85, "Your turn. Say: Presentation."], [52.7, 53.86, "Presentation."], [54.62, 55.45, "Quarter."], [56.45, 58.88, "Quarter means three months of a business year."], [59.48, 61.58, "Sales rose in the third quarter."], [62.18, 64.44, "Your turn. Say: Quarter."], [67.3, 68.14, "Quarter."], [68.88, 69.7, "Revenue."], [70.68, 73.28, "Revenue means money a company earns."], [73.88, 75.88, "Revenue increased by ten percent."], [76.48, 78.68, "Your turn. Say: Revenue."], [81.53, 82.35, "Revenue."], [83.08, 83.99, "Welcome."], [84.98, 86.88, "Welcome means to greet someone."], [87.48, 89.31, "I'd like to welcome our guests."], [89.92, 92.07, "Your turn. Say: Welcome."], [94.93, 95.85, "Welcome."], [96.62, 97.64, "Facility."], [98.65, 102.08, "Facility means a building or area used for a purpose."], [102.68, 104.31, "The facility has a gym."], [104.92, 107.57, "Your turn. Say: Facility."], [110.43, 111.61, "Facility."], [112.35, 113.35, "Retire."], [114.35, 117.13, "Retire means to stop working after a career."], [117.72, 119.77, "Mr. Lee will retire next month."], [120.38, 123.59, "Your turn. Say: Retire."], [126.43, 127.48, "Retire."], [128.22, 129.14, "Applaud."], [130.15, 132.38, "Applaud means to clap to show thanks."], [132.98, 134.69, "Let's applaud our speaker."], [135.28, 137.91, "Your turn. Say: Applaud."], [140.77, 141.65, "Applaud."], [142.47, 146.08, "Part two: dialogue. Let's listen to a conversation."], [146.92, 149.87, "Visal, what types of talks appear in Part 4?"], [150.98, 162.54, "Common talks include a guide welcoming a tour group, a manager giving a meeting report, a speech at an event and a radio news item."], [163.65, 165.95, "What is the structure of a business speech?"], [167.05, 177.62, "A speaker welcomes people, states the topic, gives the main points and then thanks the listeners. Signposts like first, next and finally help you follow."], [178.72, 181.39, "How do I answer graphic questions in Part 4?"], [182.48, 193.75, "Study the chart first. If the speaker says the highest revenue was in the third quarter, find that quarter in the graphic and choose the matching label or number."], [194.9, 196.26, "Part three: grammar."], [197.12, 201.58, "Grammar focus: Strategy: follow the structure of the talk."], [201.88, 203.1, "Look at the pattern."], [203.78, 206.85, "Revenue increased by ten percent in the third quarter."], [207.75, 210.69, "First, I'll welcome you; next, I'll explain the schedule."], [211.63, 218.53, "Follow signposts, match the speaker's numbers with the graphic, and listen to the last lines for thanks and the next step."], [219.28, 222.74, "Be careful! Don't say: I ignore the signposts."], [224.7, 226.8, "Say: I follow the signposts."], [227.1, 228.88, "Signposts show order."], [229.67, 232.16, "Part four: reading. Read and listen."], [232.97, 234.29, "A Quarterly Meeting."], [234.59, 237.42, "A manager welcomes staff to the quarterly meeting."], [238.43, 241.83, "She says revenue increased by ten percent in the third quarter."], [242.83, 245.3, "She shows a chart with sales in four regions."], [246.3, 248.66, "The northern region had the highest figure."], [249.67, 252.54, "She thanks everyone and introduces the next speaker."], [253.63, 257.55, "Part five: quiz. Five questions. Are you ready?"], [258.42, 259.78, "A quarter is blank."], [260.08, 263.94, "A, three months. B, one week. C, one year."], [267.5, 269.55, "The answer is A: three months."], [270.68, 272.53, "Revenue increased by blank."], [272.83, 276.79, "A, one percent. B, ten percent. C, five percent."], [280.33, 282.76, "The answer is B: ten percent."], [283.92, 286.01, "Which region had the highest figure?"], [286.31, 290.47, "A, the south. B, the east. C, the northern region."], [294.03, 296.46, "The answer is C: the northern region."], [297.62, 300.35, "Signposts like first and next show blank."], [300.65, 304.29, "A, structure. B, spelling. C, a map."], [307.83, 309.61, "The answer is A: structure."], [310.75, 312.68, "What does the manager do at the end?"], [312.98, 317.12, "A, leave. B, thank everyone. C, cancel the meeting."], [320.67, 323.06, "The answer is B: thank everyone."], [324.27, 327.26, "Part six: speaking. It's your turn to talk."], [328.12, 330.73, "How do you follow a longer talk in Part 4?"], [339.52, 340.88, "Now listen to Visal."], [341.18, 355.3, "I listen for the welcome and the topic, then follow signposts such as first, next and finally. I match numbers with the graphic if there is one. In the last lines I listen for thanks and the next step."], [355.6, 357.46, "Excellent answer, Visal!"], [358.35, 363.85, "Great work! Now you can use eight new words and strategy: follow the structure of the talk."], [364.15, 368.78, "Today's value is preparedness. Get ready before an emergency happens."], [369.08, 371.69, "See you in Unit ten. Goodbye!"], [371.99, 375.29, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTC-Unit10-Listening-Review-Paraphrase-and-Distractors": [[0.35, 5.12, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEIC preparation."], [5.42, 8.84, "Hi! I'm Visal. Let's learn together!"], [9.14, 17.63, "Unit ten: Listening Review: Paraphrase and Distractors. Today you will recognise paraphrase and avoid the most common listening traps."], [17.93, 20.7, "Here is our lesson map. Let's start!"], [21.63, 24.9, "Part one: words. You will learn eight new words."], [25.75, 26.94, "Paraphrase."], [27.95, 30.86, "Paraphrase means the same idea in different words."], [31.45, 33.27, "The answer is a paraphrase."], [33.88, 36.28, "Your turn. Say: Paraphrase."], [39.13, 40.34, "Paraphrase."], [41.08, 42.18, "Distractor."], [43.18, 46.02, "Distractor means a wrong answer that sounds possible."], [46.62, 48.58, "This option is a distractor."], [49.18, 51.74, "Your turn. Say: Distractor."], [54.6, 55.87, "Distractor."], [56.62, 57.62, "Synonym."], [58.62, 61.41, "Synonym means a word with a similar meaning."], [62.02, 64.03, "Purchase is a synonym of buy."], [64.62, 67.18, "Your turn. Say: Synonym."], [70.03, 71.01, "Synonym."], [71.75, 72.87, "Repetition."], [73.88, 76.31, "Repetition means hearing the same word again."], [76.92, 78.74, "Repetition can be a trap."], [79.35, 82.28, "Your turn. Say: Repetition."], [85.13, 86.25, "Repetition."], [87.02, 88.28, "Similar sound."], [89.28, 91.89, "Similar sound means words that sound alike."], [92.48, 94.53, "Right and write are similar sounds."], [95.12, 97.71, "Your turn. Say: Similar sound."], [100.57, 102.09, "Similar sound."], [102.85, 104.26, "Time reference."], [105.25, 107.75, "Time reference means a word that shows when."], [108.35, 110.43, "Listen for the time reference."], [111.02, 113.88, "Your turn. Say: Time reference."], [116.73, 118.11, "Time reference."], [118.85, 120.03, "Eliminate."], [121.02, 123.57, "Eliminate means to remove wrong options."], [124.18, 125.85, "Eliminate wrong answers."], [126.45, 128.71, "Your turn. Say: Eliminate."], [131.57, 132.54, "Eliminate."], [133.28, 134.26, "Review."], [135.25, 136.91, "Review means to check again."], [137.52, 139.11, "Review your mistakes."], [139.72, 141.93, "Your turn. Say: Review."], [144.77, 145.86, "Review."], [146.67, 150.58, "Part two: dialogue. Let's listen to a conversation."], [151.45, 154.4, "Visal, what is paraphrase in TOEIC Listening?"], [155.52, 166.49, "The correct answer often says the same idea with different words. If the speaker says the shipment will be late, the answer may say the delivery is delayed."], [167.58, 169.4, "What are common distractors?"], [170.48, 180.95, "Distractors repeat a word from the audio but change the meaning, use a similar sound, or describe the wrong time, such as last week instead of next week."], [182.05, 183.26, "How do I improve?"], [184.35, 192.34, "Review each mistake and ask why the wrong option looked attractive. Make a list of paraphrases and practise listening with transcripts."], [193.5, 195.12, "Part three: grammar."], [195.95, 200.79, "Grammar focus: Strategy: choose meaning over matching words."], [201.09, 202.26, "Look at the pattern."], [202.95, 205.74, "The shipment will be late means the delivery is delayed."], [206.65, 210.61, "A word heard in the audio may be a distractor if the meaning changes."], [211.57, 218.36, "Expect paraphrase, avoid options that only repeat words, and review mistakes to learn which traps work on you."], [219.12, 223.12, "Be careful! Don't say: I choose the option with the same word."], [225.07, 227.01, "Say: I choose the same meaning."], [227.31, 228.78, "Meaning over words."], [229.6, 232.25, "Part four: reading. Read and listen."], [233.07, 234.5, "Learning from Mistakes."], [234.8, 237.45, "Thida reviews her wrong answers in a notebook."], [238.43, 241.91, "She sees that she often chooses options with repeated words."], [242.9, 246.09, "Her teacher shows her that the right answer is a paraphrase."], [247.1, 249.85, "She makes a list of synonyms and paraphrases."], [250.87, 253.34, "In her next test she avoids the traps."], [254.43, 258.28, "Part five: quiz. Five questions. Are you ready?"], [259.15, 260.86, "A paraphrase uses blank."], [261.16, 266.73, "A, no words. B, different words for the same idea. C, the same words."], [270.27, 273.32, "The answer is B: different words for the same idea."], [274.48, 276.88, "A distractor may repeat a word but blank."], [277.18, 281.24, "A, be correct. B, be silent. C, change the meaning."], [284.8, 287.35, "The answer is C: change the meaning."], [288.48, 290.62, "The shipment will be late means blank."], [290.92, 296.44, "A, the delivery is delayed. B, the delivery is early. C, it is free."], [300.0, 302.77, "The answer is A: the delivery is delayed."], [303.92, 305.4, "What does Thida keep?"], [305.7, 310.51, "A, a map. B, a mistake notebook. C, a diary of food."], [314.07, 316.72, "The answer is B: a mistake notebook."], [317.85, 319.15, "What should you choose?"], [319.45, 324.52, "A, the repeated word. B, the longest option. C, the matching meaning."], [328.07, 330.89, "The answer is C: the matching meaning."], [332.1, 335.44, "Part six: speaking. It's your turn to talk."], [336.28, 338.76, "How do you avoid distractors in TOEIC Listening?"], [347.55, 348.99, "Now listen to Visal."], [349.29, 362.78, "I listen for the meaning, not for the same words. I expect that correct answers use synonyms and paraphrases. After practice tests I review my mistakes and write down the traps that I fell into."], [363.08, 364.79, "Excellent answer, Visal!"], [365.68, 371.82, "Great work! Now you can use eight new words and strategy: choose meaning over matching words."], [372.12, 376.08, "Today's value is reflection. Think about what you learned and how you grew."], [376.38, 378.92, "See you in Unit eleven. Goodbye!"], [379.22, 382.92, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTC-Unit11-Part-5-Parts-of-Speech": [[0.35, 5.05, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEIC preparation."], [5.35, 8.96, "Hi! I'm Visal. Let's learn together!"], [9.26, 17.23, "Unit eleven: Part 5: Parts of Speech. Today you will choose the correct word form: noun, verb, adjective or adverb."], [17.52, 20.33, "Here is our lesson map. Let's start!"], [21.27, 24.46, "Part one: words. You will learn eight new words."], [25.32, 26.28, "Noun."], [27.28, 30.01, "Noun means a word for a person, place or thing."], [30.62, 32.02, "Decision is a noun."], [32.62, 34.97, "Your turn. Say: Noun."], [37.83, 38.77, "Noun."], [39.52, 40.27, "Verb."], [41.28, 43.79, "Verb means a word for an action or state."], [44.38, 45.8, "Decide is a verb."], [46.42, 48.73, "Your turn. Say: Verb."], [51.57, 52.17, "Verb."], [52.92, 53.85, "Adjective."], [54.85, 57.37, "Adjective means a word that describes a noun."], [57.98, 59.79, "Decisive is an adjective."], [60.38, 62.9, "Your turn. Say: Adjective."], [65.73, 66.67, "Adjective."], [67.42, 68.23, "Adverb."], [69.22, 72.24, "Adverb means a word that describes a verb or adjective."], [72.85, 74.72, "Decisively is an adverb."], [75.32, 77.53, "Your turn. Say: Adverb."], [80.37, 81.29, "Adverb."], [82.05, 83.18, "Suffix."], [84.18, 86.89, "Suffix means letters added to the end of a word."], [87.48, 89.37, "The suffix -tion makes a noun."], [89.98, 92.69, "Your turn. Say: Suffix."], [95.53, 96.66, "Suffix."], [97.42, 98.46, "Word form."], [99.45, 102.39, "Word form means the shape of a word in a sentence."], [102.98, 104.3, "Check the word form."], [104.88, 107.18, "Your turn. Say: Word form."], [110.03, 111.15, "Word form."], [111.92, 112.96, "Modify."], [113.95, 116.69, "Modify means to describe or change the meaning."], [117.28, 119.19, "Adverbs modify verbs."], [119.78, 122.54, "Your turn. Say: Modify."], [125.4, 126.42, "Modify."], [127.18, 128.36, "Incomplete."], [129.35, 131.35, "Incomplete means not finished."], [131.95, 134.32, "Part 5 has incomplete sentences."], [134.92, 137.32, "Your turn. Say: Incomplete."], [140.17, 141.32, "Incomplete."], [142.13, 145.57, "Part two: dialogue. Let's listen to a conversation."], [146.42, 148.26, "Visal, what is Part 5?"], [149.35, 160.32, "It has thirty incomplete sentences. You choose the word or phrase that best completes each one. Many questions test grammar, and others test vocabulary."], [161.42, 164.12, "How do I answer word-form questions?"], [165.22, 180.62, "Look at the gap and the words around it. After the, a noun or an adjective may come. After a verb, an adverb may modify it. A suffix can help: -tion and -ment often make nouns, -ly makes adverbs."], [181.72, 183.16, "How fast should I be?"], [184.25, 195.41, "Aim for about twenty seconds per question. Grammar questions are often quick, so do not waste time and keep more minutes for long reading passages."], [196.57, 198.11, "Part three: grammar."], [198.95, 202.75, "Grammar focus: Strategy: look at the words around the gap."], [203.05, 204.2, "Look at the pattern."], [204.92, 207.75, "The manager made a quick decision about the budget (noun)."], [208.65, 211.17, "She spoke clearly to the clients (adverb)."], [212.13, 218.95, "Decide what part of speech the gap needs by looking at the words before and after it. Then choose the form with the right suffix."], [219.72, 224.17, "Be careful! Don't say: I choose a word without checking the position."], [226.13, 228.86, "Say: I check the words around the gap."], [229.16, 230.39, "Check the position."], [231.2, 234.07, "Part four: reading. Read and listen."], [234.87, 236.24, "Word Forms at Work."], [236.54, 239.93, "The sentence says: The company made a ___ about the new office."], [240.93, 243.7, "The gap comes after the article a and an adjective."], [244.7, 246.69, "So the missing word must be a noun."], [247.7, 251.3, "The options are decide, decision, decisive and decisively."], [252.3, 253.95, "Vuthy chooses decision."], [255.07, 259.13, "Part five: quiz. Five questions. Are you ready?"], [259.98, 261.75, "Part 5 has blank questions."], [262.05, 265.6, "A, ten. B, one hundred. C, thirty."], [269.13, 270.97, "The answer is C: thirty."], [272.12, 274.67, "After the article 'a', the gap needs blank."], [274.97, 280.25, "A, a noun or adjective. B, a verb only. C, an adverb only."], [283.8, 286.84, "The answer is A: a noun or adjective."], [287.98, 290.14, "The suffix -ly often makes blank."], [290.44, 294.02, "A, a pronoun. B, an adverb. C, a noun."], [297.57, 299.75, "The answer is B: an adverb."], [300.92, 303.36, "Which word fits: made a blank?"], [303.66, 307.52, "A, decide. B, decisively. C, decision."], [311.07, 312.95, "The answer is C: decision."], [314.12, 316.28, "How much time per Part 5 question?"], [316.58, 321.02, "A, about twenty seconds. B, five minutes. C, one hour."], [324.57, 327.4, "The answer is A: about twenty seconds."], [328.6, 332.03, "Part six: speaking. It's your turn to talk."], [332.88, 335.88, "How do you choose the correct word form in Part 5?"], [344.68, 346.06, "Now listen to Visal."], [346.36, 358.19, "I look at the words before and after the gap and decide the part of speech that fits. Then I choose the word with the correct suffix. I do this quickly so that I save time for Part 7."], [358.49, 360.16, "Excellent answer, Visal!"], [361.05, 366.35, "Great work! Now you can use eight new words and strategy: look at the words around the gap."], [366.65, 371.86, "Today's value is precision of language. Choose your words carefully so others understand you."], [372.16, 374.68, "See you in Unit twelve. Goodbye!"], [374.98, 377.5, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTC-Unit12-Part-5-Verb-Tenses-and-Agreement": [[0.35, 5.05, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEIC preparation."], [5.35, 8.53, "Hi! I'm Visal. Let's learn together!"], [8.83, 17.06, "Unit twelve: Part 5: Verb Tenses and Agreement. Today you will choose the correct tense and make subjects and verbs agree."], [17.36, 19.99, "Here is our lesson map. Let's start!"], [20.93, 24.27, "Part one: words. You will learn eight new words."], [25.12, 25.94, "Tense."], [26.95, 29.64, "Tense means the form of a verb that shows time."], [30.25, 31.58, "Check the tense."], [32.18, 34.58, "Your turn. Say: Tense."], [37.43, 38.3, "Tense."], [39.05, 39.99, "Agreement."], [40.98, 43.61, "Agreement means matching the verb to the subject."], [44.22, 46.34, "Subject-verb agreement is tested."], [46.95, 49.52, "Your turn. Say: Agreement."], [52.37, 53.41, "Agreement."], [54.15, 55.26, "Singular."], [56.25, 57.67, "Singular means one."], [58.28, 59.88, "The manager is singular."], [60.48, 63.08, "Your turn. Say: Singular."], [65.93, 67.04, "Singular."], [67.78, 68.48, "Plural."], [69.48, 71.0, "Plural means more than one."], [71.58, 73.12, "The managers are plural."], [73.72, 76.09, "Your turn. Say: Plural."], [78.93, 79.77, "Plural."], [80.52, 81.68, "Present perfect."], [82.68, 85.97, "Present perfect means the tense for an action with a link to now."], [86.58, 87.91, "The company has grown."], [88.52, 91.3, "Your turn. Say: Present perfect."], [94.13, 95.27, "Present perfect."], [96.02, 97.04, "Passive."], [98.05, 101.21, "Passive means the form where the subject receives the action."], [101.82, 103.24, "The report was sent."], [103.85, 106.82, "Your turn. Say: Passive."], [109.67, 110.61, "Passive."], [111.35, 112.42, "Time marker."], [113.42, 116.23, "Time marker means a word like yesterday or since."], [116.82, 118.43, "Look at the time marker."], [119.02, 121.72, "Your turn. Say: Time marker."], [124.57, 125.74, "Time marker."], [126.48, 127.45, "Conditional."], [128.45, 131.02, "Conditional means about a possible situation."], [131.62, 133.51, "If we order, we will save."], [134.12, 136.59, "Your turn. Say: Conditional."], [139.43, 140.39, "Conditional."], [141.2, 145.03, "Part two: dialogue. Let's listen to a conversation."], [145.88, 148.32, "Visal, how do I find the right tense?"], [149.42, 162.62, "Look for a time marker, such as yesterday, since, by next week or currently. Yesterday needs the past simple, since needs the present perfect, and by next week often needs the future perfect."], [163.72, 165.24, "How is agreement tested?"], [166.35, 177.87, "The subject may be far from the verb, for example, the list of new products is on the desk. The verb agrees with the subject list, not with products."], [178.98, 180.87, "What about passive questions?"], [181.98, 194.12, "If the subject receives the action, use the passive: The invoice was sent yesterday. After a modal, use be plus the past participle, such as must be signed."], [195.27, 196.72, "Part three: grammar."], [197.58, 202.07, "Grammar focus: Strategy: time marker, subject, passive."], [202.37, 203.64, "Look at the pattern."], [204.35, 207.55, "The company has grown since it opened in 2020."], [208.45, 210.72, "The list of new products is on the desk."], [211.67, 218.02, "Find the time marker, identify the true subject, and check whether the sentence needs an active or passive verb."], [218.78, 222.38, "Be careful! Don't say: I ignore time markers."], [224.33, 226.76, "Say: I use time markers."], [227.06, 228.41, "Time markers help."], [229.2, 231.88, "Part four: reading. Read and listen."], [232.67, 233.83, "Time Markers."], [234.13, 237.34, "Sokunthea reads: The invoice ___ sent yesterday."], [238.33, 240.48, "Yesterday is a past time marker."], [241.5, 244.52, "The invoice does not send itself, so the passive is needed."], [245.53, 247.99, "The options are is, was, has and will."], [249.0, 250.53, "She chooses was."], [251.63, 255.73, "Part five: quiz. Five questions. Are you ready?"], [256.58, 259.02, "'Since 2020' needs the blank."], [259.32, 263.57, "A, present perfect. B, past simple. C, future."], [267.13, 269.84, "The answer is A: present perfect."], [270.98, 274.4, "In 'The list of new products blank on the desk', use blank."], [274.7, 277.9, "A, were. B, is. C, are."], [281.43, 282.98, "The answer is B: is."], [284.12, 286.19, "The invoice blank sent yesterday."], [286.49, 289.71, "A, has. B, will. C, was."], [293.27, 295.44, "The answer is C: was."], [296.58, 298.25, "A time marker is blank."], [298.55, 303.69, "A, a word showing time. B, a punctuation mark. C, a title."], [307.23, 310.17, "The answer is A: a word showing time."], [311.32, 313.49, "After a modal, the passive is blank."], [313.79, 319.17, "A, do + verb. B, be + past participle. C, is + base."], [322.73, 325.85, "The answer is B: be + past participle."], [327.03, 330.08, "Part six: speaking. It's your turn to talk."], [330.92, 333.45, "How do you choose the correct tense in Part 5?"], [342.25, 343.81, "Now listen to Visal."], [344.11, 356.18, "I look for a time marker such as yesterday or since. I find the real subject and check the agreement, and I decide whether the sentence is active or passive. Then I choose the form that fits."], [356.48, 358.07, "Excellent answer, Visal!"], [358.98, 365.19, "Great work! Now you can use eight new words and strategy: time marker, subject, passive."], [365.49, 370.45, "Today's value is logical rigor. Follow your reasoning wherever it honestly leads."], [370.75, 373.45, "See you in Unit thirteen. Goodbye!"], [373.75, 376.48, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTC-Unit13-Part-5-Prepositions-and-Conjunctions": [[0.35, 5.51, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEIC preparation."], [5.81, 9.22, "Hi! I'm Visal. Let's learn together!"], [9.52, 17.39, "Unit thirteen: Part 5: Prepositions and Conjunctions. Today you will choose prepositions, conjunctions and linking words correctly."], [17.69, 20.41, "Here is our lesson map. Let's start!"], [21.37, 24.93, "Part one: words. You will learn eight new words."], [25.78, 26.85, "Preposition."], [27.85, 30.62, "Preposition means a word like in, on or at."], [31.22, 32.66, "At is a preposition."], [33.25, 36.06, "Your turn. Say: Preposition."], [38.9, 39.89, "Preposition."], [40.65, 41.66, "Conjunction."], [42.65, 45.38, "Conjunction means a word that joins ideas."], [45.98, 47.51, "Although is a conjunction."], [48.12, 50.54, "Your turn. Say: Conjunction."], [53.4, 54.48, "Conjunction."], [55.22, 56.16, "Although."], [57.15, 59.29, "Although means in spite of the fact that."], [59.88, 61.44, "Although it rained, we worked."], [62.05, 64.18, "Your turn. Say: Although."], [67.03, 68.07, "Although."], [68.82, 69.72, "Because of."], [70.72, 72.76, "Because of means as a result of."], [73.35, 75.53, "Because of the delay, we left late."], [76.15, 78.73, "Your turn. Say: Because of."], [81.57, 82.52, "Because of."], [83.28, 84.23, "Despite."], [85.22, 86.95, "Despite means in spite of."], [87.55, 89.47, "Despite the cost, we bought it."], [90.08, 92.48, "Your turn. Say: Despite."], [95.33, 96.23, "Despite."], [96.98, 98.03, "Unless."], [99.02, 100.7, "Unless means if not."], [101.32, 103.34, "Unless you sign, we cannot start."], [103.95, 106.38, "Your turn. Say: Unless."], [109.23, 110.28, "Unless."], [111.02, 111.82, "By."], [112.82, 114.35, "By means not later than."], [114.95, 116.45, "Send it by Friday."], [117.05, 119.33, "Your turn. Say: By."], [122.17, 123.08, "By."], [123.82, 125.0, "Until."], [126.02, 127.97, "Until means up to a certain time."], [128.58, 129.81, "Wait until noon."], [130.42, 132.81, "Your turn. Say: Until."], [135.67, 136.67, "Until."], [137.47, 141.62, "Part two: dialogue. Let's listen to a conversation."], [142.48, 145.88, "Visal, why do students confuse although and despite?"], [146.98, 160.1, "Although is a conjunction, so a clause follows it: although it was expensive. Despite is a preposition, so a noun or an -ing form follows: despite the price."], [161.18, 163.0, "What about by and until?"], [164.08, 173.28, "By means no later than, for example, submit it by Friday. Until means up to a time and shows continuation, such as I will wait until noon."], [174.38, 175.95, "How do I choose quickly?"], [177.05, 185.65, "Look at what comes after the gap: a clause or a noun. Then check the meaning: contrast, reason, time or condition."], [186.8, 188.52, "Part three: grammar."], [189.38, 193.08, "Grammar focus: Strategy: what follows the gap?."], [193.38, 194.69, "Look at the pattern."], [195.38, 198.58, "Although the price was high, we signed the contract."], [199.48, 202.16, "Despite the high price, we signed the contract."], [203.1, 209.06, "Check whether a clause or a noun follows the gap, then choose a conjunction or a preposition with the right meaning."], [209.82, 213.9, "Be careful! Don't say: I use despite before a clause."], [215.83, 218.69, "Say: I use although before a clause."], [218.99, 220.47, "Despite + noun."], [221.27, 223.98, "Part four: reading. Read and listen."], [224.77, 226.17, "Choosing the Right Word."], [226.47, 230.05, "The sentence says: ___ the high price, the team bought the machine."], [231.07, 234.38, "A noun phrase follows the gap, so a preposition is needed."], [235.37, 238.32, "The options are although, despite, because and unless."], [239.33, 242.09, "The meaning is contrast, so Despite fits."], [243.1, 245.45, "Rotha chooses Despite and moves on."], [246.53, 250.67, "Part five: quiz. Five questions. Are you ready?"], [251.52, 253.09, "A clause follows blank."], [253.39, 257.16, "A, by. B, although. C, despite."], [260.7, 262.71, "The answer is B: although."], [263.85, 265.41, "'By Friday' means blank."], [265.71, 270.64, "A, until Friday ends. B, after Friday. C, no later than Friday."], [274.2, 276.77, "The answer is C: no later than Friday."], [277.92, 279.4, "'Unless' means blank."], [279.7, 283.06, "A, if not. B, because. C, although."], [286.6, 288.24, "The answer is A: if not."], [289.38, 292.24, "Which fits: blank the high price, we bought it?"], [292.54, 296.3, "A, Unless. B, Despite. C, Although."], [299.83, 301.94, "The answer is B: Despite."], [303.08, 304.68, "What follows 'despite'?"], [304.98, 309.62, "A, a full clause only. B, nothing. C, a noun or -ing form."], [313.17, 315.9, "The answer is C: a noun or -ing form."], [317.1, 320.07, "Part six: speaking. It's your turn to talk."], [320.92, 323.31, "How do you choose between although and despite?"], [332.12, 333.49, "Now listen to Visal."], [333.79, 348.29, "I look at what follows the gap. If a clause follows, I use although, and if a noun or an -ing form follows, I use despite. Both show contrast, so the meaning is the same but the grammar is different."], [348.59, 350.38, "Excellent answer, Visal!"], [351.28, 356.2, "Great work! Now you can use eight new words and strategy: what follows the gap?."], [356.5, 361.76, "Today's value is precision of language. Choose your words carefully so others understand you."], [362.06, 364.77, "See you in Unit fourteen. Goodbye!"], [365.07, 368.48, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTC-Unit14-Part-5-Business-Vocabulary-and-Collocations": [[0.35, 5.05, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEIC preparation."], [5.35, 8.98, "Hi! I'm Visal. Let's learn together!"], [9.28, 18.68, "Unit fourteen: Part 5: Business Vocabulary and Collocations. Today you will choose the word that collocates naturally in workplace sentences."], [18.98, 21.7, "Here is our lesson map. Let's start!"], [22.63, 26.05, "Part one: words. You will learn eight new words."], [26.92, 27.95, "Collocation."], [28.95, 31.64, "Collocation means words that often go together."], [32.25, 34.4, "Make a decision is a collocation."], [35.02, 37.51, "Your turn. Say: Collocation."], [40.37, 41.47, "Collocation."], [42.22, 43.26, "Reduce."], [44.25, 46.11, "Reduce means to make smaller."], [46.72, 48.18, "Reduce costs."], [48.78, 51.65, "Your turn. Say: Reduce."], [54.5, 55.55, "Reduce."], [56.28, 57.23, "Submit."], [58.22, 60.2, "Submit means to give for approval."], [60.82, 62.2, "Submit the report."], [62.82, 65.16, "Your turn. Say: Submit."], [68.0, 69.0, "Submit."], [69.75, 70.67, "Attend."], [71.68, 73.66, "Attend means to be present at."], [74.25, 75.45, "Attend a meeting."], [76.05, 78.97, "Your turn. Say: Attend."], [81.83, 82.75, "Attend."], [83.52, 84.27, "Reach."], [85.28, 87.05, "Reach means to get to a goal."], [87.65, 88.97, "Reach an agreement."], [89.55, 92.38, "Your turn. Say: Reach."], [95.23, 96.04, "Reach."], [96.78, 97.87, "Place an order."], [98.85, 101.96, "Place an order means to ask a company to supply goods."], [102.55, 103.99, "Place an order online."], [104.58, 107.46, "Your turn. Say: Place an order."], [110.3, 111.41, "Place an order."], [112.15, 113.44, "Meet a deadline."], [114.45, 116.69, "Meet a deadline means to finish on time."], [117.28, 118.89, "We must meet the deadline."], [119.48, 122.36, "Your turn. Say: Meet a deadline."], [125.2, 126.53, "Meet a deadline."], [127.28, 128.74, "Take responsibility."], [129.75, 132.89, "Take responsibility means to accept duty for something."], [133.48, 135.78, "He takes responsibility for sales."], [136.38, 139.66, "Your turn. Say: Take responsibility."], [142.5, 144.06, "Take responsibility."], [144.87, 148.96, "Part two: dialogue. Let's listen to a conversation."], [149.82, 152.55, "Visal, which words appear a lot in Part 5?"], [153.65, 165.11, "Business verbs like submit, attend, reduce and reach, and nouns like budget, schedule, policy and invoice. You often need to know which word goes with which."], [166.22, 168.05, "How do I learn collocations?"], [169.15, 182.62, "Learn short phrases instead of single words: submit a report, reach an agreement, meet a deadline and place an order. Say them aloud until they sound natural."], [183.72, 185.23, "What mistakes happen?"], [186.32, 196.49, "Students choose a word that has a good meaning but the wrong partner, such as do an agreement instead of reach an agreement, or make a deadline instead of meet a deadline."], [197.63, 199.33, "Part three: grammar."], [200.18, 205.02, "Grammar focus: Strategy: learn phrases, not single words."], [205.32, 206.58, "Look at the pattern."], [207.28, 209.38, "We must meet the deadline on Friday."], [210.28, 212.89, "The two companies reached an agreement last week."], [213.83, 221.7, "Learn business collocations as whole phrases. When two options look possible, choose the one that sounds natural with the words nearby."], [222.45, 225.81, "Be careful! Don't say: I say 'do an agreement'."], [227.77, 230.43, "Say: I say 'reach an agreement'."], [230.73, 232.32, "Learn collocations."], [233.13, 235.7, "Part four: reading. Read and listen."], [236.5, 237.92, "Business Phrases."], [238.22, 241.11, "Piseth keeps a list of business collocations."], [242.1, 244.68, "He writes submit a report and reach an agreement."], [245.67, 248.57, "He also writes place an order and meet a deadline."], [249.57, 251.89, "On the test he sees the gap: reach an ___."], [252.9, 255.84, "He chooses agreement because he remembers the phrase."], [256.93, 261.13, "Part five: quiz. Five questions. Are you ready?"], [261.98, 263.73, "A collocation is blank."], [264.03, 268.41, "A, a spelling. B, a number. C, words that go together."], [271.97, 275.21, "The answer is C: words that go together."], [276.35, 277.56, "Which is natural?"], [277.86, 282.67, "A, reach an agreement. B, do an agreement. C, take an agreement."], [286.23, 288.6, "The answer is A: reach an agreement."], [289.75, 291.52, "We must blank the deadline."], [291.82, 294.62, "A, do. B, meet. C, make."], [298.17, 300.19, "The answer is B: meet."], [301.35, 302.85, "You blank a report."], [303.15, 306.42, "A, drink. B, grow. C, submit."], [309.97, 312.14, "The answer is C: submit."], [313.28, 314.74, "What does Piseth keep?"], [315.04, 319.58, "A, a list of phrases. B, a diary of films. C, a map."], [323.13, 325.5, "The answer is A: a list of phrases."], [326.7, 329.89, "Part six: speaking. It's your turn to talk."], [330.75, 333.17, "How do you learn business collocations?"], [341.98, 343.54, "Now listen to Visal."], [343.84, 357.36, "I learn them as short phrases, such as reach an agreement and meet a deadline. I write them in a list with an example, and I say them aloud. In the test I choose the word that sounds natural with the words around it."], [357.66, 359.37, "Excellent answer, Visal!"], [360.28, 366.37, "Great work! Now you can use eight new words and strategy: learn phrases, not single words."], [366.67, 371.05, "Today's value is lifelong learning. Keep learning for as long as you live."], [371.35, 373.73, "See you in Unit fifteen. Goodbye!"], [374.03, 377.33, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTC-Unit15-Part-6-Text-Completion": [[0.35, 5.01, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEIC preparation."], [5.31, 9.1, "Hi! I'm Visal. Let's learn together!"], [9.39, 17.9, "Unit fifteen: Part 6: Text Completion. Today you will complete emails, notices and articles using grammar and context."], [18.2, 20.66, "Here is our lesson map. Let's start!"], [21.6, 25.03, "Part one: words. You will learn eight new words."], [25.88, 27.19, "Text completion."], [28.18, 31.45, "Text completion means filling gaps in a short text."], [32.05, 34.07, "Part 6 is text completion."], [34.68, 37.53, "Your turn. Say: Text completion."], [40.37, 41.87, "Text completion."], [42.62, 43.81, "Context."], [44.82, 47.07, "Context means the words around a gap."], [47.68, 49.53, "Use context to choose."], [50.12, 53.09, "Your turn. Say: Context."], [55.93, 56.9, "Context."], [57.65, 58.8, "Linking word."], [59.82, 62.72, "Linking word means a word that connects ideas."], [63.32, 64.83, "However is a linking word."], [65.42, 68.15, "Your turn. Say: Linking word."], [71.0, 72.14, "Linking word."], [72.88, 73.87, "Insert."], [74.88, 77.75, "Insert means to put a sentence in the right place."], [78.35, 79.95, "Insert the best sentence."], [80.55, 82.87, "Your turn. Say: Insert."], [85.7, 86.6, "Insert."], [87.35, 88.34, "Logical."], [89.35, 91.43, "Logical means making sense."], [92.02, 93.76, "The sentence is logical."], [94.35, 96.79, "Your turn. Say: Logical."], [99.63, 100.75, "Logical."], [101.52, 102.67, "Refer to."], [103.68, 105.44, "Refer to means to mention."], [106.05, 108.17, "This refers to the earlier point."], [108.75, 111.54, "Your turn. Say: Refer to."], [114.4, 115.3, "Refer to."], [116.05, 116.87, "Pronoun."], [117.85, 120.01, "Pronoun means a word like it or they."], [120.62, 122.66, "The pronoun refers to the manager."], [123.25, 125.75, "Your turn. Say: Pronoun."], [128.6, 129.64, "Pronoun."], [130.38, 131.35, "Cohesion."], [132.35, 134.68, "Cohesion means how sentences connect."], [135.28, 136.95, "Good cohesion helps you."], [137.55, 140.44, "Your turn. Say: Cohesion."], [143.3, 144.46, "Cohesion."], [145.27, 148.53, "Part two: dialogue. Let's listen to a conversation."], [149.38, 151.41, "Visal, what is Part 6?"], [152.52, 161.62, "You read four short texts, such as emails or notices, each with several gaps. You choose a word, a phrase or a whole sentence that fits."], [162.72, 164.74, "How is it different from Part 5?"], [165.85, 176.77, "Some gaps need you to read the sentence before or after, because the answer may be a linking word like however or therefore, or a verb tense that matches the whole text."], [177.85, 179.78, "How do I choose a missing sentence?"], [180.88, 191.38, "Read the sentences before and after the gap. The best choice connects to both: it may refer back with a pronoun and lead into the next idea."], [192.53, 194.08, "Part three: grammar."], [194.92, 198.2, "Grammar focus: Strategy: read around the gap."], [198.5, 199.62, "Look at the pattern."], [200.32, 204.58, "The system will be down tomorrow. Therefore, please save your work today."], [205.48, 209.1, "The best sentence connects to both the line before and the line after."], [210.03, 216.07, "Read the whole text quickly, then choose the answer that fits the grammar and connects the ideas before and after the gap."], [216.82, 220.08, "Be careful! Don't say: I read only the gap."], [222.03, 224.43, "Say: I read around the gap."], [224.73, 226.04, "Context matters."], [226.83, 229.78, "Part four: reading. Read and listen."], [230.57, 231.97, "A Notice Completed."], [232.27, 235.89, "A notice tells staff that the system will be offline on Saturday."], [236.9, 240.25, "One gap needs a linking word before please save your work."], [241.23, 245.16, "The first part gives a problem, so the next part gives an action."], [246.17, 248.17, "Therefore is a logical connector."], [249.17, 252.15, "Dara chooses Therefore and rereads the whole notice."], [253.27, 257.29, "Part five: quiz. Five questions. Are you ready?"], [258.15, 260.4, "Part 6 has blank short texts."], [260.7, 263.62, "A, four. B, one. C, ten."], [267.17, 268.98, "The answer is A: four."], [270.12, 271.7, "A gap may need a blank."], [272.0, 275.84, "A, picture. B, whole sentence. C, map."], [279.4, 281.83, "The answer is B: whole sentence."], [282.98, 284.45, "Therefore shows blank."], [284.75, 288.68, "A, a contrast. B, a place. C, a result."], [292.23, 294.37, "The answer is C: a result."], [295.52, 296.98, "What is the notice about?"], [297.28, 301.97, "A, the system being offline. B, a party. C, a trip."], [305.53, 308.07, "The answer is A: the system being offline."], [309.22, 311.18, "To choose a sentence, read blank."], [311.48, 315.89, "A, nothing. B, before and after the gap. C, only the title."], [319.43, 322.15, "The answer is B: before and after the gap."], [323.37, 326.47, "Part six: speaking. It's your turn to talk."], [327.32, 329.41, "How do you answer Part 6 questions?"], [338.22, 339.67, "Now listen to Visal."], [339.97, 353.76, "I read the whole text quickly to understand the idea. For each gap I read the sentences before and after it. I choose the answer that fits the grammar and connects logically, and then I read the sentence again."], [354.06, 355.73, "Excellent answer, Visal!"], [356.65, 361.62, "Great work! Now you can use eight new words and strategy: read around the gap."], [361.92, 366.69, "Today's value is critical thinking. Think carefully and give reasons for your opinions."], [366.99, 369.56, "See you in Unit sixteen. Goodbye!"], [369.86, 373.66, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTC-Unit16-Part-7-Emails-and-Memos": [[0.35, 5.25, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEIC preparation."], [5.55, 8.93, "Hi! I'm Visal. Let's learn together!"], [9.23, 18.14, "Unit sixteen: Part 7: Emails and Memos. Today you will read business emails and memos and answer detail and inference questions."], [18.44, 20.99, "Here is our lesson map. Let's start!"], [21.93, 25.04, "Part one: words. You will learn eight new words."], [25.88, 26.69, "Memo."], [27.68, 30.48, "Memo means a short written message inside a company."], [31.08, 32.03, "Read the memo."], [32.62, 34.9, "Your turn. Say: Memo."], [37.73, 38.61, "Memo."], [39.35, 40.33, "Recipient."], [41.32, 44.0, "Recipient means the person who receives a message."], [44.62, 46.53, "The recipient is the manager."], [47.15, 49.4, "Your turn. Say: Recipient."], [52.23, 53.3, "Recipient."], [54.05, 54.88, "Sender."], [55.88, 58.39, "Sender means the person who sends a message."], [58.98, 60.54, "The sender is Ms. Kim."], [61.15, 63.15, "Your turn. Say: Sender."], [66.0, 67.04, "Sender."], [67.78, 68.92, "Attachment."], [69.92, 72.37, "Attachment means a file sent with an email."], [72.98, 74.31, "Open the attachment."], [74.92, 77.33, "Your turn. Say: Attachment."], [80.17, 81.24, "Attachment."], [81.98, 83.01, "Request."], [84.02, 86.12, "Request means asking for something."], [86.72, 88.55, "The email contains a request."], [89.15, 92.15, "Your turn. Say: Request."], [95.0, 96.12, "Request."], [96.88, 97.69, "Mention."], [98.68, 100.47, "Mention means to say briefly."], [101.08, 102.91, "The email mentions a delay."], [103.52, 105.74, "Your turn. Say: Mention."], [108.6, 109.47, "Mention."], [110.22, 111.15, "Not true."], [112.15, 115.83, "Not true means a NOT question: find the false option."], [116.42, 117.78, "Which is NOT true?"], [118.38, 120.87, "Your turn. Say: Not true."], [123.73, 125.16, "Not true."], [125.92, 126.88, "Infer."], [127.88, 131.25, "Infer means to understand something not directly stated."], [131.85, 133.78, "You can infer the plan changed."], [134.38, 136.39, "Your turn. Say: Infer."], [139.23, 140.33, "Infer."], [141.13, 144.66, "Part two: dialogue. Let's listen to a conversation."], [145.52, 147.82, "Visal, what is Part 7?"], [148.92, 163.18, "It has fifty-four questions based on texts such as emails, memos, notices, ads, forms and message chains. It is the longest part, so time management is important."], [164.28, 165.71, "How do I read an email?"], [166.82, 179.51, "Check the sender, recipient and subject line, then read the first and last sentences for the purpose and the request. Questions follow the order of the text in most cases."], [180.62, 182.19, "What are NOT questions?"], [183.28, 194.21, "They ask which statement is not true or ble."], [72.32, 74.56, "Eligible means allowed to take part."], [75.15, 76.94, "Only members are eligible."], [77.55, 80.16, "Your turn. Say: Eligible."], [83.0, 83.99, "Eligible."], [84.75, 85.83, "Expire."], [86.82, 88.36, "Expire means to end."], [88.95, 91.22, "The offer expires on June 30."], [91.82, 94.17, "Your turn. Say: Expire."], [97.03, 97.95, "Expire."], [98.72, 99.4, "Fee."], [100.42, 102.71, "Fee means money paid for a service."], [103.32, 105.05, "A small fee applies."], [105.65, 108.14, "Your turn. Say: Fee."], [111.0, 111.78, "Fee."], [112.52, 113.45, "Warranty."], [114.45, 116.87, "Warranty means a promise to repair a product."], [117.48, 119.38, "The warranty lasts two years."], [119.98, 122.65, "Your turn. Say: Warranty."], [125.5, 126.58, "Warranty."], [127.32, 128.19, "Scan."], [129.18, 131.62, "Scan means to look quickly for a detail."], [132.22, 133.59, "Scan for the date."], [134.18, 136.42, "Your turn. Say: Scan."], [139.27, 140.25, "Scan."], [141.03, 144.92, "Part two: dialogue. Let's listen to a conversation."], [145.75, 149.0, "Visal, how are these texts different from emails?"], [150.12, 159.43, "Notices, ads and forms are not read from start to finish. You scan them for specific details such as dates, prices, conditions and contact information."], [160.52, 161.87, "How do I scan well?"], [162.95, 173.87, "Read the question first, find keywords such as expires or fee, and look for them in the text. Read the sentence around the keyword to be sure of the condition."], [174.98, 177.16, "What conditions are commonly tested?"], [178.25, 189.18, "Look for words like only, unless, before and except. They limit who can take part or when an offer applies, so an answer that ignores them may be wrong."], [190.33, 191.83, "Part three: grammar."], [192.68, 197.26, "Grammar focus: Strategy: scan with keywords, then read the condition."], [197.56, 198.81, "Look at the pattern."], [199.52, 201.85, "The offer expires on June 30."], [202.75, 205.17, "Only members are eligible for the discount."], [206.13, 212.09, "Read the question first, scan for keywords, and always check the condition words like only, unless and before."], [212.85, 216.98, "Be careful! Don't say: I ignore words like only and unless."], [218.93, 221.62, "Say: I check the condition words."], [221.92, 223.17, "Conditions matter."], [223.97, 226.71, "Part four: reading. Read and listen."], [227.5, 229.12, "A Sale Advertisement."], [229.42, 232.55, "An advertisement offers twenty percent off laptops."], [233.57, 236.05, "The discount is only for members of the store club."], [237.07, 239.1, "The offer expires on June 30."], [240.1, 243.91, "A small delivery fee applies to orders under fifty dollars."], [244.9, 247.55, "Every laptop comes with a two-year warranty."], [248.63, 252.67, "Part five: quiz. Five questions. Are you ready?"], [253.52, 255.7, "Notices and ads are read by blank."], [256.0, 260.04, "A, translating. B, memorising. C, scanning."], [263.6, 265.3, "The answer is C: scanning."], [266.45, 267.97, "Who gets the discount?"], [268.27, 271.85, "A, club members. B, everyone. C, no one."], [275.4, 277.75, "The answer is A: club members."], [278.88, 280.57, "The warranty lasts blank."], [280.87, 284.52, "A, ten years. B, two years. C, one month."], [288.07, 290.44, "The answer is B: two years."], [291.58, 293.41, "When does the offer expire?"], [293.71, 297.59, "A, June 3. B, July 1. C, June 30."], [301.13, 303.1, "The answer is C: June 30."], [304.25, 306.3, "Condition words include blank."], [306.6, 311.43, "A, only and unless. B, apple and orange. C, red and blue."], [315.0, 318.07, "The answer is A: only and unless."], [319.27, 322.27, "Part six: speaking. It's your turn to talk."], [323.12, 325.77, "How do you find information in an advertisement?"], [334.55, 336.05, "Now listen to Visal."], [336.35, 349.63, "I read the question first and choose keywords. Then I scan the advertisement for them and read the sentence around each keyword. I pay special attention to words like only and unless because they set conditions."], [349.93, 351.6, "Excellent answer, Visal!"], [352.52, 358.55, "Great work! Now you can use eight new words and strategy: scan with keywords, then read the condition."], [358.85, 362.88, "Today's value is attention. Look carefully and listen well."], [363.18, 365.88, "See you in Unit eighteen. Goodbye!"], [366.18, 370.18, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XTC-Unit18-Part-7-Multiple-Passages": [[0.35, 5.09, "Hello, everyone! I'm Ms. Emma. Welcome to Online TOEIC preparation."], [5.39, 8.89, "Hi! I'm Visal. Let's learn together!"], [9.19, 16.97, "Unit eighteen: Part 7: Multiple Passages. Today you will connect information across two or three related texts."], [17.27, 20.0, "Here is our lesson map. Let's start!"], [20.97, 24.13, "Part one: words. You will learn eight new words."], [24.98, 26.02, "Passage."], [27.02, 29.03, "Passage means a section of text."], [29.62, 31.3, "Read both passages."], [31.92, 34.1, "Your turn. Say: Passage."], [36.97, 37.88, "Passage."], [38.62, 39.34, "Link."], [40.35, 41.97, "Link means to connect."], [42.55, 44.03, "Link the two texts."], [44.62, 47.08, "Your turn. Say: Link."], [49.93, 50.82, "Link."], [51.58, 52.86, "Cross-reference."], [53.85, 57.51, "Cross-reference means to compare information from different texts."], [58.12, 60.45, "Cross-reference the email and the form."], [61.05, 64.17, "Your turn. Say: Cross-reference."], [67.03, 68.78, "Cross-reference."], [69.52, 70.48, "Confirm."], [71.48, 74.03, "Confirm means to show that something is true."], [74.62, 76.69, "The second text confirms the date."], [77.28, 79.95, "Your turn. Say: Confirm."], [82.8, 83.86, "Confirm."], [84.62, 85.73, "Contradict."], [86.75, 88.94, "Contradict means to say the opposite."], [89.55, 91.97, "The reply contradicts the first email."], [92.58, 95.5, "Your turn. Say: Contradict."], [98.37, 99.31, "Contradict."], [100.05, 101.03, "Reply."], [102.02, 104.17,         // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        function renderContent() {
            let contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            stopVideo();                 // never leave a video playing in the background
            stopTalkTimer();             // ...or a Let's Talk timer running
            updateVideoTabBadge();
            // Always shows the real level and unit (it used to say "A1" on every level)
            document.getElementById('platform-info').textContent = `C2-EPE - ${gradeName(state.level)} (Unit ${state.unit}: ${unitData.title})`;
            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'learn') renderLearn(contentDiv, unitData);
            else if (state.tab === 'terms') renderTerms(contentDiv, unitData);
            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'think') renderThink(contentDiv, unitData);
            else if (state.tab === 'funfact') renderFunFact(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);
            else if (state.tab === 'spelling') renderSpelling(contentDiv, unitData);
            else if (state.tab === 'sentence') renderSentenceBuilding(contentDiv, unitData);
            else if (state.tab === 'summary') renderSummaryWriting(contentDiv, unitData);
            else if (state.tab === 'headline') renderHeadlineWriting(contentDiv, unitData);
            else if (state.tab === 'factopinion') renderFactOpinion(contentDiv, unitData);
            else if (state.tab === 'debate') renderDebateCorner(contentDiv, unitData);
            else if (state.tab === 'discussion') renderDiscussion(contentDiv, unitData);
            else if (state.tab === 'dictation') renderDictation(contentDiv, unitData);

        // ===== MY PROGRESS =====
        const ALL_TABS = ['video','learn','terms','quiz','think','funfact','vocabgame','spelling','sentence','summary','headline','factopinion','debate','discussion','dictation','review','pronunciation','exam','challenge'];

                return `${gradeName(lvl)}: ${done} / ${total} activities (${Math.round(done / total * 100)}%)${lvl === state.level ? ' ← current' : ''}`;

        // ===== 3. QUIZ (listen and choose) =====
        // Answers lock after the first tap, and stars are given only for beating your best score
        let quizState = { qIndex: 0, score: 0, order: [], currentAnswer: '', locked: false };
        function renderQuiz(contentDiv, unitData) {
            quizState = { qIndex: 0, score: 0, order: shuffle([...new Set(unitData.terms)]), currentAnswer: '', locked: false };

        function showQuizQuestion() {

            quizState.locked = false;
            if (quizState.qIndex >= quizState.order.length) {

                const bestKey = state.level + '|' + unitKey('quiz');
                const best = progress.best[bestKey] || 0;
                const earned = Math.max(0, quizState.score - best) * 2;
                if (quizState.score > best) progress.best[bestKey] = quizState.score;
                markActivityComplete('quiz');

        // ===== 5. DID YOU KNOW =====
        function renderFunFact(contentDiv, unitData) {

        function textCheck(msg, text, need, okText, key, amount) {
            const n = countWords(text);
            if (n < need) {
                msg.className = "text-sm mt-2 font-semibold text-red-500";
                msg.textContent = n === 0 ? "✏️ Write something first!" : `✏️ Write a little more — at least ${need} words (you have ${n}).`;

            msg.className = "text-sm mt-2 font-semibold text-green-600";
            msg.textContent = okText + starNote(award(key, amount), amount);
            return true;
        }
        function usedUnitWords(text, unitData) {
            const t = ' ' + String(text).toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
            return unitData.vocab.filter(w => {
                const base = w.toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').trim();
                if (!base) return false;
                // whole word, allowing simple endings: s, es, ed, ing
                const re = new RegExp('[ ]' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[ ]') + '(s|es|ed|d|ing)?[ ]');
                return re.test(t);
            });
        }
        function renderWriting(contentDiv, unitData) {

        // ===== 7. VOCABULARY GAME (picture -> word) =====

        // ===== 8. SPELLING PRACTICE (tap scrambled letters in order) =====
        let spellState = { word: '', picked: [], letters: [], wIndex: 0, words: [], done: false };
        function renderSpelling(contentDiv, unitData) {

        function pickLetter(i) {
