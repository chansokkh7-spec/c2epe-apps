<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2-EPE Digital Academy - Cambridge English</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        /* Flip-card for Key Terms: front = word, back = picture. */
        .flip-card { perspective: 1000px; height: 100px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s; transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 0.75rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.25rem;
        }
        .flip-card-back { transform: rotateY(180deg); }
        button:disabled { cursor: default; }
        /* phones: the lesson fills the screen, so jumping to it always shows it from the top,
           and the floating "Modules" button never covers the lesson's own buttons */
        @media (max-width: 767px) { #content-area { min-height: calc(100vh - 24px); padding-bottom: 76px; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-5xl bg-slate-800 text-white rounded-2xl p-6 shadow-lg mb-6 flex justify-between items-center flex-wrap gap-3">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">🎓 C2-EPE Cambridge English</h1>
            <p class="text-sm text-slate-300">Cambridge English - Online Class</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap justify-end">
            <div class="bg-amber-400 text-slate-900 px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                ⭐ <span id="star-count">0</span>
            </div>
            <div class="bg-pink-500 text-white px-3 py-2 rounded-xl text-sm font-bold shadow flex items-center gap-1">
                🏆 <span id="badge-count">0</span> Badges
            </div>
            <button onclick="showMyProgress()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-sm font-bold border border-white/20 cursor-pointer">📊 My Progress</button>
            <div class="bg-slate-700 px-3 py-2 rounded-xl text-sm font-bold border border-red-500">
                <span id="current-level-display">A1</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-4 gap-6">

        <aside id="module-sidebar" class="bg-white rounded-2xl p-4 shadow-md md:col-span-1 flex flex-col gap-3" style="scroll-margin-top:12px;">
            <div id="level-picker-wrap">
                <h2 class="font-bold text-gray-700 border-b pb-2">Grade</h2>
                <div class="flex flex-col gap-3 mt-3">
                    <button onclick="selectLevel('A1')" id="btn-A1" class="level-btn text-left p-3 rounded-xl bg-slate-700 text-white font-semibold transition shadow cursor-pointer">🌱 A1 Grammar</button>
                    <button onclick="selectLevel('A2')" id="btn-A2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📗 A2 Grammar</button>
                    <button onclick="selectLevel('B1')" id="btn-B1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📘 B1 Grammar</button>
                    <button onclick="selectLevel('B2')" id="btn-B2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">📙 B2 Grammar</button>
                    <button onclick="selectLevel('C1')" id="btn-C1" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">🎓 C1 Grammar</button>
                    <button onclick="selectLevel('C2')" id="btn-C2" class="level-btn text-left p-3 rounded-xl bg-gray-100 hover:bg-amber-100 font-semibold transition cursor-pointer">👑 C2 Grammar</button>
                </div>
            </div>
            <div id="locked-level-banner" class="hidden bg-slate-50 border border-red-200 rounded-xl p-3 text-center">
                <p class="text-xs text-red-600 font-semibold">TOPIC</p>
                <p id="locked-level-text" class="text-xl font-bold text-slate-900"></p>
            </div>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700" id="unit-select-label">Select Unit (1 to 25)</h2>
            <select id="unit-select" onchange="updateUnit()" class="p-2 rounded-xl border border-gray-300 bg-gray-50 font-semibold text-slate-900">
                <option value="1">Loading...</option>
            </select>

            <hr class="my-2">
            <h2 class="font-bold text-gray-700">Learning Modules</h2>
            <button onclick="switchTab('video')" data-tab="video" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📹 0. Video Lesson</button>
            <button onclick="switchTab('learn')" data-tab="learn" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📖 1. Learn</button>
            <button onclick="switchTab('terms')" data-tab="terms" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗂️ 2. Key Terms</button>
            <button onclick="switchTab('quiz')" data-tab="quiz" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🧩 3. Quiz</button>
            <button onclick="switchTab('think')" data-tab="think" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💭 4. Think About It</button>
            <button onclick="switchTab('funfact')" data-tab="funfact" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📌 5. Did You Know</button>
            <button onclick="switchTab('vocabgame')" data-tab="vocabgame" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🖼️ 6. Picture Match</button>
            <button onclick="switchTab('spelling')" data-tab="spelling" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✏️ 7. Spelling</button>

            <button onclick="switchTab('summary')" data-tab="summary" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📝 9. Summary Writing</button>
            <button onclick="switchTab('headline')" data-tab="headline" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📰 10. Headline Writing</button>
            <button onclick="switchTab('factopinion')" data-tab="factopinion" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🔍 11. Fact vs Opinion</button>
            <button onclick="switchTab('debate')" data-tab="debate" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🗣️ 12. Debate Corner</button>
            <button onclick="switchTab('discussion')" data-tab="discussion" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">💭 13. Discussion</button>
            <button onclick="switchTab('dictation')" data-tab="dictation" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">🎧 14. Dictation</button>

            <button onclick="switchTab('exam')" data-tab="exam" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">📝 17. Gap Fill & Word Check</button>
            <button onclick="switchTab('challenge')" data-tab="challenge" class="tab-btn text-left p-2 rounded-lg hover:bg-gray-100 font-medium text-sm cursor-pointer">✍️ 18. Practice Challenge</button>

        <section id="content-area" class="bg-white rounded-2xl p-6 shadow-md md:col-span-3 flex flex-col justify-between" style="scroll-margin-top:12px;">

            <div class="mt-8 pt-4 border-t flex justify-between items-center text-sm text-gray-500 gap-2 flex-wrap">

                <div class="flex gap-2">
                    <button onclick="completeActivity()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Finish Activity (+5 ⭐)</button>
                    <button onclick="nextLesson()" class="bg-slate-700 hover:bg-slate-800 text-white font-bold px-4 py-2 rounded-xl shadow cursor-pointer transition">Next Lesson ▶️</button>

        const curriculum = {"A1": {"1": {"title": "A2 Key: Exam Overview and Signs", "terms": ["Exam", "Sign", "Notice", "Allowed", "Forbidden", "Opening hours", "Reception", "Paper"], "passage": "Lina reads a sign at a hotel door. It says: Please leave your key at reception. One option says that guests must take their key home. Another option says guests must give the key to the desk. She chooses the second option.", "question": "Describe a sign you see every day and what it means.", "funfact": "Did you know? Think about where you would see each sign and what it asks you to do, then choose the option with the same meaning in different words."}, "2": {"title": "A2 Key: Reading Texts and Gap-fill", "terms": ["Match", "Gap", "Option", "Article", "Advert", "Prefer", "Cheap", "Delicious"], "passage": "Three friends look at holiday adverts. Sam wants a cheap holiday near the sea. Mia prefers a quiet town with delicious food. The first advert is expensive, so it is not for Sam. Sam chooses the one that matches all his needs.", "question": "How do you match people to texts?", "funfact": "Did you know? Underline what each person wants, check every detail in the texts and read the finished sentence to test each gap."}, "3": {"title": "A2 Key: Writing Messages and Picture Stories", "terms": ["Message", "Invite", "Suggest", "Because", "Then", "Finally", "Picture story", "Past simple"], "passage": "The three pictures show a boy called Ben. In the first picture Ben goes to the park. In the second picture he meets his friends. In the third picture they play football together. Ben writes a sentence for each picture.", "question": "How do you write a short email in the A2 Key exam?", "funfact": "Did you know? Read the instructions, cover every point and write simple, correct sentences. For stories, use the past simple and one sentence per picture."}, "4": {"title": "A2 Key: Listening", "terms": ["Listen", "Spelling", "Number", "Time", "Price", "Day", "Second time", "Guess"], "passage": "A girl calls a swimming club. She asks what time the lesson starts. The man says it starts at half past four on Thursday. He says a ticket costs fifteen pounds. She writes the time and the price on her form.", "question": "How do you prepare for the Listening paper?", "funfact": "Did you know? Read before you listen, predict the kind of answer, and use the second listening to check. Always write something."}, "5": {"title": "A2 Key: Speaking", "terms": ["Partner", "Examiner", "Introduce", "Favourite", "Routine", "Ask for repetition", "Prompt card", "Reason"], "passage": "Chhay practises with a friend. The friend asks what he does after school. Chhay answers that he plays football because it is exciting. Then he asks his friend the same question. He asks politely when he does not understand a word.", "question": "Tell me about yourself and what you do after school.", "funfact": "Did you know? Answer with full sentences and a reason. If you do not understand, ask politely. Listen to your partner and keep the conversation going."}, "6": {"title": "B1 Preliminary: Overview and Reading Parts", "terms": ["Preliminary", "Gist", "Advertisement", "Opinion", "Attitude", "Gap", "Multiple choice", "Cloze"], "passage": "Visal studies for B1 Preliminary. He first reads the instructions to see what each part asks. He skims the text for the general idea. Then he reads the questions and finds evidence in the text. He checks that his answer fits every detail.", "question": "How do you prepare for the Reading paper?", "funfact": "Did you know? Skim for the gist, read each question carefully and find evidence in the text. Do not choose an answer just because it looks familiar."}, "7": {"title": "B1 Preliminary: Gapped Text and Cloze", "terms": ["Gapped text", "Sentence", "Pronoun", "Linking word", "Open cloze", "Preposition", "Article", "Auxiliary verb"], "passage": "Dara looks at an open cloze about a school trip. The first gap comes after the word interested. She knows that the correct preposition is in. The second gap needs a helping verb after the word has. She reads each sentence again to check it.", "question": "How do you complete an open cloze?", "funfact": "Did you know? For gapped texts, find links between the sentences. For an open cloze, think of grammar words and read the sentence back to test your answer."}, "8": {"title": "B1 Preliminary: Writing Email and Story or Article", "terms": ["Email", "Greeting", "Article", "Story", "Paragraph", "Opinion", "Past continuous", "Word count"], "passage": "Sophea must write to a friend about a school trip. She begins with Hi Anna and thanks her for the invitation. She answers all three points about the date, the place and the cost. She uses because and so to link her ideas. At the end she checks her grammar and spelling.", "question": "How do you write a good email in B1 Preliminary?", "funfact": "Did you know? Read the task carefully and cover every point. Plan your paragraphs, use a variety of tenses and check the grammar and word count."}, "9": {"title": "B1 Preliminary: Listening", "terms": ["Gist", "Detail", "Opinion", "Agree", "Disagree", "Distractor", "Change of mind", "Final answer"], "passage": "Two friends plan a day out. One suggests Friday, but the other cannot come. Then they talk about Saturday and agree that it is better. They also discuss the cinema and the park. They finally decide to go to the park.", "question": "How do you avoid mistakes in Listening?", "funfact": "Did you know? Read before you listen, wait for the final answer and use the second listening to check."}, "10": {"title": "B1 Preliminary: Speaking", "terms": ["Describe", "Background", "Foreground", "Probably", "Looks like", "Agree", "Suggest", "Decision"], "passage": "Rattana describes a photo of a market. In the foreground there is a woman selling fruit. In the background there are colourful umbrellas. It looks like a busy morning and the people seem happy. She ends by saying she would like to visit it.", "question": "How do you describe a photo in Speaking?", "funfact": "Did you know? Use clear language to describe photos and discuss with your partner. Ask questions, agree politely and speak naturally."}, "11": {"title": "B2 First: Overview and Use of English Cloze", "terms": ["Collocation", "Phrasal verb", "Fixed phrase", "Meaning", "Grammar word", "Option", "Contrast", "Relative pronoun"], "passage": "Pich practises a multiple-choice cloze. The gap comes before the word decision. She knows that make is the correct collocation. In the open cloze the next gap needs the relative pronoun which. She reads each sentence again to check.", "question": "How do you approach the cloze tasks?", "funfact": "Did you know? Read the whole text first. For Part 1 test each option for meaning and collocation. For Part 2 decide which grammar word is missing."}, "12": {"title": "B2 First: Word Formation and Key Word Transformations", "terms": ["Word formation", "Prefix", "Suffix", "Negative", "Transformation", "Key word", "Similar meaning", "Word limit"], "passage": "Bora sees the word PREDICT at the end of a line. The gap needs an adjective that means 'cannot be known beforehand'. She adds the prefix un- and the suffix -able. In the transformation she must use the key word OFFERED. She writes a sentence that means the same.", "question": "How do you answer a key word transformation?", "funfact": "Did you know? In Part 3 decide the part of speech and check for negative or plural forms. In Part 4 keep the key word and use a structure that gives the same meaning."}, "13": {"title": "B2 First: Reading Parts 5 to 7", "terms": ["Inference", "Gapped text", "Multiple matching", "Reference", "Paraphrase", "Main point", "Attitude", "Eliminate"], "passage": "Nita reads an article about a young inventor. One missing sentence begins with This. She looks at the sentence before the gap. It describes a new machine, so This refers to the machine. She chooses the sentence that connects both sides.", "question": "How do you do a gapped-text task?", "funfact": "Did you know? Look for links between sentences, expect paraphrase between questions and text, and find evidence for every answer."}, "14": {"title": "B2 First: Writing Essays, Articles and Reports", "terms": ["Essay", "Article", "Review", "Report", "Register", "Linking device", "Introduction", "Conclusion"], "passage": "Sreyleak must write a report for her school director. She uses headings: Introduction, Facilities and Recommendation. She writes in a formal style without contractions. She uses linking words such as moreover and however. She checks the word count and her grammar.", "question": "How do you plan an essay for B2 First?", "funfact": "Did you know? Plan before writing, keep to the word limit and choose a style that suits the reader. Use varied vocabulary and accurate grammar."}, "15": {"title": "B2 First: Listening and Speaking", "terms": ["Opinion", "Attitude", "Purpose", "Extract", "Collaborate", "Justify", "Compare", "Interact"], "passage": "Kunthea listens to a short interview with an architect. The architect says frankly that the project is too expensive. She notices the worried tone of the voice. In Speaking she compares two photos and justifies her choice. She asks her partner for his opinion.", "question": "How do you prepare for Listening and Speaking in B2 First?", "funfact": "Did you know? Read the questions first, notice the speaker's attitude and tone, and in Speaking justify your ideas and respond to your partner."}, "16": {"title": "C1 Advanced: Overview and Use of English", "terms": ["Advanced", "Nuance", "Collocation", "Idiom", "Cohesion", "Sophisticated", "Precision", "Transformation"], "passage": "Mony studies for C1 Advanced. He notices that deeply collocates with concerned. He writes the phrase in his notebook with a note about its register. In a transformation he uses inversion with Not only. His accuracy improves each week.", "question": "How do you prepare for Use of English at C1?", "funfact": "Did you know? At C1 small differences in meaning and collocation decide the answer. Read widely and practise advanced structures such as inversion."}, "17": {"title": "C1 Advanced: Reading Cross-text and Gapped Tasks", "terms": ["Cross-text", "Stance", "Implication", "Counterargument", "Tone", "Ironic", "Rhetorical", "Cohesive device"], "passage": "Dalin reads four short texts about city bikes. Writer A strongly supports a new cycle scheme. Writer B criticises it as expensive and unnecessary. Writer C uses the word arguably and seems cautious. Dalin compares them to answer the question.", "question": "How do you approach cross-text tasks?", "funfact": "Did you know? Summarise each writer's view in a few words, compare them and look at the tone to understand stance and implication."}, "18": {"title": "C1 Advanced: Writing Essays, Proposals and Reports", "terms": ["Persuasive", "Proposal", "Recommend", "Evaluate", "Cohesion", "Nuanced", "Concede", "Formal tone"], "passage": "The council asks for a proposal to improve the town centre. Lakhena divides her proposal with headings. She evaluates two options and concedes that one is cheaper. She recommends the second option because it benefits more people. She uses a formal tone and checks cohesion.", "question": "How do you write a persuasive proposal?", "funfact": "Did you know? Plan a clear thesis, evaluate both sides with precise language and use a formal tone. In a proposal, finish with a persuasive recommendation."}, "19": {"title": "C1 Advanced: Listening", "terms": ["Implication", "Attitude", "Hesitate", "Stress", "Interviewer", "Monologue", "Paraphrase", "Gist"], "passage": "An interviewer asks an architect about her new building. She says, It was... interesting, with a pause. The listener understands that she may have had problems. She then explains that the budget was too small. The correct answer shows her real attitude.", "question": "How do you listen for attitude in a C1 recording?", "funfact": "Did you know? Listen for tone, stress and pauses. Wait until the speaker finishes the whole idea and choose the option that paraphrases it."}, "20": {"title": "C1 Advanced: Speaking and Exam Strategy", "terms": ["Fluency", "Evaluate", "Speculate", "Collaborate", "Hedge", "Interrupt", "Discourse marker", "Strategy"], "passage": "Vireak takes timed practice tests in the last week. In Speaking practice he speculates about a photo and evaluates ideas. He invites his partner to speak with a short question. He reviews feedback from his teacher every evening. On the day before the exam he rests and prepares his documents.", "question": "How do you prepare for the C1 Advanced exam?", "funfact": "Did you know? Speak naturally, speculate and evaluate with precise language, and collaborate with your partner. Plan every paper and practise under timed conditions."}}};
        Object.values(curriculum).forEach(g => Object.values(g).forEach(d => { d.vocab = d.terms; d.story = d.passage; }));

        // ===== Progress: stars/badges are earned once per activity and remembered =====
        // Saved in this browser when the page is opened as a normal web page. Inside the Hub's
        // secure "Embed Code" box the browser blocks storage, so progress then lasts until the
        // page is closed — but it still can't be farmed by tapping the same button again.
        const PROGRESS_PREFIX = 'c2epe_onlineclass_grammar_progress_';
        const PROGRESS_KEY = () => PROGRESS_PREFIX + state.level;
        let progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
        function loadProgress() {
            progress = { stars: 0, badges: 0, awarded: {}, best: {}, completed: {} };
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY()) || 'null');
                if (saved && typeof saved === 'object') progress = Object.assign(progress, saved);
            } catch (e) { /* storage not available (e.g. inside the Hub sandbox) */ }
            state.stars = progress.stars; state.badges = progress.badges;
            document.getElementById('star-count').textContent = state.stars;
            document.getElementById('badge-count').textContent = state.badges;
        }
        function saveProgress() {
            progress.stars = state.stars; progress.badges = state.badges;
            try { localStorage.setItem(PROGRESS_KEY(), JSON.stringify(progress)); } catch (e) {}
        }
        const unitKey = (what) => 'u' + state.unit + '|' + what;
        const wasAwarded = (key) => !!progress.awarded[state.level + '|' + key];
        // Gives stars only the first time an activity is done. Returns true if stars were given.
        function award(key, amount) {
            const k = state.level + '|' + key;
            if (progress.awarded[k]) return false;
            progress.awarded[k] = true;
            addStars(amount);
            return true;
        }
        // Shows "(+3 ⭐)" the first time, and a friendly note afterwards
        const starNote = (given, amount) => given ? ` (+${amount} ⭐)` : ' (stars already earned)';

        function isRecentlyAdded(dateStr) {
            if (!dateStr) return false;
            const added = new Date(dateStr);
            if (isNaN(added.getTime())) return false;
            const daysSince = (Date.now() - added.getTime()) / (1000 * 60 * 60 * 24);
            return daysSince >= 0 && daysSince <= 7;
        }

        function populateUnitSelect() {
            const sel = document.getElementById('unit-select');
            const levelData = curriculum[state.level];
            const prevUnit = state.unit;
            const unitCount = Object.keys(levelData).length;
            const labelEl = document.getElementById('unit-select-label');
            if (labelEl) labelEl.textContent = `Select Unit (1 to ${unitCount})`;
            // 🎬 = this unit has a video · 🆕 = video added in the last 7 days
            sel.innerHTML = Object.keys(levelData).map(u => {
                const v = videoFor(state.level, u);
                const mark = v ? (isRecentlyAdded(v.dateAdded) ? ' 🆕' : ' 🎬') : '';
                return `<option value="${u}">Unit ${u}: ${levelData[u].title}${mark}</option>`;
            }).join('');
            if (levelData[prevUnit]) {
                sel.value = prevUnit;
                state.unit = prevUnit;

        const isPhone = () => window.matchMedia('(max-width: 767px)').matches;
        function scrollToLesson(always) {
            const area = document.getElementById('content-area');
            if (!area) return;
            if (!(isPhone() || (always && area.getBoundingClientRect().top < 0))) return;
            // Wait for the new lesson to be drawn, then glide to it; some phones stop a smooth
            // scroll that starts during the tap, so if it hasn't arrived, jump there directly.
            setTimeout(() => {
                area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(() => { if (Math.abs(area.getBoundingClientRect().top) > 40) area.scrollIntoView({ block: 'start' }); }, 700);
            }, 60);
        }

        function completeActivity() {

            else if (gotStars) alert('🎉 Great work! You finished this activity and earned 5 Stars ⭐!');

        }

        function nextLesson() {
            const levelData = curriculum[state.level];
            const unitNumbers = Object.keys(levelData).map(Number).sort((a, b) => a - b);

        // Safe inside onclick="...('here')": escapes backslashes, single quotes and double quotes
        function escapeJsStr(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // Splits a story into sentences. (Written without "look-behind" regex, which older
        // iPhones — before iOS 16.4 — cannot read and which made the whole page stop there.)
        function splitSentences(text) {
            return (String(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(Boolean);
        }

        // ---------- Helper: Text-to-Speech (voices load a moment after the page opens) ----------
        let enVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            enVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('en')) || null;
        }
        if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(false); return false; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            if (!enVoice) pickVoice();
            if (enVoice) u.voice = enVoice;
            if (onEnd) u.onend = () => onEnd(true);
            window.speechSynthesis.speak(u);
            return true;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ---------- Pictures ----------
        // When two words in the SAME unit would show the same picture, the second one gets its
        // own picture here (only inside that unit), so children can tell them apart.
        const SAME_UNIT_ALT = {
            "Goodbye": "🚶👋", "Thank you": "💝", "Sorry": "😔", "Respect": "🫡", "Tomorrow": "⏭️",
            "West": "🌇", "East": "🌄", "North": "🧭", "Between": "🥪", "Early": "🐓", "Late": "⏰",
            "Swing": "🎠", "Poster": "🪧"
        };
        function baseEmoji(word) { return WORD_EMOJI[word] || '🖼️'; }
        function emojiFor(word, unitData) {
            const u = unitData || curriculum[state.level][state.unit];
            const e = baseEmoji(word);
            if (u && SAME_UNIT_ALT[word] && (u.vocab || u.terms).some(w => w !== word && baseEmoji(w) === e)) return SAME_UNIT_ALT[word];
            return e;
        }
        // Wrong answers for "look at the picture" questions never share the right answer's
        // picture, so there is always exactly one correct choice.
        function pictureDistractors(correct, pool, unitData, n) {
            const pic = emojiFor(correct, unitData);
            const ok = (w) => w !== correct && emojiFor(w, unitData) !== pic;
            let list = shuffle([...new Set(pool)].filter(ok)).slice(0, n);
            if (list.length < n) {
                const extra = shuffle(allVocabForLevel(state.level).filter(w => ok(w) && !list.includes(w)));
                list = list.concat(extra.slice(0, n - list.length));
            }
            return list;
        }

        function youtubeIdOf(link) {
            const s = String(link || '').trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function videoFor(level, unit) {
            const v = (VIDEO_LESSONS[level] || {})[unit];
            if (!v) return null;
            if (v.mp4 && /^https:\/\//.test(v.mp4)) return { mp4: v.mp4, id: v.mp4, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] };
            const id = youtubeIdOf(v.videoId);
            return id ? { id, dateAdded: v.dateAdded || '', checkpoints: Array.isArray(v.checkpoints) ? v.checkpoints : [] } : null;
        }
        // The Video button shows 🆕 when this unit's video is new, and "(soon)" when there is none yet
        function updateVideoTabBadge() {
            const btn = document.querySelector('.tab-btn[data-tab="video"]');
            if (!btn) return;
            const v = videoFor(state.level, state.unit);
            btn.textContent = (v && isRecentlyAdded(v.dateAdded) ? '🆕 ' : '') + '📹 0. Video Lesson' + (v ? '' : ' (soon)');
        }

        let ytPlayer = null;
        let ytPollInterval = null;
        let ytAnsweredCheckpoints = new Set();
        let ytApiLoadPromise = null;
        let ytFallbackTimer = null;
        let ytCurrentConfig = null;

        // Stops the video and its timers whenever the student leaves the Video tab or changes unit
        function stopVideo() {
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            if (ytFallbackTimer) { clearTimeout(ytFallbackTimer); ytFallbackTimer = null; }
            if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch (e) {} }
            ytPlayer = null;
        }

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (ytApiLoadPromise) return ytApiLoadPromise;
            ytApiLoadPromise = new Promise((resolve, reject) => {
                window.onYouTubeIframeAPIReady = resolve;
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => { ytApiLoadPromise = null; reject(new Error('YouTube could not load')); };
                document.head.appendChild(tag);
            });
            return ytApiLoadPromise;
        }

        function renderVideoLesson(contentDiv) {
            stopVideo();
            ytAnsweredCheckpoints = new Set();
            const unitData = curriculum[state.level][state.unit];
            ytCurrentConfig = videoFor(state.level, state.unit);

            if (!ytCurrentConfig) {
                contentDiv.innerHTML = `
                    <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                    <div class="bg-indigo-50 border-2 border-dashed border-indigo-200 rounded-2xl p-10 text-center">
                        <div class="text-5xl mb-4">🎬</div>
                        <p class="text-xl font-bold text-indigo-900 mb-2">Video Coming Soon!</p>
                        <p class="text-gray-600 mb-4">Your teacher is preparing this unit's video. For now, try the other learning modules!</p>
                        <button onclick="switchTab('listening')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2 rounded-full shadow cursor-pointer">🔊 Start with Listening</button>
                    </div>`;
                return;
            }

            if (ytCurrentConfig.mp4) { renderMp4Lesson(contentDiv, unitData); return; }
            const watchUrl = 'https://www.youtube.com/watch?v=' + ytCurrentConfig.id;
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch the video, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <div id="yt-player-el" class="w-full h-full"></div>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">Loading video player…</p>
                <p class="text-center mt-1"><a href="${watchUrl}" target="_blank" rel="noopener" class="text-sm text-indigo-600 underline">If the video does not play here, tap to open it in YouTube ↗</a></p>`;

            const showFallback = (why) => {
                const msg = document.getElementById('video-msg');
                if (msg) msg.innerHTML = `⚠️ ${why} <a href="${watchUrl}" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">Open the video in YouTube ↗</a>`;
            };
            ytFallbackTimer = setTimeout(() => { if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') showFallback('The video is taking long to load.'); }, 10000);

            const wanted = ytCurrentConfig.id;
            loadYouTubeApi().then(() => {
                if (!ytCurrentConfig || ytCurrentConfig.id !== wanted || !document.getElementById('yt-player-el')) return;
                ytPlayer = new YT.Player('yt-player-el', {
                    videoId: wanted,
                    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
                    events: {
                        onReady: () => { if (ytFallbackTimer) clearTimeout(ytFallbackTimer); const m = document.getElementById('video-msg'); if (m) m.textContent = '▶️ Press play to start the lesson!'; },
                        onStateChange: onYtStateChange,
                        onError: () => showFallback('This video cannot play inside the lesson.')
                    }
                });
            }).catch(() => showFallback('The video player could not load.'));
        }

h picture."], [189.77, 191.32, "Part three: grammar."], [192.18, 196.25, "Grammar focus: Strategy: cover every point, keep it simple."], [196.55, 197.74, "Look at the pattern."], [198.45, 201.28, "I can meet you on Saturday because I am free in the morning."], [202.18, 204.83, "First, Ben went to the park; then he met his friends."], [205.77, 214.5, "Read the instructions, cover every point and write simple, correct sentences. For stories, use the past simple and one sentence per picture."], [215.25, 218.76, "Be careful! Don't say: I forget one point in the email."], [220.7, 222.8, "Say: I answer every point."], [223.1, 224.38, "Cover every point."], [225.2, 227.97, "Part four: reading. Read and listen."], [228.77, 230.05, "A Picture Story."], [230.35, 232.71, "The three pictures show a boy called Ben."], [233.7, 236.14, "In the first picture Ben goes to the park."], [237.13, 239.61, "In the second picture he meets his friends."], [240.6, 243.32, "In the third picture they play football together."], [244.33, 246.65, "Ben writes a sentence for each picture."], [247.73, 251.69, "Part five: quiz. Five questions. Are you ready?"], [252.55, 255.33, "The email in Part 6 is about blank words."], [255.63, 260.04, "A, 25. B, 250. C, 2."], [263.6, 265.93, "The answer is A: 25."], [267.08, 269.11, "Which tense is best for the story?"], [269.41, 273.72, "A, imperative. B, past simple. C, future perfect."], [277.27, 279.52, "The answer is B: past simple."], [280.68, 282.09, "'Then' is a word for blank."], [282.39, 285.81, "A, place. B, colour. C, sequence."], [289.37, 291.17, "The answer is C: sequence."], [292.32, 294.4, "In the third picture the friends blank."], [294.7, 297.89, "A, play football. B, study. C, cook."], [301.43, 304.13, "The answer is A: play football."], [305.28, 307.49, "You must answer blank in the email."], [307.79, 311.72, "A, no points. B, every point. C, one point."], [315.27, 317.38, "The answer is B: every point."], [318.57, 321.72, "Part six: speaking. It's your turn to talk."], [322.58, 325.91, "How do you write a short email in the A2 Key exam?"], [334.72, 336.25, "Now listen to Visal."], [336.55, 348.23, "I read the instructions and underline the points that I must answer. I write one short sentence for each point with simple grammar. At the end I check spelling and capital letters."], [348.53, 350.11, "Excellent answer, Visal!"], [351.02, 356.77, "Great work! Now you can use eight new words and strategy: cover every point, keep it simple."], [357.07, 361.39, "Today's value is communication. Speak clearly and listen carefully."], [361.69, 364.18, "See you in Unit four. Goodbye!"], [364.48, 367.29, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XCB-Unit04-A2-Key-Listening": [[0.35, 5.19, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambridge exams."], [5.49, 8.99, "Hi! I'm Visal. Let's learn together!"], [9.29, 16.29, "Unit four: A2 Key: Listening. Today you will listen for names, numbers, times and short answers."], [16.59, 19.25, "Here is our lesson map. Let's start!"], [20.2, 23.36, "Part one: words. You will learn eight new words."], [24.22, 25.02, "Listen."], [26.02, 27.98, "Listen means to hear with attention."], [28.58, 29.91, "Listen carefully."], [30.52, 32.6, "Your turn. Say: Listen."], [35.47, 36.21, "Listen."], [36.95, 37.85, "Spelling."], [38.85, 40.81, "Spelling means the letters in a word."], [41.42, 42.65, "Check the spelling."], [43.25, 45.88, "Your turn. Say: Spelling."], [48.73, 49.75, "Spelling."], [50.48, 51.31, "Number."], [52.32, 55.23, "Number means a figure like 7 or 15."], [55.85, 56.91, "Write the number."], [57.52, 59.84, "Your turn. Say: Number."], [62.7, 63.67, "Number."], [64.42, 65.17, "Time."], [66.18, 67.94, "Time means hours and minutes."], [68.55, 69.7, "What time is the lesson?"], [70.32, 72.62, "Your turn. Say: Time."], [75.47, 76.19, "Time."], [76.95, 77.85, "Price."], [78.85, 80.86, "Price means the cost of something."], [81.45, 83.25, "The price is five pounds."], [8 ns and linking words."], [182.65, 183.7, "How do I check?"], [184.78, 195.37, "Read the sentence with your word in it. It must be grammatical and make sense. If you are not sure, think of the usual phrase, such as interested in or look forward to."], [196.53, 198.52, "Part three: grammar."], [199.38, 202.8, "Grammar focus: Strategy: read around the gap."], [203.1, 204.26, "Look at the pattern."], [204.95, 209.16, "The gap needs a preposition: interested in, not interested of."], [210.05, 213.5, "The pronoun 'it' shows that the sentence refers to something earlier."], [214.47, 222.33, "For gapped texts, find links between the sentences. For an open cloze, think of grammar words and read the sentence back to test your answer."], [223.08, 226.59, "Be careful! Don't say: I write interested of."], [228.53, 230.54, "Say: I write interested in."], [230.84, 232.48, "Learn fixed phrases."], [233.3, 235.85, "Part four: reading. Read and listen."], [236.63, 237.91, "Grammar Words."], [238.21, 240.85, "Dara looks at an open cloze about a school trip."], [241.87, 244.47, "The first gap comes after the word interested."], [245.47, 247.93, "She knows that the correct preposition is in."], [248.93, 251.96, "The second gap needs a helping verb after the word has."], [252.97, 255.3, "She reads each sentence again to check it."], [256.4, 260.4, "Part five: quiz. Five questions. Are you ready?"], [261.25, 263.95, "In an open cloze you write blank word per gap."], [264.25, 267.11, "A, no. B, one. C, five."], [270.67, 272.26, "The answer is B: one."], [273.42, 275.39, "Gaps are often blank words."], [275.69, 279.13, "A, very rare. B, long. C, grammar."], [282.67, 284.63, "The answer is C: grammar."], [285.78, 287.04, "Which is correct?"], [287.34, 292.27, "A, interested in. B, interested of. C, interested at."], [295.83, 297.8, "The answer is A: interested in."], [298.95, 300.76, "A pronoun can show blank."], [301.06, 305.51, "A, a price. B, a link to earlier text. C, a date."], [309.07, r the final answer."], [210.95, 212.2, "Listen to the end."], [213.0, 215.45, "Part four: reading. Read and listen."], [216.27, 217.52, "Changing Plans."], [217.82, 219.5, "Two friends plan a day out."], [220.5, 223.45, "One suggests Friday, but the other cannot come."], [224.47, 227.41, "Then they talk about Saturday and agree that it is better."], [228.4, 230.84, "They also discuss the cinema and the park."], [231.83, 233.87, "They finally decide to go to the park."], [234.97, 239.18, "Part five: quiz. Five questions. Are you ready?"], [240.02, 241.74, "You hear each recording blank."], [242.04, 245.39, "A, twice. B, once. C, never."], [248.93, 250.74, "The answer is A: twice."], [251.88, 253.78, "Speakers sometimes blank."], [254.08, 259.14, "A, only whisper. B, change their mind. C, never speak."], [262.7, 265.23, "The answer is B: change their mind."], [266.38, 268.21, "The friends finally choose blank."], [268.51, 274.22, "A, Friday and the cinema. B, Sunday and home. C, Saturday and the park."], [277.77, 280.24, "The answer is C: Saturday and the park."], [281.38, 282.95, "A distractor is blank."], [283.25, 287.89, "A, a wrong option that is mentioned. B, the answer. C, a title."], [291.43, 294.77, "The answer is A: a wrong option that is mentioned."], [295.92, 297.61, "Before listening, you should blank."], [297.91, 302.21, "A, sleep. B, read the questions. C, close the paper."], [305.77, 308.24, "The answer is B: read the questions."], [309.43, 312.74, "Part six: speaking. It's your turn to talk."], [313.58, 315.64, "How do you avoid mistakes in Listening?"], [324.45, 325.97, "Now listen to Visal."], [326.27, 340.85, "I read the questions before I listen and underline key words. I wait until the speaker gives the final answer because people often change their mind. On the second listening I check my answers."], [341.15, 342.85, "Excellent answer, Visal!"], [343.75, 349.35, "Great work! Now you can use eight new words and strategy: wait for the final answer. 52, 143.59, "Your turn. Say: Relative pronoun."], [146.43, 147.92, "Relative pronoun."], [148.73, 152.53, "Part two: dialogue. Let's listen to a conversation."], [153.38, 155.45, "Visal, what is B2 First?"], [156.55, 170.66, "B2 First is a Cambridge exam at upper-intermediate level. Reading and Use of English is one paper with seven parts, and then there are Writing, Listening and Speaking papers."], [171.75, 173.84, "What happens in the first two parts?"], [174.95, 187.35, "Part 1 is a multiple-choice cloze: you choose the best word for each gap from four options. Part 2 is an open cloze where you write one word in each gap."], [188.45, 190.46, "How can I improve my accuracy?"], [191.55, 206.57, "For Part 1 learn collocations, phrasal verbs and fixed phrases. For Part 2 learn grammar words such as articles, prepositions, auxiliary verbs, relative pronouns and linking words."], [207.73, 209.23, "Part three: grammar."], [210.08, 214.08, "Grammar focus: Strategy: meaning and grammar together."], [214.38, 215.59, "Look at the pattern."], [216.28, 218.78, "She made a decision, not did a decision."], [219.68, 222.69, "The book, which I bought yesterday, is excellent."], [223.63, 231.62, "Read the whole text first. For Part 1 test each option for meaning and collocation. For Part 2 decide which grammar word is missing."], [232.38, 236.82, "Be careful! Don't say: I choose a word without checking the collocation."], [238.77, 240.78, "Say: I check the collocation."], [241.08, 242.53, "Check collocations."], [243.33, 245.75, "Part four: reading. Read and listen."], [246.57, 247.86, "Cloze Practice."], [248.16, 250.84, "Pich practises a multiple-choice cloze."], [251.83, 254.01, "The gap comes before the word decision."], [255.0, 257.53, "She knows that make is the correct collocation."], [258.53, 262.25, "In the open cloze the next gap needs the relative pronoun which."], [263.27, 265.51, "She reads each sentence again to check."], [266.6, 270.52, "Part five: quiz. Five questions. Are you ready?"], [271.38, 273.96, "How many parts in Reading and Use of English?"], [274.26, 277.38, "A, two. B, twelve. C, seven."], [280.93, 283.0, "The answer is C: seven."], [284.15, 285.96, "Part 2 is an blank cloze."], [286.26, 289.64, "A, open. B, closed. C, multiple."], [293.2, 295.19, "The answer is A: open."], [296.35, 298.31, "Which collocation is correct?"], [298.62, 304.23, "A, take a decision always. B, make a decision. C, do a decision."], [307.77, 310.58, "The answer is B: make a decision."], [311.72, 313.86, "Which pronoun refers to a thing?"], [314.16, 317.1, "A, who. B, whom. C, which."], [320.67, 322.67, "The answer is C: which."], [323.82, 325.64, "After choosing, you should blank."], [325.94, 329.71, "A, read the sentence again. B, stop. C, skip."], [333.27, 335.81, "The answer is A: read the sentence again."], [337.0, 340.14, "Part six: speaking. It's your turn to talk."], [340.98, 343.23, "How do you approach the cloze tasks?"], [352.02, 353.63, "Now listen to Visal."], [353.93, 367.14, "I read the whole text for the general meaning. In Part 1 I test each option with its collocation or phrasal verb. In Part 2 I decide which grammar word is missing and read the sentence again to check."], [367.44, 369.12, "Excellent answer, Visal!"], [370.02, 375.14, "Great work! Now you can use eight new words and strategy: meaning and grammar together."], [375.44, 380.26, "Today's value is precision of language. Choose your words carefully so others understand you."], [380.56, 383.16, "See you in Unit twelve. Goodbye!"], [383.46, 385.98, "Thank you, Ms. Emma! Bye, everyone!"]], "OC-XCB-Unit12-B2-First-Word-Formation-and-Key-Word-Transformations": [[0.35, 4.9, "Hello, everyone! I'm Ms. Emma. Welcome to Online Cambridge exams."], [5.2, 8.79, "Hi! I'm Visal. Let's learn together!"], [9.09, 18.94, "Unit twelve: B2 First: Word Formation and Key Word Transformations. Today you will change word forms and rewrite sentences with a given word."], [19.24, 21.99, mation work?"], [154.12, 165.81, "You see a word in capitals at the end of a line and change it to fit the gap. Decide the part of speech, then add a suffix or prefix, and check whether it must be negative or plural."], [166.92, 169.31, "What about key word transformations?"], [170.42, 178.7, "You rewrite a sentence so it means the same, using a given key word and two to five words. You must not change the key word."], [179.78, 181.55, "What are common structures?"], [182.65, 198.22, "They test passive, conditionals, reported speech, comparison, modals and phrasal verbs. For example, I haven't seen her since 2020 becomes the last time I saw her was in 2020."], [199.37, 200.81, "Part three: grammar."], [201.65, 206.19, "Grammar focus: Strategy: part of speech, then structure."], [206.49, 207.74, "Look at the pattern."], [208.45, 210.52, "The weather was unpredictable (PREDICT)."], [211.42, 214.31, "'I'll help you,' he said. He offered to help me."], [215.27, 223.72, "In Part 3 decide the part of speech and check for negative or plural forms. In Part 4 keep the key word and use a structure that gives the same meaning."], [224.48, 227.96, "Be careful! Don't say: I change the key word."], [229.9, 231.85, "Say: I keep the key word."], [232.15, 234.01, "Never change the key word."], [234.8, 237.58, "Part four: reading. Read and listen."], [238.37, 239.84, "Changing Words."], [240.14, 242.7, "Bora sees the word PREDICT at the end of a line."], [243.7, 247.49, "The gap needs an adjective that means 'cannot be known beforehand'."], [248.5, 251.16, "She adds the prefix un- and the suffix -able."], [252.17, 255.29, "In the transformation she must use the key word OFFERED."], [256.3, 258.5, "She writes a sentence that means the same."], [259.6, 263.74, "Part five: quiz. Five questions. Are you ready?"], [264.58, 266.79, "In word formation you change the blank."], [267.09, 271.26, "A, form of the word. B, topic. C, spelling of names only."], [274.8, 276.76, "The answer is A: for reover and however."], [184.95, 186.31, "What about style?"], [187.42, 200.58, "Match your register to the reader. An essay and a report are formal, an article can be lively and a letter to a friend is informal. Always write between one hundred and forty and one hundred and ninety words."], [201.73, 203.41, "Part three: grammar."], [204.25, 208.31, "Grammar focus: Strategy: plan, match the register, check."], [208.6, 209.92, "Look at the pattern."], [210.62, 214.18, "Moreover, public transport reduces pollution in cities."], [215.08, 218.58, "This report aims to describe the facilities of the sports centre."], [219.53, 226.61, "Plan before writing, keep to the word limit and choose a style that suits the reader. Use varied vocabulary and accurate grammar."], [227.35, 230.85, "Be careful! Don't say: I use slang in a report."], [232.8, 235.39, "Say: I use a formal register."], [235.69, 237.34, "Match the register."], [238.13, 240.81, "Part four: reading. Read and listen."], [241.6, 243.01, "Writing a Report."], [243.31, 246.29, "Sreyleak must write a report for her school director."], [247.3, 251.27, "She uses headings: Introduction, Facilities and Recommendation."], [252.27, 255.17, "She writes in a formal style without contractions."], [256.17, 259.3, "She uses linking words such as moreover and however."], [260.3, 262.44, "She checks the word count and her grammar."], [263.53, 267.49, "Part five: quiz. Five questions. Are you ready?"], [268.35, 270.08, "The essay in Part 1 is blank."], [270.38, 275.35, "A, optional. B, only for Speaking. C, compulsory."], [278.9, 280.92, "The answer is C: compulsory."], [282.08, 284.07, "A report usually has blank."], [284.37, 288.31, "A, headings. B, emojis. C, no structure."], [291.87, 293.82, "The answer is A: headings."], [294.98, 297.04, "The register of a report is blank."], [297.34, 301.12, "A, slang. B, formal. C, very informal."], [304.67, 306.51, "The answer is B: formal."], [307.65, 308.99, "Moreover is a blank."], [309. he council asks for a proposal to improve the town centre."], [247.87, 250.42, "Lakhena divides her proposal with headings."], [251.43, 254.79, "She evaluates two options and concedes that one is cheaper."], [255.8, 259.46, "She recommends the second option because it benefits more people."], [260.47, 263.08, "She uses a formal tone and checks cohesion."], [264.17, 267.87, "Part five: quiz. Five questions. Are you ready?"], [268.72, 270.48, "The C1 essay is blank."], [270.78, 274.66, "A, compulsory. B, optional. C, oral."], [278.2, 280.64, "The answer is A: compulsory."], [281.78, 283.5, "A proposal uses blank."], [283.8, 288.7, "A, no structure. B, headings and recommendations. C, emojis."], [292.23, 295.25, "The answer is B: headings and recommendations."], [296.42, 298.07, "To concede means to blank."], [298.37, 302.82, "A, refuse. B, stop writing. C, accept part of the other view."], [306.37, 309.94, "The answer is C: accept part of the other view."], [311.08, 312.85, "What does Lakhena recommend?"], [313.15, 317.72, "A, the second option. B, doing nothing. C, the cheaper only."], [321.27, 323.72, "The answer is A: the second option."], [324.88, 326.48, "The tone should be blank."], [326.78, 329.91, "A, angry. B, formal. C, slangy."], [333.47, 335.25, "The answer is B: formal."], [336.43, 339.84, "Part six: speaking. It's your turn to talk."], [340.68, 342.88, "How do you write a persuasive proposal?"], [351.68, 353.23, "Now listen to Visal."], [353.53, 369.56, "I plan the headings and decide my recommendation first. I describe the situation, evaluate the options and concede a point from the other side to show balance. I finish with a clear recommendation, using a formal tone."], [369.86, 371.67, "Excellent answer, Visal!"], [372.58, 379.07, "Great work! Now you can use eight new words and strategy: thesis, evaluation, recommendation."], [379.37, 384.37, "Today's value is practical wisdom. Judge ideas by how well they work in real life."], [384.67, 387.32, "See Part two: dialogue. Let's listen to a conversation."], [150.02, 152.19, "Visal, what is in C1 Speaking?"], [153.28, 165.83, "There are four parts: an interview, a long turn comparing photos, a collaborative task and a discussion. You speak for about fifteen minutes with a partner and two examiners."], [166.92, 168.73, "How can I speak at C1?"], [169.82, 183.2, "Speculate and evaluate with phrases such as it might be that or the most convincing reason is. Use discourse markers and hedging, and invite your partner to speak."], [184.28, 186.35, "What is the best exam strategy?"], [187.45, 200.91, "Plan your time on every paper, check instructions and always finish. In the final week take full timed practice tests, review feedback and rest well before the exam."], [202.07, 203.5, "Part three: grammar."], [204.35, 207.09, "Grammar focus: Strategy: speculate, evaluate, collaborate."], [207.39, 208.53, "Look at the pattern."], [209.22, 212.03, "It might be that the people are preparing for a festival."], [212.92, 215.96, "What do you think? I'd be interested to hear your view."], [216.9, 225.57, "Speak naturally, speculate and evaluate with precise language, and collaborate with your partner. Plan every paper and practise under timed conditions."], [226.32, 230.15, "Be careful! Don't say: I interrupt my partner."], [232.1, 234.92, "Say: I invite my partner to speak."], [235.22, 236.24, "Collaborate."], [237.03, 239.82, "Part four: reading. Read and listen."], [240.63, 241.73, "Exam Week."], [242.03, 245.11, "Vireak takes timed practice tests in the last week."], [246.1, 250.51, "In Speaking practice he speculates about a photo and evaluates ideas."], [251.5, 254.44, "He invites his partner to speak with a short question."], [255.43, 258.25, "He reviews feedback from his teacher every evening."], [259.23, 262.97, "On the day before the exam he rests and prepares his documents."], [264.07, 268.43, "Part five: quiz. Five questions. Are you ready?"], [269.28, 272.15, "C1 Speaking lasts about blank minutes."], [272.45, 276.03, "A, two. B, sixty. C, fifteen."], [279.57, 281.92, "The answer is C: fifteen."], [283.05, 284.61, "To speculate is to blank."], [284.91, 289.22, "A, guess about possibilities. B, finish. C, copy."], [292.77, 295.87, "The answer is A: guess about possibilities."], [297.02, 298.6, "You should blank your partner."], [298.9, 302.18, "A, ignore. B, invite. C, interrupt."], [305.73, 307.59, "The answer is B: invite."], [308.75, 310.46, "Before the exam you should blank."], [310.76, 315.16, "A, study all night. B, skip sleep. C, rest."], [318.7, 320.41, "The answer is C: rest."], [321.55, 323.71, "Vireak uses feedback to blank."], [324.01, 327.98, "A, improve. B, ignore. C, hide mistakes."], [331.53, 333.61, "The answer is A: improve."], [334.8, 337.79, "Part six: speaking. It's your turn to talk."], [338.65, 341.31, "How do you prepare for the C1 Advanced exam?"], [350.12, 351.58, "Now listen to Visal."], [351.88, 367.9, "I take full timed practice tests and review each mistake. In Speaking I practise speculating and evaluating ideas with a partner. In the last week I rest well and check that I know the plan for each paper."], [368.2, 369.74, "Excellent answer, Visal!"], [370.65, 376.62, "Great work! Now you can use eight new words and strategy: speculate, evaluate, collaborate."], [376.92, 382.18, "Today's value is self-discipline. Control your habits, so your habits do not control you."], [382.48, 388.85, "Congratulations! You have finished Online Cambridge exams. See you in Online Grade nine English!"], [389.15, 391.79, "Thank you, Ms. Emma! Bye, everyone!"]]};
        // English subtitles: added to the player with code, so no subtitle files are needed online.
        let subsOn = true;
        function addSubtitles(el) {
            const cues = SUBTITLES[(el.getAttribute('src') || '').split('/').pop().split('?')[0].replace('.mp4', '')]; const btn = document.getElementById('subs-btn');
            if (!cues || !el.addTextTrack || typeof VTTCue === 'undefined') { if (btn) btn.style.display = 'none'; return; }
            const tr = el.addTextTrack('subtitles', 'English', 'en');
            cues.forEach(c => { try { const q = new VTTCue(c[0], c[1], c[2]); q.line = -2; tr.addCue(q); } catch (e) {} });
            const apply = () => { tr.mode = subsOn ? 'showing' : 'hidden'; if (btn) btn.textContent = subsOn ? '💬 Subtitles: ON' : '💬 Subtitles: OFF'; };
            if (btn) btn.onclick = () => { subsOn = !subsOn; apply(); };
            apply();
        }
        function renderMp4Lesson(contentDiv, unitData) {
            contentDiv.innerHTML = `
                <h2 class="text-xl font-bold text-indigo-900 mb-2">📹 Video Lesson — Unit ${state.unit}: ${unitData.title}</h2>
                <p class="text-gray-600 mb-4">${ytCurrentConfig.checkpoints.length ? 'Watch the video. It will pause at a few points so you can answer a quick question!' : 'Watch Ms. Emma and Visal, then try the other learning modules!'}</p>
                <div class="relative bg-black rounded-2xl overflow-hidden" style="aspect-ratio:16/9;">
                    <video id="mp4-player" src="${ytCurrentConfig.mp4}" controls playsinline preload="metadata" class="w-full h-full" style="object-fit:contain;"></video>
                    <div id="checkpoint-overlay" class="absolute inset-0 bg-indigo-900/95 flex items-center justify-center p-6" style="display:none;"></div>
                </div>
                <p id="video-msg" class="text-sm text-gray-500 mt-3 text-center min-h-[1.25rem]">▶️ Press play to start the lesson!</p>
                <div class="text-center mt-2 flex justify-center gap-3 flex-wrap"><button id="subs-btn" class="bg-white border border-indigo-300 text-indigo-700 font-bold px-4 py-2 rounded-full shadow cursor-pointer">💬 Subtitles: ON</button><button onclick="nextLesson()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-full shadow cursor-pointer">Next Lesson ▶️</button></div>`;
            const el = document.getElementById('mp4-player');
            addSubtitles(el);
            { const a = document.getElementById('footer-next-module'), b = document.getElementById('footer-next-lesson'); if (a) a.style.display = ''; if (b) b.style.display = 'none'; }
            ytPlayer = {
                getCurrentTime: () => el.currentTime,
                pauseVideo: () => el.pause(),
                playVideo: () => { const p = el.play(); if (p && p.catch) p.catch(() => {}); },
                destroy: () => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
            };
            el.addEventListener('play', () => { const m = document.getElementById('video-msg'); if (m) m.textContent = ''; });
            el.addEventListener('timeupdate', () => { if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) checkVideoCheckpoints(); });
            el.addEventListener('ended', () => {
                const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                const m = document.getElementById('video-msg');
                if (m) m.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
            });
            el.addEventListener('error', () => {
                const m = document.getElementById('video-msg');
                if (m) m.innerHTML = '⚠️ The video could not load. Check the internet, or <a href="' + ytCurrentConfig.mp4 + '" target="_blank" rel="noopener" class="text-indigo-600 underline font-semibold">open it here ↗</a>';
            });
        }

        function onYtStateChange(event) {
            const msg = document.getElementById('video-msg');
            if (event.data === YT.PlayerState.PLAYING) {
                if (ytPollInterval) clearInterval(ytPollInterval);
                if (ytCurrentConfig && ytCurrentConfig.checkpoints.length) ytPollInterval = setInterval(checkVideoCheckpoints, 400);
                if (msg) msg.textContent = '';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
                if (event.data === YT.PlayerState.ENDED) {
                    const got = award(unitKey('video-' + ytCurrentConfig.id), 5);
                    markActivityComplete('video');
                    if (msg) msg.textContent = '🎉 Great job watching the whole video!' + (got ? ' (+5 ⭐)' : '');
                }
            }
        }

        function checkVideoCheckpoints() {
            if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function' || !ytCurrentConfig) return;
            let t = 0;
            try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
            ytCurrentConfig.checkpoints.forEach((cp, idx) => {
                if (!ytAnsweredCheckpoints.has(idx) && t >= cp.time) {
                    ytAnsweredCheckpoints.add(idx);
                    showVideoCheckpoint(idx);
                }
            });
        }

        function showVideoCheckpoint(idx) {
            const cp = ytCurrentConfig.checkpoints[idx];
            ytPlayer.pauseVideo();
            if (ytPollInterval) { clearInterval(ytPollInterval); ytPollInterval = null; }
            const overlay = document.getElementById('checkpoint-overlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-md w-full text-center">
                    <p class="text-sm font-bold text-indigo-600 mb-2">🤔 Quick Question!</p>
                    <p class="font-bold text-lg text-gray-800 mb-4">${cp.question}</p>
                    <div class="flex flex-col gap-2" id="checkpoint-options">
                        ${cp.options.map((opt, i) => `<button onclick="answerVideoCheckpoint(${idx}, ${i})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold p-3 rounded-xl cursor-pointer">${opt}</button>`).join('')}
                    </div>
                    <p id="checkpoint-feedback" class="mt-3 font-bold min-h-[1.5rem]"></p>
                </div>`;
        }

        function answerVideoCheckpoint(idx, chosenIndex) {
            const cp = ytCurrentConfig.checkpoints[idx];
            const feedback = document.getElementById('checkpoint-feedback');
            const optionsDiv = document.getElementById('checkpoint-options');
            optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
            if (chosenIndex === cp.correct) {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-green-600';
                feedback.textContent = award(unitKey('video-' + ytCurrentConfig.id + '-q' + idx), 2) ? '🎉 Correct! (+2 ⭐)' : '🎉 Correct!';
            } else {
                feedback.className = 'mt-3 font-bold min-h-[1.5rem] text-red-500';
                feedback.textContent = `❌ Not quite — the answer was "${cp.options[cp.correct]}"`;
            }
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next ▶️';
            nextBtn.className = 'mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-full shadow cursor-pointer';
            nextBtn.onclick = resumeVideoAfterCheckpoint;
            feedback.insertAdjacentElement('afterend', nextBtn);
        }

        function resumeVideoAfterCheckpoint() {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            if (ytPlayer) ytPlayer.playVideo();
        }

        function renderContent() {
            let contentDiv = document.getElementById('module-content');
            const unitData = curriculum[state.level][state.unit];
            stopVideo();                 // never leave a video playing in the background
            stopTalkTimer();             // ...or a Let's Talk timer running
            updateVideoTabBadge();
            // Always shows the real level and unit (it used to say "A1" on every level)
            document.getElementById('platform-info').textContent = `C2-EPE - ${gradeName(state.level)} (Unit ${state.unit}: ${unitData.title})`;
            if (state.tab === 'video') { renderVideoLesson(contentDiv); return; }

            if (state.tab === 'learn') renderLearn(contentDiv, unitData);
            else if (state.tab === 'terms') renderTerms(contentDiv, unitData);
            else if (state.tab === 'quiz') renderQuiz(contentDiv, unitData);
            else if (state.tab === 'think') renderThink(contentDiv, unitData);
            else if (state.tab === 'funfact') renderFunFact(contentDiv, unitData);
            else if (state.tab === 'vocabgame') renderVocabGame(contentDiv, unitData);
            else if (state.tab === 'spelling') renderSpelling(contentDiv, unitData);
            else if (state.tab === 'sentence') renderSentenceBuilding(contentDiv, unitData);
            else if (state.tab === 'summary') renderSummaryWriting(contentDiv, unitData);
            else if (state.tab === 'headline') renderHeadlineWriting(contentDiv, unitData);
            else if (state.tab === 'factopinion') renderFactOpinion(contentDiv, unitData);
            else if (state.tab === 'debate') renderDebateCorner(contentDiv, unitData);
            else if (state.tab === 'discussion') renderDiscussion(contentDiv, unitData);

                const base = w.toLowerCase().replace(/[^a-z0-9'’\- ]+/g, ' ').trim();

                const re = new RegExp('[ ]' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[ ]') + '(s|es|ed|d|ing)?[ ]');
